<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evidence Explorer</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Ubuntu, Optima, Segoe, "Segoe UI", Candara, Calibri, Arial, sans-serif;
            margin: 8px 28px 28px;
            color: #202124;
        }

        a { color: inherit; text-decoration: none; }

        /* ---- Hero (mirrors competition/index.html) ---- */
        .hero { margin-bottom: 10px; padding: 20px 0 6px; }

        .hero-layout {
            display: grid;
            grid-template-columns: 110px minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }

        .hero-logo {
            width: 116px;
            height: 116px;
            object-fit: contain;
            border-radius: 20px;
            background: white;
            border: 1px solid #d8e0ea;
            padding: 12px;
            box-shadow: rgba(15, 23, 42, 0.06) 0 10px 24px;
        }

        .eyebrow {
            display: inline-block;
            padding: 4px 4px;
            margin-bottom: 12px;
            border-radius: 999px;
            font-size: 10px;
            color: grey;
            border: 1px solid lightgrey;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .hero-title { font-size: 58px; line-height: 0.94; margin: 4px 0 8px; }

        .hero-subtitle {
            color: #667085;
            font-size: 15px;
            line-height: 1.45;
            max-width: 980px;
            margin-bottom: 16px;
        }

        /* ---- Controls ---- */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin: 14px 0 12px;
        }

        .search-box {
            flex: 1 1 320px;
            min-width: 220px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border: 1px solid #d1d5db;
            border-radius: 999px;
            background-color: #ffffff;
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            font-family: inherit;
            color: #202124;
            background: transparent;
        }

        .search-icon { color: #6b7280; font-size: 15px; }

        .result-count {
            color: #6b7280;
            font-size: 13px;
            white-space: nowrap;
        }

        /* ---- Type tabs (from _imports/tabs/style.html) ---- */
        .tab {
            overflow: hidden;
            border: 1px solid #ccc;
            border-radius: 8px 8px 0 0;
            background-color: #f1f1f1;
        }

        .tab button {
            background-color: inherit;
            float: left;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 14px 16px;
            transition: 0.3s;
            font-size: 14px;
            font-family: inherit;
        }

        .tab button:hover { background-color: #ddd; }
        .tab button.active { background-color: #ccc; }
        .tab button.hidden { display: none; }

        .tab-count {
            color: #6b7280;
            font-weight: normal;
        }

        .tab button.active .tab-count { color: #1d4ed8; }

        .tabcontent {
            padding: 12px;
            border: 1px solid #ccc;
            border-top: none;
            border-radius: 0 0 8px 8px;
        }

        /* ---- No-tabs mode: stacked sections, no tab-attached border ---- */
        body.no-tabs .tabcontent {
            padding: 0;
            border: none;
            border-radius: 0;
        }

        .type-section { margin-top: 22px; }
        .type-section:first-child { margin-top: 0; }

        .type-section-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #e5e7eb;
        }

        /* ---- Evidence groups & cards (from _imports/evidence/style.html) ---- */
        .evidence-group {
            margin-top: 18px;
            padding: 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background-color: #f8fafc;
        }

        .evidence-group:first-child { margin-top: 0; }

        .evidence-group-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .evidence-group-description {
            color: #6b7280;
            margin-bottom: 14px;
        }

        .evidence-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }

        .evidence-summary-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid #d1d5db;
            background-color: #ffffff;
            font-size: 13px;
            color: #111827;
        }

        .evidence-summary-value {
            font-weight: bold;
            color: #1d4ed8;
        }

        .evidence-card {
            padding: 14px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background-color: white;
            display: inline-block;
            width: 260px;
            vertical-align: top;
            margin: 5px;
            box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;
        }

        .evidence-card-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 6px;
            overflow-wrap: anywhere;
        }

        .evidence-card-header {
            background-color: #f0f0f0;
            padding: 12px;
            margin-top: -14px;
            margin-left: -14px;
            margin-right: -14px;
            margin-bottom: 8px;
        }

        .evidence-card-header-top {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .evidence-card-icon {
            width: 48px;
            height: 48px;
            object-fit: contain;
            flex: 0 0 auto;
        }

        .evidence-card-meta {
            margin-bottom: 8px;
            color: #6b7280;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .evidence-card-summary {
            line-height: 1.5;
            margin-bottom: 6px;
            font-size: 90%;
            color: grey;
        }

        .evidence-links { margin-top: 8px; }

        .evidence-link {
            color: #1d4ed8;
            font-weight: bold;
        }

        .evidence-id {
            font-family: monospace;
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 8px;
            overflow-wrap: anywhere;
        }

        .tag {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 999px;
            border: 1px solid #e2e8f0;
            background-color: #f1f5f9;
            color: #475569;
            font-size: 11px;
            margin-right: 4px;
        }

        .empty {
            padding: 40px;
            text-align: center;
            color: #6b7280;
            font-size: 15px;
        }

        /* ---- Embed mode: drop hero chrome, tighten spacing ---- */
        body.embed { margin: 10px 14px; }
        body.embed .hero { display: none; }

        @media (max-width: 640px) {
            body { margin: 8px 12px 20px; }
            .evidence-card { width: 100%; margin: 5px 0; }
            .hero-layout { grid-template-columns: 1fr; }
            .hero-logo { width: 84px; height: 84px; }
            .hero-title { font-size: 36px; }
        }
    </style>
    <link rel="stylesheet" target="_blank" href="https://fonts.googleapis.com/css?family=Ubuntu">
</head>
<body>
<header class="hero">
    <div class="hero-layout">
        <img class="hero-logo" src="icons/logo.png" alt="Evidence Explorer">
        <div>
            <div class="hero-title">Evidence Explorer</div>
            <div class="hero-subtitle">Search across all evidence fragments by name, id, or type. Each fragment links strategy
                and product bricks to concrete observed signals from source code, cloud accounts, org data, and objectives.</div>
        </div>
    </div>
</header>

<div class="controls">
    <label class="search-box">
        <span class="search-icon">&#128269;</span>
        <input id="search" type="search" placeholder="Search by name, id, or type&hellip;" autocomplete="off" aria-label="Search evidence">
    </label>
    <span id="count" class="result-count"></span>
</div>

<div class="tab" id="tabbar" role="tablist"></div>
<div class="tabcontent" id="list"></div>
<div id="empty" class="empty" style="display:none;">No evidence matches your search.</div>

<script>
    // Evidence data is inlined by the generator (_wiring/evidence-explorer).
    const EVIDENCE_DATA = ${evidence_data};
    // Base path for evidence icons, relative to this page.
    const ICON_BASE = "${icon_base}";
    const FALLBACK_ICON = "evidence.png";

    // ---- Flatten groups -> fragments, keep group name for context. ----
    const FRAGMENTS = [];
    for (const group of EVIDENCE_DATA) {
        const groupName = (group.group && group.group.name) || "";
        for (const f of (group.fragments || [])) {
            f._group = groupName;
            FRAGMENTS.push(f);
        }
    }

    // ---- Embed mode: ?embed=1 and ?ids=pattern1,pattern2 ----
    const params = new URLSearchParams(window.location.search);
    const isEmbed = params.has("embed") || params.has("ids");
    if (isEmbed) document.body.classList.add("embed");

    // In embed mode, ?useTabs=false renders all types as stacked sections
    // (no tabs); otherwise (default, or outside embed mode) tabs are used.
    function parseBool(value, fallback) {
        if (value == null) return fallback;
        const v = value.trim().toLowerCase();
        if (v === "false" || v === "0" || v === "no") return false;
        if (v === "true" || v === "1" || v === "yes") return true;
        return fallback;
    }
    const useTabs = !isEmbed ? true : parseBool(params.get("useTabs"), true);
    if (!useTabs) document.body.classList.add("no-tabs");

    function globToRegExp(pattern) {
        // Support * and ? wildcards on ids; everything else escaped. Case-insensitive.
        const escaped = pattern.trim()
            .replace(/[.+^${}()|[\]\\]/g, "\\$&")
            .replace(/\*/g, ".*")
            .replace(/\?/g, ".");
        return new RegExp("^" + escaped + "$", "i");
    }

    // id patterns restricting the embed view. Comma- or newline-separated.
    const idPatternsRaw = params.get("ids") || "";
    const idPatterns = idPatternsRaw
        .split(/[,\n]/)
        .map(s => s.trim())
        .filter(Boolean)
        .map(globToRegExp);

    function matchesIdPatterns(fragment) {
        if (idPatterns.length === 0) return true;
        return idPatterns.some(rx => rx.test(fragment.id || ""));
    }

    // Pool = all fragments, optionally pre-filtered by the embed id patterns.
    const POOL = FRAGMENTS.filter(matchesIdPatterns);

    // ---- One tab per evidence type, sorted by name. ----
    const TYPES = Array.from(new Set(POOL.map(f => f.type || "untyped"))).sort();

    // ---- HTML rendering (mirrors _imports/evidence/script.html) ----
    function escapeEvidenceHtml(value) {
        return (value || "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#39;");
    }

    function renderEvidenceLinks(links) {
        if (!links || !links.length) return "";
        let html = '<div style="font-size: 80%; border-top: 1px solid grey; margin-top: 10px">';
        html += '<div style="padding-left: 0; padding-top: 6px; padding-bottom: 0; margin: 0">';
        links.forEach(link => {
            const label = escapeEvidenceHtml(link.label || "Open link");
            const url = link.url || "";
            html += '<div style="display: inline-block; border: 1px solid lightgrey; border-radius: 999px; padding: 4px 6px; margin: 3px">';
            html += '<a class="evidence-link" target="_blank" rel="noopener noreferrer" href="' + escapeEvidenceHtml(url) + '">' + label + '</a>';
            html += '<img src="' + ICON_BASE + 'new-window.png" style="height: 10px; vertical-align: top; margin: 2px;">';
            html += '</div>';
        });
        html += '</div></div>';
        return html;
    }

    function renderEvidenceIcon(fragment) {
        const icon = escapeEvidenceHtml(fragment.icon || FALLBACK_ICON);
        return '<img class="evidence-card-icon" src="' + ICON_BASE + icon +
            '" onerror="this.onerror=null;this.src=\'' + ICON_BASE + FALLBACK_ICON + '\'">';
    }

    function aggregateSummableFacts(fragments) {
        const totals = {};
        fragments.forEach(fragment => {
            (fragment.facts || []).forEach(fact => {
                if (!fact || fact.summable !== true) return;
                const numericValue = Number(fact.value);
                if (!Number.isFinite(numericValue)) return;
                const label = fact.label || "Value";
                totals[label] = (totals[label] || 0) + numericValue;
            });
        });
        return Object.entries(totals).map(([label, value]) => ({label, value}));
    }

    function renderSummableFactsSummary(fragments) {
        const totals = aggregateSummableFacts(fragments);
        if (!totals.length) return "";
        let html = '<div class="evidence-summary">';
        totals.forEach(item => {
            html += '<div class="evidence-summary-chip">';
            html += '<span class="evidence-summary-value">' + escapeEvidenceHtml(item.value + "") + '</span>';
            html += '<span>' + escapeEvidenceHtml(item.label) + '</span>';
            html += '</div>';
        });
        html += '</div>';
        return html;
    }

    function renderCard(fragment) {
        let html = '<div class="evidence-card">';
        html += '<div class="evidence-card-header">';
        html += '<div class="evidence-card-header-top">';
        html += renderEvidenceIcon(fragment);
        html += '<div>';
        html += '<div class="evidence-card-meta">' + escapeEvidenceHtml(fragment.type || "Evidence fragment") + '</div>';
        html += '<div class="evidence-card-title">' + escapeEvidenceHtml(fragment.title || fragment.id) + '</div>';
        html += '</div></div></div>';
        if (fragment.id) {
            html += '<div class="evidence-id">' + escapeEvidenceHtml(fragment.id) + '</div>';
        }
        if (fragment.description) {
            html += '<div class="evidence-card-summary">' + escapeEvidenceHtml(fragment.description) + '</div>';
        }
        if (fragment.facts && fragment.facts.length) {
            html += '<div class="evidence-card-summary" style="color: black;">';
            fragment.facts.forEach(fact => {
                html += '<div><span style="border: 1px solid lightgrey; background-color: lightyellow">&nbsp;' +
                    escapeEvidenceHtml(fact.value + "") + '&nbsp;</span> ' + escapeEvidenceHtml(fact.label) + '</div>';
            });
            html += '</div>';
        }
        if (fragment.tags && fragment.tags.length) {
            fragment.tags.forEach(tag => {
                html += '<div class="tag" style="margin-bottom:10px;">' + escapeEvidenceHtml(tag) + '</div>';
            });
        }
        html += '<div class="evidence-links">' + renderEvidenceLinks(fragment.links) + '</div>';
        html += '</div>';
        return html;
    }

    // ---- Filtering & display ----
    const searchInput = document.getElementById("search");
    const tabbarEl = document.getElementById("tabbar");
    const listEl = document.getElementById("list");
    const emptyEl = document.getElementById("empty");
    const countEl = document.getElementById("count");

    let activeType = TYPES[0] || null;

    function fragmentMatchesQuery(f, q) {
        if (!q) return true;
        const haystack = [f.title, f.id, f.type, f.description, f._group]
            .filter(Boolean).join(" ").toLowerCase();
        return haystack.includes(q);
    }

    // Fragments of one type that match the current search query.
    function matchesForType(type, q) {
        return POOL.filter(f => (f.type || "untyped") === type && fragmentMatchesQuery(f, q));
    }

    // ---- Build the tab buttons once; counts/visibility update on search. ----
    // Skipped when tabs are disabled (embed ?useTabs=false).
    const tabButtons = new Map();
    if (useTabs) {
        for (const type of TYPES) {
            const btn = document.createElement("button");
            btn.className = "tablinks";
            btn.type = "button";
            btn.dataset.type = type;
            btn.innerHTML = escapeEvidenceHtml(type) + ' <span class="tab-count"></span>';
            btn.addEventListener("click", () => { activeType = type; render(); });
            tabbarEl.appendChild(btn);
            tabButtons.set(type, btn);
        }
    } else {
        tabbarEl.style.display = "none";
    }

    function renderCards(frags) {
        // Group the active type's matches by their source group into bordered panels.
        const order = [];
        const byGroup = new Map();
        for (const f of frags) {
            const key = f._group || "";
            if (!byGroup.has(key)) { byGroup.set(key, []); order.push(key); }
            byGroup.get(key).push(f);
        }
        let html = "";
        for (const key of order) {
            const groupFrags = byGroup.get(key);
            html += '<div class="evidence-group">';
            html += '<div class="evidence-group-title">' + escapeEvidenceHtml(key || "Evidence") + ' (' + groupFrags.length + ')</div>';
            html += renderSummableFactsSummary(groupFrags);
            groupFrags.forEach(f => { html += renderCard(f); });
            html += '</div>';
        }
        return html;
    }

    function renderTabs(q) {
        // Per-type counts for the current query; hide zero-result tabs while searching.
        let total = 0;
        const visibleTypes = [];
        for (const type of TYPES) {
            const n = matchesForType(type, q).length;
            total += n;
            const btn = tabButtons.get(type);
            btn.querySelector(".tab-count").textContent = "(" + n + ")";
            // When searching, drop empty tabs; with no query, keep every type visible.
            const hide = q && n === 0;
            btn.classList.toggle("hidden", hide);
            if (!hide) visibleTypes.push(type);
        }

        countEl.textContent = total + " of " + POOL.length + " fragments";

        // Keep the active tab valid: if it got hidden, fall back to the first visible one.
        if (!activeType || !visibleTypes.includes(activeType)) {
            activeType = visibleTypes[0] || null;
        }

        for (const [type, btn] of tabButtons) {
            btn.classList.toggle("active", type === activeType);
        }

        if (!activeType) {
            listEl.style.display = "none";
            emptyEl.style.display = "block";
            return;
        }
        listEl.style.display = "block";
        emptyEl.style.display = "none";
        listEl.innerHTML = renderCards(matchesForType(activeType, q));
    }

    function renderSections(q) {
        // No tabs: render every type with matches as a stacked section.
        let total = 0;
        let html = "";
        for (const type of TYPES) {
            const frags = matchesForType(type, q);
            total += frags.length;
            if (!frags.length) continue;
            html += '<section class="type-section">';
            html += '<div class="type-section-title">' + escapeEvidenceHtml(type) + ' (' + frags.length + ')</div>';
            html += renderCards(frags);
            html += '</section>';
        }

        countEl.textContent = total + " of " + POOL.length + " fragments";

        if (!total) {
            listEl.style.display = "none";
            emptyEl.style.display = "block";
            return;
        }
        listEl.style.display = "block";
        emptyEl.style.display = "none";
        listEl.innerHTML = html;
    }

    function render() {
        const q = searchInput.value.trim().toLowerCase();
        if (useTabs) renderTabs(q);
        else renderSections(q);
    }

    searchInput.addEventListener("input", render);
    render();
</script>
</body>
</html>
