name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate all domain models (JSON, ids, cross-file references)
        run: python3 .claude/skills/scripts/validate-domain-model.py --all

      - name: Check KPI pyramids (report-only until name-join debt is paid)
        # ~500 pre-existing KPI-name mismatches across 13 domains (see REVIEW.md
        # Phase 4). Blocking is enabled once insights/strategy move to kpiIds.
        continue-on-error: true
        run: |
          status=0
          for d in _config/product-domains/*/; do
            d="$(basename "$d")"
            [ -f "_config/product-domains/$d/customers/customers.json" ] || continue
            python3 .claude/skills/scripts/check-kpi-pyramids.py "$d" || status=1
          done
          exit $status

      - name: Evidence pipeline builds
        run: bash _evidence/run.sh

      - name: Generators run clean on the reference domain
        run: |
          cd _wiring/product-domains
          ./run-one.sh ride-sharing-marketplace
