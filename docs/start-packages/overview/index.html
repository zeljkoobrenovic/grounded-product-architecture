    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

    <script>
        const START_TAB_STORAGE_KEY = 'productscape:start-active-tab';

        // Persist the last opened tab (shared tabs script calls this hook after opening).
        window.afterOpenTab = function (tabName) {
            window.sessionStorage.setItem(START_TAB_STORAGE_KEY, tabName);
        };

    <script>
        // Pre-build a flat list with pre-lowercased fields for search
        const allApps = [];
        apps.forEach(tab => {
            tab.apps.forEach(group => {
                group.apps.forEach(app => {
                    allApps.push({
                        app: app,
                        name: (app.name || '').toLowerCase(),
                        description: (app.description || '').toLowerCase(),
                        source: (app.source || '').toLowerCase()
                    });
                });
            });
        });

        function renderAppCard(app) {
            let html = '<div class="app">';
            if (config.openInNewTab === false || app.openInNewTab === false) {
                html += '<a href="' + app.link + '">';
            } else {
                html += '<a target="_blank" href="' + app.link + '">';
            }
            html += '<div style="height: 38px">';
            html += '<div class="name">' + app.name + '</div>';
            if (app.source) {
                html += '<div class="source">source: ' + app.source + '</div>';
            } else {
                html += '<div class="source"></div>';
            }
            html += '</div>';
            html += '<div><img class="icon" src="' + app.icon + '"></div>';
            html += '<div class="description">' + app.description + '</div>';
            html += '</a>';
            html += '</div>';
            return html;
        }

        function renderTabs() {
            apps.forEach(tab => {
                let html = '';
                tab.apps.forEach(group => {
                    html += '<div class="group">';
                    html += '<div class="group-title">' + group.group + '</div>';
                    group.apps.forEach(app => {
                        html += renderAppCard(app);
                    });
                    html += '</div>';
                });
                document.getElementById('content_' + tab.tab).innerHTML = html;
            });
        }

        function update() {
            const filterText = document.getElementById('filter_all').value.trim().toLowerCase();

            if (filterText) {
                document.getElementById('tab_navigation').style.display = 'none';
                document.getElementById('tab_content').style.display = 'none';
                document.getElementById('content_search').style.display = 'block';

                let html = '';
                let count = 0;
                allApps.forEach(entry => {
                    if (entry.name.includes(filterText) || entry.description.includes(filterText) || entry.source.includes(filterText)) {
                        html += renderAppCard(entry.app);
                        count++;
                    }
                });
                document.getElementById('content_search').innerHTML = html;
                document.getElementById('summary_all').innerHTML = ' = ' + count + ' app' + (count !== 1 ? 's' : '');
            } else {
                document.getElementById('tab_navigation').style.display = '';
                document.getElementById('tab_content').style.display = '';
                document.getElementById('content_search').style.display = 'none';
                document.getElementById('summary_all').innerHTML = '';
            }
        }

        if (!config || !config.enableSearch) {
            document.getElementById('search_container').style.display = 'none';
        }

        renderTabs();
    </script>

    <script>
        const domainDescription = document.getElementById('domain-description');
        const domainDescriptionToggle = document.getElementById('domain-description-toggle');
        const descriptionContainer = domainDescription.parentElement;
        const fullDomainDescription = domainDescription.cloneNode(true);
        const fullDescriptionText = fullDomainDescription.textContent;

        function showDescriptionPrefix(length) {
            // Keep links and formatting when shortening the description.
            const range = document.createRange();
            range.selectNodeContents(fullDomainDescription);
            const walker = document.createTreeWalker(fullDomainDescription, NodeFilter.SHOW_TEXT);
            let node;
            while ((node = walker.nextNode())) {
                if (length <= node.length) {
                    range.setEnd(node, length);
                    break;
                }
                length -= node.length;
            }
            domainDescription.replaceChildren(range.cloneContents());
        }

        function updateDescriptionToggle() {
            const wasExpanded = domainDescriptionToggle.getAttribute('aria-expanded') === 'true';
            const maxHeight = 2 * parseFloat(getComputedStyle(descriptionContainer).lineHeight);
            showDescriptionPrefix(fullDescriptionText.length);
            domainDescriptionToggle.hidden = true;
            const overflows = descriptionContainer.scrollHeight > maxHeight + 1;
            domainDescriptionToggle.hidden = !overflows;
            const expanded = wasExpanded && overflows;
            domainDescriptionToggle.setAttribute('aria-expanded', String(expanded));
            domainDescriptionToggle.textContent = expanded ? '<<' : '...';
            if (!overflows || expanded) return;

            // Find the longest prefix that leaves room for the inline button on line two.
            let low = 0;
            let high = fullDescriptionText.length;
            while (low < high) {
                const middle = Math.ceil((low + high) / 2);
                showDescriptionPrefix(middle);
                if (descriptionContainer.scrollHeight <= maxHeight + 1) {
                    low = middle;
                } else {
                    high = middle - 1;
                }
            }
            // Prefer ending at a whole word when the next character continues it.
            let prefix = fullDescriptionText.slice(0, low);
            if (/\S/.test(fullDescriptionText.charAt(low))) {
                const wordBoundary = prefix.search(/\s+\S*$/);
                if (wordBoundary > 0) prefix = prefix.slice(0, wordBoundary);
            }1
            showDescriptionPrefix(prefix.trimEnd().length);
        }

        domainDescriptionToggle.addEventListener('click', () => {
            const expanded = domainDescriptionToggle.getAttribute('aria-expanded') === 'true';
            domainDescriptionToggle.setAttribute('aria-expanded', String(!expanded));
            updateDescriptionToggle();
        });
        window.addEventListener('resize', updateDescriptionToggle);
        updateDescriptionToggle();
        if (document.fonts) document.fonts.ready.then(updateDescriptionToggle);
    </script>
