    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

    function topCustomerKpi(customer) {
        return (((customer || {}).kpiPyramids || {}).customerOutcomes || {}).top || null;
    }

    function formatCurrentValue(kpi) {
        if (!kpi || !kpi.currentValue) {
            return '';
        }
        return String(kpi.currentValue) + (kpi.unit ? ' (' + String(kpi.unit) + ')' : '');
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function customerLookup() {
        const lookup = {};
        customers.forEach(group => {
            group.customers.forEach(customer => {
                lookup[customer.id] = customer;
            });
        });
        return lookup;
    }

    function jobNamesForCustomer(customer, jobIds) {
        const jobs = ((customer || {}).jobsToBeDone || []);
        const jobLookup = {};
        jobs.forEach(job => {
            if (job.id) {
                jobLookup[job.id] = job.name || job.id;
            }
        });
        return (jobIds || []).map(jobId => jobLookup[jobId] || jobId);
    }

    function kpiLookupForCustomer(customer) {
        const lookup = {};
        function walk(node) {
            if (!node) return;
            if (node.id) {
                lookup[node.id] = node.name || node.id;
            }
            (node.branches || []).forEach(walk);
            (node.children || []).forEach(walk);
        }
        const pyramids = (customer || {}).kpiPyramids || {};
        ['customerOutcomes', 'businessOutcomes'].forEach(key => {
            const pyramid = pyramids[key];
            if (!pyramid) return;
            walk(pyramid.top);
            (pyramid.branches || []).forEach(walk);
        });
        return lookup;
    }

    function kpiNamesForCustomer(customer, link) {
        // Prefer stable KPI IDs; fall back to legacy display-name kpis.
        if (link && link.kpiIds && link.kpiIds.length) {
            const lookup = kpiLookupForCustomer(customer);
            return link.kpiIds.map(kpiId => lookup[kpiId] || kpiId);
        }
        return (link && link.kpis) || [];
    }

        html += '</div></div>';

    function customerMatchesSearch(customer, groupName, query) {
        if (!query) return true;
        const haystack = [customer.id, customer.name, customer.description, groupName]
            .concat(customer.careAbout || [], customer.winsThem || [], customer.theirFear || [])
            .filter(Boolean).join(' ').toLowerCase();
        return haystack.includes(query);
    }

    function renderCustomers() {
        const searchInput = document.getElementById('CustomerSearch');
        if (!customerUrlStateRestored) {
            customerUrlStateRestored = true;
            const initialQuery = new URLSearchParams(window.location.search).get('q');
            if (initialQuery && searchInput) searchInput.value = initialQuery;
        }
        const query = searchInput ? searchInput.value.trim().toLowerCase() : '';
        if (window.history && window.history.replaceState) {
            const params = new URLSearchParams(window.location.search);
            if (query) params.set('q', query); else params.delete('q');
            const qs = params.toString();
            window.history.replaceState({}, '', window.location.pathname + (qs ? '?' + qs : '') + window.location.hash);
        }
        let visible = 0;
        let total = 0;
        let html = '<div style="padding: 12px">';

        customers.forEach(group => {
            total += group.customers.length;
            const matching = group.customers.filter(customer => customerMatchesSearch(customer, group.group, query));
            visible += matching.length;
            if (!matching.length) return;
            html += '<div class="customer-group">';
            html += '<div class="customer-group-label">' + escapeHtml(group.group) + '</div>';
            matching.forEach(customer => {
                html += '<a target="_blank" href="landing_pages/' + escapeHtml(customer.id) + '.html">';
                html += '<div class="customer-card">';
                html += '<img class="customer-card-photo" src="icons/' + escapeHtml(customer.icon) + '" onerror="this.onerror=null;this.src=\'icons/customer.png\'">';
                html += '<div class="customer-card-name">' + escapeHtml(customer.name) + '</div>';
                const topKpi = topCustomerKpi(customer);
                if (topKpi && topKpi.name) {
                    html += '<div class="kpi-badge">';
                    html += '<div>KPI: ' + escapeHtml(topKpi.name) + '</div>';
                    html += '</div>';
                }
                html += renderAttribute('care.png', 'Care about', customer.careAbout);
                html += '</div></a>';
            });
            html += '</div>';
        });

        html += '</div>';
        if (!visible) {
            html = '<div class="customer-search-empty">No customers match the current search.</div>';

        document.getElementById('CustomerCards').innerHTML = html;
        const summary = document.getElementById('CustomerSearchSummary');
        if (summary) {
            summary.textContent = query ? `Showing ${visible} of ${total} customers` : '';

    }

        let html = '<div class="visual-overview-items">';
        items.forEach(item => {

            // Summary images belong to the job or journey itself, not its steps or stages.
            const images = (item.media || []).filter(media => media && media.type === 'image' && media.src);
            html += '<div class="visual-overview-item">';
            html += '<div class="visual-overview-item-name">' + escapeHtml(name) + '</div>';
            images.forEach(media => {
                const src = escapeHtml(media.src);

                html += '<a class="visual-overview-image-link" href="' + src + '" target="_blank" rel="noopener noreferrer"' +

                html += '<div class="visual-overview-empty">No summary image available.</div>';

                html += '<div style="margin-bottom:8px"><b>Connected customers:</b></div>';
                insight.linkedCustomers.forEach(link => {
                    const customer = lookup[link.customerId];
                    html += '<div class="insight-customer-link">';
                    if (customer) {
                        html += '<a target="_blank" href="landing_pages/' + escapeHtml(customer.id) + '.html" style="color:#315b7c;font-weight:bold">' + escapeHtml(customer.name) + '</a>';
                    } else {
                        html += '<span style="font-weight:bold">' + escapeHtml(link.customerId) + '</span>';
                    }
                    if (link.jobIds && link.jobIds.length) {
                        html += '<div class="insight-source"><b>Jobs:</b> ' + escapeHtml(jobNamesForCustomer(customer, link.jobIds).join(', ')) + '</div>';
                    }
                    const kpiNames = kpiNamesForCustomer(customer, link);
                    if (kpiNames.length) {
                        html += '<div class="insight-source"><b>KPIs:</b> ' + escapeHtml(kpiNames.join(', ')) + '</div>';
                    }
                    html += '</div>';
                });
            }
            if (insight.sources && insight.sources.length) {
                html += '<div><b>Sources:</b></div>';
                insight.sources.forEach(source => {
                    html += '<div class="insight-source">';
                    html += '<a target="_blank" href="' + escapeHtml(source.url) + '" style="color:#315b7c">' + escapeHtml(source.title) + '</a>';
                    html += ' <span style="color:#6b7280">(' + escapeHtml(source.publisher || '') + (source.date ? ', ' + escapeHtml(source.date) : '') + ')</span>';
                    html += '</div>';
                });
            }
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_insights').innerHTML = html;
    }

    function renderLinks() {
        const groups = (links.groups || []).filter(group => (group.links || []).length);

        if (!groups.length) {
            document.getElementById('tab_content_links').innerHTML = '<div style="padding:16px;color:#6b7280">No external links defined for this domain yet.</div>';
            return;
        }

        let html = '<div class="links-section">';
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-label">' + escapeHtml(group.group) + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            html += '<div class="links-grid">';
            (group.links || []).forEach(link => {
                html += '<a class="link-card" target="_blank" rel="noopener" href="' + escapeHtml(link.url) + '">';
                html += '<div class="link-title">' + escapeHtml(link.title) + '</div>';
                if (link.relevance) {
                    html += '<div class="link-relevance">' + escapeHtml(link.relevance) + '</div>';
                }
                if (link.tags && link.tags.length) {
                    html += '<div>';
                    link.tags.forEach(tag => {
                        html += '<span class="link-tag">' + escapeHtml(tag) + '</span>';
                    });
                    html += '</div>';
                }
                if (link.references && link.references.length) {
                    html += '<div style="margin-top:8px;font-size:72%;color:#6b7280">Grounds: ';
                    html += link.references.map(r => escapeHtml(r.label || (r.type + ':' + r.id))).join(' · ');
                    html += '</div>';
                }
                html += '</a>';
            });
            html += '</div></div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
    }

    const relationTypeState = {};

    function toggleRelationType(typeId) {
        relationTypeState[typeId] = !relationTypeState[typeId];
        renderRelations();
    }

    function renderRelations() {
        const allRels = (relations.relations || []);
        const container = document.getElementById('tab_content_relations');
        if (!allRels.length) {
            container.innerHTML = '<div style="padding:16px;color:#6b7280">No customer relations defined for this domain yet.</div>';
            return;
        }

        const lookup = customerLookup();
        const types = relations.relationTypes || [];
        const typeById = {};
        types.forEach(type => {
            typeById[type.id] = type;
            if (!(type.id in relationTypeState)) relationTypeState[type.id] = true;
        });
        allRels.forEach(rel => {
            if (!(rel.type in relationTypeState)) relationTypeState[rel.type] = true;
        });
        const colorFor = typeId => (typeById[typeId] || {}).color || '#64748b';
        const rels = allRels.filter(rel => relationTypeState[rel.type]);

        // Nodes: customers that participate in at least one relation (regardless of
        // the type filter, so toggling never rearranges the ring), in group order.
        const nodeIds = [];
        customers.forEach(group => (group.customers || []).forEach(customer => {
            if (allRels.some(rel => rel.from === customer.id || rel.to === customer.id)) {
                nodeIds.push(customer.id);
            }
        }));

        const W = 1000, H = 660, cx = W / 2, cy = H / 2 - 14, rx = 385, ry = 235;
        const pos = {};
        nodeIds.forEach((id, i) => {
            const angle = -Math.PI / 2 + (i * 2 * Math.PI) / nodeIds.length;
            pos[id] = { x: cx + rx * Math.cos(angle), y: cy + ry * Math.sin(angle) };
        });

        let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" role="img" aria-label="Customer relations diagram">';
        svg += '<defs>';
        const markerTypes = {};
        rels.forEach(rel => { markerTypes[rel.type || 'default'] = colorFor(rel.type); });
        Object.entries(markerTypes).forEach(([typeId, color]) => {
            svg += '<marker id="rel-arrow-' + escapeHtml(typeId) + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">';
            svg += '<path d="M 0 1 L 9 5 L 0 9 z" fill="' + escapeHtml(color) + '"/></marker>';
        });
        svg += '</defs>';

        const NODE_R = 44;
        rels.forEach(rel => {
            const p1 = pos[rel.from], p2 = pos[rel.to];
            if (!p1 || !p2) return;
            const dx = p2.x - p1.x, dy = p2.y - p1.y;
            const len = Math.hypot(dx, dy) || 1;
            const ux = dx / len, uy = dy / len;
            const sx = p1.x + ux * (NODE_R + 4), sy = p1.y + uy * (NODE_R + 4);
            const ex = p2.x - ux * (NODE_R + 10), ey = p2.y - uy * (NODE_R + 10);
            // Curve every edge to its left so A→B and B→A separate visually.
            const mx = (sx + ex) / 2 - uy * 34, my = (sy + ey) / 2 + ux * 34;
            const fromName = (lookup[rel.from] || {}).name || rel.from;
            const toName = (lookup[rel.to] || {}).name || rel.to;
            svg += '<path class="relation-edge" d="M ' + sx.toFixed(1) + ' ' + sy.toFixed(1) +
                ' Q ' + mx.toFixed(1) + ' ' + my.toFixed(1) + ' ' + ex.toFixed(1) + ' ' + ey.toFixed(1) + '"' +
                ' fill="none" stroke="' + escapeHtml(colorFor(rel.type)) + '" stroke-width="2.5"' +
                ' marker-end="url(#rel-arrow-' + escapeHtml(rel.type || 'default') + ')">';
            svg += '<title>' + escapeHtml(fromName + ' → ' + toName + ': ' + (rel.name || '')) + '</title></path>';
        });

        nodeIds.forEach(id => {
            const customer = lookup[id] || {};
            const p = pos[id];
            const icon = 'icons/' + (customer.icon || (id + '.png'));
            svg += '<a class="relation-node" href="landing_pages/' + escapeHtml(id) + '.html">';
            svg += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + NODE_R + '" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>';
            svg += '<image href="' + escapeHtml(icon) + '" x="' + (p.x - 30).toFixed(1) + '" y="' + (p.y - 30).toFixed(1) + '" width="60" height="60"/>';
            const words = String(customer.name || id).split(' ');
            const lines = [];
            words.forEach(word => {
                if (lines.length && (lines[lines.length - 1] + ' ' + word).length <= 16) {
                    lines[lines.length - 1] += ' ' + word;
                } else {
                    lines.push(word);
                }
            });
            svg += '<text x="' + p.x.toFixed(1) + '" y="' + (p.y + NODE_R + 18).toFixed(1) + '" text-anchor="middle">';
            lines.forEach((line, i) => {
                svg += '<tspan x="' + p.x.toFixed(1) + '" dy="' + (i === 0 ? 0 : 15) + '">' + escapeHtml(line) + '</tspan>';
            });
            svg += '</text></a>';
        });
        svg += '</svg>';

        let html = '<div class="relations-section">';
        if (relations.description) {
            html += '<div class="relations-intro">' + escapeHtml(relations.description) + '</div>';
        }
        (relations.media || []).forEach(entry => {
            if (entry && entry.type === 'image' && entry.src) {
                html += '<div class="relations-media"><img src="' + escapeHtml(entry.src) + '"' +
                    ' alt="' + escapeHtml(entry.alt || '') + '" title="' + escapeHtml(entry.title || '') + '"></div>';
            }
        });
        html += '<div class="relations-legend">';
        Object.keys(relationTypeState).forEach(typeId => {
            const type = typeById[typeId] || { id: typeId };
            const count = allRels.filter(rel => rel.type === typeId).length;
            html += '<span class="relations-legend-item' + (relationTypeState[typeId] ? '' : ' off') + '"' +
                ' onclick="toggleRelationType(\'' + escapeHtml(typeId) + '\')"' +
                ' title="' + escapeHtml(type.description || '') + '">';
            html += '<span class="relations-legend-swatch" style="background:' + escapeHtml(type.color || '#64748b') + '"></span>';
            html += escapeHtml(type.name || typeId) + ' (' + count + ')';
            html += '</span>';
        });
        html += '<span class="relations-legend-hint">Click a type to show or hide its relations.</span>';
        html += '</div>';
        html += '<div class="relations-diagram-wrap">' + svg + '</div>';

        html += '<div class="relations-table-wrap"><table class="relations-table">';
        html += '<tr><th>From</th><th>To</th><th>Type</th><th>Relation</th><th>Description</th><th>Via streams</th></tr>';
        if (!rels.length) {
            html += '<tr><td colspan="6" class="relations-empty-row">All relation types are switched off — click a type above to show its relations.</td></tr>';
        }
        rels.forEach(rel => {
            const fromName = (lookup[rel.from] || {}).name || rel.from;
            const toName = (lookup[rel.to] || {}).name || rel.to;
            const type = typeById[rel.type] || {};
            html += '<tr>';
            html += '<td class="relation-endpoint"><a href="landing_pages/' + escapeHtml(rel.from) + '.html">' + escapeHtml(fromName) + '</a></td>';
            html += '<td class="relation-endpoint"><a href="landing_pages/' + escapeHtml(rel.to) + '.html">' + escapeHtml(toName) + '</a></td>';
            html += '<td><span class="relation-type-chip" style="background:' + escapeHtml(colorFor(rel.type)) + '">' + escapeHtml(type.name || rel.type || '') + '</span></td>';
            html += '<td class="relation-name-cell">' + escapeHtml(rel.name || '') + '</td>';
            html += '<td>' + escapeHtml(rel.description || '') + '</td>';
            html += '<td class="relation-streams">' + (rel.streamIds || []).map(escapeHtml).join('<br>') + '</td>';
            html += '</tr>';
        });
        html += '</table></div></div>';
        container.innerHTML = html;
    }

    update();
    renderVisualOverview();
    renderRelations();
    renderInsights();
    renderLinks();
    updateTabLabels();
</script>
<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../start/index.html",
      "label": "Engineering Information and Asset Lifecycle Platform Home"
    },
    {
      "label": "Customers"
    }
  ]
};
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>

</body>
