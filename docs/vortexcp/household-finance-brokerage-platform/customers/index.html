    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

ons and re-issues the feasibility certificate that buyers show to sellers."}]}], "media": [{"type": "image", "src": "media/jbtd-fthb-jtbd-fthb-1.png", "title": "First-time Home Buyer JTBD infographic: Know how much I can borrow and prove it to sellers", "alt": "Enterprise infographic for the job \"Know how much I can borrow and prove it to sellers\" for customer \"First-time Home Buyer\"."}]}, {"id": "jtbd-fthb-2", "name": "Get the best total mortgage package from 25 banks without visiting them", "whatItIs": "Once the offer on a house is accepted, get an independent comparison of what 25 banks would offer for this file, on one screen and in one conversation, and choose the best total package: rate type and level, duration, monthly repayment, file costs, conditions attached to insurance and to domiciliation of salary. The job includes checking the proposal the couple's own bank already made, understanding why the recommended bank wins, and being told honestly when their own bank is actually the best. It replaces weeks of separate bank visits with one expert who does the comparison for free because the chosen bank pays the commission.", "outcome": "The buyer sees a same-screen comparison of at least 20 banks for their file, chooses a package with a clear reason within a week of the accepted offer, and pays less over the loan term than the offer of their own bank or the first bank they visited.", "steps": [{"step": "Bring the project and the own-bank proposal to the expert", "description": "Share the accepted offer, the compromis draft, the EPC certificate and, if there is one, the proposal already received from their own bank, by upload before the appointment. Decide what matters most: lowest monthly repayment, fixed rate certainty, or freedom to repay early.", "streamsNeeded": [{"id": "book-and-hold-an-advisory-appointment", "name": "Book and Hold an Advisory Appointment", "howItSupports": "Prepares the second appointment with the project documents and the uploaded proposal attached to the file."}, {"id": "compare-mortgage-offers-across-banks", "name": "Compare Mortgage Offers Across Banks", "howItSupports": "Reads the proposal received elsewhere into the comparison so it is judged against the 25 banks on equal terms."}]}, {"step": "Compare the conditions of 25 banks on one screen", "description": "Watch the expert compare the daily conditions of 25 banks for this exact profile: rate, duration, monthly repayment, total cost, file costs and insurance conditions, with the own-bank proposal shown alongside. Ask why a bank ranks first and what happens if the rate is fixed for the full term.", "streamsNeeded": [{"id": "compare-mortgage-offers-across-banks", "name": "Compare Mortgage Offers Across Banks", "howItSupports": "Produces the same-screen comparison of the daily conditions of 25 banks and an independent recommendation of the best total package."}]}, {"step": "Understand the total cost including insurance and fees", "description": "Look beyond the rate: outstanding-balance insurance for both partners, fire insurance, the bank's conditions for a rate reduction, notary and registration costs, and the reinvestment fee if they ever refinance. Decide with the expert which bundled conditions are worth accepting.", "streamsNeeded": [{"id": "compare-mortgage-offers-across-banks", "name": "Compare Mortgage Offers Across Banks", "howItSupports": "Shows the total package cost with the insurance conditions attached to each bank's offer."}, {"id": "compare-and-switch-insurance", "name": "Compare and Switch Insurance", "howItSupports": "Quotes outstanding-balance and fire insurance across 11 insurers so the bank's bundled insurance can be compared, not just accepted."}]}, {"step": "Choose the bank and confirm the package", "description": "Pick the package, sign the advice record in which the expert documents why this bank was recommended and which alternatives were considered, and give the go-ahead to prepare the credit file for that bank. ow-EPC home, add the renovation quotes needed to finance the obligation. Friction: a missing document found by the bank costs a week.", "streamsNeeded": [{"id": "assemble-and-submit-the-loan-file", "name": "Assemble and Submit the Loan File", "howItSupports": "Provides the document checklist per bank, collects uploads and checks completeness before submission."}]}, {"step": "Have the file submitted and approval followed", "description": "The expert submits the complete file to the chosen bank, tracks the approval status and any extra questions from the bank, and tells the couple as soon as the loan offer is approved and what conditions remain.", "streamsNeeded": [{"id": "assemble-and-submit-the-loan-file", "name": "Assemble and Submit the Loan File", "howItSupports": "Submits the file to the bank, tracks approval and conditions and keeps the buyer informed."}]}, {"step": "Put outstanding-balance and fire insurance in place", "description": "Compare and take out outstanding-balance insurance for each partner and fire insurance for the home, either with the bank's partner or with a cheaper insurer among the 11 compared, answering the health questions and providing the proof the bank needs before disbursement.", "streamsNeeded": [{"id": "close-the-loan-through-notary-and-insurance", "name": "Close the Loan Through Notary and Insurance", "howItSupports": "Attaches the required outstanding-balance and fire insurance to the loan and delivers the proof to the bank."}, {"id": "compare-and-switch-insurance", "name": "Compare and Switch Insurance", "howItSupports": "Compares and binds the policies across 11 insurers so the buyer is not limited to the bank's bundled offer."}]}, {"step": "Sign the loan deed and the purchase deed at the notary", "description": "Coordinate the loan offer, the notary's deed date and the disbursement, check the notary's settlement statement against the cost estimate made at the start, and sign both deeds; receive the repayment table and know the fi n and policies stored in a monitored household account, energy and telecom arranged for the move, and a bilingual network of 81 offices and video experts fed by one lead engine so a buyer in Ghent or Namur gets the same path.", "productTheme": "From first mortgage to monitored household", "customerKPI": {"northStar": "Days from first appointment to loan approval", "supporting": ["File first-time-complete rate", "Bank approval turnaround after submission"]}, "businessKPI": {"northStar": "Referral commission revenue from first-time buyer loans", "revenueStreams": ["Bank referral commissions on first-home loans across Flanders, Brussels and Wallonia", "Insurance commissions on outstanding-balance and fire cover bound at closing", "Energy, telecom and later re-comparison fees from the monitored household account"], "supporting": ["Insurance attach rate", "First-time buyers with a monitored household account within 12 months"]}, "milestones": ["Quote outstanding-balance and fire insurance across 11 insurers in every closing conversation and bind them before the deed", "Offer every first-time buyer a household account with the loan, policies and move-in energy and telecom contracts under monitoring", "Route first-time buyer leads to the nearest of 81 offices or a video expert in Dutch or French with the same file process"]}, "year5": {"focus": "AI-assisted preparation of the first-home file supervised by the expert: simulations that already know the bank conditions per profile, certificates generated from verified income data, files assembled from documents the buyer shares once, and real-time bank pricing and approval through partner APIs, so the expert spends the appointment on advice rather than paperwork.", "productTheme": "Expert advice on top of an automated file", "customerKPI": {"northStar": "Days from first appointment to loan approval", "supporting": ["Borrowing capacity estimate deviation", "Renovation obligation flagged before the offer"]}, "businessKPI": {"northStar": "Referral commission revenue from first-time buyer loans", "revenueStreams": ["Bank referral commissions with real-time pricing and binding through partner APIs", "Insurance, energy and telecom commissions from the household relationship", "Savings, investment and pension products offered through the Meilleurtaux group to established households"], "supporting": ["Cost of acquisition per first-time buyer loan", "First-time buyers referred by a friend or family member"]}, "milestones": ["Generate feasibility certificates from verified income and savings data with an expert's sign-off in one working day", "Assemble and pre-check the credit file automatically from documents the buyer shares once, with the expert reviewing exceptions", "Connect real-time pricing and approval APIs of partner banks so approval turnaround drops to days"]}}}}, {"id": "refi", "name": "Refinancing and Second-Project Owner", "description": "An existing mortgage holder, usually a household in its forties in Flanders or Brussels, five to fifteen years into a loan taken at a different rate, who now has a concrete reason to look at it again: a proposal from their own bank or from another broker that they want checked, a rate move that makes refinancing tempting, a renovation of a low-EPC home, a second home at the coast, a new build or, as a newly self-employed person, financing that their bank suddenly finds difficult. They are price-sensitive and time-poor, have done this once before and remember the paperwork, and want a one-page answer rather than a sales talk: can this proposal be beaten, what does refinancing cost in reinvestment fees, notary and file costs, and when does it break even. They discover the upload-your-proposal service through a search, a Peasy blog on rates or a colleague, upload the PDF in the evening, and expect an expert verdict within a day and, if worthwhile, a video call and a file that the new bank approves quickly. They also expect the loan-linked outstanding-balance and fire insurance to be reconsidered, not simply carried over.", "icon": "customer-refi-portrait.jpg", "careAbout": ["A fast, honest verdict on a proposal they already have: beat it, match it, or tell them to sign it", "The real savings of a refinancing after reinvestment fees, notary costs, file costs and a new outstanding-balance policy, with the break-even point spelled out", "Financing a renovation, second home, new build or self-employed situation on top of the existing loan without starting the whole file from zero", "A one-page comparison across 25 banks that they can read in five minutes, followed by a video call at a time that suits them", "Not being sold a new loan when keeping the current one is the better decision", "Loan-linked insurance re-quoted with the change, so that a cheaper outstanding-balance or fire policy is not left on the table"], "winsThem": ["Upload-your-proposal on peasy.be and hypotheekwinkel.be: a PDF from their own bank reviewed for free by an expert who compares it with 25 banks", "A refinancing simulator that shows monthly saving, total saving over the remaining term and the break-even after all costs", "Experts who handle renovation loans with the Flemish renovation obligation, second homes, new builds and self-employed income as everyday projects", "A video appointment within days and a file that reuses documents already collected, instead of a new visit to every bank", "Outstanding-balance and fire insurance compared across 11 insurers when the loan changes, and monitoring of the new loan afterwards"], "theirFear": ["Refinancing on the promise of a lower rate and finding that reinvestment fees, notary costs and a new policy eat the saving", "Spending evenings on documents for a second-home or self-employed file that a bank then declines late in the process", "Signing the proposal their own bank pushed because nobody could tell them within a week whether it was fair"], "jobsToBeDone": [{"id": "jtbd-refi-1", "name": "Find inancing and Second-Project Owner\"."}]}, {"id": "jtbd-refi-3", "name": "Keep my loan-linked insurance optimal after the change", "whatItIs": "Make sure that the outstanding-balance insurance and the fire insurance attached to the mortgage are re-quoted when the loan is refinanced, extended or partly repaid, that a policy bound years ago at a bank's bundled tariff is compared with 11 insurers, that the cover matches the new balance and the new property, and that the old policy is cancelled correctly without a gap the bank would object to. The job also includes keeping the new loan and policies watched afterwards, so that a later rate move or renewal triggers a re-comparison without the owner having to remember.", "outcome": "Every refinancing or second-project case ends with outstanding-balance and fire insurance re-quoted, the cheaper adequate policy bound and the old one cancelled without a coverage gap, and the household's loan and policies under monitoring with the next review date known.", "steps": [{"step": "Re-quote outstanding-balance and fire insurance with the new loan", "description": "Provide the new loan amount, term and the property details, answer the health questions once, and receive quotes from the 11 insurers next to the bank's bundled offer, with the effect of the bank's rate condition on domiciliation or insurance made explicit.", "streamsNeeded": [{"id": "compare-and-switch-insurance", "name": "Compare and Switch Insurance", "howItSupports": "Compares outstanding-balance and fire insurance across 11 insurers for the new loan and property."}, {"id": "close-the-loan-through-notary-and-insurance", "name": "Close the Loan Through Notary and Insurance", "howItSupports": "Links the chosen policies to the loan closing so the bank receives the proof it requires."}]}, {"step": "Bind the new policy and cancel the old one without a gap", "description": "Sign the new policy, let Peasy send the cancellation to the previous insurer with the right notice and effective date, and confirm to the bank that cover is continuous.", "streamsNeeded": [{"id": "compare-and-switch-insurance", "name": "Compare and Switch Insurance", "howItSupports": "Binds the new policy and executes the cancellation of the old one with the correct effective date."}]}, {"step": "Store the loan and policies in the household account", "description": "Check that the refinanced loan, the policies and the renewal dates are in the household account, and choose how to be alerted when rates drop again or a premium is due to rise.", "streamsNeeded": [{"id": "monitor-household-contracts-and-alert-savings", "name": "Monitor Household Contracts and Alert Savings", "howItSupports": "Stores the loan and policies per household with renewal dates and alert preferences."}]}, {"step": "Act on the next savings alert", "description": "When an alert says the fire premium can be cut or rates have moved enough to beat the break-even again, accept a re-comparison by phone or chat and let the advisor execute the switch.", "streamsNeeded": [{"id": "monitor-household-contracts-and-alert-savings", "name": "Monitor Household Contracts and Alert Savings", "howItSupports": "Raises the alert with the estimated saving and starts the re-comparison."}, {"id": "serve-customers-through-customer-care", "name": "Serve Customers Through Customer Care", "howItSupports": "Handles the follow-up by phone or chat and executes the resulting switch in one contact."}]}], "media": [{"type": "image", "src": "media/jbtd-refi-jtbd-refi-3.png", "title": "Refinancing and Second-Project Owner JTBD infographic: Keep my loan-linked insurance optimal after the change", "alt": "Enterprise infographic for the job \"Keep my loan-linked insurance optimal after the change\" for customer \"Refinancing and Second-Project Owner\"."}]}], "customerJourneyStories": [{"id": "journey-refi-1", "name": "From a bank's refinancing proposal to an honest verdict and a cheaper loan", "linkedJobIds": ["jtbd-refi-1", "jtbd-refi-3"], "summary": "A couple in Antwerp nine years into their mortgage receives a refinancing proposal from their own bank with a two-week validity, discovers Peasy's upload-your-proposal service through a search and a rates blog, and adopts the review-then-refinance path, staying for the contract monitoring that follows.", "stages": [{"stage": "Trigger", "narrative": "A letter from their bank proposes a new rate 'as a loyal customer' with a two-week validity, and a colleague says he got a better deal elsewhere. They cannot tell whether the reinvestment fee and notary costs wipe out the saving, and the branch appointment falls after the deadline."}, {"stage": "Discovery", "narrative": "A search for 'herfinancieren hypotheek' brings up a Peasy blog on when refinancing pays off and the upload-your-proposal page: send us the PDF and an expert checks it for free against 25 banks. Google reviews of the hypotheek.winkel office nearby mention exactly this situation."}, {"stage": "Evaluation", "narrative": "They check who pays: the chosen bank pays a referral commission, so the verdict costs nothing, and the FAQ states that Peasy never contracts with the customer itself and stays on the sidelines. The refinancing simulator gives a first break-even figure that makes the upload worth ten minutes."}, {"stage": "Trial", "narrative": "They upload the proposal in the evening; the next afternoon an expert e-mails a one-page comparison and calls: two banks beat the proposal after all costs, break-even in fourteen months. A video call the following day settles the choice and the credit file reuses the pay slips they uploaded."}, {"stage": "Engagement", "narrative": "The refinancing is approved within the proposal's validity window, the outstanding-balance policies from nine years ago are re-quoted across 11 insurers and replaced with cheaper ones without a gap, and the couple receives a household account with the loan and policies under monitoring."}, {"stage": "Retention", "narrative": "Two years later an alert reports that their fire premium can be cut and the advisor switches it by phone in one call. When the bank sends its next 'loyal customer' letter, they forward it to Peasy without reading it twice and recommend the upload to friends with a mortgage."}], "media": [{"type": "image", "src": "media/journey-refi-refi-1.png", "title": "Refinancing and Second-Project Owner customer journey: From a bank's refinancing proposal to an honest verdict and a cheaper loan", "alt": "Enterprise journey storyboard for \"From a bank's refinancing proposal to an honest verdict and a cheaper loan\" for customer \"Refinancing and Second-Project Owner\"."}]}, {"id": "journey-refi-2", "name": "A self-employed owner finances a renovation obligation with a second-project case", "linkedJobIds": ["jtbd-refi-2", "jtbd-refi-1"], "summary": "A newly self-employed physiotherapist in East Flanders who bought a label-E house must renovate under the Flemish obligation, is turned away by her bank because her income is new, adopts hypotheek.winkel through a friend's expert and a simulation, and stays for a second home two years later.", "stages": [{"stage": "Trigger", "narrative": "Her house carries an EPC label E and the renovation obligation's deadline is approaching; contractor quotes are in, but her bank hesitates because she became self-employed eighteen months ago. She fears being stuck between a legal deadline and a declined loan."}, {"stage": "Discovery", "narrative": "A friend who refinanced through hypotheek.winkel forwards the name of her expert and the page on renovation loans and self-employed financing. The site lists 'renovatielening' and 'zelfstandige' as everyday projects and shows a simulator for an additional loan on top of the existing one."}, {"stage": "Evaluation", "narrative": "She compares a personal loan from her bank, a renovation loan through a broker and Peasy's advice, checks that hypotheek.winkel is a registered credit intermediary and free because the bank pays, and reads a client story of another self-employed buyer. The deciding factor is an expert who knows how banks read self-employed income."}, {"stage": "Trial", "narrative": "In a video appointment the expert maps the existing loan, the quotes and her accounts, models a renovation loan against a refinancing that folds the project in, compares 25 banks, and finds a bank that accepts her income evidence. The file goes in complete and is approved before the obligation deadline."}, {"stage": "Engagement", "narrative": "Funds are released per contractor invoice, the fire insurance is re-quoted for the renovated house, and her loan and policies sit in her Peasy account. She uses the same expert for a question about premiums and gets a callback the same day."}, {"stage": "Retention", "narrative": "Two years later, with the practice established, she uploads a bank proposal for a small second home at the coast and lets the same expert handle the second-project case; she recommends the office in her practice's professional network."}], "media": [{"type": "image", "src": "media/journey-refi-refi-2.png", "title": "Refinancing and Second-Project Owner customer journey: A self-employed owner finances a renovation obligation with a second-project case", "alt": "Enterprise journey storyboard for \"A self-employed owner finances a renovation obligation with a second-project case\" for customer \"Refinancing and Second-Project Owner\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-refi-top", "name": "Savings identified per refinancing case", "description": "Average net saving over the remaining term identified by the expert per refinancing or proposal-review case, after reinvestment fee, notary, file and insurance costs. Modeled seed value for a refinancing case, not an official Peasy or hypotheek.winkel figure.", "unit": "EUR per case", "currentValue": "4200", "targetValue": "6500", "link": "https://dashboard.example.com/household-finance-brokerage-p d per household, insurance compared across 11 insurers with each change, rate-move re-comparisons offered proactively when the break-even is met, and one bilingual expert network of 81 offices and video experts for second projects anywhere in Belgium.", "productTheme": "Proactive re-comparison for every mortgage holder", "customerKPI": {"northStar": "Savings identified per refinancing case", "supporting": ["Days from case intake to approval for second projects", "Proposals beaten after all switching costs"]}, "businessKPI": {"northStar": "Referral commission revenue from refinancing and second-project loans", "revenueStreams": ["Bank referral commissions on refinancings and second-project loans nationwide", "Insurance commissions from policies re-quoted at every loan change and renewal", "Referral fees from energy and telecom switches of monitored households"], "supporting": ["Insurance attach rate", "Refinancers enrolled in contract monitoring"]}, "milestones": ["Alert monitored households when rates have moved enough to beat their break-even and open a refinancing case in one tap", "Re-quote outstanding-balance and fire insurance in every refinancing and second-project case and cancel the old policy without a gap", "Handle second-project cases in Dutch and French across the combined 81-office network with the same case process"]}, "year5": {"focus": "AI-assisted reading of proposals and loan statements, verdicts generated from real-time partner-bank pricing and reviewed by the expert, second-project files assembled from verified data, and savings, investment and pension products from the Meilleurtaux group offered to households whose mortgage is in order.", "productTheme": "Instant verdicts, expert-signed, on live bank pricing", "customerKPI": {"northStar": "Savings identified per refinancing case", "supporting": ["Verdicts sent within one working day", "Self-employed cases approved at first submission"]}, "businessKPI": {"northStar": "Referral commission revenue from refinancing and second-project loans", "revenueStreams": ["Bank referral commissions with real-time pricing and approval through partner APIs", "Insurance, energy and telecom commissions from the monitored household", "Savings, investment and pension products through the Meilleurtaux group"], "supporting": ["Renovation loan cases per year", "Second contract brokered within 12 months"]}, "milestones": ["Read uploaded proposals and loan statements automatically and draft the verdict from live partner-bank pricing for the expert to sign", "Assemble second-project and self-employed files from verified income and property data with expert review of exceptions", "Offer savings, investment and pension products from the Meilleurtaux group to households with a monitored mortgage"]}}}}, {"id": "hshs", "name": "Household Fixed-Cost Saver", "description": "A family with children in Flanders or Brussels, two incomes stretched by a mortgage, school costs and an energy bill that doubled one winter, who suspects it overpays for car, fire, funeral or outstanding-balance insurance, electricity and gas, the internet and TV pack and four mobile plans, but has never had the time to check. One parent runs the budget and starts with the Peasy budget barometer to see where the household sits against the Belgian average; the other only wants to hear the saving. They know their meter type, whether the digital meter and solar panels were installed and what the prosumer tariff did to the bill, and they keep the car insurance renewal letter and the telecom price increase e-mail in a folder. They found Aanbieders.be through its Google reviews or Verzekeringen.be through a search, prefer to compare on the site and then call or chat so that an advisor does the switch and the cancellation for them, and expect Peasy to keep watching the contracts and to warn them when it is cheaper elsewhere, because they will not remember renewal dates themselves.", "icon": "customer-hshs-portrait.jpg", "careAbout": ["Seeing in one place where the household overpays compared with Belgian averages, before deciding what to tackle first", "Real savings on car, fire, funeral and outstanding-balance insurance, electricity and gas, internet and TV and mobile, not headline 'up to' figures", "A switch done for them: the advisor binds the new contract and cancels the old one, with no gap, no double payment and no letters to write", "Comparisons that understand their situation: meter type, digital meter, solar panels and the prosumer tariff, family cars, a home with a home office", "Being warned before a renewal or a price increase, and a re-comparison that takes one phone call", "Knowing that Peasy earns a referral fee from the provider and that they pay nothing extra, so the advice is honest"], "winsThem": ["The Peasy budget barometer that benchmarks the household's fixed costs against Belgian averages and ranks where to save first", "Aanbieders.be with 4.6 stars from 2,765 Google reviews for free energy, telecom and mobile switching, and Verzekeringen.be comparing 11 insurers", "Energy comparison that asks for postcode, meter type, digital meter and solar panels and shows the real annual cost, not a teaser rate", "Advisors in Hasselt reachable by phone and chat on weekdays who compare, bind and cancel in one contact and confirm by e-mail", "Contract monitoring: Peasy keeps an eye on the brokered contracts and warns when a better or cheaper option exists"], "theirFear": ["Switching energy supplier and ending up with a variable contract that costs more the next winter, or a double payment because the old contract was not cancelled", "Spending a Saturday on comparison sites, entering meter data four times, and still not knowing whether the cheapest offer is any good", "Forgetting the car insurance renewal date and paying a year of increased premium because nobody warned them"], "jobsToBeDone": [{"id": "jtbd-hshs-1", "name": "See where my household overpays compared with Belgian averages", "whatItIs": "Get an honest picture of the household's recurring contracts, insurance, energy, telecom and mobile, and of how each compares with what similar Belgian households pay, so the family can decide what to tackle first. The job starts with the budget barometer, fed with real invoice amounts and the facts that matter (meter type, digital meter, solar panels, number of cars and phones), and ends with a ranked list of savings the family believes, because an advisor confirmed the biggest ones against the actual contracts.", "outcome": "The household completes the barometer with real amounts in under fifteen minutes, sees a ranked, believable list of where it overpays, and starts at least one comparison for the category with the largest confirmed saving.", "steps": [{"step": "Fill the budget barometer with real invoice amounts", "description": "Enter the monthly amounts for insurance, energy, telecom and mobile from the folder of invoices, plus postcode, family size, meter type, solar panels and the number of cars, and see how each category sits against the Belgian average. Friction: the family has to look up actual amounts rather than guess.", "streamsNeeded": [{"id": "monitor-household-contracts-and-alert-savings", "name": "Monitor Household Contracts and Alert Savings", "howItSupports": "Runs the budget barometer, stores the household's budget profile and benchmarks each category against Belgian averages."}]}, {"step": "Read the ranked savings and pick a starting point", "description": "See where the household overpays most, in euros per year, and decide which category to compare first, usually energy or car insurance; share the result with the partner who only wants the number.", "streamsNeeded": [{"id": "monitor-household-contracts-and-alert-savings", "name": "Monitor Household Contracts and Alert Savings", "howItSupports": "Ranks categories by estimated saving and turns the barometer into a savings plan for the household."}]}, {"step": "Confirm the biggest savings with an advisor", "description": "Request a callback or start a chat, let the advisor look at the actual contracts and invoices, and hear whether the estimated saving holds once the current contract's conditions and the real annual cost are known.", "streamsNeeded": [{"id": "serve-customers-through-customer-care", "name": "Serve Customers Through Customer Care", "howItSupports": "Handles the callback or chat in which the advisor checks the barometer estimate against the actual contracts."}, {"id": "monitor-household-contracts-and-alert-savings", "name": "Monitor Household Contracts and Alert Savings", "howItSupports": "Updates the savings plan with the confirmed amounts."}]}, {"step": "Store the contracts so the picture stays current", "description": "Add the current contracts and renewal dates to the household account so the barometer and the monitoring keep working after the first switch.", "streamsNeeded": [{"id": "monitor-household-contracts-and-alert-savings", "name": "Monitor Household Contracts and Alert Savings", "howItSupports": "Stores existing and brokered contracts per household with renewal dates."}]}], "media": [{"type": "image", "src": "media/jbtd-hshs-jtbd-hshs-1.png", "title": "Household Fixed-Cost Saver JTBD infographic: See where my household overpays compared with Belgian averages", "alt": "Enterprise infographic for the job \"See where my household overpays compared with Belgian averages\" for customer \"Household Fixed-Cost Saver\"."}]}, {"id": "jtbd-hshs-2", "name": "Compare and switch insurance, energy and telecom in minutes without paperwork", "whatItIs": "Compare the household's car, fire, funeral or outstanding-balance insurance across 11 insurers, its electricity and gas across suppliers on the right meter and prosumer parameters, and its internet, TV and mobile plans across operators, and then switch to the chosen offer with the new contract bound and the old one cancelled by Peasy, by phone, chat or self-service. The job is to make a switch a fifteen-minute decision with zero letters: no double payment, no coverage gap, the BIPT Easy Switch used for telecom, and the family receiving a confirmation of what was switched and when.", "outcome": "Each comparison ends within one contact in a bound contract or an executed switch with the old contract cancelled correctly, the family receives written confirmation, and the annual saving per switch is recorded and later verified against the first invoice.", "steps": [{"step": "Compare insurance across 11 insurers", "description": "Enter the car, home or family details once on Verzekeringen.be or with the advisor, compare premiums and cover across 11 insurers, and choose the policy that fits; for outstanding-balance or funeral cover, answer the health questions once.", "streamsNeeded": [{"id": "compare-and-switch-insurance", "name": "Compare and Switch Insurance", "howItSupports": "Compares car, fire, funeral and outstanding-balance insurance across 11 insurers for the household's situation."}]}, {"step": "Compare electricity and gas on the real meter situation", "description": "Give the postcode, EAN or invoice code, meter type, digital meter, solar panels and annual consumption, compare fixed and variable contracts on annual cost, and pick a supplier; ask the advisor what the prosumer tariff or an injection tariff means for the choice.", "streamsNeeded": [{"id": "compare-and-switch-energy-contracts", "name": "Compare and Switch Energy Contracts", "howItSupports": "Runs the electricity and gas comparison on meter type, digital meter, solar-panel and consumption data and executes the switch with the new supplier."}]}, {"step": "Compare the internet, TV and mobile pack", "description": "List the current pack and the family's four mobile plans, compare bundles and separate mobile plans across operators, and choose; the new fixed operator terminates the old contract under BIPT Easy Switch.", "streamsNeeded": [{"id": "compare-and-switch-telecom-and-mobile", "name": "Compare and Switch Telecom and Mobile", "howItSupports": "Compares internet, TV and mobile offers on the family's usage and executes the switch under BIPT Easy Switch."}]}, {"step": "Let the advisor bind, switch and cancel", "description": "Confirm the choices by phone or chat; the advisor binds the policy, places the energy and telecom switch orders and sends the cancellations of the old contracts with the right notice, then e-mails a confirmation with effective dates. Friction: a cancellation sent too early or too late causes a gap or a double payment.", "streamsNeeded": [{"id": "serve-customers-through-customer-care", "name": "Serve Customers Through Customer Care", "howItSupports": "Resolves the switch request in one contact with scripts and follow-up tickets."}, {"id": "compare-and-switch-insurance", "name": "Compare and Switch Insurance", "howItSupports": "Binds the chosen policy and cancels the old one with the correct effective date."}, {"id": "compare-and-switch-energy-contracts", "name": "Compare and Switch Energy Contracts", "howItSupports": "Places the switch order and ensures the old supplier contract ends without a gap or double billing."}]}, {"step": "Check the first invoice against the promised saving", "description": "Compare the first invoice of the new supplier, insurer or operator with the saving promised, and report a mismatch through chat so the advisor can follow it up with the partner.", "streamsNeeded": [{"id": "monitor-household-contracts-and-alert-savings", "name": "Monitor Household Contracts and Alert Savings", "howItSupports": "Records the promised saving per switch and verifies it against the first invoice reported by the household."}, {"id": "serve-customers-through-customer-care", "name": "Serve Customers Through Customer Care", "howItSupports": "Follows up mismatches with the provider through a ticket."}]}], "media": [{"type": "image", "src": "media/jbtd-hshs-jtbd-hshs-2.png", "title": "Household Fixed-Cost Saver JTBD infographic: Compare and switch insurance, energy and telecom in minutes without paperwork", "alt": "Enterprise infographic for the job \"Compare and switch insurance, energy and telecom in minutes without paperwork\" for customer \"Household Fixed-Cost Saver\"."}]}, {"id": "jtbd-hshs-3", "name": "Have someone watch my contracts and warn me when a better deal exists", "whatItIs": "Hand the renewal calendar of the household to Peasy: every brokered contract, and ideally the ones the family already had, stored per household with renewal dates, tariff and conditions, so that Peasy warns before a renewal, a price increase or a market move, re-compares and offers a switch that takes one call. The job replaces the folder of renewal letters and the good intention to check again next year. It also covers the small print: an insurer's premium indexation, an energy contract silently rolling over to a variable tariff, a telecom promotion ending.", "outcome": "Every contract of the household is in the vault with a renewal date, alerts arrive at least 30 days before a renewal or a detected saving, and the family accepts a re-comparison in one contact when the saving is real, so that the household's annual saving is repeated year after year.", "steps": [{"step": "Put all household contracts in the vault", "description": "Add the contracts Peasy brokered automatically and upload or type the others (an old car policy, the mortgage with another bank), with renewal dates and tariffs, and choose how the household wants to be warned: e-mail, SMS or a call.", "streamsNeeded": [{"id": "monitor-household-contracts-and-alert-savings", "name": "Monitor Household Contracts and Alert Savings", "howItSupports": "Stores every household contract with renewal dates, tariffs and alert preferences in the household account."}]}, {"step": "Receive an alert when a renewal or a better deal approaches", "description": "Get a warning at least 30 days before a renewal, when a premium indexation is announced, when an energy contract is about to roll over, or when the market has moved enough to save a stated amount; see the estimated saving before doing anything.", "streamsNeeded": [{"id": "monitor-household-contracts-and-alert-savings", "name": "Monitor Household Contracts and Alert Savings", "howItSupports": "Detects renewals, price changes and market moves and raises alerts with an estimated saving."}]}, {"step": "Accept the re-comparison and switch in one call", "description": "Reply to the alert or call the advisor, receive the updated comparison for that contract, and let the advisor execute the switch and the cancellation, as in the first switch.", "streamsNeeded": [{"id": "serve-customers-through-customer-care", "name": "Serve Customers Through Customer Care", "howItSupports": "Handles the alert follow-up by phone or chat and executes the resulting switch in one contact."}, {"id": "compare-and-switch-insurance", "name": "Compare and Switch Insurance", "howItSupports": "Re-quotes the policy across 11 insurers and binds the better one."}, {"id": "compare-and-switch-energy-contracts", "name": "Compare and Switch Energy Contracts", "howItSupports": "Re-compares the energy contract and executes the new switch."}]}, {"step": "See the savings add up over the years", "description": "Look at the household account once a year to see the savings realised per contract and what the barometer now says about the household versus the Belgian average, and add a new contract when the family buys a second car or moves.", "streamsNeeded": [{"id": "monitor-household-contracts-and-alert-savings", "name": "Monitor Household Contracts and Alert Savings", "howItSupports": "Shows realised savings per contract and refreshes the barometer as contracts change."}]}], "media": [{"type": "image", "src": "media/jbtd-hshs-jtbd-hshs-3.png", "title": "Household Fixed-Cost Saver JTBD infographic: Have someone watch my contracts and warn me when a better deal exists", "alt": "Enterprise infographic for the job \"Have someone watch my contracts and warn me when a better deal exists\" for customer \"Household Fixed-Cost Saver\"."}]}], "customerJourneyStories": [{"id": "journey-hshs-1", "name": "From a car insurance renewal shock to a household under monitoring", "linkedJobIds": ["jtbd-hshs-2", "jtbd-hshs-3"], "summary": "A family in Genk with two cars receives a car insurance renewal with a steep increase, discovers Aanbieders.be through its Google reviews and a friend, and adopts Peasy's compare-and-switch path by phone, staying because the advisor keeps watching every contract they hand over.", "stages": [{"stage": "Trigger", "narrative": "The car insurance renewal letter announces a premium increase after a small claim, and the same month the energy supplier warns that the fixed contract will roll over to a variable tariff. The parent who runs the budget realises the family has not compared anything since it moved in six years ago."}, {"stage": "Discovery", "narrative": "A friend at the football club says he switched energy and car insurance through Aanbieders.be in one phone call and never wrote a cancellation letter. A search shows 4.6 stars from 2,765 Google reviews, a free service, and a Verzekeringen.be comparison across 11 insurers; the Peasy homepage promises saving without hassle across insurance and energy under one roof."}, {"stage": "Evaluation", "narrative": "They check that the switch is free, that Peasy earns a referral fee from the provider and that they never contract with Peasy itself, and read a few reviews about cancellations handled correctly. They compare with the VREG V-test for energy and a direct insurer quote; what tips it is that an advisor does both switches and the cancellations for them."}, {"stage": "Trial", "narrative": "They run the car insurance comparison online, request a callback, and an advisor in Hasselt binds a cheaper policy with the same cover, cancels the old one at the renewal date and, in the same call, compares the energy contract on their digital meter and solar panels and switches it. The confirmation e-mail lists both effective dates."}, {"stage": "Engagement", "narrative": "They add the fire insurance, the internet pack and the four mobile plans to the household account, switch the telecom pack a month later under Easy Switch by chat, and start using the budget barometer to see where the family now sits against the Belgian average."}, {"stage": "Retention", "narrative": "A year later an alert warns of the energy contract's renewal and of a cheaper funeral insurance; one call renews both. The family stops keeping the folder of renewal letters, recommends Aanbieders.be at the club, and forwards every price increase e-mail to Peasy instead of reading it."}], "media": [{"type": "image", "src": "media/journey-hshs-hshs-1.png", "title": "Household Fixed-Cost Saver customer journey: From a car insurance renewal shock to a household under monitoring", "alt": "Enterprise journey storyboard for \"From a car insurance renewal shock to a household under monitoring\" for customer \"Household Fixed-Cost Saver\"."}]}, {"id": "journey-hshs-2", "name": "A budget barometer after the solar panels turns into three switches", "linkedJobIds": ["jtbd-hshs-1", "jtbd-hshs-2"], "summary": "A family in Brussels that just installed solar panels and a digital meter wants to know whether its contracts still fit, finds the Peasy budget barometer through a search on what solar panels and a digital meter do to the energy invoice, and adopts the barometer-then-switch path in French by chat, staying for the yearly check.", "stages": [{"stage": "Trigger", "narrative": "After installing solar panels and a digital meter, the first energy invoice is not what the installer promised, and a telecom price increase e-mail arrives the same week. The family wants to know whether it overpays across the board, not just for energy, but has no time for four comparison sites."}, {"stage": "Discovery", "narrative": "A search on what solar panels and a digital meter do to the energy invoice lands on a Peasy blog and the budget barometer on the French site, which benchmarks fixed costs against Belgian averages. A colleague mentions Mesfournisseurs.be as the place that switched her energy by phone."}, {"stage": "Evaluation", "narrative": "They test the barometer with real invoice amounts, see that energy and mobile stand out, and read how Peasy is paid: a referral fee from the provider, nothing from the household. They check the opening hours for chat in French and that solar panels and the digital meter are part of the energy comparison."}, {"stage": "Trial", "narrative": "By chat an advisor confirms the barometer's energy estimate against the invoice, runs the comparison with the solar and digital-meter parameters, and switches the contract; the four mobile plans are compared and switched the same week, and the confirmation lists the effective dates."}, {"stage": "Engagement", "narrative": "The family stores the fire and car insurance in the household account, accepts a re-quote of the fire policy across 11 insurers at the next renewal, and uses the barometer each January to see the household's position against the average."}, {"stage": "Retention", "narrative": "Alerts now cover every contract, the household's realised saving is visible per contract in the account, and when a neighbour installs solar panels the family sends them the barometer link rather than an explanation."}], "media": [{"type": "image", "src": "media/journey-hshs-hshs-2.png", "title": "Household Fixed-Cost Saver customer journey: A budget barometer after the solar panels turns into three switches", "alt": "Enterprise journey storyboard for \"A budget barometer after the solar panels turns into three switches\" for customer \"Household Fixed-Cost Saver\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-hshs-top", "name": "Annual household savings realised", "description": "Average saving per h
