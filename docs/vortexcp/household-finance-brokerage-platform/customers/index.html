currentValue": "4", "targetValue": "1.5", "icon": "kpi-hshs-bo-hshs-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Be the household's standing instruction to pay less: a barometer that shows where a family overpays against the Belgian average, switches of insurance, energy and telecom done in one contact with the old contract cancelled, and contracts watched year after year so that saving needs no calendar and no paperwork.", "timeHorizons": {"year1": {"focus": "Bring Verzekeringen.be and Aanbieders.be behind the single Peasy front door, make the budget barometer the entry point to comparisons, and let advisors in Hasselt and Oujda complete most switches and cancellations in one contact with energy comparisons that handle the digital meter, solar panels and the V-check invoice code.", "productTheme": "One front door, one contact per switch", "customerKPI": {"northStar": "Annual household savings realised", "supporting": ["Contracts switched per household", "Budget barometer completion rate"]}, "businessKPI": {"northStar": "Referral fee revenue from insurance, energy and telecom contracts", "revenueStreams": ["Referral fees paid by energy suppliers and telecom operators per executed switch (free for the household)", "Commissions paid by insurers on car, fire, funeral and outstanding-balance policies bound through Peasy", "Referral fees from charging-station and business energy and telecom offers for self-employed households"], "supporting": ["Insurance, energy and telecom contracts concluded per year", "Comparison-to-contract conversion rate"]}, "milestones": ["Route every completed barometer into the relevant comparison with the household facts pre-filled", "Accept the VREG V-check invoice code, meter type, digital meter and solar-panel data in the energy comparison and switch flow", "Complete switches and cancellations in one contact with confirmation e-mails that list the effective dates"]}, "year3": {"focus": "Make the household contract vault and proactive re-comparison the core of the relationship: every brokered contract monitored, alerts at least 30 days before renewal with a stated saving, cross-sell from mortgage households into insurance, energy and telecom, and self-service switching for standard cases so advisors focus on the complex ones.", "productTheme": "The household relationship, monitored contract by contract", "customerKPI": {"northStar": "Annual household savings realised", "supporting": ["Savings alert acceptance rate", "Households with all contracts in the vault"]}, "businessKPI": {"northStar": "Referral fee revenue from insurance, energy and telecom contracts", "revenueStreams": ["Referral fees and commissions from switches and policies across all monitored contracts", "Renewal commissions from re-comparisons triggered by monitoring alerts", "Referral fees from mortgage households cross-sold into insurance, energy and telecom"], "supporting": ["Contracts under monitoring per household", "Renewal switches from savings alerts per year"]}, "milestones": ["Store every brokered and uploaded contract with renewal dates and alert households at least 30 days before renewal with an estimated saving", "Offer one-tap acceptance of a re-comparison that an advisor executes, and self-service switching for standard energy and telecom cases", "Cross-sell every new mortgage household into the barometer and the vault within the first year"]}, "year5": {"focus": "AI-assisted monitoring that re-compares every household contract continuously on real-time partner tariffs, executes standard switches through partner APIs with an advisor supervising exceptions, and extends the household relationship to savings, pension and investment products through the Meilleurtaux group and a pan-European marketplace.", "productTheme": "Continuous re-comparison with human supervision", "customerKPI": {"northStar": "Annual household savings realised", "supporting": ["Identified savings confirmed by the advisor", "Old contracts cancelled by Peasy without a gap or double payment"]}, "businessKPI": {"northStar": "Referral fee revenue from insurance, energy and telecom contracts", "revenueStreams": ["Referral fees and commissions with real-time tariff and binding APIs of insurers, suppliers and operators", "Continuous re-comparison commissions across every monitored contract", "Savings, pension and investment products offered to monitored households through the Meilleurtaux group"], "supporting": ["Cost to serve per switch", "Self-service switches without advisor involvement"]}, "milestones": ["Re-compare every monitored contract continuously on real-time partner tariffs and propose switches with a stated, verified saving", "Execute standard energy, telecom and insurance switches through partner APIs with advisors handling exceptions", "Add savings, pension and investment products to the household account through the Meilleurtaux group"]}}}}]}, {"group": "Advisory Network", "description": "The people who turn comparisons into concluded contracts: hypotheek.experts in about 70 franchised hypotheek.winkel offices, the franchisees who run those offices, and the customer-care advisors in Hasselt and Oujda who quote, bind and switch insurance, energy and telecom by phone and chat. They do not pay for the platform; their production earns the referral commissions that banks, insurers and providers pay, shared with the office network.", "customers": [{"id": "hexp", "name": "Mortgage Expert (hypotheek.expert)", "description": "Works as a hypotheek.expert in one of the roughly 70 hypotheek.winkel offices across Flanders and Brussels, one of the more than 150 experts in the network. Often a career changer from banking, retail or real estate who was trained in the Peasy academy rather than hired from a bank, because the mortgage expert is a scarce-skill role the market cannot supply. Sits with first-time buyers, refinancers and self-employed borrowers in the office or on a video call, maps their income, savings, project and EPC situation, compares the daily conditions of 25 banks on one screen and recommends the best total package independently, because the buyer pays nothing and the chosen bank pays the referral commission. Issues feasibility certificates that buyers show to sellers, collects the documents for the credit file, submits it to the chosen bank, tracks approval and conditions, follows the compromis and the notary deed, and attaches outstanding-balance and fire insurance. Works under FSMA rules for credit intermediation, records the advice and suitability assessment on every file, and is judged on files completed, files that banks accept first time, insurance attached and the Trustpilot-style reviews buyers leave for the office.", "icon": "customer-hexp-portrait.jpg", "careAbout": ["The daily conditions of all 25 banks on one screen, correct as of this morning, so the recommendation given in the office is the one the bank will actually honour", "A file checklist that knows which documents each bank needs for this borrower type (employee, self-employed, renovation obligation, second home), so the file is complete before it is submitted", "Buyers who upload payslips, savings statements, the compromis and the EPC certificate through their account instead of bringing a folder to a second appointment", "Approval status, bank questions and conditions visible per file without calling the bank or searching a mailbox, so the buyer can be updated before they ask", "Advice records and suitability assessments that are captured while advising, not typed up afterwards for the FSMA file", "Colleagues in the office and the network who can pick up a file at a moment's notice with the complete history, so a holiday or illness never delays a buyer's deed"], "winsThem": ["A workbench that turns the buyer's situation into a same-screen comparison of 25 banks with the total cost, monthly repayment and conditions, and a comparison PDF the buyer can take home", "A credit file with per-bank document checklists, buyer uploads, e-signature and bank submission from the same place, with status tracked back from the bank", "Feasibility certificates generated from the comparison in minutes, so a buyer leaves the first appointment with proof to show sellers", "Outstanding-balance and fire insurance quoted and bound from the file at closing, with the health questions and the notary's requirements already handled", "Academy training and certification that took a career changer to an FSMA-compliant expert with a mentor, scripts and a knowledge base instead of trial and error on real buyers"], "theirFear": ["Recommending a bank on yesterday's rate sheet, having the bank quote different conditions, and losing the buyer's trust and the file to their own bank", "Submitting an incomplete file that bounces back with document requests while the buyer's compromis deadline runs, so the deed is at risk", "Missing an advice record or suitability detail that an FSMA inspection or a complaint later exposes, with the office and the expert's registration on the line"], "jobsToBeDone": [{"id": "jtbd-hexp-1", "name": "Turn every appointment into a complete, bank-ready file quickly", "whatItIs": "Run each buyer appointment so that the situation, project and documents are captured once and the credit file is complete before it goes to the bank: prepare from the simulator results and lead notes, map income, savings, existing loans and the property with its EPC and renovation obligation, request the documents each bank requires for this borrower type, let the buyer upload and e-sign from their account, check the file against the bank's checklist and submit it, then track questions and approval so the buyer never waits without knowing why.", "outcome": "A file that the chosen bank accepts without additional document requests, submitted within days of the appointment rather than weeks, with the buyer informed at every status change and the expert spending hours on advice rather than on chasing paperwork.", "steps": [{"step": "Prepare the appointment from the lead and simulation", "description": "Open the routed lead before the buyer arrives: the simulator inputs (income, savings, budget, monthly repayment), the requested project (first home, refinancing, new build, self-employed), the office or video-call slot, and any uploaded proposal. Draft the questions still open so the appointment starts from what the buyer already told Peasy rather than from a blank form.", "streamsNeeded": [{"id": "book-and-hold-an-advisory-appointment", "name": "Book and Hold an Advisory Appointment", "howItSupports": "Delivers the appointment with the lead's context, channel (office or video call) and preparation notes to the expert's agenda."}, {"id": "simulate-and-check-mortgage-feasibility", "name": "Simulate and Check Mortgage Feasibility", "howItSupports": "Provides the buyer's simulation results and feasibility inputs so the expert reuses them instead of re-asking."}]}, {"step": "Map the buyer's situation and project in the workbench", "description": "During the appointment capture income per borrower, savings and own contribution, existing loans and consumer credit, family situation, the property price, the EPC label and the renovation obligation for low-EPC homes, and notary costs, in the structured intake that feeds the comparison and the advice record at the same time.", "streamsNeeded": [{"id": "compare-mortgage-offers-across-banks", "name": "Compare Mortgage Offers Across Banks", "howItSupports": "Captures the borrower and project data in the structure the 25-bank comparison and the advice record both use."}, {"id": "comply-with-fsma-and-data-protection", "name": "Comply with FSMA and Data Protection", "howItSupports": "Records consent and the suitability inputs during the appointment so the FSMA advice record is built rather than reconstructed."}]}, {"step": "Request and collect the documents the bank will need", "description": "Generate the document checklist for the chosen bank and borrower type (payslips or tax returns for the self-employed, savings statements, identity, the compromis, the EPC certificate, renovation quotes) and send it to the buyer's account, where they upload from their phone and see what is still missing; chase gaps with a reminder instead of a phone call.", "streamsNeeded": [{"id": "assemble-and-submit-the-loan-file", "name": "Assemble and Submit the Loan File", "howItSupports": "Provides per-bank document checklists, buyer uploads, missing-document reminders and completeness checks on the credit file."}]}, {"step": "Check completeness and submit the file to the bank", "description": "Run the completeness check against the bank's requirements, add the advice record and the signed suitability assessment, let the buyer e-sign the application and submit through the bank channel; note the submission date so the buyer's compromis deadline and the bank's decision window are visible on the file.", "streamsNeeded": [{"id": "assemble-and-submit-the-loan-file", "name": "Assemble and Submit the Loan File", "howItSupports": "Submits the complete file to the chosen bank through the integration or portal and stamps the submission on the file."}, {"id": "comply-with-fsma-and-data-protection", "name": "Comply with FSMA and Data Protection", "howItSupports": "Ensures the advice record and suitability assessment are attached before the file can be submitted."}]}, {"step": "Track bank questions and approval and keep the buyer informed", "description": "Follow the file's status from the bank: information requests, approval, conditions and the offer's validity. Answer document requests from the file, update the buyer through their account at each change and escalate to the bank contact when the decision window is about to collide with the compromis date.", "streamsNeeded": [{"id": "assemble-and-submit-the-loan-file", "name": "Assemble and Submit the Loan File", "howItSupports": "Tracks approval status, bank questions and conditions per file and notifies the expert and the buyer of every change."}]}], "media": [{"type": "image", "src": "media/jbtd-hexp-jtbd-hexp-1.png", "title": "Mortgage Expert (hypotheek.expert) JTBD infographic: Turn every appointment into a complete, bank-ready file quickly", "alt": "Enterprise infographic for the job \"Turn every appointment into a complete, bank-ready file quickly\" for customer \"Mortgage Expert (hypotheek.expert)\"."}]}, {"id": "jtbd-hexp-2", "name": "Advise the best total package across 25 banks independently", "whatItIs": "Give each buyer a recommendation that is demonstrably the best total package for their situation, not just the lowest rate: compare the daily conditions of 25 banks on one screen, including fixed and variable formulas, duration, own contribution and the conditions attached (bank account, insurance, salary domiciliation), review proposals the buyer already received from their own bank, explain the comparison in plain language with a PDF the buyer can take home, and record why the recommendation fits the buyer so the advice stands up to the FSMA suitability test and to a buyer's second thoughts.", "outcome": "Buyers leave the appointment understanding which bank and formula was recommended and why, with a comparison document they trust, an independent recommendation that beats or matches the proposal from their own bank, and an advice record that shows the expert compared the market rather than pushed a partner.", "steps": [{"step": "Compare the daily conditions of 25 banks for this buyer", "description": "Run the comparison from the captured situation: rates per formula and duration, total cost over the loan, monthly repayment, own-contribution requirements and the conditions attached to each rate. Filter banks that would decline this profile (self-employed, high loan-to-value, low EPC) so the buyer only sees realistic options.", "streamsNeeded": [{"id": "compare-mortgage-offers-across-banks", "name": "Compare Mortgage Offers Across Banks", "howItSupports": "Produces the same-screen comparison of the daily conditions of 25 banks with total cost, monthly repayment and attached conditions per option."}]}, {"step": "Review a proposal the buyer received elsewhere", "description": "When the buyer uploaded a proposal from their own bank or another broker, read it against the comparison: rate, formula, attached products and fees, and show in numbers whether Peasy can beat it, match it, or whether the buyer should sign it. Give an honest verdict even when it means no file for the office.", "streamsNeeded": [{"id": "compare-mortgage-offers-across-banks", "name": "Compare Mortgage Offers Across Banks", "howItSupports": "Places the uploaded proposal next to the 25-bank comparison so the verdict is a side-by-side difference in total cost."}, {"id": "refinance-or-extend-an-existing-loan", "name": "Refinance or Extend an Existing Loan", "howItSupports": "Handles the case where the proposal concerns an existing loan and a refinancing or additional loan is the better route."}]}, {"step": "Explain the recommendation and hand over the comparison document", "description": "Walk the buyer through the top options and explain the trade-offs (a lower rate with a compulsory account and insurance versus a slightly higher rate with freedom), the effect of the renovation obligation and the outstanding-balance cover on the monthly budget, and hand over the comparison PDF and, where useful, the feasibility certificate.", "streamsNeeded": [{"id": "compare-mortgage-offers-across-banks", "name": "Compare Mortgage Offers Across Banks", "howItSupports": "Generates the comparison PDF with the recommended package and alternatives for the buyer to take home."}, {"id": "simulate-and-check-mortgage-feasibility", "name": "Simulate and Check Mortgage Feasibility", "howItSupports": "Issues the feasibility certificate from the same data when the buyer still has to convince a seller."}]}, {"step": "Record the advice and suitability rationale", "description": "Capture why this package fits the buyer's situation and preferences, which alternatives were shown and why they were not chosen, and the buyer's acknowledgement, in the advice record required for credit intermediation, so the file is audit-ready and a colleague taking over understands the reasoning.", "streamsNeeded": [{"id": "comply-with-fsma-and-data-protection", "name": "Comply with FSMA and Data Protection", "howItSupports": "Stores the advice record and suitability assessment with the compared options and the buyer's acknowledgement as FSMA evidence."}]}], "media": [{"type": "image", "src": "media/jbtd-hexp-jtbd-hexp-2.png", "title": "Mortgage Expert (hypotheek.expert) JTBD infographic: Advise the best total package across 25 banks independently", "alt": "Enterprise infographic for the job \"Advise the best total package across 25 banks independently\" for customer \"Mortgage Expert (hypotheek.expert)\"."}]}, {"id": "jtbd-hexp-3", "name": "Follow every file to the notary and attach the right insurance", "whatItIs": "Carry each approved file through to disbursement without losing the buyer to friction after approval: confirm the bank's conditions and the offer validity, align the compromis and deed dates with the notary, quote and bind the outstanding-balance insurance with its health questions and the fire insurance the bank requires, chase the last documents, and follow the deed and disbursement so the buyer's money is at the notary on the day. Then hand the household to the monitoring service so the insurance and, later, energy and telecom are re-compared, turning one mortgage into a lasting relationship with the office.", "outcome": "Every approved loan reaches the notary deed on the planned date with the outstanding-balance and fire insurance in place, the buyer rates the office highly, and the household's contracts are stored for monitoring so the office and Peasy hear from them again before the next decision.", "steps": [{"step": "Confirm approval conditions and plan the deed with the notary", "description": "Read the bank's approval and conditions, check the offer validity against the compromis and the deed date, and exchange with the notary what the bank needs for the deed (mortgage mandate, insurance proof, disbursement instructions), recording every milestone on the file so the buyer sees the path to the deed.", "streamsNeeded": [{"id": "close-the-loan-through-notary-and-insurance", "name": "Close the Loan Through Notary and Insurance", "howItSupports": "Tracks the closing milestones from approval to compromis, notary deed and disbursement with dates and responsible parties."}]}, {"step": "Quote and bind outstanding-balance and fire insurance", "description": "Quote the outstanding-balance insurance with the health questions and the cover split between borrowers, and the fire insurance the bank requires, across the insurers on the comparison, explain the options against the bank's bundled offer, and bind the chosen policies from the file so the proof reaches the bank and the notary in time.", "streamsNeeded": [{"id": "close-the-loan-through-notary-and-insurance", "name": "Close the Loan Through Notary and Insurance", "howItSupports": "Links the insurance requirements of the bank to the loan file and collects the proof needed for the deed."}, {"id": "compare-and-switch-insurance", "name": "Compare and Switch Insurance", "howItSupports": "Quotes and binds outstanding-balance and fire insurance across 11 insurers from the buyer's data."}]}, {"step": "Follow the deed and disbursement and close the file", "description": "Confirm that the bank's funds are at the notary on the deed date, that the mortgage mandate and insurance proof are in place, and that the buyer knows what happens on the day; after the deed, close the file, confirm the commission trail for the office and ask the buyer for a review.", "streamsNeeded": [{"id": "close-the-loan-through-notary-and-insurance", "name": "Close the Loan Through Notary and Insurance", "howItSupports": "Confirms disbursement and deed completion and closes the file with its commission trail."}, {"id": "manage-partners-tariffs-and-commissions", "name": "Manage Partners, Tariffs and Commissions", "howItSupports": "Records the concluded loan and bound policies so the referral commission is reconciled with the bank and paid to the office."}]}, {"step": "Hand the household over to contract monitoring", "description": "Store the loan, the policies and the buyer's consent in the household's contract vault, set the renewal and re-comparison triggers, and introduce the customer-care team for energy and telecom, so the office keeps a relationship with the household beyond the deed.", "streamsNeeded": [{"id": "monitor-household-contracts-and-alert-savings", "name": "Monitor Household Contracts and Alert Savings", "howItSupports": "Registers the brokered loan and policies per household and schedules alerts when a better option appears."}]}], "media": [{"type": "image", "src": "media/jbtd-hexp-jtbd-hexp-3.png", "title": "Mortgage Expert (hypotheek.expert) JTBD infographic: Follow every file to the notary and attach the right insurance", "alt": "Enterprise infographic for the job \"Follow every file to the notary and attach the right insurance\" for customer \"Mortgage Expert (hypotheek.expert)\"."}]}], "customerJourneyStories": [{"id": "journey-hexp-1", "name": "Becoming a hypotheek.expert through the academy as a career changer", "linkedJobIds": ["jtbd-hexp-1", "jtbd-hexp-2"], "summary": "A branch adviser whose bank keeps closing local branches joins hypotheek.winkel as a career changer, is trained and certified in the Peasy academy on the workbench and the FSMA rules, doubts whether she can compare 25 banks independently after years of selling one, and within a year runs a full caseload in an office near Leuven with files that banks accept first time.", "stages": [{"stage": "Trigger", "narrative": "After her bank announces another round of branch closures and pushes mortgage conversations to a call centre, the adviser looks for a role where she still sits across from a buyer. A hypotheek.winkel vacancy in a nearby office promises exactly that, plus training, because the mortgage expert is a scarce-skill role the network grows itself."}, {"stage": "Discovery", "narrative": "In the academy she meets the workbench on day one: the intake, the same-screen comparison of the daily conditions of 25 banks, the feasibility certificate and the credit file with its per-bank checklists. She shadows a senior expert through real appointments and sees that the advice record is written while advising, not afterwards for the inspector."}, {"stage": "Evaluation", "narrative": "Her doubt is independence: after years of one bank's products, can she recommend against a bank when the numbers say so, and will the tooling let her? The comparison shows total cost across all 25 banks with the attached conditions, the academy exam covers the FSMA suitability duty, and a mentor reviews her first recommendations. That, and the brand's 4.8-out-of-5 Trustpilot rating, convinces her."}, {"stage": "Trial", "narrative": "Her first own files are two first-time buyers and a refinancing case, each checked by her mentor before submission. One file bounces back for a missing self-employed tax return, which the checklist now flags for that borrower type; the other two are accepted first time and reach the notary within the compromis deadline."}, {"stage": "Engagement", "narrative": "Within a year she carries a full caseload: appointments prepared from the lead and simulation, comparison and advice record captured in one sitting, documents uploaded by buyers to their account, submissions tracked from the bank, and insurance bound from the file at closing. Her Trustpilot mentions arrive by name."}, {"stage": "Retention", "narrative": "She stays because the work is independent advice with the paperwork done by the workbench, her commission share grows with files completed rather than with one bank's targets, and she now mentors the next academy intake, feeding the cases she meets in Leuven into the checklists and the knowledge base."}], "media": [{"type": "image", "src": "media/journey-hexp-hexp-1.png", "title": "Mortgage Expert (hypotheek.expert) customer journey: Becoming a hypotheek.expert through the academy as a career changer", "alt": "Enterprise journey storyboard for \"Becoming a hypotheek.expert through the academy as a career changer\" for customer \"Mortgage Expert (hypotheek.expert)\"."}]}, {"id": "journey-hexp-2", "name": "Adopting the expert workbench as the single place every file lives", "linkedJobIds": ["jtbd-hexp-1", "jtbd-hexp-3"], "summary": "The experts of a three-person office move their files from spreadsheets, bank portals and personal mailboxes onto the expert workbench after a buyer nearly lost a compromis because a bank's document request sat unread, and end up submitting complete files faster, binding insurance from the file and handing households to monitoring, with head office seeing production for the first time.", "stages": [{"stage": "Trigger", "narrative": "A buyer's compromis deadline is three days away when the office discovers that the bank's request for a missing savings statement went to the mailbox of an expert on holiday. The file is rescued with a frantic weekend, but the franchisee decides the office can no longer run mortgages from spreadsheets and bank portals."}, {"stage": "Discovery", "narrative": "At the next network day the head-office team demonstrates the expert workbench: the intake feeding the 25-bank comparison, per-bank checklists with buyer uploads, submission and status tracked from the bank, closing milestones with the notary, insurance bound from the file and a handover to contract monitoring. The experts recognise their own process with the mailboxes removed."}, {"stage": "Evaluation", "narrative": "The experts ask whether the workbench will nudge them toward banks that pay more, and whether tracking files per expert will be used against them. Head office shows that the comparison ranks on total cost for the buyer, that the commission is reconciled per bank transparently, and that the production dashboards are shared with the franchisee for planning. The FSMA advice record built during advising settles the rest."}, {"stage": "Trial", "narrative": "The office runs one month with every new file in the workbench while older files stay in the spreadsheet. Bank questions land on the file, buyers upload documents from their phone, and two files that would have needed a second appointment are submitted the same week. A holiday handover takes a note instead of a mailbox search."}, {"stage": "Engagement", "narrative": "Every file now lives in the workbench: experts prepare appointments from the lead, compare and record advice in one sitting, submit and track, bind outstanding-balance and fire insurance at closing and hand the household to monitoring. Head office sees files, conversion and insurance attach per office and pays commissions from the same trail."}, {"stage": "Retention", "narrative": "Nobody wants the spreadsheets back: files that banks accept first time have risen, compromis deadlines are visible on every file, and the experts point new colleagues to the workbench as the reason a small office can run a full caseload without losing a buyer to a missed e-mail."}], "media": [{"type": "image", "src": "media/journey-hexp-hexp-2.png", "title": "Mortgage Expert (hypotheek.expert) customer journey: Adopting the expert workbench as the single place every file lives", "alt": "Enterprise journey storyboard for \"Adopting the expert workbench as the single place every file lives\" for customer \"Mortgage Expert (hypotheek.expert)\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-hexp-top", "name": "Files completed per expert per month", "description": "Number of credit files per expert per month that are complete, submitted to the chosen bank and carry a finished advice record, averaged across the network. Modeled seed value derived from >150 experts and the post-contraction Belgian mortgage market; not an official Peasy figure.", "unit": "files per expert per month", "currentValue": "7", "targetValue": "11", "link": "https://dashboard.example.com/household-finance-brokerage-platform/customers/hexp/kpis/co-hexp-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-hexp-co-hexp-top.png"}, "branches": [{"id": "co-hexp-b1", "name": "File speed and completeness", "description": "How quickly an appointment becomes a complete, submitted file and how much of the document work the buyer and the workbench absorb instead of the expert.", "currentValue": "62", "icon": "kpi-hexp-co-hexp-b1.png", "children": [{"id": "co-hexp-b1-c1", "name": "File first-time-complete rate", "description": "Share of submitted credit files the bank processes without an additional document or information request.", "unit": "%", "currentValue": "64", "targetValue": "85", "icon": "kpi-hexp-co-hexp-b1-c1.png", "children": [{"id": "co-hexp-b1-c1-l1", "name": "Documents collected before first submission", "description": "Share of the bank's required documents present in the file at the moment of first submission.", "unit": "%", "currentValue": "80", "targetValue": "95", "icon": "kpi-hexp-co-hexp-b1-c1-l1.png", "children": []}, {"id": "co-hexp-b1-c1-l2", "name": "Bank information requests per file", "description": "Average number of document or information requests a bank sends back per submitted file.", "unit": "requests", "currentValue": "1.6", "targetValue": "0.5", "icon": "kpi-hexp-co-hexp-b1-c1-l2.png", "children": []}]}, {"id": "co-hexp-b1-c2", "name": "Days from appointment to bank submission", "description": "Working days from the first advisory appointment to the file being submitted to the chosen bank.", "unit": "working days", "currentValue": "12", "targetValue": "6", "icon": "kpi-hexp-co-hexp-b1-c2.png", "children": [{"id": "co-hexp-b1-c2-l1", "name": "Buyer document upload turnaround", "description": "Working days from the checklist being sent to the buyer to the last requested document being uploaded.", "unit": "working days", "currentValue": "7", "targetValue": "3", "icon": "kpi-hexp-co-hexp-b1-c2-l1.png", "children": []}, {"id": "co-hexp-b1-c2-l2", "name": "Feasibility certificates issued at first appointment", "description": "Share of first appointments with a purchase project that end with a feasibility certificate issued from the workbench.", "unit": "%", "currentValue": "55", "targetValue": "75", "icon": "kpi-hexp-co-hexp-b1-c2-l2.png", "children": []}]}]}, {"id": "co-hexp-b2", "name": "Advice quality and follow-through", "description": "Whether the recommendation is independent and current across 25 banks, and whether the expert carries the file through closing with the insurance attached.", "currentValue": "70", "icon": "kpi-hexp-co-hexp-b2.png", "children": [{"id": "co-hexp-b2-c1", "name": "Banks compared per recommendation", "description": "Average number of banks whose current conditions were included in the comparison behind a recorded recommendation.", "unit": "banks", "currentValue": "18", "targetValue": "25", "icon": "kpi-hexp-co-hexp-b2-c1.png", "children": [{"id": "co-hexp-b2-c1-l1", "name": "Rate sheet age at comparison time", "description": "Average hours between the last bank conditions update and the comparison shown to the buyer.", "unit": "hours", "currentValue": "24", "targetValue": "4", "icon": "kpi-hexp-co-hexp-b2-c1-l1.png", "children": []}, {"id": "co-hexp-b2-c1-l2", "name": "Recommendation accepted by buyer rate", "description": "Share of recorded recommendations the buyer proceeds with into a credit file at Peasy.", "unit": "%", "currentValue": "72", "targetValue": "85", "icon": "kpi-hexp-co-hexp-b2-c1-l2.png", "children": []}]}, {"id": "co-hexp-b2-c2", "name": "In es per month and spends the hours saved on the conversation that makes buyers recommend the office.", "timeHorizons": {"year1": {"focus": "Put every office on the expert workbench with per-bank checklists, buyer uploads, submission tracking and the advice record built in, so files are accepted first time while mortgage volumes recover and Meilleurtaux's bank relationships are added to the comparison.", "productTheme": "Bank-ready files from one workbench", "customerKPI": {"northStar": "Files completed per expert per month", "supporting": ["File first-time-complete rate", "Days from appointment to bank submission"]}, "businessKPI": {"northStar": "Referral commission per expert per month", "revenueStreams": ["Bank referral commissions per concluded mortgage loan", "Insurer commissions on outstanding-balance and fire insurance bound at closing"], "supporting": ["Loans concluded per expert per month", "Cost per completed file"]}, "milestones": ["Run every new file in the ~70 offices from the workbench with per-bank document checklists and buyer uploads to the customer account", "Track bank submissions, questions and approvals on the file and show compromis deadlines to expert and buyer", "Capture the FSMA advice record and suitability assessment during the appointment on every file"]}, "year3": {"focus": "Let the workbench prepare the file: documents pre-collected from the buyer's account before the appointment, comparison and insurance quotes generated from one intake, closing milestones synchronised with notaries and banks, and every closed loan handed to monitoring so the household comes back to the office.", "productTheme": "Prepared appointments and closing without friction", "customerKPI": {"northStar": "Files completed per expert per month", "supporting": ["Insurance attach rate", "Banks compared per recommendation"]}, "businessKPI": {"northStar": "Referral commission per expert per month", "revenueStreams": ["Bank referral commissions per concluded mortgage loan", "Insurance commissions attached at closing", "Cross-sell commissions from monitored households referred to customer care"], "supporting": ["Average commission per concluded loan", "Advice records complete at audit"]}, "milestones": ["Pre-collect documents and simulation data from the customer account so most appointments start with a half-built file", "Quote and bind outstanding-balance and fire insurance from the loan file at closing in every office", "Hand every closed loan to contract monitoring with consent and renewal triggers set"]}, "year5": {"focus": "Let AI-assisted intake, comparison narrative and file assembly work under the expert's supervision, so one expert oversees far more files across banks connected by real-time pricing and binding APIs, with the human recommendation and the FSMA record as the differentiator against bank direct channels and online-only brokers.", "productTheme": "Expert-supervised AI file assembly", "customerKPI": {"northStar": "Files completed per expert per month", "supporting": ["Documents collected before first submission", "Recommendation accepted by buyer rate"]}, "businessKPI": {"northStar": "Referral commission per expert per month", "revenueStreams": ["Bank referral commissions through real-time pricing and binding APIs", "Insurance and cross-sell commissions from the household relationship", "Consumer-credit and savings-product commissions through the Meilleurtaux group"], "supporting": ["Expert hours per completed file", "Submitted files approved by the bank"]}, "milestones": ["Deploy intake and file-assembly assistants that draft the comparison narrative, checklist and advice record for expert approval", "Submit files and receive decisions through bank APIs with real-time pricing across the combined 81-office network", "Grow files per expert well beyond today's level while holding first-time-complete and audit results at target"]}}}}, {"id": "frnc", "name": "Office Franchisee", "description": "Independent entrepreneur who runs one or more of the roughly 70 hypotheek.winkel offices in Flanders and Brussels under franchise, often a former mortgage expert or credit broker who wanted a business of their own and joined a network that grew from 63 locations and 83 experts in January 2024 to more than 150 experts today. Employs two or three experts per office, sometimes works files personally, and depends on the brand for demand: the appointments and leads routed from the peasy.be and hypotheek.winkel simulators, callbacks and upload requests, Google reviews and referrals from past buyers. Recruits experts in a market where the role is a recognised shortage occupation, sends career changers to the academy, keeps the office FSMA-compliant and pays for rent, staff and local marketing from a share of the referral commissions that banks and insurers pay to the network. Reads production, conversion and commission dashboards to decide when to hire, which lead sources to push locally and which files are stuck, negotiates the franchise terms and the lead allocation with head office, and now watches how the Meilleurtaux acquisition and its 81-office network will change territories, tooling and the commission model.", "icon": "customer-frnc-portrait.jpg", "careAbout": ["A steady flow of qualified appointments routed to the office from the brand's simulators, callbacks and referrals, so experts are busy with buyers rather than with prospecting", "Clear rules for lead routing between neighbouring offices and for who owns a household that moves, especially now that Meilleurtaux offices join the network", "Production, conversion and commission per expert and per lead source, current enough to steer the month rather than to explain the quarter", "Commission statements from head office that reconcile to the files the office closed, with disputes resolved before payout rather than after", "Experts who stay: an academy that turns a recruit into a productive expert quickly, tooling that makes the job doable, and a commission share that rewards them", "Compliance handled by the network (FSMA registrations, advice-record standards, complaints) so a small office is never the weak spot in an inspection"], "winsThem": ["Lead routing that sends every website, callback and upload request to the nearest office within minutes, with the buyer's simulation and project attached, and a no-show recovery that re-books missed appointments", "An office dashboard with appointments, files, conversion, insurance attach and commission per expert and per lead source, plus the stuck files that need a call today", "Commission statements per file that reconcile automatically against bank and insurer payments, with a dispute flow and predictable payout dates", "Academy intake slots, onboarding checklists and workbench training that make a career changer productive in months, and expert-level dashboards that show them their own progress", "Local marketing kits, review collection and office-page management on the brand sites, so the office's Google rating and local presence grow without an agency"], "theirFear": ["The brand's lead engine favouring larger or newer offices, or a neighbouring Meilleurtaux office, so the rent and salaries of the office are paid while appointments dry up", "Losing a trained expert to a bank or a competing broker after investing a year in their academy training, and not being able to fill the seat for months", "A commission statement that does not match the office's own count of closed files, with head office and the bank pointing at each other while payroll is due"], "jobsToBeDone": [{"id": "jtbd-frnc-1", "name": "Keep my office fed with qualified appointments", "whatItIs": "Secure enough qualified appointments per month for the office's experts by working the brand's demand engine rather than prospecting: make sure the office is set up correctly for routing and opening hours on the brand sites, get every routed lead called back within a working day and booked into an expert's agenda in the office or by video call, recover no-shows and cold leads, collect reviews that raise the office's local ranking, and add local marketing where the routed volume leaves capacity unused, while agreeing with head office how leads are shared with neighbouring and newly joined offices.", "outcome": "Each expert's agenda is filled with prepared appointments from routed leads and referrals, the office's callback and no-show rates are better than the network average, and the franchisee knows which lead sources produce the files that close rather than the ones that only fill the calendar.", "steps": [{"step": "Configure the office for routing and booking on the brand sites", "description": "Keep the office profile current on peasy.be and hypotheekwinkel.be: address and service area, opening hours, video-call availability, expert agendas and languages, so the office locator, the appointment booking and the lead routing send the right buyers at the right time and none are lost to a full or wrongly configured agenda.", "streamsNeeded": [{"id": "run-the-franchise-office-network", "name": "Run the Franchise Office Network", "howItSupports": "Maintains the office profile, territory, agendas and routing rules that decide which leads and bookings reach the office."}, {"id": "book-and-hold-an-advisory-appointment", "name": "Book and Hold an Advisory Appointment", "howItSupports": "Exposes the office's expert agendas and video-call slots to the online booking flow."}]}, {"step": "Work every routed lead within a working day", "description": "Watch the routed leads (simulator sign-ups, callback requests, uploaded proposals, feasibility requests) as they arrive, have them called back within a working day by an expert or the office assistant, qualify the project and budget, and book the appointment with the simulation and notes attached so the expert is prepared.", "streamsNeeded": [{"id": "run-the-franchise-office-network", "name": "Run the Franchise Office Network", "howItSupports": "Routes leads to the office with source, simulation data and a service-level timer, and flags leads not contacted in time."}, {"id": "book-and-hold-an-advisory-appointment", "name": "Book and Hold an Advisory Appointment", "howItSupports": "Books the qualified lead into an expert's agenda with the preparation notes and sends confirmations and reminders."}]}, {"step": "Recover no-shows and reactivate cold leads", "description": "Follow up buyers who missed their appointment or went quiet after a feasibility check: re-book, offer a video call, or ask whether they signed elsewhere, and record the outcome so the office learns which lead sources produce serious buyers and which need a different follow-up script.", "streamsNeeded": [{"id": "book-and-hold-an-advisory-appointment", "name": "Book and Hold an Advisory Appointment", "howItSupports": "Tracks no-shows and open bookings and supports re-booking and reminder flows."}, {"id": "serve-customers-through-customer-care", "name": "Serve Customers Through Customer Care", "howItSupports": "Lets customer care take over reactivation calls and callbacks the office cannot handle in time."}]}, {"step": "Grow local demand with reviews and local marketing", "description": "Ask every closed buyer for a Google or Trustpilot review, keep the office page and its reviews current, and run local actions (open days, partnerships with local estate agents, renovation-obligation information evenings) with the brand's kits when routed volume leaves experts with free slots.", "streamsNeeded": [{"id": "run-the-franchise-office-network", "name": "Run the Franchise Office Network", "howItSupports": "Provides local marketing kits, review collection and office-page management with the office's lead-source reporting."}]}], "media": [{"type": "image", "src": "media/jbtd-frnc-jtbd-frnc-1.png", "title": "Office Franchisee JTBD infographic: Keep my office fed with qualified appointments", "alt": "Enterprise infographic for the job \"Keep my office fed with qualified appointments\" for customer \"Office Franchisee\"."}]}, {"id": "jtbd-frnc-2", "name": "Recruit, train and retain experts and stay compliant", "whatItIs": "Keep the office staffed with certified, productive experts in a market where the mortgage expert is a shortage occupation: recruit career changers and experienced brokers, place recruits in the academy so they become FSMA-compliant and productive on the workbench within months, mentor them through their first files, keep each expert's registration, training hours and advice-record quality in order, pay a commission share that rewards production and insurance attach, and see early when an expert is overloaded or about to leave, so the office never has an empty seat during a busy season.", "outcome": "The office runs with a full team of certified experts, new recruits reach full productivity within the planned months, expert turnover stays below the network average, and an FSMA inspection or a complaint finds the office's registrations, advice records and complaint handling in order.", "steps": [{"step": "Recruit and place candidates in the academy", "description": "Source candidates through the brand's recruiting campaigns and the franchisee's own network, assess fit for advisory work, and book them into the next academy intake with the onboarding checklist, the workbench training and the FSMA knowledge requirements, so a recruit has a start date and a certification path before signing.", "streamsNeeded": [{"id": "train-and-certify-advisors-in-the-academy", "name": "Train and Certify Advisors in the Academy", "howItSupports": "Provides academy intake planning, curriculum and certification tracking for the office's recruits."}, {"id": "run-the-franchise-office-network", "name": "Run the Franchise Office Network", "howItSupports": "Registers the expert in the office profile and starts the onboarding checklist and workbench access."}]}, {"step": "Mentor new experts through their first files", "description": "Pair each recruit with an experienced expert who reviews their comparisons, advice records and files before submission during the first months, uses the workbench's file and QA views to spot recurring mistakes, and gradually releases them to independent work as first-time-complete and audit results reach the office standard.", "streamsNeeded": [{"id": "train-and-certify-advisors-in-the-academy", "name": "Train and Certify Advisors in the Academy", "howItSupports": "Tracks the recruit's mentored files, review findings and the release to independent work."}, {"id": "assemble-and-submit-the-loan-file", "name": "Assemble and Submit the Loan File", "howItSupports": "Gives the mentor visibility of the recruit's files, completeness checks and bank feedback."}]}, {"step": "Keep registrations, training hours and advice records in order", "description": "Maintain each expert's FSMA registration, continuing-education hours and the office's complaint register, sample advice records and suitability assessments against the network standard, and fix findings before the network's compliance team or an inspector sees them.", "streamsNeeded": [{"id": "comply-with-fsma-and-data-protection", "name": "Comply with FSMA and Data Protection", "howItSupports": "Holds the intermediary registrations, training evidence, advice-record samples and complaint handling per office."}]}, {"step": "Reward and retain experts with transparent commission", "description": "Show each expert their production, conversion, insurance attach and commission share on their own dashboard, pay the share from the reconciled statements on predictable dates, and use the network's engagement signals and workload view to act before a good expert burns out or is poached by a bank.", "streamsNeeded": [{"id": "run-the-franchise-office-network", "name": "Run the Franchise Office Network", "howItSupports": "Provides per-expert production and retention dashboards and the workload view of the office."}, {"id": "manage-partners-tariffs-and-commissions", "name": "Manage Partners, Tariffs and Commissions", "howItSupports": "Delivers reconciled commission statements per file from which the expert's share is calculated and paid."}]}], "media": [{"type": "image", "src": "media/jbtd-frnc-jtbd-frnc-2.png", "title": "Office Franchisee JTBD infographic: Recruit, train and retain experts and stay compliant", "alt": "Enterprise infographic for the job \"Recruit, train and retain experts and stay compliant\" for customer \"Office Franchisee\"."}]}, {"id": "jtbd-frnc-3", "name": "See my office's production, conversion and commissions clearly", "whatItIs": "Steer the office from numbers rather than from gut feeling: see appointments, files, submissions, approvals, deeds, insurance attached and commission per expert, per lead source and per bank, current to the day; spot stuck files and lost buyers early; compare the office with the network and with its own previous months; reconcile commission statements against the office's closed files and resolve disputes before payout; and take the decisions the numbers ask for, such as hiring, shifting local marketing or coaching an expert on conversion.", "outcome": "The franchisee knows on any day where the month stands, which files need attention and what the payout will be, commission disputes are rare and resolved before payment, and decisions about hiring and marketing are taken from the office's own conversion data rather than from the last hectic week.", "steps": [{"step": "Review the daily production and stuck-file view", "description": "Start the day from the office dashboard: appointments held and booked, files opened, submitted and approved, deeds planned this month, insurance attached, and the list of files stuck at the buyer, the bank or the notary for longer than the network norm, so the franchisee can call the expert or the bank contact before a compromis deadline is lost.", "streamsNeeded": [{"id": "run-the-franchise-office-network", "name": "Run the Franchise Office Network", "howItSupports": "Provides the office's production and stuck-file dashboards per expert and per stage."}, {"id": "assemble-and-submit-the-loan-file", "name": "Assemble and Submit the Loan File", "howItSupports": "Feeds file stages, submission dates and bank statuses into the office view."}]}, {"step": "Analyse conversion per expert, lead source and bank", "description": "Look at lead-to-appointment, appointment-to-file and file-to-deed conversion per expert and per lead source, at which banks decline or delay the office's files, and at the office's rank in the network, to decide where coaching, a different follow-up script or a conversation with a bank contact is needed.", "streamsNeeded": [{"id": "run-the-franchise-office-network", "name": "Run the Franchise Office Network", "howItSupports": "Provides conversion funnels and network benchmarks per office, expert, lead source and bank."}, {"id": "compare-mortgage-offers-across-banks", "name": "Compare Mortgage Offers Across Banks", "howItSupports": "Supplies which banks were recommended and chosen per file for the per-bank conversion view."}]}, {"step": "Reconcile commission statements and resolve disputes", "description": "Match the monthly commission statement from head office against the office's closed files and bound policies, flag missing or wrongly attributed files and the bank or insurer behind them, and follow the dispute to resolution before the payout date, so payroll and rent are paid from a number the franchisee trusts.", "streamsNeeded": [{"id": "manage-partners-tariffs-and-commissions", "name": "Manage Partners, Tariffs and Commissions", "howItSupports": "Reconciles bank and insurer commissions per file, produces the office statement and runs the dispute flow to payout."}]}, {"step": "Plan hiring, capacity and local marketing from the numbers", "description": "Use forecast lead volume, expert capacity and the academy intake calendar to decide when to recruit, whether to open a second office or a video-call desk, and where to spend local marketing, and agree the plan and the territory with head office in the periodic franchise review.", "streamsNeeded": [{"id": "run-the-franchise-office-network", "name": "Run the Franchise Office Network", "howItSupports": "Provides forecast lead volume, capacity planning and the franchise review record per office."}, {"id": "train-and-certify-advisors-in-the-academy", "name": "Train and Certify Advisors in the Academy", "howItSupports": "Shows upcoming academy intakes and expected certification dates for capacity planning."}]}], "media": [{"type": "image", "src": "media/jbtd-frnc-jtbd-frnc-3.png", "title": "Office Franchisee JTBD infographic: See my office's production, conversion and commissions clearly", "alt": "Enterprise infographic for the job \"See my office's production, conversion and commissions clearly\" for customer \"Office Franchisee\"."}]}], "customerJourneyStories": [{"id": "journey-frnc-1", "name": "Opening a hypotheek.winkel franchise office in a Flemish town", "linkedJobIds": ["jtbd-frnc-1", "jtbd-frnc-2"], "summary": "An independent credit broker in a mid-sized Flemish town, whose own lead flow dried up when the Belgian mortgage market contracted by about 40 percent, converts his practice into a hypotheek.winkel franchise office, tests whether the brand really delivers appointments and a workable commission share, and within eighteen months runs two experts, a video-call desk and the best conversion in his region.", "stages": [{"stage": "Trigger", "narrative": "After two years in which his own website and word of mouth brought fewer and fewer mortgage clients while the market shrank by around 40 percent, the broker realises that comparison technology and a national brand generate the demand he cannot. A colleague who joined hypotheek.winkel in 2021 keeps posting full agendas, and the question becomes how the franchise actually works."}, {"stage": "Discovery", "narrative": "He meets the network-development team after finding the franchise listing (63 locations and 83 experts at the time) and hears how it works: leads routed from the peasy.be and hypotheek.winkel simulators, callbacks and upload requests to the nearest office, the expert workbench comparing 25 banks, the academy for recruits, and a commission share paid from reconciled bank and insurer fees."}, {"stage": "Evaluation", "narrative": "His evaluation is about economics and independence: the franchise fee and the commission share against the routed appointment volume projected for his territory, the routing rules toward neighbouring offices, whether he keeps advising his existing clients, and whether the brand will still be there in a downturn. Vortex's continued investment through the contraction, the 4.8-out-of-5 Trustpilot rating and a transparent statement per file convince him."}, {"stage": "Trial", "narrative": "The office opens under the brand with himself and one experienced expert. In the first quarter the routed leads exceed his old flow within weeks, the dashboard shows which leads converted, and the first commission statement reconciles to the files he closed, apart from one insurance policy that the dispute flow resolves before payout."}, {"stage": "Engagement", "narrative": "Within a year the office is run from the dashboards: leads called back the same day, no-shows re-booked, a career changer recruited through the academy and mentored on the workbench, reviews collected after every deed, and the monthly review with head office based on the office's conversion rather than on anecdotes."}, {"stage": "Retention", "narrative": "He stays and opens a video-call desk as the second seat because the brand keeps the agendas full, the commission share arrives on predictable dates, and the network is now part of an 81-office group with Meilleurtaux, which extends the bank relationships and the buyers who can be served, not the competition on his doorstep."}], "media": [{"type": "image", "src": "media/journey-frnc-frnc-1.png", "title": "Office Franchisee customer journey: Opening a hypotheek.winkel franchise office in a Flemish town", "alt": "Enterprise journey storyboard for \"Opening a hypotheek.winkel franchise office in a Flemish town\" for customer \"Office Franchisee\"."}]}, {"id": "journey-frnc-2", "name": "Running two offices from the production and commission dashboards", "linkedJobIds": ["jtbd-frnc-3", "jtbd-frnc-1"], "summary": "A franchisee with two offices and five experts, who tracked production in a spreadsheet and disputed almost every commission statement, adopts the network's production and commission dashboards after a quarter in which stuck files and an unexplained statement gap nearly cost her an expert, and ends up steering hiring, lead sources and coaching from the numbers.", "stages": [{"stage": "Trigger", "narrative": "A quarter closes with two files lost at the notary stage that nobody had flagged, an expert threatening to leave because her commission share was calculated late, and a statement from head office that differs from the franchisee's spreadsheet by several closed files. The franchisee tells the network that she cannot run two offices this way."}, {"stage": "Discovery", "narrative": "At the franchise review the network-development team shows the office dashboards that the workbench and the commission reconciliation now feed: production and stuck files per expert and stage, conversion per lead source and bank, insurance attach, and a commission statement per file with a dispute flow and payout dates. Her colleague in the next town already runs from it."}, {"stage": "Evaluation", "narrative": "Her concern is whether the numbers will match her own reality and whether head office will use them to compare her against larger offices in the lead allocation. She runs one month in parallel with her spreadsheet, finds that the dashboard was right about two files she had counted twice, and gets the routing rules and benchmark logic explained in writing."}, {"stage": "Trial", "narrative": "For the next quarter both offices start each day from the stuck-file view, every expert sees their own production and share, and the commission statement is reconciled per file before payout with one dispute resolved in a week. She discovers that one lead source fills agendas but rarely closes, and shifts local marketing accordingly."}, {"stage": "Engagement", "narrative": "The dashboards become the management routine: a weekly stand-up on stuck files and conversion per expert, a monthly reconciliation and payout that nobody argues about, quarterly capacity planning against forecast leads and the academy intake, and the franchise review with head office run from the same numbers."}, {"stage": "Retention", "narrative": "She keeps both offices and hires a sixth expert because she can see the month before it ends: commission payouts are predictable, the stuck-file list is short, expert retention has improved since shares are transparent, and her conversion data now shapes the network's routing rules rather than the other way round."}], "media": [{"type": "image", "src": "media/journey-frnc-frnc-2.png", "title": "Office Franchisee customer journey: Running two offices from the production and commission dashboards", "alt": "Enterprise journey storyboard for \"Running two offices from the production and commission dashboards\" for customer \"Office Franchisee\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-frnc-top", "name": "Qualified appointments per office per month", "description": "Number of appointments per office per month with a qualified buyer (project, budget and timing confirmed) held in the office or by video call, averaged across the network. Modeled seed value for a network of ~70 offices and >150 experts; not an official Peasy figure.", "unit": "appointments per office per month", "currentValue": "38", "targetValue": "55", "link": "http
