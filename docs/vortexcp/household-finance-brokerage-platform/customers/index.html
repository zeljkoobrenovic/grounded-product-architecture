nd Compliance Operations Manager JTBD infographic: Prove FSMA and GDPR compliance across brands and offices", "alt": "Enterprise infographic for the job \"Prove FSMA and GDPR compliance across brands and offices\" for customer \"Network and Compliance Operations Manager\"."}]}], "customerJourneyStories": [{"id": "journey-opsm-1", "name": "Head office replaces spreadsheet commission reconciliation with the commission engine and partner portal", "linkedJobIds": ["jtbd-opsm-2", "jtbd-opsm-3"], "summary": "The network and compliance operations manager, whose team reconciles more than 50 partner statements and pays about 70 offices from spreadsheets, adopts the commission engine and partner portal, and ends up with statements reconciled in days, payouts that are right the first time and margin reporting management trusts.", "stages": [{"stage": "Trigger", "narrative": "Month end takes the team three weeks: partner statements arrive as PDFs and spreadsheets, lines are matched by hand to deeds and policies, franchisees call about missing or wrong payouts, and the finance director cannot see margin per partner. Growth of the network and the Meilleurtaux integration make the manual process untenable."}, {"stage": "Discovery", "narrative": "The manager learns from the product team that the workbench and care tooling already record every deed date, policy start and switch activation, and sees a demonstration of a commission engine that matches partner statements to those events and computes office payouts from the commission schedules; two partners already deliver statements through a portal."}, {"stage": "Evaluation", "narrative": "She evaluates with finance and IT: whether every partner agreement can be expressed as a schedule, how differences and clawbacks are handled, how office payouts are approved, the audit trail and access rights, the data-protection terms for partner exchange, and the effort to load the history. Finance insists on a parallel run before the spreadsheets go."}, {"stage": "Trial", "narrative": "The engine runs for the mortgage panel first, in parallel with the spreadsheet for two months. Most lines match automatically, the differences are real cases explained with a reason, the office payouts agree with the manual calculation except for errors found in the spreadsheet, and the first partner statements arrive through the portal."}, {"stage": "Engagement", "narrative": "All partners move onto the engine and portal, the team's month end becomes a review of exceptions and disputes, franchisees see their statements next to their production, and the finance director reads margin per partner, product and office from the dashboard."}, {"stage": "Retention", "narrative": "The process stays because reconciliation closes in days, payout corrections have almost disappeared, partner reviews are built on shared numbers, and the group asks to roll the same engine out across the Meilleurtaux network."}], "media": [{"type": "image", "src": "media/journey-opsm-opsm-1.png", "title": "Network and Compliance Operations Manager customer journey: Head office replaces spreadsheet commission reconciliation with the commission engine and partner portal", "alt": "Enterprise journey storyboard for \"Head office replaces spreadsheet commission reconciliation with the commission engine and partner portal\" for customer \"Network and Compliance Operations Manager\"."}]}, {"id": "journey-opsm-2", "name": "The academy and compliance desk move onto one learning and advice-record platform", "linkedJobIds": ["jtbd-opsm-1", "jtbd-opsm-3"], "summary": "The same manager, who runs the academy on classroom schedules and the compliance desk on file shares, adopts the academy platform and the compliance workbench together, and ends with planned cohorts placed where the network needs them and audit packs produced from records instead of assembled by hand.", "stages": [{"stage": "Trigger", "narrative": "A franchisee has waited a year for a mortgage expert, a iews", "url": "https://www.hypotheekwinkel.be/over-ons/klanten-vertellen/", "publisher": "hypotheek.winkel", "date": "2026-09-05"}, {"id": "hw-blog-meilleurtaux", "title": "Blog \u2014 hypotheek.winkel and Peasy join Meilleurtaux (23 December 2025)", "url": "https://www.hypotheekwinkel.be/blog/peasy-en-meilleurtaux-bundelen-krachten/", "publisher": "hypotheek.winkel", "date": "2026-09-05"}, {"id": "verzekeringen-home", "title": "Verzekeringen.be / Assurances.be \u2014 insurance comparison across insurers", "url": "https://www.verzekeringen.be/", "publisher": "Verzekeringen.be", "date": "2026-09-05"}, {"id": "aanbieders-home", "title": "Aanbieders.be / Mesfournisseurs.be \u2014 free energy, telecom, mobile and insurance comparison", "url": "https://www.aanbieders.be/", "publisher": "Aanbieders.be", "date": "2026-09-05"}, {"id": "vortex-peasy", "title": "Vortex Capital Partners \u2014 Peasy investment page (2020\u20132025)", "url": "https://vortexcp.com/investment/peasy/", "publisher": "Vortex Capital Partners", "date": "2026-09-05"}, {"id": "vdp-peasy", "title": "Van den Plas (VDP) \u2014 exclusive advisor to Peasy and Vortex on the sale to Meilleurtaux", "url": "https://www.vdp.be/en/meilleurtaux-acquires-peasy-creating-the-leading-household-finance-platform-in-belgium/", "publisher": "VDP", "date": "2026-09-05"}, {"id": "meilleurtaux-press-peasy", "title": "Meilleurtaux press release \u2014 acquisition of 100 percent of Peasy (December 2025)", "url": "https://www.meilleurtaux.com/espace-presse/communiques-de-presse/meilleurtaux-realise-l-aquisition-de-peasy.html", "publisher": "Meilleurtaux", "date": "2026-09-05"}, {"id": "franchise-be-hw", "title": "franchise.be \u2014 hypotheek.winkel: 63 locations and 83 experts (22 January 2024)", "url": "https://www.franchise.be/nieuws/2024/1/hypotheekwinkel-franchise-in-de-kijker", "publisher": "franchise.be", "date": "2026-09-05"}, {"id": "febelfin-press", "title": "Febelfin press room \u2014 quarterly mortgage credit statistics 2023\u20132024", "url": "https://febelfin.be/en/press-room/financing-the-economy/sharp-decline-in-mortgage-lending-in-the-first-quarter", "publisher": "Febelfin", "date": "2026-09-05"}, {"id": "fsma-intermediaries", "title": "FSMA \u2014 registers of credit intermediaries and insurance intermediaries", "url": "https://www.fsma.be/nl/tussenpersonen-kredietgevers/bemiddelaars-hypothecair-krediet", "publisher": "FSMA", "date": "2026-09-05"}, {"id": "bipt-easy-switch", "title": "BIPT \u2014 Easy Switch: the new fixed operator terminates the old contract", "url": "https://www.bipt.be/consumers/faq/easy-switch", "publisher": "BIPT", "date": "2026-09-05"}, {"id": "vreg-vtest", "title": "VREG V-test and V-check \u2014 public energy contract comparison for Flanders", "url": "https://vtest.vreg.be/", "publisher": "VREG", "date": "2026-09-05"}, {"id": "vrt-vcheck", "title": "VRT NWS \u2014 V-check invoice code and first-months usage (28 August 2025)", "url": "https://www.vrt.be/vrtnws/nl/2025/08/28/v-check-v-test-energiefactuur/", "publisher": "VRT NWS", "date": "2026-09-05"}, {"id": "wikifin-over", "title": "Wikifin \u2014 the FSMA financial-education programme since 31 January 2013", "url": "https://www.wikifin.be/nl/over-wikifin", "publisher": "Wikifin (FSMA)", "date": "2026-09-05"}, {"id": "immotheker-about", "title": "Immotheker Finotheker \u2014 about us: 100 offices, 16 banks, +55,000 loans", "url": "https://www.immothekerfinotheker.be/en/about-us/", "publisher": "Immotheker Finotheker", "date": "2026-09-05"}, {"id": "febelfin-press-q3-2024", "title": "Febelfin press room \u2014 quarterly mortgage credit statistics 2023\u20132024 (Q3 2024 recovery release)", "url": "https://febelfin.be/en/press-room/financing-the-economy/mortgage-credits-increase-further-in-third-quarter-of-2024", "publisher": "Febelfin (Q3 2024 recovery release)", "date": "2026-09-05"}], "items": [{"id": "hfb-01", "title": "Peasy runs at national scale: more than 150 experts, 70 offices, more than 50,000 contracts a year and more than 50 partners", "summary": "The Peasy 'over ons' page states '>150 experten, 70 winkels, >50.000 contracten afgesloten per jaar, >50 partners' and a customer satisfaction of 4.5/5. Peasy is headquartered in Zaventem, runs customer care from Hasselt and Oujda (Morocco), serves customers in Dutch and French, and presents itself as 'onderdeel van een familie van merken' (peasy.be, hypotheekwinkel.be, verzekeringen.be, aanbieders.be).", "implication": "Implication for the domain: the platform must serve three distinct volumes at once \u2014 a comparison flow that concludes tens of thousands of insurance, energy and telecom contracts per year, a mortgage flow that runs through 70 offices, and a partner flow that reconciles fees from more than 50 counterparties \u2014 so throughput per advisor and per partner feed are first-order design constraints, not reporting afterthoughts.", "priority": "high", "tags": ["scale", "company", "network"], "sourceIds": ["peasy-over-ons"], "linkedCustomers": [{"customerId": "hshs", "jobIds": ["jtbd-hshs-2"], "kpiIds": ["co-hshs-top", "bo-hshs-top"]}, {"customerId": "hexp", "jobIds": ["jtbd-hexp-1"], "kpiIds": ["bo-hexp-top"]}, {"customerId": "prov", "jobIds": ["jtbd-prov-1"], "kpiIds": ["bo-prov-top"]}, {"customerId": "opsm", "jobIds": ["jtbd-opsm-2"], "kpiIds": ["bo-opsm-b1"]}], "sources": [{"id": "peasy-over-ons", "title": "Over ons \u2014 >150 experten, 70 winkels, >50.000 contracten per jaar, >50 partners", "url": "https://easypeasy.be/over-ons/", "publisher": "Peasy", "date": "2026-09-05"}]}, {"id": "hfb-02", "title": "The consumer pays nothing extra: partners pay a referral fee when a contract is concluded through Peasy, and Peasy is never the contracting party", "summary": "The Peasy customer-service FAQ explains that partners pay an 'aanbrengvergoeding' (referral fee) when a contract is concluded via Peasy, that the consumer pays nothing extra, and that customers never contract with Peasy itself \u2014 the contract is always concluded with the partner. hypotheek.winkel's 'gratis, hoe kan dat?' page states that its advice is free for the buyer because the commission comes from the bank's head office, and the site quotes: 'of je nu rechtstreeks naar hen stapt of via ons, jij betaalt geen (pro)cent meer'.", "implication": "Implication for the domain: revenue is recognised per concluded contract, not per advice hour, so the platform must trace every lead to a partner-confirmed conclusion (loan disbursed, policy bound, switch executed) and reconcile that against partner commission statements; independence must be demonstrable in the advice record because the payer is the partner, not the household.", "priority": "high", "tags": ["business-model", "commission", "independence"], "sourceIds": ["peasy-klantenservice", "hw-gratis-hoe-kan-dat"], "linkedCustomers": [{"customerId": "fthb", "jobIds": ["jtbd-fthb-2"], "kpiIds": ["co-fthb-b1"]}, {"customerId": "bank", "jobIds": ["jtbd-bank-2"], "kpiIds": ["bo-bank-top"]}, {"customerId": "prov", "jobIds": ["jtbd-prov-2"], "kpiIds": ["bo-prov-b2"]}, {"customerId": "opsm", "jobIds": ["jtbd-opsm-2"], "kpiIds": ["co-opsm-b1", "bo-opsm-top"]}], "sources": [{"id": "peasy-klantenservice", "title": "Klantenservice FAQ \u2014 how Peasy earns money and monitors your contracts", "url": "https://easypeasy.be/klantenservice/", "publisher": "Peasy", "date": "2026-09-05"}, {"id": "hw-gratis-hoe-kan-dat", "title": "Gratis, hoe kan dat? \u2014 the bank pays the commission, the buyer pays nothing extra", "url": "https://www.hypotheekwinkel.be/over-ons/hypotheekwinkel-werkt-gratis-voor-jou/", "publisher": "hypotheek.winkel", "date": "2026-09-05"}]}, {"id": "hfb-03", "title": "hypotheek.winkel has compared the daily conditions of 25 banks since 2001 and is rated 4.8/5 on Trustpilot", "summary": "hypotheekwinkel.be (hypotheek.winkel BV, BE 0474.087.795, Zaventem) states that the chain started in 2001, operates '70 hypotheek.winkels' across Flanders and Brussels, compares the conditions of 25 banks daily and is free for the buyer. The 'klanten vertellen' page shows a Trustpilot score of 4.8/5.", "implication": "Implication for the domain: the same-screen comparison of 25 banks is the core workbench capability and depends on a daily bank rate and conditions feed; the Trustpilot score is a public conversion asset, so review capture after the notary deed and review display on office pages belong in the engagement flow rather than being left to marketing.", "priority": "high", "tags": ["mortgage", "comparison", "trust"], "sourceIds": ["hw-home", "hw-klanten-vertellen"], "linkedCustomers": [{"customerId": "fthb", "jobIds": ["jtbd-fthb-2"], "kpiIds": ["co-fthb-top", "co-fthb-b1"]}, {"customerId": "hexp", "jobIds": ["jtbd-hexp-2"], "kpiIds": ["co-hexp-b2"]}, {"customerId": "frnc", "jobIds": ["jtbd-frnc-1"], "kpiIds": ["bo-frnc-top"]}, {"customerId": "bank", "jobIds": ["jtbd-bank-2"], "kpiIds": ["bo-bank-b2"]}], "sources": [{"id": "hw-home", "title": "hypotheek.winkel \u2014 70 winkels, 25 banken dagelijks vergeleken, sinds 2001", "url": "https://www.hypotheekwinkel.be/", "publisher": "hypotheek.winkel", "date": "2026-09-05"}, {"id": "hw-klanten-vertellen", "title": "Klanten vertellen \u2014 Trustpilot 4.8/5 customer reviews", "url": "https://www.hypotheekwinkel.be/over-ons/klanten-vertellen/", "publisher": "hypotheek.winkel", "date": "2026-09-05"}]}, {"id": "hfb-04", "title": "The feasibility certificate turns a 25-bank comparison of salary and savings into proof a buyer can show a seller", "summary": "The haalbaarheidscertificaat page describes a feasibility certificate that compares 25 banks on the buyer's salary and savings and takes into account the renovation obligation for homes with a low EPC label; buyers show the certificate to sellers as proof of their borrowing capacity.", "implication": "Implication for the domain: the certificate is the first product a first-time buyer receives, before any loan exists, so its issuance rate and turnaround are leading indicators for the whole mortgage funnel; the EPC renovation obligation must be encoded as a rule in the feasibility calculation and reused unchanged in the later credit file.", "priority": "high", "tags": ["mortgage", "feasibility", "first-time-buyer"], "sourceIds": ["hw-haalbaarheidscertificaat"], "linkedCustomers": [{"customerId": "fthb", "jobIds": ["jtbd-fthb-1"], "kpiIds": ["co-fthb-b2", "co-fthb-top"]}, {"customerId": "hexp", "jobIds": ["jtbd-hexp-1"], "kpiIds": ["co-hexp-b1"]}, {"customerId": "refi", "jobIds": ["jtbd-refi-2"], "kpiIds": ["co-refi-b2"]}], "sources": [{"id": "hw-haalbaarheidscertificaat", "title": "Haalbaarheidscertificaat \u2014 proof of borrowing capacity for sellers", "url": "https://www.hypotheekwinkel.be/hypothecaire-lening/haalbaarheidscertificaat/", "publisher": "hypotheek.winkel", "date": "2026-09-05"}]}, {"id": "hfb-05", "title": "Seven mortgage simulators and seven project types define the digital front door of the mortgage brokerage", "summary": "hypotheekwinkel.be offers simulators for 'hoeveel kan ik lenen', 'maandlast', 'rentevoet', 'financieel plan', 'notariskosten', 'haalbaarheid' and 'aflossingstabel', and organises its advice by project: first home, next home, second home, new build, refinancing, buying as a self-employed person and renovation loan.", "implication": "Implication for the domain: simulators are the demand engine for the office network, so every simulator result should be capturable as a lead with the project type attached and routed to the nearest office with the expert prepared; project types should be first-class attributes of the lead, the appointment and the credit file rather than free text.", "priority": "medium", "tags": ["simulators", "lead-generation", "mortgage"], "sourceIds": ["hw-home"], "linkedCustomers": [{"customerId": "fthb", "jobIds": ["jtbd-fthb-1"], "kpiIds": ["co-fthb-b2"]}, {"customerId": "refi", "jobIds": ["jtbd-refi-2"], "kpiIds": ["co-refi-top"]}, {"customerId": "frnc", "jobIds": ["jtbd-frnc-1"], "kpiIds": ["co-frnc-top", "bo-frnc-b1"]}], "sources": [{"id": "hw-home", "title": "hypotheek.winkel \u2014 70 winkels, 25 banken dagelijks vergeleken, sinds 2001", "url": "https://www.hypotheekwinkel.be/", "publisher": "hypotheek.winkel", "date": "2026-09-05"}]}, {"id": "hfb-06", "title": "Upload-your-proposal, callback requests and office or video-call appointments convert online interest into an expert conversation", "summary": "peasy.be offers 'upload je voorstel', a free expert review of a mortgage or insurance proposal received elsewhere, callback requests, and appointment booking in an office or by video call; the home page promises 'besparen zonder gedoe' across mortgage loans, insurance and energy under one roof.", "implication": "Implication for the domain: the proposal-review intake is the cheapest way to win refinancing and switch cases because the household has already done the shopping, so review turnaround should be measured in hours and the uploaded proposal should pre-fill the comparison rather than being retyped by the expert.", "priority": "high", "tags": ["conversion", "proposal-review", "appointments"], "sourceIds": ["peasy-upload-je-voorstel", "peasy-home"], "linkedCustomers": [{"customerId": "refi", "jobIds": ["jtbd-refi-1"], "kpiIds": ["co-refi-top", "co-refi-b1"]}, {"customerId": "hexp", "jobIds": ["jtbd-hexp-2"], "kpiIds": ["co-hexp-top"]}, {"customerId": "frnc", "jobIds": ["jtbd-frnc-1"], "kpiIds": ["co-frnc-top"]}], "sources": [{"id": "peasy-upload-je-voorstel", "title": "Upload je voorstel \u2014 free expert review of a proposal received elsewhere", "url": "https://peasy.be/upload-je-voorstel/", "publisher": "Peasy", "date": "2026-09-05"}, {"id": "peasy-home", "title": "Peasy \u2014 besparen zonder gedoe: hypotheek, verzekeringen en energie onder \u00e9\u00e9n dak", "url": "https://peasy.be/", "publisher": "Peasy", "date": "2026-09-05"}]}, {"id": "hfb-07", "title": "The budget barometer benchmarks a household's fixed costs against Belgian averages before any comparison starts", "summary": "The peasy.be budgetbarometer page lets a household compare its fixed costs with Belgian averages to see where it overpays.", "implication": "Implication for the domain: the barometer is a diagnostic that ranks which contract to compare first, so each barometer category should map directly to a comparison module (insurance, energy, telecom, mortgage) and the identified overpayment should become the target figure the customer-care advisor and the monitoring alerts report against.", "priority": "medium", "tags": ["budget-barometer", "diagnostics", "cross-sell"], "sourceIds": ["peasy-budgetbarometer"], "linkedCustomers": [{"customerId": "hshs", "jobIds": ["jtbd-hshs-1"], "kpiIds": ["co-hshs-top", "co-hshs-b1"]}, {"customerId": "insa", "jobIds": ["jtbd-insa-3"], "kpiIds": ["bo-insa-b2"]}, {"customerId": "prov", "jobIds": ["jtbd-prov-1"], "kpiIds": ["co-prov-top"]}], "sources": [{"id": "peasy-budgetbarometer", "title": "Budgetbarometer \u2014 benchmark your fixed costs against Belgian averages", "url": "https://peasy.be/budgetbarometer/", "publisher": "Peasy", "date": "2026-09-05"}]}, {"id": "hfb-08", "title": "Peasy keeps watching the contracts it brokered and warns the household when a better or cheaper option exists", "summary": "The customer-service FAQ states that Peasy monitors the contracts concluded through it and warns customers when a better or cheaper option is available; the home page positions mortgage loans, insurance and energy under one roof.", "implication": "Implication for the domain: a monitored contract vault per household is the product that turns a one-off mortgage into a multi-contract relationship; the monitoring rules need partner tariff feeds that are current enough to justify an alert, and alert acceptance rate is the measure of whether the promise is kept without annoying the household.", "priority": "high", "tags": ["monitoring", "retention", "household-relationship"], "sourceIds": ["peasy-klantenservice", "peasy-home"], "linkedCustomers": [{"customerId": "hshs", "jobIds": ["jtbd-hshs-3"], "kpiIds": ["co-hshs-b2", "bo-hshs-top"]}, {"customerId": "refi", "jobIds": ["jtbd-refi-3"], "kpiIds": ["co-refi-b2"]}, {"customerId": "insa", "jobIds": ["jtbd-insa-3"], "kpiIds": ["bo-insa-top"]}, {"customerId": "prov", "jobIds": ["jtbd-prov-1"], "kpiIds": ["bo-prov-b1"]}], "sources": [{"id": "peasy-klantenservice", "title": "Klantenservice FAQ \u2014 how Peasy earns money and monitors your contracts", "url": "https://easypeasy.be/klantenservice/", "publisher": "Peasy", "date": "2026-09-05"}, {"id": "peasy-home", "title": "Peasy \u2014 besparen zonder gedoe: hypotheek, verzekeringen en energie onder \u00e9\u00e9n dak", "url": "https://peasy.be/", "publisher": "Peasy", "date": "2026-09-05"}]}, {"id": "hfb-09", "title": "Aanbieders.be advertises concrete savings per contract type, free switching and a 4.6 Google rating from 2,765 reviews", "summary": "aanbieders.be shows '4,6 / 2765 Google reviews' and advertises savings of up to \u20ac600 on energy on its homepage (and 'tot 1.100\u20ac deze winter' on its energy page), \u20ac500 on insurance compared across 11 insurers, \u20ac348 on internet/TV/telephony and \u20ac144 on mobile; switching is free, it also covers charging stations and business energy and telecom, and it is open Monday to Thursday until 17:00 and Friday until 16:00.", "implication": "Implication for the domain: the savings claims are the conversion promise and must be backed by the comparison engine's actual savings distribution per category; since the advisors work office hours, the self-service comparison and callback queue must absorb evening and weekend demand and hand a ready quote to the advisor the next morning.", "priority": "high", "tags": ["energy", "telecom", "savings", "customer-care"], "sourceIds": ["aanbieders-home"], "linkedCustomers": [{"customerId": "hshs", "jobIds": ["jtbd-hshs-2"], "kpiIds": ["co-hshs-top", "co-hshs-b1"]}, {"customerId": "insa", "jobIds": ["jtbd-insa-1"], "kpiIds": ["co-insa-top", "co-insa-b1"]}, {"customerId": "prov", "jobIds": ["jtbd-prov-1"], "kpiIds": ["co-prov-b1"]}], "sources": [{"id": "aanbieders-home", "title": "Aanbieders.be / Mesfournisseurs.be \u2014 free energy, telecom, mobile and insurance comparison", "url": "https://www.aanbieders.be/", "publisher": "Aanbieders.be", "date": "2026-09-05"}]}, {"id": "hfb-10", "title": "Verzekeringen.be spans eighteen insurance lines and names the insurers it compares, from AXA and Allianz to DELA and Qover", "summary": "verzekeringen.be (Assurances.be in French; acquired by the group in 2021) covers car, motor, bike, travel, cancellation, luggage, fire, contents, outstanding-balance, hospitalisation, accident, dental, family liability, pension savings, funeral, pet, legal assistance and self-employed cover, with insurer pages for AXA, Allianz, Ethias, KBC, Belfius, DVV, DKV, DELA, NN, Athora, Cardif, Euromex, Europ Assistance, Fidea, Patronale Life, Qover, Santevet and DAS.", "implication": "Implication for the domain: the insurance comparison module must model very different products (a funeral policy and an outstanding-balance policy share little beyond a premium) and different binding paths per insurer, so product-line templates and per-insurer quote and bind integrations are the scaling constraint; outstanding-balance and fire cover are the natural bridge from the mortgage file to the insurance brands.", "priority": "medium", "tags": ["insurance", "partners", "product-breadth"], "sourceIds": ["verzekeringen-home", "vortex-peasy"], "linkedCustomers": [{"customerId": "hshs", "jobIds": ["jtbd-hshs-2"], "kpiIds": ["co-hshs-b1"]}, {"customerId": "refi", "jobIds": ["jtbd-refi-3"], "kpiIds": ["co-refi-b2"]}, {"customerId": "insa", "jobIds": ["jtbd-insa-1"], "kpiIds": ["co-insa-b2"]}, {"customerId": "prov", "jobIds": ["jtbd-prov-1"], "kpiIds": ["bo-prov-b1"]}], "sources": [{"id": "verzekeringen-home", "title": "Verzekeringen.be / Assurances.be \u2014 insurance comparison across insurers", "url": "https://www.verzekeringen.be/", "publisher": "Verzekeringen.be", "date": "2026-09-05"}, {"id": "vortex-peasy", "title": "Vortex Capital Partners \u2014 Peasy investment page (2020\u20132025)", "url": "https://vortexcp.com/investment/peasy/", "publisher": "Vortex Capital Partners", "date": "2026-09-05"}]}, {"id": "hfb-11", "title": "Customer care for insurance, energy and telecom runs from Hasselt and Oujda in Dutch and French", "summary": "Peasy states that its customer care operates from Hasselt and from Oujda in Morocco, serves customers in Dutch and French, and publishes the contact number 03 501 22 22.", "implication": "Implication for the domain: advisors in two countries handle contacts arriving under three brand names, so the care desk needs one omnichannel inbox with brand and language context, shared scripts and a knowledge base, and the customer-account data must be accessible under GDPR from Oujda with the same consent and audit controls as in Hasselt.", "priority": "medium", "tags": ["customer-care", "operations", "multi-brand"], "sourceIds": ["peasy-over-ons", "peasy-klantenservice"], "linkedCustomers": [{"customerId": "insa", "jobIds": ["jtbd-insa-1", "jtbd-insa-2"], "kpiIds": ["co-insa-top", "bo-insa-b1"]}, {"customerId": "hshs", "jobIds": ["jtbd-hshs-2"], "kpiIds": ["co-hshs-b2"]}, {"customerId": "opsm", "jobIds": ["jtbd-opsm-3"], "kpiIds": ["bo-opsm-b2"]}], "sources": [{"id": "peasy-over-ons", "title": "Over ons \u2014 >150 experten, 70 winkels, >50.000 contracten per jaar, >50 partners", "url": "https://easypeasy.be/over-ons/", "publisher": "Peasy", "date": "2026-09-05"}, {"id": "peasy-klantenservice", "title": "Klantenservice FAQ \u2014 how Peasy earns money and monitors your contracts", "url": "https://easypeasy.be/klantenservice/", "publisher": "Peasy", "date": "2026-09-05"}]}, {"id": "hfb-12", "title": "Vortex built Peasy in five years from a 68-branch mortgage chain into a three-brand comparison group and kept investing through a 40 percent market contraction", "summary": "Vortex Capital Partners invested in Hypotheek.winkel in 2020, when it had 68 physical branches and proprietary comparison technology, and formed Horizon Group with management the same year; the group acquired Verzekeringen.be/Assurances.be in 2021 and Aanbieders.be/Mesfournisseurs.be in 2022. Vortex states that it kept investing while the Belgian mortgage market contracted by about 40 percent, and lists the investment as realised with the December 2025 exit to Meilleurtaux; David Geerts is quoted: 'Vortex played a crucial role in every key phase of this journey'.", "implication": "Implication for the domain: diversification into insurance, energy and telecom is the hedge against mortgage cyclicality, so the household relationship must be measured across all contract types and the office network's economics cannot depend on mortgage volume alone; the proprietary comparison technology is the asset the acquirer paid for and should stay a product, not a per-office spreadsheet.", "priority": "high", "tags": ["strategy", "investor", "diversification"], "sourceIds": ["vortex-peasy"], "linkedCustomers": [{"customerId": "frnc", "jobIds": ["jtbd-frnc-1"], "kpiIds": ["bo-frnc-top"]}, {"customerId": "opsm", "jobIds": ["jtbd-opsm-3"], "kpiIds": ["bo-opsm-top"]}, {"customerId": "bank", "jobIds": ["jtbd-bank-2"], "kpiIds": ["bo-bank-b2"]}, {"customerId": "hexp", "jobIds": ["jtbd-hexp-1"], "kpiIds": ["bo-hexp-top"]}], "sources": [{"id": "vortex-peasy", "title": "Vortex Capital Partners \u2014 Peasy investment page (2020\u20132025)", "url": "https://vortexcp.com/investment/peasy/", "publisher": "Vortex Capital Partners", "date": "2026-09-05"}]}, {"id": "hfb-13", "title": "An in-house academy trains about 30 advisors a year because the market cannot supply mortgage experts", "summary": "Vortex describes an in-house training academy that educates about 30 advisors annually.", "implication": "Implication for the domain (combined with the domain brief's assumption that the mortgage expert is a scarce-skill role, knelpuntberoep, largely trained in-house): advisor supply is a planned capacity, so the academy needs enrolment, curriculum, certification and FSMA-knowledge evidence as product features, and office growth plans should be capacity-checked against certified experts rather than against lead volume alone; expert retention protects a scarce investment of roughly a year's cohort per 30 hires.", "priority": "high", "tags": ["academy", "talent", "capacity"], "sourceIds": ["vortex-peasy"], "linkedCustomers": [{"customerId": "opsm", "jobIds": ["jtbd-opsm-1"], "kpiIds": ["co-opsm-top", "co-opsm-b1"]}, {"customerId": "hexp", "jobIds": ["jtbd-hexp-1"], "kpiIds": ["bo-hexp-b1"]}, {"customerId": "frnc", "jobIds": ["jtbd-frnc-2"], "kpiIds": ["co-frnc-b2", "bo-frnc-b2"]}, {"customerId": "insa", "jobIds": ["jtbd-insa-2"], "kpiIds": ["co-insa-b2"]}], "sources": [{"id": "vortex-peasy", "title": "Vortex Capital Partners \u2014 Peasy investment page (2020\u20132025)", "url": "https://vortexcp.com/investment/peasy/", "publisher": "Vortex Capital Partners", "date": "2026-09-05"}]}, {"id": "hfb-14", "title": "The office network moved from 68 branches in 2020 to 63 locations with 83 experts in January 2024 and 70 offices with more than 150 experts today", "summary": "Vortex reports 68 physical branches at the 2020 investment; franchise.be reported on 22 January 2024 that hypotheek.winkel had 63 locations and 83 experts and had been through a management buy-in backed by private equity since 2020; Peasy's 'over ons' page now states 70 offices and more than 150 experts.", "implication": "Implication for the domain: the number of offices has been broadly stable while the expert count per office has grown, so the franchise model's value is in experts per office and appointments per expert rather than in opening locations; production and conversion dashboards should be per expert and per office, and academy output should be tied to office capacity plans.", "priority": "medium", "tags": ["network", "franchise", "growth"], "sourceIds": ["vortex-peasy", "franchise-be-hw", "peasy-over-ons"], "linkedCustomers": [{"customerId": "frnc", "jobIds": ["jtbd-frnc-2", "jtbd-frnc-3"], "kpiIds": ["co-frnc-top", "bo-frnc-b1"]}, {"customerId": "opsm", "jobIds": ["jtbd-opsm-1"], "kpiIds": ["bo-opsm-b1"]}, {"customerId": "hexp", "jobIds": ["jtbd-hexp-3"], "kpiIds": ["co-hexp-top"]}], "sources": [{"id": "vortex-peasy", "title": "Vortex Capital Partners \u2014 Peasy investment page (2020\u20132025)", "url": "https://vortexcp.com/investment/peasy/", "publisher": "Vortex Capital Partners", "date": "2026-09-05"}, {"id": "franchise-be-hw", "title": "franchise.be \u2014 hypotheek.winkel: 63 locations and 83 experts (22 January 2024)", "url": "https://www.franchise.be/nieuws/2024/1/hypotheekwinkel-franchise-in-de-kijker", "publisher": "franchise.be", "date": "2026-09-05"}, {"id": "peasy-over-ons", "title": "Over ons \u2014 >150 experten, 70 winkels, >50.000 contracten per jaar, >50 partners", "url": "https://easypeasy.be/over-ons/", "publisher": "Peasy", "date": "2026-09-05"}]}, {"id": "hfb-15", "title": "Meilleurtaux acquires 100 percent of Peasy, creating an 81-office national platform led from Belgium by David Geerts", "summary": "On 23 December 2025 hypotheek.winkel announced that Meilleurtaux agreed to acquire 100 percent of the shares of Peasy, which has about 200 employees, revenues of around \u20ac30 million and about 70 offices. Meilleurtaux was founded in 1999, has had Silver Lake as majority shareholder since 2020, entered Belgium in 2023 through the acquisition of MiD Finance and is active mainly in Wallonia with offices in Ghent and Antwerp; the combined group has 81 offices, David Geerts leads the Belgian and Luxembourg operations, Thomas Vandeville is CEO of Meilleurtaux, and VDP acted as exclusive advisor to Peasy and Vortex.", "implication": "Implication for the domain: the year-one agenda is integration \u2014 one lead engine feeding 81 bilingual offices, shared bank and insurer relationships, and consumer credit and credit grouping (a Meilleurtaux strength) added to the offer \u2014 so brand routing, language routing and partner catalogues must be built as configuration rather than hard-coded per brand.", "priority": "high", "tags": ["m-and-a", "integration", "strategy"], "sourceIds": ["hw-blog-meilleurtaux", "meilleurtaux-press-peasy", "vdp-peasy"], "linkedCustomers": [{"customerId": "bank", "jobIds": ["jtbd-bank-2"], "kpiIds": ["bo-bank-top", "bo-bank-b2"]}, {"customerId": "frnc", "jobIds": ["jtbd-frnc-1"], "kpiIds": ["bo-frnc-top"]}, {"customerId": "opsm", "jobIds": ["jtbd-opsm-3"], "kpiIds": ["bo-opsm-top"]}, {"customerId": "refi", "jobIds": ["jtbd-refi-2"], "kpiIds": ["bo-refi-top"]}], "sources": [{"id": "hw-blog-meilleurtaux", "title": "Blog \u2014 hypotheek.winkel and Peasy join Meilleurtaux (23 December 2025)", "url": "https://www.hypotheekwinkel.be/blog/peasy-en-meilleurtaux-bundelen-krachten/", "publisher": "hypotheek.winkel", "date": "2026-09-05"}, {"id": "meilleurtaux-press-peasy", "title": "Meilleurtaux press release \u2014 acquisition of 100 percent of Peasy (December 2025)", "url": "https://www.meilleurtaux.com/espace-presse/communiques-de-presse/meilleurtaux-realise-l-aquisition-de-peasy.html", "publisher": "Meilleurtaux", "date": "2026-09-05"}, {"id": "vdp-peasy", "title": "Van den Plas (VDP) \u2014 exclusive advisor to Peasy and Vortex on the sale to Meilleurtaux", "url": "https://www.vdp.be/en/meilleurtaux-acquires-peasy-creating-the-leading-household-finance-platform-in-belgium/", "publisher": "VDP", "date": "2026-09-05"}]}, {"id": "hfb-16", "title": "Belgian mortgage demand fell by roughly a third in 2023 and started recovering in 2024, making broker volume highly cyclical", "summary": "Febelfin reported that mortgage credit applications excluding refinancing were down about 37 percent in Q1 2023 and about 29 percent in Q2 2023 compared with 2022, and up about 7.5 percent in number and about 12 percent in amount in Q3 2024.", "implication": "Implication for the domain: lead volume and expert utilisation can swing by a third within a year, so the office network needs conversion and file-throughput metrics that hold in a downturn, refinancing and insurance cross-sell to fill capacity when purchase demand drops, and forecasting inputs for banks that plan broker-channel volume.", "priority": "high", "tags": ["market", "cyclicality", "mortgage"], "sourceIds": ["febelfin-press", "febelfin-press-q3-2024"], "linkedCustomers": [{"customerId": "bank", "jobIds": ["jtbd-bank-2"], "kpiIds": ["bo-bank-b2"]}, {"customerId": "hexp", "jobIds": ["jtbd-hexp-1"], "kpiIds": ["bo-hexp-top"]}, {"customerId": "frnc", "jobIds": ["jtbd-frnc-3"], "kpiIds": ["bo-frnc-b1"]}, {"customerId": "fthb", "jobIds": ["jtbd-fthb-2"], "kpiIds": ["bo-fthb-top"]}], "sources": [{"id": "febelfin-press", "title": "Febelfin press room \u2014 quarterly mortgage credit statistics 2023\u20132024", "url": "https://febelfin.be/en/press-room/financing-the-economy/sharp-decline-in-mortgage-lending-in-the-first-quarter", "publisher": "Febelfin", "date": "2026-09-05"}, {"id": "febelfin-press-q3-2024", "title": "Febelfin press room \u2014 quarterly mortgage credit statistics 2023\u20132024 (Q3 2024 recovery release)", "url": "https://febelfin.be/en/press-room/financing-the-economy/mortgage-credits-increase-further-in-third-quarter-of-2024", "publisher": "Febelfin (Q3 2024 recovery release)", "date": "2026-09-05"}]}, {"id": "hfb-17", "title": "Credit and insurance intermediaries must be registered with the FSMA, and hypotheek.winkel names the FPS Economy Economic Inspectorate as its supervisor", "summary": "The FSMA keeps registers of credit intermediaries in mortgage credit and consumer credit and of insurance intermediaries; hypotheekwinkel.be names the FPS Economy Economic Inspectorate as its supervisory authority.", "implication": "Implication for the domain: every expert and customer-care advisor who advises on credit or insurance must be traceable to a valid registration, the academy's certification evidence must satisfy FSMA knowledge requirements, and advice and suitability records must be retained per file so that an inspection can be answered from the system across all three brands.", "priority": "high", "tags": ["regulation", "fsma", "compliance"], "sourceIds": ["fsma-intermediaries", "hw-home"], "linkedCustomers": [{"customerId": "opsm", "jobIds": ["jtbd-opsm-3"], "kpiIds": ["co-opsm-b2", "bo-opsm-b2"]}, {"customerId": "hexp", "jobIds": ["jtbd-hexp-2"], "kpiIds": ["co-hexp-b2"]}, {"customerId": "bank", "jobIds": ["jtbd-bank-1"], "kpiIds": ["co-bank-top", "co-bank-b1"]}, {"customerId": "insa", "jobIds": ["jtbd-insa-2"], "kpiIds": ["co-insa-b2"]}], "sources": [{"id": "fsma-intermediaries", "title": "FSMA \u2014 registers of credit intermediaries and insurance intermediaries", "url": "https://www.fsma.be/nl/tussenpersonen-kredietgevers/bemiddelaars-hypothecair-krediet", "publisher": "FSMA", "date": "2026-09-05"}, {"id": "hw-home", "title": "hypotheek.winkel \u2014 70 winkels, 25 banken dagelijks vergeleken, sinds 2001", "url": "https://www.hypotheekwinkel.be/", "publisher": "hypotheek.winkel", "date": "2026-09-05"}]}, {"id": "hfb-18", "title": "BIPT Easy Switch lets the new fixed operator terminate the old contract, with more than 99,125 switches in 2021", "summary": "Under BIPT's Easy Switch procedure the new fixed telecom operator terminates the customer's old contract; BIPT reported more than 99,125 Easy Switch switches in 2021.", "implication": "Implication for the domain: telecom switching can be executed end-to-end by the advisor without the household contacting the old operator, so the switch-execution flow should capture the Easy Switch identifiers up front and treat termination as part of the same order; the same 'we cancel the old contract' promise should be reproduced for insurance and energy where the procedures differ.", "priority": "medium", "tags": ["telecom", "switching", "regulation"], "sourceIds": ["bipt-easy-switch"], "linkedCustomers": [{"customerId": "hshs", "jobIds": ["jtbd-hshs-2"], "kpiIds": ["co-hshs-b1"]}, {"customerId": "insa", "jobIds": ["jtbd-insa-2"], "kpiIds": ["co-insa-b2", "bo-insa-b1"]}, {"customerId": "prov", "jobIds": ["jtbd-prov-1", "jtbd-prov-2"], "kpiIds": ["co-prov-b1"]}], "sources": [{"id": "bipt-easy-switch", "title": "BIPT \u2014 Easy Switch: the new fixed operator terminates the old contract", "url": "https://www.bipt.be/consumers/faq/easy-switch", "publisher": "BIPT", "date": "2026-09-05"}]}, {"id": "hfb-19", "title": "Public comparison tools \u2014 the VREG V-test and V-check and the FSMA's Wikifin \u2014 set the free baseline Peasy must beat with service", "summary": "The VREG V-test and V-check compare energy contracts in Flanders; the V-check reads an invoice code that has been mandatory since 1 July 2025, and VRT reported tens of thousands of uses in the first two months. Wikifin is the FSMA's financial-education programme launched on 31 January 2013 with a savings-account comparison tool and an IMMOsimulator.", "implication": "Implication for the domain: households can already compare energy contracts and simulate a home purchase for free with public tools, so Peasy's differentiation is execution (the switch, the file, the cancellation) and monitoring rather than the comparison itself; the energy module should accept the same invoice-code inputs so that a V-check user can be converted to a switch in one step.", "priority": "medium", "tags": ["competition", "public-tools", "energy"], "sourceIds": ["vreg-vtest", "vrt-vcheck", "wikifin-over"], "linkedCustomers": [{"customerId": "hshs", "jobIds": ["jtbd-hshs-1"], "kpiIds": ["co-hshs-b1"]}, {"customerId": "fthb", "jobIds": ["jtbd-fthb-1"], "kpiIds": ["co-fthb-b2"]}, {"customerId": "prov", "jobIds": ["jtbd-prov-1"], "kpiIds": ["co-prov-b1"]}, {"customerId": "insa", "jobIds": ["jtbd-insa-1"], "kpiIds": ["co-insa-b1"]}], "sources": [{"id": "vreg-vtest", "title": "VREG V-test and V-check \u2014 public energy contract comparison for Flanders", "url": "https://vtest.vreg.be/", "publisher": "VREG", "date": "2026-09-05"}, {"id": "vrt-vcheck", "title": "VRT NWS \u2014 V-check invoice code and first-months usage (28 August 2025)", "url": "https://www.vrt.be/vrtnws/nl/2025/08/28/v-check-v-test-energiefactuur/", "publisher": "VRT NWS", "date": "2026-09-05"}, {"id": "wikifin-over", "title": "Wikifin \u2014 the FSMA financial-education programme since 31 January 2013", "url": "https://www.wikifin.be/nl/over-wikifin", "publisher": "Wikifin (FSMA)", "date": "2026-09-05"}]}, {"id": "hfb-20", "title": "Immotheker Finotheker competes with 100 offices, 16 banks compared daily, more than 55,000 loans concluded and a mortgage monitor since 2004", "summary": "Immotheker Finotheker presents itself as '100% independent' with '+10,000 products compared', '100 offices', '+55,000 loans concluded', '150 employees' and '30 years experience'; it compares more than 2,000 mortgage loans at 16 banks daily, opened its first office on 1 April 1995 in Schoten, has run a mortgage monitor since 2004 and introduced an attestation of purchase security in 2024.", "implication": "Implication for the domain: the closest competitor already offers the two features Peasy relies on \u2014 a feasibility attestation for sellers and a mortgage monitor \u2014 and a larger office footprint, so Peasy's edge must come from 25 versus 16 banks, the multi-contract household relationship and the combined 81-office bilingual network; feature parity on certificate and monitor is table stakes.", "priority": "high", "tags": ["competition", "mortgage", "benchmark"], "sourceIds": ["immotheker-about"], "linkedCustomers": [{"customerId": "fthb", "jobIds": ["jtbd-fthb-1", "jtbd-fthb-2"], "kpiIds": ["co-fthb-top"]}, {"customerId": "refi", "jobIds": ["jtbd-refi-1"], "kpiIds": ["co-refi-top"]}, {"customerId": "frnc", "jobIds": ["jtbd-frnc-1"], "kpiIds": ["bo-frnc-top"]}, {"customerId": "bank", "jobIds": ["jtbd-bank-2"], "kpiIds": ["bo-bank-b2"]}], "sources": [{"id": "immotheker-about", "title": "Immotheker Finotheker \u2014 about us: 100 offices, 16 banks, +55,000 loans", "url": "https://www.immothekerfinotheker.be/en/about-us/", "publisher": "Immotheker Finotheker", "date": "2026-09-05"}]}]};
    const links = {"domainId": "household-finance-brokerage-platform", "updated": "2026-09-05", "groups": [{"group": "Peasy brands", "description": "The family of brands this domain is modeled on: Peasy (Zaventem), hypotheek.winkel, Verzekeringen.be / Assurances.be and Aanbieders.be / Mesfournisseurs.be.", "links": [{"title": "Peasy \u2014 besparen zonder gedoe", "url": "https://peasy.be/", "relevance": "The single consumer front door launched early 2025: mortgage loans, insurance and energy under one roof, in Dutch and French \u2014 the framing behind the household personas.", "tags": ["company", "positioning"]}, {"title": "Peasy \u2014 over ons", "url": "https://easypeasy.be/over-ons/", "relevance": "The sourced scale figures: more than 150 experts, 70 offices, more than 50,000 contracts per year, more than 50 partners and 4.5/5 customer satisfaction.", "tags": ["company", "scale"]}, {"title": "Peasy \u2014 klantenservice FAQ", "url": "https://easypeasy.be/klantenservice/", "relevance": "Explains the referral-fee revenue model, that the consumer pays nothing extra, that Peasy is never the contracting party, and that Peasy monitors brokered contracts.", "tags": ["business-model", "monitoring"]}, {"title": "Peasy \u2014 budgetbarometer", "url": "https://peasy.be/budgetbarometer/", "relevance": "The household fixed-cost benchmark against Belgian averages that starts the fixed-cost saver journey.", "tags": ["product", "household"]}, {"title": "Peasy \u2014 upload je voorstel", "url": "https://peasy.be/upload-je-voorstel/", "relevance": "Free expert review of a mortgage or insurance proposal received elsewhere \u2014 the intake behind the refinancing persona.", "tags": ["product", "refinancing"]}, {"title": "hypotheek.winkel \u2014 home", "url": "https://www.hypotheekwinkel.be/", "relevance": "70 offices, 25 banks compared daily, started 2001, the simulator set and project types, and the FPS Economy Economic Inspectorate as supervisory authority.", "tags": ["mortgage",     function topCustomerKpi(customer) {
        return (((customer || {}).kpiPyramids || {}).customerOutcomes || {}).top || null;
    }

    function formatCurrentValue(kpi) {
        if (!kpi || !kpi.currentValue) {
            return '';
        }
        return String(kpi.currentValue) + (kpi.unit ? ' (' + String(kpi.unit) + ')' : '');
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function customerLookup() {
        const lookup = {};
        customers.forEach(group => {
            group.customers.forEach(customer => {
                lookup[customer.id] = customer;
            });
        });
        return lookup;
    }

    function jobNamesForCustomer(customer, jobIds) {
        const jobs = ((customer || {}).jobsToBeDone || []);
        const jobLookup = {};
        jobs.forEach(job => {
            if (job.id) {
                jobLookup[job.id] = job.name || job.id;
            }
        });
        return (jobIds || []).map(jobId => jobLookup[jobId] || jobId);
    }

    function kpiLookupForCustomer(customer) {
        const lookup = {};
        function walk(node) {
            if (!node) return;
            if (node.id) {
                lookup[node.id] = node.name || node.id;
            }
            (node.branches || []).forEach(walk);
            (node.children || []).forEach(walk);
        }
        const pyramids = (customer || {}).kpiPyramids || {};
        ['customerOutcomes', 'businessOutcomes'].forEach(key => {
            const pyramid = pyramids[key];
            if (!pyramid) return;
            walk(pyramid.top);
            (pyramid.branches || []).forEach(walk);
        });
        return lookup;
    }

    function kpiNamesForCustomer(customer, link) {
        // Prefer stable KPI IDs; fall back to legacy display-name kpis.
        if (link && link.kpiIds && link.kpiIds.length) {
            const lookup = kpiLookupForCustomer(customer);
            return link.kpiIds.map(kpiId => lookup[kpiId] || kpiId);
        }
        return (link && link.kpis) || [];
    }

    function renderAttribute(iconFile, label, items) {
        if (!items || !items.length) return '';
        let html = '<div class="customer-attribute">';
        html += '<div class="customer-attribute-body">';
        html += '<div class="customer-attribute-label">' + escapeHtml(label) + '</div>';
        items.forEach(item => {
            html += '<div class="customer-attribute-item" title="' + escapeHtml(item) + '">' + escapeHtml(item) + '</div>';
        });
        html += '</div></div>';
        return html;
    }

    function customerMatchesSearch(customer, groupName, query) {
        if (!query) return true;
        const haystack = [customer.id, customer.name, customer.description, groupName]
            .concat(customer.careAbout || [], customer.winsThem || [], customer.theirFear || [])
            .filter(Boolean).join(' ').toLowerCase();
        return haystack.includes(query);
    }

    let customerUrlStateRestored = false;

    function renderCustomers() {
        const searchInput = document.getElementById('CustomerSearch');
        if (!customerUrlStateRestored) {
            customerUrlStateRestored = true;
            const initialQuery = new URLSearchParams(window.location.search).get('q');
            if (initialQuery && searchInput) searchInput.value = initialQuery;
        }
        const query = searchInput ? searchInput.value.trim().toLowerCase() : '';
        if (window.history && window.history.replaceState) {
            const params = new URLSearchParams(window.location.search);
            if (query) params.set('q', query); else params.delete('q');
            const qs = params.toString();
            window.history.replaceState({}, '', window.location.pathname + (qs ? '?' + qs : '') + window.location.hash);
        }
        let visible = 0;
        let total = 0;
        let html = '<div style="padding: 12px">';

        customers.forEach(group => {
            total += group.customers.length;
            const matching = group.customers.filter(customer => customerMatchesSearch(customer, group.group, query));
            visible += matching.length;
            if (!matching.length) return;
            html += '<div class="customer-group">';
            html += '<div class="customer-group-label">' + escapeHtml(group.group) + '</div>';
            matching.forEach(customer => {
                html += '<a target="_blank" href="landing_pages/' + escapeHtml(customer.id) + '.html">';
                html += '<div class="customer-card">';
                html += '<img class="customer-card-photo" src="icons/' + escapeHtml(customer.icon) + '" onerror="this.onerror=null;this.src=\'icons/customer.png\'">';
                html += '<div class="customer-card-name">' + escapeHtml(customer.name) + '</div>';
                const topKpi = topCustomerKpi(customer);
                if (topKpi && topKpi.name) {
                    html += '<div class="kpi-badge">';
                    html += '<div>KPI: ' + escapeHtml(topKpi.name) + '</div>';
                    html += '</div>';
                }
                html += renderAttribute('care.png', 'Care about', customer.careAbout);
                html += '</div></a>';
            });
            html += '</div>';
        });

        html += '</div>';
        if (!visible) {
            html = '<div class="customer-search-empty">No customers match the current search.</div>';
        }
        document.getElementById('CustomerCards').innerHTML = html;
        const summary = document.getElementById('CustomerSearchSummary');
        if (summary) {
            summary.textContent = query ? `Showing ${visible} of ${total} customers` : '';
        }
    }

    function update() {
        renderCustomers();

    function renderOverviewItems(items, emptyMessage) {
        if (!items || !items.length) {
            return '<div class="visual-overview-empty">' + escapeHtml(emptyMessage) + '</div>';
        }
        let html = '<div class="visual-overview-items">';
        items.forEach(item => {
            const name = item.name || item.id || '';
            // Summary images belong to the job or journey itself, not its steps or stages.
            const images = (item.media || []).filter(media => media && media.type === 'image' && media.src);
            html += '<div class="visual-overview-item">';
            html += '<div class="visual-overview-item-name">' + escapeHtml(name) + '</div>';
            images.forEach(media => {
                const src = escapeHtml(media.src);
                const label = 'Open summary image for ' + name + ' in a new tab';
                html += '<a class="visual-overview-image-link" href="' + src + '" target="_blank" rel="noopener noreferrer"' +
                    ' aria-label="' + escapeHtml(label) + '" title="' + escapeHtml(media.title || label) + '">';
                html += '<img class="visual-overview-image" src="' + src + '" alt="' + escapeHtml(media.alt || name + ' summary') +
                    '" loading="lazy" decoding="async"></a>';
            });
            if (!images.length) {
                html += '<div class="visual-overview-empty">No summary image available.</div>';
            }
            html += '</div>';
        });
        return html + '</div>';
    }

            }
            if (insight.linkedCustomers && insight.linkedCustomers.length) {
                html += '<div style="margin-bottom:8px"><b>Connected customers:</b></div>';
                insight.linkedCustomers.forEach(link => {
                    const customer = lookup[link.customerId];
                    html += '<div class="insight-customer-link">';
                    if (customer) {
                        html += '<a target="_blank" href="landing_pages/' + escapeHtml(customer.id) + '.html" style="color:#315b7c;font-weight:bold">' + escapeHtml(customer.name) + '</a>';
                    } else {
                        html += '<span style="font-weight:bold">' + escapeHtml(link.customerId) + '</span>';
                    }
                    if (link.jobIds && link.jobIds.length) {
                        html += '<div class="insight-source"><b>Jobs:</b> ' + escapeHtml(jobNamesForCustomer(customer, link.jobIds).join(', ')) + '</div>';
                    }
                    const kpiNames = kpiNamesForCustomer(customer, link);
                    if (kpiNames.length) {
                        html += '<div class="insight-source"><b>KPIs:</b> ' + escapeHtml(kpiNames.join(', ')) + '</div>';
                    }
                    html += '</div>';
                });
            }
            if (insight.sources && insight.sources.length) {
                html += '<div><b>Sources:</b></div>';
                insight.sources.forEach(source => {
                    html += '<div class="insight-source">';
                    html += '<a target="_blank" href="' + escapeHtml(source.url) + '" style="color:#315b7c">' + escapeHtml(source.title) + '</a>';
                    html += ' <span style="color:#6b7280">(' + escapeHtml(source.publisher || '') + (source.date ? ', ' + escapeHtml(source.date) : '') + ')</span>';
                    html += '</div>';
                });
            }
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_insights').innerHTML = html;
    }

    function renderLinks() {
        const groups = (links.groups || []).filter(group => (group.links || []).length);

        if (!groups.length) {
            document.getElementById('tab_content_links').innerHTML = '<div style="padding:16px;color:#6b7280">No external links defined for this domain yet.</div>';
            return;
        }

        let html = '<div class="links-section">';
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-label">' + escapeHtml(group.group) + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            html += '<div class="links-grid">';
            (group.links || []).forEach(link => {
                html += '<a class="link-card" target="_blank" rel="noopener" href="' + escapeHtml(link.url) + '">';
                html += '<div class="link-title">' + escapeHtml(link.title) + '</div>';
                if (link.relevance) {
                    html += '<div class="link-relevance">' + escapeHtml(link.relevance) + '</div>';
                }
                if (link.tags && link.tags.length) {
                    html += '<div>';
                    link.tags.forEach(tag => {
                        html += '<span class="link-tag">' + escapeHtml(tag) + '</span>';
                    });
                    html += '</div>';
                }
                if (link.references && link.references.length) {
                    html += '<div style="margin-top:8px;font-size:72%;color:#6b7280">Grounds: ';
                    html += link.references.map(r => escapeHtml(r.label || (r.type + ':' + r.id))).join(' · ');
                    html += '</div>';
                }
                html += '</a>';
            });
            html += '</div></div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
    }

    const relationTypeState = {};

    function toggleRelationType(typeId) {
        relationTypeState[typeId] = !relationTypeState[typeId];
        renderRelations();
    }

    function renderRelations() {
        const allRels = (relations.relations || []);
        const container = document.getElementById('tab_content_relations');
        if (!allRels.length) {
            container.innerHTML = '<div style="padding:16px;color:#6b7280">No customer relations defined for this domain yet.</div>';
            return;
        }

        const lookup = customerLookup();
        const types = relations.relationTypes || [];
        const typeById = {};
        types.forEach(type => {
            typeById[type.id] = type;
            if (!(type.id in relationTypeState)) relationTypeState[type.id] = true;
        });
        allRels.forEach(rel => {
            if (!(rel.type in relationTypeState)) relationTypeState[rel.type] = true;
        });
        const colorFor = typeId => (typeById[typeId] || {}).color || '#64748b';
        const rels = allRels.filter(rel => relationTypeState[rel.type]);

        // Nodes: customers that participate in at least one relation (regardless of
        // the type filter, so toggling never rearranges the ring), in group order.
        const nodeIds = [];
        customers.forEach(group => (group.customers || []).forEach(customer => {
            if (allRels.some(rel => rel.from === customer.id || rel.to === customer.id)) {
                nodeIds.push(customer.id);
            }
        }));

        const W = 1000, H = 660, cx = W / 2, cy = H / 2 - 14, rx = 385, ry = 235;
        const pos = {};
        nodeIds.forEach((id, i) => {
            const angle = -Math.PI / 2 + (i * 2 * Math.PI) / nodeIds.length;
            pos[id] = { x: cx + rx * Math.cos(angle), y: cy + ry * Math.sin(angle) };
        });

        let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" role="img" aria-label="Customer relations diagram">';
        svg += '<defs>';
        const markerTypes = {};
        rels.forEach(rel => { markerTypes[rel.type || 'default'] = colorFor(rel.type); });
        Object.entries(markerTypes).forEach(([typeId, color]) => {
            svg += '<marker id="rel-arrow-' + escapeHtml(typeId) + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">';
            svg += '<path d="M 0 1 L 9 5 L 0 9 z" fill="' + escapeHtml(color) + '"/></marker>';
        });
        svg += '</defs>';

        const NODE_R = 44;
        rels.forEach(rel => {
            const p1 = pos[rel.from], p2 = pos[rel.to];
            if (!p1 || !p2) return;
            const dx = p2.x - p1.x, dy = p2.y - p1.y;
            const len = Math.hypot(dx, dy) || 1;
            const ux = dx / len, uy = dy / len;
            const sx = p1.x + ux * (NODE_R + 4), sy = p1.y + uy * (NODE_R + 4);
            const ex = p2.x - ux * (NODE_R + 10), ey = p2.y - uy * (NODE_R + 10);
            // Curve every edge to its left so A→B and B→A separate visually.
            const mx = (sx + ex) / 2 - uy * 34, my = (sy + ey) / 2 + ux * 34;
            const fromName = (lookup[rel.from] || {}).name || rel.from;
            const toName = (lookup[rel.to] || {}).name || rel.to;
            svg += '<path class="relation-edge" d="M ' + sx.toFixed(1) + ' ' + sy.toFixed(1) +
                ' Q ' + mx.toFixed(1) + ' ' + my.toFixed(1) + ' ' + ex.toFixed(1) + ' ' + ey.toFixed(1) + '"' +
                ' fill="none" stroke="' + escapeHtml(colorFor(rel.type)) + '" stroke-width="2.5"' +
                ' marker-end="url(#rel-arrow-' + escapeHtml(rel.type || 'default') + ')">';
            svg += '<title>' + escapeHtml(fromName + ' → ' + toName + ': ' + (rel.name || '')) + '</title></path>';
        });

        nodeIds.forEach(id => {
            const customer = lookup[id] || {};
            const p = pos[id];
            const icon = 'icons/' + (customer.icon || (id + '.png'));
            svg += '<a class="relation-node" href="landing_pages/' + escapeHtml(id) + '.html">';
            svg += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + NODE_R + '" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>';
            svg += '<image href="' + escapeHtml(icon) + '" x="' + (p.x - 30).toFixed(1) + '" y="' + (p.y - 30).toFixed(1) + '" width="60" height="60"/>';
            const words = String(customer.name || id).split(' ');
            const lines = [];
            words.forEach(word => {
                if (lines.length && (lines[lines.length - 1] + ' ' + word).length <= 16) {
                    lines[lines.length - 1] += ' ' + word;
                } else {
                    lines.push(word);
                }
            });
            svg += '<text x="' + p.x.toFixed(1) + '" y="' + (p.y + NODE_R + 18).toFixed(1) + '" text-anchor="middle">';
            lines.forEach((line, i) => {
                svg += '<tspan x="' + p.x.toFixed(1) + '" dy="' + (i === 0 ? 0 : 15) + '">' + escapeHtml(line) + '</tspan>';
            });
            svg += '</text></a>';
        });
        svg += '</svg>';

        let html = '<div class="relations-section">';
        if (relations.description) {
            html += '<div class="relations-intro">' + escapeHtml(relations.description) + '</div>';
        }
        (relations.media || []).forEach(entry => {
            if (entry && entry.type === 'image' && entry.src) {
                html += '<div class="relations-media"><img src="' + escapeHtml(entry.src) + '"' +
                    ' alt="' + escapeHtml(entry.alt || '') + '" title="' + escapeHtml(entry.title || '') + '"></div>';
            }
        });
        html += '<div class="relations-legend">';
        Object.keys(relationTypeState).forEach(typeId => {
            const type = typeById[typeId] || { id: typeId };
            const count = allRels.filter(rel => rel.type === typeId).length;
            html += '<span class="relations-legend-item' + (relationTypeState[typeId] ? '' : ' off') + '"' +
                ' onclick="toggleRelationType(\'' + escapeHtml(typeId) + '\')"' +
                ' title="' + escapeHtml(type.description || '') + '">';
            html += '<span class="relations-legend-swatch" style="background:' + escapeHtml(type.color || '#64748b') + '"></span>';
            html += escapeHtml(type.name || typeId) + ' (' + count + ')';
            html += '</span>';
        });
        html += '<span class="relations-legend-hint">Click a type to show or hide its relations.</span>';
        html += '</div>';
        html += '<div class="relations-diagram-wrap">' + svg + '</div>';

        html += '<div class="relations-table-wrap"><table class="relations-table">';
        html += '<tr><th>From</th><th>To</th><th>Type</th><th>Relation</th><th>Description</th><th>Via streams</th></tr>';
        if (!rels.length) {
            html += '<tr><td colspan="6" class="relations-empty-row">All relation types are switched off — click a type above to show its relations.</td></tr>';
        }
        rels.forEach(rel => {
            const fromName = (lookup[rel.from] || {}).name || rel.from;
            const toName = (lookup[rel.to] || {}).name || rel.to;
            const type = typeById[rel.type] || {};
            html += '<tr>';
            html += '<td class="relation-endpoint"><a href="landing_pages/' + escapeHtml(rel.from) + '.html">' + escapeHtml(fromName) + '</a></td>';
            html += '<td class="relation-endpoint"><a href="landing_pages/' + escapeHtml(rel.to) + '.html">' + escapeHtml(toName) + '</a></td>';
            html += '<td><span class="relation-type-chip" style="background:' + escapeHtml(colorFor(rel.type)) + '">' + escapeHtml(type.name || rel.type || '') + '</span></td>';
            html += '<td class="relation-name-cell">' + escapeHtml(rel.name || '') + '</td>';
            html += '<td>' + escapeHtml(rel.description || '') + '</td>';
            html += '<td class="relation-streams">' + (rel.streamIds || []).map(escapeHtml).join('<br>') + '</td>';
            html += '</tr>';
        });
        html += '</table></div></div>';
        container.innerHTML = html;
    }

    update();
    renderVisualOverview();
    renderRelations();
    renderInsights();
    renderLinks();
    updateTabLabels();
</script>
<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../start/index.html",
      "label": "Household Finance Brokerage Platform Home"
    },
    {
      "label": "Customers"
    }
  ]
};
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>

</body>
