ocally beyond the brand's routed volume.", "unit": "EUR", "currentValue": "18", "targetValue": "12", "icon": "kpi-frnc-bo-frnc-b2-c1-l2.png", "children": []}]}, {"id": "bo-frnc-b2-c2", "name": "Cost per qualified appointment", "description": "Office operating cost per month divided by qualified appointments held.", "unit": "EUR", "currentValue": "300", "targetValue": "290", "icon": "kpi-frnc-bo-frnc-b2-c2.png", "children": [{"id": "bo-frnc-b2-c2-l1", "name": "Expert hours per appointment", "description": "Expert hours spent per qualified appointment including preparation and follow-up.", "unit": "hours", "currentValue": "2.5", "targetValue": "1.8", "icon": "kpi-frnc-bo-frnc-b2-c2-l1.png", "children": []}, {"id": "bo-frnc-b2-c2-l2", "name": "Appointments held by video call", "description": "Share of qualified appointments held by video call rather than in the office.", "unit": "%", "currentValue": "20", "targetValue": "35", "icon": "kpi-frnc-bo-frnc-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make a hypotheek.winkel franchise the most attractive way to run a mortgage advisory business in Belgium: the brand's lead engine keeps every office fed with prepared appointments, the academy and the workbench make experts productive and keep them, and production, conversion and commission are visible per file, so a franchisee steers the office from numbers and is paid from a statement that reconciles.", "timeHorizons": {"year1": {"focus": "Consolidate the three brands' demand behind one lead engine that routes every simulator, callback and upload request to the nearest office within minutes, give every franchisee the production and stuck-file dashboards, and reconcile commission statements per file with a dispute flow, while the Meilleurtaux offices are integrated with clear territory rules.", "productTheme": "One lead engine and transparent office dashboards", "customerKPI": {"northStar": "Qualified appointments per office per month", "supporting": ["Lead-to-appointment rate", "Appointment-to-loan conversion rate"]}, "businessKPI": {"northStar": "Office commission income per month", "revenueStreams": ["Office share of bank referral commissions per concluded loan", "Office share of insurer commissions on policies attached at closing"], "supporting": ["Loans concluded per office per month", "Commission statement disputes per quarter"]}, "milestones": ["Route all peasy.be, hypotheekwinkel.be and callback leads through one engine with service-level timers per office", "Give every franchisee the daily production, conversion and stuck-file dashboards per expert and lead source", "Issue commission statements per file with automatic reconciliation and a dispute flow before payout"]}, "year3": {"focus": "Turn office capacity into a planned resource: forecast lead volume per territory, academy intakes timed to vacancies, video-call desks that absorb demand beyond the office's seats, and a national bilingual network with routing rules that franchisees trust.", "productTheme": "Planned capacity across a national network", "customerKPI": {"northStar": "Qualified appointments per office per month", "supporting": ["Expert retention rate", "Leads contacted within one working day"]}, "businessKPI": {"northStar": "Office commission income per month", "revenueStreams": ["Office share of bank and insurer referral commissions", "Office share of cross-sell commissions from monitored households", "Consumer-credit referral commissions through the Meilleurtaux group"], "supporting": ["Office cost per concluded loan", "Loans concluded per expert per month"]}, "milestones": ["Forecast leads per territory and plan academy intakes and hiring against vacancies and seasonality", "Run video-call desks that take routed demand beyond an office's capacity without losing the office's commission", "Publish routing and territory rules for the combined 81-office network with benchmarks every franchisee can audit"]}, "year5": {"focus": "Let the network operate as a platform business for franchisees: AI-prepared appointments and file assembly raise loans per expert, partner APIs shorten time to deed, and the household relationship brings insurance, energy, telecom and savings commissions back to the office that closed the mortgage.", "productTheme": "The franchise as a household-finance platform business", "customerKPI": {"northStar": "Qualified appointments per office per month", "supporting": ["Experts per office", "Files lost to own bank or another broker"]}, "businessKPI": {"northStar": "Office commission income per month", "revenueStreams": ["Office share of mortgage, insurance and consumer-credit commissions", "Household lifetime commissions attributed to the originating office", "Savings and pension product commissions through the Meilleurtaux group"], "supporting": ["Office commission share per concluded loan", "Cost per qualified appointment"]}, "milestones": ["Attribute household lifetime commissions from monitored contracts to the originating office in the statements", "Prepare appointments and files with AI assistants so an office's experts serve far more buyers per month", "Offer savings, pension and consumer-credit products from the office through the group's partner APIs"]}}}}, {"id": "insa", "name": "Customer-Care Advisor", "description": "Works in the Peasy customer-care centre in Hasselt or in Oujda, Morocco, one of the advisors who handle the insurance, energy and telecom side of the household relationship for Verzekeringen.be, Aanbieders.be and peasy.be in Dutch or French. Often trained in the Peasy academy rather than recruited from an insurer, and registered where insurance distribution requires it. Takes callback requests, inbound calls, chats and e-mails from households who compared online or were handed over by a mortgage office: compares car, fire, funeral and outstanding-balance insurance across 11 insurers, electricity and gas by meter type and solar situation, internet, TV and mobile packs, explains the difference in plain language, quotes and binds the policy or places the switch order with the new supplier or operator, cancels the old contract or lets BIPT Easy Switch do it, and follows the case until the household is on the new contract. Also works the monitoring alerts on brokered contracts, calling households before a renewal with a better option. Measured on resolving requests in one contact, switches completed per day, error-free execution and the customer ratings behind peasy.be's 4.5-out-of-5 satisfaction.", "icon": "customer-insa-portrait.jpg", "careAbout": ["Comparison modules for insurance, energy and telecom that quote from the household's real data (postcode, EAN meter, solar panels, car, usage) during the call, so the advisor never has to call back with the numbers", "One desk for phone, chat, callback and e-mail across the three brands, with the household's contracts and previous contacts visible, so nobody has to repeat their story", "Switch and cancellation execution that is checked by the system: the old contract terminated on the right date, the new one started, and the household informed, without a spreadsheet of follow-ups", "Scripts and a knowledge base that cover the small print (prosumer tariffs, digital meters, outstanding-balance health questions, Easy Switch rules) so every advisor in Hasselt and Oujda gives the same correct answer", "Monitoring alerts that arrive with the saving already calculated and the household's consent, so a renewal call is a good-news call rather than cold outreach", "Fair measurement: first-contact resolution and error rates that account for cases where the partner, not the advisor, caused the delay"], "winsThem": ["A customer-care desk that opens every contact with the household's contract vault, open tickets and the comparison the household ran online, and closes it with quote, bind, switch or cancellation from the same screen", "Insurance quote and bind across 11 insurers with the health questions, documents and e-signature handled in the flow, so a policy is bound during the call", "Energy and telecom switch orders that validate meter, contract and Easy Switch data before submission and track the partner's confirmation and the old contract's end date automatically", "Cancellation letters and termination requests generated and sent from the case, with notice periods calculated, so no household pays double", "Alert queues from contract monitoring with the calculated saving and a script, so renewals and cross-sell are worked in the quiet hours"], "theirFear": ["A switch order rejected by the supplier or an old contract not cancelled in time, leaving a household paying two contracts and blaming Peasy in a Google review", "Binding an outstanding-balance or car policy on incomplete health or claims information that is later contested at the moment the household needs the cover", "Being measured on switches per day alone while complex cases, partner delays and callbacks that need three attempts drag the numbers down"], "jobsToBeDone": [{"id": "jtbd-insa-1", "name": "Resolve a comparison request in one contact", "whatItIs": "Take a household's callback, call, chat or e-mail about car, fire, funeral or outstanding-balance insurance, electricity and gas, or internet and mobile, and finish it in that contact: open the case with what the household already did online and what Peasy already brokered for them, gather the missing data (car and claims history, EAN and meter type, solar panels, usage, address), run the comparison across insurers, suppliers and operators live, explain the difference in savings and conditions in plain language, and get the household's decision and consent so the quote, bind or switch can be executed without a second call, or a clear next step scheduled when a partner document is needed.", "outcome": "Most households hang up with their decision made and the switch or policy under way, the case notes and consent are complete, callbacks are answered within the promised time, and the household rates the contact as the easy, no-hassle experience Peasy promises.", "steps": [{"step": "Open the contact with the household's context", "description": "Pick up the callback, call or chat from the omnichannel queue and see the household's account: the comparison they started online, contracts Peasy already brokered, open tickets and prior contacts across the brands, and the language and channel they prefer, so the advisor continues the conversation rather than starting it.", "streamsNeeded": [{"id": "serve-customers-through-customer-care", "name": "Serve Customers Through Customer Care", "howItSupports": "Routes phone, chat, callback and e-mail contacts to the advisor with the household's context and case history."}, {"id": "monitor-household-contracts-and-alert-savings", "name": "Monitor Household Contracts and Alert Savings", "howItSupports": "Shows the household's brokered contracts and renewal dates so the advisor sees the whole picture."}]}, {"step": "Gather the missing data and run the comparison live", "description": "Ask only for what the online comparison did not capture: car details and claims history, EAN, meter type, digital meter and solar panels, current supplier and contract end, internet and mobile usage, and run the comparison across 11 insurers, the energy suppliers and the telecom operators while the household is on the line.", "streamsNeeded": [{"id": "compare-and-switch-insurance", "name": "Compare and Switch Insurance", "howItSupports": "Quotes car, fire, funeral and outstanding-balance insurance across 11 insurers from the household's data during the call."}, {"id": "compare-and-switch-energy-contracts", "name": "Compare and Switch Energy Contracts", "howItSupports": "Compares electricity and gas contracts from postcode, meter type, digital meter and solar-panel data."}, {"id": "compare-and-switch-telecom-and-mobile", "name": "Compare and Switch Telecom and Mobile", "howItSupports": "Compares internet, TV and mobile packs from the household's usage and current operator."}]}, {"step": "Explain the options and get a decision", "description": "Present the two or three best options with the yearly saving, the conditions that matter (deductibles, prosumer tariff, contract duration, installation costs) and what changes for the household, use the script for the small print, and capture the household's choice and consent to switch or bind, or schedule a clear next step if a document or partner answer is still needed.", "streamsNeeded": [{"id": "serve-customers-through-customer-care", "name": "Serve Customers Through Customer Care", "howItSupports": "Provides the scripts, knowledge base and consent capture the advisor uses to close the decision in the call."}]}, {"step": "Close the case and confirm in writing", "description": "Record the outcome on the case, send the household the confirmation with the chosen option, the timeline and what Peasy will do next, and close the ticket or hand it to the execution queue, so the household knows what happens and the next advisor sees the full story.", "streamsNeeded": [{"id": "serve-customers-through-customer-care", "name": "Serve Customers Through Customer Care", "howItSupports": "Closes or hands over the ticket with notes and sends the written confirmation to the household."}]}], "media": [{"type": "image", "src": "media/jbtd-insa-jtbd-insa-1.png", "title": "Customer-Care Advisor JTBD infographic: Resolve a comparison request in one contact", "alt": "Enterprise infographic for the job \"Resolve a comparison request in one contact\" for customer \"Customer-Care Advisor\"."}]}, {"id": "jtbd-insa-2", "name": "Execute switches and cancellations without errors", "whatItIs": "Turn each household decision into a completed switch or bound policy without a single household paying double or losing cover: validate the data before submission, place the switch order with the new energy supplier or the telecom operator (using BIPT Easy Switch so the new fixed operator terminates the old contract), bind the insurance policy with the insurer including health questions and documents, cancel the old insurance or energy contract on the right date with the right notice, track the partner's confirmation and the start date, and intervene when a partner rejects or delays, so the household ends up on the new contract on the promised day.", "outcome": "Every switch and policy the household agreed to is executed and confirmed by the partner, the old contract ends on the day the new one starts, rejected or delayed orders are caught and fixed before the household notices, and the switch error rate stays low enough that the advisor's day is spent on new households rather than on repairs.", "steps": [{"step": "Validate the data and place the switch or bind order", "description": "Check the case data against the partner's rules (EAN and meter, address, contract end date, Easy Switch identifiers, driver and vehicle data, health declaration for outstanding-balance cover), fix what is missing with the household, and submit the switch order to the supplier or operator, or bind the policy with the insurer, from the case.", "streamsNeeded": [{"id": "compare-and-switch-energy-contracts", "name": "Compare and Switch Energy Contracts", "howItSupports": "Validates meter and contract data and submits the energy switch order to the new supplier."}, {"id": "compare-and-switch-telecom-and-mobile", "name": "Compare and Switch Telecom and Mobile", "howItSupports": "Submits the telecom switch with Easy Switch data so the new operator terminates the old contract."}, {"id": "compare-and-switch-insurance", "name": "Compare and Switch Insurance", "howItSupports": "Binds the chosen policy with the insurer including health questions, documents and e-signature."}]}, {"step": "Cancel the old contract on the right date", "description": "For insurance and energy switches where the new partner does not terminate the old contract, generate and send the cancellation with the correct notice period and end date, aligned with the start of the new contract, and record proof of the cancellation on the case so nobody pays double or loses cover.", "streamsNeeded": [{"id": "compare-and-switch-insurance", "name": "Compare and Switch Insurance", "howItSupports": "Generates and sends the insurance cancellation with notice period and end date aligned with the new policy."}, {"id": "compare-and-switch-energy-contracts", "name": "Compare and Switch Energy Contracts", "howItSupports": "Coordinates the old supplier's contract end with the new supplier's start date."}]}, {"step": "Track partner confirmations and fix rejections", "description": "Watch the execution queue for partner confirmations, start dates and rejections; resolve rejected orders (wrong EAN, missing document, failed health acceptance) with the household or the partner the same day, and escalate repeated partner problems so the catalogue or the integration is corrected.", "streamsNeeded": [{"id": "serve-customers-through-customer-care", "name": "Serve Customers Through Customer Care", "howItSupports": "Provides the execution queue with partner statuses, rejection reasons and follow-up tasks per case."}, {"id": "manage-partners-tariffs-and-commissions", "name": "Manage Partners, Tariffs and Commissions", "howItSupports": "Records confirmed contracts for commission reconciliation and flags partners with recurring rejections."}]}, {"step": "Confirm completion and store the contract for monitoring", "description": "When the partner confirms, tell the household the new contract is active and what to expect on the first invoice, store the policy or contract with its dates in the household's vault, and set the monitoring trigger so Peasy can warn them before the next renewal.", "streamsNeeded": [{"id": "monitor-household-contracts-and-alert-savings", "name": "Monitor Household Contracts and Alert Savings", "howItSupports": "Stores the executed contract per household and schedules renewal and re-comparison alerts."}]}], "media": [{"type": "image", "src": "media/jbtd-insa-jtbd-insa-2.png", "title": "Customer-Care Advisor JTBD infographic: Execute switches and cancellations without errors", "alt": "Enterprise infographic for the job \"Execute switches and cancellations without errors\" for customer \"Customer-Care Advisor\"."}]}, {"id": "jtbd-insa-3", "name": "Turn monitoring alerts into renewals and cross-sell", "whatItIs": "Work the alerts that contract monitoring raises on brokered contracts and on households handed over by the mortgage offices: an insurance renewal where a cheaper or better policy exists, an energy contract about to roll onto a more expensive tariff, a telecom promotion ending, or a household with a mortgage but no car or fire insurance through Peasy. Contact the household with the saving already calculated and consent in place, re-run the comparison with current tariffs, and convert the alert into a switch or a new contract, so that one brokered contract becomes a household relationship across insurance, energy and telecom.", "outcome": "Households hear from Peasy before they overpay, a growing share of alerts turns into a completed switch or an additional contract, cross-sell from mortgage households grows, and the advisor's quiet hours are filled with calls that households welcome.", "steps": [{"step": "Work the prioritised alert queue", "description": "Start from the queue of alerts ordered by saving and renewal date: renewals with a better option, tariffs about to change, promotions ending, and mortgage households without insurance or energy through Peasy, each with the calculated saving, the consent status and a script, so the advisor calls the right household at the right moment.", "streamsNeeded": [{"id": "monitor-household-contracts-and-alert-savings", "name": "Monitor Household Contracts and Alert Savings", "howItSupports": "Raises and prioritises alerts on brokered contracts with the calculated saving and consent status."}, {"id": "serve-customers-through-customer-care", "name": "Serve Customers Through Customer Care", "howItSupports": "Presents the alert queue as tasks in the advisor's desk with scripts and contact history."}]}, {"step": "Re-compare with current tariffs and present the saving", "description": "Refresh the comparison with today's tariffs and the household's current data, confirm the saving and the conditions, and present it by phone, chat or e-mail in the household's language as a concrete yearly amount and a clear next step.", "streamsNeeded": [{"id": "compare-and-switch-insurance", "name": "Compare and Switch Insurance", "howItSupports": "Re-quotes the renewing policy across 11 insurers with current tariffs."}, {"id": "compare-and-switch-energy-contracts", "name": "Compare and Switch Energy Contracts", "howItSupports": "Re-compares the household's energy contract against current supplier tariffs."}, {"id": "compare-and-switch-telecom-and-mobile", "name": "Compare and Switch Telecom and Mobile", "howItSupports": "Re-compares the household's telecom pack when a promotion ends or usage changed."}]}, {"step": "Offer the next contract the household is missing", "description": "When the household's vault shows a mortgage without fire or car insurance through Peasy, or energy without telecom, propose the comparison for that contract in the same call, and route mortgage-related questions back to the household's office so the office and customer care share one relationship.", "streamsNeeded": [{"id": "monitor-household-contracts-and-alert-savings", "name": "Monitor Household Contracts and Alert Savings", "howItSupports": "Shows the household's contract gaps and cross-sell suggestions from the customer 360 view."}, {"id": "book-and-hold-an-advisory-appointment", "name": "Book and Hold an Advisory Appointment", "howItSupports": "Books an appointment with the household's mortgage office when a loan question comes up."}]}, {"step": "Convert the alert into an executed switch", "description": "Capture the household's decision and consent, hand the case to execution or execute it directly, record the alert outcome (accepted, declined, postponed and why) so monitoring learns which alerts households value, and store the new contract for the next cycle.", "streamsNeeded": [{"id": "serve-customers-through-customer-care", "name": "Serve Customers Through Customer Care", "howItSupports": "Records the alert outcome and consent on the case and hands it to the execution queue."}, {"id": "monitor-household-contracts-and-alert-savings", "name": "Monitor Household Contracts and Alert Savings", "howItSupports": "Updates the household's contracts and alert acceptance history for the next re-comparison."}]}], "media": [{"type": "image", "src": "media/jbtd-insa-jtbd-insa-3.png", "title": "Customer-Care Advisor JTBD infographic: Turn monitoring alerts into renewals and cross-sell", "alt": "Enterprise infographic for the job \"Turn monitoring alerts into renewals and cross-sell\" for customer \"Customer-Care Advisor\"."}]}], "customerJourneyStories": [{"id": "journey-insa-1", "name": "Starting in the Hasselt customer-care centre through the academy", "linkedJobIds": ["jtbd-insa-1", "jtbd-insa-2"], "summary": "A former retention agent at an energy supplier's call centre, tired of reading scripts to customers who wanted to leave, joins the Peasy customer-care centre in Hasselt, is trained in the academy on the comparison modules, the switch tooling and the insurance distribution rules, worries about promising savings she cannot execute, and within months resolves most callbacks in one contact and works the monitoring alerts in her quiet hours.", "stages": [{"stage": "Trigger", "narrative": "After years on an energy supplier's retention desk, where her job was to talk customers out of leaving, she wants to sit on the other side of the call. A Peasy vacancy in Hasselt describes advising households on insurance, energy and telecom by phone and chat, with training provided, and a former colleague who moved there a year earlier says the comparison tooling gives her the number instead of a script."}, {"stage": "Discovery", "narrative": "In the academy she meets the customer-care desk and the comparison modules from the household's side first: the online comparisons on Verzekeringen.be and Aanbieders.be, the callback request, and then the advisor screen that opens with the household's contracts and runs insurance across 11 insurers, energy by meter type and telecom by usage. She listens in on live calls in Hasselt before taking her own."}, {"stage": "Evaluation", "narrative": "Her doubt is whether she can stand behind a saving she quotes on the phone: will the switch actually happen, will the old contract be cancelled, will the outstanding-balance policy hold? The execution queue with partner confirmations, the cancellation generated from the case, the Easy Switch rules in the scripts and the insurance-distribution exam in the academy give her the confidence, and the peasy.be satisfaction score suggests it works."}, {"stage": "Trial", "narrative": "Her first weeks are callbacks on energy and car insurance with a mentor listening: she resolves most in one contact, one switch is rejected for a wrong EAN and she learns the validation step, and one household thanks her in a Google review for the cancellation letter she sent the same day."}, {"stage": "Engagement", "narrative": "Within months she takes calls and chats across the three brands in Dutch and French from one desk, binds policies during the call, places switches that the system validates and tracks, and fills quiet hours from the monitoring alert queue with calls that households welcome because the saving is already calculated."}, {"stage": "Retention", "narrative": "She stays because the calls now end with a household that is better off rather than one that was talked into staying, because the desk measures her first-contact resolution and error rate without counting partner delays against her, and because the same desk lets her take French chats for Mesfournisseurs.be on quiet days. When the centre pilots the monitoring alert queue, she is the first to volunteer, and the rejected-EAN check she asked for in her first month is now a validation step every advisor uses."}], "media": [{"type": "image", "src": "media/journey-insa-insa-1.png", "title": "Customer-Care Advisor customer journey: Starting in the Hasselt customer-care centre through the academy", "alt": "Enterprise journey storyboard for \"Starting in the Hasselt customer-care centre through the academy\" for customer \"Customer-Care Advisor\"."}]}, {"id": "journey-insa-2", "name": "Adopting one customer-care desk across three brands and two centres", "linkedJobIds": ["jtbd-insa-1", "jtbd-insa-3"], "summary": "The customer-care teams in Hasselt and Oujda, working with separate tools inherited from Verzekeringen.be and Aanbieders.be and a spreadsheet of switch follow-ups, move onto one omnichannel desk with the household's contract vault, execution queue and monitoring alerts after the Peasy rebrand, and end up resolving more contacts in one call with fewer switch errors.", "stages": [{"stage": "Trigger", "narrative": "After the rebrand to Peasy, a household that switched energy through Aanbieders.be and insurance through Verzekeringen.be calls about their mortgage office's fire-insurance question and has to tell the story three times, because each brand's tool holds a different piece and the switch follow-ups live in a spreadsheet in Hasselt. Team leads in both centres ask for one desk."}, {"stage": "Discovery", "narrative": "The brokerage-tooling team shows the customer-care desk: one omnichannel inbox for phone, chat, callback and e-mail across the brands, the household's contract vault and prior contacts on every case, quote and bind, switch and cancellation executed from the case, an execution queue with partner confirmations, and the monitoring alerts as a task queue. Advisors in Oujda see the same screen in French."}, {"stage": "Evaluation", "narrative": "The advisors ask whether one desk means being measured on switches per day across everything and whether partner delays will count against them; the team leads ask whether the two centres can share queues without losing language quality. The desk's fair first-contact-resolution and error definitions, language-aware routing and the pilot's design answer both, and the FSMA insurance-distribution records stay per advisor."}, {"stage": "Trial", "narrative": "Hasselt runs the desk for energy and telecom for a month while Oujda continues on the old tools. First-contact resolution rises because the comparison runs live, the execution queue catches two rejected switches the spreadsheet would have missed, and a household with a mortgage is offered fire insurance in the same call for the first time."}, {"stage": "Engagement", "narrative": "Both centres move onto the desk for all three brands: contacts open with the household's context, policies are bound and switches placed from the case, cancellations are generated with the right dates, and the monitoring alert queue fills the quiet hours. Team leads plan capacity across Hasselt and Oujda from the same queues."}, {"stage": "Retention", "narrative": "The old tools are switched off after the second month, and neither centre asks for them back: switch errors and double payments have dropped, advisors work across brands and languages from one desk, the household relationship handed over by the mortgage offices is finally visible, and the centres' first-contact resolution is the number the whole company watches."}], "media": [{"type": "image", "src": "media/journey-insa-insa-2.png", "title": "Customer-Care Advisor customer journey: Adopting one customer-care desk across three brands and two centres", "alt": "Enterprise journey storyboard for \"Adopting one customer-care desk across three brands and two centres\" for customer \"Customer-Care Advisor\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-insa-top", "name": "First-contact resolution rate", "description": "Share of customer-care contacts (callback, phone, chat, e-mail) about a comparison, switch, cancellation or alert that are resolved in that first contact without a further contact from the household. Modeled seed value for the Hasselt and Oujda centres; not an official Peasy figure.", "unit": "%", "currentValue": "68", "targetValue": "85", "link": "https://dashboard.example.com/household-finance-brokerage-platform/customers/insa/kpis/co-insa-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-insa-co-insa-top.png"}, "branches": [{"id": "co-insa-b1", "name": "Resolution speed and quality", "description": "How quickly a contact is answered and handled and whether the advisor has the data, scripts and modules to decide in the call.", "currentValue": "64", "icon": "kpi-insa-co-insa-b1.png", "children": [{"id": "co-insa-b1-c1", "name": "Average handling time per contact", "description": "Average minutes an advisor spends per contact including the live comparison and case notes.", "unit": "minutes", "currentValue": "14", "targetValue": "10", "icon": "kpi-insa-co-insa-b1-c1.png", "children": [{"id": "co-insa-b1-c1-l1", "name": "Comparisons run live during the contact", "description": "Share of comparison requests where the quote or comparison is produced while the household is on the line.", "unit": "%", "currentValue": "60", "targetValue": "85", "icon": "kpi-insa-co-insa-b1-c1-l1.png", "children": []}, {"id": "co-insa-b1-c1-l2", "name": "Requests covered by scripts and knowledge base", "description": "Share of contacts whose question is covered by a maintained script or knowledge article.", "unit": "%", "currentValue": "75", "targetValue": "92", "icon": "kpi-insa-co-insa-b1-c1-l2.png", "children": []}]}, {"id": "co-insa-b1-c2", "name": "Callbacks answered within one working day", "description": "S
