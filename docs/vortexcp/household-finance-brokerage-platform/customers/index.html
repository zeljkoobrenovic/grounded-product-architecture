alue": "55", "targetValue": "40", "icon": "kpi-insa-bo-insa-b2-c1.png", "children": [{"id": "bo-insa-b2-c1-l1", "name": "Advisor cost per month", "description": "Fully loaded monthly cost of a customer-care advisor blended across Hasselt and Oujda.", "unit": "EUR", "currentValue": "4400", "targetValue": "5200", "icon": "kpi-insa-bo-insa-b2-c1-l1.png", "children": []}, {"id": "bo-insa-b2-c1-l2", "name": "Rework minutes per switch error", "description": "Advisor minutes spent per execution error on repair, partner contact and household follow-up.", "unit": "minutes", "currentValue": "45", "targetValue": "30", "icon": "kpi-insa-bo-insa-b2-c1-l2.png", "children": []}]}, {"id": "bo-insa-b2-c2", "name": "Contacts handled per advisor per month", "description": "Contacts handled per advisor per month across all channels and brands.", "unit": "contacts", "currentValue": "560", "targetValue": "600", "icon": "kpi-insa-bo-insa-b2-c2.png", "children": [{"id": "bo-insa-b2-c2-l1", "name": "Contacts handled by chat", "description": "Share of contacts handled by chat rather than by phone, which allows several in parallel.", "unit": "%", "currentValue": "25", "targetValue": "40", "icon": "kpi-insa-bo-insa-b2-c2-l1.png", "children": []}, {"id": "bo-insa-b2-c2-l2", "name": "Advisor occupancy rate", "description": "Share of an advisor's logged time spent on contacts, execution and alerts rather than waiting or internal work.", "unit": "%", "currentValue": "72", "targetValue": "80", "icon": "kpi-insa-bo-insa-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make the Peasy customer-care advisor the person who fixes a household's insurance, energy and telecom in one call: the desk opens with the household's contracts, compares live across 11 insurers and every supplier and operator, binds, switches and cancels from the case with the partner's confirmation tracked, and turns monitoring alerts into welcome calls, so advisors in Hasselt and Oujda resolve more in one contact with fewer errors.", "timeHorizons": {"year1": {"focus": "Consolidate the three brands' customer care onto one omnichannel desk with live comparison, quote and bind, switch and cancellation execution and an execution queue with partner confirmations, so contacts are resolved in one call and switch errors drop while the centres in Hasselt and Oujda share queues.", "productTheme": "One desk, one contact, error-free execution", "customerKPI": {"northStar": "First-contact resolution rate", "supporting": ["Switches completed per advisor per day", "Switch error rate"]}, "businessKPI": {"northStar": "Referral commission per advisor per month", "revenueStreams": ["Insurer referral commissions per bound policy", "Energy supplier commissions per executed switch", "Telecom operator commissions per executed switch"], "supporting": ["Contracts concluded per advisor per month", "Cost per contract concluded"]}, "milestones": ["Move Hasselt and Oujda onto one desk for phone, chat, callback and e-mail across peasy.be, Verzekeringen.be and Aanbieders.be", "Run quote and bind, energy and telecom switch orders and cancellations from the case with validation before submission", "Track partner confirmations and rejections in an execution queue and measure switch errors per cause"]}, "year3": {"focus": "Make the monitored household the centre of customer care: alerts with calculated savings feed the advisor's queue, mortgage households handed over by the offices are offered insurance, energy and telecom, and partner APIs return quotes and confirmations in real time.", "productTheme": "Alerts and cross-sell from the household vault", "customerKPI": {"northStar": "First-contact resolution rate", "supporting": ["Callbacks answered within one working day", "Comparisons run live during the contact"]}, "businessKPI": {"northStar": "Referral commission per advisor per month", "revenueStreams": ["Insurer, energy and telecom referral commissions", "Renewal and cross-sell commissions from monitored households", "Business energy and telecom commissions for small companies"], "supporting": ["Average referral commission per contract", "Contracts per household served"]}, "milestones": ["Work monitoring alerts from a prioritised queue with calculated savings and consent for every brokered contract", "Offer the missing contract to every mortgage household handed over by the offices in the same contact", "Receive quotes, bind confirmations and switch statuses from partner APIs during the call"]}, "year5": {"focus": "Let AI assistants prepare comparisons, draft explanations and execute standard switches under advisor supervision, so advisors handle the complex and the human cases across a pan-European partner marketplace while standard switches complete without a call.", "productTheme": "Advisor-supervised automated switching", "customerKPI": {"northStar": "First-contact resolution rate", "supporting": ["Average handling time per contact", "Old-contract cancellations missed or late"]}, "businessKPI": {"northStar": "Referral commission per advisor per month", "revenueStreams": ["Insurer, energy and telecom referral commissions through real-time partner APIs", "Household lifetime commissions across insurance, energy, telecom and savings products", "Marketplace commissions from partners in other European markets"], "supporting": ["Advisor occupancy rate", "Contacts handled per advisor per month"]}, "milestones": ["Automate standard energy and telecom switches end to end with advisor supervision by exception", "Draft comparison explanations and cancellation letters with assistants the advisor approves in the call", "Grow contracts per advisor well beyond today's level while holding first-contact resolution and error rate at target"]}}}}]}, {"group": "Partners and Providers", "description": "The banks, insurers, energy suppliers and telecom operators whose products Peasy compares and who pay the referral fees that keep the service free for households: they want accurate listing, complete files and orders, predictable volume at a known cost per contract and commissions settled without disputes.", "customers": [{"id": "bank", "name": "Lender Partner", "description": "The broker-channel manager at one of the 25 banks whose mortgage conditions hypotheek.winkel compares every day. Sits in the bank's head office, owns the relationship with credit intermediaries and answers internally for the volume, quality and cost of the loans that arrive through brokers rather than through the bank's own branches. Publishes the rate sheet, acceptance criteria and campaign conditions the experts compare against, receives credit files from about 70 offices and has the credit department assess them: income and savings, the compromis, the EPC and the renovation obligation, and the outstanding-balance and fire insurance conditions. Pays a referral commission per concluded loan, which is why the buyer pays nothing extra, and reconciles those commissions against the broker's statements. Wants files that are complete and compliant at first submission so the decision is fast, a predictable monthly inflow that credit staff can be planned against, and no surprises in commission disputes or supervisory findings. Is judged inside the bank on broker-channel volume, cost per acquired loan, approval turnaround and portfolio credit quality, and by Peasy on how quickly and reliably the bank decides.", "icon": "customer-bank-portrait.jpg", "careAbout": ["Files that are complete and inside the published acceptance criteria at first submission, with the advice record and every income, savings, property and insurance document attached", "A decision cycle measured in days, because a slow answer costs the bank the file to one of the other 24 banks the expert compared", "Predictable monthly inflow of files, so the credit department can plan capacity instead of absorbing peaks", "A cost per acquired loan that stays below the bank's own branch acquisition cost, with the referral commission paid only on loans that reach the deed", "Commission statements that match the bank's own record of concluded loans line by line, without months of dispute", "Broker files that pass FSMA and internal audit as cleanly as branch files, because the bank remains the lender of record"], "winsThem": ["A partner portal that receives files digitally with a completeness check and the advice record, shows the bank where each file stands and returns decisions and conditions into the expert's workbench", "A daily rate and conditions feed the bank controls itself, so campaign rates and criteria are live in the comparison of 25 banks the same morning", "Commission statements per concluded loan, generated from deed dates and matched against the bank's own list, with disputes handled in the portal rather than by e-mail", "File-quality feedback per office that visibly reduces missing-document requests and avoidable declines quarter over quarter", "A single channel contact at Peasy for partner terms, volume planning and quality reviews, extended to the Meilleurtaux network after the acquisition"], "theirFear": ["Approving files quickly and later finding that the income documentation or the advice record does not hold up in an audit", "Losing volume to other banks in the comparison because the bank's turnaround is slower, without seeing it happen", "Paying referral commissions on loans that never reached the deed, or disputing statements for months with no shared record"], "jobsToBeDone": [{"id": "jtbd-bank-1", "name": "Receive complete, compliant credit files I can approve quickly", "whatItIs": "Run the bank's side of the broker channel so that every credit file arriving from a hypotheek.winkel office can be assessed in one pass: keep the daily rate sheet and acceptance criteria the experts compare against current, receive files with all income, savings, property and insurance documents and the advice record attached, assess and decide without rounds of missing-document requests, issue the offer and follow the file through insurance conditions, notary deed and disbursement, and feed file-quality observations back to the broker so that the next files from the same office are better.", "outcome": "Files arrive complete and inside the published criteria, the credit department decides in days rather than weeks, declines are for credit reasons rather than paperwork, and approved loans reach the deed with the insurance conditions fulfilled.", "steps": [{"step": "Publish daily conditions and acceptance criteria to the channel", "description": "Send the bank's rate sheet, product conditions, campaign rates, maximum loan-to-value and debt-ratio rules and document requirements to the broker each morning, so the experts compare the right conditions across 25 banks and only submit files the bank can actually accept.", "streamsNeeded": [{"id": "compare-mortgage-offers-across-banks", "name": "Compare Mortgage Offers Across Banks", "howItSupports": "Ingests the bank's daily conditions into the comparison the experts run, so the bank is compared on today's rates and rules."}, {"id": "manage-partners-tariffs-and-commissions", "name": "Manage Partners, Tariffs and Commissions", "howItSupports": "Holds the bank's partner agreement, product catalogue and acceptance criteria that the daily feed is validated against."}]}, {"step": "Receive a complete file with the advice record attached", "description": "Take in the credit file digitally with the buyer's identity, income and savings evidence, the compromis, the EPC and renovation plan, the requested loan structure and the expert's advice and suitability record, checked for completeness before it reaches the credit department.", "streamsNeeded": [{"id": "assemble-and-submit-the-loan-file", "name": "Assemble and Submit the Loan File", "howItSupports": "Assembles the file to the bank's document checklist and submits it through the bank interface with a completeness check."}, {"id": "comply-with-fsma-and-data-protection", "name": "Comply with FSMA and Data Protection", "howItSupports": "Attaches the advice record and consent evidence the bank needs to show that the intermediation was compliant."}]}, {"step": "Assess the file and decide with minimal back-and-forth", "description": "Have the credit analyst assess income, collateral and the Central Individual Credit Register, request any missing element once through the portal rather than by mail, and return an approval with conditions, a counter-proposal or a decline with a reason the expert can explain to the buyer.", "streamsNeeded": [{"id": "assemble-and-submit-the-loan-file", "name": "Assemble and Submit the Loan File", "howItSupports": "Tracks the bank's questions, the expert's answers and the decision on one file timeline visible to both sides."}]}, {"step": "Issue the offer and follow closing to disbursement", "description": "Send the binding offer, receive the signed acceptance, confirm that the outstanding-balance and fire insurance conditions are fulfilled, receive the notary's request for funds and disburse on the deed date, with the expert following the buyer so no deadline in the compromis is missed.", "streamsNeeded": [{"id": "close-the-loan-through-notary-and-insurance", "name": "Close the Loan Through Notary and Insurance", "howItSupports": "Coordinates offer signature, insurance conditions, notary deed and disbursement between bank, expert, insurer and notary."}]}, {"step": "Feed file-quality findings back to the offices", "description": "Review each quarter which offices submit complete files and which generate missing-document requests or avoidable declines, share the findings with Peasy head office, and see them turned into checklist changes and academy content.", "streamsNeeded": [{"id": "run-the-franchise-office-network", "name": "Run the Franchise Office Network", "howItSupports": "Shows file completeness and decline reasons per office so quality feedback lands where it can be acted on."}, {"id": "manage-partners-tariffs-and-commissions", "name": "Manage Partners, Tariffs and Commissions", "howItSupports": "Records the bank's quality feedback in the partner review and follows the agreed improvements."}]}], "media": [{"type": "image", "src": "media/jbtd-bank-jtbd-bank-1.png", "title": "Lender Partner JTBD infographic: Receive complete, compliant credit files I can approve quickly", "alt": "Enterprise infographic for the job \"Receive complete, compliant credit files I can approve quickly\" for customer \"Lender Partner\"."}]}, {"id": "jtbd-bank-2", "name": "Grow mortgage volume through the broker channel at predictable cost", "whatItIs": "Make the hypotheek.winkel channel a planned source of mortgage production for the bank: agree partner terms and a referral commission per concluded loan, position the bank's products so that experts comparing 25 banks recommend them for the right buyer profiles, plan inflow and campaigns with the network around rate moves and refinancing waves, reconcile concluded loans against commission statements, and review the channel each quarter on volume, win rate, cost per loan and credit quality against the bank's branch and other broker channels.", "outcome": "The bank gets a predictable, growing share of the loans concluded through about 70 offices at a cost per acquired loan below its own branch acquisition cost, with commissions paid only on loans that reached the deed and no open disputes.", "steps": [{"step": "Agree channel terms and the referral commission", "description": "Negotiate the partner agreement: commission per concluded loan, clawback when a loan is repaid early, service levels for file acknowledgement and decision, data exchange, the bank's acceptance criteria and the reporting both sides expect.", "streamsNeeded": [{"id": "manage-partners-tariffs-and-commissions", "name": "Manage Partners, Tariffs and Commissions", "howItSupports": "Holds the partner agreement, commission schedule and service levels the channel is measured against."}]}, {"step": "Position products where experts compare 25 banks", "description": "Decide which products, rates and campaign conditions the bank exposes to the channel for first-time buyers, refinancers, renovation loans and self-employed buyers, and check how often the bank is recommended in the comparison and why.", "streamsNeeded": [{"id": "compare-mortgage-offers-across-banks", "name": "Compare Mortgage Offers Across Banks", "howItSupports": "Shows the bank how its conditions rank in the experts' comparison for each buyer profile and where it loses."}, {"id": "refinance-or-extend-an-existing-loan", "name": "Refinance or Extend an Existing Loan", "howItSupports": "Exposes the bank's refinancing, renovation and second-home products to the refinancing cases in the network."}]}, {"step": "Plan inflow and campaigns with the network", "description": "Use the network's pipeline of appointments and feasibility certificates to forecast monthly file inflow, plan credit capacity and time campaign rates with head office and the offices, especially when rates move or the market recovers.", "streamsNeeded": [{"id": "run-the-franchise-office-network", "name": "Run the Franchise Office Network", "howItSupports": "Provides the network's appointment and production pipeline that the bank's volume forecast is built on."}, {"id": "simulate-and-check-mortgage-feasibility", "name": "Simulate and Check Mortgage Feasibility", "howItSupports": "Signals upcoming demand through simulations and feasibility certificates issued to buyers."}]}, {"step": "Reconcile concluded loans and commissions", "description": "Match the monthly commission statement against the bank's own list of disbursed loans, resolve loans missing on either side, cancellations and early repayments, and pay the commission the network and its advisors are waiting for.", "streamsNeeded": [{"id": "manage-partners-tariffs-and-commissions", "name": "Manage Partners, Tariffs and Commissions", "howItSupports": "Generates the commission statement from deed dates and matches it with the bank's disbursement list."}, {"id": "close-the-loan-through-notary-and-insurance", "name": "Close the Loan Through Notary and Insurance", "howItSupports": "Supplies the deed and disbursement milestones that trigger a commission line."}]}, {"step": "Review channel performance each quarter", "description": "Sit down with Peasy head office with volume, win rate, turnaround, completeness, decline reasons and commission cost per loan, compare them with the bank's other channels and agree changes to products, criteria or service levels.", "streamsNeeded": [{"id": "manage-partners-tariffs-and-commissions", "name": "Manage Partners, Tariffs and Commissions", "howItSupports": "Provides the partner review pack with volume, cost and quality per period and the agreed actions."}, {"id": "run-the-franchise-office-network", "name": "Run the Franchise Office Network", "howItSupports": "Breaks channel performance down by office so both sides see where volume and quality come from."}]}], "media": [{"type": "image", "src": "media/jbtd-bank-jtbd-bank-2.png", "title": "Lender Partner JTBD infographic: Grow mortgage volume through the broker channel at predictable cost", "alt": "Enterprise infographic for the job \"Grow mortgage volume through the broker channel at predictable cost\" for customer \"Lender Partner\"."}]}], "customerJourneyStories": [{"id": "journey-bank-1", "name": "A bank joins the 25-bank panel and moves to digital file exchange", "linkedJobIds": ["jtbd-bank-1", "jtbd-bank-2"], "summary": "The broker-channel manager of a mid-sized Belgian bank that wants mortgage production outside its own branches joins the hypotheek.winkel panel, starts with files by e-mail and ends with digital file exchange, decisions returned into the expert's workbench and a monthly inflow the credit department can plan against.", "stages": [{"stage": "Trigger", "narrative": "The bank's branch network produces fewer mortgages each year and the board wants production through intermediaries, but the manager's experience with brokers is of incomplete files sent by e-mail, decisions chased by phone and commission disputes that drag on. He needs a channel that brings volume without swamping the credit department."}, {"stage": "Discovery", "narrative": "He hears from a colleague at another bank that hypotheek.winkel compares 25 banks daily from about 70 offices, sees the brand's 4.8/5 Trustpilot rating and its feasibility certificate in the market, and is approached by Peasy's partner management with production figures for the network and the acquisition costs other banks report through the channel."}, {"stage": "Evaluation", "narrative": "He evaluates the partner agreement: the referral commission per concluded loan against the bank's branch acquisition cost, the file checklist and advice record the experts deliver, the completeness check before submission, how the daily conditions feed is controlled, data-protection and FSMA record-keeping, and references from two panel banks. Risk and compliance sign off because the bank remains the lender of record with a full file."}, {"stage": "Trial", "narrative": "The bank is added to the comparison for one region first, with its rate sheet in the daily feed and files arriving through the portal. In the first quarter the credit department sees files with fewer missing-document requests than branch files, acknowledges them the same day and returns decisions that appear in the expert's workbench; the first commission statement matches the bank's disbursement list."}, {"stage": "Engagement", "narrative": "The channel becomes part of the bank's production planning: the manager reads the network's pipeline each month, times campaign rates with head office, watches where the bank wins and loses in the comparison, and reviews file quality per office each quarter with Peasy; credit analysts treat broker files as routine work."}, {"stage": "Retention", "narrative": "The bank stays on the panel and expands to the whole network because approval turnaround and cost per acquired loan beat its other channels, and after the Meilleurtaux acquisition it asks to extend the same agreement to the combined 81 offices nationwide."}], "media": [{"type": "image", "src": "media/journey-bank-bank-1.png", "title": "Lender Partner customer journey: A bank joins the 25-bank panel and moves to digital file exchange", "alt": "Enterprise journey storyboard for \"A bank joins the 25-bank panel and moves to digital file exchange\" for customer \"Lender Partner\"."}]}, {"id": "journey-bank-2", "name": "A panel bank replaces spreadsheet commission reconciliation with the partner portal", "linkedJobIds": ["jtbd-bank-2", "jtbd-bank-1"], "summary": "A long-standing panel bank whose broker-channel team reconciles referral commissions in spreadsheets and settles disputes by e-mail adopts the partner portal's commission statements and dispute workflow, and ends up with statements that match its disbursement list and a quarterly channel review built on shared numbers.", "stages": [{"stage": "Trigger", "narrative": "Each month the channel team spends days matching Peasy's commission invoice to the bank's list of disbursed loans, finds loans on one side but not the other, argues about cancellations and early repayments and pays late, which the network's offices notice. The manager's controller asks for an auditable process."}, {"stage": "Discovery", "narrative": "During the quarterly review Peasy's partner management shows the portal's commission statements generated from deed dates, the matching against a bank disbursement export and the dispute workflow, and mentions that other panel banks have cut their reconciliation to a few hours per month."}, {"stage": "Evaluation", "narrative": "The manager and his controller check what the bank must provide (a monthly disbursement export with file reference and deed date), how differences are flagged and resolved, how clawbacks on early repayments are handled, what the audit trail looks like and whether the exchange satisfies the bank's data-protection and outsourcing rules. IT confirms the export is a small change."}, {"stage": "Trial", "narrative": "For two months the bank runs the portal statement in parallel with its spreadsheet. The automatic match explains most lines, the remaining differences are real cases (a loan disbursed under a changed file reference, a cancelled deed) and are closed in the portal with a reason; the payment goes out on time for the first time in a year."}, {"stage": "Engagement", "narrative": "The spreadsheet is retired. The channel team approves the statement in the portal each month, disputes are rare and resolved inside the service level, and the same data feeds the quarterly review of volume, win rate, turnaround and cost per loan with Peasy."}, {"stage": "Retention", "narrative": "The bank keeps the process because the controller now signs off a reconciled statement in minutes, the network is paid on time, and the manager uses the shared figures to negotiate campaign windows rather than to argue about last month's lines."}], "media": [{"type": "image", "src": "media/journey-bank-bank-2.png", "title": "Lender Partner customer journey: A panel bank replaces spreadsheet commission reconciliation with the partner portal", "alt": "Enterprise journey storyboard for \"A panel bank replaces spreadsheet commission reconciliation with the partner portal\" for customer \"Lender Partner\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-bank-top", "name": "File approval turnaround time", "description": "Average number of calendar days between submission of a complete credit file by a hypotheek.winkel office and the bank's decision (approval with conditions, counter-proposal or decline). Modeled seed value for a panel bank in the broker channel, not an official figure.", "unit": "days", "currentValue": "9", "targetValue": "5", "link": "https://dashboard.example.com/household-finance-brokerage-platform/customers/bank/kpis/co-bank-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-bank-co-bank-top.png"}, "branches": [{"id": "co-bank-b1", "name": "File quality at submission", "description": "Whether files arrive complete, inside the acceptance criteria and with the records the bank needs, so they can be assessed in one pass.", "currentValue": "64", "icon": "kpi-bank-co-bank-b1.png", "children": [{"id": "co-bank-b1-c1", "name": "File completeness rate", "description": "Share of submitted files that contain every document on the bank's checklist and the advice record at first submission.", "unit": "%", "currentValue": "72", "targetValue": "90", "icon": "kpi-bank-co-bank-b1-c1.png", "children": [{"id": "co-bank-b1-c1-l1", "name": "Missing-document requests per file", "description": "Average number of requests for missing or corrected documents the bank sends per file before deciding.", "unit": "requests", "currentValue": "1.4", "targetValue": "0.5", "icon": "kpi-bank-co-bank-b1-c1-l1.png", "children": []}, {"id": "co-bank-b1-c1-l2", "name": "Advice record attached rate", "description": "Share of files submitted with the expert's advice and suitability record attached.", "unit": "%", "currentValue": "88", "targetValue": "99", "icon": "kpi-bank-co-bank-b1-c1-l2.png", "children": []}]}, {"id": "co-bank-b1-c2", "name": "Files declined for avoidable reasons", "description": "Share of submitted files declined because of paperwork or criteria that the expert could have checked, rather than credit risk.", "unit": "%", "currentValue": "8", "targetValue": "3", "icon": "kpi-bank-co-bank-b1-c2.png", "children": [{"id": "co-bank-b1-c2-l1", "name": "Files outside published acceptance criteria", "description": "Share of submitted files that breach the bank's published loan-to-value, debt-ratio or product rules.", "unit": "%", "currentValue": "5", "targetValue": "2", "icon": "kpi-bank-co-bank-b1-c2-l1.png", "children": []}, {"id": "co-bank-b1-c2-l2", "name": "Documentation errors per 100 files", "description": "Income, savings or collateral documentation errors found by credit analysts per 100 files.", "unit": "errors", "currentValue": "6", "targetValue": "2", "icon": "kpi-bank-co-bank-b1-c2-l2.png", "children": []}]}]}, {"id": "co-bank-b2", "name": "Decision and closing speed", "description": "How quickly the bank acknowledges, assesses and decides, and how smoothly approved loans reach disbursement.", "currentValue": "58", "icon": "kpi-bank-co-bank-b2.png", "children": [{"id": "co-bank-b2-c1", "name": "Time from submission to first assessment", "description": "Calendar days between digital submission and the first analyst review of the file.", "unit": "days", "currentValue": "3", "targetValue": "1", "icon": "kpi-bank-co-bank-b2-c1.png", "children": [{"id": "co-bank-b2-c1-l1", "name": "Files submitted through the bank integration", "description": "Share of files received through the digital submission interface rather than e-mail.", "unit": "%", "currentValue": "60", "targetValue": "95", "icon": "kpi-bank-co-bank-b2-c1-l1.png", "children": []}, {"id": "co-bank-b2-c1-l2", "name": "Same-day acknowledgement rate", "description": "Share of files acknowledged by the bank on the day of submission.", "unit": "%", "currentValue": "70", "targetValue": "95", "icon": "kpi-bank-co-bank-b2-c1-l2.png", "children": []}]}, {"id": "co-bank-b2-c2", "name": "Time from approval to disbursement", "description": "Calendar days between the bank's approval and the disbursement of funds at the notary deed.", "unit": "days", "currentValue": "45", "targetValue": "35", "icon": "kpi-bank-co-bank-b2-c2.png", "children": [{"id": "co-bank-b2-c2-l1", "name": "Offer signature turnaround", "description": "Days between the bank issuing the binding offer and receiving the signed acceptance.", "unit": "days", "currentValue": "6", "targetValue": "3", "icon": "kpi-bank-co-bank-b2-c2-l1.png", "children": []}, {"id": "co-bank-b2-c2-l2", "name": "Insurance conditions fulfilled before deed", "description": "Share of approved loans whose outstanding-balance and fire insurance conditions are proven before the deed date.", "unit": "%", "currentValue": "85", "targetValue": "97", "icon": "kpi-bank-co-bank-b2-c2-l2.png", "children": []}]}]}]}, "businessOutcomes": {"top": {"id": "bo-bank-top", "name": "Broker channel loan volume", "description": "Mortgage loan volume disbursed per year by this bank on files that came through the hypotheek.winkel network. Modeled seed value for one panel bank among 25, not an official Peasy or bank figure.", "unit": "EUR million per year", "currentValue": "120", "targetValue": "200", "link": "https://dashboard.example.com/household-finance-brokerage-platform/customers/bank/kpis/bo-bank-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-bank-bo-bank-top.png"}, "branches": [{"id": "bo-bank-b1", "name": "Channel acquisition economics", "description": "Whether loans acquired through the broker channel cost less than branch acquisition and how many files the bank must handle per loan concluded.", "currentValue": "61", "icon": "kpi-bank-bo-bank-b1.png", "children": [{"id": "bo-bank-b1-c1", "name": "Cost per acquired loan through the channel", "description": "Referral commission plus the bank's own assessment and handling cost per loan disbursed through the channel.", "unit": "EUR", "currentValue": "2000", "targetValue": "1800", "icon": "kpi-bank-bo-bank-b1-c1.png", "children": [{"id": "bo-bank-b1-c1-l1", "name": "Bank processing cost per broker file", "description": "Internal analyst and administration cost per file received from the channel, concluded or not.", "unit": "EUR", "currentValue": "350", "targetValue": "250", "icon": "kpi-bank-bo-bank-b1-c1-l1.png", "children": []}, {"id": "bo-bank-b1-c1-l2", "name": "Files assessed per concluded loan", "description": "Number of files the bank assesses for every loan that reaches disbursement.", "unit": "files", "currentValue": "1.6", "targetValue": "1.3", "icon": "kpi-bank-bo-bank-b1-c1-l2.png", "children": []}]}, {"id": "bo-bank-b1-c2", "name": "Loans concluded through the channel", "description": "Number of loans disbursed per year on files received from the network.", "unit": "loans per year", "currentValue": "600", "targetValue": "1000", "icon": "kpi-bank-bo-bank-b1-c2.png", "children": [{"id": "bo-bank-b1-c2-l1", "name": "Approved loans that reach the deed", "description": "Share of approved files that end in a signed deed and disbursement rather than a lapsed offer.", "unit": "%", "currentValue": "82", "targetValue": "90", "icon": "kpi-bank-bo-bank-b1-c2-l1.png", "children": []}, {"id": "bo-bank-b1-c2-l2", "name": "Bank win rate in the comparison", "description": "Share of files compared across 25 banks in which the buyer chooses this bank.", "unit": "%", "currentValue": "6", "targetValue": "6.5", "icon": "kpi-bank-bo-bank-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-bank-b2", "name": "Channel predictability and control", "description": "Whether the bank can plan on the channel's inflow and settle commissions and compliance without disputes.", "currentValue": "55", "icon": "kpi-bank-bo-bank-b2.png", "children": [{"id": "bo-bank-b2-c1", "name": "Volume forecast accuracy", "description": "Share of the quarterly forecast of channel loan volume realised within a ten percent band.", "unit": "%", "currentValue": "80", "targetValue": "92", "icon": "kpi-bank-bo-bank-b2-c1.png", "children": [{"id": "bo-bank-b2-c1-l1", "name": "Monthly file inflow variance", "description": "Variation of monthly file inflow around the planned level.", "unit": "%", "currentValue": "25", "targetValue": "12", "icon": "kpi-bank-bo-bank-b2-c1-l1.png", "children": []}, {"id": "bo-bank-b2-c1-l2", "name": "Files with live status in the partner portal", "description": "Share of open files whose status the bank can see in the portal without asking the expert.", "unit": "%", "currentValue": "50", "targetValue": "95", "icon": "kpi-bank-bo-bank-b2-c1-l2.png", "children": []}]}, {"id": "bo-bank-b2-c2", "name": "Commission dispute rate", "description": "Share of commission statement lines the bank disputes in a period.", "unit": "%", "currentValue": "4", "targetValue": "1", "icon": "kpi-bank-bo-bank-b2-c2.png", "children": [{"id": "bo-bank-b2-c2-l1", "name": "Statement lines matched automatically", "description": "Share of commission lines matched to the bank's disbursement export without manual work.", "unit": "%", "currentValue": "75", "targetValue": "95", "icon": "kpi-bank-bo-bank-b2-c2-l1.png", "children": []}, {"id": "bo-bank-b2-c2-l2", "name": "Compliance findings on broker files", "description": "Audit or supervisory findings per 100 broker files, such as missing advice records or consent evidence.", "unit": "findings", "currentValue": "1.2", "targetValue": "0.3", "icon": "kpi-bank-bo-bank-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make hypotheek.winkel the broker channel banks plan on: files that arrive complete and compliant, decisions returned in days into the expert's workbench, a daily conditions feed the bank controls, and commissions reconciled from deed dates so that the bank grows mortgage volume through about 70 offices, and 81 with Meilleurtaux, at a predictable cost per loan.", "timeHorizons": {"year1": {"focus": "Make every panel bank's file exchange digital and complete: submission through the bank interface with a completeness check and the advice record, same-day acknowledgement, decisions returned into the workbench, and commission statements generated from deed dates and matched to the bank's disbursement export.", "productTheme": "Bank-ready files and digital exchange", "customerKPI": {"northStar": "File approval turnaround time", "supporting": ["File completeness rate", "Time from submission to first assessment"]}, "businessKPI": {"northStar": "Broker channel loan volume", "revenueStreams": ["Referral commissions from banks per concluded mortgage loan", "Commissions on outstanding-balance and fire insurance attached to loans"], "supporting": ["Cost per acquired loan through the channel", "Commission dispute rate"]}, "milestones": ["Connect every panel bank to digital file submission with a completeness check and the advice record attached", "Return bank decisions, conditions and questions into the expert's workbench on one file timeline", "Generate monthly commission statements from deed dates and match them to each bank's disbursement export in the partner portal"]}, "year3": {"focus": "Give banks a planned channel: inflow forecasts built on the network's appointment and feasibility-certificate pipeline, campaign windows agreed with head office, per-office file-quality reviews, and one agreement covering the combined Meilleurtaux and Peasy network of 81 offices across Flanders, Brussels and Wallonia.", "productTheme": "Planned volume across a national network", "customerKPI": {"northStar": "File approval turnaround time", "supporting": ["Files declined for avoidable reasons", "Time from approval to disbursement"]}, "businessKPI": {"northStar": "Broker channel loan volume", "revenueStreams": ["Referral commissions from banks per concluded mortgage loan", "Referral commissions on consumer credit and credit grouping", "Commissions on outstanding-balance and fire insurance attached to loans"], "supporting": ["Volume forecast accuracy", "Loans concluded through the channel"]}, "milestones": ["Share a rolling inflow forecast per bank built from appointments, feasibility certificates and open files", "Run quarterly per-office file-quality reviews with each bank and turn findings into checklist and academy changes", "Extend panel agreements and the partner portal to the combined network after the Meilleurtaux integration"]}, "year5": {"focus": "Move to real-time pricing and binding: bank APIs that price a file on the expert's screen, AI-assisted file assembly and pre-checks that make first-time completeness the norm, straight-through decisions for standard files, and the channel extended to the Meilleurtaux group's savings, investment and pension products.", "productTheme": "Real-time partner APIs and straight-through files", "customerKPI": {"northStar": "File approval turnaround time", "supporting": ["Missing-document requests per file", "Same-day acknowledgement rate"]}, "businessKPI": {"northStar": "Broker channel loan volume", "revenueStreams": ["Referral commissions from banks per concluded mortgage loan", "Referral commissions on consumer credit and credit grouping", "Referral fees on savings, investment and pension products through the group"], "supporting": ["Bank win rate in the comparison", "Statement lines matched automatically"]}, "milestones": ["Offer banks a pricing and pre-acceptance API so experts see a bank's real conditions for the buyer's file on screen", "Introduce AI-assisted file assembly and pre-checks supervised by experts to reach first-time-complete files as the norm", "Enable straight-through approval for standard files with the banks that support it"]}}}}, {"id": "prov", "name": "Insurer, Energy and Telecom Partner", "description": "The partnership or distribution manager at one of the more than 50 partners whose products appear in Peasy's comparison modules: an insurer such as those listed on Verzekeringen.be for car, fire, funeral or outstanding-balance cover, an electricity and gas supplier compared on Aanbieders.be, or an internet, TV and mobile operator. Owns the intermediary and comparison channel inside the company and answers for the contracts it brings, what they cost to acquire and how long they stay. Supplies tariff and product data to Peasy's partner catalogue, checks how the products are shown against competitors in the modules, receives quote requests, policy bindings and switch orders from the websites and the customer-care advisors in Hasselt and Oujda, and fulfils them, including the termination of the customer's old contract under BIPT Easy Switch for telecom. Pays a referral fee per concluded contract and reconciles leads, contracts, cancellations and commissions with Peasy every month. Wants to be listed accurately the day a tariff changes, to receive orders the operations team can process without re-keying, and to settle commissions without disputes. Is judged on contracts won, cost per acquired contract, early cancellations and the accuracy of what customers were promised.", "icon": "customer-prov-portrait.jpg", "careAbout": ["Tariffs, conditions and promotions shown exactly as published, the day they change, in Dutch and French across peasy.be, verzekeringen.be and aanbieders.be", "Quotes, bindings and switch orders that arrive complete, in the partner's format, with the customer's consent, EAN or policy data and the old contract's termination handled", "A cost per acquired contract that is lower than the partner's own online and outbound channels, with fees paid only on contracts that actually start", "Monthly reconciliation of leads, contracts and commissions that closes in days, with disputes settled on a shared record rather than by e-mail threads", "Customers who understand what they bought, so that cancellations in the cooling-off period and complaints stay low", "Customer data used only for the contract the customer asked for, in line with the GDPR and, for insurers, IDD rules on distribution"], "winsThem": ["A partner portal and tariff feed the partner controls, with validation that shows how each product will be displayed in the comparison before it goes live", "Structured quote, bind and switch interfaces, or a validated order file for partners without an API, that the partner's operations team can process without re-keying", "A monthly reconciliation statement that matches Peasy's contracts to the partner's activations and cancellations, with a dispute workflow and a fixed cycle time", "Placement and conversion reporting per product and campaign, so the partner sees where it wins or loses against competitors in the modules", "One partner manager at Peasy covering listing, orders and commissions across the three brands and, after the acquisition, the Meilleurtaux network"], "theirFear": ["A stale or misread tariff in the comparison that makes customers switch on a promise the partner cannot honour, followed by complaints and a supervisory question", "Switch orders with wrong EAN, policy or identity data that the operations team must chase, so that activation is late and the customer blames the partner", "Paying referral fees on contracts that never activated, or months of disputed statements with a channel the company cannot verify"], "jobsToBeDone": [{"id": "jtbd-prov-1", "name": "Be listed accurately and win switches in the comparison modules", "whatItIs": "Get the partner's insurance, energy or telecom products into Peasy's comparison modules and keep them winning: onboard products and tariffs into the partner catalogue with every condition that drives the comparison, verify how they display against competitors in each module and language before and after every change, fulfil the quotes, policy bindings and switch orders that the websites and the customer-care advisors generate, handle exceptions with customer care before they become complaints, and run promotions and monitor placement so the partner knows where it wins and why.", "outcome": "The partner is shown accurately the day a tariff changes, receives orders its operations team can activate first time, and wins a growing, measurable share of the switches Peasy brokers with low cancellation and complaint rates.", "steps": [{"step": "Onboard products and tariffs into the partner catalogue", "description": "Load the product range, tariffs, conditions, eligibility rules (meter type, digital meter, prosumer tariff, postcode, vehicle or property criteria, age and health questions for outstanding-balance cover) and promotions into the catalogue through a feed or the portal, with effective dates and both languages.", "streamsNeeded": [{"id": "manage-partners-tariffs-and-commissions", "name": "Manage Partners, Tariffs and Commissions", "howItSupports": "Receives, validates and versions the partner's tariff and product feed with effective dates and language variants."}]}, {"step": "Verify how the products show up in each comparison", "description": "Run test comparisons for typical customer profiles in each module and language, check price, ranking, conditions and promotion labels against what the partner published, and flag mismatches before customers see them.", "streamsNeeded": [{"id": "compare-and-switch-insurance", "name": "Compare and Switch Insurance", "howItSupports": "Shows how the partner's policies rank and display for car, fire, funeral and outstanding-balance profiles across 11 insurers."}, {"id": "compare-and-switch-energy-contracts", "name": "Compare and Switch Energy Contracts", "howItSupports": "Shows how the partner's electricity and gas tariffs display for meter types, digital meters and solar-panel households."}, {"id": "compare-and-switch-telecom-and-mobile", "name": "Compare and Switch Telecom and Mobile", "howItSupports": "Shows how the partner's internet, TV and mobile packs rank for typical usage profiles."}]}, {"step": "Fulfil quotes, bindings and switch orders", "description": "Receive quote requests, bound policies and switch orders with the customer's identity, consent, EAN or policy data, answer within the agreed service level, activate the contract, and for telecom terminate the old contract under BIPT Easy Switch, confirming the activation date back to Peasy.", "streamsNeeded": [{"id": "compare-and-switch-insurance", "name": "Compare and Switch Insurance", "howItSupports": "Delivers quote requests and policy bindings in the insurer's format and returns policy numbers and start dates."}, {"id": "compare-and-switch-energy-contracts", "name": "Compare and Switch Energy Contracts", "howItSupports": "Delivers switch orders with EAN numbers, meter data and start dates and returns activation confirmations."}, {"id": "compare-and-switch-telecom-and-mobile", "name": "Compare and Switch Telecom and Mobile", "howItSupports": "Delivers switch orders under BIPT Easy Switch with the old operator's details and returns activation status."}]}, {"step": "Handle exceptions with customer care", "description": "Resolve rejected orders, missing documents, cancellations within the cooling-off period and customer questions with the Peasy advisors in Hasselt and Oujda through a shared case, so the customer hears one story from both sides.", "streamsNeeded": [{"id": "serve-customers-through-customer-care", "name": "Serve Customers Through Customer Care", "howItSupports": "Routes partner exceptions and customer questions into the care ticket so the advisor and the partner work one case."}, {"id": "manage-partners-tariffs-and-commissions", "name": "Manage Partners, Tariffs and Commissions", "howItSupports": "Records exception reasons per partner so recurring data or process problems are fixed at the source."}]}, {"step": "Run promotions and monitor placement performance", "description": "Plan seasonal promotions and campaign tariffs with Peasy, watch impressions, ranking, quote and switch conversion per product and module, and adjust products or conditions where the partner loses to competitors.", "streamsNeeded": [{"id": "manage-partners-tariffs-and-commissions", "name": "Manage Partners, Tariffs and Commissions", "howItSupports": "Provides placement, conversion and cancellation reporting per partner, product and campaign."}, {"id": "monitor-household-contracts-and-alert-savings", "name": "Monitor Household Contracts and Alert Savings", "howItSupports": "Shows when the partner's contracts come up for re-comparison so renewal offers can be timed."}]}], "media": [{"type": "image", "src": "media/jbtd-prov-jtbd-prov-1.png", "title": "Insurer, Energy and Telecom Partner JTBD infographic: Be listed accurately and win switches in the comparison modules", "alt": "Enterprise infographic for the job \"Be listed accurately and win switches in the comparison modules\" for customer \"Insurer, Energy and Telecom Partner\"."}]}, {"id": "jtbd-prov-2", "name": "Reconcile leads, contracts and commissions with the broker without disputes", "whatItIs": "Settle the commercial side of the partnership on a shared record: agree the partner agreement and commission schedule with fees per contract type, clawback rules and service levels, exchange lead and contract data with Peasy on a fixed cadence, match Peasy's contracts to the partner's activations and cancellations and resolve the differences, approve the monthly statement and pay the referral fees, and review the partnership on data about volume, cost per contract, retention and disputes.", "outcome": "Every contract Peasy brokered is matched to an activation on the partner's side, statements are approved and paid within the agreed cycle, disputes are rare and closed in days, and the review each quarter is about growth rather than about last month's lines.", "steps": [{"step": "Agree the partner agreement and commission schedule", "description": "Negotiate referral fees per product type, what counts as a concluded contract, clawback on cancellations and non-payment, data exchange and retention, service levels for orders and statements, and the compliance obligations each side carries under the GDPR and, for insurers, the IDD.", "streamsNeeded": [{"id": "manage-partners-tariffs-and-commissions", "name": "Manage Partners, Tariffs and Commissions", "howItSupports": "Holds the partner agreement, commission schedule, clawback rules and service levels."}, {"id": "comply-with-fsma-and-data-protection", "name": "Comply with FSMA and Data Protection", "howItSupports": "Documents the data-processing and distribution obligations agreed with the partner."}]}, {"step": "Exchange lead and contract data on a fixed cadence", "description": "Send activations, start dates, cancellations and non-payment events to Peasy, and receive Peasy's list of brokered contracts with references, so both sides work from the same period data.", "streamsNeeded": [{"id": "manage-partners-tariffs-and-commissions", "name": "Manage Partners, Tariffs and Commissions", "howItSupports": "Exchanges contract and status data with the partner on a fixed cadence through the portal or interface."}, {"id": "monitor-household-contracts-and-alert-savings", "name": "Monitor Household Contracts and Alert Savings", "howItSupports": "Updates the household's contract record with the partner's start dates and cancellations."}]}, {"step": "Match contracts and resolve mismatches", "description": "Match Peasy's contracts to the partner's activations, investigate contracts missing on either side, duplicates, cancelled switches and changed references, and close each difference with a reason on the shared record.", "streamsNeeded": [{"id": "manage-partners-tariffs-and-commissions", "name": "Manage Partners, Tariffs and Commissions", "howItSupports": "Matches contracts automatically, lists the differences and tracks their resolution with reasons."}, {"id": "compare-and-switch-energy-contracts", "name": "Compare and Switch Energy Contracts", "howItSupports": "Provides the switch order history and activation status needed to explain a missing or cancelled contract."}]}, {"step": "Approve the statement and pay the commission", "description": "Approve the monthly commission statement once differences are closed, apply agreed clawbacks, and pay within the service level so that Peasy can pay its offices and advisors.", "streamsNeeded": [{"id": "manage-partners-tariffs-and-commissions", "name": "Manage Partners, Tariffs and Commissions", "howItSupports": "Produces the statement, records approval and payment and feeds the network payout."}]}, {"step": "Review the partnership on data", "description": "Meet Peasy's partner manager each quarter with volume, cost per contract, cancellation and retention of brokered contracts, disputes and placement performance, and agree changes to fees, products or campaigns.", "streamsNeeded": [{"id": "manage-partners-tariffs-and-commissions", "name": "Manage Partners, Tariffs and Commissions", "howItSupports": "Provides the quarterly partner review with volume, cost, dispute and retention figures."}, {"id": "monitor-household-contracts-and-alert-savings", "name": "Monitor Household Contracts and Alert Savings", "howItSupports": "Shows how brokered contracts hold up at renewal and where re-comparison moves customers away."}]}], "media": [{"type": "image", "src": "media/jbtd-prov-jtbd-prov-2.png", "title": "Insurer, Energy and Telecom Partner JTBD infographic: Reconcile leads, contracts and commissions with the broker without disputes", "alt": "Enterprise infographic for the job \"Reconcile leads, contracts and commissions with the broker without disputes\" for customer \"Insurer, Energy and Telecom Partner\"."}]}], "customerJourneyStories": [{"id": "journey-prov-1", "name": "An energy supplier gets listed on Aanbieders.be through the tariff feed", "linkedJobIds": ["jtbd-prov-1", "jtbd-prov-2"], "summary": "The distribution manager of an electricity and gas supplier that wants households beyond its own website gets the supplier listed in Peasy's energy comparison, replaces a monthly tariff spreadsheet with a validated feed and switch-order interface, and ends up with a channel that delivers activations at a predictable cost.", "stages": [{"stage": "Trigger", "narrative": "The supplier's acquisition depends on price comparison, but its tariffs were shown wrongly on a comparator last winter, customers switched on the wrong promise and the operations team spent weeks re-keying orders sent as PDFs. The manager needs a channel that shows the supplier accurately and sends orders the team can activate."}, {"stage": "Discovery", "narrative": "She sees Aanbieders.be with its 4.6 rating from 2,765 Google reviews, learns that Peasy's advisors in Hasselt and Oujda execute energy switches by phone and chat, and is contacted by Peasy's partner management about listing the supplier with a tariff feed and a switch-order interface instead of e-mailed orders."}, {"stage": "Evaluation", "narrative": "She reviews the partner agreement and the referral fee per activated contract against the supplier's own cost per online customer, checks how the feed handles meter types, the digital meter, the prosumer tariff and promotions, tests how tariffs display in Dutch and French, and has legal check data protection and the handling of EAN numbers; the operations lead confirms the order format fits their system."}, {"stage": "Trial", "narrative": "The supplier goes live for one region with the feed and the order interface. In the first weeks the manager runs test comparisons after each tariff change, sees the first switch orders arrive with complete EAN and meter data, and the first monthly statement matches the supplier's activation list except for two cancelled switches closed with a reason."}, {"stage": "Engagement", "narrative": "The feed becomes routine: tariff changes go live the same day, promotions are planned with Peasy for the winter, placement and conversion reports show where the supplier wins, and exceptions are handled in shared cases with the care advisors rather than by e-mail."}, {"stage": "Retention", "narrative": "The supplier stays and extends the listing to business energy because cost per activated contract stays below its own channels, cancellations are low, and the manager can show the board activations, cost and retention from one report each quarter."}], "media": [{"type": "image", "src": "media/journey-prov-prov-1.png", "title": "Insurer, Energy and Telecom Partner customer journey: An energy supplier gets listed on Aanbieders.be through the tariff feed", "alt": "Enterprise journey storyboard for \"An energy supplier gets listed on Aanbieders.be through the tariff feed\" for customer \"Insurer, Energy and Telecom Partner\"."}]}, {"id": "journey-prov-2", "name": "An insurer moves quotes, binding and commissions onto the partner portal", "linkedJobIds": ["jtbd-prov-2", "jtbd-prov-1"], "summary": "The broker-channel manager of one of the 11 insurers compared on Verzekeringen.be, who receives quote requests by e-mail and reconciles commissions by hand, adopts the partner portal's quote-and-bind interface and commission reconciliation, and ends with policies bound first time and statements approved within days.", "stages": [{"stage": "Trigger", "narrative": "The insurer's intermediary desk receives Peasy quote requests as e-mails, re-keys them, binds policies days later and at month end spends a week matching Peasy's commission invoice to its policy register, with disputes over policies cancelled in the cooling-off period. The manager's finance partner wants an auditable process."}, {"stage": "Discovery", "narrative": "At the quarterly review Peasy shows the portal: structured quote and bind exchange, policy numbers and start dates flowing back, monthly statements matched to the insurer's policy export and a dispute workflow; two other insurers on the panel already use it."}, {"stage": "Evaluation", "narrative": "She evaluates the change with IT and compliance: the quote and bind interface against the insurer's tariff engine, the health questions for outstanding-balance cover, IDD information duties and where the advice record sits, data-protection terms, the policy export the portal needs and how clawbacks on cancelled policies are applied."}, {"stage": "Trial", "narrative": "The insurer connects car and fire insurance first. Quotes are answered within the service level, bound policies return their numbers into Peasy's household records, and the first two statements run in parallel with the manual match until the automatic match explains the lines and the remaining differences are real cancellations."}, {"stage": "Engagement", "narrative": "Quote, bind and reconciliation run through the portal for all products, the desk handles exceptions with Peasy's care advisors in shared cases, and the quarterly review looks at placement, conversion and retention per product rather than at disputed lines."}, {"stage": "Retention", "narrative": "The insurer renews and adds outstanding-balance cover for mortgage files because policies bind first time, the statement is approved within days, and the channel's cost per policy and retention compare well with its other intermediaries."}], "media": [{"type": "image", "src": "media/journey-prov-prov-2.png", "title": "Insurer, Energy and Telecom Partner customer journey: An insurer moves quotes, binding and commissions onto the partner portal", "alt": "Enterprise journey storyboard for \"An insurer moves quotes, binding and commissions onto the partner portal\" for customer \"Insurer, Energy and Telecom Partner\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-prov-top", "name": "Switches won through comparison", "description": "Number of contracts per year concluded with this partner through Peasy's comparison modules and advisors: policies bound, energy switches activated and telecom switches completed. Modeled seed value for one larger partner among more than 50, not an official figure.", "unit": "contracts per year", "currentValue": "4200", "targetValue": "6500", "link": "https://dashboard.example.com/household-finance-brokerage-platform/customers/prov/kpis/co-prov-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-prov-co-prov-top.png"}, "branches": [{"id": "co-prov-b1", "name": "Listing accuracy and presence", "description": "Whether the partner's products are shown correctly and appear where customers compare.", "currentValue": "66", "icon": "kpi-prov-co-prov-b1.png", "children": [{"id": "co-prov-b1-c1", "name": "Tariff feed accuracy", "description": "Share of partner products whose price and condition b2-c2-l2", "name": "Commission dispute rate", "description": "Share of statement lines the partner disputes in a period.", "unit": "%", "currentValue": "5", "targetValue": "1", "icon": "kpi-prov-bo-prov-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make Peasy the comparison and switching channel every insurer, energy supplier and telecom operator in Belgium wants to be in: listed accurately the day a tariff changes, orders the partner can activate first time, commissions reconciled on a shared record, and a growing share of the more than 50,000 contracts concluded per year at a cost per contract below the partner's own channels.", "timeHorizons": {"year1": {"focus": "Put every partner on a validated tariff feed and a structured order exchange across the three brands, with monthly commission statements matched to the partner's activation export and a dispute workflow that closes differences on a shared record.", "productTheme": "Accurate listing and structured orders", "customerKPI": {"northStar": "Switches won through comparison", "supporting": ["Tariff feed accuracy", "Switch orders fulfilled first time"]}, "businessKPI": {"northStar": "Cost per acquired contract through the broker channel", "revenueStreams": ["Referral fees from insurers per bound policy", "Referral fees from energy suppliers per activated switch", "Referral fees from telecom operators per completed switch"], "supporting": ["Commission reconciliation lead time", "Fulfilment and reconciliation cost per contract"]}, "milestones": ["Move every partner's products onto the validated tariff feed with same-day effective dates in Dutch and French", "Deliver quotes, bindings and switch orders in a structured format with consent and EAN or policy data for every partner", "Issue monthly commission statements matched to partner activation exports with a dispute workflow in the partner portal"]}, "year3": {"focus": "Turn partners into renewal partners: re-comparison of monitored household contracts timed with the partner's renewal offers, placement and retention reporting per product, and one partner portal for the combined Peasy and Meilleurtaux network.", "productTheme": "Renewal-aware partnerships", "customerKPI": {"northStar": "Switches won through comparison", "supporting": ["Comparisons with the partner in the top three", "Contracts cancelled within the cooling-off period"]}, "businessKPI": {"northStar": "Cost per acquired contract through the broker channel", "revenueStreams": ["Referral fees from insurers per bound policy", "Referral fees from energy suppliers per activated switch", "Referral fees from telecom operators per completed switch", "Renewal referral fees on re-compared household contracts"], "supporting": ["Broker channel share of new contracts", "Commission cost per retained contract"]}, "milestones": ["Time partner renewal offers with the savings alerts sent to households whose contracts come up for re-comparison", "Report placement, conversion, cancellation and retention per partner product each quarter in the portal", "Extend partner agreements and the portal to the Meilleurtaux network after the integration"]}, "year5": {"focus": "Real-time partner APIs for pricing and binding across insurance, energy and telecom, straight-through switches with activation confirmed back to the household's contract vault, and partner listings extended to savings, investment and pension products through the group.", "productTheme": "Real-time pricing and binding APIs", "customerKPI": {"northStar": "Switches won through comparison", "supporting": ["Time from order to active contract", "Quote-to-contract conversion"]}, "businessKPI": {"northStar": "Cost per acquired contract through the broker channel", "revenueStreams": ["Referral fees from insurers per bound policy", "Referral fees from energy suppliers per activated switch", "Referral fees from telecom operators per completed switch", "Referral fees on savings, investment and pension products through the group"], "supporting": ["Statement lines matched automatically", "Channel volume growth year over year"]}, "milestones": ["Offer partners real-time pricing and binding APIs so quotes and switches are confirmed on the customer's screen", "Confirm activations straight through into the household's contract vault and the commission statement", "Open the partner catalogue to savings, investment and pension products through the Meilleurtaux group"]}}}}]}, {"group": "Peasy Operations", "description": "Head-office roles in Zaventem that run the network behind the brands: the academy that grows scarce advisors, the partner agreements and tariff feeds, commission reconciliation and payout to about 70 offices, and FSMA and GDPR compliance across peasy.be, verzekeringen.be and aanbieders.be.", "customers": [{"id": "opsm", "name": "Network and Compliance Operations Manager", "description": "Head-office manager in Zaventem who runs the operations behind Peasy's network of about 70 offices, more than 150 experts and the customer-care centres in Hasselt and Oujda. Owns the academy that recruits career changers and trains about 30 mortgage experts and insurance advisors per year to the FSMA knowledge requirements, because the market does not supply them. Manages the agreements, tariff feeds and commission schedules of more than 50 banks, insurers, energy suppliers and telecom operators, reconciles the referral commissions they pay against concluded contracts and pays the offices and advisors their share. Keeps the FSMA registrations of credit and insurance intermediaries current across the offices, samples advice and suitability records, handles complaints and their root causes, and answers for the GDPR across peasy.be, verzekeringen.be and aanbieders.be, with the FPS Economy Economic Inspectorate as supervisory authority for hypotheek.winkel. Since the Meilleurtaux acquisition also aligns processes and partner relationships with the combined 81-office group. Wants operations that scale with the network without growing head count: reconciled commissions in days, payouts nobody has to correct, audit evidence that is ready, and advisor supply that is planned rather than scarce. Is judged on cost-to-serve, payout accuracy, audit findings and certified advisors.", "icon": "customer-opsm-portrait.jpg", "careAbout": ["A planned supply of certified advisors, so that a franchisee's vacancy or a new office does not wait a year for a mortgage expert", "Commission statements from more than 50 partners matched to concluded contracts within days, not weeks, with every difference explained", "Payouts to about 70 offices and their advisors that are right the first time, because a wrong payout costs trust in the franchise", "Advice records, suitability assessments and FSMA registrations that an inspection can be shown without a week of preparation", "Complaints handled within the deadlines and traced to a root cause in a process, an office or a partner feed", "GDPR consent and data-subject requests handled consistently across three brands and, now, the Meilleurtaux integration"], "winsThem": ["One commission engine that ingests partner statements, matches them to deed dates, policy starts and switch activations, and computes office and advisor payouts from the commission schedules", "A partner portal in which agreements, tariff feeds, statements and disputes live per partner, replacing e-mail threads and spreadsheets", "An academy platform with cohort planning against office demand, curriculum, exams, FSMA registration steps and the first-90-day productivity of every graduate", "Advice-record quality sampling, complaint handling and consent management in one compliance workbench with audit-ready exports per brand and office", "Dashboards that show cost-to-serve, payout accuracy and audit findings per office and partner to head office and, since the acquisition, to the group"], "theirFear": ["A payout run with errors across dozens of offices, discovered by franchisees before head office notices", "An FSMA or Economic Inspectorate inspection that finds advice records missing or intermediaries not registered in some office", "Losing months of advisor supply because a cohort drops out or graduates cannot be placed where the demand is"], "jobsToBeDone": [{"id": "jtbd-opsm-1", "name": "Onboard and certify new advisors through the academy", "whatItIs": "Run the academy as the planned supply line for the scarce mortgage-expert and insurance-advisor roles: size intake cohorts against office vacancies, expansion and attrition, recruit career changers together with franchisees, run the curriculum on mortgage credit, insurance, the comparison tooling and the FSMA knowledge requirements, certify graduates and complete their registration as intermediaries, place them in an office or the care centre, and follow their first months until they carry files on their own, feeding what the bank and quality reviews reveal back into the curriculum.", "outcome": "About 30 or more certified advisors per year arrive where the network needs them, registered and productive within their first months, so that advisor supply is a planned capacity rather than the bottleneck of network growth.", "steps": [{"step": "Plan cohorts against network demand", "description": "Combine office vacancies, planned openings, attrition and the appointment pipeline into an intake plan per cohort and region, and agree it with network development and the franchisees who will host trainees.", "streamsNeeded": [{"id": "train-and-certify-advisors-in-the-academy", "name": "Train and Certify Advisors in the Academy", "howItSupports": "Plans cohorts, seats and trainers against the demand forecast."}, {"id": "run-the-franchise-office-network", "name": "Run the Franchise Office Network", "howItSupports": "Supplies office vacancies, planned openings and appointment volumes per office that set the demand."}]}, {"step": "Recruit career changers with the offices", "description": "Source candidates from other sectors, screen for the profile that succeeds with buyers and banks, match them with a hosting office and a mentor expert, and handle contracts and onboarding.", "streamsNeeded": [{"id": "train-and-certify-advisors-in-the-academy", "name": "Train and Certify Advisors in the Academy", "howItSupports": "Tracks candidates from application to cohort enrolment with the hosting office and mentor."}]}, {"step": "Run the curriculum and exams", "description": "Deliver the programme on mortgage credit, insurance products, the multi-bank comparison, file assembly, advice records and the FSMA knowledge requirements, mixing classroom, e-learning and supervised files in the office, and examine at the end.", "streamsNeeded": [{"id": "train-and-certify-advisors-in-the-academy", "name": "Train and Certify Advisors in the Academy", "howItSupports": "Hosts the curriculum, e-learning, supervised file assignments and exams per cohort."}, {"id": "assemble-and-submit-the-loan-file", "name": "Assemble and Submit the Loan File", "howItSupports": "Provides supervised real files in which trainees practise assembly and submission under a mentor."}]}, {"step": "Certify and register graduates", "description": "Issue the certification, complete the FSMA registration steps for credit and insurance intermediation under the right office or entity, and record the evidence for later inspections.", "streamsNeeded": [{"id": "train-and-certify-advisors-in-the-academy", "name": "Train and Certify Advisors in the Academy", "howItSupports": "Records certification results and the evidence of the knowledge requirements met."}, {"id": "comply-with-fsma-and-data-protection", "name": "Comply with FSMA and Data Protection", "howItSupports": "Completes and files the intermediary registration and keeps it current per office."}]}, {"step": "Place graduates and follow their first months", "description": "Place each graduate in an office or the care centre, follow files completed, first-time-complete rate and bank feedback over the first months, and coach or adjust the curriculum where graduates struggle.", "streamsNeeded": [{"id": "run-the-franchise-office-network", "name": "Run the Franchise Office Network", "howItSupports": "Shows each new advisor's production and conversion in the first months per office."}, {"id": "train-and-certify-advisors-in-the-academy", "name": "Train and Certify Advisors in the Academy", "howItSupports": "Links graduate performance back to cohorts and modules so the curriculum improves."}]}], "media": [{"type": "image", "src": "media/jbtd-opsm-jtbd-opsm-1.png", "title": "Network and Compliance Operations Manager JTBD infographic: Onboard and certify new advisors through the academy", "alt": "Enterprise infographic for the job \"Onboard and certify new advisors through the academy\" for customer \"Network and Compliance Operations Manager\"."}]}, {"id": "jtbd-opsm-2", "name": "Reconcile commissions from more than 50 partners and pay the network correctly", "whatItIs": "Run the money side of the partner model: keep the agreements and commission schedules of more than 50 banks, insurers, energy suppliers and telecom operators current, collect their statements each month, match every line to a concluded contract (deed date, policy start, switch activation) recorded by the offices and advisors, resolve missing, cancelled and disputed lines with the partner, compute the share owed to about 70 offices and their advisors from the schedules, pay them on time and report margin per partner, product and office to management.", "outcome": "Every partner statement is reconciled within days of arrival, payouts to the network are correct the first time and on schedule, disputes are few and closed within the agreed cycle, and management sees margin per partner and office without a spreadsheet.", "steps": [{"step": "Maintain partner agreements and commission schedules", "description": "Keep each partner's agreement, fee per contract type, clawback rules, effective dates and the office and advisor share current, so that every statement and payout is computed from the right version.", "streamsNeeded": [{"id": "manage-partners-tariffs-and-commissions", "name": "Manage Partners, Tariffs and Commissions", "howItSupports": "Holds versioned partner agreements and commission schedules that statements and payouts are computed from."}]}, {"step": "Collect statements and match them to concluded contracts", "description": "Receive statements through the portal, feed or e-mail, and match each line to a deed, a bound policy or an activated switch recorded in the workbench and care tooling, flagging lines with no contract and contracts with no line.", "streamsNeeded": [{"id": "manage-partners-tariffs-and-commissions", "name": "Manage Partners, Tariffs and Commissions", "howItSupports": "Ingests partner statements and matches lines automatically to concluded contracts."}, {"id": "close-the-loan-through-notary-and-insurance", "name": "Close the Loan Through Notary and Insurance", "howItSupports": "Supplies deed and disbursement dates that make a mortgage commission due."}, {"id": "compare-and-switch-insurance", "name": "Compare and Switch Insurance", "howItSupports": "Supplies policy numbers and start dates that make an insurance commission due."}]}, {"step": "Resolve differences and disputes with partners", "description": "Investigate unmatched lines, cancellations, early repayments and duplicates with the partner and the office, close each with a reason, and raise disputes where the partner's statement is short.", "streamsNeeded": [{"id": "manage-partners-tariffs-and-commissions", "name": "Manage Partners, Tariffs and Commissions", "howItSupports": "Tracks differences and disputes per partner with reasons and resolution times."}, {"id": "compare-and-switch-energy-contracts", "name": "Compare and Switch Energy Contracts", "howItSupports": "Provides switch order status and activation confirmations to expla d within deadlines and traced to root causes, consent and data-subject requests handled consistently, and audit packs for the FSMA, the Economic Inspectorate, partners and the Meilleurtaux group produced from records rather than assembled by hand.", "outcome": "Inspections and partner audits find registrations current, advice records complete and complaints handled on time, data-subject requests are answered within the legal period across all brands, and preparing evidence takes hours rather than weeks.", "steps": [{"step": "Keep intermediary registrations current", "description": "Maintain the FSMA registrations for mortgage and consumer credit and insurance intermediation per entity and office, including responsible persons, knowledge evidence and changes when advisors join, move or leave.", "streamsNeeded": [{"id": "comply-with-fsma-and-data-protection", "name": "Comply with FSMA and Data Protection", "howItSupports": "Keeps the register of intermediaries, responsible persons and knowledge evidence per office current."}, {"id": "train-and-certify-advisors-in-the-academy", "name": "Train and Certify Advisors in the Academy", "howItSupports": "Provides the certification evidence behind each registration."}]}, {"step": "Sample advice records and suitability assessments", "description": "Draw a sample of mortgage advice records and insurance suitability assessments per office and advisor each month, score them against the checklist, and return findings to the office and the academy.", "streamsNeeded": [{"id": "comply-with-fsma-and-data-protection", "name": "Comply with FSMA and Data Protection", "howItSupports": "Runs the sampling and scoring of advice records with findings per office and advisor."}, {"id": "compare-mortgage-offers-across-banks", "name": "Compare Mortgage Offers Across Banks", "howItSupports": "Supplies the advice records produced with each multi-bank comparison and recommendation."}]}, {"step": "Handle complaints and their root causes", "description
