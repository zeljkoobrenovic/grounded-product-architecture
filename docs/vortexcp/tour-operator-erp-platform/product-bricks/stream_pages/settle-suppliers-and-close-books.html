    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

ile or the Airtrade consolidator statement on ticket number, fare, taxes and commission.", "Refunds, ADMs and voids are identified and posted to the right file."], "painPoints": ["Ticket settlement checked by hand from a PDF statement misses ADMs.", "Unmatched tickets become unexplained ledger differences."], "dependencies": [{"type": "brick", "id": "flgt", "name": "Flight Import and Ticket Settlement", "description": "Ticket records and settlement import.", "how": "Imports and matches the settlement file to tickets."}]}, {"id": "approve-payment-runs", "title": "Approve supplier payment runs", "actor": "Finance and Administration Lead", "keyFacts": ["Matched invoices are grouped into payment runs by due date and currency and approved by the owner above a threshold.", "Payment files are exported to the bank; paid status flows back to the invoice."], "painPoints": ["Ad-hoc payments outside a run lose control and discounts.", "Owners approving from email lack the matching evidence."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Payment runs and approval.", "how": "Prepares and tracks payment runs."}]}, {"id": "post-to-accounting", "title": "Post purchase and sales entries to accounting", "actor": "Finance and Administration Lead", "keyFacts": ["Sales invoices, credit notes, payments and matched purchase invoices are posted to Exact through the integration with cost centres per product and departure.", "Posting is idempotent and logged, so a re-run does not duplicate entries."], "painPoints": ["Manual journal exports create duplicate or missing entries.", "Accounting without departure-level cost centres cannot explain margin."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Accounting posting.", "how": "Generates and sends journal entries."}, {"type": "brick", "id": "intg", "name": "Integration Hub and Partner APIs", "description": "Accounting connector.", "how": "Transports entries to the accounting system."}]}, {"id": "review-file-margins", "title": "Review realised versus sold margin per file", "actor": "Travel Company Owner", "keyFacts": ["With purchase invoices matched, the realised margin per file and per departure is compared with the margin at sale.", "Outliers point to pricing, supplier or operational issues."], "painPoints": ["Margin known only at year end cannot steer the next season.", "Sold margin without realised margin flatters performance."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Margin reporting per file and departure.", "how": "Reports sold versus realised margin."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Sold and realised margin on the file.", "how": "Provides both margin figures."}]}]}, {"id": "close-the-month-and-report-to-the-guarantee-fund", "title": "Close the Month and Report to the Guarantee Fund", "description": "The month-end and compliance flow: reconcile, recognise revenue on departure, report to SGR and keep package-travel evidence ready.", "primaryActor": "Finance and Administration Lead", "trigger": "The month ends and the finance lead starts the close.", "successSignal": "The books are closed, revenue is recognised per departed trip, the SGR report is submitted from system data and the compliance evidence is complete.", "steps": [{"id": "reconcile-subledgers", "title": "Reconcile receivables, payables and payment provider", "actor": "Finance and Administration Lead", "keyFacts": ["Debtors, creditors and the payment-provider settlement account are reconciled between the ERP and accounting.", "Mollie payouts are matched to the individual payments they contain."], "painPoints": ["Payment-provider settlements booked as lump sums cannot be reconciled to invoices.", "Differences between ERP and ledger found at year end take weeks to explain."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Subledger reconciliation.", "how": "Reconciles ERP balances to accounting."}, {"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Payment provider settlement detail.", "how": "Breaks payouts into individual payments."}]}, {"id": "recognise-revenue-on-departure", "title": "Recognise revenue and cost on departure", "actor": "Finance and Administration Lead", "keyFacts": ["Revenue and cost are recognised when the trip departs; prepaid bookings stay on the balance sheet until then.", "The departure close-out from operations is the trigger for recognition."], "painPoints": ["Recognising revenue at invoice overstates results in the booking season.", "Departure dates maintained separately in accounting drift from operations."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Revenue recognition on departure.", "how": "Posts recognition entries on departure."}]}, {"id": "report-to-sgr", "title": "Report covered bookings and turnover to SGR", "actor": "Finance and Administration Lead", "keyFacts": ["SGR participants report covered turnover and bookings periodically and remit the per-booking consumer contribution collected on the invoice.", "The report is generated from booking and invoice data with the coverage rules applied per product type."], "painPoints": ["Reports assembled from exports take days and invite errors that affect the fund contribution.", "Unclear coverage rules per product type lead to over- or under-reporting."], "dependencies": [{"type": "brick", "id": "gfnd", "name": "Guarantee Fund and Regulatory Reporting", "description": "SGR reporting.", "how": "Generates the fund report and contribution statement."}]}, {"id": "evidence-package-travel-compliance", "title": "Evidence package-travel obligations", "actor": "Finance and Administration Lead", "keyFacts": ["The Package Travel Directive requires pre-contractual information, accepted conditions, insolvency protection notice and price-change records per booking; the ERP keeps them per file.", "Price increases after booking are capped and must be notified at least 20 days before departure; the system enforces and records this."], "painPoints": ["Compliance evidence spread over email and website versions is hard to produce on request.", "Unrecorded price changes expose the operator to refunds and fines."], "dependencies": [{"type": "brick", "id": "gfnd", "name": "Guarantee Fund and Regulatory Reporting", "description": "Compliance evidence per file.", "how": "Stores and reports the required records."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Accepted conditions and price history.", "how": "Holds the per-file evidence."}]}, {"id": "produce-management-pack", "title": "Produce the management pack", "actor": "Finance and Administration Lead", "keyFacts": ["Closing figures \u2014 revenue, margin, load factor, receivables, exposure \u2014 go to the owner as a dashboard rather than a spreadsheet.", "Historical months are frozen so figures do not change after the pack is sent."], "painPoints": ["Packs built by hand are late and inconsistent month to month.", "Figures that change after reporting undermine trust."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Management dashboards.", "how": "Presents the closing figures."}]}, {"id": "lock-the-period", "title": "Lock the period", "actor": "Finance and Administration Lead", "keyFacts": ["The period is locked in the ERP and in accounting; later corrections go into the next period with an audit trail.", "Lock status is visible to agents so they do not change closed invoices."], "painPoints": ["Invoices edited after the close break the reconciliation.", "Corrections without trail fail the audit."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Period lock and corrections.", "how": "Locks the period and routes corrections."}, {"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Invoice lock after close.", "how": "Prevents changes to closed invoices."}]}]}], "outcomes": ["Fewer days to close the monthly books, because purchase, sales and payment entries are posted from the ERP into accounting", "Accurate supplier settlement, because supplier invoices are matched to confirmed service lines and flight tickets to settlement files", "Guarantee-fund and package-travel obligations reported from system data rather than reconstructed"], "brickDependencies": [{"targetBrickId": "acct", "type": "composition"}, {"targetBrickId": "invc", "type": "composition"}, {"targetBrickId": "flgt", "type": "composition"}, {"targetBrickId": "gfnd", "type": "composition"}, {"targetBrickId": "intg", "type": "composition"}, {"targetBrickId": "book", "type": "composition"}, {"targetBrickId": "supl", "type": "composition"}, {"targetBrickId": "bint", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "Exact Online Accounting", "type": "accounting-system", "interface": "Sales and purchase journal API", "description": "General ledger, debtors and creditors that receive invoices and settlements from the ERP."}, {"system": "IATA BSP Settlement", "type": "settlement-network", "interface": "BSP HOT file and remittance statements", "description": "Periodic ticket settlement data that must be reconciled against imported tickets and supplier invoices."}, {"system": "GDS and Airtrade Flight Content", "type": "flight-distribution", "interface": "PNR import and ticket data files", "description": "Flight bookings and tickets issued via a GDS or the Airtrade consolidator, imported into the booking file."}, {"system": "SGR Guarantee Fu     mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        flowchart: {
            htmlLabels: false
        }
    });

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

    function getFlows() {
        return currentStream.flows || [];
    }

    function getFlowDependencies(flow) {
        const dependencyIndex = new Map();
        (flow.steps || []).forEach(step => {
            (step.dependencies || []).forEach(dependency => {
                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());
    }

    function getStepDependency(step, dependency) {
        return (step.dependencies || []).find(item => (item.type || '') === (dependency.type || '') && (item.id || '') === (dependency.id || '')) || null;
    }

    function getPrimaryActors() {
        const streamJobs = currentStream.supportedCustomerJobs || [];
        const allJobs = streamJobs.length ? streamJobs : supported_jobs;
        return dedupe(allJobs.map(item => item.customerName || item.customerGroup || '').filter(Boolean), item => item);
    }

    function summarizeFlow(flow) {
        const steps = flow.steps || [];
        const firstStep = steps[0] || {};
        const lastStep = steps[steps.length - 1] || {};
        return {
            actor: flow.primaryActor || firstStep.actor || '',
            trigger: flow.trigger || firstStep.trigger || '',
            result: flow.successSignal || flow.outcome || lastStep.successSignal || lastStep.output || ''
        };
    }

    function renderStepMeta(label, value) {
        if (!value) {
            return '';
        }
        return '<div class="flow-step-meta-item"><div class="flow-step-meta-label">' + escapeHtml(label) + '</div><div class="flow-step-copy">' + escapeHtml(value) + '</div></div>';
    }

    function flowDependencyIconFile(dependency) {
        const dependencyId = dependency.id || '';
        const linkedBrick = related_bricks.find(brick => brick.id === dependencyId) || all_bricks.find(brick => brick.id === dependencyId) || {};
        return dependency.icon || linkedBrick.icon || (dependencyId ? dependencyId + '.png' : 'brick.png');
    }

    function renderFlowDependencyIcon(dependency, className) {
        return '<img class="' + escapeHtml(className) + '" src="../icons/' + escapeHtml(flowDependencyIconFile(dependency)) + '" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
    }

    function renderStepDependencyPills(step) {
        const dependencies = step.dependencies || [];
        if (!dependencies.length) {
            return '<div class="muted">No step-specific dependencies listed.</div>';
        }

        return '<div class="flow-step-dependencies">' + dependencies.map(dep => {
            const label = dep.name || dep.id || 'Dependency';
            const kind = 'Brick';
            return '<span class="flow-cell-brick">' + renderFlowDependencyIcon(dep, 'flow-cell-brick-icon') + '<span>' + escapeHtml(kind + ': ' + label) + '</span></span>';
        }).join('') + '</div>';
    }

    function simplifySupportCopy(value) {
        const text = String(value || '').trim();
        if (!text) {
            return '';
        }
        const simplified = text.replace(/^Supports .*? by helping users help /i, 'Facilitate ');
        return simplified;
    }

                html += '<div class="card-meta">' + escapeHtml(product.type || 'Product') + '</div>';
                html += '<div class="card-header">';
                html += '<img class="card-icon" src="../../product-deployments/icons/' + escapeHtml(product.icon) + '" alt="" onerror="this.onerror=null;this.src=\'../../product-deployments/icons/product.png\'">';
                html += '<div class="card-title">' + escapeHtml(product.name || product.id) + '</div>';
                html += '</div>';
                html += '<div class="card-copy">' + escapeHtml(product.whyUsed || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Related Teams</div>';
        if (!related_teams.length) {
            html += '<div class="muted">No teams were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            related_teams.forEach(team => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../../teams/landing_pages/' + escapeHtml(team.teamId) + '.html">';
                html += '<div class="card-meta">' + escapeHtml(team.roleLabel || team.teamType || 'Team') + '</div>';
                html += '<div class="card-title">' + escapeHtml(team.teamName || team.teamId) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(team.groupName || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Supported Customer Jobs</div>';
        if (!supported_jobs.length) {
            html += '<div class="muted">No customer jobs were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            supported_jobs.forEach(job => {
                html += '<div class="card">';
                html += '<div class="card-meta">' + escapeHtml(job.customerGroup || '') + (job.productName ? ' | ' + escapeHtml(job.productName) : '') + '</div>';
                html += '<div class="card-title">' + escapeHtml(job.jobName || job.jobId) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(job.jobOutcome || job.jobWhatItIs || '') + '</div>';
                if (job.supportRationale) {
                    html += '<div class="card-copy"><strong>Why this stream matters here:</strong> ' + escapeHtml(job.supportRationale) + '</div>';
                }
                if ((job.usedInSteps || []).length) {
                    html += '<ul class="list">' + job.usedInSteps.map(step => '<li>' + escapeHtml(step.step || step.description || '') + '</li>').join('') + '</ul>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        html += '</div>';

        document.getElementById('tab_content_home').innerHTML = html;
    }

    function renderFlows() {
        const flows = getFlows();
        const totalSteps = flows.reduce((count, flow) => count + ((flow.steps || []).length), 0);
        let html = '';

        document.getElementById('tab_flows').innerHTML = 'Flow Narratives (' + flows.length + ')';

        flows.forEach(flow => {
            const dependenciesInFlow = getFlowDependencies(flow);
            const summary = summarizeFlow(flow);
            html += '<div class="group">';
            html += '<div class="section-title">Flow</div>';
            html += '<div class="flow-title">' + escapeHtml(flow.title || flow.id) + '</div>';
            html += '<div class="flow-description">' + escapeHtml(flow.description || '') + '</div>';
            if (summary.actor || summary.trigger || summary.result) {
                html += '<div class="card" style="margin-bottom:16px;">';
                if (summary.actor) {
                    html += '<div class="card-copy"><strong>Primary actor:</strong> ' + escapeHtml(summary.actor) + '</div>';
                }
                if (summary.trigger) {
                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';
                }
                html += '</div>';
            }

            html += '<div class="section-title">Dependency Traceability</div>';
            html += '<div class="flow-matrix-wrap">';
            html += '<table class="flow-matrix">';
            html += '<thead>';
            html += '<tr><th class="flow-dependency-col"></th>';
            (flow.steps || []).forEach((step, index) => {
                html += '<th class="flow-step-col"><div class="flow-step-label">Step ' + (index + 1) + '</div><div class="card-title">' + escapeHtml(step.title || step.id) + '</div></th>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right">Key Facts</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkblue">';
                if ((step.keyFacts || []).length) {
                    html += '<ul class="flow-insight-list">' + step.keyFacts.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No key facts listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right; color: darkred">Pain Points</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkred">';
                if ((step.painPoints || []).length) {
                    html += '<ul class="flow-insight-list">' + step.painPoints.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No pain points listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';
            html += '</thead><tbody>';

            dependenciesInFlow.forEach(dependency => {
                const dependencyTypeLabel = 'Product Brick';
                html += '<tr>';
                html += '<td>';
                html += '<div class="flow-dependency-header">';
                html += renderFlowDependencyIcon(dependency, 'flow-dependency-icon');
                html += '<div>';
                html += '<a class="flow-dependency-name" href="../landing_pages/' + escapeHtml(dependency.id) + '.html">' + escapeHtml(dependency.name || dependency.id) + '</a>';
                if (dependency.interface) {
                    html += '<div class="muted">' + escapeHtml(dependency.interface) + '</div>';
                }
                html += '</div>';
                html += '</div>';
                html += '</td>';
                (flow.steps || []).forEach(step => {
                    const stepDependency = getStepDependency(step, dependency);
                    if (!stepDependency) {
                        html += '<td class="flow-cell-empty">-</td>';
                        return;
                    }
                    html += '<td class="flow-cell-active">';
                    html += '<div class="flow-cell-copy">' + escapeHtml(simplifySupportCopy(stepDependency.how || stepDependency.description || 'Supports this step.')) + '</div>';
                    html += '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            html += '</div>';
            html += '</div>';
        });

        document.getElementById('tab_content_flows').innerHTML = html;
    }

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';
        }
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-title">' + escapeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                count++;
                html += '<div class="link-entry">';
                html += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(link.link || '#') + '">'
                    + escapeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>


<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Tour Operator ERP Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Streams Index"
    },
    {
      "label": "Settle Suppliers and Close Books"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
