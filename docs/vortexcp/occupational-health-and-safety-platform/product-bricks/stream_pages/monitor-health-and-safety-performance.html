    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

ety and event figures", "actor": "HSE Manager / Prevention Adviser", "keyFacts": ["Accident counts and rates, occupational diseases, hazardous situations, inspections, action closure, chemical inventory status and prevention plan progress are computed for the same year and perimeter.", "The Belgian report requires the same data structure every year, which the template enforces."], "painPoints": ["Safety and health figures reported separately contradict each other.", "Prevention plan progress is described qualitatively because nobody tracked it."], "dependencies": [{"type": "brick", "id": "rept", "name": "Regulatory and Annual Reports", "description": "Safety figures.", "how": "Computes safety and event figures."}, {"type": "brick", "id": "rcaa", "name": "Event Analysis and Statistics", "description": "Accident statistics.", "how": "Supplies event statistics."}, {"type": "brick", "id": "actn", "name": "Action Plan Management", "description": "Plan progress.", "how": "Supplies action closure and plan progress."}]}, {"id": "review-with-the-physician-and-add-analysis", "title": "Review with the physician and add the qualitative analysis", "actor": "Occupational Physician", "keyFacts": ["The physician reviews the figures, adds the medical analysis and prevention recommendations (the French report includes the physician's observations on working conditions), and validates the sections under their responsibility.", "Collective health findings are included in anonymised form."], "painPoints": ["Reports written by administrators without medical analysis have no prevention value.", "Physicians validate reports whose figures they cannot check."], "dependencies": [{"type": "brick", "id": "rept", "name": "Regulatory and Annual Reports", "description": "Narrative sections.", "how": "Captures the physician's analysis and validation."}, {"type": "brick", "id": "cohm", "name": "Collective Health Monitoring", "description": "Collective findings.", "how": "Supplies anonymised collective health findings."}]}, {"id": "present-to-the-committee-and-employer", "title": "Present to the CSE/CPPT and the employer", "actor": "Occupational Health Service Manager / Coordinator", "keyFacts": ["The report is presented to the committee and the employer; the presentation date and the committee's opinion are recorded; the employer's decisions on resources feed next year's plan.", "Worker representatives get read access to the report."], "painPoints": ["Reports presented late lose their influence on the budget.", "Committee opinions are not recorded with the report."], "dependencies": [{"type": "brick", "id": "rept", "name": "Regulatory and Annual Reports", "description": "Presentation record.", "how": "Records the presentation and opinion."}, {"type": "brick", "id": "iden", "name": "Identity, SSO, Roles and Consent", "description": "Representative access.", "how": "Grants read access to representatives."}]}, {"id": "file-and-archive-the-report", "title": "File where required and archive with its data snapshot", "actor": "Occupational Health Service Manager / Coordinator", "keyFacts": ["The report is filed where a country requires it (transmitted to the labour inspection or kept available on request) and archived with the data snapshot that produced it, for the legal retention period.", "Archived reports are the evidence for the next inspection."], "painPoints": ["Reports archived without their data cannot be reproduced when contested.", "Filing deadlines missed by the service manager."], "dependencies": [{"type": "brick", "id": "rept", "name": "Regulatory and Annual Reports", "description": "Filing and archiving.", "how": "Files the report and archives it with its snapshot."}, {"type": "brick", "id": "audt", "name": "Audit Trail and Data Retention", "description": "Snapshot retention.", "how": "Retains the data snapshot."}]}]}, {"id": "monitor-collective-health-and-steer-prevention", "title": "Monitor Collective Health and Steer Prevention from Live Indicators", "description": "The physician and the HSE manager review live dashboards and collective health indicators, detect a signal on a population, investigate it with the prevention adviser and turn it into prevention advice and actions.", "primaryActor": "Occupational Physician", "trigger": "The monthly review, a signal in the indicators (hearing shifts on a line, musculoskeletal complaints in a unit, a cluster of accidents) or an employer question about a population.", "successSignal": "The signal is confirmed or dismissed with data, the employer receives documented prevention advice, actions are created and the indicators show the effect over time.", "steps": [{"id": "review-live-dashboards", "title": "Review live dashboards per site and population", "actor": "Occupational Health Service Manager / Coordinator", "keyFacts": ["Dashboards show surveillance coverage, medical capacity utilisation, overdue visits, accident rates, action closure, chemical inventory completeness and portal self-service rate per site, entity and period, with drill-down for authorised roles.", "Each persona has a default dashboard: service manager, HSE manager, physician, HR, employer."], "painPoints": ["Managers run on last quarter's figures.", "One dashboard for everyone shows too much to some and too little to others."], "dependencies": [{"type": "brick", "id": "dash", "name": "Dashboards and KPIs", "description": "Role dashboards.", "how": "Provides role-specific dashboards with drill-down."}, {"type": "brick", "id": "iden", "name": "Identity, SSO, Roles and Consent", "description": "Role scoping.", "how": "Scopes dashboards to the user's role and perimeter."}]}, {"id": "detect-a-collective-health-signal", "title": "Detect a collective health signal on a population", "actor": "Occupational Physician", "keyFacts": ["Collective monitoring aggregates anonymised findings (audiometry shifts, spirometry declines, blood pressure, questionnaire scores, opinions with restrictions) by workstation, ex s and situations."}]}, {"id": "advise-the-employer-and-create-actions", "title": "Advise the employer and create prevention actions", "actor": "Occupational Physician", "keyFacts": ["The physician issues documented prevention advice to the employer (a legal role of the occupational physician in France and Belgium), and the adviser creates actions with owners; the advice and the employer's response are recorded.", "Advice is presented to the CSE/CPPT where appropriate."], "painPoints": ["Advice given verbally in a meeting is not followed and not traceable.", "Employers who ignore written advice carry the liability, but only if the advice is recorded."], "dependencies": [{"type": "brick", "id": "cohm", "name": "Collective Health Monitoring", "description": "Advice record.", "how": "Records the advice and the employer's response."}, {"type": "brick", "id": "actn", "name": "Action Plan Management", "description": "Prevention actions.", "how": "Creates and follows the actions."}]}, {"id": "track-the-effect-over-time", "title": "Track the effect of measures over time", "actor": "HSE Manager / Prevention Adviser", "keyFacts": ["The indicators for the population are followed after the measures, and the case is closed when the signal returns to baseline or a new surveillance rule is set; the outcome is reported in the annual report.", "Effects across sites inform group-wide standards."], "painPoints": ["Measures are never evaluated.", "Lessons stay on one site."], "dependencies": [{"type": "brick", "id": "dash", "name": "Dashboards and KPIs", "description": "Trend tracking.", "how": "Shows indicator trends after measures."}, {"type": "brick", "id": "cohm", "name": "Collective Health Monitoring", "description": "Case closure.", "how": "Closes the case with the outcome."}, {"type": "brick", "id": "surv", "name": "Surveillance Rules and Periodicity Engine", "description": "Surveillance adjustment.", "how": "Adjusts surveillance rules where decided."}]}]}], "outcomes": ["Service rk unit and workstation on the same workstation and exposure register that the occupational physician uses, updated when a workstation, process, chemical, accident or inspection finding changes it, reviewed at least annually with the CSSCT or CPPT, and producible at any moment for the labour inspection, the works council or an ISO 45001 auditor. The job is to stop the assessment being a document rebuilt once a year and make it the register from which prevention work is planned.", "jobOutcome": "Every workstation has a risk assessment that is linked to its exposure profile, was reviewed within the last twelve months or within thirty days of a change event, carries prevention measures with an owner and a date, and can be exported as a dated DUERP version or global prevention plan without rework.", "supportRationale": "Produces the dated regulatory export of the assessment and action plan and keeps every version for the retention period.", "usedInSteps": [{"step": "Review annually with the committee and publish the dated version", "description": "Run the annual review with the CSSCT or CPPT and the occupational physician, record the consultation, export the dated DUERP version with its update history (kept for the statutory 40 years in France) or the global prevention plan and annual action plan for the Belgian internal prevention service report, and deposit or archive it where the regulation requires.", "howItSupports": "Produces the dated regulatory export of the assessment and action plan and keeps every version for the retention period.", "media": []}, {"step": "Review annually with the committee and publish the dated version", "description": "Run the annual review with the CSSCT or CPPT and the occupational physician, record the consultation, export the dated DUERP version with its update history (kept for the statutory 40 years in France) or the global prevention plan and annual action plan for the Belgian internal prevention service report, and deposit or archive it where the regulation requires.", "howItSupports": "Shows currency, coverage and action progress per site so the review discusses the outliers rather than the whole register.", "media": []}]}, {"customerId": "hsem", "customerName": "HSE Manager / Prevention Adviser", "customerGroup": "HSE and Prevention", "customerIcon": "customer-hsem-portrait.jpg", "productId": "kitry-implementation-and-services", "productName": "Kitry Implementation and Services", "productIcon": "kitry-implementation-and-services.png", "jobId": "jtbd-hsem-2", "jobName": "Drive hazardous situations, inspection findings and audit actions to closure", "jobWhatItIs": "Run one action register for everything that must be fixed: hazardous situations reported from the floor by workers and managers, findings from safety inspections, internal and external audits, labour inspection remarks, insurer visits, accident analyses and the annual action plan. Each item must be triaged, assigned to a manager with a due date, followed with reminders and escalation, closed with evidence (photo, invoice, procedure, training record) and reported to the CSSCT or CPPT and the ISO 45001 management review. The job is to make closure the normal outcome instead of a list that grows.", "jobOutcome": "Corrective actions are closed on time at a rate above 90 percent, hazardous situations reported from the floor are resolved within a week, no action is overdue by more than 30 days without an escalation, and every closure carries evidence an auditor accepts.", "supportRationale": "Produces closure rate, resolution time and overdue reports per site for committees and audits.", "usedInSteps": [{"step": "Close with evidence and report to committees and auditors", "description": "Verify each closure with the evidence attached by the owner, re-rate the linked risk, inform the reporter that the situation was resolved, and produce the action status reports for the CSSCT or CPPT meeting, the management review and the ISO 45001 certification audit.", "howItSupports": "Produces closure rate, resolution time and overdue reports per site for committees and audits.", "media": []}]}, {"customerId": "hsem", "customerName": "HSE Manager / Prevention Adviser", "customerGroup": "HSE and Prevention", "customerIcon": "customer-hsem-portrait.jpg", "productId": "kitry-implementation-and-services", "productName": "Kitry Implementation and Services", "productIcon": "kitry-implementation-and-services.png", "jobId": "jtbd-hsem-3", "jobName": "Keep chemical products and exposures under control and inspection-ready", "jobWhatItIs": "Maintain the inventory of chemical products used on every site with a current safety data sheet, the CLP hazard classification, the quantities and storage locations, the workstations and exposure groups that use them and the substitution plan for CMR (carcinogenic, mutagenic and reprotoxic) agents. Exposure records per workstation must feed the physician's surveillance rules so that reinforced medical follow-up is triggered automatically, and the whole register must satisfy the labour inspection, the insurer and the ISO 45001 auditor without a data-gathering exercise before each visit.", "jobOutcome": "The chemical inventory is complete and current at every site, every CMR substance has an exposure record per workstation and a substitution or containment plan, exposed workers are automatically in the right surveillance category, and any inspection request for the register is answered from the platform the same day.", "supportRationale": "Reports inventory completeness, CMR coverage and exposed headcount per site for inspections and committees.", "usedInSteps": [{"step": "Plan substitution and containment and prove control", "description": "Maintain the substitution plan for CMR agents, track containment and protective equipment measures as actions, run periodic checks of storage and labelling, and produce the register, exposure lists and substitution evidence for the labour inspection,     mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        flowchart: {
            htmlLabels: false
        }
    });

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

    function getFlows() {
        return currentStream.flows || [];
    }

    function getFlowDependencies(flow) {
        const dependencyIndex = new Map();
        (flow.steps || []).forEach(step => {
            (step.dependencies || []).forEach(dependency => {
                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());
    }

    function getStepDependency(step, dependency) {
        return (step.dependencies || []).find(item => (item.type || '') === (dependency.type || '') && (item.id || '') === (dependency.id || '')) || null;
    }

    function getPrimaryActors() {
        const streamJobs = currentStream.supportedCustomerJobs || [];
        const allJobs = streamJobs.length ? streamJobs : supported_jobs;
        return dedupe(allJobs.map(item => item.customerName || item.customerGroup || '').filter(Boolean), item => item);
    }

    function summarizeFlow(flow) {
        const steps = flow.steps || [];
        const firstStep = steps[0] || {};
        const lastStep = steps[steps.length - 1] || {};
        return {
            actor: flow.primaryActor || firstStep.actor || '',
            trigger: flow.trigger || firstStep.trigger || '',
            result: flow.successSignal || flow.outcome || lastStep.successSignal || lastStep.output || ''
        };
    }

    function renderStepMeta(label, value) {
        if (!value) {
            return '';
        }
        return '<div class="flow-step-meta-item"><div class="flow-step-meta-label">' + escapeHtml(label) + '</div><div class="flow-step-copy">' + escapeHtml(value) + '</div></div>';
    }

    function flowDependencyIconFile(dependency) {
        const dependencyId = dependency.id || '';
        const linkedBrick = related_bricks.find(brick => brick.id === dependencyId) || all_bricks.find(brick => brick.id === dependencyId) || {};
        return dependency.icon || linkedBrick.icon || (dependencyId ? dependencyId + '.png' : 'brick.png');
    }

    function renderFlowDependencyIcon(dependency, className) {
        return '<img class="' + escapeHtml(className) + '" src="../icons/' + escapeHtml(flowDependencyIconFile(dependency)) + '" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
    }

    function renderStepDependencyPills(step) {
        const dependencies = step.dependencies || [];
        if (!dependencies.length) {
            return '<div class="muted">No step-specific dependencies listed.</div>';
        }

        return '<div class="flow-step-dependencies">' + dependencies.map(dep => {
            const label = dep.name || dep.id || 'Dependency';
            const kind = 'Brick';
            return '<span class="flow-cell-brick">' + renderFlowDependencyIcon(dep, 'flow-cell-brick-icon') + '<span>' + escapeHtml(kind + ': ' + label) + '</span></span>';
        }).join('') + '</div>';
    }

    function simplifySupportCopy(value) {
        const text = String(value || '').trim();
        if (!text) {
            return '';
        }
        const simplified = text.replace(/^Supports .*? by helping users help /i, 'Facilitate ');
        return simplified;
    }
</script>

                html += '</div>';
            });

        html += '</div>';

        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
