    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

urce in French and Belgian occupational health and is wasted on visits a nurse could run.", "Plans that ignore site geography put a physician on the road instead of in consultation."], "dependencies": [{"type": "brick", "id": "schd", "name": "Convocation and Appointment Scheduling", "description": "Capacity plan.", "how": "Allocates visits to examiner agendas and consultation days."}, {"type": "brick", "id": "cfgr", "name": "Configuration Engine", "description": "Visit durations and delegation rules.", "how": "Holds per-customer visit types, durations and nurse delegation settings."}]}, {"id": "batch-and-send-convocations", "title": "Batch and send convocations with slot choice", "actor": "Occupational Health Nurse / Medical Assistant", "keyFacts": ["Convocations are generated per site and visit type in the worker's language (FR/NL/EN), sent by e-mail or by Cegedim SMS for workers without a corporate mailbox, and offer either a fixed slot or a choice of slots in the employee portal.", "The manager receives a release notice listing team members to free for their visit, without the reason or medical content."], "painPoints": ["Paper convocations handed out by supervisors are lost, and blue-collar workers with no e-mail are never reached.", "Managers who are not told about visits refuse to release workers from the line."], "dependencies": [{"type": "brick", "id": "schd", "name": "Convocation and Appointment Scheduling", "description": "Convocation batch.", "how": "Creates convocations and slot offers per worker."}, {"type": "brick", "id": "noti", "name": "Reminders, SMS and E-mail Notifications", "description": "E-mail and SMS delivery.", "how": "Sends convocations through e-mail and the Cegedim SMS gateway."}, {"type": "brick", "id": "epor", "name": "Employee Portal", "description": "Slot choice.", "how": "Lets the worker pick or confirm a slot."}, {"type": "brick", "id": "mpor", "name": "Manager Portal", "description": "Release notice.", "how": "Shows the manager which team members have a visit."}]}, {"id": "send-reminders-and-track-confirmations", "title": "Send reminders and track confirmations", "actor": "Occupational Health Nurse / Medical Assistant", "keyFacts": ["Reminders go out a set number of days before and the morning of the visit; confirmations, reschedules and cancellations update the agenda in real time.", "Delivery status per channel is visible, so an undelivered SMS triggers an e-mail or a call."], "painPoints": ["Services without automated reminders lose a large share of consultation slots to no-shows.", "Reminders sent manually stop when the medical secretary is on leave."], "dependencies": [{"type": "brick", "id": "noti", "name": "Reminders, SMS and E-mail Notifications", "description": "Reminder schedule.", "how": "Sends multi-channel reminders and records delivery."}, {"type": "brick", "id": "schd", "name": "Convocation and Appointment Scheduling", "description": "Confirmation tracking.", "how": "Updates slot status on confirmation, reschedule or cancellation."}]}, {"id": "handle-no-shows-and-reconvene", "title": "Handle no-shows and re-convene", "actor": "Occupational Health Nurse / Medical Assistant", "keyFacts": ["A no-show is recorded with a reason where known and the worker is re-convened automatically; repeated no-shows are escalated to the manager and HR, because attending is a legal obligation for the worker and the employer.", "The freed slot is offered to a worker on the waiting list on the same site."], "painPoints": ["No-shows quietly become overdue visits that surface only in the annual report.", "Escalations by phone leave no trace when HR later needs to prove the employer's diligence."], "dependencies": [{"type": "brick", "id": "schd", "name": "Convocation and Appointment Scheduling", "description": "No-show handling.", "how": "Records the no-show, re-convenes and refills the slot."}, {"type": "brick", "id": "noti", "name": "Reminders, SMS and E-mail Notifications", "description": "Escalation notice.", "how": "Notifies the manager and HR of repeated no-shows."}, {"type": "brick", "id": "audt", "name": "Audit Trail and Data Retention", "description": "Diligence record.", "how": "Keeps the convocation history as evidence of the employer's diligence."}]}, {"id": "monitor-periodicity-compliance-per-site", "title": "Monitor periodicity compliance per site", "actor": "Occupational Health Service Manager / Coordinator", "keyFacts": ["The dashboard shows per site and category the share of workers within periodicity, the overdue count and the projected coverage at the end of the quarter if the plan holds.", "The coordinator uses it to negotiate extra physician days or a nurse hire before compliance slips."], "painPoints": ["Compliance known only once a year cannot be steered.", "Site managers are surprised by an inspection finding of overdue aptitude examinations on their line."], "dependencies": [{"type": "brick", "id": "dash", "name": "Dashboards and KPIs", "description": "Compliance dashboard.", "how": "Shows periodicity compliance, overdue and projected coverage."}, {"type": "brick", "id": "surv", "name": "Surveillance Rules and Periodicity Engine", "description": "Compliance calculation.", "how": "Computes within-periodicity status per worker."}]}]}, {"id": "schedule-event-driven-visits", "title": "Schedule Event-driven Visits (Return to Work, Pre-return, Request by Worker or Employer)", "description": "HR, the worker or the employer triggers a non-periodic visit \u2014 return to work after a long absence, a pre-return visit, a visit at the worker's request, an unplanned visit after an accident \u2014 and the service schedules it within the legal delay.", "primaryActor": "HR Administrator / Personnel Officer", "trigger": "HR records the end of an absence of 30 days or more (France) or four weeks (Belgium), a worker asks for a visit, or the employer or physician requests one.", "successSignal": "The visit is scheduled within the legal delay (for a French visite de reprise within eight days of the return), the worker and manager are informed, and the outcome feeds the fitness status and return-to-work coordination.", "steps": [{"id": "detect-the-triggering-event", "title": "Detect the triggering event from HR data or a request", "actor": "HR Administrator / Personnel Officer", "keyFacts": ["Absence data from the HRIS flags returns after a work accident, an occupational disease, a maternity leave or an illness above the threshold (in France since the 2022 reform: 30 days after a work accident, 60 days after a non-occupational illness or accident, any duration after an occupational disease or maternity leave; four weeks in Belgium); HR can also raise a request manually.", "Workers request a visit from the employee portal at any time without stating a reason, as French and Belgian law entitle them to."], "painPoints": ["HR learns of a return only when the worker reappears, too late for the visit within eight days.", "Requests made verbally to the nurse are forgotten in a busy consultation week."], "dependencies": [{"type": "brick", "id": "wrkr", "name": "Worker, Contract and Assignment Registry", "description": "Absence events.", "how": "Surfaces absence starts and ends from HR data."}, {"type": "brick", "id": "surv", "name": "Surveillance Rules and Periodicity Engine", "description": "Event-driven visit rules.", "how": "Derives the required visit type and legal delay from the event."}, {"type": "brick", "id": "epor", "name": "Employee Portal", "description": "Worker request.", "how": "Captures a visit request by the worker."}]}, {"id": "propose-a-pre-return-visit", "title": "Propose a pre-return visit during the absence", "actor": "Occupational Physician", "keyFacts": ["During a long absence the physician can offer a visite de pr\u00e9-reprise (France) or pre-return consultation (Belgium) to prepare adaptations, at the request of the worker, the treating physician or the sickness insurance physician; in the Netherlands the bedrijfsarts's problem analysis by week six under the Wet verbetering poortwachter plays the equivalent role.", "The offer is sent through the portal or by SMS and the worker accepts without the employer seeing medical reasons."], "painPoints": ["Adaptations discussed only on the return day delay the actual return by weeks.", "Pre-return contacts by the employer risk breaching the worker's privacy; the medical service is the right channel."], "dependencies": [{"type": "brick", "id": "schd", "name": "Convocation and Appointment Scheduling", "description": "Pre-return slot.", "how": "Schedules the optional pre-return visit."}, {"type": "brick", "id": "noti", "name": "Reminders, SMS and E-mail Notifications", "description": "Offer delivery.", "how": "Sends the offer by e-mail or SMS."}, {"type": "brick", "id": "conf", "name": "Medical Confidentiality and Access Segregation", "description": "Employer segregation.", "how": "Keeps the pre-return visit and reasons out of the employer's view."}]}, {"id": "schedule-within-the-legal-delay", "title": "Schedule the visit within the legal delay", "actor": "Occupational Health Nurse / Medical Assistant", "keyFacts": ["The nurse books the visit on the first slot inside the legal delay with the right examiner (a return-to-work visit is a physician visit) and duration, and the platform flags visits that will breach the delay so the coordinator can free time.", "The employee and manager are notified; the manager sees only the date and that the worker must be released."], "painPoints": ["Return visits booked in the next free slot three weeks later put the employer in breach and leave the worker without a fitness decision.", "Managers who plan the return without the visit date assign the worker to the old post prematurely."], "dependencies": [{"type": "brick", "id": "schd", "name": "Convocation and Appointment Scheduling", "description": "Delay-aware booking.", "how": "Books the visit within the legal delay and flags breaches."}, {"type": "brick", "id": "noti", "name": "Reminders, SMS and E-mail Notifications", "description": "Notifications.", "how": "Notifies worker and manager."}, {"type": "brick", "id": "mpor", "name": "Manager Portal", "description": "Manager view.", "how": "Shows the return visit date without medical content."}]}, {"id": "coordinate-restrictions-with-hr-after-the-visit", "title": "Coordinate restrictions and adaptations with HR after the visit", "actor": "HR Administrator / Personnel Officer", "keyFacts": ["Once the physician issues the fitness opinion, HR sees the restrictions and proposed adaptations (adapted hours, no night work, no lifting above a weight, part-time therapeutic return) and records what the employer put in place and when.", "In France an inaptitude opinion opens the employer's one-month reclassification search; the platform tracks the deadline and the exchanges with the physician."], "painPoints": ["Restrictions communicated by paper certificate reach the manager days later and are applied inconsistently.", "Reclassification deadlines missed by HR expose the employer to reinstated salary payments and litigation."], "dependencies": [{"type": "brick", "id": "cons", "name": "Consultation Workspace and Fitness Opinions", "description": "Fitness opinion.", "how": "Provides the opinion, restrictions and adaptations."}, {"type": "brick", "id": "wrkr", "name": "Worker, Contract and Assignment Registry", "description": "Adaptation record.", "how": "Records applied adaptations against the assignment."}, {"type": "brick", "id": "noti", "name": "Reminders, SMS and E-mail Notifications", "description": "Deadline reminders.", "how": "Reminds HR of reclassification and follow-up deadlines."}]}, {"id": "plan-the-follow-up-visit", "title": "Plan the follow-up visit and close the event", "actor": "Occupational Health Nurse / Medical Assistant", "keyFacts": ["If the physician asked for a follow-up (temporary restrictions, part-time return), it is scheduled at once and the event is closed when the worker is back on an assignment consistent with the opinion.", "The whole event chain is kept as one record for the annual report and for a later dispute."], "painPoints": ["Follow-ups agreed verbally are never booked and temporary restrictions become permanent by default.", "Events closed in HR and open in the medical service produce contradictory reports."], "dependencies": [{"type": "brick", "id": "schd", "name": "Convocation and Appointment Scheduling", "description": "Follow-up booking.", "how": "Schedules the follow-up visit."}, {"type": "brick", "id": "surv", "name": "Surveillance Rules and Periodicity Engine", "description": "Event closure.", "how": "Closes the event when the follow-up is done and periodicity resumes."}]}]}], "outcomes": ["Periodic surveillance compliance stays above target with the physicians and nurses the service actually has", "Convocations go out automatically with the right visit type, duration and examiner, and workers choose or reschedule slots themselves", "No-shows drop because reminders reach workers by SMS and e-mail and managers see who is released for a visit", "Overdue and at-risk visits are visible per site months in advance, not after the annual report"], "brickDependencies": [{"targetBrickId": "surv", "type": "composition"}, {"targetBrickId": "schd", "type": "composition"}, {"targetBrickId": "noti", "type": "composition"}, {"targetBrickId": "wrkr", "type": "composition"}, {"targetBrickId": "regc", "type": "composition"}, {"targetBrickId": "mpor", "type": "composition"}, {"targetBrickId": "epor", "type": "composition"}, {"targetBrickId": "dash", "type": "composition"}, {"targetBrickId": "cfgr", "type": "composition"}, {"targetBrickId": "audt", "type": "composition"}, {"targetBrickId": "conf", "type": "composition"}, {"targetBrickId": "cons", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "E-mail Gateway", "type": "messaging-gateway", "interface": "Transactional e-mail", "description": "Delivers convocations, reminders, task assignments, action notifications, declaration confirmations and report distributions to employees, managers, HR and the medical service."}, {"system": "Cegedim SMS Gateway", "type": "messaging-gateway", "interface": "SMS API for convocations, reminders and one-time codes", "description": "Delivers convocations, appointment reminders, campaign invitations and portal access codes to employees who have no corporate e-mail address, such as field, plant and depot staff."}, {"system": "Customer HRIS and Payroll Systems", "type": "hr-system", "interface": "Scheduled file exports, SFTP drops and REST/SOAP APIs (SAP SuccessFactors, Workday, Oracle HCM, ADP, Cegid, Partena, SD Worx, public-sector HR systems)", "description": "Source of truth for employees, contracts, assignments, sites, cost centres and absences that the platform synchronises so that surveillance, portals and declarations run on current workforce data."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []};

    mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        flowchart: {
            htmlLabels: false
        }
    });

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

    function getFlows() {
        return currentStream.flows || [];
    }

    function getFlowDependencies(flow) {
        const dependencyIndex = new Map();
        (flow.steps || []).forEach(step => {
            (step.dependencies || []).forEach(dependency => {
                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());
    }

    function getStepDependency(step, dependency) {
        return (step.dependencies || []).find(item => (item.type || '') === (dependency.type || '') && (item.id || '') === (dependency.id || '')) || null;
    }

    function getPrimaryActors() {
        const streamJobs = currentStream.supportedCustomerJobs || [];
        const allJobs = streamJobs.length ? streamJobs : supported_jobs;
        return dedupe(allJobs.map(item => item.customerName || item.customerGroup || '').filter(Boolean), item => item);
    }

    function summarizeFlow(flow) {
        const steps = flow.steps || [];
        const firstStep = steps[0] || {};
        const lastStep = steps[steps.length - 1] || {};
        return {
            actor: flow.primaryActor || firstStep.actor || '',
            trigger: flow.trigger || firstStep.trigger || '',
            result: flow.successSignal || flow.outcome || lastStep.successSignal || lastStep.output || ''
        };
    }

    function renderStepMeta(label, value) {
        if (!value) {
            return '';
        }
        return '<div class="flow-step-meta-item"><div class="flow-step-meta-label">' + escapeHtml(label) + '</div><div class="flow-step-copy">' + escapeHtml(value) + '</div></div>';
    }

    function flowDependencyIconFile(dependency) {
        const dependencyId = dependency.id || '';
        const linkedBrick = related_bricks.find(brick => brick.id === dependencyId) || all_bricks.find(brick => brick.id === dependencyId) || {};
        return dependency.icon || linkedBrick.icon || (dependencyId ? dependencyId + '.png' : 'brick.png');
    }

    function renderFlowDependencyIcon(dependency, className) {
        return '<img class="' + escapeHtml(className) + '" src="../icons/' + escapeHtml(flowDependencyIconFile(dependency)) + '" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
    }

    function renderStepDependencyPills(step) {
        const dependencies = step.dependencies || [];
        if (!dependencies.length) {
            return '<div class="muted">No step-specific dependencies listed.</div>';
        }

        return '<div class="flow-step-dependencies">' + dependencies.map(dep => {
            const label = dep.name || dep.id || 'Dependency';
            const kind = 'Brick';
            return '<span class="flow-cell-brick">' + renderFlowDependencyIcon(dep, 'flow-cell-brick-icon') + '<span>' + escapeHtml(kind + ': ' + label) + '</span></span>';
        }).join('') + '</div>';
    }

    function simplifySupportCopy(value) {
        const text = String(value || '').trim();
        if (!text) {
            return '';
        }
        const simplified = text.replace(/^Supports .*? by helping users help /i, 'Facilitate ');
        return simplified;
    }

      "label": "Plan and schedule medical surveillance"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
