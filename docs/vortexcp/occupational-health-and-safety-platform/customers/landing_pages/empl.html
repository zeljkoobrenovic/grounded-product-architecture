connectors (SAP SuccessFactors, Workday, ADP, public-sector HR systems) running at customers without project-specific code.", "unit": "connectors", "currentValue": "4", "targetValue": "8", "icon": "kpi-hrad-bo-hrad-b1-c1-l1.png", "children": []}, {"id": "bo-hrad-b1-c1-l2", "name": "HRIS connector onboarding time", "description": "Working days from mapping workshop to the first accepted nightly synchronisation at a new customer.", "unit": "working days", "currentValue": "25", "targetValue": "10", "icon": "kpi-hrad-bo-hrad-b1-c1-l2.png", "children": []}]}, {"id": "bo-hrad-b1-c2", "name": "Declarations filed through the platform per year", "description": "Number of accident and occupational disease declarations generated or submitted through the platform across all customers per year.", "unit": "declarations per year", "currentValue": "14000", "targetValue": "30000", "icon": "kpi-hrad-bo-hrad-b1-c2.png", "children": [{"id": "bo-hrad-b1-c2-l1", "name": "National declaration form coverage", "description": "Share of the accident and occupational disease forms required in France, Belgium, Luxembourg and the Netherlands that the platform generates or submits natively.", "unit": "%", "currentValue": "70", "targetValue": "95", "icon": "kpi-hrad-bo-hrad-b1-c2-l1.png", "children": []}, {"id": "bo-hrad-b1-c2-l2", "name": "Portal-originated declarations share", "description": "Share of declarations that start from a manager portal report rather than from HR data entry.", "unit": "%", "currentValue": "30", "targetValue": "70", "icon": "kpi-hrad-bo-hrad-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-hrad-b2", "name": "Retention and workforce-based revenue", "description": "Whether HR-facing modules grow the subscription with the workforce and keep customers, and what they cost to support.", "currentValue": "63", "icon": "kpi-hrad-bo-hrad-b2.png", "children": [{"id": "bo-hrad-b2-c1", "name": "Net revenue retention of HR-connected customers", "description": "Subscription revenue this year from last year's customers with an HRIS connector, including workforce growth and added modules, as a share of last year's revenue from the same customers.", "unit": "%", "currentValue": "103", "targetValue": "112", "icon": "kpi-hrad-bo-hrad-b2-c1.png", "children": [{"id": "bo-hrad-b2-c1-l1", "name": "Employee records under subscription growth", "description": "Year-on-year growth of the number of employee records covered by workforce-sized subscriptions.", "unit": "% year on year", "currentValue": "6", "targetValue": "12", "icon": "kpi-hrad-bo-hrad-b2-c1-l1.png", "children": []}, {"id": "bo-hrad-b2-c1-l2", "name": "Module upsells per HR-connected customer per year", "description": "Average number of additional modules or connectors bought per year by customers with an HRIS connector.", "unit": "modules per customer per year", "currentValue": "0.3", "targetValue": "0.7", "icon": "kpi-hrad-bo-hrad-b2-c1-l2.png", "children": []}]}, {"id": "bo-hrad-b2-c2", "name": "HR support cost per customer", "description": "Annual support and account management cost attributable to HR-facing modules per customer organisation. Modeled seed value, not a reported Kitry figure.", "unit": "EUR per customer per year", "currentValue": "3200", "targetValue": "2000", "icon": "kpi-hrad-bo-hrad-b2-c2.png", "children": [{"id": "bo-hrad-b2-c2-l1", "name": "HR support tickets per 1,000 employees", "description": "Number of HR-raised support tickets per thousand employee records per year, mostly synchronisation and declaration questions.", "unit": "tickets per 1,000 employees per year", "currentValue": "2.4", "targetValue": "1.0", "icon": "kpi-hrad-bo-hrad-b2-c2-l1.png", "children": []}, {"id": "bo-hrad-b2-c2-l2", "name": "Synchronisation incidents per customer per year", "description": "Number of failed or partially failed HRIS synchronisation runs per customer per year that required Kitry intervention.", "unit": "incidents per customer per year", "currentValue": "5", "targetValue": "1.5", "icon": "kpi-hrad-bo-hrad-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make the HR administrator's employee data the heartbeat of occupational health: every hire, transfer, absence and return flows from the HRIS and triggers the right examination, every accident is declared correctly inside the legal window from data that already exists, and restrictions and returns are applied with managers without HR ever seeing medical content.", "timeHorizons": {"year1": {"focus": "Replace paper and spreadsheets with synchronised data and native declarations: productised HRIS connectors, French CERFA and net-entreprises and Belgian insurer and Fedris forms generated from the worker record, and manager-portal event reporting so the 48-hour and 8-day clocks start at the accident, not at the HR desk.", "productTheme": "Synchronised workforce, native declarations", "customerKPI": {"northStar": "Work accident declaration on-time rate", "supporting": ["Declaration lead time", "Employee data sync accuracy"]}, "businessKPI": {"northStar": "Accidents module attach rate", "revenueStreams": ["Work Accidents and Occupational Diseases module subscriptions", "HRIS connector and integration services", "Workforce-sized subscription growth"], "supporting": ["HRIS connector attach rate", "National declaration form coverage"]}, "milestones": ["Ship productised SAP SuccessFactors and Workday connectors with an exception workflow that HR can clear without Kitry support", "Generate the current French CERFA and net-entreprises DAT, the Belgian insurer declaration and Fedris occupational disease forms from the worker record with submission timestamps", "Release manager-portal accident reporting so that most declarations start from the floor within 24 hours of the event"]}, "year3": {"focus": "Make HR data and accident follow-up steerable across countries: absence data from the HRIS driving return-to-work visits and re-integration procedures, national connectors that submit rather than export, and accident and surveillance indicators that HR can present to the CSE, CPPT and insurers without a spreadsheet.", "productTheme": "From declaration to steerable follow-up", "customerKPI": {"northStar": "Work accident declaration on-time rate", "supporting": ["Return-to-work coordination time", "Declaration rejection rate"]}, "businessKPI": {"northStar": "Net revenue retention of HR-connected customers", "revenueStreams": ["Accidents and Occupational Diseases module subscriptions", "Manager portal seats for HR and line management", "National reporting connectors and Dutch market packages"], "supporting": ["Declarations filed through the platform per year", "Module upsells per HR-connected customer per year"]}, "milestones": ["Submit French and Belgian declarations directly through national and insurer connectors with acknowledgement stored as proof of on-time filing", "Drive return-to-work, pre-return and re-integration procedures from HRIS absence data with legal deadlines tracked per country", "Deliver CSE, CPPT and insurer reporting packs with frequency and severity rates from declared events, extended to the Netherlands"]}, "year5": {"focus": "Continuous workforce and event data: HR changes and field events update surveillance and risk in real time, declarations are drafted from the manager's report and the worker record for HR approval, and accident patterns are surfaced before the CSE asks.", "productTheme": "Continuously synchronised, assisted HR compliance", "customerKPI": {"northStar": "Work accident declaration on-time rate", "supporting": ["Assignment change to surveillance trigger time", "Restrictions acknowledged within 48 hours rate"]}, "businessKPI": {"northStar": "Accidents module attach rate", "revenueStreams": ["Workforce-sized platform subscriptions across all modules", "Assisted declaration and analysis services", "Cross-customer accident benchmarking data products"], "supporting": ["Employee records under subscription growth", "HR support tickets per 1,000 employees"]}, "milestones": ["Move HRIS synchronisation from nightly batches to event-driven updates so surveillance triggers the same day as the HR change", "Draft complete declarations from the manager's portal report and the worker record for HR approval, with country rules applied automatically", "Offer anonymised accident benchmarking by sector and country to customers that opt in, built on declared events"]}}}, "domain": "HR and Employees"}, {"id": "empl", "name": "Employee", "description": "Any of the four million-plus workers whose employers run their occupational health and safety on the platform: a warehouse operator on night shifts at a logistics depot, a process operator at a chemical plant, a nurse in a hospital, a bus driver, a city gardener, a researcher in a laboratory or a bank clerk in France, Belgium, Luxembourg or the Netherlands. Meets the occupational health service a few times a year at most, usually because a convocation arrived, and wants the visit to cost as little time and worry as possible. Uses the employee portal, when the employer has rolled it out and the service has earned trust, to book and move visits, complete questionnaires privately, download certificates and attestations, join teleconsultations and health campaigns and report a hazardous situation. Cares above all that the employer, the manager and HR never see medical content, that the visit does not cost a day of travel or a lost shift, and that raising a safety concern leads to something. More than half of employees at Kitry's French, Belgian and Luxembourg customers use self-service features; the persona is written for those who do and those who have not yet been convinced.", "icon": "customer-empl-portrait.jpg", "careAbout": ["Being certain that questionnaire answers, examination results and anything said to the physician stay under medical secrecy, out of reach of the manager, HR and the employer", "Knowing when a visit is due and why, and choosing or moving the slot around shifts, childcare and workload without phoning anyone", "Losing as little working time as possible per visit, with teleconsultation when the physician allows it and screenings done in one pass", "Having certificates, attestations of exposure and vaccination records at hand when changing job, retiring or seeing a personal doctor", "Reporting a hazard or near miss from the floor in a minute and seeing that somebody took it on and fixed it", "Being able to ask for a visit on their own initiative, confidentially, when a symptom or a situation at work calls for it"], "winsThem": ["A portal invitation from the medical service, in the employee's language, that explains who sees what before asking for anything, backed by health-data hosting the works council has reviewed", "Booking, moving and confirming visits in a few taps on a phone, with SMS and e-mail reminders so nothing is missed and no letter has to be found", "Pre-visit questionnaires completed in private that make the consultation shorter and more relevant, and certificates available the same day", "Secure teleconsultation with the occupational physician from home or the site office for the visits that allow it, so a follow-up does not cost a day", "A safety reporting button with photo and location, with an acknowledgement, a named owner and closure feedback"], "theirFear": ["That an honest answer about alcohol, sleep, a chronic illness or stress ends up with the employer and costs a promotion, a shift or the job", "Being blamed or marked as difficult for reporting a hazard, or reporting one and seeing nothing happen", "A missed visit, an unrecognised accident or a lost certificate that becomes the employee's problem years later when a disease is recognised or a pension is calculated"], "jobsToBeDone": [{"id": "jtbd-empl-1", "name": "Attend my medical visit with minimal disruption", "whatItIs": "Get through the initial, periodic, return-to-work or exposure-related examination the employer's occupational health service requires with as little lost time, uncertainty and chasing as possible: know when a visit is due and why, choose or change the slot around shifts and workload, receive reminders that make the visit hard to forget, prepare what the nurse will ask in advance, do the visit remotely when the physician allows it, and get the fitness certificate afterwards without asking.", "outcome": "The employee is never surprised by a convocation, books or moves the visit in minutes from a phone, arrives prepared and on time, loses less than half a shift per visit, and has the certificate in the portal the same day, so that surveillance feels like a service rather than a summons.", "steps": [{"step": "Learn that a visit is due and why", "description": "Receive the convocation by e-mail, SMS or in the portal with the type of examination, the reason (periodic surveillance, change of workstation, return after absence, exposure to a specific risk), the location or teleconsultation option and the deadline, in the employee's language, instead of a paper letter handed over by the supervisor.", "streamsNeeded": [{"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Generates the convocation with the examination type, periodicity reason and deadline derived from the worker's profile."}, {"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Delivers the convocation in the employee portal with the booking link and the explanation of the visit."}]}, {"step": "Choose or change a slot around my shifts", "description": "Pick a slot that fits the shift pattern, the site and the physician or nurse assigned, move it when a production peak or a child's illness intervenes, and see that the manager has been asked to release the employee for the visit, all without phoning the medical secretariat.", "streamsNeeded": [{"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Offers self-service booking and rescheduling from the available slots for the employee's site and examination type."}, {"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Maintains the slots, physician and nurse capacity and the rules on how late a visit can be moved."}]}, {"step": "Get reminders and prepare in advance", "description": "Receive SMS and e-mail reminders before the visit, complete the pre-visit questionnaire on a phone in private, and see what to bring (glasses, hearing protection, vaccination record) so that the consultation starts with the questions that matter.", "streamsNeeded": [{"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Sends the SMS and e-mail reminders through the notification partners at the configured intervals."}, {"id": "conduct-examinations-and-teleconsultations", "name": "Conduct examinations and teleconsultations", "howItSupports": "Provides the pre-visit questionnaire that feeds the consultation workspace."}]}, {"step": "Attend in person or by teleconsultation", "description": "Go through the screenings and the consultation at the medical service, or join a secure teleconsultation from home or the site office when the physician has judged it appropriate for this type of visit, with identity verified and the session neither recorded nor visible to the employer.", "streamsNeeded": [{"id": "conduct-examinations-and-teleconsultations", "name": "Conduct examinations and teleconsultations", "howItSupports": "Runs the examination and the secure teleconsultation session with the physician."}, {"id": "integrate-with-hr-devices-and-ecosystem", "name": "Integrate with HR, devices and the ecosystem", "howItSupports": "Provides the telehealth integration and the measurement devices used during the visit."}]}, {"step": "Receive my certificate and know what happens next", "description": "Find the fitness certificate or attestation in the portal the same day, understand any restriction or follow-up visit, and know that the manager has received only the employer-facing version.", "streamsNeeded": [{"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Stores the certificate in the employee's file and releases the employee's copy."}, {"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Makes the certificate available for download and shows the next scheduled visit."}]}], "media": [{"type": "image", "src": "media/jbtd-empl-jtbd-empl-1.png", "title": "Employee JTBD infographic: Attend my medical visit with minimal disruption", "alt": "Enterprise infographic for the job \"Attend my medical visit with minimal disruption\" for customer \"Employee\"."}]}, {"id": "jtbd-empl-2", "name": "Access my own health documents and complete questionnaires privately", "whatItIs": "Exercise the employee's rights over their own occupational health information: read and download fitness certificates, attestations of exposure, vaccination records and the documents the physician chooses to share; complete medical, exposure and well-being questionnaires in private rather than on paper in the workshop; give or withdraw consent for specific uses such as teleconsultation or transfer of the file to another service; and be certain that the employer, the manager and HR cannot see any of it.", "outcome": "The employee has their occupational health documents at hand when changing employer, retiring or seeing their own doctor, answers questionnaires honestly because nobody at the workplace can read them, and trusts the service enough to use it, which is the condition for self-service adoption above half of the workforce.", "steps": [{"step": "Activate my account and understand who sees what", "description": "Activate the portal account from the invitation sent by the employer or through the company single sign-on, read the plain-language notice on medical secrecy, GDPR rights and the separation between the medical file and the employer-facing information, and see the list of roles that can access each type of document.", "streamsNeeded": [{"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Provides the account activation, the privacy notice and the role-based visibility of documents."}, {"id": "integrate-with-hr-devices-and-ecosystem", "name": "Integrate with HR, devices and the ecosystem", "howItSupports": "Supports SSO and multi-factor authentication with the employer's identity provider."}]}, {"step": "Complete questionnaires in private", "description": "Answer the pre-visit, exposure, night-work, musculoskeletal or psychosocial questionnaires from a personal phone or a kiosk, save and resume, and know that the answers go straight to the physician's consultation workspace under medical secrecy.", "streamsNeeded": [{"id": "conduct-examinations-and-teleconsultations", "name": "Conduct examinations and teleconsultations", "howItSupports": "Delivers the questionnaires configured for the visit type and feeds the answers to the consultation."}, {"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Stores questionnaire responses in the confidential medical file, not in employer systems."}]}, {"step": "Read and download my documents", "description": "Find fitness certificates, exposure attestations, vaccination records and the documents the physician has shared, download them as signed PDFs, and request a copy of the medical file or its transfer to a new occupational health service when changing employer.", "streamsNeeded": [{"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Holds the documents, the e-signed certificates and the file transfer procedure between services."}, {"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Presents the employee's documents and the request form for copies and transfers."}]}, {"step": "Manage my consents and contact preferences", "description": "Give or withdraw consent for teleconsultation, for SMS reminders to a personal number, for participation in health campaigns and collective health studies, and see the history of consents and accesses to the file where the law provides for it.", "streamsNeeded": [{"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Lets the employee manage consents and contact preferences from the portal."}, {"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Records consents and the access log against the medical file."}]}], "media": [{"type": "image", "src": "media/jbtd-empl-jtbd-empl-2.png", "title": "Employee JTBD infographic: Access my own health documents and complete questionnaires privately", "alt": "Enterprise infographic for the job \"Access my own health documents and complete questionnaires privately\" for customer \"Employee\"."}]}, {"id": "jtbd-empl-3", "name": "Raise a safety concern and see it acted on", "whatItIs": "Report a hazardous situation, a near miss, a defective piece of equipment or a health complaint linked to the work, from the floor and in the moment, without having to find the right person or fill in a paper form, and then see that the report was received, assigned, acted upon and closed, so that reporting feels worthwhile rather than futile.", "outcome": "The employee reports in under two minutes with a photo and a location, gets an acknowledgement, can follow the corrective action to closure with feedback, and, where the situation touches health, can ask for a visit with the occupational physician, which builds the reporting culture the prevention adviser needs.", "steps": [{"step": "Report the situation from where I am", "description": "Open the portal on a phone, describe the hazard or near miss, add a photo and the workstation or location, choose whether to report anonymously where the employer allows it, and submit; for an immediate danger use the right to withdraw and mark the report as urgent.", "streamsNeeded": [{"id": "report-and-resolve-hazardous-situations", "name": "Report and resolve hazardous situations", "howItSupports": "Captures the field report with location, photo and urgency and routes it to the responsible person."}, {"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Provides the reporting form in the employee portal, including anonymous reporting where configured."}]}, {"step": "Get an acknowledgement and see who is handling it", "description": "Receive confirmation that the report exists, the name or role of the person it was assigned to, and the expected response time, instead of wondering whether the e-mail was read.", "streamsNeeded": [{"id": "report-and-resolve-hazardous-situations", "name": "Report and resolve hazardous situations", "howItSupports": "Assigns the report, records the responsible person and the target response time."}, {"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Shows the status of the employee's own reports in the portal."}]}, {"step": "Follow the corrective action to closure", "description": "See the action decided, its due date and its closure with evidence, comment if the fix did not work, and see the situation reflected in the workstation's risk assessment when it changes the exposure.", "streamsNeeded": [{"id": "report-and-resolve-hazardous-situations", "name": "Report and resolve hazardous situations", "howItSupports": "Tracks the corrective action from assignment to closure with evidence and reopening."}, {"id": "assess-and-control-workplace-risks", "name": "Assess and control workplace risks", "howItSupports": "Updates the risk assessment of the workstation when the reported situation changes its risk."}]}, {"step": "Ask for a visit when my health is affected", "description": "Request a spontaneous visit with the occupational physician, on the employee's own initiative and without going through the manager, when a symptom, an exposure or a psychosocial situation calls for it, and have the request handled confidentially.", "streamsNeeded": [{"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Schedules the employee-requested visit without exposing the reason to the employer."}, {"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Keeps the request and its outcome within the confidential medical file."}]}], "media": [{"type": "image", "src": "media/jbtd-empl-jtbd-empl-3.png", "title": "Employee JTBD infographic: Raise a safety concern and see it acted on", "alt": "Enterprise infographic for the job \"Raise a safety concern and see it acted on\" for customer \"Employee\"."}]}], "customerJourneyStories": [{"id": "journey-empl-1", "name": "From a convocation letter to booking my own visit", "linkedJobIds": ["jtbd-empl-1", "jtbd-empl-2"], "summary": "A warehouse operator at a French logistics site, used to paper convocations handed over by the supervisor, is invited to the employee portal by the company's occupational health service, moves her own visit, completes the questionnaire on her phone and ends up preferring the portal for every contact with the service.", "stages": [{"stage": "Trigger", "narrative": "A periodic visit convocation arrives as a printed letter with a fixed date in the middle of a night-shift week, and the operator has to phone the medical secretariat twice during working hours to move it. Two colleagues missed their visits the same month because the letter reached them late. The service has just gone live on Kitry and decides that the next convocations will be sent through the employee portal."}, {"stage": "Discovery", "narrative": "The next convocation comes as an e-mail and an SMS from the occupational health service with a link to activate a personal account, together with a poster in the break room and a short message from the nurse at the shift briefing explaining that the portal belongs to the medical service, not to HR, and that it lets employees pick their own slot."}, {"stage": "Evaluation", "narrative": "The operator hesitates: will the questionnaire answers be visible to the supervisor, and why does the company need a personal phone number? She reads the privacy notice on the activation page, sees the list of roles that can see each document, and asks the nurse, who explains that the file is under medical secrecy on certified health-data hosting and that the manager only ever sees the fitness conclusion. A colleague from the union confirms the works council reviewed the setup."}, {"stage": "Trial", "narrative": "She activates the account with the company login, moves the visit to a morning after her night-shift week in three taps, receives an SMS reminder two days before, and fills in the pre-visit questionnaire on the bus. At the visit the nurse already has her answers and the consultation is shorter; the fitness certificate appears in the portal the same afternoon."}, {"stage": "Engagement", "narrative": "Over the following year she downloads her certificate when she applies for an internal transfer, joins the flu vaccination campaign from the portal, does a follow-up on a shoulder complaint by teleconsultation from home, and files a report about a damaged racking upright with a photo, which she watches move from assigned to closed within a week."}, {"stage": "Retention", "narrative": "At the next periodic convocation she books directly from the notification without contacting anyone, and tells new colleagues on her shift to activate their accounts. Self-service bookings at the site pass three quarters of visits, and the medical secretariat stops printing letters except for the few workers who ask for them."}], "media": [{"type": "image", "src": "media/journey-empl-empl-1.png", "title": "Employee customer journey: From a convocation letter to booking my own visit", "alt": "Enterprise journey storyboard for \"From a convocation letter to booking my own visit\" for customer \"Employee\"."}]}, {"id": "journey-empl-2", "name": "Onboarding at a Belgian chemical site with the portal from day one", "linkedJobIds": ["jtbd-empl-1", "jtbd-empl-3"], "summary": "A new process operator hired at a Belgian chemical plant receives his employee portal invitation with the onboarding pack, completes the pre-employment health assessment through it, and comes to rely on the portal for questionnaires, safety reports and shift-friendly teleconsultations.", "stages": [{"stage": "Trigger", "narrative": "Before his first day the new hire is told that a pre-employment health assessment with the company's internal prevention service is mandatory for a workstation with chemical exposure, and that he cannot be put to work on that workstation until the physician has issued the fitness opinion. He expects a paper form and a queue at the medical service."}, {"stage": "Discovery", "narrative": "The onboarding e-mail from HR contains the portal invitation generated when his record arrived from the HRIS, a two-minute video from the internal prevention service showing booking, questionnaires and the safety reporting button, and the site's welcome session where the prevention adviser shows the portal on the screen next to the emergency plan."}, {"stage": "Evaluation", "narrative": "He wonders how much the company will learn about his health from the questionnaire and whether reporting a hazard will mark him as a troublemaker in his first month. The portal's Dutch-language privacy notice, the explanation that the medical file is separate from the employer's systems and readable only by the physician and nurse, and the option to report hazardous situations anonymously answer the first worry; a colleague's story of a fixed ventilation problem answers the second."}, {"stage": "Trial", "narrative": "He completes the exposure questionnaire and the pre-employment assessment questionnaire on his phone the evening before, books the slot suggested for the induction week, and attends the assessment with audiometry and spirometry captured directly by the connected devices. The fitness opinion for the chemical workstation is in the portal that evening and the shift leader confirms his start on the unit the next morning."}, {"stage": "Engagement", "narrative": "During the first year he uses the portal to report a leaking valve seal with a photo from the plant floor, sees it assigned to the shift leader and closed with a replacement part, joins a hepatitis vaccination campaign, and has a follow-up on a skin complaint by teleconsultation from the control room during a night shift rather than losing a day."}, {"stage": "Retention", "narrative": "When he moves to a different unit two years later, his workstation change arrives from the HRIS and the portal shows the new periodic visit already planned; he books it in a minute and downloads his exposure attestation for his own records. He is one of the operators the prevention adviser cites when the works council asks whether people actually use the reporting function."}], "media": [{"type": "image", "src": "media/journey-empl-empl-2.png", "title": "Employee customer journey: Onboarding at a Belgian chemical site with the portal from day one", "alt": "Enterprise journey storyboard for \"Onboarding at a Belgian chemical site with the portal from day one\" for customer \"Employee\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-empl-top", "name": "Visit self-service rate", "description": "Share of medical visits booked, rescheduled or confirmed by the employee through the portal without contacting the medical secretariat by phone or e-mail. Kitry reports that more than half of employees at its French, Belgian and Luxembourg customers use self-service; the values here are modeled seeds for a large employer, not an official Kitry figure.", "unit": "%", "currentValue": "52", "targetValue": "75", "link": "https://dashboard.example.com/occupational-health-and-safety-platform/customers/empl/kpis/co-empl-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-empl-co-empl-top.png"}, "branches": [{"id": "co-empl-b1", "name": "Effortless visits", "description": "How little time and effort a visit costs the employee, from convocation to certificate.", "currentValue": "58", "icon": "kpi-empl-co-empl-b1.png", "children": [{"id": "co-empl-b1-c1", "name": "Appointment rescheduling effort", "description": "Average minutes an employee spends to move a visit, including calls, e-mails and portal time, measured by survey and portal timing.", "unit": "minutes per reschedule", "currentValue": "12", "targetValue": "2", "icon": "kpi-empl-co-empl-b1-c1.png", "children": [{"id": "co-empl-b1-c1-l1", "name": "Reschedules completed in the portal share", "description": "Share of visit changes made by the employee in the portal rather than by the secretariat on the employee's request.", "unit": "%", "currentValue": "48", "targetValue": "80", "icon": "kpi-empl-co-empl-b1-c1-l1.png", "children": []}, {"id": "co-empl-b1-c1-l2", "name": "Visit no-show rate", "description": "Share of scheduled visits the employee does not attend without prior rescheduling.", "unit": "%", "currentValue": "11", "targetValue": "4", "icon": "kpi-empl-co-empl-b1-c1-l2.png", "children": []}]}, {"id": "co-empl-b1-c2", "name": "Time away from work per visit", "description": "Average minutes an employee is away from the workstation for a visit, including travel and waiting; driven down by questionnaires completed beforehand and by visits held remotely.", "unit": "minutes", "currentValue": "95", "targetValue": "60", "icon": "kpi-empl-co-empl-b1-c2.png", "children": [{"id": "co-empl-b1-c2-l1", "name": "Questionnaire completed before visit rate", "description": "Share of visits for which the employee completed the pre-visit questionnaire in the portal before arriving or joining, which shortens the consultation.", "unit": "%", "currentValue": "45", "targetValue": "80", "icon": "kpi-empl-co-empl-b1-c2-l1.png", "children": []}, {"id": "co-empl-b1-c2-l2", "name": "Teleconsultation share of eligible visits", "description": "Share of visits the physician has classified as eligible for teleconsultation that are actually held remotely.", "unit": "%", "currentValue": "18", "targetValue": "45", "icon": "kpi-empl-co-empl-b1-c2-l2.png", "children": []}]}]}, {"id": "co-empl-b2", "name": "Trust and voice", "description": "Whether employees trust the portal with their health information and whether their safety reports lead to action.", "currentValue": "55", "icon": "kpi-empl-co-empl-b2.png", "children": [{"id": "co-empl-b2-c1", "name": "Employee trust in confidentiality", "description": "Survey score on which employees rate their confidence that their occupational health information is not visible to their employer or manager.", "unit": "score (1-10)", "currentValue": "7.2", "targetValue": "8.5", "icon": "kpi-empl-co-empl-b2-c1.png", "children": [{"id": "co-empl-b2-c1-l1", "name": "Employees with an activated portal account", "description": "Share of employees invited to the portal who have activated their account and logged in at least once.", "unit": "%", "currentValue": "58", "targetValue": "85", "icon": "kpi-empl-co-empl-b2-c1-l1.png", "children": []}, {"id": "co-empl-b2-c1-l2", "name": "Documents downloaded per employee per year", "description": "Average number of certificates, attestations and shared documents an employee downloads per year, a proxy for the portal being the place they keep their health documents.", "unit": "documents per employee per year", "currentValue": "0.9", "targetValue": "2.0", "icon": "kpi-empl-co-empl-b2-c1-l2.png", "children": []}]}, {"id": "co-empl-b2-c2", "name": "Safety report response time", "description": "Hours from an employee's hazardous situation report to its acknowledgement and assignment to a responsible person.", "unit": "hours", "currentValue": "72", "targetValue": "24", "icon": "kpi-empl-co-empl-b2-c2.png", "children": [{"id": "co-empl-b2-c2-l1", "name": "Safety reports per 1,000 employees per year", "description": "Number of hazardous situations, near misses and equipment defects reported through the portal per thousand employees per year, a measure of reporting culture.", "unit": "reports per 1,000 employees per year", "currentValue": "35", "targetValue": "90", "icon": "kpi-empl-co-empl-b2-c2-l1.png", "children": []}, {"id": "co-empl-b2-c2-l2", "name": "Safety reports closed with feedback to reporter rate", "description": "Share of employee reports closed with a recorded action and a closure notification visible to the reporter.", "unit": "%", "currentValue": "60", "targetValue": "90", "icon": "kpi-empl-co-empl-b2-c2-l2.png", "children": []}]}]}]}, "businessOutcomes": {"top": {"id": "bo-empl-top", "name": "Portal module attach rate", "description": "Share of customer organisations whose subscription includes the Employee and Manager Portals module, the entry point for self-service and the channel through which the platform reaches every employee. Modeled seed value for the installed base, not a reported Kitry figure.", "unit": "%", "currentValue": "55", "targetValue": "85", "link": "https://dashboard.example.com/occupational-health-and-safety-platform/customers/empl/kpis/bo-empl-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-empl-bo-empl-top.png"}, "branches": [{"id": "bo-empl-b1", "name": "Portal reach", "description": "How many employees the portals reach and how much of their contact with the service moves online.", "currentValue": "57", "icon": "kpi-empl-bo-empl-b1.png", "children": [{"id": "bo-empl-b1-c1", "name": "Portal-enabled workforce", "description": "Number of employee records at customers with the portal module live, out of the 4 million-plus employee records tracked on the platform.", "unit": "million employees", "currentValue": "1.8", "targetValue": "3.2", "icon": "kpi-empl-bo-empl-b1-c1.png", "children": [{"id": "bo-empl-b1-c1-l1", "name": "Portal rollout time per customer", "description": "Working days from portal activation in the tenant to invitations sent to the whole workforce.", "unit": "working days", "currentValue": "45", "targetValue": "20", "icon": "kpi-empl-bo-empl-b1-c1-l1.png", "children": []}, {"id": "bo-empl-b1-c1-l2", "name": "SSO-enabled portal customers share", "description": "Share of portal customers whose employees log in through the employer's identity provider rather than separate credentials.", "unit": "%", "currentValue": "40", "targetValue": "80", "icon": "kpi-empl-bo-empl-b1-c1-l2.png", "children": []}]}, {"id": "bo-empl-b1-c2", "name": "Teleconsultation module attach rate", "description": "Share of customer organisations that have activated the integrated secure teleconsultation for employees.", "unit": "%", "currentValue": "20", "targetValue": "55", "icon": "kpi-empl-bo-empl-b1-c2.png", "children": [{"id": "bo-empl-b1-c2-l1", "name": "Teleconsultations per 1,000 employees per year", "description": "Number of teleconsultation sessions held per thousand employees per year across teleconsultation customers.", "unit": "sessions per 1,000 employees per year", "currentValue": "25", "targetValue": "80", "icon": "kpi-empl-bo-empl-b1-c2-l1.png", "children": []}, {"id": "bo-empl-b1-c2-l2", "name": "Teleconsultation customers live", "description": "Number of customer organisations with teleconsultation in production use.", "unit": "customers", "currentValue": "30", "targetValue": "85", "icon": "kpi-empl-bo-empl-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-empl-b2", "name": "Cost to serve and expansion", "description": "Whether self-service lowers the cost of every visit for the customer and Kitry, and whether portals drive renewals and upsell.", "currentValue": "60", "icon": "kpi-empl-bo-empl-b2.png", "children": [{"id": "bo-empl-b2-c1", "name": "Secretariat cost per visit", "description": "Modeled cost of medical secretariat time per scheduled visit at customers, the saving self-service delivers and the argument for the portal subscription.", "unit": "EUR per visit", "currentValue": "9", "targetValue": "4", "icon": "kpi-empl-bo-empl-b2-c1.png", "children": [{"id": "bo-empl-b2-c1-l1", "name": "Secretariat minutes per booking", "description": "Average minutes of secretariat time spent per booking or change, across portal and phone channels.", "unit": "minutes", "currentValue": "6", "targetValue": "2", "icon": "kpi-empl-bo-empl-b2-c1-l1.png", "children": []}, {"id": "bo-empl-b2-c1-l2", "name": "Reminder messages per visit", "description": "Average SMS and e-mail reminders sent per visit through the notification partners, a cost and a no-show lever.", "unit": "messages per visit", "currentValue": "2.4", "targetValue": "2.0", "icon": "kpi-empl-bo-empl-b2-c1-l2.png", "children": []}]}, {"id": "bo-empl-b2-c2", "name": "Portal customer net revenue retention", "description": "Subscription revenue this year from last year's portal customers, including added modules and workforce growth, as a share of last year's revenue from the same customers.", "unit": "%", "currentValue": "105", "targetValue": "115", "icon": "kpi-empl-bo-empl-b2-c2.png", "children": [{"id": "bo-empl-b2-c2-l1", "name": "Portal customer renewal rate", "description": "Share of customers with the portal module that renew their subscription at term.", "unit": "%", "currentValue": "94", "targetValue": "98", "icon": "kpi-empl-bo-empl-b2-c2-l1.png", "children": []}, {"id": "bo-empl-b2-c2-l2", "name": "Teleconsultation upsells per year", "description": "Number of existing portal customers that add teleconsultation in the year.", "unit": "upsells per year", "currentValue": "10", "targetValue": "25", "icon": "kpi-empl-bo-empl-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Give every employee of every customer a private, trusted place for their occupational health: visits booked around their life, questionnaires answered honestly because nobody at work can read them, documents at hand, teleconsultations that spare a day of travel, and safety concerns that are visibly acted on.", "timeHorizons": {"year1": {"focus": "Make the portal the default channel for visits at every customer: self-service booking and rescheduling, SMS and e-mail reminders, pre-visit questionnaires, teleconsultation as a standard module and safety reporting from the phone, with a privacy experience that earns trust in the first session.", "productTheme": "Self-service visits people trust", "customerKPI": {"northStar": "Visit self-service rate", "supporting": ["Appointment rescheduling effort", "Employees with an activated portal account"]}, "businessKPI": {"northStar": "Portal module attach rate", "revenueStreams": ["Employee and Manager Portals module subscriptions", "Integrated teleconsultation module subscriptions", "SMS and notification volumes"], "supporting": ["Portal-enabled workforce", "Teleconsultation module attach rate"]}, "milestones": ["Ship teleconsultation and the manager portal as standard modules with the employee portal in every new subscription", "Release a mobile-first booking, rescheduling and reminder flow with SSO through the employer's identity provider", "Redesign account activation and the privacy notice in French, Dutch and English so that most invited employees activate within the first month"]}, "year3": {"focus": "Make the portal the employee's occupational health record and voice: documents, consents, campaigns and file transfers between services, hazardous situation reporting with feedback to the reporter, and portal adoption above three quarters of visits at every customer in France, Benelux and the Netherlands.", "productTheme": "The employee's health record and voice", "customerKPI": {"northStar": "Visit self-service rate", "supporting": ["Safety report response time", "Questionnaire completed before visit rate"]}, "businessKPI": {"northStar": "Portal customer net revenue retention", "revenueStreams": ["Portal and teleconsultation subscriptions sized on workforce", "Health campaign and vaccination modules", "Dutch market portal packages with arbodienst integration"], "supporting": ["Teleconsultations per 1,000 employees per year", "Portal customer renewal rate"]}, "milestones": ["Deliver employee document access, consent management and file transfer requests aligned with the French DMST interoperability rules", "Close the loop on employee safety reports with assignment, status and closure feedback visible to the reporter", "Launch the portal in Dutch for the Netherlands with the local arbodienst and identity conventions"]}, "year5": {"focus": "A continuous, personal relationship with the occupational health service: proactive prompts when exposure or life events change what is due, assisted triage of employee questions under physician supervision, interoperable files that follow the employee across employers and countries, and prevention content tailored to the workstation.", "productTheme": "Continuous personal prevention", "customerKPI": {"northStar": "Visit self-service rate", "supporting": ["Employee trust in confidentiality", "Teleconsultation share of eligible visits"]}, "businessKPI": {"northStar": "Portal module attach rate", "revenueStreams": ["Workforce-sized platform subscriptions including portals", "Teleconsultation and telehealth partner services", "Personal prevention and campaign content subscriptions"], "supporting": ["Secretariat cost per visit", "Teleconsultation upsells per year"]}, "milestones": ["Prompt employees proactively when a workstation change, exposure or absence changes their surveillance, with one-tap booking", "Offer assisted triage of employee health and safety questions reviewed by the nurse or physician before any answer", "Support interoperable transfer of the employee's occupational medical file across services and countries under employee consent"]}}}, "domain": "HR and Employees"}, {"id": "kimp", "name": "Kitry Implementation and Customer Success Consultant", "description": "Works in Kitry's services team in Nivelles or on customer sites in France, Belgium, Luxembourg and the Netherlands and operates the same platform the customers license, from the inside. Typically joins from an external prevention service, a hospital occupational health service, an HRIS or ERP implementation practice or a nursing background, and combines occupational health knowledge with configuration and data skills. Runs the four-phase implementation for new customers, ministries, hospital groups, industrial networks, universities, banks and transport operators, from functional assessment through configuration and project management to training, and leads the migration of decades of medical files and accident history from legacy systems; after go-live keeps a portfolio of customers current with regulatory content and product releases on the standard release train, resolves support requests as the dedicated account manager and escalation point, and turns observed needs into module, portal, hosting-tier and country expansions. Under the Kitry as a Service transition backed by Vortex, is judged on go-lives delivered on schedule and on budget, migration quality accepted by the customer's physicians, release-induced incidents, service levels and the growth and retention of the accounts in the portfolio.", "icon": "customer-kimp-portrait.jpg", "careAbout": ["A functional assessment that captures the customer's countries, sites, surveillance rules, forms and integrations completely before configuration starts, because every gap found later is a change request at fixed price", "Migrating decades of medical files, exposures and accident history so that the customer's physicians accept the data as their own file, with reconciliation counts instead of hope", "A configuration built from sector pre-configurations and country regulation content, so that deviations are documented exceptions rather than the whole project", "Every customer on the current release with the regulatory content in force, informed before a change and never surprised on a consultation day", "Support requests resolved inside service levels by someone who knows the customer's configuration, and key users who stay self-sufficient", "Account reviews that show adoption and outcomes on the customer's own dashboards and end in an expansion or a secured renewal"], "winsThem": ["An implementation and migration workspace that holds every project's four phases, checklists, configuration workbook, dry-run reconciliations, training plan and closure report, so a consultant runs three projects and a colleague can take one over in a day", "A migration toolkit built from dozens of legacy occupational health systems, Access databases and Excel archives, so a new legacy system is a mapping exercise rather than a research project", "Sector pre-configurations and country regulation content for France, Belgium, Luxembourg and the Netherlands maintained by the regulatory content team, so the consultant validates rather than rebuilds", "A standard release train for shared and dedicated HDS SaaS with per-customer impact assessment, automated configuration checks, pre-production tenants and hypercare, so releases stop being bespoke work per customer", "Adoption and outcome dashboards per customer, service-level tracking and an account plan in one place, so the consultant walks into every review with the customer's own numbers"], "theirFear": ["A go-live slipping past the contracted date because the legacy data turned out to be worse than assessed, with the customer's physicians refusing the migrated files and the fixed-price budget gone", "A release or regulatory update breaking a customer's custom form or workflow on a consultation day, and the customer concluding that the SaaS transition made them less safe than the old bespoke version", "Being the only person who understands a customer's configuration, so that holidays, sickness or a departure turn into a customer escalation to the CEO"], "jobsToBeDone": [{"id": "jtbd-kimp-1", "name": "Take a new organisation live with its data, configuration and trained users on schedule", "whatItIs": "Run Kitry's four-phase implementation for a new customer, a ministry, a hospital group, an industrial site network or a bank, from contract to go-live: the functional assessment that maps the customer's surveillance rules, sites, roles and forms per country; the configuration of the tenant, workflows, forms, business rules and languages; the project management that keeps the customer's medical service, HSE, HR, IT and works council aligned; the migration of decades of medical files, exposures and accident history from legacy systems; and the training and change management that turn licensed users into daily users, all within the contracted date and the fixed-price budget.", "outcome": "The customer is live on the contracted date with a configuration that matches its surveillance obligations, migrated data the physicians accept as their file, HRIS and SSO connected, users trained and using the portals, and a project that closed inside its budget so that Kitry's services margin and the customer's confidence are both intact.", "steps": [{"step": "Run the functional assessment and freeze the scope", "description": "Interview the occupational health service manager, physicians, nurses, HSE, HR and IT, inventory the countries, sites, surveillance categories, forms, reports and integrations, compare them with Kitry's standard configuration and sector pre-configuration, and document the gaps, decisions and out-of-scope items in the assessment report the customer signs before configuration starts.", "streamsNeeded": [{"id": "deploy-migrate-and-train-a-customer", "name": "Deploy, migrate and train a customer", "howItSupports": "Structures the functional assessment with checklists per module and country and records scope decisions in the implementation project."}, {"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Provides the standard surveillance rules and periodicities per country that the assessment compares the customer's practice against."}]}, {"step": "Configure the tenant, rules, forms and roles", "description": "Set up the tenant on shared or dedicated HDS SaaS hosting, load the country regulation content, configure organisation structure, surveillance rules, examination types, questionnaires, fitness opinion templates, risk assessment structure, accident forms, roles and access segregation, languages and notification templates, reusing the sector pre-configuration and documenting every deviation.", "streamsNeeded": [{"id": "deploy-migrate-and-train-a-customer", "name": "Deploy, migrate and train a customer", "howItSupports": "Tracks configuration tasks against the assessment and holds the configuration workbook and sign-offs."}, {"id": "maintain-workforce-and-exposure-data", "name": "Maintain workforce and exposure data", "howItSupports": "Receives the organisation, sites, workstations and exposure profiles the consultant configures as the customer's master data."}]}, {"step": "Migrate legacy medical files, exposures and history", "description": "Extract data from the legacy occupational health system, Access databases, Excel and paper archives, map it to the platform's model, run migration dry runs with reconciliation counts and sample checks by the physicians, correct mappings, and perform the final migration with a signed acceptance, preserving the medical file history and retention obligations.", "streamsNeeded": [{"id": "deploy-migrate-and-train-a-customer", "name": "Deploy, migrate and train a customer", "howItSupports": "Provides the migration toolkit, dry-run cycles, reconciliation reports and acceptance records."}, {"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Receives the migrated medical files with their history, documents and access rules intact."}]}, {"step": "Connect the HRIS, SSO, devices and partners", "description": "Set up the HRIS synchronisation, SSO with the customer's identity provider, the measurement devices in the medical service, e-signature, SMS and teleconsultation partners, and national reporting connectors, and test each end to end with the customer's IT and the vendors.", "streamsNeeded": [{"id": "integrate-with-hr-devices-and-ecosystem", "name": "Integrate with HR, devices and the ecosystem", "howItSupports": "Provides the connectors and the integration test procedures for HRIS, SSO, devices, e-signature, SMS, telehealth and national portals."}, {"id": "deploy-migrate-and-train-a-customer", "name": "Deploy, migrate and train a customer", "howItSupports": "Schedules the integration work within the project plan and records test evidence."}]}, {"step": "Train users and manage the change to go-live", "description": "Deliver role-based training for physicians, nurses, HSE, HR and managers, prepare the employee portal communication with the customer, run the go-live rehearsal, support the first consultation days on site or remotely, and hand over to the account manager with the open items and the adoption plan.", "streamsNeeded": [{"id": "deploy-migrate-and-train-a-customer", "name": "Deploy, migrate and train a customer", "howItSupports": "Plans and records training sessions, attendance, go-live checklist and hypercare."}, {"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Provides the portal rollout and invitation flows the consultant configures with the customer's communication."}]}, {"step": "Close the project against plan and budget", "description": "Compare consultant days, milestones and change requests with the contract, close the implementation project with the customer's sign-off, record lessons for the sector pre-configuration and the migration toolkit, and report project margin to the services lead.", "streamsNeeded": [{"id": "deploy-migrate-and-train-a-customer", "name": "Deploy, migrate and train a customer", "howItSupports": "Holds planned versus actual days, milestones and change requests per project and produces the closure report."}, {"id": "monitor-health-and-safety-performance", "name": "Monitor health and safety performance", "howItSupports": "Provides the first dashboards the customer uses to confirm surveillance and data completeness after go-live."}]}], "media": [{"type": "image", "src": "media/jbtd-kimp-jtbd-kimp-1.png", "title": "Kitry Implementation and Customer Success Consultant JTBD infographic: Take a new organisation live with its data, configuration and trained users on schedule", "alt": "Enterprise infographic for the job \"Take a new organisation live with its data, configuration and trained users on schedule\" for customer \"Kitry Implementation and Customer Success Consultant\"."}]}, {"id": "jtbd-kimp-2", "name": "Keep every customer current with regulatory and product change without disruption", "whatItIs": "Make sure the 150-plus customer organisations on shared and dedicated HDS SaaS receive every regulatory update (a new DMST decree in France, a change to the prevention passport, a new Fedris or insurer form in Belgium, a Dutch or Luxembourg rule change) and every product release on the standard release train, with the customer-specific configuration preserved, tested and explained, so that a physician or an HR administrator never discovers a changed form or a broken workflow on a consultation day.", "outcome": "Every customer runs a supported, current version with the regulatory content in force in its countries, release notes and configuration impact assessments arrive before the change, customer-specific configurations survive each release, and the number of incidents caused by a release trends towards zero.", "steps": [{"step": "Translate regulatory change into platform content and configuration", "description": "Work with the regulatory content team to turn a published decree, form or rule change into surveillance rules, forms, reports and workflow changes in the country regulation content, and identify which customers and which of their custom configurations are affected.", "streamsNeeded": [{"id": "deploy-migrate-and-train-a-customer", "name": "Deploy, migrate and train a customer", "howItSupports": "Tracks regulatory change items with their effective date and the affected customers and configurations."}, {"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Carries the updated surveillance rules and periodicities that the regulatory change modifies."}]}, {"step": "Assess the impact of a release on each customer's configuration", "description": "Review the release notes against each customer's configuration workbook, run the automated configuration checks on the pre-production tenant, list the customers with custom forms, rules or integrations that need a manual test, and plan the release wave accordingly.", "streamsNeeded": [{"id": "deploy-migrate-and-train-a-customer", "name": "Deploy, migrate and train a customer", "howItSupports": "Provides the per-customer configuration inventory and the impact assessment checklist for each release."}, {"id": "integrate-with-hr-devices-and-ecosystem", "name": "Integrate with HR, devices and the ecosystem", "howItSupports": "Exposes which connectors and hosting environments the release touches so integration tests are scheduled."}]}, {"step": "Test, communicate and roll out on the release train", "description": "Validate the release on the shared pre-production tenant and on the dedicated tenants that require it, send customers the release notes with the regulatory items highlighted and the actions expected from them, roll out in waves by hosting tier and country, and stay on hypercare during the first days.", "streamsNeeded": [{"id": "deploy-migrate-and-train-a-customer", "name": "Deploy, migrate and train a customer", "howItSupports": "Schedules release waves, customer communication and hypercare per customer."}, {"id": "monitor-health-and-safety-performance", "name": "Monitor health and safety performance", "howItSupports": "Supplies post-release dashboards that confirm convocations, examinations and declarations continue at expected volumes."}]}, {"step": "Update forms, reports and training material with the customer", "description": "Adjust the customer's fitness opinion templates, national forms, annual report layouts and questionnaires to the new rules, brief the key users, refresh training material and record the customer's acceptance of the regulatory update.", "streamsNeeded": [{"id": "deploy-migrate-and-train-a-customer", "name": "Deploy, migrate and train a customer", "howItSupports": "Records the customer-specific configuration changes and training refreshers per regulatory update."}, {"id": "declare-and-analyse-accidents-and-occupational-diseases", "name": "Declare and analyse accidents and occupational diseases", "howItSupports": "Provides the updated national declaration forms the consultant validates with HR at each customer."}]}, {"step": "Learn from release incidents and feed the product", "description": "Analyse every incident caused by a release or a regulatory update, distinguish product defects from configuration drift, feed the findings to the product teams and the configuration checks, and adjust the sector pre-configurations so that the next release is quieter.", "streamsNeeded": [{"id": "deploy-migrate-and-train-a-customer", "name": "Deploy, migrate and train a customer", "howItSupports": "Links incidents to releases and configuration items and tracks the follow-up actions."}, {"id": "integrate-with-hr-devices-and-ecosystem", "name": "Integrate with HR, devices and the ecosystem", "howItSupports": "Provides the hosting and tenant isolation view needed to trace an incident to a shared or dedicated environment."}]}], "media": [{"type": "image", "src": "media/jbtd-kimp-jtbd-kimp-2.png", "title": "Kitry Implementation and Customer Success Consultant JTBD infographic: Keep every customer current with regulatory and product change without disruption", "alt": "Enterprise infographic for the job \"Keep every customer current with regulatory and product change without disruption\" for customer \"Kitry Implementation and Customer Success Consultant\"."}]}, {"id": "jtbd-kimp-3", "name": "Resolve support requests and grow the account", "whatItIs": "Act as the dedicated account manager and support escalation for a portfolio of customers: resolve the questions and incidents raised by physicians, nurses, HSE managers and HR administrators within the agreed service levels, distinguish configuration questions from product defects, keep the customer's key users capable, run periodic account reviews on adoption and outcomes, and turn observed needs (portals, teleconsultation, analytics, the safety module, a new country) into expansion of the subscription.", "outcome": "Customers get answers and fixes inside the service-level targets from someone who knows their configuration, key users stay self-sufficient, adoption of the modules they pay for is visible and improving, and every account review ends with a plan that grows the subscription or at least secures the renewal.", "steps": [{"step": "Triage and resolve tickets within service levels", "description": "Take the tickets raised by customer key users, reproduce them on the customer's tenant, resolve configuration and usage questions directly, route product defects to the engineering teams with a clear reproduction, and keep the customer informed until closure.", "streamsNeeded": [{"id": "deploy-migrate-and-train-a-customer", "name": "Deploy, migrate and train a customer", "howItSupports": "Provides the support ticketing, service-level tracking and knowledge base for the consultant."}, {"id": "integrate-with-hr-devices-and-ecosystem", "name": "Integrate with HR, devices and the ecosystem", "howItSupports": "Supplies the connector and hosting diagnostics needed for integration and access incidents."}]}, {"step": "Keep key users self-sufficient", "description": "Train new key users when staff changes, maintain the customer's configuration documentation, run refresher sessions after releases, and publish how-to content so that routine questions are answered without a ticket.", "streamsNeeded": [{"id": "deploy-migrate-and-train-a-customer", "name": "Deploy, migrate and train a customer", "howItSupports": "Records key users, training history and configuration documentation per customer."}, {"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Provides the portal and manager-side features on which most usage questions arise."}]}, {"step": "Review adoption and outcomes with the customer", "description": "Prepare account reviews with the customer's own dashboards on surveillance compliance, self-service rate, accident declaration timeliness and module usage, compare with the objectives set at go-live and with peers in the same sector, and agree the actions on both sides.", "streamsNeeded": [{"id": "monitor-health-and-safety-performance", "name": "Monitor health and safety performance", "howItSupports": "Provides the adoption and outcome dashboards the consultant presents in account reviews."}, {"id": "deploy-migrate-and-train-a-customer", "name": "Deploy, migrate and train a customer", "howItSupports": "Holds the account plan, review notes and agreed actions per customer."}]}, {"step": "Turn needs into expansion and renewal", "description": "Identify unmet needs observed in tickets and reviews, propose the relevant module, connector, hosting tier or country extension with a business case, coordinate the demonstration and the implementation estimate with sales and the product teams, and secure the renewal before the term.", "streamsNeeded": [{"id": "deploy-migrate-and-train-a-customer", "name": "Deploy, migrate and train a customer", "howItSupports": "Tracks expansion opportunities, renewal dates and the resulting implementation estimates in the account plan."}, {"id": "assess-and-control-workplace-risks", "name": "Assess and control workplace risks", "howItSupports": "Provides the safety module capabilities most often proposed as the first expansion to occupational health customers."}]}], "media": [{"type": "image", "src": "media/jbtd-kimp-jtbd-kimp-3.png", "title": "Kitry Implementation and Customer Success Consultant JTBD infographic: Resolve support requests and grow the account", "alt": "Enterprise infographic for the job \"Resolve support requests and grow the account\" for customer \"Kitry Implementation and Customer Success Consultant\"."}]}], "customerJourneyStories": [{"id": "journey-kimp-1", "name": "Joining the services team and adopting the implementation workspace", "linkedJobIds": ["jtbd-kimp-1", "jtbd-kimp-3"], "summary": "A consultant who joins Kitry from a Belgian external prevention service takes on her first implementation, a French hospital group, and moves from personal spreadsheets and shared drives to the implementation and migration workspace that Kitry built for the Kitry as a Service model.", "stages": [{"stage": "Trigger", "narrative": "In her first weeks the new consultant inherits a running project with the plan in one colleague's spreadsheet, migration mappings in another's e-mail, and training attendance on paper, and cannot tell the customer's project sponsor what is on track. A senior colleague's departure has just shown the services lead that projects lived in people's heads, exactly what the move to a standard SaaS delivery model cannot afford."}, {"stage": "Discovery", "narrative": "During onboarding the services lead walks her through the implementation and migration workspace on the platform: every project with its four phases, assessment checklists per module and country, configuration workbook, migration dry-run cycles with reconciliation counts, training plan and closure report, alongside the sector pre-configurations and the migration toolkit built from dozens of legacy systems. She recognises the discipline of her old prevention service, but for once tooled."}, {"stage": "Evaluation", "narrative": "She doubts that a public hospital group with its own forms and forty years of paper and Access files will fit a templated plan, and that the physicians will trust migrated files they did not check themselves. Seeing the closure reports of two comparable projects, the dry-run reconciliation reports the physicians signed, and the fact that deviations from the standard are documented rather than forbidden convinces her to run her project in the workspace from the assessment onwards."}, {"stage": "Trial", "narrative": "The hospital group's implementation is her first project run entirely in the workspace: the assessment report is generated from the checklists, three migration dry runs bring the medical file defect rate from several percent to well under one before the physicians sign the acceptance, the HRIS and SSO tests are logged, and training attendance is recorded per role. The project sponsor reads the same milestones she does and stops asking for status e-mails."}, {"stage": "Engagement", "narrative": "She runs three projects in parallel in the workspace, reuses the healthcare pre-configuration for a second hospital group, and hands over each go-live to the account manager with the open items and adoption plan in one place. The services lead plans consultant capacity from the workspace and the migration toolkit gains a new legacy-system mapping from each of her projects."}, {"stage": "Retention", "narrative": "When a colleague goes on leave in the middle of a Luxembourg public-sector project, she picks it up from the workspace in a day. She contributes to the implementation playbook, mentors the next new consultant, and points at her on-schedule go-lives when the services team's margin is reviewed; going back to spreadsheets is no longer imaginable."}], "media": [{"type": "image", "src": "media/journey-kimp-kimp-1.png", "title": "Kitry Implementation and Customer Success Consultant customer journey: Joining the services team and adopting the implementation workspace", "alt": "Enterprise journey storyboard for \"Joining the services team and adopting the implementation workspace\" for customer \"Kitry Implementation and Customer Success Consultant\"."}]}, {"id": "journey-kimp-2", "name": "From bespoke customer updates to the standard release train", "linkedJobIds": ["jtbd-kimp-2", "jtbd-kimp-3"], "summary": "A senior Kitry consultant who used to maintain his own customers' versions by hand adopts the standard release process and regulatory update workflow introduced under the Kitry as a Service transition backed by Vortex, and ends up shipping a DMST-related regulatory change to all his customers in one wave.", "stages": [{"stage": "Trigger", "narrative": "A decree changing the content of the occupational medical file in France has to reach every French customer before its effective date, and the consultant realises that his eleven customers run on slightly different configurations he updated one by one over the years; two of them discovered the previous update through a changed form on a consultation day. Under the new strategy, the company has committed to shared and dedicated SaaS with one release train, and bespoke updating has to end."}, {"stage": "Discovery", "narrative": "The product and services leads present the release process: a standard release train with pre-production tenants, an impact assessment per customer generated from the configuration inventory, release notes with regulatory items highlighted, release waves by hosting tier and country, and hypercare tracked in the workspace. The regulatory content team shows how a decree becomes country regulation content that the consultants validate rather than rebuild."}, {"stage": "Evaluation", "narrative": "The consultant fears losing the personal control that kept his customers calm, and that a shared release will break a custom accident form at one customer. The automated configuration checks that flag his customers' custom forms, the option to schedule a dedicated-tenant customer in a later wave, and the fact that release incidents will be counted per release rather than per consultant persuade him to trust the process for the first wave."}, {"stage": "Trial", "narrative": "The next release goes through the process with his customers: the impact assessment lists the two customers with custom forms, he tests them on pre-production, sends release notes to his key users a week ahead, and rolls out in two waves. One custom report needs a fix, which is caught before go-live rather than on a consultation day, and the post-release dashboards show convocations and examinations running at normal volumes."}, {"stage": "Engagement", "narrative": "The regulatory update on the medical file goes out to all French customers in one coordinated wave with updated templates and a refresher for key users, and the consultant spends the freed time on account reviews, where he proposes the safety module and teleconsultation to customers that only use occupational health. His Belgian customers receive the new Fedris forms the same way."}, {"stage": "Retention", "narrative": "A year later his customers are all on the current version, release-induced incidents are rare enough to be discussed individually, and he uses the release calendar as a selling point with prospects who ask how Kitry keeps them compliant. He is the consultant the regulatory content team asks to review new country content before it ships."}], "media": [{"type": "image", "src": "media/journey-kimp-kimp-2.png", "title": "Kitry Implementation and Customer Success Consultant customer journey: From bespoke customer updates to the standard release train", "alt": "Enterprise journey storyboard for \"From bespoke customer updates to the standard release train\" for customer \"Kitry Implementation and Customer Success Consultant\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-kimp-top", "name": "Go-live on schedule rate", "description": "Share of implementation projects that go live on the date contracted at signing, without a re-baselined plan. Modeled seed value for a services team implementing regulated vertical SaaS at large organisations, not an official Kitry figure.", "unit": "%", "currentValue": "70", "targetValue": "90", "link": "https://dashboard.example.com/occupational-health-and-safety-platform/customers/kimp/kpis/co-kimp-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-kimp-co-kimp-top.png"}, "branches": [{"id": "co-kimp-b1", "name": "Implementation predictability", "description": "Whether the four-phase implementation runs to plan and whether migrated data is right the first time.", "currentValue": "66", "icon": "kpi-kimp-co-kimp-b1.png", "children": [{"id": "co-kimp-b1-c1", "name": "Implementation lead time", "description": "Weeks from contract signature to go-live for a standard multi-site implementation with migration and HRIS connection.", "unit": "weeks", "currentValue": "26", "targetValue": "18", "icon": "kpi-kimp-co-kimp-b1-c1.png", "children": [{"id":  account management cost per customer organisation across all modules. Modeled seed value, not a reported Kitry figure.", "unit": "EUR per customer per year", "currentValue": "9000", "targetValue": "6000", "icon": "kpi-kimp-bo-kimp-b2-c2.png", "children": [{"id": "bo-kimp-b2-c2-l1", "name": "Support tickets per customer per month", "description": "Average number of support tickets raised per customer organisation per month.", "unit": "tickets per customer per month", "currentValue": "4.5", "targetValue": "2.5", "icon": "kpi-kimp-bo-kimp-b2-c2-l1.png", "children": []}, {"id": "bo-kimp-b2-c2-l2", "name": "Release-induced tickets share", "description": "Share of support tickets in the month after a release that are attributed to that release.", "unit": "%", "currentValue": "22", "targetValue": "8", "icon": "kpi-kimp-bo-kimp-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make Kitry's own consultants the most leveraged occupational health implementers in Europe: the platform carries the four-phase method, the sector pre-configurations, the migration toolkit and the release train, so a consultant takes demanding organisations live on schedule, keeps every customer current without disruption and spends the rest of the time growing the account.", "timeHorizons": {"year1": {"focus": "Complete the Kitry as a Service transition on the services side: every implementation run in the implementation and migration workspace with planned days and milestones, one standard release train for shared and dedicated HDS SaaS with per-customer impact assessment, and regulatory content for France, Belgium, Luxembourg and the Netherlands delivered as releases rather than bespoke updates.", "productTheme": "Workspace and release train for Kitry as a Service", "customerKPI": {"northStar": "Go-live on schedule rate", "supporting": ["Data migration defect rate", "Release-induced incidents per release"]}, "businessKPI": {"northStar": "Services gross margin", "revenueStreams"
