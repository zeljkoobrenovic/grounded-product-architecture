: "400", "targetValue": "1200", "icon": "kpi-ohsm-bo-ohsm-b2-c1-l2.png", "children": []}]}, {"id": "bo-ohsm-b2-c2", "name": "Multi-year contract renewal rate", "description": "Share of multi-year subscriptions and framework agreements renewed at term.", "unit": "%", "currentValue": "92", "targetValue": "97", "icon": "kpi-ohsm-bo-ohsm-b2-c2.png", "children": [{"id": "bo-ohsm-b2-c2-l1", "name": "Customer satisfaction score at renewal", "description": "Average satisfaction score given by the service head at the renewal review.", "unit": "score out of 10", "currentValue": "7.6", "targetValue": "8.8", "icon": "kpi-ohsm-bo-ohsm-b2-c2-l1.png", "children": []}, {"id": "bo-ohsm-b2-c2-l2", "name": "Account manager coverage", "description": "Share of customer organisations with a named dedicated account manager and an annual review held.", "unit": "%", "currentValue": "80", "targetValue": "100", "icon": "kpi-ohsm-bo-ohsm-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Let the head of an internal occupational health service steer coverage, capacity and proof for tens of thousands of workers from one certified platform, hosted and kept current by Kitry, so the service is run as a service and not as an IT project.", "timeHorizons": {"year1": {"focus": "Complete the 'Kitry as a Service' transition for service heads: shared and dedicated HDS SaaS as the only deployment models, a standard release train with FR/BE/LU/NL regulatory content, SSO and HRIS connectors in every implementation, and coverage and capacity dashboards that replace the site-by-site reconstruction.", "productTheme": "Certified SaaS with steerable coverage", "customerKPI": {"northStar": "Workforce surveillance coverage rate", "supporting": ["Medical capacity utilisation", "Annual activity report preparation time"]}, "businessKPI": {"northStar": "Customer organisations on HDS SaaS hosting", "revenueStreams": ["Module subscriptions per workforce size", "Shared and dedicated HDS SaaS hosting", "Implementation, migration and training services"], "supporting": ["Share of customers on shared or dedicated HDS SaaS", "Standard release adoption within 90 days"]}, "milestones": ["Migrate the remaining on-premise and customer-hosted organisations to shared or dedicated HDS SaaS with a standard migration package", "Ship the coverage and capacity dashboard per site, physician and surveillance category as standard in the Occupational Health module", "Deliver SSO and HRIS connectors for the common identity providers and HR systems as part of the configuration phase of every implementation"]}, "year3": {"focus": "The reference platform for internal services in Benelux and France: annual reports and agr\u00e9ment files generated from cross-module data, ISO 45001-ready evidence, sector pre-configurations that shorten deployment, the Netherlands as a full market with arbodienst partners working in customer tenants, and analytics that make coverage and accident rates steerable.", "productTheme": "Proof generated, deployment pre-configured", "customerKPI": {"northStar": "Workforce surveillance coverage rate", "supporting": ["Overdue examinations backlog", "Audit findings on service records"]}, "businessKPI": {"northStar": "Customer organisations on HDS SaaS hosting", "revenueStreams": ["Analytics and Portal module subscriptions", "Dedicated HDS SaaS hosting", "Sector pre-configuration and partner services"], "supporting": ["Analytics module attach rate", "Dedicated HDS tenant attach rate"]}, "milestones": ["Generate the French annual report, the fiche d'entreprise and the Belgian annual report of the internal service from cross-module data in the national formats", "Release sector pre-configurations for industry, chemicals and pharma, healthcare, universities, public sector, finance, transport and services that cut the configuration phase in half", "Open customer tenants to external prevention services and Dutch arbodiensten under data processing agreements so coverage is visible for the whole workforce"]}, "year5": {"focus": "Continuous, data-driven prevention at European scale: coverage and capacity that update as HR and field events flow in, predictive backlog and capacity signals, interoperable files across services and countries, and a partner ecosystem that makes the platform the operating system of the employer's prevention function.", "productTheme": "The operating system of workplace prevention", "customerKPI": {"northStar": "Workforce surveillance coverage rate", "supporting": ["Nurse-delegated visits share", "Report data assembled automatically from modules"]}, "businessKPI": {"northStar": "Customer organisations on HDS SaaS hosting", "revenueStreams": ["European enterprise subscriptions", "Partner ecosystem and interoperability services", "Continuous monitoring add-ons"], "supporting": ["Multi-year contract renewal rate", "Customer satisfaction score at renewal"]}, "milestones": ["Provide predictive coverage and capacity signals that flag a site's backlog before it breaches the legal periodicity", "Deliver interoperable medical files across internal and external services and across FR, BE, LU and NL under the national exchange standards", "Run a certified partner programme for devices, telehealth and external prevention services working inside customer tenants"]}}}, "domain": "Occupational Health Services"}, {"id": "hsem", "name": "HSE Manager / Prevention Adviser", "description": "Runs the prevention function of a large employer with several sites in France, Belgium, Luxembourg or the Netherlands: a pr\u00e9venteur or responsable HSE in France, a conseiller en pr\u00e9vention or preventieadviseur (often level 1 or 2) heading the internal prevention service in Belgium. Owns the statutory risk assessment (DUERP and plan d'actions, or the global prevention plan and annual action plan of the dynamic risk management system), the inspection and audit programme, the chemical inventory and CMR follow-up, the action register and, increasingly, the ISO 45001 management system. Works with the occupational physician on collective prevention, with HR on accident declarations and with site managers on corrective actions, and answers to the labour inspection, the CSSCT or CPPT and the certification body. Typically an engineer or safety professional with ten years in industry, measured on whether the assessment is current, the actions close and the accident rate falls, and judged in public by every inspection.", "icon": "customer-hsem-portrait.jpg", "careAbout": ["A risk assessment built on the same workstation and exposure register the occupational physician uses, so a workstation is rated once and both prevention and surveillance follow from it", "A DUERP or global prevention plan that is versioned, dated and exportable at any moment, with the history the regulation requires, instead of a spreadsheet rebuilt for each inspection", "Hazardous situations that reach the prevention service from the floor with a photo and a location, and corrective actions that are owned by a manager and closed with evidence", "A chemical inventory with current safety data sheets and CLP classification that tells exactly which workers at which workstations are exposed to CMR agents", "Inspection, audit and action data that produce the committee reports, the annual prevention report and the ISO 45001 evidence without a data-gathering exercise", "Accident and occupational disease analyses that flow back into the assessment of the affected workstation rather than into a separate report"], "winsThem": ["Risk assessment per workstation and site on the shared workforce and exposure register, with DUERP, global prevention plan and annual action plan exports in the country format", "Hazardous situation reporting from the employee and manager portals and inspection checklists on tablets that create actions in one register with reminders and escalation", "Chemical product inventory with safety data sheets, hazard classification, exposure groups and CMR tracking that triggers the physician's reinforced surveillance automatically", "ISO 45001 support with audit programmes, non-conformities and management review dashboards built from the same data", "Kitry consultants who migrate the legacy assessment and inventory, configure hazard catalogues and rating matrices per sector, and keep the French and Belgian regulatory templates current"], "theirFear": ["A labour inspector or certification auditor asks for the current risk assessment of a workstation and the answer is a spreadsheet nobody can date", "A worker develops an occupational disease from a CMR agent that was in use at a workstation the inventory never linked to a person", "The action list grows faster than it closes, a known hazardous situation causes a serious accident, and the prevention adviser's own liability is examined"], "jobsToBeDone": [{"id": "jtbd-hsem-1", "name": "Maintain a living risk assessment per workstation and site", "whatItIs": "Keep the employer's statutory risk assessment current and usable: the DUERP and its plan d'actions in France, the global prevention plan and annual action plan of the dynamic risk management system in Belgium. The assessment must be built per site, work unit and workstation on the same workstation and exposure register that the occupational physician uses, updated when a workstation, process, chemical, accident or inspection finding changes it, reviewed at least annually with the CSSCT or CPPT, and producible at any moment for the labour inspection, the works council or an ISO 45001 auditor. The job is to stop the assessment being a document rebuilt once a year and make it the register from which prevention work is planned.", "outcome": "Every workstation has a risk assessment that is linked to its exposure profile, was reviewed within the last twelve months or within thirty days of a change event, carries prevention measures with an owner and a date, and can be exported as a dated DUERP version or global prevention plan without rework.", "steps": [{"step": "Build the assessment on the shared workstation and exposure register", "description": "Take the sites, work units and workstations synchronised from the HRIS, attach the exposure and risk profiles already defined for medical surveillance (night work, noise, chemical and biological agents, manual handling, safety-critical posts) and create the risk assessment units on that structure, so the prevention adviser and the physician reason about the same workstation rather than two lists.", "streamsNeeded": [{"id": "maintain-workforce-and-exposure-data", "name": "Maintain workforce and exposure data", "howItSupports": "Provides the site, work unit and workstation structure and the exposure profiles that the risk assessment units are attached to."}, {"id": "assess-and-control-workplace-risks", "name": "Assess and control workplace risks", "howItSupports": "Creates the risk assessment per workstation and site on top of that register, with the country template for DUERP or global prevention plan."}]}, {"step": "Identify hazards and rate risks per workstation", "description": "Walk each workstation with the supervisor and a worker representative, record hazards using the configured hazard families, rate probability, severity and exposure with the organisation's matrix, capture existing controls and photos, and link the rating to the exposure category so a change in the rating can change the surveillance the worker needs.", "streamsNeeded": [{"id": "assess-and-control-workplace-risks", "name": "Assess and control workplace risks", "howItSupports": "Holds the hazard catalogue, rating matrix and control records per workstation with an audit trail of who assessed what and when."}, {"id": "track-chemical-products-and-exposures", "name": "Track chemical products and exposures", "howItSupports": "Supplies the chemical products used at the workstation with their hazard classification so chemical risk is rated from the inventory rather than memory."}]}, {"step": "Turn residual risks into prevention measures and an annual action plan", "description": "For every risk above the tolerance threshold define a prevention measure following the hierarchy of controls, assign an owner and a due date, and consolidate the measures into the plan d'actions or PAPRIPACT in France and the annual action plan in Belgium, with the budget line and the responsible manager visible.", "streamsNeeded": [{"id": "assess-and-control-workplace-risks", "name": "Assess and control workplace risks", "howItSupports": "Generates the annual action plan and prevention programme from the residual risks with owners, dates and budgets."}, {"id": "report-and-resolve-hazardous-situations", "name": "Report and resolve hazardous situations", "howItSupports": "Registers each prevention measure as a followed action so progress and closure evidence are tracked in one action register."}]}, {"step": "Update the assessment when something changes", "description": "React to change events: a new workstation from the HRIS, a new chemical product, a work accident, an inspection finding or a request from the physician after a consultation. Re-rate the affected workstations, record the version and reason, and notify the CSSCT or CPPT secretary of what changed.", "streamsNeeded": [{"id": "declare-and-analyse-accidents-and-occupational-diseases", "name": "Declare and analyse accidents and occupational diseases", "howItSupports": "Pushes accident and occupational disease root causes back to the workstation assessment that must be revised."}, {"id": "assess-and-control-workplace-risks", "name": "Assess and control workplace risks", "howItSupports": "Versions the assessment per change with the reason, so the current and historical DUERP states are both retrievable."}, {"id": "maintain-workforce-and-exposure-data", "name": "Maintain workforce and exposure data", "howItSupports": "Flags new or changed workstations and assignments that have no current assessment."}]}, {"step": "Review annually with the committee and publish the dated version", "description": "Run the annual review with the CSSCT or CPPT and the occupational physician, record the consultation, export the dated DUERP version with its update history (kept for the statutory 40 years in France) or the global prevention plan and annual action plan for the Belgian internal prevention service report, and deposit or archive it where the regulation requires.", "streamsNeeded": [{"id": "assess-and-control-workplace-risks", "name": "Assess and control workplace risks", "howItSupports": "Produces the dated regulatory export of the assessment and action plan and keeps every version for the retention period."}, {"id": "monitor-health-and-safety-performance", "name": "Monitor health and safety performance", "howItSupports": "Shows currency, coverage and action progress per site so the review discusses the outliers rather than the whole register."}]}], "media": [{"type": "image", "src": "media/jbtd-hsem-jtbd-hsem-1.png", "title": "HSE Manager / Prevention Adviser JTBD infographic: Maintain a living risk assessment per workstation and site", "alt": "Enterprise infographic for the job \"Maintain a living risk assessment per workstation and site\" for customer \"HSE Manager / Prevention Adviser\"."}]}, {"id": "jtbd-hsem-2", "name": "Drive hazardous situations, inspection findings and audit actions to closure", "whatItIs": "Run one action register for everything that must be fixed: hazardous situations reported from the floor by workers and managers, findings from safety inspections, internal and external audits, labour inspection remarks, insurer visits, accident analyses and the annual action plan. Each item must be triaged, assigned to a manager with a due date, followed with reminders and escalation, closed with evidence (photo, invoice, procedure, training record) and reported to the CSSCT or CPPT and the ISO 45001 management review. The job is to make closure the normal outcome instead of a list that grows.", "outcome": "Corrective actions are closed on time at a rate above 90 percent, hazardous situations reported from the floor are resolved within a week, no action is overdue by more than 30 days without an escalation, and every closure carries evidence an auditor accepts.", "steps": [{"step": "Receive and triage reports and findings from every source", "description": "Collect hazardous situation reports arriving from the employee and manager portals, inspection checklists completed on tablets, audit findings imported from the ISO 45001 audit programme and remarks from the labour inspection or insurer, and triage them by severity, site and hazard family within two working days.", "streamsNeeded": [{"id": "report-and-resolve-hazardous-situations", "name": "Report and resolve hazardous situations", "howItSupports": "Captures reports and findings from the field and from inspections and audits into one triage queue with severity and location."}, {"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Brings the reports raised by workers and managers on their phones, with photos and location, into the same queue."}]}, {"step": "Assign corrective actions with owners, deadlines and budget", "description": "Convert each triaged item into one or more corrective actions, choose the responsible site or line manager, set a due date proportional to the risk, link the action to the workstation risk assessment and, where needed, to a budget request, and notify the owner through the manager portal.", "streamsNeeded": [{"id": "report-and-resolve-hazardous-situations", "name": "Report and resolve hazardous situations", "howItSupports": "Creates and assigns the actions with due dates and links them to the originating report, finding or risk."}, {"id": "assess-and-control-workplace-risks", "name": "Assess and control workplace risks", "howItSupports": "Links the action to the workstation risk so the residual rating is re-evaluated when the action closes."}]}, {"step": "Run inspections and audits against configured checklists", "description": "Schedule periodic safety inspections per site (workshops, warehouses, laboratories, offices), ATEX and machine checks and ISO 45001 internal audits, execute them with configured checklists on a tablet, and generate findings directly as actions so nothing is copied from paper.", "streamsNeeded": [{"id": "report-and-resolve-hazardous-situations", "name": "Report and resolve hazardous situations", "howItSupports": "Runs the inspection and audit programme with checklists and turns non-conformities into actions on the spot."}, {"id": "integrate-with-hr-devices-and-ecosystem", "name": "Integrate with HR, devices and the ecosystem", "howItSupports": "Provides SSO and mobile access for inspectors and external auditors with a time-limited role."}]}, {"step": "Follow progress, chase and escalate", "description": "Watch the action register by site and owner, let automatic reminders chase owners before and after the due date, escalate actions overdue by more than 30 days to the site director, and use the weekly review with site managers to unblock actions that need budget or a contractor.", "streamsNeeded": [{"id": "report-and-resolve-hazardous-situations", "name": "Report and resolve hazardous situations", "howItSupports": "Sends reminders and escalations and shows overdue actions per owner and site."}, {"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Gives every manager their own action list in the portal so chasing happens through the tool, not by e-mail."}]}, {"step": "Close with evidence and report to committees and auditors", "description": "Verify each closure with the evidence attached by the owner, re-rate the linked risk, inform the reporter that the situation was resolved, and produce the action status reports for the CSSCT or CPPT meeting, the management review and the ISO 45001 certification audit.", "streamsNeeded": [{"id": "report-and-resolve-hazardous-situations", "name": "Report and resolve hazardous situations", "howItSupports": "Records closure evidence and reporter feedback and keeps the audit trail per action."}, {"id": "monitor-health-and-safety-performance", "name": "Monitor health and safety performance", "howItSupports": "Produces closure rate, resolution time and overdue reports per site for committees and audits."}]}], "media": [{"type": "image", "src": "media/jbtd-hsem-jtbd-hsem-2.png", "title": "HSE Manager / Prevention Adviser JTBD infographic: Drive hazardous situations, inspection findings and audit actions to closure", "alt": "Enterprise infographic for the job \"Drive hazardous situations, inspection findings and audit actions to closure\" for customer \"HSE Manager / Prevention Adviser\"."}]}, {"id": "jtbd-hsem-3", "name": "Keep chemical products and exposures under control and inspection-ready", "whatItIs": "Maintain the inventory of chemical products used on every site with a current safety data sheet, the CLP hazard classification, the quantities and storage locations, the workstations and exposure groups that use them and the substitution plan for CMR (carcinogenic, mutagenic and reprotoxic) agents. Exposure records per workstation must feed the physician's surveillance rules so that reinforced medical follow-up is triggered automatically, and the whole register must satisfy the labour inspection, the insurer and the ISO 45001 auditor without a data-gathering exercise before each visit.", "outcome": "The chemical inventory is complete and current at every site, every CMR substance has an exposure record per workstation and a substitution or containment plan, exposed workers are automatically in the right surveillance category, and any inspection request for the register is answered from the platform the same day.", "steps": [{"step": "Build and keep the site inventory of chemical products", "description": "Register every chemical product per site and storage location from purchasing data and site walks, attach the supplier safety data sheet, record quantities and the workstations that use it, and set a review date so products without a safety data sheet under three years old are flagged.", "streamsNeeded": [{"id": "track-chemical-products-and-exposures", "name": "Track chemical products and exposures", "howItSupports": "Holds the product inventory with safety data sheets, locations, quantities and review dates per site."}, {"id": "integrate-with-hr-devices-and-ecosystem", "name": "Integrate with HR, devices and the ecosystem", "howItSupports": "Imports product lists from purchasing or ERP extracts so the inventory starts from what is actually bought."}]}, {"step": "Classify hazards and identify CMR and sensitising agents", "description": "Extract the CLP classification, hazard statements and occupational exposure limits from each safety data sheet, flag CMR, sensitising and endocrine-disrupting substances, and rank products by hazard and quantity to focus substitution and containment effort.", "streamsNeeded": [{"id": "track-chemical-products-and-exposures", "name": "Track chemical products and exposures", "howItSupports": "Structures classification, hazard statements and exposure limits per product and flags CMR agents for follow-up."}]}, {"step": "Define exposure groups and exposure records per workstation", "description": "Map which workstations and exposure groups use which products, under which conditions (frequency, duration, ventilation, protective equipment) and record the resulting exposure per worker assignment so that the exposure history follows the worker in the medical file.", "streamsNeeded": [{"id": "track-chemical-products-and-exposures", "name": "Track chemical products and exposures", "howItSupports": "Creates exposure groups and workstation exposure records from the product-to-workstation mapping."}, {"id": "maintain-workforce-and-exposure-data", "name": "Maintain workforce and exposure data", "howItSupports": "Attaches the chemical exposure to the workstation and worker exposure profile used across the platform."}]}, {"step": "Trigger the right medical surveillance for exposed workers", "description": "Let the exposure records update the surveillance category of each exposed worker so the physician's rules schedule reinforced follow-up (for example for CMR or lead exposure) and so the physician sees the products and exposure conditions in the consultation workspace without asking the prevention adviser.", "streamsNeeded": [{"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Derives the reinforced surveillance type and periodicity from the chemical exposure category and schedules the examinations."}, {"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Stores the exposure history in the worker's medical file so it is available across sites and services."}]}, {"step": "Plan substitution and containment and prove control", "description": "Maintain the substitution plan for CMR agents, track containment and protective equipment measures as actions, run periodic checks of storage and labelling, and produce the register, exposure lists and substitution evidence for the labour inspection, the CPPT or CSSCT and the ISO 45001 audit.", "streamsNeeded": [{"id": "report-and-resolve-hazardous-situations", "name": "Report and resolve hazardous situations", "howItSupports": "Tracks substitution, containment and storage actions to closure with evidence."}, {"id": "monitor-health-and-safety-performance", "name": "Monitor health and safety performance", "howItSupports": "Reports inventory completeness, CMR coverage and exposed headcount per site for inspections and committees."}]}], "media": [{"type": "image", "src": "media/jbtd-hsem-jtbd-hsem-3.png", "title": "HSE Manager / Prevention Adviser JTBD infographic: Keep chemical products and exposures under control and inspection-ready", "alt": "Enterprise infographic for the job \"Keep chemical products and exposures under control and inspection-ready\" for customer \"HSE Manager / Prevention Adviser\"."}]}], "customerJourneyStories": [{"id": "journey-hsem-1", "name": "From a spreadsheet DUERP to one living risk assessment", "linkedJobIds": ["jtbd-hsem-1", "jtbd-hsem-2"], "summary": "The HSE manager of a French industrial group with eleven sites, whose occupational health service already runs on Kitry, replaces a DUERP maintained in spreadsheets with the Workplace Safety module after a labour inspection finding, piloting on one site before a group-wide rollout.", "stages": [{"stage": "Trigger", "narrative": "During a visit to the group's largest plant the labour inspector asks for the DUERP and receives a spreadsheet last fully updated three years earlier, with a plan d'actions in a separate file nobody can date. The inspector's letter requires an updated assessment within two months and reminds the employer of the obligation to keep every version of the DUERP for 40 years. The site director asks the HSE manager how the group avoids a repeat at the other ten sites."}, {"stage": "Discovery", "narrative": "The HSE manager first asks the occupational health service manager, because the physicians already use Kitry for surveillance and hold a workstation and exposure register per site. The service manager shows that the same register can carry the risk assessment, and the Kitry account manager proposes the Workplace Safety module. At Pr\u00e9ventica in Paris the HSE manager sees a demonstration of a DUERP built per workstation with versioning and hears a prevention adviser from another industrial group describe the same move."}, {"stage": "Evaluation", "narrative": "The HSE manager compares three options: continuing with spreadsheets and a document management system, a generic EHS suite proposed by the group's quality function, and the Kitry module. The decisive criteria are that the workstation and exposure profiles are shared with the physician, that the export matches the DUERP format and keeps a dated history, that hosting is HDS and ISO 27001 certified inside the EEA, and that procurement can add the module to the existing contract. The CSSCT is informed and asks that worker representatives take part in the workstation walks."}, {"stage": "Trial", "narrative": "One plant of 600 workers is chosen as pilot. Kitry consultants run a functional assessment, migrate the spreadsheet lines into risk assessment units attached to the plant's workstations, and configure the hazard families and rating matrix. Over ten weeks the HSE manager, the supervisors and a CSSCT member re-walk every workstation on tablets, produce the first dated DUERP version for the inspector and generate the plan d'actions with owners and dates."}, {"stage": "Engagement", "narrative": "The remaining sites are onboarded in three waves of consultants-led workshops; each site's DUERP is versioned in the platform, prevention measures live in the action register and site managers receive their actions through the manager portal. The HSE manager runs the annual review per site from the currency dashboard and pushes accident analyses back into the affected workstation assessments. The group DUERP export takes minutes rather than a month."}, {"stage": "Retention", "narrative": "At the next labour inspection the plant produces the current DUERP and its version history on request, and the inspector's report notes the improvement. The group renews the module for all sites, adds the chemical inventory for its three plants with CMR agents, and the HSE manager presents the approach to the group's European sites as the basis for the ISO 45001 programme."}], "media": [{"type": "image", "src": "media/journey-hsem-hsem-1.png", "title": "HSE Manager / Prevention Adviser customer journey: From a spreadsheet DUERP to one living risk assessment", "alt": "Enterprise journey storyboard for \"From a spreadsheet DUERP to one living risk assessment\" for customer \"HSE Manager / Prevention Adviser\"."}]}, {"id": "journey-hsem-2", "name": "ISO 45001 certification with chemicals under control", "linkedJobIds": ["jtbd-hsem-3", "jtbd-hsem-1"], "summary": "A level-1 prevention adviser at a Belgian chemicals manufacturer selects Kitry through a tender to support an ISO 45001 certification programme across three plants and to replace a chemical inventory kept in a local database, piloting the chemicals module at one plant before certifying.", "stages": [{"stage": "Trigger", "narrative": "The board commits the Benelux plants to ISO 45001 certification within 18 months after a customer audit, and the external prevention service's annual visit notes that the CMR register is kept in a local database that cannot show which workstations are exposed. The prevention adviser is asked to present a system that can hold the global prevention plan, the annual action plan and the chemical inventory as evidence for the certification body."}, {"stage": "Discovery", "narrative": "At a Prebes evening for prevention advisers a peer from another chemicals group describes running the dynamic risk management system on Kitry with the physician of the internal service in the same tool. The adviser reads Kitry's Workplace Safety and sector pages, notes the ISO 45001 support and the Dutch and French interfaces, and adds Kitry to a tender alongside two EHS suites and the external prevention service's own tool."}, {"stage": "Evaluation", "narrative": "The tender committee, with the CPPT informed at each step, scores the offers on the ability to import safety data sheets and extract CLP classification, to map products to exposure groups that feed medical surveillance, to structure the five-year global prevention plan and the annual action plan, and on hosting and data residency. The internal occupational physician confirms that exposure records per workstation would appear in the medical file. Kitry wins on the integrated data model and on references at chemicals and pharma companies."}, {"stage": "Trial", "narrative": "The Antwerp-area plant runs a pilot: Kitry consultants import the product list from the ERP, the adviser attaches safety data sheets and classifications for the 340 products, defines exposure groups per workstation and links them to the physician's reinforced surveillance rules. Within eight weeks the plant can answer which workers are exposed to which CMR agents, and the first substitution actions are followed in the action register."}, {"stage": "Engagement", "narrative": "The other two plants are onboarded, the global prevention plan and the annual action plans are managed per plant with actions assigned to production managers, internal audits are run from configured checklists, and the management review uses the performance dashboards. The certification body's stage-two audit takes the action register, the chemical register and the risk assessment history directly from the platform."}, {"stage": "Retention", "narrative": "Certification is obtained for the three plants, and the annual report of the internal prevention service is produced from the same data. The company renews for three years, extends the licence to a Dutch site, and the prevention adviser joins Kitry's customer group on chemicals and exposures that reviews the CMR and endocrine-disruptor content updates."}], "media": [{"type": "image", "src": "media/journey-hsem-hsem-2.png", "title": "HSE Manager / Prevention Adviser customer journey: ISO 45001 certification with chemicals under control", "alt": "Enterprise journey storyboard for \"ISO 45001 certification with chemicals under control\" for customer \"HSE Manager / Prevention Adviser\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-hsem-top", "name": "Risk assessment currency rate", "description": "Share of workstations across all sites whose risk assessment was reviewed within the last twelve months or within thirty days of a change event (new workstation, chemical, accident, inspection finding). The current value reflects a spreadsheet DUERP updated site by site; the target reflects a versioned assessment attached to the shared workstation register. Modeled seed values.", "unit": "%", "currentValue": "62", "targetValue": "95", "link": "https://dashboard.example.com/occupational-health-and-safety-platform/customers/hsem/kpis/co-hsem-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-hsem-co-hsem-top.png"}, "branches": [{"id": "co-hsem-b1", "name": "Assessment coverage and freshness", "description": "Whether every workstation has an assessment on the shared register and how fast the assessment follows change and the annual review.", "currentValue": "68", "icon": "kpi-hsem-co-hsem-b1.png", "children": [{"id": "co-hsem-b1-c1", "name": "Workstation risk assessment coverage", "description": "Share of workstations in the workforce register that have a risk assessment unit with at least one rated hazard.", "unit": "%", "currentValue": "78", "targetValue": "100", "icon": "kpi-hsem-co-hsem-b1-c1.png", "children": [{"id": "co-hsem-b1-c1-l1", "name": "Workstations linked to an exposure profile", "description": "Share of workstations whose risk assessment is attached to the exposure profile used for medical surveillance, so the physician and the prevention adviser see the same data.", "unit": "%", "currentValue": "71", "targetValue": "100", "icon": "kpi-hsem-co-hsem-b1-c1-l1.png", "children": []}, {"id": "co-hsem-b1-c1-l2", "name": "Assessments updated within 30 days of a change event", "description": "Share of change events (new workstation, new chemical, accident, inspection finding) whose affected workstation assessments were re-rated within thirty days.", "unit": "%", "currentValue": "40", "targetValue": "90", "icon": "kpi-hsem-co-hsem-b1-c1-l2.png", "children": []}]}, {"id": "co-hsem-b1-c2", "name": "Annual review cycle time", "description": "Days from the start of the annual review campaign to the last site's dated DUERP or global prevention plan version being published.", "unit": "days", "currentValue": "120", "targetValue": "45", "icon": "kpi-hsem-co-hsem-b1-c2.png", "children": [{"id": "co-hsem-b1-c2-l1", "name": "Sites with the annual review completed before the due date", "description": "Share of sites whose annual review with the CSSCT or CPPT was recorded and the dated version published before the planned date.", "unit": "%", "currentValue": "55", "targetValue": "95", "icon": "kpi-hsem-co-hsem-b1-c2-l1.png", "children": []}, {"id": "co-hsem-b1-c2-l2", "name": "Residual risks with a documented prevention measure", "description": "Share of risks rated above the tolerance threshold that have a prevention measure with an owner and a due date in the action plan.", "unit": "%", "currentValue": "84", "targetValue": "100", "icon": "kpi-hsem-co-hsem-b1-c2-l2.png", "children": []}]}]}, {"id": "co-hsem-b2", "name": "Control effectiveness", "description": "Whether the measures that follow from the assessment are executed and whether chemical exposures are known and controlled.", "currentValue": "60", "icon": "kpi-hsem-co-hsem-b2.png", "children": [{"id": "co-hsem-b2-c1", "name": "Corrective action closure rate", "description": "Share of corrective actions (hazardous situations, inspection and audit findings, action plan measures) closed with evidence on or before their due date.", "unit": "%", "currentValue": "58", "targetValue": "90", "icon": "kpi-hsem-co-hsem-b2-c1.png", "children": [{"id": "co-hsem-b2-c1-l1", "name": "Corrective action closure time", "description": "Median days from the creation of an action to its verified closure, across all sites and sources.", "unit": "days", "currentValue": "74", "targetValue": "30", "icon": "kpi-hsem-co-hsem-b2-c1-l1.png", "children": []}, {"id": "co-hsem-b2-c1-l2", "name": "Actions overdue by more than 30 days", "description": "Share of open actions past their due date by more than thirty days without a recorded escalation.", "unit": "%", "currentValue": "27", "targetValue": "5", "icon": "kpi-hsem-co-hsem-b2-c1-l2.png", "children": []}]}, {"id": "co-hsem-b2-c2", "name": "Chemical inventory completeness", "description": "Share of chemical products in the inventory with a current safety data sheet, a CLP classification, a storage location and at least one linked workstation.", "unit": "%", "currentValue": "66", "targetValue": "98", "icon": "kpi-hsem-co-hsem-b2-c2.png", "children": [{"id": "co-hsem-b2-c2-l1", "name": "Products with a safety data sheet under three years old", "description": "Share of inventoried products whose attached safety data sheet is dated within the last three years.", "unit": "%", "currentValue": "61", "targetValue": "95", "icon": "kpi-hsem-co-hsem-b2-c2-l1.png", "children": []}, {"id": "co-hsem-b2-c2-l2", "name": "CMR substances with an exposure record per workstation", "description": "Share of carcinogenic, mutagenic and reprotoxic substances in the inventory that have an exposure record for every workstation using them.", "unit": "%", "currentValue": "48", "targetValue": "100", "icon": "kpi-hsem-co-hsem-b2-c2-l2.png", "children": []}]}]}]}, "businessOutcomes": {"top": {"id": "bo-hsem-top", "name": "Workplace Safety module attach rate", "description": "Share of Kitry customer organisations that subscribe to the Workplace Safety module in addition to Occupational Health. The safety module is the main cross-sell into the installed base of internal occupational health services. Modeled seed value, not a reported Kitry figure.", "unit": "%", "currentValue": "42", "targetValue": "75", "link": "https://dashboard.example.com/occupational-health-and-safety-platform/customers/hsem/kpis/bo-hsem-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-hsem-bo-hsem-top.png"}, "branches": [{"id": "bo-hsem-b1", "name": "Safety module usage depth", "description": "How intensively prevention teams use risk assessment, field reporting, actions and chemicals once the module is live.", "currentValue": "44", "icon": "kpi-hsem-bo-hsem-b1.png", "children": [{"id": "bo-hsem-b1-c1", "name": "Monthly active HSE users", "description": "Number of prevention adviser, HSE manager and inspector role users who assess, inspect or manage actions in the platform in a given month, across all customers.", "unit": "users", "currentValue": "900", "targetValue": "2400", "icon": "kpi-hsem-bo-hsem-b1-c1.png", "children": [{"id": "bo-hsem-b1-c1-l1", "name": "Hazardous situation reports submitted per month", "description": "Number of hazardous situation reports created across all customers per month, from portals, mobile and inspections.", "unit": "reports per month", "currentValue": "3200", "targetValue": "12000", "icon": "kpi-hsem-bo-hsem-b1-c1-l1.png", "children": []}, {"id": "bo-hsem-b1-c1-l2", "name": "Actions managed per organisation per month", "description": "Average number of corrective actions created or closed per safety-module organisation per month.", "unit": "actions per month", "currentValue": "45", "targetValue": "160", "icon": "kpi-hsem-bo-hsem-b1-c1-l2.png", "children": []}]}, {"id": "bo-hsem-b1-c2", "name": "Optional safety capability activation rate", "description": "Share of safety-module organisations that have activated at least one optional capability beyond the risk assessment: mobile field reporting, the chemical inventory or the ISO 45001 evidence pack.", "unit": "%", "currentValue": "35", "targetValue": "80", "icon": "kpi-hsem-bo-hsem-b1-c2.png", "children": [{"id": "bo-hsem-b1-c2-l1", "name": "Field reporting mobile adoption rate", "description": "Share of safety-module organisations that have hazardous situation reporting from mobile devices activated for workers and managers.", "unit": "%", "currentValue": "30", "targetValue": "80", "icon": "kpi-hsem-bo-hsem-b1-c2-l1.png", "children": []}, {"id": "bo-hsem-b1-c2-l2", "name": "ISO 45001 evidence pack usage rate", "description": "Share of safety-module organisations that generated the ISO 45001 evidence export for an internal or certification audit in the last year.", "unit": "%", "currentValue": "15", "targetValue": "60", "icon": "kpi-hsem-bo-hsem-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-hsem-b2", "name": "Safety module commercial performance", "description": "Retention, expansion and deployment economics of the safety module within the customer base.", "currentValue": "58", "icon": "kpi-hsem-bo-hsem-b2.png", "children": [{"id": "bo-hsem-b2-c1", "name": "Safety module net revenue retention", "description": "Annual recurring revenue of the safety module from organisations that were customers one year earlier, divided by their revenue a year earlier, including site and chemicals expansion.", "unit": "%", "currentValue": "103", "targetValue": "115", "icon": "kpi-hsem-bo-hsem-b2-c1.png", "children": [{"id": "bo-hsem-b2-c1-l1", "name": "Safety module renewal rate", "description": "Share of safety-module subscriptions renewed at term without downgrade.", "unit": "%", "currentValue": "92", "targetValue": "98", "icon": "kpi-hsem-bo-hsem-b2-c1-l1.png", "children": []}, {"id": "bo-hsem-b2-c1-l2", "name": "Safety module contracts signed with existing health customers per year", "description": "Number of new Workplace Safety module contracts per year signed by organisations already using the Occupational Health module.", "unit": "contracts per year", "currentValue": "8", "targetValue": "25", "icon": "kpi-hsem-bo-hsem-b2-c1-l2.png", "children": []}]}, {"id": "bo-hsem-b2-c2", "name": "Safety module implementation lead time", "description": "Weeks from contract to the first site live with a migrated risk assessment and trained prevention team.", "unit": "weeks", "currentValue": "20", "targetValue": "10", "icon": "kpi-hsem-bo-hsem-b2-c2.png", "children": [{"id": "bo-hsem-b2-c2-l1", "name": "Legacy risk assessment migrations completed per year", "description": "Number of spreadsheet or legacy-tool risk assessments migrated into the platform by Kitry consultants per year.", "unit": "migrations per year", "currentValue": "6", "targetValue": "20", "icon": "kpi-hsem-bo-hsem-b2-c2-l1.png", "children": []}, {"id": "bo-hsem-b2-c2-l2", "name": "Sector pre-configuration usage rate", "description": "Share of new safety-module deployments that start from a sector pre-configuration (industry, chemicals and pharma, healthcare, public sector) rather than a blank configuration.", "unit": "%", "currentValue": "25", "targetValue": "70", "icon": "kpi-hsem-bo-hsem-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Give every prevention adviser one living risk assessment that shares its workstations and exposures with the occupational physician, receives hazardous situations from the floor and closes its actions, so that the DUERP, the global prevention plan, the chemical register and the ISO 45001 evidence are by-products of daily prevention work rather than annual reconstructions.", "timeHorizons": {"year1": {"focus": "Make the safety module the natural extension of the occupational health installed base: risk assessment on the shared workstation register with DUERP and global prevention plan exports, hazardous situation reporting on mobile for workers and managers, one action register with reminders and escalation, and a chemical inventory with safety data sheets that feeds surveillance.", "productTheme": "One register, from workstation to action", "customerKPI": {"northStar": "Risk assessment currency rate", "supporting": ["Corrective action closure rate", "Chemical inventory completeness"]}, "businessKPI": {"northStar": "Workplace Safety module attach rate", "revenueStreams": ["Workplace Safety module subscriptions per site and workforce size", "Chemical inventory and safety data sheet option", "Implementation and legacy risk assessment migration services"], "supporting": ["Field reporting mobile adoption rate", "Safety module implementation lead time"]}, "milestones": ["Ship hazardous situation reporting on mobile with photo, location and workstation pick-up in the employee and manager portals, feeding one action register with reminders and escalation", "Release the chemical inventory with safety data sheet attachment, CLP classification extraction and CMR flagging, and link exposure records per workstation to the surveillance rules", "Deliver versioned DUERP and global prevention plan exports with the dated history required by French and Belgian regulation"]}, "year3": {"focus": "ISO 45001-ready safety management with analytics: internal audit programmes, management review dashboards and an evidence pack, sector pre-configurations for industry, chemicals and pharma, healthcare and public sector, and action plans that appear in the physician's workstation view so collective prevention advice and corrective actions are one conversation.", "productTheme": "Certifiable prevention, steered by data", "customerKPI": {"northStar": "Risk assessment currency rate", "supporting": ["Annual review cycle time", "Assessments updated within 30 days of a change event"]}, "businessKPI": {"northStar": "Workplace Safety module attach rate", "revenueStreams": ["Safety module subscriptions with ISO 45001 and audit options", "Sector pre-configuration packages", "Multi-site and multi-country expansion licences"], "supporting": ["ISO 45001 evidence pack usage rate", "Safety module net revenue retention"]}, "milestones": ["Ship the ISO 45001 evidence pack: audit programme, non-conformity handling, management review dashboard and a certification-audit export built from the action register and risk assessment history", "Surface each workstation's action plan and residual risks in the physician's consultation workspace so fitness restrictions and prevention measures reference the same workstation record", "Publish sector pre-configurations with hazard catalogues, rating matrices and inspection checklists for industry, chemicals and pharma, healthcare and public sector"]}, "year5": {"focus": "Continuous prevention: risk assessments that are re-rated as HRIS, chemical, accident and inspection data flow in, assisted drafting of prevention measures and assessment updates under the adviser's supervision, and collective exposure analytics that link workstation risks to health outcomes across sites and countries.", "productTheme": "Risk assessment that updates itself, adviser-reviewed", "customerKPI": {"northStar": "Risk assessment currency rate", "supporting": ["Workstation risk assessment coverage", "CMR substances with an exposure record per workstation"]}, "businessKPI": {"northStar": "Workplace Safety module attach rate", "revenueStreams": ["European group-wide safety subscriptions", "Assisted assessment and exposure analytics options", "Partner ecosystem revenue with external prevention services and insurers"], "supporting": ["Monthly active HSE users", "Safety module renewal rate"]}, "milestones": ["Launch assisted assessment updates that propose re-ratings and prevention measures when a change event arrives, for review and approval by the prevention adviser", "Deliver collective exposure analytics that correlate workstation risks, chemical exposure records and collective health indicators across sites while preserving medical confidentiality", "Open the action register and chemical register to external prevention services and insurers through partner interfaces with customer-controlled access"]}}}, "domain": "HSE and Prevention"}, {"id": "sitm", "name": "Site / Line Manager", "description": "A site director, depot manager, shift supervisor, workshop foreman, laboratory head or team leader in one of the employer's operational units: a maintenance depot of a transport operator, a production shift in a chemicals or food plant, a hospital department, a municipal technical service, a research laboratory. Does not buy the platform and does not choose it; the employer's occupational health service and HR roll the manager portal out to hundreds of managers at once. Uses it to know that the team is fit and cleared for the assigned work, to release workers for examinations, to apply restrictions the physician has issued without seeing the medical reason, to report hazardous situations from the floor and to close the corrective actions assigned to them. Is measured on production, on the accident frequency of the area and, in front of the labour inspection or a court, on whether known hazards were acted upon and restrictions respected. Uses the portal on a phone between two other tasks and will abandon it if it asks for more than a minute.", "icon": "customer-sitm-portrait.jpg", "careAbout": ["A team view that answers 'is this person cleared for this post today?' without calling the nurse or asking HR", "Restriction notifications that say what to change and for how long, and nothing about why, so the manager can apply them without holding medical information", "Reporting a hazardous situation from the floor with a photo in under a minute, and being told what was done about it", "A short action list with realistic due dates, and the ability to ask for budget or a contractor from the same place", "Convocations for the team arriving in time to plan production around them, with a reschedule option when the date is impossible", "Being able to show an inspector or the CSSCT that restrictions were applied and hazards acted on, with dates"], "winsThem": ["Manager portal with team fitness status, convocations, restrictions and actions on a phone, provisioned through the employer's single sign-on with no new password", "Restriction notifications in non-medical wording with acknowledgement and accommodation confirmation, backed by Kitry's medical confidentiality and access segregation", "Hazardous situation reporting for managers and workers with photo and location, routed to the prevention service and returned as an action with feedback to the reporter", "An onboarding run by the occupational health service and Kitry consultants in rollout waves with a 20-minute session and in-portal guidance", "Area figures on clearance, reporting and resolution that managers can use in their briefings and reviews"], "theirFear": ["A worker is injured on a task the physician had restricted, and the restriction note is found on paper in a drawer", "A serious accident happens at a spot several workers had warned about verbally, and nothing was recorded", "Being given a system that adds administration and responsibility for medical matters that managers cannot see and should not handle"], "jobsToBeDone": [{"id": "jtbd-sitm-1", "name": "Know that everyone on my team is fit and cleared for their work", "whatItIs": "See at any moment, for every person on the team, whether their medical surveillance is current and whether they are cleared for the work they are assigned to, without ever seeing a diagnosis. Managers must release workers for their examinations on the convocation date, know when a fitness opinion has expired or is pending, plan replacements for safety-critical posts, and be told when a temporary worker or a new hire cannot start a task until the physician has seen them. The job is to be able to assign work with confidence and to answer the question 'is this person cleared for this post?' from the portal rather than from HR or the nurse.", "outcome": "No one on the team works on a post they are not cleared for, expired or missing fitness opinions are below two percent, convoked workers are released on the day and the manager never learns of a fitness problem from a phone call after the fact.", "steps": [{"step": "See the team's fitness and surveillance status", "description": "Open the manager portal and view the team roster synchronised from the HRIS with, per person, the surveillance category of their workstation, the date and validity of the last fitness opinion, upcoming or overdue examinations and any active restriction, shown as a status rather than as medical content.", "streamsNeeded": [{"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Presents the team fitness status, upcoming visits and restrictions in the manager portal with role-based access that hides medical content."}, {"id": "maintain-workforce-and-exposure-data", "name": "Maintain workforce and exposure data", "howItSupports": "Supplies the team roster, assignments and workstation surveillance categories from the HRIS synchronisation."}]}, {"step": "Release workers for their examinations on the convocation date", "description": "Receive the convocation list for the team with dates and times, confirm the release of each worker or propose another slot when production makes the date impossible, and see that the reminder reached the worker so no-shows do not cost the physician a slot.", "streamsNeeded": [{"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Provides the convocation dates per worker and lets the manager confirm or request a reschedule within the physician's capacity plan."}, {"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Notifies the manager of convocations for the team and records the release confirmation."}]}, {"step": "Check clearance before assigning safety-critical work", "description": "Before assigning a worker to a safety-critical post, night shift, work at height or chemical exposure, check in the portal that the surveillance category of the target workstation matches the worker's current clearance and request a visit when it does not.", "streamsNeeded": [{"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Shows the clearance per worker against the surveillance category of a target workstation and offers a visit request."}, {"id": "conduct-examinations-and-teleconsultations", "name": "Conduct examinations and teleconsultations", "howItSupports": "Returns the fitness-for-work opinion, with restrictions, that the clearance status is derived from."}]}, {"step": "Onboard new hires and temporary workers before they start", "description": "When HR adds a new hire, an apprentice or a temporary worker to the team, see that the pre-assignment or initial visit is scheduled, know whether it must happen before the person starts the work, and keep the person off restricted tasks until the opinion is recorded.", "streamsNeeded": [{"id": "maintain-workforce-and-exposure-data", "name": "Maintain workforce and exposure data", "howItSupports": "Creates the new assignment and its surveillance category from the HRIS feed so the initial visit is triggered."}, {"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Schedules the initial or pre-assignment examination and shows its status to the manager."}]}, {"step": "Act on expired or missing clearances", "description": "Review the weekly list of team members whose fitness opinion has expired, is missing or is about to expire, chase the visit with the worker and the nurse, and record the temporary measure taken (reassignment, supervision) until clearance is restored.", "streamsNeeded": [{"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Lists expiring and expired clearances for the team and records the interim measure."}, {"id": "monitor-health-and-safety-performance", "name": "Monitor health and safety performance", "howItSupports": "Shows the team clearance rate over time so the manager and the service coordinator see the trend."}]}], "media": [{"type": "image", "src": "media/jbtd-sitm-jtbd-sitm-1.png", "title": "Site / Line Manager JTBD infographic: Know that everyone on my team is fit and cleared for their work", "alt": "Enterprise infographic for the job \"Know that everyone on my team is fit and cleared for their work\" for customer \"Site / Line Manager\"."}]}, {"id": "jtbd-sitm-2", "name": "Report and resolve hazardous situations from the floor", "whatItIs": "Be the person who turns what workers see on the floor into fixed problems: a damaged guard, a leaking drum, a blocked emergency exit, a near-miss with a forklift. The manager must be able to report a hazardous situation from a phone in a minute with a photo and the workstation, receive the corrective actions assigned to them by the prevention service, carry them out or arrange a contractor, attach evidence of the fix and tell the worker who raised it what happened. The job is to make reporting worth the worker's effort and to keep the manager's own action list short.", "outcome": "Hazardous situations from the team are reported within the same shift, resolved within a week on average, every reporter sees the outcome, and corrective actions assigned to the manager are closed on time with evidence.", "steps": [{"step": "Report a hazardous situation from the floor in a minute", "description": "Use the manager portal on a phone or tablet to report a hazardous situation or near-miss: take a photo, pick the workstation or location, choose the hazard type, indicate whether a worker was at immediate risk, and submit; encourage team members to do the same from the employee portal or the site QR code.", "streamsNeeded": [{"id": "report-and-resolve-hazardous-situations", "name": "Report and resolve hazardous situations", "howItSupports": "Captures the report with photo, location, hazard type and severity and routes it to the prevention service."}, {"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Provides the mobile reporting form in the manager and employee portals without a separate application."}]}, {"step": "Take immediate measures and record them", "description": "When a situation is dangerous now, stop the task, isolate the area or equipment and record the immediate measure in the report so the prevention adviser and the next shift know what was done before the corrective action is defined.", "streamsNeeded": [{"id": "report-and-resolve-hazardous-situations", "name": "Report and resolve hazardous situations", "howItSupports": "Records immediate measures on the report and makes them visible to the prevention service and other managers."}]}, {"step": "Receive and plan the corrective actions assigned to me", "description": "See the corrective actions assigned by the prevention service with their due dates in the portal action list, plan them in the team's work or request a contractor and a budget, and update the status so the prevention adviser does not need to ask.", "streamsNeeded": [{"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Shows the manager's assigned actions with due dates and lets them update status and comments."}, {"id": "report-and-resolve-hazardous-situations", "name": "Report and resolve hazardous situations", "howItSupports": "Holds the action with its link to the originating report and risk and sends reminders before the due date."}]}, {"step": "Close the action with evidence", "description": "Once the fix is done, attach a photo, the contractor's report or the updated work instruction, mark the action as done for verification by the prevention service, and see the reporter notified that the situation was resolved.", "streamsNeeded": [{"id": "report-and-resolve-hazardous-situations", "name": "Report and resolve hazardous situations", "howItSupports": "Records closure evidence, routes the action for verification and informs the reporter."}]}, {"step": "Review the team's open situations and near-miss trend", "description": "In the weekly team briefing, review open reports and actions for the area, discuss recurring hazard types with the team, and use the reporting and resolution figures to show workers that raising concerns leads to change.", "streamsNeeded": [{"id": "monitor-health-and-safety-performance", "name": "Monitor health and safety performance", "howItSupports": "Provides the team's reporting rate, resolution time and open actions for the briefing."}, {"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Lists the area's open reports and actions in the portal for the briefing."}]}], "media": [{"type": "image", "src": "media/jbtd-sitm-jtbd-sitm-2.png", "title": "Site / Line Manager JTBD infographic: Report and resolve hazardous situations from the floor", "alt": "Enterprise infographic for the job \"Report and resolve hazardous situations from the floor\" for customer \"Site / Line Manager\"."}]}, {"id": "jtbd-sitm-3", "name": "Apply medical restrictions and accommodations without breaching confidentiality", "whatItIs": "Turn a physician's fitness opinion with restrictions or recommended accommodations into a changed work assignment quickly and discreetly: no lifting above a stated weight, no night shift for three months, no exposure to a chemical group, adapted hours after a return from long absence. The manager sees only the restriction and its validity, never the medical reason, must apply it in the team's planning and workstation assignments, confirm what was done, involve HR when a reassignment is needed and respect the worker's privacy in front of colleagues. The job is to apply the restriction fully within days and to be able to prove it if the physician, HR or an inspector asks.", "outcome": "Every restriction is acknowledged in the portal within 48 hours and applied within two working days with a documented accommodation, no worker is assigned work that breaches an active restriction, and the manager never holds or shares medical information.", "steps": [{"step": "Receive the restriction notification with only what I need to know", "description": "Be notified in the manager portal when a fitness opinion for a team member carries a restriction or an accommodation, see the restriction wording, the affected tasks or workstations and the validity period, and nothing else, and acknowledge it.", "streamsNeeded": [{"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Notifies the manager of the restriction with the non-medical wording, validity and affected workstations and records the acknowledgement."}, {"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Enforces access segregation so the restriction is shared while the medical file and diagnosis remain with the physician."}]}, {"step": "Translate the restriction into the team's planning", "description": "Check which tasks, shifts and workstations of the worker are affected, adapt the roster and task assignment for the validity period, and where the current post cannot be adapted request a temporary reassignment with HR.", "streamsNeeded": [{"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Shows the restriction against the worker's assignments and workstations so affected tasks are visible."}, {"id": "maintain-workforce-and-exposure-data", "name": "Maintain workforce and exposure data", "howItSupports": "Records the temporary assignment change so surveillance and exposure follow the new workstation."}]}, {"step": "Confirm the accommodation and ask the physician when unclear", "description": "Record in the portal the accommodation put in place and its start date, and when the restriction cannot be applied as written, send a question to the occupational health service through the portal rather than calling the worker's colleagues or HR.", "streamsNeeded": [{"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Captures the accommodation confirmation and routes questions to the occupational health service."}, {"id": "conduct-examinations-and-teleconsultations", "name": "Conduct examinations and teleconsultations", "howItSupports": "Lets the physician clarify or adjust the restriction, with a follow-up visit or teleconsultation when needed."}]}, {"step": "Coordinate return-to-work and absence with HR and the physician", "description": "For a worker returning after long absence, follow the return-to-work visit and its recommendations, agree the adapted hours or tasks with HR and the physician, and track the end of the temporary arrangement.", "streamsNeeded": [{"id": "declare-and-analyse-accidents-and-occupational-diseases", "name": "Declare and analyse accidents and occupational diseases", "howItSupports": "Tracks the absence and return-to-work follow-up after a work accident or occupational disease."}, {"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Shows the return-to-work plan steps assigned to the manager and their status."}]}, {"step": "Prove restrictions were applied when asked", "description": "When the physician, HR, the CSSCT or CPPT or a labour inspector asks whether a restriction was applied, retrieve from the portal the acknowledgement, the accommodation recorded and the assignment history without exposing any medical content.", "streamsNeeded": [{"id": "monitor-health-and-safety-performance", "name": "Monitor health and safety performance", "howItSupports": "Reports restriction acknowledgement and application times for the team and site."}, {"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Keeps the history of acknowledgements and accommodations per restriction with an audit trail."}]}], "media": [{"type": "image", "src": "media/jbtd-sitm-jtbd-sitm-3.png", "title": "Site / Line Manager JTBD infographic: Apply medical restrictions and accommodations without breaching confidentiality", "alt": "Enterprise infographic for the job \"Apply medical restrictions and accommodations without breaching confidentiality\" for customer \"Site / Line Manager\"."}]}], "customerJourneyStories": [{"id": "journey-sitm-1", "name": "Onboarded to the manager portal in a rollout wave", "linkedJobIds": ["jtbd-sitm-1", "jtbd-sitm-3"], "summary": "A maintenance team leader at a public transport operator is onboarded to Kitry's manager portal when the employer rolls it out to 900 managers, moving from paper fitness certificates and phone calls from the nurse to a team fitness view and restriction notifications on his phone.", "stages": [{"stage": "Trigger", "narrative": "The team leader learns that a technician has been working on live equipment for six weeks with an expired fitness opinion only when the occupational health nurse calls, and a restriction on night work for another technician reached him as a paper note that a colleague read on his desk. In the same month the operator's occupational health service, which runs on Kitry, announces with HR that the manager portal will be rolled out to all managers in three waves."}, {"stage": "Discovery", "narrative": "He receives the invitation e-mail from HR and the occupational health service with a date for his wave, a two-page guide and a link to a 20-minute session. At the session an occupational health nurse and a Kitry consultant show a manager's team view on a phone: surveillance status per person, convocations to release, restrictions with their wording and validity, and nothing medical. A colleague from the first wave says the convocation list alone saved her an hour a week."}, {"stage": "Evaluation", "narrative": "He is wary of a tool that could make him responsible for things he cannot see, so he checks precisely what the portal shows and hides, asks the union representative on the CSSCT whether worker representatives agreed to the rollout, and confirms with HR that access comes through the operator's single sign-on with no new password. He also asks the nurse what happens when he cannot release a worker on the convocation date and is shown the reschedule request."}, {"stage": "Trial", "narrative": "In the first three weeks he uses the team view to find two more expired opinions, releases his technicians for their convocations from the list, requests one reschedule during a night works campaign, and receives his first restriction notification on his phone, which he acknowledges and applies by moving the technician to day shifts without discussing the reason with anyone."}, {"stage": "Engagement", "narrative": "The Monday check of the team status becomes part of his planning routine, new temporary workers appear with their initial visit status before they start, and he answers the depot manager's question about clearances for a safety-critical post from the portal. He starts reporting hazardous situations from the depot floor with a photo rather than by e-mail to the HSE manager."}, {"stage": "Retention", "narrative": "At the six-month review the occupational health service shows the depot's clearance rate rose from 84 to 97 percent and restriction application time fell from over a week to two days. He is asked to present the routine to the third wave of managers, and the operator extends the portal to contractor supervisors on site."}], "media": [{"type": "image", "src": "media/journey-sitm-sitm-1.png", "title": "Site / Line Manager customer journey: Onboarded to the manager portal in a rollout wave", "alt": "Enterprise journey storyboard for \"Onboarded to the manager portal in a rollout wave\" for customer \"Site / Line Manager\"."}]}, {"id": "journey-sitm-2", "name": "From an accident to a shift that reports", "linkedJobIds": ["jtbd-sitm-2", "jtbd-sitm-1"], "summary": "A production shift supervisor at a food manufacturing plant adopts hazardous situation reporting through the manager and employee portals after a forklift accident reveals unrecorded warnings, piloting it with his shift before the plant rolls it out to all teams.", "stages": [{"stage": "Trigger", "narrative": "A forklift strikes a pallet stack in the shipping area and an operator breaks a wrist. The accident analysis run by the HSE manager and the occupational physician shows that two workers had warned the supervisor verbally about the blind corner in the previous months and that nothing was recorded. The plant director wants every hazardous situation traced from the moment it is noticed, and the supervisor is asked to lead a pilot on his shift."}, {"stage": "Discovery", "narrative": "The HSE manager, whose prevention service already uses Kitry's safety module, demonstrates hazardous situation reporting at the shift's daily briefing: a QR code on the notice board opens the employee portal form, the supervisor's manager portal shows the report with photo and location, and the corrective action arrives on his phone. The supervisor had assumed reporting required a computer in the office."}, {"stage": "Evaluation", "narrative": "He worries that reports will be used to blame supervisors and that workers will report trivialities; he goes through the workflow with the HSE manager and the CSSCT member of his shift, checks that the report shows what was done immediately and who owns the fix, that reporters are informed of the outcome and that anonymous reporting is possible for workers who want it, and agrees on a three-month pilot with weekly review."}, {"stage": "Trial", "narrative": "During the pilot the shift reports 38 situations, most of them in the first month: damaged guards, wet floors near the washing line, a blocked emergency exit, two more forklift near-misses. He reports from the floor himself, receives 22 corrective actions, closes most with photos and gets budget for a mirror and a barrier at the blind corner. Reporters see each resolution in their portal."}, {"stage": "Engagement", "narrative": "Reporting becomes part of the shift routine: the weekly briefing opens with the open reports and actions, near-misses are discussed without blame, and the supervisor uses the team fitness view to release operators for their visits and to check clearances for the forklift posts. He proposes to the HSE manager two checklist items for the monthly inspection that come from his shift's reports."}, {"stage": "Retention", "narrative": "After the pilot the plant rolls out reporting to all shifts; the supervisor's area shows a reporting rate five times higher than before and no lost-time accident in the following twelve months. He becomes the plant's portal champion, presents the pilot to the group's other plants and asks the HSE manager for the recurring near-miss statistics per area in his portal."}], "media": [{"type": "image", "src": "media/journey-sitm-sitm-2.png", "title": "Site / Line Manager customer journey: From an accident to a shift that reports", "alt": "Enterprise journey storyboard for \"From an accident to a shift that reports\" for customer \"Site / Line Manager\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-sitm-top", "name": "Team fitness clearance rate", "description": "Share of workers on the manager's team with a current fitness opinion that clears them for the surveillance category of their assigned workstation, without an expired, missing or pending examination. The current value reflects paper certificates and phone follow-up; the target reflects a portal that shows status and drives releases. Modeled seed values.", "unit": "%", "currentValue": "83", "targetValue": "98", "link": "https://dashboard.example.com/occupational-health-and-safety-platform/customers/sitm/kpis/co-sitm-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-sitm-co-sitm-to
