rough Kitry's four phases, and operate with a standard release train, regulatory updates, an account manager and support, so that the service never owns servers, code or a development team.", "outcome": "The platform is live on certified hosting within the planned months, the legacy files are migrated completely, the DPO and IT security have signed off, releases and regulatory updates arrive as a service, and the service head spends time on the service rather than on the system.", "steps": [{"step": "Set the requirements with the DPO and IT security", "description": "Write the requirements for HDS certification, ISO 27001, EEA-only access, medical secrecy and access segregation, the DPIA, retention and the exit clause with data return, and put them into the tender or framework agreement.", "streamsNeeded": [{"id": "deploy-migrate-and-train-a-customer", "name": "Deploy, migrate and train a customer", "howItSupports": "Provides the functional assessment that translates the service's requirements into a deployment plan."}, {"id": "integrate-with-hr-devices-and-ecosystem", "name": "Integrate with HR, devices and the ecosystem", "howItSupports": "Describes the HDS and ISO 27001 hosting environments, EEA-only access and the identity model."}]}, {"step": "Choose shared or dedicated HDS SaaS", "description": "Decide between the shared HDS SaaS and a dedicated HDS tenant based on the workforce size, the sensitivity of the sites, the group's security policy and the budget, and agree the service levels.", "streamsNeeded": [{"id": "integrate-with-hr-devices-and-ecosystem", "name": "Integrate with HR, devices and the ecosystem", "howItSupports": "Offers the shared and dedicated HDS SaaS hosting environments and their tenant isolation."}, {"id": "deploy-migrate-and-train-a-customer", "name": "Deploy, migrate and train a customer", "howItSupports": "Configures the chosen environment during the configuration phase."}]}, {"step": "Connect SSO and the HRIS", "description": "Connect the group's identity provider for single sign-on and role mapping and the HRIS for the workforce synchronisation with the standard connectors, and validate the role model with the DPO.", "streamsNeeded": [{"id": "integrate-with-hr-devices-and-ecosystem", "name": "Integrate with HR, devices and the ecosystem", "howItSupports": "Provides the SSO and HRIS connectors and the role mapping."}, {"id": "maintain-workforce-and-exposure-data", "name": "Maintain workforce and exposure data", "howItSupports": "Receives the HRIS synchronisation that feeds the surveillance plan."}]}, {"step": "Migrate and go live through the four phases", "description": "Run the functional assessment, configuration, project management and training phases with Kitry, test the migration of the legacy files on a pilot site, run in parallel where needed and go live site by site with change management.", "streamsNeeded": [{"id": "deploy-migrate-and-train-a-customer", "name": "Deploy, migrate and train a customer", "howItSupports": "Runs the four-phase deployment, the data migration and the training and change management."}]}, {"step": "Operate on a subscription", "description": "Adopt the standard releases and regulatory updates, review the hosting and security reports, work with the account manager on the roadmap and escalate through support, without an internal development team.", "streamsNeeded": [{"id": "deploy-migrate-and-train-a-customer", "name": "Deploy, migrate and train a customer", "howItSupports": "Delivers ongoing regulatory updates, releases, support and account management."}, {"id": "monitor-health-and-safety-performance", "name": "Monitor health and safety performance", "howItSupports": "Reports platform adoption, release status and service usage to the service head."}]}], "media": [{"type": "image", "src": "media/jbtd-ohsm-jtbd-ohsm-3.png", "title": "Occupational Health Service Manager / Coordinator JTBD infographic: Run the service on certified, secure infrastructure without an IT project", "alt": "Enterprise infographic for the job \"Run the service on certified, secure infrastructure without an IT project\" for customer \"Occupational Health Service Manager / Coordinator\"."}]}], "customerJourneyStories": [{"id": "journey-ohsm-1", "name": "A public tender for a multi-site autonomous service", "linkedJobIds": ["jtbd-ohsm-1", "jtbd-ohsm-2", "jtbd-ohsm-3"], "summary": "The head of the autonomous occupational health service of a large French public authority with 50,000 agents, 30 directorates and eleven medical points replaces a discontinued on-premise application through a public tender and takes the service to Kitry on shared HDS SaaS.", "stages": [{"stage": "Trigger", "narrative": "The vendor of the on-premise medical file announces the end of support, the DREETS asks for coverage figures per directorate for the five-year agr\u00e9ment renewal of the autonomous service, the application has never met the interoperability requirement of the 2021 law that has applied since 1 January 2024, and the DPO refuses to extend the DPIA of a system hosted in the authority's own data centre without HDS certification. The service head is given one budget year to move."}, {"stage": "Discovery", "narrative": "The purchasing department opens the UGAP catalogue and the service head visits Pr\u00e9ventica Paris, where Kitry presents with a physician from a large city's occupational health service. Two heads of service in the public-sector network confirm they run Kitry, one since a migration from the same discontinued application. The service head reads the HDS and ISO 27001 certificates and the shared and dedicated SaaS options on kitry.com."}, {"stage": "Evaluation", "narrative": "The tender scores functional coverage of the French surveillance rules, the DMST model, the migration approach, HDS hosting with EEA-only access, SSO and HRIS connectors, the four-phase implementation and support, and price per agent. Reference calls with public transport and city services and the DPO's review of the hosting evidence carry the decision; Kitry wins with the shared HDS SaaS tier and a migration plan tested on a pilot site."}, {"stage": "Trial", "narrative": "One directorate with 3,000 agents and one medical point serves as the proof of concept: the legacy files are migrated in a test run and checked by the physicians, the surveillance rules for night work and safety-critical posts are configured with a Kitry consultant, the HRIS export is synchronised weekly, and the physicians and nurses run one month in parallel with the old system. The coverage figure for the directorate is available for the first time."}, {"stage": "Engagement", "narrative": "The eleven medical points go live in three waves over eight months with training per role, the HRIS connector replaces the weekly export, the service head runs the weekly compliance review from the dashboard, and the agr\u00e9ment renewal file is assembled from the analytics module with coverage per directorate and per surveillance category."}, {"stage": "Retention", "narrative": "The DREETS renews the agr\u00e9ment without reservation on records, the authority renews for four years and adds the Employee Portal to reach self-service booking for all agents, and the service head joins the Kitry public-sector user group that reviews the regulatory content releases."}], "media": [{"type": "image", "src": "media/journey-ohsm-ohsm-1.png", "title": "Occupational Health Service Manager / Coordinator customer journey: A public tender for a multi-site autonomous service", "alt": "Enterprise journey storyboard for \"A public tender for a multi-site autonomous service\" for customer \"Occupational Health Service Manager / Coordinator\"."}]}, {"id": "journey-ohsm-2", "name": "Moving a Benelux internal service to a dedicated HDS tenant and the Dutch sites", "linkedJobIds": ["jtbd-ohsm-3", "jtbd-ohsm-1"], "summary": "The head of the internal prevention service of a Belgian-headquartered industrial group with 18,000 workers in Belgium, Luxembourg and the Netherlands, a long-standing Kitry customer on shared SaaS, moves to a dedicated HDS tenant and extends the platform to the Dutch sites served by an arbodienst.", "stages": [{"stage": "Trigger", "narrative": "The group's ISO 27001 recertification and a new CISO policy require a dedicated environment and single sign-on for any system holding health data of more than 10,000 workers, the Dutch sites' arbodienst keeps PAGO/PMO results in its own system so the group cannot see coverage for a third of the workforce, and the works councils in the Netherlands ask what health data the group holds and where."}, {"stage": "Discovery", "narrative": "The service head hears about the dedicated HDS SaaS tier and the 'Kitry as a Service' transition from the Kitry account manager at the annual review, and about the Dutch market rollout from a Kitry presentation at the customer day after the Vortex partnership. A peer at a chemical group describes running Belgian and Dutch sites on one tenant with the Dutch regulation content."}, {"stage": "Evaluation", "narrative": "The service head compares staying on shared SaaS, moving to the dedicated tenant, and replacing the platform with the arbodienst's system. The CISO reviews the tenant isolation, the ISO 27001 scope and EEA-only access; the DPO updates the DPIA for the dedicated environment and the Dutch works councils receive the role model showing that managers never see medical content. The cost of the dedicated tier is compared with the risk of holding health data outside the group's certified environment."}, {"stage": "Trial", "narrative": "The Luxembourg entity, with 900 workers, moves first: its data is migrated to the dedicated tenant, SSO is connected to the group's identity provider, and the entity runs two months on the new tenant while the Belgian sites stay on shared SaaS. The Dutch sites follow with a pilot in which the arbodienst's bedrijfsarts documents PAGO results in the group tenant under a data processing agreement."}, {"stage": "Engagement", "narrative": "All Belgian, Luxembourg and Dutch sites run on the dedicated tenant with SSO and the HRIS connector, the arbodienst works in the group's platform for the Dutch sites, and the service head sees coverage for the whole workforce for the first time. The annual report of the internal service and the Dutch RI&E-linked health indicators come from the same analytics module."}, {"stage": "Retention", "narrative": "The group renews on a multi-year dedicated hosting contract, adds the Analytics module and the Manager Portal, and asks Kitry to add its Dutch arbodienst to the partner programme so that the external service can work in customer tenants as standard."}], "media": [{"type": "image", "src": "media/journey-ohsm-ohsm-2.png", "title": "Occupational Health Service Manager / Coordinator customer journey: Moving a Benelux internal service to a dedicated HDS tenant and the Dutch sites", "alt": "Enterprise journey storyboard for \"Moving a Benelux internal service to a dedicated HDS tenant and the Dutch sites\" for customer \"Occupational Health Service Manager / Coordinator\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-ohsm-top", "name": "Workforce surveillance coverage rate", "description": "Share of the workforce, across all sites and countries served by the service, that is in a surveillance plan and was examined within the legal periodicity for its surveillance category. Modeled seed values for a large European employer's internal service, informed by public occupational health statistics rather than official Kitry targets.", "unit": "%", "currentValue": "82", "targetValue": "97", "link": "https://dashboard.example.com/occupational-health-and-safety-platform/customers/ohsm/kpis/co-ohsm-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-ohsm-co-ohsm-top.png"}, "branches": [{"id": "co-ohsm-b1", "name": "Capacity and coverage", "description": "Whether the service'
