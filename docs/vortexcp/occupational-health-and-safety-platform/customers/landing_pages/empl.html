nt reviews with adoption and outcome dashboards for every customer and convert observed needs into expansions"]}, "year5": {"focus": "Assisted implementation and continuous customer success: migration mappings proposed from legacy data, configuration generated from the assessment under consultant review, regulatory change applied to customer configurations with automated impact analysis, and customer success measured on the prevention outcomes the platform makes visible.", "productTheme": "Assisted delivery, outcome-based customer success", "customerKPI": {"northStar": "Go-live on schedule rate", "supporting": ["Legacy records reconciled at first pass rate", "Regulatory update lead time"]}, "businessKPI": {"northStar": "Services gross margin", "revenueStreams": ["Assisted implementation and migration packages", "Outcome-based customer success and prevention advisory services", "European partner and acquisition-driven delivery"], "supporting": ["Consultant days per go-live", "Support cost per customer"]}, "milestones": ["Propose migration mappings and configuration from legacy data and assessment answers for consultant approval, halving consultant days per go-live", "Apply regulatory changes to customer configurations with automated impact analysis and customer acceptance in the workspace", "Tie customer success plans to surveillance compliance, self-service and accident outcomes visible on the customer's dashboards"]}}}, "domain": "Kitry Services and Content Teams"}];
    const customer = {"id": "empl", "name": "Employee", "description": "Any of the four million-plus workers whose employers run their occupational health and safety on the platform: a warehouse operator on night shifts at a logistics depot, a process operator at a chemical plant, a nurse in a hospital, a bus driver, a city gardener, a researcher in a laboratory or a bank clerk in France, Belgium, Luxembourg or the Netherlands. Meets the occupational health service a few times a year at most, usually because a convocation arrived, and wants the visit to cost as little time and worry as possible. Uses the employee portal, when the employer has rolled it out and the service has earned trust, to book and move visits, complete questionnaires privately, download certificates and attestations, join teleconsultations and health campaigns and report a hazardous situation. Cares above all that the employer, the manager and HR never see medical content, that the visit does not cost a day of travel or a lost shift, and that raising a safety concern leads to something. More than half of employees at Kitry's French, Belgian and Luxembourg customers use self-service features; the persona is written for those who do and those who have not yet been convinced.", "icon": "customer-empl-portrait.jpg", "careAbout": ["Being certain that questionnaire answers, examination results and anything said to the physician stay under medical secrecy, out of reach of the manager, HR and the employer", "Knowing when a visit is due and why, and choosing or moving the slot around shifts, childcare and workload without phoning anyone", "Losing as little working time as possible per visit, with teleconsultation when the physician allows it and screenings done in one pass", "Having certificates, attestations of exposure and vaccination records at hand when changing job, retiring or seeing a personal doctor", "Reporting a hazard or near miss from the floor in a minute and seeing that somebody took it on and fixed it", "Being able to ask for a visit on their own initiative, confidentially, when a symptom or a situation at work calls for it"], "winsThem": ["A portal invitation from the medical service, in the employee's language, that explains who sees what before asking for anything, backed by health-data hosting the works council has reviewed", "Booking, moving and confirming visits in a few taps on a phone, with SMS and e-mail reminders so nothing is missed and no letter has to be found", "Pre-visit questionnaires completed in private that make the consultation shorter and more relevant, and certificates available the same day", "Secure teleconsultation with the occupational physician from home or the site office for the visits that allow it, so a follow-up does not cost a day", "A safety reporting button with photo and location, with an acknowledgement, a named owner and closure feedback"], "theirFear": ["That an honest answer about alcohol, sleep, a chronic illness or stress ends up with the employer and costs a promotion, a shift or the job", "Being blamed or marked as difficult for reporting a hazard, or reporting one and seeing nothing happen", "A missed visit, an unrecognised accident or a lost certificate that becomes the employee's problem years later when a disease is recognised or a pension is calculated"], "jobsToBeDone": [{"id": "jtbd-empl-1", "name": "Attend my medical visit with minimal disruption", "whatItIs": "Get through the initial, periodic, return-to-work or exposure-related examination the employer's occupational health service requires with as little lost time, uncertainty and chasing as possible: know when a visit is due and why, choose or change the slot around shifts and workload, receive reminders that make the visit hard to forget, prepare what the nurse will ask in advance, do the visit remotely when the physician allows it, and get the fitness certificate afterwards without asking.", "outcome": "The employee is never surprised by a convocation, books or moves the visit in minutes from a phone, arrives prepared and on time, loses less than half a shift per visit, and has the certificate in the portal the same day, so that surveillance feels like a service rather than a summons.", "steps": [{"step": "Learn that a visit is due and why", "description": "Receive the convocation by e-mail, SMS or in the portal with the type of examination, the reason (periodic surveillance, change of workstation, return after absence, exposure to a specific risk), the location or teleconsultation option and the deadline, in the employee's language, instead of a paper letter handed over by the supervisor.", "streamsNeeded": [{"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Generates the convocation with the examination type, periodicity reason and deadline derived from the worker's profile."}, {"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Delivers the convocation in the employee portal with the booking link and the explanation of the visit."}]}, {"step": "Choose or change a slot around my shifts", "description": "Pick a slot that fits the shift pattern, the site and the physician or nurse assigned, move it when a production peak or a child's illness intervenes, and see that the manager has been asked to release the employee for the visit, all without phoning the medical secretariat.", "streamsNeeded": [{"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Offers self-service booking and rescheduling from the available slots for the employee's site and examination type."}, {"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Maintains the slots, physician and nurse capacity and the rules on how late a visit can be moved."}]}, {"step": "Get reminders and prepare in advance", "description": "Receive SMS and e-mail reminders before the visit, complete the pre-visit questionnaire on a phone in private, and see what to bring (glasses, hearing protection, vaccination record) so that the consultation starts with the questions that matter.", "streamsNeeded": [{"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Sends the SMS and e-mail reminders through the notification partners at the configured intervals."}, {"id": "conduct-examinations-and-teleconsultations", "name": "Conduct examinations and teleconsultations", "howItSupports": "Provides the pre-visit questionnaire that feeds the consultation workspace."}]}, {"step": "Attend in person or by teleconsultation", "description": "Go through the screenings and the consultation at the medical service, or join a secure teleconsultation from home or the site office when the physician has judged it appropriate for this type of visit, with identity verified and the session neither recorded nor visible to the employer.", "streamsNeeded": [{"id": "conduct-examinations-and-teleconsultations", "name": "Conduct examinations and teleconsultations", "howItSupports": "Runs the examination and the secure teleconsultation session with the physician."}, {"id": "integrate-with-hr-devices-and-ecosystem", "name": "Integrate with HR, devices and the ecosystem", "howItSupports": "Provides the telehealth integration and the measurement devices used during the visit."}]}, {"step": "Receive my certificate and know what happens next", "description": "Find the fitness certificate or attestation in the portal the same day, understand any restriction or follow-up visit, and know that the manager has received only the employer-facing version.", "streamsNeeded": [{"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Stores the certificate in the employee's file and releases the employee's copy."}, {"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Makes the certificate available for download and shows the next scheduled visit."}]}], "media": [{"type": "image", "src": "media/jbtd-empl-jtbd-empl-1.png", "title": "Employee JTBD infographic: Attend my medical visit with minimal disruption", "alt": "Enterprise infographic for the job \"Attend my medical visit with minimal disruption\" for customer \"Employee\"."}]}, {"id": "jtbd-empl-2", "name": "Access my own health documents and complete questionnaires privately", "whatItIs": "Exercise the employee's rights over their own occupational health information: read and download fitness certificates, attestations of exposure, vaccination records and the documents the physician chooses to share; complete medical, exposure and well-being questionnaires in private rather than on paper in the workshop; give or withdraw consent for specific uses such as teleconsultation or transfer of the file to another service; and be certain that the employer, the manager and HR cannot see any of it.", "outcome": "The employee has their occupational health documents at hand when changing employer, retiring or seeing their own doctor, answers questionnaires honestly because nobody at the workplace can read them, and trusts the service enough to use it, which is the condition for self-service adoption above half of the workforce.", "steps": [{"step": "Activate my account and understand who sees what", "description": "Activate the portal account from the invitation sent by the employer or through the company single sign-on, read the plain-language notice on medical secrecy, GDPR rights and the separation between the medical file and the employer-facing information, and see the list of roles that can access each type of document.", "streamsNeeded": [{"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Provides the account activation, the privacy notice and the role-based visibility of documents."}, {"id": "integrate-with-hr-devices-and-ecosystem", "name": "Integrate with HR, devices and the ecosystem", "howItSupports": "Supports SSO and multi-factor authentication with the employer's identity provider."}]}, {"step": "Complete questionnaires in private", "description": "Answer the pre-visit, exposure, night-work, musculoskeletal or psychosocial questionnaires from a personal phone or a kiosk, save and resume, and know that the answers go straight to the physician's consultation workspace under medical secrecy.", "streamsNeeded": [{"id": "conduct-examinations-and-teleconsultations", "name": "Conduct examinations and teleconsultations", "howItSupports": "Delivers the questionnaires configured for the visit type and feeds the answers to the consultation."}, {"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Stores questionnaire responses in the confidential medical file, not in employer systems."}]}, {"step": "Read and download my documents", "description": "Find fitness certificates, exposure attestations, vaccination records and the documents the physician has shared, download them as signed PDFs, and request a copy of the medical file or its transfer to a new occupational health service when changing employer.", "streamsNeeded": [{"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Holds the documents, the e-signed certificates and the file transfer procedure between services."}, {"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Presents the employee's documents and the request form for copies and transfers."}]}, {"step": "Manage my consents and contact preferences", "description": "Give or withdraw consent for teleconsultation, for SMS reminders to a personal number, for participation in health campaigns and collective health studies, and see the history of consents and accesses to the file where the law provides for it.", "streamsNeeded": [{"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Lets the employee manage consents and contact preferences from the portal."}, {"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Records consents and the access log against the medical file."}]}], "media": [{"type": "image", "src": "media/jbtd-empl-jtbd-empl-2.png", "title": "Employee JTBD infographic: Access my own health documents and complete questionnaires privately", "alt": "Enterprise infographic for the job \"Access my own health documents and complete questionnaires privately\" for customer \"Employee\"."}]}, {"id": "jtbd-empl-3", "name": "Raise a safety concern and see it acted on", "whatItIs": "Report a hazardous situation, a near miss, a defective piece of equipment or a health complaint linked to the work, from the floor and in the moment, without having to find the right person or fill in a paper form, and then see that the report was received, assigned, acted upon and closed, so that reporting feels worthwhile rather than futile.", "outcome": "The employee reports in under two minutes with a photo and a location, gets an acknowledgement, can follow the corrective action to closure with feedback, and, where the situation touches health, can ask for a visit with the occupational physician, which builds the reporting culture the prevention adviser needs.", "steps": [{"step": "Report the situation from where I am", "description": "Open the portal on a phone, describe the hazard or near miss, add a photo and the workstation or location, choose whether to report anonymously where the employer allows it, and submit; for an immediate danger use the right to withdraw and mark the report as urgent.", "streamsNeeded": [{"id": "report-and-resolve-hazardous-situations", "name": "Report and resolve hazardous situations", "howItSupports": "Captures the field report with location, photo and urgency and routes it to the responsible person."}, {"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Provides the reporting form in the employee portal, including anonymous reporting where configured."}]}, {"step": "Get an acknowledgement and see who is handling it", "description": "Receive confirmation that the report exists, the name or role of the person it was assigned to, and the expected response time, instead of wondering whether the e-mail was read.", "streamsNeeded": [{"id": "report-and-resolve-hazardous-situations", "name": "Report and resolve hazardous situations", "howItSupports": "Assigns the report, records the responsible person and the target response time."}, {"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Shows the status of the employee's own reports in the portal."}]}, {"step": "Follow the corrective action to closure", "description": "See the action decided, its due date and its closure with evidence, comment if the fix did not work, and see the situation reflected in the workstation's risk assessment when it changes the exposure.", "streamsNeeded": [{"id": "report-and-resolve-hazardous-situations", "name": "Report and resolve hazardous situations", "howItSupports": "Tracks the corrective action from assignment to closure with evidence and reopening."}, {"id": "assess-and-control-workplace-risks", "name": "Assess and control workplace risks", "howItSupports": "Updates the risk assessment of the workstation when the reported situation changes its risk."}]}, {"step": "Ask for a visit when my health is affected", "description": "Request a spontaneous visit with the occupational physician, on the employee's own initiative and without going through the manager, when a symptom, an exposure or a psychosocial situation calls for it, and have the request handled confidentially.", "streamsNeeded": [{"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Schedules the employee-requested visit without exposing the reason to the employer."}, {"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Keeps the request and its outcome within the confidential medical file."}]}], "media": [{"type": "image", "src": "media/jbtd-empl-jtbd-empl-3.png", "title": "Employee JTBD infographic: Raise a safety concern and see it acted on", "alt": "Enterprise infographic for the job \"Raise a safety concern and see it acted on\" for customer \"Employee\"."}]}], "customerJourneyStories": [{"id": "journey-empl-1", "name": "From a convocation letter to booking my own visit", "linkedJobIds": ["jtbd-empl-1", "jtbd-empl-2"], "summary": "A warehouse operator at a French logistics site, used to paper convocations handed over by the supervisor, is invited to the employee portal by the company's occupational health service, moves her own visit, completes the questionnaire on her phone and ends up preferring the portal for every contact with the service.", "stages": [{"stage": "Trigger", "narrative": "A periodic visit convocation arrives as a printed letter with a fixed date in the middle of a night-shift week, and the operator has to phone the medical secretariat twice during working hours to move it. Two colleagues missed their visits the same month because the letter reached them late. The service has just gone live on Kitry and decides that the next convocations will be sent through the employee portal."}, {"stage": "Discovery", "narrative": "The next convocation comes as an e-mail and an SMS from the occupational health service with a link to activate a personal account, together with a poster in the break room and a short message from the nurse at the shift briefing explaining that the portal belongs to the medical service, not to HR, and that it lets employees pick their own slot."}, {"stage": "Evaluation", "narrative": "The operator hesitates: will the questionnaire answers be visible to the supervisor, and why does the company need a personal phone number? She reads the privacy notice on the activation page, sees the list of roles that can see each document, and asks the nurse, who explains that the file is under medical secrecy on certified health-data hosting and that the manager only ever sees the fitness conclusion. A colleague from the union confirms the works council reviewed the setup."}, {"stage": "Trial", "narrative": "She activates the account with the company login, moves the visit to a morning after her night-shift week in three taps, receives an SMS reminder two days before, and fills in the pre-visit questionnaire on the bus. At the visit the nurse already has her answers and the consultation is shorter; the fitness certificate appears in the portal the same afternoon."}, {"stage": "Engagement", "narrative": "Over the following year she downloads her certificate when she applies for an internal transfer, joins the flu vaccination campaign from the portal, does a follow-up on a shoulder complaint by teleconsultation from home, and files a report about a damaged racking upright with a photo, which she watches move from assigned to closed within a week."}, {"stage": "Retention", "narrative": "At the next periodic convocation she books directly from the notification without contacting anyone, and tells new colleagues on her shift to activate their accounts. Self-service bookings at the site pass three quarters of visits, and the medical secretariat stops printing letters except for the few workers who ask for them."}], "media": [{"type": "image", "src": "media/journey-empl-empl-1.png", "title": "Employee customer journey: From a convocation letter to booking my own visit", "alt": "Enterprise journey storyboard for \"From a convocation letter to booking my own visit\" for customer \"Employee\"."}]}, {"id": "journey-empl-2", "name": "Onboarding at a Belgian chemical site with the portal from day one", "linkedJobIds": ["jtbd-empl-1", "jtbd-empl-3"], "summary": "A new process operator hired at a Belgian chemical plant receives his employee portal invitation with the onboarding pack, completes the pre-employment health assessment through it, and comes to rely on the portal for questionnaires, safety reports and shift-friendly teleconsultations.", "stages": [{"stage": "Trigger", "narrative": "Before his first day the new hire is told that a pre-employment health assessment with the company's internal prevention service is mandatory for a workstation with chemical exposure, and that he cannot be put to work on that workstation until the physician has issued the fitness opinion. He expects a paper form and a queue at the medical service."}, {"stage": "Discovery", "narrative": "The onboarding e-mail from HR contains the portal invitation generated when his record arrived from the HRIS, a two-minute video from the internal prevention service showing booking, questionnaires and the safety reporting button, and the site's welcome session where the prevention adviser shows the portal on the screen next to the emergency plan."}, {"stage": "Evaluation", "narrative": "He wonders how much the company will learn about his health from the questionnaire and whether reporting a hazard will mark him as a troublemaker in his first month. The portal's Dutch-language privacy notice, the explanation that the medical file is separate from the employer's systems and readable only by the physician and nurse, and the option to report hazardous situations anonymously answer the first worry; a colleague's story of a fixed ventilation problem answers the second."}, {"stage": "Trial", "narrative": "He completes the exposure questionnaire and the pre-employment assessment questionnaire on his phone the evening before, books the slot suggested for the induction week, and attends the assessment with audiometry and spirometry captured directly by the connected devices. The fitness opinion for the chemical workstation is in the portal that evening and the shift leader confirms his start on the unit the next morning."}, {"stage": "Engagement", "narrative": "During the first year he uses the portal to report a leaking valve seal with a photo from the plant floor, sees it assigned to the shift leader and closed with a replacement part, joins a hepatitis vaccination campaign, and has a follow-up on a skin complaint by teleconsultation from the control room during a night shift rather than losing a day."}, {"stage": "Retention", "narrative": "When he moves to a different unit two years later, his workstation change arrives from the HRIS and the portal shows the new periodic visit already planned; he books it in a minute and downloads his exposure attestation for his own records. He is one of the operators the prevention adviser cites when the works council asks whether people actually use the reporting function."}], "media": [{"type": "image", "src": "media/journey-empl-empl-2.png", "title": "Employee customer journey: Onboarding at a Belgian chemical site with the portal from day one", "alt": "Enterprise journey storyboard for \"Onboarding at a Belgian chemical site with the portal from day one\" for customer \"Employee\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-empl-top", "name": "Visit self-service rate", "description": "Share of medical visits booked, rescheduled or confirmed by the employee through the portal without contacting the medical secretariat by phone or e-mail. Kitry reports that more than half of employees at its French, Belgian and Luxembourg customers use self-service; the values here are modeled seeds for a large employer, not an official Kitry figure.", "unit": "%", "currentValue": "52", "targetValue": "75", "link": "https://dashboard.example.com/occupational-health-and-safety-platform/customers/empl/kpis/co-empl-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-empl-co-empl-top.png"}, "branches": [{"id": "co-empl-b1", "name": "Effortless visits", "description": "How little time and effort a visit costs the employee, from convocation to certificate.", "currentValue": "58", "icon": "kpi-empl-co-empl-b1.png", "children": [{"id": "co-empl-b1-c1", "name": "Appointment rescheduling effort", "description": "Average minutes an employee spends to move a visit, including calls, e-mails and portal time, measured by survey and portal timing.", "unit": "minutes per reschedule", "currentValue": "12", "targetValue": "2", "icon": "kpi-empl-co-empl-b1-c1.png", "children": [{"id": "co-empl-b1-c1-l1", "name": "Reschedules completed in the portal share", "description": "Share of visit changes made by the employee in the portal rather than by the secretariat on the employee's request.", "unit": "%", "currentValue": "48", "targetValue": "80", "icon": "kpi-empl-co-empl-b1-c1-l1.png", "children": []}, {"id": "co-empl-b1-c1-l2", "name": "Visit no-show rate", "description": "Share of scheduled visits the employee does not attend without prior rescheduling.", "unit": "%", "currentValue": "11", "targetValue": "4", "icon": "kpi-empl-co-empl-b1-c1-l2.png", "children": []}]}, {"id": "co-empl-b1-c2", "name": "Time away from work per visit", "description": "Average minutes an employee is away from the workstation for a visit, including travel and waiting; driven down by questionnaires completed beforehand and by visits held remotely.", "unit": "minutes", "currentValue": "95", "targetValue": "60", "icon": "kpi-empl-co-empl-b1-c2.png", "children": [{"id": "co-empl-b1-c2-l1", "name": "Questionnaire completed before visit rate", "description": "Share of visits for which the employee completed the pre-visit questionnaire in the portal before arriving or joining, which shortens the consultation.", "unit": "%", "currentValue": "45", "targetValue": "80", "icon": "kpi-empl-co-empl-b1-c2-l1.png", "children": []}, {"id": "co-empl-b1-c2-l2", "name": "Teleconsultation share of eligible visits", "description": "Share of visits the physician has classified as eligible for teleconsultation that are actually held remotely.", "unit": "%", "currentValue": "18", "targetValue": "45", "icon": "kpi-empl-co-empl-b1-c2-l2.png", "children": []}]}]}, {"id": "co-empl-b2", "name": "Trust and voice", "description": "Whether employees trust the portal with their health information and whether their safety reports lead to action.", "currentValue": "55", "icon": "kpi-empl-co-empl-b2.png", "children": [{"id": "co-empl-b2-c1", "name": "Employee trust in confidentiality", "description": "Survey score on which employees rate their confidence that their occupational health information is not visible to their employer or manager.", "unit": "score (1-10)", "currentValue": "7.2", "targetValue": "8.5", "icon": "kpi-empl-co-empl-b2-c1.png", "children": [{"id": "co-empl-b2-c1-l1", "name": "Employees with an activated portal account", "description": "Share of employees invited to the portal who have activated their account and logged in at least once.", "unit": "%", "currentValue": "58", "targetValue": "85", "icon": "kpi-empl-co-empl-b2-c1-l1.png", "children": []}, {"id": "co-empl-b2-c1-l2", "name": "Documents downloaded per employee per year", "description": "Average number of certificates, attestations and shared documents an employee downloads per year, a proxy for the portal being the place they keep their health documents.", "unit": "documents per employee per year", "currentValue": "0.9", "targetValue": "2.0", "icon": "kpi-empl-co-empl-b2-c1-l2.png", "children": []}]}, {"id": "co-empl-b2-c2", "name": "Safety report response time", "description": "Hours from an employee's hazardous situation report to its acknowledgement and assignment to a responsible person.", "unit": "hours", "currentValue": "72", "targetValue": "24", "icon": "kpi-empl-co-empl-b2-c2.png", "children": [{"id": "co-empl-b2-c2-l1", "name": "Safety reports per 1,000 employees per year", "description": "Number of hazardous situations, near misses and equipment defects reported through the portal per thousand employees per year, a measure of reporting culture.", "unit": "reports per 1,000 employees per year", "currentValue": "35", "targetValue": "90", "icon": "kpi-empl-co-empl-b2-c2-l1.png", "children": []}, {"id": "co-empl-b2-c2-l2", "name": "Safety reports closed with feedback to reporter rate", "description": "Share of employee reports closed with a recorded action and a closure notification visible to the reporter.", "unit": "%", "currentValue": "60", "targetValue": "90", "icon": "kpi-empl-co-empl-b2-c2-l2.png", "children": []}]}]}]}, "businessOutcomes": {"top": {"id": "bo-empl-top", "name": "Portal module attach rate", "description": "Share of customer organisations whose subscription includes the Employee and Manager Portals module, the entry point for self-service and the channel through which the platform reaches every employee. Modeled seed value for the installed base, not a reported Kitry figure.", "unit": "%", "currentValue": "55", "targetValue": "85", "link": "https://dashboard.example.com/occupational-health-and-safety-platform/customers/empl/kpis/bo-empl-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-empl-bo-empl-top.png"}, "branches": [{"id": "bo-empl-b1", "name": "Portal reach", "description": "How many employees the portals reach and how much of their contact with the service moves online.", "currentValue": "57", "icon": "kpi-empl-bo-empl-b1.png", "children": [{"id": "bo-empl-b1-c1", "name": "Portal-enabled workforce", "description": "Number of employee records at customers with the portal module live, out of the 4 million-plus employee records tracked on the platform.", "unit": "million employees", "currentValue": "1.8", "targetValue": "3.2", "icon": "kpi-empl-bo-empl-b1-c1.png", "children": [{"id": "bo-empl-b1-c1-l1", "name": "Portal rollout time per customer", "description": "Working days from portal activation in the tenant to invitations sent to the whole workforce.", "unit": "working days", "currentValue": "45", "targetValue": "20", "icon": "kpi-empl-bo-empl-b1-c1-l1.png", "children": []}, {"id": "bo-empl-b1-c1-l2", "name": "SSO-enabled portal customers share", "description": "Share of portal customers whose employees log in through the employer's identity provider rather than separate credentials.", "unit": "%", "currentValue": "40", "targetValue": "80", "icon": "kpi-empl-bo-empl-b1-c1-l2.png", "children": []}]}, {"id": "bo-empl-b1-c2", "name": "Teleconsultation module attach rate", "description": "Share of customer organisations that have activated the integrated secure teleconsultation for employees.", "unit": "%", "currentValue": "20", "targetValue": "55", "icon": "kpi-empl-bo-empl-b1-c2.png", "children": [{"id": "bo-empl-b1-c2-l1", "name": "Teleconsultations per 1,000 employees per year", "description": "Number of teleconsultation sessions held per thousand employees per year across teleconsultation customers.", "unit": "sessions per 1,000 employees per year", "currentValue": "25", "targetValue": "80", "icon": "kpi-empl-bo-empl-b1-c2-l1.png", "children": []}, {"id": "bo-empl-b1-c2-l2", "name": "Teleconsultation customers live", "description": "Number of customer organisations with teleconsultation in production use.", "unit": "customers", "currentValue": "30", "targetValue": "85", "icon": "kpi-empl-bo-empl-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-empl-b2", "name": "Cost to serve and expansion", "description": "Whether self-service lowers the cost of every visit for the customer and Kitry, and whether portals drive renewals and upsell.", "currentValue": "60", "icon": "kpi-empl-bo-empl-b2.png", "children": [{"id": "bo-empl-b2-c1", "name": "Secretariat cost per visit", "description": "Modeled cost of medical secretariat time per scheduled visit at customers, the saving self-service delivers and the argument for the portal subscription.", "unit": "EUR per visit", "currentValue": "9", "targetValue": "4", "icon": "kpi-empl-bo-empl-b2-c1.png", "children": [{"id": "bo-empl-b2-c1-l1", "name": "Secretariat minutes per booking", "description": "Average minutes of secretariat time spent per booking or change, across portal and phone channels.", "unit": "minutes", "currentValue": "6", "targetValue": "2", "icon": "kpi-empl-bo-empl-b2-c1-l1.png", "children": []}, {"id": "bo-empl-b2-c1-l2", "name": "Reminder messages per visit", "description": "Average SMS and e-mail reminders sent per visit through the notification partners, a cost and a no-show lever.", "unit": "messages per visit", "currentValue": "2.4", "targetValue": "2.0", "icon": "kpi-empl-bo-empl-b2-c1-l2.png", "children": []}]}, {"id": "bo-empl-b2-c2", "name": "Portal customer net revenue retention", "description": "Subscription revenue this year from last year's portal customers, including added modules and workforce growth, as a share of last year's revenue from the same customers.", "unit": "%", "currentValue": "105", "targetValue": "115", "icon": "kpi-empl-bo-empl-b2-c2.png", "children": [{"id": "bo-empl-b2-c2-l1", "name": "Portal customer renewal rate", "description": "Share of customers with the portal module that renew their subscription at term.", "unit": "%", "currentValue": "94", "targetValue": "98", "icon": "kpi-empl-bo-empl-b2-c2-l1.png", "children": []}, {"id": "bo-empl-b2-c2-l2", "name": "Teleconsultation upsells per year", "description": "Number of existing portal customers that add teleconsultation in the year.", "unit": "upsells per year", "currentValue": "10", "targetValue": "25", "icon": "kpi-empl-bo-empl-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Give every employee of every customer a private, trusted place for their occupational health: visits booked around their life, questionnaires answered honestly because nobody at work can read them, documents at hand, teleconsultations that spare a day of travel, and safety concerns that are visibly acted on.", "timeHorizons": {"year1": {"focus": "Make the portal the default channel for visits at every customer: self-service booking and rescheduling, SMS and e-mail reminders, pre-visit questionnaires, teleconsultation as a standard module and safety reporting from the phone, with a privacy experience that earns trust in the first session.", "productTheme": "Self-service visits people trust", "customerKPI": {"northStar": "Visit self-service rate", "supporting": ["Appointment rescheduling effort", "Employees with an activated portal account"]}, "businessKPI": {"northStar": "Portal module attach rate", "revenueStreams": ["Employee and Manager Portals module subscriptions", "Integrated teleconsultation module subscriptions", "SMS and notification volumes"], "supporting": ["Portal-enabled workforce", "Teleconsultation module attach rate"]}, "milestones": ["Ship teleconsultation and the manager portal as standard modules with the employee portal in every new subscription", "Release a mobile-first booking, rescheduling and reminder flow with SSO through the employer's identity provider", "Redesign account activation and the privacy notice in French, Dutch and English so that most invited employees activate within the first month"]}, "year3": {"focus": "Make the portal the employee's occupational health record and voice: documents, consents, campaigns and file transfers between services, hazardous situation reporting with feedback to the reporter, and portal adoption above three quarters of visits at every customer in France, Benelux and the Netherlands.", "productTheme": "The employee's health record and voice", "customerKPI": {"northStar": "Visit self-service rate", "supporting": ["Safety report response time", "Questionnaire completed before visit rate"]}, "businessKPI": {"northStar": "Portal customer net revenue retention", "revenueStreams": ["Portal and teleconsultation subscriptions sized on workforce", "Health campaign and vaccination modules", "Dutch market portal packages with arbodienst integration"], "supporting": ["Teleconsultations per 1,000 employees per year", "Portal customer renewal rate"]}, "milestones": ["Deliver employee document access, consent management and file transfer requests aligned with the French DMST interoperability rules", "Close the loop on employee safety reports with assignment, status and closure feedback visible to the reporter", "Launch the portal in Dutch for the Netherlands with the local arbodienst and identity conventions"]}, "year5": {"focus": "A continuous, personal relationship with the occupational health service: proactive prompts when exposure or life events change what is due, assisted triage of employee questions under physician supervision, interoperable files that follow the employee across employers and countries, and prevention content tailored to the workstation.", "productTheme": "Continuous personal prevention", "customerKPI": {"northStar": "Visit self-service rate", "supporting": ["Employee trust in confidentiality", "Teleconsultation share of eligible visits"]}, "businessKPI": {"northStar": "Portal module attach rate", "revenueStreams": ["Workforce-sized platform subscriptions including portals", "Teleconsultation and telehealth partner services", "Personal prevention and campaign content subscriptions"], "supporting": ["Secretariat cost per visit", "Teleconsultation upsells per year"]}, "milestones": ["Prompt employees proactively when a workstation change, exposure or absence changes their surveillance, with one-tap booking", "Offer assisted triage of employee health and safety questions reviewed by the nurse or physician before any answer", "Support interoperable transfer of the employee's occupational medical file across services and     const customerInsights = [{"id": "ohs-02", "title": "More than half of employees at Kitry's French, Belgian and Luxembourg customers already use self-service, so the portal carries the consultation day", "summary": "Kitry reports that 50%+ of employees at its FR/BE/LU customers use the self-service portals. The occupational health module offers a web calendar with online booking and automated SMS reminders, interactive web questionnaires that prepare the visit, secure teleconsultation with real-time document sharing and integrated signature, automated import of results from connected measurement devices, and a separate Employee and Manager Portals module.", "implication": "Treat self-service rate as a north-star metric per customer rather than a nice-to-have: every appointment an employee books, moves or prepares online removes nurse administration, reduces no-shows and makes the physician's slot productive, while the manager portal must show fitness status and restrictions without ever exposing medical content.", "priority": "high", "tags": ["self-service", "portals", "adoption"], "sources": [{"id": "kitry-home", "title": "Kitry \u2014 occupational health and safety software (home)", "url": "https://www.kitry.com/", "publisher": "Kitry", "date": "2026-09-05"}, {"id": "kitry-oh-module", "title": "Kitry \u2014 Module Sant\u00e9 au travail", "url": "https://kitry.com/fr/modules/sante-au-travail", "publisher": "Kitry", "date": "2026-09-05"}], "link": {"customerId": "empl", "jobIds": ["jtbd-empl-1", "jtbd-empl-2"], "kpiIds": ["co-empl-top", "co-empl-b1"]}}, {"id": "ohs-03", "title": "France's 2021 prevention law and the 2022 DMST decree fix the medical file's content, access rules, 40-year retention and inter-service transfer, and mandate interoperable occupational health systems", "summary": "Law 2021-1018 of 2 August 2021 strengthens prevention in occupational health: it defines the dossier m\u00e9dical en sant\u00e9 au travail (DMST), introduces the prevention passport in which the employer records training attestations, and requires that information systems used by occupational health professionals conform to interoperability standards, with the relevant provisions entering into force no later than 1 January 2024. Decree 2022-1434 of 15 November 2022 specifies the DMST content (identity, current and past exposures, health information from visits, opinions and recommendations), access and delegation rules with every action traced and time-stamped, the worker's right to oppose access and sharing, retention for forty years from the last visit, hosting with approved organisations, transfer between services, and compliance of existing files by 31 March 2023.", "implication": "The medical file brick and its confidentiality model are regulated artefacts: implement the DMST structure, role-based access with full audit trail, worker opposition and consent, interoperability standards and inter-service transfer as product features maintained by the regulatory content team, and use each legal change as a release event that keeps customers current rather than a per-customer project.", "priority": "high", "tags": ["regulation", "france", "medical-file", "interoperability"], "sources": [{"id": "legifrance-law-2021-1018", "title": "Loi n\u00b0 2021-1018 du 2 ao\u00fbt 2021 pour renforcer la pr\u00e9vention en sant\u00e9 au travail", "url": "https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000043884445", "publisher": "L\u00e9gifrance", "date": "2021-08-02"}, {"id": "legifrance-decree-2022-1434", "title": "D\u00e9cret n\u00b0 2022-1434 du 15 novembre 2022 relatif au dossier m\u00e9dical en sant\u00e9 au travail", "url": "https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000046562060", "publisher": "L\u00e9gifrance", "date": "2022-11-15"}], "link": {"customerId": "empl", "jobIds": ["jtbd-empl-2"], "kpiIds": ["co-empl-top"]}}, {"id": "ohs-10", "title": "About 2.7 million French private-sector employees report exposure to at least one carcinogenic chemical, so chemical inventory, exposure groups and enhanced surveillance must share one record", "summary": "INRS cites the SUMER 2017 survey: about 11% of France's active population, 2.7 million private-sector employees, report exposure at work to at least one carcinogenic chemical agent. The employer must inventory products and work situations that may expose workers to CMR agents, remove or substitute them whenever technically possible, and track and control remaining exposure. Kitry's safety module includes a centralised chemical product inventory with safety data sheets and chemical risk evaluation, management of homogeneous exposure groups (GHE) and workstations with their risks and PPE, and measurement campaigns for noise, dust, vibrations and air quality.", "implication": "Link every chemical product and measurement campaign to workstations and exposure groups so that CMR exposure automatically places workers under enhanced surveillance, populates the exposure history in the medical file and survives forty years for later occupational disease claims; this traceability chain is what an inspector and a Fedris or Ameli case will ask for.", "priority": "high", "tags": ["chemicals", "exposure", "traceability"], "sources": [{"id": "inrs-cmr", "title": "Agents chimiques CMR \u2014 Ce qu'il faut retenir", "url": "https://www.inrs.fr/risques/cmr-agents-chimiques/ce-qu-il-faut-retenir.html", "publisher": "INRS", "date": "2026-09-05"}, {"id": "kitry-safety-module", "title": "Kitry \u2014 Module S\u00e9curit\u00e9 au travail", "url": "https://kitry.com/fr/modules/securite-au-travail", "publisher": "Kitry", "date": "2026-09-05"}], "link": {"customerId": "empl", "jobIds": ["jtbd-empl-3"], "kpiIds": ["co-empl-top"]}}];

    function jobNamesForCustomer(jobIds) {
        const jobs = (customer.jobsToBeDone || []);
        const jobLookup = {};
        jobs.forEach(job => {
            if (job.id) {
                jobLookup[job.id] = job.name || job.id;
            }
        });
        return (jobIds || []).map(jobId => jobLookup[jobId] || jobId);
    }

    function kpiNamesForLink(link) {
        // Prefer stable KPI IDs resolved against this customer's KPI pyramid; fall back to legacy display-name kpis.
        if (link && link.kpiIds && link.kpiIds.length) {
            const lookup = {};
            function walk(node) {
                if (!node) return;
                if (node.id) {
                    lookup[node.id] = node.name || node.id;
                }
                (node.branches || []).forEach(walk);
                (node.children || []).forEach(walk);
            }
            const pyramids = (customer || {}).kpiPyramids || {};
            ['customerOutcomes', 'businessOutcomes'].forEach(key => {
                const pyramid = pyramids[key];
                if (!pyramid) return;
                walk(pyramid.top);
                (pyramid.branches || []).forEach(walk);
            });
            return link.kpiIds.map(kpiId => lookup[kpiId] || kpiId);
        }
        return (link && link.kpis) || [];
    }

        html += '</div>';

        html += '</div>';

        html += '</td>';
        html += '</tr>';

    function normalizeRoadmapKpi(value, supportingKey) {
        if (!value) {
            return {northStar: '', [supportingKey]: []};
        }
        if (typeof value === 'string') {
            return {northStar: value, [supportingKey]: []};
        }
        const normalized = Object.assign({}, value);
        normalized.northStar = normalized.northStar || normalized.name || '';
        normalized[supportingKey] = normalized[supportingKey] || [];
        return normalized;
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function formatDate(dateValue) {
        if (!dateValue) return 'No date';
        const date = new Date(dateValue + 'T00:00:00');
        if (isNaN(date.getTime())) return dateValue;
        return date.toLocaleDateString('en-GB', {year: 'numeric', month: 'short', day: 'numeric'});
    }

    function renderKpis(items) {
        let html = '';
        items.forEach(item => {
            html += '<div><b>' + escapeHtml(item.kpi) + '</b>';
            if (item.unit) {
                html += ' <span class="activity-muted">(' + escapeHtml(item.unit) + ')</span>';
            }
            if (item.expectedImpact) {
                html += ': ' + escapeHtml(item.expectedImpact);
            }
            if (item.currentValue) {
                html += '<div class="activity-muted"><b>Current:</b> ' + escapeHtml(String(item.currentValue)) + '</div>';
            }
            if (item.description) {
                html += '<div class="activity-muted">' + escapeHtml(item.description) + '</div>';
            }
            if (item.link) {
                html += '<div class="activity-muted"><a target="_blank" rel="noopener noreferrer" href="' + escapeHtml(item.link) + '">' + escapeHtml(item.linkLabel || 'Open link') + '</a></div>';
            }
            html += '</div>';
        });
        return html;
    }

    function renderImpactCell(item, currentCustomerId) {
        let html = '';
        (item.customerImpact || []).forEach(impact => {
            const isCurrent = impact.customerId === currentCustomerId;
            html += '<div class="activity-block' + (isCurrent ? ' activity-pill-highlight' : '') + '">';
            html += '<div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">';
            html += '<img class="activity-icon activity-icon-round" src="../icons/' + escapeHtml(impact.customer.icon) + '" onerror="this.onerror=null;this.src=\'../icons/customer.png\'">';
            html += '<div><div style="font-weight:bold; color:' + (isCurrent ? '#1d4ed8' : '#111827') + '">' + escapeHtml(impact.customer.name) + ' <span class="activity-muted">(' + escapeHtml(impact.customerId) + ')</span></div></div>';
            html += '</div>';
            html += renderKpis(impact.customerKPIs || []);
            html += renderKpis(impact.businessKPIs || []);
            html += '</div>';
        });
        return html || '<span class="activity-muted">No customer impact listed</span>';
    }

    function renderBrickCell(item) {
        let html = '';
        (item.productBricks || []).forEach(brick => {
            html += '<div class="activity-pill">';
            html += '<img class="activity-icon" src="../../product-bricks/icons/' + escapeHtml(brick.brick.icon) + '" onerror="this.onerror=null;this.src=\'../../product-bricks/icons/logo.png\'">';
            html += '<div><div><b>' + escapeHtml(brick.brick.name) + '</b> <span class="activity-muted">(#' + escapeHtml(brick.brickId) + ')</span></div><div class="activity-muted">' + escapeHtml(brick.change) + '</div></div>';
            html += '</div>';
        });
        return html || '<span class="activity-muted">No product bricks listed</span>';
    }

    function renderChannelCell(item) {
        let html = '';
        (item.deliveryChannels || []).forEach(channel => {
            html += '<div class="activity-pill">';
            html += '<img class="activity-icon" src="../../product-deployments/icons/' + escapeHtml(channel.channel.icon) + '" onerror="this.onerror=null;this.src=\'../../product-deployments/icons/product.png\'">';
            html += '<div><div><b>' + escapeHtml(channel.channel.name) + '</b> <span class="activity-muted">(' + escapeHtml(channel.channelId) + ')</span></div><div class="activity-muted">' + escapeHtml(channel.change) + '</div></div>';
            html += '</div>';
        });
        return html || '<span class="activity-muted">No delivery channels listed</span>';
    }

    function renderActivityTable(data, kind, currentCustomerId) {
        const items = (data && data.items) ? data.items : [];
        let html = '';
        html += '<div class="activity-summary">';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.length + '</div><div class="activity-stat-label">' + kind + '</div></div>';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.filter(item => (item.customerImpact || []).length > 0).length + '</div><div class="activity-stat-label">With customer impact</div></div>';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.filter(item => (item.productBricks || []).length > 0).length + '</div><div class="activity-stat-label">With bricks</div></div>';
        html += '</div>';

        if (!items.length) {
            html += '<div class="group" style="margin-top:0">No related ' + kind.toLowerCase() + ' found for this customer.</div>';
            return html;
        }

        html += '<table class="activity-table">';
        html += '<tr><th>Date</th><th>Description</th><th>Customer Impact</th><th>Product Bricks</th><th>Delivery Channels</th></tr>';
        items.forEach(item => {
            html += '<tr>';
            html += '<td style="white-space:nowrap">' + escapeHtml(formatDate(item.date)) + '</td>';
            html += '<td><a class="activity-link" target="_blank" rel="noopener noreferrer" href="../../' + kind.toLowerCase() + '/landing_pages/' + item.landingPageIndex + '.html">' + escapeHtml(item.description || item.name || kind) + '</a></td>';
            html += '<td>' + renderImpactCell(item, currentCustomerId) + '</td>';
            html += '<td>' + renderBrickCell(item) + '</td>';
            html += '<td>' + renderChannelCell(item) + '</td>';
            html += '</tr>';
        });
        html += '</table>';
        return html;
    }

    addInsights();

};
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
