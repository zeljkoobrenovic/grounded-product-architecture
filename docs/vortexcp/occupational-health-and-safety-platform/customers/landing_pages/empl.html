<script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

gregated from HR and management, hosted on HDS-certified infrastructure, that follows the worker between sites and services with a documented transfer", "Fitness opinions with restrictions that reach the worker and the manager the same day in the legal form for the country, with the medical reasons kept out of what the employer sees", "Collective views of findings per workstation, exposure and site that turn thousands of individual consultations into advice the employer acts on and into the annual report", "Regulatory content that is updated by the vendor when the DMST decree, the prevention passport or the Belgian Codex changes, so the service does not interpret decrees alone"], "winsThem": ["Surveillance rules per country and per exposure profile that derive the examination type and periodicity automatically from HR and workstation data", "Connected audiometry, spirometry, vision and ECG devices (Eolys, FIM, Essilor, JLM Medical, Siemens) that write results into the file during the consultation", "Integrated secure teleconsultation with Vonage and electronic signature of certificates with Goodflag, so a remote site can be served without a day of travel", "A complete DMST and Belgian medical dossier model with 35 years of regulatory know-how behind it, proven migrations of decades of legacy files and references at SNCF, RATP, Umicore, EDF and CNRS", "Access segregation that lets nurses and medical secretaries work under the physician's authority while HR and managers only ever see fitness status and restrictions"], "theirFear": ["A labour inspection or DREETS agr\u00e9ment review finding that hundreds of workers in suivi individuel renforc\u00e9 have not been examined within the legal periodicity because they were never identified as exposed", "A medical file becoming readable by HR or a manager through a badly configured role, breaching medical secrecy and the physician's personal liability", "Losing the exposure and examination history of a worker who changed site or service, so an occupational disease claim years later cannot be documented"], "jobsToBeDone": [{"id": "jtbd-ocph-1", "name": "Deliver every required examination on time with a documented fitness opinion", "whatItIs": "Ensure every worker receives the examination that the law and their exposure profile require, within the legal periodicity, and leaves with a documented fitness opinion: the visite d'information et de pr\u00e9vention within three months of hiring, the suivi individuel renforc\u00e9 with an examen m\u00e9dical d'aptitude before assignment to an exposed post and at most every four years with an intermediate nurse visit, the visite de reprise after long absence, the mid-career visit, or in Belgium the prior and periodic health assessments for safety functions, vigilance functions and activities with defined risk. The job covers identifying who is due, preparing the consultation, examining in person or by teleconsultation, issuing the opinion with restrictions and accommodations, and closing the cycle with the next due date.", "outcome": "No worker is overdue for a legally required examination, every consultation ends with a signed fitness opinion or follow-up attestation in the correct national form, restrictions reach the manager the same day without medical content, and the physician's time in the consultation goes to the worker rather than to administration.", "steps": [{"step": "See who is due, for which examination and under which rule", "description": "Review the surveillance plan derived from HR assignments, workstation exposure profiles and the country rule set: new hires due a VIP, workers in suivi individuel renforc\u00e9 approaching their four-year limit, night workers due their periodic visit, returns from absence over 30 days, Belgian safety functions due their 24-month periodic assessment or the additional medical acts at twelve months. Validate exceptions and priorities with the service coordinator.", "streamsNeeded": [{"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Derives the required examination type and periodicity per worker from the surveillance rules and shows the due and overdue list per site and physician."}, {"id": "maintain-workforce-and-exposure-data", "name": "Maintain workforce and exposure data", "howItSupports": "Keeps assignments, workstations and exposure profiles current from the HRIS so the surveillance plan reflects who actually holds an exposed post."}]}, {"step": "Prepare the consultation from the file, the questionnaire and the measurements", "description": "Open the worker's file before the visit: previous opinions and restrictions, exposure history, the pre-visit questionnaire completed on the portal, and the audiometry, spirometry or vision results captured by the nurse, so the consultation starts from evidence rather than from questions already answered.", "streamsNeeded": [{"id": "conduct-examinations-and-teleconsultations", "name": "Conduct examinations and teleconsultations", "howItSupports": "Presents the pre-visit questionnaire and device measurements in the consultation workspace ahead of the examination."}, {"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Provides the complete history of opinions, restrictions, exposures and documents for the worker."}]}, {"step": "Examine in person or by secure teleconsultation", "description": "Conduct the clinical examination and interview, or a teleconsultation for a spontaneous request or a remote site where the rules allow it, recording findings in structured fields and free text under medical secrecy, with the worker's consent captured for the remote format.", "streamsNeeded": [{"id": "conduct-examinations-and-teleconsultations", "name": "Conduct examinations and teleconsultations", "howItSupports": "Runs the consultation workspace and the integrated secure teleconsultation with consent and session record."}, {"id": "integrate-with-hr-devices-and-ecosystem", "name": "Integrate with HR, devices and the ecosystem", "howItSupports": "Connects the Vonage telehealth session and the connected measurement devices to the consultation."}]}, {"step": "Issue the fitness opinion with restrictions and sign it", "description": "Record the opinion in the national form (avis d'aptitude, attestation de suivi, avis d'inaptitude with the legally required study of the post and exchange with the employer; in Belgium the formulaire d'\u00e9valuation de sant\u00e9), specify restrictions and accommodations in employer-readable terms without medical content, sign electronically and issue the copies for the worker and the employer.", "streamsNeeded": [{"id": "conduct-examinations-and-teleconsultations", "name": "Conduct examinations and teleconsultations", "howItSupports": "Generates the country-specific fitness opinion and certificate with electronic signature."}, {"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Delivers the worker's copy to the employee portal and the restriction to the manager portal the same day."}]}, {"step": "Close the cycle and plan the follow-up", "description": "Set the next due examination or the intermediate nurse visit, schedule a follow-up for a temporary restriction or a pre-return visit, and confirm that the opinion is filed and that the surveillance plan for the worker is updated.", "streamsNeeded": [{"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Files the opinion, restriction and follow-up decision in the medical file with audit trail."}, {"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Updates the worker's next due date and books the follow-up into the physician's or nurse's schedule."}]}], "media": [{"type": "image", "src": "media/jbtd-ocph-jtbd-ocph-1.png", "title": "Occupational Physician JTBD infographic: Deliver every required examination on time with a documented fitness opinion", "alt": "Enterprise infographic for the job \"Deliver every required examination on time with a documented fitness opinion\" for customer \"Occupational Physician\"."}]}, {"id": "jtbd-ocph-2", "name": "Keep a complete, confidential medical file that follows the worker across sites and services", "whatItIs": "Maintain the occupational medical file required by the DMST decree 2022-1434 in France and by the Code on well-being at work in Belgium: identity and employment history, workstation and exposure history, examinations, opinions, results, vaccinations, documents and correspondence, under medical secrecy with access limited to the physician and the health professionals working under their authority. The job includes segregating access, adding every document and result, transferring the file when the worker changes site, employer or service, and retaining it for the legal period so that an occupational disease can be documented decades later.", "outcome": "Every worker has one complete file that the physician trusts, no one outside the medical team can read medical content, transfers between sites and services are documented and consented, and the file is retained and auditable for the legal period on certified infrastructure.", "steps": [{"step": "Structure the file to the legal content model", "description": "Adopt the DMST content model (identity, employment and exposure history, examination results, opinions, vaccinations, health data communicated by the worker, correspondence) and the Belgian medical dossier structure, with the country content coming from the platform rather than from a local template.", "streamsNeeded": [{"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Provides the DMST and Belgian dossier structure and the country retention rules as configured content."}]}, {"step": "Segregate access under medical secrecy", "description": "Define who sees what: the physician sees everything, nurses and medical secretaries see what their protocol needs, the service coordinator sees activity without medical content, HR and managers see only fitness status and restrictions. Review access rights regularly and trace every consultation of the file.", "streamsNeeded": [{"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Enforces medical confidentiality and access segregation with an audit trail of every read and write."}, {"id": "integrate-with-hr-devices-and-ecosystem", "name": "Integrate with HR, devices and the ecosystem", "howItSupports": "Maps SSO identities and roles from the employer's directory to the platform's medical and non-medical roles."}]}, {"step": "Record every contact, result and document", "description": "Add consultations, device measurements, laboratory results, vaccination records, correspondence with treating physicians and the worker's own documents to the file as they happen, with the worker's consent where required, rather than in a paper folder beside the workstation.", "streamsNeeded": [{"id": "conduct-examinations-and-teleconsultations", "name": "Conduct examinations and teleconsultations", "howItSupports": "Writes consultations, measurements and certificates into the file at the point of care."}, {"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Stores documents, results and correspondence against the worker with versioning and consent."}]}, {"step": "Transfer the file when the worker moves", "description": "When a worker changes site, employer, or moves between the internal service and an external service (SPSTI, IDEWE or Mensura), transfer the file or the required extract with the worker's agreement, keep a trace of what was transferred and to whom, and receive incoming files into the same structure.", "streamsNeeded": [{"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Handles consented transfer between services and sites and interoperability with national occupational health records."}, {"id": "maintain-workforce-and-exposure-data", "name": "Maintain workforce and exposure data", "howItSupports": "Signals the assignment change from the HRIS that triggers the transfer or reassignment of the file."}]}, {"step": "Retain, audit and prove", "description": "Apply the legal retention periods, including the extended retention for exposures to carcinogens and ionising radiation, answer a worker's request to access their file, and produce the audit trail when the Ordre des m\u00e9decins, the labour inspectorate or a court asks who accessed a file.", "streamsNeeded": [{"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Applies retention and provides the worker access and audit exports."}, {"id": "monitor-health-and-safety-performance", "name": "Monitor health and safety performance", "howItSupports": "Reports file completeness and access review status across the service."}]}], "media": [{"type": "image", "src": "media/jbtd-ocph-jtbd-ocph-2.png", "title": "Occupational Physician JTBD infographic: Keep a complete, confidential medical file that follows the worker across sites and services", "alt": "Enterprise infographic for the job \"Keep a complete, confidential medical file that follows the worker across sites and services\" for customer \"Occupational Physician\"."}]}, {"id": "jtbd-ocph-3", "name": "Turn individual findings into collective prevention advice", "whatItIs": "Use the statutory third of the physician's time to convert what the consultations reveal into collective prevention: aggregate findings per workstation, exposure group and site without breaching secrecy, cross them with the risk assessment and the chemical inventory, write the fiche d'entreprise and the annual report, advise the employer and the CSE/CSSCT or comit\u00e9 PPT, propose measures and follow their implementation, and contribute to accident and occupational disease analysis.", "outcome": "The employer receives documented, evidence-based advice per site and exposure that leads to measures on the floor, the physician's third-time activity is visible in the annual report, and collective health indicators improve for the exposure groups the service targets.", "steps": [{"step": "Aggregate anonymised findings per workstation and exposure", "description": "Build collective views of hearing loss, respiratory findings, musculoskeletal complaints, mental health signals and abnormal results by workstation, exposure group, site and age band, at a level that never allows re-identification.", "streamsNeeded": [{"id": "monitor-health-and-safety-performance", "name": "Monitor health and safety performance", "howItSupports": "Provides collective health monitoring and exposure epidemiology across consultations."}, {"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Supplies structured consultation data and coding that make aggregation possible without exposing individual content."}]}, {"step": "Cross findings with the risk assessment and exposures", "description": "Compare the collective findings with the DUERP or global prevention plan, the chemical inventory and CMR exposures and the workstation exposure profiles, to locate where the health signal and the assessed risk disagree.", "streamsNeeded": [{"id": "assess-and-control-workplace-risks", "name": "Assess and control workplace risks", "howItSupports": "Exposes the risk assessment per workstation and site that the physician reads next to the health signal."}, {"id": "track-chemical-products-and-exposures", "name": "Track chemical products and exposures", "howItSupports": "Provides chemical hazard classification, CMR tracking and exposure groups per workstation."}]}, {"step": "Write the advice, the fiche d'entreprise and the annual report", "description": "Draft the written advice to the employer, update the fiche d'entreprise, prepare the physician's annual report and the presentation for the CSE/CSSCT or comit\u00e9 PPT with the collective indicators and the measures proposed.", "streamsNeeded": [{"id": "monitor-health-and-safety-performance", "name": "Monitor health and safety performance", "howItSupports": "Generates the annual activity report and the collective indicators for the committee presentation."}]}, {"step": "Propose measures and follow their implementation", "description": "Register the proposed collective measures as actions with an owner and a deadline, follow them to closure with the prevention adviser, and record the employer's written answer where the law requires one.", "streamsNeeded": [{"id": "report-and-resolve-hazardous-situations", "name": "Report and resolve hazardous situations", "howItSupports": "Turns the physician's proposals into assigned corrective actions followed to closure with evidence."}, {"id": "assess-and-control-workplace-risks", "name": "Assess and control workplace risks", "howItSupports": "Updates prevention measures and the annual action plan with the physician's advice."}]}, {"step": "Contribute to accident and occupational disease analysis", "description": "Take part in the root-cause analysis of work accidents and in the recognition of occupational diseases, and feed the findings back into the surveillance rules and the risk assessment.", "streamsNeeded": [{"id": "declare-and-analyse-accidents-and-occupational-diseases", "name": "Declare and analyse accidents and occupational diseases", "howItSupports": "Provides the event record, root-cause analysis and occupational disease case the physician contributes to."}]}], "media": [{"type": "image", "src": "media/jbtd-ocph-jtbd-ocph-3.png", "title": "Occupational Physician JTBD infographic: Turn individual findings into collective prevention advice", "alt": "Enterprise infographic for the job \"Turn individual findings into collective prevention advice\" for customer \"Occupational Physician\"."}]}], "customerJourneyStories": [{"id": "journey-ocph-1", "name": "From an end-of-life medical file to a certified DMST", "linkedJobIds": ["jtbd-ocph-1", "jtbd-ocph-2"], "summary": "The coordinating physician of the autonomous occupational health service of a French rail and urban transport operator with 14,000 employees and 22 medical points replaces a locally developed medical file, whose vendor stopped maintenance, with the Kitry Occupational Health module on shared HDS SaaS.", "stages": [{"stage": "Trigger", "narrative": "The DMST decree of November 2022 set a content model the legacy file cannot represent, the legacy tool has never met the interoperability requirement for occupational health information systems that has applied since 1 January 2024, and the DREETS asks for the surveillance compliance figures per site as part of the agr\u00e9ment renewal of the autonomous service. The physician cannot produce them without exporting three databases into a spreadsheet."}, {"stage": "Discovery", "narrative": "The service coordinator brings back a shortlist from Pr\u00e9ventica Paris and the UGAP catalogue of occupational health software; the physician recognises Kitry from a colleague who runs the medical file for another public transport operator and calls her. She describes the DMST structure, the access segregation and the migration of twenty years of files, and offers a visit to her service."}, {"stage": "Evaluation", "narrative": "The physician's questions are clinical and deontological rather than technical: is the file structured to the decree, can a medical secretary work under her authority without seeing what she should not, is the hosting HDS-certified with no access from outside the EEA, does teleconsultation meet the rules for t\u00e9l\u00e9sant\u00e9 au travail. Kitry answers with the DMST content model, the role model and the HDS and ISO 27001 certificates; the DPO signs the DPIA and the tender committee accepts the shared HDS SaaS tier."}, {"stage": "Trial", "narrative": "One medical point runs a pilot for three months: the files of its 900 workers are migrated in a test migration, the two physicians and four nurses work in parallel with the legacy tool for one month, and the surveillance rules for night workers and safety-critical drivers are configured with a Kitry consultant. The pilot finds 140 drivers whose suivi individuel renforc\u00e9 had lapsed unnoticed in the old tool."}, {"stage": "Engagement", "narrative": "The full migration brings the 14,000 files across in one weekend, the 22 medical points go live in four waves, and the physicians work from the due list and the consultation workspace every day. Opinions are signed electronically, restrictions reach line managers through the manager portal, and the DREETS receives the compliance figures per site from the analytics module."}, {"stage": "Retention", "narrative": "The physician chairs the service's user group with Kitry, the regulatory content is updated by the vendor when the prevention passport rules change, and at renewal the service adds teleconsultation for the smaller depots and the Accidents module so the physicians take part in root-cause analysis in the same platform."}], "media": [{"type": "image", "src": "media/journey-ocph-ocph-1.png", "title": "Occupational Physician customer journey: From an end-of-life medical file to a certified DMST", "alt": "Enterprise journey storyboard for \"From an end-of-life medical file to a certified DMST\" for customer \"Occupational Physician\"."}]}, {"id": "journey-ocph-2", "name": "Teleconsultation and connected devices for a scattered Belgian internal service", "linkedJobIds": ["jtbd-ocph-1", "jtbd-ocph-3"], "summary": "A preventieadviseur-arbeidsarts in the internal prevention service of a Belgian materials group with six plants in Flanders and Wallonia, already using Kitry for the medical dossier, adopts secure teleconsultation and connected screening devices to keep periodic health assessments on time with fewer physicians.", "stages": [{"stage": "Trigger", "narrative": "Two of the group's four arbeidsartsen retire within a year and the profession's shortage means no replacement before eighteen months; the periodic assessments for safety functions and the biological monitoring at the two Walloon plants fall behind, and the comit\u00e9 PPT asks the internal service whether these plants should move to an external service such as IDEWE or Mensura."}, {"stage": "Discovery", "narrative": "At Kitry's annual customer day the physician sees the integrated teleconsultation and the audiometry and spirometry capture presented by a colleague from a chemical group; the Kitry account manager follows up with the list of certified devices (Eolys, FIM, Essilor, JLM Medical, Siemens) and the Vonage session model, and the physician reads the Codex provisions on which assessments may be delegated and which require presence."}, {"stage": "Evaluation", "narrative": "The physician compares three options with the head of the internal service: outsource the Walloon plants to an external service, hire locum physicians, or keep the internal service and add teleconsultation with nurse-run screenings on site. The decisive points are that the medical dossier stays in one place, that nurse screenings with device capture are already in the platform the team knows, that the teleconsultation is recorded in the same file with consent, and that the cost is a module fee rather than an external service fee per worker."}, {"stage": "Trial", "narrative": "One Walloon plant runs the new model for a quarter: the site nurse performs audiometry and spirometry with connected devices, the questionnaire is completed on the employee portal, and the physician conducts the assessment by teleconsultation from the Antwerp plant for the cases the Codex allows, travelling only for the safety functions that require presence. The overdue list at that plant falls from 210 to 30."}, {"stage": "Engagement", "narrative": "Both Walloon plants move to the model, the group's remaining physicians share a single due list across the six plants, and device capture removes transcription from every screening. The physician uses the collective health views to show the comit\u00e9 PPT the hearing loss trend per production line and to argue for hearing protection changes."}, {"stage": "Retention", "narrative": "The internal service keeps the plants in-house, the group renews with the Teleconsultation module as standard and asks Kitry for an ECG device connector, and the physician presents the model at the next customer day to peers facing the same shortage."}], "media": [{"type": "image", "src": "media/journey-ocph-ocph-2.png", "title": "Occupational Physician customer journey: Teleconsultation and connected devices for a scattered Belgian internal service", "alt": "Enterprise journey storyboard for \"Teleconsultation and connected devices for a scattered Belgian internal service\" for customer \"Occupational Physician\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-ocph-top", "name": "Medical surveillance compliance rate", "description": "Share of workers whose legally required examination (VIP, suivi individuel renforc\u00e9, return visit, Belgian periodic assessment) was performed within the legal periodicity. Modeled seed values for a large European employer's internal service, informed by public occupational health statistics rather than official Kitry targets.", "unit": "%", "currentValue": "78", "targetValue": "95", "link": "https://dashboard.example.com/occupational-health-and-safety-platform/customers/ocph/kpis/co-ocph-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-ocph-co-ocph-top.png"}, "branches": [{"id": "co-ocph-b1", "name": "Examination timeliness", "d s documented on the platform per year", "revenueStreams": ["Occupational Health module subscriptions per workforce size", "Teleconsultation and device integration add-ons", "Migration and training services"], "supporting": ["Active physician users", "Teleconsultation module attach rate"]}, "milestones": ["Ship secure teleconsultation via Vonage as a standard part of the Occupational Health module with consent capture and session record in the file", "Certify capture connectors for the Eolys, FIM, Essilor, JLM Medical and Siemens device ranges so results enter the file without transcription", "Keep the French regulation content current in the release train: DMST content model maintenance, the mid-career visit, and the prevention passport training declarations that employers have been able to file since March 2026"]}, "year3": {"focus": "Make the file interoperable and the collective picture standard: consented transfer between services and interoperability with national occupational health records, collective health monitoring per exposure group out of the box, and ISO 45001-ready links between health findings and the risk assessment.", "productTheme": "One file that follows the worker, one view that advises the employer", "customerKPI": {"northStar": "Medical surveillance compliance rate", "supporting": ["Medical file completeness", "Suivi individuel renforc\u00e9 on-time rate"]}, "businessKPI": {"northStar": "Examinations documented on the platform per year", "revenueStreams": ["Occupational Health and Analytics module subscriptions", "Dedicated HDS SaaS hosting", "Interoperability and migration services"], "supporting": ["Clinical add-on attach rate", "Net revenue retention"]}, "milestones": ["Deliver DMST interoperability under the ANS interoperability and security framework, including consented exchange with the worker's Mon espace sant\u00e9 (DMP) and transfer between internal and external services", "Release collective health monitoring dashboards per workstation and exposure group that feed the fiche d'entreprise and the annual report", "Extend the Belgian Codex health assessment model and the Dutch PAGO/PMO model so the same consultation workspace serves FR, BE, LU and NL physicians"]}, "year5": {"focus": "Assisted medicine under professional supervision: drafted fitness opinions and collective advice proposed from the file and the risk assessment, predictive collective health signals per exposure group, and a partner ecosystem of devices, telehealth and external services around one interoperable file.", "productTheme": "Assisted, continuous occupational medicine", "customerKPI": {"northStar": "Medical surveillance compliance rate", "supporting": ["Device measurements captured automatically", "Exposure history present in the file"]}, "businessKPI": {"northStar": "Examinations documented on the platform per year", "revenueStreams": ["European enterprise subscriptions", "Assisted drafting and collective monitoring add-ons", "Partner device and telehealth marketplace"], "supporting": ["Modules per customer", "Physicians using teleconsultation monthly"]}, "milestones": ["Launch assisted drafting of fitness opinions and collective advice from structured findings, always reviewed and signed by the physician", "Provide predictive collective health signals that flag an exposure group whose findings drift before the periodic cycle detects it", "Open the file to certified partner devices, telehealth providers and external prevention services through a documented interoperability layer"]}}}, "domain": "Occupational Health Services"}, {"id": "ohnr", "name": "Occupational Health Nurse / Medical Assistant", "description": "Infirmier(e) en sant\u00e9 au travail or medical secretary in a French autonomous service, arbeidsverpleegkundige in a Belgian internal prevention service, or the medical assistant of a Luxembourg or Dutch company service; works under the physician's authority and written protocols and runs the consultation day for a medical point that sees 25 to 40 workers a day. Issues convocations and reschedules, sends SMS and e-mail reminders, receives the worker, checks the identity and assignment, collects the pre-visit questionnaire, performs audiometry, spirometry, vision tests, biometrics and ECG with connected devices, conducts the intermediate nurse visit (visite interm\u00e9diaire, entretien infirmier) and the Belgian nurse examinations delegated by the arbeidsarts, runs vaccination campaigns (influenza, hepatitis B for healthcare and laboratory staff, tetanus) and health promotion actions, and captures everything into the medical file. Judged on how many workers get through the day with complete, accurate records, on the no-show rate, and on whether campaigns reach their target populations.", "icon": "customer-ohnr-portrait.jpg", "careAbout": ["A day's schedule that is full, confirmed and realistic, with convocations and SMS reminders sent automatically and the manager informed that the worker must be released", "Screening results that go from the audiometer, spirometer or vision tester straight into the file without transcription, and questionnaires the worker has already answered on the portal", "Clear protocols in the tool for what the nurse may record, decide and hand to the physician, so the intermediate visit and the delegated examinations are legally safe", "One place to see the worker's assignment, exposure profile and previous results at intake, instead of asking the worker or calling HR", "Campaign tooling that finds the target population from workforce and exposure data, lets workers book themselves and tracks doses and follow-ups", "A tool that works on the medical point's existing devices and network without waiting for an IT project"], "winsThem": ["Convocations, appointment slots, SMS and e-mail reminders via Cegedim generated from the surveillance plan, with self-service rescheduling on the employee portal", "Direct capture from Eolys, FIM, Essilor, JLM Medical and Siemens devices into the consultation record", "Pre-visit questionnaires completed privately on the portal before the worker arrives", "Protocol-based nurse visit forms, abnormal-result flags to the physician and vaccination campaign management in the same platform as the medical file", "Kitry training during the four-phase implementation and a support desk that knows occupational health, not just software"], "theirFear": ["A morning where a third of the convoked workers do not show up because the convocation went through internal mail and the manager was never told", "A transcription error in an audiogram or a spirometry value that leads the physician to a wrong opinion on a safety-critical post", "Running a hepatitis B campaign for 1,200 healthcare workers from a spreadsheet and being unable to prove who received which dose at the next inspection"], "jobsToBeDone": [{"id": "jtbd-ohnr-1", "name": "Run a full consultation day without administrative friction", "whatItIs": "Organise and run the medical point's day from the surveillance plan to the last worker leaving with a certificate: build the schedule, convoke and remind, confirm attendance and fill the gaps, receive each worker with the right record open, route them through screenings and to the physician or the nurse visit, and close the day with every record complete and every next due date set.", "outcome": "The medical point sees the planned number of workers, no-shows are rare and refilled, every worker is received with the correct assignment and exposure profile, and the nurse leaves at the end of the day with nothing to type up.", "steps": [{"step": "Build the schedule and convoke from the surveillance plan", "description": "Take the due list per physician and nurse, create the appointment slots for the medical point, generate convocations in the worker's language, notify the line manager that the worker must be released, and let the worker confirm or reschedule on the portal.", "streamsNeeded": [{"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Generates slots, convocations and reminders from the due list and the physician's and nurse's capacity."}, {"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Lets workers confirm or reschedule and informs the manager that the worker is convoked."}]}, {"step": "Confirm attendance and fill the gaps", "description": "Send SMS and e-mail reminders in the days before, watch the confirmations, and offer freed slots to workers on the waiting list or to spontaneous requests so the day stays full.", "streamsNeeded": [{"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Tracks confirmations and offers released slots to the waiting list."}, {"id": "integrate-with-hr-devices-and-ecosystem", "name": "Integrate with HR, devices and the ecosystem", "howItSupports": "Delivers SMS reminders through the Cegedim connector and e-mail through the customer's mail system."}]}, {"step": "Receive the worker with the right record open", "description": "Check identity, current assignment, workstation and exposure profile against the HR-synchronised record, correct what is out of date with HR, and open the pre-visit questionnaire and previous results for the screening.", "streamsNeeded": [{"id": "maintain-workforce-and-exposure-data", "name": "Maintain workforce and exposure data", "howItSupports": "Provides the current assignment, workstation and exposure profile synchronised from the HRIS."}, {"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Opens the worker's file with previous results under the nurse's protocol access."}]}, {"step": "Route through screenings and to the physician or nurse visit", "description": "Perform the screenings the protocol requires for the worker's profile, hand over to the physician for the examination or conduct the intermediate nurse visit, and flag anything abnormal for the physician's attention.", "streamsNeeded": [{"id": "conduct-examinations-and-teleconsultations", "name": "Conduct examinations and teleconsultations", "howItSupports": "Runs the screening and nurse visit forms and routes the worker to the physician's consultation."}]}, {"step": "Close the day", "description": "Hand each worker their certificate or attestation, confirm restrictions were transmitted, set next due dates and follow-ups, and check that no record of the day is incomplete.", "streamsNeeded": [{"id": "conduct-examinations-and-teleconsultations", "name": "Conduct examinations and teleconsultations", "howItSupports": "Produces certificates and attestations and shows incomplete records for the day."}, {"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Files the day's records and follow-up decisions with audit trail."}]}], "media": [{"type": "image", "src": "media/jbtd-ohnr-jtbd-ohnr-1.png", "title": "Occupational Health Nurse / Medical Assistant JTBD infographic: Run a full consultation day without administrative friction", "alt": "Enterprise infographic for the job \"Run a full consultation day without administrative friction\" for customer \"Occupational Health Nurse / Medical Assistant\"."}]}, {"id": "jtbd-ohnr-2", "name": "Capture screenings, measurements and questionnaires accurately into the file", "whatItIs": "Get every screening result, device measurement, questionnaire answer and nurse observation into the medical file correctly, attributed to the right worker, with the right units and reference values, and with abnormal values flagged to the physician, so that the physician's opinion and later epidemiology rest on reliable data.", "outcome": "No result is transcribed by hand, questionnaires are answered by the worker before the visit, abnormal results reach the physician the same day, and data quality checks find fewer than one correction per hundred examinations.", "steps": [{"step": "Send and collect the pre-visit questionnaire", "description": "Attach the questionnaire that matches the examination type and exposure profile to the convocation, let the worker complete it privately on the portal, and review it at intake with the answers already in the record.", "streamsNeeded": [{"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Delivers the questionnaire to the worker on the employee portal with medical confidentiality."}, {"id": "conduct-examinations-and-teleconsultations", "name": "Conduct examinations and teleconsultations", "howItSupports": "Places the completed questionnaire in the consultation record for the nurse and physician."}]}, {"step": "Run device screenings with direct capture", "description": "Perform audiometry, spirometry, vision and biometric tests with the connected devices, verify the capture against the device display, and repeat the test rather than edit the value when it does not look right.", "streamsNeeded": [{"id": "conduct-examinations-and-teleconsultations", "name": "Conduct examinations and teleconsultations", "howItSupports": "Records the device measurement in the consultation with reference values and history."}, {"id": "integrate-with-hr-devices-and-ecosystem", "name": "Integrate with HR, devices and the ecosystem", "howItSupports": "Connects Eolys, FIM, Essilor, JLM Medical and Siemens devices to the platform."}]}, {"step": "Record the nurse visit under protocol", "description": "Conduct the intermediate visit or delegated examination with the protocol form, record observations and the worker's own account, and issue the attestation de suivi where the protocol allows the nurse to do so.", "streamsNeeded": [{"id": "conduct-examinations-and-teleconsultations", "name": "Conduct examinations and teleconsultations", "howItSupports": "Provides the protocol-based nurse visit form and the attestation."}, {"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Stores the nurse's record under the physician's authority with segregated access."}]}, {"step": "Flag abnormal results to the physician", "description": "Let the platform compare results with the reference values and the worker's history, and route the abnormal ones to the physician's worklist with the context needed to decide on a consultation.", "streamsNeeded": [{"id": "conduct-examinations-and-teleconsultations", "name": "Conduct examinations and teleconsultations", "howItSupports": "Computes abnormal-result flags and adds them to the physician's worklist."}]}, {"step": "Check data quality and correct with a trace", "description": "Review the data quality report for the medical point (missing units, duplicate workers, results without a consultation), correct what is wrong with the reason recorded, and report recurrent problems to the coordinator.", "streamsNeeded": [{"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Provides correction with audit trail and duplicate detection."}, {"id": "monitor-health-and-safety-performance", "name": "Monitor health and safety performance", "howItSupports": "Reports data quality indicators per medical point."}]}], "media": [{"type": "image", "src": "media/jbtd-ohnr-jtbd-ohnr-2.png", "title": "Occupational Health Nurse / Medical Assistant JTBD infographic: Capture screenings, measurements and questionnaires accurately into the file", "alt": "Enterprise infographic for the job \"Capture screenings, measurements and questionnaires accurately into the file\" for customer \"Occupational Health Nurse / Medical Assistant\"."}]}, {"id": "jtbd-ohnr-3", "name": "Run nurse visits, vaccination and health campaigns at scale", "whatItIs": "Plan and deliver campaigns that reach a defined population: influenza vaccination for the whole site, hepatitis B for healthcare and laboratory staff, tetanus boosters, intermediate nurse visits for the workers in reinforced surveillance, hearing conservation or ergonomics actions for an exposure group. The job covers defining the population from workforce and exposure data, inviting and scheduling at scale, delivering and recording, tracking coverage and follow-up doses, and reporting the outcome.", "outcome": "Each campaign reaches its target population with self-service booking, every dose and visit is recorded against the worker with consent, follow-up doses happen on schedule and the coordinator can show coverage per site and population in the annual report.", "steps": [{"step": "Define the target population", "description": "Select the workers from the workforce and exposure data: by site, exposure group, surveillance category or age band, and exclude those already covered or exempt, so the invitation list is right the first time.", "streamsNeeded": [{"id": "maintain-workforce-and-exposure-data", "name": "Maintain workforce and exposure data", "howItSupports": "Provides the population selection by site, assignment and exposure profile."}, {"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Creates the campaign as a scheduled series with its own slots and capacity."}]}, {"step": "Invite and schedule at scale", "description": "Send invitations in bulk with self-service booking on the portal, reminders for those who have not booked, and slot allocation per site and day that fits the nurses' capacity.", "streamsNeeded": [{"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Lets workers book, reschedule and consent through the employee portal."}, {"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Runs bulk invitations, reminders and slot allocation for the campaign."}]}, {"step": "Deliver sessions and record doses and consents", "description": "Run the vaccination or nurse visit sessions with the campaign record open, record batch number, dose, consent and any adverse event against the worker in the medical file.", "streamsNeeded": [{"id": "conduct-examinations-and-teleconsultations", "name": "Conduct examinations and teleconsultations", "howItSupports": "Provides the campaign session form with dose, batch and consent capture."}, {"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Stores the vaccination and campaign record in the worker's file."}]}, {"step": "Track coverage and follow-up doses", "description": "Follow coverage per site and population during the campaign, schedule second and third doses automatically and chase those who missed them.", "streamsNeeded": [{"id": "monitor-health-and-safety-performance", "name": "Monitor health and safety performance", "howItSupports": "Shows campaign coverage per site and population in real time."}, {"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Schedules follow-up doses and reminders from the campaign rules."}]}, {"step": "Report the campaign outcome", "description": "Close the campaign with coverage, doses, adverse events and cost per site, and pass the figures to the coordinator for the annual report and the committee.", "streamsNeeded": [{"id": "monitor-health-and-safety-performance", "name": "Monitor health and safety performance", "howItSupports": "Produces the campaign report for the annual activity report."}]}], "media": [{"type": "image", "src": "media/jbtd-ohnr-jtbd-ohnr-3.png", "title": "Occupational Health Nurse / Medical Assistant JTBD infographic: Run nurse visits, vaccination and health campaigns at scale", "alt": "Enterprise infographic for the job \"Run nurse visits, vaccination and health campaigns at scale\" for customer \"Occupational Health Nurse / Medical Assistant\"."}]}], "customerJourneyStories": [{"id": "journey-ohnr-1", "name": "From paper convocations to a full, self-service consultation day", "linkedJobIds": ["jtbd-ohnr-1", "jtbd-ohnr-2"], "summary": "The lead nurse of the occupational health service of a French hospital group with 9,000 staff across four hospitals goes from convocations printed and sent through internal mail, and results typed from paper, to a scheduled day with SMS reminders, portal questionnaires and device capture on the Kitry platform selected through a public tender.", "stages": [{"stage": "Trigger", "narrative": "A third of convoked staff do not show up on any given morning because the convocation reached the ward too late or the head nurse could not release them, the two physicians spend afternoons waiting, and the service's compliance figures for reinforced surveillance of night staff and staff exposed to cytotoxic drugs fall under 70 percent. The service head decides to replace the tool."}, {"stage": "Discovery", "narrative": "The lead nurse is asked to sit on the working group for the hospital group's public tender. She sees Kitry on the shortlist assembled by the purchasing department from the UGAP catalogue and a visit to Pr\u00e9ventica Lyon, and calls a nurse colleague in another hospital of the same groupement hospitalier de territoire who has used the platform for two years and describes the SMS reminders and the questionnaire on the portal."}, {"stage": "Evaluation", "narrative": "In the evaluation the nurse's tests are practical: can the platform send SMS through the hospital's existing contract, does it capture from the FIM spirometer and the Essilor vision tester already in the medical point, can the head nurse of a ward see who is convoked without seeing why, and can a worker reschedule from a phone during a night shift. The procurement scoring adds the HDS certification and the migration plan; Kitry scores highest on functional coverage and support."}, {"stage": "Trial", "narrative": "One hospital runs the pilot for six weeks with the lead nurse as key user: the surveillance plan is loaded from the HR export, convocations go out with SMS reminders, questionnaires are answered on the portal, and the spirometer and vision tester are connected by a Kitry consultant during the configuration phase. The no-show rate at the pilot hospital falls from 31 to 12 percent in the second month."}, {"stage": "Engagement", "narrative": "All four hospitals go live after the training phase, the nurses work from the daily schedule and the intake screen, device capture removes transcription for every screening, and the physicians' worklists receive the abnormal results flagged by the nurses. The service head takes the compliance figures from the dashboard to the CSE."}, {"stage": "Retention", "narrative": "The nurses ask for and get the campaign module for the hepatitis B and influenza campaigns in the second year, the lead nurse becomes the service's key user in Kitry's release process, and the hospital group renews for the second three-year term with the Employee Portal extended to all staff."}], "media": [{"type": "image", "src": "media/journey-ohnr-ohnr-1.png", "title": "Occupational Health Nurse / Medical Assistant customer journey: From paper convocations to a full, self-service consultation day", "alt": "Enterprise journey storyboard for \"From paper convocations to a full, self-service consultation day\" for customer \"Occupational Health Nurse / Medical Assistant\"."}]}, {"id": "journey-ohnr-2", "name": "Vaccination and campaign management after an inspection finding", "linkedJobIds": ["jtbd-ohnr-3", "jtbd-ohnr-2"], "summary": "An arbeidsverpleegkundige in the internal prevention service of a Belgian pharmaceutical group with three sites, whose physicians already keep the medical dossier in Kitry, moves vaccination and biological monitoring campaigns from spreadsheets to the platform after an inspection by the well-being at work inspectorate.", "stages": [{"stage": "Trigger", "narrative": "An inspection under the Code on well-being at work asks for proof of hepatitis B and tetanus vaccination and of biological monitoring for the laboratory staff exposed to biological agents; the nurse reconstructs it from three spreadsheets and a paper register and cannot show who declined and who is overdue for a booster. The inspector's report gives the service six months to fix the records."}, {"stage": "Discovery", "narrative": "The nurse learns from the Kitry account manager, during the review that follows the finding, that the Vaccination and Health Campaigns capability exists inside the Occupational Health module the physicians already use, and sees it demonstrated by a nurse from a Belgian chemical group at the Kitry customer day, including the self-service booking on the employee portal."}, {"stage": "Evaluation", "narrative": "The head of the internal service weighs configuring campaigns in Kitry against buying the external service's campaign tool that the group's Dutch sites use through their arbodienst. The decisive points are that doses and consents land in the same medical dossier the arbeidsarts signs, that the target population comes from the exposure profiles already maintained, that the record satisfies the inspection's evidence requirement and that the group's works council accepts that the platform is already GDPR-assessed."}, {"stage": "Trial", "narrative": "The influenza campaign of the coming autumn is the trial: 1,800 workers invited in bulk, self-service booking on the portal, sessions on the three sites recorded with batch and consent, and coverage per site visible daily. The nurse reconstructs the hepatitis B histories of the laboratory staff in the same tool with the physician and schedules the missing boosters."}, {"stage": "Engagement", "narrative": "All recurring campaigns and the biological monitoring series run on the platform, intermediate nurse visits for the workers in reinforced surveillance are planned as campaigns with automatic follow-ups, and the inspection's follow-up visit receives a coverage and consent report generated from the platform."}, {"stage": "Retention", "narrative": "The service keeps its campaigns on the platform at renewal, the nurse contributes a campaign template for biological agents to Kitry's pharma sector pre-configuration, and the group asks Kitry whether the Dutch sites can join the same tenant so campaigns are managed once for the whole group."}], "media": [{"type": "image", "src": "media/journey-ohnr-ohnr-2.png", "title": "Occupational Health Nurse / Medical Assistant customer journey: Vaccination and campaign management after an inspection finding", "alt": "Enterprise journey storyboard for \"Vaccination and campaign management after an inspection finding\" for customer \"Occupational Health Nurse / Medical Assistant\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-ohnr-top", "name": "Examinations completed per nurse day", "description": "Number of examinations, screenings and nurse visits completed with a full record per nurse working day at the medical point. Modeled seed values for a large employer's internal service, not official Kitry targets.", "unit": "examinations per nurse day", "currentValue": "11", "targetValue": "18", "link": "https://dashboard.example.com/occupational-health-and-safety-platform/customers/ohnr/kpis/co-ohnr-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-ohnr-co-ohnr-top.png"}, "branches": [{"id": "co-ohnr-b1", "name": "Day throughput", "description": "Whether the schedule is full and every examination closes on the day.", "currentValue": "60", "icon": "kpi-ohnr-co-ohnr-b1.png", "children": [{"id": "co-ohnr-b1-c1", "name": "Schedule fill rate", "description": "Share of available appointment slots at the medical point that end in a completed examination.", "unit": "%", "currentValue": "76", "targetValue": "94  "description": "Share of customer organisations with the Cegedim SMS connector active.", "unit": "%", "currentValue": "45", "targetValue": "85", "icon": "kpi-ohnr-bo-ohnr-b1-c2-l1.png", "children": []}, {"id": "bo-ohnr-b1-c2-l2", "name": "Notification delivery success rate", "description": "Share of SMS and e-mail notifications confirmed delivered by the channel.", "unit": "%", "currentValue": "96", "targetValue": "99.5", "icon": "kpi-ohnr-bo-ohnr-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-ohnr-b2", "name": "Campaign module and nurse enablement", "description": "Whether campaign capabilities are licensed and used and whether nurses are trained and self-sufficient.", "currentValue": "52", "icon": "kpi-ohnr-bo-ohnr-b2.png", "children": [{"id": "bo-ohnr-b2-c1", "name": "Vaccination and campaign module attach rate", "description": "Share of Occupational Health module customers that license and use vaccination and health campaigns.", "unit": "%", "currentValue": "30", "targetValue": "65", "icon": "kpi-ohnr-bo-ohnr-b2-c1.png", "children": [{"id": "bo-ohnr-b2-c1-l1", "name": "Campaigns run on the platform per year", "description": "Number of vaccination, nurse visit and health promotion campaigns executed on the platform across all customers per year.", "unit": "campaigns", "currentValue": "350", "targetValue": "900", "icon": "kpi-ohnr-bo-ohnr-b2-c1-l1.png", "children": []}, {"id": "bo-ohnr-b2-c1-l2", "name": "Campaign template reuse rate", "description": "Share of campaigns created from a sector or customer template rather than configured from scratch.", "unit": "%", "currentValue": "40", "targetValue": "80", "icon": "kpi-ohnr-bo-ohnr-b2-c1-l2.png", "children": []}]}, {"id": "bo-ohnr-b2-c2", "name": "Nurse training completion", "description": "Share of nurse and assistant users who completed the Kitry role training within three months of go-live or release.", "unit": "%", "currentValue": "70", "targetValue": "95", "icon": "kpi-ohnr-bo-ohnr-b2-c2.png", "children": [{"id": "bo-ohnr-b2-c2-l1", "name": "Training sessions delivered per year", "description": "Number of nurse and assistant training sessions delivered by Kitry consultants per year.", "unit": "sessions", "currentValue": "120", "targetValue": "200", "icon": "kpi-ohnr-bo-ohnr-b2-c2-l1.png", "children": []}, {"id": "bo-ohnr-b2-c2-l2", "name": "Support tickets per nurse user per year", "description": "Average number of support tickets opened per nurse or assistant user per year.", "unit": "tickets", "currentValue": "3.2", "targetValue": "1.5", "icon": "kpi-ohnr-bo-ohnr-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Let a nurse run a full medical point from one schedule: every worker convoked, reminded and received with the right record, every screening captured by the device, every campaign booked by the workers themselves, and nothing left to type at the end of the day.", "timeHorizons": {"year1": {"focus": "Fill the day and stop the typing: convocations and reminders from the surveillance plan through Cegedim SMS and e-mail, portal questionnaires before every visit, device capture for the common screening devices and protocol-based nurse visit forms as standard in the Occupational Health module.", "productTheme": "A full day, captured at the device", "customerKPI": {"northStar": "Examinations completed per nurse day", "supporting": ["Pre-visit questionnaire completion rate", "Screening data capture error rate"]}, "businessKPI": {"northStar": "Active nurse and assistant users", "revenueStreams": ["Occupational Health module subscriptions per workforce size", "SMS and device integration add-ons", "Training and configuration services"], "supporting": ["Customers with device integrations live", "Nurse training completion"]}, "milestones": ["Ship self-service confirmation and rescheduling on the employee portal with same-day waiting-list refill for freed slots", "Certify device capture for the Eolys, FIM, Essilor, JLM Medical and Siemens ranges and deliver the connector during the configuration phase of every implementation", "Release protocol-based nurse visit forms for the French intermediate visit and the Belgian delegated examinations"]}, "year3": {"focus": "Campaigns and nurse-led surveillance at scale: population selection from exposure data, bulk invitations with self-service booking, follow-up dose automation and sector campaign templates, with the nurse's data quality report standard for every medical point.", "productTheme": "Campaigns and nurse visits at scale", "customerKPI": {"northStar": "Examinations completed per nurse day", "supporting": ["Campaign coverage rate", "Schedule fill rate"]}, "businessKPI": {"northStar": "Active nurse and assistant users", "revenueStreams": ["Occupational Health and Portal module subscriptions", "Campaign and notification add-ons", "Sector pre-configuration services"], "supporting": ["Vaccination and campaign module attach rate", "Notification volume per month"]}, "milestones": ["Deliver sector campaign templates for healthcare, chemicals and pharma, industry and public sector with the FR/BE/LU/NL vaccination and monitoring rules", "Automate follow-up dose scheduling and reminders for multi-dose vaccination and biological monitoring series", "Provide a data quality report per medical point with duplicate, unit and attribution checks reviewed by the nurse weekly"]}, "year5": {"focus": "The medical point that plans itself: schedules generated from due lists, capacity and no-show predictions, screenings captured from any certified device or portal-connected home measurement, and campaign populations refreshed continuously as HR and exposure data change.", "productTheme": "A self-planning medical point", "customerKPI": {"northStar": "Examinations completed per nurse day", "supporting": ["No-show slots refilled the same day", "Results captured from connected devices"]}, "businessKPI": {"northStar": "Active nurse and assistant users", "revenueStreams": ["European enterprise subscriptions", "Device and telehealth partner marketplace", "Managed campaign services"], "supporting": ["Certified device connectors", "Support tickets per nurse user per year"]}, "milestones": ["Generate the medical point's schedule from the due list, capacity and no-show predictions with the nurse approving rather than building it", "Open device capture to any certified partner device and to portal-connected home measurements for teleconsultation preparation", "Refresh campaign target populations continuously from workforce and exposure changes with automatic invitations to newcomers"]}}}, "domain": "Occupational Health Services"}, {"id": "ohsm", "name": "Occupational Health Service Manager / Coordinator", "description": "Head or coordinator of the internal or autonomous occupational health service of a large employer: the responsable du service de pr\u00e9vention et de sant\u00e9 au travail autonome of a French industrial group, public authority or transport operator that holds a DREETS agr\u00e9ment, the head of the interne dienst voor preventie en bescherming op het werk of a Belgian group, or the manager of a company health service in Luxembourg or the Netherlands, responsible for 10,000 to 60,000 workers, several medical points, a team of physicians, nurses and secretaries and a budget of several million euros. Plans medical capacity and periodicity compliance across sites, decides which sites the internal service covers and which use an external service (SPSTI, IDEWE, Mensura), buys and administers the platform through tenders and framework agreements, owns the data protection impact assessment, the HDS and ISO 27001 hosting requirements and the access model with the DPO and IT security, and proves the service's activity and compliance in the physician's annual report, the Belgian annual report of the internal service, the fiche d'entreprise and presentations to the CSE/CSSCT, the comit\u00e9 PPT, the works council and the labour inspectorate. Judged on surveillance coverage, on audit and agr\u00e9ment outcomes, and on running the service without an IT project.", "icon": "customer-ohsm-portrait.jpg", "careAbout": ["Coverage: every worker at every site is in a surveillance plan and the share examined within the legal periodicity is visible per site, per physician and per surveillance category at any time", "Capacity: physician and nurse time used where the law and the risks require it, with nurse-delegated visits and teleconsultation absorbing the physician shortage rather than an external service taking over sites", "Proof: the annual reports, the fiche d'entreprise, the agr\u00e9ment renewal file and the answers to the inspectorate assembled from the platform in days, not reconstructed from sites in weeks", "Assurance: HDS-certified and ISO 27001 hosting inside the EEA, medical secrecy enforced by the role model, a DPIA the DPO signs and an audit trail that survives an inspection", "Operating the service on a subscription with vendor-maintained regulatory content, a standard release train and an account manager, without owning servers or a development team", "A single platform for the physicians, nurses, prevention advisers and HR so that the health, safety and accident data of the same workers are not held in four systems"], "winsThem": ["35 years of occupational health regulatory know-how for France, Belgium, Luxembourg and the Netherlands maintained by the vendor, with references at SNCF, Ville de Paris, Ville de Bruxelles, Engie, Umicore, EDF and CNRS", "Shared or dedicated HDS and ISO 27001 SaaS hosting with no access from outside the EEA and a four-phase implementation with proven migration of legacy files", "Cross-module dashboards, the physician's annual report, the Belgian annual prevention report and collective health monitoring generated from the same data the medical points work in", "Capacity planning per physician, nurse and site from the surveillance rules, with self-service adoption that already exceeds half of the workforce at Kitry's French, Belgian and Luxembourg customers", "A dedicated account manager, reactive support and regulatory updates delivered as standard releases instead of change requests"], "theirFear": ["An agr\u00e9ment renewal or an inspection that finds thousands of workers outside the legal periodicity and questions the existence of the autonomous service", "A data breach or a foreign-access finding on a system holding the medical files of tens of thousands of workers, with the service head accountable", "A platform migration that turns into a multi-year IT project, loses part of the legacy files and leaves the physicians working on paper during the transition"], "jobsToBeDone": [{"id": "jtbd-ohsm-1", "name": "Keep periodic surveillance compliance above target with the medical capacity we have", "whatItIs": "Plan and steer the service's surveillance activity across all sites and countries: model the population and its surveillance requirements per site and profile, plan physician and nurse capacity and the medical points, monitor backlog and overdue examinations, rebalance between physicians, nurse-delegated visits, teleconsultation and external services, and report compliance to management.", "outcome": "Surveillance coverage stays above target at every site, medical capacity is used where the law and the risks require it, backlogs are visible and shrinking, and the decision to keep a site in the internal service or use an external one is made on data.", "steps": [{"step": "Model the population and its surveillance requirements", "description": "Load the workforce per site, assignment and exposure profile from the HRIS, apply the country surveillance rules and derive the yearly requirement in examinations, nurse visits and teleconsultations per site and surveillance category.", "streamsNeeded": [{"id": "maintain-workforce-and-exposure-data", "name": "Maintain workforce and exposure data", "howItSupports": "Supplies the workforce, assignments and exposure profiles per site from the HRIS synchronisation."}, {"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Derives the yearly examination requirement per site and surveillance category from the rules."}]}, {"step": "Plan capacity per physician, nurse and medical point", "description": "Assign physicians and nurses to sites and medical points, define slot templates and protocols for delegated visits and teleconsultation, and compare planned capacity with the requirement to find the sites in deficit.", "streamsNeeded": [{"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Provides the capacity plan per physician and nurse and the comparison with the requirement."}]}, {"step": "Monitor backlog and overdue examinations", "description": "Review the compliance dashboard weekly: coverage per site, overdue examinations by surveillance category, no-show rates and slot utilisation, and drill into the sites and categories that drift.", "streamsNeeded": [{"id": "monitor-health-and-safety-performance", "name": "Monitor health and safety performance", "howItSupports": "Shows surveillance coverage, backlog and capacity utilisation per site and category."}, {"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Lists overdue examinations with their due dates and the reason they are open."}]}, {"step": "Rebalance capacity", "description": "Move nurse-delegated intermediate visits and teleconsultations to the sites in deficit, redistribute physician days, and where the internal service cannot cover a site, contract an external service and keep the records in the same platform.", "streamsNeeded": [{"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Reallocates capacity and slot templates across sites and professionals."}, {"id": "conduct-examinations-and-teleconsultations", "name": "Conduct examinations and teleconsultations", "howItSupports": "Enables teleconsultation and nurse visits as the delivery formats that absorb the physician shortage."}]}, {"step": "Report compliance to management", "description": "Present coverage and backlog per site to the HR director, the site directors and the committee, with the capacity decisions taken and the sites at risk.", "streamsNeeded": [{"id": "monitor-health-and-safety-performance", "name": "Monitor health and safety performance", "howItSupports": "Produces the compliance and capacity report for management and the committees."}]}], "media": [{"type": "image", "src": "media/jbtd-ohsm-jtbd-ohsm-1.png", "title": "Occupational Health Service Manager / Coordinator JTBD infographic: Keep periodic surveillance compliance above target with the medical capacity we have", "alt": "Enterprise infographic for the job \"Keep periodic surveillance compliance above target with the medical capacity we have\" for customer \"Occupational Health Service Manager / Coordinator\"."}]}, {"id": "jtbd-ohsm-2", "name": "Prove the service's activity and compliance to the employer and the authorities", "whatItIs": "Produce every proof the service owes: the physician's annual report and the fiche d'entreprise in France, the annual report of the internal prevention service in Belgium, the agr\u00e9ment renewal file of the autonomous service, the presentations to the CSE/CSSCT, the comit\u00e9 PPT and the works council, and the evidence requested by the labour inspectorate, the DREETS, the HDS or ISO 45001 auditor and the DPO, from the activity data of all modules rather than from site-by-site reconstruction.", "outcome": "Every report is produced from the platform within days, the figures match between the medical, safety and accident modules, audits and inspections receive their evidence on request, and the agr\u00e9ment of the autonomous service is renewed without a reservation on records.", "steps": [{"step": "Define the reporting obligations per country and site", "description": "List the reports, their content, their audience and their calendar per country: French annual report and fiche d'entreprise, Belgian annual report of the internal service, Luxembourg and Dutch equivalents, committee cycles and agr\u00e9ment renewal.", "streamsNeeded": [{"id": "monitor-health-and-safety-performance", "name": "Monitor health and safety performance", "howItSupports": "Provides the regulatory report catalogue and calendar per country."}]}, {"step": "Consolidate activity data across modules", "description": "Pull examinations, opinions, restrictions, campaigns, teleconsultations, collective actions, accidents and occupational diseases per site and period from the modules, and reconcile the figures with the sites before they are published.", "streamsNeeded": [{"id": "monitor-health-and-safety-performance", "name": "Monitor health and safety performance", "howItSupports": "Consolidates cross-module activity data into the report data set."}, {"id": "declare-and-analyse-accidents-and-occupational-diseases", "name": "Declare and analyse accidents and occupational diseases", "howItSupports": "Supplies accident and occupational disease statistics for the annual report."}]}, {"step": "Produce the reports and dashboards", "description": "Generate the annual reports in the national formats, the committee presentations and the dashboards for the HR director, with the collective health indicators and the actions proposed by the physicians.", "streamsNeeded": [{"id": "monitor-health-and-safety-performance", "name": "Monitor health and safety performance", "howItSupports": "Generates the annual activity report and dashboards in the national formats."}]}, {"step": "Evidence audits and inspections", "description": "Answer the DREETS agr\u00e9ment questions, the labour inspectorate's requests, the HDS and ISO 27001 hosting evidence and the ISO 45001 auditor
