hare of active restrictions for which the manager has recorded the accommodation or reassignment put in place.", "unit": "%", "currentValue": "60", "targetValue": "98", "icon": "kpi-sitm-co-sitm-b1-c2-l2.png", "children": []}]}]}, {"id": "co-sitm-b2", "name": "Floor safety responsiveness", "description": "How fast hazardous situations from the team are reported and resolved, and whether reporting is a habit.", "currentValue": "52", "icon": "kpi-sitm-co-sitm-b2.png", "children": [{"id": "co-sitm-b2-c1", "name": "Hazardous situation resolution time", "description": "Median calendar days from a hazardous situation report by the team to the verified closure of its corrective action.", "unit": "days", "currentValue": "21", "targetValue": "7", "icon": "kpi-sitm-co-sitm-b2-c1.png", "children": [{"id": "co-sitm-b2-c1-l1", "name": "Reports submitted from mobile within the same shift", "description": "Share of hazardous situation reports from the team submitted from a phone or tablet during the shift in which the situation was noticed.", "unit": "%", "currentValue": "35", "targetValue": "85", "icon": "kpi-sitm-co-sitm-b2-c1-l1.png", "children": []}, {"id": "co-sitm-b2-c1-l2", "name": "Corrective actions assigned within two working days", "description": "Share of the team's reports for which the prevention service assigned a corrective action with an owner within two working days.", "unit": "%", "currentValue": "50", "targetValue": "95", "icon": "kpi-sitm-co-sitm-b2-c1-l2.png", "children": []}]}, {"id": "co-sitm-b2-c2", "name": "Team hazardous situation reporting rate", "description": "Number of hazardous situations and near-misses reported per 100 team members per month; a higher rate indicates a reporting habit, not a more dangerous floor.", "unit": "reports per 100 workers per month", "currentValue": "1.2", "targetValue": "6", "icon": "kpi-sitm-co-sitm-b2-c2.png", "children": [{"id": "co-sitm-b2-c2-l1", "name": "Reports with an outcome visible to the reporter", "description": "Share of reports whose reporter received a status update and the closure notification in their portal.", "unit": "%", "currentValue": "40", "targetValue": "100", "icon": "kpi-sitm-co-sitm-b2-c2-l1.png", "children": []}, {"id": "co-sitm-b2-c2-l2", "name": "Lost-time injury frequency rate", "description": "Number of work accidents with at least one day of absence per million hours worked for the manager's area, the accident indicator managers are measured on.", "unit": "accidents per million hours", "currentValue": "8.4", "targetValue": "4.0", "icon": "kpi-sitm-co-sitm-b2-c2-l2.png", "children": []}]}]}]}, "businessOutcomes": {"top": {"id": "bo-sitm-top", "name": "Manager portal active rate", "description": "Share of managers provisioned in the manager portal across all customer organisations who use it at least once a month. The manager portal is rolled out by the employer, so activation and habit are the measures of whether the rollout worked. Modeled seed value, not a reported Kitry figure.", "unit": "%", "currentValue": "28", "targetValue": "75", "link": "https://dashboard.example.com/occupational-health-and-safety-platform/customers/sitm/kpis/bo-sitm-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-sitm-bo-sitm-top.png"}, "branches": [{"id": "bo-sitm-b1", "name": "Portal rollout and adoption", "description": "How many organisations have the manager portal live, how fast rollouts go and how many managers use it each week.", "currentValue": "36", "icon": "kpi-sitm-bo-sitm-b1.png", "children": [{"id": "bo-sitm-b1-c1", "name": "Organisations with the manager portal live", "description": "Number of customer organisations where the manager portal is in production for at least one management population.", "unit": "organisations", "currentValue": "40", "targetValue": "130", "icon": "kpi-sitm-bo-sitm-b1-c1.png", "children": [{"id": "bo-sitm-b1-c1-l1", "name": "Manager accounts provisioned through SSO", "description": "Share of manager portal accounts created automatically from the customer's identity provider and HRIS roles rather than by hand.", "unit": "%", "currentValue": "55", "targetValue": "95", "icon": "kpi-sitm-bo-sitm-b1-c1-l1.png", "children": []}, {"id": "bo-sitm-b1-c1-l2", "name": "Manager portal rollout lead time", "description": "Weeks from the customer's decision to roll out the manager portal to the last rollout wave live.", "unit": "weeks", "currentValue": "12", "targetValue": "4", "icon": "kpi-sitm-bo-sitm-b1-c1-l2.png", "children": []}]}, {"id": "bo-sitm-b1-c2", "name": "Weekly active managers", "description": "Number of manager portal users across all customers with at least one session per week.", "unit": "users", "currentValue": "1500", "targetValue": "7000", "icon": "kpi-sitm-bo-sitm-b1-c2.png", "children": [{"id": "bo-sitm-b1-c2-l1", "name": "Managers checking team fitness status weekly", "description": "Share of active managers who open the team fitness status view at least once a week.", "unit": "%", "currentValue": "35", "targetValue": "80", "icon": "kpi-sitm-bo-sitm-b1-c2-l1.png", "children": []}, {"id": "bo-sitm-b1-c2-l2", "name": "Hazardous situation reports filed by managers per month", "description": "Number of hazardous situation reports created from the manager portal per month across all customers.", "unit": "reports per month", "currentValue": "900", "targetValue": "4000", "icon": "kpi-sitm-bo-sitm-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-sitm-b2", "name": "Portal value and retention", "description": "Whether the portals module is bought, renewed and liked, and how much support a manager population costs.", "currentValue": "62", "icon": "kpi-sitm-bo-sitm-b2.png", "children": [{"id": "bo-sitm-b2-c1", "name": "Portals module attach rate", "description": "Share of Kitry customer organisations subscribing to the Employee and Manager Portals module.", "unit": "%", "currentValue": "50", "targetValue": "90", "icon": "kpi-sitm-bo-sitm-b2-c1.png", "children": [{"id": "bo-sitm-b2-c1-l1", "name": "Portals module renewal rate", "description": "Share of Employee and Manager Portals subscriptions renewed at term.", "unit": "%", "currentValue": "94", "targetValue": "99", "icon": "kpi-sitm-bo-sitm-b2-c1-l1.png", "children": []}, {"id": "bo-sitm-b2-c1-l2", "name": "Manager portal satisfaction score", "description": "Average score given by managers in the in-portal satisfaction survey, on a five-point scale.", "unit": "score out of 5", "currentValue": "3.6", "targetValue": "4.5", "icon": "kpi-sitm-bo-sitm-b2-c1-l2.png", "children": []}]}, {"id": "bo-sitm-b2-c2", "name": "Support tickets per 100 active managers per month", "description": "Number of support requests raised about the manager portal per 100 monthly active managers, the cost of running a large manager population.", "unit": "tickets per 100 managers", "currentValue": "6", "targetValue": "1.5", "icon": "kpi-sitm-bo-sitm-b2-c2.png", "children": [{"id": "bo-sitm-b2-c2-l1", "name": "Manager portal tickets about access and roles", "description": "Share of manager portal tickets concerning login, role or team scope problems, the category removed by SSO and HRIS role synchronisation.", "unit": "%", "currentValue": "45", "targetValue": "10", "icon": "kpi-sitm-bo-sitm-b2-c2-l1.png", "children": []}, {"id": "bo-sitm-b2-c2-l2", "name": "Manager training hours per rollout wave", "description": "Average hours of Kitry or customer trainer time per rollout wave of managers, reduced by in-portal guidance.", "unit": "hours per wave", "currentValue": "12", "targetValue": "3", "icon": "kpi-sitm-bo-sitm-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make the manager portal the place where a site or line manager knows their team is cleared, applies a restriction without learning a diagnosis, reports a hazard from the floor in a minute and sees it fixed, so that prevention reaches the shop floor through the people who plan the work.", "timeHorizons": {"year1": {"focus": "Ship the manager portal as a standard part of every deployment: team fitness status and convocation releases synchronised from the HRIS, restriction notifications with non-medical wording and acknowledgement, hazardous situation reporting on mobile with photo and location, and the manager's own action list, provisioned through the customer's SSO.", "productTheme": "The team's clearance and hazards on the manager's phone", "customerKPI": {"northStar": "Team fitness clearance rate", "supporting": ["Hazardous situation resolution time", "Restriction application lead time"]}, "businessKPI": {"northStar": "Manager portal active rate", "revenueStreams": ["Employee and Manager Portals module subscriptions per workforce size", "Portal rollout and change management services", "SSO and HRIS role synchronisation connectors"], "supporting": ["Organisations with the manager portal live", "Manager portal rollout lead time"]}, "milestones": ["Release the manager portal team view with surveillance status, convocation releases and reschedule requests fed by the HRIS synchronisation and the scheduling engine", "Ship restriction notifications with non-medical wording, validity and affected workstations, with acknowledgement and accommodation confirmation captured in the portal", "Deliver mobile hazardous situation reporting for managers and employees with photo, location and workstation pick-up, feeding the prevention service's action register"]}, "year3": {"focus": "Managers as active partners in prevention: clearance checks against the target workstation before assignment, return-to-work plans shared with HR and the physician, inspection checklists for managers, and area dashboards with reporting rate, resolution time and accident frequency, with in-portal guidance that makes rollouts need almost no training.", "productTheme": "Assign with confidence, fix what the floor reports", "customerKPI": {"northStar": "Team fitness clearance rate", "supporting": ["Team hazardous situation reporting rate", "Workers with an expired or missing fitness opinion"]}, "businessKPI": {"northStar": "Manager portal active rate", "revenueStreams": ["Portals module subscriptions with manager analytics", "Contractor and temporary worker portal extensions", "Sector rollout packages for transport, industry and public sector"], "supporting": ["Weekly active managers", "Support tickets per 100 active managers per month"]}, "milestones": ["Add clearance checks against a target workstation's surveillance category with a one-click visit request, so managers assign safety-critical, night and chemical-exposed work only to cleared workers", "Ship return-to-work plans in the manager portal with steps shared between the manager, HR and the physician, linked to accident and absence follow-up", "Deliver area dashboards for managers with reporting rate, resolution time, open actions and lost-time injury frequency, and in-portal guidance that cuts rollout training to under three hours per wave"]}, "year5": {"focus": "Prevention embedded in daily work planning: clearance and restrictions available to rostering and workforce management systems through interfaces, assisted triage that suggests severity and owner for a report at submission, and manager-level insight that links near-miss patterns to workstation risks and collective health signals across sites.", "productTheme": "Clearance and hazards where work is planned", "customerKPI": {"northStar": "Team fitness clearance rate", "supporting": ["Restrictions acknowledged within 48 hours", "Reports with an outcome visible to the reporter"]}, "businessKPI": {"northStar": "Manager portal active rate", "revenueStreams": ["Workforce management and rostering interface licences", "Assisted triage and insight options", "European multi-country portal subscriptions"], "supporting": ["Portals module attach rate", "Manager portal satisfaction score"]}, "milestones": ["Expose clearance status and active restrictions to rostering and workforce management systems through interfaces so a breaching assignment is blocked at planning time", "Launch assisted triage that proposes severity, hazard type and owner when a manager or worker submits a report, for confirmation by the prevention service", "Provide managers with near-miss pattern insight per area linked to workstation risks and collective health indicators, with medical confidentiality preserved by design"]}}}, "domain": "HSE and Prevention"}, {"id": "hrad", "name": "HR Administrator / Personnel Officer", "description": "Works in the HR department or personnel office of a large employer in France, Belgium, Luxembourg or the Netherlands, an industrial group, a hospital, a city administration, a bank or a transport operator, and is the person the occupational health service depends on for employee data and the person the law holds to the declaration deadlines. Keeps workers, contracts, sites, workstations and managers flowing from the HRIS (SAP SuccessFactors, Workday, ADP or a public-sector HR system) so that initial, periodic and return-to-work examinations are triggered without a parallel register; declares work accidents to the CPAM within 48 hours in France and to the insurer within 8 days in Belgium, follows occupational disease cases with the CPAM or Fedris, and handles reserves, absence and recognition; and coordinates fitness opinions, restrictions, unfitness procedures and re-integration with the physician and the line managers, without ever seeing the medical content. Judged on whether any hire is missed by surveillance, whether any declaration is late or rejected, and on the time spent reconciling data between HR, the medical service and the insurer.", "icon": "customer-hrad-portrait.jpg", "careAbout": ["One employee register, mastered in the HRIS and synchronised every night, so that the medical service never works from a stale spreadsheet and HR never maintains a second list", "Every hire, transfer, change of shift, long absence and departure triggering the examination the law requires, without HR having to remember the rule per country", "Accident declarations completed from data that already exists and filed inside the 48-hour or 8-day window, with the acknowledgement kept as proof", "Declarations accepted first time by the CPAM, the insurer or Fedris, and reserves filed within their delay with the manager's dated evidence", "Fitness opinions, restrictions and unfitness conclusions received the day they are signed, in a version HR may legally see, and applied with the manager within days", "Being able to answer the CSE, the CPPT, the inspectorate and the insurer with figures from the same record rather than from folders"], "winsThem": ["Productised HRIS connectors for SAP SuccessFactors, Workday and ADP with an exception list HR can clear in minutes, so the worker register is accurate without a data project", "Native French CERFA and net-entreprises declarations and Belgian insurer and Fedris forms pre-filled from the worker record, with the legal deadline counting from the moment the manager reports the event", "A manager portal on which line managers report accidents and acknowledge restrictions, so HR is notified within the hour and no longer transcribes handwritten reports", "Employer-facing fitness opinions that carry restrictions and accommodations but no medical content, so HR works within medical secrecy without asking the physician for a summary", "Return-to-work and re-integration procedures triggered from HRIS absence data with country-specific legal delays, and accident statistics for the CSE and the annual prevention report from the same events"], "theirFear": ["A labour inspection or a tribunal finding that a worker was never called for an initial or return-to-work visit because the data never reached the medical service", "A late or incomplete accident declaration that costs the employer the right to file reserves, or a fine and an insurer dispute over a serious accident", "Being blamed for a breach of medical secrecy because a fitness opinion with diagnosis details was forwarded to a manager, or for a failed HRIS migration that wiped the surveillance history"], "jobsToBeDone": [{"id": "jtbd-hrad-1", "name": "Keep employee and assignment data in sync so surveillance is triggered automatically", "whatItIs": "Make the HRIS (SAP SuccessFactors, Workday, ADP or a public-sector HR system) the single source of employee, contract, site and assignment data for the occupational health platform, so that every hire, transfer, change of workstation, long absence and departure reaches the medical service without a spreadsheet, and the surveillance rules can derive who needs which examination and when. The job covers the initial mapping of HR fields to workers, organisation units and workstations, the nightly synchronisation, the treatment of exceptions the sync cannot resolve, and the coordination with HSE on the exposure profile of each workstation.", "outcome": "Every worker in the HRIS exists once in the platform with the right contract, site, workstation and manager, changes are reflected within a day, new hires and transfers automatically trigger the initial or periodic examination, and the HR administrator handles a short exception list instead of maintaining a parallel employee register for the medical service.", "steps": [{"step": "Map HR data to workers, organisation units and workstations", "description": "Work with the Kitry consultant and the HRIS team to map employee ids, contract types, organisation units, sites, cost centres, job codes and manager relations to the platform's worker, organisation and workstation model, decide which fields are mastered in the HRIS and which (exposure profile, surveillance category) are owned by HSE and the physician, and agree the treatment of temporary workers, apprentices, interns and external staff.", "streamsNeeded": [{"id": "integrate-with-hr-devices-and-ecosystem", "name": "Integrate with HR, devices and the ecosystem", "howItSupports": "Provides the HRIS connector, field mapping, identifier reconciliation and scheduling of the synchronisation runs."}, {"id": "maintain-workforce-and-exposure-data", "name": "Maintain workforce and exposure data", "howItSupports": "Holds the target model of workers, contracts, assignments, sites and workstations that the HR data is mapped onto."}]}, {"step": "Run the synchronisation and clear the exception list", "description": "Let the nightly sync create, update and close worker records and assignments, then review the exceptions the connector cannot decide on its own: duplicates, workers without a workstation, job codes without an exposure profile, sites unknown to the platform, and departures with an open convocation. Fix the cause in the HRIS where it belongs and only override in the platform when the HRIS cannot carry the information.", "streamsNeeded": [{"id": "integrate-with-hr-devices-and-ecosystem", "name": "Integrate with HR, devices and the ecosystem", "howItSupports": "Runs the import batches, reports rejected and ambiguous records and lets the administrator re-run a corrected batch."}, {"id": "maintain-workforce-and-exposure-data", "name": "Maintain workforce and exposure data", "howItSupports": "Shows the resulting worker register with data-quality flags and the assignment history per worker."}]}, {"step": "Attach each workstation to its exposure and surveillance profile", "description": "Coordinate with the HSE manager so every workstation that arrives from the HRIS carries the exposures and special surveillance categories (night work, chemical, biological or physical agents, safety posts, young workers, pregnant workers) that determine the type and periodicity of examinations in France, Belgium, Luxembourg or the Netherlands, and flag new or changed workstations that still lack a profile.", "streamsNeeded": [{"id": "maintain-workforce-and-exposure-data", "name": "Maintain workforce and exposure data", "howItSupports": "Links workstations to exposure and risk profiles so that assignments inherit the surveillance category automatically."}, {"id": "track-chemical-products-and-exposures", "name": "Track chemical products and exposures", "howItSupports": "Feeds chemical exposure groups and CMR flags into the workstation profile that HR sees."}]}, {"step": "Verify that hires, transfers and returns trigger the right examinations", "description": "Check that new hires and transfers appear in the surveillance plan with the correct examination type (initial information and prevention visit or pre-employment health assessment, periodic visit, return-to-work visit after absence beyond the legal threshold) and that the medical service receives them within the legal delay, then review the monthly list of workers whose surveillance status is unknown or overdue because of missing data.", "streamsNeeded": [{"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Derives the due examinations from assignments and profiles and shows which triggered convocations originate from HR data changes."}, {"id": "monitor-health-and-safety-performance", "name": "Monitor health and safety performance", "howItSupports": "Reports overdue and untriggered surveillance per site so data gaps are visible to HR and the service."}]}, {"step": "Prove data protection and keep the flow auditable", "description": "Document with the DPO which personal data flows to the platform, confirm that no medical content flows back to the HRIS (only fitness status and restrictions visible to authorised roles), keep the processing register and the audit trail of sync runs current, and handle access requests and departures so that closed workers are retained according to the medical file retention rules rather than deleted.", "streamsNeeded": [{"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Guarantees that medical content stays segregated under medical secrecy while HR sees only fitness status and restrictions."}, {"id": "integrate-with-hr-devices-and-ecosystem", "name": "Integrate with HR, devices and the ecosystem", "howItSupports": "Keeps the log of every synchronisation run, its source and the records it changed for the DPO and auditors."}]}], "media": [{"type": "image", "src": "media/jbtd-hrad-jtbd-hrad-1.png", "title": "HR Administrator / Personnel Officer JTBD infographic: Keep employee and assignment data in sync so surveillance is triggered automatically", "alt": "Enterprise infographic for the job \"Keep employee and assignment data in sync so surveillance is triggered automatically\" for customer \"HR Administrator / Personnel Officer\"."}]}, {"id": "jtbd-hrad-2", "name": "Declare and follow work accidents and occupational diseases correctly and on time", "whatItIs": "Turn every work accident, commuting accident and suspected occupational disease into a complete, correct declaration filed with the right body inside the legal delay, and follow each case through reserves, absence, recognition and statistics. In France this means the d\u00e9claration d'accident du travail to the CPAM within 48 hours (CERFA 14463 or net-entreprises), the feuille d'accident for the worker, motivated reserves within 10 days and the follow-up of the medical certificate and absence; in Belgium the declaration to the employer's work accident insurer within 8 days, serious accidents reported to the labour inspectorate, and occupational disease cases with Fedris; in Luxembourg the AAA and in the Netherlands the reporting of serious accidents to the labour inspectorate.", "outcome": "Every event is declared complete and correct within the legal window with data pulled from the worker record, the manager's report and the medical service, nothing is retyped from paper, the case is followed to recognition or closure with absence and return-to-work in the same record, and HR can answer the CSE, CPPT or insurer with figures rather than folders.", "steps": [{"step": "Receive the event report from the manager or the medical service", "description": "Get the initial report as soon as it happens: the site or line manager records the circumstances, witnesses, injuries and first care in the manager portal, or the nurse records it during first aid; HR is notified at once so that the 48-hour or 8-day clock is visible from the start rather than discovered from a medical certificate a week later.", "streamsNeeded": [{"id": "declare-and-analyse-accidents-and-occupational-diseases", "name": "Declare and analyse accidents and occupational diseases", "howItSupports": "Creates the event with circumstances, witnesses and injuries and starts the country-specific declaration deadline."}, {"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Lets managers report the event from the floor and employees add their own account or medical certificate."}]}, {"step": "Complete the declaration with worker, contract and employer data", "description": "Pre-fill the declaration from the worker record, the assignment, the employer's SIRET or company number and the insurer policy, add the information only HR has (salary basis, contract type, usual working hours), check the classification of the event (work accident, commuting accident, occupational disease suspicion) and record whether the employer files reserves on the professional character of the accident.", "streamsNeeded": [{"id": "declare-and-analyse-accidents-and-occupational-diseases", "name": "Declare and analyse accidents and occupational diseases", "howItSupports": "Assembles the declaration from event and worker data and validates mandatory fields per country before submission."}, {"id": "maintain-workforce-and-exposure-data", "name": "Maintain workforce and exposure data", "howItSupports": "Supplies the worker's identity, contract, site, workstation and employer entity that the forms require."}]}, {"step": "File with the national body or insurer inside the legal delay", "description": "Generate the national form (CERFA and net-entreprises DAT in France, the insurer's declaration and, for serious accidents, the labour inspectorate report in Belgium, Fedris forms for occupational diseases, AAA in Luxembourg), submit it through the connector or export it for the portal, hand the worker the feuille d'accident or equivalent, and archive the acknowledgement with its timestamp as proof of on-time filing.", "streamsNeeded": [{"id": "declare-and-analyse-accidents-and-occupational-diseases", "name": "Declare and analyse accidents and occupational diseases", "howItSupports": "Produces the country-specific declaration forms and records the submission timestamp against the legal deadline."}, {"id": "integrate-with-hr-devices-and-ecosystem", "name": "Integrate with HR, devices and the ecosystem", "howItSupports": "Provides the connectors and exports to national reporting portals and insurers."}]}, {"step": "Follow the case through absence, recognition and reserves", "description": "Track the medical certificates and absence periods, the insurer's or CPAM's recognition decision, any investigation of the reserves, the occupational disease file with Fedris or the CPAM, and the worker's return-to-work visit with the occupational physician, so that the case has one status and the CSE or CPPT sees the follow-up.", "streamsNeeded": [{"id": "declare-and-analyse-accidents-and-occupational-diseases", "name": "Declare and analyse accidents and occupational diseases", "howItSupports": "Keeps the case status, absence periods, recognition decisions and reserves together with the original declaration."}, {"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Schedules the return-to-work examination that the absence duration requires."}]}, {"step": "Analyse causes and report accident statistics", "description": "Contribute the HR view to the root-cause analysis run with HSE and the physician, and produce the frequency and severity rates, the accident register and the annual figures required for the CSE, the Belgian annual prevention report and the insurer's tariff discussions from the same events rather than from a separate spreadsheet.", "streamsNeeded": [{"id": "declare-and-analyse-accidents-and-occupational-diseases", "name": "Declare and analyse accidents and occupational diseases", "howItSupports": "Provides root-cause analysis and frequency and severity statistics from the declared events."}, {"id": "monitor-health-and-safety-performance", "name": "Monitor health and safety performance", "howItSupports": "Publishes the accident indicators in the dashboards and annual reports for the CSE, CPPT and management."}]}], "media": [{"type": "image", "src": "media/jbtd-hrad-jtbd-hrad-2.png", "title": "HR Administrator / Personnel Officer JTBD infographic: Declare and follow work accidents and occupational diseases correctly and on time", "alt": "Enterprise infographic for the job \"Declare and follow work accidents and occupational diseases correctly and on time\" for customer \"HR Administrator / Personnel Officer\"."}]}, {"id": "jtbd-hrad-3", "name": "Manage absence, restrictions and return-to-work with the medical service", "whatItIs": "Coordinate with the occupational physician and nurse everything that touches a worker's employment without touching medical secrecy: long absences that require a return-to-work visit or a pre-return visit, fitness opinions with restrictions or accommodations that the manager must apply, unfitness opinions that start a redeployment or dismissal procedure with strict legal delays, contested opinions, and the reintegration pathways (French mi-temps th\u00e9rapeutique, Belgian re-integration trajectory) that involve the employer, the worker and the physician.", "outcome": "HR learns about each opinion, restriction and return the day it is issued, in a form it may legally see, applies it with the manager within days, meets the legal delays for redeployment searches and contested opinions, and keeps the whole sequence documented for the works council, the inspectorate and any tribunal.", "steps": [{"step": "Receive fitness opinions and restrictions without medical content", "description": "Get the fitness-for-work opinion, restrictions, accommodations or unfitness conclusion the moment the physician signs it, in the employer-facing version that carries no diagnosis, and confirm receipt so that the legal clock for applying it or contesting it starts from a known date.", "streamsNeeded": [{"id": "conduct-examinations-and-teleconsultations", "name": "Conduct examinations and teleconsultations", "howItSupports": "Issues the fitness opinion and the employer-facing version with restrictions and accommodations."}, {"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Separates the confidential medical file from the employer-facing opinion HR is allowed to see."}]}, {"step": "Apply restrictions and accommodations with the manager", "description": "Assign the restriction or accommodation to the site or line manager through the manager portal, agree the concrete change (no night shift, no loads above a threshold, adapted workstation, remote work days), record when it was applied, and flag cases where it cannot be applied so that the physician and HR can look for redeployment.", "streamsNeeded": [{"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "howItSupports": "Shows managers the restrictions of their team and lets them confirm application or escalate."}, {"id": "maintain-workforce-and-exposure-data", "name": "Maintain workforce and exposure data", "howItSupports": "Records the changed assignment or workstation so surveillance and safety data follow the accommodation."}]}, {"step": "Plan return-to-work and pre-return visits after long absence", "description": "Detect absences beyond the legal threshold for a return-to-work examination (30 days after an accident or 60 days after illness in France, and the Belgian re-integration rules), request the visit in time, offer the pre-return visit and the liaison meeting where applicable, and prepare the reintegration plan with the physician and the manager.", "streamsNeeded": [{"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "howItSupports": "Triggers and schedules the return-to-work and pre-return examinations from absence data."}, {"id": "integrate-with-hr-devices-and-ecosystem", "name": "Integrate with HR, devices and the ecosystem", "howItSupports": "Brings absence periods from the HRIS so the thresholds are computed without manual entry."}]}, {"step": "Run unfitness, redeployment and contestation procedures on time", "description": "When the physician declares a worker unfit, document the redeployment search, the consultation of staff representatives and the legal delays, prepare the file if no redeployment is possible, and manage a contested opinion within the legal window with the exchanges the law requires, all with the dated evidence in one place.", "streamsNeeded": [{"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "howItSupports": "Provides the dated opinions and exchanges that document the procedure while keeping medical content confidential."}, {"id": "monitor-health-and-safety-performance", "name": "Monitor health and safety performance", "howItSupports": "Lists open procedures with their legal deadlines so none is missed."}]}], "media": [{"type": "image", "src": "media/jbtd-hrad-jtbd-hrad-3.png", "title": "HR Administrator / Personnel Officer JTBD infographic: Manage absence, restrictions and return-to-work with the medical service", "alt": "Enterprise infographic for the job \"Manage absence, restrictions and return-to-work with the medical service\" for customer \"HR Administrator / Personnel Officer\"."}]}], "customerJourneyStories": [{"id": "journey-hrad-1", "name": "From monthly employee spreadsheets to HRIS synchronisation", "linkedJobIds": ["jtbd-hrad-1", "jtbd-hrad-3"], "summary": "An HR administrator at a French industrial group with 9,000 employees on eleven sites stops sending monthly Excel extracts to the occupational health service and connects SAP SuccessFactors to Kitry, so that hires, transfers and absences trigger surveillance on their own.", "stages": [{"stage": "Trigger", "narrative": "A labour inspection at one plant finds four new hires who never had their initial information and prevention visit because they were hired between two monthly Excel exports, and the occupational physician points out that a fifth worker moved to night shift without anyone telling the service. HR has been keeping a second employee register by hand for the medical service for years, and this is the moment the HR director asks for it to stop."}, {"stage": "Discovery", "narrative": "The occupational health service manager is already preparing the move to Kitry and invites HR to the project. In the kick-off the Kitry consultant shows how the platform synchronises workers, contracts, sites and workstations from SuccessFactors every night, and the HR administrator recognises the same organisation tree the HRIS already holds. A reference call with an HR colleague at another French industrial customer confirms that the exception list is short once the job codes are mapped."}, {"stage": "Evaluation", "narrative": "The DPO and IT security review the data flow: which fields leave the HRIS, the fact that no medical content flows back, hosting on HDS-certified infrastructure inside the EEA, and SSO with the group's identity provider. HR tests the mapping of temporary workers, apprentices and external staff, which the old spreadsheets never handled consistently, and asks the works council for its opinion on the processing. The alternative of keeping the spreadsheets is priced in inspection risk rather than in hours."}, {"stage": "Trial", "narrative": "Two sites run the synchronisation in parallel with the old export for two months. The first runs produce a long exception list, almost all job codes without an exposure profile, which HSE clears in a workshop; after that the nightly run changes a few dozen records a week and the HR administrator reviews them in ten minutes. A transfer to a chemical workstation triggers a convocation the next day, something that used to take a month."}, {"stage": "Engagement", "narrative": "All eleven sites are synchronised and the HR administrator no longer maintains a register for the service. New hires appear in the surveillance plan the day after their contract is signed, absences beyond the legal threshold trigger return-to-work visits without HR having to remember, and the restrictions the physician issues reach the line manager through the manager portal with HR in copy."}, {"stage": "Retention", "narrative": "When the group replaces SuccessFactors with Workday two years later, the connector is swapped during the HRIS project without the medical service noticing, and the HR administrator insists that the HRIS team treat the Kitry synchronisation as part of the HRIS acceptance test. The exception list has become the HR data-quality dashboard, and the HR director cites the inspection that found no gap in surveillance as the reason the subscription is renewed."}], "media": [{"type": "image", "src": "media/journey-hrad-hrad-1.png", "title": "HR Administrator / Personnel Officer customer journey: From monthly employee spreadsheets to HRIS synchronisation", "alt": "Enterprise journey storyboard for \"From monthly employee spreadsheets to HRIS synchronisation\" for customer \"HR Administrator / Personnel Officer\"."}]}, {"id": "journey-hrad-2", "name": "Retiring the paper CERFA and the insurer's forms", "linkedJobIds": ["jtbd-hrad-2", "jtbd-hrad-3"], "summary": "The personnel officer of a Belgian-French logistics operator replaces hand-filled CERFA declarations, insurer PDF forms and an Excel accident register with Kitry's accidents and occupational diseases module, after a late declaration exposed how fragile the paper process was.", "stages": [{"stage": "Trigger", "narrative": "A forklift accident on a Friday evening at a French depot is declared to the CPAM on the following Wednesday, outside the 48-hour window, because the site manager's handwritten report reached HR on Monday and the CERFA had to be completed from three systems. The same month the Belgian work accident insurer returns two declarations for missing fields. The HR manager asks for a process in which the clock is visible from the moment of the accident."}, {"stage": "Discovery", "narrative": "The occupational physician, who already works in Kitry for the medical file, mentions that the platform has an accidents module with French CERFA and net-entreprises declarations and Belgian insurer and Fedris forms. The personnel officer attends a Kitry user day where a customer from the transport sector shows managers declaring an event from the manager portal on a tablet and HR completing the declaration the same day."}, {"stage": "Evaluation", "narrative": "The personnel officer checks with the legal department that the generated forms match the current CERFA and the insurer's format, that reserves can be filed within the 10-day delay, and that the worker's feuille d'accident is produced. The CSE and the Belgian CPPT are consulted on the new process, and the DPO confirms that the medical certificate stays with the physician and that the manager sees only what the declaration requires."}, {"stage": "Trial", "narrative": "The module is activated for one French region and one Belgian hub for a quarter. Managers report events from the portal, HR is notified within the hour, worker and employer data are pre-filled from the HRIS synchronisation, and the first declarations go out in under a day. Two managers still phone HR instead of using the portal and are coached; the insurer accepts every Belgian declaration first time."}, {"stage": "Engagement", "narrative": "All depots use the module. The personnel officer follows every case, from the initial report to the recognition decision, absence and return-to-work visit, in one record, files reserves with the dated evidence the manager captured, and produces the frequency and severity rates for the CSE and the annual prevention report from the same events. The Excel register is archived."}, {"stage": "Retention", "narrative": "At renewal the HR manager adds the occupational disease follow-up with Fedris and the CPAM and asks Kitry to extend the manager portal to the temporary workers' agency contacts. The insurer's tariff review is prepared from the platform's statistics, and the personnel officer becomes the internal reference other HR teams in the group call before their own rollout."}], "media": [{"type": "image", "src": "media/journey-hrad-hrad-2.png", "title": "HR Administrator / Personnel Officer customer journey: Retiring the paper CERFA and the insurer's forms", "alt": "Enterprise journey storyboard for \"Retiring the paper CERFA and the insurer's forms\" for customer \"HR Administrator / Personnel Officer\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-hrad-top", "name": "Work accident declaration on-time rate", "description": "Share of work and commuting accidents declared to the competent body inside the legal window: 48 hours to the CPAM in France, 8 days to the insurer in Belgium, and the equivalent delays in Luxembourg and the Netherlands. Modeled seed value for a large employer with several countries, not an official Kitry figure.", "unit": "%", "currentValue": "78", "targetValue": "97", "link": "https://dashboard.example.com/occupational-health-and-safety-platform/customers/hrad/kpis/co-hrad-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-hrad-co-hrad-top.png"}, "branches": [{"id": "co-hrad-b1", "name": "Declaration timeliness and accuracy", "description": "How quickly an event becomes a complete declaration and how often the declaration is accepted without correction.", "currentValue": "72", "icon": "kpi-hrad-co-hrad-b1.png", "children": [{"id": "co-hrad-b1-c1", "name": "Declaration lead time", "description": "Average hours from the moment of the accident to the timestamped submission of the declaration to the CPAM, insurer or national portal.", "unit": "hours", "currentValue": "40", "targetValue": "18", "icon": "kpi-hrad-co-hrad-b1-c1.png", "children": [{"id": "co-hrad-b1-c1-l1", "name": "Event capture within 24 hours rate", "description": "Share of accidents recorded in the platform by the manager, nurse or HR within 24 hours of occurring.", "unit": "%", "currentValue": "64", "targetValue": "92", "icon": "kpi-hrad-co-hrad-b1-c1-l1.png", "children": []}, {"id": "co-hrad-b1-c1-l2", "name": "Manager-initiated declarations share", "description": "Share of events whose first report is entered by the site or line manager in the manager portal rather than reconstructed by HR from paper or e-mail.", "unit": "%", "currentValue": "35", "targetValue": "80", "icon": "kpi-hrad-co-hrad-b1-c1-l2.png", "children": []}]}, {"id": "co-hrad-b1-c2", "name": "Declaration rejection rate", "description": "Share of declarations returned by the CPAM, insurer, Fedris or national portal for missing or inconsistent information.", "unit": "%", "currentValue": "9", "targetValue": "2", "icon": "kpi-hrad-co-hrad-b1-c2.png", "children": [{"id": "co-hrad-b1-c2-l1", "name": "Declaration fields pre-filled from worker record", "description": "Share of mandatory declaration fields populated automatically from the worker, contract, site and employer entity data.", "unit": "%", "currentValue": "55", "targetValue": "85", "icon": "kpi-hrad-co-hrad-b1-c2-l1.png", "children": []}, {"id": "co-hrad-b1-c2-l2", "name": "Occupa
