    :root {

        --panel: #ffffff;

    <style>
    .tab {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 4px;
    }

    .tab button {
        position: relative;
        background-color: transparent;
        border: none;
        outline: none;
        cursor: pointer;
        padding: 11px 16px;
        margin-bottom: -1px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        color: #6b7280;
        border-bottom: 2px solid transparent;
        border-radius: 8px 8px 0 0;
        transition: color 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
    }

    .tab button:hover {
        color: #1f2937;
        background-color: #f3f4f6;
    }

    .tab button:focus-visible {
        outline: 2px solid #1d4ed8;
        outline-offset: -2px;
    }

    .tab button.active {
        color: #1d4ed8;
        border-bottom-color: #1d4ed8;
    }

    .tabcontent {
        display: none;
        padding: 2px 2px;
        animation: tabContentFade 0.2s ease;
    }

    @keyframes tabContentFade {
        from {
            opacity: 0;
            transform: translateY(3px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 720px) {
        .tab {
            flex-direction: column;
            gap: 0;
        }

        .tab button {
            width: 100%;
            text-align: left;
            margin-bottom: 0;
            border-bottom: 1px solid #e5e7eb;
            border-radius: 0;
        }

        .tab button.active {
            border-bottom-color: #1d4ed8;
        }
    }

    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);

ay, and keep every answer traceable to the data it came from.", "howItSupports": "Lets the asset manager slice occupancy, rent, expiries, valuations and energy labels by entity, complex and tenant on demand and export the answer with its source.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-3-4.png", "title": "Asset and Portfolio Manager JTBD step 4: Answer covenant tests and ad-hoc investor questions", "alt": "Enterprise infographic for step 4 of the job \"Report to investors and lenders without a reporting project\": Answer covenant tests and ad-hoc investor questions."}]}, {"step": "Answer covenant tests and ad-hoc investor questions", "description": "Run the loan-to-value, interest-cover and debt-service tests per financed entity when the bank asks, answer questions on a specific complex, tenant concentration, expiry profile or energy-label distribution within a day, and keep every answer traceable to the data it came from.", "howItSupports": "Provides an AI assistant that drafts answers to recurring investor and lender questions from the portfolio data and the API that feeds the investor's own BI tools.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-3-4.png", "title": "Asset and Portfolio Manager JTBD step 4: Answer covenant tests and ad-hoc investor questions", "alt": "Enterprise infographic for step 4 of the job \"Report to investors and lenders without a reporting project\": Answer covenant tests and ad-hoc investor questions."}]}, {"step": "Share reports and approvals through the investor and owner portal", "description": "Publish the packs, dashboards, valuation reports and project updates to investors, joint-venture partners and lenders in a branded portal with the right access per fund and entity, collect approvals for capex and sale decisions where the structure requires them, and retire the e-mail-and-attachment distribution.", "howItSupports": "Gives investors and partners a portal with reports, statements, documents and approvals scoped to their funds and entities.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-3-5.png", "title": "Asset and Portfolio Manager JTBD step 5: Share reports and approvals through the investor and owner portal", "alt": "Enterprise infographic for step 5 of the job \"Report to investors and lenders without a reporting project\": Share reports and approvals through the investor and owner portal."}]}]}, {"customerId": "finc", "customerName": "Real Estate Finance Controller", "customerGroup": "Real Estate Investors and Asset Managers", "customerIcon": "customer-finc-portrait.jpg", "productId": "real-estate-erp-core", "productName": "Real Estate ERP Core", "productIcon": "asmg.png", "jobId": "jtbd-finc-1", "jobName": "Invoice and collect every euro of rent on time", "jobWhatItIs": "Turn the active lease contracts of every entity into correct rent invoices each period, collect the money through SEPA direct debit and bank transfer, match every incoming payment to its invoice, and follow up arrears through a structured dunning process that respects tenant rights and hands over to collection when needed. Residential rent is invoiced monthly and largely direct-debited; commercial rent quarterly or monthly with VAT where the lease is opted for taxation.", "jobOutcome": "The rent run per entity goes out on the invoicing date without manual corrections, direct debits are collected on schedule, payments are matched automatically, arrears are visible and acted on by ageing bucket, and the collection rate stays above target with a complete file for every case handed to collection.", "supportRationale": "Builds the periodic rent run per entity from active contracts and runs the pre-invoicing check that flags anomalies before invoices are generated.", "usedInSteps": [{"step": "Prepare and check the periodic rent run", "description": "Before the invoicing date, review contract changes since the last run (new leases, terminations, indexations, changed service charge advances, deposit settlements), run the pre-invoicing check per entity for anomalies such as zero amounts, missing VAT codes or overlapping periods, and release the run.", "howItSupports": "Builds the periodic rent run per entity from active contracts and runs the pre-invoicing check that flags anomalies before invoices are generated.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-1-1.png", "title": "Real Estate Finance Controller JTBD step 1: Prepare and check the periodic rent run", "alt": "Enterprise infographic for step 1 of the job \"Invoice and collect every euro of rent on time\": Prepare and check the periodic rent run."}]}, {"step": "Issue invoices and collect through direct debit", "description": "Generate the invoices with the correct VAT treatment per contract, deliver them to tenants by e-mail and the tenant portal, create the SEPA direct debit batch per entity with valid mandates and pre-notifications, submit it to the bank and process rejections and reversals.", "howItSupports": "Generates invoices and SEPA direct debit batches per entity, submits them through the bank integration and books rejections and reversals back to the debtor.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-1-2.png", "title": "Real Estate Finance Controller JTBD step 2: Issue invoices and collect through direct debit", "alt": "Enterprise infographic for step 2 of the job \"Invoice and collect every euro of rent on time\": Issue invoices and collect through direct debit."}]}, {"step": "Issue invoices and collect through direct debit", "description": "Generate the invoices with the correct VAT treatment per contract, deliver them to tenants by e-mail and the tenant portal, create the SEPA direct debit batch per entity with valid mandates and pre-notifications, submit it to the bank and process rejections and reversals.", "howItSupports": "Publishes invoices, payment status and mandate details to the tenant portal and app so tenants pay and check without calling.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-1-2.png", "title": "Real Estate Finance Controller JTBD step 2: Issue invoices and collect through direct debit", "alt": "Enterprise infographic for step 2 of the job \"Invoice and collect every euro of rent on time\": Issue invoices and collect through direct debit."}]}, {"step": "Match incoming payments to invoices every day", "description": "Import bank statements per entity daily, let the matching rules and robot allocate transfers and direct debit collections to open invoices by reference, amount and debtor, handle partial payments, overpayments and payments on the wrong entity, and keep the debtor position true at the end of each day.", "howItSupports": "Matches bank lines to open rent invoices automatically per entity and queues the unmatched remainder for manual allocation.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-1-3.png", "title": "Real Estate Finance Controller JTBD step 3: Match incoming payments to invoices every day", "alt": "Enterprise infographic for step 3 of the job \"Invoice and collect every euro of rent on time\": Match incoming payments to invoices every day."}]}, {"step": "Match incoming payments to invoices every day", "description": "Import bank statements per entity daily, let the matching rules and robot allocate transfers and direct debit collections to open invoices by reference, amount and debtor, handle partial payments, overpayments and payments on the wrong entity, and keep the debtor position true at the end of each day.", "howItSupports": "Runs the daily statement import and matching robot and learns allocation rules from the controller's manual decisions.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-1-3.png", "title": "Real Estate Finance Controller JTBD step 3: Match incoming payments to invoices every day", "alt": "Enterprise infographic for step 3 of the job \"Invoice and collect every euro of rent on time\": Match incoming payments to invoices every day."}]}, {"step": "Run dunning and agree payment arrangements", "description": "Execute the dunning schedule per entity and tenant type (reminder, formal notice, final notice with costs), pause it for tenants with an agreed payment plan or a dispute, register payment arrangements and monitor compliance, and coordinate with the property manager on tenants who need a conversation rather than a letter.", "howItSupports": "Runs the configurable dunning schedule, records payment arrangements and disputes, and reports arrears by ageing bucket and dunning stage.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-1-4.png", "title": "Real Estate Finance Controller JTBD step 4: Run dunning and agree payment arrangements", "alt": "Enterprise infographic for step 4 of the job \"Invoice and collect every euro of rent on time\": Run dunning and agree payment arrangements."}]}, {"step": "Run dunning and agree payment arrangements", "description": "Execute the dunning schedule per entity and tenant type (reminder, formal notice, final notice with costs), pause it for tenants with an agreed payment plan or a dispute, register payment arrangements and monitor compliance, and coordinate with the property manager on tenants who need a conversation rather than a letter.", "howItSupports": "Lets tenants see their arrears, propose a payment plan and pay online, reducing the letters and calls the team handles.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-1-4.png", "title": "Real Estate Finance Controller JTBD step 4: Run dunning and agree payment arrangements", "alt": "Enterprise infographic for step 4 of the job \"Invoice and collect every euro of rent on time\": Run dunning and agree payment arrangements."}]}, {"step": "Hand over to collection and settle deposits and write-offs", "description": "For tenants that do not respond, compile the collection file (contract, invoices, dunning history, correspondence) for the collection agency or bailiff, follow the case, settle deposits against final invoices at termination, and book write-offs and provisions per entity with the asset manager's approval.", "howItSupports": "Assembles the collection file from the debtor history and tracks handed-over cases, recoveries and write-offs per entity.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-1-5.png", "title": "Real Estate Finance Controller JTBD step 5: Hand over to collection and settle deposits and write-offs", "alt": "Enterprise infographic for step 5 of the job \"Invoice and collect every euro of rent on time\": Hand over to collection and settle deposits and write-offs."}]}]}, {"customerId": "finc", "customerName": "Real Estate Finance Controller", "customerGroup": "Real Estate Investors and Asset Managers", "customerIcon": "customer-finc-portrait.jpg", "productId": "real-estate-erp-core", "productName": "Real Estate ERP Core", "productIcon": "asmg.png", "jobId": "jtbd-finc-2", "jobName": "Keep multi-entity books accurate and reconciled every day", "jobWhatItIs": "Maintain the general ledger of every legal entity in the group as a true, reconciled record at any point in the month: entity structure and chart of accounts, supplier and maintenance invoices with approval, bank reconciliation per entity, VAT with exempt and taxed rent, intercompany positions, fixed assets and loans. The books must be ready for the accountant, the auditor and the asset manager without a monthly clean-up.", "jobOutcome": "Every entity's ledger is reconciled with its bank accounts, debtors and creditors at the end of each day, supplier invoices are approved and paid within terms, VAT is filed correctly per entity, intercompany positions balance, and the finance team spends its time on exceptions and analysis rather than on booking and reconciling.", "supportRationale": "Creates entities, bank accounts, chart of accounts mappings and opening balances as part of portfolio onboarding, including migrations from legacy systems.", "usedInSteps": [{"step": "Maintain the entity structure, chart of accounts and opening balances", "description": "Set up each legal entity with its objects, bank accounts, loans, VAT status and reporting group, apply the group chart of accounts and cost-centre structure per complex, and load opening balances when an entity or portfolio is acquired or migrated from a legacy system.", "howItSupports": "Creates entities, bank accounts, chart of accounts mappings and opening balances as part of portfolio onboarding, including migrations from legacy systems.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-2-1.png", "title": "Real Estate Finance Controller JTBD step 1: Maintain the entity structure, chart of accounts and opening balances", "alt": "Enterprise infographic for step 1 of the job \"Keep multi-entity books accurate and reconciled every day\": Maintain the entity structure, chart of accounts and opening balances."}]}, {"step": "Capture, code and approve supplier and maintenance invoices", "description": "Receive supplier invoices by e-mail, portal or e-invoicing, let the AI assistant extract and code them to entity, complex, cost account and recoverability, match them to work orders, maintenance contracts or project commitments, route them through the approval workflow and schedule payment within terms.", "howItSupports": "Provides the work orders and completion reports that maintenance invoices are matched against before approval.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-2-2.png", "title": "Real Estate Finance Controller JTBD step 2: Capture, code and approve supplier and maintenance invoices", "alt": "Enterprise infographic for step 2 of the job \"Keep multi-entity books accurate and reconciled every day\": Capture, code and approve supplier and maintenance invoices."}]}, {"step": "Capture, code and approve supplier and maintenance invoices", "description": "Receive supplier invoices by e-mail, portal or e-invoicing, let the AI assistant extract and code them to entity, complex, cost account and recoverability, match them to work orders, maintenance contracts or project commitments, route them through the approval workflow and schedule payment within terms.", "howItSupports": "Supplies the AI invoice-coding assistant and the inbox robot that turn incoming invoices into coded, matched drafts.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-2-2.png", "title": "Real Estate Finance Controller JTBD step 2: Capture, code and approve supplier and maintenance invoices", "alt": "Enterprise infographic for step 2 of the job \"Keep multi-entity books accurate and reconciled every day\": Capture, code and approve supplier and maintenance invoices."}]}, {"step": "Reconcile bank accounts per entity daily", "description": "Import statements for every entity's bank accounts through the bank connectors, match rent receipts, supplier payments, loan instalments, interest and bank costs to the ledger, book the unmatched lines, and confirm at day end that every bank balance equals the ledger balance per entity.", "howItSupports": "Imports bank statements per entity through the bank integration and matches receipts and payments to open items.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-2-3.png", "title": "Real Estate Finance Controller JTBD step 3: Reconcile bank accounts per entity daily", "alt": "Enterprise infographic for step 3 of the job \"Keep multi-entity books accurate and reconciled every day\": Reconcile bank accounts per entity daily."}]}, {"step": "Reconcile bank accounts per entity daily", "description": "Import statements for every entity's bank accounts through the bank connectors, match rent receipts, supplier payments, loan instalments, interest and bank costs to the ledger, book the unmatched lines, and confirm at day end that every bank balance equals the ledger balance per entity.", "howItSupports": "Runs the daily reconciliation robot and reports the automation rate and the exceptions that need a person.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-2-3.png", "title": "Real Estate Finance Controller JTBD step 3: Reconcile bank accounts per entity daily", "alt": "Enterprise infographic for step 3 of the job \"Keep multi-entity books accurate and reconciled every day\": Reconcile bank accounts per entity daily."}]}, {"step": "Handle VAT, pro-rata and tax positions per entity", "description": "Apply the right VAT treatment per contract and invoice (exempt residential rent, taxed commercial leases with an opted lease, service charges), calculate the pro-rata deduction on mixed-use entities, prepare and file the VAT return and ICP per entity, and keep the transfer tax, property tax and depreciation positions correct for the accountant.", "howItSupports": "Applies the contract's VAT treatment to every rent and service charge invoice so the VAT return is built from correct source documents.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-2-4.png", "title": "Real Estate Finance Controller JTBD step 4: Handle VAT, pro-rata and tax positions per entity", "alt": "Enterprise infographic for step 4 of the job \"Keep multi-entity books accurate and reconciled every day\": Handle VAT, pro-rata and tax positions per entity."}]}, {"step": "Balance intercompany positions and automate recurring postings", "description": "Book management fees, recharges and loans between entities as matched intercompany pairs, run recurring postings for depreciation, accruals, loan interest and prepayments per entity on schedule, and let robots and integrations with the accountant's software take over repetitive work so the team handles only exceptions.", "howItSupports": "Schedules the recurring posting robots and connects the ledger to the accountant's and auditor's tools through certified integrations and the API.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-2-5.png", "title": "Real Estate Finance Controller JTBD step 5: Balance intercompany positions and automate recurring postings", "alt": "Enterprise infographic for step 5 of the job \"Keep multi-entity books accurate and reconciled every day\": Balance intercompany positions and automate recurring postings."}]}]}, {"customerId": "finc", "customerName": "Real Estate Finance Controller", "customerGroup": "Real Estate Investors and Asset Managers", "customerIcon": "customer-finc-portrait.jpg", "productId": "real-estate-erp-core", "productName": "Real Estate ERP Core", "productIcon": "asmg.png", "jobId": "jtbd-finc-3", "jobName": "Close the period and settle service charges without spreadsheets", "jobWhatItIs": "Close each month, quarter and year per entity and consolidate per fund from the reconciled ledger: run the close checklist, post accruals, prepayments, depreciation and valuation results, settle the annual service charges per complex with tenants within the statutory period, produce investor and owner statements and the audit file, and hand over to the accountant and auditor through integrations rather than exports.", "jobOutcome": "The period closes per entity in days with a documented checklist, consolidation per fund and investor statements come out of the same books, service charge settlements are issued to every tenant before the legal deadline with postings that reconcile to the ledger, and the auditor works from a complete file without a spreadsheet trail.", "supportRationale": "Runs the tie-out checks and reminder tasks automatically so the controller sees only the entities and items that are not green.", "usedInSteps": [{"step": "Run the period-close checklist per entity", "description": "Work through the close checklist per entity: rent runs complete, bank reconciled, supplier invoices booked, VAT reconciled, intercompany balanced, sub-ledgers tied to the general ledger. Track who completed what, resolve open items and lock the period when the checklist is green.", "howItSupports": "Runs the tie-out checks and reminder tasks automatically so the controller sees only the entities and items that are not green.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-3-1.png", "title": "Real Estate Finance Controller JTBD step 1: Run the period-close checklist per entity", "alt": "Enterprise infographic for step 1 of the job \"Close the period and settle service charges without spreadsheets\": Run the period-close checklist per entity."}]}, {"step": "Post accruals, depreciation, valuations and loan positions", "description": "Book accruals for costs not yet invoiced, prepayments, depreciation per object, loan interest and repayments, and the valuation results and deferred tax positions per entity, using the valuation records and project data already in the system rather than a separate valuation spreadsheet.", "howItSupports": "Provides the valuation records per object that the revaluation postings and the investor statements rely on.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-3-2.png", "title": "Real Estate Finance Controller JTBD step 2: Post accruals, depreciation, valuations and loan positions", "alt": "Enterprise infographic for step 2 of the job \"Close the period and settle service charges without spreadsheets\": Post accruals, depreciation, valuations and loan positions."}]}, {"step": "Settle service charges per complex within the legal deadline", "description": "After year end, gather the recoverable costs booked per complex, apply the distribution keys and the contractual and legal rules per tenant, calculate the settlement against the advances paid, issue the statements to tenants and post the receivables or payables and the next year's advances in one run, complex by complex, before the statutory deadline.", "howItSupports": "Invoices or refunds the settlement amounts and collects them through the normal direct debit and dunning cycle.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-3-3.png", "title": "Real Estate Finance Controller JTBD step 3: Settle service charges per complex within the legal deadline", "alt": "Enterprise infographic for step 3 of the job \"Close the period and settle service charges without spreadsheets\": Settle service charges per complex within the legal deadline."}]}, {"step": "Consolidate per fund and produce investor and owner statements", "description": "Consolidate the entities of each fund with intercompany eliminations, produce the balance sheet, profit and loss and cash flow per entity and fund, generate investor and owner statements with distributions, and publish them to the investor and owner portal for the asset manager and the investors.", "howItSupports": "Publishes the statements and distributions to investors and owners in their portal with scoped access per fund.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-3-4.png", "title": "Real Estate Finance Controller JTBD step 4: Consolidate per fund and produce investor and owner statements", "alt": "Enterprise infographic for step 4 of the job \"Close the period and settle service charges without spreadsheets\": Consolidate per fund and produce investor and owner statements."}]}, {"step": "Hand over to the accountant and auditor through integrations", "description": "Give the accountant and auditor access to the closed period, the audit file and the supporting documents through certified integrations with their software and the API, answer sample requests from the document trail, and process the annual accounts adjustments back into the ledger without re-keying.", "howItSupports": "Provides the certified accounting integrations, the audit-file export and the API through which the accountant and auditor read the closed period.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-3-5.png", "title": "Real Estate Finance Controller JTBD step 5: Hand over to the accountant and auditor through integrations", "alt": "Enterprise infographic for step 5 of the job \"Close the period and settle service charges without spreadsheets\": Hand over to the accountant and auditor through integrations."}]}]}, {"customerId": "prpm", "customerName": "Property Manager", "customerGroup": "Property Management and VvE Firms", "customerIcon": "customer-prpm-portrait.jpg", "productId": "real-estate-erp-core", "productName": "Real Estate ERP Core", "productIcon": "asmg.png", "jobId": "jtbd-prpm-1", "jobName": "Fill a vacant unit with the right tenant fast and compliantly", "jobWhatItIs": "From the moment a tenant gives notice until a new tenant has signed, paid the deposit and received the keys: prepare the unit, publish the listing, organise viewings, screen candidates against income and identity requirements, set a rent price that is within the legal maximum, generate the lease contract, sign it digitally and hand over the unit with a documented inspection report.", "jobOutcome": "Each vacancy is filled within weeks rather than months by a screened tenant, at a rent that is documented as compliant, with a signed contract and a paid deposit before the keys change hands, and every step traceable for the owner and for a rent tribunal.", "supportRationale": "Turns the pre-inspection findings into work orders for cleaning and repairs so the unit is ready before the first viewing.", "usedInSteps": [{"step": "Register the termination and prepare the unit for re-letting", "description": "Record the tenant's notice against the contract, calculate the end date and the notice period, plan the pre-inspection and final inspection, and raise the small repairs and cleaning needed before viewings can start. Decide with the owner whether the unit is re-let at the same rent, renovated first or upgraded to a higher points class.", "howItSupports": "Turns the pre-inspection findings into work orders for cleaning and repairs so the unit is ready before the first viewing.", "media": [{"type": " ct debit."}]}, {"step": "Issue invoices and collect through direct debit", "description": "Generate the invoices with the correct VAT treatment per contract, deliver them to tenants by e-mail and the tenant portal, create the SEPA direct debit batch per entity with valid mandates and pre-notifications, submit it to the bank and process rejections and reversals.", "howItSupports": "Publishes invoices, payment status and mandate details to the tenant portal and app so tenants pay and check without calling.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-1-2.png", "title": "Real Estate Finance Controller JTBD step 2: Issue invoices and collect through direct debit", "alt": "Enterprise infographic for step 2 of the job \"Invoice and collect every euro of rent on time\": Issue invoices and collect through direct debit."}]}, {"step": "Match incoming payments to invoices every day", "description": "Import bank statements per entity daily, let the matching rules and robot allocate transfers and direct debit collections to open invoices by reference, amount and debtor, handle partial payments, overpayments and payments on the wrong entity, and keep the debtor position true at the end of each day.", "howItSupports": "Matches bank lines to open rent invoices automatically per entity and queues the unmatched remainder for manual allocation.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-1-3.png", "title": "Real Estate Finance Controller JTBD step 3: Match incoming payments to invoices every day", "alt": "Enterprise infographic for step 3 of the job \"Invoice and collect every euro of rent on time\": Match incoming payments to invoices every day."}]}, {"step": "Match incoming payments to invoices every day", "description": "Import bank statements per entity daily, let the matching rules and robot allocate transfers and direct debit collections to open invoices by reference, amount and debtor, handle partial payments, overpayments and payments on     mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        flowchart: {
            htmlLabels: true
        }
    });

    function renderDependenciesDiagramIfNeeded() {
        const container = document.getElementById('Dependencies');
        if (!container || container.dataset.diagramRendered === 'true') {
            return;
        }
        mermaid.run({querySelector: '#Dependencies .mermaid'}).then(() => {
            container.dataset.diagramRendered = 'true';
        }).catch(error => {
            console.error('Failed to render dependency diagram', error);
        });
    }

    function renderModuleDependencyGraphIfNeeded() {
        if (!document.getElementById('ModuleDependencyGraph')) {
            return;
        }
        renderModuleDependencyGraph();
    }

    // The shared tabs script (_imports/tabs) calls this hook after a tab opens.
    window.afterOpenTab = function (tabName) {
        if (tabName === 'dependencies') {
            renderDependenciesDiagramIfNeeded();
        }
        if (tabName === 'modules') {
            updateModuleDetailsVisibility();
            renderModuleDependencyGraphIfNeeded();
        }
    };

    function updateModuleDetailsVisibility() {
        const toggle = document.getElementById('moduleDetailsToggle');
        const showDetails = !toggle || toggle.checked;
        document.querySelectorAll('#Modules .module-detail-content').forEach(element => {
            element.style.display = showDetails ? '' : 'none';
        });
    }

    function updateBrickTabLabels() {
        const moduleCount = (brick.layers || []).reduce((total, layer) => {
            const modules = layer && layer.modules ? layer.modules : [];
            if (Array.isArray(modules)) {
                return total + modules.length;
            }
            return total + Object.keys(modules).length;
        }, 0);
        const dataCount = (brick.dataDependencies || []).length;
        const dependenciesCount = (brick.brickDependencies || []).length
            + findIncomingBrickDependencies().length
            + (brick.externalSystemsThisBrickDependsOn || brick.externalSystemDependencies || []).length
            + (brick.externalSystemsDependingOnThisBrick || []).length;
        const linksCount = (brick.links || []).reduce((sum, group) => sum + (group.links || []).length, 0);
        const modulesTab = document.getElementById('tab_modules');
        const dataTab = document.getElementById('tab_data');
        const dependenciesTab = document.getElementById('tab_dependencies');
        const linksTab = document.getElementById('tab_links');
        if (modulesTab) {
            modulesTab.textContent = 'Modules (' + moduleCount + ')';
        }
        if (dataTab) {
            dataTab.textContent = 'Data (' + dataCount + ')';
        }
        if (dependenciesTab) {
            dependenciesTab.textContent = 'Dependencies (' + dependenciesCount + ')';
        }
        if (linksTab) {
            linksTab.textContent = 'Links (' + linksCount + ')';
        }
    }
</script>

<script>
    function isFalse(value) {
        return !value || (value + '').toLowerCase().trim() === 'false' || (value + '').toLowerCase().trim() === 'no';

    function isTrue(value) {

<script>
    let div = document.createElement('div');
    document.body.appendChild(div);

    let html = '';

    function addNavigation() {
        html += '<div style="margin: 4px 20px 10px 20px; font-size: 85%; color: black">';
        let prev_domain = all_bricks.length ? all_bricks[0].domain : '';
        all_bricks.filter(c => c.domain && c.domain.toLowerCase().trim() !== 'on ice').forEach(cap => {
            if (prev_domain && prev_domain.toLowerCase() !== cap.domain.toLowerCase()) {
                prev_domain = cap.domain;
                html += '<div style="margin-top: 5px; margin-left: 4px; vertical-align: top; display: inline-block; border-left: 2px solid lightgrey; height: 30px;">&nbsp;</div>';
            }
            html += '<a href="' + cap.id + '.html">';
            const tabClass = cap.id === brick.id ? 'tab-image-selected' : 'tab-image';
            html += '<img src="../icons/' + cap.id + '.png" class="' + tabClass + '" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
            html += '</a>';
        });
        html += '</div>';
    }

    addNavigation();

    html += '<div style="margin: 20px">';

    function addHeader() {
        html += '<table>';
        html += '<tr>';
        html += '<td>';
        html += '<div>';
        html += '<img src="../icons/' + brick.id + '.png" style="width: 110px" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
        html += '</div>';
        html += '</td>';
        html += '<td style="vertical-align: top">';
        html += '<div style="margin-left: 20px; font-size: 90%; color: grey; vertical-align: top">';
        html += '<div class="page-type-badge">Brick</div>';
        html += brick.domain;
        if (brick.group && brick.group !== brick.domain) {
            html += ' / ' + brick.group;
        }
        html += ' / <span style="color: blue; font-weight: bold;">' + brick.id.toUpperCase() + '</span>';
        html += '</div>';
        html += '<div style="font-size: 50px; margin-left: 20px">';
        html += brick.name;
        html += '</div>';
        html += '<div style="font-size: 16px; margin-left: 20px; color: grey; margin-top: 3px">';
        html += brick.description ? brick.description : '';
        html += '</div>';
        html += '</td>';
        html += '</tr>';
        html += '</table>';
    }

    addHeader();

    function addDocs() {
        html += '<div  class="" style="margin-top: 32px">';

        function addGroup(docs, icon) {
            if (docs) {
                docs.split('\n').forEach(doc => {
                    const elements = doc.trim().split(',');
                    const label = elements.length > 0 ? elements[0].trim() : '';
                    const link = elements.length > 1 ? elements[1].trim() : '';
                    if (label && link) {
                        html += '<a target="_blank" href="' + link + '">';
                        html += '<div class="docs">';
                        html += '<div>';
                        if (label.startsWith('Security ')) icon = 'security.png';
                        html += '<img src="../icons/' + icon + '" ' + 'style="width: 54px;">';
                        html += '</div>';
                        html += '<div style="font-size: 110%">' + label.replace(/_/g, ' ') + '</div>';
                        html += '</div>';
                        html += '</a>';
                    }
                });
            }
        }

        html += '</div>';
    }

    document.getElementById('Header').innerHTML = html;
    html = '';

    function escapeHomeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function resolveCustomerMediaSrc(src) {
        const value = (src || '').trim();
        if (!value) {
            return '';
        }
        if (value.startsWith('http://') || value.startsWith('https://') || value.startsWith('data:')) {
            return value;
        }
        if (value.startsWith('../') || value.startsWith('./')) {
            return value;
        }
        if (value.startsWith('media/') || value.startsWith('icons/')) {
            return '../../customers/' + value;
        }
        return '../../customers/media/' + value;
    }

    function escapeMermaidLabel(value) {
        return (value || '')
            .replaceAll('&', 'and')
            .replaceAll('"', '')
            .replaceAll("'", '')
            .replaceAll('<', '')
            .replaceAll('>', '')
            .replaceAll('[', '(')
            .replaceAll(']', ')')
            .replaceAll('{', '(')
            .replaceAll('}', ')')
            .replaceAll('|', '/');
    }

    function renderLinkedProducts() {
        let sectionHtml = '<div class="home-section">';
        sectionHtml += '<div class="home-section-title">Used In Products</div>';
        if (!linkedProducts.length) {
            sectionHtml += '<div class="activity-muted">No linked products were inferred for this brick.</div>';
        } else {
            linkedProducts.forEach(product => {
                sectionHtml += '<a class="home-link-card" target="_blank" rel="noopener noreferrer" href="../../product-deployments/landing_pages/' + escapeHomeHtml(product.id) + '.html">';
                sectionHtml += '<div class="home-link-head">';
                sectionHtml += '<img class="home-link-icon" src="../../product-deployments/icons/' + escapeHomeHtml(product.icon) + '" onerror="this.onerror=null;this.src=\'../../product-deployments/icons/product.png\'">';
                sectionHtml += '<div><div class="home-link-title">' + escapeHomeHtml(product.name) + '</div><div class="home-link-meta">' + escapeHomeHtml(product.type || 'Product') + '</div></div>';
                sectionHtml += '</div>';
                if (product.whyUsed) {
                    sectionHtml += '<div class="home-link-copy">' + escapeHomeHtml(product.whyUsed) + '</div>';
                }
                sectionHtml += '</a>';
            });
        }
        sectionHtml += '</div>';
        return sectionHtml;
    }

    function renderSupportedStreams() {
        const supportedStreams = allStreams.filter(stream => {
            return (stream.brickDependencies || []).some(dep => dep.targetBrickId === brick.id);
        });

        let sectionHtml = '<div class="home-section">';
        sectionHtml += '<div class="home-section-title">Supported Product Streams</div>';
        if (!supportedStreams.length) {
            sectionHtml += '<div class="activity-muted">No product streams currently reference this brick.</div>';
            sectionHtml += '</div>';
            return sectionHtml;
        }

        supportedStreams.forEach(stream => {
            sectionHtml += '<div class="home-link-card">';
            sectionHtml += '<div class="home-link-head">';
            sectionHtml += '<img class="home-link-icon" src="../icons/' + escapeHomeHtml(stream.icon || 'stream.png') + '" onerror="this.onerror=null;this.src=\'../icons/stream.png\'">';
            sectionHtml += '<div style="vertical-align: top"><a target="_blank" rel="noopener noreferrer" href="../stream_pages/' + escapeHomeHtml(stream.id) + '.html"><div class="home-link-title"><div class="page-type-badge" style="font-size: 70%;">Experience</div><br>' + escapeHomeHtml(stream.name) + '</div>';
            sectionHtml += '</a></div>';
            sectionHtml += '</div>';
            if (stream.description) {
                sectionHtml += '<div class="home-link-copy">' + escapeHomeHtml(stream.description) + '</div>';
            }
            if (stream.flows && stream.flows.length) {
                sectionHtml += '<div class="activity-block">';
                sectionHtml += '<div class="activity-muted"><strong>Flows facilitated</strong></div>';
                stream.flows.forEach(flow => {
                    sectionHtml += '<div class="activity-muted">- ' + escapeHomeHtml(flow.title || flow.id || '') + '</div>';
                });
                sectionHtml += '</div>';
            }
            if (stream.outcomes && stream.outcomes.length) {
                sectionHtml += '<div class="activity-block">';
                sectionHtml += '<div class="activity-muted"><strong>Outcomes</strong></div>';
                stream.outcomes.forEach(outcome => {
                    sectionHtml += '<div class="activity-muted">- ' + escapeHomeHtml(outcome) + '</div>';
                });
                sectionHtml += '</div>';
            }
            sectionHtml += '</div>';
        });

        sectionHtml += '</div>';
        return sectionHtml;
    }

    function renderReferenceLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = brick.links || [];
        let sectionHtml = '<div class="home-section">';
        if (!groups.length) {
            sectionHtml += '<div class="activity-muted">No links are configured for this product brick.</div>';
            sectionHtml += '</div>';
            return sectionHtml;
        }
        groups.forEach(group => {
            sectionHtml += '<div class="links-group">';
            sectionHtml += '<div class="links-group-title">' + escapeHomeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                sectionHtml += '<div class="links-group-description">' + escapeHomeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                sectionHtml += '<div class="link-entry">';
                sectionHtml += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHomeHtml(link.link || '#') + '">'
                    + escapeHomeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    sectionHtml += '<div class="link-entry-copy">' + escapeHomeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    sectionHtml += '<iframe class="link-embed" loading="lazy" src="' + escapeHomeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHomeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                sectionHtml += '</div>';
            });
            sectionHtml += '</div>';
        });
        sectionHtml += '</div>';
        return sectionHtml;
    }

    function renderRelatedTeams() {
        let sectionHtml = '<div class="home-section">';
        sectionHtml += '<div class="home-section-title">Teams Owning Or Supporting This Brick</div>';
        if (!relatedTeams.length) {
            sectionHtml += '<div class="activity-muted">No owning or supporting teams are linked to this product brick.</div>';
            sectionHtml += '</div>';
            return sectionHtml;
        }

        relatedTeams.forEach(team => {
            sectionHtml += '<a class="home-link-card" target="_blank" rel="noopener noreferrer" href="../../teams/landing_pages/' + escapeHomeHtml(team.teamId) + '.html">';
            sectionHtml += '<div class="home-link-head">';
            sectionHtml += '<img class="home-link-icon" src="../../teams/icons/logo.png" onerror="this.onerror=null;this.src=\'../../teams/icons/logo.png\'">';
            sectionHtml += '<div>';
            if (team.teamType) {
                sectionHtml += '<div class="home-link-copy"><div class="page-type-badge" style="font-size: 70%;">' + escapeHomeHtml(team.teamType) + ' team</div></div>';
            }
            sectionHtml += '<div class="home-link-title">' + escapeHomeHtml('' + team.teamName) + '</div><div class="home-link-meta">' + escapeHomeHtml(team.roleLabel || '') + (team.groupName ? ' | ' + escapeHomeHtml(team.groupName) : '') + '</div></div>';
            sectionHtml += '</div>';
            sectionHtml += '</a>';
        });

        sectionHtml += '</div>';
        return sectionHtml;
    }

    function renderSupportedJobs() {
        let sectionHtml = '<div class="home-section">';
        sectionHtml += '<div class="home-section-title">Supported Customer Jobs-To-Be-Done</div>';
        if (!supportedJobs.length) {
            sectionHtml += '<div class="activity-muted">No supporting customer jobs were inferred for this brick.</div>';
        } else {
            const groupedJobs = {};
            supportedJobs.forEach(item => {
                const actorKey = item.customerId + '|' + item.productId;
                if (!groupedJobs[actorKey]) {
                    groupedJobs[actorKey] = {
                        customerId: item.customerId,
                        customerName: item.customerName,
                        customerGroup: item.customerGroup,
                        customerIcon: item.customerIcon,
                        productId: item.productId,
                        productName: item.productName,
                        jobs: []
                    };
                }
                groupedJobs[actorKey].jobs.push(item);
            });

            Object.values(groupedJobs).forEach(actor => {
                sectionHtml += '<div class="home-link-card">';
                sectionHtml += '<div class="home-link-head">';
                sectionHtml += '<a target="_blank" rel="noopener noreferrer" href="../../customers/landing_pages/' + escapeHomeHtml(actor.customerId) + '.html">';
                sectionHtml += '<img class="home-link-icon" src="../../customers/icons/' + escapeHomeHtml(actor.customerIcon) + '" onerror="this.onerror=null;this.src=\'../../customers/icons/customer.png\'">';
                sectionHtml += '</a>';
                sectionHtml += '<div><div class="home-link-title"><a target="_blank" rel="noopener noreferrer" href="../../customers/landing_pages/' + escapeHomeHtml(actor.customerId) + '.html">' + escapeHomeHtml(actor.customerName) + '</a></div><div class="home-link-meta">' + escapeHomeHtml(actor.customerGroup) + ' | <a target="_blank" rel="noopener noreferrer" href="../../product-deployments/landing_pages/' + escapeHomeHtml(actor.productId) + '.html">' + escapeHomeHtml(actor.productName) + '</a></div></div>';
                sectionHtml += '</div>';
                actor.jobs.forEach(item => {
                    sectionHtml += '<div class="activity-block">';
                    sectionHtml += '<div class="home-link-copy"><b>' + escapeHomeHtml(item.jobName) + '</b></div>';
                    if (item.usedInSteps && item.usedInSteps.length) {
                        item.usedInSteps.forEach(step => {
                            sectionHtml += '<div class="activity-block">';
                            sectionHtml += '<div><b>' + escapeHomeHtml(step.step) + '</b></div>';
                            if (step.description) {
                                sectionHtml += '<div class="activity-muted">' + escapeHomeHtml(step.description) + '</div>';
                            }
                            if (step.howItSupports) {
                                sectionHtml += '<div class="activity-muted"> - How it supports: ' + escapeHomeHtml(step.howItSupports) + '</div>';
                            }
                            if (step.media && step.media.length) {
                                const media = step.media[0];
                                const mediaSrc = resolveCustomerMediaSrc(media.src);
                                if (mediaSrc) {
                                    sectionHtml += '<div class="step-media-card">';
                                    sectionHtml += '<a target="_blank" rel="noopener noreferrer" href="' + escapeHomeHtml(mediaSrc) + '">';
                                    sectionHtml += '<img class="step-media-image" src="' + escapeHomeHtml(mediaSrc) + '" alt="' + escapeHomeHtml(media.alt || media.title || step.step || 'Job step media') + '">';
                                    sectionHtml += '</a>';
                                    if (media.title || media.alt) {
                                        sectionHtml += '<div class="step-media-caption">' + escapeHomeHtml(media.title || media.alt) + '</div>';
                                    }
                                    sectionHtml += '</div>';
                                }
                            }
                            sectionHtml += '</div>';
                        });
                    }
                    sectionHtml += '</div>';
                });
                sectionHtml += '</div>';
            });
        }
        sectionHtml += '</div>';
        return sectionHtml;
    }

    const configuredLayerTypes = modulesConfig.layerTypes || [];
    const moduleLayerOrder = configuredLayerTypes.length
        ? configuredLayerTypes.map(layer => layer.id).filter(Boolean)
        : ['ui', 'interfaces', 'worker', 'stateless-service', 'service', 'integration'];
    const moduleLayerLabels = configuredLayerTypes.reduce((lookup, layer) => {
        lookup[layer.id] = layer.name || layer.id;
        return lookup;
    }, {
        'ui': 'UI',
        'interfaces': 'Interfaces',
        'worker': 'Worker',
        'stateless-service': 'Stateless Service',
        'service': 'Service',
        'integration': 'Integration'
    });
    const moduleTypeDefinitions = (modulesConfig.moduleTypes || []).reduce((lookup, moduleType) => {
        if (moduleType && moduleType.id) {
            lookup[moduleType.id] = moduleType;
        }
        return lookup;
    }, {});

    function moduleLayerLabel(layerId) {
        return moduleLayerLabels[layerId] || String(layerId || '').replaceAll('-', ' ');
    }

    function moduleLayerClass(layerId) {
        return 'structure-' + String(layerId || 'service').replace(/[^a-z0-9_-]+/gi, '-').toLowerCase();
    }

    function moduleTypeColor(moduleTypeId) {
        const moduleType = moduleTypeDefinitions[String(moduleTypeId || '').toLowerCase()] || {};
        return moduleType.color || '#f3f4f6';
    }

    function normalizeLayerModules(layerId, layerConfig) {
        const modules = layerConfig && layerConfig.modules ? layerConfig.modules : {};
        if (Array.isArray(modules)) {
            return modules.map((module, index) => {
                const moduleInfo = module && typeof module === 'object' ? module : { title: String(module || '') };
                return {
                    ...moduleInfo,
                    layerId,
                    layerLabel: moduleLayerLabel(layerId),
                    displayName: moduleInfo.title || moduleInfo.name || moduleInfo.id || moduleLayerLabel(layerId) + ' module ' + (index + 1)
                };
            });
        }
        return Object.entries(modules).map(([moduleName, module]) => {
            const moduleInfo = module && typeof module === 'object' ? module : { title: String(module || '') };
            return {
                ...moduleInfo,
                layerId,
                layerLabel: moduleLayerLabel(layerId),
                displayName: moduleInfo.title || moduleInfo.name || moduleInfo.id || moduleName
            };
        });
    }

    function layerItemsOf(brickInfo) {
        const layers = brickInfo.layers || [];
        if (Array.isArray(layers)) {
            return layers.slice().sort((left, right) => {
                const leftIndex = moduleLayerOrder.includes(left.layer) ? moduleLayerOrder.indexOf(left.layer) : moduleLayerOrder.length;
                const rightIndex = moduleLayerOrder.includes(right.layer) ? moduleLayerOrder.indexOf(right.layer) : moduleLayerOrder.length;
                return leftIndex - rightIndex || String(left.layer || '').localeCompare(String(right.layer || ''));
            });
        }
        return [
            ...moduleLayerOrder.filter(layerId => layers[layerId]).map(layerId => ({ layer: layerId, ...layers[layerId] })),
            ...Object.keys(layers).filter(layerId => !moduleLayerOrder.includes(layerId)).map(layerId => ({ layer: layerId, ...layers[layerId] }))
        ];
    }

    function moduleDependencyNames(items) {
        const values = Array.isArray(items) ? items : (items ? [items] : []);
        return values.map(item => {
            if (item && typeof item === 'object') {
                return item.name || item.title || item.moduleId || item.targetModuleId || item.id || item.module || item.system || item.externalSystem || item.targetModule || item.target;
            }
            return item;
        }).filter(Boolean);
    }

    function brickById(brickId) {
        return all_bricks.find(candidate => candidate.id === brickId) || {};
    }

    function moduleByIdForBrick(brickInfo, moduleId) {
        if (!moduleId) {
            return null;
        }
        return layerItemsOf(brickInfo || {}).flatMap(layer => normalizeLayerModules(layer.layer, layer))
            .find(module => module.id === moduleId) || null;
    }

    function moduleDependencyLabel(brickInfo, moduleId) {
        const moduleInfo = moduleByIdForBrick(brickInfo, moduleId);
        if (!moduleInfo) {
            return moduleId || '';
        }
        return (moduleInfo.displayName || moduleInfo.name || moduleInfo.id) + ' (' + moduleInfo.id + ')';
    }

    function moduleReferencePill(brickInfo, moduleId) {
        const moduleInfo = moduleByIdForBrick(brickInfo, moduleId);
        const label = moduleInfo
            ? (moduleInfo.displayName || moduleInfo.name || moduleInfo.id || moduleId)
            : (moduleId || '');
        const title = moduleInfo && moduleInfo.type
            ? moduleInfo.type + ': ' + label
            : label;
        return '<span class="module-ref-pill" style="background-color: ' + escapeHomeHtml(moduleTypeColor(moduleInfo && moduleInfo.type)) + ';" title="' + escapeHomeHtml(title) + '">' + escapeHomeHtml(label) + '</span>';
    }

    function dependencyTargetModuleLabel(item) {
        const linkedBrick = brickById(item && item.targetBrickId);
        return moduleDependencyLabel(linkedBrick, item && item.moduleId);
    }

    function dependencySourceModuleLabel(item, sourceBrick) {
        return moduleDependencyLabel(sourceBrick || brick, item && item.sourceModuleId);
    }

    function moduleDataAssetItems(module) {
        const assetLookup = buildDataAssetLookup();
        const dataAssetsById = {};

        function addDataAsset(assetId, role, description) {
            if (!assetId) {
                return;
            }
            const normalizedAssetId = String(assetId);
            const asset = assetLookup[normalizedAssetId] || {};
            if (!dataAssetsById[normalizedAssetId]) {
                dataAssetsById[normalizedAssetId] = {
                    id: normalizedAssetId,
                    name: asset.name || normalizedAssetId,
                    kind: asset.kind || asset.type || '',
                    role: role || '',
                    description: description || asset.description || ''
                };
                return;
            }
            if (!dataAssetsById[normalizedAssetId].role && role) {
                dataAssetsById[normalizedAssetId].role = role;
            }
            if (!dataAssetsById[normalizedAssetId].description && description) {
                dataAssetsById[normalizedAssetId].description = description;
            }
        }

        const dataItems = Array.isArray(module.data) ? module.data : (module.data ? [module.data] : []);
        dataItems.forEach(item => {
            const assetId = item && typeof item === 'object' ? (item.assetId || item.id || item.name) : item;
            addDataAsset(
                assetId,
                item && typeof item === 'object' ? item.role : '',
                item && typeof item === 'object' ? item.description : ''
            );
        });

        (brick.dataDependencies || []).forEach(dependency => {
            const moduleIds = Array.isArray(dependency.moduleIds)
                ? dependency.moduleIds
                : (dependency.moduleIds ? [dependency.moduleIds] : (dependency.moduleId ? [dependency.moduleId] : []));
            if (module.id && moduleIds.includes(module.id)) {
                addDataAsset(dependency.assetId, dependency.role, dependency.description);
            }
        });

        return Object.values(dataAssetsById)
            .sort((left, right) => (left.name || left.id).localeCompare(right.name || right.id));
    }

    function renderModuleDataAssets(module) {
        const dataAssets = moduleDataAssetItems(module);
        if (!dataAssets.length) {
            return '';
        }
        let dataHtml = '<div class="module-data-list module-detail-content">';
        dataAssets.forEach(asset => {
            const meta = [asset.id, asset.kind, asset.role].filter(Boolean).join(' | ');
            dataHtml += '<div class="module-data-item">';
            dataHtml += '<img class="module-data-icon" src="../icons/data.png" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
            dataHtml += '<div><div class="module-data-name">' + escapeHomeHtml(asset.name || asset.id || '') + '</div>';
            if (meta) {
                dataHtml += '<div class="module-data-meta">' + escapeHomeHtml(meta) + '</div>';
            }
            if (asset.description) {
                dataHtml += '<div class="module-data-meta">' + escapeHomeHtml(asset.description) + '</div>';
            }
            dataHtml += '</div></div>';
        });
        dataHtml += '</div>';
        return dataHtml;
    }

    function renderModuleDetails(module) {
        let detailsHtml = '';
        const meta = [module.id, module.protocol, module.direction].filter(Boolean).join(' | ');
        const dependencies = module.dependencies || {};
        const moduleDependencies = moduleDependencyNames(dependencies.modules || module.moduleDependencies || []);
        const externalSystemDependencies = moduleDependencyNames(dependencies.externalSystems || module.externalSystems || module.externalSystemDependencies || []);

        if (meta) {
            detailsHtml += '<div class="structure-card-meta">' + escapeHomeHtml(meta) + '</div>';
        }
        detailsHtml += renderModuleDataAssets(module);
        if (moduleDependencies.length) {
            detailsHtml += '<div class="structure-card-meta"><b>Module dependencies:</b> ' + escapeHomeHtml(moduleDependencies.join(', ')) + '</div>';
        }
        if (externalSystemDependencies.length) {
            detailsHtml += '<div class="structure-card-meta"><b>External systems:</b> ' + escapeHomeHtml(externalSystemDependencies.join(', ')) + '</div>';
        }
        return detailsHtml;
    }

    function moduleGraphSafeId(prefix, value) {
        const raw = String(value || 'node').replace(/[^a-zA-Z0-9_]+/g, '_').replace(/^_+|_+$/g, '');
        return prefix + '_' + (raw || 'node');
    }

    function moduleGraphAllModules(brickInfo) {
        return layerItemsOf(brickInfo || {}).flatMap(layer => normalizeLayerModules(layer.layer, layer));
    }

    function moduleGraphNodeIdForModule(module, prefix) {
        return moduleGraphSafeId(prefix || 'module', module.id || module.displayName || module.name || 'module');
    }

    function moduleGraphNodeLabel(module) {
        const title = module.displayName || module.name || module.id || 'Module';
        return title;
    }

    function moduleGraphCurrentModuleLabel(module) {
        const title = module.displayName || module.name || module.id || 'Module';
        return [module.type || 'module', title].filter(Boolean).join('\\n');
    }

    function moduleGraphRenderNodeLabel(node) {
        return escapeMermaidLabel(node.label);
    }

    function moduleGraphDependencyItems(items) {
        const values = Array.isArray(items) ? items : (items ? [items] : []);
        return values.map(item => {
            if (item && typeof item === 'object') {
                return item;
            }
            return { id: item, name: item };
        }).filter(item => item && (item.id || item.name || item.moduleId || item.targetModuleId || item.targetModule || item.module || item.target || item.system));
    }

    function moduleGraphDependencyKey(item) {
        if (!item) {
            return '';
        }
        if (typeof item !== 'object') {
            return String(item || '');
        }
        return item.moduleId || item.targetModuleId || item.targetModule || item.module || item.id || item.target || item.name || item.title || '';
    }

    function moduleGraphFindModule(brickInfo, reference) {
        const key = String(moduleGraphDependencyKey(reference) || '').trim();
        if (!key) {
            return null;
        }
        const lowerKey = key.toLowerCase();
        return moduleGraphAllModules(brickInfo || {}).find(module => {
            return [module.id, module.name, module.title, module.displayName]
                .filter(Boolean)
                .some(value => String(value).toLowerCase() === lowerKey);
        }) || null;
    }

    function moduleGraphAddNode(nodeMap, node) {
        if (!node || !node.id) {
            return;
        }
        if (!nodeMap[node.id]) {
            nodeMap[node.id] = node;
        }
    }

    function moduleGraphAddEdge(edges, source, target, label) {
        if (!source || !target || source === target) {
            return;
        }
        const edgeKey = source + '|' + target + '|' + (label || '');
        if (edges.some(edge => edge.key === edgeKey)) {
            return;
        }
        edges.push({ key: edgeKey, source, target, label: label || 'depends' });
    }

    function moduleGraphExternalKey(item, index) {
        if (item && typeof item === 'object') {
            return item.system || item.name || item.id || item.externalSystem || item.target || ('External System ' + (index + 1));
        }
        return String(item || '').trim() || 'External System ' + (index + 1);
    }

    function buildModuleDependencyCatalog() {
        const nodeMap = {};
        const edges = [];
        const currentModules = moduleGraphAllModules(brick);
        const currentModuleNodeById = {};
        const currentModuleNodeByName = {};

        function currentModuleNode(module) {
            if (!module || !module.id) {
                return '';
            }
            return currentModuleNodeById[module.id] || '';
        }

        currentModules.forEach((module, index) => {
            const nodeId = moduleGraphNodeIdForModule(module, 'module_' + index);
            currentModuleNodeById[String(module.id || nodeId).toLowerCase()] = nodeId;
            [module.id, module.name, module.title, module.displayName].filter(Boolean).forEach(value => {
                currentModuleNodeByName[String(value).toLowerCase()] = nodeId;
            });
            moduleGraphAddNode(nodeMap, {
                id: nodeId,
                type: 'currentModule',
                label: moduleGraphCurrentModuleLabel(module),
                controlLabel: module.displayName || module.name || module.id || 'Module',
                layerId: module.layerId || '',
                layerLabel: module.layerLabel || moduleLayerLabel(module.layerId)
            });
        });

        function resolveCurrentModuleNode(reference) {
            const key = String(moduleGraphDependencyKey(reference) || '').toLowerCase();
            if (!key) {
                return '';
            }
            return currentModuleNodeById[key] || currentModuleNodeByName[key] || '';
        }

        function addRelatedModuleNode(relatedBrick, module, fallbackId, fallbackName) {
            const brickId = relatedBrick.id || 'external-brick';
            const moduleId = module && module.id ? module.id : (fallbackId || fallbackName || 'module');
            const nodeId = moduleGraphSafeId('related_module', brickId + '_' + moduleId);
            const moduleLabel = module
                ? (module.displayName || module.name || module.id || moduleId)
                : (fallbackName || fallbackId || 'Related module');
            const brickLabel = relatedBrick.name || relatedBrick.id || 'Other brick';
            moduleGraphAddNode(nodeMap, {
                id: nodeId,
                type: 'relatedModule',
                label: [module && module.type ? module.type : 'module', moduleLabel, brickLabel].filter(Boolean).join('\\n'),
                controlLabel: moduleLabel + ' (' + brickLabel + ')'
            });
            return nodeId;
        }

        function addExternalNode(item, index) {
            const label = moduleGraphExternalKey(item, index);
            const nodeId = moduleGraphSafeId('external', label);
            moduleGraphAddNode(nodeMap, {
                id: nodeId,
                type: 'externalSystem',
                label,
                controlLabel: label
            });
            return nodeId;
        }

        currentModules.forEach((module, moduleIndex) => {
            const sourceNodeId = currentModuleNode(module);
            if (!sourceNodeId) {
                return;
            }
            const dependencies = module.dependencies || {};

            moduleGraphDependencyItems(dependencies.modules || module.moduleDependencies || []).forEach(item => {
                const targetCurrentNodeId = resolveCurrentModuleNode(item);
                if (targetCurrentNodeId) {
                    moduleGraphAddEdge(edges, sourceNodeId, targetCurrentNodeId, item.type || 'module');
                    return;
                }
                const relatedBrick = brickById(item.targetBrickId || item.brickId);
                const relatedModule = moduleGraphFindModule(relatedBrick, item);
                const fallbackName = item.name || item.title || item.id || item.target || item.module || 'Related module';
                const relatedNodeId = addRelatedModuleNode(relatedBrick, relatedModule, moduleGraphDependencyKey(item), fallbackName);
                moduleGraphAddEdge(edges, sourceNodeId, relatedNodeId, item.type || 'module');
            });

            moduleGraphDependencyItems(dependencies.externalSystems || module.externalSystems || module.externalSystemDependencies || []).forEach((item, index) => {
                const externalNodeId = addExternalNode(item, moduleIndex + '-' + index);
                moduleGraphAddEdge(edges, sourceNodeId, externalNodeId, item.type || item.interface || 'external');
            });
        });

        (brick.brickDependencies || []).forEach(item => {
            const sourceNodeId = resolveCurrentModuleNode(item.sourceModuleId || item.sourceModule || item.module);
            if (!sourceNodeId) {
                return;
            }
            const relatedBrick = brickById(item.targetBrickId);
            const relatedModule = moduleByIdForBrick(relatedBrick, item.moduleId);
            const relatedNodeId = addRelatedModuleNode(relatedBrick, relatedModule, item.moduleId, dependencyTargetModuleLabel(item));
            moduleGraphAddEdge(edges, sourceNodeId, relatedNodeId, item.type || 'brick dependency');
        });

        findIncomingBrickDependencies().forEach(item => {
            const targetNodeId = resolveCurrentModuleNode(item.moduleId);
            if (!targetNodeId) {
                return;
            }
            const relatedBrick = brickById(item.sourceBrickId);
            const sourceModule = moduleByIdForBrick(relatedBrick, item.sourceModuleId);
            const relatedNodeId = addRelatedModuleNode(relatedBrick, sourceModule, item.sourceModuleId, dependencySourceModuleLabel(item, relatedBrick));
            moduleGraphAddEdge(edges, relatedNodeId, targetNodeId, item.type || 'brick dependency');
        });

        (brick.externalSystemsThisBrickDependsOn || brick.externalSystemDependencies || []).forEach((item, index) => {
            const sourceNodeId = resolveCurrentModuleNode(item.sourceModuleId || item.moduleId || item.module);
            if (!sourceNodeId) {
                return;
            }
            const externalNodeId = addExternalNode(item, 'out-' + index);
            moduleGraphAddEdge(edges, sourceNodeId, externalNodeId, item.type || item.interface || 'external');
        });

        (brick.externalSystemsDependingOnThisBrick || []).forEach((item, index) => {
            const targetNodeId = resolveCurrentModuleNode(item.moduleId || item.targetModuleId || item.module);
            if (!targetNodeId) {
                return;
            }
            const externalNodeId = addExternalNode(item, 'in-' + index);
            moduleGraphAddEdge(edges, externalNodeId, targetNodeId, item.type || item.interface || 'external');
        });

        return {
            nodes: Object.values(nodeMap).sort((left, right) => {
                const typeOrder = ['currentModule', 'relatedModule', 'externalSystem'];
                return typeOrder.indexOf(left.type) - typeOrder.indexOf(right.type)
                    || left.controlLabel.localeCompare(right.controlLabel);
            }),
            edges
        };
    }

        const currentNodes = catalog.nodes.filter(node => node.type === 'currentModule');

    function renderModuleDependencyGraph() {
        const graphShell = document.getElementById('ModuleDependencyGraph');
        if (!graphShell) {
            return;
        }
        const catalog = buildModuleDependencyCatalog();
        const selectedNodeIds = selectedModuleGraphValues('.module-graph-node-checkbox');
        const selectedTypes = selectedModuleGraphValues('.module-graph-type-checkbox');
        const nodes = catalog.nodes.filter(node => selectedNodeIds.has(node.id) && selectedTypes.has(node.type));
        const nodeIdSet = new Set(nodes.map(node => node.id));
        const edges = catalog.edges.filter(edge => nodeIdSet.has(edge.source) && nodeIdSet.has(edge.target));

        if (!nodes.length) {
            graphShell.innerHTML = '<div class="activity-muted">Select modules or other nodes to render the module dependency diagram.</div>';
            return;
        }

        let chart = 'flowchart TB\n\n';
        const groupedCurrentModuleIds = new Set();
        const currentModuleNodes = nodes.filter(node => node.type === 'currentModule');
        const currentModuleLayerIds = [
            ...moduleLayerOrder,
            ...Array.from(new Set(
                currentModuleNodes
                    .map(node => node.layerId || 'modules')
                    .filter(layerId => !moduleLayerOrder.includes(layerId))
            )).sort()
        ];
        currentModuleLayerIds.forEach(layerId => {
            const layerNodes = currentModuleNodes.filter(node => (node.layerId || 'modules') === layerId);
            if (!layerNodes.length) {
                return;
            }
            const layerLabel = layerNodes[0].layerLabel || (layerId === 'modules' ? 'Modules' : moduleLayerLabel(layerId));
            chart += 'subgraph ' + moduleGraphSafeId('layer', layerId) + '["' + escapeMermaidLabel(layerLabel) + '"]\n';
            layerNodes.forEach(node => {
                chart += node.id + '["' + moduleGraphRenderNodeLabel(node) + '"]\n';
                groupedCurrentModuleIds.add(node.id);
            });
            chart += 'end\n\n';
        });
        nodes.forEach(node => {
            if (groupedCurrentModuleIds.has(node.id)) {
                return;
            }
            chart += node.id + '["' + moduleGraphRenderNodeLabel(node) + '"]\n';
        });
        edges.forEach(edge => {
            chart += edge.source + ' -->|' + escapeMermaidLabel(edge.label) + '| ' + edge.target + '\n';
        });
        chart += '\nclassDef currentModule fill:#dbeafe,stroke:#2563eb,color:#1e3a8a,stroke-width:2px;\n';
        chart += 'classDef relatedModule fill:#ecfccb,stroke:#65a30d,color:#365314;\n';
        chart += 'classDef externalSystem fill:#f3f4f6,stroke:#6b7280,color:#111827;\n';
        ['currentModule', 'relatedModule', 'externalSystem'].forEach(type => {
            const ids = nodes.filter(node => node.type === type).map(node => node.id);
            if (ids.length) {
                chart += 'class ' + ids.join(',') + ' ' + type + ';\n';
            }
        });

        graphShell.innerHTML = '<div class="mermaid">' + chart + '</div>';
        mermaid.run({querySelector: '#ModuleDependencyGraph .mermaid'}).catch(error => {
            console.error('Failed to render module dependency diagram', error);
        });
    }
