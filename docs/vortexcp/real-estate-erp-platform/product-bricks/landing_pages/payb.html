    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);

": "customer-asmg-portrait.jpg", "productId": "projects-and-development", "productName": "Projects and Development Finance", "productIcon": "asmg.png", "jobId": "jtbd-asmg-1", "jobName": "Know portfolio performance in real time", "jobWhatItIs": "Maintain a continuously correct operational and financial picture of the whole portfolio: which units are let, vacant or in notice, what rent is contracted, invoiced and collected per entity, how valuations and yields move against the market, and how capex and project spend track their budgets. The picture must hold for every legal entity and fund structure the investor uses, in the Netherlands and increasingly in Germany.", "jobOutcome": "Occupancy, rent roll, arrears, valuations and capex are available per unit, complex, entity and fund from one system of record, are reconciled with the ledger without a monthly reconciliation exercise, and the asset manager can answer any performance question the same day with figures that survive audit and due diligence.", "supportRationale": "Keeps every contract's start, end, notice, break option and rent history current so the rent roll reflects what is actually signed.", "usedInSteps": [{"step": "Monitor occupancy, vacancy and the rent roll", "description": "Follow let, vacant and in-notice units per complex and entity, the contracted versus market rent per square metre, upcoming expiries and break options, and the letting pipeline of the property manager. Distinguish structural vacancy from turnover vacancy and see for how many days a unit has been empty and why.", "howItSupports": "Keeps every contract's start, end, notice, break option and rent history current so the rent roll reflects what is actually signed.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-1-2.png", "title": "Asset and Portfolio Manager JTBD step 2: Monitor occupancy, vacancy and the rent roll", "alt": "Enterprise infographic for step 2 of the job \"Know portfolio performance in real time\": Monitor occupancy, vacancy and the rent roll."}]}, {"step": "Follow valuations, yields and market position", "description": "Record external appraisals and internal valuations per object, compare gross and net initial yields with market benchmarks and transactions, watch loan-to-value and interest cover per financed entity, and prepare the valuation inputs (rent roll, vacancy, capex, lease terms) that appraisers and lenders request each half year.", "howItSupports": "Provides the audited net rental income and balance-sheet figures per entity that valuation and covenant calculations must reconcile with.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-1-4.png", "title": "Asset and Portfolio Manager JTBD step 4: Follow valuations, yields and market position", "alt": "Enterprise infographic for step 4 of the job \"Know portfolio performance in real time\": Follow valuations, yields and market position."}]}, {"step": "Watch capex and project spend against budget", "description": "Track renovation, sustainability and transformation projects per object with budget, commitments, invoices and milestones, see forecast-to-complete against the business case, and follow the hand-over of a delivered building or renovated units into the exploitation books and the rent roll.", "howItSupports": "Holds project budgets, commitments, invoices and milestones per object and moves delivered units into exploitation without re-keying.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-1-5.png", "title": "Asset and Portfolio Manager JTBD step 5: Watch capex and project spend against budget", "alt": "Enterprise infographic for step 5 of the job \"Know portfolio performance in real time\": Watch capex and project spend against budget."}]}]}, {"customerId": "asmg", "customerName": "Asset and Portfolio Manager", "customerGroup": "Real Estate Investors and Asset Managers", "customerIcon": "customer-asmg-portrait.jpg", "productId": "projects-and-development", "productName": "Projects and Development Finance", "productIcon": "asmg.png", "jobId": "jtbd-asmg-2", "jobName": "Grow rental income through indexation, letting and active asset management", "jobWhatItIs": "Increase net rental income of the portfolio year on year within the legal frame: apply annual rent indexation correctly on every eligible contract, shorten vacancy and turnover time, manage renewals, break options and rent reviews on commercial leases, recover service charges fully, and decide where capex, transformation or a sale creates more value than holding. In the Netherlands this means CPI-based indexation, regulated-sector rent rules and the Huurcommissie; in Germany Indexmiete and Staffelmiete clauses, the Mietpreisbremse and Betriebskosten settlements.", "jobOutcome": "Every eligible contract is indexed on time with the correct index and cap, vacancy days per turnover and structural vacancy fall, renewals and rent reviews are decided before deadlines pass, service charges are recovered rather than absorbed, and net rental income grows like-for-like without a compliance incident.", "supportRationale": "Calculates indexation per contract from the index series and contract terms, produces the letters and posts the new rent, with an exception list for capped, regulated and special-term contracts.", "usedInSteps": [{"step": "Run the annual indexation round across the portfolio", "description": "Select the contracts due for indexation by anniversary date or by 1 July, apply the contractual index (CPI, CPI plus a percentage, Staffel) and the legal or contractual caps, generate the rent-increase letters with the required notice period, post the new rents to the next rent run, and handle objections and regulated-sector exceptions without pausing the batch.", "howItSupports": "Calculates indexation per contract from the index series and contract terms, produces the letters and posts the new rent, with an exception list for capped, regulated and special-term contracts.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-2-1.png", "title": "Asset and Portfolio Manager JTBD step 1: Run the annual indexation round across the portfolio", "alt": "Enterprise infographic for step 1 of the job \"Grow rental income through indexation, letting and active asset management\": Run the annual indexation round across the portfolio."}]}, {"step": "Run the annual indexation round across the portfolio", "description": "Select the contracts due for indexation by anniversary date or by 1 July, apply the contractual index (CPI, CPI plus a percentage, Staffel) and the legal or contractual caps, generate the rent-increase letters with the required notice period, post the new rents to the next rent run, and handle objections and regulated-sector exceptions without pausing the batch.", "howItSupports": "Runs the indexation batch and letter generation as a scheduled robot job so thousands of contracts are processed without a manual campaign.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-2-1.png", "title": "Asset and Portfolio Manager JTBD step 1: Run the annual indexation round across the portfolio", "alt": "Enterprise infographic for step 1 of the job \"Grow rental income through indexation, letting and active asset management\": Run the annual indexation round across the portfolio."}]}, {"step": "Manage renewals, break options and commercial rent reviews", "description": "Get a rolling view of commercial leases approaching expiry, break or review dates, decide whether to renew, re-let or renegotiate, negotiate rent-free periods and incentives, and record the outcome as a contract change so the rent roll and cash flow forecast update immediately.", "howItSupports": "Tracks break options, expiries and review clauses per contract, generates the renewal or termination documents and records rent changes and incentives with effective dates.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-2-3.png", "title": "Asset and Portfolio Manager JTBD step 3: Manage renewals, break options and commercial rent reviews", "alt": "Enterprise infographic for step 3 of the job \"Grow rental income through indexation, letting and active asset management\": Manage renewals, break options and commercial rent reviews."}]}, {"step": "Recover service charges fully and defensibly", "description": "Set the service charge advances per complex at a realistic level, monitor recoverable costs during the year, review the annual settlement per complex and tenant within the legal deadline, and adjust advances so that non-recoverable cost and tenant disputes shrink year on year.", "howItSupports": "Calculates the annual service charge settlement per complex and contract from booked costs and distribution keys and produces the tenant statements.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-2-4.png", "title": "Asset and Portfolio Manager JTBD step 4: Recover service charges fully and defensibly", "alt": "Enterprise infographic for step 4 of the job \"Grow rental income through indexation, letting and active asset management\": Recover service charges fully and defensibly."}]}, {"step": "Recover service charges fully and defensibly", "description": "Set the service charge advances per complex at a realistic level, monitor recoverable costs during the year, review the annual settlement per complex and tenant within the legal deadline, and adjust advances so that non-recoverable cost and tenant disputes shrink year on year.", "howItSupports": "Delivers the booked recoverable and non-recoverable costs per complex that the settlement and the recovery-rate analysis rest on.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-2-4.png", "title": "Asset and Portfolio Manager JTBD step 4: Recover service charges fully and defensibly", "alt": "Enterprise infographic for step 4 of the job \"Grow rental income through indexation, letting and active asset management\": Recover service charges fully and defensibly."}]}, {"step": "Decide on capex, transformation and hold or sell", "description": "Build the case for a renovation, energy-label upgrade, transformation of offices into housing or a disposal on the object's rent roll, vacancy, valuation, capex forecast and financing, run the project when approved, and compare the realised rent and value uplift with the business case afterwards.", "howItSupports": "Carries the approved project budget, commitments and milestones and hands the delivered units over into exploitation.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-2-5.png", "title": "Asset and Portfolio Manager JTBD step 5: Decide on capex, transformation and hold or sell", "alt": "Enterprise infographic for step 5 of the job \"Grow rental income through indexation, letting and active asset management\": Decide on capex, transformation and hold or sell."}]}]}, {"customerId": "asmg", "customerName": "Asset and Portfolio Manager", "customerGroup": "Real Estate Investors and Asset Managers", "customerIcon": "customer-asmg-portrait.jpg", "productId": "projects-and-development", "productName": "Projects and Development Finance", "productIcon": "asmg.png", "jobId": "jtbd-asmg-3", "jobName": "Report to investors and lenders without a reporting project", "jobWhatItIs": "Produce the quarterly and annual reporting that fund managers, institutional and private investors, joint-venture partners and financing banks require: rent roll and occupancy, net rental income and cost ratios, valuations and yields, loan covenants such as loan-to-value and interest cover, capex and project progress, and increasingly ESG and energy-label data. The packs must reconcile with the closed ledger per entity and fund and be reproducible for the auditor.", "jobOutcome": "Investor and lender reports are generated from the closed period and the live rent roll in days rather than weeks, every figure traces back to contracts, invoices and bank lines, ad-hoc questions are answered from the same data, and the asset manager spends the quarter steering assets instead of assembling spreadsheets.", "supportRationale": "Holds the report definitions per fund, entity and lender, mapped to ledger accounts and rent-roll fields, and the reporting calendar.", "usedInSteps": [{"step": "Define the reporting pack per fund, investor and lender", "description": "Agree with each fund, investor and lender which figures, definitions and layouts they need (rent roll, occupancy, net rental income, covenants, capex, ESG), map them to entities and ledger accounts, and set the reporting calendar so the pack is a template that refreshes every quarter rather than a new document.", "howItSupports": "Holds the report definitions per fund, entity and lender, mapped to ledger accounts and rent-roll fields, and the reporting calendar.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-3-1.png", "title": "Asset and Portfolio Manager JTBD step 1: Define the reporting pack per fund, investor and lender", "alt": "Enterprise infographic for step 1 of the job \"Report to investors and lenders without a reporting project\": Define the reporting pack per fund, investor and lender."}]}, {"step": "Close the period with the finance controller", "description": "Confirm with finance that rent runs, bank reconciliation, supplier invoices, accruals and valuation postings are complete per entity, review the period-close checklist, and freeze the figures so the operating data in the report and the ledger tell the same story.", "howItSupports": "Runs the close checklist per entity, consolidates the entities of a fund and locks the period so reports are built on frozen figures.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-3-2.png", "title": "Asset and Portfolio Manager JTBD step 2: Close the period with the finance controller", "alt": "Enterprise infographic for step 2 of the job \"Report to investors and lenders without a reporting project\": Close the period with the finance controller."}]}, {"step": "Generate the quarterly reports and dashboards", "description": "Produce the investor pack per fund and the lender pack per financed entity from the closed period: rent roll and occupancy, net rental income versus budget, arrears, valuations and yields, covenant ratios, capex and projects. Review exceptions and commentary, and publish interactive dashboards for investors who prefer them to a PDF.", "howItSupports": "Generates the investor and lender report packs from the closed ledger and the rent roll with the agreed definitions and layouts.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-3-3.png", "title": "Asset and Portfolio Manager JTBD step 3: Generate the quarterly reports and dashboards", "alt": "Enterprise infographic for step 3 of the job \"Report to investors and lenders without a reporting project\": Generate the quarterly reports and dashboards."}]}, {"step": "Answer covenant tests and ad-hoc investor questions", "description": "Run the loan-to-value, interest-cover and debt-service tests per financed entity when the bank asks, answer questions on a specific complex, tenant concentration, expiry profile or energy-label distribution within a day, and keep every answer traceable to the data it came from.", "howItSupports": "Provides an AI assistant that drafts answers to recurring investor and lender questions from the portfolio data and the API that feeds the investor's own BI tools.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-3-4.png", "title": "Asset and Portfolio Manager JTBD step 4: Answer covenant tests and ad-hoc investor questions", "alt": "Enterprise infographic for step 4 of the job \"Report to investors and lenders without a reporting project\": Answer covenant tests and ad-hoc investor questions."}]}, {"step": "Share reports and approvals through the investor and owner portal", "description": "Publish the packs, dashboards, valuation reports and project updates to investors, joint-venture partners and lenders in a branded portal with the right access per fund and entity, collect approvals for capex and sale decisions where the structure requires them, and retire the e-mail-and-attachment distribution.", "howItSupports": "Gives investors and partners a portal with reports, statements, documents and approvals scoped to their funds and entities.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-3-5.png", "title": "Asset and Portfolio Manager JTBD step 5: Share reports and approvals through the investor and owner portal", "alt": "Enterprise infographic for step 5 of the job \"Report to investors and lenders without a reporting project\": Share reports and approvals through the investor and owner portal."}]}, {"step": "Share reports and approvals through the investor and owner portal", "description": "Publish the packs, dashboards, valuation reports and project updates to investors, joint-venture partners and lenders in a branded portal with the right access per fund and entity, collect approvals for capex and sale decisions where the structure requires them, and retire the e-mail-and-attachment distribution.", "howItSupports": "Publishes the released report versions and investor statements to the portal and keeps the distribution history.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-3-5.png", "title": "Asset and Portfolio Manager JTBD step 5: Share reports and approvals through the investor and owner portal", "alt": "Enterprise infographic for step 5 of the job \"Report to investors and lenders without a reporting project\": Share reports and approvals through the investor and owner portal."}]}]}, {"customerId": "finc", "customerName": "Real Estate Finance Controller", "customerGroup": "Real Estate Investors and Asset Managers", "customerIcon": "customer-finc-portrait.jpg", "productId": "projects-and-development", "productName": "Projects and Development Finance", "productIcon": "asmg.png", "jobId": "jtbd-finc-1", "jobName": "Invoice and collect every euro of rent on time", "jobWhatItIs": "Turn the active lease contracts of every entity into correct rent invoices each period, collect the money through SEPA direct debit and bank transfer, match every incoming payment to its invoice, and follow up arrears through a structured dunning process that respects tenant rights and hands over to collection when needed. Residential rent is invoiced monthly and largely direct-debited; commercial rent quarterly or monthly with VAT where the lease is opted for taxation.", "jobOutcome": "The rent run per entity goes out on the invoicing date without manual corrections, direct debits are collected on schedule, payments are matched automatically, arrears are visible and acted on by ageing bucket, and the collection rate stays above target with a complete file for every case handed to collection.", "supportRationale": "Delivers the contract changes with effective dates (indexation, changes, terminations, advances) that the rent run must reflect.", "usedInSteps": [{"step": "Prepare and check the periodic rent run", "description": "Before the invoicing date, review contract changes since the last run (new leases, terminations, indexations, changed service charge advances, deposit settlements), run the pre-invoicing check per entity for anomalies such as zero amounts, missing VAT codes or overlapping periods, and release the run.", "howItSupports": "Delivers the contract changes with effective dates (indexation, changes, terminations, advances) that the rent run must reflect.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-1-1.png", "title": "Real Estate Finance Controller JTBD step 1: Prepare and check the periodic rent run", "alt": "Enterprise infographic for step 1 of the job \"Invoice and collect every euro of rent on time\": Prepare and check the periodic rent run."}]}, {"step": "Issue invoices and collect through direct debit", "description": "Generate the invoices with the correct VAT treatment per contract, deliver them to tenants by e-mail and the tenant portal, create the SEPA direct debit batch per entity with valid mandates and pre-notifications, submit it to the bank and process rejections and reversals.", "howItSupports": "Publishes invoices, payment status and mandate details to the tenant portal and app so tenants pay and check without calling.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-1-2.png", "title": "Real Estate Finance Controller JTBD step 2: Issue invoices and collect through direct debit", "alt": "Enterprise infographic for step 2 of the job \"Invoice and collect every euro of rent on time\": Issue invoices and collect through direct debit."}]}, {"step": "Match incoming payments to invoices every day", "description": "Import bank statements per entity daily, let the matching rules and robot allocate transfers and direct debit collections to open invoices by reference, amount and debtor, handle partial payments, overpayments and payments on the wrong entity, and keep the debtor position true at the end of each day.", "howItSupports": "Runs the daily statement import and matching robot and learns allocation rules from the controller's manual decisions.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-1-3.png", "title": "Real Estate Finance Controller JTBD step 3: Match incoming payments to invoices every day", "alt": "Enterprise infographic for step 3 of the job \"Invoice and collect every euro of rent on time\": Match incoming payments to invoices every day."}]}, {"step": "Run dunning and agree payment arrangements", "description": "Execute the dunning schedule per entity and tenant type (reminder, formal notice, final notice with costs), pause it for tenants with an agreed payment plan or a dispute, register payment arrangements and monitor compliance, and coordinate with the property manager on tenants who need a conversation rather than a letter.", "howItSupports": "Lets tenants see their arrears, propose a payment plan and pay online, reducing the letters and calls the team handles.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-1-4.png", "title": "Real Estate Finance Controller JTBD step 4: Run dunning and agree payment arrangements", "alt": "Enterprise infographic for step 4 of the job \"Invoice and collect every euro of rent on time\": Run dunning and agree payment arrangements."}]}, {"step": "Hand over to collection and settle deposits and write-offs", "description": "For tenants that do not respond, compile the collection file (contract, invoices, dunning history, correspondence) for the collection agency or bailiff, follow the case, settle deposits against final invoices at termination, and book write-offs and provisions per entity with the asset manager's approval.", "howItSupports": "Settles the deposit against the final invoice and damages at termination and closes the contract's financial position.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-1-5.png", "title": "Real Estate Finance Controller JTBD step 5: Hand over to collection and settle deposits and write-offs", "alt": "Enterprise infographic for step 5 of the job \"Invoice and collect every euro of rent on time\": Hand over to collection and settle deposits and write-offs."}]}, {"step": "Hand over to collection and settle deposits and write-offs", "description": "For tenants that do not respond, compile the collection file (contract, invoices, dunning history, correspondence) for the collection agency or bailiff, follow the case, settle deposits against final invoices at termination, and book write-offs and provisions per entity with the asset manager's approval.", "howItSupports": "Books provisions and write-offs per entity so the debtor position in the closed period is realistic.", "media": [{"type": "image", "src": "media/jbtd-finc-jtbd-finc-1-5.png", "title": "Real Estate Finance Controller JTBD step 5: Hand over to collection and settle deposits and write-offs", "alt": "Enterprise infographic for step 5 of the job \"Invoice and collect every euro of rent on time\": Hand over to collection and settle deposits and write-offs."}]}]}, {"customerId": "finc", "customerName": "Real Estate Finance Controller", "customerGroup": "Real Estate Investors and Asset Managers", "customerIcon": "customer-finc-portrait.jpg", "productId": "projects-and-development", "productName": "Projects and Development Finance", "productIcon": "asmg.png", "jobId": "jtbd-finc-2", "jobName": "Keep multi-entity books accurate and reconciled every day", "jobWhatItIs": "Maintain the general ledger of every legal entity in the group as a true, reconciled record at any point in the month: entity structure and chart of accounts, supplier and maintenance invoices with approval, bank reconciliation per entity, VAT with exempt and taxed rent, intercompany positions, fixed assets and loans. The books must be ready for the accountant, the auditor and the asset manager without a monthly clean-up.", "jobOutcome": "Every entity's ledger is reconciled with its bank accounts, debtors and creditors at the end of each day, supplier invoices are approved and paid within terms, VAT is filed correctly per entity, intercompany positions balance, and the finance team spends its time on exceptions and analysis rather than on booking and reconciling.", "supportRationale": "Holds the multi-entity ledger, cost centres per complex and the consolidation structure per fund that all postings follow.", "usedInSteps": [{"step": "Maintain the entity structure, chart of accounts and opening balances", "description": "Set up each legal entity with its objects, bank accounts, loans, VAT status and reporting group, apply the group chart of accounts and cost-centre structure per complex, and load opening balances when an entity or portfolio is acquired or migrated from a legacy system.", "howItSupports": "Holds the multi-entity ledger, cost centres pe vels, prioritise maintenance budgets, review late statements and track the effect next week.", "howItSupports": "Shows maintenance budgets and multi-year plans against actual spend for the meeting's capex decisions.", "media": [{"type": "image", "src": "media/jbtd-mdir-jtbd-mdir-3-5.png", "title": "Real Estate Company Director JTBD step 5: Review, decide and adjust weekly", "alt": "Enterprise infographic for step 5 of the job \"Run a compliant, insight-driven real estate business\": Review, decide and adjust weekly."}]}]}, {"customerId": "finc", "customerName": "Real Estate Finance Controller", "customerGroup": "Real Estate Investors and Asset Managers", "customerIcon": "customer-finc-portrait.jpg", "productId": "hyper-automation-and-ai", "productName": "Hyper Automation and AI Assistants", "productIcon": "finc.png", "jobId": "jtbd-finc-1", "jobName": "Invoice and collect every euro of rent on time", "jobWhatItIs": "Turn the active lease contracts of every entity into correct rent invoices each period, collect the money through SEPA direct debit and bank transfer, match every incoming payment to its invoice, and follow up arrears through a structured dunning process that respects tenant rights and hands over to collection when needed. Residential rent is invoiced monthly and largely direct-debited; commercial rent quarterly or monthly with VAT where the lease is opted for taxation.", "jobOutcome": "The rent run per entity goes out on the invoicing date without manual corrections, direct debits are collected on schedule, payments are matched automatically, arrears are visible and acted on by ageing bucket, and the collection rate stays above target with a complete file for every case handed to collection.", "supportRationale": "Delivers the contract changes with effective dates (indexation, changes, terminations, advances) that the rent run must reflect.", "usedInSteps": [{"step": "Prepare and check the periodic rent run", "description": "Before the invoicing date, r     function renderDependenciesDiagramIfNeeded() {
        const container = document.getElementById('Dependencies');
        if (!container || container.dataset.diagramRendered === 'true') {
            return;
        }
        mermaid.run({querySelector: '#Dependencies .mermaid'}).then(() => {
            container.dataset.diagramRendered = 'true';
        }).catch(error => {
            console.error('Failed to render dependency diagram', error);
        });
    }

    function renderModuleDependencyGraphIfNeeded() {
        if (!document.getElementById('ModuleDependencyGraph')) {
            return;
        }
        renderModuleDependencyGraph();
    }

    // The shared tabs script (_imports/tabs) calls this hook after a tab opens.
    window.afterOpenTab = function (tabName) {
        if (tabName === 'dependencies') {
            renderDependenciesDiagramIfNeeded();
        }
        if (tabName === 'modules') {
            updateModuleDetailsVisibility();
            renderModuleDependencyGraphIfNeeded();
        }
    };

    function updateModuleDetailsVisibility() {
        const toggle = document.getElementById('moduleDetailsToggle');
        const showDetails = !toggle || toggle.checked;
        document.querySelectorAll('#Modules .module-detail-content').forEach(element => {
            element.style.display = showDetails ? '' : 'none';
        });
    }

    function updateBrickTabLabels() {
        const moduleCount = (brick.layers || []).reduce((total, layer) => {
            const modules = layer && layer.modules ? layer.modules : [];
            if (Array.isArray(modules)) {
                return total + modules.length;
            }
            return total + Object.keys(modules).length;
        }, 0);
        const dataCount = (brick.dataDependencies || []).length;
        const dependenciesCount = (brick.brickDependencies || []).length
            + findIncomingBrickDependencies().length
            + (brick.externalSystemsThisBrickDependsOn || brick.externalSystemDependencies || []).length
            + (brick.externalSystemsDependingOnThisBrick || []).length;
        const linksCount = (brick.links || []).reduce((sum, group) => sum + (group.links || []).length, 0);
        const modulesTab = document.getElementById('tab_modules');
        const dataTab = document.getElementById('tab_data');
        const dependenciesTab = document.getElementById('tab_dependencies');
        const linksTab = document.getElementById('tab_links');
        if (modulesTab) {
            modulesTab.textContent = 'Modules (' + moduleCount + ')';
        }
        if (dataTab) {
            dataTab.textContent = 'Data (' + dataCount + ')';
        }
        if (dependenciesTab) {
            dependenciesTab.textContent = 'Dependencies (' + dependenciesCount + ')';
        }
        if (linksTab) {
            linksTab.textContent = 'Links (' + linksCount + ')';
        }
    }

<script>
    let div = document.createElement('div');
    document.body.appendChild(div);

    let html = '';

    function addNavigation() {
        html += '<div style="margin: 4px 20px 10px 20px; font-size: 85%; color: black">';
        let prev_domain = all_bricks.length ? all_bricks[0].domain : '';
        all_bricks.filter(c => c.domain && c.domain.toLowerCase().trim() !== 'on ice').forEach(cap => {
            if (prev_domain && prev_domain.toLowerCase() !== cap.domain.toLowerCase()) {
                prev_domain = cap.domain;
                html += '<div style="margin-top: 5px; margin-left: 4px; vertical-align: top; display: inline-block; border-left: 2px solid lightgrey; height: 30px;">&nbsp;</div>';
            }
            html += '<a href="' + cap.id + '.html">';
            const tabClass = cap.id === brick.id ? 'tab-image-selected' : 'tab-image';
            html += '<img src="../icons/' + cap.id + '.png" class="' + tabClass + '" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
            html += '</a>';
        });
        html += '</div>';
    }

    addNavigation();

    html += '<div style="margin: 20px">';

    function addHeader() {
        html += '<table>';
        html += '<tr>';
        html += '<td>';
        html += '<div>';
        html += '<img src="../icons/' + brick.id + '.png" style="width: 110px" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
        html += '</div>';
        html += '</td>';
        html += '<td style="vertical-align: top">';
        html += '<div style="margin-left: 20px; font-size: 90%; color: grey; vertical-align: top">';
        html += '<div class="page-type-badge">Brick</div>';
        html += brick.domain;
        if (brick.group && brick.group !== brick.domain) {
            html += ' / ' + brick.group;
        }
        html += ' / <span style="color: blue; font-weight: bold;">' + brick.id.toUpperCase() + '</span>';
        html += '</div>';
        html += '<div style="font-size: 50px; margin-left: 20px">';
        html += brick.name;
        html += '</div>';
        html += '<div style="font-size: 16px; margin-left: 20px; color: grey; margin-top: 3px">';
        html += brick.description ? brick.description : '';
        html += '</div>';
        html += '</td>';
        html += '</tr>';
        html += '</table>';
    }

    addHeader();

    function addDocs() {
        html += '<div  class="" style="margin-top: 32px">';

        function addGroup(docs, icon) {
            if (docs) {
                docs.split('\n').forEach(doc => {
                    const elements = doc.trim().split(',');
                    const label = elements.length > 0 ? elements[0].trim() : '';
                    const link = elements.length > 1 ? elements[1].trim() : '';
                    if (label && link) {
                        html += '<a target="_blank" href="' + link + '">';
                        html += '<div class="docs">';
                        html += '<div>';
                        if (label.startsWith('Security ')) icon = 'security.png';
                        html += '<img src="../icons/' + icon + '" ' + 'style="width: 54px;">';
                        html += '</div>';
                        html += '<div style="font-size: 110%">' + label.replace(/_/g, ' ') + '</div>';
                        html += '</div>';
                        html += '</a>';
                    }
                });
            }
        }

        html += '</div>';
    }

    document.getElementById('Header').innerHTML = html;
    html = '';

    function escapeHomeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function resolveCustomerMediaSrc(src) {
        const value = (src || '').trim();
        if (!value) {
            return '';
        }
        if (value.startsWith('http://') || value.startsWith('https://') || value.startsWith('data:')) {
            return value;
        }
        if (value.startsWith('../') || value.startsWith('./')) {
            return value;
        }
        if (value.startsWith('media/') || value.startsWith('icons/')) {
            return '../../customers/' + value;
        }
        return '../../customers/media/' + value;
    }

    function escapeMermaidLabel(value) {
        return (value || '')
            .replaceAll('&', 'and')
            .replaceAll('"', '')
            .replaceAll("'", '')
            .replaceAll('<', '')
            .replaceAll('>', '')
            .replaceAll('[', '(')
            .replaceAll(']', ')')
            .replaceAll('{', '(')
            .replaceAll('}', ')')
            .replaceAll('|', '/');
    }

    function renderLinkedProducts() {
        let sectionHtml = '<div class="home-section">';
        sectionHtml += '<div class="home-section-title">Used In Products</div>';
        if (!linkedProducts.length) {
            sectionHtml += '<div class="activity-muted">No linked products were inferred for this brick.</div>';
        } else {
            linkedProducts.forEach(product => {
                sectionHtml += '<a class="home-link-card" target="_blank" rel="noopener noreferrer" href="../../product-deployments/landing_pages/' + escapeHomeHtml(product.id) + '.html">';
                sectionHtml += '<div class="home-link-head">';
                sectionHtml += '<img class="home-link-icon" src="../../product-deployments/icons/' + escapeHomeHtml(product.icon) + '" onerror="this.onerror=null;this.src=\'../../product-deployments/icons/product.png\'">';
                sectionHtml += '<div><div class="home-link-title">' + escapeHomeHtml(product.name) + '</div><div class="home-link-meta">' + escapeHomeHtml(product.type || 'Product') + '</div></div>';
                sectionHtml += '</div>';
                if (product.whyUsed) {
                    sectionHtml += '<div class="home-link-copy">' + escapeHomeHtml(product.whyUsed) + '</div>';
                }
                sectionHtml += '</a>';
            });
        }
        sectionHtml += '</div>';
        return sectionHtml;
    }

    function renderSupportedStreams() {
        const supportedStreams = allStreams.filter(stream => {
            return (stream.brickDependencies || []).some(dep => dep.targetBrickId === brick.id);
        });

        let sectionHtml = '<div class="home-section">';
        sectionHtml += '<div class="home-section-title">Supported Product Streams</div>';
        if (!supportedStreams.length) {
            sectionHtml += '<div class="activity-muted">No product streams currently reference this brick.</div>';
            sectionHtml += '</div>';
            return sectionHtml;
        }

        supportedStreams.forEach(stream => {
            sectionHtml += '<div class="home-link-card">';
            sectionHtml += '<div class="home-link-head">';
            sectionHtml += '<img class="home-link-icon" src="../icons/' + escapeHomeHtml(stream.icon || 'stream.png') + '" onerror="this.onerror=null;this.src=\'../icons/stream.png\'">';
            sectionHtml += '<div style="vertical-align: top"><a target="_blank" rel="noopener noreferrer" href="../stream_pages/' + escapeHomeHtml(stream.id) + '.html"><div class="home-link-title"><div class="page-type-badge" style="font-size: 70%;">Experience</div><br>' + escapeHomeHtml(stream.name) + '</div>';
            sectionHtml += '</a></div>';
            sectionHtml += '</div>';
            if (stream.description) {
                sectionHtml += '<div class="home-link-copy">' + escapeHomeHtml(stream.description) + '</div>';
            }
            if (stream.flows && stream.flows.length) {
                sectionHtml += '<div class="activity-block">';
                sectionHtml += '<div class="activity-muted"><strong>Flows facilitated</strong></div>';
                stream.flows.forEach(flow => {
                    sectionHtml += '<div class="activity-muted">- ' + escapeHomeHtml(flow.title || flow.id || '') + '</div>';
                });
                sectionHtml += '</div>';
            }
            if (stream.outcomes && stream.outcomes.length) {
                sectionHtml += '<div class="activity-block">';
                sectionHtml += '<div class="activity-muted"><strong>Outcomes</strong></div>';
                stream.outcomes.forEach(outcome => {
                    sectionHtml += '<div class="activity-muted">- ' + escapeHomeHtml(outcome) + '</div>';
                });
                sectionHtml += '</div>';
            }
            sectionHtml += '</div>';
        });

        sectionHtml += '</div>';
        return sectionHtml;
    }

    function renderReferenceLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = brick.links || [];
        let sectionHtml = '<div class="home-section">';
        if (!groups.length) {
            sectionHtml += '<div class="activity-muted">No links are configured for this product brick.</div>';
            sectionHtml += '</div>';
            return sectionHtml;
        }
        groups.forEach(group => {
            sectionHtml += '<div class="links-group">';
            sectionHtml += '<div class="links-group-title">' + escapeHomeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                sectionHtml += '<div class="links-group-description">' + escapeHomeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                sectionHtml += '<div class="link-entry">';
                sectionHtml += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHomeHtml(link.link || '#') + '">'
                    + escapeHomeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    sectionHtml += '<div class="link-entry-copy">' + escapeHomeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    sectionHtml += '<iframe class="link-embed" loading="lazy" src="' + escapeHomeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHomeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                sectionHtml += '</div>';
            });
            sectionHtml += '</div>';
        });
        sectionHtml += '</div>';
        return sectionHtml;
    }

    function renderRelatedTeams() {
        let sectionHtml = '<div class="home-section">';
        sectionHtml += '<div class="home-section-title">Teams Owning Or Supporting This Brick</div>';
        if (!relatedTeams.length) {
            sectionHtml += '<div class="activity-muted">No owning or supporting teams are linked to this product brick.</div>';
            sectionHtml += '</div>';
            return sectionHtml;
        }

        relatedTeams.forEach(team => {
            sectionHtml += '<a class="home-link-card" target="_blank" rel="noopener noreferrer" href="../../teams/landing_pages/' + escapeHomeHtml(team.teamId) + '.html">';
            sectionHtml += '<div class="home-link-head">';
            sectionHtml += '<img class="home-link-icon" src="../../teams/icons/logo.png" onerror="this.onerror=null;this.src=\'../../teams/icons/logo.png\'">';
            sectionHtml += '<div>';
            if (team.teamType) {
                sectionHtml += '<div class="home-link-copy"><div class="page-type-badge" style="font-size: 70%;">' + escapeHomeHtml(team.teamType) + ' team</div></div>';
