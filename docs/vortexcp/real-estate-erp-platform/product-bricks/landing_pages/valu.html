    .tab {

    .tab button {
        position: relative;
        background-color: transparent;
        border: none;
        outline: none;
        cursor: pointer;
        padding: 11px 16px;
        margin-bottom: -1px;
        font-family: inherit;

        color: #1f2937;

        outline-offset: -2px;
    }

    }

    .tabcontent {
        display: none;
        padding: 2px 2px;
        animation: tabContentFade 0.2s ease;
    }

    @keyframes tabContentFade {
        from {
            opacity: 0;
            transform: translateY(3px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }

    @media (max-width: 720px) {

    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);

or and lender", "alt": "Enterprise infographic for step 1 of the job \"Report to investors and lenders without a reporting project\": Define the reporting pack per fund, investor and lender."}]}, {"step": "Close the period with the finance controller", "description": "Confirm with finance that rent runs, bank reconciliation, supplier invoices, accruals and valuation postings are complete per entity, review the period-close checklist, and freeze the figures so the operating data in the report and the ledger tell the same story.", "howItSupports": "Runs the close checklist per entity, consolidates the entities of a fund and locks the period so reports are built on frozen figures.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-3-2.png", "title": "Asset and Portfolio Manager JTBD step 2: Close the period with the finance controller", "alt": "Enterprise infographic for step 2 of the job \"Report to investors and lenders without a reporting project\": Close the period with the finance controller."}]}, {"step": "Generate the quarterly reports and dashboards", "description": "Produce the investor pack per fund and the lender pack per financed entity from the closed period: rent roll and occupancy, net rental income versus budget, arrears, valuations and yields, covenant ratios, capex and projects. Review exceptions and commentary, and publish interactive dashboards for investors who prefer them to a PDF.", "howItSupports": "Generates the investor and lender report packs from the closed ledger and the rent roll with the agreed definitions and layouts.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-3-3.png", "title": "Asset and Portfolio Manager JTBD step 3: Generate the quarterly reports and dashboards", "alt": "Enterprise infographic for step 3 of the job \"Report to investors and lenders without a reporting project\": Generate the quarterly reports and dashboards."}]}, {"step": "Generate the quarterly reports and dashboards", "description" nd published to the owner portal without a spreadsheet in between.", "howItSupports": "Closes the period and produces owner and investor statements from the multi-entity ledger.", "media": [{"type": "image", "src": "media/jbtd-mdir-jtbd-mdir-2-2.png", "title": "Real Estate Company Director JTBD step 2: Deliver owner statements and investor reports on time, every period", "alt": "Enterprise infographic for step 2 of the job \"Win and retain owner and investor clients with service quality\": Deliver owner statements and investor reports on time, every period."}]}, {"step": "Onboard a new mandate in weeks", "description": "Import the new client's objects, units, contracts and relations, set up the entity and bank connection, let the vacant units, and give the owner portal access before the first rent run, so the client experiences the switch as an upgrade.", "howItSupports": "Brings the new mandate's portfolio and contracts onto the platform with validated data.", "media": [{"type": "image", "src": "media/jbtd-mdir-jtbd-mdir-2-4.png", "title": "Real Estate Company Director JTBD step 4: Onboard a new mandate in weeks", "alt": "Enterprise infographic for step 4 of the job \"Win and retain owner and investor clients with service quality\": Onboard a new mandate in weeks."}]}, {"step": "Track retention and referrals", "description": "Review mandate renewals, lost clients, owner satisfaction and referral-sourced leads per quarter, and act on the clients whose statements were late or whose approvals stalled.", "howItSupports": "Reports client retention, statement timeliness and service KPIs per client on the management dashboard.", "media": [{"type": "image", "src": "media/jbtd-mdir-jtbd-mdir-2-5.png", "title": "Real Estate Company Director JTBD step 5: Track retention and referrals", "alt": "Enterprise infographic for step 5 of the job \"Win and retain owner and investor clients with service quality\": Track retention and referrals."}]}]}, {"customerId": "mdir", "customerName": "Real Estate Company Director", "customerGroup": "Real Estate Business Leadership", "customerIcon": "customer-mdir-portrait.jpg", "productId": "real-estate-erp-core", "productName": "Real Estate ERP Core", "productIcon": "asmg.png", "jobId": "jtbd-mdir-3", "jobName": "Run a compliant, insight-driven real estate business", "jobWhatItIs": "Steer the organisation on live occupancy, arrears, margin and cash data instead of month-old exports, and satisfy rent-price rules, tenancy law, VAT, audit and investor covenant obligations as a by-product of daily operations, with data secured in a SaaS environment the auditor and the clients trust.", "jobOutcome": "The director opens one dashboard on Monday morning and knows occupancy, arrears, margin per client and per entity and cash position; rent-price checks, indexation, VAT returns and audit files come from the system with no spreadsheet reconciliation.", "supportRationale": "Turns the KPI definitions into dashboards fed from contract, invoice, ticket and ledger data.", "usedInSteps": [{"step": "Define the steering KPIs", "description": "Agree with finance, letting and technical management on the handful of numbers that run the business: units per FTE, operating margin, occupancy, arrears share, ticket resolution time, days to close and client retention.", "howItSupports": "Turns the KPI definitions into dashboards fed from contract, invoice, ticket and ledger data.", "media": [{"type": "image", "src": "media/jbtd-mdir-jtbd-mdir-3-1.png", "title": "Real Estate Company Director JTBD step 1: Define the steering KPIs", "alt": "Enterprise infographic for step 1 of the job \"Run a compliant, insight-driven real estate business\": Define the steering KPIs."}]}, {"step": "Get margin and arrears live per client and per entity", "description": "Have management fees, staff cost, rent invoiced, rent collected and supplier cost flow into a live margin and arrears view per client, entity and complex, so pricing of mandates and collection decisions are made on facts during the year, not after it.", "howItSupports": "Provides the drill-down from portfolio to client, entity, complex and unit.", "media": [{"type": "image", "src": "media/jbtd-mdir-jtbd-mdir-3-2.png", "title": "Real Estate Company Director JTBD step 2: Get margin and arrears live per client and per entity", "alt": "Enterprise infographic for step 2 of the job \"Run a compliant, insight-driven real estate business\": Get margin and arrears live per client and per entity."}]}, {"step": "Get margin and arrears live per client and per entity", "description": "Have management fees, staff cost, rent invoiced, rent collected and supplier cost flow into a live margin and arrears view per client, entity and complex, so pricing of mandates and collection decisions are made on facts during the year, not after it.", "howItSupports": "Adds actual supplier invoices and fees so realised margin replaces planned margin.", "media": [{"type": "image", "src": "media/jbtd-mdir-jtbd-mdir-3-2.png", "title": "Real Estate Company Director JTBD step 2: Get margin and arrears live per client and per entity", "alt": "Enterprise infographic for step 2 of the job \"Run a compliant, insight-driven real estate business\": Get margin and arrears live per client and per entity."}]}, {"step": "Make compliance a by-product of the process", "description": "Ensure every letting runs a rent-price check and candidate screening, every indexation follows the legal cap and the contract clause, every service charge settlement is issued on time and every VAT return and audit file comes straight from the ledger.", "howItSupports": "Produces VAT returns, audit files and investor covenant reports from the closed ledger.", "media": [{"type": "image", "src": "media/jbtd-mdir-jtbd-mdir-3-3.png", "title": "Real Estate Company Director JTBD step 3: Make compliance a by-product of the process", "alt": "Enterprise infographic for step 3 of the job \"Run a compliant, insight-driven real estate business\": Make compliance a by-product of the process."}]}, {"step": "Review, decide and adjust weekly", "description": "Run the weekly management meeting from the dashboard: chase arrears, decide on vacant units and rent levels, prioritise maintenance budgets, review late statements and track the effect next week.", "howItSupports": "Provides weekly KPI trends and drill-down to client, entity and unit level.", "media": [{"type": "image", "src": "media/jbtd-mdir-jtbd-mdir-3-5.png", "title": "Real Estate Company Director JTBD step 5: Review, decide and adjust weekly", "alt": "Enterprise infographic for step 5 of the job \"Run a compliant, insight-driven real estate business\": Review, decide and adjust weekly."}]}]}, {"customerId": "asmg", "customerName": "Asset and Portfolio Manager", "customerGroup": "Real Estate Investors and Asset Managers", "customerIcon": "customer-asmg-portrait.jpg", "productId": "analytics-and-investor-reporting", "productName": "Data Analytics and Investor Reporting", "productIcon": "asmg.png", "jobId": "jtbd-asmg-1", "jobName": "Know portfolio performance in real time", "jobWhatItIs": "Maintain a continuously correct operational and financial picture of the whole portfolio: which units are let, vacant or in notice, what rent is contracted, invoiced and collected per entity, how valuations and yields move against the market, and how capex and project spend track their budgets. The picture must hold for every legal entity and fund structure the investor uses, in the Netherlands and increasingly in Germany.", "jobOutcome": "Occupancy, rent roll, arrears, valuations and capex are available per unit, complex, entity and fund from one system of record, are reconciled with the ledger without a monthly reconciliation exercise, and the asset manager can answer any performance question the same day with figures that survive audit and due diligence.", "supportRationale": "Brings entities, objects, complexes, units, relations, contracts and opening balances from contracts, spreadsheets or a legacy system into one structured portfolio with validation of gaps and duplicates.", "usedInSteps": [{"step": "Keep object, unit, entity and contract master data complete", "description": "Register every complex, building, unit, parking place and storage box with its surface, energy label, WOZ value, ownership entity and financing, and link every active lease, option and special term to its unit and tenant. When a portfolio is acquired or migrated from a legacy system such as Informant, import the objects, relations, contracts and opening balances in one structured onboarding rather than re-keying them over months.", "howItSupports": "Brings entities, objects, complexes, units, relations, contracts and opening balances from contracts, spreadsheets or a legacy system into one structured portfolio with validation of gaps and duplicates.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-1-1.png", "title": "Asset and Portfolio Manager JTBD step 1: Keep object, unit, entity and contract master data complete", "alt": "Enterprise infographic for step 1 of the job \"Know portfolio performance in real time\": Keep object, unit, entity and contract master data complete."}]}, {"step": "Keep object, unit, entity and contract master data complete", "description": "Register every complex, building, unit, parking place and storage box with its surface, energy label, WOZ value, ownership entity and financing, and link every active lease, option and special term to its unit and tenant. When a portfolio is acquired or migrated from a legacy system such as Informant, import the objects, relations, contracts and opening balances in one structured onboarding rather than re-keying them over months.", "howItSupports": "Shows master-data completeness per complex and entity so the asset manager knows which units lack surface, energy label or contract links before they distort a report.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-1-1.png", "title": "Asset and Portfolio Manager JTBD step 1: Keep object, unit, entity and contract master data complete", "alt": "Enterprise infographic for step 1 of the job \"Know portfolio performance in real time\": Keep object, unit, entity and contract master data complete."}]}, {"step": "Monitor occupancy, vacancy and the rent roll", "description": "Follow let, vacant and in-notice units per complex and entity, the contracted versus market rent per square metre, upcoming expiries and break options, and the letting pipeline of the property manager. Distinguish structural vacancy from turnover vacancy and see for how many days a unit has been empty and why.", "howItSupports": "Provides the occupancy, vacancy-days, expiry and rent-roll dashboards per entity, complex and unit type, refreshed from contracts and letting status rather than from a monthly extract.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-1-2.png", "title": "Asset and Portfolio Manager JTBD step 2: Monitor occupancy, vacancy and the rent roll", "alt": "Enterprise infographic for step 2 of the job \"Know portfolio performance in real time\": Monitor occupancy, vacancy and the rent roll."}]}, {"step": "Track collection, arrears and cash per entity", "description": "See invoiced rent, collected rent and arrears per entity, complex and tenant, with ageing buckets and the dunning stage each debtor is in. Judge whether a dip in collection is a payment-timing effect, a tenant in trouble or a direct-debit mandate problem, and follow up with the property manager or the finance controller.", "howItSupports": "Puts collection rate and arrears next to occupancy and rent growth per entity, so cash performance is read in the same cockpit as operational performance.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-1-3.png", "title": "Asset and Portfolio Manager JTBD step 3: Track collection, arrears and cash per entity", "alt": "Enterprise infographic for step 3 of the job \"Know portfolio performance in real time\": Track collection, arrears and cash per entity."}]}, {"step": "Follow valuations, yields and market position", "description": "Record external appraisals and internal valuations per object, compare gross and net initial yields with market benchmarks and transactions, watch loan-to-value and interest cover per financed entity, and prepare the valuation inputs (rent roll, vacancy, capex, lease terms) that appraisers and lenders request each half year.", "howItSupports": "Links valuations and market data to objects and computes yield, value per square metre and covenant ratios per entity, with a valuation-input export for appraisers and lenders.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-1-4.png", "title": "Asset and Portfolio Manager JTBD step 4: Follow valuations, yields and market position", "alt": "Enterprise infographic for step 4 of the job \"Know portfolio performance in real time\": Follow valuations, yields and market position."}]}, {"step": "Follow valuations, yields and market position", "description": "Record external appraisals and internal valuations per object, compare gross and net initial yields with market benchmarks and transactions, watch loan-to-value and interest cover per financed entity, and prepare the valuation inputs (rent roll, vacancy, capex, lease terms) that appraisers and lenders request each half year.", "howItSupports": "Provides the audited net rental income and balance-sheet figures per entity that valuation and covenant calculations must reconcile with.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-1-4.png", "title": "Asset and Portfolio Manager JTBD step 4: Follow valuations, yields and market position", "alt": "Enterprise infographic for step 4 of the job \"Know portfolio performance in real time\": Follow valuations, yields and market position."}]}, {"step": "Watch capex and project spend against budget", "description": "Track renovation, sustainability and transformation projects per object with budget, commitments, invoices and milestones, see forecast-to-complete against the business case, and follow the hand-over of a delivered building or renovated units into the exploitation books and the rent roll.", "howItSupports": "Shows capex spent and committed against budget per complex alongside the rent effect of the investment.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-1-5.png", "title": "Asset and Portfolio Manager JTBD step 5: Watch capex and project spend against budget", "alt": "Enterprise infographic for step 5 of the job \"Know portfolio performance in real time\": Watch capex and project spend against budget."}]}]}, {"customerId": "asmg", "customerName": "Asset and Portfolio Manager", "customerGroup": "Real Estate Investors and Asset Managers", "customerIcon": "customer-asmg-portrait.jpg", "productId": "analytics-and-investor-reporting", "productName": "Data Analytics and Investor Reporting", "productIcon": "asmg.png", "jobId": "jtbd-asmg-2", "jobName": "Grow rental income through indexation, letting and active asset management", "jobWhatItIs": "Increase net rental income of the portfolio year on year within the legal frame: apply annual rent indexation correctly on every eligible contract, shorten vacancy and turnover time, manage renewals, break options and rent reviews on commercial leases, recover service charges fully, and decide where capex, transformation or a sale creates more value than holding. In the Netherlands this means CPI-based indexation, regulated-sector rent rules and the Huurcommissie; in Germany Indexmiete and Staffelmiete clauses, the Mietpreisbremse and Betriebskosten settlements.", "jobOutcome": "Every eligible contract is indexed on time with the correct index and cap, vacancy days per turnover and structural vacancy fall, renewals and rent reviews are decided before deadlines pass, service charges are recovered rather than absorbed, and net rental income grows like-for-like without a compliance incident.", "supportRationale": "Reports vacancy days per turnover and per complex against the norm and flags units that stall in the pipeline.", "usedInSteps": [{"step": "Shorten vacancy and turnover time with the property manager", "description": "Set target rents and letting conditions per unit type and complex, watch listed units, viewings, screened candidates and rent-price checks in the letting pipeline, approve exceptions such as incentives or below-target rents, and push the property manager on units that exceed the vacancy-day norm.", "howItSupports": "Reports vacancy days per turnover and per complex against the norm and flags units that stall in the pipeline.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-2-2.png", "title": "Asset and Portfolio Manager JTBD step 2: Shorten vacancy and turnover time with the property manager", "alt": "Enterprise infographic for step 2 of the job \"Grow rental income through indexation, letting and active asset management\": Shorten vacancy and turnover time with the property manager."}]}, {"step": "Manage renewals, break options and commercial rent reviews", "description": "Get a rolling view of commercial leases approaching expiry, break or review dates, decide whether to renew, re-let or renegotiate, negotiate rent-free periods and incentives, and record the outcome as a contract change so the rent roll and cash flow forecast update immediately.", "howItSupports": "Shows expiry and break-option exposure per year and the rent-roll effect of each renewal decision.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-2-3.png", "title": "Asset and Portfolio Manager JTBD step 3: Manage renewals, break options and commercial rent reviews", "alt": "Enterprise infographic for step 3 of the job \"Grow rental income through indexation, letting and active asset management\": Manage renewals, break options and commercial rent reviews."}]}, {"step": "Recover service charges fully and defensibly", "description": "Set the service charge advances per complex at a realistic level, monitor recoverable costs during the year, review the annual settlement per complex and tenant within the legal deadline, and adjust advances so that non-recoverable cost and tenant disputes shrink year on year.", "howItSupports": "Delivers the booked recoverable and non-recoverable costs per complex that the settlement and the recovery-rate analysis rest on.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-2-4.png", "title": "Asset and Portfolio Manager JTBD step 4: Recover service charges fully and defensibly", "alt": "Enterprise infographic for step 4 of the job \"Grow rental income through indexation, letting and active asset management\": Recover service charges fully and defensibly."}]}, {"step": "Decide on capex, transformation and hold or sell", "description": "Build the case for a renovation, energy-label upgrade, transformation of offices into housing or a disposal on the object's rent roll, vacancy, valuation, capex forecast and financing, run the project when approved, and compare the realised rent and value uplift with the business case afterwards.", "howItSupports": "Provides the object-level rent, vacancy, valuation and yield history and the before-and-after comparison for each investment case.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-2-5.png", "title": "Asset and Portfolio Manager JTBD step 5: Decide on capex, transformation and hold or sell", "alt": "Enterprise infographic for step 5 of the job \"Grow rental income through indexation, letting and active asset management\": Decide on capex, transformation and hold or sell."}]}]}, {"customerId": "asmg", "customerName": "Asset and Portfolio Manager", "customerGroup": "Real Estate Investors and Asset Managers", "customerIcon": "customer-asmg-portrait.jpg", "productId": "analytics-and-investor-reporting", "productName": "Data Analytics and Investor Reporting", "productIcon": "asmg.png", "jobId": "jtbd-asmg-3", "jobName": "Report to investors and lenders without a reporting project", "jobWhatItIs": "Produce the quarterly and annual reporting that fund managers, institutional and private investors, joint-venture partners and financing banks require: rent roll and occupancy, net rental income and cost ratios, valuations and yields, loan covenants such as loan-to-value and interest cover, capex and project progress, and increasingly ESG and energy-label data. The packs must reconcile with the closed ledger per entity and fund and be reproducible for the auditor.", "jobOutcome": "Investor and lender reports are generated from the closed period and the live rent roll in days rather than weeks, every figure traces back to contracts, invoices and bank lines, ad-hoc questions are answered from the same data, and the asset manager spends the quarter steering assets instead of assembling spreadsheets.", "supportRationale": "Holds the report definitions per fund, entity and lender, mapped to ledger accounts and rent-roll fields, and the reporting calendar.", "usedInSteps": [{"step": "Define the reporting pack per fund, investor and lender", "description": "Agree with each fund, investor and lender which figures, definitions and layouts they need (rent roll, occupancy, net rental income, covenants, capex, ESG), map them to entities and ledger accounts, and set the reporting calendar so the pack is a template that refreshes every quarter rather than a new document.", "howItSupports": "Holds the report definitions per fund, entity and lender, mapped to ledger accounts and rent-roll fields, and the reporting calendar.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-3-1.png", "title": "Asset and Portfolio Manager JTBD step 1: Define the reporting pack per fund, investor and lender", "alt": "Enterprise infographic for step 1 of the job \"Report to investors and lenders without a reporting project\": Define the reporting pack per fund, investor and lender."}]}, {"step": "Define the reporting pack per fund, investor and lender", "description": "Agree with each fund, investor and lender which figures, definitions and layouts they need (rent roll, occupancy, net rental income, covenants, capex, ESG), map them to entities and ledger accounts, and set the reporting calendar so the pack is a template that refreshes every quarter rather than a new document.", "howItSupports": "Supplies the standard real estate KPI definitions (occupancy, yield, rent per square metre) that the packs reuse so investors see consistent numbers.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-3-1.png", "title": "Asset and Portfolio Manager JTBD step 1: Define the reporting pack per fund, investor and lender", "alt": "Enterprise infographic for step 1 of the job \"Report to investors and lenders without a reporting project\": Define the reporting pack per fund, investor and lender."}]}, {"step": "Close the period with the finance controller", "description": "Confirm with finance that rent runs, bank reconciliation, supplier invoices, accruals and valuation postings are complete per entity, review the period-close checklist, and freeze the figures so the operating data in the report and the ledger tell the same story.", "howItSupports": "Runs the close checklist per entity, consolidates the entities of a fund and locks the period so reports are built on frozen figures.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-3-2.png", "title": "Asset and Portfolio Manager JTBD step 2: Close the period with the finance controller", "alt": "Enterprise infographic for step 2 of the job \"Report to investors and lenders without a reporting project\": Close the period with the finance controller."}]}, {"step": "Generate the quarterly reports and dashboards", "description": "Produce the investor pack per fund and the lender pack per financed entity from the closed period: rent roll and occupancy, net rental income versus budget, arrears, valuations and yields, covenant ratios, capex and projects. Review exceptions and commentary, and publish interactive dashboards for investors who prefer them to a PDF.", "howItSupports": "Generates the investor and lender report packs from the closed ledger and the rent roll with the agreed definitions and layouts.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-3-3.png", "title": "Asset and Portfolio Manager JTBD step 3: Generate the quarterly reports and dashboards", "alt": "Enterprise infographic for step 3 of the job \"Report to investors and lenders without a reporting project\": Generate the quarterly reports and dashboards."}]}, {"step": "Generate the quarterly reports and dashboards", "description": "Produce the investor pack per fund and the lender pack per financed entity from the closed period: rent roll and occupancy, net rental income versus budget, arrears, valuations and yields, covenant ratios, capex and projects. Review exceptions and commentary, and publish interactive dashboards for investors who prefer them to a PDF.", "howItSupports": "Provides the interactive dashboards and Power BI datasets that investors and the asset management team explore between quarterly packs.", "media": [{"type": "image", "src": "media/jbtd-asmg-jtbd-asmg-3-3.png", "title": "Asset and Portfolio Manager JTBD step 3: Generate the quarterly reports and dashboards", "alt": "Enterprise infographic for step 3 of the job \"Report to investors and lenders without a reporting project\": Generate the quarterly reports and dashboards."}]}, {"step": "Answer covenant tests and ad-hoc investor questions", "description": "Run the loan-to-value, interest-cover and debt-service tests per financed entity when the bank asks, answer questions on a specific complex, tenant concentration, expiry profile or energy-label distribution within a day, and keep every answer traceable to the data it came from.", "howItS     function renderDependenciesDiagramIfNeeded() {
        const container = document.getElementById('Dependencies');
        if (!container || container.dataset.diagramRendered === 'true') {
            return;
        }
        mermaid.run({querySelector: '#Dependencies .mermaid'}).then(() => {
            container.dataset.diagramRendered = 'true';
        }).catch(error => {
            console.error('Failed to render dependency diagram', error);
        });
    }

    function renderModuleDependencyGraphIfNeeded() {
        if (!document.getElementById('ModuleDependencyGraph')) {
            return;
        }
        renderModuleDependencyGraph();
    }

    // The shared tabs script (_imports/tabs) calls this hook after a tab opens.
    window.afterOpenTab = function (tabName) {
        if (tabName === 'dependencies') {
            renderDependenciesDiagramIfNeeded();
        }
        if (tabName === 'modules') {
            updateModuleDetailsVisibility();
            renderModuleDependencyGraphIfNeeded();
        }
    };

    function updateModuleDetailsVisibility() {
        const toggle = document.getElementById('moduleDetailsToggle');
        const showDetails = !toggle || toggle.checked;
        document.querySelectorAll('#Modules .module-detail-content').forEach(element => {
            element.style.display = showDetails ? '' : 'none';
        });
    }

    function updateBrickTabLabels() {
        const moduleCount = (brick.layers || []).reduce((total, layer) => {
            const modules = layer && layer.modules ? layer.modules : [];
            if (Array.isArray(modules)) {
                return total + modules.length;
            }
            return total + Object.keys(modules).length;
        }, 0);
        const dataCount = (brick.dataDependencies || []).length;
        const dependenciesCount = (brick.brickDependencies || []).length
            + findIncomingBrickDependencies().length
            + (brick.externalSystemsThisBrickDependsOn || brick.externalSystemDependencies || []).length
            + (brick.externalSystemsDependingOnThisBrick || []).length;
        const linksCount = (brick.links || []).reduce((sum, group) => sum + (group.links || []).length, 0);
        const modulesTab = document.getElementById('tab_modules');
        const dataTab = document.getElementById('tab_data');
        const dependenciesTab = document.getElementById('tab_dependencies');
        const linksTab = document.getElementById('tab_links');
        if (modulesTab) {
            modulesTab.textContent = 'Modules (' + moduleCount + ')';
        }
        if (dataTab) {
            dataTab.textContent = 'Data (' + dataCount + ')';
        }
        if (dependenciesTab) {
            dependenciesTab.textContent = 'Dependencies (' + dependenciesCount + ')';
        }
        if (linksTab) {
            linksTab.textContent = 'Links (' + linksCount + ')';
        }
    }

<script>
    let div = document.createElement('div');
    document.body.appendChild(div);

    let html = '';

    function addNavigation() {
        html += '<div style="margin: 4px 20px 10px 20px; font-size: 85%; color: black">';
        let prev_domain = all_bricks.length ? all_bricks[0].domain : '';
        all_bricks.filter(c => c.domain && c.domain.toLowerCase().trim() !== 'on ice').forEach(cap => {
            if (prev_domain && prev_domain.toLowerCase() !== cap.domain.toLowerCase()) {
                prev_domain = cap.domain;
                html += '<div style="margin-top: 5px; margin-left: 4px; vertical-align: top; display: inline-block; border-left: 2px solid lightgrey; height: 30px;">&nbsp;</div>';
            }
            html += '<a href="' + cap.id + '.html">';
            const tabClass = cap.id === brick.id ? 'tab-image-selected' : 'tab-image';
            html += '<img src="../icons/' + cap.id + '.png" class="' + tabClass + '" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
            html += '</a>';
        });
        html += '</div>';
    }

    addNavigation();

    html += '<div style="margin: 20px">';

    function addHeader() {
        html += '<table>';
        html += '<tr>';
        html += '<td>';
        html += '<div>';
        html += '<img src="../icons/' + brick.id + '.png" style="width: 110px" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
        html += '</div>';
        html += '</td>';
        html += '<td style="vertical-align: top">';
        html += '<div style="margin-left: 20px; font-size: 90%; color: grey; vertical-align: top">';
        html += '<div class="page-type-badge">Brick</div>';
        html += brick.domain;
        if (brick.group && brick.group !== brick.domain) {
            html += ' / ' + brick.group;
        }
        html += ' / <span style="color: blue; font-weight: bold;">' + brick.id.toUpperCase() + '</span>';
        html += '</div>';
        html += '<div style="font-size: 50px; margin-left: 20px">';
        html += brick.name;
        html += '</div>';
        html += '<div style="font-size: 16px; margin-left: 20px; color: grey; margin-top: 3px">';
        html += brick.description ? brick.description : '';
        html += '</div>';
        html += '</td>';
        html += '</tr>';
        html += '</table>';
    }

    addHeader();

    function addDocs() {
        html += '<div  class="" style="margin-top: 32px">';

        function addGroup(docs, icon) {
            if (docs) {
                docs.split('\n').forEach(doc => {
                    const elements = doc.trim().split(',');
                    const label = elements.length > 0 ? elements[0].trim() : '';
                    const link = elements.length > 1 ? elements[1].trim() : '';
                    if (label && link) {
                        html += '<a target="_blank" href="' + link + '">';
                        html += '<div class="docs">';
                        html += '<div>';
                        if (label.startsWith('Security ')) icon = 'security.png';
                        html += '<img src="../icons/' + icon + '" ' + 'style="width: 54px;">';
                        html += '</div>';
                        html += '<div style="font-size: 110%">' + label.replace(/_/g, ' ') + '</div>';
                        html += '</div>';
                        html += '</a>';
                    }
                });
            }
        }

        html += '</div>';
    }

    document.getElementById('Header').innerHTML = html;
    html = '';

    function escapeHomeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function resolveCustomerMediaSrc(src) {
        const value = (src || '').trim();
        if (!value) {
            return '';
        }
        if (value.startsWith('http://') || value.startsWith('https://') || value.startsWith('data:')) {
            return value;
        }
        if (value.startsWith('../') || value.startsWith('./')) {
            return value;
        }
        if (value.startsWith('media/') || value.startsWith('icons/')) {
            return '../../customers/' + value;
        }
        return '../../customers/media/' + value;
    }

    function escapeMermaidLabel(value) {
        return (value || '')
            .replaceAll('&', 'and')
            .replaceAll('"', '')
            .replaceAll("'", '')
            .replaceAll('<', '')
            .replaceAll('>', '')
            .replaceAll('[', '(')
            .replaceAll(']', ')')
            .replaceAll('{', '(')
            .replaceAll('}', ')')
            .replaceAll('|', '/');
    }

    function renderLinkedProducts() {
        let sectionHtml = '<div class="home-section">';
        sectionHtml += '<div class="home-section-title">Used In Products</div>';
        if (!linkedProducts.length) {
            sectionHtml += '<div class="activity-muted">No linked products were inferred for this brick.</div>';
        } else {
            linkedProducts.forEach(product => {
                sectionHtml += '<a class="home-link-card" target="_blank" rel="noopener noreferrer" href="../../product-deployments/landing_pages/' + escapeHomeHtml(product.id) + '.html">';
                sectionHtml += '<div class="home-link-head">';
                sectionHtml += '<img class="home-link-icon" src="../../product-deployments/icons/' + escapeHomeHtml(product.icon) + '" onerror="this.onerror=null;this.src=\'../../product-deployments/icons/product.png\'">';
                sectionHtml += '<div><div class="home-link-title">' + escapeHomeHtml(product.name) + '</div><div class="home-link-meta">' + escapeHomeHtml(product.type || 'Product') + '</div></div>';
                sectionHtml += '</div>';
                if (product.whyUsed) {
                    sectionHtml += '<div class="home-link-copy">' + escapeHomeHtml(product.whyUsed) + '</div>';
                }
                sectionHtml += '</a>';
            });
        }
        sectionHtml += '</div>';
        return sectionHtml;
    }

    function renderSupportedStreams() {
        const supportedStreams = allStreams.filter(stream => {
            return (stream.brickDependencies || []).some(dep => dep.targetBrickId === brick.id);
        });

        let sectionHtml = '<div class="home-section">';
        sectionHtml += '<div class="home-section-title">Supported Product Streams</div>';
        if (!supportedStreams.length) {
            sectionHtml += '<div class="activity-muted">No product streams currently reference this brick.</div>';
            sectionHtml += '</div>';
            return sectionHtml;
        }

        supportedStreams.forEach(stream => {
            sectionHtml += '<div class="home-link-card">';
            sectionHtml += '<div class="home-link-head">';
            sectionHtml += '<img class="home-link-icon" src="../icons/' + escapeHomeHtml(stream.icon || 'stream.png') + '" onerror="this.onerror=null;this.src=\'../icons/stream.png\'">';
            sectionHtml += '<div style="vertical-align: top"><a target="_blank" rel="noopener noreferrer" href="../stream_pages/' + escapeHomeHtml(stream.id) + '.html"><div class="home-link-title"><div class="page-type-badge" style="font-size: 70%;">Experience</div><br>' + escapeHomeHtml(stream.name) + '</div>';
            sectionHtml += '</a></div>';
            sectionHtml += '</div>';
            if (stream.description) {
                sectionHtml += '<div class="home-link-copy">' + escapeHomeHtml(stream.description) + '</div>';
            }
            if (stream.flows && stream.flows.length) {
                sectionHtml += '<div class="activity-block">';
                sectionHtml += '<div class="activity-muted"><strong>Flows facilitated</strong></div>';
                stream.flows.forEach(flow => {
                    sectionHtml += '<div class="activity-muted">- ' + escapeHomeHtml(flow.title || flow.id || '') + '</div>';
                });
                sectionHtml += '</div>';
            }
            if (stream.outcomes && stream.outcomes.length) {
                sectionHtml += '<div class="activity-block">';
                sectionHtml += '<div class="activity-muted"><strong>Outcomes</strong></div>';
                stream.outcomes.forEach(outcome => {
                    sectionHtml += '<div class="activity-muted">- ' + escapeHomeHtml(outcome) + '</div>';
                });
                sectionHtml += '</div>';
