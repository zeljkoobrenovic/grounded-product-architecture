    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

assignments per entity."}]}, {"id": "cleanse-and-deduplicate-relations", "title": "Cleanse and deduplicate relations", "actor": "Property Manager", "keyFacts": ["Tenants, owners, suppliers and accountants are merged into one relation record each, with KvK number, IBAN, roles per entity and communication preferences.", "The same person may be a tenant of one owner and a board member of an association; roles are attached to the single relation instead of duplicated contacts."], "painPoints": ["Duplicate contacts create double invoices and double reminders on day one.", "IBANs that belong to a former tenant are silently reused when contacts are not cleansed."], "dependencies": [{"type": "brick", "id": "rela", "name": "Relations and CRM", "description": "Single relation database with roles and identifiers.", "how": "Receives the deduplicated relations with their roles per administration."}, {"type": "brick", "id": "migr", "name": "Data Migration and Onboarding Tooling", "description": "Match and merge rules for relations.", "how": "Suggests merges on name, address, IBAN and KvK number for manual confirmation."}]}, {"id": "load-contracts-and-rent-components", "title": "Load contracts, rent components and deposits", "actor": "Property Manager", "keyFacts": ["Each lease is loaded with its start date, notice terms, rent components (basic rent, service charge advances, VAT status), indexation clause and deposit held, so the first indexation and settlement can run from history.", "Contracts under the Dutch 290 retail regime, 230a office regime and residential regime carry different rules; the contract type is set explicitly at load."], "painPoints": ["Indexation history missing from the legacy export means the next indexation cannot be justified to the tenant.", "Deposits recorded as free text cannot be settled at termination."], "dependencies": [{"type": "brick", "id": "cntr", "name": "Lease Contracts and E-Signing", "description": "Contract master with components and clauses.", "how": "Creates the leases with their components, clauses and deposits from the migration file."}, {"type": "brick", "id": "migr", "name": "Data Migration and Onboarding Tooling", "description": "Contract migration templates and validation rules.", "how": "Validates that every contract has a unit, tenant, start date and rent component before loading."}, {"type": "brick", "id": "docm", "name": "Documents and Correspondence", "description": "Contract documents and correspondence archive.", "how": "Attaches the scanned or exported lease documents to the migrated contract."}]}, {"id": "reconcile-opening-balances", "title": "Reconcile opening balances per entity", "actor": "Real Estate Finance Controller", "keyFacts": ["Open debtor items, deposits held, supplier liabilities, association reserve funds and bank balances are loaded per administration and reconciled to the Informant trial balance at the cut-over date.", "Opening balances are booked to a migration date so the first period on the new platform starts clean and auditable."], "painPoints": ["A trial balance that does not match by a few euros costs days of searching at year end.", "Deposits held for tenants are the most common item to go missing between systems."], "dependencies": [{"type": "brick", "id": "ledg", "name": "Multi-Entity General Ledger and Period Close", "description": "Opening balances and trial balance per entity.", "how": "Books opening balances per administration and compares them to the legacy trial balance."}, {"type": "brick", "id": "migr", "name": "Data Migration and Onboarding Tooling", "description": "Balance reconciliation report.", "how": "Shows the differences per ledger account and per open item."}, {"type": "brick", "id": "dunn", "name": "Debtor Management and Dunning", "description": "Open debtor items.", "how": "Loads open rent items with their age so dunning continues without a gap."}]}, {"id": "rehearse-and-sign-off-with-users", "title": "Rehearse the first rent run and sign off", "actor": "Property Manager", "keyFacts": ["A rehearsal rent run and owner statement are produced on the migrated data and compared line by line with the last Informant run before the customer signs off.", "Users train on their own data during the rehearsal, which is when most mapping questions surface."], "painPoints": ["Migrations signed off on record counts alone produce a wrong first invoice to every tenant.", "Training on demo data leaves users lost on go-live day."], "dependencies": [{"type": "brick", "id": "rent", "name": "Rent Invoicing and Billing Runs", "description": "Rehearsal rent run.", "how": "Generates a test billing run on the migrated contracts for comparison."}, {"type": "brick", "id": "ivrp", "name": "Investor and Owner Reporting", "description": "Rehearsal owner statements.", "how": "Produces owner statements from the migrated data for comparison with the legacy statements."}, {"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Notifications", "description": "Sign-off tasks and checklist.", "how": "Tracks the go-live checklist and the customer sign-off."}]}, {"id": "cut-over-and-set-legacy-read-only", "title": "Cut over, invite portal users and set Informant read-only", "actor": "Real Estate Company Director", "keyFacts": ["Cut-over freezes the legacy system, loads the final delta, activates direct debit mandates and invites tenants, owners and suppliers to the portals.", "Informant remains available read-only, with support running until 31 December 2027, so historic questions can still be answered."], "painPoints": ["A cut-over without a delta load loses the last days of payments and tickets.", "Portal invitations sent before data is trusted generate a wave of support calls."], "dependencies": [{"type": "brick", "id": "migr", "name": "Data Migration and Onboarding Tooling", "description": "Delta load and cut-over runbook.", "how": "Loads the final changes since the extract and closes the migration."}, {"type": "brick", "id": "iden", "name": "Identity, Tenants and Access", "description": "User and portal account provisioning.", "how": "Creates employee accounts and portal invitations for tenants, owners and suppliers."}, {"type": "brick", "id": "bank", "name": "Bank Integration and Reconciliation", "description": "Direct debit mandates and bank links.", "how": "Activates SEPA mandates and bank statement retrieval for each entity's accounts."}]}]}, {"id": "onboard-a-newly-acquired-portfolio", "title": "Onboard a Newly Acquired Portfolio", "description": "An investor or manager takes over a portfolio from a seller or another manager: set up entities, register objects and units, load contracts from the data room and start invoicing from the transfer date.", "primaryActor": "Asset and Portfolio Manager", "trigger": "A share or asset deal closes and the transfer date for a portfolio of, for example, 120 residential units and 8 commercial units is fixed.", "successSignal": "All units, contracts and tenants are live with correct rent components by the transfer date and the first rent run invoices from day one of ownership.", "steps": [{"id": "set-up-entities-and-bank-accounts", "title": "Set up the acquiring entities and bank accounts", "actor": "Real Estate Finance Controller", "keyFacts": ["Each acquiring vehicle gets its own administration with chart of accounts, VAT regime, bank accounts and reporting currency; German entities get the German chart and VAT settings.", "Management fee agreements between the manager and the entity are configured once so the fee is invoiced automatically."], "painPoints": ["Entities created ad hoc without a template drift in chart of accounts, making consolidation manual.", "Missing bank account links delay the first reconciliation by weeks."], "dependencies": [{"type": "brick", "id": "ledg", "name": "Multi-Entity General Ledger and Period Close", "description": "Administration templates and chart of accounts.", "how": "Creates the entity ledger from the group template."}, {"type": "brick", "id": "iden", "name": "Identity, Tenants and Access", "description": "Entity access and roles.", "how": "Grants the asset manager, controller and property manager access to the new administration."}, {"type": "brick", "id": "bank", "name": "Bank Integration and Reconciliation", "description": "Bank account registration.", "how": "Registers the entity's IBANs for statement retrieval and direct debit."}]}, {"id": "register-objects-and-units-from-the-data-room", "title": "Register objects and units from the data room", "actor": "Asset and Portfolio Manager", "keyFacts": ["Units are created with address, BAG identifier, surface (NEN 2580), unit type, energy label and WWS points where applicable, so letting and rent-price checks work from the start.", "Parcels and ownership are verified against the Kadaster extract to make sure every unit in the deal is actually transferred."], "painPoints": ["Units typed from the seller's rent roll inherit the seller's errors.", "Missing energy labels block new lettings because the label must be handed over at signing."], "dependencies": [{"type": "brick", "id": "objt", "name": "Objects, Complexes and Units", "description": "Object and unit registration with identifiers.", "how": "Creates complexes and units with their attributes and identifiers."}, {"type": "brick", "id": "migr", "name": "Data Migration and Onboarding Tooling", "description": "Rent roll import templates.", "how": "Imports the seller's rent roll into objects, units and contracts with validation."}]}, {"id": "load-tenants-and-contracts", "title": "Load tenants and running contracts", "actor": "Property Manager", "keyFacts": ["Running leases transfer to the buyer by law ('koop breekt geen huur'); every contract is loaded with its rent components, indexation clause, deposit and service charge advances.", "Tenants are informed of the new landlord and the new payment details, and existing direct debit mandates are migrated or re-issued."], "painPoints": ["Deposits not transferred by the seller surface only when the first tenant leaves.", "Tenants paying the old landlord for months after transfer create reconciliation chaos."], "dependencies": [{"type": "brick", "id": "cntr", "name": "Lease Contracts and E-Signing", "description": "Contract loading with clauses and deposits.", "how": "Creates the leases and their components for the acquired units."}, {"type": "brick", "id": "rela", "name": "Relations and CRM", "description": "Tenant relations.", "how": "Creates or matches the tenant relations with their contact details."}, {"type": "brick", "id": "docm", "name": "Documents and Correspondence", "description": "Landlord change letters.", "how": "Generates and files the change-of-landlord letter per tenant."}]}, {"id": "load-valuations-and-asset-plan", "title": "Load valuations, capex plan and asset plan", "actor": "Asset and Portfolio Manager", "keyFacts": ["The acquisition valuation, the technical due diligence findings and the initial capex plan become the baseline for the asset plan and the multi-year maintenance budget.", "Installations found in the due diligence (boilers, lifts, fire systems) are registered so inspections are scheduled from day one."], "painPoints": ["Due diligence reports left in the data room are never turned into planned work.", "Without a valuation baseline the first investor report cannot show value creation."], "dependencies": [{"type": "brick", "id": "valu", "name": "Valuations and Market Data", "description": "Acquisition valuation as baseline.", "how": "Stores the acquisition value and valuer report as the first valuation record."}, {"type": "brick", "id": "mjop", "name": "Multi-Year Maintenance Planning and Budgets", "description": "Initial multi-year maintenance plan.", "how": "Creates the capex and maintenance plan from due diligence findings."}, {"type": "brick", "id": "inst", "name": "Installations and Periodic Maintenance", "description": "Installation register.", "how": "Registers installations and their inspection regimes for the acquired objects."}]}, {"id": "start-invoicing-from-transfer-date", "title": "Start invoicing from the transfer date", "actor": "Real Estate Finance Controller", "keyFacts": ["Rent for the transfer month is split between seller and buyer pro rata; the platform invoices the buyer's share and books the seller settlement.", "Service charge advances continue while the settlement for the seller's part of the year is agreed in the completion statement."], "painPoints": ["Pro rata splits done in a spreadsheet are argued over for months in the completion accounts.", "A first rent run with wrong bank details teaches tenants to ignore the new landlord."], "dependencies": [{"type": "brick", "id": "rent", "name": "Rent Invoicing and Billing Runs", "description": "Pro rata invoicing from the transfer date.", "how": "Generates the first billing run with pro rata amounts."}, {"type": "brick", "id": "svcc", "name": "Service Charges and Settlements", "description": "Service charge advances and settlement periods.", "how": "Continues advances and opens the settlement period from the transfer date."}, {"type": "brick", "id": "ledg", "name": "Multi-Entity General Ledger and Period Close", "description": "Completion statement bookings.", "how": "Books the seller-buyer settlement in the entity ledger."}]}, {"id": "hand-over-to-management-and-portals", "title": "Hand over to property management and open the portals", "actor": "Property Manager", "keyFacts": ["The property manager receives the objects, contracts and open tickets in one view and tenants get portal access to pay, report faults and read their contract.", "Owner and investor reporting starts with the first monthly close after transfer."], "painPoints": ["Hand-over by e-mail loses the open maintenance issues the seller did not fix.", "Tenants who cannot find their new landlord online call and complain instead of paying."], "dependencies": [{"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Notifications", "description": "Hand-over tasks and open items.", "how": "Creates the hand-over checklist and assigns open items to the property manager."}, {"type": "brick", "id": "tenp", "name": "Tenant Portal and App", "description": "Tenant portal activation.", "how": "Invites tenants of the acquired units to the portal and app."}, {"type": "brick", "id": "ivrp", "name": "Investor and Owner Reporting", "description": "First investor report after transfer.", "how": "Includes the acquired portfolio in the next reporting period."}]}]}], "outcomes": ["Every migrated or acquired portfolio invoices correctly in its first rent run, because contracts, components and mandates were validated before go-live", "Trial balances per entity match the legacy closing balance, so the first period close on the platform is auditable", "Informant customers migrate in phased waves without losing service, and acquired portfolios are live by the transfer date"], "brickDependencies": [{"targetBrickId": "migr", "type": "composition"}, {"targetBrickId": "objt", "type": "composition"}, {"targetBrickId": "rela", "type": "composition"}, {"targetBrickId": "cntr", "type": "composition"}, {"targetBrickId": "ledg", "type": "composition"}, {"targetBrickId": "iden", "type": "composition"}, {"targetBrickId": "docm", "type": "composition"}, {"targetBrickId": "bank", "type": "composition"}, {"targetBrickId": "dunn", "type": "composition"}, {"targetBrickId": "rent", "type": "composition"}, {"targetBrickId": "ivrp", "type": "composition"}, {"targetBrickId": "wflw", "type": "composition"}, {"targetBrickId": "valu", "type": "composition"}, {"targetBrickId": "mjop", "type": "composition"}, {"targetBrickId": "inst", "type": "composition"}, {"targetBrickId": "svcc", "type": "composition"}, {"targetBrickId": "tenp", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "Informant Legacy System", "type": "legacy-system", "interface": "Database extracts and migration files", "description": "The acquired Informant property management and VvE administration system from which customers are migrated free of charge, with Informant support until 31 December 2027."}, {"system": "Kadaster and BAG Registers", "type": "public-register", "interface": "BAG address and building lookup, Kadaster ownership and parcel extracts", "description": "Public Dutch land registry and address registers used to validate objects, units, parcels and ownership and to answer notary requests on owner turnover."}, {"system": "KvK Business Register", "type": "public-register", "interface": "KvK number lookup and company data API", "description": "Chamber of Commerce register used to validate business tenants, suppliers and legal entities and to register owners' associations."}, {"system": "E-mail, Push and SMS Gateway", "type": "messaging-gateway", "interface": "Transactional e-mail, app push and SMS", "description": "Delivers rent invoices, pre-notifications, reminders, ticket updates, meeting convocations and portal invitations to tenants, owners and suppliers."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []};

    mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        flowchart: {
            htmlLabels: false
        }
    });

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

    function getFlows() {
        return currentStream.flows || [];
    }

    function getFlowDependencies(flow) {
        const dependencyIndex = new Map();
        (flow.steps || []).forEach(step => {
            (step.dependencies || []).forEach(dependency => {
                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());
    }

    function getStepDependency(step, dependency) {
        return (step.dependencies || []).find(item => (item.type || '') === (dependency.type || '') && (item.id || '') === (dependency.id || '')) || null;
    }

    function getPrimaryActors() {
        const streamJobs = currentStream.supportedCustomerJobs || [];
        const allJobs = streamJobs.length ? streamJobs : supported_jobs;
        return dedupe(allJobs.map(item => item.customerName || item.customerGroup || '').filter(Boolean), item => item);
    }

    function summarizeFlow(flow) {
        const steps = flow.steps || [];
        const firstStep = steps[0] || {};
        const lastStep = steps[steps.length - 1] || {};
        return {
            actor: flow.primaryActor || firstStep.actor || '',
            trigger: flow.trigger || firstStep.trigger || '',
            result: flow.successSignal || flow.outcome || lastStep.successSignal || lastStep.output || ''
        };
    }

    function renderStepMeta(label, value) {
        if (!value) {
            return '';
        }
        return '<div class="flow-step-meta-item"><div class="flow-step-meta-label">' + escapeHtml(label) + '</div><div class="flow-step-copy">' + escapeHtml(value) + '</div></div>';
    }

    function flowDependencyIconFile(dependency) {
        const dependencyId = dependency.id || '';
        const linkedBrick = related_bricks.find(brick => brick.id === dependencyId) || all_bricks.find(brick => brick.id === dependencyId) || {};
        return dependency.icon || linkedBrick.icon || (dependencyId ? dependencyId + '.png' : 'brick.png');
    }

    function renderFlowDependencyIcon(dependency, className) {
        return '<img class="' + escapeHtml(className) + '" src="../icons/' + escapeHtml(flowDependencyIconFile(dependency)) + '" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
    }

    function renderStepDependencyPills(step) {
        const dependencies = step.dependencies || [];
        if (!dependencies.length) {
            return '<div class="muted">No step-specific dependencies listed.</div>';
        }

        return '<div class="flow-step-dependencies">' + dependencies.map(dep => {
            const label = dep.name || dep.id || 'Dependency';
            const kind = 'Brick';
            return '<span class="flow-cell-brick">' + renderFlowDependencyIcon(dep, 'flow-cell-brick-icon') + '<span>' + escapeHtml(kind + ': ' + label) + '</span></span>';
        }).join('') + '</div>';
    }

    function simplifySupportCopy(value) {
        const text = String(value || '').trim();
        if (!text) {
            return '';
        }
        const simplified = text.replace(/^Supports .*? by helping users help /i, 'Facilitate ');
        return simplified;
    }

        <button class="tablinks" id="tab_flows" onclick="openTab('flows')">Flows Narratives (0)</button>
        <button class="tablinks" id="tab_links" onclick="openTab('links')">Links</button>
    </div>

    <div id="tab_content_home" class="tabcontent"></div>
    <div id="tab_content_flows" class="tabcontent"></div>
    <div id="tab_content_links" class="tabcontent"></div>


</div>

<script>
    function streamMetaPath(stream) {
        const parts = [];
        if (stream.group) {
            parts.push(stream.group);
        }
        if (stream.rootGroup && stream.rootGroup !== stream.group) {
            parts.push(stream.rootGroup);
        }
        if (!parts.length) {
            parts.push('Stream');
        }
        return parts.join(' / ');
    }

    let headerHtml = '<div class="nav-strip">';
    allStreams.forEach(item => {
        headerHtml += '<a class="nav-link" href="' + escapeHtml(item.id) + '.html">';
        headerHtml += '<img src="../icons/' + escapeHtml(item.icon || 'stream.png') + '" class="' + (item.id === currentStream.id ? 'tab-image-selected' : 'tab-image') + '" alt="" onerror="this.onerror=null;this.src=\'../icons/stream.png\'">';
        headerHtml += '</a>';
    });
    headerHtml += '</div>';

    headerHtml += '<div class="page">';
    headerHtml += '<div class="header">';
    headerHtml += '<img class="header-icon" src="../icons/' + escapeHtml(currentStream.icon || 'stream.png') + '" alt="" onerror="this.onerror=null;this.src=\'../icons/stream.png\'">';
    headerHtml += '<div>';
    headerHtml += '<div class="header-meta">';
    headerHtml += '<div class="page-type-badge">Stream</div>';
    headerHtml += escapeHtml(streamMetaPath(currentStream)) + ' / <span style="color:blue;font-weight:bold;">' + escapeHtml((currentStream.id || '').toUpperCase()) + '</span></div>';
    headerHtml += '<div class="header-title">' + escapeHtml(currentStream.name || currentStream.id) + '</div>';
    headerHtml += '<div class="header-copy">' + escapeHtml(currentStream.description || '') + '</div>';
    headerHtml += '</div></div></div>';
    document.getElementById('Header').innerHTML = headerHtml;

    function renderHome() {
        const flows = getFlows();
        const totalSteps = flows.reduce((count, flow) => count + ((flow.steps || []).length), 0);
        const primaryActors = getPrimaryActors();
        let html = '';

        html += '<div class="group"><div class="section-title">Flow Narratives (' + flows.length + ')</div>';
        if (!flows.length) {
            html += '<div class="muted">No flows listed for this stream.</div>';
        } else {
            html += '<div class="card-grid">';
            flows.forEach(flow => {
                const summary = summarizeFlow(flow);
                html += '<div class="card">';
                html += '<div class="card-meta">' + escapeHtml(streamMetaPath(currentStream)) + '</div>';
                html += '<div class="card-title">' + escapeHtml(flow.title || flow.id) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(flow.description || '') + '</div>';
                html += '<div class="muted">' + ((flow.steps || []).length) + ' steps</div>';
                if (summary.actor) {
                    html += '<div class="card-copy"><strong>Actor:</strong> ' + escapeHtml(summary.actor) + '</div>';
                }
                if (summary.trigger) {
                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Outcomes</div>';
        if (!(currentStream.outcomes || []).length) {
            html += '<div class="muted">No outcomes listed for this stream.</div>';
        } else {
            html += '<div class="card"><ul class="list">' + currentStream.outcomes.map(outcome => '<li>' + escapeHtml(outcome) + '</li>').join('') + '</ul></div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Supporting Product Bricks</div>';
        if (!related_bricks.length) {
            html += '<div class="muted">No linked product bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            related_bricks.forEach(brick => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../landing_pages/' + escapeHtml(brick.id) + '.html">';
                html += '<div class="card-meta">' + escapeHtml((brick.group || brick.domain || 'Product Brick')) + '</div>';
                html += '<div class="card-header">';
                html += '<img class="card-icon" src="../icons/' + escapeHtml(brick.id) + '.png" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
                html += '<div class="card-title">' + escapeHtml(brick.name || brick.id) + '</div>';
                html += '</div>';
                html += '<div class="card-copy">' + escapeHtml(brick.description || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Linked Products</div>';
        if (!linked_products.length) {
            html += '<div class="muted">No linked products were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            linked_products.forEach(product => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../../product-deployments/landing_pages/' + escapeHtml(product.id) + '.html">';
                html += '<div class="card-meta">' + escapeHtml(product.type || 'Product') + '</div>';
                html += '<div class="card-header">';
                html += '<img class="card-icon" src="../../product-deployments/icons/' + escapeHtml(product.icon) + '" alt="" onerror="this.onerror=null;this.src=\'../../product-deployments/icons/product.png\'">';
                html += '<div class="card-title">' + escapeHtml(product.name || product.id) + '</div>';
                html += '</div>';
                html += '<div class="card-copy">' + escapeHtml(product.whyUsed || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Related Teams</div>';
        if (!related_teams.length) {
            html += '<div class="muted">No teams were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            related_teams.forEach(team => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../../teams/landing_pages/' + escapeHtml(team.teamId) + '.html">';
                html += '<div class="card-meta">' + escapeHtml(team.roleLabel || team.teamType || 'Team') + '</div>';
                html += '<div class="card-title">' + escapeHtml(team.teamName || team.teamId) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(team.groupName || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Supported Customer Jobs</div>';
        if (!supported_jobs.length) {
            html += '<div class="muted">No customer jobs were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            supported_jobs.forEach(job => {
                html += '<div class="card">';
                html += '<div class="card-meta">' + escapeHtml(job.customerGroup || '') + (job.productName ? ' | ' + escapeHtml(job.productName) : '') + '</div>';
                html += '<div class="card-title">' + escapeHtml(job.jobName || job.jobId) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(job.jobOutcome || job.jobWhatItIs || '') + '</div>';
                if (job.supportRationale) {
                    html += '<div class="card-copy"><strong>Why this stream matters here:</strong> ' + escapeHtml(job.supportRationale) + '</div>';
                }
                if ((job.usedInSteps || []).length) {
                    html += '<ul class="list">' + job.usedInSteps.map(step => '<li>' + escapeHtml(step.step || step.description || '') + '</li>').join('') + '</ul>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        html += '</div>';

        document.getElementById('tab_content_home').innerHTML = html;
    }

    function renderFlows() {
        const flows = getFlows();
        const totalSteps = flows.reduce((count, flow) => count + ((flow.steps || []).length), 0);
        let html = '';

        document.getElementById('tab_flows').innerHTML = 'Flow Narratives (' + flows.length + ')';

        flows.forEach(flow => {
            const dependenciesInFlow = getFlowDependencies(flow);
            const summary = summarizeFlow(flow);
            html += '<div class="group">';
            html += '<div class="section-title">Flow</div>';
            html += '<div class="flow-title">' + escapeHtml(flow.title || flow.id) + '</div>';
            html += '<div class="flow-description">' + escapeHtml(flow.description || '') + '</div>';
            if (summary.actor || summary.trigger || summary.result) {
                html += '<div class="card" style="margin-bottom:16px;">';
                if (summary.actor) {
                    html += '<div class="card-copy"><strong>Primary actor:</strong> ' + escapeHtml(summary.actor) + '</div>';
                }
                if (summary.trigger) {
                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';
                }
                html += '</div>';
            }

            html += '<div class="section-title">Dependency Traceability</div>';
            html += '<div class="flow-matrix-wrap">';
            html += '<table class="flow-matrix">';
            html += '<thead>';
            html += '<tr><th class="flow-dependency-col"></th>';
            (flow.steps || []).forEach((step, index) => {
                html += '<th class="flow-step-col"><div class="flow-step-label">Step ' + (index + 1) + '</div><div class="card-title">' + escapeHtml(step.title || step.id) + '</div></th>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right">Key Facts</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkblue">';
                if ((step.keyFacts || []).length) {
                    html += '<ul class="flow-insight-list">' + step.keyFacts.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No key facts listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right; color: darkred">Pain Points</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkred">';
                if ((step.painPoints || []).length) {
                    html += '<ul class="flow-insight-list">' + step.painPoints.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No pain points listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';
            html += '</thead><tbody>';

            dependenciesInFlow.forEach(dependency => {
                const dependencyTypeLabel = 'Product Brick';
                html += '<tr>';
                html += '<td>';
                html += '<div class="flow-dependency-header">';
                html += renderFlowDependencyIcon(dependency, 'flow-dependency-icon');
                html += '<div>';
                html += '<a class="flow-dependency-name" href="../landing_pages/' + escapeHtml(dependency.id) + '.html">' + escapeHtml(dependency.name || dependency.id) + '</a>';
                if (dependency.interface) {
                    html += '<div class="muted">' + escapeHtml(dependency.interface) + '</div>';
                }
                html += '</div>';
                html += '</div>';
                html += '</td>';
                (flow.steps || []).forEach(step => {
                    const stepDependency = getStepDependency(step, dependency);
                    if (!stepDependency) {
                        html += '<td class="flow-cell-empty">-</td>';
                        return;
                    }
                    html += '<td class="flow-cell-active">';
                    html += '<div class="flow-cell-copy">' + escapeHtml(simplifySupportCopy(stepDependency.how || stepDependency.description || 'Supports this step.')) + '</div>';
                    html += '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            html += '</div>';
            html += '</div>';
        });

        document.getElementById('tab_content_flows').innerHTML = html;
    }

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';
        }
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-title">' + escapeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                count++;
                html += '<div class="link-entry">';
                html += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(link.link || '#') + '">'
                    + escapeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>


<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Real Estate ERP Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Streams Index"
    },
    {
      "label": "Onboard Portfolio and Entities"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
