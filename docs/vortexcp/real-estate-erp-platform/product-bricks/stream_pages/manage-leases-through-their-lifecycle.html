    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

rty Owner", "keyFacts": ["For managed portfolios the owner approves the indexation policy or individual increases in the owner portal within the mandate, for example when the manager proposes less than the cap to retain a tenant.", "Approvals are logged with the decision and become part of the owner statement narrative."], "painPoints": ["Approvals by e-mail cannot be found when the tenant disputes the increase.", "Owners who are not asked feel bypassed and leave the manager."], "dependencies": [{"type": "brick", "id": "ownp", "name": "Owner Portal", "description": "Owner approval of indexation proposals.", "how": "Presents the proposals to the owner for approval."}, {"type": "brick", "id": "indx", "name": "Rent Indexation, Renewals and Terminations", "description": "Approval status per proposal.", "how": "Records the owner decision on the round."}]}, {"id": "generate-and-send-increase-letters", "title": "Generate and send the rent increase letters", "actor": "Property Manager", "keyFacts": ["Residential increase letters must reach the tenant at least two months before the effective date with the reasons and the objection route; letters are generated per contract with the correct language and sent by portal, e-mail or post.", "Commercial index letters state the index figures and the calculation so the tenant can verify the new rent."], "painPoints": ["A late letter postpones the increase by a month and costs the whole portfolio a month of rent growth.", "Mail-merged letters with wrong figures cannot be recalled."], "dependencies": [{"type": "brick", "id": "docm", "name": "Documents and Correspondence", "description": "Increase letters generated per contract.", "how": "Renders the letters from templates with the calculated figures."}, {"type": "brick", "id": "auto", "name": "Hyper Automation and Robots", "description": "Bulk generation and dispatch robot.", "how": "Runs the letter generation and dispatch for the whole round unattended."}, {"type": "brick", "id": "tenp", "name": "Tenant Portal and App", "description": "Letter delivery in the tenant portal.", "how": "Publishes the letter in the tenant's portal with read receipt."}]}, {"id": "handle-objections", "title": "Handle objections and Rent Tribunal cases", "actor": "Property Manager", "keyFacts": ["Tenants can object within six weeks; the manager records the objection, supplies the WWS points and rent history, and follows the tribunal case to its decision.", "A tribunal decision that lowers the rent is applied retroactively with credit notes."], "painPoints": ["Objections handled outside the system are missed and the increase is silently lost.", "Retroactive corrections done by hand create wrong debtor balances."], "dependencies": [{"type": "brick", "id": "indx", "name": "Rent Indexation, Renewals and Terminations", "description": "Objection and case tracking per increase.", "how": "Records objections, tribunal cases and their outcome on the proposal."}, {"type": "brick", "id": "rent", "name": "Rent Invoicing and Billing Runs", "description": "Credit notes for retroactive corrections.", "how": "Issues credit notes when a decision lowers the rent."}, {"type": "brick", "id": "docm", "name": "Documents and Correspondence", "description": "Case correspondence.", "how": "Files tribunal correspondence on the contract."}]}, {"id": "apply-new-rents-to-the-run", "title": "Apply the new rents to the rent run", "actor": "Real Estate Finance Controller", "keyFacts": ["Approved increases update the rent components with an effective date, and the first affected rent run invoices the new amount with the pre-notification of the changed direct debit.", "The round closes with a report of realised rent growth per entity for the asset manager."], "painPoints": ["Rent components updated by hand after the run cause a month of wrong invoices.", "Without a round report the realised indexation cannot be reconciled with the budget."], "dependencies": [{"type": "brick", "id": "indx", "name": "Rent Indexation, Renewals and Terminations", "description": "Effective-dated rent component updates.", "how": "Applies the approved new rents to the contracts."}, {"type": "brick", "id": "rent", "name": "Rent Invoicing and Billing Runs", "description": "Next billing run with new amounts.", "how": "Invoices the new rent from the effective date."}, {"type": "brick", "id": "dash", "name": "Dashboards and Data Analytics", "description": "Realised rent growth per entity.", "how": "Reports the outcome of the round against budget."}]}]}, {"id": "terminate-a-lease-and-settle", "title": "Terminate a Lease and Settle Deposit and Service Charges", "description": "From a tenant's notice to a settled tenancy: validate the notice period, plan the check-out inspection, settle damage and the deposit within the legal term, make the final invoice and service charge settlement, and release the unit to letting.", "primaryActor": "Property Manager", "trigger": "A tenant sends notice through the tenant portal that they will leave at the end of next month.", "successSignal": "The deposit is returned within 14 days after the tenancy ends, the final invoice and settlement are booked, and the unit is in the letting pipeline without a gap.", "steps": [{"id": "register-notice-and-validate-term", "title": "Register the notice and validate the notice period", "actor": "Property Manager", "keyFacts": ["A residential tenant's notice period equals the payment term (one month); a landlord's notice is three to six months and only on statutory grounds. Commercial notice terms follow the lease and regime.", "The end date is confirmed to the tenant in writing and the unit is pre-registered as upcoming vacancy."], "painPoints": ["Notices received by phone are disputed later.", "A wrong end date shifts the whole letting timeline."], "dependencies": [{"type": "brick", "id": "indx", "name": "Rent Indexation, Renewals and Terminations", "description": "Termination with notice validation.", "how": "Registers the termination and computes the legal end date."}, {"type": "brick", "id": "tenp", "name": "Tenant Portal and App", "description": "Notice submitted in the portal.", "how": "Captures the tenant's notice with timestamp."}, {"type": "brick", "id": "vacm", "name": "Vacancy, Letting and Candidate Screening", "description": "Upcoming vacancy pre-registration.", "how": "Opens the vacancy record for the end date."}]}, {"id": "plan-pre-inspection-and-check-out", "title": "Plan the pre-inspection and check-out", "actor": "Property Manager", "keyFacts": ["A pre-inspection gives the tenant a list of items to restore before the check-out; the check-out compares the unit with the check-in report and records meter readings and returned keys.", "Both inspections are signed in the app and produce the evidence for any deduction."], "painPoints": ["Without a pre-inspection every check-out ends in an argument about who pays for what.", "Missing meter readings leave the energy supplier to guess the final bill."], "dependencies": [{"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Notifications", "description": "Inspection appointments and tasks.", "how": "Schedules the inspections and reminders."}, {"type": "brick", "id": "docm", "name": "Documents and Correspondence", "description": "Pre-inspection and check-out reports.", "how": "Stores the signed reports with photos and readings."}, {"type": "brick", "id": "objt", "name": "Objects, Complexes and Units", "description": "Unit condition and meter readings.", "how": "Updates condition and readings at the end of the tenancy."}]}, {"id": "order-restoration-work-if-needed", "title": "Order restoration work if needed", "actor": "Technical and Maintenance Manager", "keyFacts": ["Damage beyond normal wear is priced by a supplier quote and, where the mandate allows, charged to the departing tenant.", "Restoration and mutation maintenance are planned so that the unit is ready before the next tenant's start date."], "painPoints": ["Restoration ordered after the check-out extends the vacancy by weeks.", "Unpriced damage cannot be deducted from the deposit."], "dependencies": [{"type": "brick", "id": "work", "name": "Work Orders and Supplier Dispatch", "description": "Mutation maintenance work orders.", "how": "Creates the work orders and obtains quotes for restoration."}, {"type": "brick", "id": "tick", "name": "Fault Reports and Tickets", "description": "Check-out defects as tickets.", "how": "Registers check-out findings as tickets."}]}, {"id": "settle-the-deposit-within-the-legal-term", "title": "Settle the deposit within the legal term", "actor": "Real Estate Finance Controller", "keyFacts": ["Under the Good Landlord Act the deposit is returned within 14 days after the end of the lease, or within 30 days with an itemised statement when costs are deducted.", "The settlement nets deposit, open rent, damage and keys against each other and pays the balance by SEPA credit transfer."], "painPoints": ["Deposits paid late generate complaints to the municipality and negative reviews.", "Manual netting of open items produces wrong payouts."], "dependencies": [{"type": "brick", "id": "indx", "name": "Rent Indexation, Renewals and Terminations", "description": "Deposit settlement statement.", "how": "Calculates the settlement from deposit, open items and deductions."}, {"type": "brick", "id": "bank", "name": "Bank Integration and Reconciliation", "description": "Deposit refund payment.", "how": "Executes the refund as a SEPA credit transfer."}, {"type": "brick", "id": "dunn", "name": "Debtor Management and Dunning", "description": "Open items at termination.", "how": "Provides the tenant's open rent items for netting."}]}, {"id": "issue-final-invoice-and-service-charge-settlement", "title": "Issue the final invoice and the service charge settlement", "actor": "Real Estate Finance Controller", "keyFacts": ["The last rent is pro-rated to the end date; service charges are settled for the tenant's part of the year against actual costs, and the residential settlement overview is due within six months after the calendar year.", "Interim settlements are estimated from the current year's budget and finalised in the annual round."], "painPoints": ["Tenants who left are hard to reach for a settlement a year later.", "Forgotten interim settlements leave money on both sides."], "dependencies": [{"type": "brick", "id": "rent", "name": "Rent Invoicing and Billing Runs", "description": "Pro rata final invoice.", "how": "Generates the final rent invoice to the end date."}, {"type": "brick", "id": "svcc", "name": "Service Charges and Settlements", "description": "Interim service charge settlement.", "how": "Calculates the tenant's share of the actual costs to the end date."}, {"type": "brick", "id": "docm", "name": "Documents and Correspondence", "description": "Settlement statement.", "how": "Files and sends the settlement statement."}]}, {"id": "release-the-unit-to-letting", "title": "Release the unit to letting", "actor": "Property Manager", "keyFacts": ["The unit's status changes to available with the restoration date, the vacancy record inherits the unit data and the new asking rent is checked before publication.", "The tenancy is archived with its documents for the legal retention period."], "painPoints": ["Units released late sit empty while the listing waits.", "Archived tenancies without documents cannot answer later claims."], "dependencies": [{"type": "brick", "id": "vacm", "name": "Vacancy, Letting and Candidate Screening", "description": "Vacancy activated for letting.", "how": "Activates the vacancy with the availability date."}, {"type": "brick", "id": "objt", "name": "Objects, Complexes and Units", "description": "Unit status update.", "how": "Sets the unit to available."}, {"type": "brick", "id": "docm", "name": "Documents and Correspondence", "description": "Tenancy archive.", "how": "Archives the tenancy file with retention rules."}]}]}, {"id": "settle-annual-service-charges", "title": "Settle Annual Service Charges", "description": "The annual settlement round for a complex: collect actual costs, allocate them per unit with the agreed keys, compare with advances, issue statements to tenants within the legal term and adjust the advances for the coming year.", "primaryActor": "Real Estate Finance Controller", "trigger": "The financial year closes and all supplier invoices for the complex's service costs (cleaning, energy of common areas, lift, caretaker) are booked.", "successSignal": "Every tenant received a correct settlement statement within the legal term, differences are invoiced or refunded, and next year's advances are updated.", "steps": [{"id": "collect-actual-costs-per-complex", "title": "Collect the actual service costs per complex", "actor": "Real Estate Finance Controller", "keyFacts": ["Service costs are booked on cost categories per complex during the year; only costs that are chargeable under the lease and the law (for residential the Service Costs Decree) may be settled.", "Commercial leases may include an administration fee of, for example, five percent on top of the costs."], "painPoints": ["Costs booked to the wrong complex are only found when tenants complain.", "Non-chargeable costs in the settlement are reversed by the Rent Tribunal."], "dependencies": [{"type": "brick", "id": "svcc", "name": "Service Charges and Settlements", "description": "Settlement period with cost collection.", "how": "Opens the settlement period and pulls the chargeable costs per complex."}, {"type": "brick", "id": "ledg", "name": "Multi-Entity General Ledger and Period Close", "description": "Cost bookings per complex and category.", "how": "Provides the booked costs per cost category."}, {"type": "brick", "id": "payb", "name": "Accounts Payable and Supplier Invoices", "description": "Supplier invoices behind the costs.", "how": "Links the invoices as evidence per cost line."}]}, {"id": "allocate-with-keys-and-compare-to-advances", , "description": "Review tasks.", "how": "Assigns the review to the manager with the legal deadline."}]}, {"id": "issue-statements-and-book-differences", "title": "Issue statements and book the differences", "actor": "Real Estate Finance Controller", "keyFacts": ["Each tenant receives a statement with the cost categories, their share, the advances paid and the difference; residential statements must be issued within six months after the year, German operating cost statements within twelve months.", "Differences are invoiced or credited in the next rent run and booked to the entity ledger."], "painPoints": ["A statement issued after the legal term forfeits the landlord's claim for additional payment.", "Differences booked manually are missed in the debtor administration."], "dependencies": [{"type": "brick", "id": "svcc", "name": "Service Charges and Settlements", "description": "Settlement statements per tenant.", "how": "Generates the statements with the legally required detail."}, {"type": "brick", "id": "rent", "name": "Rent Invoicing and Billing Runs", "description": "Settlement differences invoiced or credited.", "how": "Adds the differences to the next billing run."}, {"type": "brick", "id": "tenp", "name": "Tenant Portal and App", "description": "Statements in the tenant portal.", "how": "Publishes the statement to the tenant."}]}, {"id": "adjust-advances-for-the-coming-year", "title": "Adjust the advances for the coming year", "actor": "Real Estate Finance Controller", "keyFacts": ["New advances are derived from actual costs and the budget so tenants are neither overcharged nor faced with large additional payments next year.", "The advance change is communicated with the statement and applied from the next run."], "painPoints": ["Advances left unchanged for years produce large settlements and complaints.", "Advance changes not passed to the rent run make next year's settlement wrong again."], "dependencies": [{"type": "brick", "id": "svcc", "name": "Service     mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        flowchart: {
            htmlLabels: false
        }
    });

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

    function getFlows() {
        return currentStream.flows || [];
    }

    function getFlowDependencies(flow) {
        const dependencyIndex = new Map();
        (flow.steps || []).forEach(step => {
            (step.dependencies || []).forEach(dependency => {
                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());
    }

    function getStepDependency(step, dependency) {
        return (step.dependencies || []).find(item => (item.type || '') === (dependency.type || '') && (item.id || '') === (dependency.id || '')) || null;
    }

    function getPrimaryActors() {
        const streamJobs = currentStream.supportedCustomerJobs || [];
        const allJobs = streamJobs.length ? streamJobs : supported_jobs;
        return dedupe(allJobs.map(item => item.customerName || item.customerGroup || '').filter(Boolean), item => item);
    }

    function summarizeFlow(flow) {
        const steps = flow.steps || [];
        const firstStep = steps[0] || {};
        const lastStep = steps[steps.length - 1] || {};
        return {
            actor: flow.primaryActor || firstStep.actor || '',
            trigger: flow.trigger || firstStep.trigger || '',
            result: flow.successSignal || flow.outcome || lastStep.successSignal || lastStep.output || ''
        };
    }

    function renderStepMeta(label, value) {
        if (!value) {
            return '';
        }
        return '<div class="flow-step-meta-item"><div class="flow-step-meta-label">' + escapeHtml(label) + '</div><div class="flow-step-copy">' + escapeHtml(value) + '</div></div>';
    }

    function flowDependencyIconFile(dependency) {
        const dependencyId = dependency.id || '';
        const linkedBrick = related_bricks.find(brick => brick.id === dependencyId) || all_bricks.find(brick => brick.id === dependencyId) || {};
        return dependency.icon || linkedBrick.icon || (dependencyId ? dependencyId + '.png' : 'brick.png');
    }

    function renderFlowDependencyIcon(dependency, className) {
        return '<img class="' + escapeHtml(className) + '" src="../icons/' + escapeHtml(flowDependencyIconFile(dependency)) + '" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
    }

    function renderStepDependencyPills(step) {
        const dependencies = step.dependencies || [];
        if (!dependencies.length) {
            return '<div class="muted">No step-specific dependencies listed.</div>';
        }

        return '<div class="flow-step-dependencies">' + dependencies.map(dep => {
            const label = dep.name || dep.id || 'Dependency';
            const kind = 'Brick';
            return '<span class="flow-cell-brick">' + renderFlowDependencyIcon(dep, 'flow-cell-brick-icon') + '<span>' + escapeHtml(kind + ': ' + label) + '</span></span>';
        }).join('') + '</div>';
    }

    function simplifySupportCopy(value) {
        const text = String(value || '').trim();
        if (!text) {
            return '';
        }
        const simplified = text.replace(/^Supports .*? by helping users help /i, 'Facilitate ');
        return simplified;
    }

                }
                if ((job.usedInSteps || []).length) {
                    html += '<ul class="list">' + job.usedInSteps.map(step => '<li>' + escapeHtml(step.step || step.description || '') + '</li>').join('') + '</ul>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        html += '</div>';

        document.getElementById('tab_content_home').innerHTML = html;
    }

    function renderFlows() {
        const flows = getFlows();
        const totalSteps = flows.reduce((count, flow) => count + ((flow.steps || []).length), 0);
        let html = '';

        document.getElementById('tab_flows').innerHTML = 'Flow Narratives (' + flows.length + ')';

        flows.forEach(flow => {
            const dependenciesInFlow = getFlowDependencies(flow);
            const summary = summarizeFlow(flow);
            html += '<div class="group">';
            html += '<div class="section-title">Flow</div>';
            html += '<div class="flow-title">' + escapeHtml(flow.title || flow.id) + '</div>';
            html += '<div class="flow-description">' + escapeHtml(flow.description || '') + '</div>';
            if (summary.actor || summary.trigger || summary.result) {
                html += '<div class="card" style="margin-bottom:16px;">';
                if (summary.actor) {
                    html += '<div class="card-copy"><strong>Primary actor:</strong> ' + escapeHtml(summary.actor) + '</div>';
                }
                if (summary.trigger) {
                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';
                }
                html += '</div>';
            }

            html += '<div class="section-title">Dependency Traceability</div>';
            html += '<div class="flow-matrix-wrap">';
            html += '<table class="flow-matrix">';
            html += '<thead>';
            html += '<tr><th class="flow-dependency-col"></th>';
            (flow.steps || []).forEach((step, index) => {
                html += '<th class="flow-step-col"><div class="flow-step-label">Step ' + (index + 1) + '</div><div class="card-title">' + escapeHtml(step.title || step.id) + '</div></th>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right">Key Facts</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkblue">';
                if ((step.keyFacts || []).length) {
                    html += '<ul class="flow-insight-list">' + step.keyFacts.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No key facts listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right; color: darkred">Pain Points</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkred">';
                if ((step.painPoints || []).length) {
                    html += '<ul class="flow-insight-list">' + step.painPoints.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No pain points listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';
            html += '</thead><tbody>';

            dependenciesInFlow.forEach(dependency => {
                const dependencyTypeLabel = 'Product Brick';
                html += '<tr>';
                html += '<td>';
                html += '<div class="flow-dependency-header">';
                html += renderFlowDependencyIcon(dependency, 'flow-dependency-icon');
                html += '<div>';
                html += '<a class="flow-dependency-name" href="../landing_pages/' + escapeHtml(dependency.id) + '.html">' + escapeHtml(dependency.name || dependency.id) + '</a>';
                if (dependency.interface) {
                    html += '<div class="muted">' + escapeHtml(dependency.interface) + '</div>';
                }
                html += '</div>';
                html += '</div>';
                html += '</td>';
                (flow.steps || []).forEach(step => {
                    const stepDependency = getStepDependency(step, dependency);
                    if (!stepDependency) {
                        html += '<td class="flow-cell-empty">-</td>';
                        return;
                    }
                    html += '<td class="flow-cell-active">';
                    html += '<div class="flow-cell-copy">' + escapeHtml(simplifySupportCopy(stepDependency.how || stepDependency.description || 'Supports this step.')) + '</div>';
                    html += '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            html += '</div>';
            html += '</div>';
        });

        document.getElementById('tab_content_flows').innerHTML = html;
    }

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';
        }
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-title">' + escapeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                count++;
                html += '<div class="link-entry">';
                html += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(link.link || '#') + '">'
                    + escapeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>


<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Real Estate ERP Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Streams Index"
    },
    {
      "label": "Manage Leases Through Their Lifecycle"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
