    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';

n the therapist's.", "howItSupports": "Presents the programme as a to-do list with reminders and notifications she controls.", "media": []}, {"step": "Complete questionnaires before the session", "description": "Fill in the PROM, ROM or intake questionnaire from the notification in the evening on the couch, in one go or in parts, and see it marked as received so that the therapist opens the result before she walks in.", "howItSupports": "Reminds her at the right moment and confirms that the questionnaire has reached the practice.", "media": []}, {"step": "Discuss progress by message or video without an extra visit", "description": "Ask the therapist a question about an exercise that hurts or a module she does not understand, send a short video of the movement, or join the planned video consultation from the app, so that a problem is solved this week rather than at the next visit.", "howItSupports": "Carries secure messages with attachments between her and the treating professional inside the app.", "media": []}, {"step": "See whether I am getting better", "description": "Look at the questionnaire scores, measurements and completed tasks over the weeks in a chart she understands, compare with the goals in the treatment plan, and bring the picture to the session so that the decision to continue, scale down or stop is taken together.", "howItSupports": "Keeps the measurements and diary entries in her own environment, so the picture stays hers after the trajectory ends.", "media": []}, {"step": "Close the programme and keep the results", "description": "At the end of the trajectory complete the final measurement, read the closing report that goes to the GP, keep the exercise programme and the results in her personal health environment for the next time, and rate how the programme worked for her.", "howItSupports": "Sends the closing report to the referring GP and makes the same letter readable in her app.", "media": []}, {"step": "Close the programme and keep the results", "description": "At the end of the trajectory complete the final measurement, read the closing report that goes to the GP, keep the exercise programme and the results in her personal health environment for the next time, and rate how the programme worked for her.", "howItSupports": "Stores the programme, results and report in her PGO so they remain available after the practice closes the dossier.", "media": []}]}, {"customerId": "gpph", "customerName": "GP Practice and Pharmacy Manager", "customerGroup": "Patients and Primary Care Network", "customerIcon": "customer-gpph-portrait.jpg", "productId": "uw-zorg-online", "productName": "Uw Zorg Online Patient App and Portal", "productIcon": "uw-zorg-online.png", "jobId": "jtbd-gpph-1", "jobName": "Give patients a digital front door that cuts phone traffic", "jobWhatItIs": "Open the practice or pharmacy to patients through Uw Zorg Online so that e-consults, appointments in the practice agenda, repeat prescriptions, record access and the \"Moet ik naar de dokter?\" triage arrive digitally instead of by telephone. The manager has to connect the app to the practice's own information system (Pharmapartners, CGM, Sanday, HealthConnected, Bricks or Vertimart), decide which appointment types, e-consult subjects and prescription flows are open to patients, get patients to activate their account with DigiD, and organise the assistants so that digital requests are handled inside the normal working day rather than on top of it.", "jobOutcome": "Patients arrange most routine matters themselves in the app that is connected to the practice agenda and the HIS or AIS, the assistants spend their mornings on triage and care instead of on the telephone queue, and the practice can see in its own figures that phone contacts per 1,000 patients keep falling while patient satisfaction with reachability rises.", "supportRationale": "Provides the HIS and AIS connectors that mirror agenda, medication and record data between the practice system and Uw Zorg Online.", "usedInSteps": [{"step": "Connect Uw Zorg Online to the practice information system", "description": "Check that the practice's HIS or the pharmacy's AIS (Pharmapartners, CGM, Sanday, HealthConnected, Bricks or Vertimart) is on the list of supported connections, sign the agreement and the processing agreement with HCI, arrange the connector activation with the HIS or AIS vendor, and verify with a test patient that the agenda, medication overview and record summary appear in the app exactly as they stand in the practice system.", "howItSupports": "Provides the HIS and AIS connectors that mirror agenda, medication and record data between the practice system and Uw Zorg Online.", "media": []}, {"step": "Connect Uw Zorg Online to the practice information system", "description": "Check that the practice's HIS or the pharmacy's AIS (Pharmapartners, CGM, Sanday, HealthConnected, Bricks or Vertimart) is on the list of supported connections, sign the agreement and the processing agreement with HCI, arrange the connector activation with the HIS or AIS vendor, and verify with a test patient that the agenda, medication overview and record summary appear in the app exactly as they stand in the practice system.", "howItSupports": "Sets up the practice's presence in the app so that patients see the right services once the connection is live.", "media": []}, {"step": "Configure which services are open to patients", "description": "Decide with the GPs or pharmacists which appointment types and slots may be booked online, which e-consult subjects are allowed and who answers them, whether repeat prescriptions go straight to the pharmacy of choice, and whether patients can read their record summary and correspondence; set the practice's answering rules and response promise so that the app tells patients what to expect.", "howItSupports": "Holds the practice's e-consult, prescription and record-access settings and the response promise shown to patients.", "media": []}, {"step": "Get patients to activate the app", "description": "Invite patients through the practice website, the waiting-room screen, the telephone menu and the assistant's standard answer, help older patients through DigiD activation, and prioritise the frequent callers, chronic patients and parents who generate most of the phone traffic; watch weekly how many invitations turn into activated accounts and first digital requests.", "howItSupports": "Runs invitations, DigiD activation and the first-use nudges that turn an invitation into an active account.", "media": []}, {"step": "Handle digital requests inside the daily workflow", "description": "Organise the assistants' morning so that e-consults, booking exceptions, prescription requests and triage outcomes appear in the HIS or AIS work list and are answered within the promised time, route clinical questions to the GP, and agree what still requires a telephone call; make sure a request never gets lost between the app and the practice system.", "howItSupports": "Delivers e-consults, prescription requests and triage outcomes with their status so that the practice answers them in one queue.", "media": []}, {"step": "Handle digital requests inside the daily workflow", "description": "Organise the assistants' morning so that e-consults, booking exceptions, prescription requests and triage outcomes appear in the HIS or AIS work list and are answered within the promised time, route clinical questions to the GP, and agree what still requires a telephone call; make sure a request never gets lost between the app and the practice system.", "howItSupports": "Writes answers, bookings and prescriptions back into the HIS or AIS so that nothing is registered twice.", "media": []}, {"step": "Measure phone traffic relief and adjust", "description": "Compare phone contacts per 1,000 patients, e-consult volume, online bookings and digital repeat prescriptions month by month, look at which patient groups still call, review complaints about response times, and adjust opening of slots, e-consult subjects and the practice's communication until the assistants feel the relief.", "howItSupports": "Provides the usage figures per service that explain which digital routes patients actually use.", "media": []}]}, {"customerId": "gpph", "customerName": "GP Practice and Pharmacy Manager", "customerGroup": "Patients and Primary Care Network", "customerIcon": "customer-gpph-portrait.jpg", "productId": "uw-zorg-online", "productName": "Uw Zorg Online Patient App and Portal", "productIcon": "uw-zorg-online.png", "jobId": "jtbd-gpph-2", "jobName": "Meet MedMij and Wegiz obligations without extra work", "jobWhatItIs": "Fulfil the practice's or pharmacy's legal duties to give patients electronic access to their data and to exchange data digitally: online access to the record and medication overview, the Wegiz obligation to exchange data electronically (in force since April 2023), and the MedMij standards under which patients retrieve their data into a personal health environment such as Quli. The manager wants HCI to carry the certification, consent handling, DigiD authentication and standard conformance, so that the practice only has to switch on the right settings and can show auditors and the patient federation that it complies.", "jobOutcome": "The practice complies with online access, Wegiz and MedMij through the same app and connection it already uses, patients can retrieve their data into any MedMij-labelled PGO without the practice answering paper requests, and the manager has the evidence for the accountant, the insurer's quality conditions and a NEN 7510 or AVG question without building anything themselves.", "supportRationale": "Defines the MedMij data sets patients can retrieve so that the practice knows what will become visible.", "usedInSteps": [{"step": "Understand what the practice must offer and by when", "description": "Translate the obligations for online access, Wegiz data exchange and MedMij into a short list of what patients must be able to do, which data sets are involved (record summary, medication overview, lab results, correspondence) and which deadlines apply to GP practices and pharmacies, and check what the HIS or AIS vendor and HCI already cover.", "howItSupports": "Defines the MedMij data sets patients can retrieve so that the practice knows what will become visible.", "media": []}, {"step": "Switch on MedMij retrieval through the certified connection", "description": "Rely on HCI's MedMij-certified role as the practice's exchange party: activate the data sets the practice offers, confirm that the connector delivers them from the HIS or AIS in the required standards, and test with a Quli or another MedMij PGO that a patient can retrieve their record summary and medication overview.", "howItSupports": "Provides the MedMij-certified retrieval path and the PGO test flow for the practice's data sets.", "media": []}, {"step": "Switch on MedMij retrieval through the certified connection", "description": "Rely on HCI's MedMij-certified role as the practice's exchange party: activate the data sets the practice offers, confirm that the connector delivers them from the HIS or AIS in the required standards, and test with a Quli or another MedMij PGO that a patient can retrieve their record summary and medication overview.", "howItSupports": "Delivers the practice's HIS or AIS data through the connector in the standards MedMij requires.", "media": []}, {"step": "Handle consent, authentication and identity questions", "description": "Make sure patients log in with DigiD, that parents and carers act only within the rules for children and representatives, that patients can see who accessed their data, and that objections or corrections are handled by the practice; write the practice's own short policy on top of HCI's standard texts.", "howItSupports": "Shows patients their access log and consent settings in the same app they use for care.", "media": []}, {"     mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        flowchart: {
            htmlLabels: true
        }
    });

    function renderDependenciesDiagramIfNeeded() {
        const container = document.getElementById('Dependencies');
        if (!container || container.dataset.diagramRendered === 'true') {
            return;
        }
        mermaid.run({querySelector: '#Dependencies .mermaid'}).then(() => {
            container.dataset.diagramRendered = 'true';
        }).catch(error => {
            console.error('Failed to render dependency diagram', error);
        });
    }

    function renderModuleDependencyGraphIfNeeded() {
        if (!document.getElementById('ModuleDependencyGraph')) {
            return;
        }
        renderModuleDependencyGraph();
    }

    // The shared tabs script (_imports/tabs) calls this hook after a tab opens.
    window.afterOpenTab = function (tabName) {
        if (tabName === 'dependencies') {
            renderDependenciesDiagramIfNeeded();
        }
        if (tabName === 'modules') {
            updateModuleDetailsVisibility();
            renderModuleDependencyGraphIfNeeded();
        }
    };

    function updateModuleDetailsVisibility() {
        const toggle = document.getElementById('moduleDetailsToggle');
        const showDetails = !toggle || toggle.checked;
        document.querySelectorAll('#Modules .module-detail-content').forEach(element => {
            element.style.display = showDetails ? '' : 'none';
        });
    }

    function updateBrickTabLabels() {
        const moduleCount = (brick.layers || []).reduce((total, layer) => {
            const modules = layer && layer.modules ? layer.modules : [];
            if (Array.isArray(modules)) {
                return total + modules.length;
            }
            return total + Object.keys(modules).length;
        }, 0);
        const dataCount = (brick.dataDependencies || []).length;
        const dependenciesCount = (brick.brickDependencies || []).length
            + findIncomingBrickDependencies().length
            + (brick.externalSystemsThisBrickDependsOn || brick.externalSystemDependencies || []).length
            + (brick.externalSystemsDependingOnThisBrick || []).length;
        const linksCount = (brick.links || []).reduce((sum, group) => sum + (group.links || []).length, 0);
        const modulesTab = document.getElementById('tab_modules');
        const dataTab = document.getElementById('tab_data');
        const dependenciesTab = document.getElementById('tab_dependencies');
        const linksTab = document.getElementById('tab_links');
        if (modulesTab) {
            modulesTab.textContent = 'Modules (' + moduleCount + ')';
        }
        if (dataTab) {
            dataTab.textContent = 'Data (' + dataCount + ')';
        }
        if (dependenciesTab) {
            dependenciesTab.textContent = 'Dependencies (' + dependenciesCount + ')';
        }
        if (linksTab) {
            linksTab.textContent = 'Links (' + linksCount + ')';
        }
    }

<script>
    function isFalse(value) {
        return !value || (value + '').toLowerCase().trim() === 'false' || (value + '').toLowerCase().trim() === 'no';
    }

    function isTrue(value) {
        return !isFalse(value);
    }

</script>

<script>
    let div = document.createElement('div');
    document.body.appendChild(div);

    let html = '';

    function addNavigation() {
        html += '<div style="margin: 4px 20px 10px 20px; font-size: 85%; color: black">';
        let prev_domain = all_bricks.length ? all_bricks[0].domain : '';
        all_bricks.filter(c => c.domain && c.domain.toLowerCase().trim() !== 'on ice').forEach(cap => {
            if (prev_domain && prev_domain.toLowerCase() !== cap.domain.toLowerCase()) {
                prev_domain = cap.domain;
                html += '<div style="margin-top: 5px; margin-left: 4px; vertical-align: top; display: inline-block; border-left: 2px solid lightgrey; height: 30px;">&nbsp;</div>';
            }
            html += '<a href="' + cap.id + '.html">';
            const tabClass = cap.id === brick.id ? 'tab-image-selected' : 'tab-image';
            html += '<img src="../icons/' + cap.id + '.png" class="' + tabClass + '" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
            html += '</a>';
        });
        html += '</div>';
    }

    addNavigation();

    html += '<div style="margin: 20px">';

    function addHeader() {
        html += '<table>';
        html += '<tr>';
        html += '<td>';
        html += '<div>';
        html += '<img src="../icons/' + brick.id + '.png" style="width: 110px" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
        html += '</div>';
        html += '</td>';
        html += '<td style="vertical-align: top">';
        html += '<div style="margin-left: 20px; font-size: 90%; color: grey; vertical-align: top">';
        html += '<div class="page-type-badge">Brick</div>';
        html += brick.domain;
        if (brick.group && brick.group !== brick.domain) {
            html += ' / ' + brick.group;
        }
        html += ' / <span style="color: blue; font-weight: bold;">' + brick.id.toUpperCase() + '</span>';
        html += '</div>';
        html += '<div style="font-size: 50px; margin-left: 20px">';
        html += brick.name;
        html += '</div>';
        html += '<div style="font-size: 16px; margin-left: 20px; color: grey; margin-top: 3px">';
        html += brick.description ? brick.description : '';
        html += '</div>';
        html += '</td>';
        html += '</tr>';
        html += '</table>';
    }

    addHeader();

    function addDocs() {
        html += '<div  class="" style="margin-top: 32px">';

        function addGroup(docs, icon) {
            if (docs) {
                docs.split('\n').forEach(doc => {
                    const elements = doc.trim().split(',');
                    const label = elements.length > 0 ? elements[0].trim() : '';
                    const link = elements.length > 1 ? elements[1].trim() : '';
                    if (label && link) {
                        html += '<a target="_blank" href="' + link + '">';
                        html += '<div class="docs">';
                        html += '<div>';
                        if (label.startsWith('Security ')) icon = 'security.png';
                        html += '<img src="../icons/' + icon + '" ' + 'style="width: 54px;">';
                        html += '</div>';
                        html += '<div style="font-size: 110%">' + label.replace(/_/g, ' ') + '</div>';
                        html += '</div>';
                        html += '</a>';
                    }
                });
            }
        }

        html += '</div>';
    }

    document.getElementById('Header').innerHTML = html;
    html = '';

    function escapeHomeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function resolveCustomerMediaSrc(src) {
        const value = (src || '').trim();
        if (!value) {
            return '';
        }
        if (value.startsWith('http://') || value.startsWith('https://') || value.startsWith('data:')) {
            return value;
        }
        if (value.startsWith('../') || value.startsWith('./')) {
            return value;
        }
        if (value.startsWith('media/') || value.startsWith('icons/')) {
            return '../../customers/' + value;
        }
        return '../../customers/media/' + value;
    }

    function escapeMermaidLabel(value) {
        return (value || '')
            .replaceAll('&', 'and')
            .replaceAll('"', '')
            .replaceAll("'", '')
            .replaceAll('<', '')
            .replaceAll('>', '')
            .replaceAll('[', '(')
            .replaceAll(']', ')')
            .replaceAll('{', '(')
            .replaceAll('}', ')')
            .replaceAll('|', '/');
    }

    function renderLinkedProducts() {
        let sectionHtml = '<div class="home-section">';
        sectionHtml += '<div class="home-section-title">Used In Products</div>';
        if (!linkedProducts.length) {
            sectionHtml += '<div class="activity-muted">No linked products were inferred for this brick.</div>';
        } else {
            linkedProducts.forEach(product => {
                sectionHtml += '<a class="home-link-card" target="_blank" rel="noopener noreferrer" href="../../product-deployments/landing_pages/' + escapeHomeHtml(product.id) + '.html">';
                sectionHtml += '<div class="home-link-head">';
                sectionHtml += '<img class="home-link-icon" src="../../product-deployments/icons/' + escapeHomeHtml(product.icon) + '" onerror="this.onerror=null;this.src=\'../../product-deployments/icons/product.png\'">';
                sectionHtml += '<div><div class="home-link-title">' + escapeHomeHtml(product.name) + '</div><div class="home-link-meta">' + escapeHomeHtml(product.type || 'Product') + '</div></div>';
                sectionHtml += '</div>';
                if (product.whyUsed) {
                    sectionHtml += '<div class="home-link-copy">' + escapeHomeHtml(product.whyUsed) + '</div>';
                }
                sectionHtml += '</a>';
            });
        }
        sectionHtml += '</div>';
        return sectionHtml;
    }

    function renderSupportedStreams() {
        const supportedStreams = allStreams.filter(stream => {
            return (stream.brickDependencies || []).some(dep => dep.targetBrickId === brick.id);
        });

        let sectionHtml = '<div class="home-section">';
        sectionHtml += '<div class="home-section-title">Supported Product Streams</div>';
        if (!supportedStreams.length) {
            sectionHtml += '<div class="activity-muted">No product streams currently reference this brick.</div>';
            sectionHtml += '</div>';
            return sectionHtml;
        }

        supportedStreams.forEach(stream => {
            sectionHtml += '<div class="home-link-card">';
            sectionHtml += '<div class="home-link-head">';
            sectionHtml += '<img class="home-link-icon" src="../icons/' + escapeHomeHtml(stream.icon || 'stream.png') + '" onerror="this.onerror=null;this.src=\'../icons/stream.png\'">';
            sectionHtml += '<div style="vertical-align: top"><a target="_blank" rel="noopener noreferrer" href="../stream_pages/' + escapeHomeHtml(stream.id) + '.html"><div class="home-link-title"><div class="page-type-badge" style="font-size: 70%;">Experience</div><br>' + escapeHomeHtml(stream.name) + '</div>';
            sectionHtml += '</a></div>';
            sectionHtml += '</div>';
            if (stream.description) {
                sectionHtml += '<div class="home-link-copy">' + escapeHomeHtml(stream.description) + '</div>';
            }
            if (stream.flows && stream.flows.length) {
                sectionHtml += '<div class="activity-block">';
                sectionHtml += '<div class="activity-muted"><strong>Flows facilitated</strong></div>';
                stream.flows.forEach(flow => {
                    sectionHtml += '<div class="activity-muted">- ' + escapeHomeHtml(flow.title || flow.id || '') + '</div>';
                });
                sectionHtml += '</div>';
            }
            if (stream.outcomes && stream.outcomes.length) {
                sectionHtml += '<div class="activity-block">';
                sectionHtml += '<div class="activity-muted"><strong>Outcomes</strong></div>';
                stream.outcomes.forEach(outcome => {
                    sectionHtml += '<div class="activity-muted">- ' + escapeHomeHtml(outcome) + '</div>';
                });
                sectionHtml += '</div>';
            }
            sectionHtml += '</div>';
        });

        sectionHtml += '</div>';
        return sectionHtml;
    }

    function renderReferenceLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = brick.links || [];
        let sectionHtml = '<div class="home-section">';
        if (!groups.length) {
            sectionHtml += '<div class="activity-muted">No links are configured for this product brick.</div>';
            sectionHtml += '</div>';
            return sectionHtml;
        }
        groups.forEach(group => {
            sectionHtml += '<div class="links-group">';
            sectionHtml += '<div class="links-group-title">' + escapeHomeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                sectionHtml += '<div class="links-group-description">' + escapeHomeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                sectionHtml += '<div class="link-entry">';
                sectionHtml += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHomeHtml(link.link || '#') + '">'
                    + escapeHomeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    sectionHtml += '<div class="link-entry-copy">' + escapeHomeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    sectionHtml += '<iframe class="link-embed" loading="lazy" src="' + escapeHomeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHomeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                sectionHtml += '</div>';
            });
            sectionHtml += '</div>';
        });
        sectionHtml += '</div>';
        return sectionHtml;
    }

    function renderRelatedTeams() {
        let sectionHtml = '<div class="home-section">';
        sectionHtml += '<div class="home-section-title">Teams Owning Or Supporting This Brick</div>';
        if (!relatedTeams.length) {
            sectionHtml += '<div class="activity-muted">No owning or supporting teams are linked to this product brick.</div>';
            sectionHtml += '</div>';
            return sectionHtml;
        }

        relatedTeams.forEach(team => {
            sectionHtml += '<a class="home-link-card" target="_blank" rel="noopener noreferrer" href="../../teams/landing_pages/' + escapeHomeHtml(team.teamId) + '.html">';
            sectionHtml += '<div class="home-link-head">';
            sectionHtml += '<img class="home-link-icon" src="../../teams/icons/logo.png" onerror="this.onerror=null;this.src=\'../../teams/icons/logo.png\'">';
            sectionHtml += '<div>';
            if (team.teamType) {
                sectionHtml += '<div class="home-link-copy"><div class="page-type-badge" style="font-size: 70%;">' + escapeHomeHtml(team.teamType) + ' team</div></div>';
            }
            sectionHtml += '<div class="home-link-title">' + escapeHomeHtml('' + team.teamName) + '</div><div class="home-link-meta">' + escapeHomeHtml(team.roleLabel || '') + (team.groupName ? ' | ' + escapeHomeHtml(team.groupName) : '') + '</div></div>';
            sectionHtml += '</div>';
            sectionHtml += '</a>';
        });

        sectionHtml += '</div>';
        return sectionHtml;
    }

    function renderSupportedJobs() {

        } else {
            const groupedJobs = {};
            supportedJobs.forEach(item => {
                const actorKey = item.customerId + '|' + item.productId;
                if (!groupedJobs[actorKey]) {
                    groupedJobs[actorKey] = {
                        customerId: item.customerId,
                        customerName: item.customerName,
                        customerGroup: item.customerGroup,
                        customerIcon: item.customerIcon,
                        productId: item.productId,

                    };
                }
                groupedJobs[actorKey].jobs.push(item);

                sectionHtml += '<div><div class="home-link-title"><a target="_blank" rel="noopener noreferrer" href="../../customers/landing_pages/' + escapeHomeHtml(actor.customerId) + '.html">' + escapeHomeHtml(actor.customerName) + '</a></div><div class="home-link-meta">' + escapeHomeHtml(actor.customerGroup) + ' | <a target="_blank" rel="noopener noreferrer" href="../../product-deployments/landing_pages/' + escapeHomeHtml(actor.productId) + '.html">' + escapeHomeHtml(actor.productName) + '</a></div></div>';
                sectionHtml += '</div>';
