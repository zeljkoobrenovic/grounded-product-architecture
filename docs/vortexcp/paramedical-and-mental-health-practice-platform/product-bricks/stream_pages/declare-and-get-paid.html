    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

 "check-insurance-eligibility-with-cov", "title": "Check insurance eligibility with COV before the first session", "actor": "Physiotherapy Practice Owner", "keyFacts": ["The COV check through Vecozo confirms on BSN and date of birth which insurer and which policy the patient has, and the practice records the result on the patient so that the declaration goes to the right insurer under the right contract.", "Physiotherapy for most adults is reimbursed from supplementary insurance with a limited number of sessions per year; the check does not show the remaining sessions, so the practice still discusses the expected coverage with the patient."], "painPoints": ["Patients who changed insurer on 1 January are declared to the old insurer until the practice re-runs the check.", "Practices that skip the check for returning patients get rejections on the first batch of the year."], "dependencies": [{"type": "brick", "id": "vcgw", "name": "Vecozo Gateway and Insurance Eligibility", "description": "COV check.", "how": "Runs the eligibility check through Vecozo and stores the insurer and policy result."}, {"type": "brick", "id": "dosr", "name": "Patient Dossier and Care Pathways", "description": "Insurance on the patient.", "how": "Records the verified insurer and policy on the patient record."}]}, {"id": "register-treatments-through-the-agenda", "title": "Register treatments through the agenda with the right performance codes", "actor": "Physiotherapy Practice Owner", "keyFacts": ["Each completed appointment carries the performance code (for example a regular session, a manual therapy session, a long session, a home visit surcharge) and the diagnosis code from the episode; the therapist confirms the session and the registration is done.", "For indications on the chronic list, the sessions that the patient pays first and the sessions covered by the basic insurance are counted per episode so that the declaration route switches at the right session."], "painPoints": ["Therapists who register at the end of the week forget home-visit surcharges and second sessions on the same day.", "A wrong diagnosis code on the episode turns every session in it into a rejection."], "dependencies": [{"type": "brick", "id": "agnd", "name": "Agenda and Multi-location Scheduling", "description": "Completed sessions.", "how": "Supplies the completed appointments with performance codes per therapist."}, {"type": "brick", "id": "dosr", "name": "Patient Dossier and Care Pathways", "description": "Episode codes and counters.", "how": "Provides the diagnosis code, referral data and the session counters per episode."}]}, {"id": "generate-the-declaration-batch", "title": "Generate the GDS801 declaration batch and validate it", "actor": "Physiotherapy Practice Owner", "keyFacts": ["The declaration engine builds the GDS801 batch per insurer from the registered sessions, validates the mandatory elements (BSN, insurer, performance and diagnosis codes, referral where required, AGB codes of practice and therapist) and the contract rules, and reports the lines that will fail before anything is sent.", "GDS801 was developed with PPN, KNGF, ZN, Vektis, Vecozo and EPD vendors and replaced PM304 on 1 January 2025; the engine keeps both formats for corrections of older claims."], "painPoints": ["Practices that send unvalidated batches get the same rejection for every session of a patient and lose a payment cycle."], "dependencies": [{"type": "brick", "id": "decl", "name": "Declaration Engine (GDS801 and Zorgprestatiemodel)", "description": "Batch generation and validation.", "how": "Builds and validates the GDS801 batch per insurer."}, {"type": "brick", "id": "dosr", "name": "Patient Dossier and Care Pathways", "description": "Audit-rule status.", "how": "Confirms that the episodes behind the sessions pass the record audit rules."}]}, {"id": "submit-through-vecozo-and-receive-return-messages", "title": "Submit through Vecozo and receive the return messages", "actor": "Physiotherapy Practice Owner", "keyFacts": ["The batch is submitted through the Vecozo declaration portal with the practice's certificate; the technical acknowledgement and later the insurer's return message are retrieved automatically and matched to the claim lines.", "Return messages carry per-line rejection codes (for example patient not insured on the date of treatment, treatment limit exceeded, referral missing) that the practice must interpret."], "painPoints": ["Expired Vecozo certificates block the whole practice's cash flow until someone notices."], "dependencies": [{"type": "brick", "id": "vcgw", "name": "Vecozo Gateway and Insurance Eligibility", "description": "Submission and return messages.", "how": "Submits the batch and retrieves acknowledgements and return messages."}, {"type": "brick", "id": "decl", "name": "Declaration Engine (GDS801 and Zorgprestatiemodel)", "description": "Line matching.", "how": "Matches the return message lines to the declared sessions."}]}, {"id": "resolve-rejections-and-resubmit", "title": "Resolve rejections, correct and resubmit or invoice the patient", "actor": "Implementation and Support Consultant", "keyFacts": ["Rejected lines are listed with the reason and the action: correct the registration and resubmit, credit and re-declare to another insurer, or convert to a patient invoice when the care is not covered (for example sessions beyond the supplementary limit).", "Practices on the billing service hand this worklist to HCI staff who resolve return messages on their behalf; the practice sees the status but does no rework."], "painPoints": ["Rejection codes are cryptic, and practice owners resubmit the same line unchanged.", "Lines that are neither resubmitted nor invoiced to the patient become unnoticed revenue loss."], "dependencies": [{"type": "brick", "id": "bils", "name": "Billing Services and Return-message Handling", "description": "Rejection worklist.", "how": "Presents rejected lines with reason and resolution options and tracks who resolves them."}, {"type": "brick", "id": "decl", "name": "Declaration Engine (GDS801 and Zorgprestatiemodel)", "description": "Correction and resubmission.", "how": "Produces the corrected or credited claim lines for the next batch."}, {"type": "brick", "id": "pinv", "name": "Patient Invoicing and Payments", "description": "Convert to patient invoice.", "how": "Creates a patient invoice for care that is not reimbursed."}]}, {"id": "match-payment-specifications-and-export", "title": "Match payment specifications to receipts and export to accounting", "actor": "Physiotherapy Practice Owner", "keyFacts": ["The insurer's payment specification is matched to the accepted claim lines and to the bank receipt; differences (partial payments, offsets) are shown per insurer.", "The sales journal, receipts and outstanding items are exported to Twinfield or another accounting package, and the practice dashboard shows declared, accepted, paid and outstanding amounts per insurer."], "painPoints": ["Bookkeepers who receive a PDF of the payment specification re-key it and never reconcile it to the claim lines."], "dependencies": [{"type": "brick", "id": "decl", "name": "Declaration Engine (GDS801 and Zorgprestatiemodel)", "description": "Payment matching.", "how": "Matches payment specifications to claim lines."}, {"type": "brick", "id": "pinv", "name": "Patient Invoicing and Payments", "description": "Accounting export.", "how": "Exports invoices, receipts and outstanding items to the accounting package."}, {"type": "brick", "id": "bidb", "name": "Practice BI Dashboards and Reporting", "description": "Cash-flow view.", "how": "Shows declared, accepted, paid and outstanding amounts per insurer."}]}]}, {"id": "from-zorgprestatiemodel-registration-to-patient-payment", "title": "From Zorgprestatiemodel Registration to Paid Claims and Patient Invoices", "description": "An independent GGZ practitioner registers consults and settings under the zorgprestatiemodel, the practice system builds the claims with the mandatory referral date, submits them through Vecozo, handles the return messages, and invoices the client directly where care is not reimbursed or the client asked for an uninsured route, with online payment through Mollie.", "primaryActor": "Independent GGZ Practitioner", "trigger": "The practitioner has delivered consults in the month, or a client without reimbursed care needs an invoice.", "successSignal": "All consults of the month are declared with valid setting, professional and referral data, return messages are processed, patient invoices are paid online and the accounting export is complete.", "steps": [{"id": "register-consults-and-settings", "title": "Register consults, settings and professionals", "actor": "Independent GGZ Practitioner", "keyFacts": ["Under the zorgprestatiemodel each consult is registered with its type (diagnostics or treatment), planned duration band, the setting (for example outpatient monodisciplinary or multidisciplinary) and the professional's profession; group consults and intercollegial consultation have their own performances.", "From 2026 every declaration must carry the referral date, and the system therapist was added to the professional standards; the transitional benefit ended."], "painPoints": ["Practitioners who register the setting from memory at month end pick the wrong one and every consult of the month is rejected."], "dependencies": [{"type": "brick", "id": "zpmc", "name": "Zorgprestatiemodel Registration and Compliance", "description": "Zorgprestatiemodel registration.", "how": "Registers consults with setting, profession, duration band and referral date."}, {"type": "brick", "id": "agnd", "name": "Agenda and Multi-location Scheduling", "description": "Consults from the agenda.", "how": "Supplies the delivered consults with their planned duration."}]}, {"id": "check-the-registration-against-the-model-rules", "title": "Check the registration against the model and contract rules", "actor": "Independent GGZ Practitioner", "keyFacts": ["The compliance check verifies the combination of setting, profession and performance, the presence of a valid referral with date, the diagnosis and care-demand typing, and the insurer contract limits before the claim is built.", "NZa indexes the tariffs for independent GGZ practitioners yearly; the current tariff table is applied per year of treatment."], "painPoints": ["Rule changes at the turn of the year hit practices that declare December consults in January."], "dependencies": [{"type": "brick", "id": "zpmc", "name": "Zorgprestatiemodel Registration and Compliance", "description": "Compliance rules.", "how": "Checks setting, profession, referral and typing rules and applies the tariff year."}, {"type": "brick", "id": "dosr", "name": "Patient Dossier and Care Pathways", "description": "Referral and diagnosis.", "how": "Provides the referral date and the diagnosis from the client dossier."}]}, {"id": "build-and-submit-the-ggz-claims", "title": "Build the claims and submit them through Vecozo", "actor": "Independent GGZ Practitioner", "keyFacts": ["Claims are generated per insurer with the consult performances and the referral date, validated and submitted through Vecozo; the practitioner can declare monthly so that cash flow follows the delivered care.", "Return messages are matched to consults and the rejection reasons shown in the worklist."], "painPoints": ["Independent practitioners without a practice manager postpone declaring for months and discover rejections too late to correct within the insurer's deadline."], "dependencies": [{"type": "brick", "id": "decl", "name": "Declaration Engine (GDS801 and Zorgprestatiemodel)", "description": "Claim generation.", "how": "Builds the zorgprestatiemodel claims from the registered consults."}, {"type": "brick", "id": "vcgw", "name": "Vecozo Gateway and Insurance Eligibility", "description": "Submission.", "how": "Submits the claims through Vecozo and retrieves the return messages."}]}, {"id": "invoice-the-client-with-online-payment", "title": "Invoice the client for non-reimbursed care with online payment", "actor": "Independent GGZ Practitioner", "keyFacts": ["Care that is not reimbursed (an uninsured route the client chose, a no-show fee, coaching) is invoiced to the client from the same registration with a Mollie payment link; the invoice is visible in the client portal and payment status is updated automatically.", "Reminders for unpaid invoices follow a schedule the practitioner sets."], "painPoints": ["Practitioners who send invoices from a separate accounting tool lose the link to the consult and the dossier."], "dependencies": [{"type": "brick", "id": "pinv", "name": "Patient Invoicing and Payments", "description": "Client invoice and payment.", "how": "Creates the invoice, the Mollie payment link and the reminder schedule."}, {"type": "brick", "id": "zpmc", "name": "Zorgprestatiemodel Registration and Compliance", "description": "Non-reimbursed performances.", "how": "Identifies which registered performances are invoiced to the client instead of declared."}]}, {"id": "hand-over-to-the-billing-service", "title": "Hand over return-message handling to the billing service", "actor": "Implementation and Support Consultant", "keyFacts": ["Practices that use the billing service let HCI staff resolve rejections, credit and resubmit claims and answer insurer questions; the consultant works in the same claim worklist with a support ticket per case.", "The practice keeps full visibility of what was declared and paid on its dashboard."], "painPoints": ["Billing service staff without access to the dossier context resolve rejections by guessing the missing data."], "dependencies": [{"type": "brick", "id": "bils", "name": "Billing Services and Return-message Handling", "description": "Billing service worklist.", "how": "Routes return messages to the billing service and tracks resolution."}, {"type": "brick", "id": "supp", "name": "Customer Support and Onboarding Tooling", "description": "Case tracking.", "how": "Opens and tracks a support case per billing question."}]}, {"id": "reconcile-and-report-the-month", "title": "Reconcile payments and report the month", "actor": "Independent GGZ Practitioner", "keyFacts": ["Accepted claims, insurer payments and client payments are reconciled and exported to accounting; the dashboard shows revenue per insurer and per client route for the month.", "Outstanding claims and invoices older than a set number of days are listed for follow-up."], "painPoints": ["Without a monthly close the practitioner does not know whether the practice is profitable until the accountant's year-end figures."], "dependencies": [{"type": "brick", "id": "pinv", "name": "Patient Invoicing and Payments", "description": "Reconciliation and export.", "how": "Reconciles receipts to invoices and claims and exports to accounting."}, {"type": "brick", "id": "bidb", "name": "Practice BI Dashboards and Reporting", "description": "Monthly revenue view.", "how": "Shows revenue, outstanding claims and invoices for the month."}]}]}], "outcomes": ["Declarations are generated from the agenda and dossier without re-registration and submitted to Vecozo in the current GDS801 or zorgprestatiemodel format", "Return messages are resolved within the practice or by the billing service before the next batch, so first-time-right rates stay high after standard changes", "Patients pay non-reimbursed care and no-show fees online without the practice chasing paper invoices", "Every paid claim and invoice is exported to the accounting package with the right ledger allocation"], "brickDependencies": [{"targetBrickId": "decl", "type": "composition"}, {"targetBrickId": "vcgw", "type": "composition"}, {"targetBrickId": "pinv", "type": "composition"}, {"targetBrickId": "bils", "type": "composition"}, {"targetBrickId": "agnd", "type": "composition"}, {"targetBrickId": "dosr", "type": "composition"}, {"targetBrickId": "     const related_bricks = [{"id": "decl", "name": "Declaration Engine (GDS801 and Zorgprestatiemodel)", "type": "service", "status": "invest", "description": "The engine that turns registered treatments into insurer claims without retyping: for paramedical care it composes GDS801 declarations (the standard that replaced PM304 on 1 January 2025) from the agenda and episode, checks the referral, insurance coverage, treatment count and diagnosis codes against the insurer's contract and the patient's policy, and for GGZ it builds zorgprestatiemodel claims per consult, setting and profession, carrying the referral date that is mandatory on every declaration from 2026. Claims are batched per insurer, submitted through the Vecozo gateway and reconciled with return messages, and every rejected line becomes a correction task instead of lost revenue. With more than \u20ac500 million in annual declarations reported by 2022, this is the brick where a standard change without a rejection spike is a strategic objective.", "links": [{"group": "Evidence", "description": "Real-world evidence related to this product brick.", "links": [{"label": "Evidence Explorer", "link": "../../../../evidence-explorer/index.html", "description": "Search evidence \u2014 source repositories, cloud resources, and contacts. Refine with ?q=<query> to pre-filter for this product brick.", "embedLink": "../../../../evidence-explorer/index.html?embed=1"}]}], "layers": [{"layer": "ui", "description": "User-facing web, mobile, backoffice, and operator experience modules.", "modules": [{"id": "module-decl-web", "name": "Declaration Workbench", "type": "web-component", "description": "Screens to review declarable treatments per period and insurer, see validation warnings before submission, release batches, follow submission and payment status and correct and resubmit rejected lines.", "dependencies": {"modules": [{"moduleId": "module-decl-api", "type": "uses", "description": "Workbench reads and releases declar     mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        flowchart: {
            htmlLabels: false
        }
    });

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

    function getFlows() {
        return currentStream.flows || [];
    }

    function getFlowDependencies(flow) {
        const dependencyIndex = new Map();
        (flow.steps || []).forEach(step => {
            (step.dependencies || []).forEach(dependency => {
                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());
    }

    function getStepDependency(step, dependency) {
        return (step.dependencies || []).find(item => (item.type || '') === (dependency.type || '') && (item.id || '') === (dependency.id || '')) || null;
    }

    function getPrimaryActors() {
        const streamJobs = currentStream.supportedCustomerJobs || [];
        const allJobs = streamJobs.length ? streamJobs : supported_jobs;
        return dedupe(allJobs.map(item => item.customerName || item.customerGroup || '').filter(Boolean), item => item);
    }

    function summarizeFlow(flow) {
        const steps = flow.steps || [];
        const firstStep = steps[0] || {};
        const lastStep = steps[steps.length - 1] || {};
        return {
            actor: flow.primaryActor || firstStep.actor || '',
            trigger: flow.trigger || firstStep.trigger || '',
            result: flow.successSignal || flow.outcome || lastStep.successSignal || lastStep.output || ''
        };
    }

    function renderStepMeta(label, value) {
        if (!value) {
            return '';
        }
        return '<div class="flow-step-meta-item"><div class="flow-step-meta-label">' + escapeHtml(label) + '</div><div class="flow-step-copy">' + escapeHtml(value) + '</div></div>';
    }

    function flowDependencyIconFile(dependency) {
        const dependencyId = dependency.id || '';
        const linkedBrick = related_bricks.find(brick => brick.id === dependencyId) || all_bricks.find(brick => brick.id === dependencyId) || {};
        return dependency.icon || linkedBrick.icon || (dependencyId ? dependencyId + '.png' : 'brick.png');
    }

    function renderFlowDependencyIcon(dependency, className) {
        return '<img class="' + escapeHtml(className) + '" src="../icons/' + escapeHtml(flowDependencyIconFile(dependency)) + '" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
    }

    function renderStepDependencyPills(step) {
        const dependencies = step.dependencies || [];
        if (!dependencies.length) {
            return '<div class="muted">No step-specific dependencies listed.</div>';
        }

        return '<div class="flow-step-dependencies">' + dependencies.map(dep => {
            const label = dep.name || dep.id || 'Dependency';
            const kind = 'Brick';
            return '<span class="flow-cell-brick">' + renderFlowDependencyIcon(dep, 'flow-cell-brick-icon') + '<span>' + escapeHtml(kind + ': ' + label) + '</span></span>';
        }).join('') + '</div>';
    }

    function simplifySupportCopy(value) {
        const text = String(value || '').trim();
        if (!text) {
            return '';
        }
        const simplified = text.replace(/^Supports .*? by helping users help /i, 'Facilitate ');
        return simplified;
    }
</script>

<script>
    function streamMetaPath(stream) {
        const parts = [];

        }
        if (stream.rootGroup && stream.rootGroup !== stream.group) {
            parts.push(stream.rootGroup);
        }
        if (!parts.length) {
            parts.push('Stream');
        }
        return parts.join(' / ');

        html += '<div class="group"><div class="section-title">Flow Narratives (' + flows.length + ')</div>';

            html += '<div class="muted">No flows listed for this stream.</div>';
        } else {
            html += '<div class="card-grid">';
            flows.forEach(flow => {

                html += '<div class="card">';
                html += '<div class="card-meta">' + escapeHtml(streamMetaPath(currentStream)) + '</div>';

                html += '<div class="card-copy">' + escapeHtml(flow.description || '') + '</div>';

        html += '</div>';

        html += '<div class="group"><div class="section-title">Supporting Product Bricks</div>';

        document.getElementById('tab_flows').innerHTML = 'Flow Narratives (' + flows.length + ')';

            html += '<div class="section-title">Flow</div>';
            html += '<div class="flow-title">' + escapeHtml(flow.title || flow.id) + '</div>';
            html += '<div class="flow-description">' + escapeHtml(flow.description || '') + '</div>';
            if (summary.actor || summary.trigger || summary.result) {
                html += '<div class="card" style="margin-bottom:16px;">';
                if (summary.actor) {
                    html += '<div class="card-copy"><strong>Primary actor:</strong> ' + escapeHtml(summary.actor) + '</div>';
                }
                if (summary.trigger) {
                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';

                html += '</div>';
            }

            html += '<div class="section-title">Dependency Traceability</div>';
            html += '<div class="flow-matrix-wrap">';
            html += '<table class="flow-matrix">';
            html += '<thead>';
            html += '<tr><th class="flow-dependency-col"></th>';

                html += '<th class="flow-step-col"><div class="flow-step-label">Step ' + (index + 1) + '</div><div class="card-title">' + escapeHtml(step.title || step.id) + '</div></th>';

            dependenciesInFlow.forEach(dependency => {

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';
        }
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-title">' + escapeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';

            (group.links || []).forEach(link => {
                count++;
                html += '<div class="link-entry">';

                if (link.description) {
                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';

                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>
