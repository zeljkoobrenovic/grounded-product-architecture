    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

    const currentStream = {"id": "schedule-appointments-and-online-booking", "name": "Schedule Appointments and Online Booking", "icon": "schedule-appointments-and-online-booking.png", "type": "outcome-based-stream", "description": "Take a paramedical practice from a referral, a phone call or a patient request to a booked and confirmed slot in the agenda that FysioRoadmap calls the central heart of the practice. The stream covers the multi-therapist, multi-location agenda, 24/7 online booking from the practice website and the Uw Zorg Online app synchronised with that agenda, waiting-list handling, reminders that cut no-shows, group lessons and subscriptions in SpotOnMedics style, and the mobile agenda in the Zorgverlener App. Because invoices and declarations are generated from the agenda, every booking must already carry the patient, the therapist, the location and the treatment code that the declaration later needs.", "group": "Paramedical Practice Journeys", "rootGroup": "Paramedical Practice Journeys", "flows": [{"id": "from-online-request-to-confirmed-first-appointment", "title": "From Online Request to Confirmed First Appointment", "description": "A new patient with a shoulder complaint books a first physiotherapy appointment through the practice website or the Uw Zorg Online app, the practice checks the request against the agenda and the intake requirements, and the slot is confirmed and reminded until the patient walks in.", "primaryActor": "Physiotherapy Practice Owner", "trigger": "A patient opens the online booking page of the practice website or taps 'book an appointment' in the Uw Zorg Online app, with or without a GP referral.", "successSignal": "The first appointment is confirmed in the agenda with therapist, location, room and a provisional treatment code, the patient has received a confirmation and a reminder, and the intake questionnaire link has been sent.", "steps": [{"id": "open-online-booking-from-the-website-or-app", "title": "Open online booking from the practice website or the patient app", "actor": "Patient and Client", "keyFacts": ["The practice website shows a booking entry point that reads the live availability of every therapist and location from the agenda; SpotOnMedics-style 24/7 online booking means a patient can book on Sunday evening for Monday morning.", "Patients who already use the Uw Zorg Online app for their GP see the physiotherapy practice as another care provider and book in the same app without a new account.", "The booking page asks for complaint type, preferred location and whether the patient has a referral; in the Netherlands physiotherapy is directly accessible (DTF), so a referral is optional for most complaints."], "painPoints": ["Practices that publish a static contact form instead of live booking keep answering the phone for every first appointment.", "Patients do not know which therapist or specialisation (manual therapy, pelvic physiotherapy, paediatric physiotherapy) fits their complaint and book the wrong slot."], "dependencies": [{"type": "brick", "id": "pweb", "name": "Practice Websites", "description": "Booking entry point on the website.", "how": "Embeds the online-booking widget with live availability in the practice website."}, {"type": "brick", "id": "appb", "name": "Patient Appointment Self-service", "description": "Booking in the patient app.", "how": "Lets an Uw Zorg Online user pick the practice, therapist and slot from the app."}, {"type": "brick", "id": "pgoa", "name": "Patient App and Web Portal", "description": "Patient identity in the app.", "how": "Identifies the patient in the app so that the booking is linked to the right person."}]}, {"id": "match-the-request-to-therapist-location-and-slot", "title": "Match the request to a therapist, location and slot", "actor": "Physiotherapy Practice Owner", "keyFacts": ["The agenda holds per-therapist working hours, per-location rooms and equipment, treatment durations per appointment type and specialisation cards so that a pelvic-physiotherapy request only shows pelvic-physiotherapy slots.", "Practices with 2 to 15 therapists on several locations run one shared agenda, and the practice owner decides which slots are bookable online and which are held back for follow-ups."], "painPoints": ["When online-bookable slots are not fenced, new patients fill the follow-up capacity and existing patients cannot continue their treatment series.", "Multi-location practices without room and equipment resources double-book the shockwave device or the exercise room."], "dependencies": [{"type": "brick", "id": "agnd", "name": "Agenda and Multi-location Scheduling", "description": "Availability and resources.", "how": "Computes bookable slots from working hours, rooms, equipment and appointment types."}, {"type": "brick", "id": "obok", "name": "Online Booking, Waiting List and Reminders", "description": "Online-booking rules.", "how": "Applies the practice's rules for which slots, therapists and appointment types are bookable online."}]}, {"id": "identify-or-create-the-patient", "title": "Identify or create the patient and check for an existing dossier", "actor": "Physiotherapy Practice Owner", "keyFacts": ["A booking from the app arrives with a verified identity; a booking from the website is matched on name, date of birth and e-mail against existing patients so that a returning patient is not created twice.", "The booking creates the patient and a provisional episode in the dossier so that the therapist opens the first appointment with an intake ready to fill."], "painPoints": ["Duplicate patients created from website bookings split the treatment history and later cause declaration rejections on the wrong BSN.", "Practices that collect the BSN and insurance details by phone after the booking lose the first appointment to administration."], "dependencies": [{"type": "brick", "id": "dosr", "name": "Patient Dossier and Care Pathways", "description": "Patient and episode.", "how": "Creates or links the patient and opens a provisional episode for the complaint."}, {"type": "brick", "id": "iden", "name": "Identity, Access and Strong Authentication (UZI/DigiD)", "description": "Verified patient identity.", "how": "Supplies the verified identity for bookings that come through the patient app."}]}, {"id": "confirm-the-slot-and-send-the-intake-questionnaire", "title": "Confirm the slot and send the intake questionnaire", "actor": "Physiotherapy Practice Owner", "keyFacts": ["The confirmation carries date, time, location, therapist and what to bring (identification, insurance card, referral letter if any) and includes the link to the digital intake so that the therapist reads the complaint history before the patient arrives.", "Confirmations go to the app inbox when the patient uses Uw Zorg Online and by e-mail or SMS otherwise."], "painPoints": ["Patients who fill the intake on paper in the waiting room delay the first consult and the therapist retypes the answers into the dossier."], "dependencies": [{"type": "brick", "id": "obok", "name": "Online Booking, Waiting List and Reminders", "description": "Confirmation and intake link.", "how": "Sends the confirmation with the intake link through app, e-mail or SMS."}, {"type": "brick", "id": "pgoa", "name": "Patient App and Web Portal", "description": "App inbox.", "how": "Shows the confirmation and the intake questionnaire in the patient app."}]}, {"id": "remind-the-patient-and-handle-changes", "title": "Remind the patient and handle reschedules and cancellations", "actor": "Patient and Client", "keyFacts": ["Reminders go out at a practice-configured interval before the appointment; the patient can reschedule or cancel from the reminder within the practice's cancellation window, and a freed slot is offered to the waiting list.", "Late cancellations and no-shows are recorded on the appointment so that the practice can apply its no-show tariff (not declarable to the insurer) through a patient invoice."], "painPoints": ["Patients who cancel by voicemail outside opening hours leave a slot empty that a waiting-list patient would have taken.", "Practices that do not record no-shows consistently cannot invoice them and cannot see which therapists or slots attract them."], "dependencies": [{"type": "brick", "id": "obok", "name": "Online Booking, Waiting List and Reminders", "description": "Reminders and waiting list.", "how": "Sends reminders, accepts reschedules and offers freed slots to the waiting list."}, {"type": "brick", "id": "agnd", "name": "Agenda and Multi-location Scheduling", "description": "Appointment status.", "how": "Records reschedules, cancellations and no-shows on the agenda entry."}, {"type": "brick", "id": "appb", "name": "Patient Appointment Self-service", "description": "Self-service changes.", "how": "Lets the patient reschedule or cancel from the app within the practice rules."}]}, {"id": "see-the-day-on-desktop-and-mobile", "title": "See the day on desktop and in the Zorgverlener App", "actor": "Physiotherapy Practice Owner", "keyFacts": ["Therapists who work at several locations or on home visits open the day in the Zorgverlener App, see who is next, whether the intake was filled and where the appointment is, and mark arrival or no-show from the phone.", "The agenda entry already carries the treatment code, so at the end of the day the declaration engine can generate the claims from the agenda without extra registration."], "painPoints": ["Therapists who cannot see the agenda on the phone during home visits call the front desk for every change."], "dependencies": [{"type": "brick", "id": "mobi", "name": "Zorgverlener Mobile App", "description": "Mobile agenda.", "how": "Shows the day per therapist with patient status and lets the therapist mark arrival or no-show."}, {"type": "brick", "id": "agnd", "name": "Agenda and Multi-location Scheduling", "description": "Day view and statuses.", "how": "Keeps the desktop and mobile day view in sync across locations."}]}]}, {"id": "run-group-lessons-and-subscriptions", "title": "Run Group Lessons, Programmes and Subscriptions", "description": "A practice sets up group lessons (medical fitness, fall prevention, COPD or back-school groups), lets patients subscribe to a programme or a monthly membership, plans the sessions in the agenda with room and trainer capacity, and tracks attendance so that programmes are invoiced to the patient or declared to the insurer correctly.", "primaryActor": "Physiotherapy Practice Owner", "trigger": "The practice owner decides to offer a group programme or a patient asks to join an existing group after individual treatment.", "successSignal": "The group runs with the planned capacity, every participant has a subscription or programme record, attendance is registered per session and the invoicing or declaration follows the right route.", "steps": [{"id": "define-the-group-programme-and-capacity", "title": "Define the group programme, its schedule and capacity", "actor": "Physiotherapy Practice Owner", "keyFacts": ["A group programme has a name, a trainer, a room with a maximum number of participants, a session schedule (for example twice a week for twelve weeks) and a pricing model: a patient-paid subscription, a fixed-price programme, or a declarable group treatment such as supervised exercise therapy for COPD or claudication.", "SpotOnMedics-style group management shows occupancy per session so that the owner can open a second group when a waiting list forms."], "painPoints": ["Groups planned in a spreadsheet next to the agenda collide with individual appointments in the same room."], "dependencies": [{"type": "brick", "id": "grpm", "name": "Group Lessons, Programmes and Subscriptions", "description": "Programme definition.", "how": "Defines the programme, pricing model, schedule and capacity."}, {"type": "brick", "id": "agnd", "name": "Agenda and Multi-location Scheduling", "description": "Room and trainer capacity.", "how": "Reserves the room and the trainer's time for every session in the schedule."}]}, {"id": "enrol-participants-and-start-subscriptions", "title": "Enrol participants and start their subscriptions", "actor": "Physiotherapy Practice Owner", "keyFacts": ["Existing patients are enrolled from their dossier so that the group participation is part of the treatment history; new members of a fitness subscription are created as patients with a subscription and no clinical episode.", "Patients can enrol online from the website or the app when the owner opens a programme for self-service enrolment."], "painPoints": ["Practices that manage memberships in a separate fitness system reconcile two member lists every month.", "Participants whose supervised programme is declarable are enrolled as subscription members by mistake and the insurer claim is never generated."], "dependencies": [{"type": "brick", "id": "grpm", "name": "Group Lessons, Programmes and Subscriptions", "description": "Enrolment and subscription.", "how": "Enrols the participant and starts the subscription or programme record with its pricing route."}, {"type": "brick", "id": "dosr", "name": "Patient Dossier and Care Pathways", "description": "Patient link.", "how": "Links the participation to the patient record and the clinical episode when there is one."}, {"type": "brick", "id": "obok", "name": "Online Booking, Waiting List and Reminders", "description": "Online enrolment.", "how": "Lets patients enrol in an open programme from the website or app."}]}, {"id": "plan-sessions-and-register-attendance", "title": "Plan the sessions and register attendance", "actor": "Allied Health Therapist", "keyFacts": ["Each session is an agenda entry with the participant list; the trainer ticks attendance on the tablet or in the Zorgverlener App at the start of the session.", "Attendance feeds both the declarable group treatment (one registration per participant per session) and the subscription (sessions used of the entitlement)."], "painPoints": ["Attendance ticked on a paper list is typed in days later, and declarations for absent participants slip through."], "dependencies": [{"type": "brick", "id": "agnd", "name": "Agenda and Multi-location Scheduling", "description": "Session entries.", "how": "Holds each session as an agenda entry with its participant list."}, {"type": "brick", "id": "mobi", "name": "Zorgverlener Mobile App", "description": "Attendance on the phone.", "how": "Lets the trainer register attendance per participant from the mobile app."}, {"type": "brick", "id": "grpm", "name": "Group Lessons, Programmes and Subscriptions", "description": "Attendance record.", "how": "Stores attendance against the programme or subscription."}]}, {"id": "handle-waiting-lists-and-substitutions", "title": "Handle waiting lists, absences and substitutions", "actor": "Physiotherapy Practice Owner", "keyFacts": ["Participants who cannot attend can book a catch-up session in another group within the same programme; a full group keeps a waiting list that is offered a place when a participant stops.", "Trainer absence triggers a substitution or a rescheduled session with notifications to all participants."], "painPoints": ["Cancelling a session by calling twelve participants one by one is the reason many practices keep groups small."], "dependencies": [{"type": "brick", "id": "obok", "name": "Online Booking, Waiting List and Reminders", "description": "Notifications and waiting list.", "how": "Notifies participants of changes and offers freed places to the waiting list."}, {"type": "brick", "id": "grpm", "name": "Group Lessons, Programmes and Subscriptions", "description": "Catch-up and substitution rules.", "how": "Applies the programme rules for catch-up sessions and substitutions."}]}, {"id": "close-the-period-and-route-the-charges", "title": "Close the period and route the charges to invoice or declaration", "actor": "Physiotherapy Practice Owner", "keyFacts": ["At period end the subscription fee is invoiced to the member, the fixed-price programme is invoiced on enrolment or in instalments, and the declarable group sessions are handed to the declaration flow with the group-treatment code per participant.", "The owner sees occupancy, attendance rate and revenue per programme to decide which groups to continue."], "painPoints": ["Practices that invoice subscriptions manually forget price changes and chase members who stopped months ago."], "dependencies": [{"type": "brick", "id": "grpm", "name": "Group Lessons, Programmes and Subscriptions", "description": "Period close.", "how": "Produces the subscription and programme charges and the declarable session registrations."}, {"type": "brick", "id": "dosr", "name": "Patient Dossier and Care Pathways", "description": "Episode registration.", "how": "Records the group sessions in the episode so that the declaration engine can pick them up."}]}]}], "outcomes": ["A patient who finds the practice on the website or in the app books a first appointment without a phone call, and the slot appears in the therapist's agenda with the right treatment code", "Therapists across locations see one agenda on desktop and mobile and no longer double-book rooms, equipment or group lessons", "Reminders and the waiting list keep the agenda full, so cancellations are refilled and no-shows fall", "Every agenda entry is complete enough to generate the invoice or GDS801 declaration without later correction"], "brickDependencies": [{"targetBrickId": "agnd", "type": "composition"}, {"targetBrickId": "obok", "type": "composition"}, {"targetBrickId": "grpm", "type": "composition"}, {"targetBrickId": "pweb", "type": "composition"}, {"targetBrickId": "mobi", "type": "composition"}, {"targetBrickId": "appb", "type": "composition"}, {"targetBrickId": "pgoa", "type": "composition"}, {"targetBrickId": "dosr", "type": "composition"}, {"targetBrickId": "iden", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "Google Calendar, Outlook and mobile calendar apps", "type": "calendar-sync", "interface": "iCal / CalDAV subscription feeds", "description": "Therapists subscribe to their personal agenda from the practice system so that the mobile calendar shows practice appointments next to private ones without exposing patient names."}, {"system": "SMS and e-mail gateways", "type": "messaging-gateway", "interface": "Transactional SMS and e-mail", "description": "Deliver appointment confirmations, reminders and waiting-list offers to patients who have not activated the app."}, {"system": "Apple App Store and Google Play", "type": "app-distribution-platform", "interface": "App distribution and push notification services", "description": "Distribute the Uw Zorg Online patient app and the Zorgverlener App and deliver push reminders for upcoming appointments."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []};
    const related_bricks = [{"id": "agnd", "name": "Agenda and Multi-location Scheduling", "type": "full-stack", "status": "sustaining", "description": "The agenda that FysioRoadmap, SpotOnMedics, Incura and HCI One all describe as the central heart of the practice: one calendar per therapist and per treatment room across every location, with treatment codes, referral and episode linked to each appointment so that the dossier opens with one click and the declaration is generated from the agenda rather than typed again. It handles recurring series, waiting-room check-in, no-shows and moves between therapists, and it is the timeline that group lessons, online booking, patient self-service, the Zorgverlener App and the BI dashboards all read from. In HCI One the agenda is the first component shared by every discipline, so its slot model must carry physiotherapy, speech therapy, dietetics and GGZ session types alike.", "links": [{"group": "Evidence", "description": "Real-world evidence related to this product brick.", "links": [{"label": "Evidence Explorer", "link": "../../../../evidence-explorer/index.html", "description": "Search evidence \u2014 source repositories, cloud resources, and contacts. Refine with ?q=<query> to pre-filter for this product brick.", "embedLink": "../../../../evidence-explorer/index.html?embed=1"}]}], "layers": [{"layer": "ui", "description": "User-facing web, mobile, backoffice, and operator experience modules.", "modules": [{"id": "module-agnd-web", "name": "Practice Agenda", "type": "web-component", "description": "Day, week and multi-therapist agenda views per location with drag-and-drop rescheduling, colour-coded treatment codes, check-in and no-show marking, quick dossier opening and a search across patients and referrals.", "dependencies": {"modules": [{"moduleId": "module-agnd-api", "type": "uses", "description": "Practice Agenda reads and writes appointments through the Agenda API."}]}}, {"id": "module-agnd-mobile", "name": "Mobile Agenda", "type": "mobile-component", "description": "Compact agenda for phone and tablet used at home visits and between locations: today's list, patient contact details, start and finish of a treatment and a one-tap dictation entry.", "dependencies": {"modules": [{"moduleId": "module-agnd-api", "type": "uses", "description": "Mobile Agenda reads and updates today's appointments through the Agenda API."}]}}]}, {"layer": "interfaces", "description": "APIs, BFFs, and explicit service boundary interfaces exposed to clients or other systems.", "modules": [{"id": "module-agnd-api", "name": "Agenda API", "type": "api", "description": "Read, create, move and cancel API for appointments, slot availability per therapist and location and treatment-code registration; used by online booking, group programmes, patient self-service, the declaration engine, the Zorgverlener App and practice dashboards.", "dependencies": {"modules": [{"moduleId": "module-agnd-planner", "type": "delegates", "description": "Interface delegates conflict and rule checks to the Slot Planner."}, {"moduleId": "module-agnd-store", "type": "delegates", "description": "Interface delegates persistence to the Agenda Store."}]}}]}, {"layer": "worker", "description": "Background workers, event consumers, daemons, and asynchronous processing modules.", "modules": [{"id": "module-agnd-events", "name": "Agenda Change Events", "type": "message-queue", "description": "Topic carrying appointment created, moved, cancelled, checked-in and completed events so declarations, reminders, dashboards and the patient app react without polling the agenda.", "dependencies": {"modules": [{"moduleId": "module-agnd-store", "type": "processes", "description": "Events are emitted from committed Agenda Store transactions."}]}}]}, {"layer": "stateless-service", "description": "Stateless orchestration services that aggregate other services without owning durable state.", "modules": [{"id": "module-agnd-planner", "name": "Slot and Conflict rceModuleId": "module-agnd-web", "type": "workflow", "description": "Shows group lessons and programme sessions in the therapist and room agenda next to individual treatments."}, {"targetBrickId": "tnnt", "moduleId": "module-tnnt-api", "sourceModuleId": "module-agnd-planner", "type": "configuration", "description": "Reads tenant locations, opening hours, disciplines and label-specific agenda settings from the tenant configuration."}, {"targetBrickId": "iden", "moduleId": "module-iden-api", "sourceModuleId": "module-agnd-api", "type": "identity", "description": "Resolves the signed-in therapist, front-desk employee or practice owner and the practice tenant and locations they may schedule for, so a therapist who works for two practices only sees the agenda of the tenant selected."}, {"targetBrickId": "audt", "moduleId": "module-audt-ingest-queue", "sourceModuleId": "module-agnd-store", "type": "audit", "description": "Publishes appointment creation, move, cancellation and check-in events to the audit log queue so that a patient's appointment history can be reconstructed for insurer audits and a moved or deleted appointment is attributable to the employee who changed it."}], "externalSystemsThisBrickDependsOn": [], "externalSystemsDependingOnThisBrick": [{"system": "Zorgverlener App and label web clients", "type": "channel-consumer", "interface": "Agenda API", "description": "Every practitioner-facing agenda view reads and writes through this API.", "moduleId": "module-agnd-api"}], "domain": "Paramedical Practice Management and EPD", "group": "Scheduling and Booking"}, {"id": "obok", "name": "Online Booking, Waiting List and Reminders", "type": "full-stack", "status": "invest", "description": "The 24/7 online booking that SpotOnMedics made its calling card and that HCI One carries forward: a booking widget on the practice website and in the Uw Zorg Online app that shows real free slots from the agenda, lets new and existing patients choose a therapist, location and treatment type, and confirms the appointment directly in the practice agenda. It also runs the waiting list that fills cancellations automatically and the SMS, e-mail and push reminders that reduce no-shows. Raising the online booking share is one of the year-one levers for administrative relief, because every self-booked appointment is a phone call the front desk does not take.", "links": [{"group": "Evidence", "description": "Real-world evidence related to this product brick.", "links": [{"label": "Evidence Explorer", "link": "../../../../evidence-explorer/index.html", "description": "Search evidence \u2014 source repositories, cloud resources, and contacts. Refine with ?q=<query> to pre-filter for this product brick.", "embedLink": "../../../../evidence-explorer/index.html?embed=1"}]}], "layers": [{"layer": "ui", "description": "User-facing web, mobile, backoffice, and operator experience modules.", "modules": [{"id": "module-obok-web", "name": "Online Booking Widget", "type": "web-component", "description": "Embeddable booking flow for practice websites and the patient app: choose complaint or treatment type, therapist and location, pick a free slot, identify or register as a new patient and confirm; also the patient-facing cancel and reschedule screens.", "dependencies": {"modules": [{"moduleId": "module-obok-api", "type": "uses", "description": "Widget reads availability and books through the Booking API."}]}}]}, {"layer": "interfaces", "description": "APIs, BFFs, and explicit service boundary interfaces exposed to clients or other systems.", "modules": [{"id": "module-obok-api", "name": "Booking API", "type": "api", "description": "Public and portal-facing API for availability, booking, rescheduling and cancellation, waiting-list enrolment and reminder preferences; consumed by practice websites, the patient app, the Zorgverlener App and partner booking channels.", "dependencies": {"modules": [{"moduleId": "module-obok-orchestrator", "type": "delegates", "descrip     mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        flowchart: {
            htmlLabels: false
        }
    });

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

    function getFlows() {
        return currentStream.flows || [];
    }

    function getFlowDependencies(flow) {
        const dependencyIndex = new Map();
        (flow.steps || []).forEach(step => {
            (step.dependencies || []).forEach(dependency => {
                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());
    }

    function getStepDependency(step, dependency) {
        return (step.dependencies || []).find(item => (item.type || '') === (dependency.type || '') && (item.id || '') === (dependency.id || '')) || null;
    }

    function getPrimaryActors() {
        const streamJobs = currentStream.supportedCustomerJobs || [];
        const allJobs = streamJobs.length ? streamJobs : supported_jobs;
        return dedupe(allJobs.map(item => item.customerName || item.customerGroup || '').filter(Boolean), item => item);
    }

    function summarizeFlow(flow) {
        const steps = flow.steps || [];
        const firstStep = steps[0] || {};
        const lastStep = steps[steps.length - 1] || {};
        return {
            actor: flow.primaryActor || firstStep.actor || '',
            trigger: flow.trigger || firstStep.trigger || '',
            result: flow.successSignal || flow.outcome || lastStep.successSignal || lastStep.output || ''
        };
    }

    function renderStepMeta(label, value) {
        if (!value) {
            return '';
        }
        return '<div class="flow-step-meta-item"><div class="flow-step-meta-label">' + escapeHtml(label) + '</div><div class="flow-step-copy">' + escapeHtml(value) + '</div></div>';
    }

    function flowDependencyIconFile(dependency) {
        const dependencyId = dependency.id || '';
        const linkedBrick = related_bricks.find(brick => brick.id === dependencyId) || all_bricks.find(brick => brick.id === dependencyId) || {};
        return dependency.icon || linkedBrick.icon || (dependencyId ? dependencyId + '.png' : 'brick.png');
    }

    function renderFlowDependencyIcon(dependency, className) {
        return '<img class="' + escapeHtml(className) + '" src="../icons/' + escapeHtml(flowDependencyIconFile(dependency)) + '" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
    }

    function renderStepDependencyPills(step) {
        const dependencies = step.dependencies || [];
        if (!dependencies.length) {
            return '<div class="muted">No step-specific dependencies listed.</div>';
        }

        return '<div class="flow-step-dependencies">' + dependencies.map(dep => {
            const label = dep.name || dep.id || 'Dependency';
            const kind = 'Brick';
            return '<span class="flow-cell-brick">' + renderFlowDependencyIcon(dep, 'flow-cell-brick-icon') + '<span>' + escapeHtml(kind + ': ' + label) + '</span></span>';
        }).join('') + '</div>';
    }

    function simplifySupportCopy(value) {
        const text = String(value || '').trim();
        if (!text) {
            return '';
        }
        const simplified = text.replace(/^Supports .*? by helping users help /i, 'Facilitate ');
        return simplified;
    }

                html += '<div class="card-title">' + escapeHtml(product.name || product.id) + '</div>';
                html += '</div>';
                html += '<div class="card-copy">' + escapeHtml(product.whyUsed || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Related Teams</div>';
        if (!related_teams.length) {
            html += '<div class="muted">No teams were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            related_teams.forEach(team => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../../teams/landing_pages/' + escapeHtml(team.teamId) + '.html">';
                html += '<div class="card-meta">' + escapeHtml(team.roleLabel || team.teamType || 'Team') + '</div>';
                html += '<div class="card-title">' + escapeHtml(team.teamName || team.teamId) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(team.groupName || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Supported Customer Jobs</div>';
        if (!supported_jobs.length) {
            html += '<div class="muted">No customer jobs were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            supported_jobs.forEach(job => {
                html += '<div class="card">';
                html += '<div class="card-meta">' + escapeHtml(job.customerGroup || '') + (job.productName ? ' | ' + escapeHtml(job.productName) : '') + '</div>';
                html += '<div class="card-title">' + escapeHtml(job.jobName || job.jobId) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(job.jobOutcome || job.jobWhatItIs || '') + '</div>';
                if (job.supportRationale) {
                    html += '<div class="card-copy"><strong>Why this stream matters here:</strong> ' + escapeHtml(job.supportRationale) + '</div>';
                }
                if ((job.usedInSteps || []).length) {
                    html += '<ul class="list">' + job.usedInSteps.map(step => '<li>' + escapeHtml(step.step || step.description || '') + '</li>').join('') + '</ul>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        html += '</div>';

        document.getElementById('tab_content_home').innerHTML = html;
    }

    function renderFlows() {
        const flows = getFlows();
        const totalSteps = flows.reduce((count, flow) => count + ((flow.steps || []).length), 0);
        let html = '';

        document.getElementById('tab_flows').innerHTML = 'Flow Narratives (' + flows.length + ')';

        flows.forEach(flow => {
            const dependenciesInFlow = getFlowDependencies(flow);
            const summary = summarizeFlow(flow);
            html += '<div class="group">';
            html += '<div class="section-title">Flow</div>';
            html += '<div class="flow-title">' + escapeHtml(flow.title || flow.id) + '</div>';
            html += '<div class="flow-description">' + escapeHtml(flow.description || '') + '</div>';
            if (summary.actor || summary.trigger || summary.result) {
                html += '<div class="card" style="margin-bottom:16px;">';
                if (summary.actor) {
                    html += '<div class="card-copy"><strong>Primary actor:</strong> ' + escapeHtml(summary.actor) + '</div>';
                }
                if (summary.trigger) {
                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';
                }
                html += '</div>';
            }

            html += '<div class="section-title">Dependency Traceability</div>';
            html += '<div class="flow-matrix-wrap">';
            html += '<table class="flow-matrix">';
            html += '<thead>';
            html += '<tr><th class="flow-dependency-col"></th>';
            (flow.steps || []).forEach((step, index) => {
                html += '<th class="flow-step-col"><div class="flow-step-label">Step ' + (index + 1) + '</div><div class="card-title">' + escapeHtml(step.title || step.id) + '</div></th>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right">Key Facts</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkblue">';
                if ((step.keyFacts || []).length) {
                    html += '<ul class="flow-insight-list">' + step.keyFacts.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No key facts listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right; color: darkred">Pain Points</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkred">';
                if ((step.painPoints || []).length) {
                    html += '<ul class="flow-insight-list">' + step.painPoints.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No pain points listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';
            html += '</thead><tbody>';

            dependenciesInFlow.forEach(dependency => {
                const dependencyTypeLabel = 'Product Brick';
                html += '<tr>';
                html += '<td>';
                html += '<div class="flow-dependency-header">';
                html += renderFlowDependencyIcon(dependency, 'flow-dependency-icon');
                html += '<div>';
                html += '<a class="flow-dependency-name" href="../landing_pages/' + escapeHtml(dependency.id) + '.html">' + escapeHtml(dependency.name || dependency.id) + '</a>';
                if (dependency.interface) {
                    html += '<div class="muted">' + escapeHtml(dependency.interface) + '</div>';
                }
                html += '</div>';
                html += '</div>';
                html += '</td>';
                (flow.steps || []).forEach(step => {
                    const stepDependency = getStepDependency(step, dependency);
                    if (!stepDependency) {
                        html += '<td class="flow-cell-empty">-</td>';
                        return;
                    }
                    html += '<td class="flow-cell-active">';
                    html += '<div class="flow-cell-copy">' + escapeHtml(simplifySupportCopy(stepDependency.how || stepDependency.description || 'Supports this step.')) + '</div>';
                    html += '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            html += '</div>';
            html += '</div>';
        });

        document.getElementById('tab_content_flows').innerHTML = html;
    }

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';
        }
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-title">' + escapeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                count++;
                html += '<div class="link-entry">';
                html += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(link.link || '#') + '">'
                    + escapeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>


<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Paramedical and Mental Health Practice Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Streams Index"
    },
    {
      "label": "Schedule Appointments and Online Booking"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
