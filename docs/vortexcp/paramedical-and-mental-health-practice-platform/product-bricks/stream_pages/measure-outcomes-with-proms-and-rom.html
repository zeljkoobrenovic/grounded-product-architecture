    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

rk.", "steps": [{"id": "configure-instruments-per-care-pathway", "title": "Configure the instruments and measurement moments per care pathway", "actor": "Physiotherapy Practice Owner", "keyFacts": ["The owner picks from the instrument library the PROMs (for example PSK and NPRS for musculoskeletal complaints) and clinical tests that each pathway uses, and sets the moments: at intake, at an interim point and at closing.", "The LDF minimum data set and the insurer contract conditions define which instruments are mandatory for which diagnosis groups, so the configuration starts from those requirements rather than from personal preference."], "painPoints": ["Therapists in the same practice measure with different instruments, and the practice cannot aggregate its results."], "dependencies": [{"type": "brick", "id": "meas", "name": "Measurement Instruments and PROMs", "description": "Instrument configuration.", "how": "Binds instruments and moments to the care pathways of the practice."}, {"type": "brick", "id": "qlib", "name": "Questionnaire and Intervention Library (Embloom)", "description": "Instrument library.", "how": "Supplies the licensed questionnaires and their scoring rules."}]}, {"id": "offer-the-questionnaire-to-the-patient-in-the-app", "title": "Offer the questionnaire to the patient in the app at the planned moment", "actor": "Patient and Client", "keyFacts": ["The pathway triggers the questionnaire before the intake and at the interim and end moments; the patient receives a push notification and fills it on the phone, or on a tablet in the waiting room when the app is not used.", "Reminders and a visible 'to do' in the app raise the response rate; the therapist sees in the agenda whether the questionnaire was completed before the consult."], "painPoints": ["Questionnaires sent by e-mail with a generic link are ignored, and the therapist fills the score from memory during the consult.", "Elderly patients without the app skip the digital measurement and the practice's outcome data over-represents younger patients."], "dependencies": [{"type": "brick", "id": "pgoa", "name": "Patient App and Web Portal", "description": "Questionnaire in the app.", "how": "Presents the questionnaire and the reminder to the patient in the app."}, {"type": "brick", "id": "meas", "name": "Measurement Instruments and PROMs", "description": "Questionnaire dispatch.", "how": "Triggers the questionnaire at the planned moment and records the response."}]}, {"id": "record-clinical-measurements-in-the-consult", "title": "Record clinical measurements in the consult", "actor": "Allied Health Therapist", "keyFacts": ["Range of motion, strength, balance, walking or swallowing tests are recorded in structured fields with normal values and previous scores next to them, so that the therapist sees progress at the moment of measuring.", "Dietitians and speech therapists use their own instruments (weight and body composition, speech and language tests), configured per discipline in HCI One."], "painPoints": ["Scores written in the free-text note cannot be trended or delivered to a register."], "dependencies": [{"type": "brick", "id": "meas", "name": "Measurement Instruments and PROMs", "description": "Structured measurement.", "how": "Stores the clinical measurement with reference values and trend."}, {"type": "brick", "id": "dosr", "name": "Patient Dossier and Care Pathways", "description": "Episode context.", "how": "Places the measurement in the episode next to the plan and notes."}]}, {"id": "show-score-trends-in-the-episode", "title": "Show score trends in the episode and discuss them with the patient", "actor": "Physiotherapy Practice Owner", "keyFacts": ["The episode shows the PROM and clinical scores as a trend against the goals, and the therapist shares the trend with the patient in the app, which supports the decision to continue or close and makes progress visible to the patient.", "A minimal clinically important difference per instrument is shown so that a change is interpreted correctly."], "painPoints": ["Scores that are collected but never discussed make patients experience questionnaires as administration for the insurer."], "dependencies": [{"type": "brick", "id": "meas", "name": "Measurement Instruments and PROMs", "description": "Score trend.", "how": "Computes and presents the score trend per instrument."}, {"type": "brick", "id": "pgoa", "name": "Patient App and Web Portal", "description": "Trend for the patient.", "how": "Shows the patient's own progress in the app."}]}, {"id": "aggregate-outcomes-on-the-practice-dashboard", "title": "Aggregate outcomes on the practice dashboard and compare with the benchmark", "actor": "Physiotherapy Practice Owner", "keyFacts": ["The dashboard shows response rates, average change per diagnosis group and per therapist, and the number of episodes with complete measurement series, next to the benchmark returned by the register or the patient-experience provider.", "The owner uses the view in insurer contract conversations and in the practice's own quality meetings; individual therapists see their own results."], "painPoints": ["Comparing therapists on raw outcome averages without case mix creates the wrong discussion in the team meeting."], "dependencies": [{"type": "brick", "id": "bidb", "name": "Practice BI Dashboards and Reporting", "description": "Outcome dashboard.", "how": "Aggregates outcome and response-rate indicators per practice, therapist and diagnosis group."}, {"type": "brick", "id": "qdat", "name": "Quality Data Delivery (LDF, Keurmerk, Benchmarks)", "description": "Benchmark results.", "how": "Imports the benchmark returned by the register or survey provider."}]}]}, {"id": "from-rom-in-ggz-to-monthly-quality-data-delivery", "title": "From ROM in GGZ Treatment to Monthly Quality Data Delivery", "description": "A GGZ institution's application manager orchestrates ROM questionnaires in CRS across intake, interim and end moments with Embloom instruments, clients complete them in the client portal, practitioners use the results in treatment evaluation, and the institution and the paramedical practices deliver the monthly pseudonymised extract to the LDF and other registers under recorded consent.", "primaryActor": "GGZ Institution Application Manager", "trigger": "The institution's quality policy or a financier contract requires ROM, or the monthly delivery deadline for the register approaches.", "successSignal": "ROM is scheduled and completed for the required share of trajectories, results are visible to practitioners, and the monthly delivery is generated, pseudonymised, consent-filtered and accepted by the register.", "steps": [{"id": "define-the-rom-protocol-per-care-programme", "title": "Define the ROM protocol per care programme", "actor": "GGZ Institution Application Manager", "keyFacts": ["For each care programme (for example depression, anxiety, youth care) the manager sets which instruments are offered at intake, interim and end, and who receives the results; the institution can add its own questionnaires next to the Embloom library.", "Protocols are versioned so that trajectories that started under an older protocol keep their series intact."], "painPoints": ["Practitioners who choose instruments ad hoc produce series that cannot be compared within the institution."], "dependencies": [{"type": "brick", "id": "romq", "name": "ROM and Questionnaire Orchestration for GGZ", "description": "ROM protocol.", "how": "Defines instruments, moments and recipients per care programme."}, {"type": "brick", "id": "qlib", "name": "Questionnaire and Intervention Library (Embloom)", "description": "Questionnaire library.", "how": "Supplies the licensed ROM instruments and scoring."}]}, {"id": "orchestrate-questionnaires-in-the-trajectory", "title": "Orchestrate the questionnaires in the treatment trajectory", "actor": "Independent GGZ Practitioner", "keyFacts": ["The trajectory triggers the questionnaire at the protocol moments; the practitioner can add an extra measurement before an evaluation session or a multidisciplinary meeting.", "Reminders and the status per client are visible in the practitioner's worklist, so that missing ROM is caught before the evaluation instead of after closing."], "painPoints": ["Manual sending of questionnaires from a separate ROM tool is the first task to drop when the practitioner's caseload is full."], "dependencies": [{"type": "brick", "id": "romq", "name": "ROM and Questionnaire Orchestration for GGZ", "description": "Questionnaire orchestration.", "how": "Sends and tracks questionnaires per trajectory and moment."}, {"type": "brick", "id": "dosr", "name": "Patient Dossier and Care Pathways", "description": "Trajectory status.", "how": "Shows the ROM status in the client's dossier and the practitioner's worklist."}]}, {"id": "complete-the-questionnaire-in-the-client-portal", "title": "Complete the questionnaire in the client portal or app", "actor": "Patient and Client", "keyFacts": ["The client fills the questionnaire in the CRS client portal, in the Quli environment or on a tablet at the location; answers are scored immediately and stored in the dossier.", "Youth and family questionnaires can be assigned to a parent or carer with their own login."], "painPoints": ["Clients who receive questionnaires from an e-health platform, a ROM tool and the EPD separately lose track of what they still have to fill in."], "dependencies": [{"type": "brick", "id": "cpor", "name": "GGZ Client Portal", "description": "Client questionnaire.", "how": "Presents the questionnaire to the client or carer in the portal."}, {"type": "brick", "id": "romq", "name": "ROM and Questionnaire Orchestration for GGZ", "description": "Scoring and storage.", "how": "Scores the answers and stores the result in the trajectory."}]}, {"id": "use-the-results-in-treatment-evaluation", "title": "Use the results in treatment evaluation and multidisciplinary review", "actor": "Independent GGZ Practitioner", "keyFacts": ["The score trend is shown next to the treatment plan goals in the evaluation session and in the multidisciplinary review, and the evaluation note records how the outcome influenced the plan.", "Aggregated results per practitioner and programme feed the institution's reporting."], "painPoints": ["ROM used only for the register and not in the treatment conversation is experienced by practitioners as administrative burden."], "dependencies": [{"type": "brick", "id": "romq", "name": "ROM and Questionnaire Orchestration for GGZ", "description": "Result presentation.", "how": "Shows the ROM trend in the evaluation context."}, {"type": "brick", "id": "dosr", "name": "Patient Dossier and Care Pathways", "description": "Evaluation note.", "how": "Records the evaluation and its plan consequences in the dossier."}, {"type": "brick", "id": "bidb", "name": "Practice BI Dashboards and Reporting", "description": "Aggregated results.", "how": "Reports ROM completion and outcomes per practitioner and programme."}]}, {"id": "record-consent-and-build-the-monthly-extract", "title": "Record consent and build the monthly pseudonymised extract", "actor": "GGZ Institution Application Manager", "keyFacts": ["Register delivery is opt-in: the consent recorded in the dossier decides whether a patient's episode is included, and the extract contains pseudonymised identifiers instead of BSN or name.", "For paramedical practices the extract follows the LDF specification and is generated monthly from the EPD; the Keurmerk register requires the delivery for practice registration.", "Every extract run is logged with its filter criteria and record counts for accountability under the AVG."], "painPoints": ["Practices that record consent on paper cannot prove which episodes were allowed in the extract.", "Extracts built by hand from exports miss the monthly deadline and are rejected on format errors."], "dependencies": [{"type": "brick", "id": "qdat", "name": "Quality Data Delivery (LDF, Keurmerk, Benchmarks)", "description": "Extract generation.", "how": "Builds the pseudonymised, consent-filtered extract in the register format."}, {"type": "brick", "id": "audt", "name": "Audit Log, Consent and Information Security", "description": "Consent and run log.", "how": "Provides the consent status and logs the extract run."}]}, {"id": "deliver-to-the-register-and-handle-feedback", "title": "Deliver to the register and handle the feedback report", "actor": "Physiotherapy Practice Owner", "keyFacts": ["The extract is delivered through the register's channel; the acceptance or rejection report is shown in the practice system, and rejected records are corrected in the dossier and re-delivered in the next month.", "The register's benchmark feedback is imported back so that the practice sees its position without leaving the system."], "painPoints": ["Rejection reports that arrive by e-mail to the practice owner are not linked to the episodes they concern."], "dependencies": [{"type": "brick", "id": "qdat", "name": "Quality Data Delivery (LDF, Keurmerk, Benchmarks)", "description": "Delivery and feedback.", "how": "Delivers the extract and imports the acceptance and benchmark feedback."}, {"type": "brick", "id": "bidb", "name": "Practice BI Dashboards and Reporting", "description": "Delivery status.", "how": "Shows delivery completeness and benchmark position on the dashboard."}]}]}], "outcomes": ["Patients receive the right questionnaire at the right moment in the app and the score lands in the episode without retyping", "Therapists and GGZ practitioners see score trends per patient and per caseload and use them in the treatment conversation", "The monthly LDF and Keurmerk delivery is complete, pseudonymised and covered by recorded opt-in consent", "Practices can compare their outcomes with the benchmark and answer insurer quality questions from the dashboard"], "brickDependencies": [{"targetBrickId": "meas", "type": "composition"}, {"targetBrickId": "romq", "type": "composition"}, {"targetBrickId": "qdat", "type": "composition"}, {"targetBrickId": "audt", "type": "composition"}, {"targetBrickId": "dosr", "type": "composition"}, {"targetBrickId": "bidb", "type": "composition"}, {"targetBrickId": "qlib", "type": "composition"}, {"targetBrickId": "pgoa", "type": "composition"}, {"targetBrickId": "cpor", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "Landelijke Database Fysiotherapie (LDF) and the Keurmerk Fysiotherapie register", "type": "quality-register", "interface": "Monthly pseudonymised data delivery", "description": "Receive the monthly pseudonymised episode and outcome data from the EPD; Keurmerk practice registration requires the delivery, and patient consent is opt-in."}, {"system": "Benchmark and patient-experience providers (Qualiview, MediQuest)", "type": "quality-register", "interface": "Patient-experience survey and benchmark exports", "description": "Send patient-experience surveys (PREM) after treatment and return benchmark results that practices need for insurer contracts."}, {"system": "Questionnaire licensors and instrument owners", "type": "content-provider", "interface": "Licensed questionnaires and scoring rules", "description": "Own the copyrighted PROMs and ROM instruments whose licence terms and scoring algorithms the library must respect."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []};
    const related_bricks = [{"id": "meas", "name": "Measurement Instruments and PROMs", "type": "full-stack", "status": "sustaining", "description": "The measurement layer of the paramedical dossier: clinimetric instruments (PSK, NPRS, QBPDS, SPADI, 6MWT and the many discipline-specific scales), patient-reported outcome measures sent to patients before and after treatment and scored automatically, and the norm values and minimal clinically important differences that make results interpretable. Results live on the episode timeline, feed the evaluation steps of the care pathway and are the basis for the outcome data that the LDF, insurer quality conditions and practice benchmarks require. Speech therapists, dietitians and exercise therapists get their own instrument sets from the same engine.", "links": [{"group": "Evidence", "description": "Real-world evidence related to this product brick.", "links": [{"label": "Evidence Explorer", "link": "../../../../evidence-explorer/index.html", "description": "Search evidence \u2014 source repositories, cloud resources, and contacts. Refine with ?q=<query> to pre-filter for this product brick.", "embedLink": "../../../../evidence-explorer/index.html?embed=1"}]}], "layers": [{"layer": "ui", "description": "User-facing web, mobile, backoffice, and operator experience modules.", "modules": [{"id": "module-meas-web", "name": "Measurement and PROM Workspace", "type": "web-component", "description": "Instrument picker per pathway step, score entry for therapist-administered tests, PROM invitation and status, result graphs over the episode with norm bands and change since baseline.", "dependencies": {"modules": [{"moduleId": "module-meas-api", "type": "uses", "description": "Workspace reads and records measurements through the Measurement API."}]}}]}, {"layer": "interfaces", "description": "APIs, BFFs, and explicit service boundary interfaces exposed to clients or other systems.", "modules": [{"id": "module-meas-api", "name": "Measurement API", "type": "api", "description": "API to list instruments per discipline and step, record scores, send and collect PROMs, retrieve results and norms per episode; used by the dossier, quality data delivery, dashboards, ROM orchestration and partner apps.", "dependencies": {"modules": [{"moduleId": "module-meas-scoring", "type": "delegates", "description": "Interface delegates scoring and norm interpretation to the Scoring Service."}, {"moduleId": "module-meas-store", "type": "delegates", "description": "Interface delegates persistence to the Measurement Store."}]}}]}, {"layer": "worker", "description": "Background workers, event consumers, daemons, and asynchronous processing modules.", "modules": [{"id": "module-meas-invite-worker", "name": "PROM Invitation Worker", "type": "message-consumer", "description": "Consumes pathway step and appointment events, sends PROM invitations through the patient app, e-mail or SMS at the configured moments, reminds non-responders and ingests completed questionnaires.", "dependencies": {"modules": [{"moduleId": "module-meas-store", "type": "processes", "description": "Worker records invitations, reminders and completed responses."}]}}]}, {"layer": "stateless-service", "description": "Stateless orchestration services that aggregate other services without owning durable state.", "modules": [{"id": "module-meas-scoring", "name": "Scoring and Norm Service", "type": "stateless-service", "description": "Scores questionnaires and tests using the instrument definitions, applies norm tables by age and sex, computes change scores and MCID flags and prepares outcome summaries per episode.", "dependencies": {"modules": [{"moduleId": "module-meas-store", "type": "uses", "description": "Scoring reads raw responses and writes computed results."}]}}]}, {"layer": "service", "description": "Stateful services and domain service modules that own behavior, policy, workflow, data, or operations.", "modules": [{"id": "module-meas-store", "name": " ough the ROM API."}]}}]}, {"layer": "interfaces", "description": "APIs, BFFs, and explicit service boundary interfaces exposed to clients or other systems.", "modules": [{"id": "module-romq-api", "name": "ROM API", "type": "api", "description": "API for ROM protocols, measurement moments, questionnaire dispatch and results per client and treatment; used by the treatment plan, the client portal, blended care programmes and institution reporting.", "dependencies": {"modules": [{"moduleId": "module-romq-orchestrator", "type": "delegates", "description": "Interface delegates dispatch and scoring coordination to the ROM Orchestrator."}, {"moduleId": "module-romq-store", "type": "delegates", "description": "Interface delegates persistence to the ROM Store."}]}}]}, {"layer": "worker", "description": "Background workers, event consumers, daemons, and asynchronous processing modules.", "modules": [{"id": "module-romq-schedule-daemon", "name": "Measurement Moment Scheduler", "type": "daemon", "description": "Scheduled job that derives due measurement moments from treatment plan phases and protocols, dispatches questionnaires, sends reminders to non-responders and marks overdue moments for the practitioner.", "dependencies": {"modules": [{"moduleId": "module-romq-orchestrator", "type": "uses", "description": "Scheduler dispatches and reminds through the orchestrator."}, {"moduleId": "module-romq-store", "type": "processes", "description": "Scheduler reads protocols and updates measurement moment status."}]}}]}, {"layer": "stateless-service", "description": "Stateless orchestration services that aggregate other services without owning durable state.", "modules": [{"id": "module-romq-orchestrator", "name": "ROM Orchestrator", "type": "stateless-service", "description": "Coordinates a measurement: resolves the questionnaire definition, creates the client invitation in the portal or Bergop, collects the completed response, scores it through the measurement engine and links the result to the plan phase.", "dependencies": {"modules": [{"moduleId": "module-romq-store", "type": "uses", "description": "Orchestrator reads protocols and records dispatch state."}, {"moduleId": "module-romq-bergop-adapter", "type": "uses", "description": "Orchestrator dispatches youth care instruments through the Bergop adapter."}]}}]}, {"layer": "service", "description": "Stateful services and domain service modules that own behavior, policy, workflow, data, or operations.", "modules": [{"id": "module-romq-store", "name": "ROM Store", "type": "stateful-service", "description": "Owns ROM protocols per treatment type, measurement moments with status, dispatch records and links between responses and treatment plan phases per tenant."}]}, {"layer": "integration", "description": "Connectors, adapters, and integration modules for external systems, devices, or partner platforms.", "modules": [{"id": "module-romq-bergop-adapter", "name": "Bergop Adapter", "type": "integration", "description": "Adapter to Bergop for youth care questionnaires and outcome monitoring, exchanging client invitations and completed results.", "dependencies": {"modules": [{"moduleId": "module-romq-store", "type": "uses", "description": "Adapter reads dispatch requests and writes returned results."}]}}]}], "dataDependencies": [{"assetId": "measurement-result", "moduleIds": ["module-romq-orchestrator"], "role": "write", "description": "Writes scored ROM responses as measurement results linked to the treatment plan phase."}, {"assetId": "questionnaire-definition", "moduleIds": ["module-romq-orchestrator", "module-romq-store"], "role": "read", "description": "Reads questionnaire definitions and scoring rules for ROM instruments."}], "brickDependencies": [{"targetBrickId": "qlib", "moduleId": "module-qlib-api", "sourceModuleId": "module-romq-orchestrator", "type": "master-data", "description": "Reads Embloom questionnaire definitions and scoring rules and renders questionnaires for clients."}, {"targetBr     mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        flowchart: {
            htmlLabels: false
        }
    });

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

    function getFlows() {
        return currentStream.flows || [];
    }

    function getFlowDependencies(flow) {
        const dependencyIndex = new Map();
        (flow.steps || []).forEach(step => {
            (step.dependencies || []).forEach(dependency => {
                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());
    }

    function getStepDependency(step, dependency) {
        return (step.dependencies || []).find(item => (item.type || '') === (dependency.type || '') && (item.id || '') === (dependency.id || '')) || null;
    }

    function getPrimaryActors() {
        const streamJobs = currentStream.supportedCustomerJobs || [];
        const allJobs = streamJobs.length ? streamJobs : supported_jobs;
        return dedupe(allJobs.map(item => item.customerName || item.customerGroup || '').filter(Boolean), item => item);
    }

    function summarizeFlow(flow) {
        const steps = flow.steps || [];
        const firstStep = steps[0] || {};
        const lastStep = steps[steps.length - 1] || {};
        return {
            actor: flow.primaryActor || firstStep.actor || '',
            trigger: flow.trigger || firstStep.trigger || '',
            result: flow.successSignal || flow.outcome || lastStep.successSignal || lastStep.output || ''
        };
    }

    function renderStepMeta(label, value) {
        if (!value) {
            return '';
        }
        return '<div class="flow-step-meta-item"><div class="flow-step-meta-label">' + escapeHtml(label) + '</div><div class="flow-step-copy">' + escapeHtml(value) + '</div></div>';
    }

    function flowDependencyIconFile(dependency) {
        const dependencyId = dependency.id || '';
        const linkedBrick = related_bricks.find(brick => brick.id === dependencyId) || all_bricks.find(brick => brick.id === dependencyId) || {};
        return dependency.icon || linkedBrick.icon || (dependencyId ? dependencyId + '.png' : 'brick.png');
    }

    function renderFlowDependencyIcon(dependency, className) {
        return '<img class="' + escapeHtml(className) + '" src="../icons/' + escapeHtml(flowDependencyIconFile(dependency)) + '" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
    }

    function renderStepDependencyPills(step) {
        const dependencies = step.dependencies || [];
        if (!dependencies.length) {
            return '<div class="muted">No step-specific dependencies listed.</div>';
        }

        return '<div class="flow-step-dependencies">' + dependencies.map(dep => {
            const label = dep.name || dep.id || 'Dependency';
            const kind = 'Brick';
            return '<span class="flow-cell-brick">' + renderFlowDependencyIcon(dep, 'flow-cell-brick-icon') + '<span>' + escapeHtml(kind + ': ' + label) + '</span></span>';
        }).join('') + '</div>';
    }

    function simplifySupportCopy(value) {
        const text = String(value || '').trim();
        if (!text) {
            return '';
        }
        const simplified = text.replace(/^Supports .*? by helping users help /i, 'Facilitate ');
        return simplified;
    }
</script>

<script>
    function streamMetaPath(stream) {
        const parts = [];
        if (stream.group) {
            parts.push(stream.group);
        }
        if (stream.rootGroup && stream.rootGroup !== stream.group) {
            parts.push(stream.rootGroup);
        }
        if (!parts.length) {
            parts.push('Stream');
        }
        return parts.join(' / ');
    }

    let headerHtml = '<div class="nav-strip">';
    allStreams.forEach(item => {
        headerHtml += '<a class="nav-link" href="' + escapeHtml(item.id) + '.html">';
        headerHtml += '<img src="../icons/' + escapeHtml(item.icon || 'stream.png') + '" class="' + (item.id === currentStream.id ? 'tab-image-selected' : 'tab-image') + '" alt="" onerror="this.onerror=null;this.src=\'../icons/stream.png\'">';
        headerHtml += '</a>';
    });
    headerHtml += '</div>';

    headerHtml += '<div class="page">';
    headerHtml += '<div class="header">';
    headerHtml += '<img class="header-icon" src="../icons/' + escapeHtml(currentStream.icon || 'stream.png') + '" alt="" onerror="this.onerror=null;this.src=\'../icons/stream.png\'">';
    headerHtml += '<div>';
    headerHtml += '<div class="header-meta">';
    headerHtml += '<div class="page-type-badge">Stream</div>';
    headerHtml += escapeHtml(streamMetaPath(currentStream)) + ' / <span style="color:blue;font-weight:bold;">' + escapeHtml((currentStream.id || '').toUpperCase()) + '</span></div>';
    headerHtml += '<div class="header-title">' + escapeHtml(currentStream.name || currentStream.id) + '</div>';
    headerHtml += '<div class="header-copy">' + escapeHtml(currentStream.description || '') + '</div>';
    headerHtml += '</div></div></div>';
    document.getElementById('Header').innerHTML = headerHtml;

    function renderHome() {
        const flows = getFlows();
        const totalSteps = flows.reduce((count, flow) => count + ((flow.steps || []).length), 0);
        const primaryActors = getPrimaryActors();
        let html = '';

        html += '<div class="group"><div class="section-title">Flow Narratives (' + flows.length + ')</div>';
        if (!flows.length) {
            html += '<div class="muted">No flows listed for this stream.</div>';
        } else {
            html += '<div class="card-grid">';
            flows.forEach(flow => {
                const summary = summarizeFlow(flow);
                html += '<div class="card">';
                html += '<div class="card-meta">' + escapeHtml(streamMetaPath(currentStream)) + '</div>';
                html += '<div class="card-title">' + escapeHtml(flow.title || flow.id) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(flow.description || '') + '</div>';
                html += '<div class="muted">' + ((flow.steps || []).length) + ' steps</div>';
                if (summary.actor) {
                    html += '<div class="card-copy"><strong>Actor:</strong> ' + escapeHtml(summary.actor) + '</div>';
                }
                if (summary.trigger) {
                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Outcomes</div>';
        if (!(currentStream.outcomes || []).length) {
            html += '<div class="muted">No outcomes listed for this stream.</div>';
        } else {
            html += '<div class="card"><ul class="list">' + currentStream.outcomes.map(outcome => '<li>' + escapeHtml(outcome) + '</li>').join('') + '</ul></div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Supporting Product Bricks</div>';
        if (!related_bricks.length) {
            html += '<div class="muted">No linked product bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            related_bricks.forEach(brick => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../landing_pages/' + escapeHtml(brick.id) + '.html">';
                html += '<div class="card-meta">' + escapeHtml((brick.group || brick.domain || 'Product Brick')) + '</div>';
                html += '<div class="card-header">';
                html += '<img class="card-icon" src="../icons/' + escapeHtml(brick.id) + '.png" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
                html += '<div class="card-title">' + escapeHtml(brick.name || brick.id) + '</div>';
                html += '</div>';
                html += '<div class="card-copy">' + escapeHtml(brick.description || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Linked Products</div>';
        if (!linked_products.length) {
            html += '<div class="muted">No linked products were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            linked_products.forEach(product => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../../product-deployments/landing_pages/' + escapeHtml(product.id) + '.html">';
                html += '<div class="card-meta">' + escapeHtml(product.type || 'Product') + '</div>';
                html += '<div class="card-header">';
                html += '<img class="card-icon" src="../../product-deployments/icons/' + escapeHtml(product.icon) + '" alt="" onerror="this.onerror=null;this.src=\'../../product-deployments/icons/product.png\'">';
                html += '<div class="card-title">' + escapeHtml(product.name || product.id) + '</div>';
                html += '</div>';
                html += '<div class="card-copy">' + escapeHtml(product.whyUsed || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Related Teams</div>';
        if (!related_teams.length) {
            html += '<div class="muted">No teams were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            related_teams.forEach(team => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../../teams/landing_pages/' + escapeHtml(team.teamId) + '.html">';
                html += '<div class="card-meta">' + escapeHtml(team.roleLabel || team.teamType || 'Team') + '</div>';
                html += '<div class="card-title">' + escapeHtml(team.teamName || team.teamId) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(team.groupName || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Supported Customer Jobs</div>';
        if (!supported_jobs.length) {
            html += '<div class="muted">No customer jobs were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            supported_jobs.forEach(job => {
                html += '<div class="card">';
                html += '<div class="card-meta">' + escapeHtml(job.customerGroup || '') + (job.productName ? ' | ' + escapeHtml(job.productName) : '') + '</div>';
                html += '<div class="card-title">' + escapeHtml(job.jobName || job.jobId) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(job.jobOutcome || job.jobWhatItIs || '') + '</div>';
                if (job.supportRationale) {
                    html += '<div class="card-copy"><strong>Why this stream matters here:</strong> ' + escapeHtml(job.supportRationale) + '</div>';
                }
                if ((job.usedInSteps || []).length) {
                    html += '<ul class="list">' + job.usedInSteps.map(step => '<li>' + escapeHtml(step.step || step.description || '') + '</li>').join('') + '</ul>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        html += '</div>';

        document.getElementById('tab_content_home').innerHTML = html;
    }

    function renderFlows() {
        const flows = getFlows();
        const totalSteps = flows.reduce((count, flow) => count + ((flow.steps || []).length), 0);
        let html = '';

        document.getElementById('tab_flows').innerHTML = 'Flow Narratives (' + flows.length + ')';

        flows.forEach(flow => {
            const dependenciesInFlow = getFlowDependencies(flow);
            const summary = summarizeFlow(flow);
            html += '<div class="group">';
            html += '<div class="section-title">Flow</div>';
            html += '<div class="flow-title">' + escapeHtml(flow.title || flow.id) + '</div>';
            html += '<div class="flow-description">' + escapeHtml(flow.description || '') + '</div>';
            if (summary.actor || summary.trigger || summary.result) {
                html += '<div class="card" style="margin-bottom:16px;">';
                if (summary.actor) {
                    html += '<div class="card-copy"><strong>Primary actor:</strong> ' + escapeHtml(summary.actor) + '</div>';
                }
                if (summary.trigger) {
                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';
                }
                html += '</div>';
            }

            html += '<div class="section-title">Dependency Traceability</div>';
            html += '<div class="flow-matrix-wrap">';
            html += '<table class="flow-matrix">';
            html += '<thead>';
            html += '<tr><th class="flow-dependency-col"></th>';
            (flow.steps || []).forEach((step, index) => {
                html += '<th class="flow-step-col"><div class="flow-step-label">Step ' + (index + 1) + '</div><div class="card-title">' + escapeHtml(step.title || step.id) + '</div></th>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right">Key Facts</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkblue">';
                if ((step.keyFacts || []).length) {
                    html += '<ul class="flow-insight-list">' + step.keyFacts.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No key facts listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right; color: darkred">Pain Points</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkred">';
                if ((step.painPoints || []).length) {
                    html += '<ul class="flow-insight-list">' + step.painPoints.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No pain points listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';
            html += '</thead><tbody>';

            dependenciesInFlow.forEach(dependency => {
                const dependencyTypeLabel = 'Product Brick';
                html += '<tr>';
                html += '<td>';
                html += '<div class="flow-dependency-header">';
                html += renderFlowDependencyIcon(dependency, 'flow-dependency-icon');
                html += '<div>';
                html += '<a class="flow-dependency-name" href="../landing_pages/' + escapeHtml(dependency.id) + '.html">' + escapeHtml(dependency.name || dependency.id) + '</a>';
                if (dependency.interface) {
                    html += '<div class="muted">' + escapeHtml(dependency.interface) + '</div>';
                }
                html += '</div>';
                html += '</div>';
                html += '</td>';
                (flow.steps || []).forEach(step => {
                    const stepDependency = getStepDependency(step, dependency);
                    if (!stepDependency) {
                        html += '<td class="flow-cell-empty">-</td>';
                        return;
                    }
                    html += '<td class="flow-cell-active">';
                    html += '<div class="flow-cell-copy">' + escapeHtml(simplifySupportCopy(stepDependency.how || stepDependency.description || 'Supports this step.')) + '</div>';
                    html += '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            html += '</div>';
            html += '</div>';
        });

        document.getElementById('tab_content_flows').innerHTML = html;
    }

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';
        }
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-title">' + escapeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                count++;
                html += '<div class="link-entry">';
                html += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(link.link || '#') + '">'
                    + escapeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>


<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Paramedical and Mental Health Practice Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Streams Index"
    },
    {
      "label": "Measure Outcomes with PROMs and ROM"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
