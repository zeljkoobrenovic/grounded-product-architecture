    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

o-environment", "title": "Log in with DigiD and choose the PGO environment", "actor": "Patient and Client", "keyFacts": ["The citizen logs in with DigiD at the required level; Quli carries the MedMij PGO label, one of 16 labelled PGOs in November 2025, and the label is what allows it to retrieve data from care providers under the framework; Uw Zorg Online connects through the same MedMij services and HCI won a MedMij PGO tender for it.", "The environment explains in plain language what the PGO is, what it can retrieve and that the citizen stays in control."], "painPoints": ["Citizens confuse the care provider's portal with their own PGO and do not understand why data must be retrieved."], "dependencies": [{"type": "brick", "id": "iden", "name": "Identity, Access and Strong Authentication (UZI/DigiD)", "description": "DigiD login.", "how": "Authenticates the citizen at the MedMij assurance level."}, {"type": "brick", "id": "pgoa", "name": "Patient App and Web Portal", "description": "PGO home.", "how": "Presents the environment and its explanation after login."}]}, {"id": "select-care-providers-and-give-consent", "title": "Select care providers and give consent per data service", "actor": "Patient and Client", "keyFacts": ["The citizen finds their GP, pharmacy, hospital or GGZ institution in the MedMij participant register and gives consent per data service (for example GP data, medication, lab results); each consent is recorded with date and scope.", "Consent can be withdrawn at any time and the withdrawal stops future retrieval; data already retrieved stays in the citizen's environment."], "painPoints": ["Providers that are not yet MedMij-connected (most paramedical practices) cannot be added, which citizens experience as the PGO being incomplete."], "dependencies": [{"type": "brick", "id": "pgom", "name": "MedMij Data Exchange and Consent", "description": "Consent and participant register.", "how": "Looks up connected providers and records consent per data service."}, {"type": "brick", "id": "audt", "name": "Audit Log, Consent and Information Security", "description": "Consent trail.", "how": "Logs the consent and withdrawal events."}]}, {"id": "retrieve-data-through-medmij-services", "title": "Retrieve data through the MedMij data services", "actor": "Patient and Client", "keyFacts": ["The PGO retrieves the data from each provider's DVZA service under the consent, maps it to the MedMij information standards and shows it in readable sections: GP journal entries, medication, allergies, lab results, letters, GGZ treatment information.", "Retrieval is repeatable, so the environment is refreshed when the citizen asks or on a schedule they set."], "painPoints": ["A retrieval that fails on one provider's side shows an error the citizen cannot act on."], "dependencies": [{"type": "brick", "id": "pgom", "name": "MedMij Data Exchange and Consent", "description": "Data retrieval.", "how": "Runs the MedMij retrieval per data service and maps the data."}, {"type": "brick", "id": "hisc", "name": "HIS/AIS and Hospital System Connectors", "description": "Provider-side data.", "how": "Where HCI operates the provider connection, exposes the practice data through the connector."}]}, {"id": "add-self-measurements-and-a-diary", "title": "Add self-measurements and a diary", "actor": "Patient and Client", "keyFacts": ["The citizen records blood pressure, weight, mood, pain or activity by hand or from a device and keeps a diary; entries are shown on a timeline next to professional data.", "A treating professional can ask the citizen to share a measurement series for a period, for example blood pressure before a GP consult."], "painPoints": ["Measurements kept in a device app that does not connect to the environment stay invisible to the professional."], "dependencies": [{"type": "brick", "id": "diar", "name": "Self-measurements and Diaries", "description": "Measurements and diary.", "how": "Stores self-measurements and diary entries on the timeline."}, {"type": "brick", "id": "pgoa", "name": "Patient App and Web Portal", "description": "Timeline view.", "how": "Shows self-measurements next to retrieved professional data."}]}, {"id": "review-who-accessed-the-environment", "title": "Review who accessed the environment and adjust consents", "actor": "Patient and Client", "keyFacts": ["The citizen sees every retrieval, every share and every access by a family member or professional with date and scope, and adjusts or withdraws consents from the same screen.", "The same overview is the basis for a complaint or a question to the care provider, because it shows the legal basis (consent, treatment relationship, emergency) of each access."], "painPoints": ["Access overviews written in technical terms do not tell the citizen who actually looked."], "dependencies": [{"type": "brick", "id": "audt", "name": "Audit Log, Consent and Information Security", "description": "Access overview.", "how": "Provides the readable access and consent history."}, {"type": "brick", "id": "pgom", "name": "MedMij Data Exchange and Consent", "description": "Consent management.", "how": "Applies consent changes and withdrawals."}]}]}, {"id": "from-a-family-share-to-network-care", "title": "From a Family Share to Network Care around the Person", "description": "A GGZ client or a person recovering after intensive care shares parts of the Quli environment with a partner or parent, invites the treating team and an informal carer into a care network, exchanges secure messages and video with the network, and uses the GGZ app guide and single login for e-health apps, while a GGZ institution's application manager rolls Quli out to its teams.", "primaryActor": "Patient and Client", "trigger": "The person wants a family member or carer to follow their care, or the institution offers Quli as the client environment.", "successSignal": "The network members see only what was shared, messages and video contact run within the environment, e-health apps open with one login, and the institution's teams work with the client's environment.", "steps": [{"id": "share-parts-of-the-environment-with-family", "title": "Share parts of the environment with a partner or parent", "actor": "Patient and Client", "keyFacts": ["The person chooses which sections (agenda, diary, medication, treatment plan, messages) a family member may see and for how long; the family member logs in under their own identity and sees only the shared sections.", "Parents of a minor and legal representatives get access according to the rules that apply to the age of the child."], "painPoints": ["All-or-nothing sharing forces the person to choose between privacy and support."], "dependencies": [{"type": "brick", "id": "netw", "name": "Network Care and Family Sharing", "description": "Granular sharing.", "how": "Defines and enforces per-section, time-bound sharing with family members."}, {"type": "brick", "id": "iden", "name": "Identity, Access and Strong Authentication (UZI/DigiD)", "description": "Family member identity.", "how": "Authenticates the family member under their own account."}]}, {"id": "invite-the-care-network", "title": "Invite the treating team and informal carers into the care network", "actor": "Patient and Client", "keyFacts": ["The person invites the GGZ practitioner, the GP, a district nurse or an informal carer into the network; each member gets a role that defines what they see and whether they can post to the diary or messages.", "The institution's practitioners join from the EPD so that the client's environment appears in their worklist."], "painPoints": ["Professionals who must log in to a separate environment per client do not use it."], "dependencies": [{"type": "brick", "id": "netw", "name": "Network Care and Family Sharing", "description": "Network roles.", "how": "Manages network membership and roles."}, {"type": "brick", "id": "dosr", "name": "Patient Dossier and Care Pathways", "description": "Practitioner link.", "how": "Links the client's network to the practitioner's dossier and worklist."}]}, {"id": "message-and-video-with-the-network", "title": "Message and hold video contact within the network", "actor": "Patient and Client", "keyFacts": ["Secure messaging and video run inside the environment among network members; a message to the practitioner is stored in the dossier and a message between family members stays in the environment.", "Reminders for medication, appointments and tasks can be set by the person or, with permission, by a carer."], "painPoints": ["Families that fall back to consumer messaging apps for care coordination lose the link to the professional record."], "dependencies": [{"type": "brick", "id": "econ", "name": "E-consult and Secure Messaging", "description": "Secure messaging and video.", "how": "Carries messages and video among network members."}, {"type": "brick", "id": "netw", "name": "Network Care and Family Sharing", "description": "Network scope.", "how": "Determines who in the network receives which messages."}]}, {"id": "open-e-health-apps-with-one-login", "title": "Open e-health apps from the app guide with one login", "actor": "Patient and Client", "keyFacts": ["The GGZ app guide lists 50+ apps; the person opens an app the practitioner recommends with the environment's single login, and the app's results can be shared back into the environment.", "Only apps that passed the platform's security and privacy check appear in the guide, and the practitioner can recommend a specific app from the dossier."], "painPoints": ["Every app with its own account is one more password a client in treatment has to manage."], "dependencies": [{"type": "brick", "id": "pgoa", "name": "Patient App and Web Portal", "description": "App guide and single login.", "how": "Presents the app guide and launches apps with the environment's identity."}, {"type": "brick", "id": "iden", "name": "Identity, Access and Strong Authentication (UZI/DigiD)", "description": "Federated identity.", "how": "Provides the single login token to the connected apps."}]}, {"id": "use-the-environment-for-intensive-care-aftercare", "title": "Use the environment for aftercare after intensive care", "actor": "Rehabilitation and Hospital Paramedical Coordinator", "keyFacts": ["After an intensive-care stay the person and their family use the environment for the aftercare programme: information, diary, questionnaires and contact with the aftercare team; the coordinator follows the entries the person shared.", "Family members who followed the admission through the shared environment continue in the same place, with the diary and questions collected for the aftercare consult."], "painPoints": ["Aftercare information given on paper at discharge is not consulted at home."], "dependencies": [{"type": "brick", "id": "diar", "name": "Self-measurements and Diaries", "description": "Aftercare diary and questionnaires.", "how": "Collects the person's entries in the aftercare programme."}, {"type": "brick", "id": "netw", "name": "Network Care and Family Sharing", "description": "Aftercare team access.", "how": "Gives the aftercare team the access the person granted."}]}, {"id": "roll-out-quli-to-the-institution-teams", "title": "Roll out the environment to the institution's teams", "actor": "GGZ Institution Application Manager", "keyFacts": ["The application manager configures which teams offer the environment, which sections are shared from CRS (treatment plan, appointments, messages) and trains practitioners; adoption per team is reported.", "Two of the top-50 GGZ organisations used Quli as client portal in 2025, so roll-out material draws on those implementations."], "painPoints": ["Teams that were not involved in the choice of the portal do not offer it to their clients."], "dependencies": [{"type": "brick", "id": "netw", "name": "Network Care and Family Sharing", "description": "Institution configuration.", "how": "Configures the sections and teams for the institution's clients."}, {"type": "brick", "id": "dosr", "name": "Patient Dossier and Care Pathways", "description": "CRS sharing.", "how": "Publishes the shared dossier sections from CRS into the environment."}, {"type": "brick", "id": "audt", "name": "Audit Log, Consent and Information Security", "description": "Adoption and access reporting.", "how": "Reports adoption per team and access events for the institution."}]}]}], "outcomes": ["A citizen retrieves their own data from connected care providers into one environment under MedMij consent, without asking for printouts", "Self-measurements and diaries sit next to professional data and can be shared with the treating professional", "Family members and informal carers see exactly what the person allowed, no more, and the person can withdraw it at any time", "Care professionals in the network work with the person's environment instead of separate portals"], "brickDependencies": [{"targetBrickId": "pgom", "type": "composition"}, {"targetBrickId": "netw", "type": "composition"}, {"targetBrickId": "diar", "type": "composition"}, {"targetBrickId": "pgoa", "type": "composition"}, {"targetBrickId": "iden", "type": "composition"}, {"targetBrickId": "audt", "type": "composition"}, {"targetBrickId": "hisc", "type": "composition"}, {"targetBrickId": "dosr", "type": "composition"}, {"targetBrickId": "econ", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "MedMij and the MedMij participants (DVZA and DVP services)", "type": "standards-body", "interface": "MedMij information standards, the participant register and the DVZA/DVP interfaces", "description": "The framework under which a PGO (DVP side) retrieves data from care providers' DVZA services on the basis of the citizen's consent; the label requires qualification per information standard and version, repeated when a standard changes."}, {"system": "Care providers' DVZA services (GP, hospital, pharmacy, GGZ)", "type": "data-source", "interface": "MedMij data services (for example GP data, medication, lab results, GGZ data)", "description": "The care-provider side services through which the PGO retrieves the citizen's data; paramedical care is still in the exploratory phase for PGO disclosure."}, {"system": "DigiD", "type": "identity-provider", "interface": "DigiD authentication at the assurance level required for MedMij", "description": "Authenticates the citizen before data is retrieved into the PGO."}, {"system": "Wearables and home measurement devices", "type": "data-source", "interface": "Device APIs and manual entry", "description": "Provide self-measurements (blood pressure, weight, glucose, activity) that the citizen adds to the environment."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []};

    mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        flowchart: {
            htmlLabels: false
        }

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

    function getFlows() {
        return currentStream.flows || [];
    }

    function getFlowDependencies(flow) {
        const dependencyIndex = new Map();
        (flow.steps || []).forEach(step => {
            (step.dependencies || []).forEach(dependency => {
                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());
    }

    function getStepDependency(step, dependency) {
        return (step.dependencies || []).find(item => (item.type || '') === (dependency.type || '') && (item.id || '') === (dependency.id || '')) || null;
    }

    function getPrimaryActors() {
        const streamJobs = currentStream.supportedCustomerJobs || [];
        const allJobs = streamJobs.length ? streamJobs : supported_jobs;
        return dedupe(allJobs.map(item => item.customerName || item.customerGroup || '').filter(Boolean), item => item);
    }

    function summarizeFlow(flow) {
        const steps = flow.steps || [];
        const firstStep = steps[0] || {};
        const lastStep = steps[steps.length - 1] || {};
        return {
            actor: flow.primaryActor || firstStep.actor || '',
            trigger: flow.trigger || firstStep.trigger || '',
            result: flow.successSignal || flow.outcome || lastStep.successSignal || lastStep.output || ''
        };
    }

    function renderStepMeta(label, value) {
        if (!value) {
            return '';
        }
        return '<div class="flow-step-meta-item"><div class="flow-step-meta-label">' + escapeHtml(label) + '</div><div class="flow-step-copy">' + escapeHtml(value) + '</div></div>';
    }

    function flowDependencyIconFile(dependency) {
        const dependencyId = dependency.id || '';
        const linkedBrick = related_bricks.find(brick => brick.id === dependencyId) || all_bricks.find(brick => brick.id === dependencyId) || {};
        return dependency.icon || linkedBrick.icon || (dependencyId ? dependencyId + '.png' : 'brick.png');
    }

    function renderFlowDependencyIcon(dependency, className) {
        return '<img class="' + escapeHtml(className) + '" src="../icons/' + escapeHtml(flowDependencyIconFile(dependency)) + '" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
    }

    function renderStepDependencyPills(step) {
        const dependencies = step.dependencies || [];
        if (!dependencies.length) {
            return '<div class="muted">No step-specific dependencies listed.</div>';
        }

        return '<div class="flow-step-dependencies">' + dependencies.map(dep => {
            const label = dep.name || dep.id || 'Dependency';
            const kind = 'Brick';
            return '<span class="flow-cell-brick">' + renderFlowDependencyIcon(dep, 'flow-cell-brick-icon') + '<span>' + escapeHtml(kind + ': ' + label) + '</span></span>';
        }).join('') + '</div>';
    }

    function simplifySupportCopy(value) {
        const text = String(value || '').trim();
        if (!text) {
            return '';
        }
        const simplified = text.replace(/^Supports .*? by helping users help /i, 'Facilitate ');
        return simplified;
    }

    function streamMetaPath(stream) {

        }

            parts.push(stream.rootGroup);
        }

                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';

                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';

                if (link.embedLink) {

                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';

    }
