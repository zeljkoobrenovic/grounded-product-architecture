    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

ess review.", "how": "Produces the access review lists and records the outcome."}]}, {"id": "collect-audit-log-evidence", "title": "Collect audit-log evidence and review dossier access", "actor": "GGZ Institution Application Manager", "keyFacts": ["Every dossier access, export and data exchange is logged; the application manager reviews break-the-glass access and unusual patterns monthly and answers patient requests to know who accessed their record.", "Logs are retained for the period the institution's policy and NEN 7510 require and are exportable per patient for a request."], "painPoints": ["Logs that cannot be searched per patient make the patient's access request a manual effort."], "dependencies": [{"type": "brick", "id": "audt", "name": "Audit Log, Consent and Information Security", "description": "Audit log review.", "how": "Provides searchable logs and review workflows."}, {"type": "brick", "id": "dosr", "name": "Patient Dossier and Care Pathways", "description": "Dossier access events.", "how": "Emits access events for every dossier action."}]}, {"id": "assess-suppliers-and-data-exchange-conformance", "title": "Assess suppliers and data-exchange conformance", "actor": "Implementation and Support Consultant", "keyFacts": ["Hosting and sub-processors are assessed, and the exchange channels (Vecozo certificates, ZorgDomein and ZorgMail connections, MedMij qualification of the PGO and DVZA services) are kept in conformance with their renewal and re-qualification requirements.", "Renewal dates for certificates and qualifications are tracked centrally with reminders to the owners well before expiry."], "painPoints": ["A lapsed MedMij qualification or Vecozo certificate stops a service for every practice at once."], "dependencies": [{"type": "brick", "id": "pgom", "name": "MedMij Data Exchange and Consent", "description": "MedMij qualification.", "how": "Tracks the qualification status of the PGO and DVZA services."}, {"type": "brick", "id": "vcgw", "name": "Vecozo Gateway and Insurance Eligibility", "description": "Vecozo certificates.", "how": "Manages certificate validity for declaration and COV services."}, {"type": "brick", "id": "zdom", "name": "Referral and Secure Messaging Hub (ZorgDomein, ZorgMail)", "description": "Exchange connections.", "how": "Keeps ZorgDomein and ZorgMail connections in conformance."}]}, {"id": "run-the-certification-audit-and-follow-up-findings", "title": "Run the certification audit and follow up findings", "actor": "Implementation and Support Consultant", "keyFacts": ["The auditor receives the evidence from the platform, interviews owners, and issues findings; each finding gets an owner and a date, and institutions that ask for assurance receive the certificates and the relevant control descriptions for their own supplier files.", "Evidence is drawn from the systems that operated all year (access reviews, log reviews, change records), so the audit shows continuous operation rather than a snapshot."], "painPoints": ["Evidence assembled in the weeks before the audit does not show that controls operated all year."], "dependencies": [{"type": "brick", "id": "audt", "name": "Audit Log, Consent and Information Security", "description": "Evidence and findings.", "how": "Packages the evidence and tracks findings to closure."}, {"type": "brick", "id": "supp", "name": "Customer Support and Onboarding Tooling", "description": "Institution assurance requests.", "how": "Handles institutions' supplier assurance requests as cases."}]}]}, {"id": "from-consent-and-retention-to-incident-response", "title": "From Consent and Retention to Incident Response", "description": "The platform handles AVG consent and data-subject requests, applies retention and archiving per record type, monitors for security events across tenants, and when a data breach occurs, contains it, informs the affected practices and institutions, and reports to the Autoriteit Persoonsgegevens within the legal time limit.", "primaryActor": "Implementation and Support Consultant", "trigger": "A patient exercises a right, a retention period expires, a security alert fires, or a practice reports a suspected breach.", "successSignal": "Requests are answered within the AVG deadlines, retention runs without losing records under a legal hold, and incidents are contained, reported where required and closed with lessons applied.", "steps": [{"id": "record-consent-at-the-right-moments", "title": "Record consent at the right moments and make it visible", "actor": "Patient and Client", "keyFacts": ["Consent for quality-register delivery, for exchange with a partner app, for MedMij retrieval and for family sharing is asked in context and stored with scope and date; the patient sees and changes consents in the app.", "The consent record names the purpose and the receiving party so that a practice can show exactly which consent covered an exchange."], "painPoints": ["One general consent form at intake does not cover later exchanges, and practices cannot prove the specific consent."], "dependencies": [{"type": "brick", "id": "audt", "name": "Audit Log, Consent and Information Security", "description": "Consent store.", "how": "Stores consents with scope and date and enforces them."}, {"type": "brick", "id": "pgom", "name": "MedMij Data Exchange and Consent", "description": "MedMij consent.", "how": "Records the MedMij consent per data service."}]}, {"id": "handle-data-subject-requests", "title": "Handle access, correction and deletion requests", "actor": "Implementation and Support Consultant", "keyFacts": ["A patient's request to access, correct or delete data is logged as a case, the practice is the controller and decides, and the platform produces the export or applies the correction; medical records are subject to the WGBO retention duty, so deletion requests are weighed against it.", "Requests and their deadlines are visible to the practice as controller and to HCI as processor, so both see when the one-month AVG ials or isolating a tenant are logged with time and actor for the later report."], "painPoints": ["Incidents reported by a practice's therapist by phone reach the incident team hours late."], "dependencies": [{"type": "brick", "id": "tnnt", "name": "Multi-tenant Cloud Runtime and Label Migration Tooling", "description": "Security monitoring.", "how": "Detects and contains incidents across tenants."}, {"type": "brick", "id": "audt", "name": "Audit Log, Consent and Information Security", "description": "Impact analysis.", "how": "Determines affected tenants, patients and data from the logs."}, {"type": "brick", "id": "supp", "name": "Customer Support and Onboarding Tooling", "description": "Incident intake.", "how": "Receives incident reports from practices as priority cases."}]}, {"id": "inform-practices-and-report-to-the-regulator", "title": "Inform affected practices and report to the Autoriteit Persoonsgegevens", "actor": "Implementation and Support Consultant", "keyFacts": ["Affected practices and institutions are informed through secure messaging with the facts they need as controllers; where the breach must be reported, the report goes to the Autoriteit Persoonsgegevens within 72 hours, and patients are informed when the risk requires it.", "The notification tells the practice whether it must inform its own patients and offers a template, because the practice, not HCI, is the controller."], "painPoints": ["Breach communication by ordinary e-mail to hundreds of practices leaks details and misses the practices that changed contacts."], "dependencies": [{"type": "brick", "id": "econ", "name": "E-consult and Secure Messaging", "description": "Secure notification.", "how": "Sends the breach notification to practices securely."}, {"type": "brick", "id": "audt", "name": "Audit Log, Consent and Information Security", "description": "Breach register.", "how": "Records the breach, the assessment and the report to the regulator."}]}, {"id": "close-the-incident-and-apply-lessons", "title": "Close the incident and apply the lessons to controls", "actor": "Implementation and Support Consultant", "keyFacts": ["The incident review updates the risk register and the affected controls, and the outcome is shared with institutions that requested it for their own incident files.", "Institutions with their own NEN 7510 obligations receive the incident summary they need for their incident register."], "painPoints": ["Incidents closed without a control change repeat."], "dependencies": [{"type": "brick", "id": "audt", "name": "Audit Log, Consent and Information Security", "description": "Incident review.", "how": "Records the review and links control changes."}, {"type": "brick", "id": "iden", "name": "Identity, Access and Strong Authentication (UZI/DigiD)", "description": "Access hardening.", "how": "Applies authentication and role changes resulting from the review."}]}]}], "outcomes": ["The NEN 7510 and ISO 27001 certificates are maintained with evidence collected from the platform rather than assembled by hand before the audit", "Every access to patient data is authenticated at the right level and logged, and patients and institutions can see who accessed what", "Consent, retention and data-subject requests are handled within the AVG deadlines from the platform", "Incidents and data breaches are detected, contained, reported and learned from within the legal time limits"], "brickDependencies": [{"targetBrickId": "iden", "type": "composition"}, {"targetBrickId": "audt", "type": "composition"}, {"targetBrickId": "tnnt", "type": "composition"}, {"targetBrickId": "pgom", "type": "composition"}, {"targetBrickId": "vcgw", "type": "composition"}, {"targetBrickId": "zdom", "type": "composition"}, {"targetBrickId": "dosr", "type": "composition"}, {"targetBrickId": "supp", "type": "composition"}, {"targetBrickId": "econ", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "Certification bodies for NEN 7510 and ISO 27001", "type":     mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        flowchart: {
            htmlLabels: false
        }
    });

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

    function getFlows() {
        return currentStream.flows || [];
    }

    function getFlowDependencies(flow) {
        const dependencyIndex = new Map();
        (flow.steps || []).forEach(step => {
            (step.dependencies || []).forEach(dependency => {
                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());
    }

    function getStepDependency(step, dependency) {
        return (step.dependencies || []).find(item => (item.type || '') === (dependency.type || '') && (item.id || '') === (dependency.id || '')) || null;
    }

    function getPrimaryActors() {
        const streamJobs = currentStream.supportedCustomerJobs || [];
        const allJobs = streamJobs.length ? streamJobs : supported_jobs;
        return dedupe(allJobs.map(item => item.customerName || item.customerGroup || '').filter(Boolean), item => item);
    }

    function summarizeFlow(flow) {
        const steps = flow.steps || [];
        const firstStep = steps[0] || {};
        const lastStep = steps[steps.length - 1] || {};
        return {
            actor: flow.primaryActor || firstStep.actor || '',
            trigger: flow.trigger || firstStep.trigger || '',
            result: flow.successSignal || flow.outcome || lastStep.successSignal || lastStep.output || ''
        };
    }

    function renderStepMeta(label, value) {
        if (!value) {
            return '';
        }
        return '<div class="flow-step-meta-item"><div class="flow-step-meta-label">' + escapeHtml(label) + '</div><div class="flow-step-copy">' + escapeHtml(value) + '</div></div>';
    }

    function flowDependencyIconFile(dependency) {
        const dependencyId = dependency.id || '';
        const linkedBrick = related_bricks.find(brick => brick.id === dependencyId) || all_bricks.find(brick => brick.id === dependencyId) || {};
        return dependency.icon || linkedBrick.icon || (dependencyId ? dependencyId + '.png' : 'brick.png');
    }

    function renderFlowDependencyIcon(dependency, className) {
        return '<img class="' + escapeHtml(className) + '" src="../icons/' + escapeHtml(flowDependencyIconFile(dependency)) + '" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
    }

    function renderStepDependencyPills(step) {
        const dependencies = step.dependencies || [];
        if (!dependencies.length) {
            return '<div class="muted">No step-specific dependencies listed.</div>';
        }

        return '<div class="flow-step-dependencies">' + dependencies.map(dep => {
            const label = dep.name || dep.id || 'Dependency';
            const kind = 'Brick';
            return '<span class="flow-cell-brick">' + renderFlowDependencyIcon(dep, 'flow-cell-brick-icon') + '<span>' + escapeHtml(kind + ': ' + label) + '</span></span>';
        }).join('') + '</div>';
    }

    function simplifySupportCopy(value) {
        const text = String(value || '').trim();
        if (!text) {
            return '';
        }
        const simplified = text.replace(/^Supports .*? by helping users help /i, 'Facilitate ');
        return simplified;
    }

            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right; color: darkred">Pain Points</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkred">';
                if ((step.painPoints || []).length) {
                    html += '<ul class="flow-insight-list">' + step.painPoints.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No pain points listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';
            html += '</thead><tbody>';

            dependenciesInFlow.forEach(dependency => {
                const dependencyTypeLabel = 'Product Brick';
                html += '<tr>';
                html += '<td>';
                html += '<div class="flow-dependency-header">';
                html += renderFlowDependencyIcon(dependency, 'flow-dependency-icon');
                html += '<div>';
                html += '<a class="flow-dependency-name" href="../landing_pages/' + escapeHtml(dependency.id) + '.html">' + escapeHtml(dependency.name || dependency.id) + '</a>';
                if (dependency.interface) {
                    html += '<div class="muted">' + escapeHtml(dependency.interface) + '</div>';
                }
                html += '</div>';
                html += '</div>';
                html += '</td>';
                (flow.steps || []).forEach(step => {
                    const stepDependency = getStepDependency(step, dependency);
                    if (!stepDependency) {
                        html += '<td class="flow-cell-empty">-</td>';
                        return;
                    }
                    html += '<td class="flow-cell-active">';
                    html += '<div class="flow-cell-copy">' + escapeHtml(simplifySupportCopy(stepDependency.how || stepDependency.description || 'Supports this step.')) + '</div>';
                    html += '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            html += '</div>';
            html += '</div>';
        });

        document.getElementById('tab_content_flows').innerHTML = html;
    }

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';
        }
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-title">' + escapeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                count++;
                html += '<div class="link-entry">';
                html += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(link.link || '#') + '">'
                    + escapeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>


<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Paramedical and Mental Health Practice Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Streams Index"
    },
    {
      "label": "Secure and Comply with Health Information Standards"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
