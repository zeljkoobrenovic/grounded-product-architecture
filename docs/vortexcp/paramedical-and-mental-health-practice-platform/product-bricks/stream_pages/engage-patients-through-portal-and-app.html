    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

": "Account and onboarding.", "how": "Guides the patient through account creation and first use."}]}, {"id": "link-the-practice-and-see-the-services", "title": "Link the practice and see the available services", "actor": "Patient and Client", "keyFacts": ["The patient searches or scans the practice, the link is confirmed against the practice's patient register through the HIS or AIS connector, and the services the practice enabled appear: e-consult, appointments, repeat prescriptions, record.", "A patient can link the GP, the pharmacy, the physiotherapist and a GGZ institution and switches between them in the same app."], "painPoints": ["Patients not found in the practice register (a different spelling, a moved patient) cannot link and give up."], "dependencies": [{"type": "brick", "id": "hisc", "name": "HIS/AIS and Hospital System Connectors", "description": "Patient register check.", "how": "Verifies the patient in the practice's HIS or AIS and returns the enabled services."}, {"type": "brick", "id": "pgoa", "name": "Patient App and Web Portal", "description": "Care provider linking.", "how": "Links the practice to the patient's account."}]}, {"id": "send-a-first-e-consult", "title": "Send a first e-consult and receive the answer", "actor": "Patient and Client", "keyFacts": ["The patient writes a question, optionally with a photo, and the e-consult lands in the practice's HIS inbox where the GP or assistant answers within the practice's response time; the answer arrives in the app with a notification.", "The practice can set e-consult rules (no emergencies, expected response time, which staff answer) that are shown before the patient sends."], "painPoints": ["Practices that answer e-consults in a separate portal instead of the HIS inbox answer late and lose the thread in the record."], "dependencies": [{"type": "brick", "id": "econ", "name": "E-consult and Secure Messaging", "description": "E-consult exchange.", "how": "Delivers the e-consult to the practice system and the answer back to the app."}, {"type": "brick", "id": "hisc", "name": "HIS/AIS and Hospital System Connectors", "description": "HIS inbox.", "how": "Passes the e-consult into the HIS or AIS inbox and returns the answer."}]}, {"id": "book-an-appointment-in-the-practice-agenda", "title": "Book an appointment in the practice agenda from the app", "actor": "Patient and Client", "keyFacts": ["The patient chooses the reason for the visit and picks a slot from the practice's bookable availability; the booking lands in the HIS agenda for a GP or in the paramedical agenda for a therapist, and the confirmation and reminder arrive in the app.", "The practice defines which reasons and which slots are bookable online and which require triage or a phone call."], "painPoints": ["Open online booking without a reason for the visit leads to double-length consults booked in single slots."], "dependencies": [{"type": "brick", "id": "appb", "name": "Patient Appointment Self-service", "description": "Appointment self-service.", "how": "Presents bookable slots by reason and books the appointment."}, {"type": "brick", "id": "agnd", "name": "Agenda and Multi-location Scheduling", "description": "Paramedical agenda.", "how": "Provides availability and receives the booking for therapist practices."}, {"type": "brick", "id": "hisc", "name": "HIS/AIS and Hospital System Connectors", "description": "HIS agenda.", "how": "Provides availability and receives the booking for GP practices."}]}, {"id": "track-activation-and-fewer-calls", "title": "Track activation and the shift from phone to app", "actor": "GP Practice and Pharmacy Manager", "keyFacts": ["The practice manager sees activated patients, e-consults, bookings and repeat requests per month, and uses the view to decide which services to promote next.", "Offering the record in the app gives patients the electronic access to their own data that Dutch law expects of care providers; retrieval into the patient's own PGO runs separately under the MedMij framework."], "painPoints": ["Without usage figures the practice cannot tell whether the app is worth the subscription."], "dependencies": [{"type": "brick", "id": "pgoa", "name": "Patient App and Web Portal", "description": "Usage reporting.", "how": "Reports activation and service use per practice."}]}]}, {"id": "from-question-to-the-right-route-with-triage-and-self-service", "title": "From a Question to the Right Route with Triage, Repeat Prescriptions and Record Access", "description": "A patient with a new complaint uses digital triage before contacting the practice, orders a repeat prescription from the medication overview, reads the record and correspondence, and a GGZ client uses the CRS client portal for messages with the treatment team, all with notifications that bring the patient back at the right moment.", "primaryActor": "Patient and Client", "trigger": "The patient has a new complaint, runs out of medication, wants to read a result or letter, or receives a notification from a care provider.", "successSignal": "The patient reaches the right route (self-care, e-consult, appointment or urgent care), the repeat prescription is ready at the pharmacy, the record is read, and the GGZ client's message is answered by the team.", "steps": [{"id": "run-digital-triage-before-contacting-the-practice", "title": "Run digital triage before contacting the practice", "actor": "Patient and Client", "keyFacts": ["The patient answers the triage questions ('Moet ik naar de dokter?') in the app or on the practice website and receives an advice: self-care with instructions, an e-consult, an appointment within a certain time, or urgent contact.", "The triage outcome is attached to the e-consult or appointment so that the assistant sees it, and the practice can tune which outcomes lead to which route."], "painPoints": ["Triage that ends with 'call the practice' for every answer adds a step without removing calls."], "dependencies": [{"type": "brick", "id": "trig", "name": "Digital Triage", "description": "Triage session.", "how": "Runs the triage protocol and produces the advice and route."}, {"type": "brick", "id": "pweb", "name": "Practice Websites", "description": "Triage on the website.", "how": "Offers the triage entry point on the practice website."}]}, {"id": "follow-the-advised-route", "title": "Follow the advised route: e-consult or appointment", "actor": "Patient and Client", "keyFacts": ["From the advice the patient starts the e-consult or books the appointment with the triage summary pre-filled, so the practice receives a structured question instead of a phone description.", "The advice includes a time frame ('within 24 hours', 'within a week') that maps to the appointment types the practice made bookable, so urgency and slot type match."], "painPoints": ["Patients who get a self-care advice but remain worried call anyway; a follow-up option in the app keeps them in the digital route."], "dependencies": [{"type": "brick", "id": "econ", "name": "E-consult and Secure Messaging", "description": "E-consult from triage.", "how": "Starts the e-consult with the triage summary."}, {"type": "brick", "id": "appb", "name": "Patient Appointment Self-service", "description": "Appointment from triage.", "how": "Books the appointment type that matches the advice."}, {"type": "brick", "id": "trig", "name": "Digital Triage", "description": "Triage summary.", "how": "Passes the triage outcome to the chosen route."}]}, {"id": "order-a-repeat-prescription", "title": "Order a repeat prescription from the medication overview", "actor": "Patient and Client", "keyFacts": ["The medication overview from the pharmacy information system shows the patient's current medication; the patient selects what to repeat, the request goes to the GP for authorisation and to the pharmacy, and the app tells the patient when it is ready.", "The pharmacy manager sees repeat requests arrive in the AIS instead of on the answering machine."], "painPoints": ["Requests for medication that is no longer prescribed create work for the assistant unless the overview is current."], "dependencies": [{"type": "brick", "id": "rxrp", "name": "Repeat Prescriptions and Medication Overview", "description": "Repeat request.", "how": "Shows the medication overview and routes the repeat request to GP and pharmacy."}, {"type": "brick", "id": "hisc", "name": "HIS/AIS and Hospital System Connectors", "description": "AIS and HIS exchange.", "how": "Reads the medication overview and delivers the request to the pharmacy and GP systems."}]}, {"id": "read-the-record-results-and-letters", "title": "Read the record, results and letters", "actor": "Patient and Client", "keyFacts": ["The patient reads the record summary, lab results, letters and the treatment plan from the linked care providers; new items trigger a notification, and the care provider can delay visibility of a result until it has been discussed.", "Access is logged on the care provider's side, and the patient sees a history of what was accessed."], "painPoints": ["Results shown before the doctor has explained them cause anxious calls."], "dependencies": [{"type": "brick", "id": "pgoa", "name": "Patient App and Web Portal", "description": "Record view.", "how": "Presents record summaries, results and letters with notifications."}, {"type": "brick", "id": "hisc", "name": "HIS/AIS and Hospital System Connectors", "description": "Record data.", "how": "Retrieves the record data from the GP, pharmacy or hospital system."}]}, {"id": "message-the-ggz-team-in-the-client-portal", "title": "Message the treatment team in the GGZ client portal", "actor": "Patient and Client", "keyFacts": ["A GGZ client uses the CRS client portal for secure messages with the treatment team, appointment overview, the treatment plan and e-health tasks; the message reaches the practitioner's worklist in the EPD and the answer is stored in the dossier.", "The portal sets expectations on response times and crisis routes, which are shown before a message is sent."], "painPoints": ["Clients in crisis who message the portal at night must be pointed to the crisis service immediately, not answered the next working day."], "dependencies": [{"type": "brick", "id": "cpor", "name": "GGZ Client Portal", "description": "Client messaging.", "how": "Carries secure messages between the client and the treatment team with the crisis notice."}, {"type": "brick", "id": "econ", "name": "E-consult and Secure Messaging", "description": "Secure message transport.", "how": "Delivers messages and answers securely with notifications."}]}, {"id": "receive-notifications-and-return-at-the-right-moment", "title": "Receive notifications and return to the app at the right moment", "actor": "Patient and Client", "keyFacts": ["Notifications for answers, results, appointment reminders, questionnaires and ready prescriptions bring the patient back; the patient controls which notifications are pushed and which are only shown in the app.", "The practice can schedule its own notifications, for example a reminder to book the yearly check or to fill the PROM before the next physiotherapy session."], "painPoints": ["Notifications that reveal medical content on the lock screen breach the patient's privacy."], "dependencies": [{"type": "brick", "id": "pgoa", "name": "Patient App and Web Portal", "description": "Notification preferences.", "how": "Sends notifications without medical content on the lock screen and respects the patient's preferences."}]}]}], "outcomes": ["A patient invited by a GP practice, pharmacy, therapist or GGZ institution activates the app and finds all their care providers in one place", "Routine questions, appointments and repeat prescriptions move from the phone to the app, which the practice sees in fewer calls", "Patients read their record, treatment plan and correspondence and receive notifications when something new arrives", "Digital triage sends patients to the right route before they contact the practice"], "brickDependencies": [{"targetBrickId": "pgoa", "type": "composition"}, {"targetBrickId": "econ", "type": "composition"}, {"targetBrickId": "rxrp", "type": "composition"}, {"targetBrickId": "appb", "type": "composition"}, {"targetBrickId": "trig", "type": "composition"}, {"targetBrickId": "cpor", "type": "composition"}, {"targetBrickId": "hisc", "type": "composition"}, {"targetBrickId": "agnd", "type": "composition"}, {"targetBrickId": "iden", "type": "composition"}, {"targetBrickId": "pweb", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "DigiD", "type": "identity-provider", "interface": "DigiD authentication (SAML/OIDC through a certified broker)", "description": "Authenticates citizens at the assurance level required for access to medical data in the app and the portal."}, {"system": "GP and pharmacy information systems (Sanday, HealthConnected, Pharmapartners, CGM, Bricks, Vertimart)", "type": "clinical-system", "interface": "HIS/AIS connectors for e-consult, agenda, medication and record access", "description": "The practice systems behind the GP and pharmacy that receive e-consults and appointment bookings and provide the medication overview and record summaries shown in the app."}, {"system": "Apple App Store and Google Play", "type": "app-distribution-platform", "interface": "App distribution and push notifications", "description": "Distribute the Uw Zorg Online app and deliver push notifications for new messages, results and appointments."}, {"system": "Triage content providers (DigiDok, Quin, 'Moet ik naar de dokter?')", "type": "content-provider", "interface": "Triage protocols and self-check content", "description": "Supply the triage logic and self-care advice that the digital triage presents to patients."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []};

tient App and Portal", "productIcon": "uw-zorg-online.png", "jobId": "jtbd-ptnt-2", "jobName": "See and share my health data on my own terms", "jobWhatItIs": "Have one personal health environment, Quli or Uw Zorg Online, in which she can retrieve her data from the GP, the pharmacy, the hospital and the GGZ institution under MedMij, read her record, treatment plan, results and letters in language she understands, keep her own measurements and a diary next to it, and decide precisely who else may see what: a partner during a pregnancy, a daughter who manages an elderly mother's care, a new therapist who needs the history. The job includes understanding what a PGO is, choosing one, connecting providers, keeping the data current, sharing and unsharing, and checking who has looked.", "jobOutcome": "Her data from at least two providers is in one personal health environment and refreshes without effort, she can read her record and treatment plan before and after a consultation, family members or carers see only what she chose to share and lose access when she says so, and she can see every access to her data.", "supportRationale": "Presents record, plan and letters in the app with the option to ask a question about a specific item.", "usedInSteps": [{"step": "Read my record, treatment plan and correspondence", "description": "Open the record and the letters after a consultation, read the treatment plan her GGZ team agreed with her, look up a lab result or a physiotherapy report before the next visit, and ask a question about what she reads instead of guessing.", "howItSupports": "Presents record, plan and letters in the app with the option to ask a question about a specific item.", "media": []}]}, {"customerId": "ptnt", "customerName": "Patient and Client", "customerGroup": "Patients and Primary Care Network", "customerIcon": "customer-ptnt-portrait.jpg", "productId": "uw-zorg-online", "productName": "Uw Zorg Online Patient App and Portal", "productIcon": "uw-zorg-online.png", "jobId": "jtbd-ptnt-3", "jobName": "Follow my treatment programme at home", "jobWhatItIs": "Do the part of a treatment that happens between sessions, physiotherapy exercises after a knee operation, an Embloom module and questionnaires during GGZ treatment, a food diary for the dietitian, or remote follow-up after a hospital discharge, in one app that tells her what to do and when, that her therapist can see, and that shows her whether she is getting better. The job runs from the moment the therapist assigns the programme to the closure of the trajectory with results she keeps.", "jobOutcome": "She knows at any moment what is expected of her this week, questionnaires are completed before the session so they are discussed rather than chased, most exercises and module sessions are done on time, contact about progress goes through the app or a video consult instead of an extra visit, and at the end she can see and keep the outcome of the trajectory.", "supportRationale": "Publishes the assigned exercises, modules and home tasks with schedule and instructions to her app the moment the therapist assigns them.", "usedInSteps": [{"step": "Receive the programme and understand what is expected", "description": "After the session, find the programme in the app: the exercises with video, the Embloom module with its lessons, the questionnaire due before the next session, and the schedule, with a reminder settings choice that fits her week rather than the therapist's.", "howItSupports": "Publishes the assigned exercises, modules and home tasks with schedule and instructions to her app the moment the therapist assigns them.", "media": []}, {"step": "Receive the programme and understand what is expected", "description": "After the session, find the programme in the app: the exercises with video, the Embloom module with its lessons, the questionnaire due before the next session, and the schedule, with a reminder settings choice that fits her week rather than the therapist's.", nd Pharmacy Manager", "customerGroup": "Patients and Primary Care Network", "customerIcon": "customer-gpph-portrait.jpg", "productId": "uw-zorg-online", "productName": "Uw Zorg Online Patient App and Portal", "productIcon": "uw-zorg-online.png", "jobId": "jtbd-gpph-1", "jobName": "Give patients a digital front door that cuts phone traffic", "jobWhatItIs": "Open the practice or pharmacy to patients through Uw Zorg Online so that e-consults, appointments in the practice agenda, repeat prescriptions, record access and the \"Moet ik naar de dokter?\" triage arrive digitally instead of by telephone. The manager has to connect the app to the practice's own information system (Pharmapartners, CGM, Sanday, HealthConnected, Bricks or Vertimart), decide which appointment types, e-consult subjects and prescription flows are open to patients, get patients to activate their account with DigiD, and organise the assistants so that digital requests are handled inside the normal working day rather than on top of it.", "jobOutcome": "Patients arrange most routine matters themselves in the app that is connected to the practice agenda and the HIS or AIS, the assistants spend their mornings on triage and care instead of on the telephone queue, and the practice can see in its own figures that phone contacts per 1,000 patients keep falling while patient satisfaction with reachability rises.", "supportRationale": "Sets up the practice's presence in the app so that patients see the right services once the connection is live.", "usedInSteps": [{"step": "Connect Uw Zorg Online to the practice information system", "description": "Check that the practice's HIS or the pharmacy's AIS (Pharmapartners, CGM, Sanday, HealthConnected, Bricks or Vertimart) is on the list of supported connections, sign the agreement and the processing agreement with HCI, arrange the connector activation with the HIS or AIS vendor, and verify with a test patient that the agenda, medication overview and record summary appear in the app exactly as they stand in the practice system.", "howItSupports": "Sets up the practice's presence in the app so that patients see the right services once the connection is live.", "media": []}, {"step": "Configure which services are open to patients", "description": "Decide with the GPs or pharmacists which appointment types and slots may be booked online, which e-consult subjects are allowed and who answers them, whether repeat prescriptions go straight to the pharmacy of choice, and whether patients can read their record summary and correspondence; set the practice's answering rules and response promise so that the app tells patients what to expect.", "howItSupports": "Exposes the agenda slots and appointment types that the practice releases for patient self-service.", "media": []}, {"step": "Configure which services are open to patients", "description": "Decide with the GPs or pharmacists which appointment types and slots may be booked online, which e-consult subjects are allowed and who answers them, whether repeat prescriptions go straight to the pharmacy of choice, and whether patients can read their record summary and correspondence; set the practice's answering rules and response promise so that the app tells patients what to expect.", "howItSupports": "Holds the practice's e-consult, prescription and record-access settings and the response promise shown to patients.", "media": []}, {"step": "Get patients to activate the app", "description": "Invite patients through the practice website, the waiting-room screen, the telephone menu and the assistant's standard answer, help older patients through DigiD activation, and prioritise the frequent callers, chronic patients and parents who generate most of the phone traffic; watch weekly how many invitations turn into activated accounts and first digital requests.", "howItSupports": "Runs invitations, DigiD activation and the first-use nudges that turn an invitation into an active account.", "media": [ eet MedMij and Wegiz obligations without extra work", "jobWhatItIs": "Fulfil the practice's or pharmacy's legal duties to give patients electronic access to their data and to exchange data digitally: online access to the record and medication overview, the Wegiz obligation to exchange data electronically (in force since April 2023), and the MedMij standards under which patients retrieve their data into a personal health environment such as Quli. The manager wants HCI to carry the certification, consent handling, DigiD authentication and standard conformance, so that the practice only has to switch on the right settings and can show auditors and the patient federation that it complies.", "jobOutcome": "The practice complies with online access, Wegiz and MedMij through the same app and connection it already uses, patients can retrieve their data into any MedMij-labelled PGO without the practice answering paper requests, and the manager has the evidence for the accountant, the insurer's quality conditions and a NEN 7510 or AVG question without building anything themselves.", "supportRationale": "Shows patients their access log and consent settings in the same app they use for care.", "usedInSteps": [{"step": "Handle consent, authentication and identity questions", "description": "Make sure patients log in with DigiD, that parents and carers act only within the rules for children and representatives, that patients can see who accessed their data, and that objections or corrections are handled by the practice; write the practice's own short policy on top of HCI's standard texts.", "howItSupports": "Shows patients their access log and consent settings in the same app they use for care.", "media": []}, {"step": "Answer patient PGO and data requests without paper", "description": "Route questions about downloading data, sharing with family or an informal carer and combining GP, pharmacy and hospital data to the app and Quli instead of printing or mailing, and use the network care functions so that a patient's informal carer can act for them with the patient's permission.", "howItSupports": "Lets patients retrieve, combine and share their data with family and carers so that the practice no longer handles paper copies.", "media": []}, {"step": "Answer patient PGO and data requests without paper", "description": "Route questions about downloading data, sharing with family or an informal carer and combining GP, pharmacy and hospital data to the app and Quli instead of printing or mailing, and use the network care functions so that a patient's informal carer can act for them with the patient's permission.", "howItSupports": "Answers the practical questions about downloading and sharing inside the app's help and messaging.", "media": []}, {"step": "Handle consent, authentication and identity questions", "description": "Make sure patients log in with DigiD, that parents and carers act only within the rules for children and representatives, that patients can see who accessed their data, and that objections or corrections are handled by the practice; write the practice's own short policy on top of HCI's standard texts.", "howItSupports": "Provides DigiD authentication, consent records, audit logs and representative rules that the practice can rely on.", "media": []}]}, {"customerId": "gpph", "customerName": "GP Practice and Pharmacy Manager", "customerGroup": "Patients and Primary Care Network", "customerIcon": "customer-gpph-portrait.jpg", "productId": "uw-zorg-online", "productName": "Uw Zorg Online Patient App and Portal", "productIcon": "uw-zorg-online.png", "jobId": "jtbd-gpph-3", "jobName": "Keep the practice findable and up to date online", "jobWhatItIs": "Run a practice or pharmacy website from the Praktijkinfo portfolio that patients find when they search for the practice, that shows correct opening hours, team, services, holiday cover and news, and that leads directly into the digital front door: online booking, e-consult, repeat pre  {"customerId": "ptnt", "customerName": "Patient and Client", "customerGroup": "Patients and Primary Care Network", "customerIcon": "customer-ptnt-portrait.jpg", "productId": "quli", "productName": "Quli Personal Health Environment", "productIcon": "quli.png", "jobId": "jtbd-ptnt-1", "jobName": "Reach my care providers and arrange things without calling", "jobWhatItIs": "Handle the everyday contact with the GP practice, the pharmacy and the therapist from her phone: find out whether a complaint needs the doctor at all, ask a question that does not need a visit, book, move or cancel an appointment in the practice's real agenda, order repeat medication, and settle an invoice for care the insurer does not cover, all without joining the telephone queue at 8 o'clock or standing at the counter. The job starts with the practice offering the app and ends with every routine contact completed digitally and confirmed, with the telephone reserved for what really needs it.", "jobOutcome": "Routine questions, appointments and repeat prescriptions are handled through the app in most cases, an e-consult is answered within a working day, a booked appointment is in the practice agenda the moment she confirms it, a repeat prescription is ready at the pharmacy when the app says so, and she calls the practice only when the app or the triage tells her to.", "supportRationale": "Shows on the practice website which digital services are offered and leads her straight into the app or portal for that practice.", "usedInSteps": [{"step": "Find the practice's digital front door and activate the app", "description": "Learn from the practice website, a leaflet at the counter or the assistant that the practice works with Uw Zorg Online, download the app or open the web portal, log in with DigiD, and link her GP practice and pharmacy, with the practice's name confirming that she is in the right place.", "howItSupports": "Shows on the practice website which digital services are offered and leads her straight into the app or portal for that practice.", "media": []}, {"step": "Find the practice's digital front door and activate the app", "description": "Learn from the practice website, a leaflet at the counter or the assistant that the practice works with Uw Zorg Online, download the app or open the web portal, log in with DigiD, and link her GP practice and pharmacy, with the practice's name confirming that she is in the right place.", "howItSupports": "Runs the invitation, download and activation flow that links her account to the practice and pharmacy that offer the app.", "media": []}, {"step": "Check whether I need the doctor at all", "description": "For a new complaint, run the 'Moet ik naar de dokter?' triage in the app, answer the questions and receive an advice: self-care with instructions, an e-consult, a regular appointment, or call now, so that she does not sit in a queue for something she can handle herself or delay something urgent.", "howItSupports": "Offers digital triage inside the app and turns the outcome into the right next step: advice, an e-consult or a bookable slot.", "media": []}, {"step": "Ask a question by e-consult and get a usable answer", "description": "Write the question in the app, attach a photo of the rash or the medication box if useful, and receive an answer from the GP, the assistant or the pharmacist in the same thread, with a notification when it arrives and a follow-up question possible without starting over.", "howItSupports": "Provides the e-consult thread with attachments, notifications and a clear status from sent to answered.", "media": []}, {"step": "Book, move or cancel an appointment in the practice agenda", "description": "Pick a consultation type, see the slots the practice actually has free for the right doctor or therapist, book one, receive a confirmation and a reminder, and move or cancel within the practice's rules when work or a child's school gets in the way.", "howItSupports": "Exposes the real free slots of the practice or therapist agenda for the chosen consultation type and books, moves or cancels within the practice's rules.", "media": []}, {"step": "Book, move or cancel an appointment in the practice agenda", "description": "Pick a consultation type, see the slots the practice actually has free for the right doctor or therapist, book one, receive a confirmation and a reminder, and move or cancel within the practice's rules when work or a child's school gets in the way.", "howItSupports": "Shows her upcoming appointments in the app with confirmations, reminders and a one-tap reschedule.", "media": []}, {"step": "Order repeat medication and keep the medication overview right", "description": "Select the medicines from her current medication overview that are running out, send the repeat request to the GP or pharmacy, follow the status until the pharmacy reports it ready for pick-up or delivery, and check that the overview matches what she actually takes.", "howItSupports": "Lets her request repeat prescriptions from the medication overview and follow the status until the pharmacy has it ready.", "media": []}, {"step": "Pay an invoice for care the insurer does not cover", "description": "For physiotherapy sessions beyond her supplementary insurance or a treatment she pays herself, receive the invoice in the app rather than by post, pay it with iDEAL through Mollie, and keep the paid invoices for her insurer's restitution claim.", "howItSupports": "Delivers invoices and a payment link in the app and keeps paid invoices available for download.", "media": []}, {"step": "Find the practice's digital front door and activate the app", "description": "Learn from the practice website, a leaflet at the counter or the assistant that the practice works with Uw Zorg Online, download the app or open the web portal, log in with DigiD, and link her GP practice and pharmacy, with the practice's name confirming that she is in the right place.", "howItSupports": "Authenticates her with DigiD and records consent so that the practice may disclose data and receive requests through the app.", "media": []}]}, {"customerId": "ptnt", "customerName": "Patient and Client", "customerGroup": "Patients and Primary Care Network", "customerIcon": "customer-ptnt-portrait.jpg", "productId": "quli", "productName": "Quli Personal Health Environment", "productIcon": "quli.png", "jobId": "jtbd-ptnt-2", "jobName": "See and share my health data on my own terms", "jobWhatItIs": "Have one personal health environment, Quli or Uw Zorg Online, in which she can retrieve her data from the GP, the pharmacy, the hospital and the GGZ institution under MedMij, read her record, treatment plan, results and letters in language she understands, keep her own measurements and a diary next to it, and decide precisely who else may see what: a partner during a pregnancy, a daughter who manages an elderly mother's care, a new therapist who needs the history. The job includes understanding what a PGO is, choosing one, connecting providers, keeping the data current, sharing and unsharing, and checking who has looked.", "jobOutcome": "Her data from at least two providers is in one personal health environment and refreshes without effort, she can read her record and treatment plan before and after a consultation, family members or carers see only what she chose to share and lose access when she says so, and she can see every access to her data.", "supportRationale": "Presents record, plan and letters in the app with the option to ask a question about a specific item.", "usedInSteps": [{"step": "Read my record, treatment plan and correspondence", "description": "Open the record and the letters after a consultation, read the treatment plan her GGZ team agreed with her, look up a lab result or a physiotherapy report before the next visit, and ask a question about what she reads instead of guessing.", "howItSupports": "Presents record, plan and letters in the app with the option to ask a question about a specific item.", "media": []}]}, {"customerId": "ptnt", "customerName": "Patient and Client", "customerGroup": "Patients and Primary Care Network", "customerIcon": "customer-ptnt-portrait.jpg", "productId": "quli", "productName": "Quli Personal Health Environment", "productIcon": "quli.png", "jobId": "jtbd-ptnt-3", "jobName": "Follow my treatment programme at home", "jobWhatItIs": "Do the part of a treatment that happens between sessions, physiotherapy exercises after a knee operation, an Embloom module and questionnaires during GGZ treatment, a food diary for the dietitian, or remote follow-up after a hospital discharge, in one app that tells her what to do and when, that her therapist can see, and that shows her whether she is getting better. The job runs from the moment the therapist assigns the programme to the closure of the trajectory with results she keeps.", "jobOutcome": "She knows at any moment what is expected of her this week, questionnaires are completed before the session so they are discussed rather than chased, most exercises and module sessions are done on time, contact about progress goes through the app or a video consult instead of an extra visit, and at the end she can see and keep the outcome of the trajectory.", "supportRationale": "Publishes the assigned exercises, modules and home tasks with schedule and instructions to her app the moment the therapist assigns them.", "usedInSteps": [{"step": "Receive the programme and understand what is expected", "description": "After the session, find the programme in the app: the exercises with video, the Embloom module with its lessons, the questionnaire due before the next session, and the schedule, with a reminder settings choice that fits her week rather than the therapist's.", "howItSupports": "Publishes the assigned exercises, modules and home tasks with schedule and instructions to her app the moment the therapist assigns them.", "media": []}, {"step": "Receive the programme and under  planned video consultation from the app, so that a problem is solved this week rather than at the next visit.", "howItSupports": "Carries secure messages with attachments between her and the treating professional inside the app.", "media": []}]}, {"customerId": "ggzi", "customerName": "GGZ Institution Application Manager", "customerGroup": "Mental Health Care (GGZ)", "customerIcon": "customer-ggzi-portrait.jpg", "productId": "quli", "productName": "Quli Personal Health Environment", "productIcon": "quli.png", "jobId": "jtbd-ggzi-2", "jobName": "Roll out the client portal and e-health to all teams", "jobWhatItIs": "Take the institution from a client portal used by a few enthusiastic teams to one in which every client in treatment is invited at intake, can read their treatment plan and correspondence, message their team, complete questionnaires and work in Embloom, Therapieland or Minddistrict modules, and, through Quli, retrieve their data from other providers under MedMij and share it with family. The job covers the proposition and consent model, e-health configuration per team, training and embedding in the intake process, activating clients and their networks, and monitoring activation and usage per team so laggards are helped rather than reported.", "jobOutcome": "Three quarters of clients in active treatment have an activated portal account, most active trajectories have an e-health module in use, e-consults are answered within two working days, questionnaire results and module progress land in the dossier automatically, and no team is below half activation a year after rollout.", "supportRationale": "Provides the CRS client portal with configurable disclosure of treatment plan, notes, correspondence and messaging per client group.", "usedInSteps": [{"step": "Choose the portal proposition and the consent model", "description": "Decide with the board, the client council and the privacy officer what clients get: the CRS client portal for treatment plan, correspon     mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        flowchart: {
            htmlLabels: false
        }
    });

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

    function getFlows() {
        return currentStream.flows || [];
    }

    function getFlowDependencies(flow) {
        const dependencyIndex = new Map();
        (flow.steps || []).forEach(step => {
            (step.dependencies || []).forEach(dependency => {
                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());
    }

    function getStepDependency(step, dependency) {
        return (step.dependencies || []).find(item => (item.type || '') === (dependency.type || '') && (item.id || '') === (dependency.id || '')) || null;
    }

    function getPrimaryActors() {
        const streamJobs = currentStream.supportedCustomerJobs || [];
        const allJobs = streamJobs.length ? streamJobs : supported_jobs;
        return dedupe(allJobs.map(item => item.customerName || item.customerGroup || '').filter(Boolean), item => item);
    }

    function summarizeFlow(flow) {
        const steps = flow.steps || [];
        const firstStep = steps[0] || {};
        const lastStep = steps[steps.length - 1] || {};
        return {
            actor: flow.primaryActor || firstStep.actor || '',
            trigger: flow.trigger || firstStep.trigger || '',
            result: flow.successSignal || flow.outcome || lastStep.successSignal || lastStep.output || ''
        };
    }

    function renderStepMeta(label, value) {
        if (!value) {
            return '';
        }
        return '<div class="flow-step-meta-item"><div class="flow-step-meta-label">' + escapeHtml(label) + '</div><div class="flow-step-copy">' + escapeHtml(value) + '</div></div>';
    }

    function flowDependencyIconFile(dependency) {
        const dependencyId = dependency.id || '';
        const linkedBrick = related_bricks.find(brick => brick.id === dependencyId) || all_bricks.find(brick => brick.id === dependencyId) || {};
        return dependency.icon || linkedBrick.icon || (dependencyId ? dependencyId + '.png' : 'brick.png');
    }

    function renderFlowDependencyIcon(dependency, className) {
        return '<img class="' + escapeHtml(className) + '" src="../icons/' + escapeHtml(flowDependencyIconFile(dependency)) + '" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
    }

    function renderStepDependencyPills(step) {
        const dependencies = step.dependencies || [];
        if (!dependencies.length) {
            return '<div class="muted">No step-specific dependencies listed.</div>';
        }

        return '<div class="flow-step-dependencies">' + dependencies.map(dep => {
            const label = dep.name || dep.id || 'Dependency';
            const kind = 'Brick';
            return '<span class="flow-cell-brick">' + renderFlowDependencyIcon(dep, 'flow-cell-brick-icon') + '<span>' + escapeHtml(kind + ': ' + label) + '</span></span>';
        }).join('') + '</div>';
    }

    function simplifySupportCopy(value) {
        const text = String(value || '').trim();
        if (!text) {
            return '';
        }
        const simplified = text.replace(/^Supports .*? by helping users help /i, 'Facilitate ');
        return simplified;
    }
</script>

<script>
    function streamMetaPath(stream) {
        const parts = [];

        }
        if (stream.rootGroup && stream.rootGroup !== stream.group) {
            parts.push(stream.rootGroup);
        }
        if (!parts.length) {
            parts.push('Stream');
        }
        return parts.join(' / ');

        html += '<div class="group"><div class="section-title">Flow Narratives (' + flows.length + ')</div>';
        if (!flows.length) {
            html += '<div class="muted">No flows listed for this stream.</div>';
        } else {
            html += '<div class="card-grid">';
            flows.forEach(flow => {

                html += '<div class="card">';
                html += '<div class="card-meta">' + escapeHtml(streamMetaPath(currentStream)) + '</div>';
                html += '<div class="card-title">' + escapeHtml(flow.title || flow.id) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(flow.description || '') + '</div>';

        document.getElementById('tab_flows').innerHTML = 'Flow Narratives (' + flows.length + ')';

        flows.forEach(flow => {

            html += '<div class="section-title">Flow</div>';
            html += '<div class="flow-title">' + escapeHtml(flow.title || flow.id) + '</div>';
            html += '<div class="flow-description">' + escapeHtml(flow.description || '') + '</div>';
            if (summary.actor || summary.trigger || summary.result) {
                html += '<div class="card" style="margin-bottom:16px;">';
                if (summary.actor) {
                    html += '<div class="card-copy"><strong>Primary actor:</strong> ' + escapeHtml(summary.actor) + '</div>';
                }
                if (summary.trigger) {
                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';

            html += '<div class="section-title">Dependency Traceability</div>';

            html += '<table class="flow-matrix">';
            html += '<thead>';
            html += '<tr><th class="flow-dependency-col"></th>';

            dependenciesInFlow.forEach(dependency => {

            html += '</tbody></table>';
            html += '</div>';
            html += '</div>';
        });

        document.getElementById('tab_content_flows').innerHTML = html;

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';

        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-title">' + escapeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';

                html += '<div class="link-entry">';

                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>
