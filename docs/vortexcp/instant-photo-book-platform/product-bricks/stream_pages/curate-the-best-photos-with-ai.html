    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

Best-photo Selection and Ranking", "description": "Alternatives.", "how": "Receives the cluster alternatives for later swaps."}]}, {"id": "group-photos-into-moments", "title": "Group photos into moments by time, place and people", "actor": "PastBook Platform (automated)", "keyFacts": ["Photos are grouped into moments from time gaps, location changes and recurring faces: a birthday afternoon, a weekend in Lisbon, the first day of school.", "Moments are labelled with the date and place used for chapter pages and captions."], "painPoints": ["A 16-hour flight day and a short beach trip produce moments of very different sizes.", "Photos without location or with a wrong camera clock land in the wrong moment."], "dependencies": [{"type": "brick", "id": "mmnt", "name": "Moment and Event Grouping", "description": "Moment grouping.", "how": "Splits the set into moments using time gaps, places and faces."}, {"type": "brick", "id": "medi", "name": "Photo Media Storage and CDN", "description": "Time and place index.", "how": "Provides the normalised timestamp and place index."}, {"type": "brick", "id": "anly", "name": "Analytics and Experimentation", "description": "Grouping metrics.", "how": "Records moment counts and sizes for quality monitoring."}]}, {"id": "rank-and-select-the-best-photos", "title": "Rank and select the best photos per moment for the target page count", "actor": "PastBook Platform (automated)", "keyFacts": ["Selection balances quality score, moment coverage, people variety and orientation mix to fill the target book (24 pages by default, more when the year is rich) so every moment is represented.", "The target count respects the cover rules: books above 300 pages fall back to softcover, so the selection caps pages unless the customer asks for more."], "painPoints": ["Filling 24 pages from a 40-photo year produces one photo per page and looks empty.", "Over-representing one child in a two-child family is the most common complaint about automatic selection."], "dependencies": [{"type": "brick", "id": "sele", "name": "Best-photo Selection and Ranking", "description": "Selection and ranking.", "how": "Ranks candidates and selects the set for the target page count."}, {"type": "brick", "id": "pric", "name": "Pricing, Page Rules and Currencies", "description": "Page rules.", "how": "Provides the 24-page base and the cover thresholds used for the target."}, {"type": "brick", "id": "mmnt", "name": "Moment and Event Grouping", "description": "Moment coverage.", "how": "Ensures every moment contributes to the selection."}]}, {"id": "hand-the-selection-to-layout", "title": "Hand the selection and alternatives to the layout engine within the budget", "actor": "PastBook Platform (automated)", "keyFacts": ["The selection, moments and alternatives are handed to the layout engine; the whole pipeline is budgeted at under 60 seconds from confirmation to preview.", "Slow sets are streamed: layout starts with the first moments while later ones are still being ranked."], "painPoints": ["Sets of 20,000 photos exceed the budget and need a progress screen instead of a spinner.", "Pipeline failures must fall back to a simpler chronological selection rather than an error."], "dependencies": [{"type": "brick", "id": "sele", "name": "Best-photo Selection and Ranking", "description": "Selection output.", "how": "Publishes the selection result with alternatives."}, {"type": "brick", "id": "layo", "name": "Smart Layout Generator", "description": "Layout input.", "how": "Consumes the selection to build pages."}, {"type": "brick", "id": "anly", "name": "Analytics and Experimentation", "description": "Curation timing.", "how": "Measures pipeline duration against the 60-second budget."}]}]}, {"id": "from-customer-edits-to-a-better-curation-model", "title": "From Customer Edits to a Better Curation Model", "description": "Customer swaps, removals and complaints are fed back as labelled signals, evaluated per source and country and rolled out through experiments.", "primaryActor": "Growth Marketer", "trigger": "Weekly curation quality review or a drop in photo selection acceptance rate.", "successSignal": "A curation model change is tested, its effect on acceptance rate and edits is measured and it is rolled out or rolled back.", "steps": [{"id": "collect-swap-and-removal-signals", "title": "Collect swap, removal and add-back signals from the editor", "actor": "PastBook Platform (automated)", "keyFacts": ["Each photo swap, removal or add-back in the editor is stored as a labelled signal against the quality score, duplicate cluster and moment that produced the choice.", "Signals are aggregated without storing the image; only scores and decisions are kept."], "painPoints": ["Customers who never edit provide no negative signal, so silent dissatisfaction shows up only as non-orders.", "Signals from the web editor and the app editor must be reconciled to the same project."], "dependencies": [{"type": "brick", "id": "edit", "name": "Page and Photo Editor", "description": "Edit events.", "how": "Emits swap, remove and add-back events with photo and moment ids."}, {"type": "brick", "id": "anly", "name": "Analytics and Experimentation", "description": "Signal store.", "how": "Stores and aggregates the labelled signals."}, {"type": "brick", "id": "sele", "name": "Best-photo Selection and Ranking", "description": "Decision context.", "how": "Provides the scores and alternatives behind each decision."}]}, {"id": "measure-acceptance-per-source-and-country", "title": "Measure photo selection acceptance per source, country and set size", "actor": "Growth Marketer", "keyFacts": ["Photo selection acceptance rate (books ordered without swaps or with few) is tracked per source (phone, Facebook, cloud), country and set size.", "Print quality complaint rate is joined to the curation run to see whether low-resolution Facebook photos slipped through."], "painPoints": ["Small segments (Brazil, New Zealand) have too few orders per week for stable rates.", "Seasonal Year in Review books behave differently from trip books and skew the average."], "dependencies": [{"type": "brick", "id": "anly", "name": "Analytics and Experimentation", "description": "Acceptance dashboards.", "how": "Computes acceptance and edit rates per segment."}, {"type": "brick", "id": "qmon", "name": "Production SLA and Quality Monitoring", "description": "Complaint join.", "how": "Links print quality complaints to the curation run."}, {"type": "brick", "id": "revw", "name": "Reviews and Ratings Management", "description": "Review text mining.", "how": "Surfaces curation complaints from Trustpilot and store reviews."}]}, {"id": "run-an-experiment-on-thresholds-or-models", "title": "Run an experiment on thresholds or a new model", "actor": "Growth Marketer", "keyFacts": ["Blur thresholds, near-duplicate similarity, moment gap sizes and ranking weights are changed behind experiment flags for a share of new projects.", "Experiments are stratified by source and country and run until acceptance and conversion are significant."], "painPoints": ["Experiments in Q4 risk the peak; most run in quieter months on smaller volume.", "A model that improves acceptance but increases pages raises price and can lower conversion."], "dependencies": [{"type": "brick", "id": "anly", "name": "Analytics and Experimentation", "description": "Experimentation.", "how": "Assigns projects to variants and evaluates results."}, {"type": "brick", "id": "qual", "name": "Image Quality Scoring", "description": "Threshold variants.", "how": "Exposes configurable thresholds per variant."}, {"type": "brick", "id": "dedu", "name": "Duplicate and Near-duplicate Detection", "description": "Similarity variants.", "how": "Exposes similarity thresholds per variant."}]}, {"id": "evaluate-print-outcomes", "title": "Evaluate print outcomes and reprint causes linked to curation", "actor": "Production and Fulfilment Operations Manager", "keyFacts": ["Reprints caused by low-resolution or dark photos are traced back to the curation thresholds so the resolution rule can be tightened per product size.", "The large 12\" x 8.5\" hardcover needs higher resolution than the small book, and selection must know the target format."], "painPoints": ["A photo fine for a small book is soft on a full-bleed large page.", "Reprint root causes are logged by support in free text and need classification."], "dependencies": [{"type": "brick", "id": "rprt", "name": "Reprint and Refund Handling", "description": "Reprint causes.", "how": "Provides reprint cases with quality causes."}, {"type": "brick", "id": "pflt", "name": "Preflight and Print Quality Checks", "description": "Resolution findings.", "how": "Reports low-resolution warnings per print job."}, {"type": "brick", "id": "qual", "name": "Image Quality Scoring", "description": "Format-aware thresholds.", "how": "Adjusts minimum resolution per target format."}]}, {"id": "roll-out-and-document", "title": "Roll out the winning variant and document the change", "actor": "Growth Marketer", "keyFacts": ["The winning variant becomes the default for all new projects; open projects keep their curation to avoid changing a book the customer already saw.", "The change and its measured effect are documented for the product team and the support team."], "painPoints": ["Customers comparing a book made before and after the change notice different selections for the same photos.", "Rolling back after a bad peak-season release is costly when thousands of previews were already generated."], "dependencies": [{"type": "brick", "id": "anly", "name": "Analytics and Experimentation", "description": "Rollout flags.", "how": "Switches the default variant and monitors post-rollout metrics."}, {"type": "brick", "id": "sele", "name": "Best-photo Selection and Ranking", "description": "Default configuration.", "how": "Applies the new thresholds and weights."}, {"type": "brick", "id": "help", "name": "Help Center and Self-service", "description": "Support notes.", "how": "Documents the change for support agents."}]}]}], "outcomes": ["A book from 3,000 photos is curated in under 60 seconds with blurry, dark and duplicate shots removed and every important moment represented", "Photo selection acceptance rate rises so most customers order without editing, and the curation learns from every swap and removal", "Curation quality is measurable per source and country and can be improved with experiments without changing the app"], "brickDependencies": [{"targetBrickId": "qual", "type": "composition"}, {"targetBrickId": "dedu", "type": "composition"}, {"targetBrickId": "mmnt", "type": "composition"}, {"targetBrickId": "sele", "type": "composition"}, {"targetBrickId": "medi", "type": "composition"}, {"targetBrickId": "anly", "type": "composition"}, {"targetBrickId": "phot", "type": "composition"}, {"targetBrickId": "fbim", "type": "composition"}, {"targetBrickId": "edit", "type": "composition"}, {"targetBrickId": "layo", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "Meta Graph API and Facebook Login", "type": "social-platform-api", "interface": "OAuth login, user_photos permission, albums, timeline, cover and profile photo endpoints", "description": "The platform through which Facebook Photo Books imports albums, timeline pictures, cover and profile photos and mobile uploads with captions, under Meta Platform Terms and app review; the same policy shift closed the Instagram channel for personal accounts."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []};

    mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        flowchart: {
            htmlLabels: false
        }
    });

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

    function getFlows() {
        return currentStream.flows || [];
    }

    function getFlowDependencies(flow) {
        const dependencyIndex = new Map();
        (flow.steps || []).forEach(step => {
            (step.dependencies || []).forEach(dependency => {
                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());
    }

    function getStepDependency(step, dependency) {
        return (step.dependencies || []).find(item => (item.type || '') === (dependency.type || '') && (item.id || '') === (dependency.id || '')) || null;
    }

    function getPrimaryActors() {
        const streamJobs = currentStream.supportedCustomerJobs || [];
        const allJobs = streamJobs.length ? streamJobs : supported_jobs;
        return dedupe(allJobs.map(item => item.customerName || item.customerGroup || '').filter(Boolean), item => item);
    }

    function summarizeFlow(flow) {
        const steps = flow.steps || [];
        const firstStep = steps[0] || {};
        const lastStep = steps[steps.length - 1] || {};
        return {
            actor: flow.primaryActor || firstStep.actor || '',
            trigger: flow.trigger || firstStep.trigger || '',
            result: flow.successSignal || flow.outcome || lastStep.successSignal || lastStep.output || ''
        };
    }

    function renderStepMeta(label, value) {
        if (!value) {
            return '';
        }
        return '<div class="flow-step-meta-item"><div class="flow-step-meta-label">' + escapeHtml(label) + '</div><div class="flow-step-copy">' + escapeHtml(value) + '</div></div>';
    }

    function flowDependencyIconFile(dependency) {
        const dependencyId = dependency.id || '';
        const linkedBrick = related_bricks.find(brick => brick.id === dependencyId) || all_bricks.find(brick => brick.id === dependencyId) || {};
        return dependency.icon || linkedBrick.icon || (dependencyId ? dependencyId + '.png' : 'brick.png');
    }

    function renderFlowDependencyIcon(dependency, className) {
        return '<img class="' + escapeHtml(className) + '" src="../icons/' + escapeHtml(flowDependencyIconFile(dependency)) + '" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
    }

    function renderStepDependencyPills(step) {
        const dependencies = step.dependencies || [];
        if (!dependencies.length) {
            return '<div class="muted">No step-specific dependencies listed.</div>';
        }

        return '<div class="flow-step-dependencies">' + dependencies.map(dep => {
            const label = dep.name || dep.id || 'Dependency';
            const kind = 'Brick';
            return '<span class="flow-cell-brick">' + renderFlowDependencyIcon(dep, 'flow-cell-brick-icon') + '<span>' + escapeHtml(kind + ': ' + label) + '</span></span>';
        }).join('') + '</div>';
    }

    function simplifySupportCopy(value) {
        const text = String(value || '').trim();
        if (!text) {
            return '';
        }
        const simplified = text.replace(/^Supports .*? by helping users help /i, 'Facilitate ');
        return simplified;
    }

                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';
                }
                html += '</div>';
            }

            html += '<div class="section-title">Dependency Traceability</div>';
            html += '<div class="flow-matrix-wrap">';
            html += '<table class="flow-matrix">';
            html += '<thead>';
            html += '<tr><th class="flow-dependency-col"></th>';
            (flow.steps || []).forEach((step, index) => {
                html += '<th class="flow-step-col"><div class="flow-step-label">Step ' + (index + 1) + '</div><div class="card-title">' + escapeHtml(step.title || step.id) + '</div></th>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right">Key Facts</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkblue">';
                if ((step.keyFacts || []).length) {
                    html += '<ul class="flow-insight-list">' + step.keyFacts.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No key facts listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right; color: darkred">Pain Points</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkred">';
                if ((step.painPoints || []).length) {
                    html += '<ul class="flow-insight-list">' + step.painPoints.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No pain points listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';
            html += '</thead><tbody>';

            dependenciesInFlow.forEach(dependency => {
                const dependencyTypeLabel = 'Product Brick';
                html += '<tr>';
                html += '<td>';
                html += '<div class="flow-dependency-header">';
                html += renderFlowDependencyIcon(dependency, 'flow-dependency-icon');
                html += '<div>';
                html += '<a class="flow-dependency-name" href="../landing_pages/' + escapeHtml(dependency.id) + '.html">' + escapeHtml(dependency.name || dependency.id) + '</a>';
                if (dependency.interface) {
                    html += '<div class="muted">' + escapeHtml(dependency.interface) + '</div>';
                }
                html += '</div>';
                html += '</div>';
                html += '</td>';
                (flow.steps || []).forEach(step => {
                    const stepDependency = getStepDependency(step, dependency);
                    if (!stepDependency) {
                        html += '<td class="flow-cell-empty">-</td>';
                        return;
                    }
                    html += '<td class="flow-cell-active">';
                    html += '<div class="flow-cell-copy">' + escapeHtml(simplifySupportCopy(stepDependency.how || stepDependency.description || 'Supports this step.')) + '</div>';
                    html += '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            html += '</div>';
            html += '</div>';
        });

        document.getElementById('tab_content_flows').innerHTML = html;
    }

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';
        }
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-title">' + escapeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                count++;
                html += '<div class="link-entry">';
                html += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(link.link || '#') + '">'
                    + escapeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>


<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Instant Photo Book Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Streams Index"
    },
    {
      "label": "Curate the Best Photos with AI"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
