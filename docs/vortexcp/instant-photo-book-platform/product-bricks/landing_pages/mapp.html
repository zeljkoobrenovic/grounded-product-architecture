    <style>
    .tab {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 4px;
    }

    .tab button {
        position: relative;
        background-color: transparent;
        border: none;
        outline: none;
        cursor: pointer;
        padding: 11px 16px;
        margin-bottom: -1px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        color: #6b7280;
        border-bottom: 2px solid transparent;
        border-radius: 8px 8px 0 0;
        transition: color 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
    }

    .tab button:hover {
        color: #1f2937;
        background-color: #f3f4f6;
    }

    .tab button:focus-visible {
        outline: 2px solid #1d4ed8;
        outline-offset: -2px;
    }

    .tab button.active {
        color: #1d4ed8;
        border-bottom-color: #1d4ed8;
    }

    .tabcontent {
        display: none;
        padding: 2px 2px;
        animation: tabContentFade 0.2s ease;
    }

    @keyframes tabContentFade {
        from {
            opacity: 0;
            transform: translateY(3px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 720px) {
        .tab {
            flex-direction: column;
            gap: 0;
        }

        .tab button {
            width: 100%;
            text-align: left;
            margin-bottom: 0;
            border-bottom: 1px solid #e5e7eb;
            border-radius: 0;
        }

        .tab button.active {
            border-bottom-color: #1d4ed8;
        }
    }

    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);

ersonalisation builds on.", "usedInSteps": [{"step": "Start from the automatic design, never from a blank page", "description": "Open the book the engine designed and treat it as the first draft: the moments, the layouts and the dates are already there, so the customer looks for what to change rather than what to build. This is the difference from Mixbook or a professional album tool, and the reason a wedding book can be finished in an evening.", "howItSupports": "Delivers the laid-out first draft with moments, layouts and dates that all personalisation builds on.", "media": []}, {"step": "Choose the cover photo, the title, a quote and the theme colours", "description": "Pick the one photo that carries the event for the cover, add a title and a quote for the first page, set theme colours that suit a wedding or a mountain trip, and add the back-cover photo add-on. These four choices are what make the book recognisably theirs and are where most customers spend their editing time.", "howItSupports": "Provides cover photo choice, theme colours, quote and title, and the back-cover photo add-on on top of the automatic design.", "media": []}, {"step": "Reorder pages along the itinerary and swap the photos that matter", "description": "Move a page so that the arrival in Kyoto comes before the temples, swap the group photo for the one where everyone has their eyes open, remove the picture of the hotel breakfast. Edits must be reversible and saved as they happen, on the phone and on the web, because an hour of reordering lost to a crash ends the project.", "howItSupports": "Lets the customer reorder pages, swap and remove photos with edits saved continuously across app and web creator.", "media": []}, {"step": "Add captions with places, dates and names", "description": "Write captions naming the town, the day and the people, using the dates and locations the engine already attached to each moment as a starting point, so the book can be read by someone who was not there. Suggested place and date captions cut the typing to the personal part.", "howItSupports": "Adds and edits captions on pages and moments inside the finished design.", "media": []}]}, {"customerId": "trvl", "customerName": "Traveller and Milestone Celebrant", "customerGroup": "Memory Keepers", "customerIcon": "customer-trvl-portrait.jpg", "productId": "pastbook-app", "productName": "PastBook: 1-Click Photo Book App", "productIcon": "pastbook-app.png", "jobId": "jtbd-trvl-3", "jobName": "Get a book whose print quality matches the moment", "jobWhatItIs": "Receive a Large Hardcover whose colour, sharpness, binding and packaging live up to a wedding, a once-in-a-decade trip or a first year, and be protected when they do not. The job spans choosing the format that shows the photos best, having weak photos flagged before they are printed, production at a partner in the customer's country on FSC paper, careful shipping, and a fast reprint when something is wrong.", "jobOutcome": "The book arrives within the window, without print, binding or transport defects, with colours the customer recognises from the screen and no low-resolution photo printed large, and any defect is corrected with a reprint within days rather than a debate.", "supportRationale": "Packs, ships and tracks the parcel within the published window and exposes the status to the customer.", "usedInSteps": [{"step": "Receive the book well packed and on time", "description": "Get the hardcover packed to survive the carrier, shipped with tracking and delivered within the window published for the country, so it can be given at the anniversary dinner or the graduation party. A corner crushed in transit counts as a quality failure to this customer, whoever caused it.", "howItSupports": "Packs, ships and tracks the parcel within the published window and exposes the status to the customer.", "media": []}]}, {"customerId": "gftr", "customerName": "Seasonal Gift Giver", "customerGroup": "Memory Keepers", "customerIcon": "customer-gftr-portrait.jpg", "productId": "pastbook-app", "productName": "PastBook: 1-Click Photo Book App", "productIcon": "pastbook-app.png", "jobId": "jtbd-gftr-1", "jobName": "Get a personalised gift delivered before the date", "jobWhatItIs": "Turn a year of family photos into a printed present that reaches the recipient, often at another address, before Christmas, Mother's Day or a birthday. The job covers knowing the last safe order date for the recipient's country, building the Year in Review book or calendar from the phone in a minute, adding a dedication, paying with the seasonal discount, shipping to the recipient and watching the tracking until it is delivered.", "jobOutcome": "The gift is ordered before the published order-by date, produced within the promised production time, delivered to the recipient's address inside the published window for that country and before the occasion, and the giver never has to explain a missing present.", "supportRationale": "Provides the production times and published delivery windows per country that the order-by dates are derived from.", "usedInSteps": [{"step": "Work back from the occasion to the order-by date", "description": "The giver checks how long production plus delivery takes for the recipient's country, for example 4 to 8 business days in the United States or 5 to 10 in Canada after production, and knows that a multi-product order ships on the longest production time. The seasonal campaign should state the last order date rather than leave the arithmetic to the giver.", "howItSupports": "Provides the production times and published delivery windows per country that the order-by dates are derived from.", "media": []}, {"step": "Gather the year's photos of the recipient's favourite people", "description": "From the phone camera roll by date or album, from a Facebook year, or from a shared family album, the giver pulls the photos of the grandchildren or of the couple that the recipient will want to see, without sorting through thousands of screenshots.", "howItSupports": "Imports the camera roll by date, album or Yearbook mode and from Dropbox or Google Drive, with timestamps that make a Year in Review possible.", "media": []}, {"step": "Let the engine make the Year in Review in a minute", "description": "The curation engine drops duplicates and blurry shots, groups the year into moments and lays out the book or calendar with dates, so the giver sees a finished present in under 60 seconds and shares the highlight video with a sibling to check nobody is missing.", "howItSupports": "Produces the Year in Review book or calendar preview and the shareable highlight video the giver uses to get a second opinion.", "media": []}, {"step": "Add a dedication and the right cover", "description": "A cover photo of the grandparents with the children, a quote on the first page and the year on the spine make it a present. The giver wants to do this in a few taps and not learn a layout tool on a December evening.", "howItSupports": "Lets the giver choose the cover photo, theme colours, a quote and a back-cover photo without touching the automatic layout.", "media": []}, {"step": "Track the parcel and step in if it slips", "description": "Because the parcel goes to someone else's door, the giver watches the tracking and wants a warning early enough to reorder, send a gift card or tell the recipient, and a fast reprint if the gift arrives damaged.", "howItSupports": "Produces the order at the partner facility nearest the recipient, ships it and provides tracking with delivery estimates.", "media": []}]}, {"customerId": "gftr", "customerName": "Seasonal Gift Giver", "customerGroup": "Memory Keepers", "customerIcon": "customer-gftr-portrait.jpg", "productId": "pastbook-app", "productName": "PastBook: 1-Click Photo Book App", "productIcon": "pastbook-app.png", "jobId": "jtbd-gftr-2", "jobName": "Pick the right product, size and price for the recipient", "jobWhatItIs": "Choose, for each person on the list, the PastBook product that fits them and the budget: a large hardcover for the parents, a wall calendar for the grandparents' kitchen, a folded or rolled poster for a partner, gift cards for those with their own photos. The job includes understanding cover rules and page-count pricing, using the promotion on the whole basket and bundling several products into one order.", "jobOutcome": "Every recipient gets a product they will actually use, the giver knows the full price including extra pages and shipping before checkout, the promotion applies to every item in the basket and the whole order ships together on time.", "supportRationale": "Lets the giver remove or add photos to land on the page count and cover they want to pay for.", "usedInSteps": [{"step": "Understand what the page count does to cover and price", "description": "Up to 16 pages is softcover, 18 to 26 pages a choice, 27 to 300 pages hardcover by default; every page above 24 costs USD 0.40 small or USD 0.55 large. The giver wants this visible while adding or removing photos, not at the last screen.", "howItSupports": "Lets the giver remove or add photos to land on the page count and cover they want to pay for.", "media": []}, {"step": "Check the gift through the recipient's eyes", "description": "The giver previews the calendar month by month to see that the grandparents' birthdays fall on months with their photos, and sends the highlight video to a sibling to confirm the choice before paying.", "howItSupports": "Shows the full preview of each product for free and produces the highlight video the giver shares for a second opinion.", "media": []}]}, {"customerId": "gftr", "customerName": "Seasonal Gift Giver", "customerGroup": "Memory Keepers", "customerIcon": "customer-gftr-portrait.jpg", "productId": "pastbook-app", "productName": "PastBook: 1-Click Photo Book App", "productIcon": "pastbook-app.png", "jobId": "jtbd-gftr-3", "jobName": "Give when I have no photos: gift cards and shared albums", "jobWhatItIs": "Give a PastBook present when the photos are on someone else's phone: a gift card so the new parents make their own first-year book, or an album the family fills together before the giver orders the book. The job includes buying the card in the right currency, helping a less technical recipient install the app and redeem it, and coming back next year.", "jobOutcome": "The gift card is bought and delivered before the occasion, redeemed by the recipient for a product they chose themselves, and the giver is reminded in time for the next occasion, so a present without photos still ends as a printed book.", "supportRationale": "Imports a shared phone album or a Dropbox or Google Drive folder that the family has filled together.", "usedInSteps": [{"step": "Collect the photos the family holds", "description": "For a first-year book of a nephew, the giver asks the parents to share an album from their phone or a Google Drive folder, so the photos exist in one place before anyone builds a book.", "howItSupports": "Imports a shared phone album or a Dropbox or Google Drive folder that the family has filled together.", "media": []}, {"step": "Help the recipient install the app and redeem", "description": "A grandparent who receives a gift card needs to find the PastBook app, allow photo access and enter the code. The giver wants a link that does all three and a helpline that answers if it goes wrong.", "howItSupports": "Gets the recipient from the gift card e-mail to an installed app with photo-library permission granted.", "media": []}, {"step": "Come back for the next occasion", "description": "Once the recipient has made a book, the giver wants a reminder before the next Mother's Day or Christmas, with the recipient's addresses saved and the products they liked remembered.", "howItSupports": "Sends occasion reminders to the giver with saved recipients and the products ordered last time, and prompts a rating after delivery.", "media": []}]}, {"customerId": "fmly", e PastBook app and grant access to the camera roll", "description": "Find the PastBook: 1-Click Photo Book app in the App Store or Google Play, often from an ad, a featured placement or a friend's book, install it and grant photo-library permission with a clear explanation of what is uploaded and why. The decision here is trust: the app will read years of family photos, so the permission screen and the privacy wording have to be honest before anything else happens.", "howItSupports": "Explains consent and encrypted transfer at the permission screen and keeps the app within App Store and Google Play privacy-label rules, so granting access feels safe.", "media": []}, {"step": "Pick the year in Yearbook mode and let the photos import", "description": "Choose Yearbook mode and the calendar year, or a date range and an album for a school year or a holiday, and let the app index the photos with timestamps and locations over an encrypted connection. The friction to avoid is waiting: with 12,000 photos in a year, import has to run in the background and show progress instead of blocking the screen.", "howItSupports": "Indexes the camera roll by date, location, album or Yearbook mode into a photo set with timestamps and locations, uploaded over encrypted connections.", "media": []}, {"step": "Let the engine curate the year and lay out the book, then preview it", "description": "Wait under 60 seconds while image quality and context are analysed, duplicates and blurry shots removed and photos grouped into moments, then look at the free preview of the laid-out book with cover, theme colours and dates. The parent decides at moment level, not photo level: is Christmas there, is the first day of school there, does the cover show the right child.", "howItSupports": "Lays out the curated moments into a book with cover, theme colours and captions and shows a free preview in under a minute, plus a shareable highlight video.", "media": []}, {"step": "Receive the printed yearbook within , the holiday and the grandparents' visit are there and that the cover photo is the right one. The decision is whether the year is complete, which takes two minutes, rather than whether each of 5,000 photos was judged correctly.", "howItSupports": "Shows the book as laid-out pages grouped by moment with dates, so completeness can be judged in a glance rather than photo by photo.", "media": []}, {"step": "Fix the few exceptions with a swap, a removal or a caption", "description": "Swap the one photo where a sibling is cut off, remove a picture of a receipt that slipped in, add a caption to the first-day-of-school page or change the theme colour, all inside the automatic design and without touching the other pages. Edits must be cheap and rare; if a parent needs to fix twenty pages, the curation has failed.", "howItSupports": "Lets the parent reorder, swap or remove individual photos and add captions, cover photo and theme colours inside the automatic design without redoing the book.", "media": []}, {"step": "Keep the children's photos private throughout", "description": "Know that the photos travel encrypted, are used only to produce the book and the preview, are never shared beyond the printing partner, and can be deleted from the account on request under GDPR or CCPA. For a parent this is not a legal detail but the condition for handing over a childhood.", "howItSupports": "Handles consent, encrypted transfer and storage, deletion rights and app-store privacy labels for the personal photos the book is made from.", "media": []}]}, {"customerId": "fmly", "customerName": "Family Memory Keeper", "customerGroup": "Memory Keepers", "customerIcon": "customer-fmly-portrait.jpg", "productId": "year-in-review-photo-book", "productName": "Year in Review Photo Book", "productIcon": "year-in-review-photo-book.png", "jobId": "jtbd-fmly-3", "jobName": "Make the yearbook an annual habit for the family", "jobWhatItIs": "Turn the first yearbook into a shelf: a book for every year of the children's lives, a school-year book per child, a calendar for the kitchen and copies for the grandparents, ordered without a fresh decision each time. The job is to make PastBook the family's memory ritual, prompted at the right moment, catching up on missed years and gifting copies, so that the shelf grows every year.", "jobOutcome": "The family orders at least two products a year, the new yearbook is ordered within weeks of the year ending, missing past years are filled in, and grandparents receive their own copies, with the parent spending minutes rather than an evening each time.", "supportRationale": "Sends yearbook and calendar reminders timed to the end of the year and the holidays, reopening the app with the next book suggested.", "usedInSteps": [{"step": "Be reminded when the year closes and the book is ready to make", "description": "Receive a push notification or e-mail in early January and after the summer holiday saying the next yearbook can be made from the photos already on the phone, ideally with a preview of the cover. The reminder has to arrive when the photos are fresh and the calendar is quiet, not in the middle of the Q4 rush.", "howItSupports": "Sends yearbook and calendar reminders timed to the end of the year and the holidays, reopening the app with the next book suggested.", "media": []}, {"step": "Fill in the missing years from the camera roll", "description": "Go back to the years before the first PastBook order, pick each one in Yearbook mode and let the engine make the books, so the shelf starts at the first child's birth and not at the year the app was discovered. Catch-up orders are often two or three books at once, which changes the price conversation.", "howItSupports": "Imports older years from the camera roll by date so past years can be made into books the same way as the current one.", "media": []}, {"step": "Fill in the missing years from the camera roll", "description": "Go back to the years before the first PastBook order, pick each one in Yearbook mode and let the engine make the books, so the shelf starts at the first child's birth and not at the year the app was discovered. Catch-up orders are often two or three books at once, which changes the price conversation.", "howItSupports": "Suggests missing past years and reorders of earlier books from the order history.", "media": []}, {"step": "Gift copies to the grandparents", "description": "Order a second and third copy of the yearbook shipped directly to the grandparents in another city or another country, before Christmas or a birthday, with tracking for each parcel. Multi-copy orders make the price per book and the delivery date the two things she checks.", "howItSupports": "Makes gifting copies of an existing book to family a one-tap reorder from the account.", "media": []}, {"step": "Gift copies to the grandparents", "description": "Order a second and third copy of the yearbook shipped directly to the grandparents in another city or another country, before Christmas or a birthday, with tracking for each parcel. Multi-copy orders make the price per book and the delivery date the two things she checks.", "howItSupports": "Ships each copy to its own address within the published delivery window with separate tracking.", "media": []}, {"step": "Rate the book and recommend PastBook to other parents", "description": "Answer the rating prompt after the book arrives, leave a Trustpilot or App Store review, share the highlight video with the family group chat and pass the app on to other parents at school. The advocacy moment is the book in the hands of a grandparent.", "howItSupports": "Times rating prompts after delivery and feeds Trustpilot and App Store ratings that other parents rely on.", "media": []}]}, {"customerId": "sclk", "customerName": "Facebook Timeline Archivist", "customerGroup": "Memory Keepers", "customerIcon": "customer-sclk-portrait.jpg", "productId": "year-in-review-photo-book", "productName": "Year in Review Photo Book", "productIcon": "year-in-review-photo-book.png", "jobId": "jtbd-sclk-1", "jobName": "Print a whole Facebook year with captions in one click", "jobWhatItIs": "Turn one calendar year of a Facebook life, spread over albums, timeline pictures, cover and profile photos and mobile uploads, into a printed hardcover without selecting photos or designing pages. The job includes granting Facebook Login, picking the year, letting the curation engine drop duplicates and blurry shots while keeping the captions and dates, checking the free preview and paying for a book that matches the years already on the shelf.", "jobOutcome": "A finished hardcover of the chosen year, with captions and dates preserved and no duplicate or blurry photos, previewed for free in under a minute, ordered at a price the archivist understood before checkout and delivered within the published window for their country.", "supportRationale": "Explains what is imported and for how long it is kept, and keeps the Facebook connection inside Meta platform terms.", "usedInSteps": [{"step": "Log in with Facebook and understand the permission screen", "description": "On pastbook.com the archivist opens Facebook Photo Books, signs in with Facebook and is asked which photo permissions to grant. The step succeeds when the permission request is explained in plain words, covers albums, timeline pictures, cover and profile photos and mobile uploads within the scope Meta allows, and the archivist knows the photos are imported over an encrypted connection.", "howItSupports": "Explains what is imported and for how long it is kept, and keeps the Facebook connection inside Meta platform terms.", "media": []}, {"step": "Let the engine choose the best photos and keep the captions", "description": "The curation engine scores quality, removes duplicates and blurry shots and groups the year into moments in under 60 seconds. For a Facebook year the captions and posting dates are the point of the book, so they must survive selection and land next to the photo they belonged to.", "howItSupports": "Lays out the moments with the captions and dates as page text and produces the free preview in under a minute.", "media": []}, {"step": "Check the preview and fix only what matters", "description": "The archivist flips through the preview, changes the cover photo to the grandchild's birthday and corrects one caption that Facebook auto-tagged wrongly, but does not want to learn an editor. Anything more than a few clicks and the book is abandoned.", "howItSupports": "Shows the complete book for free so the decision to buy is made on the actual pages.", "media": []}, {"step": "Check the preview and fix only what matters", "description": "The archivist flips through the preview, changes the cover photo to the grandchild's birthday and corrects one caption that Facebook auto-tagged wrongly, but does not want to learn an editor. Anything more than a few clicks and the book is abandoned.", "howItSupports": "Lets the archivist swap the cover photo, remove a photo and edit a caption without leaving the automatic layout.", "media": []}, {"step": "Receive the book and see that it matches the shelf", "description": "Production starts on payment, the book is printed in the archivist's country where possible and delivered within the published window, for example 4 to 8 business days in the United States or 5 to 10 in Australia. The archivist compares spine, size and cover with the earlier years.", "howItSupports": "Produces, ships and tracks the book within the published delivery window and keeps the archivist informed with tracking updates.", "media": []}]}, {"customerId": "sclk", "customerName": "Facebook Timeline Archivist", "customerGroup": "Memory Keepers", "customerIcon": "customer-sclk-portrait.jpg", "productId": "year-in-review-photo-book", "productName": "Year in Review Photo Book", "productIcon": "year-in-review-photo-book.png", "jobId": "jtbd-sclk-2", "jobName": "Keep my photos safe and private while the book is made", "jobWhatItIs": "Be certain that connecting Facebook to PastBook does not expose family photos, including grandchildren, to anyone beyond the print job. The job covers understanding the permission screen, knowing where the photos go and for how long, being able to disconnect and delete, and getting a human answer when a permission request or a platform change such as the end of Instagram support raises doubts.", "jobOutcome": "The archivist connects Facebook knowing exactly which photos are read and why, the photos are transferred and stored encrypted only for as long as the order needs, disconnection and deletion work on request within the legal deadlines, and no privacy question stays unanswered for more than a day.", "supportRationale": "Provides the consent explanation, the privacy notice and the retention rules that the permission screen and help center repeat.", "usedInSteps": [{"step": "Understand what is asked before connecting", "description": "Before clicking Continue with Facebook the archivist wants to know why PastBook asks for photo permissions, that it reads but does not post, and what happens to the photos after the book is printed. A help center article and a sentence on the permission screen do this job.", "howItSupports": "Provides the consent explanation, the privacy notice and the retention rules that the permission screen and help center repeat.", "media": []}, {"step": "Import over an encrypted connection and keep photos only for the order", "description": "Photos are imported over encrypted connections, stored for the book project and the print job, and not retained beyond the order without the archivist's choice to keep the project for reorders.", "howItSupports": "Enforces encrypted transfer and storage, retention limits after delivery and the Meta platform terms on Facebook data.", "media": []}, {"step": "Disconnect or delete when I want to", "description": "After the book has arrived the archivist may want to disconnect Facebook or ask PastBook to delete the photos and the account. Under GDPR and CCPA this must work through the account or a single e-mail, with confirmation.", "howItSupports": "Handles GDPR and CCPA rights requests, disconnects the Facebook source and deletes photos, book projects and the account on request.", "media": []}, {"step": "Get a straight answer when a platform changes the rules", "description": "When Instagram ended support for third-party photo products the archivist lost a source overnight; the same could happen to a Facebook permission. The archivist wants a plain notice about what changed, what still works and what to do with the years not yet printed.", "howItSupports": "Tracks Meta platform and app review changes and publishes what they mean for customers, as with the Instagram notice.", "media": []}, {"step": "Get a straight answer when a platform changes the rules", "description": "When Instagram ended support for third-party photo products the archivist lost a source overnight; the same could happen to a Facebook permission. The archivist wants a plain notice about what changed, what still works and what to do with the years not yet printed.", "howItSupports": "Points the archivist to Facebook, the app or manual upload so the unprinted years are not lost when a source disappears.", "media": []}]}, {"customerId": "sclk", "customerName": "Facebook Timeline Archivist", "customerGroup": "Memory Keepers", "customerIcon": "customer-sclk-portrait.jpg", "productId": "year-in-review-photo-book", "productName": "Year in Review Photo Book", "productIcon": "year-in-review-photo-book.png", "jobId": "jtbd-sclk-3", "jobName": "Reorder past years and gift copies to family", "jobWhatItIs": "Complete the shelf year by year and share it: reorder a year printed before in the same size, print the next missing year, and send extra copies of a wedding or a grandchild's first year to children and siblings in another city or country, ideally with a discount and without re-doing the book.", "jobOutcome": "Every past book can be reordered from the account in a few clicks, extra copies ship to family addresses in other countries within their published delivery windows, and the archivist orders at least one more Facebook year within twelve months of the first.", "supportRationale": "Keeps the past book projects and orders available for reorders and shows which years of 2009 to 2025 are still missing.", "usedInSteps": [{"step": "Find the past books in my account", "description": "The archivist logs in and sees the books already made, by year, with the format and page count, so a reorder or a copy for a sibling starts from the finished book rather than from Facebook again.", "howItSupports": "Keeps the past book projects and orders available for reorders and shows which years of 2009 to 2025 are still missing.", "media": []}, {"step": "Pick the next missing year", "description": "A reminder in January, or a memory that pops up on Facebook, prompts the archivist to print the next year. The Facebook connection is re-used if it is still valid or re-authorised in one step.", "howItSupports": "Sends yearbook reminders that name the missing years and the current promotion.", "media": []}, {"step": "Send copies to family in other countries", "description": "A daughter in the UK and a brother in Canada each get a copy of 2012, the year the first grandchild was born. The archivist needs one order with several addresses, prices in their own currency and delivery windows per country, for example 4 to 5 business days in the UK and 5 to 10 in Canada.", "howItSupports": "Routes each copy to a partner facility near the recipient and delivers within the published window per country.", "media": []}, {"step": "Track the copies and fix a problem without stress", "description": "Copies to three countries mean three parcels; the archivist wants one place with tracking for all of them and a quick reprint if a copy arrives damaged before a birthday.", "ho ook, the giver wants a reminder before the next Mother's Day or Christmas, with the recipient's addresses saved and the products they liked remembered.", "howItSupports": "Sends occasion reminders to the giver with saved recipients and the products ordered last time, and prompts a rating after delivery.", "media": []}]}, {"customerId": "fmly", "customerName": "Family Memory Keeper", "customerGroup": "Memory Keepers", "customerIcon": "customer-fmly-portrait.jpg", "productId": "photo-calendars", "productName": "Photo Wall Calendars", "productIcon": "photo-calendars.png", "jobId": "jtbd-fmly-1", "jobName": "Turn a year of phone photos into a finished yearbook in minutes", "jobWhatItIs": "Get from a camera roll of tens of thousands of photos to a printed hardcover yearbook of one calendar year without designing a page, choosing a template or dragging photos around. The job is to compress the whole photo-book project into a few minutes on the phone: pick the year, let the curation engine and the layout generator do the work, glance at the preview, choose the size and pay, and let production and shipping happen in the background.", "jobOutcome": "A hardcover yearbook of the chosen year is ordered in under ten minutes from opening the app, with every month represented, without the parent having reviewed individual photos, and it arrives within the published delivery window for her country.", "supportRationale": "Takes the parent from an ad, an App Store feature or a friend's book to an installed app with photo-library permission granted, the precondition for Yearbook mode.", "usedInSteps": [{"step": "Install the PastBook app and grant access to the camera roll", "description": "Find the PastBook: 1-Click Photo Book app in the App Store or Google Play, often from an ad, a featured placement or a friend's book, install it and grant photo-library permission with a clear explanation of what is uploaded and why. The decision here is trust: the app will read years of family photos, so the permission screen and the privacy wording have to be honest before anything else happens.", "howItSupports": "Takes the parent from an ad, an App Store feature or a friend's book to an installed app with photo-library permission granted, the precondition for Yearbook mode.", "media": []}, {"step": "Install the PastBook app and grant access to the camera roll", "description": "Find the PastBook: 1-Click Photo Book app in the App Store or Google Play, often from an ad, a featured placement or a friend's book, install it and grant photo-library permission with a clear explanation of what is uploaded and why. The decision here is trust: the app will read years of family photos, so the permission screen and the privacy wording have to be honest before anything else happens.", "howItSupports": "Explains consent and encrypted transfer at the permission screen and keeps the app within App Store and Google Play privacy-label rules, so granting access feels safe.", "media": []}, {"step": "Pick the year in Yearbook mode and let the photos import", "description": "Choose Yearbook mode and the calendar year, or a date range and an album for a school year or a holiday, and let the app index the photos with timestamps and locations over an encrypted connection. The friction to avoid is waiting: with 12,000 photos in a year, import has to run in the background and show progress instead of blocking the screen.", "howItSupports": "Indexes the camera roll by date, location, album or Yearbook mode into a photo set with timestamps and locations, uploaded over encrypted connections.", "media": []}, {"step": "Let the engine curate the year and lay out the book, then preview it", "description": "Wait under 60 seconds while image quality and context are analysed, duplicates and blurry shots removed and photos grouped into moments, then look at the free preview of the laid-out book with cover, theme colours and dates. The parent decides at moment level, not photo level: is Christmas there, is the first day of school there, does the cover show the right child.", "howItSupports": "Lays out the curated moments into a book with cover, theme colours and captions and shows a free preview in under a minute, plus a shareable highlight video.", "media": []}, {"step": "Receive the printed yearbook within the delivery window", "description": "Production starts on payment; the print-ready file is routed to a partner facility in her country and the book ships with tracking, 4 to 8 business days after production in the United States, 5 to 10 in Canada and Australia. The parent wants a single status she can trust and a date she can plan around, not a chain of carrier e-mails.", "howItSupports": "Produces, packs, ships and tracks the parcel within the published delivery window and surfaces the status in the app and by e-mail.", "media": []}]}, {"customerId": "fmly", "customerName": "Family Memory Keeper", "customerGroup": "Memory Keepers", "customerIcon": "customer-fmly-portrait.jpg", "productId": "photo-calendars", "productName": "Photo Wall Calendars", "productIcon": "photo-calendars.png", "jobId": "jtbd-fmly-2", "jobName": "Trust the automatic selection so I do not have to review 5,000 photos", "jobWhatItIs": "Rely on the curation engine to choose the photos a parent would have chosen, so that the promise of a one-click book is real and not a preview she has to rebuild by hand. The job covers understanding what the engine does with duplicates, blur and moments, checking the result at a glance, correcting the few exceptions with a swap or a caption, and knowing that photos of her children are handled privately and can be deleted.", "jobOutcome": "The parent accepts the automatic selection for the large majority of pages, changes at most a handful of photos per book, never scrolls the full camera roll inside the app, and feels confident that the children's photos were used only to make her book.", "supportRationale": "Shows the book as laid-out pages grouped by moment with dates, so completeness can be judged in a glance rather than photo by photo.", "usedInSteps": [{"step": "Check the preview at moment level, not photo level", "description": "Flip through the laid-out book by month and moment, checking that the birthdays, the first day of school, the holiday and the grandparents' visit are there and that the cover photo is the right one. The decision is whether the year is complete, which takes two minutes, rather than whether each of 5,000 photos was judged correctly.", "howItSupports": "Shows the book as laid-out pages grouped by moment with dates, so completeness can be judged in a glance rather than photo by photo.", "media": []}, {"step": "Fix the few exceptions with a swap, a removal or a caption", "description": "Swap the one photo where a sibling is cut off, remove a picture of a receipt that slipped in, add a caption to the first-day-of-school page or change the theme colour, all inside the automatic design and without touching the other pages. Edits must be cheap and rare; if a parent needs to fix twenty pages, the curation has failed.", "howItSupports": "Lets the parent reorder, swap or remove individual photos and add captions, cover photo and theme colours inside the automatic design without redoing the book.", "media": []}, {"step": "Keep the children's photos private throughout", "description": "Know that the photos travel encrypted, are used only to produce the book and the preview, are never shared beyond the printing partner, and can be deleted from the account on request under GDPR or CCPA. For a parent this is not a legal detail but the condition for handing over a childhood.", "howItSupports": "Handles consent, encrypted transfer and storage, deletion rights and app-store privacy labels for the personal photos the book is made from.", "media": []}]}, {"customerId": "fmly", "customerName": "Family Memory Keeper", "customerGroup": "Memory Keepers", "customerIcon": "customer-fmly-portrait.jpg", "pr     mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        flowchart: {
            htmlLabels: true
        }
    });

    function renderDependenciesDiagramIfNeeded() {
        const container = document.getElementById('Dependencies');
        if (!container || container.dataset.diagramRendered === 'true') {
            return;
        }
        mermaid.run({querySelector: '#Dependencies .mermaid'}).then(() => {
            container.dataset.diagramRendered = 'true';
        }).catch(error => {
            console.error('Failed to render dependency diagram', error);
        });
    }

    function renderModuleDependencyGraphIfNeeded() {
        if (!document.getElementById('ModuleDependencyGraph')) {
            return;
        }
        renderModuleDependencyGraph();
    }

    // The shared tabs script (_imports/tabs) calls this hook after a tab opens.
    window.afterOpenTab = function (tabName) {
        if (tabName === 'dependencies') {
            renderDependenciesDiagramIfNeeded();
        }
        if (tabName === 'modules') {
            updateModuleDetailsVisibility();
            renderModuleDependencyGraphIfNeeded();
        }
    };

    function updateModuleDetailsVisibility() {
        const toggle = document.getElementById('moduleDetailsToggle');
        const showDetails = !toggle || toggle.checked;
        document.querySelectorAll('#Modules .module-detail-content').forEach(element => {
            element.style.display = showDetails ? '' : 'none';
        });
    }

    function updateBrickTabLabels() {
        const moduleCount = (brick.layers || []).reduce((total, layer) => {
            const modules = layer && layer.modules ? layer.modules : [];
            if (Array.isArray(modules)) {
                return total + modules.length;
            }
            return total + Object.keys(modules).length;
        }, 0);
        const dataCount = (brick.dataDependencies || []).length;
        const dependenciesCount = (brick.brickDependencies || []).length
            + findIncomingBrickDependencies().length
            + (brick.externalSystemsThisBrickDependsOn || brick.externalSystemDependencies || []).length
            + (brick.externalSystemsDependingOnThisBrick || []).length;
        const linksCount = (brick.links || []).reduce((sum, group) => sum + (group.links || []).length, 0);
        const modulesTab = document.getElementById('tab_modules');
        const dataTab = document.getElementById('tab_data');
        const dependenciesTab = document.getElementById('tab_dependencies');
        const linksTab = document.getElementById('tab_links');
        if (modulesTab) {
            modulesTab.textContent = 'Modules (' + moduleCount + ')';
        }
        if (dataTab) {
            dataTab.textContent = 'Data (' + dataCount + ')';
        }
        if (dependenciesTab) {
            dependenciesTab.textContent = 'Dependencies (' + dependenciesCount + ')';
        }
        if (linksTab) {
            linksTab.textContent = 'Links (' + linksCount + ')';
        }
    }
</script>

<script>
    function isFalse(value) {
        return !value || (value + '').toLowerCase().trim() === 'false' || (value + '').toLowerCase().trim() === 'no';
    }

    function isTrue(value) {
        return !isFalse(value);
