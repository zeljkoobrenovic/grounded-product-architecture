    <style>
    .tab {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 4px;
    }

    .tab button {
        position: relative;
        background-color: transparent;
        border: none;
        outline: none;
        cursor: pointer;
        padding: 11px 16px;
        margin-bottom: -1px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        color: #6b7280;
        border-bottom: 2px solid transparent;
        border-radius: 8px 8px 0 0;
        transition: color 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
    }

    .tab button:hover {
        color: #1f2937;
        background-color: #f3f4f6;
    }

    .tab button:focus-visible {
        outline: 2px solid #1d4ed8;
        outline-offset: -2px;
    }

    .tab button.active {
        color: #1d4ed8;
        border-bottom-color: #1d4ed8;
    }

    .tabcontent {
        display: none;
        padding: 2px 2px;
        animation: tabContentFade 0.2s ease;
    }

    @keyframes tabContentFade {
        from {
            opacity: 0;
            transform: translateY(3px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 720px) {
        .tab {
            flex-direction: column;
            gap: 0;
        }

        .tab button {

            border-bottom: 1px solid #e5e7eb;

    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';

uted to a partner facility in the destination country, and the parcel tracked through the published window: 4 to 8 business days in the United States, 4 to 5 in the United Kingdom, 5 to 10 in Canada and Australia. The customer wants one date to plan the dinner or the party around.", "howItSupports": "Produces, packs, ships and tracks the book within the published delivery window for the destination country.", "media": []}]}, {"customerId": "trvl", "customerName": "Traveller and Milestone Celebrant", "customerGroup": "Memory Keepers", "customerIcon": "customer-trvl-portrait.jpg", "productId": "web-photo-book-creator", "productName": "Web Photo Book Creator", "productIcon": "web-photo-book-creator.png", "jobId": "jtbd-trvl-2", "jobName": "Personalise cover, order and captions without learning a design tool", "jobWhatItIs": "Make the automatically designed book feel like the customer's own, with the right cover photo, pages in the order the event happened, captions naming the places and the people, a quote on the first page and colours that suit the occasion, without templates, grids or the hour-long tutorials of a full design tool. The job is to edit on top of a finished book, changing only what matters, and to confirm the finished design before paying.", "jobOutcome": "The customer changes the cover, the order of a few pages and a dozen captions in well under half an hour, on the phone or in the web creator, without losing work, and pays for a book that reads as their story rather than the engine's.", "supportRationale": "Shows the updated page count, cover rule and price after editing and completes payment for the finished design.", "usedInSteps": [{"step": "Confirm the finished design and see how the edits changed the price", "description": "Review the final book once more, see the page count and price after pages were added or removed, and pay knowing that what is on the screen is what will be printed. Any last cover-rule change, for example a book that grew past s.", "media": []}, {"step": "Have low-resolution and blurry photos flagged before they are printed", "description": "Rely on the quality scoring to keep blurry frames out, and on preflight to warn when a photo pulled from a messaging app or a guest's shared folder is too small to print across a large page. The warning must come in the editor, with a suggestion to swap, not as a disappointing page in the finished book.", "howItSupports": "Preflights the print-ready file for resolution, bleed and colour problems before the job is released to a partner.", "media": []}, {"step": "Have the book produced by a trusted partner in my country on FSC paper", "description": "Know that the book is printed at a partner facility close to home, on FSC-certified paper, by a network that is audited for defects and colour consistency, which also cuts shipping distance and emissions. The customer does not see the partner but sees the result, so consistency across the four continents is the whole point.", "howItSupports": "Routes the job to the nearest partner facility with capacity and a quality record for large-format hardcovers.", "media": []}, {"step": "Have the book produced by a trusted partner in my country on FSC paper", "description": "Know that the book is printed at a partner facility close to home, on FSC-certified paper, by a network that is audited for defects and colour consistency, which also cuts shipping distance and emissions. The customer does not see the partner but sees the result, so consistency across the four continents is the whole point.", "howItSupports": "Sets and audits partner SLAs, print quality, reprint root causes and FSC paper so the book looks the same whether it is printed in the US, the EU or Australia.", "media": []}, {"step": "Receive the book well packed and on time", "description": "Get the hardcover packed to survive the carrier, shipped with tracking and delivered within the window published for the country, so it can be given at the anniversary dinner or the graduation party. A corner crushed in transit counts as a quality failure to this customer, whoever caused it.", "howItSupports": "Packs, ships and tracks the parcel within the published window and exposes the status to the customer.", "media": []}]}, {"customerId": "sclk", "customerName": "Facebook Timeline Archivist", "customerGroup": "Memory Keepers", "customerIcon": "customer-sclk-portrait.jpg", "productId": "web-photo-book-creator", "productName": "Web Photo Book Creator", "productIcon": "web-photo-book-creator.png", "jobId": "jtbd-sclk-1", "jobName": "Print a whole Facebook year with captions in one click", "jobWhatItIs": "Turn one calendar year of a Facebook life, spread over albums, timeline pictures, cover and profile photos and mobile uploads, into a printed hardcover without selecting photos or designing pages. The job includes granting Facebook Login, picking the year, letting the curation engine drop duplicates and blurry shots while keeping the captions and dates, checking the free preview and paying for a book that matches the years already on the shelf.", "jobOutcome": "A finished hardcover of the chosen year, with captions and dates preserved and no duplicate or blurry photos, previewed for free in under a minute, ordered at a price the archivist understood before checkout and delivered within the published window for their country.", "supportRationale": "Runs Facebook Login and requests the photo permissions Meta allows, then lists the albums, timeline pictures and profile photos it can read.", "usedInSteps": [{"step": "Log in with Facebook and understand the permission screen", "description": "On pastbook.com the archivist opens Facebook Photo Books, signs in with Facebook and is asked which photo permissions to grant. The step succeeds when the permission request is explained in plain words, covers albums, timeline pictures, cover and profile photos and mobile uploads within the scope Meta allows, and the archivist knows the photos are imported over an encrypted connection.", "howItSupports": "Runs Facebook Login and requests the photo permissions Meta allows, then lists the albums, timeline pictures and profile photos it can read.", "media": []}, {"step": "Log in with Facebook and understand the permission screen", "description": "On pastbook.com the archivist opens Facebook Photo Books, signs in with Facebook and is asked which photo permissions to grant. The step succeeds when the permission request is explained in plain words, covers albums, timeline pictures, cover and profile photos and mobile uploads within the scope Meta allows, and the archivist knows the photos are imported over an encrypted connection.", "howItSupports": "Explains what is imported and for how long it is kept, and keeps the Facebook connection inside Meta platform terms.", "media": []}, {"step": "Pick the year to print", "description": "Photos are grouped per year from 2009 to 2025 and the archivist chooses the one that is missing from the shelf, sees how many photos it holds and whether it is a thin year that will fit the 24-page small hardcover or a rich year that will run to 60 pages.", "howItSupports": "Groups the imported Facebook photos by year and shows the photo count per year so the archivist can estimate the size of the book.", "media": []}, {"step": "Choose the size and pay a price understood in advance", "description": "The archivist compares the small hardcover at USD 19.99 for 24 pages plus USD 0.40 per extra page with the large at USD 34.99 plus USD 0.55, applies the promo code from the campaign e-mail, and pays with a card or PayPal in their own currency.", "howItSupports": "Applies the cover rules by page count, extra-page pricing, promo codes and the seven currencies, and takes payment by Visa, Mastercard, American Express or PayPal.", "media": []}, {"step": "Receive the book and see that it matches the shelf", "description": "Production starts on payment, the book is printed in the archivist's country where possible and delivered within the published window, for example 4 to 8 business days in the United States or 5 to 10 in Australia. The archivist compares spine, size and cover with the earlier years.", "howItSupports": "Produces, ships and tracks the book within the published delivery window and keeps the archivist informed with tracking updates.", "media": []}]}, {"customerId": "sclk", "customerName": "Facebook Timeline Archivist", "customerGroup": "Memory Keepers", "customerIcon": "customer-sclk-portrait.jpg", "productId": "web-photo-book-creator", "productName": "Web Photo Book Creator", "productIcon": "web-photo-book-creator.png", "jobId": "jtbd-sclk-2", "jobName": "Keep my photos safe and private while the book is made", "jobWhatItIs": "Be certain that connecting Facebook to PastBook does not expose family photos, including grandchildren, to anyone beyond the print job. The job covers understanding the permission screen, knowing where the photos go and for how long, being able to disconnect and delete, and getting a human answer when a permission request or a platform change such as the end of Instagram support raises doubts.", "jobOutcome": "The archivist connects Facebook knowing exactly which photos are read and why, the photos are transferred and stored encrypted only for as long as the order needs, disconnection and deletion work on request within the legal deadlines, and no privacy question stays unanswered for more than a day.", "supportRationale": "Provides the consent explanation, the privacy notice and the retention rules that the permission screen and help center repeat.", "usedInSteps": [{"step": "Understand what is asked before connecting", "description": "Before clicking Continue with Facebook the archivist wants to know why PastBook asks for photo permissions, that it reads but does not post, and what happens to the photos after the book is printed. A help center article and a sentence on the permission screen do this job.", "howItSupports": "Provides the consent explanation, the privacy notice and the retention rules that the permission screen and help center repeat.", "media": []}, {"step": "Understand what is asked before connecting", "description": "Before clicking Continue with Facebook the archivist wants to know why PastBook asks for photo permissions, that it reads but does not post, and what happens to the photos after the book is printed. A help center article and a sentence on the permission screen do this job.", "howItSupports": "Requests only the permission scope Meta allows for photo books and shows the archivist which sources will be read.", "media": []}, {"step": "Import over an encrypted connection and keep photos only for the order", "description": "Photos are imported over encrypted connections, stored for the book project and the print job, and not retained beyond the order without the archivist's choice to keep the project for reorders.", "howItSupports": "Enforces encrypted transfer and storage, retention limits after delivery and the Meta platform terms on Facebook data.", "media": []}, {"step": "Disconnect or delete when I want to", "description": "After the book has arrived the archivist may want to disconnect Facebook or ask PastBook to delete the photos and the account. Under GDPR and CCPA this must work through the account or a single e-mail, with confirmation.", "howItSupports": "Handles GDPR and CCPA rights requests, disconnects the Facebook source and deletes photos, book projects and the account on request.", "media": []}, {"step": "Get a straight answer when a platform changes the rules", "description": "When Instagram ended support for third-party photo products the archivist lost a source overnight; the same could happen to a Facebook permission. The archivist wants a plain notice about what changed, what still works and what to do with the years not yet printed.", "howItSupports": "Tracks Meta platform and app review changes and publishes what they mean for customers, as with the Instagram notice.", "media": []}]}, {"customerId": "sclk", "customerName": "Facebook Timeline Archivist", "customerGroup": "Memory Keepers", "customerIcon": "customer-sclk-portrait.jpg", "productId": "web-photo-book-creator", "productName": "Web Photo Book Creator", "productIcon": "web-photo-book-creator.png", "jobId": "jtbd-sclk-3", "jobName": "Reorder past years and gift copies to family", "jobWhatItIs": "Complete the shelf year by year and share it: reorder a year printed before in the same size, print the next missing year, and send extra copies of a wedding or a grandchild's first year to children and siblings in another city or country, ideally with a discount and without re-doing the book.", "jobOutcome": "Every past book can be reordered from the account in a few clicks, extra copies ship to family addresses in other countries within their published delivery windows, and the archivist orders at least one more Facebook year within twelve months of the first.", "supportRationale": "Reorders a saved book in the same format and cover, or upgrades a copy to the large hardcover as a gift.", "usedInSteps": [{"step": "Find the past books in my account", "description": "The archivist logs in and sees the books already made, by year, with the format and page count, so a reorder or a copy for a sibling starts from the finished book rather than from Facebook again.", "howItSupports": "Reorders a saved book in the same format and cover, or upgrades a copy to the large hardcover as a gift.", "media": []}, {"step": "Pick the next missing year", "description": "A reminder in January, or a memory that pops up on Facebook, prompts the archivist to print the next year. The Facebook connection is re-used if it is still valid or re-authorised in one step.", "howItSupports": "Re-uses or refreshes the Facebook connection and offers the years not yet printed.", "media": []}, {"step": "Send copies to family in other countries", "description": "A daughter in the     function updateBrickTabLabels() {
        const moduleCount = (brick.layers || []).reduce((total, layer) => {
            const modules = layer && layer.modules ? layer.modules : [];
            if (Array.isArray(modules)) {
                return total + modules.length;
            }
            return total + Object.keys(modules).length;
        }, 0);
        const dataCount = (brick.dataDependencies || []).length;
        const dependenciesCount = (brick.brickDependencies || []).length
            + findIncomingBrickDependencies().length
            + (brick.externalSystemsThisBrickDependsOn || brick.externalSystemDependencies || []).length
            + (brick.externalSystemsDependingOnThisBrick || []).length;
        const linksCount = (brick.links || []).reduce((sum, group) => sum + (group.links || []).length, 0);
        const modulesTab = document.getElementById('tab_modules');
        const dataTab = document.getElementById('tab_data');
        const dependenciesTab = document.getElementById('tab_dependencies');
        const linksTab = document.getElementById('tab_links');
        if (modulesTab) {
            modulesTab.textContent = 'Modules (' + moduleCount + ')';
        }
        if (dataTab) {
            dataTab.textContent = 'Data (' + dataCount + ')';
        }
        if (dependenciesTab) {
            dependenciesTab.textContent = 'Dependencies (' + dependenciesCount + ')';
        }
        if (linksTab) {
            linksTab.textContent = 'Links (' + linksCount + ')';
        }
    }

        return !isFalse(value);
