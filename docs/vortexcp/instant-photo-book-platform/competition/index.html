    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

 app downloads and a Trustpilot TrustScore of 4.5 from 35,837 reviews with every negative review answered within 48 hours by a 24/7 support team in the Netherlands, the United States, Sri Lanka and India. Revenue reached USD 14.3M in 2019 and was projected to triple to about USD 42.9M in 2020, which earned Deloitte Technology Fast50 podium places in 2019 (4,623 percent growth) and 2021 and three consecutive FT1000 listings; since April 2020 the company is led by CEO Wouter Staatsen, formerly CEO of Albelli and VP at Cimpress. It is listed here so that the incumbents' factory-led scale and the challengers' AI and subscription mechanics can be read against PastBook's asset-light, curation-first, per-order model.", "businessStats": [{"metric": "founded_year", "value": "2012, Amsterdam, in the Rockstart Accelerator, by Stefano Cutello (former eBay tech lead); Tech.eu also names co-founder Giuseppe Prioriello and dates the start to 2010", "period": "published 2017-09-21", "scope": "company", "sourceTitle": "Tech.eu - PastBook raises funding", "sourceUrl": "https://tech.eu/2017/09/21/pastbook-funding/"}, {"metric": "books_created", "value": "10 million+ photo books created since 2012", "period": "accessed 2026-09-06", "scope": "platform (cumulative counter on the Year in Review page)", "sourceTitle": "PastBook - Year in Review Photo Book", "sourceUrl": "https://pastbook.com/year-in-review-photo-book/"}, {"metric": "app_downloads", "value": "1 million+ downloads of the PastBook 1-Click Photo Book app", "period": "accessed 2026-09-06", "scope": "product (cumulative counter on the app page)", "sourceTitle": "PastBook - App", "sourceUrl": "https://pastbook.com/app/"}, {"metric": "review_rating", "value": "TrustScore 4.5 out of 5 from 35,837 reviews; 79 percent five-star, 2 percent one-star; replies to 100 percent of negative reviews, typically within 48 hours", "period": "accessed 2026-09-06", "scope": "company (Trustpilot profile)", "sourceTitle": "Trustpilot - PastBook reviews", "sourceUrl": "https://www.trustpilot.com/review/pastbook.com"}, {"metric": "revenue", "value": "USD 14.3M in 2019, projected to triple to about USD 42.9M in 2020; North America largest market, followed by Australia, Europe and the UK", "period": "FY2019 actual, FY2020 projection (published 2021-07-06)", "scope": "company (figures quoted in a press article on the AI app launch; 2020 is a projection, not an audited result)", "sourceTitle": "London Loves Tech - PastBook launches cutting-edge AI-driven app following exponential growth", "sourceUrl": "https://londonlovestech.com/pastbook-launches-cutting-edge-ai-driven-app-following-exponential-growth/"}, {"metric": "revenue_growth", "value": "Deloitte Technology Fast50 2019 winner in Media & Entertainment and top 3 overall with 4,623 percent turnover growth", "period": "published 2019-10-13", "scope": "company (Deloitte Technology Fast50 Netherlands ranking)", "sourceTitle": "Business Wire - PastBook wins the Deloitte Technology Fast50 2019 for the Media & Entertainment sector", "sourceUrl": "https://www.businesswire.com/news/home/20191013005013/en/PastBook-Wins-the-Deloitte-Technology-Fast50-2019-for-the-Media-Entertainment-Sector-and-Makes-It-to-the-Podium-of-the-Competition"}, {"metric": "revenue_growth", "value": "Deloitte Technology Fast50 2021 top half with 528 percent growth, third year in a row among the fastest-growing companies in the Netherlands", "period": "published 2021", "scope": "company (Deloitte Technology Fast50 Netherlands ranking)", "sourceTitle": "PastBook newsroom - Named one of the fastest growing companies in the Netherlands for the 3rd year in a row", "sourceUrl": "https://pastbook.com/newsroom/pastbook-named-as-one-of-the-fastest-growing-companies-in-the-netherlands-for-the-3rd-year-in-a-row/"}, {"metric": "funding", "value": "EUR 350k seed round led by Vortex Capital Partners", "period": "published 2015-12-26", "scope": "company", "sourceTitle": "StartupJuncture - Photo book startup Pas d": "cewe", "logo": "logos/cewe.png", "name": "CEWE", "hq": "Oldenburg, Germany", "category": "incumbent", "primaryRegions": ["europe"], "description": "CEWE (cewe.de, company.cewe.de) is Europe's photobook market leader: a listed photofinishing group from Oldenburg with about 4,000 employees in 21 countries that sold a record 6.32 million CEWE PHOTOBOOK copies in 2025 and more than 100 million since the product launched, on group turnover of EUR 864.5M and EBIT of EUR 88.2M. Its model is the opposite of PastBook's: an editor-led design experience in downloadable software, web and app, produced in its own European plants and sold through retail partners as well as online, with the Q4 Christmas peak driving the year. For a European family or gift giver CEWE is the default brand and price anchor; PastBook competes against it with one-click AI curation, no software to learn and delivery in 3 to 5 business days in Germany, France, the Netherlands and Italy from partner printers rather than owned factories. CEWE's 2026 guidance of EUR 870-900M turnover shows the scale gap between the incumbent and a scale-up with USD 14.3M of 2019 revenue.", "businessStats": [{"metric": "revenue", "value": "group turnover EUR 864.5M (+3.8 percent)", "period": "FY2025 (published 2026-03-26)", "scope": "group (IFRS)", "sourceTitle": "EQS News - CEWE achieves all targets in 2025 and aims to further increase revenue and earnings in 2026", "sourceUrl": "https://www.eqs-news.com/news/corporate-news/cewe-achieves-all-targets-in-2025-and-aims-to-further-increase-revenue-and-earnings-in-2026-plans-to-uphold-continuous-dividend-growth/70292c17-c943-4783-bd11-4323b6ce54d8_en"}, {"metric": "ebit", "value": "EUR 88.2M", "period": "FY2025 (published 2026-03-26)", "scope": "group (IFRS)", "sourceTitle": "EQS News - CEWE achieves all targets in 2025 and aims to further increase revenue and earnings in 2026", "sourceUrl": "https://www.eqs-news.com/news/corporate-news/cewe-achieves-all-targets-in-2025-and-aims-to-further-increase-revenue-and-earnings-in-2026-plans-to-uphold-continuous-dividend-growth/70292c17-c943-4783-bd11-4323b6ce54d8_en"}, {"metric": "segment_revenue", "value": "photofinishing turnover EUR 745.5M", "period": "FY2025 (published 2026-03-26)", "scope": "photofinishing business segment", "sourceTitle": "EQS News - CEWE achieves all targets in 2025 and aims to further increase revenue and earnings in 2026", "sourceUrl": "https://www.eqs-news.com/news/corporate-news/cewe-achieves-all-targets-in-2025-and-aims-to-further-increase-revenue-and-earnings-in-2026-plans-to-uphold-continuous-dividend-growth/70292c17-c943-4783-bd11-4323b6ce54d8_en"}, {"metric": "photobook_volume", "value": "6.32 million CEWE PHOTOBOOK copies (record); more than 100 million CEWE PHOTOBOOKs sold since launch", "period": "FY2025 (published 2026-03-26)", "scope": "product (CEWE PHOTOBOOK)", "sourceTitle": "EQS News - CEWE achieves all targets in 2025 and aims to further increase revenue and earnings in 2026", "sourceUrl": "https://www.eqs-news.com/news/corporate-news/cewe-achieves-all-targets-in-2025-and-aims-to-further-increase-revenue-and-earnings-in-2026-plans-to-uphold-continuous-dividend-growth/70292c17-c943-4783-bd11-4323b6ce54d8_en"}, {"metric": "employees", "value": "about 4,000 employees in 21 countries", "period": "FY2025 (published 2026-03-26)", "scope": "group", "sourceTitle": "EQS News - CEWE achieves all targets in 2025 and aims to further increase revenue and earnings in 2026", "sourceUrl": "https://www.eqs-news.com/news/corporate-news/cewe-achieves-all-targets-in-2025-and-aims-to-further-increase-revenue-and-earnings-in-2026-plans-to-uphold-continuous-dividend-growth/70292c17-c943-4783-bd11-4323b6ce54d8_en"}, {"metric": "guidance", "value": "2026 turnover guidance EUR 870-900M with continued dividend growth", "period": "FY2026 guidance (published 2026-03-26)", "scope": "group", "sourceTitle": "EQS News - CEWE achieves all targets in 2025 and aims to further increase revenue and earnings in 2026", "sourceUrl": "https://www.eqs-news.com/news/corporate-news/cewe-achieves-all-targets-in-2025-and-aims-to-further-increase-revenue-and-earnings-in-2026-plans-to-uphold-continuous-dividend-growth/70292c17-c943-4783-bd11-4323b6ce54d8_en"}], "links": {"results_release": "https://www.eqs-news.com/news/corporate-news/cewe-achieves-all-targets-in-2025-and-aims-to-further-increase-revenue-and-earnings-in-2026-plans-to-uphold-continuous-dividend-growth/70292c17-c943-4783-bd11-4323b6ce54d8_en"}, "logo_path": "logos/cewe.png"}, {"id": "storio-group", "logo": "logos/storio-group.png", "name": "Storio group (albelli, Photobox, bonusprint, Posterxxl, Fotoknudsen, Hofmann, \u00d6nskefoto)", "hq": "Amsterdam, Netherlands", "category": "incumbent", "primaryRegions": ["europe"], "description": "Storio group (storiogroup.com), the former albelli-Photobox Group rebranded in March 2024 and led by CEO Alessandro Coppo, is PastBook's Amsterdam neighbour and Europe's second photobook heavyweight: six brands in thirteen European markets, over eleven million customers, multiple manufacturing sites across Europe and consolidated revenue above EUR 340M. Its brands (albelli in the Benelux, Photobox and bonusprint in the UK and France, Posterxxl in Germany, Fotoknudsen and \u00d6nskefoto in the Nordics, Hofmann in Spain) sell editor-designed photobooks, prints and wall art from owned factories with heavy promotional pricing. The group is the most direct comparison for PastBook's European ambitions and its former talent pool: PastBook's CEO Wouter Staatsen and CMO Daniel Scheijen both came from Albelli. Where Storio owns production and brands per country, PastBook runs one global brand, one app and a partner-print network, and wins on the speed from photo library to finished book.", "businessStats": [{"metric": "brands_and_markets", "value": "six brands (albelli, Photobox, bonusprint, Posterxxl, Fotoknudsen, Hofmann, \u00d6nskefoto) in thirteen European markets", "period": "accessed 2026-09-06", "scope": "group", "sourceTitle": "Storio group - Our brands", "sourceUrl": "https://www.storiogroup.com/our-brands/"}, {"metric": "customers", "value": "over eleven million customers", "period": "accessed 2026-09-06", "scope": "group (cumulative counter on the about page)", "sourceTitle": "Storio group - About us", "sourceUrl": "https://www.storiogroup.com/about-us/"}, {"metric": "production_footprint", "value": "multiple manufacturing sites across Europe", "period": "accessed 2026-09-06", "scope": "group", "sourceTitle": "Storio group - About us", "sourceUrl": "https://www.storiogroup.com/about-us/"}, {"metric": "revenue", "value": "consolidated revenue above EUR 340M", "period": "published 2024", "scope": "group (as stated in the company's own press release)", "sourceTitle": "Storio group - Press release", "sourceUrl": "https://www.storiogroup.com/press-release/"}, {"metric": "ownership_and_leadership", "value": "rebranded from albelli-Photobox Group to Storio group in March 2024; CEO Alessandro Coppo (2024)", "period": "published 2024-03", "scope": "group", "sourceTitle": "Storio group - Press release", "sourceUrl": "https://www.storiogroup.com/press-release/"}], "links": {"website": "https://www.storiogroup.com/", "about": "https://www.storiogroup.com/about-us/", "press_releases": "https://www.storiogroup.com/press-release/", "brands": "https://www.storiogroup.com/our-brands/"}, "logo_path": "logos/storio-group.png"}, {"id": "shutterfly", "logo": "logos/shutterfly.png", "name": "Shutterfly", "hq": "California, United States", "category": "incumbent", "primaryRegions": ["north_america"], "description": "Shutterfly (shutterfly.com), founded in 1999 and owned by Apollo Global Management since 2019, is the largest US personalised photo products brand and the incumbent in the North American market that provides about 80 percent of PastBook's customers. It sells photo books alongside cards, prints, gifts and home decor from its own US production, through a template-driven editor, an app and near-constant promotions and free-print programmes. Against Shutterfly's catalogue breadth and brand recognition PastBook positions the opposite promise: no design work, a book generated from the camera roll in under a minute, and a simple two-size hardcover price list. No official business statistic could be verified within this domain's research scope; third-party e-commerce revenue estimates exist but are not recorded here.", "businessStats": [], "links": {"website": "https://www.shutterfly.com/"}, "logo_path": "logos/shutterfly.png"}, {"id": "snapfish", "logo": "logos/snapfish.png", "name": "Snapfish", "hq": "United States", "category": "incumbent", "primaryRegions": ["north_america", "europe", "asia_pacific"], "description": "Snapfish (snapfish.com), owned by District Photo, is the value end of the US photo book market and ships to the United States, the United Kingdom, Ireland, Germany, France, Italy, Australia and New Zealand, an overlap with PastBook's largest markets in North America, Australia and the UK. Its range runs from 5 x 7 to 12 x 12 inch books in hardcover, softcover, layflat, linen and leather, with an 8 x 11 inch hardcover from USD 13.50, well under PastBook's USD 19.99 small hardcover entry price. Snapfish competes on price and format choice through a classic upload-and-design flow; PastBook answers with automated curation and layout, fewer but curated formats and local partner production in the destination country. For the seasonal gift giver the two are compared on the same axes: price after discounts, delivery before the date and print quality.", "businessStats": [{"metric": "product_range", "value": "photo books from 5 x 7 to 12 x 12 inch in hardcover, softcover, layflat, linen and leather", "period": "accessed 2026-09-06", "scope": "product (photo book page)", "sourceTitle": "Snapfish - Photo books", "sourceUrl": "https://www.snapfish.com/photo-book"}, {"metric": "pricing", "value": "8 x 11 inch hardcover photo book from USD 13.50", "period": "accessed 2026-09-06", "scope": "published entry price (before promotions)", "sourceTitle": "Snapfish - Photo books", "sourceUrl": "https://www.snapfish.com/photo-book"}, {"metric": "shipping_countries", "value": "ships to the United States, United Kingdom, Ireland, Germany, France, Italy, Australia and New Zealand", "period": "accessed 2026-09-06", "scope": "company", "sourceTitle": "Snapfish - Photo books", "sourceUrl": "https://www.snapfish.com/photo-book"}], "links": {"website": "https://www.snapfish.com/", "photo_books": "https://www.snapfish.com/photo-book"}, "logo_path": "logos/snapfish.png"}, {"id": "mixbook", "logo": "logos/mixbook.png", "name": "Mixbook", "hq": "Redwood City, California, United States", "category": "challenger", "primaryRegions": ["north_america", "europe", "asia_pacific"], "description": "Mixbook (mixbook.com), founded in 2006 in Redwood City, is the design-quality challenger in the US photo book market with 6 million+ customers and 20 million+ projects printed, books of up to 400 pages, an iOS app and shipping to Australia, Canada, the EU and the UK. Its Mixbook Studio AI design tool and Story Mode automate layout and storytelling for customers who still want to edit, which puts it on a collision course with PastBook's curation-first approach from the editor side. Mixbook markets itself as '#1 rated in photo books' and wins the traveller and milestone celebrant who values design control and premium finishes; PastBook wins the same customer when speed and zero effort matter more than control. Both are per-order businesses with no subscription, so the contest is over conversion from free preview to paid book and over print quality per dollar.", "businessStats": [{"metric": "customers", "value": "6 million+ customers", "period": "accessed 2026-09-06", "scope": "company (self-reported counter on the home page)", "sourceTitle": "Mixbook - home", "sourceUrl": "https://www.mixbook.com/" ompany", "sourceTitle": "PR Newswire - Chatbooks raises $11.5 million Series B funding", "sourceUrl": "https://www.prnewswire.com/news-releases/chatbooks-raises-115-million-series-b-funding-300403536.html"}], "links": {"website": "https://chatbooks.com/", "funding_release": "https://www.prnewswire.com/news-releases/chatbooks-raises-115-million-series-b-funding-300403536.html"}, "logo_path": "logos/chatbooks.png"}, {"id": "popsa", "logo": "logos/popsa.png", "name": "Popsa", "hq": "London, United Kingdom", "category": "challenger", "primaryRegions": ["europe", "global"], "description": "Popsa (popsa.com) is the closest like-for-like rival to PastBook: a London mobile-first photo book app that auto-designs books from phone photos, serves 2 million customers in 50+ countries with marketing in 12 languages, and reports USD 1M of revenue per employee with a team of 46 people. It applies AI not only to book design but across marketing, customer support, supplier negotiation and logistics, and like PastBook outsources printing to partners rather than owning factories. The two compete head-on for the family memory keeper and traveller on curation quality, app conversion and print partner reach, with Popsa strongest in the UK and Europe and PastBook strongest in North America and Australia. A third-party 2025 revenue estimate circulates in trade press but is not recorded here as an official figure.", "businessStats": [{"metric": "revenue_per_employee", "value": "USD 1M revenue per employee with 46 people", "period": "published 2025-05", "scope": "company (self-reported in a company blog post)", "sourceTitle": "Popsa - Scaling revenue with AI", "sourceUrl": "https://popsa.com/perspectives/scaling-revenue-with-ai/"}, {"metric": "customers", "value": "2 million customers in 50+ countries", "period": "published 2025-05", "scope": "company (self-reported in a company blog post)", "sourceTitle": "Popsa - Scaling revenue with AI", "sourceUrl": "https://popsa.com/perspectives/scaling-revenue-with-ai/"}, {"metric": "localisation_and_ai", "value": "marketing in 12 languages; AI applied across marketing, support, supplier negotiation and logistics", "period": "published 2025-05", "scope": "company (self-reported in a company blog post)", "sourceTitle": "Popsa - Scaling revenue with AI", "sourceUrl": "https://popsa.com/perspectives/scaling-revenue-with-ai/"}], "links": {"website": "https://popsa.com/", "blog_post": "https://popsa.com/perspectives/scaling-revenue-with-ai/"}, "logo_path": "logos/popsa.png"}, {"id": "google-photos", "logo": "logos/google-photos.png", "name": "Google Photos photo books", "hq": "Mountain View, California, United States", "category": "big-tech", "primaryRegions": ["north_america", "europe"], "description": "Google Photos (photos.google.com) sells photo books directly from the library where billions of consumers already keep their pictures: a 7-inch softcover and a 9-inch hardcover of 20 to 140 pages, printed in 2 to 4 business days and delivered in the United States, Canada and 28+ European countries, with US economy shipping in 8 to 11 business days. Because the photos, the on-device 'memories' and the face and place grouping are already there, Google removes the import step that PastBook's phone and Facebook connectors exist to solve, which makes it the most important platform substitute in this landscape. PastBook's defence is deeper curation and automatic design, more formats (large hardcover, calendars, posters), 150+ destination countries and a brand built only around printed memories, while Google treats books as a small add-on to storage. Google is also a platform PastBook depends on, through Google Play distribution and the Google Drive import, so the relationship is competitor and channel at once.", "businessStats": [{"metric": "product_range", "value": "7-inch softcover and 9-inch hardcover photo books, 20 to 140 pages", "period": "accessed 2026-09-06", "scope": "product (Google Photos help article)", "sourceTitle": "Google Photos Help - Order photo books", "sourceUrl": "https://support.google.com/photos/answer/9079710"}, {"metric": "production_and_delivery", "value": "2 to 4 business days to print; US economy shipping 8 to 11 business days", "period": "accessed 2026-09-06", "scope": "product (Google Photos help article)", "sourceTitle": "Google Photos Help - Order photo books", "sourceUrl": "https://support.google.com/photos/answer/9079710"}, {"metric": "availability", "value": "available in the United States, Canada and 28+ European countries", "period": "accessed 2026-09-06", "scope": "product (Google Photos help article)", "sourceTitle": "Google Photos Help - Order photo books", "sourceUrl": "https://support.google.com/photos/answer/9079710"}], "links": {"help_article": "https://support.google.com/photos/answer/9079710"}, "logo_path": "logos/google-photos.png"}, {"id": "saal-digital", "logo": "logos/saal-digital.png", "name": "Saal Digital", "hq": "R\u00f6ttenbach, Germany", "category": "adjacent", "primaryRegions": ["europe", "north_america"], "description": "Saal Digital (saal-digital.com), a family-run German photo lab founded in 1981 with production in R\u00f6ttenbach, is the premium quality specialist of the field: photo books printed on real photo paper, delivery to more than 25 countries in Europe and the US, a 4.9 out of 5 score from over 235,000 verified reviews and many orders leaving production within 24 hours. It serves photographers and quality-focused consumers who design their book in dedicated software and pay for archival materials, an adjacent segment rather than a one-click audience. For PastBook it defines the print-quality bar the traveller and milestone celebrant compares against and the speed of an owned single-site lab, whereas PastBook relies on partner printers close to the customer. Saal's review volume also shows how strongly verified ratings drive this category, the same lever PastBook works through its Trustpilot and App Store scores.", "businessStats": [{"metric": "founded_year", "value": "1981; production in R\u00f6ttenbach, Germany", "period": "accessed 2026-09-06", "scope": "company", "sourceTitle": "Saal Digital - home", "sourceUrl": "https://www.saal-digital.com/"}, {"metric": "review_rating", "value": "4.9 out of 5 from over 235,000 verified reviews", "period": "accessed 2026-09-06", "scope": "company (review score as cited on the official site)", "sourceTitle": "Saal Digital - home", "sourceUrl": "https://www.saal-digital.com/"}, {"metric": "delivery_countries", "value": "delivery to more than 25 countries in Europe and the US", "period": "accessed 2026-09-06", "scope": "company", "sourceTitle": "Saal Digital - home", "sourceUrl": "https://www.saal-digital.com/"}, {"metric": "production_speed", "value": "many orders leave production within 24 hours", "period": "accessed 2026-09-06", "scope": "company (as stated on the official site)", "sourceTitle": "Saal Digital - home", "sourceUrl": "https://www.saal-digital.com/"}], "links": {"website": "https://www.saal-digital.com/"}, "logo_path": "logos/saal-digital.png"}, {"id": "smartphoto-group", "logo": "logos/smartphoto-group.png", "name": "smartphoto group (smartphoto, naYan, TopFanZ, Image Insight)", "hq": "Wetteren, Belgium", "category": "incumbent", "primaryRegions": ["europe"], "description": "smartphoto group (smartphotogroup.com) from Wetteren, Belgium is a regional multi-brand photofinisher active in 12 European countries with the smartphoto consumer brand, the naYan personalised gifts brand, TopFanZ fan merchandise and Image Insight, and was delisted from Euronext Brussels on 9 July 2025. Like CEWE and Storio it owns production and sells editor-designed photobooks, calendars and gifts with seasonal promotions, competing for the same Benelux and wider European households that PastBook reaches through its app and Facebook flow. It is the smallest of the European incumbents and illustrates the mid-sized factory-owning model PastBook chose not to build; a third-party 2024 revenue figure exists but is not recorded here as an official stat. Against smartphoto PastBook competes on zero-effort curation, ten-language global reach and local partner production in the destination country.", "businessStats": [{"metric": "brands_and_markets", "value": "brands smartphoto, naYan, TopFanZ and Image Insight; active in 12 European countries", "period": "accessed 2026-09-06", "scope": "group", "sourceTitle": "smartphoto group - home", "sourceUrl": "https://www.smartphotogroup.com/"}, {"metric": "listing_status", "value": "delisted from Euronext Brussels on 9 July 2025", "period": "published 2025-07", "scope": "group", "sourceTitle": "smartphoto group - home", "sourceUrl": "https://www.smartphotogroup.com/"}], "links": {"website": "https://www.smartphotogroup.com/"}, "logo_path": "logos/smartphoto-group.png"}]};
    let showDetails = false;

    function escapeHtml(value) {
        return String(value || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function titleCase(value) {
        return String(value || '')
            .split('_')
            .filter(Boolean)
            .map(part => part.charAt(0).toUpperCase() + part.slice(1))
            .join(' ');
    }

    function firstLetterLogo(player) {
        return '<div class="player-logo-fallback">' + escapeHtml((player.name || '?').charAt(0).toUpperCase()) + '</div>';
    }

    function renderPlayerLogo(player) {
        const fallback = firstLetterLogo(player);
        if (!player.logo_path) {
            return fallback;
        }

        return ''
            + '<div class="player-logo-wrap">'
            + '<img class="player-logo" src="' + escapeHtml(player.logo_path) + '" alt="' + escapeHtml(player.name) + ' logo"'
            + ' onerror="this.style.display=\'none\'; if (this.nextElementSibling) { this.nextElementSibling.style.display=\'flex\'; }">'
            + '<div class="player-logo-fallback" style="display:none;">' + escapeHtml((player.name || '?').charAt(0).toUpperCase()) + '</div>'
            + '</div>';
    }

    function renderHero() {
        const players = competitionData.players || [];
        document.getElementById('heroSubtitle').innerHTML = escapeHtml(competitionData.scope && competitionData.scope.description || '');
        document.getElementById('heroMeta').innerHTML = ''
            + '<div class="meta-chip">Updated ' + escapeHtml(competitionData.generatedOn || '') + '</div>';
    }

    function renderScope() {
        const scope = competitionData.scope || {};
        document.getElementById('scopeCopy').textContent = scope.description || '';
        const notes = Array.isArray(scope.notes) ? scope.notes : (scope.notes ? [scope.notes] : []);
        document.getElementById('scopeNotes').innerHTML = notes.map(item => '<div class="pill">' + escapeHtml(item) + '</div>').join('');
    }

    function renderPlayer(player) {
        const logoHtml = renderPlayerLogo(player);
        const detailUrl = 'landing_pages/' + encodeURIComponent(player.id) + '.html';

        const stats = (player.businessStats || []).slice(0, 3).map(stat => ''
            + '<div class="stat-item">'
            + '<div class="stat-metric">' + escapeHtml(titleCase(stat.metric)) + '</div>'
            + '<div class="stat-value">' + escapeHtml(stat.value || '') + '</div>'
            + '<div class="stat-meta">' + escapeHtml((stat.period || '') + (stat.scope ? ' • ' + titleCase(stat.scope) : '')) + '</div>'
            + '</div>'
        ).join('');

        const links = Object.entries(player.links || {}).slice(0, 4).map(([key, value]) => ''
            + '<a class="link-item" href="' + escapeHtml(value) + '" target="_blank" rel="noopener noreferrer">'
            + '<div><strong>' + escapeHtml(titleCase(key)) + '</strong></div>'
            + '<div class="link-meta">' + escapeHtml(value) + '</div>'
            + '</a>'
        ).join('');

        const regions = (player.primaryRegions || []).map(region => '<div class="pill">' + escapeHtml(titleCase(region)) + '</div>').join('');

        return ''
            + '<div class="player-card" data-detail-url="' + escapeHtml(detailUrl) + '">'
            + '<div class="player-header">'
            + logoHtml
            + '<div>'
            + '<div class="category-chip">' + escapeHtml(titleCase(player.category || 'competitor')) + '</div>'
            + (player.role ? '<div class="category-chip" style="' + ({ direct: 'background:#fdecea;color:#b71c1c', substitute: 'background:#fff4e5;color:#8a4b00', benchmark: 'background:#eef2f7;color:#37474f' }[player.role] || '') + '">' + escapeHtml(({ direct: 'Direct', substitute: 'Substitute', benchmark: 'Benchmark' }[player.role] || player.role)) + '</div>' : '')
            + '<div class="player-name">' + escapeHtml(player.name || '') + '</div>'
            + '<div class="player-meta">' + escapeHtml(player.hq || '') + (player.regionRelevance ? ' · ' + escapeHtml(player.regionRelevance) : '') + '</div>'
            + '</div>'
            + '</div>'
            + '<div class="player-description">' + escapeHtml(player.description || '') + '</div>'
            + '<div class="section-title">Primary Regions</div>'
            + '<div class="regions-row">' + regions + '</div>'
            + '<div class="player-details-block' + (showDetails ? '' : ' details-hidden') + '">'
            + '<div class="section-title">Selected Stats</div>'
            + '<div class="stats-list">' + stats + '</div>'
            + '<div class="section-title">Official Links</div>'
            + '<div class="links-list">' + links + '</div>'
            + '</div>'
            + '</div>';
    }

    function renderPlayers() {
        document.getElementById('playersGrid').innerHTML = (competitionData.players || []).map(renderPlayer).join('');
        bindPlayerCardNavigation();
        syncDetailsToggle();
        syncPlayerTabLabel();
    }

    function bindPlayerCardNavigation() {
        document.querySelectorAll('.player-card').forEach(card => {
            card.addEventListener('click', function (event) {
                const interactive = event.target.closest('a, button');
                if (interactive) {
                    return;
                }
                const detailUrl = card.getAttribute('data-detail-url');
                if (detailUrl) {
                    window.open(detailUrl, '_blank');
                }
            });
        });
    }

    function syncDetailsToggle() {
        const button = document.getElementById('detailsToggleButton');
        if (!button) {
            return;
        }
        button.textContent = showDetails ? 'Hide details' : 'Show details';
        button.className = 'toggle-button' + (showDetails ? ' toggle-button-active' : '');
    }

    function toggleDetails() {
        showDetails = !showDetails;
        renderPlayers();
    }

    function syncPlayerTabLabel() {
        const button = document.getElementById('tab_PlayersTab');
        if (!button) {
            return;
        }
        button.textContent = 'Players (' + String((competitionData.players || []).length) + ')';
    }

    renderHero();
    renderScope();
    renderPlayers();
</script>
</body>
</html>
