    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);

    mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        flowchart: {
            htmlLabels: true
        }
    });

    function renderDependenciesDiagramIfNeeded() {
        const container = document.getElementById('Dependencies');
        if (!container || container.dataset.diagramRendered === 'true') {
            return;
        }
        mermaid.run({querySelector: '#Dependencies .mermaid'}).then(() => {
            container.dataset.diagramRendered = 'true';
        }).catch(error => {
            console.error('Failed to render dependency diagram', error);
        });
    }

    function renderModuleDependencyGraphIfNeeded() {
        if (!document.getElementById('ModuleDependencyGraph')) {
            return;
        }
        renderModuleDependencyGraph();
    }

    // The shared tabs script (_imports/tabs) calls this hook after a tab opens.
    window.afterOpenTab = function (tabName) {
        if (tabName === 'dependencies') {
            renderDependenciesDiagramIfNeeded();
        }
        if (tabName === 'modules') {
            updateModuleDetailsVisibility();
            renderModuleDependencyGraphIfNeeded();
        }
    };

    function updateModuleDetailsVisibility() {
        const toggle = document.getElementById('moduleDetailsToggle');
        const showDetails = !toggle || toggle.checked;
        document.querySelectorAll('#Modules .module-detail-content').forEach(element => {
            element.style.display = showDetails ? '' : 'none';
        });
    }

    function updateBrickTabLabels() {
        const moduleCount = (brick.layers || []).reduce((total, layer) => {
            const modules = layer && layer.modules ? layer.modules : [];
            if (Array.isArray(modules)) {
                return total + modules.length;
            }
            return total + Object.keys(modules).length;
        }, 0);
        const dataCount = (brick.dataDependencies || []).length;
        const dependenciesCount = (brick.brickDependencies || []).length
            + findIncomingBrickDependencies().length
            + (brick.externalSystemsThisBrickDependsOn || brick.externalSystemDependencies || []).length
            + (brick.externalSystemsDependingOnThisBrick || []).length;
        const linksCount = (brick.links || []).reduce((sum, group) => sum + (group.links || []).length, 0);
        const modulesTab = document.getElementById('tab_modules');
        const dataTab = document.getElementById('tab_data');
        const dependenciesTab = document.getElementById('tab_dependencies');
        const linksTab = document.getElementById('tab_links');
        if (modulesTab) {
            modulesTab.textContent = 'Modules (' + moduleCount + ')';
        }
        if (dataTab) {
            dataTab.textContent = 'Data (' + dataCount + ')';
        }
        if (dependenciesTab) {
            dependenciesTab.textContent = 'Dependencies (' + dependenciesCount + ')';
        }
        if (linksTab) {
            linksTab.textContent = 'Links (' + linksCount + ')';
        }
    }

        <button class="tablinks active" id="tab_overview" onclick="openTab('overview')">Overview</button>
        <button class="tablinks" id="tab_modules" onclick="openTab('modules')">Modules</button>
        <button class="tablinks" id="tab_data" onclick="openTab('data')">Data</button>
        <button class="tablinks" id="tab_dependencies" onclick="openTab('dependencies')">Dependencies</button>
        <button class="tablinks" id="tab_links" onclick="openTab('links')">Links</button>
    </div>

    <div id="tab_content_overview" class="tabcontent" style="padding: 10px">
        <div id="Overview"></div>
    </div>
    <div id="tab_content_modules" class="tabcontent" style="padding: 10px">
        <div id="Modules"></div>
    </div>
    <div id="tab_content_data" class="tabcontent" style="padding: 10px">
        <div id="Data"></div>
    </div>
    <div id="tab_content_links" class="tabcontent" style="padding: 10px">
        <div id="Links"></div>
    </div>
    <div id="tab_content_dependencies" class="tabcontent" style="padding: 10px">
        <div id="Dependencies"></div>
    </div>
</div>

<script>
    function isFalse(value) {
        return !value || (value + '').toLowerCase().trim() === 'false' || (value + '').toLowerCase().trim() === 'no';
    }

    function isTrue(value) {
        return !isFalse(value);
    }

</script>

<script>
    let div = document.createElement('div');
    document.body.appendChild(div);

    let html = '';

    function addNavigation() {
        html += '<div style="margin: 4px 20px 10px 20px; font-size: 85%; color: black">';
        let prev_domain = all_bricks.length ? all_bricks[0].domain : '';
        all_bricks.filter(c => c.domain && c.domain.toLowerCase().trim() !== 'on ice').forEach(cap => {
            if (prev_domain && prev_domain.toLowerCase() !== cap.domain.toLowerCase()) {
                prev_domain = cap.domain;
                html += '<div style="margin-top: 5px; margin-left: 4px; vertical-align: top; display: inline-block; border-left: 2px solid lightgrey; height: 30px;">&nbsp;</div>';
            }
            html += '<a href="' + cap.id + '.html">';
            const tabClass = cap.id === brick.id ? 'tab-image-selected' : 'tab-image';
            html += '<img src="../icons/' + cap.id + '.png" class="' + tabClass + '" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
            html += '</a>';
        });
        html += '</div>';
    }

    addNavigation();

    html += '<div style="margin: 20px">';

    function addHeader() {
        html += '<table>';
        html += '<tr>';
        html += '<td>';
        html += '<div>';
        html += '<img src="../icons/' + brick.id + '.png" style="width: 110px" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
        html += '</div>';
        html += '</td>';
        html += '<td style="vertical-align: top">';
        html += '<div style="margin-left: 20px; font-size: 90%; color: grey; vertical-align: top">';
        html += '<div class="page-type-badge">Brick</div>';
        html += brick.domain;
        if (brick.group && brick.group !== brick.domain) {
            html += ' / ' + brick.group;
        }
        html += ' / <span style="color: blue; font-weight: bold;">' + brick.id.toUpperCase() + '</span>';
        html += '</div>';
        html += '<div style="font-size: 50px; margin-left: 20px">';
        html += brick.name;
        html += '</div>';
        html += '<div style="font-size: 16px; margin-left: 20px; color: grey; margin-top: 3px">';
        html += brick.description ? brick.description : '';
        html += '</div>';
        html += '</td>';
        html += '</tr>';
        html += '</table>';
    }

    addHeader();

    function addDocs() {
        html += '<div  class="" style="margin-top: 32px">';

        function addGroup(docs, icon) {
            if (docs) {
                docs.split('\n').forEach(doc => {
                    const elements = doc.trim().split(',');
                    const label = elements.length > 0 ? elements[0].trim() : '';
                    const link = elements.length > 1 ? elements[1].trim() : '';
                    if (label && link) {
                        html += '<a target="_blank" href="' + link + '">';
                        html += '<div class="docs">';
                        html += '<div>';
                        if (label.startsWith('Security ')) icon = 'security.png';
                        html += '<img src="../icons/' + icon + '" ' + 'style="width: 54px;">';
                        html += '</div>';
                        html += '<div style="font-size: 110%">' + label.replace(/_/g, ' ') + '</div>';
                        html += '</div>';
                        html += '</a>';
                    }
                });
            }
        }

        html += '</div>';
    }

    document.getElementById('Header').innerHTML = html;
    html = '';

    function escapeHomeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function resolveCustomerMediaSrc(src) {
        const value = (src || '').trim();
        if (!value) {
            return '';
        }
        if (value.startsWith('http://') || value.startsWith('https://') || value.startsWith('data:')) {
            return value;
        }
        if (value.startsWith('../') || value.startsWith('./')) {
            return value;
        }
        if (value.startsWith('media/') || value.startsWith('icons/')) {
            return '../../customers/' + value;
        }
        return '../../customers/media/' + value;
    }

    function escapeMermaidLabel(value) {
        return (value || '')
            .replaceAll('&', 'and')
            .replaceAll('"', '')
            .replaceAll("'", '')
            .replaceAll('<', '')
            .replaceAll('>', '')
            .replaceAll('[', '(')
            .replaceAll(']', ')')
            .replaceAll('{', '(')
            .replaceAll('}', ')')
            .replaceAll('|', '/');
    }

    function renderLinkedProducts() {
        let sectionHtml = '<div class="home-section">';
        sectionHtml += '<div class="home-section-title">Used In Products</div>';
        if (!linkedProducts.length) {
            sectionHtml += '<div class="activity-muted">No linked products were inferred for this brick.</div>';
        } else {
            linkedProducts.forEach(product => {
                sectionHtml += '<a class="home-link-card" target="_blank" rel="noopener noreferrer" href="../../product-deployments/landing_pages/' + escapeHomeHtml(product.id) + '.html">';
                sectionHtml += '<div class="home-link-head">';
                sectionHtml += '<img class="home-link-icon" src="../../product-deployments/icons/' + escapeHomeHtml(product.icon) + '" onerror="this.onerror=null;this.src=\'../../product-deployments/icons/product.png\'">';
                sectionHtml += '<div><div class="home-link-title">' + escapeHomeHtml(product.name) + '</div><div class="home-link-meta">' + escapeHomeHtml(product.type || 'Product') + '</div></div>';
                sectionHtml += '</div>';
                if (product.whyUsed) {
                    sectionHtml += '<div class="home-link-copy">' + escapeHomeHtml(product.whyUsed) + '</div>';
                }
                sectionHtml += '</a>';
            });
        }
        sectionHtml += '</div>';
        return sectionHtml;
    }

    function renderSupportedStreams() {
        const supportedStreams = allStreams.filter(stream => {
            return (stream.brickDependencies || []).some(dep => dep.targetBrickId === brick.id);
        });

        let sectionHtml = '<div class="home-section">';
        sectionHtml += '<div class="home-section-title">Supported Product Streams</div>';
        if (!supportedStreams.length) {
            sectionHtml += '<div class="activity-muted">No product streams currently reference this brick.</div>';
            sectionHtml += '</div>';
            return sectionHtml;
        }

        supportedStreams.forEach(stream => {
            sectionHtml += '<div class="home-link-card">';
            sectionHtml += '<div class="home-link-head">';
            sectionHtml += '<img class="home-link-icon" src="../icons/' + escapeHomeHtml(stream.icon || 'stream.png') + '" onerror="this.onerror=null;this.src=\'../icons/stream.png\'">';
            sectionHtml += '<div style="vertical-align: top"><a target="_blank" rel="noopener noreferrer" href="../stream_pages/' + escapeHomeHtml(stream.id) + '.html"><div class="home-link-title"><div class="page-type-badge" style="font-size: 70%;">Experience</div><br>' + escapeHomeHtml(stream.name) + '</div>';
            sectionHtml += '</a></div>';
            sectionHtml += '</div>';
            if (stream.description) {
                sectionHtml += '<div class="home-link-copy">' + escapeHomeHtml(stream.description) + '</div>';
            }
            if (stream.flows && stream.flows.length) {
                sectionHtml += '<div class="activity-block">';
                sectionHtml += '<div class="activity-muted"><strong>Flows facilitated</strong></div>';
                stream.flows.forEach(flow => {
                    sectionHtml += '<div class="activity-muted">- ' + escapeHomeHtml(flow.title || flow.id || '') + '</div>';
                });
                sectionHtml += '</div>';
            }
            if (stream.outcomes && stream.outcomes.length) {
                sectionHtml += '<div class="activity-block">';
                sectionHtml += '<div class="activity-muted"><strong>Outcomes</strong></div>';
                stream.outcomes.forEach(outcome => {
                    sectionHtml += '<div class="activity-muted">- ' + escapeHomeHtml(outcome) + '</div>';
                });
                sectionHtml += '</div>';
            }
            sectionHtml += '</div>';
        });

        sectionHtml += '</div>';
        return sectionHtml;
    }

    function renderReferenceLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = brick.links || [];
        let sectionHtml = '<div class="home-section">';
        if (!groups.length) {
            sectionHtml += '<div class="activity-muted">No links are configured for this product brick.</div>';
            sectionHtml += '</div>';
            return sectionHtml;
        }
        groups.forEach(group => {
            sectionHtml += '<div class="links-group">';
            sectionHtml += '<div class="links-group-title">' + escapeHomeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                sectionHtml += '<div class="links-group-description">' + escapeHomeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                sectionHtml += '<div class="link-entry">';
                sectionHtml += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHomeHtml(link.link || '#') + '">'
                    + escapeHomeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    sectionHtml += '<div class="link-entry-copy">' + escapeHomeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    sectionHtml += '<iframe class="link-embed" loading="lazy" src="' + escapeHomeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHomeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                sectionHtml += '</div>';
            });
            sectionHtml += '</div>';
        });
        sectionHtml += '</div>';
        return sectionHtml;
    }

    function renderRelatedTeams() {
        let sectionHtml = '<div class="home-section">';
        sectionHtml += '<div class="home-section-title">Teams Owning Or Supporting This Brick</div>';
        if (!relatedTeams.length) {
            sectionHtml += '<div class="activity-muted">No owning or supporting teams are linked to this product brick.</div>';
            sectionHtml += '</div>';
            return sectionHtml;
        }

        relatedTeams.forEach(team => {
            sectionHtml += '<a class="home-link-card" target="_blank" rel="noopener noreferrer" href="../../teams/landing_pages/' + escapeHomeHtml(team.teamId) + '.html">';
            sectionHtml += '<div class="home-link-head">';
            sectionHtml += '<img class="home-link-icon" src="../../teams/icons/logo.png" onerror="this.onerror=null;this.src=\'../../teams/icons/logo.png\'">';
            sectionHtml += '<div>';
            if (team.teamType) {
                sectionHtml += '<div class="home-link-copy"><div class="page-type-badge" style="font-size: 70%;">' + escapeHomeHtml(team.teamType) + ' team</div></div>';
            }
            sectionHtml += '<div class="home-link-title">' + escapeHomeHtml('' + team.teamName) + '</div><div class="home-link-meta">' + escapeHomeHtml(team.roleLabel || '') + (team.groupName ? ' | ' + escapeHomeHtml(team.groupName) : '') + '</div></div>';
            sectionHtml += '</div>';
            sectionHtml += '</a>';
        });

        sectionHtml += '</div>';
        return sectionHtml;
    }

    function renderSupportedJobs() {
        let sectionHtml = '<div class="home-section">';
        sectionHtml += '<div class="home-section-title">Supported Customer Jobs-To-Be-Done</div>';
        if (!supportedJobs.length) {
            sectionHtml += '<div class="activity-muted">No supporting customer jobs were inferred for this brick.</div>';
        } else {
            const groupedJobs = {};
            supportedJobs.forEach(item => {
                const actorKey = item.customerId + '|' + item.productId;
                if (!groupedJobs[actorKey]) {
                    groupedJobs[actorKey] = {
                        customerId: item.customerId,
                        customerName: item.customerName,
                        customerGroup: item.customerGroup,
                        customerIcon: item.customerIcon,
                        productId: item.productId,
                        productName: item.productName,
                        jobs: []
                    };
                }
                groupedJobs[actorKey].jobs.push(item);
            });

            Object.values(groupedJobs).forEach(actor => {
                sectionHtml += '<div class="home-link-card">';
                sectionHtml += '<div class="home-link-head">';
                sectionHtml += '<a target="_blank" rel="noopener noreferrer" href="../../customers/landing_pages/' + escapeHomeHtml(actor.customerId) + '.html">';
                sectionHtml += '<img class="home-link-icon" src="../../customers/icons/' + escapeHomeHtml(actor.customerIcon) + '" onerror="this.onerror=null;this.src=\'../../customers/icons/customer.png\'">';
                sectionHtml += '</a>';
                sectionHtml += '<div><div class="home-link-title"><a target="_blank" rel="noopener noreferrer" href="../../customers/landing_pages/' + escapeHomeHtml(actor.customerId) + '.html">' + escapeHomeHtml(actor.customerName) + '</a></div><div class="home-link-meta">' + escapeHomeHtml(actor.customerGroup) + ' | <a target="_blank" rel="noopener noreferrer" href="../../product-deployments/landing_pages/' + escapeHomeHtml(actor.productId) + '.html">' + escapeHomeHtml(actor.productName) + '</a></div></div>';
                sectionHtml += '</div>';
                actor.jobs.forEach(item => {
                    sectionHtml += '<div class="activity-block">';
                    sectionHtml += '<div class="home-link-copy"><b>' + escapeHomeHtml(item.jobName) + '</b></div>';
                    if (item.usedInSteps && item.usedInSteps.length) {
                        item.usedInSteps.forEach(step => {
                            sectionHtml += '<div class="activity-block">';
                            sectionHtml += '<div><b>' + escapeHomeHtml(step.step) + '</b></div>';
                            if (step.description) {
                                sectionHtml += '<div class="activity-muted">' + escapeHomeHtml(step.description) + '</div>';
                            }
                            if (step.howItSupports) {
                                sectionHtml += '<div class="activity-muted"> - How it supports: ' + escapeHomeHtml(step.howItSupports) + '</div>';
                            }
                            if (step.media && step.media.length) {
                                const media = step.media[0];
                                const mediaSrc = resolveCustomerMediaSrc(media.src);
                                if (mediaSrc) {
                                    sectionHtml += '<div class="step-media-card">';
                                    sectionHtml += '<a target="_blank" rel="noopener noreferrer" href="' + escapeHomeHtml(mediaSrc) + '">';
                                    sectionHtml += '<img class="step-media-image" src="' + escapeHomeHtml(mediaSrc) + '" alt="' + escapeHomeHtml(media.alt || media.title || step.step || 'Job step media') + '">';
                                    sectionHtml += '</a>';
                                    if (media.title || media.alt) {
                                        sectionHtml += '<div class="step-media-caption">' + escapeHomeHtml(media.title || media.alt) + '</div>';
                                    }
                                    sectionHtml += '</div>';
                                }
                            }
                            sectionHtml += '</div>';
                        });
                    }
                    sectionHtml += '</div>';
                });
                sectionHtml += '</div>';
            });
        }
        sectionHtml += '</div>';
        return sectionHtml;
    }

    const configuredLayerTypes = modulesConfig.layerTypes || [];
    const moduleLayerOrder = configuredLayerTypes.length
        ? configuredLayerTypes.map(layer => layer.id).filter(Boolean)
        : ['ui', 'interfaces', 'worker', 'stateless-service', 'service', 'integration'];
    const moduleLayerLabels = configuredLayerTypes.reduce((lookup, layer) => {
        lookup[layer.id] = layer.name || layer.id;
        return lookup;
    }, {
        'ui': 'UI',
        'interfaces': 'Interfaces',
        'worker': 'Worker',
        'stateless-service': 'Stateless Service',
        'service': 'Service',
        'integration': 'Integration'
    });
    const moduleTypeDefinitions = (modulesConfig.moduleTypes || []).reduce((lookup, moduleType) => {
        if (moduleType && moduleType.id) {
            lookup[moduleType.id] = moduleType;
        }
        return lookup;
    }, {});

    function moduleLayerLabel(layerId) {
        return moduleLayerLabels[layerId] || String(layerId || '').replaceAll('-', ' ');
    }

    function moduleLayerClass(layerId) {
        return 'structure-' + String(layerId || 'service').replace(/[^a-z0-9_-]+/gi, '-').toLowerCase();
    }

    function moduleTypeColor(moduleTypeId) {
        const moduleType = moduleTypeDefinitions[String(moduleTypeId || '').toLowerCase()] || {};
        return moduleType.color || '#f3f4f6';
    }

    function normalizeLayerModules(layerId, layerConfig) {
        const modules = layerConfig && layerConfig.modules ? layerConfig.modules : {};
        if (Array.isArray(modules)) {
            return modules.map((module, index) => {
                const moduleInfo = module && typeof module === 'object' ? module : { title: String(module || '') };
                return {
                    ...moduleInfo,
                    layerId,
                    layerLabel: moduleLayerLabel(layerId),
                    displayName: moduleInfo.title || moduleInfo.name || moduleInfo.id || moduleLayerLabel(layerId) + ' module ' + (index + 1)
                };
            });
        }
        return Object.entries(modules).map(([moduleName, module]) => {
            const moduleInfo = module && typeof module === 'object' ? module : { title: String(module || '') };
            return {
                ...moduleInfo,
                layerId,
                layerLabel: moduleLayerLabel(layerId),
                displayName: moduleInfo.title || moduleInfo.name || moduleInfo.id || moduleName
            };
        });
    }

    function layerItemsOf(brickInfo) {
        const layers = brickInfo.layers || [];
        if (Array.isArray(layers)) {
            return layers.slice().sort((left, right) => {
                const leftIndex = moduleLayerOrder.includes(left.layer) ? moduleLayerOrder.indexOf(left.layer) : moduleLayerOrder.length;
                const rightIndex = moduleLayerOrder.includes(right.layer) ? moduleLayerOrder.indexOf(right.layer) : moduleLayerOrder.length;
                return leftIndex - rightIndex || String(left.layer || '').localeCompare(String(right.layer || ''));
            });
        }
        return [
            ...moduleLayerOrder.filter(layerId => layers[layerId]).map(layerId => ({ layer: layerId, ...layers[layerId] })),
            ...Object.keys(layers).filter(layerId => !moduleLayerOrder.includes(layerId)).map(layerId => ({ layer: layerId, ...layers[layerId] }))
        ];
    }

    function moduleDependencyNames(items) {
        const values = Array.isArray(items) ? items : (items ? [items] : []);
        return values.map(item => {
            if (item && typeof item === 'object') {
                return item.name || item.title || item.moduleId || item.targetModuleId || item.id || item.module || item.system || item.externalSystem || item.targetModule || item.target;
            }
            return item;
        }).filter(Boolean);
    }

    function brickById(brickId) {
        return all_bricks.find(candidate => candidate.id === brickId) || {};
    }

    function moduleByIdForBrick(brickInfo, moduleId) {
        if (!moduleId) {
            return null;
        }
        return layerItemsOf(brickInfo || {}).flatMap(layer => normalizeLayerModules(layer.layer, layer))
            .find(module => module.id === moduleId) || null;
    }

    function moduleDependencyLabel(brickInfo, moduleId) {
        const moduleInfo = moduleByIdForBrick(brickInfo, moduleId);
        if (!moduleInfo) {
            return moduleId || '';
        }
        return (moduleInfo.displayName || moduleInfo.name || moduleInfo.id) + ' (' + moduleInfo.id + ')';
    }

    function moduleReferencePill(brickInfo, moduleId) {
        const moduleInfo = moduleByIdForBrick(brickInfo, moduleId);
        const label = moduleInfo
            ? (moduleInfo.displayName || moduleInfo.name || moduleInfo.id || moduleId)
            : (moduleId || '');
        const title = moduleInfo && moduleInfo.type
            ? moduleInfo.type + ': ' + label
            : label;
        return '<span class="module-ref-pill" style="background-color: ' + escapeHomeHtml(moduleTypeColor(moduleInfo && moduleInfo.type)) + ';" title="' + escapeHomeHtml(title) + '">' + escapeHomeHtml(label) + '</span>';
    }

    function dependencyTargetModuleLabel(item) {
        const linkedBrick = brickById(item && item.targetBrickId);
        return moduleDependencyLabel(linkedBrick, item && item.moduleId);
    }

    function dependencySourceModuleLabel(item, sourceBrick) {
        return moduleDependencyLabel(sourceBrick || brick, item && item.sourceModuleId);
    }

    function moduleDataAssetItems(module) {
        const assetLookup = buildDataAssetLookup();
        const dataAssetsById = {};

        function addDataAsset(assetId, role, description) {
            if (!assetId) {
                return;
            }
            const normalizedAssetId = String(assetId);
            const asset = assetLookup[normalizedAssetId] || {};
            if (!dataAssetsById[normalizedAssetId]) {
                dataAssetsById[normalizedAssetId] = {
                    id: normalizedAssetId,
                    name: asset.name || normalizedAssetId,
                    kind: asset.kind || asset.type || '',
                    role: role || '',
                    description: description || asset.description || ''
                };
                return;
            }
            if (!dataAssetsById[normalizedAssetId].role && role) {
                dataAssetsById[normalizedAssetId].role = role;
            }
            if (!dataAssetsById[normalizedAssetId].description && description) {
                dataAssetsById[normalizedAssetId].description = description;
            }
        }

        const dataItems = Array.isArray(module.data) ? module.data : (module.data ? [module.data] : []);
        dataItems.forEach(item => {
            const assetId = item && typeof item === 'object' ? (item.assetId || item.id || item.name) : item;
            addDataAsset(
                assetId,
                item && typeof item === 'object' ? item.role : '',
                item && typeof item === 'object' ? item.description : ''
            );
        });

        (brick.dataDependencies || []).forEach(dependency => {
            const moduleIds = Array.isArray(dependency.moduleIds)
                ? dependency.moduleIds
                : (dependency.moduleIds ? [dependency.moduleIds] : (dependency.moduleId ? [dependency.moduleId] : []));
            if (module.id && moduleIds.includes(module.id)) {
                addDataAsset(dependency.assetId, dependency.role, dependency.description);
            }
        });

        return Object.values(dataAssetsById)
            .sort((left, right) => (left.name || left.id).localeCompare(right.name || right.id));
    }

    function renderModuleDataAssets(module) {
        const dataAssets = moduleDataAssetItems(module);
        if (!dataAssets.length) {
            return '';
        }
        let dataHtml = '<div class="module-data-list module-detail-content">';
        dataAssets.forEach(asset => {
            const meta = [asset.id, asset.kind, asset.role].filter(Boolean).join(' | ');
            dataHtml += '<div class="module-data-item">';
            dataHtml += '<img class="module-data-icon" src="../icons/data.png" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
            dataHtml += '<div><div class="module-data-name">' + escapeHomeHtml(asset.name || asset.id || '') + '</div>';
            if (meta) {
                dataHtml += '<div class="module-data-meta">' + escapeHomeHtml(meta) + '</div>';
            }
            if (asset.description) {
                dataHtml += '<div class="module-data-meta">' + escapeHomeHtml(asset.description) + '</div>';
            }
            dataHtml += '</div></div>';
        });
        dataHtml += '</div>';
        return dataHtml;
    }

    function renderModuleDetails(module) {
        let detailsHtml = '';
        const meta = [module.id, module.protocol, module.direction].filter(Boolean).join(' | ');
        const dependencies = module.dependencies || {};
        const moduleDependencies = moduleDependencyNames(dependencies.modules || module.moduleDependencies || []);
        const externalSystemDependencies = moduleDependencyNames(dependencies.externalSystems || module.externalSystems || module.externalSystemDependencies || []);

        if (meta) {
            detailsHtml += '<div class="structure-card-meta">' + escapeHomeHtml(meta) + '</div>';
        }
        detailsHtml += renderModuleDataAssets(module);
        if (moduleDependencies.length) {
            detailsHtml += '<div class="structure-card-meta"><b>Module dependencies:</b> ' + escapeHomeHtml(moduleDependencies.join(', ')) + '</div>';
        }
        if (externalSystemDependencies.length) {
            detailsHtml += '<div class="structure-card-meta"><b>External systems:</b> ' + escapeHomeHtml(externalSystemDependencies.join(', ')) + '</div>';
        }
        return detailsHtml;
    }

    function moduleGraphSafeId(prefix, value) {
        const raw = String(value || 'node').replace(/[^a-zA-Z0-9_]+/g, '_').replace(/^_+|_+$/g, '');
        return prefix + '_' + (raw || 'node');
    }

    function moduleGraphAllModules(brickInfo) {
        return layerItemsOf(brickInfo || {}).flatMap(layer => normalizeLayerModules(layer.layer, layer));
    }

    function moduleGraphNodeIdForModule(module, prefix) {
        return moduleGraphSafeId(prefix || 'module', module.id || module.displayName || module.name || 'module');
    }

    function moduleGraphNodeLabel(module) {
        const title = module.displayName || module.name || module.id || 'Module';
        return title;
    }

    function moduleGraphCurrentModuleLabel(module) {
        const title = module.displayName || module.name || module.id || 'Module';
        return [module.type || 'module', title].filter(Boolean).join('\\n');
    }

    function moduleGraphRenderNodeLabel(node) {
        return escapeMermaidLabel(node.label);
    }

    function moduleGraphDependencyItems(items) {
        const values = Array.isArray(items) ? items : (items ? [items] : []);
        return values.map(item => {
            if (item && typeof item === 'object') {
                return item;
            }
            return { id: item, name: item };
        }).filter(item => item && (item.id || item.name || item.moduleId || item.targetModuleId || item.targetModule || item.module || item.target || item.system));
    }

    function moduleGraphDependencyKey(item) {
        if (!item) {
            return '';
        }
        if (typeof item !== 'object') {
            return String(item || '');
        }
        return item.moduleId || item.targetModuleId || item.targetModule || item.module || item.id || item.target || item.name || item.title || '';
    }

    function moduleGraphFindModule(brickInfo, reference) {
        const key = String(moduleGraphDependencyKey(reference) || '').trim();
        if (!key) {
            return null;
        }
        const lowerKey = key.toLowerCase();
        return moduleGraphAllModules(brickInfo || {}).find(module => {
            return [module.id, module.name, module.title, module.displayName]
                .filter(Boolean)
                .some(value => String(value).toLowerCase() === lowerKey);
        }) || null;
    }

    function moduleGraphAddNode(nodeMap, node) {
        if (!node || !node.id) {
            return;
        }
        if (!nodeMap[node.id]) {
            nodeMap[node.id] = node;
        }
    }

    function moduleGraphAddEdge(edges, source, target, label) {
        if (!source || !target || source === target) {
            return;
        }
        const edgeKey = source + '|' + target + '|' + (label || '');
        if (edges.some(edge => edge.key === edgeKey)) {
            return;
        }
        edges.push({ key: edgeKey, source, target, label: label || 'depends' });
    }

    function moduleGraphExternalKey(item, index) {
        if (item && typeof item === 'object') {
            return item.system || item.name || item.id || item.externalSystem || item.target || ('External System ' + (index + 1));
        }
        return String(item || '').trim() || 'External System ' + (index + 1);
    }

    function buildModuleDependencyCatalog() {
        const nodeMap = {};
        const edges = [];
        const currentModules = moduleGraphAllModules(brick);
        const currentModuleNodeById = {};
        const currentModuleNodeByName = {};

        function currentModuleNode(module) {
            if (!module || !module.id) {
                return '';
            }
            return currentModuleNodeById[module.id] || '';
        }

        currentModules.forEach((module, index) => {
            const nodeId = moduleGraphNodeIdForModule(module, 'module_' + index);
            currentModuleNodeById[String(module.id || nodeId).toLowerCase()] = nodeId;
            [module.id, module.name, module.title, module.displayName].filter(Boolean).forEach(value => {
                currentModuleNodeByName[String(value).toLowerCase()] = nodeId;
            });
            moduleGraphAddNode(nodeMap, {
                id: nodeId,
                type: 'currentModule',
                label: moduleGraphCurrentModuleLabel(module),
                controlLabel: module.displayName || module.name || module.id || 'Module',
                layerId: module.layerId || '',
                layerLabel: module.layerLabel || moduleLayerLabel(module.layerId)
            });
        });

        function resolveCurrentModuleNode(reference) {
            const key = String(moduleGraphDependencyKey(reference) || '').toLowerCase();
            if (!key) {
                return '';
            }
            return currentModuleNodeById[key] || currentModuleNodeByName[key] || '';
        }

        function addRelatedModuleNode(relatedBrick, module, fallbackId, fallbackName) {
            const brickId = relatedBrick.id || 'external-brick';
            const moduleId = module && module.id ? module.id : (fallbackId || fallbackName || 'module');
            const nodeId = moduleGraphSafeId('related_module', brickId + '_' + moduleId);
            const moduleLabel = module
                ? (module.displayName || module.name || module.id || moduleId)
                : (fallbackName || fallbackId || 'Related module');
            const brickLabel = relatedBrick.name || relatedBrick.id || 'Other brick';
            moduleGraphAddNode(nodeMap, {
                id: nodeId,
                type: 'relatedModule',
                label: [module && module.type ? module.type : 'module', moduleLabel, brickLabel].filter(Boolean).join('\\n'),
                controlLabel: moduleLabel + ' (' + brickLabel + ')'
            });
            return nodeId;
        }

        function addExternalNode(item, index) {
            const label = moduleGraphExternalKey(item, index);
            const nodeId = moduleGraphSafeId('external', label);
            moduleGraphAddNode(nodeMap, {
                id: nodeId,
                type: 'externalSystem',
                label,
                controlLabel: label
            });
            return nodeId;
        }

        currentModules.forEach((module, moduleIndex) => {
            const sourceNodeId = currentModuleNode(module);
            if (!sourceNodeId) {
                return;
            }
            const dependencies = module.dependencies || {};

            moduleGraphDependencyItems(dependencies.modules || module.moduleDependencies || []).forEach(item => {
                const targetCurrentNodeId = resolveCurrentModuleNode(item);
                if (targetCurrentNodeId) {
                    moduleGraphAddEdge(edges, sourceNodeId, targetCurrentNodeId, item.type || 'module');
                    return;
                }
                const relatedBrick = brickById(item.targetBrickId || item.brickId);
                const relatedModule = moduleGraphFindModule(relatedBrick, item);
                const fallbackName = item.name || item.title || item.id || item.target || item.module || 'Related module';
                const relatedNodeId = addRelatedModuleNode(relatedBrick, relatedModule, moduleGraphDependencyKey(item), fallbackName);
                moduleGraphAddEdge(edges, sourceNodeId, relatedNodeId, item.type || 'module');
            });

            moduleGraphDependencyItems(dependencies.externalSystems || module.externalSystems || module.externalSystemDependencies || []).forEach((item, index) => {
                const externalNodeId = addExternalNode(item, moduleIndex + '-' + index);
                moduleGraphAddEdge(edges, sourceNodeId, externalNodeId, item.type || item.interface || 'external');
            });
        });

        (brick.brickDependencies || []).forEach(item => {
            const sourceNodeId = resolveCurrentModuleNode(item.sourceModuleId || item.sourceModule || item.module);
            if (!sourceNodeId) {
                return;
            }
            const relatedBrick = brickById(item.targetBrickId);
            const relatedModule = moduleByIdForBrick(relatedBrick, item.moduleId);
            const relatedNodeId = addRelatedModuleNode(relatedBrick, relatedModule, item.moduleId, dependencyTargetModuleLabel(item));
            moduleGraphAddEdge(edges, sourceNodeId, relatedNodeId, item.type || 'brick dependency');
        });

        findIncomingBrickDependencies().forEach(item => {
            const targetNodeId = resolveCurrentModuleNode(item.moduleId);
            if (!targetNodeId) {
                return;
            }
            const relatedBrick = brickById(item.sourceBrickId);
            const sourceModule = moduleByIdForBrick(relatedBrick, item.sourceModuleId);
            const relatedNodeId = addRelatedModuleNode(relatedBrick, sourceModule, item.sourceModuleId, dependencySourceModuleLabel(item, relatedBrick));
            moduleGraphAddEdge(edges, relatedNodeId, targetNodeId, item.type || 'brick dependency');
        });

        (brick.externalSystemsThisBrickDependsOn || brick.externalSystemDependencies || []).forEach((item, index) => {
            const sourceNodeId = resolveCurrentModuleNode(item.sourceModuleId || item.moduleId || item.module);
            if (!sourceNodeId) {
                return;
            }
            const externalNodeId = addExternalNode(item, 'out-' + index);
            moduleGraphAddEdge(edges, sourceNodeId, externalNodeId, item.type || item.interface || 'external');
        });

        (brick.externalSystemsDependingOnThisBrick || []).forEach((item, index) => {
            const targetNodeId = resolveCurrentModuleNode(item.moduleId || item.targetModuleId || item.module);
            if (!targetNodeId) {
                return;
            }
            const externalNodeId = addExternalNode(item, 'in-' + index);
            moduleGraphAddEdge(edges, externalNodeId, targetNodeId, item.type || item.interface || 'external');
        });

        return {
            nodes: Object.values(nodeMap).sort((left, right) => {
                const typeOrder = ['currentModule', 'relatedModule', 'externalSystem'];
                return typeOrder.indexOf(left.type) - typeOrder.indexOf(right.type)
                    || left.controlLabel.localeCompare(right.controlLabel);
            }),
            edges
        };
    }

    function renderModuleDependencyGraph() {
        const graphShell = document.getElementById('ModuleDependencyGraph');
        if (!graphShell) {
            return;
        }
        const catalog = buildModuleDependencyCatalog();
        const selectedNodeIds = selectedModuleGraphValues('.module-graph-node-checkbox');
        const selectedTypes = selectedModuleGraphValues('.module-graph-type-checkbox');
        const nodes = catalog.nodes.filter(node => selectedNodeIds.has(node.id) && selectedTypes.has(node.type));
        const nodeIdSet = new Set(nodes.map(node => node.id));
        const edges = catalog.edges.filter(edge => nodeIdSet.has(edge.source) && nodeIdSet.has(edge.target));

        if (!nodes.length) {
            graphShell.innerHTML = '<div class="activity-muted">Select modules or other nodes to render the module dependency diagram.</div>';
            return;
        }

        let chart = 'flowchart TB\n\n';
        const groupedCurrentModuleIds = new Set();
        const currentModuleNodes = nodes.filter(node => node.type === 'currentModule');
        const currentModuleLayerIds = [
            ...moduleLayerOrder,
            ...Array.from(new Set(
                currentModuleNodes
                    .map(node => node.layerId || 'modules')
                    .filter(layerId => !moduleLayerOrder.includes(layerId))
            )).sort()
        ];
        currentModuleLayerIds.forEach(layerId => {
            const layerNodes = currentModuleNodes.filter(node => (node.layerId || 'modules') === layerId);
            if (!layerNodes.length) {
                return;
            }
            const layerLabel = layerNodes[0].layerLabel || (layerId === 'modules' ? 'Modules' : moduleLayerLabel(layerId));
            chart += 'subgraph ' + moduleGraphSafeId('layer', layerId) + '["' + escapeMermaidLabel(layerLabel) + '"]\n';
            layerNodes.forEach(node => {
                chart += node.id + '["' + moduleGraphRenderNodeLabel(node) + '"]\n';
                groupedCurrentModuleIds.add(node.id);
            });
            chart += 'end\n\n';
        });
        nodes.forEach(node => {
            if (groupedCurrentModuleIds.has(node.id)) {
                return;
            }
            chart += node.id + '["' + moduleGraphRenderNodeLabel(node) + '"]\n';
        });
        edges.forEach(edge => {
            chart += edge.source + ' -->|' + escapeMermaidLabel(edge.label) + '| ' + edge.target + '\n';
        });
        chart += '\nclassDef currentModule fill:#dbeafe,stroke:#2563eb,color:#1e3a8a,stroke-width:2px;\n';
        chart += 'classDef relatedModule fill:#ecfccb,stroke:#65a30d,color:#365314;\n';
        chart += 'classDef externalSystem fill:#f3f4f6,stroke:#6b7280,color:#111827;\n';
        ['currentModule', 'relatedModule', 'externalSystem'].forEach(type => {
            const ids = nodes.filter(node => node.type === type).map(node => node.id);
            if (ids.length) {
                chart += 'class ' + ids.join(',') + ' ' + type + ';\n';
            }
        });

        graphShell.innerHTML = '<div class="mermaid">' + chart + '</div>';
        mermaid.run({querySelector: '#ModuleDependencyGraph .mermaid'}).catch(error => {
            console.error('Failed to render module dependency diagram', error);
        });
    }

                    incomingDependencies.push({

    function renderDependencySection() {

        const externalSystemsThisBrickDependsOn = brick.externalSystemsThisBrickDependsOn || brick.externalSystemDependencies || [];

        let sectionHtml = '<div class="home-section">';

        if (!brickDependencies.length && !incomingBrickDependencies.length && !externalSystemsThisBrickDependsOn.length && !externalSystemsDependingOnThisBrick.length) {

            return sectionHtml;
        }

        let chart = 'flowchart LR\n\n';
        chart += 'current[\"' + escapeMermaidLabel(brick.name || brick.id || 'Current Brick') + '\"]\n';

        brickDependencies.forEach((item, index) => {
            const linkedBrick = all_bricks.find(candidate => candidate.id === item.targetBrickId) || {};
            const nodeId = 'brickDep' + index;
            const nodeLabel = escapeMermaidLabel(linkedBrick.name || item.targetBrickId || 'Brick Dependency');
            const edgeLabel = dependencyEdgeLabel(item, 'dependency', '');
            chart += nodeId + '[\"' + nodeLabel + '\"]\n';
            chart += 'current -->|' + edgeLabel + '| ' + nodeId + '\n';
        });

        incomingBrickDependencies.forEach((item, index) => {
            const nodeId = 'incomingBrickDep' + index;
            const nodeLabel = escapeMermaidLabel(item.sourceBrickName || item.sourceBrickId || 'Dependent Brick');
            const edgeLabel = dependencyEdgeLabel(item, 'dependency', '');
            chart += nodeId + '[\"' + nodeLabel + '\"]\n';
            chart += nodeId + ' -->|' + edgeLabel + '| current\n';
        });

        externalSystemsThisBrickDependsOn.forEach((item, index) => {
            const nodeId = 'externalOutgoingDep' + index;
            const nodeLabel = escapeMermaidLabel(externalSystemName(item));
            const edgeLabel = dependencyEdgeLabel(item, 'external', '');
            chart += nodeId + '[\"' + nodeLabel + '\"]\n';
            chart += 'current -->|' + edgeLabel + '| ' + nodeId + '\n';
        });

        externalSystemsDependingOnThisBrick.forEach((item, index) => {
            const nodeId = 'externalIncomingDep' + index;
            const nodeLabel = escapeMermaidLabel(externalSystemName(item));
            const edgeLabel = dependencyEdgeLabel(item, 'external', '');
            chart += nodeId + '[\"' + nodeLabel + '\"]\n';
            chart += nodeId + ' -->|' + edgeLabel + '| current\n';
        });

        chart += '\nclassDef currentBrick fill:#dbeafe,stroke:#2563eb,color:#1e3a8a,stroke-width:2px;\n';
        chart += 'classDef internalBrick fill:#ecfccb,stroke:#6b7280,color:#111827;\n';
        chart += 'classDef externalSystem fill:#f3f4f6,stroke:#65a30d,color:#365314;\n';
        chart += 'class current currentBrick;\n';
        if (brickDependencies.length) {
            chart += 'class ' + brickDependencies.map((_, index) => 'brickDep' + index).join(',') + ' internalBrick;\n';
        }
        if (incomingBrickDependencies.length) {
            chart += 'class ' + incomingBrickDependencies.map((_, index) => 'incomingBrickDep' + index).join(',') + ' internalBrick;\n';
        }
        if (externalSystemsThisBrickDependsOn.length) {
            chart += 'class ' + externalSystemsThisBrickDependsOn.map((_, index) => 'externalOutgoingDep' + index).join(',') + ' externalSystem;\n';
        }
        if (externalSystemsDependingOnThisBrick.length) {
            chart += 'class ' + externalSystemsDependingOnThisBrick.map((_, index) => 'externalIncomingDep' + index).join(',') + ' externalSystem;\n';
        }

        sectionHtml += '<div class="dependency-subsection">';
        sectionHtml += '<div class="dependency-subsection-title">Brick Dependencies</div>';
        if (brickDependencies.length) {
            sectionHtml += renderBrickDependencyTable(brickDependencies);
        } else {
            sectionHtml += '<div class="activity-muted">No dependencies on other product bricks are listed.</div>';
        }
        sectionHtml += '</div>';

        sectionHtml += '<div class="dependency-subsection">';
        sectionHtml += '<div class="dependency-subsection-title">Dependent Bricks</div>';
        if (incomingBrickDependencies.length) {
            sectionHtml += renderIncomingBrickDependencyTable(incomingBrickDependencies);
        } else {
            sectionHtml += '<div class="activity-muted">No other product bricks currently depend on this brick.</div>';
        }
        sectionHtml += '</div>';

        sectionHtml += '<div class="dependency-subsection">';
        sectionHtml += '<div class="dependency-subsection-title">External Systems This Brick Depends On</div>';
        if (externalSystemsThisBrickDependsOn.length) {
            sectionHtml += renderExternalDependencyTable(externalSystemsThisBrickDependsOn, 'External System');
        } else {
            sectionHtml += '<div class="activity-muted">No outbound dependencies on external systems are listed.</div>';
        }
        sectionHtml += '</div>';

        sectionHtml += '<div class="dependency-subsection">';
        sectionHtml += '<div class="dependency-subsection-title">External Systems Depending On This Brick</div>';
        if (externalSystemsDependingOnThisBrick.length) {
            sectionHtml += renderExternalDependencyTable(externalSystemsDependingOnThisBrick, 'External System');
        } else {
            sectionHtml += '<div class="activity-muted">No inbound dependencies from external systems are listed.</div>';
        }
        sectionHtml += '</div>';

        sectionHtml += '<div class="dependency-subsection">';
        sectionHtml += '<div class="dependency-subsection-title">Dependency Diagram</div>';
        sectionHtml += '<div class="dependency-diagram"><div class="mermaid">' + chart + '</div></div>';
        sectionHtml += '</div>';

        sectionHtml += '</div>';
        return sectionHtml;
    }

    html += renderLayeredModules();
    document.getElementById('Modules').innerHTML = html;
    html = '';

    html += renderDataTab();
    document.getElementById('Data').innerHTML = html;
    html = '';

    html += renderReferenceLinks();
    document.getElementById('Links').innerHTML = html;
    html = '';

    html += renderDependencySection();
    document.getElementById('Dependencies').innerHTML = html;
    html = '';

    html += renderRelatedTeams();
    html += renderSupportedStreams();
    html += renderLinkedProducts();
    html += renderSupportedJobs();
    document.getElementById('Overview').innerHTML = html;
    html = '';
</script>


<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Transfer Pricing Compliance Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Bricks Index"
    },
    {
      "label": "Document Rendering and Export"
    }
  ]
};
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
