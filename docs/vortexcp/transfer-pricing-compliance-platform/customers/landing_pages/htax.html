 language", "Make R-AI available to local contacts in any language for template, deadline and local-form questions"]}, "year3": {"focus": "Replace manual uploads with direct ERP and operational transfer pricing integration as standard, so entity financials and segmented results arrive during the year, and give local contacts an audit-ready archive with local-language evidence packs.", "productTheme": "Integrated data and audit-ready local archive", "customerKPI": {"northStar": "Local data submission cycle time", "supporting": ["Entities fed directly from ERP integration", "Local audit requests answered from the platform"]}, "businessKPI": {"northStar": "Entities with data submitted through the platform per year", "revenueStreams": ["Integration and data exchange add-ons", "Collaborative and Full Service documentation per Local File", "Controversy and audit support consultation"], "supporting": ["ERP and operational TP integration attach rate", "Full Service Local Files delivered per year"]}, "milestones": ["Deliver standard connectors for major ERPs and operational transfer pricing solutions with segmentation keys maintained in the platform", "Generate a local-language audit evidence pack per entity and fiscal year on demand from the archive", "Track audit requests, responses and outcomes per entity with specialist support in the included expert hours"]}, "year5": {"focus": "Continuous local compliance: entity data that updates the documentation as it flows in, outliers flagged to the controller during the year, and AI-assisted local review and audit responses under specialist supervision.", "productTheme": "Continuous local compliance with AI-assisted review", "customerKPI": {"northStar": "Local data submission cycle time", "supporting": ["Hours spent per entity on data provision", "Time to assemble an audit evidence pack"]}, "businessKPI": {"northStar": "Entities with data submitted through the platform per year", "revenueStreams": ["Global Enterprise subscriptions with integration", "AI-assisted local review and audit response services", "Regulation intelligence and benchmark data products"], "supporting": ["Support cost per entity per cycle", "Local contacts using R-AI in their own language"]}, "milestones": ["Flag entities drifting outside their arm's-length range to the local controller and group tax during the year from integrated data", "Provide AI-drafted local review suggestions and audit responses in the local language for specialist and controller approval", "Reduce local data effort per entity to under four hours per cycle across the customer base"]}}}, "domain": "In-house Tax Teams of Multinationals"}, {"id": "lgcn", "name": "Corporate Legal Counsel / Company Secretary", "description": "In-house legal counsel or company secretary in the group legal function of a multinational with twenty to three hundred legal entities spread over thirty to sixty jurisdictions, the same groups whose tax teams run their transfer pricing documentation on Reptune.net (companies of the size of TomTom, Stahl, Avnet or Ravago). Keeps the corporate register of every entity current: incorporations, mergers and liquidations, shareholders and share capital, directors and supervisory boards, authorised signatories and powers of attorney, articles, registry extracts and board minutes. Drafts, negotiates and signs the intercompany service, licence, distribution, loan and cost-sharing agreements that give the group's transfer pricing policy its legal form, and is the person the tax team, auditors, banks and acquirers call when they need a structure chart as at a given date. Reports to the General Counsel and works with the Head of Tax, group finance, local directors and outside counsel; is judged on whether the corporate record is accurate and defensible on the day someone asks, and on whether every intercompany transaction has a signed agreement behind it.", "icon": "customer-lgcn-portrait.jpg", "careAbout": ["One time-stamped record per legal entity, shareholder, director and authorised signatory, so any question about who owned or could sign for an entity on a given date is answered from the system rather than from a scanned extract", "Every intercompany transaction in the transfer pricing register matched to a signed, in-force agreement with the right parties, term, pricing clause and governing law, before the Local File that describes it is generated", "Signature rounds for dozens of agreements that finish in days across time zones, with signatory authority verified against the register and a complete audit trail of who signed what and when", "Corporate documents, articles, registry extracts, powers of attorney and board resolutions filed against the entity they belong to and retrievable in seconds during an audit, a financing or a due diligence", "Current and historical legal structure charts that come out of the entity data itself and match the Master File, the CbCR and the statutory accounts without redrawing them in a drawing tool", "A shared system of record with the tax team, so entity names, addresses, functions and agreements appear identically in the documentation and in the legal files and neither team maintains a copy of the other's data"], "winsThem": ["A legal module that stores entity data with an effective date and full history, so the same record can be read as of today or as of the balance-sheet date of any prior year", "An intercompany agreement repository reconciled against the transfer pricing transaction register, with gaps, expiries and unsigned drafts surfaced as actions rather than discovered in an audit", "DocuSign integration that generates the agreement, sends it to the signatories recorded on the entity, tracks the envelope and files the signed copy back against the transaction", "Structure charts generated from shareholdings and entity data for any date, exported for boards, banks, auditors and the Master File, and updated the moment a corporate event is recorded", "Access rights per entity, region and role, ISO 27001-certified security and single sign-on, so local directors, outside counsel and auditors see exactly what they are entitled to and nothing else"], "theirFear": ["A tax authority or acquirer asking for the signed agreement behind an intercompany transaction and legal finding only an unsigned draft or a version whose parties no longer exist", "A structure chart in the Master File that contradicts the shareholder register or the statutory accounts because it was redrawn by hand months after the last restructuring", "An agreement signed by a director whose appointment had already ended, discovered only when the counterparty or a court challenges its validity"], "jobsToBeDone": [{"id": "jtbd-lgcn-1", "name": "Keep every legal entity and signatory record accurate and time-stamped", "whatItIs": "Maintain a single, dated corporate record for every legal entity in the group: identity, registration numbers, addresses, share capital and shareholders, directors, supervisory boards, authorised signatories and powers of attorney, fiscal year and statutory auditor, with the history of every change. The record has to serve the legal function, the tax team that scopes Local Files per entity, finance, auditors, banks and any buyer or seller in a transaction, and it has to be provably correct as at any historical date.", "outcome": "Every entity, shareholding, director and signatory is recorded once with effective dates and the supporting corporate documents, changes are captured within days of the corporate event, the tax and finance teams read entity data from the same record instead of maintaining their own lists, and the legal counsel can answer who owned or could sign for an entity on any date without searching e-mail or registry archives.", "steps": [{"step": "Build the entity master from registers and corporate documents", "description": "Load every legal entity of the group with its registration numbers, seat, addresses, legal form, share capital, fiscal year and statutory auditor from registry extracts, articles and the group's existing entity lists, using bulk upload from Excel where the group already holds the data. Reconcile the legal list with the entities the tax team has in the transfer pricing model and with the consolidation scope so one entity universe serves legal, tax and finance.", "streamsNeeded": [{"id": "manage-legal-entities-and-intercompany-agreements", "name": "Manage legal entities and intercompany agreements", "howItSupports": "Provides the legal entity records with registration data, addresses, legal form and share capital, bulk-loaded from Excel and registry extracts, as the single source of truth for the group's entities."}, {"id": "set-up-the-transfer-pricing-model", "name": "Set up the transfer pricing model", "howItSupports": "Shares the same entity universe with the transfer pricing model so the entities legal maintains are the entities the tax team scopes, documents and reports on."}]}, {"step": "Record shareholders, directors and authorised signatories with effective dates", "description": "Enter for each entity the shareholders and their percentage, the directors and board members with appointment and resignation dates, the authorised signatories with their signing authority and limits, and the powers of attorney in force, so that the register shows both who holds each role today and who held it at any previous date.", "streamsNeeded": [{"id": "manage-legal-entities-and-intercompany-agreements", "name": "Manage legal entities and intercompany agreements", "howItSupports": "Stores shareholders, directors, signatories and powers of attorney as time-stamped records with start and end dates, so the register can be read as of any date."}, {"id": "integrate-with-erp-operational-tp-and-identity", "name": "Integrate with ERP, operational TP and identity", "howItSupports": "Applies custom user profiles and access rights so only the legal function can change register data while local directors and the tax team have read access to their entities."}]}, {"step": "Process corporate events as dated changes rather than overwrites", "description": "When an entity is incorporated, merged, renamed, re-domiciled or liquidated, or a director or signatory changes, record the event with its effective date and the resolution or registry filing behind it, so the previous state is preserved and the tax team is told which entities enter or leave the documentation scope for the fiscal year.", "streamsNeeded": [{"id": "manage-legal-entities-and-intercompany-agreements", "name": "Manage legal entities and intercompany agreements", "howItSupports": "Records incorporations, mergers, name changes, liquidations and role changes as dated events with full history and the linked corporate document."}, {"id": "scope-and-plan-the-annual-documentation-cycle", "name": "Scope and plan the annual documentation cycle", "howItSupports": "Picks up entities that were added, merged or liquidated during the fiscal year so the documentation scope and the deadlines per entity reflect the legal reality."}]}, {"step": "File corporate documents against the entity they belong to", "description": "Store articles of association, registry extracts, shareholder registers, board and shareholder resolutions, powers of attorney, certificates of good standing and tax residence certificates in the corporate document repository, linked to the entity, the role or the event they evidence, with the version and the date they were obtained.", "streamsNeeded": [{"id": "manage-legal-entities-and-intercompany-agreements", "name": "Manage legal entities and intercompany agreements", "howItSupports": "Holds the corporate document repository with documents linked to entities, roles and corporate events, versioned and retrievable by entity and document type."}, {"id": "monitor-compliance-and-defend-audits", "name": "Monitor compliance and defend audits", "howItSupports": "Makes the corporate documents available as audit evidence next to the Local Files so a tax residence certificate or a board resolution is found in the same place as the documentation it supports."}]}, {"step": "Share entity data with tax, finance and auditors under controlled access", "description": "Give the transfer pricing team, group finance, local directors, outside counsel and auditors access to the entity records they need, with single sign-on, read-only and location-restricted profiles, and let the Master File and Local Files pull entity names, addresses, ownership and management data directly from the register instead of from a copied table.", "streamsNeeded": [{"id": "integrate-with-erp-operational-tp-and-identity", "name": "Integrate with ERP, operational TP and identity", "howItSupports": "Provides single sign-on, custom user profiles and read-only or location-restricted access so each stakeholder sees the entities and documents they are entitled to."}, {"id": "generate-master-file-and-local-files", "name": "Generate Master File and Local Files", "howItSupports": "Inserts entity identity, ownership and management data from the legal record into the organisational sections of the Master File and each Local File without re-keying."}]}], "media": [{"type": "image", "src": "media/jbtd-lgcn-jtbd-lgcn-1.png", "title": "Corporate Legal Counsel / Company Secretary JTBD infographic: Keep every legal entity and signatory record accurate and time-stamped", "alt": "Enterprise infographic for the job \"Keep every legal entity and signatory record accurate and time-stamped\" for customer \"Corporate Legal Counsel / Company Secretary\"."}]}, {"id": "jtbd-lgcn-2", "name": "Cover every intercompany transaction with a signed agreement", "whatItIs": "Make sure that every intercompany transaction the tax team documents, from management and shared services to licences, distribution, contract manufacturing, loans and cash pooling, rests on a written agreement that is signed by authorised representatives of both parties, in force for the period, consistent with the transfer pricing policy and the functional analysis, and available in the language and form the local tax authority expects. Includes drafting from templates, routing for e-signature, tracking renewals and amendments, and keeping the signed copy where the documentation can use it.", "outcome": "Every transaction in the intercompany transaction register is linked to a signed, in-force agreement whose parties, term, pricing clause and governing law match the Local File, unsigned drafts and expired agreements are surfaced as actions well before generation, signature rounds close in days through DocuSign, and the signed agreements are inserted into the documentation automatically.", "steps": [{"step": "Reconcile the transaction register against the agreement repository", "description": "Compare the intercompany transactions the tax team has registered per entity and fiscal year with the agreements on file, and list transactions without an agreement, agreements whose parties, term or subject no longer match the transaction, and agreements that exist only as unsigned drafts, so the gaps are known months before the Local Files are generated.", "streamsNeeded": [{"id": "manage-legal-entities-and-intercompany-agreements", "name": "Manage legal entities and intercompany agreements", "howItSupports": "Links each agreement to the transactions and entities it covers and reports transactions without an in-force agreement and agreements without a matching transaction."}, {"id": "set-up-the-transfer-pricing-model", "name": "Set up the transfer pricing model", "howItSupports": "Supplies the intercompany transaction register with transaction types, parties and methods that the agreements must mirror."}, {"id": "monitor-compliance-and-defend-audits", "name": "Monitor compliance and defend audits", "howItSupports": "Shows uncovered transactions as a risk indicator per entity and country on the compliance dashboard so tax and legal prioritise the same gaps."}]}, {"step": "Draft agreements from templates aligned with the transfer pricing policy", "description": "Generate service, licence, distribution, manufacturing, loan and cost-contribution agreements from group templates whose remuneration clauses reflect the transfer pricing method and the arm's-length range documented for that transaction type, fill in parties, effective dates and governing law from the entity records, and route the draft to tax for a policy check before it goes to signature.", "streamsNeeded": [{"id": "manage-legal-entities-and-intercompany-agreements", "name": "Manage legal entities and intercompany agreements", "howItSupports": "Generates agreement drafts from group templates with parties, addresses and signatories filled from the entity records and stores each version in the repository."}, {"id": "benchmark-intercompany-transactions", "name": "Benchmark intercompany transactions", "howItSupports": "Provides the transfer pricing method and arm's-length range per transaction type so the remuneration clause in the agreement matches what the Local File will defend."}]}, {"step": "Route agreements to authorised signatories through DocuSign", "description": "Send each agreement to the signatories recorded for both entities, in the order the group's signing rules require, through the DocuSign integration; follow envelope status per agreement, chase signatories who have not signed, and let the platform file the completed envelope with its certificate against the agreement and the transaction.", "streamsNeeded": [{"id": "manage-legal-entities-and-intercompany-agreements", "name": "Manage legal entities and intercompany agreements", "howItSupports": "Generates, sends, stores and tracks e-signature envelopes for agreements with the signatories taken from the entity's authorised-signatory record."}, {"id": "integrate-with-erp-operational-tp-and-identity", "name": "Integrate with ERP, operational TP and identity", "howItSupports": "Runs the DocuSign integration and identity checks so envelopes are created from the platform and completed documents return to it automatically."}]}, {"step": "Track terms, renewals, amendments and expiries", "description": "Keep the term, notice period, renewal mechanism and amendment history of every agreement, get reminded before an agreement expires or a pricing clause must be updated after a new benchmark, and record amendments, terminations and novations after a restructuring so the agreement in force for each fiscal year is unambiguous.", "streamsNeeded": [{"id": "manage-legal-entities-and-intercompany-agreements", "name": "Manage legal entities and intercompany agreements", "howItSupports": "Stores term, renewal and amendment data per agreement and links amendments, terminations and novations to the original agreement and the corporate event."}, {"id": "scope-and-plan-the-annual-documentation-cycle", "name": "Scope and plan the annual documentation cycle", "howItSupports": "Assigns renewal and update tasks with e-mail reminders in the same workflow the tax team uses for the documentation cycle so legal and tax deadlines are planned together."}]}, {"step": "Make the signed agreements part of the Local Files", "description": "Confirm which agreement version applies to each transaction and fiscal year so the generator can insert or reference the signed agreement in the relevant Local File, and arrange a translation or a local-language counterpart where the country requires agreements in the local language or a specific form.", "streamsNeeded": [{"id": "generate-master-file-and-local-files", "name": "Generate Master File and Local Files", "howItSupports": "Inserts the archived, signed intercompany agreements automatically into the Local Files of the entities that are party to them."}, {"id": "localise-and-translate-documentation", "name": "Localise and translate documentation", "howItSupports": "Provides machine translation with transfer pricing glossaries and human-certified translation for agreements that must be filed in the local language."}]}], "media": [{"type": "image", "src": "media/jbtd-lgcn-jtbd-lgcn-2.png", "title": "Corporate Legal Counsel / Company Secretary JTBD infographic: Cover every intercompany transaction with a signed agreement", "alt": "Enterprise infographic for the job \"Cover every intercompany transaction with a signed agreement\" for customer \"Corporate Legal Counsel / Company Secretary\"."}]}, {"id": "jtbd-lgcn-3", "name": "Produce current and historical structure charts on demand", "whatItIs": "Deliver a correct legal structure chart of the group, or of any sub-group, region or division, as it stands today or as it stood on any past date, whenever the board, the tax team, an auditor, a bank, a regulator or a potential acquirer asks for one. The chart must reflect the shareholdings and entities in the register, agree with the Master File, the CbCR and the consolidation, and be produced in minutes rather than redrawn by hand.", "outcome": "Structure charts are generated from the time-stamped entity and shareholding data for any date and any scope, exported in the formats boards, banks and the documentation need, inserted into the Master File and Local Files automatically, and the legal counsel never again maintains a slide deck that drifts from the register.", "steps": [{"step": "Generate the current chart from the entity and shareholding data", "description": "Produce the group chart, or a chart per region, division or intermediate holding, from the shareholder percentages, entity types and jurisdictions recorded in the register, with branches, partnerships and dormant entities shown according to the group's conventions, and export it for the board pack, the bank or the auditor.", "streamsNeeded": [{"id": "manage-legal-entities-and-intercompany-agreements", "name": "Manage legal entities and intercompany agreements", "howItSupports": "Draws the current legal structure chart from the entity and shareholding records for any scope and exports it without manual drawing."}, {"id": "integrate-with-erp-operational-tp-and-identity", "name": "Integrate with ERP, operational TP and identity", "howItSupports": "Controls who can view and export charts for which part of the group through user profiles and location-restricted access."}]}, {"step": "Reproduce the chart as at a historical date", "description": "Answer an audit, a tax authority, a due-diligence team or the CbCR preparer with the structure as it was at the balance-sheet date of a previous fiscal year or on the date of a specific transaction, generated from the dated history of shareholdings and entities rather than from an old presentation found in an archive.", "streamsNeeded": [{"id": "manage-legal-entities-and-intercompany-agreements", "name": "Manage legal entities and intercompany agreements", "howItSupports": "Generates historical structure charts from the time-stamped register for any past date and keeps them with the corporate documents of that period."}, {"id": "monitor-compliance-and-defend-audits", "name": "Monitor compliance and defend audits", "howItSupports": "Lets the tax team attach the dated chart to the audit evidence for the fiscal year under review."}]}, {"step": "Insert the chart into the Master File, Local Files and CbCR", "description": "Provide the organisational structure required by the OECD Master File template and the local ownership section of each Local File from the same chart data, and confirm that the constituent entities and their jurisdictions in the CbCR match the entities and shareholdings in the register for the reporting fiscal year.", "streamsNeeded": [{"id": "generate-master-file-and-local-files", "name": "Generate Master File and Local Files", "howItSupports": "Inserts the generated structure chart and ownership data into the Master File and the ownership sections of the Local Files at generation time."}, {"id": "prepare-and-file-cbcr-and-notifications", "name": "Prepare and file CbCR and notifications", "howItSupports": "Uses the entity register to validate the list of constituent entities, jurisdictions and main business activities in Table 2 of the CbCR."}]}, {"step": "Model a planned restructuring before it happens", "description": "Prepare the structure after a planned merger, disposal, acquisition or holding reorganisation as a future-dated scenario, share it with tax to assess the transfer pricing and documentation consequences, and turn it into the recorded structure with the right effective dates once the transaction closes.", "streamsNeeded": [{"id": "manage-legal-entities-and-intercompany-agreements", "name": "Manage legal entities and intercompany agreements", "howItSupports": "Supports future-dated entity and shareholding changes so a planned restructuring can be charted and then activated on its effective date."}, {"id": "monitor-compliance-and-defend-audits", "name": "Monitor compliance and defend audits", "howItSupports": "Feeds the value chain analysis and risk assessment that show which Local Files, agreements and benchmarks a restructuring will change."}]}, {"step": "Distribute charts to boards, banks, auditors and counsel", "description": "Export charts in the formats each audience needs, keep the version that was sent for a financing, a board meeting or an audit, and give recurring recipients such as auditors and outside counsel read-only access to the current chart instead of e-mailing a new file after every corporate event.", "streamsNeeded": [{"id": "manage-legal-entities-and-intercompany-agreements", "name": "Manage legal entities and intercompany agreements", "howItSupports": "Exports charts as documents and images, stores the distributed versions with the corporate documents and links each to the date and scope it represents."}, {"id": "integrate-with-erp-operational-tp-and-identity", "name": "Integrate with ERP, operational TP and identity", "howItSupports": "Provides read-only, scoped access through single sign-on so auditors and outside counsel view the live chart without receiving copies."}]}], "media": [{"type": "image", "src": "media/jbtd-lgcn-jtbd-lgcn-3.png", "title": "Corporate Legal Counsel / Company Secretary JTBD infographic: Produce current and historical structure charts on demand", "alt": "Enterprise infographic for the job \"Produce current and historical structure charts on demand\" for customer \"Corporate Legal Counsel / Company Secretary\"."}]}], "customerJourneyStories": [{"id": "journey-lgcn-1", "name": "From the tax team's licence to a shared legal system of record", "linkedJobIds": ["jtbd-lgcn-1", "jtbd-lgcn-2"], "summary": "A corporate legal counsel at a European industrial group with about 120 entities in 45 countries, whose tax team has run Reptune.net for years, adopts the Legal Module after an audit exposes the gap between the legal files and the transfer pricing documentation, and ends up owning the entity and agreement record that both functions work from.", "stages": [{"stage": "Trigger", "narrative": "A tax audit in Italy asks for the signed intercompany service agreement behind a management fee and for the group structure as at the end of the audited year. The Local File describes the transaction, but legal finds only an unsigned 2019 draft in a shared drive and a structure chart in a slide deck that predates two mergers. The Head of Tax and the General Counsel agree that entity and agreement data must live in one system that both functions maintain."}, {"stage": "Discovery", "narrative": "The Head of Tax mentions that the platform the group already uses for its documentation has a Legal Module with time-stamped entity data, an agreement repository, structure charts and DocuSign, and asks Reptune to show it to legal. In the demo the legal counsel sees the entities the tax team already maintains, agreements linked to transactions, and a chart generated from shareholdings for any date, and notes that the tax team's entity list is already the one legal would have had to build."}, {"stage": "Evaluation", "narrative": "The legal counsel compares the Legal Module with the specialised entity management suite the group's outside counsel proposes and with extending the existing document management system. The deciding factors are that the entity and agreement data feed the Local Files directly, that time-stamped history and DocuSign are included, that access can be restricted per entity and region, and that the platform is ISO 27001 certified and already passed the group's vendor review when tax licensed it. The module is priced as an add-on to the group's Enterprise plan, which finance accepts."}, {"stage": "Trial", "narrative": "The first real use is the European region: forty entities are enriched with shareholders, directors, signatories and registry extracts, the agreements for the audited Italian transactions are located, signed through DocuSign and linked to the transaction register, and the structure chart as at the audited year end is generated from the dated data and handed to the auditors. The audit request is answered in a week instead of a month of searching."}, {"stage": "Engagement", "narrative": "Within two quarters all entities are in the module and legal records every corporate event with its effective date and resolution. The reconciliation of transactions against agreements runs before each documentation cycle, uncovered transactions become tasks with reminders, and the Master File and Local Files pull ownership data and signed agreements from the legal record. The quarterly review with the Head of Tax runs on the same dashboard."}, {"stage": "Retention", "narrative": "At renewal the legal counsel reports that agreement coverage rose from three quarters of transactions to nearly all, that structure charts are produced the same day, and that the next audit request was answered from the system. The group adds read-only access for its auditors and outside counsel and the legal counsel becomes the reference for other legal departments Reptune introduces the module to."}], "media": [{"type": "image", "src": "media/journey-lgcn-lgcn-1.png", "title": "Corporate Legal Counsel / Company Secretary customer journey: From the tax team's licence to a shared legal system of record", "alt": "Enterprise journey storyboard for \"From the tax team's licence to a shared legal system of record\" for customer \"Corporate Legal Counsel / Company Secretary\"."}]}, {"id": "journey-lgcn-2", "name": "Bringing e-signature and the agreement lifecycle into the group's routine", "linkedJobIds": ["jtbd-lgcn-2", "jtbd-lgcn-3"], "summary": "Having run the entity register in the Legal Module for a year, the company secretary of a multinational with entities in 30 countries adopts the DocuSign integration and the agreement renewal workflow to end the year-end scramble for wet-ink signatures, and later uses the same data for restructuring scenarios and future-dated structure charts.", "stages": [{"stage": "Trigger", "narrative": "The annual update of intercompany agreements after a benchmark refresh means sixty agreements have to be signed by directors in fourteen time zones before year end. Couriered originals, scanned signatures and one agreement signed by a director who had already resigned turn the exercise into a six-week project, and the company secretary decides that signature and renewal must run as a workflow, not as an e-mail campaign."}, {"stage": "Discovery", "narrative": "In the annual account review Reptune's customer success manager shows the DocuSign integration that the group has licensed but not switched on, the renewal reminders in the workflow, and how other clients run a signature round in days with signatories taken from the register. A short call with a legal team already using it convinces the company secretary that the setup is a configuration, not a project."}, {"stage": "Evaluation", "narrative": "The company secretary checks with outside counsel in which jurisdictions electronic signatures are valid for intercompany agreements and where a qualified signature or a local-language counterpart is required, verifies that the platform checks signatory authority against the register at the moment of sending, reviews the envelope audit trail and certificate, and confirms with IT that the DocuSign account is covered by the group's existing contract and single sign-on."}, {"stage": "Trial", "narrative": "The first bounded use is the renewal of all management service agreements for one division: drafts are generated from the template with parties and signatories filled from the register, sent through DocuSign in the order the signing rules require, and filed back against the transactions with their certificates. The round closes in eight days and the tax team sees the signed agreements appear in the Local Files at the next generation."}, {"stage": "Engagement", "narrative": "All agreement types move to the workflow. Expiries and pricing-clause updates are tracked as tasks with reminders, amendments and novations after a small restructuring are recorded against the original agreements, and the company secretary models the planned merger of two holdings as a future-dated scenario whose chart tax uses to assess the documentation impact before the transaction closes."}, {"stage": "Retention", "narrative": "A year later the year-end signature round is a non-event, signatory authority exceptions have disappeared, and the audit committee receives a report on agreement coverage per entity from the dashboard. The group extends the module to a newly acquired sub-group on day one of integration and asks Reptune for local-language agreement templates for its Latin American entities."}], "media": [{"type": "image", "src": "media/journey-lgcn-lgcn-2.png", "title": "Corporate Legal Counsel / Company Secretary customer journey: Bringing e-signature and the agreement lifecycle into the group's routine", "alt": "Enterpri nessKPI": {"northStar": "Legal Module attach rate", "revenueStreams": ["Legal Module add-on licences on Core, Advanced and Enterprise plans", "Legal Module onboarding and data loading services", "Expert hours for agreement template and policy alignment"], "supporting": ["Entities managed in the Legal Module", "Legal Module clients with DocuSign enabled"]}, "milestones": ["Ship the transaction-to-agreement reconciliation that lists uncovered, expired and mismatched agreements before each documentation cycle", "Check signatory authority against the register at the moment a DocuSign envelope is sent and file the completed envelope against the agreement and transaction", "Generate current and historical structure charts from the time-stamped register and insert them into the Master File and Local Files at generation"]}, "year3": {"focus": "Make the Legal Module a reason to buy the platform in its own right: agreement templates per transaction type and jurisdiction in local languages, future-dated restructuring scenarios shared with tax, registry connections that keep entity data current, and scoped access for auditors and outside counsel.", "productTheme": "Legal-led entity and agreement governance across jurisdictions", "customerKPI": {"northStar": "Intercompany agreement coverage", "supporting": ["Transactions without an in-force agreement", "Structure chart delivery time"]}, "businessKPI": {"northStar": "Legal Module attach rate", "revenueStreams": ["Legal Module licences sold to legal departments independently of the documentation plan", "Local-language agreement template packs per jurisdiction", "Registry connection and auditor access add-ons"], "supporting": ["Legal Module recurring revenue growth", "Legal-led new client wins per year"]}, "milestones": ["Launch agreement template packs per transaction type with remuneration clauses aligned to the transfer pricing method and local-language counterparts for the top thirty documentation countries", "Support future-dated restructuring scenarios whose charts and agreement impacts flow into the value chain analysis and the documentation scope", "Connect to commercial registers in the main European jurisdictions so entity and director changes are proposed to legal for confirmation instead of keyed by hand"]}, "year5": {"focus": "Let AI agents draft agreements, detect coverage gaps as transactions and financials flow in, and prepare audit and due-diligence evidence packs for legal approval, so the legal record and the documentation stay continuously consistent across the group.", "productTheme": "Continuously consistent legal record and documentation", "customerKPI": {"northStar": "Intercompany agreement coverage", "supporting": ["Agreement-to-transaction reconciliation cycle time", "Corporate events recorded within five working days"]}, "businessKPI": {"northStar": "Legal Module attach rate", "revenueStreams": ["AI agreement drafting and review agent add-ons", "Audit and due-diligence evidence pack services", "Cross-jurisdiction entity governance data products"], "supporting": ["Legal Module net revenue retention", "Legal Module churn rate"]}, "milestones": ["Deploy an agreement agent that drafts, amends and flags agreements from changes in the transaction register and benchmarks for legal approval", "Produce due-diligence and audit evidence packs per entity and period with dated charts, agreements and corporate documents on request", "Run entity governance for groups with entities in more than a hundred jurisdictions with registry data, local-language agreements and multi-division access on one tenant"]}}}, "domain": "Legal and Corporate Governance"}, {"id": "tadv", "name": "Transfer Pricing Adviser at a Tax Advisory Firm", "description": "Partner or senior manager in the transfer pricing practice of an international network firm's member office or of an independent tax boutique in the Netherlands, Belgium, Germany or the United Kingdom, serving ten to forty client groups with five to eighty entities each, mostly mid-sized multinationals without a dedicated in-house transfer pricing team. Prepares Master Files, Local Files, benchmarks and CbCR for those clients every year, licenses Reptune.net to do so at a fraction of the traditional effort instead of building each file in Word, and relies on Reptune's country regulations, translation and specialist support for the countries the firm has no desk in. Leads two to six advisers and is judged on chargeable leverage per adviser, realisation of fixed fees, quality of files under audit, retention of clients from year to year and growth of a recurring compliance practice next to advisory work.", "icon": "customer-tadv-portrait.jpg", "careAbout": ["Documentation prepared with a fraction of the adviser hours it takes in Word, so a fixed fee per Local File still leaves a margin and junior time goes into analysis rather than formatting", "Consistent quality across every client and every country: the same structure, wording and functional analysis logic, so a file reviewed for one entity holds for the others", "Local content, format, language and filing rules for countries the firm does not cover, available without subcontracting a correspondent firm for every local file", "Strict separation between clients, with access per client organisation, so no client ever sees another's data and the firm's professional confidentiality obligations are met", "Clients rolling forward year after year with the model already set up, so the documentation engagement becomes recurring revenue instead of an annual re-pitch", "Signals from the platform, such as entities outside their arm's-length range, uncovered transactions or new local requirements, that turn into advisory work the firm can sell"], "winsThem": ["A rule-based generator that produces the full set of Master File and Local Files for a client group at the press of a button once company types, functional analyses, methods and benchmarks are configured", "Localised templates, country regulations and local forms for 170+ countries maintained by transfer pricing specialists, with machine translation into 28 languages and human-certified translation where required", "Client organisations and divisions with unlimited users, custom user profiles and single sign-on, so each client's data is isolated and the firm's house style is applied to every report", "A workload view across all clients with scoping, tasks, reminders and auto-calculated deadlines per entity and country, so the busy season is planned rather than survived", "Reptune specialists and the R-AI country expert as a back-up for country questions and peak capacity, at fixed rates, without the firm building a global network itself"], "theirFear": ["A client's local file being rejected or penalised in a country the firm does not know well because a threshold, a content rule or a language requirement was missed", "The fixed fee per Local File being eaten by adviser hours because data collection and drafting still run through e-mail and Word, leaving the practice unprofitable", "A platform vendor that also sells full-service documentation walking away with the firm's clients once they have been set up on it"], "jobsToBeDone": [{"id": "jtbd-tadv-1", "name": "Prepare documentation for many clients with fewer adviser hours", "whatItIs": "Deliver the annual Master File and Local Files for ten to forty client groups with a small team, by setting each client's transfer pricing model up once on the platform, collecting data through templates instead of interviews and e-mail, generating the files rather than writing them, and reviewing at the level of judgement rather than formatting. The firm's house style, templates and quality standards apply to every client, and the whole portfolio is run from one workload view.", "outcome": "Adviser hours per Local File fall to a fraction of the Word-based process, a fixed fee per file leaves a healthy margin, files are consistent across clients and countries, review rounds shrink because the generator applies the same logic everywhere, and the practice serves more clients with the same team during the busy season.", "steps": [{"step": "Set up each client group as its own organisation with its model", "description": "Create a client organisation on the firm's licence with the client's entities, company types, functional analyses, intercompany transactions, transfer pricing methods and benchmarks, configured once so every Local File for that client draws on the same model, with access restricted to the engagement team and the client contacts who are allowed to see it.", "streamsNeeded": [{"id": "set-up-the-transfer-pricing-model", "name": "Set up the transfer pricing model", "howItSupports": "Configures entities, company types, functional analyses, methods and templates per client group in days, with the R-AI onboarding assistant and Excel bulk entry for the initial load."}, {"id": "integrate-with-erp-operational-tp-and-identity", "name": "Integrate with ERP, operational TP and identity", "howItSupports": "Provides client organisations, divisions, custom user profiles and single sign-on so each client's data is isolated and the engagement team's access is scoped."}]}, {"step": "Collect client data through templates instead of interviews", "description": "Send the client's finance contacts the Excel templates for entity financials, segmented P&L and transactional data, or connect the client's ERP where the volume justifies it, and let the built-in validation flag missing or inconsistent figures before the adviser looks at them, so the data round is a checklist rather than a series of calls.", "streamsNeeded": [{"id": "collect-and-validate-financial-and-transactional-data", "name": "Collect and validate financial and transactional data", "howItSupports": "Delivers the Excel templates, bulk upload and validation that turn client submissions into validated financials and transactional data with actions required."}, {"id": "scope-and-plan-the-annual-documentation-cycle", "name": "Scope and plan the annual documentation cycle", "howItSupports": "Assigns data collection tasks to client contacts with e-mail reminders and shows per client which entities have submitted."}]}, {"step": "Generate the full set of files and review at the level of judgement", "description": "Generate the Master File and all Local Files for a client group in draft, review functional analysis wording, method application and the comparison of each entity's segmented results with its benchmark range, use AI-assisted writing to refine narrative sections, and issue the final versions in the firm's house style.", "streamsNeeded": [{"id": "generate-master-file-and-local-files", "name": "Generate Master File and Local Files", "howItSupports": "Produces Master File and Local Files from the validated model with benchmarks and agreements inserted, custom text and report styling, in draft and final."}, {"id": "benchmark-intercompany-transactions", "name": "Benchmark intercompany transactions", "howItSupports": "Compares each entity's segmented results against the arm's-length range so the reviewer sees exceptions instead of recalculating them."}]}, {"step": "Standardise the firm's templates and house style across clients", "description": "Maintain the firm's custom template, standard text blocks and report styling once, apply them to every client organisation, and update them centrally when the firm's methodology or the OECD guidance changes, so a reviewer recognises the same structure in every file regardless of which adviser prepared it.", "streamsNeeded": [{"id": "generate-master-file-and-local-files", "name": "Generate Master File and Local Files", "howItSupports": "Holds the custom templates, custom text and styling that the firm applies across clients and updates them centrally."}, {"id": "set-up-the-transfer-pricing-model", "name": "Set up the transfer pricing model", "howItSupports": "Lets the firm reuse company types and functional analysis patterns as starting points when a new client is set up."}]}, {"step": "Run every client's cycle from one workload view", "description": "Scope documentation per client, entity and country, assign advisers, watch auto-calculated deadlines across the whole portfolio, and balance the team's workload through the busy season so no client's file is started too late and no adviser is idle while another is overloaded.", "streamsNeeded": [{"id": "scope-and-plan-the-annual-documentation-cycle", "name": "Scope and plan the annual documentation cycle", "howItSupports": "Provides scoping, task assignment, reminders and calculated deadlines per client so the firm sees its whole portfolio's status and workload."}, {"id": "monitor-compliance-and-defend-audits", "name": "Monitor compliance and defend audits", "howItSupports": "Shows the compliance status per client and country on the dashboard and worldmap the partner uses to steer the practice."}]}], "media": [{"type": "image", "src": "media/jbtd-tadv-jtbd-tadv-1.png", "title": "Transfer Pricing Adviser at a Tax Advisory Firm JTBD infographic: Prepare documentation for many clients with fewer adviser hours", "alt": "Enterprise infographic for the job \"Prepare documentation for many clients with fewer adviser hours\" for customer \"Transfer Pricing Adviser at a Tax Advisory Firm\"."}]}, {"id": "jtbd-tadv-2", "name": "Deliver locally compliant files in countries my firm does not cover", "whatItIs": "Prepare Local Files, local forms and CbCR notifications for client entities in jurisdictions where the firm has no office or correspondent, and make them compliant with local thresholds, content requirements, formats, language rules and deadlines without subcontracting a local firm for each file. Relies on the platform's maintained country regulations, localised templates, machine and certified translation, the R-AI country expert and Reptune's specialists as a back-up.", "outcome": "The firm confidently accepts engagements covering countries it does not staff, local files are prepared to the local standard in the required language and form, notifications and filings are not missed, subcontracting cost falls, and clients keep a single adviser for their whole footprint.", "steps": [{"step": "Check local thresholds and requirements before scoping", "description": "For every client entity, verify with the country regulations whether a Local File, Master File, CbCR notification or local form is required at the entity's revenue and transaction volumes, what the content and language requirements are, and when it must be prepared or filed, before committing to a scope and a fee.", "streamsNeeded": [{"id": "maintain-country-regulations-and-deadlines", "name": "Maintain country regulations and deadlines", "howItSupports": "Provides current thresholds, content, format, language and deadline rules per country, maintained by specialists for 170+ countries."}, {"id": "scope-and-plan-the-annual-documentation-cycle", "name": "Scope and plan the annual documentation cycle", "howItSupports": "Applies the country rules to the client's entities to propose the documentation scope and calculate deadlines per entity."}]}, {"step": "Apply localised templates and local forms", "description": "Generate the Local File with the country's localised template where one exists, add the country-specific sections and annexes the local authority expects, and complete the local forms and procedures that accompany the file, following the platform's guidance rather than reconstructing them from local legislation.", "streamsNeeded": [{"id": "localise-and-translate-documentation", "name": "Localise and translate documentation", "howItSupports": "Supplies country templates, content rules, local forms and procedures that turn an English local file into a locally compliant one."}, {"id": "generate-master-file-and-local-files", "name": "Generate Master File and Local Files", "howItSupports": "Generates the file on the localised template with country-specific sections and the client's data already in place."}]}, {"step": "Translate files with glossaries and certify where required", "description": "Translate Local Files and agreements into the local language with the platform's machine translation and transfer pricing glossaries, have a specialist or a certified translator review where the country requires a certified or sworn translation, and keep the English and local versions linked to the same generation.", "streamsNeeded": [{"id": "localise-and-translate-documentation", "name": "Localise and translate documentation", "howItSupports": "Provides machine translation into 28 languages with glossaries and the human-certified translation option, linked to the source file."}, {"id": "deliver-documentation-as-a-service", "name": "Deliver documentation as a service", "howItSupports": "Lets the firm order certified translation and local review from Reptune specialists at fixed rates when its own team cannot review the language."}]}, {"step": "Handle CbCR notifications and filings per jurisdiction", "description": "Determine for each client entity where a CbCR notification is due and in what form, prepare the notifications and the CbCR XML for the reporting entity, and track filing dates and confirmations per jurisdiction, including public CbCR obligations for clients in scope of the EU directive.", "streamsNeeded": [{"id": "prepare-and-file-cbcr-and-notifications", "name": "Prepare and file CbCR and notifications", "howItSupports": "Produces filing-ready CbCR XML and Excel, EU Public CbCR in XHTML with inline XBRL, and notifications with local filing guidance."}, {"id": "maintain-country-regulations-and-deadlines", "name": "Maintain country regulations and deadlines", "howItSupports": "Keeps notification and filing deadlines and formats per country current so the firm files in the right form on time."}]}, {"step": "Escalate country questions to the country expert and Reptune specialists", "description": "Ask the R-AI country expert about a local requirement in any language, and where the answer needs a specialist, use the included expert hours or a fixed-rate specialist engagement to review the file from the local perspective, so the firm can stand behind a file in a country it has never filed in.", "streamsNeeded": [{"id": "maintain-country-regulations-and-deadlines", "name": "Maintain country regulations and deadlines", "howItSupports": "Surfaces country rules through the R-AI country expert so most local questions are answered without a call."}, {"id": "deliver-documentation-as-a-service", "name": "Deliver documentation as a service", "howItSupports": "Provides Reptune specialists for local review and on-demand advice within expert hours or at fixed rates per Local File."}]}], "media": [{"type": "image", "src": "media/jbtd-tadv-jtbd-tadv-2.png", "title": "Transfer Pricing Adviser at a Tax Advisory Firm JTBD infographic: Deliver locally compliant files in countries my firm does not cover", "alt": "Enterprise infographic for the job \"Deliver locally compliant files in countries my firm does not cover\" for customer \"Transfer Pricing Adviser at a Tax Advisory Firm\"."}]}, {"id": "jtbd-tadv-3", "name": "Grow a recurring documentation practice", "whatItIs": "Turn transfer pricing documentation from an annual project sold and staffed anew every year into a recurring, fixed-fee service that rolls forward client by client, expands to more entities, countries and adjacent services such as benchmarks, agreements, risk reviews and CbCR, and is delivered with predictable margin whether the firm's own team or Reptune specialists do the work.", "outcome": "Clients renew the documentation service year after year with minimal rework, revenue per client grows through added countries and services, the firm sells advisory work from signals the platform produces, capacity peaks are absorbed with Reptune's specialists instead of lost engagements, and the practice's recurring revenue and margin are visible and growing.", "steps": [{"step": "Package documentation as a fixed-fee annual service", "description": "Define the firm's documentation service per client in tiers, priced per Local File and country, with data collection, generation, localisation and delivery scheduled on the platform's workflow and the firm's margin protected by the platform's known cost per file, so proposals are made from a standard rather than an estimate.", "streamsNeeded": [{"id": "deliver-documentation-as-a-service", "name": "Deliver documentation as a service", "howItSupports": "Provides the fixed-rate-per-Local-File delivery model and service levels that the firm mirrors in its own client proposals."}, {"id": "scope-and-plan-the-annual-documentation-cycle", "name": "Scope and plan the annual documentation cycle", "howItSupports": "Turns the agreed scope per client into a planned cycle with tasks, deadlines and status the client can follow."}]}, {"step": "Roll clients forward year on year with minimal rework", "description": "Start the new fiscal year from the previous year's model, entities and transactions, update only what changed, collect the new financials through the same templates, and regenerate the files, so the second year of a client costs a fraction of the first and the engagement compounds instead of restarting.", "streamsNeeded": [{"id": "set-up-the-transfer-pricing-model", "name": "Set up the transfer pricing model", "howItSupports": "Carries the client's model, company types, methods and benchmarks into the next fiscal year with changes applied once."}, {"id": "collect-and-validate-financial-and-transactional-data", "name": "Collect and validate financial and transactional data", "howItSupports": "Reuses the client's templates and mappings so the annual data round is a repeat, not a new exercise."}]}, {"step": "Sell adjacent services from platform signals", "description": "Use the platform's exceptions, such as entities outside their arm's-length range, transactions without a signed agreement, new local requirements or CbCR risk indicators, to propose benchmark refreshes, agreement work, risk reviews, value chain analyses or CbCR analysis to the client as scoped advisory engagements.", "streamsNeeded": [{"id": "benchmark-intercompany-transactions", "name": "Benchmark intercompany transactions", "howItSupports": "Flags entities whose segmented results fall outside their benchmark range, the natural trigger for a benchmark refresh or a pricing adjustment engagement."}, {"id": "monitor-compliance-and-defend-audits", "name": "Monitor compliance and defend audits", "howItSupports": "Provides risk indicators, compliance gaps and value chain analysis per client that the adviser turns into advisory proposals."}, {"id": "manage-legal-entities-and-intercompany-agreements", "name": "Manage legal entities and intercompany agreements", "howItSupports": "Shows transactions without an in-force agreement so the firm can offer agreement drafting and legal alignment work."}]}, {"step": "Give clients a dashboard view so they see the value", "description": "Give the client's finance or tax contact read-only access to their compliance dashboard, deadlines and delivered files, so the client sees progress and completeness without asking, experiences the service as continuous rather than as an annual deliverable, and has a reason to renew.", "streamsNeeded": [{"id": "monitor-compliance-and-defend-audits", "name": "Monitor compliance and defend audits", "howItSupports": "Provides the compliance dashboard and worldmap the client can view for its own entities and countries."}, {"id": "scope-and-plan-the-annual-documentation-cycle", "name": "Scope and plan the annual documentation cycle", "howItSupports": "Shows the client the status of tasks and deadlines for its cycle and the files delivered so far."}]}, {"step": "Co-deliver with Reptune specialists when capacity is short", "description": "Hand a  The partner concludes that the practice cannot grow, or even stay profitable, on the current way of working."}, {"stage": "Discovery", "narrative": "At a transfer pricing conference the partner hears a Head of Tax describe how his group generates all its Local Files from one model on Reptune.net, and shortly after receives a call from Reptune's partner programme, which since the Vortex investment actively approaches advisory firms. A demo on the firm's own anonymised client shows a Master File and eight Local Files generated in an afternoon."}, {"stage": "Evaluation", "narrative": "The partner evaluates the platform against two international documentation tools and against building templates in the firm's document system. The decisive points are the price per Local File against the firm's fee, the country regulations and localised templates for clients' countries, strict client separation with client organisations and access profiles, the ISO 27001 certification the firm's risk partner requires, and an explicit understanding of how Reptune's own full-service offering and the firm's clients coexist under the partner terms."}, {"stage": "Trial", "narrative": "In the free two-week trial the team sets up one client group with twelve entities, loads financials through the Excel templates and generates the full set of Local Files in the firm's house style. Two advisers prepare in three days what took three weeks the year before, and the client's finance director notices that the files are more consistent than the previous year's."}, {"stage": "Engagement", "narrative": "Over the following season all twenty clients are set up as organisations on the firm's licence, data collection runs through templates with reminders, and the partner steers the busy season from the workload view. Review time is spent on functional analysis and benchmark exceptions, and the firm starts proposing fixed-fee annual documentation packages priced on the known cost per file."}, {"stage": "Retention", "narrative": "At renewal the partner reports adviser hours per Local File cut by more than half and a documentation margin the practice has never had, wins back the lost client at a competitive fee, and moves to a larger licence to serve forty client groups with the same team. The firm becomes a reference partner and refers two of its own clients to Reptune for a direct Enterprise licence with the firm as adviser."}], "media": [{"type": "image", "src": "media/journey-tadv-tadv-1.png", "title": "Transfer Pricing Adviser at a Tax Advisory Firm customer journey: From Word templates to a licensed platform practice", "alt": "Enterprise journey storyboard for \"From Word templates to a licensed platform practice\" for customer \"Transfer Pricing Adviser at a Tax Advisory Firm\"."}]}, {"id": "journey-tadv-2", "name": "Adding countries and languages the firm does not cover", "linkedJobIds": ["jtbd-tadv-2", "jtbd-tadv-3"], "summary": "A transfer pricing senior manager at a Belgian member firm of an international network, already running documentation for its clients on Reptune.net, adopts the country regulations, machine translation, R-AI country expert and Reptune specialist support when a key client expands into Latin America and Asia, and ends up offering worldwide coverage as a standard service.", "stages": [{"stage": "Trigger", "narrative": "A long-standing client acquires subsidiaries in Mexico, Brazil, India and Vietnam and asks the firm to keep preparing all its documentation. The network's local offices quote fees per Local File higher than the firm charges for the whole group, respond slowly and use their own formats, and the senior manager fears either losing the client to a Big Four firm or delivering non-compliant files in countries the team has never worked in."}, {"stage": "Discovery", "narrative": "In a Reptune partner webinar on local requirements the senior manager sees how the country regulations, localised templates and local forms cover the new countries, how machine translation with transfer pricing glossaries handles Spanish and Portuguese, and how the R-AI country expert answers local questions in any language. A Reptune specialist explains how Collaborative delivery can add a local review at a fixed rate per file."}, {"stage": "Evaluation", "narrative": "The senior manager checks the country content for the four new jurisdictions against the network's own alerts, tests the translation on a previous year's file with a Portuguese-speaking colleague, confirms with the risk partner that certified translation and a specialist review satisfy the firm's quality standards for countries without a local desk, and compares the add-on cost with the local offices' quotes."}, {"stage": "Trial", "narrative": "The first real use is the Mexican and Brazilian Local Files for the client's fiscal year: thresholds are checked in the country regulations, the files are generated on the localised templates, translated in the platform with a certified review, and a Reptune specialist reviews both from the local perspective. Both files are accepted by the client's local advisers without material changes, at a third of the local offices' quoted fee."}, {"stage": "Engagement", "narrative": "The firm activates machine translation and the R-AI country expert across all its clients, scopes new engagements with the country regulations before pricing, prepares CbCR notifications for every jurisdiction from the platform, and books Reptune specialists as a standing back-up for local reviews. Worldwide coverage becomes a line in every proposal instead of a caveat."}, {"stage": "Retention", "narrative": "Within two years the firm serves client entities in more than thirty countries without a single subcontracted local file, has won three clients whose previous adviser could not cover their footprint, and has cut subcontracting cost to a small share of its documentation fees. The senior manager sits on Reptune's partner advisory group and asks for local-language agreement templates as the next addition."}], "media": [{"type": "image", "src": "media/journey-tadv-tadv-2.png", "title": "Transfer Pricing Adviser at a Tax Advisory Firm customer journey: Adding countries and languages the firm does not cover", "alt": "Enterprise journey storyboard for \"Adding countries and languages the firm does not cover\" for customer \"Transfer Pricing Adviser at a Tax Advisory Firm\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-tadv-top", "name": "Local files delivered per adviser", "description": "Number of final Local Files delivered to clients per full-time transfer pricing adviser in the practice per year. Modeled seed value for a mid-sized advisory practice, not an official Reptune or firm figure.", "unit": "local files per adviser per year", "currentValue": "18", "targetValue": "45", "link": "https://dashboard.example.com/transfer-pricing-compliance-platform/customers/tadv/kpis/co-tadv-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-tadv-co-tadv-top.png"}, "branches": [{"id": "co-tadv-b1", "name": "Adviser leverage and engagement economics", "description": "How many adviser hours each file needs and what is left of the fee once data collection, drafting, review and subcontracting are paid for.", "currentValue": "58", "icon": "kpi-tadv-co-tadv-b1.png", "children": [{"id": "co-tadv-b1-c1", "name": "Adviser hours per local file", "description": "Average chargeable and non-chargeable adviser hours spent per final Local File, from data request to delivery, across all clients.", "unit": "hours", "currentValue": "22", "targetValue": "8", "icon": "kpi-tadv-co-tadv-b1-c1.png", "children": [{"id": "co-tadv-b1-c1-l1", "name": "Client data collection cycle time", "description": "Working days from sending the data request to a client until validated financials and transactional data for all its entities are in the platform.", "unit": "working days", "currentValue": "25", "targetValue": "8", "icon": "kpi
