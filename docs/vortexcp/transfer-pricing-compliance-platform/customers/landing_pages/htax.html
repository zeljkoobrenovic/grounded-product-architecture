"bo-tadv-b1-c2-l1", "name": "Local files generated per partner firm per year", "description": "Average number of final Local Files generated per active partner firm in a year, a proxy for how much of the firm's practice runs on the platform.", "unit": "local files per firm per year", "currentValue": "45", "targetValue": "120", "icon": "kpi-tadv-bo-tadv-b1-c2-l1.png", "children": []}, {"id": "bo-tadv-b1-c2-l2", "name": "Countries covered per partner client", "description": "Average number of countries with a Local File per client group served through partners, tracking whether partners use the platform for their clients' full footprint.", "unit": "countries per client", "currentValue": "8", "targetValue": "14", "icon": "kpi-tadv-bo-tadv-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-tadv-b2", "name": "Partner economics and retention", "description": "How much each partner firm expands and refers, what it costs to support, and how reliably partners renew.", "currentValue": "52", "icon": "kpi-tadv-bo-tadv-b2.png", "children": [{"id": "bo-tadv-b2-c1", "name": "Partner net revenue retention", "description": "Recurring revenue from partner firms that existed a year ago, including licence upgrades, add-ons and churn, as a share of their revenue a year ago.", "unit": "%", "currentValue": "110", "targetValue": "125", "icon": "kpi-tadv-bo-tadv-b2-c1.png", "children": [{"id": "bo-tadv-b2-c1-l1", "name": "Add-on attach rate at partner firms", "description": "Share of partner firms licensing at least one add-on such as machine translation, the R-AI country expert, CbCR or benchmark offerings on top of the base licence.", "unit": "%", "currentValue": "30", "targetValue": "70", "icon": "kpi-tadv-bo-tadv-b2-c1-l1.png", "children": []}, {"id": "bo-tadv-b2-c1-l2", "name": "Partner-referred new multinationals per year", "description": "Number of multinationals per year that take a direct platform licence on the recommendation of an advisory firm partner that remains their adviser.", "unit": "clients per year", "currentValue": "2", "targetValue": "15", "icon": "kpi-tadv-bo-tadv-b2-c1-l2.png", "children": []}]}, {"id": "bo-tadv-b2-c2", "name": "Partner licence churn rate", "description": "Share of advisory firm partners per year that do not renew their licence.", "unit": "%", "currentValue": "8", "targetValue": "3", "icon": "kpi-tadv-bo-tadv-b2-c2.png", "children": [{"id": "bo-tadv-b2-c2-l1", "name": "Support hours per partner local file", "description": "Reptune support and specialist hours consumed per final Local File generated by partner firms, a measure of how self-sufficient partners are.", "unit": "hours per local file", "currentValue": "1.5", "targetValue": "0.4", "icon": "kpi-tadv-bo-tadv-b2-c2-l1.png", "children": []}, {"id": "bo-tadv-b2-c2-l2", "name": "Partner firms acting as references", "description": "Number of advisory firm partners willing to take reference calls from prospective partners or appear as named partners.", "unit": "firms", "currentValue": "2", "targetValue": "10", "icon": "kpi-tadv-bo-tadv-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make the platform the production system of transfer pricing advisory practices, so a small team of advisers delivers consistent, locally compliant documentation for any client in any country at a margin, and the advisory firm becomes the channel through which the platform reaches multinationals it would never sell to directly.", "timeHorizons": {"year1": {"focus": "Stand up the advisory partner programme on the proven product: partner licences with client organisations and strict client separation, house-style templates applied across clients, a workload view across the whole client portfolio, and clear partner terms on how Reptune's own services and the firm's clients coexist.", "productTheme": "Advisory partner practice on one licence", "customerKPI": {"northStar": "Local files delivered per adviser", "supporting": ["Adviser hours per local file", "Client documentation margin"]}, "businessKPI": {"northStar": "Partner channel recurring revenue", "revenueStreams": ["Advisory firm partner licences priced per client group and Local File", "Partner onboarding and template configuration services", "Specialist review and certified translation at fixed rates through partners"], "supporting": ["Active advisory firm partners", "Partner trial-to-licence conversion rate"]}, "milestones": ["Launch partner licence terms with client organisations, custom user profiles and single sign-on so a firm runs all its clients on one licence with strict separation", "Ship the cross-client workload view with scoping, tasks, reminders and deadlines per client, entity and country for the partner's busy season", "Onboard the first ten advisory firm partners through the free trial with firm-level templates and house style applied across their clients"]}, "year3": {"focus": "Make the partner channel a standard route to market across Europe: worldwide coverage through country regulations, localised templates, translation and the R-AI country expert as default for partners, Collaborative delivery as capacity back-up, and partner dashboards clients can see.", "productTheme": "Worldwide coverage for every partner client", "customerKPI": {"northStar": "Local files delivered per adviser", "supporting": ["Countries served without a local desk", "Client retention rate"]}, "businessKPI": {"northStar": "Partner channel recurring revenue", "revenueStreams": ["Partner licences bundled with country regulations, machine translation and the R-AI country expert", "Collaborative and Full Service delivery sold through partners at fixed rates", "Benchmark and CbCR offerings resold by partners"], "supporting": ["Client groups served through partners", "Partner net revenue retention"]}, "milestones": ["Bundle country regulations, localised templates, machine translation and the R-AI country expert into the partner licence so partners scope and deliver in any of the 170+ countries", "Give partner clients read-only compliance dashboards and delivered-file views under the partner's branding", "Recruit partners in Germany, the United Kingdom and the Nordics through the international expansion backed by Vortex, reaching forty active partner firms"]}, "year5": {"focus": "Let AI agents draft, review and localise files under the adviser's supervision, surface advisory opportunities from the partner's whole client base, and turn the partner channel into the primary way the platform reaches mid-sized multinationals worldwide.", "productTheme": "AI-assisted advisory practice at global scale", "customerKPI": {"northStar": "Local files delivered per adviser", "supporting": ["Review rounds per local file", "Local files delivered before the client's deadline"]}, "businessKPI": {"northStar": "Partner channel recurring revenue", "revenueStreams": ["Agentic drafting and review add-ons for partner firms", "Partner-referred direct licences with revenue sharing", "Regulation intelligence and benchmark library data products for advisers"], "supporting": ["Partner-referred new multinationals per year", "Partner licence churn rate"]}, "milestones": ["Deploy drafting and review agents that prepare Local Files, flag benchmark exceptions and propose localisation for adviser approval across a partner's whole client base", "Surface advisory opportunities per partner client, such as benchmark refreshes, agreement gaps and restructuring impacts, as a pipeline the partner works from", "Run partner practices in more than ten countries on the platform with regulation intelligence and benchmark libraries as data products for advisers"]}}}, "domain": "Tax Advisory Firms"}, {"id": "tpsp", "name": "Reptune Transfer Pricing Specialist (Full Service and Collaborative delivery)", "description": "Works in Reptune's Amsterdam-based specialist team and operates the same Reptune.net platform that clients license, but from the inside: for Full Service clients the specialist coordinates and prepares the whole annual documentation cycle at a fixed rate per Local File, from processing the client's entity financials and transactional data through drafting, benchmark and agreement insertion, localisation and translation to delivered Master File and Local Files; for Collaborative clients the work is split with the client's transfer pricing manager and local finance contacts. Typically joins from a Big 4 or in-house transfer pricing role, handles a portfolio of multinationals with 5 to 100+ entities each, and prepares documentation in about 25 percent of the time a traditional adviser needs because the client's model, templates and country rules are already configured. Also spends the 2, 4 or 8 expert hours included per plan on on-demand advice, functional analysis questions and audit support, and hands work back and forth when a client switches between On Demand, Collaborative and Full Service. Is judged on Local Files delivered per year, delivery lead time, rework and the margin on fixed-fee engagements.", "icon": "customer-tpsp-portrait.jpg", "careAbout": ["A client transfer pricing model that is complete and consistent before the season starts, because every gap in entities, transactions, functional analyses or benchmarks becomes a manual fix multiplied across Local Files", "Client data arriving validated and on time through Excel templates or the ERP integration, rather than as a trickle of e-mails that has to be reconciled by hand under deadline pressure", "Generating a full batch of Local Files in one run and spending specialist time on judgement, custom text and local nuance rather than on formatting and copying", "Localised templates, deadlines and language rules for each country that are already correct in the platform so the specialist does not have to research every jurisdiction anew", "The client seeing progress, open questions and delivered files in the same workflow the specialist works in, so status calls and reminder e-mails disappear", "Delivering each Local File within the fixed rate and the planned hours, because overruns on a fixed-fee engagement come straight out of Reptune's margin"], "winsThem": ["A full-service delivery workspace that shows every client, entity, Local File, task, open data request and expert hour in one queue, so a specialist runs ten clients as easily as one", "Rule-based generation from a configured model, so a batch of Local Files for 40 countries is produced and validated in a day and only exceptions need a specialist's eye", "Country regulations, localised templates and auto-calculated deadlines maintained by the content team, so the specialist trusts the platform to know Italy, Germany and Brazil better than a generic template", "Machine translation into 28 languages with transfer pricing glossaries, plus human-certified translation on request, so localisation is a review step instead of a subcontracting project", "A service-level neutral setup: the same model, workflow and files serve On Demand, Collaborative and Full Service, so switching a client's service level is a task reassignment rather than a migration"], "theirFear": ["Discovering during the peak season that a client's transactional data or functional analyses were incomplete and having to redo dozens of Local Files by hand at a fixed fee", "A Local File that fails a local audit because a country requirement changed and the specialist relied on last year's template", "A client escalating to the CEO because a status question went unanswered in a mailbox while the work was in fact on track"], "jobsToBeDone": [{"id": "jtbd-tpsp-1", "name": "Deliver complete, compliant documentation for a client at a fixed fee and margin", "whatItIs": "Run a Full Service or Collaborative client's annual documentation cycle end-to-end on the platform: take over or set up the client's transfer pricing model, scope entities and countries, process the client's data, generate and review Master File and Local Files, localise and translate them, and deliver final documents before every deadline, all within the fixed rate per Local File and the specialist hours planned for the engagement.", "outcome": "Every scoped Master File and Local File for the client is delivered complete, validated and locally compliant before its deadline, at a quarter of the hours a traditional adviser would spend, with the fixed-fee engagement closed inside its planned margin and no rework caused by Reptune.", "steps": [{"step": "Take over or set up the client's transfer pricing model", "description": "Review the client's entities, intercompany transactions, company types, functional analyses, transfer pricing methods and benchmarks in the platform, or configure them from the client's policy documents, agreements and prior-year reports when a new Full Service client comes on board. Fill gaps once in the model rather than later in individual files, and load the client's corporate identity and template preferences so generated reports need no post-editing.", "streamsNeeded": [{"id": "set-up-the-transfer-pricing-model", "name": "Set up the transfer pricing model", "howItSupports": "Provides the structured model of entities, transactions, functional analyses, methods, benchmarks and templates that the specialist configures once, with Excel bulk entry and the R-AI onboarding assistant to go live in days."}, {"id": "deliver-documentation-as-a-service", "name": "Deliver documentation as a service", "howItSupports": "Records the engagement, its service level and fixed rate per Local File and gives the specialist the delivery workspace in which the model take-over is tracked as the first milestone."}]}, {"step": "Scope the cycle and agree the delivery plan with the client", "description": "Decide with the client which entities need a Local File, which countries require a Master File, CbCR or notification, and which thresholds exempt small entities; let the platform calculate the deadlines per country and lay them out as a delivery plan with data request dates, drafting windows, client review rounds and translation lead times. Assign tasks between the specialist, client contacts and local advisers according to the service level.", "streamsNeeded": [{"id": "scope-and-plan-the-annual-documentation-cycle", "name": "Scope and plan the annual documentation cycle", "howItSupports": "Turns the fiscal year and entity list into scoped documentation per entity and country with auto-calculated deadlines, assigned tasks, e-mail reminders and a compliance dashboard the client and specialist share."}, {"id": "maintain-country-regulations-and-deadlines", "name": "Maintain country regulations and deadlines", "howItSupports": "Supplies the thresholds, content requirements and deadline rules per country that determine which entities are in scope and when each file must be ready."}, {"id": "deliver-documentation-as-a-service", "name": "Deliver documentation as a service", "howItSupports": "Holds the delivery plan, planned specialist hours per Local File and the client-visible milestones for the engagement."}]}, {"step": "Process the client's financial and transactional data", "description": "Send the client's finance contacts the Excel templates or trigger the ERP extract, load entity financials, segmented P&L and transactional volumes, run the validations and chase the actions required before generation. For Collaborative clients, review what the client has entered; for Full Service clients, do the segmentation and reconciliations on their behalf.", "streamsNeeded": [{"id": "collect-and-validate-financial-and-transactional-data", "name": "Collect and validate financial and transactional data", "howItSupports": "Provides the Excel templates, bulk upload, validation rules and the actions-required list that show the specialist exactly which entity data is missing or inconsistent."}, {"id": "integrate-with-erp-operational-tp-and-identity", "name": "Integrate with ERP, operational TP and identity", "howItSupports": "Pulls financials and transactional data directly from the client's ERP or operational transfer pricing solution where an integration exists, removing the manual data round trip."}]}, {"step": "Generate, draft and review Master File and Local Files", "description": "Generate the full batch of Local Files and the Master File from the validated model, insert benchmarks and intercompany agreements from the archive, write the custom text for restructurings, loss-making entities or unusual transactions with AI-assisted writing, compare segmented results against the arm's-length ranges, and put every file through a second-specialist review before it goes to the client.", "streamsNeeded": [{"id": "generate-master-file-and-local-files", "name": "Generate Master File and Local Files", "howItSupports": "Produces draft and final Master File and Local Files at the press of a button with template selection, benchmark and agreement insertion, custom text and report styling."}, {"id": "benchmark-intercompany-transactions", "name": "Benchmark intercompany transactions", "howItSupports": "Supplies the archived benchmark studies and arm's-length ranges and flags entities whose segmented results fall outside their range so the specialist can address them in the file."}, {"id": "manage-legal-entities-and-intercompany-agreements", "name": "Manage legal entities and intercompany agreements", "howItSupports": "Provides the signed intercompany agreements and time-stamped entity data that are inserted into the documentation as evidence."}]}, {"step": "Localise, translate and deliver the final files", "description": "Apply the localised template, content rules and local forms for each country, run machine translation with the transfer pricing glossary and order human-certified translation where the tax authority requires it, review the local version with the client's country contact, and deliver the final file with filing guidance before the deadline, archived with its version history.", "streamsNeeded": [{"id": "localise-and-translate-documentation", "name": "Localise and translate documentation", "howItSupports": "Turns the English Local File into a locally compliant, translated file with country templates, glossaries, machine or human-certified translation and local forms and procedures."}, {"id": "deliver-documentation-as-a-service", "name": "Deliver documentation as a service", "howItSupports": "Tracks delivery of each final file against the engagement plan, records the hours spent per Local File and closes the milestone visibly for the client."}]}], "media": [{"type": "image", "src": "media/jbtd-tpsp-jtbd-tpsp-1.png", "title": "Reptune Transfer Pricing Specialist (Full Service and Collaborative delivery) JTBD infographic: Deliver complete, compliant documentation for a client at a fixed fee and margin", "alt": "Enterprise infographic for the job \"Deliver complete, compliant documentation for a client at a fixed fee and margin\" for customer \"Reptune Transfer Pricing Specialist (Full Service and Collaborative delivery)\"."}]}, {"id": "jtbd-tpsp-2", "name": "Keep the client in control and informed while we do the work", "whatItIs": "Give the client's head of tax, transfer pricing manager and local finance contacts continuous visibility of what Reptune is doing on their behalf, route every data request and review question to the right person, run structured sign-off rounds, and use the included expert hours for advice and audit support, so an outsourced engagement feels like an extension of the client's own team rather than a black box.", "outcome": "The client can see status, open items and delivered files per entity and country at any moment without asking, answers data requests and reviews within the planned windows, signs off files first time in most cases, and rates the engagement on confidence rather than on the number of status calls.", "steps": [{"step": "Give the client a live view of progress per entity and country", "description": "Work inside the shared workflow and dashboard so that every task the specialist completes, every draft generated and every deadline met or at risk is visible to the client on the world map and in the entity list, with the same real-time compliance status the client would see if it did the work itself.", "streamsNeeded": [{"id": "deliver-documentation-as-a-service", "name": "Deliver documentation as a service", "howItSupports": "Lets the client monitor progress of the Reptune-led engagement while specialists coordinate, prepare and deliver in the same workspace."}, {"id": "monitor-compliance-and-defend-audits", "name": "Monitor compliance and defend audits", "howItSupports": "Shows compliance status per country, deadlines at risk and delivered documentation on the dashboard the client's head of tax reads."}]}, {"step": "Route data requests and questions to the right client contact", "description": "Assign data collection and review tasks to the client's finance controllers and country contacts with the platform's task assignment and e-mail reminders, keep questions on the entity or file they concern rather than in a mailbox, and escalate only when a reminder has been ignored past the planned date.", "streamsNeeded": [{"id": "scope-and-plan-the-annual-documentation-cycle", "name": "Scope and plan the annual documentation cycle", "howItSupports": "Provides task assignment, collaboration and automatic e-mail reminders per entity and contact so requests reach the right person and are chased without manual follow-up."}, {"id": "collect-and-validate-financial-and-transactional-data", "name": "Collect and validate financial and transactional data", "howItSupports": "Ties each open data item to a specific entity, template field and validation finding so the client contact knows exactly what is missing."}]}, {"step": "Run review and sign-off rounds on drafts", "description": "Share draft Local Files with the client's transfer pricing manager and local contacts, collect comments in the platform, resolve them in the model or the custom text so the change applies to every affected file, and record the client's sign-off per file before it is finalised and translated.", "streamsNeeded": [{"id": "generate-master-file-and-local-files", "name": "Generate Master File and Local Files", "howItSupports": "Regenerates drafts after model or text changes so a single correction propagates to every Local File instead of being patched per document."}, {"id": "deliver-documentation-as-a-service", "name": "Deliver documentation as a service", "howItSupports": "Records review rounds, comments and client sign-off per file as engagement milestones with a full audit trail."}]}, {"step": "Spend expert hours on advice and audit support the client values", "description": "Use the 2, 4 or 8 expert hours included in the client's plan, and additional consultation where sold, for questions on functional analyses, new transactions, restructurings and tax audit responses; log the hours against the engagement so the client sees what was used and Reptune sees where advisory demand exceeds the plan.", "streamsNeeded": [{"id": "monitor-compliance-and-defend-audits", "name": "Monitor compliance and defend audits", "howItSupports": "Provides the audit-ready evidence, risk indicators and value chain analysis the specialist draws on when a client faces an audit question."}, {"id": "deliver-documentation-as-a-service", "name": "Deliver documentation as a service", "howItSupports": "Tracks included and additional expert hours per client and engagement so advice is visible to the client and billable beyond the plan."}]}], "media": [{"type": "image", "src": "media/jbtd-tpsp-jtbd-tpsp-2.png", "title": "Reptune Transfer Pricing Specialist (Full Service and Collaborative delivery) JTBD infographic: Keep the client in control and informed while we do the work", "alt": "Enterprise infographic for the job \"Keep the client in control and informed while we do the work\" for customer \"Reptune Transfer Pricing Specialist (Full Service and Collaborative delivery)\"."}]}, {"id": "jtbd-tpsp-3", "name": "Move clients between service levels without rework", "whatItIs": "Let a client step up from On Demand or Collaborative to Full Service when its tax team is stretched, or step down when it has built its own capacity, without re-implementing the model, re-collecting data or re-drafting files, because the specialist has kept the client's setup, workflow and documents service-level neutral on the same platform.", "outcome": "A service-level change takes effect within the running cycle as a reassignment of tasks and a repriced engagement, the client keeps every configured model element and archived document, and neither Reptune nor the client loses hours to migration or re-onboarding.", "steps": [{"step": "Keep the client's model and documents service-level neutral", "description": "Configure the client's model, templates, benchmarks and agreements in the client's own platform tenant rather than in Reptune-internal tools, and keep all working files, comments and versions in the platform, so that whatever Reptune does for the client could be continued by the client's own team the next day.", "streamsNeeded": [{"id": "set-up-the-transfer-pricing-model", "name": "Set up the transfer pricing model", "howItSupports": "Keeps the client's configured model as the single source that any service level generates from, so no Reptune-only setup has to be rebuilt on a switch."}, {"id": "deliver-documentation-as-a-service", "name": "Deliver documentation as a service", "howItSupports": "Runs Reptune's delivery work inside the client's tenant and workflow rather than in a separate system, which is what makes switching between On Demand, Collaborative and Full Service possible."}]}, {"step": "Reassign tasks when the service level changes", "description": "When the client steps up, take over the open data, drafting, localisation and filing tasks in the current cycle's plan; when the client steps down, hand the same tasks back to named client contacts with their deadlines and reminders intact, and adjust who reviews and who signs off per file.", "streamsNeeded": [{"id": "scope-and-plan-the-annual-documentation-cycle", "name": "Scope and plan the annual documentation cycle", "howItSupports": "Allows tasks per entity and file to be reassigned between Reptune specialists and client contacts without changing the scope, deadlines or reminders."}, {"id": "deliver-documentation-as-a-service", "name": "Deliver documentation as a service", "howItSupports": "Records the service-level switch on the engagement and shifts the delivery plan and fixed-rate Local Files accordingly."}]}, {"step": "Train the client team on the work it takes over", "description": "For a client stepping down, walk the transfer pricing manager and finance contacts through data entry, validation, generation and localisation on their own model with the R-AI onboarding assistant as back-up, and stay available through the included expert hours so the first self-run cycle does not slip.", "streamsNeeded": [{"id": "deliver-documentation-as-a-service", "name": "Deliver documentation as a service", "howItSupports": "Provides the handover checklist, training sessions and follow-up support that accompany a move to a lighter service level."}, {"id": "generate-master-file-and-local-files", "name": "Generate Master File and Local Files", "howItSupports": "Lets the client team practise generating drafts from the same model the specialist used, so they see that the outputs do not change when the operator changes."}]}, {"step": "Reprice and re-plan the engagement", "description": "Recalculate the fixed rate per Local File and the specialist hours for the new service level, update the plan's included expert hours and add-ons, and review the compliance dashboard with the client to confirm that no deadline is at risk during the transition.", "streamsNeeded": [{"id": "deliver-documentation-as-a-service", "name": "Deliver documentation as a service", "howItSupports": "Holds the engagement's fixed rate per Local File, planned hours and service level so a switch is repriced consistently and transparently."}, {"id": "monitor-compliance-and-defend-audits", "name": "Monitor compliance and defend audits", "howItSupports": "Confirms on the compliance dashboard that every country stays on track through the transition."}]}], "media": [{"type": "image", "src": "media/jbtd-tpsp-jtbd-tpsp-3.png", "title": "Reptune Transfer Pricing Specialist (Full Service and Collaborative delivery) JTBD infographic: Move clients between service levels without rework", "alt": "Enterprise infographic for the job \"Move clients between service levels without rework\" for customer \"Reptune Transfer Pricing Specialist (Full Service and Collaborative delivery)\"."}]}], "customerJourneyStories": [{"id": "journey-tpsp-1", "name": "From Big 4 documentation projects to platform-based delivery", "linkedJobIds": ["jtbd-tpsp-1", "jtbd-tpsp-2"], "summary": "A transfer pricing senior who joins Reptune from a Big 4 practice adopts Reptune.net and the full-service ways of working, from the first onboarding week and a sceptical look at the rule-based generator to running a portfolio of Full Service clients at a quarter of the hours she used to bill.", "stages": [{"stage": "Trigger", "narrative": "After six years of preparing Local Files in Word and Excel for a Big 4 practice, the specialist joins Reptune as the team grows beyond its 20 members under Vortex. In her first week she is assigned a portfolio of Full Service clients with more than 200 Local Files between them and a fixed rate per file, and realises that her old way of working, billing hours per document, would make the engagements loss-making."}, {"stage": "Discovery", "narrative": "The onboarding programme puts her in front of the platform on day one: she works through the R-AI onboarding assistant, shadows a senior specialist running a client's cycle in the delivery workspace, and sees the dashboard, workflow, generator, country regulations and translation module the clients themselves use. The senior shows how a batch of 40 Local Files was generated from a configured model in a single afternoon."}, {"stage": "Evaluation", "narrative": "She is sceptical that generated documentation can hold up in an audit and tests the platform on a case she knows: a loss-making distributor in Italy. She checks the localised Italian template against the requirements she remembers, runs the pre-generation validation and sees that it catches the missing benchmark she deliberately left out, and reads the testimonials from customers whose files held in audits. What convinces her is that the custom text field and AI-assisted writing leave the judgement to her while the structure and consistency come from the model."}, {"stage": "Trial", "narrative": "Her first real engagement is a Collaborative client with twelve entities: she takes over the model review and generation while the client's transfer pricing manager collects the data, and a senior reviews every file before delivery. The batch is delivered three weeks before the earliest deadline, her hours per Local File come in at a fraction of her Big 4 benchmark, and the client's only comments are on custom text, not on structure or numbers."}, {"stage": "Engagement", "narrative": "Within a quarter she runs her full portfolio of Full Service clients from the delivery workspace: scoping and deadlines per country come from the platform, data requests go out as assigned tasks with reminders, generation and localisation are batch jobs, and she spends her time on functional analyses, restructurings, audit questions and the client's expert hours. Her clients watch progress on the same dashboard she works in, so status e-mails have disappeared."}, {"stage": "Retention", "narrative": "A year in she reviews other specialists' files, contributes template and validation improvements to the content team, and is the named contact when a Collaborative client steps up to Full Service. She stays because the platform gives her leverage and the interesting work: the documentation that used to fill her year is now a quarter of it, and the rest is advice clients actually pay for."}], "media": [{"type": "image", "src": "media/journey-tpsp-tpsp-1.png", "title": "Reptune Transfer Pricing Specialist (Full Service and Collaborative delivery) customer journey: From Big 4 documentation projects to platform-based delivery", "alt": "Enterprise journey storyboard for \"From Big 4 documentation projects to platform-based delivery\" for customer \"Reptune Transfer Pricing Specialist (Full Service and Collaborative delivery)\"."}]}, {"id": "journey-tpsp-2", "name": "Moving client delivery from mailboxes into the full-service delivery workspace", "linkedJobIds": ["jtbd-tpsp-2", "jtbd-tpsp-3"], "summary": "The specialist team adopts the in-platform full-service delivery workspace, replacing the mailboxes, shared drives and hour sheets it used to coordinate client engagements, and ends up with client-visible progress, tracked expert hours and service-level switches that no longer require a hand-over project.", "stages": [{"stage": "Trigger", "narrative": "A Full Service client's head of tax escalates because a status question sat unanswered in a specialist's mailbox during holidays while the work was in fact on track, and in the same month the team discovers that expert hours for two clients were undercounted because they lived in personal spreadsheets. The team lead concludes that coordinating engagements outside the platform the clients already use is the problem."}, {"stage": "Discovery", "narrative": "The product team demonstrates the full-service delivery workspace it has built on top of the workflow: every engagement with its service level, fixed rate per Local File, delivery plan, assigned tasks, review rounds and expert hours in one queue, with the client seeing the same milestones on its dashboard. The specialists recognise their own way of working, only without the mailbox."}, {"stage": "Evaluation", "narrative": "The team debates whether client-visible progress exposes half-finished drafts and internal notes, and whether logging hours per Local File will be used against them. Access rights that keep internal review comments and time entries out of the client's view, and a margin report that shows overruns per engagement rather than per person, settle the discussion; the ISO 27001 controls mean no new security review is needed."}, {"stage": "Trial", "narrative": "Two clients, one Full Service and one Collaborative, are run in the workspace for a cycle. The clients answer data requests faster because tasks arrive as reminders with a deadline, the specialists stop writing weekly status e-mails, and the hours per Local File become visible per engagement for the first time."}, {"stage": "Engagement", "narrative": "All engagements move into the workspace at the start of the next season. The team lead plans capacity from the queue and the deadlines per country, specialists pick up each other's clients during holidays because everything is in one place, and the expert hours per client are reviewed monthly with sales to spot advisory demand beyond the plan."}, {"stage": "Retention", "narrative": "When a Collaborative client steps up to Full Service mid-cycle, the switch is a reassignment of the open tasks and a repriced engagement in the workspace instead of a hand-over project, and the client notices nothing but more done. The workspace becomes the place where the team's fixed-fee margin is managed, and no specialist wants to go back to mailboxes."}], "media": [{"type": "image", "src": "media/journey-tpsp-tpsp-2.png", "title": "Reptune Transfer Pricing Specialist (Full Service and Collaborative delivery) customer journey: Moving client delivery from mailboxes into the full-service delivery workspace", "alt": "Enterprise journey storyboard for \"Moving client delivery from mailboxes into the full-service delivery workspace\" for customer \"Reptune Transfer Pricing Specialist (Full Service and Collaborative delivery)\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-tpsp-top", "name": "Local files delivered per specialist", "description": "Number of final Local Files a Reptune specialist delivers per year across Full Service and Collaborative engagements, the measure of leverage the platform gives the services arm. Modeled seed value informed by the claim that specialists prepare documentation in about 25 percent of the time of traditional advisers, not an official Reptune figure.", "unit": "local files per specialist per year", "currentValue": "120", "targetValue": "160", "link": "https://dashboard.example.com/transfer-pricing-compliance-platform/customers/tpsp/kpis/co-tpsp-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-tpsp-co-tpsp-top.png"}, "branches": [{"id": "co-tpsp-b1", "name": "Delivery speed and throughput", "description": "How fast a Local File moves from data request to delivered file and how well the season's plan absorbs the peak.", "currentValue": "70", "icon": "kpi-tpsp-co-tpsp-b1.png", "children": [{"id": "co-tpsp-b1-c1", "name": "Delivery lead time per local file", "description": "Working days from complete, validated client data for an entity to delivery of the final, localised Local File, averaged over the season.", "unit": "working days", "currentValue": "9", "targetValue": "6", "icon": "kpi-tpsp-co-tpsp-b1-c1.png", "children": [{"id": "co-tpsp-b1-c1-l1", "name": "Client data turnaround time", "description": "Calendar days from the data request task reaching a client contact to complete and validated data for the entity being available in the platform.", "unit": "days", "currentValue": "12", "targetValue": "7", "icon": "kpi-tpsp-co-tpsp-b1-c1-l1.png", "children": []}, {"id": "co-tpsp-b1-c1-l2", "name": "Specialist hours per local file", "desc and additional expert hours per client in the platform and report advisory demand beyond the plan to sales monthly", "Cut delivery lead time per Local File below seven working days through batch generation and assigned data-request reminders"]}, "year3": {"focus": "Scale the services arm with the commercial expansion: standard ERP and operational transfer pricing integrations that remove the data round trip, a partner channel in which advisory firms deliver on the platform alongside Reptune's specialists, and multi-language delivery as the default in every engagement.", "productTheme": "Scalable service delivery across markets", "customerKPI": {"northStar": "Local files delivered per specialist", "supporting": ["Client data turnaround time", "Client rework rate"]}, "businessKPI": {"northStar": "Full service revenue growth", "revenueStreams": ["Full Service documentation at fixed rates per Local File", "Service-level upgrades from On Demand and Collaborative clients", "Transfer pricing consultation, VCA and controversy support"], "supporting": ["New full-service clients per year", "Service level upgrades per year"]}, "milestones": ["Deliver client data through ERP and operational transfer pricing integrations for the majority of Full Service clients, halving client data turnaround time", "Onboard advisory-firm partners into the same delivery workspace so their specialists and Reptune's share engagements in new countries", "Make machine translation with glossaries and human-certified translation part of every Full Service engagement plan by default"]}, "year5": {"focus": "Let agentic drafting and review prepare the bulk of each Local File under specialist supervision, so a specialist oversees continuously updated documentation for far more clients, and package audit-ready evidence packs and controversy support as the service clients pay for.", "productTheme": "Specialist-supervised AI delivery", "customerKPI": {"northStar": "Local files delivered per specialist", "supporting": ["Specialist hours per local file", "Client sign-off first-time rate"]}, "businessKPI": {"northStar": "Documentation services gross margin", "revenueStreams": ["Continuous documentation services on transaction and financial data flows", "Audit-ready evidence packs and controversy support", "Advisory hours beyond the plan"], "supporting": ["Service client net revenue retention", "Advisory hours sold beyond plan"]}, "milestones": ["Deploy AI drafting and review agents that prepare custom text, range comparisons and localisation for specialist approval on every engagement", "Offer continuous documentation that updates as transactions and financials flow in, with specialists reviewing exceptions instead of running an annual project", "Sell audit-ready evidence packs and controversy support as a standard service tier built on the delivered documentation and risk analytics"]}}}, "domain": "Reptune Service and Content Teams"}, {"id": "regr", "name": "Country Regulations and Content Specialist", "description": "A transfer pricing specialist in Reptune's localisation and country content team who keeps the platform's knowledge of more than 170 countries current: for each jurisdiction the documentation thresholds, Master File and Local File content requirements, filing formats, language and translation requirements, local forms and procedures, and the deadline rules for Master File, Local Files, CbCR and CbCR notifications from which the platform calculates every entity's deadlines. Maintains the OECD-aligned standard templates and the localised templates such as the Italian one, the transfer pricing glossaries behind machine translation into 28 languages, and the knowledge base that R-AI's coming Local Requirements country-expert mode answers from. Follows OECD, EU (including Directive 2021/2101 on public CbCR) and local legislative changes, works with local advisers where Reptune has no presence, and answers country-expert queries from Reptune's own specialists, advisers and clients. Is judged on how current and correct the country rule sets are, how fast regulatory changes reach the platform, and how quickly and reliably country questions are resolved.", "icon": "customer-regr-portrait.jpg", "careAbout": ["A structured rule model per country in which thresholds, content, format, language and deadline rules are data the platform acts on, not prose that someone has to read and interpret each season", "Learning about a regulatory change within days of its publication in any of 170+ countries, including those where Reptune relies on local advisers and official sources in the local language", "Deadlines that auto-calculate correctly for every entity in every country, because a wrong deadline rule multiplies into missed filings across 150+ client groups", "Localised templates, local forms and translation glossaries that make the generated file locally acceptable without the specialist or client re-researching the country", "Country-expert queries answered once and reused, so the same question about Brazilian formats or Polish thresholds is not answered by e-mail twenty times a season", "Knowing that every rule change was reviewed by a second specialist and versioned, so the team can show a client when and why a country rule changed"], "winsThem": ["A country regulations back office in which each rule has a source, an effective date, a reviewer and a version, and in which a change flows straight into scoping, deadline calculation, validation and the dashboard", "Change monitoring across official sources, adviser networks and OECD and EU publications that lands as review tasks per country instead of a reading list", "Template and validation tooling that lets a content specialist adjust a localised template or add a pre-generation check without a software release", "Glossary management per language that keeps machine translation consistent for transfer pricing terms and feeds the human-certified translation partners", "A curated knowledge base behind R-AI Local Requirements, so routine country questions are answered by the assistant in any language and the specialist handles only the hard ones"], "theirFear": ["A deadline or threshold rule that was updated in a spreadsheet or a Word note but never in the platform, so dozens of clients calculated the wrong deadline for a country", "A localised template that silently drifted from a changed local requirement and is only found when a client's file is challenged in an audit", "R-AI giving a confident but outdated country answer that a client relies on, because the knowledge base was not curated after a change"], "jobsToBeDone": [{"id": "jtbd-regr-1", "name": "Keep 170+ country rule sets and deadlines current and correct", "whatItIs": "Maintain, for every country the platform supports, the current thresholds, documentation content and format requirements, language requirements, CbCR and notification obligations and deadline rules, detecting regulatory change quickly, encoding it as structured rules with sources and effective dates, and releasing it through review so that scoping, deadline calculation, validation and the dashboard reflect the law as it stands.", "outcome": "Every country rule set is verified current within its review cycle, regulatory changes reach the platform within days rather than the next season, deadlines calculate correctly for every entity, and no client or specialist relies on a rule that has been superseded.", "steps": [{"step": "Monitor regulatory change per country", "description": "Follow OECD BEPS Action 13 guidance, EU directives, national legislation, tax authority guidance and adviser network alerts for each country, including public CbCR under Directive 2021/2101 and Pillar Two safe-harbour interactions, and log each relevant change as a review task on the country it concerns with its source and expected effective date.", "streamsNeeded": [{"id": "maintain-country-regulations-and-deadlines", "name": "Maintain country regulations and deadlines", "howItSupports": "Provides the country content back office in which regulatory changes are captured as review tasks with source, effective date and affected rule types."}, {"id": "monitor-compliance-and-defend-audits", "name": "Monitor compliance and defend audits", "howItSupports": "Surfaces audit and controversy experience from clients and specialists that reveals how tax authorities apply a rule in practice, which feeds back into the country content."}]}, {"step": "Encode thresholds, content and format rules", "description": "Translate each change into structured rules: revenue and transaction thresholds that put an entity in or out of scope, mandatory Local File sections and annexes, required financial data and formats, language requirements and whether a certified translation is needed, and the filing or submission mechanism, so the platform applies the rule during scoping, generation and localisation.", "streamsNeeded": [{"id": "maintain-country-regulations-and-deadlines", "name": "Maintain country regulations and deadlines", "howItSupports": "Holds the threshold, content, format and language rules per country as versioned data that scoping, generation and localisation read."}, {"id": "scope-and-plan-the-annual-documentation-cycle", "name": "Scope and plan the annual documentation cycle", "howItSupports": "Applies the encoded thresholds when clients scope which entities need a Local File, Master File, CbCR or notification in each country."}]}, {"step": "Maintain deadline rules so every deadline auto-calculates", "description": "Define per country how the deadlines for Master File, Local Files, CbCR and CbCR notifications derive from fiscal year end, tax return dates, submission on request periods and extensions, test the rule against sample entities with different year ends, and release it so the workflow and dashboard show the correct date for every entity.", "streamsNeeded": [{"id": "maintain-country-regulations-and-deadlines", "name": "Maintain country regulations and deadlines", "howItSupports": "Stores the deadline derivation rules per country and document type with test cases and version history."}, {"id": "scope-and-plan-the-annual-documentation-cycle", "name": "Scope and plan the annual documentation cycle", "howItSupports": "Uses the deadline rules to calculate each entity's Master File, Local File, CbCR and notification deadlines and to drive reminders."}]}, {"step": "Keep CbCR, public CbCR and notification rules current", "description": "Maintain which countries require CbCR filing, notification and by when, the XML schema versions tax authorities accept, the EU Public CbCR rules and XHTML with inline XBRL format per member state, and the upcoming Australian Public CbCR requirements, so CbCR output stays filing-ready.", "streamsNeeded": [{"id": "prepare-and-file-cbcr-and-notifications", "name": "Prepare and file CbCR and notifications", "howItSupports": "Consumes the CbCR, public CbCR and notification rules to produce filing-ready XML, XHTML with inline XBRL and local filing guidance."}, {"id": "maintain-country-regulations-and-deadlines", "name": "Maintain country regulations and deadlines", "howItSupports": "Keeps the CbCR filing, notification and format rules per country versioned alongside the documentation rules."}]}, {"step": "Review, release and version every rule change", "description": "Have a second specialist review each rule change against its source, record the effective date and the reviewer, release the change to the platform and to R-AI's knowledge base, notify affected clients and specialists through the dashboard where scoping or deadlines shift, and keep the previous version available so a client can show what applied in an earlier year.", "streamsNeeded": [{"id": "maintain-country-regulations-and-deadlines", "name": "Maintain country regulations and deadlines", "howItSupports": "Provides the review, release and versioning workflow for country rules with reviewer, source and effective date recorded."}, {"id": "monitor-compliance-and-defend-audits", "name": "Monitor compliance and defend audits", "howItSupports": "Shows clients on the compliance dashboard when a released rule change alters scope, deadlines or status in a country."}]}], "media": [{"type": "image", "src": "media/jbtd-regr-jtbd-regr-1.png", "title": "Country Regulations and Content Specialist JTBD infographic: Keep 170+ country rule sets and deadlines current and correct", "alt": "Enterprise infographic for the job \"Keep 170+ country rule sets and deadlines current and correct\" for customer \"Country Regulations and Content Specialist\"."}]}, {"id": "jtbd-regr-2", "name": "Turn regulatory changes into templates, validations and answers users can act on", "whatItIs": "Make country knowledge usable at the point of work: update localised templates and local forms when content requirements change, add pre-generation validation rules so gaps are flagged before a file is produced, keep the transfer pricing glossaries and language rules behind machine and certified translation current, curate the knowledge base R-AI answers from, and resolve the country-expert queries that specialists, advisers and clients raise.", "outcome": "A user in any country generates a file that already reflects the current local requirement, is warned about gaps before generation, gets consistent translations, and receives a correct country answer within hours, from R-AI for routine questions and from a specialist for the hard ones, with the answer reused the next time it is asked.", "steps": [{"step": "Update localised templates and local forms", "description": "Adjust the localised template for a country when its required sections, annexes, disclosures or structure change, add or update the local forms and filing procedures that accompany the Local File, and check the change against a sample client's generated file so the layout, headings and mandatory content are right before release.", s": "Uses the glossaries in machine translation and the language rules to decide when human-certified translation is required for a country."}, {"id": "maintain-country-regulations-and-deadlines", "name": "Maintain country regulations and deadlines", "howItSupports": "Stores the language and translation requirements per country as part of the country rule set."}]}, {"step": "Curate the knowledge base behind R-AI Local Requirements", "description": "Write and review the country entries R-AI's Local Requirements mode answers from, link each entry to the underlying rule and source, mark entries stale when a rule changes so the assistant stops answering from them until reviewed, and check a sample of the assistant's country answers in several languages each month.", "streamsNeeded": [{"id": "maintain-country-regulations-and-deadlines", "name": "Maintain country regulations and deadlines", "howItSupports": "Surfaces the country rule sets in R-AI's country-expert answers and lets the content specialist curate and stale-mark knowledge entries."}, {"id": "localise-and-translate-documentation", "name": "Localise and translate documentation", "howItSupports": "Provides the language capability that lets R-AI answer country questions in any of the platform's languages consistently with the glossaries."}]}, {"step": "Resolve country-expert queries from specialists, advisers and clients", "description": "Answer the questions that R-AI or the platform cannot: how a tax authority interprets a threshold, whether a specific format is accepted, what a local audit typically asks for; consult a local adviser where needed, answer within the service-level time, and fold the answer into the rule set or knowledge base so it is reused.", "streamsNeeded": [{"id": "maintain-country-regulations-and-deadlines", "name": "Maintain country regulations and deadlines", "howItSupports": "Routes country-expert queries to the content team, tracks resolution time and lets resolved answers be added to the t has been building: one rule set per country with thresholds, content, format, language and deadline rules as data, each with source, effective date, reviewer and version, and each feeding scoping, deadline calculation, validation and the dashboard directly. The specialists see their spreadsheet columns as rule types and their Word notes as knowledge entries."}, {"stage": "Evaluation", "narrative": "The team's concern is nuance: many country requirements are conditional or interpreted differently by tax authorities and do not fit a fixed schema. They evaluate the rule model on the hardest cases they know, including thresholds that depend on group revenue and transaction type and deadlines that hang on tax return dates with extensions, and agree once conditional rules, free-text guidance and a review gate before release are supported. Version history that can show what applied in a prior year settles the audit-defence argument."}, {"stage": "Trial", "narrative": "Ten countries with the most client entities are migrated first, each rule cross-checked by a second specialist against its source. A parallel run for one season shows the auto-calculated deadlines match the spreadsheet where the spreadsheet was right and differ where it was stale, and the first regulatory change of the season is released through the back office in three days instead of waiting for the next spreadsheet round."}, {"stage": "Engagement", "narrative": "All 170+ countries are in the back office within two quarters. Change monitoring lands as review tasks per country, releases go out weekly with reviewer and effective date, localised templates and validation rules are edited by the content team without a software release, and clients see a rule change on their dashboard the day it is released."}, {"stage": "Retention", "narrative": "The regulation base becomes the platform's second strategic asset: the R-AI Local Requirements mode is built on its entries, sales cites countries covered and update     const customer = {"id": "htax", "name": "Group Head of Tax / Transfer Pricing Director", "description": "Owns the global transfer pricing policy of a multinational with 20 to 500+ legal entities in 15 to 60 countries, such as a Dutch technology group, a Benelux chemicals or plastics distributor or a US industrial with European headquarters. Sets the group's transfer pricing methods, functional profiles and target margins, budgets the compliance cycle, selects the platform, plan and service level (On Demand, Collaborative or Full Service), and signs off the Master File, Local Files and CbCR before they go out. Answers to the CFO and the audit committee on tax risk, defends the group in tax audits, Advance Pricing Agreements and Mutual Agreement Procedures, and is judged on whether documentation exists everywhere it is required, what it costs per entity, and how many adjustments and penalties the group absorbs. Works with a small in-house team, local finance controllers and a handful of external advisers.", "icon": "customer-htax-portrait.jpg", "careAbout": ["Complete, consistent and locally compliant documentation in every country where the group exceeds a local threshold, not just in the headquarters jurisdiction", "A documentation package that has actually held up in tax audits, so an auditor's request is answered from the archive rather than reconstructed under pressure", "Compliance cost per entity that falls year on year as adviser hours are replaced by generated, localised files and a fixed rate per Local File", "No missed Master File, Local File, CbCR or CbCR notification deadline anywhere, because deadlines are calculated per country and tracked per entity", "One dashboard that tells the CFO and the audit committee which entities are covered, which are at risk and which are outside their arm's-length range", "A policy, benchmarks and intercompany agreements that line up, so the story told in the Master File matches every Local File and every signed contra ren": []}, {"id": "co-htax-b2-c1-l2", "name": "Internal hours per Local File", "description": "Average hours spent by in-house tax and local finance staff per Local File from data request to final archived version.", "unit": "hours", "currentValue": "38", "targetValue": "12", "icon": "kpi-htax-co-htax-b2-c1-l2.png", "children": []}]}, {"id": "co-htax-b2-c2", "name": "Group-wide compliance status visibility", "description": "Share of in-scope entities whose documentation, CbCR and deadline status is visible in real time on the compliance dashboard rather than in spreadsheets and e-mail.", "unit": "%", "currentValue": "55", "targetValue": "100", "icon": "kpi-htax-co-htax-b2-c2.png", "children": [{"id": "co-htax-b2-c2-l1", "name": "Time to produce the audit committee compliance report", "description": "Working days needed to assemble the quarterly transfer pricing compliance and risk report for the CFO and audit committee.", "unit": "working days", "currentValue": "6", "targetValue": "0.5", "icon": "kpi-htax-co-htax-b2-c2-l1.png", "children": []}, {"id": "co-htax-b2-c2-l2", "name": "Entities outside their arm's-length range at year-end", "description": "Number of entities whose segmented result fell outside the applicable benchmark range at year-end without a planned adjustment or documented explanation.", "unit": "entities", "currentValue": "14", "targetValue": "4", "icon": "kpi-htax-co-htax-b2-c2-l2.png", "children": []}]}]}]}, "businessOutcomes": {"top": {"id": "bo-htax-top", "name": "Annual recurring revenue from multinational group subscriptions", "description": "Annual recurring revenue from platform subscriptions, add-ons and recurring documentation services sold to in-house tax teams of multinationals. Modeled seed value for the domain, not a reported Reptune figure.", "unit": "EUR million per year", "currentValue": "4.2", "targetValue": "12.0", "link": "https://dashboard.example.com/transfer-pricing-compliance-platform/customers/htax/kpis/bo-htax-top", "linkLa flow in, controversy-ready evidence packs assembled on demand, and audit-outcome insight across the customer base that tells a Head of Tax where risk is rising.", "productTheme": "Continuous compliance with audit-outcome intelligence", "customerKPI": {"northStar": "Audit-ready documentation coverage", "supporting": ["Audits closed without documentation adjustment rate", "Time to produce the audit committee compliance report"]}, "businessKPI": {"northStar": "Annual recurring revenue from multinational group subscriptions", "revenueStreams": ["Global Enterprise subscriptions across regions", "Regulation intelligence and audit-outcome data products", "Agentic drafting and review under specialist supervision"], "supporting": ["Multinational group churn rate", "Groups acting as reference customers"]}, "milestones": ["Deliver controversy-ready evidence packs generated for any entity and fiscal year, in the local language, within a day of an audit notice", "Run agentic drafting and review of Local Files under specialist supervision so a policy change propagates to all files with a reviewed diff", "Publish anonymised audit-outcome and regulation intelligence that ranks countries and transaction types by adjustment risk"]}}}, "domain": "In-house Tax Teams of Multinationals"};

    const customerInsights = [{"id": "tpc-01", "title": "A transfer pricing model configured once and a rule-based generator turn documentation from an annual project into a button press", "summary": "Reptune.net is a rule-based generator: company types, functional analyses, transfer pricing methods and benchmarks are configured once in the model and Master File and Local Files are generated from it for groups of 5 to 500+ legal entities. Reptune states 50\u201375% time and cost savings versus traditional documentation, that clients are up and running in days without installation, and that the platform is trusted by 150+ multinationals, including TomTom, Stahl, Avnet, Ravago and Stanley Black & Decker. The generator ships OECD-aligned templates, localised templates (for example Italy), built-in validation and Excel bulk entry.", "implication": "The model \u2014 not the document \u2014 is the product: invest in model set-up (R-AI onboarding, bulk entry, validation) and in keeping generated output consistent across entities, because every hour saved in model configuration multiplies across all local files and every inconsistency is replicated everywhere.", "priority": "high", "tags": ["automation", "documentation", "scale"], "sources": [{"id": "reptune-generator", "title": "Automated Report Generator", "url": "https://www.reptune.tax/automated-report-generator/", "publisher": "Reptune", "date": "2026-09-04"}, {"id": "reptune-platform", "title": "Reptune.net \u2014 the transfer pricing documentation platform", "url": "https://www.reptune.tax/reptune-platform/", "publisher": "Reptune", "date": "2026-09-04"}], "link": {"customerId": "htax", "jobIds": ["jtbd-htax-2"], "kpiIds": ["co-htax-top", "bo-htax-top"]}}, {"id": "tpc-03", "title": "Auto-calculated deadlines, scoping, reminders and a worldmap dashboard turn documentation into a managed compliance process", "summary": "Reptune's workflow module scopes the documentation per entity and country, assigns tasks, sends e-mail reminders and auto-calculates deadlines for the Master File, Local Files, CbCR and CbCR notifications; the dashboard shows compliance status on a worldmap with filing deadlines per entity. The workflow is included in every plan, including Core, alongside unlimited users.", "implication": "The head of tax buys visibility as much as documents: make the dashboard the daily surface for group-wide status, drive the local contacts through assigned tasks rather than e-mail chains, and let deadline calculation depend on the country regulation base so that a rule change reprices every entity's deadline.", "priority": "high", "tags": ["workflow", "deadlines", "visibility"], "sources": [{"id": "reptune-workflow", "title": "Transfer pricing workflow", "url": "https://www.reptune.tax/workflow/", "publisher": "Reptune", "date": "2026-09-04"}, {"id": "reptune-pricing", "title": "Reptune pricing \u2014 Core, Advanced and Enterprise plans and service levels", "url": "https://www.reptune.tax/pricing/", "publisher": "Reptune", "date": "2026-09-04"}], "link": {"customerId": "htax", "jobIds": ["jtbd-htax-3"], "kpiIds": ["co-htax-top", "co-htax-b1"]}}, {"id": "tpc-04", "title": "Public CbCR in XHTML with inline XBRL adds a second, machine-readable filing on top of the OECD XML report", "summary": "Directive (EU) 2021/2101 requires multinational groups with consolidated revenue above EUR 750 million to publish a country-by-country income tax report, in addition to the confidential OECD CbCR exchanged between tax authorities. Reptune produces CbCR in OECD XML and Excel, generates the EU Public CbCR in XHTML with inline XBRL, and announces Australian Public CbCR as coming; CbCR (OECD and EU public) is an add-on in the Core and Advanced plans and included in Enterprise.", "implication": "Model CbCR as one dataset with several renderings \u2014 OECD XML, Excel, EU public XHTML/inline XBRL, Australian public \u2014 so a new jurisdictional format is a renderer, not a new data collection; keep notification deadlines in the same engine as the reports.", "priority": "high", "tags": ["cbcr", "public-reporting", "regulation"], "sources": [{"id": "eu-public-cbcr", "title": "Directive (EU) 2021/2101 \u2014 disclosure of income tax information by certain undertakings and branches (public country-by-country reporting)", "url": "https://eur-lex.europa.eu/eli/dir/2021/2101/oj", "publisher": "EUR-Lex", "date": "2021-12-01"}, {"id": "reptune-cbcr", "title": "Country-by-Country Report (CbCR)", "url": "https://www.reptune.tax/country-by-country-report-cbcr/", "publisher": "Reptune", "date": "2026-09-04"}, {"id": "reptune-pricing", "title": "Reptune pricing \u2014 Core, Advanced and Enterprise plans and service levels", "url": "https://www.reptune.tax/pricing/", "publisher": "Reptune", "date": "2026-09-04"}], "link": {"customerId": "htax", "jobIds": ["jtbd-htax-1"], "kpiIds": ["co-htax-top"]}}, {"id": "tpc-05", "title": "Pillar Two's transitional CbCR safe harbour turns CbCR data quality into a tax-liability question, at a compliance cost the Tax Foundation puts in the billions for EU groups", "summary": "Under the Pillar Two transitional CbCR safe harbour, groups can rely on a qualified Country-by-Country Report and qualified financial statements to pass simplified de minimis, effective-tax-rate and routine-profits tests per jurisdiction, and so avoid full GloBE calculations there for the transition years. The Tax Foundation study of October 2025 (with ZEW) estimates one-off Pillar Two compliance costs for EU-headquartered groups at EUR 1.2 billion (up to EUR 2.0 billion) and recurring costs at EUR 517 million (up to EUR 865 million) per year, based on surveys of CFOs and heads of tax.", "implication": "Position CbCR data management as the entry point to Pillar Two readiness: validate CbCR datasets against entity financials and segmented P&Ls, keep an audit trail of the qualified data, and offer CbCR analysis as an advisory service; the head of tax will fund data quality when it changes a top-up tax outcome.", "priority": "high", "tags": ["pillar-two", "cbcr", "data-quality"], "sources": [{"id": "pwc-cbcr-safe-harbour", "title": "Pillar Two transitional CbCR safe harbour and transfer pricing", "url": "https://www.pwc.com/us/en/services/tax/library/transfer-pricing-pillar-two-cbcr-safe-harbor-rule.html", "publisher": "PwC", "date": "2026-09-04"}, {"id": "taxfoundation-pillar-two", "title": "OECD Pillar Two Compliance Costs: A Quantitative Assessment for EU-Headquartered Groups", "url": "https://taxfoundation.org/research/all/eu/oecd-pillar-two-compliance-costs-eu/", "publisher": "Tax Foundation", "date": "2025-10-22"}, {"id": "reptune-cbcr", "title": "Country-by-Country Report (CbCR)", "url": "https://www.reptune.tax/country-by-country-report-cbcr/", "publisher": "Reptune", "date": "2026-09-04"}], "link": {"customerId": "htax", "jobIds": ["jtbd-htax-2", "jtbd-htax-3"], "kpiIds": ["co-htax-top", "bo-htax-top"]}}, {"id": "tpc-06", "title": "Three service levels on one platform let Reptune's specialists deliver at a fixed rate per Local File in a quarter of adviser time", "summary": "Reptune offers the platform with three service levels \u2014 On Demand (client-led), Collaborative (joint) and Full Service (Reptune-led) \u2014 at fixed rates per Local File, and states its specialists prepare documentation in 25% of the time a traditional adviser needs. Each plan includes expert hours (2, 4 or 8 per year) for on-demand advice, and the same workflow lets the client monitor progress while Reptune does the work. Reference testimonials cite Reptune having 'saved the day in various tax audits' and support on CbCR and value chain analysis.", "implication": "Build the full-service delivery workspace on the same bricks the client uses, so switching between service levels is a change of task assignment rather than a migration; measure specialist throughput per local file and rework, since margin at fixed rates depends on it.", "priority": "high", "tags": ["services", "pricing", "delivery"], "sources": [{"id": "reptune-pricing", "title": "Reptune pricing \u2014 Core, Advanced and Enterprise plans and service levels", "url": "https://www.reptune.tax/pricing/", "publisher": "Reptune", "date": "2026-09-04"}, {"id": "reptune-platform", "title": "Reptune.net \u2014 the transfer pricing documentation platform", "url": "https://www.reptune.tax/reptune-platform/", "publisher": "Reptune", "date": "2026-09-04"}], "link": {"customerId": "htax", "jobIds": ["jtbd-htax-2"], "kpiIds": ["co-htax-top", "bo-htax-top"]}}, {"id": "tpc-07", "title": "The Legal Module ties time-stamped entity data and signed intercompany agreements to the documentation that cites them", "summary": "Reptune's Legal Module keeps time-stamped legal entity data, shareholders, directors and authorised signatories, an intercompany agreement repository, a corporate document repository, current and historical legal structure charts, and DocuSign integration for signing. Intercompany agreements and entity data feed the Master File and Local Files generated from the same platform.", "implication": "Make the legal counsel a first-class user rather than a data source: agreement coverage per intercompany transaction, entity data accuracy and signature turnaround become measurable, and an audit question about who signed what and when is answered from the repository instead of a mailbox.", "priority": "medium", "tags": ["legal", "agreements", "entities"], "sources": [{"id": "reptune-legal", "title": "Legal Module \u2014 entities, agreements and structure charts", "url": "https://www.reptune.tax/legal/", "publisher": "Reptune", "date": "2026-09-04"}, {"id": "reptune-platform", "title": "Reptune.net \u2014 the transfer pricing documentation platform", "url": "https://www.reptune.tax/reptune-platform/", "publisher": "Reptune", "date": "2026-09-04"}], "link": {"customerId": "htax", "jobIds": ["jtbd-htax-1"], "kpiIds": ["co-htax-top"]}}, {"id": "tpc-09", "title": "R-AI and AI-assisted writing move onboarding and country expertise into the product, under ISO 27001 controls", "summary": "Reptune's R-AI assistant answers questions in any language, supports onboarding (included in every plan) and is offered as a Country Expert add-on, with a Local Requirements capability announced as coming; AI-assisted writing and editing is included in all plans. Reptune is ISO 27001 certified and offers a free two-week trial with no installation.", "implication": "Ground the assistant in the same regulation base and templates the generator uses, so an answer and a generated document never disagree; ISO 27001 and data handling are part of the evaluation for every head of tax, so AI features must be scoped to the client's own data and logged.", "priority": "medium", "tags": ["ai", "onboarding", "security"], "sources": [{"id": "reptune-ai", "title": "AI capabilities \u2014 R-AI assistant, AI writing and machine translation", "url": "https://www.reptune.tax/ai-capabilities/", "publisher": "Reptune", "date": "2026-09-04"}, {"id": "reptune-pricing", "title": "Reptune pricing \u2014 Core, Advanced and Enterprise plans and service levels", "url": "https://www.reptune.tax/pricing/", "publisher": "Reptune", "date": "2026-09-04"}, {"id": "reptune-platform", "title": "Reptune.net \u2014 the transfer pricing documentation platform", "url": "https://www.reptune.tax/reptune-platform/", "publisher": "Reptune", "date": "2026-09-04"}], "link": {"customerId": "htax", "jobIds": ["jtbd-htax-2"], "kpiIds": ["co-htax-top"]}}, {"id": "tpc-11", "title": "Vortex's 2024 majority stake funds commercial scaling and international expansion of a 20-person software-and-services company", "summary": "On 5 August 2024 Reptune (formerly TP Tuned, Amsterdam, founded 2015) announced that Vortex Capital Partners became majority shareholder alongside management; the company had 20 team members at the transaction. Lennart van den Kommer cited a 'proven offering and a loyal custom     function jobNamesForCustomer(jobIds) {
        const jobs = (customer.jobsToBeDone || []);
        const jobLookup = {};
        jobs.forEach(job => {
            if (job.id) {
                jobLookup[job.id] = job.name || job.id;
            }
        });
        return (jobIds || []).map(jobId => jobLookup[jobId] || jobId);
    }

    function kpiNamesForLink(link) {
        // Prefer stable KPI IDs resolved against this customer's KPI pyramid; fall back to legacy display-name kpis.
        if (link && link.kpiIds && link.kpiIds.length) {
            const lookup = {};
            function walk(node) {
                if (!node) return;
                if (node.id) {
                    lookup[node.id] = node.name || node.id;
                }
                (node.branches || []).forEach(walk);
                (node.children || []).forEach(walk);
            }
            const pyramids = (customer || {}).kpiPyramids || {};
            ['customerOutcomes', 'businessOutcomes'].forEach(key => {
                const pyramid = pyramids[key];
                if (!pyramid) return;
                walk(pyramid.top);
                (pyramid.branches || []).forEach(walk);
            });
            return link.kpiIds.map(kpiId => lookup[kpiId] || kpiId);
        }
        return (link && link.kpis) || [];
    }

    function addInsights() {
        let html = '';

        html += '<div style="margin: 24px">';

        if (!customerInsights || customerInsights.length === 0) {
            html += '<div class="group">No customer-linked insights defined for this domain yet.</div>';
        } else {
            customerInsights.forEach(insight => {
                html += '<div class="group" style="width: 250px; display: inline-block; margin: 8px; padding: 16px; background: white">';
                html += '<div style="font-size: 150%; color: #1d4ed8; margin-bottom: 8px">' + escapeHtml(insight.title) + '</div>';
                html += '<div style="margin-bottom: 10px">' + escapeHtml(insight.summary) + '</div>';
                if (insight.implication) {
                    html += '<div style="margin-bottom: 10px"><b>Product implication:</b> ' + escapeHtml(insight.implication) + '</div>';
                }
                if (insight.link) {
                    if (insight.link.jobIds && insight.link.jobIds.length) {
                        html += '<div style="font-size: 13px; color: #4b5563; margin-bottom: 4px"><b>Jobs:</b> ' + escapeHtml(jobNamesForCustomer(insight.link.jobIds).join(', ')) + '</div>';
                    }
                    const kpiNames = kpiNamesForLink(insight.link);
                    if (kpiNames.length) {
                        html += '<div style="font-size: 13px; color: #4b5563; margin-bottom: 4px"><b>KPIs:</b> ' + escapeHtml(kpiNames.join(', ')) + '</div>';
                    }
                }
                if (insight.tags && insight.tags.length) {
                    html += '<div style="margin-top: 8px; margin-bottom: 10px">';
                    insight.tags.forEach(tag => {
                        html += '<span style="display:inline-block; margin:0 8px 6px 0; padding:4px 10px; border-radius:999px; background:#eef2f6; font-size:12px">' + escapeHtml(tag) + '</span>';
                    });
                    html += '</div>';
                }
                if (insight.sources && insight.sources.length) {
                    html += '<div style="margin-top: 8px">';
                    html += '<div style="font-size: 13px; color: #6b7280; margin-bottom: 4px">Sources</div>';
                    insight.sources.forEach(source => {
                        html += '<div style="font-size: 13px; margin-bottom: 4px">';
                        html += '<a class="activity-link" target="_blank" href="' + escapeHtml(source.url) + '">' + escapeHtml(source.title) + '</a>';
                        html += '<span class="activity-muted"> (' + escapeHtml(source.publisher || '') + (source.date ? ', ' + escapeHtml(source.date) : '') + ')</span>';
                        html += '</div>';
                    });
                    html += '</div>';
                }
                html += '</div>';
            });
        }
        html += '</div>';

        document.getElementById('Insights').innerHTML = html;
    }

    function addJourneys() {

            html += '</div>';

        if (node && node.target) {
            html += '<div style="font-size: 80%; color: #047857; margin-top: 2px"><b>Target:</b> ' + escapeHtml(String(node.target)) + '</div>';
        }
        if (node && node.guardrailRole) {
            html += '<div style="font-size: 78%; color: #b91c1c; margin-top: 2px"><b>Guardrail:</b> ' + escapeHtml(String(node.guardrailRole)) + '</div>';

        if (node && (node.period || node.calculationMethod || node.valueSource)) {

            html += '<div style="font-size: 76%; color: #7c3aed; margin-top: 3px"><b>Composite guardrail:</b> ' + escapeHtml(String(node.guardrail)) + '</div>';
