<script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

al year with the calculated deadline for each."}, {"id": "maintain-country-regulations-and-deadlines", "name": "Maintain country regulations and deadlines", "howItSupports": "Supplies the current thresholds, content, language and deadline rules for 170+ countries against which the scoping decision is made."}]}, {"step": "Review generated documentation for consistency with the policy", "description": "Read the Master File and a sample of Local Files as an auditor would: do the functional analyses, methods and benchmarks match the policy, do the entity results sit within their arm's-length ranges, and does the local narrative contradict the group narrative anywhere. Push back on custom text that drifts from the model rather than on formatting.", "streamsNeeded": [{"id": "generate-master-file-and-local-files", "name": "Generate Master File and Local Files", "howItSupports": "Generates the Master File and all Local Files from the same model, so the review is about substance and the files cannot drift apart structurally."}, {"id": "benchmark-intercompany-transactions", "name": "Benchmark intercompany transactions", "howItSupports": "Shows each entity's segmented result against its benchmark range so the head of tax sees outliers before the file is finalised."}]}, {"step": "Keep the evidence package current", "description": "Ensure that benchmarks are refreshed on the cycle the group has committed to, that every material intercompany transaction is backed by a signed agreement, and that segmented financials reconcile to statutory accounts, so the Local File is supported by evidence and not only by narrative.", "streamsNeeded": [{"id": "manage-legal-entities-and-intercompany-agreements", "name": "Manage legal entities and intercompany agreements", "howItSupports": "Reports which transactions lack a signed agreement and inserts the archived agreements into the documentation automatically."}, {"id": "benchmark-intercompany-transactions", "name": "Benchmark intercompany transactions", "howItSupports": "Archives benchmark studies with their validity period and flags benchmarks due for a refresh or a financial update."}, {"id": "collect-and-validate-financial-and-transactional-data", "name": "Collect and validate financial and transactional data", "howItSupports": "Validates entity financials and segmented P&Ls against the statutory figures before they enter the documentation."}]}, {"step": "Defend the group in audits, APAs and MAPs from the archive", "description": "When a tax authority opens an audit or the group negotiates an APA or a MAP, retrieve the version of the documentation that was filed, its underlying data, agreements and benchmarks, and the value chain analysis, and respond within the authority's deadline in the local language with support from transfer pricing specialists.", "streamsNeeded": [{"id": "monitor-compliance-and-defend-audits", "name": "Monitor compliance and defend audits", "howItSupports": "Provides the archived filed versions, risk indicators, value chain analysis and controversy support that turn an audit request into an evidence pack."}, {"id": "localise-and-translate-documentation", "name": "Localise and translate documentation", "howItSupports": "Produces the local-language versions of files and responses that the authority requires during the audit."}]}], "media": [{"type": "image", "src": "media/jbtd-htax-jtbd-htax-1.png", "title": "Group Head of Tax / Transfer Pricing Director JTBD infographic: Be audit-ready in every country without a documentation project each year", "alt": "Enterprise infographic for the job \"Be audit-ready in every country without a documentation project each year\" for customer \"Group Head of Tax / Transfer Pricing Director\"."}]}, {"id": "jtbd-htax-2", "name": "Control transfer pricing compliance cost and adviser spend", "whatItIs": "Bring the annual cost of transfer pricing compliance under control and make it predictable: know what the cycle costs per entity and per Local File, decide what is done in-house, jointly or by Reptune specialists, replace adviser drafting hours with generated and localised documentation, and reserve expensive expert time for judgement calls, restructurings and controversy.", "outcome": "Compliance cost per entity falls by 50 to 75 percent against the adviser-led baseline, the budget is fixed at the start of the cycle by plan and service level with no surprise invoices, and external adviser spend concentrates on advice rather than on documentation production.", "steps": [{"step": "Budget the cycle by plan, Local Files and service level", "description": "Size the subscription (Core up to 25 Local Files, Advanced up to 50, Enterprise 50+), the add-ons the group needs (machine translation, CbCR, SSO, R-AI Country Expert, custom templates) and the fixed rate per Local File for any Full Service or Collaborative work, and lock the budget before the fiscal year's cycle starts.", "streamsNeeded": [{"id": "deliver-documentation-as-a-service", "name": "Deliver documentation as a service", "howItSupports": "Prices documentation work at a fixed rate per Local File per service level so the budget is known in advance."}, {"id": "scope-and-plan-the-annual-documentation-cycle", "name": "Scope and plan the annual documentation cycle", "howItSupports": "Turns the scoped deliverables per entity into the number of Local Files that drives the plan tier and the service budget."}]}, {"step": "Decide per entity what is done in-house, jointly or by Reptune", "description": "Allocate entities and countries across the On Demand, Collaborative and Full Service levels depending on the in-house team's capacity, the local contact's capability and the country's audit exposure, and change the allocation from year to year without switching platforms.", "streamsNeeded": [{"id": "deliver-documentation-as-a-service", "name": "Deliver documentation as a service", "howItSupports": "Lets the group switch entities between service levels on the same configured platform, with Reptune specialists picking up the work where assigned."}, {"id": "scope-and-plan-the-annual-documentation-cycle", "name": "Scope and plan the annual documentation cycle", "howItSupports": "Assigns each scoped deliverable to an in-house user, a local contact or a Reptune specialist with its own deadline and reminders."}]}, {"step": "Replace adviser drafting with generated, localised documentation", "description": "Move the production of Master File and Local Files from adviser Word drafts to generation from the model, with localised templates and machine translation covering the countries where advisers were previously engaged only for language or format, and keep local advisers only for review where the risk justifies it.", "streamsNeeded": [{"id": "generate-master-file-and-local-files", "name": "Generate Master File and Local Files", "howItSupports": "Produces the full documentation set at the press of a button in the group's corporate identity, removing drafting hours from the cost base."}, {"id": "localise-and-translate-documentation", "name": "Localise and translate documentation", "howItSupports": "Covers local content rules and translation into 28 languages with glossaries, so local advisers are no longer needed for localisation alone."}]}, {"step": "Reserve expert time for judgement calls", "description": "Use the included expert hours (2, 4 or 8 per year by plan) and paid consultation for the questions that need a specialist: a value chain analysis, a restructuring, a CbCR risk analysis, an APA or a MAP, rather than for producing files.", "streamsNeeded": [{"id": "deliver-documentation-as-a-service", "name": "Deliver documentation as a service", "howItSupports": "Provides on-demand advice within the included expert hours and consultation beyond them from specialists who know the group's model."}, {"id": "monitor-compliance-and-defend-audits", "name": "Monitor compliance and defend audits", "howItSupports": "Surfaces the risk indicators and value chain questions that deserve expert attention instead of routine review."}]}, {"step": "Track time and spend per entity against the budget", "description": "Follow internal hours, specialist hours, translation and adviser invoices per entity and per Local File during the cycle, compare them with the budget and the previous year, and use the numbers to renegotiate adviser scopes and to justify the platform to the CFO.", "streamsNeeded": [{"id": "monitor-compliance-and-defend-audits", "name": "Monitor compliance and defend audits", "howItSupports": "Shows progress and effort per entity on the compliance dashboard next to status, so cost overruns are visible during the cycle."}, {"id": "scope-and-plan-the-annual-documentation-cycle", "name": "Scope and plan the annual documentation cycle", "howItSupports": "Records who did what for each deliverable and when, giving the per-entity effort baseline for next year's budget."}]}], "media": [{"type": "image", "src": "media/jbtd-htax-jtbd-htax-2.png", "title": "Group Head of Tax / Transfer Pricing Director JTBD infographic: Control transfer pricing compliance cost and adviser spend", "alt": "Enterprise infographic for the job \"Control transfer pricing compliance cost and adviser spend\" for customer \"Group Head of Tax / Transfer Pricing Director\"."}]}, {"id": "jtbd-htax-3", "name": "See group-wide compliance and risk status at a glance", "whatItIs": "Know at any moment which entities and countries are documented, in progress or at risk, which deadlines are coming for Master File, Local Files, CbCR and notifications, which entities sit outside their arm's-length range, and where the value chain creates audit exposure, and be able to show that picture to the CFO and the audit committee without assembling it by hand.", "outcome": "Group-wide compliance status per country and entity is live on one dashboard, no deadline is discovered after the fact, outliers against benchmark ranges are visible before year-end so they can be corrected or explained, and the quarterly tax risk report to the audit committee is produced from the platform in hours.", "steps": [{"step": "Get a live compliance status per country and entity", "description": "See on a world map and in widgets which entities have a final Local File, which are in draft, which are unscoped, and which countries have open actions, filtered by division, region or service level.", "streamsNeeded": [{"id": "monitor-compliance-and-defend-audits", "name": "Monitor compliance and defend audits", "howItSupports": "Renders real-time compliance status and financial performance per jurisdiction on the dashboard and world map."}, {"id": "scope-and-plan-the-annual-documentation-cycle", "name": "Scope and plan the annual documentation cycle", "howItSupports": "Feeds the status of every scoped deliverable and task into the dashboard as work progresses."}]}, {"step": "Watch deadlines for Master File, Local Files, CbCR and notifications", "description": "Follow the auto-calculated deadlines per entity and country, including CbCR filing and notification dates that differ by jurisdiction, and see which are within 30, 60 or 90 days with their responsible person and status.", "streamsNeeded": [{"id": "maintain-country-regulations-and-deadlines", "name": "Maintain country regulations and deadlines", "howItSupports": "Keeps the deadline rules per country current so calculated dates move when a fiscal year end or a local rule changes."}, {"id": "prepare-and-file-cbcr-and-notifications", "name": "Prepare and file CbCR and notifications", "howItSupports": "Tracks CbCR filing and notification deadlines and status per constituent entity alongside the documentation deadlines."}]}, {"step": "Spot entities outside their arm's-length range before year-end", "description": "Compare each entity's segmented actual results against the applicable benchmark range during the year, identify which entities will need a year-end adjustment or an explanation, and brief finance in time to act rather than to document a problem.", "streamsNeeded": [{"id": "benchmark-intercompany-transactions", "name": "Benchmark intercompany transactions", "howItSupports": "Compares segmented entity results with the arm's-length range per transaction type and lists the outliers."}, {"id": "collect-and-validate-financial-and-transactional-data", "name": "Collect and validate financial and transactional data", "howItSupports": "Brings in interim segmented financials from ERP or Excel so the comparison runs before the books are closed."}]}, {"step": "Assess risk and value chain exposure", "description": "Maintain a risk assessment per country and transaction type, review the value chain analysis when the business model changes, and understand how CbCR figures look from a tax authority's risk-assessment perspective, including Pillar Two transitional CbCR safe harbour tests.", "streamsNeeded": [{"id": "monitor-compliance-and-defend-audits", "name": "Monitor compliance and defend audits", "howItSupports": "Holds risk indicators, the value chain analysis and controversy history per country and entity."}, {"id": "prepare-and-file-cbcr-and-notifications", "name": "Prepare and file CbCR and notifications", "howItSupports": "Provides the CbCR dataset per jurisdiction that risk ratios and safe-harbour analyses are computed from."}]}, {"step": "Report to the CFO and the audit committee from one source", "description": "Produce the quarterly tax risk and compliance report from the dashboard: coverage, deadlines met, open risks, audits in progress and their exposure, and the cost of the cycle, with figures the tax team can trace back to entities and documents.", "streamsNeeded": [{"id": "monitor-compliance-and-defend-audits", "name": "Monitor compliance and defend audits", "howItSupports": "Exports the compliance and risk picture as a report and dashboard view that the audit committee can read directly."}, {"id": "integrate-with-erp-operational-tp-and-identity", "name": "Integrate with ERP, operational TP and identity", "howItSupports": "Gives finance leadership read-only, SSO-based access to the same dashboard rather than a forwarded PDF."}]}], "media": [{"type": "image", "src": "media/jbtd-htax-jtbd-htax-3.png", "title": "Group Head of Tax / Transfer Pricing Director JTBD infographic: See group-wide compliance and risk status at a glance", "alt": "Enterprise infographic for the job \"See group-wide compliance and risk status at a glance\" for customer \"Group Head of Tax / Transfer Pricing Director\"."}]}], "customerJourneyStories": [{"id": "journey-htax-1", "name": "From adviser-prepared binders to an audit-ready platform", "linkedJobIds": ["jtbd-htax-1", "jtbd-htax-2"], "summary": "A Head of Tax at a Dutch-headquartered industrial group with about 60 entities in 25 countries moves the group's transfer pricing documentation from a Big 4 adviser's annual project to Reptune.net, from the audit that exposed the gaps to the renewal in which the group takes most of the work in-house.", "stages": [{"stage": "Trigger", "narrative": "An Italian tax audit asks for the Local File of a distribution entity and the group discovers that the adviser's file is 18 months old, in English, and describes a functional profile that the restructured entity no longer has. The adviser quotes a six-figure fee to refresh all 25 countries. The CFO asks the Head of Tax for a way to keep documentation current every year at a predictable cost."}, {"stage": "Discovery", "narrative": "At a Dutch tax directors' network meeting the Head of Tax hears a peer describe how Reptune.net generates Local Files from one transfer pricing model and that its documentation 'saved the day' in several audits. A look at the reptune.tax site shows named customers such as TomTom, Stahl, Avnet and Ravago, 170+ countries covered, and a free two-week trial with no installation."}, {"stage": "Evaluation", "narrative": "The Head of Tax compares Reptune against keeping the adviser, a Big 4 documentation tool and a generic document-automation suite. Decisive checks are whether the group's policy fits the rule-based model, the localised templates for Italy and other high-risk countries, the fixed rate per Local File under Full Service, the ISO 27001 certification and SSO for IT security review, and the fact that the same platform allows the group to move to On Demand later. References from two comparable groups and a pricing proposal per plan and service level settle the choice."}, {"stage": "Trial", "narrative": "During the two-week trial the transfer pricing manager loads entities and transactions via Excel bulk entry with the R-AI onboarding assistant, and Reptune specialists configure the model for the largest division. The first generated Local File for the Italian entity, in the localised template and machine-translated with the glossary, is reviewed by the local adviser and passes with minor comments. The group signs an Advanced plan with Full Service for the first cycle."}, {"stage": "Engagement", "narrative": "In the first cycle Reptune specialists deliver 40 Local Files and the Master File while the in-house team monitors progress on the dashboard. The Head of Tax uses the world map and deadline view in the quarterly audit committee meeting, moves the benchmark studies and intercompany agreements into the platform, and starts using the included expert hours for a value chain analysis rather than for file production."}, {"stage": "Retention", "narrative": "At renewal the group reports compliance cost per entity down by more than half and the Italian audit closed without a documentation-related adjustment. The Head of Tax switches 30 entities to Collaborative, keeps Full Service for the ten highest-risk countries, adds the CbCR module and the Legal Module, and agrees to act as a reference for the next group that considers the move."}], "media": [{"type": "image", "src": "media/journey-htax-htax-1.png", "title": "Group Head of Tax / Transfer Pricing Director customer journey: From adviser-prepared binders to an audit-ready platform", "alt": "Enterprise journey storyboard for \"From adviser-prepared binders to an audit-ready platform\" for customer \"Group Head of Tax / Transfer Pricing Director\"."}]}, {"id": "journey-htax-2", "name": "Expanding from Local Files to CbCR, Legal Module and risk analytics", "linkedJobIds": ["jtbd-htax-3", "jtbd-htax-2"], "summary": "Two cycles into using Reptune.net for Master File and Local Files, the Head of Tax of a US-listed group's European region extends the platform to CbCR and EU Public CbCR, the Legal Module and risk management, so the audit committee sees the whole picture from one source.", "stages": [{"stage": "Trigger", "narrative": "The group's first EU Public CbCR under Directive (EU) 2021/2101 is due, the CbCR XML is still prepared by a corporate adviser from a spreadsheet, and the audit committee asks for a single tax risk report across documentation, CbCR and intercompany agreements. Legal keeps the agreements in a share drive and cannot say which transactions are uncovered."}, {"stage": "Discovery", "narrative": "In the annual account review the Reptune specialist shows that the CbCR module generates filing-ready XML and Excel and EU Public CbCR in XHTML with inline XBRL from the same data, and that the Legal Module links signed agreements and signatories to the transactions already in the model. A Reptune webinar on CbCR risk analysis and the Pillar Two transitional safe harbour makes the risk use case concrete."}, {"stage": "Evaluation", "narrative": "The Head of Tax checks with the corporate secretary whether the Legal Module can replace the entity register and DocuSign workflow, has IT confirm that custom user profiles and location-restricted access satisfy the group's access policy, and compares the Enterprise plan with the CbCR add-on against continuing with the adviser for CbCR alone. The ability to run a CbCR risk analysis and the safe-harbour test in the same place tips the decision."}, {"stage": "Trial", "narrative": "The prior year's CbCR is re-created in the platform from the adviser's spreadsheet and validated against the filed XML; the Actions Required page catches two constituent entities with inconsistent jurisdiction codes. Legal loads the entities and 120 intercompany agreements, and the first structure chart and agreement coverage report go to the Head of Tax within a month."}, {"stage": "Engagement", "narrative": "CbCR, notifications and EU Public CbCR are filed from the platform, risk indicators per country are reviewed monthly with the regional tax managers, and new agreements are generated, signed through DocuSign and archived against their transactions. The quarterly audit committee pack is now a dashboard export with coverage, deadlines, risk and agreement status."}, {"stage": "Retention", "narrative": "The group upgrades to Enterprise with divisions for its two business units, standardises on Reptune for the Americas region as well, and the Head of Tax presents the setup at an industry conference as the model for continuous compliance. The account becomes one of Reptune's largest and a design partner for the R-AI country-expert mode."}], "media": [{"type": "image", "src": "media/journey-htax-htax-2.png", "title": "Group Head of Tax / Transfer Pricing Director customer journey: Expanding from Local Files to CbCR, Legal Module and risk analytics", "alt": "Enterprise journey storyboard for \"Expanding from Local Files to CbCR, Legal Module and risk analytics\" for customer \"Group Head of Tax / Transfer Pricing Director\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-htax-top", "name": "Audit-ready documentation coverage", "description": "Share of in-scope legal entities (above local thresholds or documented by policy) that have a final, localised Local File, a current Master File and supporting benchmarks and agreements archived before the local deadline. Modeled s on, CbCR, SSO, R-AI Country Expert"], "supporting": ["New multinational groups won per year", "Trial-to-subscription conversion rate"]}, "milestones": ["Ship EU Public CbCR in XHTML with inline XBRL and Australian Public CbCR generated from existing CbCR data", "Deliver the R-AI Country Expert mode so a Head of Tax gets local-requirement answers for any country in any language", "Cut onboarding of a new group from signature to first generated Local File to under two weeks with the onboarding assistant and Excel bulk entry"]}, "year3": {"focus": "Become the central transfer pricing platform for European multinationals: risk analytics, benchmarks and value chain analysis that make audits predictable, ERP integration as standard, and the Legal Module as the group's agreement system of record.", "productTheme": "Predictable audits from one defensible evidence base", "customerKPI": {"northStar": "Audit-ready documentation coverage", "supporting": ["Documentation-related audit adjustments", "Group-wide compliance status visibility"]}, "businessKPI": {"northStar": "Annual recurring revenue from multinational group subscriptions", "revenueStreams": ["Enterprise plan subscriptions with divisions and custom profiles", "Legal Module, benchmark and risk analytics attach", "Consultation on VCA, CbCR analysis, APAs and MAPs"], "supporting": ["Net revenue retention of multinational groups", "Add-on attach rate"]}, "milestones": ["Launch risk indicators per country and transaction type with CbCR risk analysis and Pillar Two transitional safe harbour tests on the dashboard", "Make direct ERP and operational transfer pricing integration standard on Advanced and Enterprise plans so segmented results update during the year", "Add audit and controversy case tracking so every information request, response and outcome is linked to the filed documentation version"]}, "year5": {"focus": "Continuous, AI-assisted compliance at global scale: documentation that updates as transactions and financials flow in, controversy-ready evidence packs assembled on demand, and audit-outcome insight across the customer base that tells a Head of Tax where risk is rising.", "productTheme": "Continuous compliance with audit-outcome intelligence", "customerKPI": {"northStar": "Audit-ready documentation coverage", "supporting": ["Audits closed without documentation adjustment rate", "Time to produce the audit committee compliance report"]}, "businessKPI": {"northStar": "Annual recurring revenue from multinational group subscriptions", "revenueStreams": ["Global Enterprise subscriptions across regions", "Regulation intelligence and audit-outcome data products", "Agentic drafting and review under specialist supervision"], "supporting": ["Multinational group churn rate", "Groups acting as reference customers"]}, "milestones": ["Deliver controversy-ready evidence packs generated for any entity and fiscal year, in the local language, within a day of an audit notice", "Run agentic drafting and review of Local Files under specialist supervision so a policy change propagates to all files with a reviewed diff", "Publish anonymised audit-outcome and regulation intelligence that ranks countries and transaction types by adjustment risk"]}}}, "domain": "In-house Tax Teams of Multinationals"}, {"id": "tpmg", "name": "Transfer Pricing Manager / Documentation Coordinator", "description": "Runs the annual transfer pricing documentation cycle for a multinational with 10 to 200 Local Files, reporting to the Head of Tax. Sets up and maintains the transfer pricing model in Reptune.net (entities, company types, functional analyses, methods, transaction types, benchmarks), scopes entities and countries for the fiscal year, chases data from local finance contacts, generates the Master File and Local Files, localises and translates them, resolves the validation findings, tracks deadlines and coordinates local advisers and Reptune specialists. Often a tax professional with a few years of Big 4 experience who is now the group's only full-time transfer pricing resource, judged on whether every file is delivered on time, consistent and without a last-minute crisis, and on how many hours the cycle consumes.", "icon": "customer-tpmg-portrait.jpg", "careAbout": ["A model set up once that generates every Local File from the same functional analyses and methods, so a change is made in one place rather than in 40 documents", "A scoped plan for the fiscal year with the deadline for every Master File, Local File, CbCR filing and notification calculated per country rather than looked up", "Data that arrives from local contacts on time, in the right template, and is validated before it enters a file", "Local files that meet local content, format and language requirements at first generation, without the master narrative drifting in translation", "Fewer review rounds per file because validation catches gaps before generation and reviewers comment in the platform", "Time and hours per Local File that fall every cycle so the coordinator can spend the year on benchmarks, risk and policy instead of formatting"], "winsThem": ["Master File and Local Files generated at the press of a button in the corporate identity, with benchmarks and agreements inserted automatically", "Excel bulk entry, data exchange templates and the R-AI onboarding assistant that get the model live in days during a free two-week trial", "Workflow with scoping, task assignment, e-mail reminders and auto-calculated deadlines that chases local contacts so the coordinator does not have to", "Localised templates, machine translation into 28 languages with transfer pricing glossaries and a human-certified option for the countries that require it", "Reptune specialists a message away in the Collaborative service level, with expert hours included in the plan"], "theirFear": ["Discovering in December that a country's threshold or deadline changed and three Local Files are late or in the wrong format", "A local adviser rewrites a translated Local File and the local narrative now contradicts the Master File the group filed elsewhere", "Being the single point of failure: the model, the deadlines and the data requests live in the coordinator's head and spreadsheets"], "jobsToBeDone": [{"id": "jtbd-tpmg-1", "name": "Set up a transfer pricing model that generates consistent documentation everywhere", "whatItIs": "Build and maintain the structured transfer pricing model from which all documentation is generated: legal entities and ownership, company types and functional analyses, transfer pricing methods per transaction type, the register of intercompany transactions per entity, benchmarks, intercompany agreements, templates, styling and custom text. The job is to make the model complete and correct enough that generated Local Files need no manual changes in the exported files.", "outcome": "The model is live within days of starting, covers every entity and transaction type in scope, generates Master File and Local Files that are consistent with each other and with the policy, and needs only incremental maintenance when the business changes.", "steps": [{"step": "Load entities, ownership and company types", "description": "Bring the legal entities, their ownership, fiscal years, currencies and jurisdictions into the platform via Excel bulk entry or the Legal Module, assign each entity a company type (for example limited-risk distributor, contract manufacturer, principal, service provider) and check that the entity list matches the consolidation scope.", "streamsNeeded": [{"id": "set-up-the-transfer-pricing-model", "name": "Set up the transfer pricing model", "howItSupports": "Provides the entity and company-type structure of the model with Excel bulk entry and the R-AI onboarding assistant guiding the setup."}, {"id": "manage-legal-entities-and-intercompany-agreements", "name": "Manage legal entities and intercompany agreements", "howItSupports": "Supplies time-stamped legal entity records, shareholders and structure so the model uses the same entity master as legal."}]}, {"step": "Define functional analyses, methods and transaction types once", "description": "Write the functional analysis (functions, assets, risks) per company type, select the transfer pricing method and tested party per transaction type, and register the intercompany transactions each entity participates in, so that any entity of a given type in any country is documented the same way.", "streamsNeeded": [{"id": "set-up-the-transfer-pricing-model", "name": "Set up the transfer pricing model", "howItSupports": "Holds the rule-based definitions of functional analyses, methods and transaction types that the generator applies to every entity."}, {"id": "benchmark-intercompany-transactions", "name": "Benchmark intercompany transactions", "howItSupports": "Links each transaction type to its benchmark study and arm's-length range so the method section is supported by evidence."}]}, {"step": "Attach benchmarks and intercompany agreements to transactions", "description": "Archive the benchmark studies with their validity periods and ranges, upload or generate the intercompany agreements and link both to the transaction types and entities they cover, so they are inserted into the Local Files automatically and gaps are visible.", "streamsNeeded": [{"id": "benchmark-intercompany-transactions", "name": "Benchmark intercompany transactions", "howItSupports": "Archives benchmarks per transaction type and flags which transactions lack a current benchmark."}, {"id": "manage-legal-entities-and-intercompany-agreements", "name": "Manage legal entities and intercompany agreements", "howItSupports": "Stores signed agreements with parties, dates and signatories and reports agreement coverage per transaction."}]}, {"step": "Configure templates, styling and custom text in the corporate identity", "description": "Choose the OECD-aligned standard templates and localised templates per country, apply the iver every Master File, Local File and CbCR before its deadline", "whatItIs": "Run the annual cycle for a fiscal year: scope entities and countries against thresholds, plan the deliverables and their deadlines, assign tasks to local contacts and specialists, collect and validate data, generate drafts, resolve validation findings, finalise and archive, and prepare CbCR, notifications and public CbCR, so nothing is late anywhere.", "outcome": "Every scoped Master File, Local File, CbCR filing and notification is final and archived before its calculated deadline, tasks are tracked and chased automatically, and the coordinator sees status per entity at any moment instead of reconstructing it from e-mail.", "steps": [{"step": "Scope the fiscal year against thresholds and deadlines", "description": "For each entity decide whether a Local File is required or voluntary, whether the Master File must be filed or held, and whether CbCR and CbCR notifications apply, based on the current local thresholds, and let the platform calculate the deadline per deliverable and country.", "streamsNeeded": [{"id": "scope-and-plan-the-annual-documentation-cycle", "name": "Scope and plan the annual documentation cycle", "howItSupports": "Scopes documentation per entity and country for the fiscal year and calculates the deadline for each deliverable automatically."}, {"id": "maintain-country-regulations-and-deadlines", "name": "Maintain country regulations and deadlines", "howItSupports": "Provides current thresholds and deadline rules for 170+ countries that the scoping and deadline calculation rely on."}]}, {"step": "Assign tasks and chase data from local contacts", "description": "Create data-provision, review and filing tasks per entity, assign them to local finance contacts, in-house colleagues or Reptune specialists, and let e-mail reminders and the task list do the chasing so the coordinator intervenes only on overdue items.", "streamsNeeded": [{"id": "scope-and-plan-the-annual-documen  than the narrative, and the coordinator does not depend on a local adviser for every country.", "steps": [{"step": "Check local content, format and language rules per country", "description": "Before generating, confirm for each country which sections, appendices, formats and languages the local file must have, whether a local form or a summary must accompany it, and whether a certified translation is required, using the country regulations and the R-AI country-expert answers.", "streamsNeeded": [{"id": "maintain-country-regulations-and-deadlines", "name": "Maintain country regulations and deadlines", "howItSupports": "Provides content, format, language and translation requirements per country maintained by transfer pricing specialists."}, {"id": "localise-and-translate-documentation", "name": "Localise and translate documentation", "howItSupports": "Applies the country content rules to the Local File and tells the coordinator what local steps are still needed."}]}, {"step": "Apply localised templates and country-specific sections", "description": "Generate the Local File with the localised template where one exists (for example Italy) and add the country-specific sections, appendices and disclosures that the standard OECD-aligned template does not include.", "streamsNeeded": [{"id": "localise-and-translate-documentation", "name": "Localise and translate documentation", "howItSupports": "Delivers localised templates and country content rules that shape the file for the jurisdiction."}, {"id": "generate-master-file-and-local-files", "name": "Generate Master File and Local Files", "howItSupports": "Generates the Local File with the selected localised template and custom text in one run."}]}, {"step": "Machine-translate with glossaries, then certify where required", "description": "Run machine translation into the local language with the group's transfer pricing glossary so defined terms are translated consistently, review the output with the local contact, and order tion Coordinator JTBD infographic: Localise and translate documentation without losing consistency", "alt": "Enterprise infographic for the job \"Localise and translate documentation without losing consistency\" for customer \"Transfer Pricing Manager / Documentation Coordinator\"."}]}], "customerJourneyStories": [{"id": "journey-tpmg-1", "name": "Trial in two weeks, first cycle in one season", "linkedJobIds": ["jtbd-tpmg-1", "jtbd-tpmg-2"], "summary": "A transfer pricing manager at a Benelux distribution group with 45 entities in 20 countries, previously running the cycle in Word and Excel with a local adviser per country, goes from a free two-week trial to running the whole fiscal-year cycle in Reptune.net with the Collaborative service level.", "stages": [{"stage": "Trigger", "narrative": "The previous cycle ended with two Local Files finalised after their deadlines, a Polish file in a format the local adviser had to rebuild, and a functional analysis that differed between the Master File and three Local Files because each had been edited separately. The Head of Tax asks the manager to propose a way to run the next cycle without repeating this."}, {"stage": "Discovery", "narrative": "The manager searches for transfer pricing documentation software, reads the reptune.tax feature pages on the automated report generator, workflow and country regulations, and watches a demo in which a Local File for Italy is generated in the localised template. A former Big 4 colleague now at Avnet confirms the group has used the platform globally since 2019."}, {"stage": "Evaluation", "narrative": "Together with the Head of Tax the manager compares Reptune with a Big 4 tool and with continuing in Word. The decisive points are that the model is rule-based and generates every file from one source, that deadlines and thresholds are maintained for all 20 countries, that machine translation with glossaries is included as an add-on, and that the Advanced plan with Collaborative service keeps Reptune specialists involved for the first cycle. IT signs off on ISO 27001 and SSO."}, {"stage": "Trial", "narrative": "In the two-week trial the manager loads all 45 entities via Excel bulk entry, defines four company types and eight transaction types with the R-AI onboarding assistant, uploads last year's benchmarks, and generates a draft Local File for the Dutch principal and the Polish distributor. Validation flags twelve missing data points that would have surfaced in December; the drafts read consistently. The group signs."}, {"stage": "Engagement", "narrative": "The first cycle is scoped in the platform, data tasks go to 20 local contacts with automatic reminders, Reptune specialists draft the Master File and the manager generates the Local Files, localises them with the templates and machine translation, and tracks progress on the dashboard. The Head of Tax sees the world map turn green country by country instead of asking for status by e-mail."}, {"stage": "Retention", "narrative": "The cycle closes with every file final before its deadline and preparation time per Local File down by more than half. For the next fiscal year the manager moves to On Demand for most entities, keeps Collaborative for five countries, adds the R-AI Country Expert add-on, and rolls the scope forward in the platform in an afternoon."}], "media": [{"type": "image", "src": "media/journey-tpmg-tpmg-1.png", "title": "Transfer Pricing Manager / Documentation Coordinator customer journey: Trial in two weeks, first cycle in one season", "alt": "Enterprise journey storyboard for \"Trial in two weeks, first cycle in one season\" for customer \"Transfer Pricing Manager / Documentation Coordinator\"."}]}, {"id": "journey-tpmg-2", "name": "From English-only files to localisation, translation and AI writing", "linkedJobIds": ["jtbd-tpmg-3", "jtbd-tpmg-2"], "summary": "A documentation coordinator at a US-headquartered group's European tax team, already generating English Local Files in Reptune.net, adopts localised templates, machine translation, AI-assisted writing and the R-AI country expert to stop depending on local advisers for every non-English country.", "stages": [{"stage": "Trigger", "narrative": "Local advisers in Italy, Spain and Brazil each return the English Local File translated and rewritten in their own style, the invoices for translation and 'localisation review' exceed the platform subscription, and a Spanish audit notes that the local file terminology does not match the intercompany agreement."}, {"stage": "Discovery", "narrative": "The coordinator reads a Reptune release note on machine translation into 28 languages with transfer pricing glossaries and the coming R-AI Local Requirements mode, and asks the Reptune specialist during a support call how other groups handle Italy and Brazil. The specialist shows the Italian localised template and a glossary-driven translation side by side with the adviser's version."}, {"stage": "Evaluation", "narrative": "The coordinator tests translation quality on one Local File with the Spanish local contact, checks that the glossary carries the group's defined terms into all languages, confirms which countries still require human-certified translation, and models the cost of the machine translation add-on against last year's translation invoices. The Head of Tax approves the add-on and the R-AI Country Expert."}, {"stage": "Trial", "narrative": "Italy, Spain and Brazil run through the new path for one cycle: localised template where available, machine translation with the glossary, local contact review in the platform, certified translation ordered only for Brazil. Local advisers are asked to review, not rewrite, and their review comments drop to a page each."}, {"stage": "Engagement", "narrative": "All non-English countries move to the localised path, AI-assisted writing is used to draft entity-specific custom text from the model's facts, and the coordinator uses R-AI to answer local-requirement questions before asking an adviser. Translation and localisation cost per Local File falls and the narrative stays consistent across languages."}, {"stage": "Retention", "narrative": "At renewal the group keeps the add-ons, asks Reptune for two more localised templates, and the coordinator joins the customer panel that tests the R-AI Local Requirements mode, giving the group early access to country-expert answers in the platform."}], "media": [{"type": "image", "src": "media/journey-tpmg-tpmg-2.png", "title": "Transfer Pricing Manager / Documentation Coordinator customer journey: From English-only files to localisation, translation and AI writing", "alt": "Enterprise journey storyboard for \"From English-only files to localisation, translation and AI writing\" for customer \"Transfer Pricing Manager / Documentation Coordinator\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-tpmg-top", "name": "Local file preparation time", "description": "Average hours of coordinator, local contact and specialist effort per Local File from data request to final archived version, including localisation. The current value reflects a Word-and-adviser baseline; the target reflects Reptune's stated 50 to 75 percent time savings. Modeled seed values.", "unit": "hours per local file", "currentValue": "40", "targetValue": "10", "link": "https://dashboard.example.com/transfer-pricing-compliance-platform/customers/tpmg/kpis/co-tpmg-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-tpmg-co-tpmg-top.png"}, "branches": [{"id": "co-tpmg-b1", "name": "Cycle speed and timeliness", "description": "How fast the annual cycle runs from scoping to the last final file and whether every deliverable meets its calculated deadline.", "currentValue": "64", "icon": "kpi-tpmg-co-tpmg-b1.png", "children": [{"id": "co-tpmg-b1-c1", "name": "On-time filing rate", "description": "Share of scoped Master File, Local File, CbCR and CbCR notification deliverables that were final and filed or lodged be entation that protects the entity when the local auditor comes. Judged locally on filing on time and on audit outcomes, and by group tax on the quality and timeliness of the data provided.", "icon": "customer-lfin-portrait.jpg", "careAbout": ["A clear, scoped data request with a deadline, a template that matches what the ERP can produce, and no repeated questions from headquarters", "Validation at upload time that tells the controller what is wrong before group tax finds it weeks later", "A segmented P&L per activity and transaction that reconciles to the statutory accounts, so the numbers in the Local File are the numbers the auditor will see", "A Local File in the local language and format, with the local forms, ready before the local filing or preparation deadline", "Knowing the local threshold, deadline and procedure without having to research it or pay a local adviser", "Documentation and evidence that can be pulled up in an hour when the local tax authority asks, so an audit does not become a reconstruction exercise"], "winsThem": ["Excel data exchange templates with built-in validation and, where set up, direct ERP integration so the entity's data flows in without re-keying", "Task assignments with e-mail reminders that tell the controller exactly what is due, for which entity, by when, in the platform rather than in a long e-mail thread", "Local Files generated in the localised template and machine-translated into the local language with the group glossary, plus local forms and procedures per country", "R-AI country-expert answers and Reptune specialists who know the local requirements and can help when the local tax authority sends a request", "An archive of the filed version with its data, agreements and benchmarks that the controller can show an auditor from the platform"], "theirFear": ["Uploading segmented figures that do not reconcile to the statutory accounts and being caught out by the local auditor a year later", "Missing a local deadline or form be t the direct ERP or operational transfer pricing integration deliver them to the platform.", "streamsNeeded": [{"id": "integrate-with-erp-operational-tp-and-identity", "name": "Integrate with ERP, operational TP and identity", "howItSupports": "Delivers entity financials and intercompany transaction data directly from the ERP or an operational transfer pricing solution where the integration is set up."}, {"id": "collect-and-validate-financial-and-transactional-data", "name": "Collect and validate financial and transactional data", "howItSupports": "Accepts Excel mass uploads of the extracted data in the group's templates where no integration exists."}]}, {"step": "Segment the P&L per activity and transaction type", "description": "Allocate revenues and costs to the entity's activities and tested transactions (for example distribution, contract manufacturing, services) using the allocation keys agreed with group tax, so the segmented result per transaction can be tested against its benchmark.", "streamsNeeded": [{"id": "collect-and-validate-financial-and-transactional-data", "name": "Collect and validate financial and transactional data", "howItSupports": "Supports P&L segmentation per activity with the group's allocation keys and validates that segments sum to the statutory total."}, {"id": "set-up-the-transfer-pricing-model", "name": "Set up the transfer pricing model", "howItSupports": "Defines the entity's company type, transactions and segments so the controller sees which segments are expected."}]}, {"step": "Upload, validate and fix findings before submission", "description": "Upload the templates, review the validation findings (missing fields, sums that do not reconcile, counterparties not in the model, currency mismatches) and correct them immediately rather than after group tax has reviewed the draft.", "streamsNeeded": [{"id": "collect-and-validate-financial-and-transactional-data", "name": "Collect and validate financial and transactional data", "howItSu ise-and-translate-documentation", "name": "Localise and translate documentation", "howItSupports": "Delivers machine translation with glossaries, human-certified translation on request and support with local forms."}, {"id": "maintain-country-regulations-and-deadlines", "name": "Maintain country regulations and deadlines", "howItSupports": "Specifies which forms and procedures the country requires alongside the Local File."}]}, {"step": "File or lodge with the local authority and record the filing", "description": "Submit the Local File, forms and any CbCR notification through the country's procedure (portal, tax return attachment, or kept on file for request), record the filing date and evidence in the platform and close the task.", "streamsNeeded": [{"id": "monitor-compliance-and-defend-audits", "name": "Monitor compliance and defend audits", "howItSupports": "Records the filed version, date and evidence per entity so compliance status is current and retrievable."}, {"id": "prepare-and-file-cbcr-and-notifications", "name": "Prepare and file CbCR and notifications", "howItSupports": "Provides the CbCR notification for the entity with local filing guidance where the country requires one."}]}], "media": [{"type": "image", "src": "media/jbtd-lfin-jtbd-lfin-2.png", "title": "Local Finance Controller / Country Tax Contact JTBD infographic: File a locally compliant local file and forms on time", "alt": "Enterprise infographic for the job \"File a locally compliant local file and forms on time\" for customer \"Local Finance Controller / Country Tax Contact\"."}]}, {"id": "jtbd-lfin-3", "name": "Answer a local tax audit with documentation that holds", "whatItIs": "When the local tax authority opens a transfer pricing audit or sends an information request, retrieve the documentation exactly as filed, the underlying data, agreements and benchmarks, answer the questions within the authority's deadline in the local language with support from group tax and specialists, and feed the outcome back into next year's documentation.", "outcome": "Audit requests are answered from the platform within the statutory period, the documentation and evidence are consistent and hold up, the entity avoids adjustments and penalties attributable to documentation, and lessons from the audit are reflected in the model for the following year.", "steps": [{"step": "Retrieve the filed version and its evidence", "description": "Pull up the Local File version that was filed for the audited year, its data snapshot, the translation, forms and filing record, so the controller responds with what the authority already has rather than a newer draft.", "streamsNeeded": [{"id": "monitor-compliance-and-defend-audits", "name": "Monitor compliance and defend audits", "howItSupports": "Keeps archived filed versions with their evidence retrievable per entity and fiscal year for audit defence."}]}, {"step": "Pull supporting agreements, benchmarks and segmented results", "description": "Assemble the signed intercompany agreements, the benchmark study and range, the segmented P&L and the reconciliation to statutory accounts that support the Local File's conclusions for the audited transactions.", "streamsNeeded": [{"id": "manage-legal-entities-and-intercompany-agreements", "name": "Manage legal entities and intercompany agreements", "howItSupports": "Provides the signed agreements and signatory records for the entity's transactions with their effective dates."}, {"id": "benchmark-intercompany-transactions", "name": "Benchmark intercompany transactions", "howItSupports": "Supplies the benchmark study, the range and the entity's tested result for the audited year."}]}, {"step": "Answer information requests with group tax and specialists", "description": "Draft responses to the authority's questions in the local language with group tax, using the included expert hours or consultation from Reptune specialists for controversy support, and track each request, response and deadline.", " atform with a validated template, a localised Local File and a filing record.", "stages": [{"stage": "Trigger", "narrative": "Last year the controller sent segmented figures to headquarters three times because the spreadsheet format changed between requests, received the Local File in English two days before the Spanish deadline, and paid a local adviser to translate it overnight. The controller tells group tax that the process cannot be repeated with the same team."}, {"stage": "Discovery", "narrative": "Group tax announces that the group is moving to Reptune.net and invites the controller to a 45-minute onboarding webinar with a Reptune specialist, where the controller sees the data exchange template, the validation on upload and the Spanish translation with the group glossary. A colleague at another subsidiary says the templates matched their SAP extract."}, {"stage": "Evaluation", "narrative": "The controller has no purchase decision but decides how much to trust the new process: checks that the template fields map to the entity's chart of accounts, asks whether local review happens in the platform or in Word, confirms that access is read-only for the entity's own data and via SSO, and asks group tax whether the Spanish threshold and deadline are tracked so the entity is not surprised again."}, {"stage": "Trial", "narrative": "For the first cycle the controller receives a task with the entity's templates and deadline, uploads the ERP extract, corrects four validation findings in twenty minutes and submits. The draft Local File arrives in the platform six weeks before the deadline, in the localised template and in Spanish; the controller corrects two local facts in the review task rather than in a Word file."}, {"stage": "Engagement", "narrative": "In the second cycle the controller uses the ERP integration set up by group IT, so financials arrive without an upload, and uses R-AI to check the Spanish local form requirements. Reminders come from the platform, the rs Reptune specialist hours for controversy support."}, {"stage": "Evaluation", "narrative": "The contact checks that the archived versions match what was handed to the tax office, that the German translation uses the terminology in the agreements, that the segmented P&L reconciles to the HGB accounts, and that the specialists have German audit experience. Satisfied, the contact decides to run the audit response from the platform rather than rebuild a file with a local adviser."}, {"stage": "Trial", "narrative": "The first information request is answered within the deadline from the archive: filed Local Files, the agreement retrieved from the Legal Module with its signatories, the benchmark range and the entity's tested result per year. A Reptune specialist reviews the response with group tax; the auditor's follow-up questions narrow to one transaction."}, {"stage": "Engagement", "narrative": "Through the audit the contact tracks every request and response in the platform, uses R-AI to check German documentation rules on deadlines and penalties, and works with group tax to adjust the entity's functional profile in the model for the year in progress. The audit closes with no adjustment attributable to documentation."}, {"stage": "Retention", "narrative": "The contact asks group tax to include the German entity's CbCR notification and local forms in the platform workflow, files the next Local File from the platform with the certified translation ordered through it, and tells the other German entities' controllers to do the same."}], "media": [{"type": "image", "src": "media/journey-lfin-lfin-2.png", "title": "Local Finance Controller / Country Tax Contact customer journey: The audit that made the local controller a believer", "alt": "Enterprise journey storyboard for \"The audit that made the local controller a believer\" for customer \"Local Finance Controller / Country Tax Contact\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-lfin-top", "name": "Lo ssed per fiscal-year cycle across all customers, the manual channel that integrations gradually replace.", "unit": "uploads per cycle", "currentValue": "9500", "targetValue": "20000", "icon": "kpi-lfin-bo-lfin-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-lfin-b2", "name": "Delivery cost and local service revenue", "description": "What it costs to process entity data and serve local contacts, and what localisation services earn per entity.", "currentValue": "53", "icon": "kpi-lfin-bo-lfin-b2.png", "children": [{"id": "bo-lfin-b2-c1", "name": "Full Service Local Files delivered per year", "description": "Number of Local Files prepared end-to-end by Reptune specialists under Full Service and Collaborative engagements per year, each of which depends on local data provided through the platform.", "unit": "local files per year", "currentValue": "1400", "targetValue": "3500", "icon": "kpi-lfin-bo-lfin-b2-c1.png", "children": [{"id": "bo-lfin-b2-c1-l1", "name": "Data processing hours per Full Service Local File", "description": "Specialist hours spent processing and validating local entity data per Full Service Local File.", "unit": "hours", "currentValue": "3.5", "targetValue": "1.5", "icon": "kpi-lfin-bo-lfin-b2-c1-l1.png", "children": []}, {"id": "bo-lfin-b2-c1-l2", "name": "Collaborative service level share", "description": "Share of serviced Local Files delivered under the Collaborative level, where local contacts provide data and reviews in the platform and specialists draft.", "unit": "%", "currentValue": "30", "targetValue": "40", "icon": "kpi-lfin-bo-lfin-b2-c1-l2.png", "children": []}]}, {"id": "bo-lfin-b2-c2", "name": "Support cost per entity per cycle", "description": "Reptune support cost attributable to local contact questions and data issues per in-scope entity per fiscal-year cycle.", "unit": "EUR", "currentValue": "65", "targetValue": "30", "icon": "kpi-lfin-bo-lfin-b2-c2.png", "children": [{"id": "bo-lfin-b2-c2-l1", "name": "Data-related support tickets
