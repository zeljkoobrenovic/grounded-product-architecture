    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

% rise in global revenue", "sourceUrl": "https://kpmg.com/xx/en/media/press-releases/2025/12/kpmg-delivers-rise-in-global-revenue.html"}, {"metric": "tax_and_legal_growth", "value": "Tax & Legal Services grew by 7.5%", "period": "FY25, published 2025-12-16", "scope": "KPMG firms (Tax & Legal Services)", "sourceTitle": "KPMG delivers 5.1% rise in global revenue", "sourceUrl": "https://kpmg.com/xx/en/media/press-releases/2025/12/kpmg-delivers-rise-in-global-revenue.html"}, {"metric": "employees", "value": "276,030 global headcount, up 1.8%", "period": "FY25, published 2025-12-16", "scope": "KPMG firms", "sourceTitle": "KPMG delivers 5.1% rise in global revenue", "sourceUrl": "https://kpmg.com/xx/en/media/press-releases/2025/12/kpmg-delivers-rise-in-global-revenue.html"}, {"metric": "tpad_track_record", "value": "developed in 2020; generates hundreds of transfer pricing documentations every year; local files in scope ready less than 3 months after the financial year end", "period": "accessed 2026-09-04", "scope": "product (KPMG TPAD, KPMG Denmark)", "sourceTitle": "Automate your global transfer pricing documentation - KPMG TPAD", "sourceUrl": "https://kpmg.com/dk/en/services/tax/digital-solutions/Digital-tool-TPAD.html"}], "links": {"website": "https://kpmg.com/", "product_page": "https://kpmg.com/xx/en/our-insights/ai-and-technology/kpmg-digital-gateway-for-tax.html", "tpengine_page": "https://kpmg.com/xx/en/our-insights/ai-and-technology/kpmg-transfer-pricing-engine.html", "tpad_page": "https://kpmg.com/dk/en/services/tax/digital-solutions/Digital-tool-TPAD.html", "newsroom": "https://kpmg.com/xx/en/media/press-releases.html"}, "logo_path": "logos/kpmg-digital-gateway.png"}, {"id": "tpdoc-alphatax", "logo": "logos/tpdoc-alphatax.png", "name": "TPdoc (Alphatax, formerly Tax Systems / TaxModel)", "hq": "Staines-upon-Thames, United Kingdom", "category": "regional-leader", "primaryRegions": ["europe", "middle_east"], "description": "TPdoc is the cloud documentation tool ires TaxModel", "sourceUrl": "https://www.bowmark.com/news/bowmark-backed-tax-systems-acquires-taxmodel"}, {"metric": "efficiency_claim", "value": "reduce documentation time and effort by up to 70%", "period": "accessed 2026-09-04", "scope": "product (TPdoc, vendor claim)", "sourceTitle": "Transfer Pricing Documentation - Alphatax", "sourceUrl": "https://alphatax.com/what/transfer-pricing-documentation/"}], "links": {"website": "https://alphatax.com/", "product_page": "https://alphatax.com/what/transfer-pricing-documentation/", "about": "https://alphatax.com/who/", "acquisition_announcement": "https://www.bowmark.com/news/bowmark-backed-tax-systems-acquires-taxmodel"}, "logo_path": "logos/tpdoc-alphatax.png"}]};
    let showDetails = false;

    function escapeHtml(value) {
        return String(value || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function titleCase(value) {
        return String(value || '')
            .split('_')
            .filter(Boolean)
            .map(part => part.charAt(0).toUpperCase() + part.slice(1))
            .join(' ');
    }

    function firstLetterLogo(player) {
        return '<div class="player-logo-fallback">' + escapeHtml((player.name || '?').charAt(0).toUpperCase()) + '</div>';
    }

    function renderPlayerLogo(player) {
        const fallback = firstLetterLogo(player);
        if (!player.logo_path) {
            return fallback;
        }

        return ''
            + '<div class="player-logo-wrap">'
            + '<img class="player-logo" src="' + escapeHtml(player.logo_path) + '" alt="' + escapeHtml(player.name) + ' logo"'
            + ' onerror="this.style.display=\'none\'; if (this.nextElementSibling) { this.nextElementSibling.style.display=\'flex\'; }">'
            + '<div class="player-logo-fallback" style="display:none;">' + escapeHtml((player.name || '?').charAt(0).toUpperCase()) + '</div>'
            + '</div>';
    }

    function renderHero() {
        const players = competitionData.players || [];
        document.getElementById('heroSubtitle').innerHTML = escapeHtml(competitionData.scope && competitionData.scope.description || '');
        document.getElementById('heroMeta').innerHTML = ''
            + '<div class="meta-chip">Updated ' + escapeHtml(competitionData.generatedOn || '') + '</div>';
    }

    function renderScope() {
        const scope = competitionData.scope || {};
        document.getElementById('scopeCopy').textContent = scope.description || '';
        const notes = Array.isArray(scope.notes) ? scope.notes : (scope.notes ? [scope.notes] : []);
        document.getElementById('scopeNotes').innerHTML = notes.map(item => '<div class="pill">' + escapeHtml(item) + '</div>').join('');
    }

    function renderPlayer(player) {
        const logoHtml = renderPlayerLogo(player);
        const detailUrl = 'landing_pages/' + encodeURIComponent(player.id) + '.html';

        const stats = (player.businessStats || []).slice(0, 3).map(stat => ''
            + '<div class="stat-item">'
            + '<div class="stat-metric">' + escapeHtml(titleCase(stat.metric)) + '</div>'
            + '<div class="stat-value">' + escapeHtml(stat.value || '') + '</div>'
            + '<div class="stat-meta">' + escapeHtml((stat.period || '') + (stat.scope ? ' • ' + titleCase(stat.scope) : '')) + '</div>'
            + '</div>'
        ).join('');

        const links = Object.entries(player.links || {}).slice(0, 4).map(([key, value]) => ''
            + '<a class="link-item" href="' + escapeHtml(value) + '" target="_blank" rel="noopener noreferrer">'
            + '<div><strong>' + escapeHtml(titleCase(key)) + '</strong></div>'
            + '<div class="link-meta">' + escapeHtml(value) + '</div>'
            + '</a>'
        ).join('');

        const regions = (player.primaryRegions || []).map(region => '<div class="pill">' + escapeHtml(titleCase(region)) + '</div>').join('');

        return ''
            + '<div class="player-card" data-detail-url="' + escapeHtml(detailUrl) + '">'
            + '<div class="player-header">'
            + logoHtml
            + '<div>'
            + '<div class="category-chip">' + escapeHtml(titleCase(player.category || 'competitor')) + '</div>'
            + (player.role ? '<div class="category-chip" style="' + ({ direct: 'background:#fdecea;color:#b71c1c', substitute: 'background:#fff4e5;color:#8a4b00', benchmark: 'background:#eef2f7;color:#37474f' }[player.role] || '') + '">' + escapeHtml(({ direct: 'Direct', substitute: 'Substitute', benchmark: 'Benchmark' }[player.role] || player.role)) + '</div>' : '')
            + '<div class="player-name">' + escapeHtml(player.name || '') + '</div>'
            + '<div class="player-meta">' + escapeHtml(player.hq || '') + (player.regionRelevance ? ' · ' + escapeHtml(player.regionRelevance) : '') + '</div>'
            + '</div>'
            + '</div>'
            + '<div class="player-description">' + escapeHtml(player.description || '') + '</div>'
            + '<div class="section-title">Primary Regions</div>'
            + '<div class="regions-row">' + regions + '</div>'
            + '<div class="player-details-block' + (showDetails ? '' : ' details-hidden') + '">'
            + '<div class="section-title">Selected Stats</div>'
            + '<div class="stats-list">' + stats + '</div>'
            + '<div class="section-title">Official Links</div>'
            + '<div class="links-list">' + links + '</div>'
            + '</div>'
            + '</div>';
    }

    function renderPlayers() {
        document.getElementById('playersGrid').innerHTML = (competitionData.players || []).map(renderPlayer).join('');
        bindPlayerCardNavigation();
        syncDetailsToggle();
        syncPlayerTabLabel();
    }

    function bindPlayerCardNavigation() {
        document.querySelectorAll('.player-card').forEach(card => {
            card.addEventListener('click', function (event) {
                const interactive = event.target.closest('a, button');
                if (interactive) {
                    return;
                }
                const detailUrl = card.getAttribute('data-detail-url');
                if (detailUrl) {
                    window.open(detailUrl, '_blank');
                }
            });
        });
    }

    function syncDetailsToggle() {
        const button = document.getElementById('detailsToggleButton');
        if (!button) {
            return;
        }
        button.textContent = showDetails ? 'Hide details' : 'Show details';
        button.className = 'toggle-button' + (showDetails ? ' toggle-button-active' : '');
    }

    function toggleDetails() {
        showDetails = !showDetails;
        renderPlayers();
    }

    function syncPlayerTabLabel() {
        const button = document.getElementById('tab_PlayersTab');
        if (!button) {
            return;
        }
        button.textContent = 'Players (' + String((competitionData.players || []).length) + ')';
    }

    renderHero();
    renderScope();
    renderPlayers();
</script>
</body>
</html>
