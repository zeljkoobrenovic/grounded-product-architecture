    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

n is filed have often already spent it.", "A VAT refund that shows as income misleads starters about their profit."], "dependencies": [{"type": "brick", "id": "vatv", "name": "VAT Position and Tax Reservation View", "description": "VAT position per quarter.", "how": "Computes VAT to pay or receive from the ledger."}, {"type": "brick", "id": "dash", "name": "Financial Dashboard and Quarterly Results", "description": "VAT tile.", "how": "Shows the VAT position next to revenue and profit."}]}, {"id": "estimate-the-income-tax-reservation", "title": "Estimate the income tax reservation", "actor": "Knowledge Freelancer", "keyFacts": ["A reservation estimate applies the year-to-date profit, the expected deductions (zelfstandigenaftrek \u20ac1,200 in 2026, startersaftrek \u20ac2,123 where applicable, mkb-winstvrijstelling) and the income tax brackets to suggest a percentage of profit to set aside.", "The assumptions (hours criterion met, no other income, no partner) are shown and the client can adjust them."], "painPoints": ["Estimates that ignore a salary from a job next to the business are far too low.", "Clients treat the estimate as the final tax and are alarmed by the difference at year end."], "dependencies": [{"type": "brick", "id": "vatv", "name": "VAT Position and Tax Reservation View", "description": "Tax reservation estimate.", "how": "Calculates the reservation from profit, deductions and brackets."}, {"type": "brick", "id": "itax", "name": "Income Tax Return (IB) Preparation", "description": "Income tax rules.", "how": "Provides the brackets and deduction logic used by the estimate."}, {"type": "brick", "id": "advk", "name": "Advice Knowledge Base and Tax Rules Content", "description": "Reservation explanation.", "how": "Links the explanation of deductions and the hours criterion."}]}, {"id": "set-the-money-aside-and-note-it", "title": "Set the money aside and note it", "actor": "Knowledge Freelancer", "keyFacts": ["The client transfers the suggested amount to d notifications on the dashboard and in the mobile app.", "media": []}, {"step": "Reserve the right amount for income tax during the year", "description": "Look at the dashboard's profit and tax reservation after each quarter and set money aside, or ask the bookkeeper to request a preliminary assessment (voorlopige aanslag) so that tax is paid monthly instead of in one lump. Decide with the bookkeeper whether an exceptionally good year justifies an investment before year-end.", "howItSupports": "Shows profit to date and the amount to reserve for VAT and income tax in real time as bookings are submitted.", "media": []}, {"step": "Reserve the right amount for income tax during the year", "description": "Look at the dashboard's profit and tax reservation after each quarter and set money aside, or ask the bookkeeper to request a preliminary assessment (voorlopige aanslag) so that tax is paid monthly instead of in one lump. Decide with the bookkeeper whether an exceptionally good year justifies an investment before year-end.", "howItSupports": "Answers reservation questions and arranges a preliminary assessment so the tax bill is spread over the year.", "media": []}, {"step": "Know the deadlines and what the bookkeeper needs", "description": "Receive reminders in the app and by e-mail before the end of each quarter listing what is still missing (receipts, unmatched transactions, an invoice not yet sent), so the review can start on time. Friction: a reminder that arrives during a shoot week or a festival is easy to ignore.", "howItSupports": "Sets the review cut-off per quarter and derives the client to-do list of missing bookings from the administration.", "media": []}]}, {"customerId": "crfr", "customerName": "Creative Freelancer", "customerGroup": "Freelancers and Sole Proprietors", "customerIcon": "customer-crfr-portrait.jpg", "productId": "client-app-dashboard", "productName": "Kees Client App and Dashboard", "productIcon": "client-app-dashboard.png", "jobId": "jtbd-crfr-3", "jobName": "Get paid faster with professional quotes and invoices", "jobWhatItIs": "Send quotes and invoices that look professional under the trading name the client knows, apply the right VAT rule for agencies, EU clients and private customers, see which invoices are open and remind clients politely, so that cash arrives sooner and the freelancer spends less time chasing money. The job is to make invoicing part of the creative workflow rather than a separate chore in Word or Excel.", "jobOutcome": "Invoices go out the day the work is delivered, the share of invoices paid within the payment term rises, overdue invoices are reminded automatically before the freelancer has to make an awkward call, and every invoice is already booked for VAT and revenue.", "supportRationale": "Shows outstanding invoices and revenue per quarter in real time.", "usedInSteps": [{"step": "See what is open and when it was paid", "description": "Watch the invoice status change to paid when the bank connection matches the incoming payment, and see days outstanding per client on the dashboard, without checking the bank app manually.", "howItSupports": "Shows outstanding invoices and revenue per quarter in real time.", "media": []}, {"step": "See what is open and when it was paid", "description": "Watch the invoice status change to paid when the bank connection matches the incoming payment, and see days outstanding per client on the dashboard, without checking the bank app manually.", "howItSupports": "Matches incoming payments to open invoices automatically so status is current without manual work.", "media": []}]}, {"customerId": "kfrl", "customerName": "Knowledge Freelancer", "customerGroup": "Freelancers and Sole Proprietors", "customerIcon": "customer-kfrl-portrait.jpg", "productId": "client-app-dashboard", "productName": "Kees Client App and Dashboard", "productIcon": "client-app-dashboard.png", "jobId": "jtbd-kfrl-1", "jobName": "Know my real profit, tax position and what to reserve at any moment", "jobWhatItIs": "See the true financial state of the business whenever a decision comes up: revenue and outstanding invoices, costs and investments, profit to date, the VAT position for the current quarter and the income tax to reserve, with the bookkeeper confirming the numbers each quarter. The job is to run the business on real figures rather than on the bank balance.", "jobOutcome": "The dashboard shows profit, VAT position and tax reservation that stay within a small margin of what the bookkeeper files and the Belastingdienst assesses, so that reservations, investments and a mortgage application can be based on the numbers on screen.", "supportRationale": "Shows revenue per quarter, costs, investments, profit and the VAT and income tax reservation in real time on web and mobile.", "usedInSteps": [{"step": "Read the tax position and reserve", "description": "Check the dashboard after each quarter: profit to date, VAT to pay, and the income tax reservation including zelfstandigenaftrek and mkb-winstvrijstelling; transfer the reserved amount to a savings account or let the bookkeeper request a preliminary assessment. Friction: reservation advice must reflect a fiscal partner's income and the shrinking zelfstandigenaftrek.", "howItSupports": "Shows revenue per quarter, costs, investments, profit and the VAT and income tax reservation in real time on web and mobile.", "media": []}]}, {"customerId": "kfrl", "customerName": "Knowledge Freelancer", "customerGroup": "Freelancers and Sole Proprietors", "customerIcon": "customer-kfrl-portrait.jpg", "productId": "client-app-dashboard", "productName": "Kees Client App and Dashboard", "productIcon": "client-app-dashboard.png", "jobId": "jtbd-kfrl-2", "jobName": "Claim every deduction and stay on the right side of the Wet DBA", "jobWhatItIs": "Make sure that the income tax return uses every deduction the freelancer is entitled to, that the evidence for the hours criterion and business use exists when the Belastingdienst asks, and that assignments are structured and documented so they do not look like sham self-employment under the Wet DBA. The job is to minimise tax legally and to keep the freelance status defensible.", "jobOutcome": "The filed income tax return includes zelfstandigenaftrek, mkb-winstvrijstelling, pension, home office and investment deductions where applicable with evidence on file, and every long assignment has been checked against the Wet DBA indicators before it starts, with no reclassification or correction afterwards.", "supportRationale": "Keeps the to-do and document view where hours evidence and business-use notes are stored next to the figures.", "usedInSteps": [{"step": "Log hours and keep evidence for the hours criterion", "description": "Keep a simple record of hours worked on the business, including acquisition and administration, to meet the 1,225-hour criterion for zelfstandigenaftrek, and keep the evidence for business use of the home office, car and phone.", "howItSupports": "Keeps the to-do and document view where hours evidence and business-use notes are stored next to the figures.", "media": []}, {"step": "Log hours and keep evidence for the hours criterion", "description": "Keep a simple record of hours worked on the business, including acquisition and administration, to meet the 1,225-hour criterion for zelfstandigenaftrek, and keep the evidence for business use of the home office, car and phone.", "howItSupports": "Stores the invoices and receipts that back each deduction in the document archive.", "media": []}]}, {"customerId": "kfrl", "customerName": "Knowledge Freelancer", "customerGroup": "Freelancers and Sole Proprietors", "customerIcon": "customer-kfrl-portrait.jpg", "productId": "client-app-dashboard", "productName": "Kees Client App and Dashboard", "productIcon": "client-app-dashboard.png", "jobId": "jtbd-kfrl-3", "jobName": "Get expert answers on big decisions (house, BV, pension) without paying per hour", "jobWhatItIs": "Get a clear, well-founded answer when a decision with fiscal consequences comes up: buying a house on freelance income, whether and when to move to a BV, choosing a pension product, taking on a fiscal partner, or taking a job next to the business. The job is access to expertise that is included in the subscription, consistent across bookkeepers, and turned into action on the same platform.", "jobOutcome": "Each big decision is answered within days with a written recommendation and the figures to back it (mortgage-ready annual accounts, a BV comparison at the client's profit level, pension options), without extra fees, and executed on the same platform, for example through Founders when a BV is set up.", "supportRationale": "Delivers the annual accounts and filed returns that a mortgage lender asks for from a self-employed applicant.", "usedInSteps": [{"step": "Get mortgage-ready figures", "description": "Ask for annual accounts of the last years and a current-year forecast in the format mortgage lenders accept for self-employed applicants, plus the filed income tax returns from the archive.", "howItSupports": "Delivers the annual accounts and filed returns that a mortgage lender asks for from a self-employed applicant.", "media": []}, {"step": "Get mortgage-ready figures", "description": "Ask for annual accounts of the last years and a current-year forecast in the format mortgage lenders accept for self-employed applicants, plus the filed income tax returns from the archive.", "howItSupports": "Provides the current-year figures and profit trend used for the forecast.", "media": []}]}, {"customerId": "strt", "customerName": "Starting Entrepreneur", "customerGroup": "Freelancers and Sole Proprietors", "customerIcon": "customer-strt-portrait.jpg", "productId": "client-app-dashboard", "productName": "Kees Client App and Dashboard", "productIcon": "client-app-dashboard.png", "jobId": "jtbd-strt-1", "jobName": "Start my business with the administration set up right from day one", "jobWhatItIs": "Go from a KVK registration to a working administration in the first weeks: VAT number, the KOR decision, a business bank account connected, trading names, invoice templates and the rules for what is business and what is private, with a bookkeeper assigned who will carry the first filings. The job is to avoid the mistakes that cost hours and money to repair later.", "jobOutcome": "Within two weeks of the intro call the starter has an active account, a connected business bank account, a recorded KOR decision, the first invoice sent from the app and the first receipts booked, and the bookkeeper has confirmed the set-up is complete for the first quarter.", "supportRationale": "Shows the starter's first revenue, costs and VAT position so the numbers make sense from week one.", "usedInSteps": [{"step": "Learn the capture habit with first upload coaching", "description": "Photograph the first receipts with Scan & Herken during the coaching session, learn which costs are business, what to do with a mixed-use phone or laptop, and how the dashboard will show revenue, costs and the VAT to pay.", "howItSupports": "Shows the starter's first revenue, costs and VAT position so the numbers make sense from week one.", "media": []}, {"step": "Learn the capture habit with first upload coaching", "description": "Photograph the first receipts with Scan & Herken during the coaching session, learn which costs are business, what to do with a mixed-use phone or laptop, and how the dashboard will show revenue, costs and the VAT to pay.", "howItSupports": "Recognises the first receipts and shows the starter how categorisation and VAT work in practice.", "media": []}]}, {"customerId": "strt", "customerName": "Starting Entrepreneur", "customerGroup": "Freelancers and Sole Proprietors", "customerIcon": "customer-strt-portrait.jpg", "productId": "client-app-dashboard", "productName": "Kees Client App and Dashboard", "productIcon": "client-app-dashboard.png", "jobId":     mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        flowchart: {
            htmlLabels: false
        }
    });

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

    function getFlows() {
        return currentStream.flows || [];
    }

    function getFlowDependencies(flow) {
        const dependencyIndex = new Map();
        (flow.steps || []).forEach(step => {
            (step.dependencies || []).forEach(dependency => {
                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());
    }

    function getStepDependency(step, dependency) {
        return (step.dependencies || []).find(item => (item.type || '') === (dependency.type || '') && (item.id || '') === (dependency.id || '')) || null;
    }

    function getPrimaryActors() {
        const streamJobs = currentStream.supportedCustomerJobs || [];
        const allJobs = streamJobs.length ? streamJobs : supported_jobs;
        return dedupe(allJobs.map(item => item.customerName || item.customerGroup || '').filter(Boolean), item => item);
    }

    function summarizeFlow(flow) {
        const steps = flow.steps || [];
        const firstStep = steps[0] || {};
        const lastStep = steps[steps.length - 1] || {};
        return {
            actor: flow.primaryActor || firstStep.actor || '',
            trigger: flow.trigger || firstStep.trigger || '',
            result: flow.successSignal || flow.outcome || lastStep.successSignal || lastStep.output || ''
        };
    }

    function renderStepMeta(label, value) {
        if (!value) {
            return '';
        }
        return '<div class="flow-step-meta-item"><div class="flow-step-meta-label">' + escapeHtml(label) + '</div><div class="flow-step-copy">' + escapeHtml(value) + '</div></div>';
    }

    function flowDependencyIconFile(dependency) {
        const dependencyId = dependency.id || '';
        const linkedBrick = related_bricks.find(brick => brick.id === dependencyId) || all_bricks.find(brick => brick.id === dependencyId) || {};
        return dependency.icon || linkedBrick.icon || (dependencyId ? dependencyId + '.png' : 'brick.png');
    }

    function renderFlowDependencyIcon(dependency, className) {
        return '<img class="' + escapeHtml(className) + '" src="../icons/' + escapeHtml(flowDependencyIconFile(dependency)) + '" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
    }

    function renderStepDependencyPills(step) {
        const dependencies = step.dependencies || [];
        if (!dependencies.length) {
            return '<div class="muted">No step-specific dependencies listed.</div>';
        }

        return '<div class="flow-step-dependencies">' + dependencies.map(dep => {
            const label = dep.name || dep.id || 'Dependency';
            const kind = 'Brick';
            return '<span class="flow-cell-brick">' + renderFlowDependencyIcon(dep, 'flow-cell-brick-icon') + '<span>' + escapeHtml(kind + ': ' + label) + '</span></span>';
        }).join('') + '</div>';
    }

    function simplifySupportCopy(value) {
        const text = String(value || '').trim();
        if (!text) {
            return '';
        }
        const simplified = text.replace(/^Supports .*? by helping users help /i, 'Facilitate ');
        return simplified;
    }
</script>

<script>
    function streamMetaPath(stream) {
        const parts = [];
        if (stream.group) {
            parts.push(stream.group);
        }
        if (stream.rootGroup && stream.rootGroup !== stream.group) {
            parts.push(stream.rootGroup);
        }
        if (!parts.length) {
            parts.push('Stream');
        }
        return parts.join(' / ');
    }

    let headerHtml = '<div class="nav-strip">';
    allStreams.forEach(item => {
        headerHtml += '<a class="nav-link" href="' + escapeHtml(item.id) + '.html">';
        headerHtml += '<img src="../icons/' + escapeHtml(item.icon || 'stream.png') + '" class="' + (item.id === currentStream.id ? 'tab-image-selected' : 'tab-image') + '" alt="" onerror="this.onerror=null;this.src=\'../icons/stream.png\'">';
        headerHtml += '</a>';
    });
    headerHtml += '</div>';

    headerHtml += '<div class="page">';
    headerHtml += '<div class="header">';
    headerHtml += '<img class="header-icon" src="../icons/' + escapeHtml(currentStream.icon || 'stream.png') + '" alt="" onerror="this.onerror=null;this.src=\'../icons/stream.png\'">';
    headerHtml += '<div>';
    headerHtml += '<div class="header-meta">';
    headerHtml += '<div class="page-type-badge">Stream</div>';
    headerHtml += escapeHtml(streamMetaPath(currentStream)) + ' / <span style="color:blue;font-weight:bold;">' + escapeHtml((currentStream.id || '').toUpperCase()) + '</span></div>';
    headerHtml += '<div class="header-title">' + escapeHtml(currentStream.name || currentStream.id) + '</div>';
    headerHtml += '<div class="header-copy">' + escapeHtml(currentStream.description || '') + '</div>';
    headerHtml += '</div></div></div>';
    document.getElementById('Header').innerHTML = headerHtml;

    function renderHome() {
        const flows = getFlows();
        const totalSteps = flows.reduce((count, flow) => count + ((flow.steps || []).length), 0);
        const primaryActors = getPrimaryActors();
        let html = '';

        html += '<div class="group"><div class="section-title">Flow Narratives (' + flows.length + ')</div>';
        if (!flows.length) {
            html += '<div class="muted">No flows listed for this stream.</div>';
        } else {
            html += '<div class="card-grid">';
            flows.forEach(flow => {
                const summary = summarizeFlow(flow);
                html += '<div class="card">';
                html += '<div class="card-meta">' + escapeHtml(streamMetaPath(currentStream)) + '</div>';
                html += '<div class="card-title">' + escapeHtml(flow.title || flow.id) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(flow.description || '') + '</div>';
                html += '<div class="muted">' + ((flow.steps || []).length) + ' steps</div>';
                if (summary.actor) {
                    html += '<div class="card-copy"><strong>Actor:</strong> ' + escapeHtml(summary.actor) + '</div>';
                }
                if (summary.trigger) {
                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Outcomes</div>';
        if (!(currentStream.outcomes || []).length) {
            html += '<div class="muted">No outcomes listed for this stream.</div>';
        } else {
            html += '<div class="card"><ul class="list">' + currentStream.outcomes.map(outcome => '<li>' + escapeHtml(outcome) + '</li>').join('') + '</ul></div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Supporting Product Bricks</div>';
        if (!related_bricks.length) {
            html += '<div class="muted">No linked product bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            related_bricks.forEach(brick => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../landing_pages/' + escapeHtml(brick.id) + '.html">';
                html += '<div class="card-meta">' + escapeHtml((brick.group || brick.domain || 'Product Brick')) + '</div>';
                html += '<div class="card-header">';
                html += '<img class="card-icon" src="../icons/' + escapeHtml(brick.id) + '.png" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
                html += '<div class="card-title">' + escapeHtml(brick.name || brick.id) + '</div>';
                html += '</div>';
                html += '<div class="card-copy">' + escapeHtml(brick.description || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Linked Products</div>';
        if (!linked_products.length) {
            html += '<div class="muted">No linked products were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            linked_products.forEach(product => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../../product-deployments/landing_pages/' + escapeHtml(product.id) + '.html">';
                html += '<div class="card-meta">' + escapeHtml(product.type || 'Product') + '</div>';
                html += '<div class="card-header">';
                html += '<img class="card-icon" src="../../product-deployments/icons/' + escapeHtml(product.icon) + '" alt="" onerror="this.onerror=null;this.src=\'../../product-deployments/icons/product.png\'">';
                html += '<div class="card-title">' + escapeHtml(product.name || product.id) + '</div>';
                html += '</div>';
                html += '<div class="card-copy">' + escapeHtml(product.whyUsed || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Related Teams</div>';
        if (!related_teams.length) {
            html += '<div class="muted">No teams were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            related_teams.forEach(team => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../../teams/landing_pages/' + escapeHtml(team.teamId) + '.html">';
                html += '<div class="card-meta">' + escapeHtml(team.roleLabel || team.teamType || 'Team') + '</div>';
                html += '<div class="card-title">' + escapeHtml(team.teamName || team.teamId) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(team.groupName || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Supported Customer Jobs</div>';
        if (!supported_jobs.length) {
            html += '<div class="muted">No customer jobs were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            supported_jobs.forEach(job => {
                html += '<div class="card">';
                html += '<div class="card-meta">' + escapeHtml(job.customerGroup || '') + (job.productName ? ' | ' + escapeHtml(job.productName) : '') + '</div>';
                html += '<div class="card-title">' + escapeHtml(job.jobName || job.jobId) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(job.jobOutcome || job.jobWhatItIs || '') + '</div>';
                if (job.supportRationale) {
                    html += '<div class="card-copy"><strong>Why this stream matters here:</strong> ' + escapeHtml(job.supportRationale) + '</div>';
                }
                if ((job.usedInSteps || []).length) {
                    html += '<ul class="list">' + job.usedInSteps.map(step => '<li>' + escapeHtml(step.step || step.description || '') + '</li>').join('') + '</ul>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        html += '</div>';

        document.getElementById('tab_content_home').innerHTML = html;
    }

    function renderFlows() {
        const flows = getFlows();
        const totalSteps = flows.reduce((count, flow) => count + ((flow.steps || []).length), 0);
        let html = '';

        document.getElementById('tab_flows').innerHTML = 'Flow Narratives (' + flows.length + ')';

        flows.forEach(flow => {
            const dependenciesInFlow = getFlowDependencies(flow);
            const summary = summarizeFlow(flow);
            html += '<div class="group">';
            html += '<div class="section-title">Flow</div>';
            html += '<div class="flow-title">' + escapeHtml(flow.title || flow.id) + '</div>';
            html += '<div class="flow-description">' + escapeHtml(flow.description || '') + '</div>';
            if (summary.actor || summary.trigger || summary.result) {
                html += '<div class="card" style="margin-bottom:16px;">';
                if (summary.actor) {
                    html += '<div class="card-copy"><strong>Primary actor:</strong> ' + escapeHtml(summary.actor) + '</div>';
                }
                if (summary.trigger) {
                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';
                }
                html += '</div>';
            }

            html += '<div class="section-title">Dependency Traceability</div>';
            html += '<div class="flow-matrix-wrap">';
            html += '<table class="flow-matrix">';
            html += '<thead>';
            html += '<tr><th class="flow-dependency-col"></th>';
            (flow.steps || []).forEach((step, index) => {
                html += '<th class="flow-step-col"><div class="flow-step-label">Step ' + (index + 1) + '</div><div class="card-title">' + escapeHtml(step.title || step.id) + '</div></th>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right">Key Facts</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkblue">';
                if ((step.keyFacts || []).length) {
                    html += '<ul class="flow-insight-list">' + step.keyFacts.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No key facts listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right; color: darkred">Pain Points</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkred">';
                if ((step.painPoints || []).length) {
                    html += '<ul class="flow-insight-list">' + step.painPoints.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No pain points listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';
            html += '</thead><tbody>';

            dependenciesInFlow.forEach(dependency => {
                const dependencyTypeLabel = 'Product Brick';
                html += '<tr>';
                html += '<td>';
                html += '<div class="flow-dependency-header">';
                html += renderFlowDependencyIcon(dependency, 'flow-dependency-icon');
                html += '<div>';
                html += '<a class="flow-dependency-name" href="../landing_pages/' + escapeHtml(dependency.id) + '.html">' + escapeHtml(dependency.name || dependency.id) + '</a>';
                if (dependency.interface) {
                    html += '<div class="muted">' + escapeHtml(dependency.interface) + '</div>';
                }
                html += '</div>';
                html += '</div>';
                html += '</td>';
                (flow.steps || []).forEach(step => {
                    const stepDependency = getStepDependency(step, dependency);
                    if (!stepDependency) {
                        html += '<td class="flow-cell-empty">-</td>';
                        return;
                    }
                    html += '<td class="flow-cell-active">';
                    html += '<div class="flow-cell-copy">' + escapeHtml(simplifySupportCopy(stepDependency.how || stepDependency.description || 'Supports this step.')) + '</div>';
                    html += '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            html += '</div>';
            html += '</div>';
        });

        document.getElementById('tab_content_flows').innerHTML = html;
    }

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';
        }
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-title">' + escapeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                count++;
                html += '<div class="link-entry">';
                html += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(link.link || '#') + '">'
                    + escapeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>

        container.innerHTML = '';

        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';

                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });

        html += '</div>';

    }
