    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

invoice", "title": "Generate and send the monthly subscription invoice", "actor": "Client Success and Sales Executive", "keyFacts": ["The invoice with plan fee, add-ons and VAT is generated, sent by e-mail and stored in the client's document archive; it is also booked automatically as a cost in the client's own administration.", "Clients see the invoice and the payment status in the app."], "painPoints": ["Subscription invoices that are not booked automatically are forgotten as a deductible cost.", "Invoices sent to an old e-mail address go unpaid without anyone noticing."], "dependencies": [{"type": "brick", "id": "subs", "name": "Subscription Plans, Billing and Cancellation", "description": "Invoice generation.", "how": "Creates and sends the invoice and books it into the client's administration."}, {"type": "brick", "id": "ntfy", "name": "Deadlines, To-dos and Notifications", "description": "Invoice notification.", "how": "Notifies the client that the monthly invoice is available."}]}, {"id": "collect-payment-by-direct-debit", "title": "Collect payment by direct debit or payment link", "actor": "Client Success and Sales Executive", "keyFacts": ["Payment is collected by SEPA direct debit or an iDEAL payment link through the payment provider; the payment status flows back to the subscription.", "Clients with a bank connection see the debit matched automatically against the subscription invoice in their own administration."], "painPoints": ["Failed direct debits at the start of the month cluster around clients with irregular income.", "Payment status that arrives with delay makes client success chase clients who have already paid."], "dependencies": [{"type": "brick", "id": "intg", "name": "Integration and API Gateway (Ponto, Belastingdienst, KVK, e-mail, payments)", "description": "Payment provider connection.", "how": "Sends the collection request and receives the payment status webhook."}, {"type": "brick", "id": "subs", "name": "Subscription Plans, Billing and Cancellation", "description": "Payment status.", "how": "Records the payment against the invoice."}]}, {"id": "follow-up-failed-collections", "title": "Follow up failed collections and disputes", "actor": "Client Success and Sales Executive", "keyFacts": ["Failed collections are retried and, if still unpaid, client success contacts the client personally before any service restriction; disputes are handled with the invoice detail at hand.", "Every reminder and contact is logged so the bookkeeper knows when a client is in arrears."], "painPoints": ["Automated dunning for a fixed-fee service damages the personal relationship the bookkeeper has built.", "Bookkeepers who are unaware of arrears keep filing for clients whose subscription is about to be suspended."], "dependencies": [{"type": "brick", "id": "subs", "name": "Subscription Plans, Billing and Cancellation", "description": "Dunning status.", "how": "Tracks retries, reminders and arrears."}, {"type": "brick", "id": "msgc", "name": "Client Messaging, E-mail and Call Log", "description": "Personal follow-up.", "how": "Logs the client success contact about the unpaid invoice."}, {"type": "brick", "id": "audt", "name": "Audit Trail, AVG Compliance and Retention", "description": "Billing audit trail.", "how": "Records who changed subscription status and why."}]}]}, {"id": "change-a-plan-or-cancel-a-subscription", "title": "Change a Plan or Cancel a Subscription", "description": "A client changes legal form or add-ons, or wants to cancel: the request is checked against the first-fiscal-year and one-calendar-month rules, the new plan takes effect on the right date and the bookkeeper is kept in the loop.", "primaryActor": "Client Success and Sales Executive", "trigger": "A client asks to add a partner, connect a bank account, start payroll, move to a BV, or cancel.", "successSignal": "The plan change or cancellation is recorded with the effective date, the next invoice reflects it, the bookkeeper is informed and the reason is captured for retention analysis.", "steps": [{"id": "receive-the-change-or-cancellation-request", "title": "Receive the change or cancellation request", "actor": "Knowledge Freelancer", "keyFacts": ["Clients ask by e-mail, phone or through their bookkeeper; the request records the type (add-on, extra partner, legal form change, cancellation) and the reason.", "Cancellations are common when a freelancer takes a job, stops the business or moves to a BV; each is a different follow-up."], "painPoints": ["Requests made to the bookkeeper by phone are not always passed on to client success.", "Clients who cancel because of one bad experience were never asked what went wrong."], "dependencies": [{"type": "brick", "id": "msgc", "name": "Client Messaging, E-mail and Call Log", "description": "Request capture.", "how": "Logs the request and the reason on the client file."}, {"type": "brick", "id": "subs", "name": "Subscription Plans, Billing and Cancellation", "description": "Change request.", "how": "Opens the change or cancellation case."}]}, {"id": "check-the-commitment-and-notice-rules", "title": "Check the first-fiscal-year commitment and notice period", "actor": "Client Success and Sales Executive", "keyFacts": ["The first year is a full fiscal year; afterwards cancellation is possible monthly with one calendar month notice, so the effective date is computed from the request date.", "The client is told what Kees still files (for example the income tax return of the last active year) and what happens to their data and archive after cancellation."], "painPoints": ["Clients who cancel in November expect the income tax return for that year to be included.", "Notice-period rules applied differently by different executives undermine trust."], "dependencies": [{"type": "brick", "id": "subs", "name": "Subscription Plans, Billing and Cancellation", "description": "Rule check.", "how": "Computes the earliest effective date from the commitment and notice rules."}, {"type": "brick", "id": "audt", "name": "Audit Trail, AVG Compliance and Retention", "description": "Rule evidence.", "how": "Records the rule applied and the communicated effective date."}]}, {"id": "apply-the-plan-change-with-effective-date", "title": "Apply the plan change with the effective date", "actor": "Client Success and Sales Executive", "keyFacts": ["An extra VOF partner adds \u20ac100 per year, a bank account adds \u20ac5 per month, payroll adds \u20ac17.50 per payslip; an eenmanszaak that becomes a BV moves to a Founders package at \u20ac1,750 or \u20ac2,450.", "The change is effective on the agreed date and the next invoice shows the new lines."], "painPoints": ["A BV transition applied to the subscription before the BV is registered at KVK invoices a company that does not exist yet.", "Add-ons activated by the client in the app without the subscription knowing about them go unbilled."], "dependencies": [{"type": "brick", "id": "subs", "name": "Subscription Plans, Billing and Cancellation", "description": "Plan update.", "how": "Applies the new plan, add-ons and effective date."}, {"type": "brick", "id": "bank", "name": "Bank Connection (Ponto PSD2)", "description": "Bank add-on activation.", "how": "Activates or deactivates the bank connection add-on."}, {"type": "brick", "id": "payr", "name": "Payroll and Payslips", "description": "Payroll add-on activation.", "how": "Activates payroll for the client."}]}, {"id": "inform-the-bookkeeper-and-update-deadlines", "title": "Inform the bookkeeper and update the filing obligations", "actor": "Client Success and Sales Executive", "keyFacts": ["The bookkeeper is informed of the change so the review, the VAT cycle and the year-end reflect the new situation; for a BV the file moves to a Founders bookkeeper.", "For cancellations the bookkeeper knows which last filings Kees still owes."], "painPoints": ["Bookkeepers who learn of a cancellation from the client keep working on a file that is closing.", "A VOF partner added without the bookkeeper knowing has no capital account at year end."], "dependencies": [{"type": "brick", "id": "msgc", "name": "Client Messaging, E-mail and Call Log", "description": "Bookkeeper notification.", "how": "Informs the bookkeeper and logs the change on the client file."}, {"type": "brick", "id": "onbd", "name": "Onboarding, Fit Check and Bookkeeper Matching", "description": "Re-onboarding case.", "how": "Opens a case when the change requires a new package or a Founders hand-over."}]}, {"id": "confirm-to-the-client-and-log-the-reason", "title": "Confirm to the client and log the reason for retention analysis", "actor": "Client Success and Sales Executive", "keyFacts": ["The client receives a written confirmation of the change or cancellation with the effective date and the last invoice; the reason is coded (job, stopped business, price, service, BV, other).", "Cancelled clients are given an export of their archive and documents before access closes and are asked for a review or a client story if they leave on good terms."], "painPoints": ["Unconfirmed cancellations lead to one more direct debit and an angry review.", "Reasons coded as 'other' make churn analysis useless."], "dependencies": [{"type": "brick", "id": "subs", "name": "Subscription Plans, Billing and Cancellation", "description": "Confirmation and reason code.", "how": "Sends the confirmation and stores the coded reason."}, {"type": "brick", "id": "ntfy", "name": "Deadlines, To-dos and Notifications", "description": "Client confirmation.", "how": "Notifies the client in the app and by e-mail."}, {"type": "brick", "id": "audt", "name": "Audit Trail, AVG Compliance and Retention", "description": "Retention of archive access.", "how": "Keeps the archive readable for the fiscal retention period after cancellation."}]}]}], "outcomes": ["Every client is invoiced the right monthly amount for their plan and add-ons with no surprise bills, ever", "Plan changes (extra partner, bank account, payroll, BV) tak     mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        flowchart: {
            htmlLabels: false
        }
    });

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

    function getFlows() {
        return currentStream.flows || [];
    }

    function getFlowDependencies(flow) {
        const dependencyIndex = new Map();
        (flow.steps || []).forEach(step => {
            (step.dependencies || []).forEach(dependency => {
                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());
    }

    function getStepDependency(step, dependency) {
        return (step.dependencies || []).find(item => (item.type || '') === (dependency.type || '') && (item.id || '') === (dependency.id || '')) || null;
    }

    function getPrimaryActors() {
        const streamJobs = currentStream.supportedCustomerJobs || [];
        const allJobs = streamJobs.length ? streamJobs : supported_jobs;
        return dedupe(allJobs.map(item => item.customerName || item.customerGroup || '').filter(Boolean), item => item);
    }

    function summarizeFlow(flow) {
        const steps = flow.steps || [];
        const firstStep = steps[0] || {};
        const lastStep = steps[steps.length - 1] || {};
        return {
            actor: flow.primaryActor || firstStep.actor || '',
            trigger: flow.trigger || firstStep.trigger || '',
            result: flow.successSignal || flow.outcome || lastStep.successSignal || lastStep.output || ''
        };
    }

    function renderStepMeta(label, value) {
        if (!value) {
            return '';
        }
        return '<div class="flow-step-meta-item"><div class="flow-step-meta-label">' + escapeHtml(label) + '</div><div class="flow-step-copy">' + escapeHtml(value) + '</div></div>';
    }

    function flowDependencyIconFile(dependency) {
        const dependencyId = dependency.id || '';
        const linkedBrick = related_bricks.find(brick => brick.id === dependencyId) || all_bricks.find(brick => brick.id === dependencyId) || {};
        return dependency.icon || linkedBrick.icon || (dependencyId ? dependencyId + '.png' : 'brick.png');
    }

    function renderFlowDependencyIcon(dependency, className) {
        return '<img class="' + escapeHtml(className) + '" src="../icons/' + escapeHtml(flowDependencyIconFile(dependency)) + '" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
    }

    function renderStepDependencyPills(step) {
        const dependencies = step.dependencies || [];
        if (!dependencies.length) {
            return '<div class="muted">No step-specific dependencies listed.</div>';
        }

        return '<div class="flow-step-dependencies">' + dependencies.map(dep => {
            const label = dep.name || dep.id || 'Dependency';
            const kind = 'Brick';
            return '<span class="flow-cell-brick">' + renderFlowDependencyIcon(dep, 'flow-cell-brick-icon') + '<span>' + escapeHtml(kind + ': ' + label) + '</span></span>';
        }).join('') + '</div>';
    }

    function simplifySupportCopy(value) {
        const text = String(value || '').trim();
        if (!text) {
            return '';
        }
        const simplified = text.replace(/^Supports .*? by helping users help /i, 'Facilitate ');
        return simplified;
    }

            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkred">';
                if ((step.painPoints || []).length) {
                    html += '<ul class="flow-insight-list">' + step.painPoints.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No pain points listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';
            html += '</thead><tbody>';

            dependenciesInFlow.forEach(dependency => {
                const dependencyTypeLabel = 'Product Brick';
                html += '<tr>';
                html += '<td>';
                html += '<div class="flow-dependency-header">';
                html += renderFlowDependencyIcon(dependency, 'flow-dependency-icon');
                html += '<div>';
                html += '<a class="flow-dependency-name" href="../landing_pages/' + escapeHtml(dependency.id) + '.html">' + escapeHtml(dependency.name || dependency.id) + '</a>';
                if (dependency.interface) {
                    html += '<div class="muted">' + escapeHtml(dependency.interface) + '</div>';
                }
                html += '</div>';
                html += '</div>';
                html += '</td>';
                (flow.steps || []).forEach(step => {
                    const stepDependency = getStepDependency(step, dependency);
                    if (!stepDependency) {
                        html += '<td class="flow-cell-empty">-</td>';
                        return;
                    }
                    html += '<td class="flow-cell-active">';
                    html += '<div class="flow-cell-copy">' + escapeHtml(simplifySupportCopy(stepDependency.how || stepDependency.description || 'Supports this step.')) + '</div>';
                    html += '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            html += '</div>';
            html += '</div>';
        });

        document.getElementById('tab_content_flows').innerHTML = html;
    }

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';
        }
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-title">' + escapeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                count++;
                html += '<div class="link-entry">';
                html += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(link.link || '#') + '">'
                    + escapeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>


<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Freelancer Bookkeeping Service Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Streams Index"
    },
    {
      "label": "Manage Subscription Billing and Plans"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
