    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

and different fiscal partners."], "painPoints": ["The hours criterion is assessed per partner, which a shared hours log does not prove.", "Partners expect identical returns and question the differences."], "dependencies": [{"type": "brick", "id": "itax", "name": "Income Tax Return (IB) Preparation", "description": "Per-partner returns.", "how": "Prepares a return per partner from their profit share."}, {"type": "brick", "id": "bkws", "name": "Bookkeeper Client File and Review Queue", "description": "Partner files.", "how": "Keeps each partner's personal data on their own sub-file."}]}, {"id": "check-and-approve-per-partner", "title": "Four-eyes check and approve per partner", "actor": "VOF Partner", "keyFacts": ["A colleague checks the VOF accounts and both returns; each partner approves their own return with their own login.", "Approvals are recorded per partner."], "painPoints": ["One partner approving on behalf of the other is invalid and a source of later disputes.", "Checks on VOFs take longer than on sole proprietors and are under-planned in the season."], "dependencies": [{"type": "brick", "id": "qaud", "name": "Quality Assurance and Four-eyes Checks", "description": "VOF check.", "how": "Records the second check on the VOF accounts and returns."}, {"type": "brick", "id": "iden", "name": "Identity, Login and Access Control", "description": "Per-partner approval.", "how": "Ensures each partner approves with their own login."}]}, {"id": "file-and-explain-per-partner", "title": "File the returns and explain the outcome per partner", "actor": "Personal Bookkeeper", "keyFacts": ["Both returns are filed through the official channel with acknowledgements; each partner receives their own explanation and the amount to pay or receive.", "The VOF annual accounts are archived with the returns."], "painPoints": ["Partners who receive one joint message misread the other's figures as their own.", "Filing one partner's return before the other's approval creates inconsistency porate on the advice of a peer without checking whether the profit level justifies it.", "Advice given without documenting the assumptions cannot be revisited when the profit changes."], "dependencies": [{"type": "brick", "id": "advk", "name": "Advice Knowledge Base and Tax Rules Content", "description": "BV decision guidance.", "how": "Provides the comparison framework and current rates."}, {"type": "brick", "id": "msgc", "name": "Client Messaging, E-mail and Call Log", "description": "Advice log.", "how": "Records the advice and the client's decision."}]}, {"id": "set-up-the-bv-on-founders", "title": "Set up the BV on a Founders package with the history retained", "actor": "Client Success and Sales Executive", "keyFacts": ["After incorporation and KVK registration the holding (\u20ac1,750 per year) and werkmaatschappij (\u20ac2,450 per year) are set up as new administrations linked to the client, with the eenmanszaak administration closed at the transfer date and kept in the archive.", "The client keeps the same login and, where possible, the same bookkeeper or a Founders colleague introduced personally."], "painPoints": ["A BV set up before the KVK registration has no company data to file with.", "Clients who lose their bookkeeper in the transition feel they started over."], "dependencies": [{"type": "brick", "id": "onbd", "name": "Onboarding, Fit Check and Bookkeeper Matching", "description": "BV onboarding case.", "how": "Records the incorporation, the packages and the hand-over to Founders."}, {"type": "brick", "id": "kvkf", "name": "KVK Filing and Company Data", "description": "Company data from KVK.", "how": "Retrieves the BV's registration data and links the entities."}, {"type": "brick", "id": "subs", "name": "Subscription Plans, Billing and Cancellation", "description": "Founders packages.", "how": "Moves the subscription to the holding and werkmaatschappij plans."}]}, {"id": "start-dga-salary-through-payroll", "title": "Start the DGA salary through payroll", "actor": "BV Director-Major Shareholder (DGA)", "keyFacts": ["The DGA salary is set with regard to the customary-wage rules, payslips are produced monthly at \u20ac17.50 per payslip and the wage tax return is filed.", "The salary and dividend policy are noted on the file for the year-end."], "painPoints": ["DGAs who pay themselves irregularly without payslips create a wage tax problem.", "The customary-wage discussion with the Belastingdienst is unfamiliar to former sole proprietors."], "dependencies": [{"type": "brick", "id": "payr", "name": "Payroll and Payslips", "description": "DGA payroll.", "how": "Produces the DGA payslips and the wage tax filing."}, {"type": "brick", "id": "advk", "name": "Advice Knowledge Base and Tax Rules Content", "description": "Customary wage rules.", "how": "Provides the customary-wage guidance."}]}, {"id": "run-the-bv-administration-through-the-year", "title": "Run the BV administration and intercompany bookings through the year", "actor": "BV Director-Major Shareholder (DGA)", "keyFacts": ["The werkmaatschappij invoices customers, the holding invoices management fees, and intercompany balances, the DGA current account and dividends are booked correctly; VAT returns run quarterly as for any client.", "The Founders bookkeeper reviews both administrations together."], "painPoints": ["Private expenses paid from the BV build up a DGA current account that surprises at year end.", "Management fees without an agreement raise questions in a check."], "dependencies": [{"type": "brick", "id": "ledg", "name": "General Ledger and Booking Rules", "description": "BV and intercompany bookings.", "how": "Books management fees, current account and dividends."}, {"type": "brick", "id": "bkws", "name": "Bookkeeper Client File and Review Queue", "description": "Linked BV files.", "how": "Reviews the holding and the werkmaatschappij together."}]}, {"id": "close-the-bv-year-and-prepare-the-corporate-tax-return", "title": "Close the BV year and prepare the corporate tax return", "actor": "Personal Bookkeeper", "keyFacts": ["The year-end close produces the statutory annual accounts for each BV and the corporate tax return with the participation exemption between holding and werkmaatschappij applied.", "A four-eyes check is standard for BV files."], "painPoints": ["The participation exemption and intercompany eliminations are error-prone for bookkeepers trained on sole proprietors.", "Corporate tax returns prepared late push the KVK filing past its deadline."], "dependencies": [{"type": "brick", "id": "yend", "name": "Year-end Close and Annual Accounts", "description": "BV year-end close.", "how": "Closes the BV year and produces the statutory accounts."}, {"type": "brick", "id": "ctax", "name": "Corporate Tax (VPB) and BV Statutory Accounts", "description": "Corporate tax return.", "how": "Prepares the vennootschapsbelasting return."}, {"type": "brick", "id": "qaud", "name": "Quality Assurance and Four-eyes Checks", "description": "BV four-eyes check.", "how": "Records the check on the BV file."}]}, {"id": "file-the-corporate-tax-return-and-deposit-accounts-at-kvk", "title": "File the corporate tax return and deposit the annual accounts at KVK", "actor": "Personal Bookkeeper", "keyFacts": ["The corporate tax return is filed through the official channel, the statutory annual accounts are adopted by the shareholder and deposited at KVK within the legal deadlines, and the DGA receives the explanation and the dividend advice.", "Acknowledgements and the filed accounts are archived on both BV files."], "painPoints": ["Accounts not deposited in time expose the director to liability risk.", "Adoption by the shareholder is a formality DGAs forget until asked."], "dependencies": [{"type": "brick", "id": "bdgw", "name": "Belastingdienst Filing Gateway", "description": "Corporate tax submission.", "how": "Submits the corporate tax return and stores the acknowledgement."}, {"type": "brick", "id": "kvkf", "name": "KVK Filing  {"customerId": "bvdg", "customerName": "BV Director-Major Shareholder (DGA)", "customerGroup": "Partnerships and Companies", "customerIcon": "customer-bvdg-portrait.jpg", "productId": "salarisadministratie", "productName": "Payroll Administration", "productIcon": "salarisadministratie.png", "jobId": "jtbd-bvdg-1", "jobName": "Keep my BV compliant (corporate tax, annual accounts, KVK filing) at a fixed fee", "jobWhatItIs": "Meet every obligation of a besloten vennootschap without an accountant charging by the hour: quarterly VAT for the operating company, statutory annual accounts prepared, adopted by the shareholders and deposited with the KVK within the legal term, the corporate tax (VPB) return filed for each BV, and the provisional assessments handled, all for the fixed Founders fee per entity (holding BV EUR 1,750, werkmaatschappij EUR 2,450, ex VAT per year, invoiced monthly). The job is to be a compliant company owner while spending the DGA's time on the business, not on statutory paperwork.", "jobOutcome": "For every BV the DGA owns, the VAT returns, statutory annual accounts, KVK deposit and corporate tax return are completed before their deadlines by the Founders bookkeeper, at a cost known at the start of the year, with no late-filing penalty, no estimated assessment and no surprise invoice.", "supportRationale": "Prepares the statutory annual accounts per BV in the required format, consolidating the intercompany positions between holding and operating company.", "usedInSteps": [{"step": "Get the statutory annual accounts prepared and adopted", "description": "After the fourth quarter, answer the bookkeeper's year-end questions (work in progress, receivables, loans between holding and operating company, the current account with the DGA), review the draft annual accounts for each BV and adopt them in the general meeting of shareholders, usually the DGA alone, within the statutory term.", "howItSupports": "Prepares the statutory annual accounts per BV in the required format, consolidating the intercompany positions between holding and operating company.", "media": []}, {"step": "Get the statutory annual accounts prepared and adopted", "description": "After the fourth quarter, answer the bookkeeper's year-end questions (work in progress, receivables, loans between holding and operating company, the current account with the DGA), review the draft annual accounts for each BV and adopt them in the general meeting of shareholders, usually the DGA alone, within the statutory term.", "howItSupports": "Supplies the closed ledger, depreciation and provisions from which the annual accounts and the corporate tax computation are built.", "media": []}, {"step": "File the corporate tax return and deposit the accounts at KVK", "description": "Let the Founders bookkeeper prepare and file the VPB return for each BV, including the participation exemption for dividends received by the holding, and deposit the adopted annual accounts with the KVK within eight days of adoption and at the latest twelve months after year-end.", "howItSupports": "Files the corporate tax return with the Belastingdienst and deposits the annual accounts with the KVK through the official channels, with copies archived in the client file.", "media": []}]}, {"customerId": "bvdg", "customerName": "BV Director-Major Shareholder (DGA)", "customerGroup": "Partnerships and Companies", "customerIcon": "customer-bvdg-portrait.jpg", "productId": "salarisadministratie", "productName": "Payroll Administration", "productIcon": "salarisadministratie.png", "jobId": "jtbd-bvdg-2", "jobName": "Pay myself correctly as DGA (salary, dividend, holding structure)", "jobWhatItIs": "Take money out of the company in the right form and the right order: a DGA salary that meets the customary-wage rules (gebruikelijk loon) and runs through payroll with wage tax, a management fee between the operating company and the holding, dividends from the holding when the profit and the balance sheet allow it with the dividend tax and box 2 consequences understood, and a current account with the DGA that does not drift into an undeclared loan. The job is to optimise the DGA's net income within the rules without becoming a tax specialist.", "jobOutcome": "The DGA salary is set and paid monthly through payroll with the wage tax filed, dividend decisions are made with the bookkeeper before year-end with the balance-sheet test and the box 2 tax known, intercompany positions and the DGA current account are reconciled every quarter, and the DGA's private income tax return is filed on time with the box 2 income correct.", "supportRationale": "Prepares the dividend resolution, the dividend tax return and the corresponding entries in both BVs.", "usedInSteps": [{"step": "Decide on dividend from the holding", "description": "Before year-end, review with the bookkeeper the distributable reserves and the balance-sheet and liquidity tests, decide whether to pay a dividend from the operating company to the holding (participation exemption) and from the holding to the DGA in private (dividend tax and box 2), and record the shareholders' resolution.", "howItSupports": "Prepares the dividend resolution, the dividend tax return and the corresponding entries in both BVs.", "media": []}, {"step": "Keep the holding and operating company in step", "description": "Book the management fee and any loans between the two BVs consistently in both ledgers, reconcile the DGA current account every quarter so private expenses paid by the company are settled or documented as a loan with interest, and avoid the excessive-borrowing rules for DGAs.", "howItSupports": "Mirrors intercompany bookings between holding and operating company and tracks the DGA current account against the borrowing threshold.", "media": []}, {"step": "Keep the holding and operating company in step", "description": "Book the management fee and any loans between the two BVs consistently in both ledgers, reconcile the DGA current account every quarter so private expenses paid by the company are settled or documented as a loan with interest, and avoid the excessive-borrowing rules for DGAs.", "howItSupports": "Matches the transfers between the BVs' accounts and the DGA's private account so intercompany and current-account positions stay reconciled.", "media": []}]}, {"customerId": "bvdg", "customerName": "BV Director-Major Shareholder (DGA)", "customerGroup": "Partnerships and Companies", "customerIcon": "customer-bvdg-portrait.jpg", "productId": "salarisadministratie", "productName": "Payroll Administration", "productIcon": "salarisadministratie.png", "jobId": "jtbd-bvdg-3", "jobName": "Move from sole proprietorship to BV without losing my bookkeeper", "jobWhatItIs": "Convert a successful eenmanszaak or VOF into a BV structure (usually a holding plus a werkmaatschappij) at the right moment, for the right reasons (profit level, liability, pension, selling the business one day), and carry the administration, the bank connection, the invoicing and the personal relationship with the bookkeeper across from Kees de Boekhouder to its sister company Founders without a gap in filings. The job is to grow into a company without starting over with an unknown accountant.", "jobOutcome": "The decision to incorporate is taken on a clear comparison of tax, cost and risk, the sole proprietorship's last year is closed and its final income tax return filed by the same organisation, the BVs are set up in Founders with the history and bank connections in place on day one, and the first DGA payroll and the first corporate year run without a missed filing.", "supportRationale": "Closes the sole proprietorship's final year and files its last income tax return with the cessation handled.", "usedInSteps": [{"step": "Close the sole proprietorship's last year and hand over", "description": "Let the Kees bookkeeper close the final year of the eenmanszaak, deal with the closing balance (assets, stock, goodwill going     mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        flowchart: {
            htmlLabels: false
        }
    });

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

    function getFlows() {
        return currentStream.flows || [];
    }

    function getFlowDependencies(flow) {
        const dependencyIndex = new Map();
        (flow.steps || []).forEach(step => {
            (step.dependencies || []).forEach(dependency => {
                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());
    }

    function getStepDependency(step, dependency) {
        return (step.dependencies || []).find(item => (item.type || '') === (dependency.type || '') && (item.id || '') === (dependency.id || '')) || null;
    }

    function getPrimaryActors() {
        const streamJobs = currentStream.supportedCustomerJobs || [];
        const allJobs = streamJobs.length ? streamJobs : supported_jobs;
        return dedupe(allJobs.map(item => item.customerName || item.customerGroup || '').filter(Boolean), item => item);
    }

    function summarizeFlow(flow) {
        const steps = flow.steps || [];
        const firstStep = steps[0] || {};
        const lastStep = steps[steps.length - 1] || {};
        return {
            actor: flow.primaryActor || firstStep.actor || '',
            trigger: flow.trigger || firstStep.trigger || '',
            result: flow.successSignal || flow.outcome || lastStep.successSignal || lastStep.output || ''
        };
    }

    function renderStepMeta(label, value) {
        if (!value) {
            return '';
        }
        return '<div class="flow-step-meta-item"><div class="flow-step-meta-label">' + escapeHtml(label) + '</div><div class="flow-step-copy">' + escapeHtml(value) + '</div></div>';
    }

    function flowDependencyIconFile(dependency) {
        const dependencyId = dependency.id || '';
        const linkedBrick = related_bricks.find(brick => brick.id === dependencyId) || all_bricks.find(brick => brick.id === dependencyId) || {};
        return dependency.icon || linkedBrick.icon || (dependencyId ? dependencyId + '.png' : 'brick.png');
    }

    function renderFlowDependencyIcon(dependency, className) {
        return '<img class="' + escapeHtml(className) + '" src="../icons/' + escapeHtml(flowDependencyIconFile(dependency)) + '" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
    }

    function renderStepDependencyPills(step) {
        const dependencies = step.dependencies || [];
        if (!dependencies.length) {
            return '<div class="muted">No step-specific dependencies listed.</div>';
        }

        return '<div class="flow-step-dependencies">' + dependencies.map(dep => {
            const label = dep.name || dep.id || 'Dependency';
            const kind = 'Brick';
            return '<span class="flow-cell-brick">' + renderFlowDependencyIcon(dep, 'flow-cell-brick-icon') + '<span>' + escapeHtml(kind + ': ' + label) + '</span></span>';
        }).join('') + '</div>';
    }

    function simplifySupportCopy(value) {
        const text = String(value || '').trim();
        if (!text) {
            return '';
        }
        const simplified = text.replace(/^Supports .*? by helping users help /i, 'Facilitate ');
        return simplified;
    }
</script>

        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>



</body>
</html>
