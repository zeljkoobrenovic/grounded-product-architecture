    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

 "Historical archive.", "how": "Stores the old returns and annual accounts in the client's document archive."}, {"type": "brick", "id": "iden", "name": "Identity, Login and Access Control", "description": "Secure upload.", "how": "Gives the client an authenticated upload channel instead of e-mail attachments."}]}, {"id": "import-the-current-year-bookings-and-opening-balances", "title": "Import the current-year bookings and opening balances", "actor": "Personal Bookkeeper", "keyFacts": ["The previous bookkeeper's ledger export (or the client's spreadsheet) is imported and mapped to the Kees booking rules; opening balances for bank, receivables, payables and investments are set on the switch date.", "Investments in progress (a camera, a laptop, a car) carry their depreciation schedule over so the year-end is correct."], "painPoints": ["Exports from self-service packages use different VAT codes and cost categories, so unmapped lines end up as 'other costs'.", "A missing opening bank balance makes the first bank reconciliation impossible."], "dependencies": [{"type": "brick", "id": "swch", "name": "Switch Service and Historical Data Import", "description": "Ledger import.", "how": "Imports and maps the historical ledger and opening balances."}, {"type": "brick", "id": "ledg", "name": "General Ledger and Booking Rules", "description": "Opening balances.", "how": "Posts the opening balances and the imported bookings under Kees booking rules."}]}, {"id": "reconcile-the-hand-over-quarter", "title": "Reconcile the hand-over quarter with the previous filings", "actor": "Personal Bookkeeper", "keyFacts": ["The bookkeeper reconciles the imported bookings with the last VAT return filed by the previous bookkeeper so that the first Kees VAT return starts from a matching position.", "Differences are booked as corrections in the first Kees quarter or flagged to the client for a supplementary return."], "painPoints": ["A previous bookkeeper who filed on estimates leaves a difference that surfaces only in the annual accounts.", "Clients do not know whether the previous bookkeeper already claimed the VAT on a large investment."], "dependencies": [{"type": "brick", "id": "vatr", "name": "VAT Return Preparation", "description": "Reconciliation with filed returns.", "how": "Compares the imported ledger with the previously filed VAT positions."}, {"type": "brick", "id": "bkws", "name": "Bookkeeper Client File and Review Queue", "description": "Review of the switch file.", "how": "Puts the reconciliation on the bookkeeper's review queue."}]}, {"id": "confirm-the-file-complete-and-inform-the-client", "title": "Confirm the file complete and inform the client", "actor": "Personal Bookkeeper", "keyFacts": ["The bookkeeper confirms the switch file complete, the client receives a summary of what was taken over and what Kees files from now on, and the dashboard shows the current year from the switch date.", "The previous bookkeeper is informed of the switch by the client, with Kees providing a standard message when asked."], "painPoints": ["Without a written confirmation the client keeps sending questions to both bookkeepers.", "A dashboard that starts at zero on the switch date confuses clients who expect the year to date."], "dependencies": [{"type": "brick", "id": "msgc", "name": "Client Messaging, E-mail and Call Log", "description": "Switch confirmation.", "how": "Sends the summary of the completed switch and the filing responsibilities."}, {"type": "brick", "id": "swch", "name": "Switch Service and Historical Data Import", "description": "Case closure.", "how": "Closes the switch case with the completeness confirmation."}]}]}, {"id": "switch-a-vof-from-a-self-service-package", "title": "Switch a VOF from a Self-service Package", "description": "Two partners who kept their own books in a self-service package move to Kees: the shared administration is rebuilt, the profit split and each partner's history are imported and both partners get access.", "primaryActor": "VOF Partner", "trigger": "A VOF that outgrew self-service bookkeeping (payroll, a second partner, a first Belastingdienst question) signs up for the VOF package.", "successSignal": "Both partners have their own login, the shared administration shows the imported year with the agreed profit split, and each partner's previous income tax return is archived.", "steps": [{"id": "record-partners-and-profit-split", "title": "Record the partners and the profit split", "actor": "Client Success and Sales Executive", "keyFacts": ["The VOF package covers two partners at \u20ac1,140 per year with \u20ac100 per extra partner; the partnership contract or an agreed percentage defines the profit split used at year end.", "Each partner's personal data is collected separately for the individual income tax returns."], "painPoints": ["VOFs without a written partnership contract discover the profit split question at the first year end.", "Partners who share one login lose track of who submitted which receipt."], "dependencies": [{"type": "brick", "id": "onbd", "name": "Onboarding, Fit Check and Bookkeeper Matching", "description": "VOF onboarding case.", "how": "Records the partners, their shares and the package."}, {"type": "brick", "id": "subs", "name": "Subscription Plans, Billing and Cancellation", "description": "VOF plan.", "how": "Creates the subscription with the number of partners."}, {"type": "brick", "id": "iden", "name": "Identity, Login and Access Control", "description": "Per-partner logins.", "how": "Creates a login per partner with access to the shared administration."}]}, {"id": "export-and-upload-the-self-service-history", "title": "Export and upload the self-service history", "actor": "VOF Partner", "keyFacts": ["The partners export invoices, expenses and bank transactions from the self-service package and upload them together with the filed VAT returns and last year's annual figures.", "External accounting software is not used going forward; the export is the last act in the old package."], "painPoints": ["Self-service exports lack receipts as documents, so the Kees archive starts without evidence for older bookings.", "Partners export at different times and the two exports overlap or leave a gap."], "dependencies": [{"type": "brick", "id": "swch", "name": "Switch Service and Historical Data Import", "description": "History upload.", "how": "Guides the export and upload of the self-service history."}, {"type": "brick", "id": "docs", "name": "Document Archive", "description": "Archived returns.", "how": "Stores the filed returns and annual figures."}]}, {"id": "rebuild-the-shared-administration", "title": "Rebuild the shared administration with opening balances", "actor": "Personal Bookkeeper", "keyFacts": ["The imported history is mapped to Kees booking rules, opening balances are posted per partner capital account and the VAT position at the switch date is set.", "Trading names and the shared bank account are linked to the one administration both partners see."], "painPoints": ["Private withdrawals booked as costs in the self-service package distort the partners' capital accounts.", "Two bank accounts with mixed private and business use take days to untangle."], "dependencies": [{"type": "brick", "id": "swch", "name": "Switch Service and Historical Data Import", "description": "Mapped import.", "how": "Maps the history to Kees categories."}, {"type": "brick", "id": "ledg", "name": "General Ledger and Booking Rules", "description": "Partner capital accounts.", "how": "Posts opening balances per partner and the VAT position."}]}, {"id": "review-and-reconcile-with-the-last-filed-vat-return", "title": "Review and reconcile with the last filed VAT return", "actor": "Personal Bookkeeper", "keyFacts": ["The bookkeeper checks the rebuilt quarter against the last VAT return the partners filed themselves and lists corrections.", "A four-eyes check is standard for switches because the history was not produced by a Kees bookkeeper."], "painPoints": ["Self-filed returns often used the wrong VAT rate on mixed deliveries, and corrections need a supplementary return.", "Partners disagree about who submitted what, so the reconciliation becomes a mediation."], "dependencies": [{"type": "brick", "id": "vatr", "name": "VAT Return Preparation", "description": "Reconciliation.", "how": "Compares the rebuilt ledger with the self-filed VAT return."}, {"type": "brick", "id": "bkws", "name": "Bookkeeper Client File and Review Queue", "description": "Switch review.", "how": "Schedules the review and the corrections on the queue."}]}, {"id": "hand-over-to-the-personal-bookkeeper", "title": "Hand over to the personal bookkeeper and set the first deadlines", "actor": "Client Success and Sales Executive", "keyFacts": ["The assigned bookkeeper receives the completed switch file, both partners get the welcome message and the filing calendar shows the first Kees VAT return for the VOF and the two partner income tax returns.", "The partners are told how the profit split appears on the dashboard and in each partner's return."], "painPoints": ["Switch files handed over without a note about open corrections cause the bookkeeper to redo the reconciliation.", "Partners expect two dashboards and are confused by one shared view."], "dependencies": [{"type": "brick", "id": "dlin", "name": "Filing Calendar and Deadline Orchestration", "description": "First deadlines.", "how": "Registers the VOF's VAT deadline and both partners' income tax return in the calendar."}, {"type": "brick", "id": "msgc", "name": "Client Messaging, E-mail and Call Log", "description": "Hand-over message.", "how": "Sends the welcome and the switch summary to both partners."}, {"type": "brick", "id": "bkws", "name": "Bookkeeper Client File and Review Queue", "description": "Client file hand-over.", "how": "Transfers the completed switch file to the bookkeeper's client file."}]}]}], "outcomes": ["A switching client's VAT and income tax history is co     mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        flowchart: {
            htmlLabels: false
        }
    });

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

    function getFlows() {
        return currentStream.flows || [];
    }

    function getFlowDependencies(flow) {
        const dependencyIndex = new Map();
        (flow.steps || []).forEach(step => {
            (step.dependencies || []).forEach(dependency => {
                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());
    }

    function getStepDependency(step, dependency) {
        return (step.dependencies || []).find(item => (item.type || '') === (dependency.type || '') && (item.id || '') === (dependency.id || '')) || null;
    }

    function getPrimaryActors() {
        const streamJobs = currentStream.supportedCustomerJobs || [];
        const allJobs = streamJobs.length ? streamJobs : supported_jobs;
        return dedupe(allJobs.map(item => item.customerName || item.customerGroup || '').filter(Boolean), item => item);
    }

    function summarizeFlow(flow) {
        const steps = flow.steps || [];
        const firstStep = steps[0] || {};
        const lastStep = steps[steps.length - 1] || {};
        return {
            actor: flow.primaryActor || firstStep.actor || '',
            trigger: flow.trigger || firstStep.trigger || '',
            result: flow.successSignal || flow.outcome || lastStep.successSignal || lastStep.output || ''
        };
    }

    function renderStepMeta(label, value) {
        if (!value) {
            return '';
        }
        return '<div class="flow-step-meta-item"><div class="flow-step-meta-label">' + escapeHtml(label) + '</div><div class="flow-step-copy">' + escapeHtml(value) + '</div></div>';
    }

    function flowDependencyIconFile(dependency) {
        const dependencyId = dependency.id || '';
        const linkedBrick = related_bricks.find(brick => brick.id === dependencyId) || all_bricks.find(brick => brick.id === dependencyId) || {};
        return dependency.icon || linkedBrick.icon || (dependencyId ? dependencyId + '.png' : 'brick.png');
    }

    function renderFlowDependencyIcon(dependency, className) {
        return '<img class="' + escapeHtml(className) + '" src="../icons/' + escapeHtml(flowDependencyIconFile(dependency)) + '" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
    }

    function renderStepDependencyPills(step) {
        const dependencies = step.dependencies || [];
        if (!dependencies.length) {
            return '<div class="muted">No step-specific dependencies listed.</div>';
        }

        return '<div class="flow-step-dependencies">' + dependencies.map(dep => {
            const label = dep.name || dep.id || 'Dependency';
            const kind = 'Brick';
            return '<span class="flow-cell-brick">' + renderFlowDependencyIcon(dep, 'flow-cell-brick-icon') + '<span>' + escapeHtml(kind + ': ' + label) + '</span></span>';
        }).join('') + '</div>';
    }

    function simplifySupportCopy(value) {
        const text = String(value || '').trim();
        if (!text) {
            return '';
        }
        const simplified = text.replace(/^Supports .*? by helping users help /i, 'Facilitate ');
        return simplified;
    }

        }
        html += '</div>';

        document.getElementById('tab_content_home').innerHTML = html;
    }

    function renderFlows() {
        const flows = getFlows();
        const totalSteps = flows.reduce((count, flow) => count + ((flow.steps || []).length), 0);
        let html = '';

        document.getElementById('tab_flows').innerHTML = 'Flow Narratives (' + flows.length + ')';

        flows.forEach(flow => {
            const dependenciesInFlow = getFlowDependencies(flow);
            const summary = summarizeFlow(flow);
            html += '<div class="group">';
            html += '<div class="section-title">Flow</div>';
            html += '<div class="flow-title">' + escapeHtml(flow.title || flow.id) + '</div>';
            html += '<div class="flow-description">' + escapeHtml(flow.description || '') + '</div>';
            if (summary.actor || summary.trigger || summary.result) {
                html += '<div class="card" style="margin-bottom:16px;">';
                if (summary.actor) {
                    html += '<div class="card-copy"><strong>Primary actor:</strong> ' + escapeHtml(summary.actor) + '</div>';
                }
                if (summary.trigger) {
                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';
                }
                html += '</div>';
            }

            html += '<div class="section-title">Dependency Traceability</div>';
            html += '<div class="flow-matrix-wrap">';
            html += '<table class="flow-matrix">';
            html += '<thead>';
            html += '<tr><th class="flow-dependency-col"></th>';
            (flow.steps || []).forEach((step, index) => {
                html += '<th class="flow-step-col"><div class="flow-step-label">Step ' + (index + 1) + '</div><div class="card-title">' + escapeHtml(step.title || step.id) + '</div></th>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right">Key Facts</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkblue">';
                if ((step.keyFacts || []).length) {
                    html += '<ul class="flow-insight-list">' + step.keyFacts.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No key facts listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right; color: darkred">Pain Points</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkred">';
                if ((step.painPoints || []).length) {
                    html += '<ul class="flow-insight-list">' + step.painPoints.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No pain points listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';
            html += '</thead><tbody>';

            dependenciesInFlow.forEach(dependency => {
                const dependencyTypeLabel = 'Product Brick';
                html += '<tr>';
                html += '<td>';
                html += '<div class="flow-dependency-header">';
                html += renderFlowDependencyIcon(dependency, 'flow-dependency-icon');
                html += '<div>';
                html += '<a class="flow-dependency-name" href="../landing_pages/' + escapeHtml(dependency.id) + '.html">' + escapeHtml(dependency.name || dependency.id) + '</a>';
                if (dependency.interface) {
                    html += '<div class="muted">' + escapeHtml(dependency.interface) + '</div>';
                }
                html += '</div>';
                html += '</div>';
                html += '</td>';
                (flow.steps || []).forEach(step => {
                    const stepDependency = getStepDependency(step, dependency);
                    if (!stepDependency) {
                        html += '<td class="flow-cell-empty">-</td>';
                        return;
                    }
                    html += '<td class="flow-cell-active">';
                    html += '<div class="flow-cell-copy">' + escapeHtml(simplifySupportCopy(stepDependency.how || stepDependency.description || 'Supports this step.')) + '</div>';
                    html += '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            html += '</div>';
            html += '</div>';
        });

        document.getElementById('tab_content_flows').innerHTML = html;
    }

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';
        }
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-title">' + escapeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                count++;
                html += '<div class="link-entry">';
                html += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(link.link || '#') + '">'
                    + escapeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>

    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Freelancer Bookkeeping Service Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Streams Index"
    },
    {
      "label": "Switch from a Previous Bookkeeper"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
