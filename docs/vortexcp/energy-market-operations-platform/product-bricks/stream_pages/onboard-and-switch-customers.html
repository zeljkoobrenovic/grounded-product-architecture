    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

tal and App", "description": "Branded web and mobile self-service on the operational backbone.", "how": "Runs the branded sign-up journey."}, {"type": "brick", "id": "camp", "name": "Campaign and Sales Channel Management", "description": "Campaigns, promotions and per-channel availability of propositions.", "how": "Applies the channel, campaign and promotion the customer came through."}]}, {"id": "verify-identity-and-run-credit-check", "title": "Verify identity and run the credit check", "actor": "Billing and Operations Manager", "keyFacts": ["Identity, address and credit checks run automatically on the intake with configurable acceptance rules per product and customer type.", "Outcomes are logged on the customer account for later disputes and regulatory questions."], "painPoints": ["Manual credit checks queue for days and lose the customer to a competitor.", "Accepting every customer without checks shows up months later as bad debt."], "dependencies": [{"type": "brick", "id": "intk", "name": "Intake, Credit Check and Activation", "description": "Automated intake, identity and credit checks and activation flows.", "how": "Runs identity verification and credit-check rules and records the decision."}]}, {"id": "look-up-connection-in-central-register", "title": "Look up the connection in the central connection register", "actor": "Billing and Operations Manager", "keyFacts": ["The address is resolved to its connection in the central connection register so the switch message targets the right EAN and grid operator.", "C-AR returns the 18-digit EAN per commodity with grid operator, meter number and type, profile category, capacity code and the current supplier and BRP; these are stored on the connection point for billing and allocation."], "painPoints": ["A wrong EAN produces a switch of the neighbour's connection and a dispute for two households.", "Register data not stored locally is looked up again for every downstream process."], "dependencies": [{"type": "brick", "id": "swch", "name": "Switching and Move-In Market Processes", "description": "Switch, move-in, move-out and supplier-change processes with the market.", "how": "Prepares the switch with the resolved connection."}, {"type": "brick", "id": "mcom", "name": "Dutch Market Messaging Hub", "description": "EDSN message flows, central connection register and TenneT MMC-Hub exchange.", "how": "Queries the central connection register through EDSN."}]}, {"id": "create-contract-and-submit-switch-message", "title": "Create the contract and submit the switch message", "actor": "Billing and Operations Manager", "keyFacts": ["The supply contract and connection point are created and the switch or move-in message is sent to the market with the requested start date.", "Directive (EU) 2019/944 caps a switch at three weeks; the switch message (leverancierswissel or inhuizing) carries the requested date and the EAN, and the platform processes 20 million connections daily, so message volumes run through automated flows rather than operators."], "painPoints": ["Contracts created before the switch is confirmed bill customers the supplier does not yet supply.", "Switch messages hand-built per case are sent late and miss the requested date."], "dependencies": [{"type": "brick", "id": "cntr", "name": "Contracts and Connections Register", "description": "Supply contracts, connection points (EAN/CUPS) and their components.", "how": "Creates the supply contract and connection point."}, {"type": "brick", "id": "swch", "name": "Switching and Move-In Market Processes", "description": "Switch, move-in, move-out and supplier-change processes with the market.", "how": "Composes and sends the switch or move-in message and tracks its status."}, {"type": "brick", "id": "mcom", "name": "Dutch Market Messaging Hub", "description": "EDSN message flows, central connection register and TenneT MMC-Hub exchange.", "how": "Delivers the message through the EDSN message flows."}]}, {"id": "handle-rejections-and-objections", "title": "Handle rejections and cooling-off cancellations", "actor": "Billing and Operations Manager", "keyFacts": ["Rejections (unknown or inactive EAN, a switch already pending on the connection, customer data not matching the register) land in an exception queue with the EDSN reason code and the sign-up context; in the Dutch process the losing supplier cannot block a switch.", "A customer who cancels within the 14-day cooling-off period triggers a cancellation message before the effective date; resolved cases are resubmitted automatically, unresolvable ones trigger customer communication."], "painPoints": ["Rejections read from a message log by hand are missed until the customer calls about a missing start.", "Working exceptions without the original sign-up context means calling the customer for data already given."], "dependencies": [{"type": "brick", "id": "wflw", "name": "Workflow, Exceptions and Notifications", "description": "Exception queues, approvals, tasks and notifications.", "how": "Queues rejected switches with reason codes and routes them to the right operator."}, {"type": "brick", "id": "swch", "name": "Switching and Move-In Market Processes", "description": "Switch, move-in, move-out and supplier-change processes with the market.", "how": "Resubmits corrected switch messages."}]}, {"id": "confirm-supply-start-and-welcome", "title": "Confirm supply start and welcome the customer", "actor": "Customer Service Lead", "keyFacts": ["On market confirmation the customer receives the contract, welcome pack and portal invitation in the supplier's brand.", "The portal account is active before supply starts, so the first question the customer has can be answered by self-service."], "painPoints": ["Welcome communication sent before confirmation has to be retracted when the switch fails.", "Customers without portal access on day one call to ask when supply starts."], "dependencies": [{"type": "brick", "id": "comm", "name": "Customer Communication and Documents", "description": "Lifecycle communication, documents and regulatory disclosures in the supplier's brand.", "how": "Sends the confirmation, welcome pack and disclosures."}, {"type": "brick", "id": "port", "name": "White-Label Customer Portal and App", "description": "Branded web and mobile self-service on the operational backbone.", "how": "Activates the customer's portal and app account."}]}]}, {"id": "onboard-an-iberian-supplier-customer-via-sips-and-atr", "title": "Onboard an Iberian Supplier Customer via SIPS and ATR", "description": "The Billing and Operations Manager (bilo) of a Spanish or Portuguese supplier onboards a customer from CUPS lookup in SIPS, through distributor switching files, to an active contract and first billing cycle on the Nemon-heritage Iberian platform.", "primaryActor": "Billing and Operations Manager", "trigger": "A customer signs a supply contract with a Spanish or Portuguese supplier and provides the CUPS of the supply point.", "successSignal": "The distributor confirms the change of supplier, the contract is active with the correct access tariff and the first billing cycle runs.", "steps": [{"id": "capture-cups-and-consult-sips", "title": "Capture the CUPS and consult SIPS", "actor": "Billing and Operations Manager", "keyFacts": ["The CUPS (20-22 characters, ES or PT prefix) is validated against the distributor's SIPS to retrieve the access tariff (2.0TD, 3.0TD or 6.xTD), contracted power per period, meter type, current supplier and the distributor responsible.", "About 100 suppliers in Spain and Portugal onboard customers through this route on the platform."], "painPoints": ["A mistyped CUPS returns another customer's supply point.", "SIPS data consulted once and not stored has to be re-fetched at every billing question."], "dependencies": [{"type": "brick", "id": "imcm", "name": "Iberian Market Communication", "description": "SIPS, ATR, OMIE and distributor switching files for Spain and Portugal.", "how": "Performs the SIPS     mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        flowchart: {
            htmlLabels: false
        }
    });

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

    function getFlows() {
        return currentStream.flows || [];
    }

    function getFlowDependencies(flow) {
        const dependencyIndex = new Map();
        (flow.steps || []).forEach(step => {
            (step.dependencies || []).forEach(dependency => {
                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());
    }

    function getStepDependency(step, dependency) {
        return (step.dependencies || []).find(item => (item.type || '') === (dependency.type || '') && (item.id || '') === (dependency.id || '')) || null;
    }

    function getPrimaryActors() {
        const streamJobs = currentStream.supportedCustomerJobs || [];
        const allJobs = streamJobs.length ? streamJobs : supported_jobs;
        return dedupe(allJobs.map(item => item.customerName || item.customerGroup || '').filter(Boolean), item => item);
    }

    function summarizeFlow(flow) {
        const steps = flow.steps || [];
        const firstStep = steps[0] || {};
        const lastStep = steps[steps.length - 1] || {};
        return {
            actor: flow.primaryActor || firstStep.actor || '',
            trigger: flow.trigger || firstStep.trigger || '',
            result: flow.successSignal || flow.outcome || lastStep.successSignal || lastStep.output || ''
        };
    }

    function renderStepMeta(label, value) {
        if (!value) {
            return '';
        }
        return '<div class="flow-step-meta-item"><div class="flow-step-meta-label">' + escapeHtml(label) + '</div><div class="flow-step-copy">' + escapeHtml(value) + '</div></div>';
    }

    function flowDependencyIconFile(dependency) {
        const dependencyId = dependency.id || '';
        const linkedBrick = related_bricks.find(brick => brick.id === dependencyId) || all_bricks.find(brick => brick.id === dependencyId) || {};
        return dependency.icon || linkedBrick.icon || (dependencyId ? dependencyId + '.png' : 'brick.png');
    }

    function renderFlowDependencyIcon(dependency, className) {
        return '<img class="' + escapeHtml(className) + '" src="../icons/' + escapeHtml(flowDependencyIconFile(dependency)) + '" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
    }

    function renderStepDependencyPills(step) {
        const dependencies = step.dependencies || [];
        if (!dependencies.length) {
            return '<div class="muted">No step-specific dependencies listed.</div>';
        }

        return '<div class="flow-step-dependencies">' + dependencies.map(dep => {
            const label = dep.name || dep.id || 'Dependency';
            const kind = 'Brick';
            return '<span class="flow-cell-brick">' + renderFlowDependencyIcon(dep, 'flow-cell-brick-icon') + '<span>' + escapeHtml(kind + ': ' + label) + '</span></span>';
        }).join('') + '</div>';
    }

    function simplifySupportCopy(value) {
        const text = String(value || '').trim();
        if (!text) {
            return '';
        }
        const simplified = text.replace(/^Supports .*? by helping users help /i, 'Facilitate ');
        return simplified;
    }

    }

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';
        }
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-title">' + escapeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                count++;
                html += '<div class="link-entry">';
                html += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(link.link || '#') + '">'
                    + escapeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>


<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Energy Market Operations Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Streams Index"
    },
    {
      "label": "Onboard and Switch Customers"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
