    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

-origin-and-split-invoicing", "title": "Apply guarantees of origin and split invoicing", "actor": "Billing and Operations Manager", "keyFacts": ["Green supply is disclosed on the invoice and the corresponding guarantees of origin (1 MWh each) are cancelled in VertiCer or the CNMC GdO registry for the delivered volume, feeding the annual fuel-mix disclosure.", "Split invoicing produces separate invoices per site, legal entity or cost component where the contract requires it."], "painPoints": ["Guarantees of origin reconciled once a year leave months of undisclosed supply.", "Split invoices created by copying and editing a master invoice are the main source of duplicate charges."], "dependencies": [{"type": "brick", "id": "bill", "name": "Billing Runs and Invoicing", "description": "Periodic, annual and final billing runs with VAT, guarantees of origin and split invoicing.", "how": "Applies disclosure and split-invoicing rules."}, {"type": "brick", "id": "regs", "name": "Regulatory Reporting and Compliance", "description": "Regulatory reports, licensing evidence and compliance rules.", "how": "Maintains the disclosure rules and registry reconciliation."}]}, {"id": "run-pre-billing-checks-and-hold-exceptions", "title": "Run pre-billing checks and hold exceptions", "actor": "Billing and Operations Manager", "keyFacts": ["Invoices outside configured tolerances (versus previous period, expected consumption or contract value) are held for review while the rest proceed.", "Held invoices carry the rule, the values and the underlying reads so the reviewer decides in minutes."], "painPoints": ["A run halted entirely for a few outliers delays cash for everyone.", "Outliers not held are sent, disputed and corrected at a much higher cost."], "dependencies": [{"type": "brick", "id": "wflw", "name": "Workflow, Exceptions and Notifications", "description": "Exception queues, approvals, tasks and notifications.", "how": "Holds exceptions and routes them to reviewers."}, {"type": "brick", "id": "bill", "name": "Billing Runs and Invoicing", "description": "Periodic, annual and final billing runs with VAT, guarantees of origin and split invoicing.", "how": "Continues the run for invoices that pass the checks."}]}, {"id": "generate-and-deliver-invoices", "title": "Generate and deliver the invoices", "actor": "Billing and Operations Manager", "keyFacts": ["Invoices are rendered in the supplier's brand with the breakdown that the portal also shows, and delivered by the customer's preferred channel.", "The invoice breakdown in the portal is the same data as the document, so customer service and customer see one truth."], "painPoints": ["PDF invoices that differ from the portal breakdown create disputes about which is right.", "Delivery failures not fed back leave invoices unpaid and customers unaware."], "dependencies": [{"type": "brick", "id": "bill", "name": "Billing Runs and Invoicing", "description": "Periodic, annual and final billing runs with VAT, guarantees of origin and split invoicing.", "how": "Finalises and numbers the invoices."}, {"type": "brick", "id": "comm", "name": "Customer Communication and Documents", "description": "Lifecycle communication, documents and regulatory disclosures in the supplier's brand.", "how": "Renders and delivers the invoice documents."}, {"type": "brick", "id": "port", "name": "White-Label Customer Portal and App", "description": "Branded web and mobile self-service on the operational backbone.", "how": "Publishes the invoice and breakdown in the customer's portal."}]}, {"id": "post-to-ledger-and-hand-to-collections", "title": "Post to the ledger and hand over to collections", "actor": "Billing and Operations Manager", "keyFacts": ["Invoices are posted to the ERP or accounting ledger through the open API and open items are created for collections.", "Direct-debit customers are scheduled for the next SEPA Core batch on the due date, with the pre-notification sent at least 14 calendar days ahead unless the contract agreed a shorter term."], "painPoints": ["Postings exported as files and imported by hand break the audit trail.", "Invoices not handed to collections are never dunned."], "dependencies": [{"type": "brick", "id": "bill", "name": "Billing Runs and Invoicing", "description": "Periodic, annual and final billing runs with VAT, guarantees of origin and split invoicing.", "how": "Creates the posting and open items."}, {"type": "brick", "id": "paym", "name": "Payments, Direct Debit and Debtor Management", "description": "SEPA direct debit, payment matching, payment plans and dunning.", "how": "Schedules direct debits and opens the debtor items."}, {"type": "brick", "id": "apip", "name": "Open API and Integration Connectors", "description": "Open API and connectors to ERP, payment, meter-data and market systems.", "how": "Posts to the ERP through the connector."}]}]}, {"id": "reconcile-and-correct-after-annual-settlement", "title": "Reconcile and Correct after Annual Settlement", "description": "The Billing and Operations Manager (bilo) reconciles billed volumes against allocated and reconciled market volumes after the annual settlement, issues corrections and reports the outcome to the Energy Company Director (exec).", "primaryActor": "Billing and Operations Manager", "trigger": "Reconciliation volumes for a settled period arrive from allocation and the annual settlement invoices have been produced.", "successSignal": "Deviations between billed and allocated volumes are explained, corrected where needed and reflected in margin and regulatory reporting.", "steps": [{"id": "compare-billed-with-allocated-and-reconciled-volumes", "title": "Compare billed with allocated and reconciled volumes", "actor": "Billing and Operations Manager", "keyFacts": ["Billed volumes per connection and period are compared with the grid operators' allocation and the reconciliation volumes published under Allocation 2.0 (TMT, SMA and PRO methods).", "Differences are classified by size and cause l invoice, with the corrected volumes and prices shown.", "The invoice correction rate is tracked per cause and segment as a leading indicator of billing quality."], "painPoints": ["Corrections issued as new invoices without reference confuse customers and auditors.", "Corrections not tracked per cause cannot be prevented."], "dependencies": [{"type": "brick", "id": "recn", "name": "Billing Reconciliation and Corrections", "description": "Billed-versus-allocated reconciliation, corrections and exception handling.", "how": "Creates the corrections and records their cause."}, {"type": "brick", "id": "bill", "name": "Billing Runs and Invoicing", "description": "Periodic, annual and final billing runs with VAT, guarantees of origin and split invoicing.", "how": "Generates the credit and debit notes."}]}, {"id": "inform-customer-and-update-portal", "title": "Inform the customer and update the portal", "actor": "Customer Service Lead", "keyFacts": ["The customer receives an explanation with the correction, and the portal shows the corrected breakdown and updated instalment.", "Customer service sees the same correction with its cause before the customer calls."], "painPoints": ["Corrections sent without explanation generate the calls they were meant to avoid.", "A portal still showing the old invoice contradicts the correction letter."], "dependencies": [{"type": "brick", "id": "comm", "name": "Customer Communication and Documents", "description": "Lifecycle communication, documents and regulatory disclosures in the supplier's brand.", "how": "Sends the correction explanation."}, {"type": "brick", "id": "port", "name": "White-Label Customer Portal and App", "description": "Branded web and mobile self-service on the operational backbone.", "how": "Shows the corrected invoice and instalment."}]}, {"id": "feed-corrections-into-margin-and-reporting", "title": "Feed corrections into margin and regulatory reporting", "actor": "Energy Company Director", "keyFacts": ["Correction volumes and amounts flow into gross margin per connection and into regulatory reporting for the period.", "Leadership sees the correction rate against the straight-through billing target per segment."], "painPoints": ["Margin reported before corrections overstates the result for the year.", "Regulatory reports rebuilt from corrected invoices by hand are late."], "dependencies": [{"type": "brick", "id": "dash", "name": "Operational Dashboards and Analytics", "description": "Operational and 15-minute financial insight per segment.", "how": "Shows correction rates and margin impact per segment."}, {"type": "brick", "id": "regs", "name": "Regulatory Reporting and Compliance", "description": "Regulatory reports, licensing evidence and compliance rules.", "how": "Includes corrected volumes in regulatory reports."}]}]}], "outcomes": ["The straight-through billing rate rises because invoices are produced from validated volumes and configured contracts with no manual step", "VAT, guarantees of origin and split invoicing are applied by rule per contract and jurisdiction", "Annual and final settlements reconcile billed volumes against allocated volumes, so corrections are rare and explained", "Every correction is traceable to its cause (meter, market message, tariff), feeding fewer corrections next run"], "brickDependencies": [{"targetBrickId": "bill", "type": "composition"}, {"targetBrickId": "recn", "type": "composition"}, {"targetBrickId": "cntr", "type": "composition"}, {"targetBrickId": "mdat", "type": "composition"}, {"targetBrickId": "allo", "type": "composition"}, {"targetBrickId": "comm", "type": "composition"}, {"targetBrickId": "wflw", "type": "composition"}, {"targetBrickId": "regs", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "Guarantees-of-Origin Registries (VertiCer, CNMC GdO)", "type": "registry", "interface": "Guarantee-of-origin issuance, transfer and cancellation", "description": "VertiCer (the merged CertiQ and Vertogas registry) in the Netherlands and the CNMC GdO registry in Spain, in which guarantees of origin of 1 MWh each are cancelled for the green volume supplied and disclosed in the annual fuel mix."}, {"system": "ERP and Accounting Systems", "type": "enterprise-system", "interface": "Ledger postings, open items and cash reconciliation via the open API", "description": "The supplier's or portfolio operator's finance system that receives invoice postings and returns cash and ledger data."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []};

    mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        flowchart: {
            htmlLabels: false
        }
    });

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

    function getFlows() {
        return currentStream.flows || [];
    }

    function getFlowDependencies(flow) {
        const dependencyIndex = new Map();
        (flow.steps || []).forEach(step => {
            (step.dependencies || []).forEach(dependency => {
                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());
    }

    function getStepDependency(step, dependency) {
        return (step.dependencies || []).find(item => (item.type || '') === (dependency.type || '') && (item.id || '') === (dependency.id || '')) || null;
    }

    function getPrimaryActors() {
        const streamJobs = currentStream.supportedCustomerJobs || [];
        const allJobs = streamJobs.length ? streamJobs : supported_jobs;
        return dedupe(allJobs.map(item => item.customerName || item.customerGroup || '').filter(Boolean), item => item);
    }

    function summarizeFlow(flow) {
        const steps = flow.steps || [];
        const firstStep = steps[0] || {};
        const lastStep = steps[steps.length - 1] || {};
        return {
            actor: flow.primaryActor || firstStep.actor || '',
            trigger: flow.trigger || firstStep.trigger || '',
            result: flow.successSignal || flow.outcome || lastStep.successSignal || lastStep.output || ''
        };
    }

    function renderStepMeta(label, value) {
        if (!value) {
            return '';
        }
        return '<div class="flow-step-meta-item"><div class="flow-step-meta-label">' + escapeHtml(label) + '</div><div class="flow-step-copy">' + escapeHtml(value) + '</div></div>';
    }

    function flowDependencyIconFile(dependency) {
        const dependencyId = dependency.id || '';
        const linkedBrick = related_bricks.find(brick => brick.id === dependencyId) || all_bricks.find(brick => brick.id === dependencyId) || {};
        return dependency.icon || linkedBrick.icon || (dependencyId ? dependencyId + '.png' : 'brick.png');
    }

    function renderFlowDependencyIcon(dependency, className) {
        return '<img class="' + escapeHtml(className) + '" src="../icons/' + escapeHtml(flowDependencyIconFile(dependency)) + '" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
    }

    function renderStepDependencyPills(step) {
        const dependencies = step.dependencies || [];
        if (!dependencies.length) {
            return '<div class="muted">No step-specific dependencies listed.</div>';
        }

        return '<div class="flow-step-dependencies">' + dependencies.map(dep => {
            const label = dep.name || dep.id || 'Dependency';
            const kind = 'Brick';
            return '<span class="flow-cell-brick">' + renderFlowDependencyIcon(dep, 'flow-cell-brick-icon') + '<span>' + escapeHtml(kind + ': ' + label) + '</span></span>';
        }).join('') + '</div>';
    }

    function simplifySupportCopy(value) {
        const text = String(value || '').trim();
        if (!text) {
            return '';
        }
        const simplified = text.replace(/^Supports .*? by helping users help /i, 'Facilitate ');
        return simplified;
    }

    function renderFlows() {
        const flows = getFlows();
        const totalSteps = flows.reduce((count, flow) => count + ((flow.steps || []).length), 0);
        let html = '';

        document.getElementById('tab_flows').innerHTML = 'Flow Narratives (' + flows.length + ')';

        flows.forEach(flow => {
            const dependenciesInFlow = getFlowDependencies(flow);
            const summary = summarizeFlow(flow);
            html += '<div class="group">';
            html += '<div class="section-title">Flow</div>';
            html += '<div class="flow-title">' + escapeHtml(flow.title || flow.id) + '</div>';
            html += '<div class="flow-description">' + escapeHtml(flow.description || '') + '</div>';
            if (summary.actor || summary.trigger || summary.result) {
                html += '<div class="card" style="margin-bottom:16px;">';
                if (summary.actor) {
                    html += '<div class="card-copy"><strong>Primary actor:</strong> ' + escapeHtml(summary.actor) + '</div>';
                }
                if (summary.trigger) {
                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';
                }
                html += '</div>';
            }

            html += '<div class="section-title">Dependency Traceability</div>';
            html += '<div class="flow-matrix-wrap">';
            html += '<table class="flow-matrix">';
            html += '<thead>';
            html += '<tr><th class="flow-dependency-col"></th>';
            (flow.steps || []).forEach((step, index) => {
                html += '<th class="flow-step-col"><div class="flow-step-label">Step ' + (index + 1) + '</div><div class="card-title">' + escapeHtml(step.title || step.id) + '</div></th>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right">Key Facts</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkblue">';
                if ((step.keyFacts || []).length) {
                    html += '<ul class="flow-insight-list">' + step.keyFacts.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No key facts listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right; color: darkred">Pain Points</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkred">';
                if ((step.painPoints || []).length) {
                    html += '<ul class="flow-insight-list">' + step.painPoints.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No pain points listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';
            html += '</thead><tbody>';

            dependenciesInFlow.forEach(dependency => {
                const dependencyTypeLabel = 'Product Brick';
                html += '<tr>';
                html += '<td>';
                html += '<div class="flow-dependency-header">';
                html += renderFlowDependencyIcon(dependency, 'flow-dependency-icon');
                html += '<div>';
                html += '<a class="flow-dependency-name" href="../landing_pages/' + escapeHtml(dependency.id) + '.html">' + escapeHtml(dependency.name || dependency.id) + '</a>';
                if (dependency.interface) {
                    html += '<div class="muted">' + escapeHtml(dependency.interface) + '</div>';
                }
                html += '</div>';
                html += '</div>';
                html += '</td>';
                (flow.steps || []).forEach(step => {
                    const stepDependency = getStepDependency(step, dependency);
                    if (!stepDependency) {
                        html += '<td class="flow-cell-empty">-</td>';
                        return;
                    }
                    html += '<td class="flow-cell-active">';
                    html += '<div class="flow-cell-copy">' + escapeHtml(simplifySupportCopy(stepDependency.how || stepDependency.description || 'Supports this step.')) + '</div>';
                    html += '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            html += '</div>';
            html += '</div>';
        });

        document.getElementById('tab_content_flows').innerHTML = html;
    }

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';
        }
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-title">' + escapeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                count++;
                html += '<div class="link-entry">';
                html += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(link.link || '#') + '">'
                    + escapeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>


<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Energy Market Operations Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Streams Index"
    },
    {
      "label": "Bill and Reconcile Customers"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
