<script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

g in the app", "Privacy for photos of her children: encrypted upload, no sharing beyond the printer, and deletion when she asks"], "winsThem": ["The free preview in under 60 seconds: the entire year already curated and laid out on the screen before a card is entered, which is the moment the book stops being a chore", "Yearbook mode in the app that takes a calendar year straight from the camera roll by date and album, with no folder sorting on a laptop", "A yearbook reminder each January and a nudge after the summer holiday that reopens the app with the next book already suggested", "Social proof that matters to a parent: Trustpilot 4.5 from 35,837 reviews with 79% five stars, App Store featuring in several countries, 10 million books created since 2012", "Free-shipping and upgrade promotions that make the Large Hardcover or a second copy for the grandparents feel like the sensible choice"], "theirFear": ["Another year ends with 12,000 new photos trapped on a phone that could be lost, broken or full tomorrow, and the children have no book of their childhood", "The AI leaves out grandma at the christening or keeps the blurry shots, and she ends up scrolling through 5,000 photos anyway, which is exactly what she was avoiding", "A dull print, a loose spine or a book that arrives after the family visit it was meant for, with a support conversation she has no time for"], "jobsToBeDone": [{"id": "jtbd-fmly-1", "name": "Turn a year of phone photos into a finished yearbook in minutes", "whatItIs": "Get from a camera roll of tens of thousands of photos to a printed hardcover yearbook of one calendar year without designing a page, choosing a template or dragging photos around. The job is to compress the whole photo-book project into a few minutes on the phone: pick the year, let the curation engine and the layout generator do the work, glance at the preview, choose the size and pay, and let production and shipping happen in the background.", "outcome": "A hardcover yearbook of the chosen year is ordered in under ten minutes from opening the app, with every month represented, without the parent having reviewed individual photos, and it arrives within the published delivery window for her country.", "steps": [{"step": "Install the PastBook app and grant access to the camera roll", "description": "Find the PastBook: 1-Click Photo Book app in the App Store or Google Play, often from an ad, a featured placement or a friend's book, install it and grant photo-library permission with a clear explanation of what is uploaded and why. The decision here is trust: the app will read years of family photos, so the permission screen and the privacy wording have to be honest before anything else happens.", "streamsNeeded": [{"id": "discover-and-install-the-app", "name": "Discover And Install The App", "howItSupports": "Takes the parent from an ad, an App Store feature or a friend's book to an installed app with photo-library permission granted, the precondition for Yearbook mode."}, {"id": "protect-photo-privacy-and-platform-compliance", "name": "Protect Photo Privacy And Platform Compliance", "howItSupports": "Explains consent and encrypted transfer at the permission screen and keeps the app within App Store and Google Play privacy-label rules, so granting access feels safe."}]}, {"step": "Pick the year in Yearbook mode and let the photos import", "description": "Choose Yearbook mode and the calendar year, or a date range and an album for a school year or a holiday, and let the app index the photos with timestamps and locations over an encrypted connection. The friction to avoid is waiting: with 12,000 photos in a year, import has to run in the background and show progress instead of blocking the screen.", "streamsNeeded": [{"id": "import-photos-from-phone-and-cloud", "name": "Import Photos From Phone And Cloud", "howItSupports": "Indexes the camera roll by date, location, album or Yearbook mode into a photo set with timestamps and locations, uploaded over encrypted connections."}]}, {"step": "Let the engine curate the year and lay out the book, then preview it", "description": "Wait under 60 seconds while image quality and context are analysed, duplicates and blurry shots removed and photos grouped into moments, then look at the free preview of the laid-out book with cover, theme colours and dates. The parent decides at moment level, not photo level: is Christmas there, is the first day of school there, does the cover show the right child.", "streamsNeeded": [{"id": "curate-the-best-photos-with-ai", "name": "Curate The Best Photos With Ai", "howItSupports": "Turns thousands of photos into the best moments of the year by scoring quality, removing duplicates and blur and grouping into moments, in under 60 seconds."}, {"id": "auto-design-the-book-and-preview", "name": "Auto Design The Book And Preview", "howItSupports": "Lays out the curated moments into a book with cover, theme colours and captions and shows a free preview in under a minute, plus a shareable highlight video."}]}, {"step": "Choose the size and page count and pay in the app", "description": "Choose between the Small Hardcover (8.5 by 6 inch, USD 19.99 for 24 pages plus USD 0.40 per page) and the Large Hardcover (12 by 8.5 inch, USD 34.99 plus USD 0.55 per page), see the page count the engine proposes and the resulting price, apply a promo code or a free-shipping upgrade, and pay with Visa, Mastercard, American Express or PayPal in her own currency.", "streamsNeeded": [{"id": "choose-format-price-and-checkout", "name": "Choose Format Price And Checkout", "howItSupports": "Presents the two hardcover sizes, cover rules by page count, extra-page pricing, promo codes and payment in seven currencies, and turns the finished design into a paid order."}]}, {"step": "Receive the printed yearbook within the delivery window", "description": "Production starts on payment; the print-ready file is routed to a partner facility in her country and the book ships with tracking, 4 to 8 business days after production in the United States, 5 to 10 in Canada and Australia. The parent wants a single status she can trust and a date she can plan around, not a chain of carrier e-mails.", "streamsNeeded": [{"id": "render-print-ready-files-and-route-to-a-printer", "name": "Render Print Ready Files And Route To A Printer", "howItSupports": "Renders and preflights the print-ready file and routes it to the nearest partner facility with capacity, so production starts as soon as payment clears."}, {"id": "produce-ship-and-track-the-order", "name": "Produce Ship And Track The Order", "howItSupports": "Produces, packs, ships and tracks the parcel within the published delivery window and surfaces the status in the app and by e-mail."}]}]}, {"id": "jtbd-fmly-2", "name": "Trust the automatic selection so I do not have to review 5,000 photos", "whatItIs": "Rely on the curation engine to choose the photos a parent would have chosen, so that the promise of a one-click book is real and not a preview she has to rebuild by hand. The job covers understanding what the engine does with duplicates, blur and moments, checking the result at a glance, correcting the few exceptions with a swap or a caption, and knowing that photos of her children are handled privately and can be deleted.", "outcome": "The parent accepts the automatic selection for the large majority of pages, changes at most a handful of photos per book, never scrolls the full camera roll inside the app, and feels confident that the children's photos were used only to make her book.", "steps": [{"step": "Understand what the engine keeps and what it drops", "description": "See, in plain words at the first preview, that near-duplicates and blurry frames were removed, how many photos were considered and how many made the book, and that moments are grouped by time and place. Trust is built by showing the rules, not by asking the parent to verify every photo.", "streamsNeeded": [{"id": "curate-the-best-photos-with-ai", "name": "Curate The Best Photos With Ai", "howItSupports": "Provides the quality scoring, duplicate removal and moment grouping whose results and counts the preview can explain to the parent."}]}, {"step": "Check the preview at moment level, not photo level", "description": "Flip through the laid-out book by month and moment, checking that the birthdays, the first day of school, the holiday and the grandparents' visit are there and that the cover photo is the right one. The decision is whether the year is complete, which takes two minutes, rather than whether each of 5,000 photos was judged correctly.", "streamsNeeded": [{"id": "auto-design-the-book-and-preview", "name": "Auto Design The Book And Preview", "howItSupports": "Shows the book as laid-out pages grouped by moment with dates, so completeness can be judged in a glance rather than photo by photo."}]}, {"step": "Fix the few exceptions with a swap, a removal or a caption", "description": "Swap the one photo where a sibling is cut off, remove a picture of a receipt that slipped in, add a caption to the first-day-of-school page or change the theme colour, all inside the automatic design and without touching the other pages. Edits must be cheap and rare; if a parent needs to fix twenty pages, the curation has failed.", "streamsNeeded": [{"id": "edit-and-personalise-the-book", "name": "Edit And Personalise The Book", "howItSupports": "Lets the parent reorder, swap or remove individual photos and add captions, cover photo and theme colours inside the automatic design without redoing the book."}]}, {"step": "Keep the children's photos private throughout", "description": "Know that the photos travel encrypted, are used only to produce the book and the preview, are never shared beyond the printing partner, and can be deleted from the account on request under GDPR or CCPA. For a parent this is not a legal detail but the condition for handing over a childhood.", "streamsNeeded": [{"id": "protect-photo-privacy-and-platform-compliance", "name": "Protect Photo Privacy And Platform Compliance", "howItSupports": "Handles consent, encrypted transfer and storage, deletion rights and app-store privacy labels for the personal photos the book is made from."}]}, {"step": "Get help fast when the selection or the print disappoints", "description": "Reach a support agent on WhatsApp, e-mail or chat around the clock when a book arrives with the wrong cover photo or a printing flaw, and get a reprint or a refund without a debate. Knowing that PastBook answers every negative Trustpilot review within 48 hours is part of trusting the automatic choice in the first place.", "streamsNeeded": [{"id": "resolve-support-requests-and-reprints", "name": "Resolve Support Requests And Reprints", "howItSupports": "Turns a WhatsApp, e-mail or chat contact into a resolved order change, reprint or refund and a public reply to every negative review within 48 hours."}]}]}, {"id": "jtbd-fmly-3", "name": "Make the yearbook an annual habit for the family", "whatItIs": "Turn the first yearbook into a shelf: a book for every year of the children's lives, a school-year book per child, a calendar for the kitchen and copies for the grandparents, ordered without a fresh decision each time. The job is to make PastBook the family's memory ritual, prompted at the right moment, catching up on missed years and gifting copies, so that the shelf grows every year.", "outcome": "The family orders at least two products a year, the new yearbook is ordered within weeks of the year ending, missing past years are filled in, and grandparents receive their own copies, with the parent spending minutes rather than an evening each time.", "steps": [{"step": "Be reminded when the year closes and the book is ready to make", "description": "Receive a push notification or e-mail in early January and after the summer holiday saying the next yearbook can be made from the photos already on the phone, ideally with a preview of the cover. The reminder has to arrive when the photos are fresh and the calendar is quiet, not in the middle of the Q4 rush.", "streamsNeeded": [{"id": "retain-customers-with-yearbooks-and-reminders", "name": "Retain Customers With Yearbooks And Reminders", "howItSupports": "Sends yearbook and calendar reminders timed to the end of the year and the holidays, reopening the app with the next book suggested."}]}, {"step": "Fill in the missing years from the camera roll", "description": "Go back to the years before the first PastBook order, pick each one in Yearbook mode and let the engine make the books, so the shelf starts at the first child's birth and not at the year the app was discovered. Catch-up orders are often two or three books at once, which changes the price conversation.", "streamsNeeded": [{"id": "import-photos-from-phone-and-cloud", "name": "Import Photos From Phone And Cloud", "howItSupports": "Imports older years from the camera roll by date so past years can be made into books the same way as the current one."}, {"id": "retain-customers-with-yearbooks-and-reminders", "name": "Retain Customers With Yearbooks And Reminders", "howItSupports": "Suggests missing past years and reorders of earlier books from the order history."}]}, {"step": "Add a school-year book per child or a kitchen calendar", "description": "Order a book per child for the school year from an album, or a wall calendar (USD 24.99 small, USD 34.99 large) from the year's best moments as the Year in Review campaign runs in the autumn. Seasonal promotions and free-shipping upgrades decide whether one book becomes two products.", "streamsNeeded": [{"id": "choose-format-price-and-checkout", "name": "Choose Format Price And Checkout", "howItSupports": "Offers calendars and posters next to books, applies the cover rules and extra-page pricing and takes payment in the family's currency."}, {"id": "run-seasonal-campaigns-and-promotions", "name": "Run Seasonal Campaigns And Promotions", "howItSupports": "Runs the Year in Review and holiday campaigns with discounts and upgrade offers that turn a single yearbook into a seasonal order."}]}, {"step": "Gift copies to the grandparents", "description": "Order a second and third copy of the yearbook shipped directly to the grandparents in another city or another country, before Christmas or a birthday, with tracking for each parcel. Multi-copy orders make the price per book and the delivery date the two things she checks.", "streamsNeeded": [{"id": "retain-customers-with-yearbooks-and-reminders", "name": "Retain Customers With Yearbooks And Reminders", "howItSupports": "Makes gifting copies of an existing book to family a one-tap reorder from the account."}, {"id": "produce-ship-and-track-the-order", "name": "Produce Ship And Track The Order", "howItSupports": "Ships each copy to its own address within the published delivery window with separate tracking."}]}, {"step": "Rate the book and recommend PastBook to other parents", "description": "Answer the rating prompt after the book arrives, leave a Trustpilot or App Store review, share the highlight video with the family group chat and pass the app on to other parents at school. The advocacy moment is the book in the hands of a grandparent.", "streamsNeeded": [{"id": "retain-customers-with-yearbooks-and-reminders", "name": "Retain Customers With Yearbooks And Reminders", "howItSupports": "Times rating prompts after delivery and feeds Trustpilot and App Store ratings that other parents rely on."}]}]}], "customerJourneyStories": [{"id": "journey-fmly-1", "name": "From 30,000 camera-roll photos to the first yearbook", "linkedJobIds": ["jtbd-fmly-1", "jtbd-fmly-2"], "summary": "A mother of two in Denver with 30,000 photos on her phone and a half-finished photo-book project in another app adopts PastBook through an App Store feature, from the New Year's resolution that triggers the search to the second yearbook she orders the following January.", "stages": [{"stage": "Trigger", "narrative": "On New Year's Day her phone warns that storage is full, and a photo-book project she started in a template-based app in October still has twelve blank pages. Her eldest is starting school in the autumn and there is no book of the first five years; the thought of another year passing without one is what starts the search."}, {"stage": "Discovery", "narrative": "A featured placement in the App Store for PastBook: 1-Click Photo Book shows a book made in seconds from the camera roll, and a mother in her parents' group posts a photo of her PastBook yearbook with the comment that she did not design a single page. She reads that 10 million books have been created since 2012 and that the app has more than a million downloads."}, {"stage": "Evaluation", "narrative": "She compares PastBook with the template app she abandoned and with Chatbooks' monthly subscription, and decides she wants one hardcover per year, not a subscription. She checks the pricing page (USD 19.99 for 24 pages plus USD 0.40 per page, Large Hardcover USD 34.99), Trustpilot's 4.5 from 35,837 reviews and the privacy wording about encrypted uploads of children's photos, and that PastBook replies to every negative review within 48 hours."}, {"stage": "Trial", "narrative": "She installs the app, grants photo access, picks 2025 in Yearbook mode and watches the preview appear in under a minute with the first day of kindergarten as the cover. She swaps one photo, removes a screenshot that slipped in, chooses the Large Hardcover at 72 pages and pays with PayPal in about eight minutes; the book arrives in Denver six business days after production."}, {"stage": "Engagement", "narrative": "The book lives on the coffee table and is read by the four-year-old until the corners soften. She makes a summer-holiday book from an album in August and orders two copies of the yearbook for both sets of grandparents before Thanksgiving, using a free-shipping upgrade from the Year in Review campaign."}, {"stage": "Retention", "narrative": "The January reminder arrives with the 2026 cover already suggested and she orders within the same evening, then catches up on 2021 and 2022 in one session for the years before she found the app. When Apple's Memories feature offers her a slideshow, it does not compete: what keeps her is a hardcover shelf that grows every January in ten minutes, a price she can predict and a selection she has stopped checking photo by photo."}]}, {"id": "journey-fmly-2", "name": "The Sydney family that stopped editing", "linkedJobIds": ["jtbd-fmly-3", "jtbd-fmly-2"], "summary": "A father of three in Sydney, in PastBook's second-largest market, moves from a spreadsheet of photo folders and a yearly weekend of book design to PastBook after a friend's book, and stays because the selection became good enough to stop checking and the family shelf became an annual ritual with the grandparents in Perth.", "stages": [{"stage": "Trigger", "narrative": "The yearly weekend he used to spend designing a photo book on a laptop has not happened for two years, and the youngest has no book at all. His mother in Perth asks for printed photos of the grandchildren for the third time, and the folder-sorting project on the family computer has become the kind of task nobody starts."}, {"stage": "Discovery", "narrative": "A colleague brings a PastBook Large Hardcover of a Bali holiday to the office and says it took less time than ordering lunch. He finds the app on Google Play, sees the AUD 35.99 starting price and the claim that curation drops duplicates and blurry shots in under 60 seconds, and reads the sustainability page about printing in the customer's country on FSC paper."}, {"stage": "Evaluation", "narrative": "He worries most about control: will the engine leave out the school concert, and can he fix a page without redoing the book. He tests the free preview for 2025 before paying anything, sees the months laid out with dates, and confirms that swapping a photo and adding a caption is possible; the 5 to 10 business day Australian delivery window and PayPal settle the rest."}, {"stage": "Trial", "narrative": "The first book is a 64-page Small Hardcover of 2025 for which he changes eleven photos, mostly to add his wife's shots of the school concert that were not on his phone. He shares the highlight video in the family chat the same evening and the book reaches Sydney within the window."}, {"stage": "Engagement", "narrative": "He puts the concert photos on his own phone before the next book, and the second book, a school-year album per child, needs only three swaps. Reminders after the summer holidays and in January now start the books, and a wall calendar of the grandchildren goes to Perth each December."}, {"stage": "Retention", "narrative": "Three years in, the Perth grandparents own the same yearbooks as the Sydney shelf, and he has stopped opening the editor at all: the January book is a two-minute preview check and an order. What would make him leave is a year where the curation misses a big moment or a book arrives after Christmas; what keeps him is that neither has happened and that Google Photos' on-device highlights never turned into a hardcover his mother can hold."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-fmly-top", "name": "Minutes from opening the app to ordering a book", "description": "Median minutes a family memory keeper spends from opening the PastBook app to a paid yearbook order, covering import, curation, preview, any edits and checkout, measured from app analytics. Modeled seed value for a typical parent ordering a yearbook, not an official PastBook figure.", "unit": "minutes", "currentValue": "14", "targetValue": "6", "link": "https://dashboard.example.com/instant-photo-book-platform/customers/fmly/kpis/co-fmly-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-fmly-co-fmly-top.png", "children": []}, "branches": [{"id": "co-fmly-b1", "name": "Curation the family trusts", "description": "Whether the automatic selection and layout are good enough that the parent accepts the preview at moment level instead of reviewing and repairing photos, which is where most of the minutes go.", "currentValue": "62", "icon": "kpi-fmly-co-fmly-b1.png", "children": [{"id": "co-fmly-b1-c1", "name": "Photo selection acceptance rate", "description": "Share of automatically selected photos that stay in the ordered book without being swapped or removed by the parent.", "unit": "%", "currentValue": "74", "targetValue": "90", "icon": "kpi-fmly-co-fmly-b1-c1.png", "children": [{"id": "co-fmly-b1-c1-l1", "name": "Photos swapped or removed per book", "description": "Average number of photos the parent swaps or removes from the automatic selection before ordering a yearbook.", "unit": "photos per book", "currentValue": "9", "targetValue": "3", "icon": "kpi-fmly-co-fmly-b1-c1-l1.png", "children": []}, {"id": "co-fmly-b1-c1-l2", "name": "Duplicate and blurry photos reaching the preview", "description": "Share of photos in the first preview that the parent flags as a duplicate, near-duplicate or blurry shot the engine should have dropped.", "unit": "% of preview photos", "currentValue": "6", "targetValue": "1.5", "icon": "kpi-fmly-co-fmly-b1-c1-l2.png", "children": []}]}, {"id": "co-fmly-b1-c2", "name": "Preview completed without editing", "description": "Share of yearbook orders placed directly from the automatic preview without opening the editor at all.", "unit": "% of orders", "currentValue": "41", "targetValue": "65", "icon": "kpi-fmly-co-fmly-b1-c2.png", "children": [{"id": "co-fmly-b1-c2-l1", "name": "Months of the year represented in the yearbook", "description": "Share of the twelve months with photos on the phone that appear as at least one moment in the automatically designed yearbook.", "unit": "%", "currentValue": "88", "targetValue": "97", "icon": "kpi-fmly-co-fmly-b1-c2-l1.png", "children": []}, {"id": "co-fmly-b1-c2-l2", "name": "Time to first preview", "description": "Median seconds from selecting the year in Yearbook mode to the first laid-out preview, against the promise of a book in under 60 seconds.", "unit": "seconds", "currentValue": "55", "targetValue": "40", "icon": "kpi-fmly-co-fmly-b1-c2-l2.png", "children": []}]}]}, {"id": "co-fmly-b2", "name": "Effortless order and delivery", "description": "Whether the steps after the preview, choosing the size and pages, paying and receiving the book, are as quick and predictable as the curation, so the whole experience matches the one-click promise.", "currentValue": "70", "icon": "kpi-fmly-co-fmly-b2.png", "children": [{"id": "co-fmly-b2-c1", "name": "Time from preview to paid order", "description": "Median minutes from the first preview to a completed payment, covering format choice, page count, promo codes and checkout.", "unit": "minutes", "currentValue": "9", "targetValue": "3", "icon": "kpi-fmly-co-fmly-b2-c1.png", "children": [{"id": "co-fmly-b2-c1-l1", "name": "Checkout completed in one session", "description": "Share of yearbook checkouts that are completed in the same app session in which the preview was first shown.", "unit": "%", "currentValue": "68", "targetValue": "85", "icon": "kpi-fmly-co-fmly-b2-c1-l1.png", "children": []}, {"id": "co-fmly-b2-c1-l2", "name": "Books abandoned at the price step", "description": "Share of previews that are abandoned on the screen where size, page count and price are shown, before payment.", "unit": "% of previews", "currentValue": "18", "targetValue": "10", "icon": "kpi-fmly-co-fmly-b2-c1-l2.png", "children": []}]}, {"id": "co-fmly-b2-c2", "name": "Delivered within the published window", "description": "Share of family yearbooks delivered within the published window for the destination country after production, for example 4 to 8 business days in the United States.", "unit": "%", "currentValue": "91", "targetValue": "97", "icon": "kpi-fmly-co-fmly-b2-c2.png", "children": [{"id": "co-fmly-b2-c2-l1", "name": "Days from order to delivery in the United States", "description": "Median calendar days from payment to delivery for US family orders, including production and the 4 to 8 business day shipping window.", "unit": "days", "currentValue": "9", "targetValue": "7", "icon": "kpi-fmly-co-fmly-b2-c2-l1.png", "children": []}, {"id": "co-fmly-b2-c2-l2", "name": "Yearbooks reprinted for print defects", "description": "Family yearbooks reprinted because of a print, binding or packaging defect per 1,000 books delivered.", "unit": "per 1,000 books", "currentValue": "12", "targetValue": "5", "icon": "kpi-fmly-co-fmly-b2-c2-l2.png", "children": []}]}]}]}, "businessOutcomes": {"top": {"id": "bo-fmly-top", "name": "Annual revenue from family yearbooks", "description": "Revenue per year from family memory keepers' yearbooks, school-year books, calendars and gift copies, at list prices net of promotions. Modeled seed value for a segment of about 180,000 ordering families at 1.4 books per family and USD 44 per order, not an official PastBook figure; PastBook's reported revenue was USD 14.3 million in 2019 across all segments.", "unit": "USD million per year", "currentValue": "11.1", "targetValue": "21", "link": "https://dashboard.example.com/instant-photo-book-platform/customers/fmly/kpis/bo-fmly-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-fmly-bo-fmly-top.png", "children": []}, "branches": [{"id": "bo-fmly-b1", "name": "Order value and margin per yearbook", "description": "How much each family order is worth and how much of it PastBook keeps after partner print and shipping cost and promotions, driven by pages, format mix and promo discipline.", "currentValue": "64", "icon": "kpi-fmly-bo-fmly-b1.png", "children": [{"id": "bo-fmly-b1-c1", "name": "Average order value per yearbook order", "description": "Average list-price value of a family yearbook order before promotions: at 60 pages a Small Hardcover costs USD 34.39 and a Large Hardcover USD 54.79, so the value depends on pages and format mix.", "unit": "USD", "currentValue": "44", "targetValue": "52", "icon": "kpi-fmly-bo-fmly-b1-c1.png", "children": [{"id": "bo-fmly-b1-c1-l1", "name": "Average pages per yearbook", "description": "Average number of pages in an ordered family yearbook, above the 24-page base that the extra-page price of USD 0.40 or USD 0.55 applies to.", "unit": "pages", "currentValue": "60", "targetValue": "72", "icon": "kpi-fmly-bo-fmly-b1-c1-l1.png", "children": []}, {"id": "bo-fmly-b1-c1-l2", "name": "Large Hardcover share of family orders", "description": "Share of family yearbook orders in the 12 by 8.5 inch Large Hardcover at USD 34.99 plus USD 0.55 per page rather than the Small Hardcover.", "unit": "%", "currentValue": "45", "targetValue": "55", "icon": "kpi-fmly-bo-fmly-b1-c1-l2.png", "children": []}]}, {"id": "bo-fmly-b1-c2", "name": "Gross margin per yearbook order", "description": "Average order value minus the promotion discount and the partner print and shipping cost per family yearbook order.", "unit": "USD", "currentValue": "19", "targetValue": "25", "icon": "kpi-fmly-bo-fmly-b1-c2.png", "children": [{"id": "bo-fmly-b1-c2-l1", "name": "Print and shipping cost per yearbook", "description": "Average partner production and carrier cost per family yearbook order, printed in the customer's country.", "unit": "USD", "currentValue": "21", "targetValue": "23.5", "icon": "kpi-fmly-bo-fmly-b1-c2-l1.png", "children": []}, {"id": "bo-fmly-b1-c2-l2", "name": "Average promotion discount per order", "description": "Average discount and free-shipping value given per family order through promo codes and seasonal campaigns.", "unit": "USD", "currentValue": "4", "targetValue": "3.5", "icon": "kpi-fmly-bo-fmly-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-fmly-b2", "name": "Family repeat and referral engine", "description": "How many families order, how often they come back for the next year, a school-year book or gift copies, and what it costs to win a new family, the core of the annual memory habit.", "currentValue": "58", "icon": "kpi-fmly-bo-fmly-b2.png", "children": [{"id": "bo-fmly-b2-c1", "name": "Books ordered per family per year", "description": "Average number of books, calendars and gift copies ordered per active family per year, the measure of the yearbook habit.", "unit": "books per family", "currentValue": "1.4", "targetValue": "1.9", "icon": "kpi-fmly-bo-fmly-b2-c1.png", "children": [{"id": "bo-fmly-b2-c1-l1", "name": "Families ordering a second book within twelve months", "description": "Share of families that place a second order within twelve months of their first yearbook.", "unit": "%", "currentValue": "38", "targetValue": "55", "icon": "kpi-fmly-bo-fmly-b2-c1-l1.png", "children": []}, {"id": "bo-fmly-b2-c1-l2", "name": "Reminder-driven yearbook orders", "description": "Share of family orders that start from a yearbook or calendar reminder push or e-mail.", "unit": "% of family orders", "currentValue": "24", "targetValue": "40", "icon": "kpi-fmly-bo-fmly-b2-c1-l2.png", "children": []}]}, {"id": "bo-fmly-b2-c2", "name": "Active ordering families", "description": "Number of distinct family memory keeper accounts that place at least one order in the year, new and returning.", "unit": "families per year", "currentValue": "180000", "targetValue": "210000", "icon": "kpi-fmly-bo-fmly-b2-c2.png", "children": [{"id": "bo-fmly-b2-c2-l1", "name": "New families acquired per year", "description": "Number of family memory keepers placing their first order in the year, mostly through paid social, App Store featuring and referrals.", "unit": "families per year", "currentValue": "95000", "targetValue": "100000", "icon": "kpi-fmly-bo-fmly-b2-c2-l1.png", "children": []}, {"id": "bo-fmly-b2-c2-l2", "name": "Family customer acquisition cost", "description": "Blended marketing spend per newly acquired family, to be recovered within the gross margin of the first order.", "unit": "USD", "currentValue": "18", "targetValue": "15", "icon": "kpi-fmly-bo-fmly-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make PastBook the family's memory ritual: every year of the children's lives as a hardcover made in minutes from the phone, with a selection parents have stopped checking, a price they can predict and a shelf that grows each January together with the grandparents' copies.", "timeHorizons": {"year1": {"focus": "Raise the share of parents who order straight from the first preview and come back for a second book, by making Yearbook mode the front door of the app, cutting time to first preview and removing the duplicates and blurry shots that still reach the preview, while the January and post-summer reminders are tuned for families.", "productTheme": "A yearbook from the first preview, in minutes", "customerKPI": {"northStar": "Minutes from opening the app to ordering a book", "supporting": ["Photo selection acceptance rate", "Time to first preview"]}, "businessKPI": {"northStar": "Annual revenue from family yearbooks", "revenueStreams": ["Small Hardcover yearbooks at USD 19.99 for 24 pages plus USD 0.40 per extra page", "Large Hardcover yearbooks at USD 34.99 for 24 pages plus USD 0.55 per extra page", "Gift copies for grandparents with free-shipping upgrade promotions"], "supporting": ["Books ordered per family per year", "Average order value per yearbook order"]}, "milestones": ["Make Yearbook mode the default entry for returning families with the next year pre-selected and its cover previewed in the reminder", "Cut duplicate and blurry photos reaching the preview below two percent through burst detection tuned on children's photos", "Bring US family deliveries inside the 4 to 8 business day window for at least 95 percent of orders through routing to in-country partners"]}, "year3": {"focus": "Turn the yearbook into an annual habit with two or more products per family: curation good enough that most parents never open the editor, school-year books and calendars suggested from the albums already on the phone, and gifting copies to family as a one-tap reorder ahead of the holiday peak.", "productTheme": "The annual memory habit, no editing required", "customerKPI": {"northStar": "Minutes from opening the app to ordering a book", "supporting": ["Preview completed without editing", "Delivered within the published window"]}, "businessKPI": {"northStar": "Annual revenue from family yearbooks", "revenueStreams": ["Yearbooks plus school-year books per child from albums", "Wall calendars at USD 24.99 and USD 34.99 in the Year in Review season", "Multi-copy gift orders shipped directly to grandparents"], "supporting": ["Families ordering a second book within twelve months", "Gross margin per yearbook order"]}, "milestones": ["Reach two thirds of family yearbook orders placed without opening the editor by learning per-family preferences from past swaps", "Launch school-year and holiday book suggestions from album and date patterns with a calendar companion in the same flow", "Make gifting copies to grandparents in another country a one-tap reorder with local production and per-parcel tracking"]}, "year5": {"focus": "Be the default way a family turns its photo stream into printed memories in 150 or more countries: continuous curation that knows the children and the recurring moments, books that assemble themselves as the year unfolds, and a brand promise of privacy, print quality and local FSC production that on-device slideshow features cannot match.", "productTheme": "Memories that print themselves, privately and sustainably", "customerKPI": {"northStar": "Minutes from opening the app to ordering a book", "supporting": ["Photos swapped or removed per book", "Months of the year represented in the yearbook"]}, "businessKPI": {"northStar": "Annual revenue from family yearbooks", "revenueStreams": ["Yearbooks, school-year books and calendars across 150 or more countries with local production", "Family memory shelf reorders and catch-up years from the account history", "Premium personalisation add-ons such as back-cover photos and themed covers"], "supporting": ["Active ordering families", "Family customer acquisition cost"]}, "milestones": ["Assemble the yearbook continuously during the year so the January book is ready to order the moment the year ends", "Recognise recurring family moments and people across years to keep every month and every child represented without edits", "Grow the active family base while lowering acquisition cost through referrals from the highlight video and grandparent copies"]}}}, "domain": "Memory Keepers"}, {"id": "trvl", "name": "Traveller and Milestone Celebrant", "description": "A couple back from three weeks in Japan, newlyweds with a shared folder of guests' photos, a graduate's parents, or new parents at the end of the baby's first year: someone who wants one substantial book of a single event, made while the memory is still fresh, and who will pay for the 12 by 8.5 inch Large Hardcover at USD 34.99 for 24 pages plus USD 0.55 per page rather than the small format. Photos come from more than one place, the phone, a partner's phone, a camera via computer upload, Dropbox or Google Drive, so the web creator on pastbook.com matters as much as the app. This customer edits more than the family yearbook maker: the cover photo, the page order that should follow the itinerary or the ceremony, captions with places and dates, a quote on the first page, and cares intensely about print quality, vivid colour and a hardcover that looks like a gift. The benchmark is not another app but the professional wedding album or the coffee-table travel book, at a price and speed neither can offer.", "icon": "trvl.png", "careAbout": ["Ordering the book within days of coming home or of the ceremony, while the story of the trip or the wedding is still vivid and before the photos sink into a cloud folder", "A Large Hardcover whose colour and sharpness do justice to landscapes, a white dress and a newborn's face, printed on FSC-certified paper at a facility in their own country", "Control where it counts: the cover photo, the order of pages along the itinerary, captions with places and dates, a quote, theme colours and a back-cover photo, without learning a design tool", "Bringing photos from everywhere into one book: the phone, a partner's camera roll, a camera's files on a computer, a Dropbox or Google Drive folder shared with wedding guests", "A price known before the design is finished: a 100-page Large Hardcover is USD 34.99 plus 76 pages at USD 0.55, USD 76.79, and every added page shows in the total", "A delivery window reliable enough to hand the book over at the anniversary dinner, the graduation party or the grandparents' first visit"], "winsThem": ["Curation that finds the best of 2,000 trip photos in under 60 seconds and groups them by day and place, so the itinerary is already the structure of the book", "The highlight video to share with the family group or the wedding guests the same evening, while the book is still in production", "The web creator with upload from computer, Dropbox and Google Drive, so DSLR files and guests' photos land in the same book as the phone pictures", "An editor that starts from a finished design: reorder pages, swap or remove photos, add captions and a quote, choose the cover photo and the back-cover photo add-on", "A reprint or refund when colour or binding disappoints, from a support desk that answers on WhatsApp, e-mail and chat around the clock and replies to every negative Trustpilot review within 48 hours"], "theirFear": ["The book never gets made: the 2,000 photos of the trip or the wedding sit in a shared folder for a year and the plan to print them quietly dies, as it did after the last trip", "A dull, dark or badly cropped print that cheapens the best moment of the year, with the couple's heads cut off on the cover or the pages out of order", "Losing an hour of captions and reordering to a crash before checkout, or the book arriving after the anniversary or graduation party it was meant for"], "jobsToBeDone": [{"id": "jtbd-trvl-1", "name": "Print the trip or milestone as a large hardcover right after the event", "whatItIs": "Turn a single event, three weeks of travel, a wedding weekend, a graduation or a baby's first year, into a Large Hardcover book ordered within days of the event ending, before the energy to make it disappears. The job is to collect photos from several people and devices, let the engine structure the event into days and places, check the preview, choose the format and pages and get the book delivered in time for the moment it is meant for.", "outcome": "A Large Hardcover of the event is ordered within a week of the event ending, with photos from every source in one book, at a page count and price the customer chose knowingly, and delivered within the published window for their country.", "steps": [{"step": "Gather photos from the phone, the camera and the partner", "description": "Import the trip from the camera roll by date and location, add the camera's files from a computer upload or a Dropbox or Google Drive folder, and pull in the partner's or the guests' photos from a shared folder, all over encrypted connections. The friction is that each source has its own path; the job needs them to converge into one indexed set with timestamps and locations.", "streamsNeeded": [{"id": "import-photos-from-phone-and-cloud", "name": "Import Photos From Phone And Cloud", "howItSupports": "Brings the camera roll by date and location, computer uploads and Dropbox or Google Drive folders into one indexed photo set with timestamps and locations."}]}, {"step": "Let the engine pick the best photos and group them by day and place", "description": "Wait under 60 seconds while quality and context analysis scores the photos, near-duplicates of the same temple or the same first dance are collapsed, blurry frames dropped and the rest grouped into moments by time and place. The traveller decides whether the days and places of the trip are all there before caring about individual photos.", "streamsNeeded": [{"id": "curate-the-best-photos-with-ai", "name": "Curate The Best Photos With Ai", "howItSupports": "Scores quality, removes duplicates and blur and groups thousands of event photos into moments by time and place, giving the book its itinerary structure."}]}, {"step": "Preview the book and share the highlight video the same evening", "description": "Look at the automatically designed book with cover, theme colours and dates in the free preview, and share the highlight video with the travel companions or the wedding guests while deciding on the order. Sharing the video is the moment the book becomes a group project rather than a chore for one person.", "streamsNeeded": [{"id": "auto-design-the-book-and-preview", "name": "Auto Design The Book And Preview", "howItSupports": "Lays out the curated moments into a previewable book in under a minute and produces the shareable highlight video."}]}, {"step": "Choose the Large Hardcover and the page count that fits the event", "description": "Choose the 12 by 8.5 inch Large Hardcover at USD 34.99 for 24 pages plus USD 0.55 per page, or the small format for a second copy, see the price change as pages are added or removed, apply a promo code and pay in one of seven currencies. With 80 to 120 pages typical for a trip, the price step is where the customer decides how much of the event to keep.", "streamsNeeded": [{"id": "choose-format-price-and-checkout", "name": "Choose Format Price And Checkout", "howItSupports": "Offers the two hardcover sizes, cover rules by page count, extra-page pricing, promo codes and payment in seven currencies, and turns the design into a paid order."}]}, {"step": "Follow production and delivery until the book is in hand", "description": "See production start on payment, the job routed to a partner facility in the destination country, and the parcel tracked through the published window: 4 to 8 business days in the United States, 4 to 5 in the United Kingdom, 5 to 10 in Canada and Australia. The customer wants one date to plan the dinner or the party around.", "streamsNeeded": [{"id": "render-print-ready-files-and-route-to-a-printer", "name": "Render Print Ready Files And Route To A Printer", "howItSupports": "Renders and preflights the large-format print file and routes it to the nearest partner with capacity so production starts as soon as payment clears."}, {"id": "produce-ship-and-track-the-order", "name": "Produce Ship And Track The Order", "howItSupports": "Produces, packs, ships and tracks the book within the published delivery window for the destination country."}]}]}, {"id": "jtbd-trvl-2", "name": "Personalise cover, order and captions without learning a design tool", "whatItIs": "Make the automatically designed book feel like the customer's own, with the right cover photo, pages in the order the event happened, captions naming the places and the people, a quote on the first page and colours that suit the occasion, without templates, grids or the hour-long tutorials of a full design tool. The job is to edit on top of a finished book, changing only what matters, and to confirm the finished design before paying.", "outcome": "The customer changes the cover, the order of a few pages and a dozen captions in well under half an hour, on the phone or in the web creator, without losing work, and pays for a book that reads as their story rather than the engine's.", "steps": [{"step": "Start from the automatic design, never from a blank page", "description": "Open the book the engine designed and treat it as the first draft: the moments, the layouts and the dates are already there, so the customer looks for what to change rather than what to build. This is the difference from Mixbook or a professional album tool, and the reason a wedding book can be finished in an evening.", "streamsNeeded": [{"id": "auto-design-the-book-and-preview", "name": "Auto Design The Book And Preview", "howItSupports": "Delivers the laid-out first draft with moments, layouts and dates that all personalisation builds on."}]}, {"step": "Choose the cover photo, the title, a quote and the theme colours", "description": "Pick the one photo that carries the event for the cover, add a title and a quote for the first page, set theme colours that suit a wedding or a mountain trip, and add the back-cover photo add-on. These four choices are what make the book recognisably theirs and are where most customers spend their editing time.", "streamsNeeded": [{"id": "edit-and-personalise-the-book", "name": "Edit And Personalise The Book", "howItSupports": "Provides cover photo choice, theme colours, quote and title, and the back-cover photo add-on on top of the automatic design."}]}, {"step": "Reorder pages along the itinerary and swap the photos that matter", "description": "Move a page so that the arrival in Kyoto comes before the temples, swap the group photo for the one where everyone has their eyes open, remove the picture of the hotel breakfast. Edits must be reversible and saved as they happen, on the phone and on the web, because an hour of reordering lost to a crash ends the project.", "streamsNeeded": [{"id": "edit-and-personalise-the-book", "name": "Edit And Personalise The Book", "howItSupports": "Lets the customer reorder pages, swap and remove photos with edits saved continuously across app and web creator."}]}, {"step": "Add captions with places, dates and names", "description": "Write captions naming the town, the day and the people, using the dates and locations the engine already attached to each moment as a starting point, so the book can be read by someone who was not there. Suggested place and date captions cut the typing to the personal part.", "streamsNeeded": [{"id": "edit-and-personalise-the-book", "name": "Edit And Personalise The Book", "howItSupports": "Adds and edits captions on pages and moments inside the finished design."}, {"id": "curate-the-best-photos-with-ai", "name": "Curate The Best Photos With Ai", "howItSupports": "Supplies the time and place metadata of each moment that seeds place and date captions."}]}, {"step": "Confirm the finished design and see how the edits changed the price", "description": "Review the final book once more, see the page count and price after pages were added or removed, and pay knowing that what is on the screen is what will be printed. Any last cover-rule change, for example a book that grew past 26 pages becoming hardcover by default, has to be visible here and not at delivery.", "streamsNeeded": [{"id": "choose-format-price-and-checkout", "name": "Choose Format Price And Checkout", "howItSupports": "Shows the updated page count, cover rule and price after editing and completes payment for the finished design."}]}]}, {"id": "jtbd-trvl-3", "name": "Get a book whose print quality matches the moment", "whatItIs": "Receive a Large Hardcover whose colour, sharpness, binding and packaging live up to a wedding, a once-in-a-decade trip or a first year, and be protected when they do not. The job spans choosing the format that shows the photos best, having weak photos flagged before they are printed, production at a partner in the customer's country on FSC paper, careful shipping, and a fast reprint when something is wrong.", "outcome": "The book arrives within the window, without print, binding or transport defects, with colours the customer recognises from the screen and no low-resolution photo printed large, and any defect is corrected with a reprint within days rather than a debate.", "steps": [{"step": "Choose the format that shows the photos best", "description": "Decide on the 12 by 8.5 inch Large Hardcover for landscapes and group photos, understand the cover rules by page count and what more pages cost, and see how a photo will look at full-page size before ordering. The customer is willing to pay for the large format if the difference is visible in the preview.", "streamsNeeded": [{"id": "choose-format-price-and-checkout", "name": "Choose Format Price And Checkout", "howItSupports": "Explains the two sizes, cover rules and extra-page pricing so the customer can choose the format that does justice to the photos."}]}, {"step": "Have low-resolution and blurry photos flagged before they are printed", "description": "Rely on the quality scoring to keep blurry frames out, and on preflight to warn when a photo pulled from a messaging app or a guest's shared folder is too small to print across a large page. The warning must come in the editor, with a suggestion to swap, not as a disappointing page in the finished book.", "streamsNeeded": [{"id": "curate-the-best-photos-with-ai", "name": "Curate The Best Photos With Ai", "howItSupports": "Scores blur, exposure and resolution so weak photos are excluded from the selection or flagged where they are placed large."}, {"id": "render-print-ready-files-and-route-to-a-printer", "name": "Render Print Ready Files And Route To A Printer", "howItSupports": "Preflights the print-ready file for resolution, bleed and colour problems before the job is released to a partner."}]}, {"step": "Have the book produced by a trusted partner in my country on FSC paper", "description": "Know that the book is printed at a partner facility close to home, on FSC-certified paper, by a network that is audited for defects and colour consistency, which also cuts shipping distance and emissions. The customer does not see the partner but sees the result, so consistency across the four continents is the whole point.", "streamsNeeded": [{"id": "render-print-ready-files-and-route-to-a-printer", "name": "Render Print Ready Files And Route To A Printer", "howItSupports": "Routes the job to the nearest partner facility with capacity and a quality record for large-format hardcovers."}, {"id": "manage-the-global-print-partner-network", "name": "Manage The Global Print Partner Network", "howItSupports": "Sets and audits partner SLAs, print quality, reprint root causes and FSC paper so the book looks the same whether it is printed in the US, the EU or Australia."}]}, {"step": "Receive the book well packed and on time", "description": "Get the hardcover packed to survive the carrier, shipped with tracking and delivered within the window published for the country, so it can be given at the anniversary dinner or the graduation party. A corner crushed in transit counts as a quality failure to this customer, whoever caused it.", "streamsNeeded": [{"id": "produce-ship-and-track-the-order", "name": "Produce Ship And Track The Order", "howItSupports": "Packs, ships and tracks the parcel within the published window and exposes the status to the customer."}]}, {"step": "Get a reprint or refund quickly when colour or binding disappoints", "description": "Send a photo of the defect over WhatsApp, e-mail or chat and get a reprint started or a refund issued without a debate, with the root cause fed back to the partner. PastBook's promise to reply to every negative Trustpilot review within 48 hours is what makes the premium format feel safe to buy.", "streamsNeeded": [{"id": "resolve-support-requests-and-reprints", "name": "Resolve Support Requests And Reprints", "howItSupports": "Turns a quality complaint into a reprint or refund and a public reply within 48 hours, and records the reprint case for partner follow-up."}]}]}], "customerJourneyStories": [{"id": "journey-trvl-1", "name": "Three weeks in Japan, one Large Hardcover before the jet lag wears off", "linkedJobIds": ["jtbd-trvl-1", "jtbd-trvl-3"], "summary": "A couple from Toronto with 2,400 photos across two phones and a mirrorless camera adopt PastBook for their Japan trip after two earlier trips never became books, from the flight home where the idea starts to the anniversary a year later when the second book is ordered without hesitation.", "stages": [{"stage": "Trigger", "narrative": "On the flight home from Osaka they scroll through 2,400 photos on two phones and a camera and admit that the Portugal and Iceland trips never became the books they promised themselves. This time the book has to be ordered before work starts on Monday, or it will not happen."}, {"stage": "Discovery", "narrative": "A friend's Instagram story shows a PastBook Large Hardcover of Vietnam with the caption that it made itself in a minute, and a search for photo book apps surfaces PastBook: 1-Click Photo Book with an App Store feature and 1 million downloads. The pastbook.com page explains that computer, Dropbox and Google Drive uploads are possible next to the camera roll."}, {"stage": "Evaluation", "narrative": "They compare PastBook with Mixbook and with Google Photos books: Mixbook means an evening of layouts, Google Photos books stop at 140 pages and a 9-inch hardcover, and neither ships to Canada as easily. They check the Large Hardcover price of CAD 51.99 for 24 pages plus extra pages, the 5 to 10 business day Canadian delivery window, Trustpilot's 4.5 from 35,837 reviews and that the camera files can be added from the laptop."}, {"stage": "Trial", "narrative": "She imports her camera roll by date on the phone while he uploads the camera folder through Google Drive in the web creator; the engine groups 2,400 photos into 21 days and 112 pages in under a minute. They reorder three pages so Kyoto follows Tokyo, swap the cover for the Fushimi Inari photo, order the Large Hardcover on Sunday evening and share the highlight video with the family that night; the book arrives in Toronto within the window."}, {"stage": "Engagement", "narrative": "The book sits on the coffee table and is the first thing they show visitors. A folded poster of the same Fushimi Inari photo follows, and the highlight video prompts her sister to make a PastBook of her own honeymoon; when a page shows a slight colour cast on one spread, support on chat arranges a reprint within two days."}, {"stage": "Retention", "narrative": "The following spring the Mexico trip becomes a book on the flight home, before the luggage is unpacked, and the Japan book gets a second copy for his parents for their anniversary. What keeps them is that the reprint was painless, that the large format looks like a bookshop travel book, and that the week-after-the-trip window has become a habit; a cheaper competitor with a design tool would cost them the one thing they lack, an evening."}]}, {"id": "journey-trvl-2", "name": "The wedding book the couple made themselves in one evening", "linkedJobIds": ["jtbd-trvl-2", "jtbd-trvl-3"], "summary": "Newlyweds in Manchester with a photographer's gallery, a Dropbox folder of 900 guest photos and a professional album quote of GBP 600 adopt PastBook's web creator to make their own wedding book within a fortnight of the day, and stay for the first-year baby book, the parents' copies and the anniversary reprint.", "stages": [{"stage": "Trigger", "narrative": "Two weeks after the wedding the photographer's gallery is live, a Dropbox folder of guests' phone photos has grown to 900 files and the quoted professional album costs GBP 600 with a twelve-week lead time. Both sets of parents are asking for something to hold, and the couple want the guests' candid photos in it, which the album would not include."}, {"stage": "Discovery", "narrative": "A bridesmaid mentions that her holiday book came from PastBook and was done in seconds; a search for wedding photo book online surfaces pastbook.com, where the photo book from computer, Dropbox or Google Drive flow explains that a Dropbox folder can be turned into a book with curation in 60 seconds. The Trustpilot page with 79% five-star reviews and the GQ gift guide mention reassure a sceptical groom."}, {"stage": "Evaluation", "narrative": "The bride worries about control: the cover must be their photo, the ceremony must come before the speeches and the captions must name the people. She tests the free preview from the Dropbox folder before paying, confirms in the editor that pages can be reordered and captioned and a quote added, and checks the Large Hardcover at GBP 27.99 plus extra pages, the 4 to 5 business day UK delivery window and that three copies can be ordered in one go."}, {"stage": "Trial", "narrative": "On a Tuesday evening they upload the photographer's selection and the Dropbox folder in the web creator, the engine groups the day into getting ready, ceremony, portraits, speeches and dancing, and the preview is ready before the tea has cooled. They spend forty minutes on the cover, the order of two spreads, a dozen captions and the vows as the opening quote, and preflight flags two guest photos as too small for a full page, which they swap; the 96-page book and two smaller copies for the parents are ordered together."}, {"stage": "Engagement", "narrative": "The three books arrive in Manchester within the week and the parents' copies go out at Sunday lunch. The couple share the highlight video with the guests, order a rolled poster of the portrait for the hallway, and when their first child is born the following year the first-year book is started in the app in Yearbook mode from the day she comes home."}, {"stage": "Retention", "narrative": "On the first anniversary a reprint of the wedding book, with six pages added from a guest's late photos, goes to the grandparents in Ireland. They stay because the wedding book they made in one evening is the one everyone reaches for rather than the album they never ordered, because the editor gave them exactly the control they wanted and no more, and because every book since has arrived within the UK window; the moment they would leave is a first-year book whose colours disappoint, and so far it has not come."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-trvl-top", "name": "Days from event end to book ordered", "description": "Median calendar days between the end of the trip, wedding or milestone, taken from the last photo date in the imported set, and the paid ord
