arents and travel companions", "Folded and rolled posters at USD 29.99 and USD 39.99 as order add-ons"], "supporting": ["Preview to paid order conversion for milestone books", "Average order value per milestone book"]}, "milestones": ["Bring computer, Dropbox and Google Drive upload completion in the web creator above 95 percent with resumable uploads and clear progress", "Flag low-resolution and blurry photos placed large in the editor with a one-tap swap before preflight", "Offer the Large Hardcover upgrade with a free-shipping incentive at the price step for event books above 60 pages"]}, "year3": {"focus": "Make personalisation fast enough to finish in one evening: page order that follows the itinerary or the ceremony automatically, suggested place and date captions, edits saved continuously across phone and web, and shared event books where guests' photos flow into the couple's draft, so more previews become orders and fewer are abandoned in the editor.", "productTheme": "Personalised in an evening, never lost, shared with the guests", "customerKPI": {"northStar": "Days from event end to book ordered", "supporting": ["Days from event end to first preview", "Editing time before checkout"]}, "businessKPI": {"northStar": "Annual revenue from travel and milestone books", "revenueStreams": ["Large Hardcover event books with a growing page count and back-cover photo add-ons", "Multi-copy orders for parents, guests and travel companions", "Web creator orders from shared event folders on Dropbox and Google Drive"], "supporting": ["Gross margin per milestone book", "Web creator orders with computer or cloud upload"]}, "milestones": ["Order pages automatically along the itinerary or the day's programme from time and place metadata, with suggested captions the customer only edits", "Save every edit continuously across the app and the web creator so that no editing session is lost to a crash or a device switch", "Launch shared event books where guests contribute photos into the couple's draft and order their own copies"]}, "year5": {"focus": "Be the default printed outcome of any trip or milestone in 150 or more countries: the book proposed on the flight home from the photos already taken, colour-managed printing consistent across a partner network run as a utility, and a sustainability and quality promise that makes the professional album the exception rather than the benchmark.", "productTheme": "The book is ready when the trip ends", "customerKPI": {"northStar": "Days from event end to book ordered", "supporting": ["Low-resolution photos flagged before print", "Edits lost to crashes or sync failures"]}, "businessKPI": {"northStar": "Annual revenue from travel and milestone books", "revenueStreams": ["Large Hardcover event books across 150 or more countries with local FSC production", "Anniversary reprints and extended editions of past event books", "Premium personalisation and poster add-ons attached to event orders"], "supporting": ["Milestone books ordered per year", "Back-cover photo and poster add-on attach rate"]}, "milestones": ["Propose the finished event book from the photos taken as soon as the trip or the celebration ends, on the flight home", "Run colour-managed, audited large-format production across the partner network so the same book looks identical printed in the US, the EU or Australia", "Grow milestone orders through anniversary reprints, extended editions and guest copies from shared event books"]}}}, "domain": "Memory Keepers"}, {"id": "sclk", "name": "Facebook Timeline Archivist", "description": "Someone in their fifties or sixties, most often in the United States or Australia, who has lived 10 to 15 years of family life on Facebook: albums from holidays and birthdays, timeline pictures friends tagged, mobile uploads from the phone and a decade of cover and profile photos. Uses the Facebook Photo Books flow on pastbook.com rather than the app, logs in with Facebook, picks a single year between 2009 and 2025 and expects the book to arrive with the original captions and dates so that \"my 2016\" reads like a diary. Less technical and price-sensitive: the small hardcover at USD 19.99 for 24 pages is the default, the large 12\" x 8.5\" format is for a special year, and a promo code usually decides when the next year gets ordered. Used to print Instagram years too and was cut off when Instagram discontinued third-party access for personal accounts, so trust that Facebook stays available and that photos are handled privately weighs as much as price.", "icon": "sclk.png", "careAbout": ["One click from Facebook Login to a finished book of a whole year, with the captions and dates Facebook already holds carried onto the pages", "A free preview before paying, because the small hardcover at USD 19.99 is bought on a fixed income and the page count decides the price", "Clear, plain-language explanation of what PastBook takes from Facebook, that photos travel over encrypted connections and that nothing is kept longer than the order needs", "Every year from 2009 to 2025 available so that the shelf can be completed year by year, in the same size and cover so the spines line up", "Books that print the grandchildren's faces sharply from Facebook-sized photos, without blurry duplicates the AI should have dropped", "Support that answers by e-mail or WhatsApp without jargon when Facebook Login asks for a permission they do not understand"], "winsThem": ["The Facebook Photo Books page that shows the book of a year being built from albums, timeline pictures, cover and profile photos while they watch", "Trustpilot 4.5 from 35,837 reviews with 79 percent five-star, and a reply from PastBook under every negative review, which reads as a company that answers", "A discount code or free hardcover upgrade in the Year in Review campaign that turns \"one day\" into \"order 2016 tonight\"", "A help center article that explains the Facebook permission screen step by step and the honest notice about Instagram ending support for photo products", "The first book arriving within the published US window of 4 to 8 business days with the captions exactly as they were written years ago"], "theirFear": ["Granting Facebook Login and discovering that PastBook, or Meta, has more of their photos than they meant to share, or that the connection breaks as Instagram did", "Paying for a book whose captions are missing, whose photos are low-resolution or whose pages are padded with near-duplicates, and having nobody to call", "Losing the Facebook years altogether if the account is closed or the photos are gone before they are printed"], "jobsToBeDone": [{"id": "jtbd-sclk-1", "name": "Print a whole Facebook year with captions in one click", "whatItIs": "Turn one calendar year of a Facebook life, spread over albums, timeline pictures, cover and profile photos and mobile uploads, into a printed hardcover without selecting photos or designing pages. The job includes granting Facebook Login, picking the year, letting the curation engine drop duplicates and blurry shots while keeping the captions and dates, checking the free preview and paying for a book that matches the years already on the shelf.", "outcome": "A finished hardcover of the chosen year, with captions and dates preserved and no duplicate or blurry photos, previewed for free in under a minute, ordered at a price the archivist understood before checkout and delivered within the published window for their country.", "steps": [{"step": "Log in with Facebook and understand the permission screen", "description": "On pastbook.com the archivist opens Facebook Photo Books, signs in with Facebook and is asked which photo permissions to grant. The step succeeds when the permission request is explained in plain words, covers albums, timeline pictures, cover and profile photos and mobile uploads within the scope Meta allows, and the archivist knows the photos are imported over an encrypted connection.", "streamsNeeded": [{"id": "connect-facebook-and-pick-a-year", "name": "Connect Facebook And Pick A Year", "howItSupports": "Runs Facebook Login and requests the photo permissions Meta allows, then lists the albums, timeline pictures and profile photos it can read."}, {"id": "protect-photo-privacy-and-platform-compliance", "name": "Protect Photo Privacy And Platform Compliance", "howItSupports": "Explains what is imported and for how long it is kept, and keeps the Facebook connection inside Meta platform terms."}]}, {"step": "Pick the year to print", "description": "Photos are grouped per year from 2009 to 2025 and the archivist chooses the one that is missing from the shelf, sees how many photos it holds and whether it is a thin year that will fit the 24-page small hardcover or a rich year that will run to 60 pages.", "streamsNeeded": [{"id": "connect-facebook-and-pick-a-year", "name": "Connect Facebook And Pick A Year", "howItSupports": "Groups the imported Facebook photos by year and shows the photo count per year so the archivist can estimate the size of the book."}]}, {"step": "Let the engine choose the best photos and keep the captions", "description": "The curation engine scores quality, removes duplicates and blurry shots and groups the year into moments in under 60 seconds. For a Facebook year the captions and posting dates are the point of the book, so they must survive selection and land next to the photo they belonged to.", "streamsNeeded": [{"id": "curate-the-best-photos-with-ai", "name": "Curate The Best Photos With Ai", "howItSupports": "Analyses image quality and context, removes duplicates and near-duplicates and groups the year into moments while keeping the Facebook captions attached."}, {"id": "auto-design-the-book-and-preview", "name": "Auto Design The Book And Preview", "howItSupports": "Lays out the moments with the captions and dates as page text and produces the free preview in under a minute."}]}, {"step": "Check the preview and fix only what matters", "description": "The archivist flips through the preview, changes the cover photo to the grandchild's birthday and corrects one caption that Facebook auto-tagged wrongly, but does not want to learn an editor. Anything more than a few clicks and the book is abandoned.", "streamsNeeded": [{"id": "auto-design-the-book-and-preview", "name": "Auto Design The Book And Preview", "howItSupports": "Shows the complete book for free so the decision to buy is made on the actual pages."}, {"id": "edit-and-personalise-the-book", "name": "Edit And Personalise The Book", "howItSupports": "Lets the archivist swap the cover photo, remove a photo and edit a caption without leaving the automatic layout."}]}, {"step": "Choose the size and pay a price understood in advance", "description": "The archivist compares the small hardcover at USD 19.99 for 24 pages plus USD 0.40 per extra page with the large at USD 34.99 plus USD 0.55, applies the promo code from the campaign e-mail, and pays with a card or PayPal in their own currency.", "streamsNeeded": [{"id": "choose-format-price-and-checkout", "name": "Choose Format Price And Checkout", "howItSupports": "Applies the cover rules by page count, extra-page pricing, promo codes and the seven currencies, and takes payment by Visa, Mastercard, American Express or PayPal."}]}, {"step": "Receive the book and see that it matches the shelf", "description": "Production starts on payment, the book is printed in the archivist's country where possible and delivered within the published window, for example 4 to 8 business days in the United States or 5 to 10 in Australia. The archivist compares spine, size and cover with the earlier years.", "streamsNeeded": [{"id": "produce-ship-and-track-the-order", "name": "Produce Ship And Track The Order", "howItSupports": "Produces, ships and tracks the book within the published delivery window and keeps the archivist informed with tracking updates."}]}]}, {"id": "jtbd-sclk-2", "name": "Keep my photos safe and private while the book is made", "whatItIs": "Be certain that connecting Facebook to PastBook does not expose family photos, including grandchildren, to anyone beyond the print job. The job covers understanding the permission screen, knowing where the photos go and for how long, being able to disconnect and delete, and getting a human answer when a permission request or a platform change such as the end of Instagram support raises doubts.", "outcome": "The archivist connects Facebook knowing exactly which photos are read and why, the photos are transferred and stored encrypted only for as long as the order needs, disconnection and deletion work on request within the legal deadlines, and no privacy question stays unanswered for more than a day.", "steps": [{"step": "Understand what is asked before connecting", "description": "Before clicking Continue with Facebook the archivist wants to know why PastBook asks for photo permissions, that it reads but does not post, and what happens to the photos after the book is printed. A help center article and a sentence on the permission screen do this job.", "streamsNeeded": [{"id": "protect-photo-privacy-and-platform-compliance", "name": "Protect Photo Privacy And Platform Compliance", "howItSupports": "Provides the consent explanation, the privacy notice and the retention rules that the permission screen and help center repeat."}, {"id": "connect-facebook-and-pick-a-year", "name": "Connect Facebook And Pick A Year", "howItSupports": "Requests only the permission scope Meta allows for photo books and shows the archivist which sources will be read."}]}, {"step": "Import over an encrypted connection and keep photos only for the order", "description": "Photos are imported over encrypted connections, stored for the book project and the print job, and not retained beyond the order without the archivist's choice to keep the project for reorders.", "streamsNeeded": [{"id": "protect-photo-privacy-and-platform-compliance", "name": "Protect Photo Privacy And Platform Compliance", "howItSupports": "Enforces encrypted transfer and storage, retention limits after delivery and the Meta platform terms on Facebook data."}]}, {"step": "Disconnect or delete when I want to", "description": "After the book has arrived the archivist may want to disconnect Facebook or ask PastBook to delete the photos and the account. Under GDPR and CCPA this must work through the account or a single e-mail, with confirmation.", "streamsNeeded": [{"id": "protect-photo-privacy-and-platform-compliance", "name": "Protect Photo Privacy And Platform Compliance", "howItSupports": "Handles GDPR and CCPA rights requests, disconnects the Facebook source and deletes photos, book projects and the account on request."}, {"id": "resolve-support-requests-and-reprints", "name": "Resolve Support Requests And Reprints", "howItSupports": "Turns an e-mail or WhatsApp request into a confirmed deletion with a written answer the archivist can keep."}]}, {"step": "Get a straight answer when a platform changes the rules", "description": "When Instagram ended support for third-party photo products the archivist lost a source overnight; the same could happen to a Facebook permission. The archivist wants a plain notice about what changed, what still works and what to do with the years not yet printed.", "streamsNeeded": [{"id": "protect-photo-privacy-and-platform-compliance", "name": "Protect Photo Privacy And Platform Compliance", "howItSupports": "Tracks Meta platform and app review changes and publishes what they mean for customers, as with the Instagram notice."}, {"id": "retain-customers-with-yearbooks-and-reminders", "name": "Retain Customers With Yearbooks And Reminders", "howItSupports": "Points the archivist to Facebook, the app or manual upload so the unprinted years are not lost when a source disappears."}]}]}, {"id": "jtbd-sclk-3", "name": "Reorder past years and gift copies to family", "whatItIs": "Complete the shelf year by year and share it: reorder a year printed before in the same size, print the next missing year, and send extra copies of a wedding or a grandchild's first year to children and siblings in another city or country, ideally with a discount and without re-doing the book.", "outcome": "Every past book can be reordered from the account in a few clicks, extra copies ship to family addresses in other countries within their published delivery windows, and the archivist orders at least one more Facebook year within twelve months of the first.", "steps": [{"step": "Find the past books in my account", "description": "The archivist logs in and sees the books already made, by year, with the format and page count, so a reorder or a copy for a sibling starts from the finished book rather than from Facebook again.", "streamsNeeded": [{"id": "retain-customers-with-yearbooks-and-reminders", "name": "Retain Customers With Yearbooks And Reminders", "howItSupports": "Keeps the past book projects and orders available for reorders and shows which years of 2009 to 2025 are still missing."}, {"id": "choose-format-price-and-checkout", "name": "Choose Format Price And Checkout", "howItSupports": "Reorders a saved book in the same format and cover, or upgrades a copy to the large hardcover as a gift."}]}, {"step": "Pick the next missing year", "description": "A reminder in January, or a memory that pops up on Facebook, prompts the archivist to print the next year. The Facebook connection is re-used if it is still valid or re-authorised in one step.", "streamsNeeded": [{"id": "connect-facebook-and-pick-a-year", "name": "Connect Facebook And Pick A Year", "howItSupports": "Re-uses or refreshes the Facebook connection and offers the years not yet printed."}, {"id": "retain-customers-with-yearbooks-and-reminders", "name": "Retain Customers With Yearbooks And Reminders", "howItSupports": "Sends yearbook reminders that name the missing years and the current promotion."}]}, {"step": "Send copies to family in other countries", "description": " Resolve Support Requests And Reprints", "howItSupports": "Resolves a damaged or lost copy with a reprint or refund through WhatsApp, e-mail or chat, 24/7."}]}]}], "customerJourneyStories": [{"id": "journey-sclk-1", "name": "From the Instagram dead end to a shelf of Facebook years", "linkedJobIds": ["jtbd-sclk-1", "jtbd-sclk-2"], "summary": "A retired teacher in Ohio, 61, who had printed two Instagram years with PastBook and lost that source when Instagram discontinued third-party access, rediscovers PastBook through the Facebook Photo Books flow, tests it on 2016 and ends up printing every year since 2009.", "stages": [{"stage": "Trigger", "narrative": "Facebook shows her a memory from 2016, a beach week with all three grandchildren, and she realises that fifteen years of family photos exist only on Facebook. Her earlier attempt to keep printing Instagram years had ended with the notice that Instagram no longer supports third-party photo products, and she has not printed anything since."}, {"stage": "Discovery", "narrative": "Her sister posts a photo of a small hardcover with the year 2019 on the spine and says it took one click from Facebook. Searching for it, she lands on pastbook.com, sees the Facebook Photo Books page with albums, timeline pictures and profile photos being turned into a book, and recognises the company from her Instagram books."}, {"stage": "Evaluation", "narrative": "She reads the help center article about the Facebook permission screen and the Instagram notice, which tells her honestly what changed and what still works. She checks Trustpilot, 4.5 from 35,837 reviews with PastBook replying under the negative ones, compares USD 19.99 for 24 pages with a Shutterfly book she once paid twice as much for, and decides that the free preview means she risks nothing."}, {"stage": "Trial", "narrative": "She logs in with Facebook, picks 2016 and watches the book build in under a minute with the captions she wrote at the time. She changes the cover to the ping to 150+ countries."}, {"stage": "Evaluation", "narrative": "She compares having the book reprinted locally in Australia and posting it herself with PastBook shipping a copy to each address, and checks the delivery windows: 4 to 5 business days in the UK, 5 to 10 in Canada, prices in GBP and CAD. The promotion covers reorders, which settles it."}, {"stage": "Trial", "narrative": "She orders two copies of 2012 to two countries in one checkout, upgrades her daughter's to the large hardcover, and follows both parcels from the same order page. The London copy arrives first and the photo of the book on her daughter's shelf arrives on the family chat before the Toronto tracking says delivered."}, {"stage": "Engagement", "narrative": "Her children now send her their own Facebook years to print, and she orders 2013 and 2014 for herself when the January reminder arrives. She has become the person in the family who knows which years exist, in which size and who has which copy, all visible in her order history."}, {"stage": "Retention", "narrative": "She keeps ordering from PastBook because the family's books must match across three countries, the reorder starts from the finished book instead of from Facebook, and every parcel so far has arrived inside the window PastBook published. When her son asks whether the photos are safe, she forwards the help center article she read herself."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-sclk-top", "name": "Facebook books completed per connected account", "description": "Printed Facebook Photo Books ordered per account that connected Facebook in the last twelve months: the product of import completion, preview-to-order conversion and repeat years per buyer. Modeled seed value, not an official PastBook figure; with 71 percent of connections completing an import, 18 percent of previews ordered and repeat buyers adding about two more years, the value is about 0.21 books per connected account.", "unit": "books per connect nished book, copies to family in other countries and a privacy posture that archivists quote to each other.", "productTheme": "Complete the shelf, year after year", "customerKPI": {"northStar": "Facebook books completed per connected account", "supporting": ["Repeat yearbook rate", "Yearbook reminders leading to a new Facebook year order"]}, "businessKPI": {"northStar": "Annual gross margin from Facebook Photo Books", "revenueStreams": ["Facebook year books with a rising share of returning archivists", "Gift copies of printed years shipped to 150+ countries", "Seasonal promotions and gift cards redeemed on Facebook books"], "supporting": ["Orders from returning archivists", "Gross margin per Facebook book"]}, "milestones": ["Show the missing years of 2009 to 2025 in the account and in yearbook reminders, with one-click start for the next year", "Ship multi-address orders so that one checkout sends copies of a year to family in the UK, Canada and Australia within each country's window", "Publish a plain-language data page on what PastBook keeps from Facebook and for how long, and confirm every deletion request within 30 days"]}, "year5": {"focus": "Be the default archive-to-print service for any social timeline that allows it, resilient to platform changes: when a source closes, as Instagram did, the archivist's years are already safe in a PastBook account and can still be printed from the app or a cloud drive.", "productTheme": "A social life printed, whatever the platform decides", "customerKPI": {"northStar": "Facebook books completed per connected account", "supporting": ["Privacy and permission questions per 100 Facebook orders", "Past years reordered or sent as extra copies"]}, "businessKPI": {"northStar": "Annual gross margin from Facebook Photo Books", "revenueStreams": ["Year books from Facebook and any newly permitted social or cloud source", "Family gift copies and reorders of archived years", "Large-format upgrades of special years"], "supporting": ["Acquisition cost per new Facebook archivist", "Facebook archivists acquired through organic and referral"]}, "milestones": ["Keep every archivist's book projects reprintable from the account even if the Facebook connection or permission is withdrawn", "Add each new source Meta or a cloud provider permits within one quarter of the policy allowing it, with the same year picker", "Reach a majority of new Facebook archivists through referral, shared highlight videos and family gift copies rather than paid ads"]}}}, "domain": "Memory Keepers"}, {"id": "gftr", "name": "Seasonal Gift Giver", "description": "A daughter, son or partner between 30 and 55, mostly in the United States, who buys PastBook products as presents rather than for themselves: a Year in Review book of the grandchildren for the parents at Christmas, a wall calendar for the grandparents' kitchen, a rolled poster of the wedding for a partner's birthday, or a gift card when the photos live on someone else's phone. Orders are decided by a date, Christmas, Mother's Day or a birthday, and by a discount or free hardcover upgrade that arrives at the right moment, so the same person may spend USD 34.99 on a large hardcover in November and USD 24.99 on a small calendar in April. Cares most that the parcel arrives before the occasion, that the published delivery windows are honest and that tracking works, because a late gift is worse than no gift.", "icon": "gftr.png", "careAbout": ["A clear order-by date per country for Christmas and Mother's Day, worked back from production time plus the published delivery window, for example 4 to 8 business days in the United States", "A gift that looks personal without an afternoon of design: the Year in Review book or calendar built in under 60 seconds from the phone, with a dedication on the cover", "Choosing the right product and size for the recipient, from the small hardcover at USD 19.99 to the large calendar at USD 34.99 or a rolled poster at USD 39.99, with the price known before checkout", "Discounts and free-shipping upgrades that land in time for the occasion, and a promo code that works on the whole basket, including calendars and posters", "Tracking for a parcel that ships to the recipient's address rather than their own, with a warning early enough to reorder or send a gift card instead", "A fallback when there are no photos: a gift card in the recipient's currency or an album the family can fill together"], "winsThem": ["PastBook in the GQ gift guide and featured in the App Store in the run-up to the holidays, with the Year in Review campaign showing the book being built in seconds", "A countdown with the last order date for Christmas delivery per country, so the decision to order tonight is easy and the promise is explicit", "Free hardcover upgrade or free shipping on a bigger copy during the promotion, which turns one book for the parents into one for each set of grandparents", "Calendars and posters in the same app as the book, so one order with several products for several relatives ships together on the longest production time", "Trustpilot reviews from other gift givers saying the book arrived before Christmas and the grandparents cried, with a company reply under every complaint"], "theirFear": ["Ordering on 12 December, watching the tracking stall, and standing at the Christmas table with nothing but a screenshot of the book", "Paying full price and seeing the same book discounted 30 percent in the next e-mail, or a promo code that does not apply to the calendar in the basket", "A gift that arrives creased, with the wrong recipient's address or with a blurry photo of the grandchild on the cover, and no time left to fix it"], "jobsToBeDone": [{"id": "jtbd-gftr-1", "name": "Get a personalised gift delivered before the date", "whatItIs": "Turn a year of family photos into a printed present that reaches the recipient, often at another address, before Christmas, Mother's Day or a birthday. The job covers knowing the last safe order date for the recipient's country, building the Year in Review book or calendar from the phone in a minute, adding a dedication, paying with the seasonal discount, shipping to the recipient and watching the tracking until it is delivered.", "outcome": "The gift is ordered before the published order-by date, produced within the promised production time, delivered to the recipient's address inside the published window for that country and before the occasion, and the giver never has to explain a missing present.", "steps": [{"step": "Work back from the occasion to the order-by date", "description": "The giver checks how long production plus delivery takes for the recipient's country, for example 4 to 8 business days in the United States or 5 to 10 in Canada after production, and knows that a multi-product order ships on the longest production time. The seasonal campaign should state the last order date rather than leave the arithmetic to the giver.", "streamsNeeded": [{"id": "run-seasonal-campaigns-and-promotions", "name": "Run Seasonal Campaigns And Promotions", "howItSupports": "Publishes the holiday order-by dates per country together with the Year in Review promotion, in the giver's language and currency."}, {"id": "produce-ship-and-track-the-order", "name": "Produce Ship And Track The Order", "howItSupports": "Provides the production times and published delivery windows per country that the order-by dates are derived from."}]}, {"step": "Gather the year's photos of the recipient's favourite people", "description": "From the phone camera roll by date or album, from a Facebook year, or from a shared family album, the giver pulls the photos of the grandchildren or of the couple that the recipient will want to see, without sorting through thousands of screenshots.", "streamsNeeded": [{"id": "import-photos-from-phone-and-cloud", "name": "Import Photos From Phone And Cloud", "howItSupports": "Imports the camera roll by date, album or Yearbook mode and from Dropbox or Google Drive, with timestamps that make a Year in Review possible."}, {"id": "connect-facebook-and-pick-a-year", "name": "Connect Facebook And Pick A Year", "howItSupports": "Offers the recipient's or the giver's Facebook year as an alternative source when the phone has too few photos."}]}, {"step": "Let the engine make the Year in Review in a minute", "description": "The curation engine drops duplicates and blurry shots, groups the year into moments and lays out the book or calendar with dates, so the giver sees a finished present in under 60 seconds and shares the highlight video with a sibling to check nobody is missing.", "streamsNeeded": [{"id": "curate-the-best-photos-with-ai", "name": "Curate The Best Photos With Ai", "howItSupports": "Selects the best photos of the year and groups them into moments so that the gift shows a whole year, not a hundred near-duplicates."}, {"id": "auto-design-the-book-and-preview", "name": "Auto Design The Book And Preview", "howItSupports": "Produces the Year in Review book or calendar preview and the shareable highlight video the giver uses to get a second opinion."}]}, {"step": "Add a dedication and the right cover", "description": "A cover photo of the grandparents with the children, a quote on the first page and the year on the spine make it a present. The giver wants to do this in a few taps and not learn a layout tool on a December evening.", "streamsNeeded": [{"id": "edit-and-personalise-the-book", "name": "Edit And Personalise The Book", "howItSupports": "Lets the giver choose the cover photo, theme colours, a quote and a back-cover photo without touching the automatic layout."}]}, {"step": "Pay with the promotion and ship to the recipient", "description": "The giver picks the format, applies the holiday code or free hardcover upgrade, enters the recipient's address and pays with a card or PayPal, seeing the delivery estimate for that address before confirming.", "streamsNeeded": [{"id": "choose-format-price-and-checkout", "name": "Choose Format Price And Checkout", "howItSupports": "Applies the promo code or free upgrade, prices the basket in the giver's currency and takes the recipient's shipping address and the payment."}]}, {"step": "Track the parcel and step in if it slips", "description": "Because the parcel goes to someone else's door, the giver watches the tracking and wants a warning early enough to reorder, send a gift card or tell the recipient, and a fast reprint if the gift arrives damaged.", "streamsNeeded": [{"id": "produce-ship-and-track-the-order", "name": "Produce Ship And Track The Order", "howItSupports": "Produces the order at the partner facility nearest the recipient, ships it and provides tracking with delivery estimates."}, {"id": "resolve-support-requests-and-reprints", "name": "Resolve Support Requests And Reprints", "howItSupports": "Handles address changes, late-parcel questions and reprints or refunds 24/7 on WhatsApp, e-mail and chat."}]}]}, {"id": "jtbd-gftr-2", "name": "Pick the right product, size and price for the recipient", "whatItIs": "Choose, for each person on the list, the PastBook product that fits them and the budget: a large hardcover for the parents, a wall calendar for the grandparents' kitchen, a folded or rolled poster for a partner, gift cards for those with their own photos. The job includes understanding cover rules and page-count pricing, using the promotion on the whole basket and bundling several products into one order.", "outcome": "Every recipient gets a product they will actually use, the giver knows the full price including extra pages and shipping before checkout, the promotion applies to every item in the basket and the whole order ships together on time.", "steps": [{"step": "Match the product to the person", "description": "A grandmother who still writes on a paper calendar gets the 8 x 11.7 inch wall calendar at USD 24.99, a father who likes big photos gets the large 12 x 8.5 inch hardcover at USD 34.99, a partner gets the rolled poster at USD 39.99 for the living room.", "streamsNeeded": [{"id": "choose-format-price-and-checkout", "name": "Choose Format Price And Checkout", "howItSupports": "Presents books, calendars and posters with sizes and prices side by side so the giver can match a product to each recipient."}]}, {"step": "Understand what the page count does to cover and price", "description": "Up to 16 pages is softcover, 18 to 26 pages a choice, 27 to 300 pages hardcover by default; every page above 24 costs USD 0.40 small or USD 0.55 large. The giver wants this visible while adding or removing photos, not at the last screen.", "streamsNeeded": [{"id": "choose-format-price-and-checkout", "name": "Choose Format Price And Checkout", "howItSupports": "Applies the cover rules by page count and shows the running price as the page count changes."}, {"id": "edit-and-personalise-the-book", "name": "Edit And Personalise The Book", "howItSupports": "Lets the giver remove or add photos to land on the page count and cover they want to pay for."}]}, {"step": "Use the promotion on everything in the basket", "description": "The holiday code or free hardcover upgrade must work on the book, the calendar and the poster in the same order, in the giver's currency, and the giver wants to know the discount is the best one available this week.", "streamsNeeded": [{"id": "run-seasonal-campaigns-and-promotions", "name": "Run Seasonal Campaigns And Promotions", "howItSupports": "Runs the seasonal discounts, free-shipping and upgrade offers and states which products they cover."}, {"id": "choose-format-price-and-checkout", "name": "Choose Format Price And Checkout", "howItSupports": "Applies codes and gift cards across the basket and shows the discounted total before payment."}]}, {"step": "Check the gift through the recipient's eyes", "description": "The giver previews the calendar month by month to see that the grandparents' birthdays fall on months with their photos, and sends the highlight video to a sibling to confirm the choice before paying.", "streamsNeeded": [{"id": "auto-design-the-book-and-preview", "name": "Auto Design The Book And Preview", "howItSupports": "Shows the full preview of each product for free and produces the highlight video the giver shares for a second opinion."}]}, {"step": "Order several products for several people at once", "description": "One checkout with a book, two calendars and a poster to two addresses, knowing that the order ships on the longest production time and that each parcel has its own tracking.", "streamsNeeded": [{"id": "choose-format-price-and-checkout", "name": "Choose Format Price And Checkout", "howItSupports": "Handles multi-product, multi-address orders in one checkout with shipping per destination."}, {"id": "render-print-ready-files-and-route-to-a-printer", "name": "Render Print Ready Files And Route To A Printer", "howItSupports": "Renders print-ready files for each product and routes the pieces to the partner facilities that can produce them together on time."}]}]}, {"id": "jtbd-gftr-3", "name": "Give when I have no photos: gift cards and shared albums", "whatItIs": "Give a PastBook present when the photos are on someone else's phone: a gift card so the new parents make their own first-year book, or an album the family fills together before the giver orders the book. The job includes buying the card in the right currency, helping a less technical recipient install the app and redeem it, and coming back next year.", "outcome": "The gift card is bought and delivered before the occasion, redeemed by the recipient for a product they chose themselves, and the giver is reminded in time for the next occasion, so a present without photos still ends as a printed book.", "steps": [{"step": "Buy a gift card in the recipient's currency", "description": "The giver picks a gift card that covers a small hardcover or a calendar in the recipient's currency, USD, GBP, EUR or AUD, and has it delivered by e-mail in time for the date.", "streamsNeeded": [{"id": "choose-format-price-and-checkout", "name": "Choose Format Price And Checkout", "howItSupports": "Sells gift cards in the seven currencies and delivers the code in time for the occasion."}, {"id": "run-seasonal-campaigns-and-promotions", "name": "Run Seasonal Campaigns And Promotions", "howItSupports": "Promotes gift cards as the last-minute option after the physical order-by date has passed."}]}, {"step": "Collect the photos the family holds", "description": "For a first-year book of a nephew, the giver asks the parents to share an album from their phone or a Google Drive folder, so the photos exist in one place before anyone builds a book.", "streamsNeeded": [{"id": "import-photos-from-phone-and-cloud", "name": "Import Photos From Phone And Cloud", "howItSupports": "Imports a shared phone album or a Dropbox or Google Drive folder that the family has filled together."}]}, {"step": "Help the recipient install the app and redeem", "description": "A grandparent who receives a gift card needs to find the PastBook app, allow photo access and enter the code. The giver wants a link that does all three and a helpline that answers if it goes wrong.", "streamsNeeded": [{"id": "discover-and-install-the-app", "name": "Discover And Install The App", "howItSupports": "Gets the recipient from the gift card e-mail to an installed app with photo-library permission granted."}, {"id": "resolve-support-requests-and-reprints", "name": "Resolve Support Requests And Reprints", "howItSupports": "Helps a less technical recipient redeem the card and place the first order through chat or WhatsApp."}]}, {"step": "Come back for the next occasion", "description": "Once the recipient has made a book, the giver wants a reminder before the next Mother's Day or Christmas, with the recipient's addresses saved and the products they liked remembered.", "streamsNeeded": [{"id": "retain-customers-with-yearbooks-and-reminders", "name": "Retain Customers With Yearbooks And Reminders", "howItSupports": "Sends occasion reminders to the giver with saved recipients and the products ordered last time, and prompts a rating after delivery."}]}]}], "customerJourneyStories": [{"id": "journey-gftr-1", "name": "A Year in Review for the grandparents, ordered on 3 December", "linkedJobIds": ["jtbd-gftr-1", "jtbd-gftr-2"], "summary": "A father of two in Texas, 38, whose parents live in Florida, replaces the annual framed print with a PastBook Year in Review book and a calendar, learns to trust the order-by date, and turns it into the family's fixed Christmas present.", "stages": [{"stage": "Trigger", "narrative": "It is the first weekend of December and the family chat asks what the grandparents get this year; last year's framed print took three weeks and arrived after Christmas. His phone holds 9,000 photos of the children from the year and no time to sort them."}, {"stage": "Discovery", "narrative": "The PastBook app appears in an App Store holiday feature and in a paid Instagram ad for the Year in Review book, and a colleague mentions the GQ gift guide listing. He installs the app because the ad promised a book in seconds rather than a design tool."}, {"stage": "Evaluation", "narrative": "He checks the pricing and shipping page, sees that US delivery is 4 to 8 business days after production and that the campaign banner shows the last order date for Christmas. He compares the USD 34.99 large hardcover with a Shutterfly promotion, reads Trustpilot reviews from other gift givers about pre-Christmas delivery, and the free hardcover upgrade on a second copy settles it."}, {"stage": "Trial", "narrative": "Yearbook mode builds the book from the year's camera roll in under a minute; he swaps the cover to the grandparents with both kids, adds a dedication, orders a copy for each set of grandparents and a small calendar, and follows the tracking to Florida. The parcel arrives on 15 December, ten days before Christmas."}, {"stage": "Engagement", "narrative": "In April the app reminds him of Mother's Day with a calendar offer, in the summer he orders a rolled poster of the beach trip for his wife's birthday, and his order history keeps the grandparents' addresses so a reorder takes two minutes."}, {"stage": "Retention", "narrative": "The following November a reminder arrives before he has thought about presents, with last year's book as the starting point and the order-by date for Florida. He stays because the one time a calendar arrived creased, support replaced it within the week over WhatsApp, and because the grandparents now expect the next volume."}]}, {"id": "journey-gftr-2", "name": "A gift card and a shared album for a first-year book", "linkedJobIds": ["jtbd-gftr-3", "jtbd-gftr-2"], "summary": "A 29-year-old in London wants to give her brother and his partner a book of their baby's first year, has none of the photos herself, and discovers that a PastBook gift card plus a shared album lets the parents make the book they want, delivered within the UK's 4 to 5 business days.", "stages": [{"stage": "Trigger", "narrative": "Her nephew turns one in three weeks and the parents have 4,000 photos on two phones and no printed picture of him. She wants to give something personal but cannot make a book from photos she does not have."}, {"stage": "Discovery", "narrative": "A friend's Instagram story shows a PastBook highlight video of her own baby book; the pastbook.com pricing page lists gift cards next to books, calendars and posters and the delivery window for the UK."}, {"stage": "Evaluation", "narrative": "She weighs a gift card against sending the parents a link to make the book and paying afterwards, checks that a gift card in GBP covers the small hardcover at GBP 16.99 plus extra pages, and reads in the help center how redemption works. The card is safer than guessing which photos the parents want."}, {"stage": "Trial", "narrative": "She buys the gift card in GBP, sends it with a note for the birthday, and creates a shared album the parents fill with 300 favourites. The parents install the app from the gift card e-mail, redeem the code and order a 40-page hardcover that arrives in four business days."}, {"stage": "Engagement", "narrative": "The parents keep the app and order a second copy for the other grandparents; she sends a gift card again for Christmas and a calendar for her own mother from the same shared album, using the promo code from the seasonal e-mail."}, {"stage": "Retention", "narrative": "She keeps choosing PastBook for family occasions because the gift card removed the risk of picking the wrong photos, the parents have since become PastBook customers themselves, and the reminder before her nephew's second birthday lands with the shared album still there to build the next book."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-gftr-top", "name": "Gifts delivered before the occasion", "description": "Share of gift orders with a stated occasion date, Christmas, Mother's Day or a birthday, that were delivered to the recipient before that date. Modeled seed value, not an official PastBook figure: about 78 percent of gift orders are placed with enough lead time and almost all of those arrive in time, while roughly 63 percent of the rush orders placed in the last seven days still make it, which gives about 91 percent overall.", "unit": "%", "currentValue": "91", "targetValue": "98", "link": "https://dashboard.example.com/instant-photo-book-platform/customers/gftr/kpis/co-gftr-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-gftr-co-gftr-top.png"}, "branches": [{"id": "co-gftr-b1", "name": "Ordered in time and delivered on time", "description": "Whether the giver orders before the last safe date and whether production and carriers keep the published windows in the peak season.", "currentValue": "62", "icon": "kpi-gftr-co-gftr-b1.png", "children": [{"id": "co-gftr-b1-c1", "name": "On-time delivery rate in peak season", "description": "Share of orders placed between 1 November and 24 December that are delivered within the published production plus delivery window for the destination country.", "unit": "%", "currentValue": "88", "targetValue": "96", "icon": "kpi-gftr-co-gftr-b1-c1.png", "children": [{"id": "co-gftr-b1-c1-l1", "name": "Peak orders handed to the carrier within production SLA", "description": "Share of peak-season orders that partner facilities produce and hand to the carrier within the agreed production time.", "unit": "%", "currentValue": "94", "targetValue": "98", "icon": "kpi-gftr-co-gftr-b1-c1-l1.png", "children": []}, {"id": "co-gftr-b1-c1-l2", "name": "Peak parcels delivered within the published carrier window", "description": "Share of peak-season parcels delivered by the carrier within the published window for the country, for example 4 to 8 business days in the United States.", "unit": "%", "currentValue": "93", "targetValue": "98", "icon": "kpi-gftr-co-gftr-b1-c1-l2.png", "children": []}]}, {"id": "co-gftr-b1-c2", "name": "Gift orders placed with enough lead time", "description": "Share of gift orders placed on or before the published order-by date for the occasion and destination country.", "unit": "%", "currentValue": "78", "targetValue": "90", "icon": "kpi-gftr-co-gftr-b1-c2.png", "children": [{"id": "co-gftr-b1-c2-l1", "name": "Gift givers who saw the order-by date before checkout", "description": "Share of gift orders where the giver was shown the order-by date for the recipient's country in the campaign, app or checkout before paying.", "unit": "%", "currentValue": "62", "targetValue": "90", "icon": "kpi-gftr-co-gftr-b1-c2-l1.png", "children": []}, {"id": "co-gftr-b1-c2-l2", "name": "Rush orders placed inside the last seven days before the occasion", "description": "Share of gift orders placed within seven days of the occasion, the complement of orders placed in time.", "unit": "%", "currentValue": "22", "targetValue": "10", "icon": "kpi-gftr-co-gftr-b1-c2-l2.png", "chi ses", "Mother's Day and birthday gifting outside the fourth quarter", "Gift cards redeemed for a first book by new households"], "supporting": ["Multi-product gift orders", "Gift orders in the fourth quarter"]}, "milestones": ["Launch occasion reminders with saved recipients, their addresses and the products ordered last time, starting with Mother's Day and birthdays", "Offer multi-address checkout so that copies for several grandparents ship in one order with tracking per parcel", "Redesign the gift card e-mail so that the recipient installs the app and builds a first book within 90 days"]}, "year5": {"focus": "Be the default personalised gift in 150+ countries: any photo stream turned into a printed present, produced locally near the recipient, with sustainability and on-time delivery as the brand promise and paid acquisition replaced largely by reminders, referrals and redeemed gift cards.", "productTheme": "The gift that always arrives, anywhere", "customerKPI": {"northStar": "Gifts delivered before the occasion", "supporting": ["Gift orders with a tracking or delivery support contact", "Gift orders reprinted or refunded for late or damaged delivery"]}, "businessKPI": {"northStar": "Annual gross margin from gift orders", "revenueStreams": ["Gift books, calendars and posters produced locally in 150+ destination countries", "Family gifting circles where gift cards and shared albums bring new households in", "Premium large-format and multi-copy gift baskets"], "supporting": ["Acquisition cost per new gift giver in the fourth quarter", "Return on ad spend of the Year in Review campaign"]}, "milestones": ["Produce gift orders in the recipient's country for the large majority of destinations, with FSC paper and a published delivery window for each", "Bring gift-related support contacts below one in twenty orders through proactive tracking, delay notices and self-service address changes", "Acquire most new gift givers through reminders, referrals and redeemed gift card ": [{"step": "Identify the customer and the order from the channel", "description": "Match the incoming WhatsApp number, e-mail address or chat session to the customer account and its recent orders, or find the order by number, and verify the customer before showing addresses, photos or payment details. Multi-book and gift orders often arrive under a different name than the recipient.", "streamsNeeded": [{"id": "resolve-support-requests-and-reprints", "name": "Resolve Support Requests And Reprints", "howItSupports": "Opens the contact in one queue with the matched account and recent orders attached, so the agent does not ask for information the app already holds."}, {"id": "protect-photo-privacy-and-platform-compliance", "name": "Protect Photo Privacy And Platform Compliance", "howItSupports": "Enforces the verification step before personal photos, addresses or payment data are shown to or shared with the person on the other end."}]}, {"step": "See exactly where the order is", "description": "Read the order timeline: paid, print file rendered and preflighted, routed to which partner facility, in production, handed to which carrier, and the tracking events, against the published delivery window for the destination country and the production time of the slowest product in a multi-product order.", "streamsNeeded": [{"id": "produce-ship-and-track-the-order", "name": "Produce Ship And Track The Order", "howItSupports": "Shows production status, carrier handover and tracking events per parcel next to the delivery window for the country."}, {"id": "render-print-ready-files-and-route-to-a-printer", "name": "Render Print Ready Files And Route To A Printer", "howItSupports": "Shows whether the print file was rendered and accepted, and which partner facility received the job and when."}]}, {"step": "Apply the change the customer needs", "description": "Fix an address or a recipient name, upgrade a soft cover to hard cover or a small to a large book, add a gift card, or cancel  the gift date has passed or the customer asks for one, or a partial refund for minor issues, within the limit set per agent level; escalate only above the limit.", "streamsNeeded": [{"id": "resolve-support-requests-and-reprints", "name": "Resolve Support Requests And Reprints", "howItSupports": "Applies the reprint and refund policy and authority limits so the agent decides in the conversation instead of escalating."}, {"id": "choose-format-price-and-checkout", "name": "Choose Format Price And Checkout", "howItSupports": "Executes the refund in the original currency and payment method, including promo and gift card portions."}]}, {"step": "Trigger the reprint from the stored print file", "description": "Reprint the order from the stored, already preflighted print file, corrected address if needed, routed with priority to the nearest partner with capacity, and quote the customer the new production and delivery estimate.", "streamsNeeded": [{"id": "render-print-ready-files-and-route-to-a-printer", "name": "Render Print Ready Files And Route To A Printer", "howItSupports": "Re-releases the stored print file as a priority job to the best partner facility without the customer re-uploading anything."}]}, {"step": "Follow the reprint to delivery and close the loop", "description": "Watch the reprint through production and carrier handover, confirm delivery with the customer, and invite a satisfied customer to update their review or rate the app.", "streamsNeeded": [{"id": "produce-ship-and-track-the-order", "name": "Produce Ship And Track The Order", "howItSupports": "Tracks the reprint parcel so the agent can confirm delivery proactively."}, {"id": "retain-customers-with-yearbooks-and-reminders", "name": "Retain Customers With Yearbooks And Reminders", "howItSupports": "Triggers the rating prompt and reorder path once a recovered customer confirms the reprint arrived well."}]}]}, {"id": "jtbd-csup-3", "name": "Turn complaints and reviews into product and partner fixes", "whatItIs": "Answer every negative Trustpilot and app store review within 48 hours, tag every contact with a root cause, and turn the weekly pattern into concrete requests to production operations (partner defects), the curation team (blurry or duplicate photos let through), commerce (price and promo confusion) and the help center.", "outcome": "Negative reviews are answered publicly within 48 hours, root-cause tags cover almost every ticket, and the causes of the most frequent complaints fall quarter over quarter because the teams that own them receive them with order-level evidence.", "steps": [{"step": "Answer every negative review within 48 hours", "description": "Work the Trustpilot, App Store and Google Play review inbox, match each negative review to the order, reply publicly in the reviewer's language with the concrete fix offered, and move the conversation to WhatsApp or e-mail for the reprint or refund.", "streamsNeeded": [{"id": "resolve-support-requests-and-reprints", "name": "Resolve Support Requests And Reprints", "howItSupports": "Brings reviews into the same queue as tickets with the linked order and a 48-hour countdown."}, {"id": "retain-customers-with-yearbooks-and-reminders", "name": "Retain Customers With Yearbooks And Reminders", "howItSupports": "Feeds the rating prompts that produce reviews and lets the agent invite a recovered reviewer to update their rating."}]}, {"step": "Tag every contact with a root cause", "description": "Use one root-cause taxonomy across channels: delivery delay by country, print defect by type, curation miss, checkout or promo confusion, Facebook import failure, privacy or deletion request, and keep tags consistent across the four support locations.", "streamsNeeded": [{"id": "resolve-support-requests-and-reprints", "name": "Resolve Support Requests And Reprints", "howItSupports": "Provides the shared taxonomy and forces a tag before a ticket can be closed."}]}, {"step": "Route the pattern to the team that owns the cause", "description": "Send weekly the partner defect clusters with order and print file evidence to production operations, the curation misses with the photos to the curation team, and the checkout or promo confusion to the growth and commerce teams.", "streamsNeeded": [{"id": "manage-the-global-print-partner-network", "name": "Manage The Global Print Partner Network", "howItSupports": "Receives defect clusters per partner facility and turns them into audits and partner corrective actions."}, {"id": "curate-the-best-photos-with-ai", "name": "Curate The Best Photos With Ai", "howItSupports": "Receives examples of blurry, duplicate or wrongly grouped photos that were selected, to improve scoring and grouping."}]}, {"step": "Update help center articles and macros", "description": "Rewrite the articles and macros in ten languages when rules change: cover thresholds, extra-page prices, delivery windows, the Instagram withdrawal, how to delete photos and data, so the next customer self-serves.", "streamsNeeded": [{"id": "resolve-support-requests-and-reprints", "name": "Resolve Support Requests And Reprints", "howItSupports": "Manages macros and help articles next to the tickets they should deflect."}, {"id": "protect-photo-privacy-and-platform-compliance", "name": "Protect Photo Privacy And Platform Compliance", "howItSupports": "Provides the scripted, compliant handling for photo deletion, GDPR and CCPA requests that the articles and macros must reflect."}]}]}], "customerJourneyStories": [{"id": "journey-csup-1", "name": "A new night-shift agent in Colombo adopts the support desk", "linkedJobIds": ["jtbd-csup-1", "jtbd-csup-2"], "summary": "An agent who joins the outsourced support pod in Colombo to cover the US evening and night hours learns the PastBook support desk during the run-up to Q4, doubts whether she can decide reprints and refunds for American customers from Sri Lanka, and within one peak season handles where-is-my-order, address fixes and reprints in one contact.", "stages": [{"stage": "Trigger", "narrative": "She joins the Colombo pod that covers the United States evening and night, PastBook's largest market with about 80% of customers, weeks before the Year in Review peak. Her previous employer handled telecom tickets from a spreadsheet and three separate tools; she has never worked orders that turn into physical books printed by partners on another continent."}, {"stage": "Discovery", "narrative": "In onboarding the team lead shows her the support desk that PastBook uses across the Netherlands, United States, Sri Lanka and India: WhatsApp, e-mail and chat in one queue, every contact opening with the customer's orders, print files and carrier tracking attached, and a shift-handover note from the Amsterdam morning. She reads the help center in English first and sees the same articles exist in ten languages."}, {"stage": "Evaluation", "narrative": "She wonders whether she is allowed to decide a reprint for a customer in Texas at 2 a.m. Amsterdam time. What convinces her is that the desk encodes the policy: reprint and refund authority per agent level, the delivery windows per country and the Christmas cut-offs as data rather than memory, and the reprint button that shows where the job would be reprinted and when it would arrive."}, {"stage": "Trial", "narrative": "Her first shifts are shadowed: she works tracking questions against the US 4\u20138 business day window, changes addresses before production starts, and approves her first reprint for a book with a colour cast, watching it route to the US partner as a priority job. A senior in New York reviews her closing notes and root-cause tags."}, {"stage": "Engagement", "narrative": "By the second half of the peak she handles a full queue: WhatsApp conversations that started in the New Delhi shift continue in hers without the customer repeating, she reprints and refunds within her authority, and she quotes delivery statements she trusts because the carrier data is in front of her. Her first-contact resolution climbs toward the pod average."}, {"stage": "Retention", "narrative": "She stays with the pod after the peak because the desk made her decisions safe and visible: her reprint and refund calls were audited and upheld, her root-cause tags show up in the weekly list that operations acts on, and she is asked to write the Sinhala-speaking pod's first macro set for the Facebook import questions that cluster in her hours."}]}, {"id": "journey-csup-2", "name": "A senior Amsterdam agent takes over the review and root-cause loop", "linkedJobIds": ["jtbd-csup-3", "jtbd-csup-2"], "summary": "A senior agent in Amsterdam who has answered tickets for three years is asked to own the Trustpilot and app store review inbox and the weekly root-cause report, resists doing it in spreadsheets, and adopts the desk's review inbox and tagging so complaints become partner audits and curation fixes.", "stages": [{"stage": "Trigger", "narrative": "After a peak season in which several negative Trustpilot reviews were answered late because they lived in a separate browser tab, the support lead asks the most experienced Amsterdam agent to own the public review replies and the weekly complaint report to operations and product."}, {"stage": "Discovery", "narrative": "She learns that the desk can pull Trustpilot, App Store and Google Play reviews into the same queue as tickets, match them to orders and show a 48-hour countdown, and that root-cause tags on tickets can be aggregated per partner facility, country and cause without exporting anything. A colleague in the growth team shows her the reviews dashboard they already watch for ratings."}, {"stage": "Evaluation", "narrative": "Her concern is that tagging costs the team time it does not have in Q4 and that nobody downstream will act. She evaluates a month of tags against the reprint cases and sees that two partner facilities and one curation issue explain most defects; production operations confirms they would audit a partner on that evidence. The company's public promise, replies to 100% of negative reviews typically within 48 hours, becomes measurable per shift."}, {"stage": "Trial", "narrative": "For one quarter she runs the loop for real: every negative review answered from the inbox with the linked order, a mandatory root-cause tag before closing, and a weekly list to operations, the curation team and commerce. The first result is a partner corrective action on binding and a fix for a promo code that confused customers in Brazil."}, {"stage": "Engagement", "narrative": "The review inbox and the weekly root-cause report become part of the Amsterdam shift routine; agents in all four locations tag consistently because the taxonomy is in the desk, and the help center articles she updates deflect the questions she saw repeating."}, {"stage": "Retention", "narrative": "She keeps ownership because the loop gives her leverage she never had on the front line: the one-star share stays around the 2% Trustpilot shows publicly while volume grows, the causes she reports are visibly closed by operations and the curation team, and she now trains new agents in Colombo and New Delhi on why a tag is worth ten seconds."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-csup-top", "name": "First-contact resolution rate", "description": "Share of WhatsApp, e-mail and chat contacts about an order that are fully resolved in the first conversation, without a follow-up contact, a shift handover or an escalation. Modeled seed value for a 24/7 desk staffed from four countries; not an official PastBook figure.", "unit": "%", "currentValue": "71", "targetValue": "85", "link": "https://dashboard.example.com/instant-photo-book-platform/customers/csup/kpis/co-csup-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-csup-co-csup-top.png"}, "branches": [{"id": "co-csup-b1", "name": "Speed of response and resolution", "description": "How fast a customer gets a first answer on each channe  "children": []}]}]}, {"id": "co-csup-b2", "name": "Quality of resolution", "description": "Whether failures are fixed properly the first time and whether the public record on Trustpilot and the app stores reflects it.", "currentValue": "69", "icon": "kpi-csup-co-csup-b2.png", "children": [{"id": "co-csup-b2-c1", "name": "Reprint rate", "description": "Share of paid orders that are reprinted for any reason: print defect, transit damage or loss, address error or a curation miss accepted as PastBook's fault. Must stay below the order complaint rate of about 2.9% of orders.", "unit": "% of orders", "currentValue": "1.6", "targetValue": "1.0", "icon": "kpi-csup-co-csup-b2-c1.png", "children": [{"id": "co-csup-b2-c1-l1", "name": "Reprint approval within one contact", "description": "Share of reprints approved by the agent in the first conversation without escalation.", "unit": "%", "currentValue": "78", "targetValue": "90", "icon": "kpi-csup-co-csup-b2-c1-l1.png", "children": []}, {"id": "co-csup-b2-c1-l2", "name": "Reprint handed to carrier within 3 business days", "description": "Share of reprints produced by the rerouted partner and handed to the carrier within three business days of approval.", "unit": "%", "currentValue": "70", "targetValue": "90", "icon": "kpi-csup-co-csup-b2-c1-l2.png", "children": []}]}, {"id": "co-csup-b2-c2", "name": "Negative reviews answered within 48 hours", "description": "Share of one- and two-star Trustpilot, App Store and Google Play reviews that receive a public reply within 48 hours; PastBook publicly replies to 100% of negative reviews, typically within 48 hours.", "unit": "%", "currentValue": "94", "targetValue": "99", "icon": "kpi-csup-co-csup-b2-c2.png", "children": [{"id": "co-csup-b2-c2-l1", "name": "Trustpilot one-star review share", "description": "Share of Trustpilot reviews with one star; 2% of the 35,837 reviews behind the 4.5 TrustScore in September 2026.", "unit": "%", "currentValue": "2", "targetValue": "1.5", "icon": "kp
