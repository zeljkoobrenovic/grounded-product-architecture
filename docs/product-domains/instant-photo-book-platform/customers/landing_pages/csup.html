ecification apply to all, volume is routed by proximity and proven performance, and the network is orchestrated as a utility that puts a book, calendar or poster in the customer's hands within the published window in 150+ countries.", "timeHorizons": {"year1": {"focus": "Stabilise peak-season production SLAs across the current partners: complete the order API and hot folder integration with status callbacks for every facility, preflight every file before routing, and give each partner the same SLA dashboard PastBook's production operations sees.", "productTheme": "Print-ready order feed and one shared SLA", "customerKPI": {"northStar": "Orders produced within SLA", "supporting": ["Print file rejection rate", "Status callback completeness"]}, "businessKPI": {"northStar": "Gross margin after print and shipping cost", "revenueStreams": ["Small and large hardcover photo book orders produced by partners", "Wall calendar and poster orders", "Extra-page and hardcover upgrade revenue"], "supporting": ["Unit production cost per book", "Reprints charged back to the partner"]}, "milestones": ["Connect every active facility through the order API or hot folder with received, in-production and shipped callbacks", "Preflight and impose every file before routing so partner rejections fall below one percent", "Publish the shared SLA, rejection and defect dashboard to all partners before the Q4 peak"]}, "year3": {"focus": "Build redundant capacity per delivery region: a second qualified facility for the US, UK, EU and Australia, overflow routing rules that fire on committed capacity, weekly Q4 forecasts agreed in summer, and quality audits with root-cause attribution that decide routing share.", "productTheme": "Redundant regional network with forecast-driven routing", "customerKPI": {"northStar": "Orders produced within SLA", "supporting": ["Peak capacity utilisation", "Print defect rate"]}, "businessKPI": {"northStar": "Gross margin after print and shipping cost", "revenueStreams": ["Small and large hardcover photo book orders produced by partners", "Wall calendar and poster orders", "Year in Review and holiday gift orders produced locally in peak"], "supporting": ["Regions with redundant partner capacity", "Shipping cost per order"]}, "milestones": ["Qualify a second facility in each of the four largest delivery regions and write overflow rules into routing", "Share weekly Q4 forecasts with capacity commitments per facility agreed by the end of summer", "Run quarterly quality audits with reprint root causes attributed to file, production or transport"]}, "year5": {"focus": "Operate the partner network as a utility: routing by proximity, capacity, cost and carbon in real time, facilities on four continents producing the full range on FSC paper in the customer's country, and onboarding of a new facility in weeks through the standard feed and specification.", "productTheme": "Print network as a utility", "customerKPI": {"northStar": "Orders produced within SLA", "supporting": ["Same-day carrier handover rate", "Forecast accuracy of Q4 volume shared by PastBook"]}, "businessKPI": {"northStar": "Gross margin after print and shipping cost", "revenueStreams": ["Photo book, calendar and poster orders in 150+ countries", "New printed formats produced through the same partner feed", "Extra-page and hardcover upgrade revenue"], "supporting": ["Share of volume at the largest single facility", "Late-delivery refunds in peak season"]}, "milestones": ["Route every order in real time on proximity, committed capacity, unit cost and shipping emissions", "Produce 97 percent of orders in the customer's country with no single facility above 30 percent of volume", "Onboard a new facility through the standard order feed, specification and audit in under eight weeks"]}}}, "domain": "Print and Platform Partners"}, {"id": "plat", "name": "Platform and Channel Partner", "description": "The partner, developer-relations or policy contact at one of the platforms PastBook depends on and must comply with: Meta for Facebook Login and the photo permissions behind Facebook Photo Books, Apple's App Store and Google Play for app review, featuring, privacy labels and billing rules, Dropbox and Google Drive for cloud imports, the payment providers behind Visa, Mastercard, American Express and PayPal in seven currencies, and the carriers that deliver to 150+ countries. The platform sets the rules, and PastBook lives within them: it has 1M+ app downloads, was featured by the App Store in several countries in September 2022, and lost its Instagram import when Instagram discontinued third-party access for personal accounts, which is why the phone camera roll and Facebook are now the primary sources. The platform wants a developer that passes review, uses personal photos only for the customer's own book and deletes them on request, keeps chargebacks and complaints low, adopts API changes on time, and brings volume that makes the relationship worth a named contact.", "icon": "plat.png", "careAbout": ["An app that respects the platform's guidelines at every release: clear purpose strings for photo-library access, accurate privacy labels, account and data deletion, no misleading promotions", "Data use that stays within the permission granted: Facebook albums, timeline pictures and profile photos used only to build that customer's book, imported over encrypted connections and deleted on request, never retained beyond the order", "Low burden on the platform's own support: few payment disputes and chargebacks, few user complaints about photo access, no policy escalations", "Quality that reflects well on the store or platform: crash-free releases, a 4.5-plus rating, seasonal content worth featuring around Year in Review and Mother's Day", "Timely adoption of new SDK versions, API deprecations and payment scheme rules with a clean migration, not a last-minute exception request", "Volume that matters: installs, transactions and parcels that make PastBook a developer or merchant the platform assigns a named contact to"], "winsThem": ["A developer with 10 million books created, 1M+ app downloads and a 4.5 Trustpilot score that has passed App Store and Google Play review for years and answers a reviewer's question within a day", "A documented privacy programme (encrypted transfer and storage, GDPR and CCPA rights, consent and deletion tooling) that makes Meta's data-use review and the store privacy labels straightforward", "An integration gateway that isolates the Meta Graph API, Dropbox, Google Drive, payment providers, carriers and store APIs, so a deprecation is a contained migration rather than an outage", "Featuring-ready seasonal releases and store pages in ten languages timed with the platform's editorial calendar, as in the September 2022 App Store feature in several countries", "Clean payments: recognisable order descriptors, low chargeback rates and refunds handled by PastBook's 24/7 support before a dispute reaches the provider"], "theirFear": ["A developer mishandling users' photos of children, faces and locations and the resulting privacy incident being reported as the platform's failure", "A policy change, like the one that ended Instagram's third-party access, breaking a popular use case and sending angry users to the platform rather than to the developer", "A Q4 peak of transactions and parcels bringing fraud, chargebacks and delivery disputes that the platform has to arbitrate"], "jobsToBeDone": [{"id": "jtbd-plat-1", "name": "Keep the app and integrations compliant with platform policies", "whatItIs": "Keep a developer that reaches millions of users' photos inside the rules: publish the requirements, review the app and its permission requests at each release, verify how Facebook, camera roll and cloud photos are used and deleted, watch integration health and abuse signals such as failed logins, rate limits and payment fraud, and manage policy changes and deprecations with a migration window the developer can meet.", "outcome": "PastBook passes app review and data-use checks first time, its permissions match what the book flow needs, personal photos are deleted on request and never kept beyond the order, integrations stay healthy through SDK and API changes, and the platform records no policy incident against the developer in a year.", "steps": [{"step": "Publish and communicate the requirements", "description": "Make the rules and their changes clear to the developer: App Store Review Guidelines and Google Play policies, privacy labels and account deletion, Meta Platform Terms and the annual data-use review for apps with photo permissions, payment scheme rules and carrier terms, with deadlines for each change.", "streamsNeeded": [{"id": "protect-photo-privacy-and-platform-compliance", "name": "Protect Photo Privacy And Platform Compliance", "howItSupports": "Tracks each platform's terms, review requirements and deadlines as obligations PastBook must meet."}]}, {"step": "Review the app and its permissions at each release", "description": "Check every submitted build: the purpose string for photo-library access, the privacy label against actual data flows, physical goods paid outside in-app purchase, account deletion in the app, screenshots and store text that match what the app does in ten languages.", "streamsNeeded": [{"id": "protect-photo-privacy-and-platform-compliance", "name": "Protect Photo Privacy And Platform Compliance", "howItSupports": "Prepares the release for review with privacy labels, deletion flow and permission rationale kept in sync with the app."}, {"id": "discover-and-install-the-app", "name": "Discover And Install The App", "howItSupports": "Provides the store listing, screenshots and localised text that the review compares with the app."}]}, {"step": "Verify data use for Facebook, camera roll and cloud photos", "description": "Confirm through the data-use review and spot checks that Facebook albums, timeline pictures and profile photos, camera-roll photos and Dropbox or Google Drive files are used only to curate and print the customer's own book, transferred encrypted, and deleted when the customer asks or the order is complete.", "streamsNeeded": [{"id": "connect-facebook-and-pick-a-year", "name": "Connect Facebook And Pick A Year", "howItSupports": "Requests only the Facebook permission scope Meta allows for the year-book flow and records what was imported."}, {"id": "import-photos-from-phone-and-cloud", "name": "Import Photos From Phone And Cloud", "howItSupports": "Imports camera-roll, Dropbox and Google Drive photos over encrypted connections with the customer's consent."}, {"id": "protect-photo-privacy-and-platform-compliance", "name": "Protect Photo Privacy And Platform Compliance", "howItSupports": "Executes deletion requests and keeps the consent and audit trail the platform's review asks for."}]}, {"step": "Monitor integration health and abuse signals", "description": "Watch login and token error rates, API rate-limit hits, payment authorisation failures, fraud and chargeback ratios and delivery disputes for the developer, and raise them before they become an enforcement action.", "streamsNeeded": [{"id": "protect-photo-privacy-and-platform-compliance", "name": "Protect Photo Privacy And Platform Compliance", "howItSupports": "Monitors platform-facing error, fraud and complaint signals against the thresholds each platform applies."}, {"id": "choose-format-price-and-checkout", "name": "Choose Format Price And Checkout", "howItSupports": "Runs payments through Visa, Mastercard, American Express and PayPal with the descriptors and checks the providers expect."}]}, {"step": "Manage policy changes and deprecations", "description": "Announce API deprecations, permission changes and rule updates with a migration window, answer the developer's questions, and, when a source is withdrawn as Instagram withdrew third-party access for personal accounts, make sure affected customers are pointed to the remaining sources rather than left stranded.", "streamsNeeded": [{"id": "protect-photo-privacy-and-platform-compliance", "name": "Protect Photo Privacy And Platform Compliance", "howItSupports": "Plans and executes migrations for each platform change inside the announced window."}, {"id": "resolve-support-requests-and-reprints", "name": "Resolve Support Requests And Reprints", "howItSupports": "Handles customers affected by a source or policy change with a clear answer and an alternative flow."}]}]}, {"id": "jtbd-plat-2", "name": "Grow orders through the channel without policy incidents", "whatItIs": "Turn a compliant developer into a channel that grows: feature and rank the app where it earns it, keep the source connections (Facebook Login, camera-roll permission, Dropbox and Google Drive) smooth and consented, process payments reliably in seven currencies, deliver and track parcels in 150+ countries, and plan the Q4 peak together so growth never comes at the cost of a policy or fraud incident.", "outcome": "Orders originating through the platform's channel grow year on year, with installs converting to orders, logins and payments succeeding, parcels arriving inside the published windows and the developer's rating and complaint numbers staying good enough for the platform to keep featuring and trusting it.", "steps": [{"step": "Feature and rank the app where it earns it", "description": "Consider PastBook for editorial features and category placement when ratings, crash-free sessions and seasonal releases justify it, as with the App Store feature in several countries in September 2022, and let store optimisation and campaigns bring installs that the platform can see convert.", "streamsNeeded": [{"id": "discover-and-install-the-app", "name": "Discover And Install The App", "howItSupports": "Delivers the store presence, ratings and localised listings that earn featuring and installs."}, {"id": "run-seasonal-campaigns-and-promotions", "name": "Run Seasonal Campaigns And Promotions", "howItSupports": "Aligns Year in Review and holiday releases with the platform's editorial and campaign calendar."}]}, {"step": "Make source connections smooth and consented", "description": "Keep Facebook Login and photo permissions, iOS and Android photo-library access and Dropbox or Google Drive OAuth working with high success rates and clear consent, because a failed connection is a lost book and a support contact for both sides.", "streamsNeeded": [{"id": "connect-facebook-and-pick-a-year", "name": "Connect Facebook And Pick A Year", "howItSupports": "Runs the Facebook Login and year selection flow within Meta's permission scope with high completion."}, {"id": "import-photos-from-phone-and-cloud", "name": "Import Photos From Phone And Cloud", "howItSupports": "Handles camera-roll permission and cloud-drive authorisation so imports succeed on the first try."}]}, {"step": "Process payments reliably across seven currencies", "description": "Authorise Visa, Mastercard, American Express and PayPal payments in USD, EUR, GBP, CAD, AUD, NZD and BRL with high acceptance, local-currency settlement where possible, and refunds issued by PastBook before a dispute is opened.", "streamsNeeded": [{"id": "choose-format-price-and-checkout", "name": "Choose Format Price And Checkout", "howItSupports": "Presents prices in the customer's currency and completes payment with the provider's authorisation flow."}]}, {"step": "Deliver and track parcels in every market", "description": "Carry produced parcels from the partner facility to the customer within the published windows (US 4-8 business days, UK 4-5, NZ, India and Brazil 7-10), with tracking events the customer and PastBook's support can follow.", "streamsNeeded": [{"id": "produce-ship-and-track-the-order", "name": "Produce Ship And Track The Order", "howItSupports": "Books carriers, prints labels and surfaces tracking events for the customer and support."}]}, {"step": "Share performance and plan the peak together", "description": "Exchange channel data (installs, conversion, authorisation rates, parcel volumes, complaint and chargeback ratios) with PastBook, plan Q4 volumes with payment providers and carriers, and agree how yearbook reminders and rating prompts will be timed so the peak is a growth event and not an incident.", "streamsNeeded": [{"id": "run-seasonal-campaigns-and-promotions", "name": "Run Seasonal Campaigns And Promotions", "howItSupports": "Provides the Q4 campaign plan and expected volumes to align with payment and carrier capacity."}, {"id": "retain-customers-with-yearbooks-and-reminders", "name": "Retain Customers With Yearbooks And Reminders", "howItSupports": "Times yearbook reminders and rating prompts that drive repeat orders and store ratings within platform rules."}]}]}], "customerJourneyStories": [{"id": "journey-plat-1", "name": "App Store: from first review to featured in several countries", "linkedJobIds": ["jtbd-plat-1", "jtbd-plat-2"], "summary": "Apple's app review and editorial side meets PastBook when the AI-driven 1-click photo book app is submitted in 2021, reviews its photo-library access and privacy labels release after release, and by September 2022 features it in several countries; the relationship holds because the app keeps passing review and keeps its rating.", "stages": [{"stage": "Trigger", "narrative": "A new photo-product app that asks for full photo-library access and sells physical books outside in-app purchase is submitted for review in July 2021. For the platform this is a category with real privacy stakes, children's photos and family moments, so the developer has to prove that access is justified and data use is transparent."}, {"stage": "Discovery", "narrative": "The reviewers see the app among many photo-book apps; what makes it stand out is the claim of a finished book in under 60 seconds from the camera roll, a company that already had 10 million books behind it and a Trustpilot score of 4.5, and a first build whose purpose strings and privacy label described exactly what the app did."}, {"stage": "Evaluation", "narrative": "Each release is checked against the guidelines: the reason for photo-library access, the privacy label against actual data flows, physical goods paid by card or PayPal rather than in-app purchase, account deletion inside the app, and store text in ten languages that matches the product. Two early builds are sent back for a label mismatch and a missing deletion path, both fixed within days."}, {"stage": "Trial", "narrative": "The first approved releases go live in the US, then in other storefronts; installs grow and the store sees the ratings and crash reports that follow. Editorial notices the seasonal Year in Review release and tests the app against its featuring bar: quality, localisation, a story worth telling about turning a year of photos into a book."}, {"stage": "Engagement", "narrative": "By September 2022 the App Store features PastBook in several countries; in July 2023 the highlight video sharing release passes review and gives the store another story to tell. Releases now pass first time, the developer responds within a day to reviewer questions, and the platform contact expects the Q4 build in early autumn."}, {"stage": "Retention", "narrative": "The platform keeps featuring and ranking the app because it stays at 1M+ downloads with a high rating, low crash and complaint rates and clean privacy labels through every new requirement; PastBook keeps its place by treating each guideline change as a planned release. When the store introduces a new privacy or deletion rule, PastBook is among the developers already compliant, and its seasonal releases are pencilled into the editorial calendar."}]}, {"id": "journey-plat-2", "name": "Meta: keeping Facebook Photo Books running after the Instagram withdrawal", "linkedJobIds": ["jtbd-plat-1", "jtbd-plat-2"], "summary": "Meta's platform team sees PastBook first as one of many apps using Instagram photos and then, after Instagram discontinues third-party access for personal accounts, as a developer whose Facebook Photo Books flow for the years 2009 to 2025 depends on Facebook Login and photo permissions and must pass data-use review every year.", "stages": [{"stage": "Trigger", "narrative": "Instagram shifts its focus and discontinues support for third-party tools for personal accounts. For PastBook this ends a core import channel overnight; for Meta it means a wave of developers asking how to keep serving users who want their social-media photos printed, and PastBook's Facebook flow becomes the developer's remaining Meta channel."}, {"stage": "Discovery", "narrative": "Meta's platform team sees an app requesting Facebook photo permissions at scale that builds one book per year from albums, timeline pictures, cover and profile photos and mobile uploads with captions, publishes a clear statement to its users about the Instagram change, and points them to Facebook, the phone app and manual upload rather than to a workaround."}, {"stage": "Evaluation", "narrative": "The permission request is reviewed: does the year-book flow need each permission, is the privacy policy accurate, is business verification complete, does the app implement data deletion so a user's photos are removed on request and not kept beyond the order, and are photos transferred over encrypted connections. PastBook's privacy and consent tooling answers each question with documentation rather than promises."}, {"stage": "Trial", "narrative": "Permissions are granted at production scale and the Facebook Photo Books flow runs through its first holiday season under Meta's terms: import completion is monitored, deletion requests are executed and logged, and no data-use complaint reaches the platform from the thousands of year-books made in the peak."}, {"stage": "Engagement", "narrative": "The relationship settles into an annual rhythm: the data-use review is completed on time each year with the same documentation, SDK and Graph API version changes are adopted inside the deprecation window through PastBook's integration gateway, and Meta's contact hears from PastBook before a change ships rather than after something breaks."}, {"stage": "Retention", "narrative": "Meta keeps the developer because it has had no policy incident in years and gives Facebook users a reason to value their photo archive; PastBook stays because the Facebook flow is the only way its timeline archivists can print 2009 to 2025 in one click, while it deliberately grows the phone and cloud-drive sources so that a second withdrawal would never again cost it a core channel."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-plat-top", "name": "Orders originating through the channel", "description": "Paid orders per month that originate through a platform channel: an install from the App Store or Google Play, a Facebook Login and year selection, or a Dropbox or Google Drive import, out of a modeled total of roughly 750,000 orders a year across all consumer segments. Modeled seed value, not an official PastBook figure.", "unit": "orders per month", "currentValue": "52000", "targetValue": "85000", "link": "https://dashboard.example.com/instant-photo-book-platform/customers/plat/kpis/co-plat-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-plat-co-plat-top.png"}, "branches": [{"id": "co-plat-b1", "name": "Channel compliance and health", "description": "Whether the developer stays inside the platform's rules and whether the integrations the platform provides keep working for its users.", "currentValue": "72", "icon": "kpi-plat-co-plat-b1.png", "children": [{"id": "co-plat-b1-c1", "name": "Policy compliance incidents", "description": "Enforcement actions, warnings, rejected data-use reviews or payment scheme notices recorded against PastBook per quarter across all platforms.", "unit": "incidents per quarter", "currentValue": "3", "targetValue": "0", "icon": "kpi-plat-co-plat-b1-c1.png", "childr cy events", "description": "Yearly revenue lost when a platform withdraws a source, rejects a release or suspends an integration, estimated from the orders the affected flow produced before the event; the Instagram withdrawal is the reference case.", "unit": "USD thousand per year", "currentValue": "600", "targetValue": "100", "icon": "kpi-plat-bo-plat-b2-c2.png", "children": [{"id": "bo-plat-b2-c2-l1", "name": "Days of channel downtime per year", "description": "Days per year on which a store listing, login provider, cloud import or payment method was unavailable to customers.", "unit": "days", "currentValue": "3.5", "targetValue": "0.5", "icon": "kpi-plat-bo-plat-b2-c2-l1.png", "children": []}, {"id": "bo-plat-b2-c2-l2", "name": "Customers migrated after a source withdrawal", "description": "Share of customers who had used a withdrawn source and placed a new order through another source within twelve months.", "unit": "%", "currentValue": "35", "targetValue": "70", "icon": "kpi-plat-bo-plat-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Be the developer and merchant every platform wants in its ecosystem: an app that passes review first time, a privacy programme that treats users' photos as the platform would, payments and parcels that create no disputes, and a customer relationship owned through the PastBook app and account, so that growth through Meta, the App Store, Google Play, cloud drives, payment providers and carriers is never again hostage to a single policy decision like Instagram's withdrawal.", "timeHorizons": {"year1": {"focus": "Restore source breadth after the Instagram loss and make compliance routine: camera roll, Facebook and cloud-drive imports all healthy, privacy labels, deletion and consent tooling that clears Meta's data-use review and store review first time, and monitoring of login, payment and API health against each platform's thresholds.", "productTheme": "Compliant, multi-source import", "customerKPI": {"northStar     const customer = {"id": "csup", "name": "Customer Support Agent", "description": "Works one of the 24/7 shifts that PastBook staffs from the Netherlands, the United States, Sri Lanka and India, answering customers on WhatsApp, e-mail and chat in whichever of the ten site languages the ticket arrives in. A typical shift mixes where-is-my-order questions against the published delivery windows (United States 4\u20138 business days, United Kingdom 4\u20135, France, the Netherlands, Italy and Germany 3\u20135, Canada and Australia 5\u201310), address fixes and cover upgrades that must land before production starts on payment, complaints about colour, binding or a blurry photo the curation engine let through, and the decision whether to reprint from the stored print file or refund. The agent also owns PastBook's public promise on Trustpilot, where the company replies to every negative review, typically within 48 hours, and defends a TrustScore of 4.5 from 35,837 reviews with 79% five-star and 2% one-star. Volume is heavily seasonal: the Q4 Year in Review and gift peak multiplies contacts, and a Christmas cut-off missed in one time zone becomes a refund in another.", "icon": "csup.png", "careAbout": ["One order view that shows payment, print file, routed partner facility, production status and carrier tracking, so the agent never has to ask the customer what they already told the app", "Authority and a one-click path to reprint from the stored print file or refund within a set limit without escalating to a manager in another time zone", "Delivery windows, Christmas cut-off dates and production times per country that are current in the desk and identical to what the website and the app show", "Clean shift handover between Amsterdam, New York, Colombo and New Delhi so a WhatsApp conversation continues without repeating the story", "Macros and help center articles in ten languages that match the current product rules: cover thresholds, extra-page prices, seven currencies, the Instagram withdrawal", "Seeing that complaints they tag as a print defect or a curation miss actually reach production operations and the curation team"], "winsThem": ["A support desk that opens WhatsApp, e-mail and chat in one queue with the customer's orders, shipments and print files already attached", "Reprint and refund handling that reroutes a reprint to the nearest partner with priority and shows the agent the new delivery estimate to quote", "A Trustpilot and app store review inbox with a 48-hour countdown, the linked order and a suggested reply in the customer's language", "Root-cause tags on every ticket that produce a weekly list the agent can hand to operations, the curation team and the growth team", "Proactive delay notifications that answer the where-is-my-order question before the customer writes"], "theirFear": ["Promising a Christmas delivery from an outdated cut-off table and then having to refund a grandparent's Year in Review book that arrives in January", "Approving a reprint that ships to the same wrong address because the desk did not show the address change the customer made an hour earlier", "A negative Trustpilot review passing the 48-hour mark unanswered during a peak weekend shift and being visible to the next 35,000 readers"], "jobsToBeDone": [{"id": "jtbd-csup-1", "name": "Resolve an order problem in one contact", "whatItIs": "Take a WhatsApp, e-mail or chat contact about an existing order, identify the customer and the order, see where it is between payment, print file, partner production and carrier, apply the change the customer needs or explain the accurate status, and close the conversation without a second contact or a handover to another shift.", "outcome": "The customer leaves the conversation with the problem solved or a precise delivery statement, the ticket carries a resolution code and root-cause tag, and no colleague in the next time zone has to reopen it.", "steps": [{"step": "Identify the customer and the order from the channel", "description": "Match the incoming WhatsApp number, e-mail address or chat session to the customer account and its recent orders, or find the order by number, and verify the customer before showing addresses, photos or payment details. Multi-book and gift orders often arrive under a different name than the recipient.", "streamsNeeded": [{"id": "resolve-support-requests-and-reprints", "name": "Resolve Support Requests And Reprints", "howItSupports": "Opens the contact in one queue with the matched account and recent orders attached, so the agent does not ask for information the app already holds."}, {"id": "protect-photo-privacy-and-platform-compliance", "name": "Protect Photo Privacy And Platform Compliance", "howItSupports": "Enforces the verification step before personal photos, addresses or payment data are shown to or shared with the person on the other end."}]}, {"step": "See exactly where the order is", "description": "Read the order timeline: paid, print file rendered and preflighted, routed to which partner facility, in production, handed to which carrier, and the tracking events, against the published delivery window for the destination country and the production time of the slowest product in a multi-product order.", "streamsNeeded": [{"id": "produce-ship-and-track-the-order", "name": "Produce Ship And Track The Order", "howItSupports": "Shows production status, carrier handover and tracking events per parcel next to the delivery window for the country."}, {"id": "render-print-ready-files-and-route-to-a-printer", "name": "Render Print Ready Files And Route To A Printer", "howItSupports": "Shows whether the print file was rendered and accepted, and which partner facility received the job and when."}]}, {"step": "Apply the change the customer needs", "description": "Fix an address or a recipient name, upgrade a soft cover to hard cover or a small to a large book, add a gift card, or cancel an order that has not entered production yet, and take the price difference in the customer's currency. Changes after production starts are handled as a reprint or refund decision instead.", "streamsNeeded": [{"id": "choose-format-price-and-checkout", "name": "Choose Format Price And Checkout", "howItSupports": "Provides the price rules, cover thresholds, currencies and payment methods needed to change an order and charge or refund the difference."}, {"id": "resolve-support-requests-and-reprints", "name": "Resolve Support Requests And Reprints", "howItSupports": "Logs the change on the ticket and pushes it to the order before the print file is released to the partner."}]}, {"step": "Answer in the customer's language with a delivery statement the customer can trust", "description": "Reply with the accurate status and the remaining delivery window, using localised macros for the ten site languages, and mention cut-off dates when a gift date is involved. Avoid promising a date the carrier data does not support.", "streamsNeeded": [{"id": "produce-ship-and-track-the-order", "name": "Produce Ship And Track The Order", "howItSupports": "Supplies the per-country delivery windows and live tracking that make the delivery statement accurate."}]}, {"step": "Close with a resolution code and a clean handover", "description": "Record how the problem was solved, tag the root cause, and either close the ticket or leave a structured note so the Colombo or New York shift can continue the conversation without asking the customer to repeat themselves.", "streamsNeeded": [{"id": "resolve-support-requests-and-reprints", "name": "Resolve Support Requests And Reprints", "howItSupports": "Captures resolution codes, root-cause tags and shift notes and keeps the conversation thread across channels and time zones."}]}]}, {"id": "jtbd-csup-2", "name": "Reprint or refund quickly when quality or delivery fails", "whatItIs": "Handle a complaint about a defective, damaged, lost or late book, calendar or poster: collect the evidence, classify the cause, decide between a reprint and a refund within the agent's authority, trigger the reprint from the stored print file to the nearest partner, and follow it until the customer confirms.", "outcome": "Customers with a legitimate failure get a reprint in production the same day or a refund within the agent's authority in one contact, the cause is recorded correctly for operations, and the recovered customer is more likely to order again than to leave a one-star review.", "steps": [{"step": "Collect the evidence", "description": "Ask for or receive photos of the defect (colour cast, binding, cropped faces, blurry pages), the packaging when parcels arrive damaged, or confirm from carrier data that a parcel is lost or stalled beyond the delivery window.", "streamsNeeded": [{"id": "resolve-support-requests-and-reprints", "name": "Resolve Support Requests And Reprints", "howItSupports": "Attaches photos and carrier evidence to the ticket and links them to the order and the print file that was produced."}]}, {"step": "Classify the cause", "description": "Decide whether the failure is a print defect at the partner, transit damage or loss, an address problem, or a photo that was low resolution or blurry when the curation engine selected it, because the classification decides who pays and who fixes.", "streamsNeeded": [{"id": "produce-ship-and-track-the-order", "name": "Produce Ship And Track The Order", "howItSupports": "Shows which partner produced the job and which carrier handled it, with tracking events that distinguish loss from delay."}, {"id": "manage-the-global-print-partner-network", "name": "Manage The Global Print Partner Network", "howItSupports": "Provides the partner's quality history and accepted defect definitions so the agent classifies consistently with operations."}]}, {"step": "Decide reprint or refund within authority", "description": "Offer a free reprint by default for defects and losses, a refund when the gift date has passed or the customer asks for one, or a partial refund for minor issues, within the limit set per agent level; escalate only above the limit.", "streamsNeeded": [{"id": "resolve-support-requests-and-reprints", "name": "Resolve Support Requests And Reprints", "howItSupports": "Applies the reprint and refund policy and authority limits so the agent decides in the conversation instead of escalating."}, {"id": "choose-format-price-and-checkout", "name": "Choose Format Price And Checkout", "howItSupports": "Executes the refund in the original currency and payment method, including promo and gift card portions."}]}, {"step": "Trigger the reprint from the stored print file", "description": "Reprint the order from the stored, already preflighted print file, corrected address if needed, routed with priority to the nearest partner with capacity, and quote the customer the new production and delivery estimate.", "streamsNeeded": [{"id": "render-print-ready-files-and-route-to-a-printer", "name": "Render Print Ready Files And Route To A Printer", "howItSupports": "Re-releases the stored print file as a priority job to the best partner facility without the customer re-uploading anything."}]}, {"step": "Follow the reprint to delivery and close the loop", "description": "Watch the reprint through production and carrier handover, confirm delivery with the customer, and invite a satisfied customer to update their review or rate the app.", "streamsNeeded": [{"id": "produce-ship-and-track-the-order", "name": "Produce Ship And Track The Order", "howItSupports": "Tracks the reprint parcel so the agent can confirm delivery proactively."}, {"id": "retain-customers-with-yearbooks-and-reminders", "name": "Retain Customers With Yearbooks And Reminders", "howItSupports": "Triggers the rating prompt and reorder path once a recovered customer confirms the reprint arrived well."}]}]}, {"id": "jtbd-csup-3", "name": "Turn complaints and reviews into product and partner fixes", "whatItIs": "Answer every negative Trustpilot and app store review within 48 hours, tag every contact with a root cause, and turn the weekly pattern into concrete requests to production operations (partner defects), the curation team (blurry or duplicate photos let through), commerce (price and promo confusion) and the help center.", "outcome": "Negative reviews are answered publicly within 48 hours, root-cause tags cover almost every ticket, and the causes of the most frequent complaints fall quarter over quarter because the teams that own them receive them with order-level evidence.", "steps": [{"step": "Answer every negative review within 48 hours", "description": "Work the Trustpilot, App Store and Google Play review inbox, match each negative review to the order, reply publicly in the reviewer's language with the concrete fix offered, and move the conversation to WhatsApp or e-mail for the reprint or refund.", "streamsNeeded": [{"id": "resolve-support-requests-and-reprints", "name": "Resolve Support Requests And Reprints", "howItSupports": "Brings reviews into the same queue as tickets with the linked order and a 48-hour countdown."}, {"id": "retain-customers-with-yearbooks-and-reminders", "name": "Retain Customers With Yearbooks And Reminders", "howItSupports": "Feeds the rating prompts that produce reviews and lets the agent invite a recovered reviewer to update their rating."}]}, {"step": "Tag every contact with a root cause", "description": "Use one root-cause taxonomy across channels: delivery delay by country, print defect by type, curation miss, checkout or promo confusion, Facebook import failure, privacy or deletion request, and keep tags consistent across the four support locations.", "streamsNeeded": [{"id": "resolve-support-requests-and-reprints", "name": "Resolve Support Requests And Reprints", "howItSupports": "Provides the shared taxonomy and forces a tag before a ticket can be closed."}]}, {"step": "Route the pattern to the team that owns the cause", "description": "Send weekly the partner defect clusters with order and print file evidence to production operations, the curation misses with the photos to the curation team, and the checkout or promo confusion to the growth and commerce teams.", "streamsNeeded": [{"id": "manage-the-global-print-partner-network", "name": "Manage The Global Print Partner Network", "howItSupports": "Receives defect clusters per partner facility and turns them into audits and partner corrective actions."}, {"id": "curate-the-best-photos-with-ai", "name": "Curate The Best Photos With Ai", "howItSupports": "Receives examples of blurry, duplicate or wrongly grouped photos that were selected, to improve scoring and grouping."}]}, {"step": "Update help center articles and macros", "description": "Rewrite the articles and macros in ten languages when rules change: cover thresholds, extra-page prices, delivery windows, the Instagram withdrawal, how to delete photos and data, so the next customer self-serves.", "streamsNeeded": [{"id": "resolve-support-requests-and-reprints", "name": "Resolve Support Requests And Reprints", "howItSupports": "Manages macros and help articles next to the tickets they should deflect."}, {"id": "protect-photo-privacy-and-platform-compliance", "name": "Protect Photo Privacy And Platform Compliance", "howItSupports": "Provides the scripted, compliant handling for photo deletion, GDPR and CCPA requests that the articles and macros must reflect."}]}]}], "customerJourneyStories": [{"id": "journey-csup-1", "name": "A new night-shift agent in Colombo adopts the support desk", "linkedJobIds": ["jtbd-csup-1", "jtbd-csup-2"], "summary": "An agent who joins the outsourced support pod in Colombo to cover the US evening and night hours learns the PastBook support desk during the run-up to Q4, doubts whether she can decide reprints and refunds for American customers from Sri Lanka, and within one peak season handles where-is-my-order, address fixes and reprints in one contact.", "stages": [{"stage": "Trigger", "narrative": "She joins the Colombo pod that covers the United States evening and night, PastBook's largest market with about 80% of customers, weeks before the Year in Review peak. Her previous employer handled telecom tickets from a spreadsheet and three separate tools; she has never worked orders that turn into physical books printed by partners on another continent."}, {"stage": "Discovery", "narrative": "In onboarding the team lead shows her the support desk that PastBook uses across the Netherlands, United States, Sri Lanka and India: WhatsApp, e-mail and chat in one queue, every contact opening with the customer's orders, print files and carrier tracking attached, and a shift-handover note from the Amsterdam morning. She reads the help center in English first and sees the same articles exist in ten languages."}, {"stage": "Evaluation", "narrative": "She wonders whether she is allowed to decide a reprint for a customer in Texas at 2 a.m. Amsterdam time. What convinces her is that the desk encodes the policy: reprint and refund authority per agent level, the delivery windows per country and the Christmas cut-offs as data rather than memory, and the reprint button that shows where the job would be reprinted and when it would arrive."}, {"stage": "Trial", "narrative": "Her first shifts are shadowed: she works tracking questions against the US 4\u20138 business day window, changes addresses before production starts, and approves her first reprint for a book with a colour cast, watching it route to the US partner as a priority job. A senior in New York reviews her closing notes and root-cause tags."}, {"stage": "Engagement", "narrative": "By the second half of the peak she handles a full queue: WhatsApp conversations that started in the New Delhi shift continue in hers without the customer repeating, she reprints and refunds within her authority, and she quotes delivery statements she trusts because the carrier data is in front of her. Her first-contact resolution climbs toward the pod average."}, {"stage": "Retention", "narrative": "She stays with the pod after the peak because the desk made her decisions safe and visible: her reprint and refund calls were audited and upheld, her root-cause tags show up in the weekly list that operations acts on, and she is asked to write the Sinhala-speaking pod's first macro set for the Facebook import questions that cluster in her hours."}]}, {"id": "journey-csup-2", "name": "A senior Amsterdam agent takes over the review and root-cause loop", "linkedJobIds": ["jtbd-csup-3", "jtbd-csup-2"], "summary": "A senior agent in Amsterdam who has answered tickets for three years is asked to own the Trustpilot and app store review inbox and the weekly root-cause report, resists doing it in spreadsheets, and adopts the desk's review inbox and tagging so complaints become partner audits and curation fixes.", "stages": [{"stage": "Trigger", "narrative": "After a peak season in which several negative Trustpilot reviews were answered late because they lived in a separate browser tab, the support lead asks the most experienced Amsterdam agent to own the public review replies and the weekly complaint report to operations and product."}, {"stage": "Discovery", "narrative": "She learns that the desk can pull Trustpilot, App Store and Google Play reviews into the same queue as tickets, match them to orders and show a 48-hour countdown, and that root-cause tags on tickets can be aggregated per partner facility, country and cause without exporting anything. A colleague in the growth team shows her the reviews dashboard they already watch for ratings."}, {"stage": "Evaluation", "narrative": "Her concern is that tagging costs the team time it does not have in Q4 and that nobody downstream will act. She evaluates a month of tags against the reprint cases and sees that two partner facilities and one curation issue explain most defects; production operations confirms they would audit a partner on that evidence. The company's public promise, replies to 100% of negative reviews typically within 48 hours, becomes measurable per shift."}, {"stage": "Trial", "narrative": "For one quarter she runs the loop for real: every negative review answered from the inbox with the linked order, a mandatory root-cause tag before closing, and a weekly list to operations, the curation team and commerce. The first result is a partner corrective action on binding and a fix for a promo code that confused customers in Brazil."}, {"stage": "Engagement", "narrative": "The review inbox and the weekly root-cause report become part of the Amsterdam shift routine; agents in all four locations tag consistently because the taxonomy is in the desk, and the help center articles she updates deflect the questions she saw repeating."}, {"stage": "Retention", "narrative": "She keeps ownership because the loop gives her leverage she never had on the front line: the one-star share stays around the 2% Trustpilot shows publicly while volume grows, the causes she reports are visibly closed by operations and the curation team, and she now trains new agents in Colombo and New Delhi on why a tag is worth ten seconds."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-csup-top", "name": "First-contact resolution rate", "description": "Share of WhatsApp, e-mail and chat contacts about an order that are fully resolved in the first conversation, without a follow-up contact, a shift handover or an escalation. Modeled seed value for a 24/7 desk staffed from four countries; not an official PastBook figure.", "unit": "%", "currentValue": "71", "targetValue": "85", "link": "https://dashboard.example.com/instant-photo-book-platform/customers/csup/kpis/co-csup-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-csup-co-csup-top.png"}, "branches": [{"id": "co-csup-b1", "name": "Speed of response and resolution", "description": "How fast a customer gets a first answer on each channel and how quickly the ticket is actually resolved, across shifts in the Netherlands, United States, Sri Lanka and India.", "currentValue": "74", "icon": "kpi-csup-co-csup-b1.png", "children": [{"id": "co-csup-b1-c1", "name": "Median first response time", "description": "Median minutes from the customer's first message to the first agent reply, blended across WhatsApp, chat and e-mail over the 24/7 rota.", "unit": "minutes", "currentValue": "38", "targetValue": "15", "icon": "kpi-csup-co-csup-b1-c1.png", "children": [{"id": "co-csup-b1-c1-l1", "name": "Chat and WhatsApp first response time", "description": "Median minutes to the first agent reply on the real-time channels, including night and weekend shifts.", "unit": "minutes", "currentValue": "6", "targetValue": "3", "icon": "kpi-csup-co-csup-b1-c1-l1.png", "children": []}, {"id": "co-csup-b1-c1-l2", "name": "E-mail first response time", "description": "Median hours to the first agent reply on e-mail tickets, where the backlog builds during the Q4 peak.", "unit": "hours", "currentValue": "5", "targetValue": "2", "icon": "kpi-csup-co-csup-b1-c1-l2.png", "children": []}]}, {"id": "co-csup-b1-c2", "name": "Median time to resolution", "description": "Median hours from the first message to the ticket being closed with a resolution code, including reprints that need a partner confirmation.", "unit": "hours", "currentValue": "20", "targetValue": "8", "icon": "kpi-csup-co-csup-b1-c2.png", "children": [{"id": "co-csup-b1-c2-l1", "name": "Tickets resolved within 24 hours", "description": "Share of tickets closed within 24 hours of the first message.", "unit": "%", "currentValue": "68", "targetValue": "85", "icon": "kpi-csup-co-csup-b1-c2-l1.png", "children": []}, {"id": "co-csup-b1-c2-l2", "name": "Tickets reopened after closure", "description": "Share of closed tickets the customer reopens because the answer or fix did not hold.", "unit": "%", "currentValue": "9", "targetValue": "4", "icon": "kpi-csup-co-csup-b1-c2-l2.png", "children": []}]}]}, {"id": "co-csup-b2", "name": "Qu     function jobNamesForCustomer(jobIds) {
        const jobs = (customer.jobsToBeDone || []);
        const jobLookup = {};
        jobs.forEach(job => {
            if (job.id) {
                jobLookup[job.id] = job.name || job.id;
            }
        });
        return (jobIds || []).map(jobId => jobLookup[jobId] || jobId);
    }

    function kpiNamesForLink(link) {
        // Prefer stable KPI IDs resolved against this customer's KPI pyramid; fall back to legacy display-name kpis.
        if (link && link.kpiIds && link.kpiIds.length) {
            const lookup = {};
            function walk(node) {
                if (!node) return;
                if (node.id) {
                    lookup[node.id] = node.name || node.id;
                }
                (node.branches || []).forEach(walk);
                (node.children || []).forEach(walk);
            }
            const pyramids = (customer || {}).kpiPyramids || {};
            ['customerOutcomes', 'businessOutcomes'].forEach(key => {
                const pyramid = pyramids[key];
                if (!pyramid) return;
                walk(pyramid.top);
                (pyramid.branches || []).forEach(walk);
            });
            return link.kpiIds.map(kpiId => lookup[kpiId] || kpiId);
        }
        return (link && link.kpis) || [];
    }

                    html += '<div style="margin-bottom: 10px"><b>Product implication:</b> ' + escapeHtml(insight.implication) + '</div>';

                if (insight.link) {
                    if (insight.link.jobIds && insight.link.jobIds.length) {

    function kpiIconFile(node) {
        return (node && node.icon) ? node.icon : 'kpi.png';
    }

    function kpiCurrentValue(node) {
        if (!node || !node.currentValue) {
            return '';
        }
        return String(node.currentValue) + (node.unit ? ' (' + String(node.unit) + ')' : '');
    }

    function kpiValueStatusLabel(node) {
        if (!node || !node.valueStatus) {
            return '';
        }
        const labels = {
            example: 'illustrative example',
            baseline: 'measured baseline',
            target: 'target',
            placeholder: 'placeholder'
        };
        return labels[node.valueStatus] || String(node.valueStatus);
    }

    function renderKpiMeta(node) {
        let html = '';
        if (node && node.currentValue) {
            const statusLabel = kpiValueStatusLabel(node);
            const valueLabel = (node.valueStatus === 'target') ? 'Target:' : 'Current:';
            html += '<div style="font-size: 80%; color: #1d4ed8; margin-top: 4px"><b>' + valueLabel + '</b> ' + escapeHtml(kpiCurrentValue(node));
            if (statusLabel) {
                html += ' <span style="color:#888; font-style: italic;">(' + escapeHtml(statusLabel) + ')</span>';
            }
            html += '</div>';
        }
        if (node && node.target) {
            html += '<div style="font-size: 80%; color: #047857; margin-top: 2px"><b>Target:</b> ' + escapeHtml(String(node.target)) + '</div>';
        }
        if (node && node.guardrailRole) {
            html += '<div style="font-size: 78%; color: #b91c1c; margin-top: 2px"><b>Guardrail:</b> ' + escapeHtml(String(node.guardrailRole)) + '</div>';
        }
        if (node && (node.period || node.calculationMethod || node.valueSource)) {
            html += '<div style="font-size: 76%; color: #6b7280; margin-top: 3px">';
            if (node.period) { html += '<div><b>Period:</b> ' + escapeHtml(String(node.period)) + '</div>'; }
            if (node.calculationMethod) { html += '<div><b>How measured:</b> ' + escapeHtml(String(node.calculationMethod)) + '</div>'; }
            if (node.valueSource) { html += '<div><b>Value source:</b> ' + escapeHtml(String(node.valueSource)) + '</div>'; }
            html += '</div>';
        }
        if (node && node.guardrail) {
            html += '<div style="font-size: 76%; color: #7c3aed; margin-top: 3px"><b>Composite guardrail:</b> ' + escapeHtml(String(node.guardrail)) + '</div>';
        }
        if (node && node.link) {
            html += '<div style="font-size: 80%; margin-top: 4px"><a target="_blank" rel="noopener noreferrer" href="' + escapeHtml(node.link) + '">' + escapeHtml(node.linkLabel || 'Open link') + '</a></div>';
        }
        return html;
    }

        let html = '';
        html += '<div class="kpi-title">';
        html += '<div><img class="kpi-icon" src="../icons/' + escapeHtml(kpiIconFile(node)) + '" onerror="this.onerror=null;this.src=\'../icons/kpi.png\'"></div>';
        html += '<div><div>' + escapeHtml(node.name || '') + '</div>' + renderKpiMeta(node) + '</div>';

    function normalizeRoadmapKpi(value, supportingKey) {
        if (!value) {
            return {northStar: '', [supportingKey]: []};
        }
        if (typeof value === 'string') {
            return {northStar: value, [supportingKey]: []};
        }
        const normalized = Object.assign({}, value);
        normalized.northStar = normalized.northStar || normalized.name || '';
        normalized[supportingKey] = normalized[supportingKey] || [];
        return normalized;
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function formatDate(dateValue) {
        if (!dateValue) return 'No date';
        const date = new Date(dateValue + 'T00:00:00');
        if (isNaN(date.getTime())) return dateValue;
        return date.toLocaleDateString('en-GB', {year: 'numeric', month: 'short', day: 'numeric'});
    }

    function renderKpis(items) {
        let html = '';
        items.forEach(item => {
            html += '<div><b>' + escapeHtml(item.kpi) + '</b>';
            if (item.unit) {
                html += ' <span class="activity-muted">(' + escapeHtml(item.unit) + ')</span>';
            }
            if (item.expectedImpact) {
                html += ': ' + escapeHtml(item.expectedImpact);
            }
            if (item.currentValue) {
                html += '<div class="activity-muted"><b>Current:</b> ' + escapeHtml(String(item.currentValue)) + '</div>';
            }
            if (item.description) {
                html += '<div class="activity-muted">' + escapeHtml(item.description) + '</div>';
            }
            if (item.link) {
                html += '<div class="activity-muted"><a target="_blank" rel="noopener noreferrer" href="' + escapeHtml(item.link) + '">' + escapeHtml(item.linkLabel || 'Open link') + '</a></div>';
            }
            html += '</div>';
        });
        return html;
    }

    function renderImpactCell(item, currentCustomerId) {
        let html = '';
        (item.customerImpact || []).forEach(impact => {
            const isCurrent = impact.customerId === currentCustomerId;
            html += '<div class="activity-block' + (isCurrent ? ' activity-pill-highlight' : '') + '">';
            html += '<div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">';
            html += '<img class="activity-icon activity-icon-round" src="../icons/' + escapeHtml(impact.customer.icon) + '" onerror="this.onerror=null;this.src=\'../icons/customer.png\'">';
            html += '<div><div style="font-weight:bold; color:' + (isCurrent ? '#1d4ed8' : '#111827') + '">' + escapeHtml(impact.customer.name) + ' <span class="activity-muted">(' + escapeHtml(impact.customerId) + ')</span></div></div>';
            html += '</div>';
            html += renderKpis(impact.customerKPIs || []);
            html += renderKpis(impact.businessKPIs || []);
            html += '</div>';
        });
        return html || '<span class="activity-muted">No customer impact listed</span>';
    }

    function renderBrickCell(item) {
        let html = '';
        (item.productBricks || []).forEach(brick => {
            html += '<div class="activity-pill">';
            html += '<img class="activity-icon" src="../../product-bricks/icons/' + escapeHtml(brick.brick.icon) + '" onerror="this.onerror=null;this.src=\'../../product-bricks/icons/logo.png\'">';
            html += '<div><div><b>' + escapeHtml(brick.brick.name) + '</b> <span class="activity-muted">(#' + escapeHtml(brick.brickId) + ')</span></div><div class="activity-muted">' + escapeHtml(brick.change) + '</div></div>';
            html += '</div>';
        });
        return html || '<span class="activity-muted">No product bricks listed</span>';
    }

    function renderChannelCell(item) {
        let html = '';
        (item.deliveryChannels || []).forEach(channel => {
            html += '<div class="activity-pill">';
            html += '<img class="activity-icon" src="../../product-deployments/icons/' + escapeHtml(channel.channel.icon) + '" onerror="this.onerror=null;this.src=\'../../product-deployments/icons/product.png\'">';
            html += '<div><div><b>' + escapeHtml(channel.channel.name) + '</b> <span class="activity-muted">(' + escapeHtml(channel.channelId) + ')</span></div><div class="activity-muted">' + escapeHtml(channel.change) + '</div></div>';
            html += '</div>';
        });
        return html || '<span class="activity-muted">No delivery channels listed</span>';
    }

    function renderActivityTable(data, kind, currentCustomerId) {
        const items = (data && data.items) ? data.items : [];
        let html = '';
        html += '<div class="activity-summary">';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.length + '</div><div class="activity-stat-label">' + kind + '</div></div>';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.filter(item => (item.customerImpact || []).length > 0).length + '</div><div class="activity-stat-label">With customer impact</div></div>';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.filter(item => (item.productBricks || []).length > 0).length + '</div><div class="activity-stat-label">With bricks</div></div>';
        html += '</div>';

        if (!items.length) {
            html += '<div class="group" style="margin-top:0">No related ' + kind.toLowerCase() + ' found for this customer.</div>';
            return html;
        }

        html += '<table class="activity-table">';
        html += '<tr><th>Date</th><th>Description</th><th>Customer Impact</th><th>Product Bricks</th><th>Delivery Channels</th></tr>';
        items.forEach(item => {
            html += '<tr>';
            html += '<td style="white-space:nowrap">' + escapeHtml(formatDate(item.date)) + '</td>';
            html += '<td><a class="activity-link" target="_blank" rel="noopener noreferrer" href="../../' + kind.toLowerCase() + '/landing_pages/' + item.landingPageIndex + '.html">' + escapeHtml(item.description || item.name || kind) + '</a></td>';
            html += '<td>' + renderImpactCell(item, currentCustomerId) + '</td>';
            html += '<td>' + renderBrickCell(item) + '</td>';
            html += '<td>' + renderChannelCell(item) + '</td>';
            html += '</tr>';
        });
        html += '</table>';
        return html;
    }

    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
