are of last year's customers who order again this year.", "unit": "%", "currentValue": "24", "targetValue": "35", "icon": "kpi-gmkt-bo-gmkt-b1-c1-l2.png", "children": []}]}, {"id": "bo-gmkt-b1-c2", "name": "Revenue per customer per year", "description": "Paid revenue per active customer per year in USD: orders per customer times average order value.", "unit": "USD", "currentValue": "48", "targetValue": "60", "icon": "kpi-gmkt-bo-gmkt-b1-c2.png", "children": [{"id": "bo-gmkt-b1-c2-l1", "name": "Orders per customer per year", "description": "Average number of paid orders per active customer per year.", "unit": "orders", "currentValue": "1.3", "targetValue": "1.55", "icon": "kpi-gmkt-bo-gmkt-b1-c2-l1.png", "children": []}, {"id": "bo-gmkt-b1-c2-l2", "name": "Large hardcover and calendar share of orders", "description": "Share of orders that are large hardcover books (USD 34.99 base) or wall calendars (USD 24.99 and 34.99) rather than small hardcovers.", "unit": "%", "currentValue": "38", "targetValue": "46", "icon": "kpi-gmkt-bo-gmkt-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-gmkt-b2", "name": "Promotion discipline and seasonality", "description": "How much revenue is given away in discounts and how dependent revenue and spend are on the Q4 peak.", "currentValue": "55", "icon": "kpi-gmkt-bo-gmkt-b2.png", "children": [{"id": "bo-gmkt-b2-c1", "name": "Promotion discount as share of gross revenue", "description": "Discounts and free-shipping incentives granted through promo codes as a share of gross order value before discount.", "unit": "%", "currentValue": "17", "targetValue": "12", "icon": "kpi-gmkt-bo-gmkt-b2-c1.png", "children": [{"id": "bo-gmkt-b2-c1-l1", "name": "Orders using a promo code", "description": "Share of paid orders that redeemed a promo code or free-shipping upgrade.", "unit": "%", "currentValue": "61", "targetValue": "50", "icon": "kpi-gmkt-bo-gmkt-b2-c1-l1.png", "children": []}, {"id": "bo-gmkt-b2-c1-l2", "name": "Average discount per promo order", "description": "Average discount on orders that used a promo code, as a share of gross order value.", "unit": "%", "currentValue": "28", "targetValue": "24", "icon": "kpi-gmkt-bo-gmkt-b2-c1-l2.png", "children": []}]}, {"id": "bo-gmkt-b2-c2", "name": "Q4 share of annual revenue", "description": "Share of the year's paid revenue booked in October to December, driven by Year in Review, calendars, posters and gift cards.", "unit": "%", "currentValue": "46", "targetValue": "40", "icon": "kpi-gmkt-bo-gmkt-b2-c2.png", "children": [{"id": "bo-gmkt-b2-c2-l1", "name": "Q4 share of annual paid spend", "description": "Share of the year's paid marketing spend deployed in October to December.", "unit": "%", "currentValue": "48", "targetValue": "42", "icon": "kpi-gmkt-bo-gmkt-b2-c2-l1.png", "children": []}, {"id": "bo-gmkt-b2-c2-l2", "name": "Spring gifting campaign revenue share", "description": "Share of annual revenue from Mother's Day, graduation and wedding-season campaigns in March to June.", "unit": "%", "currentValue": "8", "targetValue": "12", "icon": "kpi-gmkt-bo-gmkt-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Give PastBook's growth team one console to buy, earn and keep customers in ten languages and seven currencies: campaigns and promotions planned per country and season, attribution that reconciles installs and orders daily, funnel data from install to preview to order, and lifecycle programmes that turn a first yearbook into an annual habit, so blended acquisition cost falls while the US-heavy, Q4-heavy business becomes a year-round one.", "timeHorizons": {"year1": {"focus": "Run the Q4 Year in Review campaign and the year's promotions from one console with daily attribution per channel and country, funnel visibility from install to preview to order, and promo codes that are localised once and switched off on time, so return on ad spend and blended acquisition cost are managed weekly rather than read in January.", "productTheme": "Campaign console with daily attribution and funnel visibility", "customerKPI": {"northStar": "Blended customer acquisition cost", "supporting": ["Return on ad spend", "Install to order conversion rate"]}, "businessKPI": {"northStar": "Marketing contribution margin per order", "revenueStreams": ["Small and large hardcover photo books", "Year in Review yearbooks, wall calendars and posters in Q4", "Gift cards and promotions"], "supporting": ["Repeat order share", "Promotion discount as share of gross revenue"]}, "milestones": ["Plan the seasonal calendar, budgets and promo codes per country and currency in the console and read return on ad spend per campaign daily", "Reconcile installs, previews and orders per channel and country, separating organic and featured installs from paid", "Run the first preview-to-checkout experiments on price display, cover upgrade and free-shipping incentives"]}, "year3": {"focus": "Build the annual memory habit: yearbook and calendar reminders, reorders of past years and gift copies per customer and country, abandoned-preview recovery with the customer's own book, and a rating programme that keeps the app eligible for store featuring, so a growing share of orders comes without paid spend and the Q4 dependence eases.", "productTheme": "Lifecycle programmes for the annual memory habit", "customerKPI": {"northStar": "Blended customer acquisition cost", "supporting": ["Preview to order conversion rate", "Organic share of new customers"]}, "businessKPI": {"northStar": "Marketing contribution margin per order", "revenueStreams": ["Repeat yearbook and calendar orders", "Gift copies and gift cards for family", "Spring gifting campaigns around Mother's Day and graduation"], "supporting": ["Customers ordering in two consecutive years", "Q4 share of annual revenue"]}, "milestones": ["Launch yearbook and calendar reminder programmes triggered from order history in all ten languages with control groups", "Ship reorder and gift-copy flows from the account and from reminders, including earlier Facebook years", "Lift spring gifting campaigns so revenue and paid spend are less concentrated in October to December"]}, "year5": {"focus": "Make PastBook grow mainly through earned channels in 150+ countries: shared highlight videos and gifted books that bring new customers, ratings that sustain featuring, and a brand promise around curation, personalisation and sustainability, with paid acquisition as the accelerator rather than the engine.", "productTheme": "Referral, ratings and brand-led growth", "customerKPI": {"northStar": "Blended customer acquisition cost", "supporting": ["Referral share of new customers", "Trustpilot TrustScore"]}, "businessKPI": {"northStar": "Marketing contribution margin per order", "revenueStreams": ["Photo books, calendars and posters across 150+ countries", "Gift copies and gift cards from referrals", "Premium large-format and personalisation add-ons"], "supporting": ["Revenue per customer per year", "Orders per customer per year"]}, "milestones": ["Make shared highlight videos and gifted books a measured referral channel with attribution and incentives", "Hold the Trustpilot TrustScore and store ratings at or above featuring thresholds in every market", "Reduce promotion dependence by selling personalisation and sustainability rather than discounts in mature markets"]}}}, "domain": "PastBook Operations"}, {"id": "opsm", "name": "Production and Fulfilment Operations Manager", "description": "Runs PastBook's production and fulfilment from Amsterdam or New York without owning a single press: books, calendars and posters are produced by partner printing facilities on four continents, most of them in the country of the customer, and shipped to 150+ countries. The manager owns the routing rules that send each paid order to the nearest facility with capacity and acceptable cost, the partner SLAs and integrations by API or hot folder, print specifications including FSC-certified paper and colour profiles, the delivery windows published per country (United States 4\u20138 business days after production, United Kingdom 4\u20135, France, the Netherlands, Italy and Germany 3\u20135, rest of the EU 5\u20137, Canada and Australia 5\u201310, New Zealand, India and Brazil 7\u201310), reprint root causes and the unit cost of a book against a small hardcover retail price of USD 19.99. The year is decided in the Q4 peak, when volume multiplies, Christmas cut-offs per country must hold, and every partner's capacity, quality and carrier performance is tested at once; production starts on payment, so there is no buffer to hide in.", "icon": "opsm.png", "careAbout": ["A production control tower that shows every paid order from print file to partner acceptance, production, carrier handover and delivery against the SLA and the published window for its country", "Routing rules that put cost, capacity, product type and the customer's country together, and that can be changed in minutes when a partner falls behind in the peak", "Print defect and reprint root causes per partner facility with the order and print file evidence, so audits and corrective actions rest on data rather than anecdotes", "Capacity forecasts for Q4 agreed with marketing, contracted per region with a backup partner, and monitored daily against actual intake", "Unit production and shipping cost per product and partner that make the gross margin behind a USD 19.99 small hardcover visible", "Sustainability commitments that hold in production: FSC-certified paper, local printing to cut shipping emissions, made-to-order with no stock"], "winsThem": ["A control tower that monitors production SLA and quality per partner, flags stuck or rejected jobs and lets the manager reroute in one action", "Routing that models the nearest facility, capacity, unit cost and product type per country, and switches to a backup automatically when a partner misses SLA", "Partner integrations by order API or hot folder with status callbacks, so partner acceptance and production progress arrive without e-mails", "Quality and reprint analytics that join support tickets, print files and partner batches into root causes per facility", "Peak planning that turns the marketing forecast into contracted capacity per region and daily intake versus capacity dashboards"], "theirFear": ["A US partner missing its SLA in the second week of December with no contracted backup, so thousands of Year in Review books miss Christmas and become refunds", "A colour profile or binding defect at one facility that is discovered from Trustpilot reviews weeks later instead of from a quality check at the partner", "Unit cost creeping up through cross-border shipping and rerouting while retail prices and discounts stay where marketing set them"], "jobsToBeDone": [{"id": "jtbd-opsm-1", "name": "Route every order to the right partner and deliver on time", "whatItIs": "Keep the routing rules, partner capacity and carrier performance such that every paid order is rendered, accepted by a partner facility near the customer, produced within SLA and delivered within the published window for its country, and intervene the same day when a job is stuck or rejected.", "outcome": "Orders are produced and handed to carriers within SLA and arrive within the published delivery windows in every country, exceptions are caught and rerouted before the customer notices, and marketing and support quote windows that hold.", "steps": [{"step": "Maintain routing rules per country, product and partner", "description": "Define which partner facility receives which products for which destination countries, with capacity ceilings, unit cost, SLA and fallback order, so most orders are produced in the customer's country and cross-border shipping is the exception.", "streamsNeeded": [{"id": "render-print-ready-files-and-route-to-a-printer", "name": "Render Print Ready Files And Route To A Printer", "howItSupports": "Executes the routing rules on every paid order and exposes the rule set the manager maintains."}, {"id": "manage-the-global-print-partner-network", "name": "Manage The Global Print Partner Network", "howItSupports": "Holds the partner profiles, SLAs, capacities and unit costs the routing rules depend on."}]}, {"step": "Monitor orders from payment to production start", "description": "Watch the queue of paid orders through rendering, preflight, partner acceptance and production start, since production starts on payment and every hour lost here is lost in the delivery window.", "streamsNeeded": [{"id": "render-print-ready-files-and-route-to-a-printer", "name": "Render Print Ready Files And Route To A Printer", "howItSupports": "Shows render, preflight and partner acceptance status and timing per job."}, {"id": "produce-ship-and-track-the-order", "name": "Produce Ship And Track The Order", "howItSupports": "Shows production start and progress per partner against the SLA clock."}]}, {"step": "Intervene on stuck, rejected or delayed jobs", "description": "Reroute jobs a partner rejected on preflight or cannot produce in time to the next facility, fix recurring file rejections with engineering, and reprioritise reprints and gift orders near cut-off dates.", "streamsNeeded": [{"id": "render-print-ready-files-and-route-to-a-printer", "name": "Render Print Ready Files And Route To A Printer", "howItSupports": "Allows rerouting and reprioritising jobs and shows rejection reasons per partner."}]}, {"step": "Track carrier performance per country", "description": "Measure handover-to-delivery times per carrier and country against the published windows, identify lanes that slip, and adjust carriers, service levels or the published window.", "streamsNeeded": [{"id": "produce-ship-and-track-the-order", "name": "Produce Ship And Track The Order", "howItSupports": "Provides tracking events per parcel aggregated into on-time rates per carrier and country."}]}, {"step": "Publish windows and cut-off dates to marketing and support", "description": "Set and communicate the production times, delivery windows and holiday cut-off dates per country and product that the website, app, campaigns and support desk all use.", "streamsNeeded": [{"id": "produce-ship-and-track-the-order", "name": "Produce Ship And Track The Order", "howItSupports": "Is the source of the delivery windows and cut-offs published per country."}, {"id": "run-seasonal-campaigns-and-promotions", "name": "Run Seasonal Campaigns And Promotions", "howItSupports": "Consumes cut-off dates so campaigns stop promising deliveries the network cannot make."}, {"id": "resolve-support-requests-and-reprints", "name": "Resolve Support Requests And Reprints", "howItSupports": "Consumes the same windows so agents quote what operations can deliver."}]}]}, {"id": "jtbd-opsm-2", "name": "Keep print quality and unit cost within target across partners", "whatItIs": "Hold every partner to the same print specification and defect definitions, audit quality, analyse reprint root causes with support, negotiate unit production and shipping costs, and feed what is learned back into preflight rules, so a book looks the same from every facility at a cost that leaves margin under the retail price.", "outcome": "Print defect and reprint rates fall per facility, unit production cost per book and shipping cost per order stay within target, FSC-certified paper is used everywhere, and the same complaint does not recur after a corrective action.", "steps": [{"step": "Define the print specification for all facilities", "description": "Specify paper (FSC-certified), cover materials, binding, colour profiles and packaging per product so a small hardcover from the US partner matches one from the EU or Australian partner.", "streamsNeeded": [{"id": "manage-the-global-print-partner-network", "name": "Manage The Global Print Partner Network", "howItSupports": "Stores the specification, the accepted defect definitions and each partner's certification against them."}]}, {"step": "Audit partner quality", "description": "Run sample checks and periodic audits per facility, review partner quality-check results before shipping, and track defects found at the partner versus defects found by customers.", "streamsNeeded": [{"id": "manage-the-global-print-partner-network", "name": "Manage The Global Print Partner Network", "howItSupports": "Schedules audits and records findings and corrective actions per partner facility."}]}, {"step": "Analyse reprint root causes with support", "description": "Join the support desk's root-cause tags and evidence with partner batches and print files to find whether a defect is a partner process, a file or colour profile issue, or a curation miss, and assign the fix.", "streamsNeeded": [{"id": "resolve-support-requests-and-reprints", "name": "Resolve Support Requests And Reprints", "howItSupports": "Supplies reprint cases with photos, root-cause tags and the order and print file they refer to."}, {"id": "manage-the-global-print-partner-network", "name": "Manage The Global Print Partner Network", "howItSupports": "Aggregates reprint causes per facility and tracks corrective actions to closure."}]}, {"step": "Negotiate unit prices and shipping rates", "description": "Review unit production cost per product and shipping cost per country with each partner and carrier, use volume forecasts and redundancy to negotiate, and keep cost aligned with retail prices and promotion levels.", "streamsNeeded": [{"id": "manage-the-global-print-partner-network", "name": "Manage The Global Print Partner Network", "howItSupports": "Holds unit cost per product and partner and the volume commitments behind the negotiated prices."}, {"id": "produce-ship-and-track-the-order", "name": "Produce Ship And Track The Order", "howItSupports": "Provides shipping cost and carrier performance per country to negotiate rates and service levels."}]}, {"step": "Feed learnings into preflight rules", "description": "Turn recurring file rejections and defects into automated preflight checks (bleed, resolution, colour profile, page count versus cover rules) so files are right before they reach a partner.", "streamsNeeded": [{"id": "render-print-ready-files-and-route-to-a-printer", "name": "Render Print Ready Files And Route To A Printer", "howItSupports": "Applies the preflight rules to every print file and reports what they catch."}]}]}, {"id": "jtbd-opsm-3", "name": "Scale capacity for the holiday peak without failures", "whatItIs": "Forecast the Q4 peak with marketing, contract capacity and backups per region, set Christmas cut-off dates per country, run the peak daily with rerouting and overflow, and review afterwards, so the year's largest volume ships on time without breaking partners, carriers or support.", "outcome": "The peak is delivered within SLA and windows in every region, no gift order misses Christmas because of capacity, partner utilisation stays below the level where quality breaks, and the review changes next year's contracts and cut-offs.", "steps": [{"step": "Forecast peak volume with marketing", "description": "Build the weekly Q4 volume forecast per country and product from the campaign plan and last year's actuals, including Year in Review books, calendars and posters, and agree it with the growth team.", "streamsNeeded": [{"id": "run-seasonal-campaigns-and-promotions", "name": "Run Seasonal Campaigns And Promotions", "howItSupports": "Provides the campaign calendar and spend plan the volume forecast is derived from."}, {"id": "manage-the-global-print-partner-network", "name": "Manage The Global Print Partner Network", "howItSupports": "Turns the forecast into capacity requirements per region and partner."}]}, {"step": "Contract capacity and backups per region", "description": "Secure daily capacity commitments per partner and product for the peak weeks, add a backup facility in every region where one partner carries all volume, and test the integration before November.", "streamsNeeded": [{"id": "manage-the-global-print-partner-network", "name": "Manage The Global Print Partner Network", "howItSupports": "Records capacity commitments, backups and integration readiness per partner and region."}]}, {"step": "Set cut-off dates per country", "description": "Calculate the last order date for Christmas delivery per country and product from production time plus the delivery window, publish it to the website, app, campaigns and support, and adjust if a carrier lane slips.", "streamsNeeded": [{"id": "produce-ship-and-track-the-order", "name": "Produce Ship And Track The Order", "howItSupports": "Provides production times and delivery windows per country that determine the cut-offs."}, {"id": "choose-format-price-and-checkout", "name": "Choose Format Price And Checkout", "howItSupports": "Shows cut-off dates and delivery promises at checkout so customers choose products that will arrive in time."}]}, {"step": "Run the peak daily", "description": "Compare intake against contracted capacity per partner every morning, shift volume to backups before a partner exceeds its ceiling, reprioritise gift orders near cut-off, and keep support informed about any lane at risk.", "streamsNeeded": [{"id": "render-print-ready-files-and-route-to-a-printer", "name": "Render Print Ready Files And Route To A Printer", "howItSupports": "Executes capacity-aware routing changes and overflow to backup partners."}, {"id": "produce-ship-and-track-the-order", "name": "Produce Ship And Track The Order", "howItSupports": "Shows daily production and carrier throughput against the plan per partner and country."}]}, {"step": "Review the peak and reset contracts", "description": "After the peak, review on-time rate, defects, utilisation and cost per partner and country, share what support saw in complaints, and change partner contracts, cut-offs and routing for next year.", "streamsNeeded": [{"id": "manage-the-global-print-partner-network", "name": "Manage The Global Print Partner Network", "howItSupports": "Holds the peak scorecard per partner and the contract and capacity changes decided for the next year."}, {"id": "resolve-support-requests-and-reprints", "name": "Resolve Support Requests And Reprints", "howItSupports": "Provides the complaint and reprint pattern of the peak per country and partner."}]}]}], "customerJourneyStories": [{"id": "journey-opsm-1", "name": "A new operations manager runs the first holiday peak from the production control tower", "linkedJobIds": ["jtbd-opsm-1", "jtbd-opsm-3"], "summary": "An operations manager who joins from a photo company with its own factories has to run PastBook's partner network through Q4 without owning a press, distrusts a dashboard she did not build, and after one peak runs routing, capacity and cut-offs from the production control tower.", "stages": [{"stage": "Trigger", "narrative": "She joins in September from a European photo products company that ran its own plants and finds that PastBook produces everything through partner facilities on four continents, that production starts on payment, and that the previous manager tracked partner status by e-mail and a weekly call. The Q4 peak is ten weeks away."}, {"stage": "Discovery", "narrative": "The print and fulfilment engineering team shows her the production control tower they built on the order feed: every paid order from print file to partner acceptance, production, carrier handover and delivery against the SLA and the published window per country, capacity ceilings per partner, and the reroute action. The customer support lead shows her how the same delivery windows appear in the desk."}, {"stage": "Evaluation", "narrative": "Her worry is that partner status in the tower is only as good as the partner callbacks and that in a crisis she will still be on the phone. She evaluates it on last year's data: the tower would have shown the US partner's slippage four days before support saw the complaints, and the routing rules could have moved volume to the backup. She agrees to run the peak from it, with the phone as fallback."}, {"stage": "Trial", "narrative": "In October she runs the first weeks of intake from the tower: capacity versus forecast per partner each morning, two reroutes when a preflight rule rejected files at the EU partner, and cut-off dates per country published to the website and support from the tower's production and window data."}, {"stage": "Engagement", "narrative": "In the peak weeks the tower is her day: intake against contracted capacity per region, overflow to the backup partner in the US before the primary hits its ceiling, gift orders reprioritised near cut-off, carrier lanes to Australia watched daily, and one message to support when a lane slipped instead of a flood of tickets."}, {"stage": "Retention", "narrative": "She keeps the tower after the peak because it carried the year's decisive quarter: on-time production held above target, the backup contract paid for itself in one week, and the peak scorecard per partner is the basis of the contracts she renegotiates in January. She asks engineering to add the unit cost view so the same screen shows margin next to SLA."}]}, {"id": "journey-opsm-2", "name": "The quality lead adopts the control tower's reprint root-cause and partner audit workflow", "linkedJobIds": ["jtbd-opsm-2", "jtbd-opsm-1"], "summary": "A production quality lead in the operations team who tracked defects in a spreadsheet from support e-mails doubts that tickets, print files and partner batches can be joined automatically, adopts the control tower's quality monitoring and audit workflow, and turns reprint causes into partner corrective actions and preflight rules.", "stages": [{"stage": "Trigger", "narrative": "After a quarter in which a binding defect at one facility showed up first in Trustpilot reviews and then in reprint costs, the quality lead is asked to make defects visible before customers see them. His spreadsheet of support e-mails cannot say which partner batch or which print file the complaints belong to."}, {"stage": "Discovery", "narrative": "He sees that the control tower's quality monitoring joins the support desk's root-cause tags and photos with the partner batch, the print file and the preflight report, and that audits and corrective actions per partner facility can be scheduled and tracked there. The support team's weekly root-cause list already arrives in that format."}, {"stage": "Evaluation", "narrative": "He questions whether the partners will accept findings derived from customer photos. Testing it on one facility, the joined view shows a colour profile issue on one product only, the partner confirms it from its own quality check log, and the fix takes days rather than a quarter. The tower's defect definitions match the print specification every partner signed."}, {"stage": "Trial", "narrative": "For one quarter he runs the loop from the tower for two facilities: weekly root-cause review with support, audit findings and corrective actions recorded per partner, and two new preflight rules that stop the file errors the EU partner kept rejecting."}, {"stage": "Engagement", "narrative": "Quality monitoring becomes the operations rhythm: defects caught at partner quality checks rise, reprint causes per facility are reviewed with each partner monthly, FSC paper compliance is tracked per batch, and the sustainability team uses the same data for the local-production and paper claims on the website."}, {"stage": "Retention", "narrative": "He stays with the workflow because it changed his relationship with partners from complaints to shared evidence: corrective actions close within weeks, the same defect no longer recurs after a fix, and the peak review now includes a quality scorecard per facility that decides which partners get volume next year."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-opsm-top", "name": "On-time production and shipping rate", "description": "Share of paid orders that are produced by the routed partner facility and handed to the carrier within the partner SLA, across all products and countries. Modeled seed value for a partner network on four continents; not an official PastBook figure.", "unit": "%", "currentValue": "91.5", "targetValue": "97", "link": "https://dashboard.example.com/instant-photo-book-platform/customers/opsm/kpis/co-opsm-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-opsm-co-opsm-top.png"}, "branches": [{"id": "co-opsm-b1", "name": "Production and delivery speed", "description": "How fast paid orders enter production, leave the partner facility and reach the customer against the SLA and the published delivery windows.", "currentValue": "70", "icon": "kpi-opsm-co-opsm-b1.png", "children": [{"id": "co-opsm-b1-c1", "name": "Production within SLA rate", "description": "Share of jobs produced within the partner's contracted production time, from acceptance to ready for carrier pickup.", "unit": "%", "currentValue": "93", "targetValue": "98", "icon": "kpi-opsm-co-opsm-b1-c1.png", "children": [{"id": "co-opsm-b1-c1-l1", "name": "Median hours from payment to production start", "description": "Median hours between payment and the partner confirming production start; production starts on payment, so rendering, preflight and partner acceptance are the only steps in between.", "unit": "hours", "currentValue": "6", "targetValue": "2", "icon": "kpi-opsm-co-opsm-b1-c1-l1.png", "children": []}, {"id": "co-opsm-b1-c1-l2", "name": "Q4 peak on-time production rate", "description": "Share of jobs produced within SLA during the October to December peak weeks.", "unit": "%", "currentValue": "85", "targetValue": "95", "icon": "kpi-opsm-co-opsm-b1-c1-l2.png", "children": []}]}, {"id": "co-opsm-b1-c2", "name": "Delivered within published delivery window", "description": "Share of parcels delivered within the window published for the destination country after production (US 4\u20138 business days, UK 4\u20135, FR/NL/IT/DE 3\u20135, EU 5\u20137, CA/AU 5\u201310, NZ/IN/BR 7\u201310).", "unit": "%", "currentValue": "90", "targetValue": "96", "icon": "kpi-opsm-co-opsm-b1-c2.png", "children": [{"id": "co-opsm-b1-c2-l1", "name": "Carrier on-time rate United States", "description": "Share of US parcels delivered within 4\u20138 business days after production, the largest market.", "unit": "%", "currentValue": "89", "targetValue": "95", "icon": "kpi-opsm-co-opsm-b1-c2-l1.png", "children": []}, {"id": "co-opsm-b1-c2-l2", "name": "Carrier on-time rate Europe and United Kingdom", "description": "Share of parcels to the UK (4\u20135 business days), FR/NL/IT/DE (3\u20135) and the rest of the EU (5\u20137) delivered within their windows.", "unit": "%", "currentValue": "93", "targetValue": "97", "icon": "kpi-opsm-co-opsm-b1-c2-l2.png", "children": []}]}]}, {"id": "co-opsm-b2", "name": "Print quality and rework", "description": "Whether books leave every facility to the same specification and how quickly the causes of defects are found and closed.", "currentValue": "66", "icon": "kpi-opsm-co-opsm-b2.png", "children": [{"id": "co-opsm-b2-c1", "name": "Print defect rate", "description": "Share of produced orders with a print, binding, colour or cropping defect, whether caught at the partner's quality check or reported by the customer; drives the customer-facing reprint rate of about 1.6% together with transit loss and address errors.", "unit": "% of orders", "currentValue": "1.4", "targetValue": "0.7", "icon": "kpi-opsm-co-opsm-b2-c1.png", "children": [{"id": "co-opsm-b2-c1-l1", "name": "Defects caught at partner quality check before shipping", "description": "Share of print defects found and remade at the partner before the parcel ships.", "unit": "% of defects", "currentValue": "40", "targetValue": "65", "icon": "kpi-opsm-co-opsm-b2-c1-l1.png", "children": []}, {"id": "co-opsm-b2-c1-l2", "name": "Reprints caused by print defects per 1,000 orders", "description": "Customer-facing reprints attributed to a print defect per thousand orders; the defects that escaped the partner check.", "unit": "reprints", "currentValue": "8.4", "targetValue": "3.5", "icon": "kpi-opsm-co-opsm-b2-c1-l2.png", "children": []}]}, {"id": "co-opsm-b2-c2", "name": "Reprint root causes closed within 30 days", "description": "Share of identified reprint root causes, per partner facility or file issue, with a corrective action verified within 30 days.", "unit": "%", "currentValue": "55", "targetValue": "85", "icon": "kpi-opsm-co-opsm-b2-c2.png", "children": [{"id": "co-opsm-b2-c2-l1", "name": "Partner quality audits completed per quarter", "description": "Number of partner facility audits, on site or remote sample checks, completed per quarter across the network.", "unit": "audits", "currentValue": "3", "targetValue": "6", "icon": "kpi-opsm-co-opsm-b2-c2-l1.png", "children": []}, {"id": "co-opsm-b2-c2-l2", "name": "Colour and binding complaints per 1,000 orders", "description": "Customer complaints about colour or binding per thousand orders, the two most frequent defect types.", "unit": "complaints", "currentValue": "6", "targetValue": "3", "icon": "kpi-opsm-co-opsm-b2-c2-l2.png", "children": []}]}]}]}, "businessOutcomes": {"top": {"id": "bo-opsm-top", "name": "Unit fulfilment cost per order", "description": "Average partner production cost, packaging, shipping, reprint allowance and partner management overhead per paid order in USD, against an average order value of about USD 36.50. Modeled seed value; not an official PastBook figure.", "unit": "USD", "currentValue": "15.5", "targetValue": "13.6", "link": "https://dashboard.example.com/instant-photo-book-platform/customers/opsm/kpis/bo-opsm-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-opsm-bo-opsm-top.png"}, "branches": [{"id": "bo-opsm-b1", "name": "Production and shipping cost", "description": "What the partner charges per book and what it costs to get the parcel to the customer, by product and country.", "currentValue": "63", "icon": "kpi-opsm-bo-opsm-b1.png", "children": [{"id": "bo-opsm-b1-c1", "name": "Unit production cost per book", "description": "Average partner production cost per book across small and large hardcovers and the page mix; a small hardcover retails at USD 19.99 for 24 pages plus USD 0.40 per extra page.", "unit": "USD", "currentValue": "9.2", "targetValue": "8.1", "icon": "kpi-opsm-bo-opsm-b1-c1.png", "children": [{"id": "bo-opsm-b1-c1-l1", "name": "Paper and print cost per page", "description": "Partner cost per printed page including FSC-certified paper, against an extra-page retail price of USD 0.40 (small) and USD 0.55 (large).", "unit": "USD", "currentValue": "0.18", "targetValue": "0.15", "icon": "kpi-opsm-bo-opsm-b1-c1-l1.png", "children": []}, {"id": "bo-opsm-b1-c1-l2", "name": "FSC-certified paper share of production", "description": "Share of produced books, calendars and posters printed on FSC-certified paper across all partner facilities.", "unit": "%", "currentValue": "94", "targetValue": "100", "icon": "kpi-opsm-bo-opsm-b1-c1-l2.png", "children": []}]}, {"id": "bo-opsm-b1-c2", "name": "Shipping cost per order", "description": "Average carrier cost per order across countries and service levels, including cross-border shipments when no local partner is available.", "unit": "USD", "currentValue": "5.4", "targetValue": "4.7", "icon": "kpi-opsm-bo-opsm-b1-c2.png", "children": [{"id": "bo-opsm-b1-c2-l1", "name": "Orders shipped domestically from a local partner", "description": "Share of orders produced in the destination country, which cuts shipping cost and emissions.", "unit": "%", "currentValue": "84", "targetValue": "92", "icon": "kpi-opsm-bo-opsm-b1-c2-l1.png", "children": []}, {"id": "bo-opsm-b1-c2-l2", "name": "Multi-product orders consolidated in one parcel", "description": "Share of orders with several products shipped as one parcel on the longest production time rather than split.", "unit": "%", "currentValue": "71", "targetValue": "90", "icon": "kpi-opsm-bo-opsm-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-opsm-b2", "name": "Partner network resilience and margin", "description": "Whether every region has redundant capacity for the peak and how much gross margin an order leaves after fulfilment.", "currentValue": "60", "icon": "kpi-opsm-bo-opsm-b2.png", "children": [{"id": "bo-opsm-b2-c1", "name": "Regions with redundant partner capacity", "description": "Share of shipping regions (US, UK, EU, Canada, Australia, New Zealand, India, Brazil) with a contracted backup facility able to take peak overflow.", "unit": "% of regions", "currentValue": "50", "targetValue": "100", "icon": "kpi-opsm-bo-opsm-b2-c1.png", "children": [{"id": "bo-opsm-b2-c1-l1", "name": "Active partner facilities", "description": "Number of partner printing facilities with a live integration and volume in the last quarter, across four continents.", "unit": "facilities", "currentValue": "9", "targetValue": "12", "icon": "kpi-opsm-bo-opsm-b2-c1-l1.png", "children": []}, {"id": "bo-opsm-b2-c1-l2", "name": "Peak capacity utilisation", "description": "Peak-week production volume as a share of contracted network capacity; above about 90% quality and SLA start to break.", "unit": "%", "currentValue": "96", "targetValue": "88", "icon": "kpi-opsm-bo-opsm-b2-c1-l2.png", "children": []}]}, {"id": "bo-opsm-b2-c2", "name": "Gross margin per order after fulfilment", "description": "Average order value of about USD 36.50 minus unit fulfilment cost per order, before marketing and payment fees.", "unit": "USD", "currentValue": "21.0", "targetValue": "24.9", "icon": "kpi-opsm-bo-opsm-b2-c2.png", "children": [{"id": "bo-opsm-b2-c2-l1", "name": "Average order value", "description": "Average paid order value in USD across books, calendars, posters and gift cards after discounts.", "unit": "USD", "currentValue": "36.5", "targetValue": "38.5", "icon": "kpi-opsm-bo-opsm-b2-c2-l1.png", "children": []}, {"id": "bo-opsm-b2-c2-l2", "name": "Reprint and refund cost per order", "description": "Failure recovery cost per order: reprint production and shipping plus refunded revenue; about USD 47 per hundred orders today.", "unit": "USD", "currentValue": "0.47", "targetValue": "0.28", "icon": "kpi-opsm-bo-opsm-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Run PastBook's partner printing network on four continents as one production system: routing, SLAs, capacity, quality and unit cost visible in a single control tower, most orders produced in the customer's country on FSC-certified paper, redundant capacity in every region for the holiday peak, and reprint root causes closed at the partner or in the preflight rules, so books arrive within the published windows at a cost that keeps margin under a USD 19.99 entry price.", "timeHorizons": {"year1": {"focus": "Stabilise peak-season SLAs across partners: put every paid order in the production control tower from print file to delivery, make routing capacity-aware with a tested backup in the US and the EU, and bring reprint root causes, print defects and unit cost per partner into one view before the next Q4.", "productTheme": "Production control tower with capacity-aware routing", "customerKPI": {"northStar": "On-time production and shipping rate", "supporting": ["Print defect rate", "Production within SLA rate"]}, "businessKPI": {"northStar": "Unit fulfilment cost per order", "revenueStreams": ["Small and large hardcover photo books produced by partners", "Wall calendars and posters in the Q4 gift season", "Extra pages and hard cover upgrade fees"], "supporting": ["Unit production cost per book", "Shipping cost per order"]}, "milestones": ["Monitor every job from render and preflight to partner acceptance, production, carrier handover and delivery in the control tower", "Contract and integrate a backup partner facility in the United States and the European Union and route overflow to it automatically", "Join support root-cause tags with partner batches and print files and review reprint causes per facility monthly"]}, "year3": {"focus": "Build redundant capacity in every shipping region and a quality loop that catches defects at the partner: peak forecasts agreed with marketing turn into contracted capacity per region, cut-offs per country are computed from live production and carrier data, and preflight rules and partner audits stop defects before they ship.", "productTheme": "Redundant regional capacity and quality caught at the partner", "customerKPI": {"northStar": "On-time production and shipping rate", "supporting": ["Q4 peak on-time production rate", "Delivered within published delivery window"]}, "businessKPI": {"northStar": "Unit fulfilment cost per order", "revenueStreams": ["Repeat yearbook and calendar volume produced locally in each region", "Q4 gift orders delivered before cut-off", "Large-format and premium finish products"], "supporting": ["Regions with redundant partner capacity", "Peak capacity utilisation"]}, "milestones": ["Contract a backup facility in every shipping region and keep peak utilisation below the level where quality breaks", "Compute Christmas cut-off dates per country from live production times and carrier performance and publish them to app, web, campaigns and support", "Raise defects caught at partner quality checks through shared defect definitions, audits and automated preflight rules"]}, "year5": {"focus": "Orchestrate print partners as a utility for 150+ countries: any product from any photo stream routed to the best facility on cost, speed and sustainability, partners onboarded through a standard integration and quality certification, and local FSC production as a brand promise that customers can see per order.", "productTheme": "Print partner network orchestrated as a utility", "customerKPI": {"northStar": "On-time production and shipping rate", "supporting": ["Reprint root causes closed within 30 days", "Defects caught at partner quality check before shipping"]}, "businessKPI": {"northStar": "Unit fulfilment cost per order", "revenueStreams": ["Photo books, calendars and posters produced locally in 150+ countries", "New printed products added through the partner network", "Premium sustainable materials and finishes"], "supporting": ["Gross margin per order after fulfilment", "FSC-certified paper share of production"]}, "milestones": ["Onboard new partner facilities through a standard order API, hot folder and quality certification in weeks rather than months", "Route on cost, speed and emissions per order and show customers where their book was produced", "Reach full FSC-certified paper coverage and local production for most orders in every region"]}}}, "domain": "PastBook Operations"}, {"id": "prnt", "name": "Print Partner", "description": "The plant or account manager of a partner printing facility in PastBook's network, in the United States, the European Union, the United Kingdom, Australia, Brazil or India, one of the facilities on four continents that produce most orders in the country of the customer and ship to 150+ countries. The facility receives print-ready, imposed PDFs and order data through an order API or a hot folder, produces small 8.5\" x 6\" and large 12\" x 8.5\" hardcover books, softcovers, wall calendars and posters on FSC-certified paper, packs them and hands them to the carrier within the production time that starts on payment. It never sees the consumer: PastBook owns the app, the curation, the pricing and the support, and the facility is measured on orders produced within SLA, print defect rate and the capacity it can commit for the Q4 peak when Year in Review books, calendars and gifts have to reach customers before Christmas. It wants steady, error-free volume, an early and honest peak forecast, one clear quality specification, and unit prices and payment terms that make the PastBook line profitable next to its other online print buyers.", "icon": "prnt.png", "careAbout": ["Print-ready files that run without operator intervention: imposed, preflighted PDFs with the right cover type for the page count (softcover up to 16 pages, hardcover from 27 to 300), correct bleed and colour, and calendar and poster formats that match the machines", "Predictable daily volume and an early, honest Q4 forecast, because PastBook's holiday peak is when presses, binding lines and temporary staff are planned months ahead", "One SLA and quality specification that defines when a book is late or defective and is applied the same way to every facility in the network", "Order data, packing slips and carrier labels that match the job, so a parcel leaves the same day production finishes and is trackable in the country's delivery window", "Fair unit prices per book, extra page and product, timely payment for produced volume, and chargebacks only for defects the facility actually caused", "FSC paper and local-production requirements that fit the facility's existing certifications and stock, so PastBook's sustainability claims cost no extra qualification effort"], "winsThem": ["An order feed with an API or a hot folder, status callbacks and a test environment that a facility integrates in weeks and that carries every job with its files, product specification and packing slip", "Routing that sends volume by proximity and committed capacity and grows the facility's share as its SLA and defect performance proves itself", "A shared SLA dashboard showing the same on-time, rejection and defect numbers PastBook's production operations manager sees, so reviews start from one set of facts", "Weekly Q4 forecasts and capacity reservations agreed in summer, with overflow rules to a second facility instead of a surprise backlog in December", "A root-cause dialogue on reprints and quality incidents with one named contact in PastBook production operations, rather than blanket penalties"], "theirFear": ["A Q4 surge beyond the forecast that turns into missed Christmas deliveries, refunds and a public argument over whose fault the backlog was", "Files that render wrong at the facility, with colour shifts, wrong page counts or a softcover where a hardcover was ordered, so the facility eats the reprint cost", "Being routed away quietly as new facilities join the network, losing the volume it staffed and invested for"], "jobsToBeDone": [{"id": "jtbd-prnt-1", "name": "Receive print-ready, error-free orders I can produce within SLA", "whatItIs": "Run PastBook jobs through the facility as a standard production line: integrate the order feed once, accept and validate each routed job, produce the books, calendars and posters to the agreed specification, pack and hand the parcels to the carrier inside the production time, report status back, and resolve the rare rejected file or reprint without stopping the line.", "outcome": "Every routed job arrives complete and printable, is produced within the SLA that keeps the country's delivery window (for example 3-5 business days after production in France, the Netherlands, Italy and Germany), leaves with a working tracking number, and the facility's defect and rejection numbers stay low enough that PastBook keeps sending volume.", "steps": [{"step": "Integrate the order feed and status callbacks", "description": "Connect the facility's production system to PastBook's order API or hot folder, map product codes for the two hardcover sizes, softcovers, calendars and posters, run test jobs end to end, and agree the status events (received, in production, shipped with tracking) the facility sends back.", "streamsNeeded": [{"id": "render-print-ready-files-and-route-to-a-printer", "name": "Render Print Ready Files And Route To A Printer", "howItSupports": "Defines the print-ready file package, order data and packing slip the facility receives for each routed job."}, {"id": "manage-the-global-print-partner-network", "name": "Manage The Global Print Partner Network", "howItSupports": "Onboards the facility: integration setup, product mapping, test jobs and the go-live checklist."}]}, {"step": "Accept and validate incoming jobs", "description": "Acknowledge each job within minutes, check that the PDF is imposed and preflighted, that the page count matches the cover type and the order line, and that address, quantity and product match the packing slip; reject or flag anything that would fail on press before it consumes capacity.", "streamsNeeded": [{"id": "render-print-ready-files-and-route-to-a-printer", "name": "Render Print Ready Files And Route To A Printer", "howItSupports": "Delivers preflighted, imposed files so that the facility's own check finds almost nothing to reject."}, {"id": "produce-ship-and-track-the-order", "name": "Produce Ship And Track The Order", "howItSupports": "Records the acknowledgement and any rejection so the job can be fixed and re-sent or rerouted."}]}, {"step": "Produce to the specification", "description": "Print, bind and trim hardcover and softcover books, calendars and posters on FSC-certified paper to the agreed colour, binding and finishing standard, in the production time PastBook publishes to the customer, with quality control on covers, spine alignment and page order before packing.", "streamsNeeded": [{"id": "produce-ship-and-track-the-order", "name": "Produce Ship And Track The Order", "howItSupports": "Tracks each job through production against the production time promised to the customer."}, {"id": "manage-the-global-print-partner-network", "name": "Manage The Global Print Partner Network", "howItSupports": "Holds the quality specification, FSC requirement and SLA the facility produces against."}]}, {"step": "Pack, hand over to the carrier and report shipment", "description": "Pack single- and multi-product orders (multi-product orders ship together on the longest production time), print the carrier label, hand parcels over the same day, and send the shipped status with the tracking number so PastBook can show it to the customer and support.", "streamsNeeded": [{"id": "produce-ship-and-track-the-order", "name": "Produce Ship And Track The Order", "howItSupports": "Supplies carrier labels and receives the tracking number that feeds order status and support."}]}, {"step": "Handle rejected files, reprints and quality incidents", "description": "Work rejected files and reprint requests as priority jobs, record the cause (file, production, transport), and agree with PastBook's production operations who bears the cost, so a customer who complained gets a corrected book quickly and the root cause is closed.", "streamsNeeded": [{"id": "resolve-support-requests-and-reprints", "name": "Resolve Support Requests And Reprints", "howItSupports": "Turns a customer complaint into a reprint job with the reason and priority the facility needs."}, {"id": "manage-the-global-print-partner-network", "name": "Manage The Global Print Partner Network", "howItSupports": "Records reprint root causes and the cost split per incident for the partner review."}]}]}, {"id": "jtbd-prnt-2", "name": "Plan capacity and get paid for volume with clear quality expectations", "whatItIs": "Run the commercial side of the partnership: agree SLA, quality specification and unit prices, receive volume forecasts and reserve capacity for the Q4 peak, follow the facility's own on-time and defect numbers during the season, reconcile produced jobs against invoices and chargebacks, and review quality audits and root causes so the facility keeps or grows its routing share.", "outcome": "The facility staffs and stocks for a peak it knows about in summer, is paid in full and on time for what it produced, contests only chargebacks that are wrong, and enters each review with the same numbers PastBook has, so a good year translates into more volume rather than an argument.", "steps": [{"step": "Agree SLA, quality specification and unit prices", "description": "Negotiate production times per product, the defect definition and audit method, FSC paper, packaging, unit prices per book size, extra page, calendar and poster, and the chargeback rules for defects caused by the facility versus by the file.", "streamsNeeded": [{"id": "manage-the-global-print-partner-network", "name": "Manage The Global Print Partner Network", "howItSupports": "Holds the partner agreement, SLA, quality specification and price list per product."}]}, {"step": "Receive forecasts and reserve peak capacity", "description": "Get weekly volume forecasts per product with the Q4 curve driven by the Year in Review and gifting campaigns, commit capacity per week, and agree the overflow point at which PastBook reroutes jobs to another facility instead of letting the backlog grow.", "streamsNeeded": [{"id": "manage-the-global-print-partner-network", "name": "Manage The Global Print Partner Network", "howItSupports": "Shares the volume forecast and records the capacity the facility commits per week."}, {"id": "run-seasonal-campaigns-and-promotions", "name": "Run Seasonal Campaigns And Promotions", "howItSupports": "Provides the campaign calendar and promotion dates that shape the Q4 demand curve."}]}, {"step": "Track on-time, rejection and defect performance", "description": "Follow the facility's daily produced volume, orders within SLA, rejected files and defects on the shared dashboard, spot a slipping day before it becomes a late week, and raise capacity or file issues with the production operations manager immediately.", "streamsNeeded": [{"id": "produce-ship-and-track-the-order", "name": "Produce Ship And Track The Order", "howItSupports": "Provides per-job production and shipment timestamps that make up the SLA numbers."}, {"id": "manage-the-global-print-partner-network", "name": "Manage The Global Print Partner Network", "howItSupports": "Shows the facility its SLA, rejection and defect dashboard next to the network average."}]}, {"step": "Reconcile produced jobs and invoice", "description": "Match the jobs the facility produced and shipped against PastBook's job records per product and page count, issue the periodic invoice, and settle reprint chargebacks according to the agreed cause attribution.", "streamsNeeded": [{"id": "manage-the-global-print-partner-network", "name": "Manage The Global Print Partner Network", "howItSupports": "Provides the produced-job statement, price list and chargeback ledger used for reconciliation."}, {"id": "render-print-ready-files-and-route-to-a-printer", "name": "Render Print Ready Files And Route To A Printer", "howItSupports": "Holds the authoritative record of which jobs, page counts and products were routed to the facility."}]}, {"step": "Review audits and root causes and adjust", "description": "Go through quality audit samples, customer complaints attributed to the facility and reprint root causes with PastBook each quarter, agree corrective actions, and adjust routing share, prices or the specification for the next period.", "streamsNeeded": [{"id": "manage-the-global-print-partner-network", "name": "Manage The Global Print Partner Network", "howItSupports": "Supports the quarterly partner review with audit results, root causes and routing-share decisions."}, {"id": "resolve-support-requests-and-reprints", "name": "Resolve Support Requests And Reprints", "howItSupports": "Feeds complaint and reprint cases attributed to the facility into the review."}]}]}], "customerJourneyStories": [{"id": "journey-prnt-1", "name": "A regional printer joins the PastBook network", "linkedJobIds": ["jtbd-prnt-1", "jtbd-prnt-2"], "summary": "The operations director of a digital print facility in Australia with spare capacity on its hardcover binding line is approached by PastBook, which wants to produce Australian orders locally instead of shipping them across the ocean, passes the quality audit, integrates the order feed, starts with a small routing share and grows into the primary facility for the region.", "stages": [{"stage": "Trigger", "narrative": "The facility's presses are under-used outside its own peak, and its board wants online print volume without building a consumer brand or a marketing budget. At the same time PastBook, whose customers after North America are most numerous in Australia, wants to cut a 5-10 business day cross-continent shipment and its emissions by producing in the country of the customer."}, {"stage": "Discovery", "narrative": "PastBook's production operations manager finds the facility through its FSC certification and existing hardcover work for other online brands and asks for a call. The director, in turn, looks up PastBook: 10 million books created since 2012, 1M+ app downloads, a 4.5 Trustpilot score and a partner network already on four continents, so the volume promise is credible."}, {"stage": "Evaluation", "narrative": "Both sides evaluate. PastBook orders blind samples of the small and large hardcover, a calendar and a poster, checks colour, binding, spine alignment and FSC stock, and reviews capacity and carrier contracts for the Australian 5-10 day window. The director reviews the SLA and quality specification, the unit price per book and extra page, payment terms, the chargeback rules, and the effort to connect a hot folder versus the API."}, {"stage": "Trial", "narrative": "A pilot starts with a fixed share of Australian orders routed to the facility through the hot folder, with status callbacks and tracking numbers flowing back. The first weeks surface a product-code mismatch on calendars and a bleed issue on posters, both fixed in the file package, after which acceptance runs without manual checks and the pilot books pass PastBook's quality audit."}, {"stage": "Engagement", "narrative": "Routing share grows as on-time and defect numbers hold, the facility appears on the shared SLA dashboard next to the network average, and weekly forecasts arrive with the Q4 curve for Year in Review books and calendars. In summer the director commits peak capacity per week and agrees the overflow point at which PastBook reroutes to another facility."}, {"stage": "Retention", "narrative": "The facility stays because the volume is steady, arrives print-ready and pays on time, and because it became the primary facility for Australia and New Zealand within two seasons; the director invests in a second binding line for the next Q4 on the strength of the shared forecast. PastBook keeps it because Australian customers now get books within the published window from a local plant."}]}, {"id": "journey-prnt-2", "name": "An EU partner becomes redundant peak capacity for a second region", "linkedJobIds": ["jtbd-prnt-2", "jtbd-prnt-1"], "summary": "The account manager of an established German partner that already produces PastBook's German, Dutch, French and Italian orders is asked to take Q4 overflow for the rest of the EU and, when the UK facility saturates, for UK orders, turning a single-region supplier into the network's redundant capacity for Europe.", "stages": [{"stage": "Trigger", "narrative": "In the previous December a single European facility ran out of capacity, late Christmas deliveries produced refunds and one-star reviews that PastBook's support had to answer within 48 hours, and the production operations manager was told to have redundant capacity per region before the next peak."}, {"stage": "Discovery", "narrative": "At the quarterly partner review PastBook proposes that the German facility, which has the best on-time and defect record in the network, becomes the overflow destination for other European orders during Q4. The account manager had not considered cross-border volume because the facility's own contracts are domestic."}, {"stage": "Evaluation", "narrative": "The account manager works through what changes: delivery windows for the rest of the EU (5-7 business days after production) versus the domestic 3-5, carrier rates for cross-border parcels, packaging and language of the packing slip, extra staffing for a few weeks, and a price for overflow volume that is not guaranteed. PastBook shows the routing rules, the forecast that triggers overflow and the SLA that will be measured."}, {"stage": "Trial", "narrative": "During the first Q4 week the overflow rule fires: a share of orders from the rest of the EU and, for two days, from the UK is routed to the facility. Tracking numbers and status callbacks work unchanged, the cross-border parcels arrive inside the published windows, and the facility reports the extra volume on the shared dashboard without an incident."}, {"stage": "Engagement", "narrative": "Overflow becomes a standing arrangement: capacity reserved per Q4 week for a second region, joint review of the forecast accuracy after each season, and a small year-round share of rest-of-EU orders so the cross-border process never goes cold. The facility's account manager now attends PastBook's pre-season planning call in summer."}, {"stage": "Retention", "narrative": "The facility keeps the role because the peak weeks are its most profitable of the year and the forecast makes them plannable; PastBook keeps it because Europe now has redundant capacity and no December depends on a single plant. When PastBook adds a new EU facility, the German partner's overflow role is written into the routing rules rather than eroded."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-prnt-top", "name": "Orders produced within SLA", "description": "Share of routed jobs that leave production at the partner facility within the agreed production time, weighted across the network's facilities on four continents; the Q4 peak pulls the yearly figure down. Modeled seed value for a network producing most orders in the customer's country, not an official PastBook figure.", "unit": "%", "currentValue": "95.5", "targetValue": "98", "link": "https://dashboard.example.com/instant-photo-book-platform/customers/prnt/kpis/co-prnt-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-prnt-co-prnt-top.png"}, "branches": [{"id": "co-prnt-b1", "name": "Production readiness of incoming orders", "description": "Whether t ses per 1,000 books whose root cause was production at the facility (binding, colour, trimming, page order) rather than the file or transport.", "unit": "reprints", "currentValue": "9", "targetValue": "4", "icon": "kpi-prnt-co-prnt-b2-c2-l1.png", "children": []}, {"id": "co-prnt-b2-c2-l2", "name": "Same-day carrier handover rate", "description": "Share of parcels handed to the carrier on the day production of the order was completed.", "unit": "%", "currentValue": "91", "targetValue": "97", "icon": "kpi-prnt-co-prnt-b2-c2-l2.png", "children": []}]}]}]}, "businessOutcomes": {"top": {"id": "bo-prnt-top", "name": "Gross margin after print and shipping cost", "description": "PastBook's gross margin on printed products after the partner's production cost and the shipping cost, as a share of net product revenue; the margin between retail price (small hardcover USD 19.99, large USD 34.99 for 24 pages) and partner cost is what the print network protects. Modeled seed value, not an official PastBook figure.", "unit": "%", "currentValue": "47", "targetValue": "52", "link": "https://dashboard.example.com/instant-photo-book-platform/customers/prnt/kpis/bo-prnt-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-prnt-bo-prnt-top.png"}, "branches": [{"id": "bo-prnt-b1", "name": "Production and shipping cost per order", "description": "What a produced and shipped order costs PastBook at the partner, driven by unit price, waste, local production and consolidation.", "currentValue": "60", "icon": "kpi-prnt-bo-prnt-b1.png", "children": [{"id": "bo-prnt-b1-c1", "name": "Unit production cost per book", "description": "Average partner price paid per produced book across small and large hardcover and softcover, including extra pages and FSC paper.", "unit": "USD", "currentValue": "15.20", "targetValue": "13.80", "icon": "kpi-prnt-bo-prnt-b1-c1.png", "children": [{"id": "bo-prnt-b1-c1-l1", "name": "Production cost per extra page", "description": "Partner cost per page beyond the 24-page base, against the USD 0.40 (small) and USD 0.55 (large) retail price per extra page.", "unit": "USD", "currentValue": "0.22", "targetValue": "0.19", "icon": "kpi-prnt-bo-prnt-b1-c1-l1.png", "children": []}, {"id": "bo-prnt-b1-c1-l2", "name": "Waste and spoilage rate in production", "description": "Share of printed sheets and covers discarded at the facility during production of PastBook jobs.", "unit": "%", "currentValue": "3.2", "targetValue": "2.0", "icon": "kpi-prnt-bo-prnt-b1-c1-l2.png", "children": []}]}, {"id": "bo-prnt-b1-c2", "name": "Shipping cost per order", "description": "Average carrier cost per shipped order from the facility to the customer, including cross-border parcels.", "unit": "USD", "currentValue": "6.10", "targetValue": "5.40", "icon": "kpi-prnt-bo-prnt-b1-c2.png", "children": [{"id": "bo-prnt-b1-c2-l1", "name": "Orders produced in the customer's country", "description": "Share of orders produced by a facility in the same country as the delivery address, which cuts shipping cost, transit days and emissions.", "unit": "%", "currentValue": "92", "targetValue": "97", "icon": "kpi-prnt-bo-prnt-b1-c2-l1.png", "children": []}, {"id": "bo-prnt-b1-c2-l2", "name": "Multi-product orders consolidated in one parcel", "description": "Share of orders with more than one product (for example a book and a calendar) shipped as a single parcel on the longest production time.", "unit": "%", "currentValue": "86", "targetValue": "95", "icon": "kpi-prnt-bo-prnt-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-prnt-b2", "name": "Network resilience and failure cost", "description": "Whether the network can absorb a peak or a facility outage per region and what production and delivery failures cost PastBook.", "currentValue": "54", "icon": "kpi-prnt-bo-prnt-b2.png", "children": [{"id": "bo-prnt-b2-c1", "name": "Regions with redundant partner capacity", "description": "Delivery regions (US, Canada, UK, EU, Australia and New Zealand, Brazil, India) that have at least two
