": "55", "icon": "kpi-csup-bo-csup-b1-c1-l2.png", "children": []}]}, {"id": "bo-csup-b1-c2", "name": "Cost per contact", "description": "Fully loaded cost of handling one contact, blended across Amsterdam, New York, Colombo and New Delhi shifts.", "unit": "USD", "currentValue": "5.2", "targetValue": "4.2", "icon": "kpi-csup-bo-csup-b1-c2.png", "children": [{"id": "bo-csup-b1-c2-l1", "name": "Average handling time", "description": "Average minutes of agent time per contact including notes and tagging.", "unit": "minutes", "currentValue": "9", "targetValue": "7", "icon": "kpi-csup-bo-csup-b1-c2-l1.png", "children": []}, {"id": "bo-csup-b1-c2-l2", "name": "Contacts handled in the first shift without escalation", "description": "Share of contacts closed by the shift that received them, without escalation to a lead or another location.", "unit": "%", "currentValue": "82", "targetValue": "90", "icon": "kpi-csup-bo-csup-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-csup-b2", "name": "Cost of failures", "description": "What reprints and refunds cost per order and which causes drive them.", "currentValue": "64", "icon": "kpi-csup-bo-csup-b2.png", "children": [{"id": "bo-csup-b2-c1", "name": "Reprint and refund cost per 100 orders", "description": "Print, shipping and refunded revenue cost of failure recovery per hundred orders; about 1.6 reprints at roughly USD 14 each plus 0.7 refunds at an average order value of about USD 36.50.", "unit": "USD", "currentValue": "47", "targetValue": "28", "icon": "kpi-csup-bo-csup-b2-c1.png", "children": [{"id": "bo-csup-b2-c1-l1", "name": "Reprint cost per 100 orders", "description": "Partner production and shipping cost of reprints per hundred orders.", "unit": "USD", "currentValue": "22", "targetValue": "14", "icon": "kpi-csup-bo-csup-b2-c1-l1.png", "children": []}, {"id": "bo-csup-b2-c1-l2", "name": "Refund cost per 100 orders", "description": "Revenue refunded per hundred orders, full and partial.", "unit": "USD", "currentValue": "25", "targetValue": "14", "icon": "kpi-csup-bo-csup-b2-c1-l2.png", "children": []}]}, {"id": "bo-csup-b2-c2", "name": "Refund rate", "description": "Share of paid orders refunded in full or in part instead of, or on top of, a reprint.", "unit": "% of orders", "currentValue": "0.7", "targetValue": "0.4", "icon": "kpi-csup-bo-csup-b2-c2.png", "children": [{"id": "bo-csup-b2-c2-l1", "name": "Refunds caused by delivery failures", "description": "Share of refunds where the parcel was lost, damaged in transit or arrived after a gift date.", "unit": "% of refunds", "currentValue": "45", "targetValue": "30", "icon": "kpi-csup-bo-csup-b2-c2-l1.png", "children": []}, {"id": "bo-csup-b2-c2-l2", "name": "Refunds caused by print quality", "description": "Share of refunds where colour, binding or cropping did not meet the customer's expectation.", "unit": "% of refunds", "currentValue": "35", "targetValue": "25", "icon": "kpi-csup-bo-csup-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make every PastBook support agent, whether in Amsterdam, New York, Colombo or New Delhi, able to solve an order problem in one conversation: the desk shows the order, the print file, the partner and the parcel, encodes the reprint and refund policy and the delivery windows, answers where-is-my-order before it is asked, and turns every complaint and negative review into a fix at the partner, in the curation engine or in the checkout.", "timeHorizons": {"year1": {"focus": "Put all four support locations on one desk with one queue for WhatsApp, e-mail and chat, the order timeline from payment to tracking attached to every contact, reprint and refund authority encoded per agent level, and current delivery windows and cut-offs per country, so the Q4 peak is handled in one contact without escalation across time zones.", "productTheme": "One support desk with one order view and reprint in one click", "customerKPI": {"northStar": "First-contact resolution rate", "supporting": ["Median first response time", "Reprint rate"]}, "businessKPI": {"northStar": "Support cost per order", "revenueStreams": ["Small and large hardcover photo book orders protected from refund", "Year in Review, calendar and poster orders in the Q4 gift season", "Gift cards and upgrade fees for cover and size changes"], "supporting": ["Contacts per 100 orders", "Reprint and refund cost per 100 orders"]}, "milestones": ["Merge WhatsApp, e-mail and chat into one queue with the customer's orders, print files and tracking attached to every contact", "Encode reprint and refund authority per agent level and reroute reprints from the stored print file to the nearest partner with priority", "Load delivery windows and Christmas cut-off dates per country into the desk from the same source the website and app use"]}, "year3": {"focus": "Move from reactive to proactive care: delay and cut-off notifications that answer status questions before they are asked, help center self-service in ten languages that deflects routine contacts, and a review inbox that keeps the 48-hour reply promise measurable per shift while order volume grows with the annual memory habit.", "productTheme": "Proactive notifications and self-service care", "customerKPI": {"northStar": "First-contact resolution rate", "supporting": ["Tickets resolved within 24 hours", "Negative reviews answered within 48 hours"]}, "businessKPI": {"northStar": "Support cost per order", "revenueStreams": ["Repeat yearbook and calendar orders kept by fast recovery", "Q4 gift orders delivered and not refunded", "Gift card sales driven by satisfied reviewers"], "supporting": ["Help center self-service rate", "Cost per contact"]}, "milestones": ["Send proactive delay and cut-off notifications per country so where-is-my-order contacts fall by half", "Bring Trustpilot, App Store and Google Play reviews into the desk with linked orders and a 48-hour countdown", "Publish and maintain help center articles and macros in all ten languages from one source of product rules"]}, "year5": {"focus": "Make support the quality loop of the company: every complaint tagged with a root cause and routed with order-level evidence to the partner, the curation team or commerce, so the causes of defects and refunds shrink year over year and the desk scales to 150+ countries with a stable one-star share.", "productTheme": "Complaint loop that fixes the product and the partners", "customerKPI": {"northStar": "First-contact resolution rate", "supporting": ["Customer satisfaction score after contact", "Trustpilot one-star review share"]}, "businessKPI": {"northStar": "Support cost per order", "revenueStreams": ["Photo book, calendar and poster orders across 150+ countries", "Reorders of past years and gift copies from recovered customers", "Gift cards"], "supporting": ["Refund rate", "Where-is-my-order contacts per 100 orders"]}, "milestones": ["Route weekly root-cause clusters with print file and photo evidence to production operations and the curation team, and track closure", "Hold the Trustpilot one-star share at or below the current 2% while order volume and country coverage grow", "Automate evidence collection and reprint approval for the most common defect and transit-loss cases"]}}}, "domain": "PastBook Operations"}, {"id": "gmkt", "name": "Growth Marketer", "description": "Sits in the growth team in Amsterdam, Milan or New York under the CMO and owns how PastBook acquires and re-acquires customers: paid social and paid search, App Store featuring and store optimisation for the 1-click photo book app with 1M+ downloads, and the e-mail and push programmes, in ten site languages and seven currencies. About 80% of customers are in the United States, so budgets are spent in dollars against costs in euros, and the year is shaped by a steep Q4 in which the Year in Review yearbook, wall calendars, posters and gift cards are sold against Christmas cut-offs. The marketer owns blended customer acquisition cost and return on ad spend, the promo code and discount calendar, the Year in Review campaign, and the Trustpilot and App Store rating that both feed and result from the campaigns. Since Instagram discontinued third-party access for personal accounts, the phone app and the Facebook Photo Books flow are the two funnels to grow, and every campaign has to stay inside Meta and app store policy.", "icon": "gmkt.png", "careAbout": ["One campaign console where paid social, paid search, app store featuring, e-mail and push campaigns are planned per country and language against the Q4, Mother's Day and graduation calendar", "Attribution from ad or store impression to install, preview and paid order per channel and country, so return on ad spend and blended acquisition cost are read daily and not reconstructed monthly", "Promo codes and free-shipping upgrades that are created once, localised into seven currencies and switched off on time, with their discount cost visible next to the revenue they drove", "Funnel data from install to photo permission, curation, free preview and checkout, so a conversion drop is traced to a step and not to a campaign", "Lifecycle programmes that bring last year's yearbook customer back at the right moment with the right product, without breaching consent or unsubscribe rules", "Ratings and reviews on Trustpilot, the App Store and Google Play that stay high enough to support store featuring and ad creative claims"], "winsThem": ["A growth and campaign console that runs the seasonal calendar, promo codes and creatives in ten languages and seven currencies from one plan", "Attribution and app store optimisation that reconcile installs and orders per channel and country daily, including organic and featured installs", "Funnel dashboards over install, permission, import, curation, preview and order with experiment slots on the preview-to-checkout step", "Yearbook and calendar reminder programmes triggered from each customer's first order date and country, with reorder and gift-copy flows", "A review and rating view that links Trustpilot and store ratings to campaign periods and countries"], "theirFear": ["Spending the Q4 budget on installs that never grant photo permission or never reach the preview, and reading the real return on ad spend only in January", "A promo code meant for Brazil in reais being redeemed in the United States at a discount that wipes the margin of a small hardcover at USD 19.99", "A Meta or App Store policy change or a dip below the rating threshold that pulls the featuring or the login the whole funnel depends on"], "jobsToBeDone": [{"id": "jtbd-gmkt-1", "name": "Acquire customers profitably across countries and seasons", "whatItIs": "Plan and run the paid social, paid search, app store and e-mail campaigns per country, language and season, attribute installs and orders back to channels, and rebalance budgets so the blended acquisition cost stays below what a first order and its repeats earn, while staying within Meta and app store advertising policy.", "outcome": "Every campaign in every country runs against a known return on ad spend and blended acquisition cost, the Q4 peak is bought at a planned cost, and no campaign is paused by a policy incident.", "steps": [{"step": "Plan the seasonal calendar per country", "description": "Lay out the year: the Year in Review and Christmas gift peak with cut-off dates per country, Mother's Day, graduation and wedding season, back-to-school yearbooks, and the calendar and poster pushes, with budget and target cost per country and product.", "streamsNeeded": [{"id": "run-seasonal-campaigns-and-promotions", "name": "Run Seasonal Campaigns And Promotions", "howItSupports": "Holds the marketing calendar, budgets and country targets that every campaign, promo and creative hangs off."}]}, {"step": "Localise offers, creatives and prices", "description": "Produce creatives and landing pages in the ten site languages, express prices and promotions in the seven currencies, and adapt the message: yearbooks for US families, Facebook year books for archivists, gifts with delivery-before-the-date promises where the windows allow.", "streamsNeeded": [{"id": "run-seasonal-campaigns-and-promotions", "name": "Run Seasonal Campaigns And Promotions", "howItSupports": "Manages localised campaign variants and promotions so one plan runs in ten languages and seven currencies."}, {"id": "choose-format-price-and-checkout", "name": "Choose Format Price And Checkout", "howItSupports": "Supplies the price list, cover rules and promo mechanics that the localised offers must match exactly."}]}, {"step": "Launch paid channels and app store presence", "description": "Run paid social and paid search, refresh App Store and Google Play listings, screenshots and keywords, and pursue store featuring, which has placed PastBook in several countries before.", "streamsNeeded": [{"id": "discover-and-install-the-app", "name": "Discover And Install The App", "howItSupports": "Is the funnel the campaigns feed: from ad or store listing to installed app with photo permission or a pastbook.com visit."}, {"id": "run-seasonal-campaigns-and-promotions", "name": "Run Seasonal Campaigns And Promotions", "howItSupports": "Executes the paid campaigns and store optimisation against the calendar."}]}, {"step": "Attribute installs and orders and read the economics", "description": "Reconcile installs, previews and paid orders per channel, country and campaign, separate paid from organic and featured installs, and read return on ad spend and blended acquisition cost against an average order value around USD 36.50.", "streamsNeeded": [{"id": "discover-and-install-the-app", "name": "Discover And Install The App", "howItSupports": "Provides install and attribution events per store, channel and country."}, {"id": "run-seasonal-campaigns-and-promotions", "name": "Run Seasonal Campaigns And Promotions", "howItSupports": "Joins spend, attribution and orders into the return on ad spend and acquisition cost views per campaign."}]}, {"step": "Rebalance budgets and keep campaigns compliant", "description": "Shift budget between countries and channels weekly, pause what does not pay back, and make sure creatives, claims, data use and Facebook Login flows stay within Meta advertising terms and App Store and Google Play rules.", "streamsNeeded": [{"id": "protect-photo-privacy-and-platform-compliance", "name": "Protect Photo Privacy And Platform Compliance", "howItSupports": "Checks campaign data use, consent and platform policy so a campaign never becomes a Meta or app store incident."}, {"id": "run-seasonal-campaigns-and-promotions", "name": "Run Seasonal Campaigns And Promotions", "howItSupports": "Supports weekly budget reallocation with the per-country economics."}]}]}, {"id": "jtbd-gmkt-2", "name": "Convert installs and previews into paid orders", "whatItIs": "Measure and improve the funnel from install or site visit through photo permission, import, curation and the free preview to a paid order, run experiments on pricing display, promotions and upgrades at checkout, and recover people who saw their book but did not buy.", "outcome": "More of the installs bought with paid budget become paid orders, the preview-to-order step improves measurably each quarter, and abandoned previews are recovered without discounting everything.", "steps": [{"step": "Measure the funnel from install to import", "description": "Track how many installs grant photo library access, how many start an import from camera roll, Facebook, computer, Dropbox or Google Drive, and where people drop, per country and store.", "streamsNeeded": [{"id": "discover-and-install-the-app", "name": "Discover And Install The App", "howItSupports": "Provides install and permission events per country and store."}, {"id": "import-photos-from-phone-and-cloud", "name": "Import Photos From Phone And Cloud", "howItSupports": "Provides import start and completion events per source, so drop-offs are attributed to a step."}]}, {"step": "Watch curation and preview completion", "description": "Check that the curation engine produces the book in under 60 seconds and that people reach the free preview and the highlight video, since a slow or empty preview is the biggest conversion killer.", "streamsNeeded": [{"id": "curate-the-best-photos-with-ai", "name": "Curate The Best Photos With Ai", "howItSupports": "Reports curation duration and success so slow or failed selections are separated from marketing effects."}, {"id": "auto-design-the-book-and-preview", "name": "Auto Design The Book And Preview", "howItSupports": "Reports preview completion and highlight video views, the moment of truth for conversion."}]}, {"step": "Run experiments on the preview-to-checkout step", "description": "Test how prices and extra pages are shown, small versus large hardcover default, cover upgrade and free-shipping incentives, and how much editing to offer before checkout.", "streamsNeeded": [{"id": "choose-format-price-and-checkout", "name": "Choose Format Price And Checkout", "howItSupports": "Provides the pricing, cover and promo variants and the checkout events for each experiment arm."}, {"id": "edit-and-personalise-the-book", "name": "Edit And Personalise The Book", "howItSupports": "Shows whether editing before checkout raises or lowers conversion for each segment."}]}, {"step": "Recover abandoned previews", "description": "Send push and e-mail to people who saw their book but did not order, with the book cover as the creative, timed and capped so it does not feel like spam and respects consent.", "streamsNeeded": [{"id": "retain-customers-with-yearbooks-and-reminders", "name": "Retain Customers With Yearbooks And Reminders", "howItSupports": "Runs the abandoned-preview push and e-mail flows with the person's own book as the creative."}]}, {"step": "Fix the Facebook flow for archivists", "description": "Watch Facebook Login success, permission scope granted and year-selection completion for the Facebook Photo Books flow, and work with the web team when Meta changes what is allowed.", "streamsNeeded": [{"id": "connect-facebook-and-pick-a-year", "name": "Connect Facebook And Pick A Year", "howItSupports": "Reports login, permission and year-selection completion for the Facebook Photo Books funnel."}]}]}, {"id": "jtbd-gmkt-3", "name": "Bring customers back every year", "whatItIs": "Turn a first order into an annual habit: yearbook and calendar reminders timed on the first order and the country's seasons, reorders of past years and gift copies for family, ratings prompts that feed Trustpilot and the app stores, all within consent and unsubscribe rules.", "outcome": "A rising share of customers orders again the next year without paid acquisition, reminder programmes convert measurably, and ratings keep the app eligible for featuring.", "steps": [{"step": "Design the reminder cadence", "description": "Set when a customer who ordered a yearbook in January or a Christmas gift in December hears from PastBook again: the next Year in Review, a calendar in October, a poster after a trip, per country.", "streamsNeeded": [{"id": "retain-customers-with-yearbooks-and-reminders", "name": "Retain Customers With Yearbooks And Reminders", "howItSupports": "Schedules yearbook and calendar reminders from each customer's order history and country."}]}, {"step": "Segment by first product and market", "description": "Split customers by product bought, source used (phone, Facebook, cloud), country and currency, and season of the first order, so the reminder offers the right next product at the right price.", "streamsNeeded": [{"id": "retain-customers-with-yearbooks-and-reminders", "name": "Retain Customers With Yearbooks And Reminders", "howItSupports": "Provides the customer segments and order history for lifecycle targeting."}, {"id": "run-seasonal-campaigns-and-promotions", "name": "Run Seasonal Campaigns And Promotions", "howItSupports": "Aligns lifecycle offers with the seasonal promotions running in the customer's country."}]}, {"step": "Prompt ratings and sharing at the right moment", "description": "Ask for an App Store or Trustpilot rating after a delivered book, and encourage sharing the highlight video and the book preview with family as a referral path.", "streamsNeeded": [{"id": "auto-design-the-book-and-preview", "name": "Auto Design The Book And Preview", "howItSupports": "Generates the shareable highlight video that spreads the book to family and friends."}, {"id": "retain-customers-with-yearbooks-and-reminders", "name": "Retain Customers With Yearbooks And Reminders", "howItSupports": "Triggers rating prompts after delivery and tracks their effect on store and Trustpilot ratings."}]}, {"step": "Sell reorders and gift copies", "description": "Make reordering last year's book, printing an earlier Facebook year or sending a second copy to grandparents a two-click flow from the account and the reminder.", "streamsNeeded": [{"id": "retain-customers-with-yearbooks-and-reminders", "name": "Retain Customers With Yearbooks And Reminders", "howItSupports": "Provides reorder and gift-copy flows from order history."}, {"id": "choose-format-price-and-checkout", "name": "Choose Format Price And Checkout", "howItSupports": "Handles the additional copies, formats, gift cards and currencies at checkout."}]}, {"step": "Respect consent and unsubscribe", "description": "Keep every push and e-mail within the consent the customer gave, honour unsubscribes and deletion requests across GDPR and CCPA, and never use photos in marketing without permission.", "streamsNeeded": [{"id": "protect-photo-privacy-and-platform-compliance", "name": "Protect Photo Privacy And Platform Compliance", "howItSupports": "Enforces consent, unsubscribe and deletion across lifecycle messaging and photo use."}]}]}], "customerJourneyStories": [{"id": "journey-gmkt-1", "name": "A performance marketer moves the Year in Review campaign into the campaign console", "linkedJobIds": ["jtbd-gmkt-1", "jtbd-gmkt-2"], "summary": "A performance marketer hired in New York to grow the US market inherits a Q4 plan spread over ad platforms, spreadsheets and a promo list, is sceptical that an internal console can replace the ad managers she knows, and after one peak runs the Year in Review campaign across countries and currencies from the console with daily return on ad spend.", "stages": [{"stage": "Trigger", "narrative": "She joins in August, weeks before the Year in Review campaign that produces the largest share of the year's orders, and finds last year's plan in ad platform exports, a promo spreadsheet in seven currencies and a Slack thread about cut-off dates. Nobody can tell her the real blended acquisition cost of last Q4 per country."}, {"stage": "Discovery", "narrative": "The CMO walks her through the growth and campaign console the Amsterdam team built: the seasonal calendar per country, promo codes created once and localised, attribution joined to installs and orders, and the funnel from install to permission to preview to order. The Milan colleague shows how the ten-language creatives are managed against one plan."}, {"stage": "Evaluation", "narrative": "Her doubt is whether attribution in the console matches what the ad platforms claim and whether the console will slow her down in the peak. She evaluates a back-test on last Q4: the console's install-to-order and return-on-ad-spend numbers per country reconcile with finance, and it separates organic and featured installs that platforms were claiming. The promo cost view shows the discount share of revenue for the first time."}, {"stage": "Trial", "narrative": "She runs the Mother's Day-scale September test in two countries from the console: campaigns, promo codes in USD and CAD, creatives in English and French, attribution read daily. When a Canadian code leaks to US customers, the console shows it the same day and she switches it off."}, {"stage": "Engagement", "narrative": "Q4 runs entirely from the console: cut-off dates per country feed the campaign end dates, budgets are rebalanced weekly between the US, Australia and the UK on return on ad spend, and the funnel view sends a curation slowdown to engineering before it shows up as wasted spend."}, {"stage": "Retention", "narrative": "She keeps the console after the peak because it gave her the number she was hired for: a blended acquisition cost per country she can defend, a Q4 plan for next year that starts from data instead of exports, and a promo discipline the CMO now reviews weekly with her. She asks for the calendar and poster pushes to be planned there too."}]}, {"id": "journey-gmkt-2", "name": "A CRM marketer builds the yearbook reminder programme", "linkedJobIds": ["jtbd-gmkt-3", "jtbd-gmkt-2"], "summary": "A lifecycle marketer in Amsterdam who ran generic newsletters is asked to make the annual yearbook a habit, questions whether reminders can be timed per customer and country without a large CRM suite, and adopts the console's lifecycle programmes to lift repeat orders while staying within consent rules.", "stages": [{"stage": "Trigger", "narrative": "The management team sets a year-3 goal of an annual memory habit with a much higher repeat rate, and the CRM marketer realises the monthly newsletter she sends to everyone in English cannot deliver it: a family that ordered a yearbook in January and a grandparent who received a Christmas gift need different messages at different times."}, {"stage": "Discovery", "narrative": "In the growth and campaign console she finds lifecycle programmes that trigger from each customer's order history and country: yearbook reminders, calendar pushes in October, abandoned-preview recovery with the customer's own cover as the creative, rating prompts after delivery, and reorder and gift-copy flows. The support team tells her which reminders customers complain about."}, {"stage": "Evaluation", "narrative": "She weighs it against buying a CRM suite. What decides it is that the console already has the order history, the consent records and the ten-language templates, that unsubscribes and GDPR and CCPA deletions propagate automatically, and that a yearbook reminder converting at a few percent of last year's customers pays for itself against paid acquisition at about USD 26 per customer."}, {"stage": "Trial", "narrative": "Her first programme is the yearbook reminder for US customers who ordered in the previous year's first quarter, in English, with a control group. Conversion beats the newsletter several times over, and the console shows that reminders sent before the highlight video was shared perform worse, so she sequences them."}, {"stage": "Engagement", "narrative": "Within a year the lifecycle calendar covers the seven currencies and ten languages: yearbook and calendar reminders, reorders of earlier Facebook years for archivists, gift copies for grandparents before Christmas, and rating prompts that keep the App Store rating eligible for featuring. Repeat share becomes a weekly number in the growth meeting."}, {"stage": "Retention", "narrative": "She stays on the console because repeat orders became her metric rather than open rates: customers ordering in two consecutive years rise, the programme runs without her touching send lists, and the growth and brand teams now ask her to add the sustainability and FSC story to the retention flow for European customers."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-gmkt-top", "name": "Blended customer acquisition cost", "description": "Total paid marketing spend divided by all new customers in the period, including organic, featured and referred customers, across all countries and currencies converted to USD. Modeled seed value for a US-heavy performance marketing mix; not an official PastBook figure.", "unit": "USD", "currentValue": "18.5", "targetValue": "14.0", "link": "https://dashboard.example.com/instant-photo-book-platform/customers/gmkt/kpis/co-gmkt-top
