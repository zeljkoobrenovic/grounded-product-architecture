<script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

<script>
    const team = {"id": "guest-marketplace-discovery-and-consideration-3", "name": "Guest Marketplace Wishlists & Sharing", "type": "stream-aligned", "description": "Own Wishlists & Sharing within Guest Marketplace, keeping product quality, operating metrics, and delivery accountability explicit.", "teamHeadcount": {"headcount": 10, "description": "Cross-functional product team."}, "documentLinks": [], "customerDependencies": [{"customerId": "cg1-p1", "name": "Guest Stay Booker", "icon": "guest.png", "href": "../customers/landing_pages/cg1-p1.html", "description": ""}], "streamDependencies": [], "brickDependencies": [{"brickId": "wish", "name": "Wishlists & Sharing", "icon": "wish.png", "href": "../product-bricks/landing_pages/wish.html", "description": ""}], "otherTeamDependencies": [{"teamId": "guest-discovery-ranking", "name": "Guest Discovery & Ranking", "type": "stream-aligned", "groupName": "Guest Marketplace", "href": "landing_pages/guest-discovery-ranking.html", "dependencyType": "facilitating", "dependencyTypeName": "Facilitating", "description": ""}, {"teamId": "professional-supply-host-operations-and-economics", "name": "Professional Supply Operations Turnover & Operations Coordination", "type": "stream-aligned", "groupName": "Professional Supply Operations", "href": "landing_pages/professional-supply-host-operations-and-economics.html", "dependencyType": "x-as-a-service", "dependencyTypeName": "X-as-a-Service", "description": ""}], "groupId": "guest-marketplace", "groupName": "Guest Marketplace"};
    const domainName = 'Hosted Stays Marketplace';
    const orgDesign = team.__orgDesign || {};

    const TEAM_TYPE_LABELS = {
        'stream-aligned': 'Stream-aligned',
        'platform': 'Platform',
        'enabling': 'Enabling',
        'complicated-subsystem': 'Complicated subsystem',
        'other': 'Other'
    };
    const TEAM_TYPE_COLORS = {
        'stream-aligned': '#2563eb',
        'platform': '#0891b2',
        'enabling': '#16a34a',
        'complicated-subsystem': '#9333ea',
        'other': '#6b7280'
    };

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function typeColor(typeId) {
        return TEAM_TYPE_COLORS[typeId] || '#6b7280';
    }

    function typeLabel(typeId) {
        return TEAM_TYPE_LABELS[typeId] || typeId || 'team';
    }

    // The generator builds hrefs relative to teams/index.html. Landing pages live one
    // level deeper (teams/landing_pages/), so adjust the prefix accordingly.
    function relink(href) {
        if (!href) return '#';
        if (href.indexOf('landing_pages/') === 0) {
            // sibling team page: landing_pages/<id>.html -> <id>.html
            return href.substring('landing_pages/'.length);
        }
        if (href.indexOf('../') === 0) {
            // ../customers/... or ../product-bricks/... -> ../../...
            return '../' + href;
        }
        return href;
    }

    function renderLinkCards(items, iconBase, options) {
        options = options || {};
        if (!items || !items.length) {
            return '<div class="empty-state">' + escapeHtml(options.empty || 'None linked.') + '</div>';
        }
        let html = '<div class="link-grid">';
        items.forEach(item => {
            const extraClass = options.team ? ' team' : '';
            const style = options.team ? ' style="border-left-color:' + typeColor(item.type) + '"' : '';
            html += '<a class="link-card' + extraClass + '"' + style + ' target="_blank" href="' + escapeHtml(relink(item.href)) + '">';
            if (options.noIcon) {
                // internal teams have no icon; show a type-colored dot instead of a broken image
                html += '<span class="link-dot" style="background-color:' + typeColor(item.type) + '"></span>';
            } else {
                const iconClass = 'link-icon' + (options.round ? ' round' : '');
                const fallback = iconBase + (options.fallbackIcon || 'logo.png');
                html += '<img class="' + iconClass + '" src="' + escapeHtml(iconBase + (item.icon || '')) + '" onerror="this.onerror=null;this.src=\'' + fallback + '\'">';
            }
            html += '<div class="link-body">';
            html += '<div class="link-name">' + escapeHtml(item.name) + '</div>';
            const meta = options.metaBuilder ? options.metaBuilder(item) : (item.description || '');
            if (meta) {
                html += '<div class="link-meta">' + escapeHtml(meta) + '</div>';
            }
            html += '</div></a>';
        });
        html += '</div>';
        return html;
    }

    function renderSection(title, body) {
        return '<div class="section"><div class="section-title">' + escapeHtml(title) + '</div>' + body + '</div>';
    }

    function renderTeamDependencies(items) {
        if (!items || !items.length) {
            return '<div class="empty-state">No related teams.</div>';
        }
        const byType = {};
        const order = [];
        items.forEach(item => {
            const key = item.dependencyTypeName || item.dependencyType || 'Related';
            if (!byType[key]) { byType[key] = []; order.push(key); }
            byType[key].push(item);
        });
        let html = '';
        order.forEach(key => {
            html += '<div class="dep-type-group">';
            html += '<div class="dep-type-label">' + escapeHtml(key) + '</div>';
            html += renderLinkCards(byType[key], '', {
                team: true,
                noIcon: true,
                metaBuilder: item => [item.groupName || '', typeLabel(item.type)].filter(Boolean).join(' | ')
            });
            html += '</div>';
        });
        return html;
    }

    // header
    document.getElementById('TypeBadge').innerHTML =
        '<span class="type-badge" style="background-color:' + typeColor(team.type) + '">' + escapeHtml(typeLabel(team.type)) + '</span>';
    document.getElementById('Title').innerHTML = escapeHtml(team.name || 'Team');
    document.getElementById('Meta').innerHTML =
        escapeHtml(domainName) + ' | ' + escapeHtml(team.groupName || '');

    const hc = (team.teamHeadcount || {});
    let html = '';

    if (team.description) {
        html += '<div class="description">' + escapeHtml(team.description) + '</div>';
    }

    const headcount = Math.max(Number(hc.headcount) || 0, 0);
    let sizeBody = '';
    if (headcount) {
        let dots = '';
        for (let i = 0; i < headcount; i++) {
            dots += '<span class="hc-dot" style="background-color:' + typeColor(team.type) + '"></span>';
        }
        sizeBody += '<div class="hc-dots">' + dots + '</div>';
    } else {
        sizeBody += '<div class="empty-state">Headcount not set.</div>';
    }
    if (hc.description) {
        sizeBody += '<div class="stat-note">' + escapeHtml(hc.description) + '</div>';
    }
    html += renderSection('Team Size (' + escapeHtml(String(headcount)) + ' FTE)', sizeBody);

    html += renderSection('Customers (' + (team.customerDependencies || []).length + ')',
        renderLinkCards(team.customerDependencies || [], '../../customers/icons/', {
            round: true, fallbackIcon: 'customer.png', empty: 'No customers linked.'
        }));

    html += renderSection('Product Streams (' + (team.streamDependencies || []).length + ')',
        renderLinkCards(team.streamDependencies || [], '../../product-bricks/icons/', {
            fallbackIcon: 'brick.png', empty: 'No streams linked.'
        }));

    html += renderSection('Product Bricks (' + (team.brickDependencies || []).length + ')',
        renderLinkCards(team.brickDependencies || [], '../../product-bricks/icons/', {
            fallbackIcon: 'brick.png', empty: 'No product bricks linked.'
        }));

    html += renderSection('Related Teams (' + (team.otherTeamDependencies || []).length + ')',
        renderTeamDependencies(team.otherTeamDependencies || []));

    if ((team.documentLinks || []).length) {
        let docs = '';
        (team.documentLinks || []).forEach(doc => {
            docs += '<a class="doc-link" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(doc.url || '#') + '">&#128279; ' + escapeHtml(doc.title || doc.url || 'Document') + '</a>';
        });
        html += renderSection('Documents (' + (team.documentLinks || []).length + ')', docs);
    }

    document.getElementById('tab_content_home-tab').innerHTML = html;
</script>
<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Hosted Stays Marketplace Home"
    },
    {
      "link": "../index.html",
      "label": "Teams"
    },
    {
      "label": "Guest Marketplace Wishlists & Sharing"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
