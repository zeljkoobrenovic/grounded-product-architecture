<script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        document.getElementById('tab_' + resolvedTabName).className += ' active';
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

        securityLevel: 'loose',
        flowchart: {
            htmlLabels: false
        }
    });

    const distinctRoles = [];
    const distinctRoleMap = {};
    const roleInstanceCounts = {};
    const distinctAgents = [];
    const distinctAgentMap = {};
    const agentInstanceCounts = {};

    function registerRole(role) {
        const key = slugifyRole(role.role);
        if (!key) {
            return;
        }
        if (!distinctRoleMap[key]) {
            distinctRoleMap[key] = role.role;
            distinctRoles.push(role.role);
        }
        roleInstanceCounts[key] = (roleInstanceCounts[key] || 0) + Math.max(Number(role.count) || 0, 0);
    }

    function agentName(agent) {
        return agent.name || agent.id || 'AI agent';
    }

    function agentKey(agent) {
        return slugifyRole(agentName(agent));
    }

    function registerAgent(agent) {
        const key = agentKey(agent);
        if (!key) {
            return;
        }
        if (!distinctAgentMap[key]) {
            distinctAgentMap[key] = agentName(agent);
            distinctAgents.push(agentName(agent));
        }
        agentInstanceCounts[key] = (agentInstanceCounts[key] || 0) + 1;
    }

    flatTeams.forEach(team => {
        ((team.staffing || {}).roles || []).forEach(role => {
            registerRole(role);
        });
        (team.aiAgents || []).forEach(agent => {
            registerAgent(agent);
        });
    });
    (teamsData.groups || []).forEach(group => {
        (((group.groupLeadership || {}).roles) || []).forEach(role => {
            registerRole(role);
        });
    });

    const roleColorMap = {};
    distinctRoles
        .sort((left, right) => left.localeCompare(right))
        .forEach((role, index) => {
            roleColorMap[slugifyRole(role)] = rolePalette[index % rolePalette.length];
        });
    const agentColorMap = {};
    distinctAgents
        .sort((left, right) => left.localeCompare(right))
        .forEach((agent, index) => {
            agentColorMap[slugifyRole(agent)] = rolePalette[(index + distinctRoles.length) % rolePalette.length];
        });

    const streamAlignedCount = flatTeams.filter(team => team.teamType === 'stream-aligned').length;
    const platformCount = flatTeams.filter(team => team.teamType === 'platform').length;
    const totalHeadcount = flatTeams.reduce((sum, team) => sum + ((team.staffing || {}).suggestedHeadcount || 0), 0);
    const totalRoles = flatTeams.reduce((sum, team) => sum + (((team.staffing || {}).roles || []).length), 0);
    const totalAiAgents = flatTeams.reduce((sum, team) => sum + ((team.aiAgents || []).length), 0);
    const totalGroupLeadershipHeadcount = (teamsData.groups || []).reduce((sum, group) => sum + (((group.groupLeadership || {}).suggestedHeadcount) || 0), 0);
    const totalGroupLeadershipRoles = (teamsData.groups || []).reduce((sum, group) => sum + ((((group.groupLeadership || {}).roles) || []).length), 0);

    document.getElementById('HeroNote').innerHTML = escapeHtml(teamsData.orgDesign.operatingModel || '');

    document.getElementById('OverviewSummary').innerHTML =
        '<div class="stat"><div class="stat-value">' + formatNumber(flatTeams.length) + '</div><div class="stat-label">Teams</div></div>' +
        '<div class="stat"><div class="stat-value">' + formatNumber(totalHeadcount) + '</div><div class="stat-label">Headcount</div></div>' +
        '<div class="stat"><div class="stat-value">' + formatNumber(streamAlignedCount) + '</div><div class="stat-label">Stream-aligned Teams</div></div>' +
        '<div class="stat"><div class="stat-value">' + formatNumber(platformCount) + '</div><div class="stat-label">Platform Teams</div></div>' +
        '<div class="stat"><div class="stat-value">' + formatNumber(distinctRoles.length) + '</div><div class="stat-label">Distinct Roles</div></div>' +
        '<div class="stat"><div class="stat-value">' + formatNumber(distinctAgents.length) + '</div><div class="stat-label">Distinct AI Agents</div></div>' +
        '<div class="stat"><div class="stat-value">' + formatNumber(totalAiAgents) + '</div><div class="stat-label">AI Agents</div></div>';

    const overviewSectionOptions = [
        {id: 'mission', label: 'Mission', defaultVisible: true},
        {id: 'stats', label: 'Stats', defaultVisible: true},
        {id: 'customers', label: 'Customers', defaultVisible: true},
        {id: 'bricks', label: 'Bricks', defaultVisible: true},
        {id: 'roles', label: 'Roles', defaultVisible: true},
        {id: 'agents', label: 'AI Agents', defaultVisible: true},
        {id: 'activity', label: 'Activity', defaultVisible: true}
    ];
    const overviewSectionVisibility = {};
    overviewSectionOptions.forEach(option => {
        overviewSectionVisibility[option.id] = option.defaultVisible;
    });

    function sectionVisible(sectionId) {
        return overviewSectionVisibility[sectionId] !== false;
    }

    function renderOverviewSectionToggles() {
        let html = '<div class="overview-filter-section"><div class="section-title">Team Card Sections</div><div class="section-toggle-row">';
        overviewSectionOptions.forEach(option => {
            html += '<label class="section-toggle"><input type="checkbox" data-section-id="' + escapeHtml(option.id) + '"' + (sectionVisible(option.id) ? ' checked' : '') + '> <span>' + escapeHtml(option.label) + '</span></label>';
        });
        html += '</div></div>';
        document.getElementById('OverviewSectionToggles').innerHTML = html;
        document.querySelectorAll('#OverviewSectionToggles input[type="checkbox"]').forEach(input => {
            input.addEventListener('change', () => setOverviewSectionVisibility(input.getAttribute('data-section-id') || '', input.checked));
        });
    }

    function setOverviewSectionVisibility(sectionId, isVisible) {
        if (!sectionId) {
            return;
        }
        overviewSectionVisibility[sectionId] = isVisible;
        renderOverview();
    }

    function renderOrgDesignOverview() {
        let html = '<div class="org-overview"><div class="section-title">Team Org Design</div><div class="org-overview-grid">';
        (teamsData.groups || []).forEach(group => {
            html += '<div class="org-overview-group">';
            html += '<div class="org-overview-group-name">' + escapeHtml(group.name || group.id || 'Group') + '</div>';
            (group.teams || []).forEach(team => {
                html += '<a class="org-overview-team" target="_blank" href="landing_pages/' + escapeHtml(team.id) + '.html">' + escapeHtml(team.name || team.id) + '</a>';
            });
            html += '</div>';
        });
        html += '</div></div>';
        document.getElementById('OrgDesignOverview').innerHTML = html;
    }

    function renderCustomerSection(team) {
        if (!sectionVisible('customers') || !(team.primaryCustomers || []).length) {
            return '';
        }
        let html = '<div class="team-card-section"><div class="section-title">Primary Customers</div>';
        (team.primaryCustomers || []).forEach(customer => {
            html += '<div class="customer-pill"><img class="linked-icon" src="../customers/icons/' + escapeHtml(customer.icon || 'customer.png') + '" onerror="this.onerror=null;this.src=\'../customers/icons/customer.png\'">' + escapeHtml(customer.customerName || customer.customerId) + '</div>';
        });
        html += '</div>';
        return html;
    }

    function renderProductBrickSection(team) {
        if (!sectionVisible('bricks') || (!((team.ownedProductBricks || []).length) && !((team.supportingProductBricks || []).length))) {
            return '';
        }
        let html = '<div class="team-card-section"><div class="section-title">Product Bricks</div>';
        if ((team.ownedProductBricks || []).length) {
            html += '<div class="overview-team-meta">Owned</div>';
            (team.ownedProductBricks || []).forEach(brick => {
                html += '<div class="brick-pill"><img class="brick-icon" src="../product-bricks/icons/' + escapeHtml((brick.brick || {}).icon || 'logo.png') + '" onerror="this.onerror=null;this.src=\'../product-bricks/icons/logo.png\'">' + escapeHtml(brick.brickName || brick.brickId) + '</div>';
            });
        }
        if ((team.supportingProductBricks || []).length) {
            html += '<div class="overview-team-meta">Supporting</div>';
            (team.supportingProductBricks || []).forEach(brick => {
                html += '<div class="brick-pill"><img class="brick-icon" src="../product-bricks/icons/' + escapeHtml((brick.brick || {}).icon || 'logo.png') + '" onerror="this.onerror=null;this.src=\'../product-bricks/icons/logo.png\'">' + escapeHtml(brick.brickName || brick.brickId) + '</div>';

        }
        html += '</div>';
        return html;
    }

    function renderActivitySection(team) {
        if (!sectionVisible('activity')) {
            return '';
        }
        return '<div class="team-card-section activity-row">Discoveries: ' + escapeHtml(String((team.relatedDiscoveries || []).length)) + ' | Initiatives: ' + escapeHtml(String((team.relatedInitiatives || []).length)) + ' | Releases: ' + escapeHtml(String((team.relatedReleases || []).length)) + '</div>';
    }

    function renderTeamCard(team) {
        const staffing = team.staffing || {};
        let html = '<a class="team-card" target="_blank" href="landing_pages/' + escapeHtml(team.id) + '.html">';
        html += '<div class="team-type">' + escapeHtml(team.teamType || 'team') + '</div>';
        html += '<div class="team-name">' + escapeHtml(team.name) + '</div>';
        if (sectionVisible('mission')) {
            html += '<div class="team-mission">' + escapeHtml(team.mission || '') + '</div>';
        }
        if (sectionVisible('stats')) {
            html += '<div class="meta-row">';
            html += '<div class="meta-pill">Headcount: ' + escapeHtml(String(staffing.suggestedHeadcount || 0)) + '</div>';
            html += '<div class="meta-pill">Roles: ' + escapeHtml(String((staffing.roles || []).length)) + '</div>';
            html += '<div class="meta-pill">Customers: ' + escapeHtml(String((team.primaryCustomers || []).length)) + '</div>';
            html += '<div class="meta-pill">Bricks: ' + escapeHtml(String((team.ownedProductBricks || []).length + (team.supportingProductBricks || []).length)) + '</div>';
            html += '<div class="meta-pill">AI Agents: ' + escapeHtml(String((team.aiAgents || []).length)) + '</div>';
            html += '</div>';
        }
        html += renderCustomerSection(team);
        html += renderProductBrickSection(team);
        if (sectionVisible('roles') && (((team.staffing || {}).roles || []).length)) {
            html += '<div class="team-card-section"><div class="section-title">Role Mix</div>' + renderOverviewRoleDots(((team.staffing || {}).roles) || []) + '</div>';
        }
        html += renderActivitySection(team);
        if (sectionVisible('agents')) {
            html += renderOverviewAgentDots(team.aiAgents || []);
        }
        html += '</a>';
        return html;
    }

    let selectedOverviewFilterKind = '';
    let selectedOverviewFilterKey = '';

    function roleMatchesFilter(role) {
        return selectedOverviewFilterKind !== 'role' || slugifyRole(role.role) === selectedOverviewFilterKey;
    }

    function agentMatchesFilter(agent) {
        return selectedOverviewFilterKind !== 'agent' || agentKey(agent) === selectedOverviewFilterKey;
    }

    function hasMatchingRole(roles) {
        return selectedOverviewFilterKind !== 'role' || (roles || []).some(roleMatchesFilter);
    }

    function hasMatchingAgent(agents) {
        return selectedOverviewFilterKind !== 'agent' || (agents || []).some(agentMatchesFilter);
    }

    function teamMatchesOverviewFilter(team) {
        return hasMatchingRole(((team.staffing || {}).roles) || []) && hasMatchingAgent(team.aiAgents || []);
    }

    function renderOverviewRoleDots(roles) {
        let html = '<div class="overview-role-row">';
        (roles || []).filter(roleMatchesFilter).forEach(role => {
            const safeCount = Math.max(Number(role.count) || 0, 0);
            const color = roleColorMap[slugifyRole(role.role)] || '#94a3b8';
            html += '<div class="role-dot-group">';
            html += '<div class="role-label">' + escapeHtml(role.role) + ' (' + escapeHtml(String(safeCount)) + ')</div>';
            html += '<div class="role-dots">';
            for (let i = 0; i < safeCount; i++) {
                html += '<div class="role-dot" style="background-color: ' + color + '"></div>';
            }
            html += '</div>';
            html += '</div>';
        });
        html += '</div>';
        return html;
    }

    function renderOverviewAgentDots(agents) {
        const visibleAgents = (agents || []).filter(agentMatchesFilter);
        if (!visibleAgents.length) {
            return '';
        }
        let html = '<div class="overview-agent-section"><div class="section-title">AI Agents</div><div class="overview-role-row overview-agent-row">';
        visibleAgents.forEach(agent => {
            const color = agentColorMap[agentKey(agent)] || '#94a3b8';
            html += '<div class="role-dot-group">';
            html += '<div class="role-label">' + escapeHtml(agentName(agent)) + '</div>';
            html += '<div class="role-dots"><div class="role-dot" style="background-color: ' + color + '"></div></div>';
            html += '</div>';
        });
        html += '</div></div>';
        return html;
    }

    function overviewFilterIsActive(kind, key) {
        return selectedOverviewFilterKind === kind && selectedOverviewFilterKey === key;
    }

    function renderOverviewRoleFilter() {
        let html = '<div class="overview-filter-section"><div class="section-title">Roles</div><div class="legend-row">';
        html += '<button type="button" class="legend-pill' + (selectedOverviewFilterKind ? '' : ' active') + '" data-filter-kind="" data-filter-key="">Show all</button>';
        distinctRoles
            .sort((left, right) => left.localeCompare(right))
            .forEach(role => {
                const roleKey = slugifyRole(role);
                html += '<button type="button" class="legend-pill' + (overviewFilterIsActive('role', roleKey) ? ' active' : '') + '" data-filter-kind="role" data-filter-key="' + escapeHtml(roleKey) + '">';
                html += '<span class="legend-swatch" style="background-color: ' + roleColorMap[roleKey] + '"></span>';
                html += '<span>' + escapeHtml(role) + '</span>';
                html += '<span class="legend-count">' + escapeHtml(String(roleInstanceCounts[roleKey] || 0)) + '</span>';
                html += '</button>';
            });
        html += '</div></div>';
        if (distinctAgents.length) {
            html += '<div class="overview-filter-section"><div class="section-title">AI Agents</div><div class="legend-row">';
            distinctAgents
                .sort((left, right) => left.localeCompare(right))
                .forEach(agent => {
                    const key = slugifyRole(agent);
                    html += '<button type="button" class="legend-pill' + (overviewFilterIsActive('agent', key) ? ' active' : '') + '" data-filter-kind="agent" data-filter-key="' + escapeHtml(key) + '">';
                    html += '<span class="legend-swatch" style="background-color: ' + agentColorMap[key] + '"></span>';
                    html += '<span>' + escapeHtml(agent) + '</span>';
                    html += '<span class="legend-count">' + escapeHtml(String(agentInstanceCounts[key] || 0)) + '</span>';
                    html += '</button>';
                });
            html += '</div></div>';
        }
        document.getElementById('OverviewRoleFilter').innerHTML = html;
        document.querySelectorAll('#OverviewRoleFilter .legend-pill').forEach(button => {
            button.addEventListener('click', () => setOverviewFilter(button.getAttribute('data-filter-kind') || '', button.getAttribute('data-filter-key') || ''));
        });
    }

    function renderOverview() {
        let overviewHtml = '<div class="overview-list">';
        (teamsData.groups || []).forEach(group => {
            const groupLeadershipRoles = ((group.groupLeadership || {}).roles) || [];
            const visibleTeams = (group.teams || []).filter(teamMatchesOverviewFilter);
            const showGroupLeadership = sectionVisible('roles') && selectedOverviewFilterKind !== 'agent' && group.groupLeadership && groupLeadershipRoles.length && hasMatchingRole(groupLeadershipRoles);
            if (selectedOverviewFilterKind && !showGroupLeadership && !visibleTeams.length) {
                return;
            }
            overviewHtml += '<div class="overview-group">';
            overviewHtml += '<div class="overview-group-name">' + escapeHtml(group.name) + '</div>';
            if (group.mission) {
                overviewHtml += '<div class="group-mission">' + escapeHtml(group.mission) + '</div>';
            }
            if (showGroupLeadership) {
                overviewHtml += '<div class="group-leadership-card">';
                overviewHtml += '<div class="section-title">Group Leadership</div>';
                if (group.groupLeadership.purpose) {
                    overviewHtml += '<div class="group-mission">' + escapeHtml(group.groupLeadership.purpose) + '</div>';
                }
                overviewHtml += '<div class="meta-row">';
                overviewHtml += '<div class="meta-pill">Leadership headcount: ' + escapeHtml(String(group.groupLeadership.suggestedHeadcount || 0)) + '</div>';
                overviewHtml += '<div class="meta-pill">Role blocks: ' + escapeHtml(String(groupLeadershipRoles.length)) + '</div>';
                overviewHtml += '</div>';
                overviewHtml += renderOverviewRoleDots(groupLeadershipRoles);
                overviewHtml += '</div>';
            }
            overviewHtml += '<div class="team-grid">';
            visibleTeams.forEach(team => {
                overviewHtml += renderTeamCard(team);
            });
            overviewHtml += '</div></div>';
        });
        overviewHtml += '</div>';
        document.getElementById('Overview').innerHTML = overviewHtml;
    }

    function setOverviewFilter(kind, key) {
        if (!kind || !key || overviewFilterIsActive(kind, key)) {
            selectedOverviewFilterKind = '';
            selectedOverviewFilterKey = '';
        } else {
            selectedOverviewFilterKind = kind;
            selectedOverviewFilterKey = key;
        }
        renderOverviewRoleFilter();
        renderOverview();
    }

    renderOverviewRoleFilter();
    renderOrgDesignOverview();
    renderOverviewSectionToggles();
    renderOverview();

    let principlesHtml = '<div class="section-title">Design Principles</div>';
    principlesHtml += '<div>' + escapeHtml(teamsData.orgDesign.companyProfile || '') + '</div>';
    principlesHtml += '<ul>';
    (teamsData.orgDesign.designPrinciples || []).forEach(principle => {
        principlesHtml += '<li>' + escapeHtml(principle) + '</li>';
    });
    principlesHtml += '</ul>';
    document.getElementById('Principles').innerHTML = principlesHtml;

    function teamTypeMeta(team) {
        return [team.groupName || '', team.teamType || 'team'].filter(Boolean).join(' | ');
    }

    function dependencyTypeCatalog() {
        return [
            {id: 'depends_on', name: 'Explicit Depends On'},
            {id: 'supported_by', name: 'Default Supporting Team'},
            {id: 'shared_product_bricks', name: 'Shared Product Bricks'},
            {id: 'shared_initiatives', name: 'Shared Initiatives'},
            {id: 'shared_releases', name: 'Shared Releases'}
        ];
    }

    function renderChecklistItems(items, kind, className, onChangeHandler, emptyClass) {
        if (!items.length) {
            return '<div class="' + emptyClass + '">No items available.</div>';
        }
        return items.map(item => {
            const meta = kind === 'team' ? teamTypeMeta(item) : '';
            return '<label class="dependency-check-item">' +
                '<input type="checkbox" class="' + className + '" value="' + escapeHtml(item.id) + '" checked onchange="' + onChangeHandler + '()">' +
                '<span><span>' + escapeHtml(item.name) + '</span>' +
                (meta ? '<span class="dependency-check-meta">' + escapeHtml(meta) + '</span>' : '') +
                '</span></label>';
        }).join('');
    }

    function setAllCheckboxes(selector, checked) {
        document.querySelectorAll(selector).forEach(input => {
            input.checked = checked;
        });
        renderDependenciesView();
    }

    function selectedValues(selector) {
        return new Set(Array.from(document.querySelectorAll(selector))
            .filter(input => input.checked)
            .map(input => input.value));
    }

    function teamCatalog() {
        return flatTeams.slice().sort((left, right) => (left.name || '').localeCompare(right.name || ''));
    }

    function getTeamEdgeCatalog() {
        const teamNameMap = {};
        flatTeams.forEach(team => {
            teamNameMap[team.id] = team.name || team.id;
        });

        const sharedEdgeMap = {};
        const directEdges = [];
        flatTeams.forEach(team => {
            const dependencyData = team.dependencyData || {};

            (dependencyData.explicitRelationships || []).forEach(item => {
                directEdges.push({
                    source: team.id,
                    target: item.teamId,
                    type: item.relationshipType || 'depends_on',
                    typeLabel: item.relationshipLabel || item.relationshipType || 'relationship'
                });
            });

            [
                ['sharedProductBricks', 'shared_product_bricks', 'Shared Product Bricks'],
                ['sharedInitiatives', 'shared_initiatives', 'Shared Initiatives'],
                ['sharedReleases', 'shared_releases', 'Shared Releases']
            ].forEach(config => {
                const items = dependencyData[config[0]] || [];
                items.forEach(item => {
                    const pairKey = [team.id, item.teamId].sort().join('::') + '::' + config[1];
                    if (!sharedEdgeMap[pairKey]) {
                        const sortedPair = [team.id, item.teamId].sort();
                        sharedEdgeMap[pairKey] = {
                            source: sortedPair[0],
                            target: sortedPair[1],
                            type: config[1],
                            typeLabel: config[2]
                        };
                    }
                });
            });
        });

        return {
            teams: teamCatalog(),
            dependencyTypes: dependencyTypeCatalog(),
            edges: directEdges.concat(Object.values(sharedEdgeMap)).map(edge => ({
                ...edge,
                sourceName: teamNameMap[edge.source] || edge.source,
                targetName: teamNameMap[edge.target] || edge.target
            }))
        };
    }

    function renderDependenciesControls(catalog) {
        return '<div class="dependency-controls">' +
            '<div class="dependency-control-group">' +
            '<div class="dependency-control-title">Teams</div>' +
            '<div class="dependency-actions">' +
            '<button class="dependency-action" type="button" onclick="setAllCheckboxes(\'.dependency-team-checkbox\', true)">Show all</button>' +
            '<button class="dependency-action" type="button" onclick="setAllCheckboxes(\'.dependency-team-checkbox\', false)">Hide all</button>' +
            '</div><div class="dependency-checklist">' +
            renderChecklistItems(catalog.teams, 'team', 'dependency-team-checkbox', 'renderDependenciesView', 'dependency-empty') +
            '</div></div>' +
            '<div class="dependency-control-group">' +
            '<div class="dependency-control-title">Dependency Types</div>' +
            '<div class="dependency-actions">' +
            '<button class="dependency-action" type="button" onclick="setAllCheckboxes(\'.dependency-type-checkbox\', true)">Show all</button>' +
            '<button class="dependency-action" type="button" onclick="setAllCheckboxes(\'.dependency-type-checkbox\', false)">Hide all</button>' +
            '</div><div class="dependency-checklist">' +
            renderChecklistItems(catalog.dependencyTypes, 'type', 'dependency-type-checkbox', 'renderDependenciesView', 'dependency-empty') +
            '</div></div>' +
            '<div class="dependency-legend"><div class="dependency-control-title">Legend</div>' +
            '<div class="dependency-legend-items">' +
            '<div class="dependency-legend-item"><span class="dependency-legend-swatch" style="background-color:#dbeafe; border-color:#2563eb;"></span><span>Team</span></div>' +
            '<div class="dependency-legend-item"><span class="dependency-legend-swatch" style="background-color:#ecfccb; border-color:#65a30d;"></span><span>Shared dependency node</span></div>' +
            '</div></div></div>';
    }

    function buildTeamGraph(catalog, selectedTeamIds, selectedTypeIds) {
        return {
            teams: catalog.teams.filter(team => selectedTeamIds.has(team.id)),
            edges: catalog.edges.filter(edge =>
                selectedTeamIds.has(edge.source) &&
                selectedTeamIds.has(edge.target) &&
                selectedTypeIds.has(edge.type)
            )
        };
    }

    function renderDependenciesView() {
        const container = document.getElementById('DependenciesContent');
        if (!container) {
            return;
        }

        const catalog = getTeamEdgeCatalog();
        if (!dependenciesInitialized) {
            container.innerHTML = '<div class="dependencies-layout">' +
                renderDependenciesControls(catalog) +
                '<div><div id="DependenciesSummary" class="dependency-summary"></div><div id="DependenciesGraph" class="dependency-graph"></div></div>' +
                '</div>';
            dependenciesInitialized = true;
        }

        const selectedTeamIds = selectedValues('.dependency-team-checkbox');
        const selectedTypeIds = selectedValues('.dependency-type-checkbox');
        const graph = buildTeamGraph(catalog, selectedTeamIds, selectedTypeIds);

        document.getElementById('DependenciesSummary').innerHTML =
            '<div class="dependency-stat"><div class="dependency-stat-value">' + formatNumber(graph.teams.length) + '</div><div class="dependency-stat-label">Visible Teams</div></div>' +
            '<div class="dependency-stat"><div class="dependency-stat-value">' + formatNumber(graph.edges.length) + '</div><div class="dependency-stat-label">Visible Dependencies</div></div>' +
            '<div class="dependency-stat"><div class="dependency-stat-value">' + formatNumber(selectedTypeIds.size) + '</div><div class="dependency-stat-label">Active Types</div></div>';

        const graphContainer = document.getElementById('DependenciesGraph');
        if (!graph.teams.length || !graph.edges.length) {
            graphContainer.innerHTML = '<div class="dependency-empty">Select at least two connected teams and one dependency type.</div>';
            return;
        }

        let diagram = 'flowchart LR\n';
        graph.teams.forEach(team => {
            diagram += sanitizeMermaidId(team.id) + '["' + escapeMermaidLabel(team.name || team.id) + '"]\n';
            diagram += 'style ' + sanitizeMermaidId(team.id) + ' fill:#dbeafe,stroke:#2563eb,stroke-width:1px\n';
        });
        graph.edges.forEach((edge, index) => {
            const sourceId = sanitizeMermaidId(edge.source);
            const targetId = sanitizeMermaidId(edge.target);
            const label = escapeMermaidLabel(edge.typeLabel || edge.type || 'dependency');
            if (edge.type.indexOf('shared_') === 0) {
                const sharedId = sanitizeMermaidId('shared_' + edge.type + '_' + index);
                diagram += sharedId + '(("' + label + '"))\n';
                diagram += 'style ' + sharedId + ' fill:#ecfccb,stroke:#65a30d,stroke-width:1px\n';
                diagram += sourceId + ' --- ' + sharedId + '\n';
                diagram += sharedId + ' --- ' + targetId + '\n';
            } else {
                diagram += sourceId + ' -->|' + label + '| ' + targetId + '\n';
            }
        });

        const graphId = 'teams-dependency-graph-' + Date.now();
        graphContainer.innerHTML = '<div class="mermaid" id="' + graphId + '">' + diagram + '</div>';
        mermaid.run({querySelector: '#' + graphId});
    }
</script>
<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../start/index.html",
      "label": "Hosted Stays Marketplace Home"
    },
    {
      "label": "Teams"
    }
  ]
};
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
