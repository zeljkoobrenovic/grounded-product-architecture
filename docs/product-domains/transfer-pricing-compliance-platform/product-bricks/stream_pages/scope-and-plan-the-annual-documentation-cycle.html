    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

ent threshold and requirement rules per country."}]}, {"id": "calculate-deadlines-automatically", "title": "Calculate deadlines automatically for every scoped item", "actor": "Transfer Pricing Manager / Documentation Coordinator", "keyFacts": ["The deadline engine derives the Master File, Local File, CbCR and notification due dates per entity from the country rule, the fiscal year end and the tax return filing date where the deadline depends on it.", "Deadlines are recalculated when the fiscal year end, the scope or the country rule changes, and the change is visible on the item."], "painPoints": ["Deadlines maintained in a spreadsheet are copied from last year and silently wrong when a country moves from 'on request' to 'with the return'.", "Different deadline bases (fiscal year end versus return date) are the classic source of a missed notification."], "dependencies": [{"type": "brick", "id": "dead", "name": "Deadline Calculation Engine", "description": "Deadline calculation.", "how": "Calculates and recalculates due dates per scoped item."}, {"type": "brick", "id": "ctry", "name": "Country Regulations, Local Requirements and Local Forms", "description": "Deadline rules.", "how": "Provides the deadline basis and offsets per country and document type."}]}, {"id": "assign-tasks-to-local-contacts-and-advisers", "title": "Assign tasks to local contacts, reviewers and advisers", "actor": "Transfer Pricing Manager / Documentation Coordinator", "keyFacts": ["Each scoped item becomes a chain of tasks (provide data, review draft, translate, file) assigned to the local controller, the coordinator or an adviser, with unlimited users so no one is left out for licence reasons.", "Location-restricted profiles let a local contact work on their own entity without seeing the rest of the group."], "painPoints": ["Task lists kept in e-mail threads are invisible to the head of tax and to a successor when the coordinator leaves.", "Local contacts without access respond to data request oration and Reminders", "description": "Reassignment and escalation.", "how": "Moves tasks to new owners and escalates at-risk items."}, {"type": "brick", "id": "dash", "name": "Compliance Dashboard and Worldmap", "description": "At-risk view.", "how": "Highlights items where the deadline is close and tasks are open."}]}, {"id": "confirm-the-revised-plan-with-the-head-of-tax", "title": "Confirm the revised plan with the head of tax", "actor": "Group Head of Tax / Transfer Pricing Director", "keyFacts": ["The head of tax reviews the revised plan and the list of changes since sign-off, and accepts risks explicitly where a deadline cannot be met.", "Accepted risks are recorded against the item so the audit committee report reflects them."], "painPoints": ["Revised plans presented without a change list get re-litigated from scratch.", "Risks accepted verbally are forgotten when the audit letter arrives."], "dependencies": [{"type": "brick", "id": "dash", "name": "Compliance Dashboard and Worldmap", "description": "Change-since-sign-off view.", "how": "Shows what changed in the plan since the last review."}, {"type": "brick", "id": "scop", "name": "Documentation Scoping", "description": "Accepted risk record.", "how": "Stores accepted risks against scoped items."}]}, {"id": "close-the-cycle-and-roll-forward", "title": "Close the cycle and roll forward to next year", "actor": "Transfer Pricing Manager / Documentation Coordinator", "keyFacts": ["When the last item is filed, the cycle is closed and next year's scoping is pre-populated from it, with entities, owners and overrides carried forward for review.", "The closed cycle remains the record of what was scoped, decided and delivered for the year."], "painPoints": ["Cycles that are never formally closed leave the dashboard cluttered with stale items.", "Rebuilding the plan from zero each year repeats last year's scoping mistakes."], "dependencies": [{"type": "brick", "id": "scop", "name": "Documentation Scoping", "descrip     function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

    function getFlows() {
        return currentStream.flows || [];

    function getFlowDependencies(flow) {
        const dependencyIndex = new Map();
        (flow.steps || []).forEach(step => {
            (step.dependencies || []).forEach(dependency => {
                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());
    }

    function getStepDependency(step, dependency) {
        return (step.dependencies || []).find(item => (item.type || '') === (dependency.type || '') && (item.id || '') === (dependency.id || '')) || null;

        const lastStep = steps[steps.length - 1] || {};
        return {
            actor: flow.primaryActor || firstStep.actor || '',
            trigger: flow.trigger || firstStep.trigger || '',
            result: flow.successSignal || flow.outcome || lastStep.successSignal || lastStep.output || ''

                html += '<div class="link-entry">';
                html += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(link.link || '#') + '">'
                    + escapeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>


<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Transfer Pricing Compliance Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Streams Index"
    },
    {
      "label": "Scope and plan the annual documentation cycle"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
