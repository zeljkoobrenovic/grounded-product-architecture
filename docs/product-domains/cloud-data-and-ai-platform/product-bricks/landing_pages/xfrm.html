    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        document.getElementById('tab_' + resolvedTabName).className += ' active';
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

    function addDocs() {
        html += '<div  class="" style="margin-top: 32px">';

        function addGroup(docs, icon) {
            if (docs) {
                docs.split('\n').forEach(doc => {
                    const elements = doc.trim().split(',');
                    const label = elements.length > 0 ? elements[0].trim() : '';
                    const link = elements.length > 1 ? elements[1].trim() : '';
                    if (label && link) {
                        html += '<a target="_blank" href="' + link + '">';

                        html += '</div>';
                        html += '</a>';
                    }
                });
            }
        }

        html += '</div>';
    }

    document.getElementById('Header').innerHTML = html;
    html = '';

    function escapeHomeHtml(value) {
        return (value || '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function resolveCustomerMediaSrc(src) {
        const value = (src || '').trim();
        if (!value) {
            return '';
        }
        if (value.startsWith('http://') || value.startsWith('https://') || value.startsWith('data:')) {
            return value;
        }
        if (value.startsWith('../') || value.startsWith('./')) {
            return value;
        }
        if (value.startsWith('media/') || value.startsWith('icons/')) {
            return '../../customers/' + value;
        }
        return '../../customers/media/' + value;
    }

    function escapeMermaidLabel(value) {
        return (value || '')
            .replaceAll('&', 'and')
            .replaceAll('"', '')
            .replaceAll("'", '')
            .replaceAll('<', '')
            .replaceAll('>', '')
            .replaceAll('[', '(')
            .replaceAll(']', ')')
            .replaceAll('{', '(')
            .replaceAll('}', ')')
            .replaceAll('|', '/');
    }

    function renderLinkedProducts() {

                    sectionHtml += '<div class="home-link-copy">' + escapeHomeHtml(product.whyUsed) + '</div>';

            sectionHtml += '<div style="vertical-align: top"><a target="_blank" rel="noopener noreferrer" href="../capability_pages/' + escapeHomeHtml(capability.id) + '.html"><div class="home-link-title"><div class="page-type-badge" style="font-size: 70%;">Experience</div><br>' + escapeHomeHtml(capability.name) + '</div>';
            sectionHtml += '</a></div>';

    function renderSupportedJobs() {
        let sectionHtml = '<div class="home-section">';
        sectionHtml += '<div class="home-section-title">Supported Customer Jobs-To-Be-Done</div>';
        if (!supportedJobs.length) {
            sectionHtml += '<div class="activity-muted">No supporting customer jobs were inferred for this brick.</div>';
        } else {
            const groupedJobs = {};
            supportedJobs.forEach(item => {
                const actorKey = item.customerId + '|' + item.productId;
                if (!groupedJobs[actorKey]) {
                    groupedJobs[actorKey] = {
                        customerId: item.customerId,
                        customerName: item.customerName,
                        customerGroup: item.customerGroup,
                        customerIcon: item.customerIcon,
                        productId: item.productId,
                        productName: item.productName,
                        jobs: []
                    };
                }
                groupedJobs[actorKey].jobs.push(item);
            });

            Object.values(groupedJobs).forEach(actor => {
                sectionHtml += '<div class="home-link-card">';
                sectionHtml += '<div class="home-link-head">';
                sectionHtml += '<a target="_blank" rel="noopener noreferrer" href="../../customers/landing_pages/' + escapeHomeHtml(actor.customerId) + '.html">';

                actor.jobs.forEach(item => {
                    sectionHtml += '<div class="activity-block">';
                    sectionHtml += '<div class="home-link-copy"><b>' + escapeHomeHtml(item.jobName) + '</b></div>';

                        item.usedInSteps.forEach(step => {

                                sectionHtml += '<div class="activity-muted">' + escapeHomeHtml(step.description) + '</div>';

                            if (step.howItSupports) {
                                sectionHtml += '<div class="activity-muted"> - How it supports: ' + escapeHomeHtml(step.howItSupports) + '</div>';

    function renderBrickStructureSection(title, items, emptyMessage) {
        let sectionHtml = '<div class="home-section">';
        sectionHtml += '<div class="home-section-title">' + escapeHomeHtml(title) + '</div>';

            sectionHtml += '<div class="activity-muted">' + escapeHomeHtml(emptyMessage) + '</div>';
            sectionHtml += '</div>';
            return sectionHtml;
        }

        const kindClass = title === 'Interfaces'
            ? ' structure-interface'
            : (title === 'Internal Modules' ? ' structure-module' : '');

        sectionHtml += '<div class="structure-grid">';
        items.forEach(item => {
            const isObject = item && typeof item === 'object' && !Array.isArray(item);
            const name = isObject ? (item.title || item.name || item.id || '') : String(item || '');
            const description = isObject ? (item.description || '') : '';
            const type = isObject ? (item.type || '') : '';
            const meta = isObject ? [item.id, item.protocol, item.direction].filter(Boolean).join(' | ') : '';

            sectionHtml += '<div class="structure-card' + kindClass + '">';
            if (type) {
                sectionHtml += '<div class="structure-card-type">' + escapeHomeHtml(type) + '</div>';
            }
            sectionHtml += '<div class="structure-card-title">' + escapeHomeHtml(name) + '</div>';
            if (description) {
                sectionHtml += '<div class="structure-card-copy">' + escapeHomeHtml(description) + '</div>';
            }
            if (meta) {
                sectionHtml += '<div class="structure-card-meta">' + escapeHomeHtml(meta) + '</div>';
            }
            sectionHtml += '</div>';
        });
        sectionHtml += '</div>';
        sectionHtml += '</div>';
        return sectionHtml;
    }

    function buildDataAssetLookup() {
        const lookup = {};
        (dataAssetsPayload.assets || []).forEach(asset => {
            lookup[asset.id] = asset;
        });
        return lookup;
    }

    function findIncomingDataDependencies() {
        const incomingDependencies = [];
        all_bricks.forEach(candidate => {
            if (candidate.id === brick.id) {
                return;
            }
            (candidate.dataDependencies || []).forEach(item => {
                if (!item.assetId) {
                    return;
                }
                if ((brick.dataDependencies || []).some(dep => dep.assetId === item.assetId)) {
                    incomingDependencies.push({
                        assetId: item.assetId,
                        sourceBrickId: candidate.id,
                        sourceBrickName: candidate.name,
                        role: item.role || '',
                        description: item.description || ''
                    });
                }
            });
        });
        return incomingDependencies;
    }

        const assetLookup = buildDataAssetLookup();

        tableHtml += '<thead><tr><th>Data Asset</th><th>Role</th><th>Stores</th><th>Description</th></tr></thead><tbody>';
        items.forEach(item => {
            const asset = assetLookup[item.assetId] || {};
            const stores = (asset.stores || []).map(store => store.storeId).join(', ');
            tableHtml += '<tr>';
            tableHtml += '<td><div class="dependency-entity">';
            tableHtml += '<img class="dependency-entity-icon" src="../icons/data.png" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
            tableHtml += '<div><strong>' + escapeHomeHtml(asset.name || item.assetId || '') + '</strong>';
            if (asset.kind) {

    function getDataDiagramCatalog() {
        const assetLookup = buildDataAssetLookup();

        (brick.dataDependencies || []).forEach(dep => {

            sharedBricks[brick.id] = {
                id: brick.id,
                name: brick.name,
                role: 'current'
            };
        });

        findIncomingDataDependencies().forEach(item => {
            roles.add(item.role || 'unspecified');
            sharedBricks[item.sourceBrickId] = {
                id: item.sourceBrickId,
                name: item.sourceBrickName || item.sourceBrickId,
                role: 'related'
            };
        });

        return {
            assets: (brick.dataDependencies || []).map(dep => ({
                id: dep.assetId,
                name: (assetLookup[dep.assetId] || {}).name || dep.assetId,
                role: dep.role || 'unspecified'
            })),
            roles: Array.from(roles).sort((left, right) => left.localeCompare(right)),
            bricks: Object.values(sharedBricks)
        };
    }

    function buildDataDiagramGraph(selectedAssetIds, selectedRoles) {
        const assetLookup = buildDataAssetLookup();
        const nodes = [{
            id: 'current_brick',
            label: brick.name || brick.id,
            nodeClass: 'currentBrick'
        }];
        const edges = [];
        const nodeIds = {'current_brick': true};
        const ownershipGroups = {
            current_brick: {
                id: 'current_brick',
                label: brick.name || brick.id,
                nodeClass: 'currentBrick',
                assetNodeIds: []
            }
        };

        function ensureNode(id, label, nodeClass) {
            if (nodeIds[id]) {
                return;
            }
            nodeIds[id] = true;
            nodes.push({id, label, nodeClass});
        }

        (brick.dataDependencies || []).forEach(dep => {
            const role = dep.role || 'unspecified';
            if (!selectedAssetIds.has(dep.assetId) || !selectedRoles.has(role)) {
                return;
            }
            const asset = assetLookup[dep.assetId] || {};
            const assetNodeId = 'asset_' + dep.assetId.replaceAll('-', '_');
            ensureNode(assetNodeId, asset.name || dep.assetId, 'dataAsset');
            if (role === 'own') {
                ownershipGroups.current_brick.assetNodeIds.push(assetNodeId);
            } else {
                edges.push({
                    source: 'current_brick',
                    target: assetNodeId,
                    label: role
                });
            }

            findIncomingDataDependencies().forEach(item => {
                if (item.assetId !== dep.assetId) {
                    return;
                }
                const incomingRole = item.role || 'unspecified';
                if (!selectedRoles.has(incomingRole)) {
                    return;
                }
                const brickNodeId = 'brick_' + item.sourceBrickId.replaceAll('-', '_');
                ensureNode(brickNodeId, item.sourceBrickName || item.sourceBrickId, 'relatedBrick');
                if (!ownershipGroups[brickNodeId]) {
                    ownershipGroups[brickNodeId] = {
                        id: brickNodeId,
                        label: item.sourceBrickName || item.sourceBrickId,
                        nodeClass: 'relatedBrick',
                        assetNodeIds: []
                    };
                }
                if (incomingRole === 'own') {
                    ownershipGroups[brickNodeId].assetNodeIds.push(assetNodeId);
                } else {
                    edges.push({
                        source: brickNodeId,
                        target: assetNodeId,
                        label: incomingRole
                    });
                }
            });
        });

        return {nodes, edges, ownershipGroups: Object.values(ownershipGroups)};
    }

    function renderDataDiagram() {
        const graphShell = document.getElementById('DataDiagramGraph');
        const summaryShell = document.getElementById('DataDiagramSummary');
        if (!graphShell || !summaryShell) {
            return;
        }

        const selectedAssetIds = selectedDataDiagramValues('.data-asset-checkbox');
        const selectedRoles = selectedDataDiagramValues('.data-role-checkbox');
        const graph = buildDataDiagramGraph(selectedAssetIds, selectedRoles);

        summaryShell.innerHTML = `
            <div class="dependency-graph-stat">
                <div class="dependency-graph-stat-value">${selectedAssetIds.size}</div>
                <div class="dependency-graph-stat-label">Assets Shown</div>
            </div>
            <div class="dependency-graph-stat">
                <div class="dependency-graph-stat-value">${graph.nodes.length}</div>
                <div class="dependency-graph-stat-label">Nodes</div>
            </div>
            <div class="dependency-graph-stat">
                <div class="dependency-graph-stat-value">${graph.edges.length}</div>
                <div class="dependency-graph-stat-label">Links</div>
            </div>
        `;

        if (!graph.edges.length) {
            graphShell.innerHTML = '<div class="activity-muted">Select data assets and roles to render the data dependency diagram.</div>';
            return;
        }

        let chart = 'flowchart LR\n\n';
        const groupedNodeIds = new Set();
        (graph.ownershipGroups || []).forEach(group => {
            if (!group.assetNodeIds.length) {
                return;
            }
            chart += 'subgraph ' + group.id + '_group["' + escapeMermaidLabel(group.label) + '"]\n';
            chart += group.id + '["' + escapeMermaidLabel(group.label) + '"]\n';
            groupedNodeIds.add(group.id);
            group.assetNodeIds.forEach(assetNodeId => {
                const assetNode = graph.nodes.find(node => node.id === assetNodeId);
                if (!assetNode) {
                    return;
                }
                chart += assetNode.id + '["' + escapeMermaidLabel(assetNode.label) + '"]\n';
                groupedNodeIds.add(assetNode.id);
            });
            chart += 'end\n';
        });
        graph.nodes.forEach(node => {
            if (groupedNodeIds.has(node.id)) {
                return;
            }
            chart += node.id + '["' + escapeMermaidLabel(node.label) + '"]\n';
        });
        graph.edges.forEach(edge => {
            chart += edge.source + ' -->|' + escapeMermaidLabel(edge.label) + '| ' + edge.target + '\n';
        });
        chart += '\nclassDef currentBrick fill:#dbeafe,stroke:#2563eb,color:#1e3a8a,stroke-width:2px;\n';
        chart += 'classDef relatedBrick fill:#ecfccb,stroke:#6b7280,color:#111827;\n';
        chart += 'classDef dataAsset fill:#fee2e2,stroke:#dc2626,color:#7f1d1d,stroke-width:2px;\n';
        const currentIds = graph.nodes.filter(node => node.nodeClass === 'currentBrick').map(node => node.id);
        const relatedIds = graph.nodes.filter(node => node.nodeClass === 'relatedBrick').map(node => node.id);
        const assetIds = graph.nodes.filter(node => node.nodeClass === 'dataAsset').map(node => node.id);
        if (currentIds.length) {
            chart += 'class ' + currentIds.join(',') + ' currentBrick;\n';
        }
        if (relatedIds.length) {
            chart += 'class ' + relatedIds.join(',') + ' relatedBrick;\n';
        }
        if (assetIds.length) {
            chart += 'class ' + assetIds.join(',') + ' dataAsset;\n';
        }

        graphShell.innerHTML = '<div class="mermaid">' + chart + '</div>';
        mermaid.run({querySelector: '#DataDiagramGraph .mermaid'}).catch(error => {
            console.error('Failed to render data dependency diagram', error);
        });
    }

    function renderBrickDependencyTable(items) {
        let tableHtml = '<table class="activity-table">';
        tableHtml += '<thead><tr><th>Brick</th><th>Type</th><th>Interface</th><th>Description</th></tr></thead><tbody>';

    function dependencyText(value, fallback) {
        const text = String(value || '').trim();
        return text || fallback || '';
    }

    function dependencyEdgeLabel(item, defaultType, defaultInterface) {
        const type = dependencyText(item && item.type, defaultType).toLowerCase();
        const iface = dependencyText(item && item.interface, defaultInterface).toUpperCase();
        return escapeMermaidLabel([type, iface].filter(Boolean).join('\\n'));
    }

    function externalSystemName(item) {
        return dependencyText(item && (item.system || item.name), 'External System');
    }

    function renderExternalDependencyTable(items, subjectLabel) {
        let tableHtml = '<table class="activity-table">';
        tableHtml += '<thead><tr><th>' + escapeHomeHtml(subjectLabel || 'External System') + '</th><th>Type</th><th>Interface</th><th>Description</th></tr></thead><tbody>';

    function findIncomingBrickDependencies() {
        const incomingDependencies = [];
        all_bricks.forEach(candidate => {
            (candidate.brickDependencies || []).forEach(item => {
                if (item.targetBrickId === brick.id) {
                    incomingDependencies.push({
                        sourceBrickId: candidate.id,
                        sourceBrickName: candidate.name,
                        type: item.type || '',
                        interface: item.interface || '',
                        description: item.description || ''
                    });
                }
            });
        });
        return incomingDependencies;
    }

    function renderIncomingBrickDependencyTable(items) {
        let tableHtml = '<table class="activity-table">';
        tableHtml += '<thead><tr><th>Dependent Brick</th><th>Type</th><th>Interface</th><th>Description</th></tr></thead><tbody>';
        items.forEach(item => {
            tableHtml += '<tr>';
            tableHtml += '<td><div class="dependency-entity">';
            tableHtml += '<img class="dependency-entity-icon" src="../icons/' + escapeHomeHtml(item.sourceBrickId || '') + '.png" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
            tableHtml += '<a target="_blank" rel="noopener noreferrer" href="' + escapeHomeHtml(item.sourceBrickId || '') + '.html" class="activity-link">' + escapeHomeHtml(item.sourceBrickName || item.sourceBrickId || '') + '</a>';
            tableHtml += '</div></td>';
            tableHtml += '<td>' + escapeHomeHtml(item.type || '') + '</td>';
            tableHtml += '<td>' + escapeHomeHtml(item.interface || '') + '</td>';
            tableHtml += '<td>' + escapeHomeHtml(item.description || '') + '</td>';
            tableHtml += '</tr>';

        return tableHtml;

    function renderDependencySection() {
        const brickDependencies = brick.brickDependencies || [];
        const incomingBrickDependencies = findIncomingBrickDependencies();
        const externalSystemsThisBrickDependsOn = brick.externalSystemsThisBrickDependsOn || brick.externalSystemDependencies || [];
        const externalSystemsDependingOnThisBrick = brick.externalSystemsDependingOnThisBrick || [];
        let sectionHtml = '<div class="home-section">';
        sectionHtml += '<div class="home-section-title">Dependencies</div>';

        if (!brickDependencies.length && !incomingBrickDependencies.length && !externalSystemsThisBrickDependsOn.length && !externalSystemsDependingOnThisBrick.length) {
            sectionHtml += '<div class="activity-muted">No dependency information is available for this product brick.</div>';
            sectionHtml += '</div>';
            return sectionHtml;
        }

        let chart = 'flowchart LR\n\n';
        chart += 'current[\"' + escapeMermaidLabel(brick.name || brick.id || 'Current Brick') + '\"]\n';

        brickDependencies.forEach((item, index) => {
            const linkedBrick = all_bricks.find(candidate => candidate.id === item.targetBrickId) || {};
            const nodeId = 'brickDep' + index;
            const nodeLabel = escapeMermaidLabel(linkedBrick.name || item.targetBrickId || 'Brick Dependency');
            const edgeLabel = dependencyEdgeLabel(item, 'dependency', '');
            chart += nodeId + '[\"' + nodeLabel + '\"]\n';
            chart += 'current -->|' + edgeLabel + '| ' + nodeId + '\n';
        });

        incomingBrickDependencies.forEach((item, index) => {
            const nodeId = 'incomingBrickDep' + index;
            const nodeLabel = escapeMermaidLabel(item.sourceBrickName || item.sourceBrickId || 'Dependent Brick');
            const edgeLabel = dependencyEdgeLabel(item, 'dependency', '');
            chart += nodeId + '[\"' + nodeLabel + '\"]\n';
            chart += nodeId + ' -->|' + edgeLabel + '| current\n';
        });

        externalSystemsThisBrickDependsOn.forEach((item, index) => {
            const nodeId = 'externalOutgoingDep' + index;
            const nodeLabel = escapeMermaidLabel(externalSystemName(item));
            const edgeLabel = dependencyEdgeLabel(item, 'external', '');
            chart += nodeId + '[\"' + nodeLabel + '\"]\n';
            chart += 'current -->|' + edgeLabel + '| ' + nodeId + '\n';
        });

        externalSystemsDependingOnThisBrick.forEach((item, index) => {
            const nodeId = 'externalIncomingDep' + index;
            const nodeLabel = escapeMermaidLabel(externalSystemName(item));
            const edgeLabel = dependencyEdgeLabel(item, 'external', '');
            chart += nodeId + '[\"' + nodeLabel + '\"]\n';
            chart += nodeId + ' -->|' + edgeLabel + '| current\n';
        });

        chart += '\nclassDef currentBrick fill:#dbeafe,stroke:#2563eb,color:#1e3a8a,stroke-width:2px;\n';
        chart += 'classDef internalBrick fill:#ecfccb,stroke:#6b7280,color:#111827;\n';
        chart += 'classDef externalSystem fill:#f3f4f6,stroke:#65a30d,color:#365314;\n';
        chart += 'class current currentBrick;\n';
        if (brickDependencies.length) {
            chart += 'class ' + brickDependencies.map((_, index) => 'brickDep' + index).join(',') + ' internalBrick;\n';
        }
        if (incomingBrickDependencies.length) {
            chart += 'class ' + incomingBrickDependencies.map((_, index) => 'incomingBrickDep' + index).join(',') + ' internalBrick;\n';
        }
        if (externalSystemsThisBrickDependsOn.length) {
            chart += 'class ' + externalSystemsThisBrickDependsOn.map((_, index) => 'externalOutgoingDep' + index).join(',') + ' externalSystem;\n';
        }
        if (externalSystemsDependingOnThisBrick.length) {
            chart += 'class ' + externalSystemsDependingOnThisBrick.map((_, index) => 'externalIncomingDep' + index).join(',') + ' externalSystem;\n';
        }

        sectionHtml += '<div class="dependency-subsection">';
        sectionHtml += '<div class="dependency-subsection-title">Brick Dependencies</div>';
        if (brickDependencies.length) {
            sectionHtml += renderBrickDependencyTable(brickDependencies);
        } else {
            sectionHtml += '<div class="activity-muted">No dependencies on other product bricks are listed.</div>';
        }
        sectionHtml += '</div>';

        sectionHtml += '<div class="dependency-subsection">';
        sectionHtml += '<div class="dependency-subsection-title">Dependent Bricks</div>';
        if (incomingBrickDependencies.length) {
            sectionHtml += renderIncomingBrickDependencyTable(incomingBrickDependencies);
        } else {
            sectionHtml += '<div class="activity-muted">No other product bricks currently depend on this brick.</div>';
        }
        sectionHtml += '</div>';

        sectionHtml += '<div class="dependency-subsection">';
        sectionHtml += '<div class="dependency-subsection-title">External Systems This Brick Depends On</div>';
        if (externalSystemsThisBrickDependsOn.length) {
            sectionHtml += renderExternalDependencyTable(externalSystemsThisBrickDependsOn, 'External System');
        } else {
            sectionHtml += '<div class="activity-muted">No outbound dependencies on external systems are listed.</div>';
        }
        sectionHtml += '</div>';

        sectionHtml += '<div class="dependency-subsection">';
        sectionHtml += '<div class="dependency-subsection-title">External Systems Depending On This Brick</div>';
        if (externalSystemsDependingOnThisBrick.length) {
            sectionHtml += renderExternalDependencyTable(externalSystemsDependingOnThisBrick, 'External System');
        } else {
            sectionHtml += '<div class="activity-muted">No inbound dependencies from external systems are listed.</div>';
        }
        sectionHtml += '</div>';

        sectionHtml += '<div class="dependency-subsection">';
        sectionHtml += '<div class="dependency-subsection-title">Dependency Diagram</div>';
        sectionHtml += '<div class="dependency-diagram"><div class="mermaid">' + chart + '</div></div>';
        sectionHtml += '</div>';

        sectionHtml += '</div>';
        return sectionHtml;
    }

    html += renderBrickStructureSection('Interfaces', brick.interfaces || [], 'No interfaces listed for this product brick.');
    html += renderBrickStructureSection('Internal Modules', brick.internalModules || [], 'No internal modules listed for this product brick.');
    document.getElementById('Modules').innerHTML = html;
    html = '';

    html += renderDataTab();
    document.getElementById('Data').innerHTML = html;
    html = '';

    html += renderReferenceLinks();
    document.getElementById('Links').innerHTML = html;
    html = '';

    html += renderDependencySection();
    document.getElementById('Dependencies').innerHTML = html;
    html = '';

    html += renderRelatedTeams();
    html += renderSupportedCapabilities();
    html += renderLinkedProducts();
    html += renderSupportedJobs();
    document.getElementById('Overview').innerHTML = html;
    html = '';
</script>

<script>
    function buildEvidenceTabId(label) {
        const normalized = (label || 'Evidence')
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '');
        return (normalized || 'evidence');
    }

    function setupEvidenceTabs() {
        const tabs = (evidence && evidence.tabs) ? evidence.tabs : [];
        const tabBar = document.getElementById(tabsNavigationId);
        const tabContents = document.getElementById(tabsContentId);
        if (!tabBar || !tabContents) {
            return;
        }

        tabs.forEach((tab) => {
            const tabId = buildEvidenceTabId(tab.label);
            tab.id = tabId;
            const fragmentCount = (tab.groups || []).reduce((sum, group) => sum + ((group.fragments || []).length), 0);

            const button = document.createElement('button');
            button.className = 'tablinks';
            button.id = 'tab_' + tabId;
            button.textContent = (tab.label || 'Evidence') + ' (' + fragmentCount + ')';
            button.onclick = function() { openTab(tabId); };
            tabBar.appendChild(button);

            const content = document.createElement('div');
            content.id = 'tab_content_' + tabId;
            content.className = 'tabcontent';
            content.style.padding = '10px';
            content.innerHTML = '<div id="tab_content_' + tabId + '"></div>';
            tabContents.appendChild(content);
        });
    }

    setupEvidenceTabs();
</script>

<script>
    function escapeEvidenceHtml(value) {
        return (value || '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function renderEvidenceLinks(links) {
        if (!links || !links.length) return '';

        let html = '<div style="font-size: 80%; border-top: 1px solid grey; margin-top: 10px">';
        html += '<div style="padding-left: 0; padding-top: 6px; padding-bottom: 0; margin: 0">';
        (links || []).forEach(link => {
            const label = escapeEvidenceHtml(link.label || 'Open link');
            const url = link.url || '';
            html += '<div style="display: inline-block; border: 1px solid lightgrey; border-radius: 999px; padding: 4px 6px; margin: 3px">';
            html += '<a class="evidence-link" target="_blank" rel="noopener noreferrer" href="' + escapeEvidenceHtml(url) + '">' + label + '</a>';
            html += '<img src="../icons/new-window.png" style="height: 10px; vertical-align: top; margin: 2px;">';
            html += '</div>';
        });
        html += '</div>';
        html += '</div>';
        return html;
    }

    function renderEvidenceIcon(fragment) {
        const icon = escapeEvidenceHtml(fragment.icon || 'evidence.png');
        return '<img class="evidence-card-icon" src="../icons/' + icon + '" onerror="this.onerror=null;this.src=\'../icons/evidence.png\'">';
    }

    function aggregateSummableFacts(fragments) {
        const totals = {};
        (fragments || []).forEach(fragment => {
            (fragment.facts || []).forEach(fact => {
                if (!fact || fact.summable !== true) {
                    return;
                }
                const numericValue = Number(fact.value);
                if (!Number.isFinite(numericValue)) {
                    return;
                }
                const label = fact.label || 'Value';
                totals[label] = (totals[label] || 0) + numericValue;
            });
        });
        return Object.entries(totals).map(([label, value]) => ({label, value}));
    }

    function renderSummableFactsSummary(fragments) {
        const totals = aggregateSummableFacts(fragments);
        if (!totals.length) {
            return '';
        }

        let html = '<div class="evidence-summary">';
        totals.forEach(item => {
            html += '<div class="evidence-summary-chip">';
            html += '<span class="evidence-summary-value">' + escapeEvidenceHtml(item.value + '') + '</span>';
            html += '<span>' + escapeEvidenceHtml(item.label) + '</span>';
            html += '</div>';
        });
        html += '</div>';
        return html;
    }

    function renderEvidenceContent(groups, containerId) {
        let html = '';

        if (!groups.length) {
            html += '<div class="group" style="margin-top:0">No evidence linked for this object.</div>';
            document.getElementById(containerId).innerHTML = html;
            return;
        }

        const tabFragments = [];
        groups.forEach(group => {
            (group.fragments || []).forEach(fragment => tabFragments.push(fragment));
        });
        html += renderSummableFactsSummary(tabFragments);

        groups.forEach(group => {
            const groupFragmentCount = (group.fragments || []).length;
            html += '<div class="evidence-group">';
            html += '<div class="evidence-group-title">' + escapeEvidenceHtml(group.name) + ' (' + groupFragmentCount + ')</div>';
            if (group.description) {
                html += '<div class="evidence-group-description">' + escapeEvidenceHtml(group.description) + '</div>';
            }
            html += renderSummableFactsSummary(group.fragments || []);

            (group.fragments || []).forEach(fragment => {
                html += '<div class="evidence-card">';
                html += '<div class="evidence-card-header">';
                html += '<div class="evidence-card-header-top">';
                html += renderEvidenceIcon(fragment);
                html += '<div>';
                html += '<div class="evidence-card-meta">' + escapeEvidenceHtml(fragment.evidenceGroupTitle || fragment.type || 'Evidence fragment') + '</div>';
                html += '<div class="evidence-card-title">' + escapeEvidenceHtml(fragment.title || fragment.id) + '</div>';
                html += '</div>';
                html += '</div>';
                if (fragment.note) {
                    html += '<div class="evidence-card-note">' + escapeEvidenceHtml(fragment.note) + '</div>';
                }
                html += '</div>';
                if (fragment.description) {
                    html += '<div class="evidence-card-summary">' + escapeEvidenceHtml(fragment.description) + '</div>';
                }
                if (fragment.facts && fragment.facts.length) {
                    html += '<div class="evidence-card-summary" style="color: black;">';
                    fragment.facts.forEach(fact => {
                        html += '<div><span style="border: 1px solid lightgrey; background-color: lightyellow">&nbsp;' + escapeEvidenceHtml(fact.value + '') + '&nbsp;</span> ' + escapeEvidenceHtml(fact.label) + '</div>';
                    });
                    html += '</div>';
                }
                if (fragment.tags && fragment.tags.length) {
                    fragment.tags.forEach(tag => {
                        html += '<div class="tag" style="margin-bottom:10px;">' + escapeEvidenceHtml(tag) + '</div>';
                    });
                }
                html += '<div class="evidence-links">' + renderEvidenceLinks(fragment.links) + '</div>';
                html += '</div>';
            });

            html += '</div>';
        });

        document.getElementById(containerId).innerHTML = html;
    }

    function renderEvidence() {
        const tabs = (evidence && evidence.tabs) ? evidence.tabs : [];
        tabs.forEach((tab, index) => {
            const tabId = tab.id || buildEvidenceTabId(tab.label, index);
            renderEvidenceContent(tab.groups || [], 'tab_content_' + tabId);
        });
    }

    renderEvidence();
</script>

<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Cloud Data and AI Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Bricks Index"
    },
    {
      "label": "Data Transformation and Orchestration"
    }
  ]
};
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
