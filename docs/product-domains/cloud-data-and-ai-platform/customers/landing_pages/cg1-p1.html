<script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

    const customerInsights = [{"id": "insight-ai-infrastructure-demand", "title": "AI infrastructure demand is reshaping cloud competition", "summary": "Hyperscalers and specialist data platforms all frame growth around AI infrastructure, model services, data platforms, or enterprise AI adoption. Customers now evaluate cloud data platforms for accelerator capacity, model roadmap, data gravity, and production controls, not just generic compute or storage breadth.", "implication": "Treat AI capacity, model access, and production governance as one adoption journey with visible ownership across compute, model runtime, catalog, safety, and FinOps teams.", "priority": "high", "tags": ["ai-infrastructure", "capacity", "competitive-dynamics", "production-ai"], "sources": [{"id": "amazon_q4_2025", "title": "Amazon.com Announces Fourth Quarter Results", "url": "https://ir.aboutamazon.com/news-release/news-release-details/2026/Amazon-com-Announces-Fourth-Quarter-Results/default.aspx", "publisher": "Amazon Investor Relations", "sourceType": "official_investor_relations"}, {"id": "microsoft_fy2025_q4", "title": "Microsoft Cloud and AI strength fuels fourth quarter results", "url": "https://news.microsoft.com/source/2025/07/30/microsoft-cloud-and-ai-strength-fuels-fourth-quarter-results/", "publisher": "Microsoft News", "date": "2025-07-30", "sourceType": "official_newsroom"}, {"id": "alphabet_q4_2025", "title": "Alphabet Announces Fourth Quarter and Fiscal Year 2025 Results", "url": "https://www.sec.gov/Archives/edgar/data/1652044/000165204426000012/googexhibit991q42025.htm", "publisher": "Alphabet / SEC", "sourceType": "sec_filing_exhibit"}, {"id": "oracle_q2_fy2026", "title": "Oracle Announces Fiscal Year 2026 Second Quarter Financial Results", "url": "https://investor.oracle.com/investor-news/news-details/2025/Oracle-Announces-Fiscal-Year-2026-Second-Quarter-Financial-Results/default.aspx", "publisher": "Oracle Investor Relations", "sourceType": "official_investor_relations"}, {"id": "alibaba_fy2025", "title": "Alibaba Group Announces March Quarter 2025 and Fiscal Year 2025 Results", "url": "https://www.businesswire.com/news/home/20250514856295/en/Alibaba-Group-Announces-March-Quarter-2025-and-Fiscal-Year-2025-Results", "publisher": "Alibaba Group / Business Wire", "date": "2025-05-14", "sourceType": "company_supplied_press_release"}], "link": {"customerId": "cg1-p1", "jobIds": ["jtbd-cg1-2"], "kpiIds": ["bo-cg1-top", "bo-cg1-b2-c1"]}}, {"id": "insight-governed-data-gravity", "title": "Governed data gravity is the retention mechanism", "summary": "Enterprise retention is created when catalog, policy, lineage, quality, warehouse, lakehouse, and AI evaluation workflows become embedded in production operations. Data gravity matters most when it is usable, trusted, and connected to release and cost controls.", "implication": "Invest in catalog, policy, quality, and transformation surfaces as adoption infrastructure, not only compliance overhead.", "priority": "high", "tags": ["data-governance", "retention", "data-gravity", "trust"], "sources": [{"id": "snowflake_q4_fy2026", "title": "Snowflake Reports Financial Results for the Fourth Quarter and Full-Year of Fiscal 2026", "url": "https://www.snowflake.com/en/news/press-releases/snowflake-reports-financial-results-for-the-fourth-quarter-and-full-year-of-fiscal-2026/", "publisher": "Snowflake", "sourceType": "official_newsroom"}, {"id": "databricks_series_j", "title": "Databricks is Raising $10B Series J Investment at $62B Valuation", "url": "https://www.prnewswire.com/news-releases/databricks-is-raising-10b-series-j-investment-at-62b-valuation-302333822.html", "publisher": "Databricks / PR Newswire", "date": "2024-12-17", "sourceType": "company_supplied_press_release"}], "link": {"customerId": "cg1-p1", "jobIds": ["jtbd-cg1-1"], "kpiIds": ["co-cg1-top", "bo-cg1-b2-c1"]}}, {"id": "insight-ai-prod-bottleneck-is-control", "title": "The production AI bottleneck is control, not experimentation", "summary": "AI builders can reach prototypes quickly, but production adoption stalls when model access, data permissions, evaluation evidence, safety checks, and rollback paths are handled as separate approval queues.", "implication": "Model registry, prompt evaluation, safety controls, and serving telemetry should operate as one release system with automated evidence capture.", "priority": "high", "tags": ["production-ai", "model-governance", "release-confidence", "evaluation"], "sources": [{"id": "databricks_series_j", "title": "Databricks is Raising $10B Series J Investment at $62B Valuation", "url": "https://www.prnewswire.com/news-releases/databricks-is-raising-10b-series-j-investment-at-62b-valuation-302333822.html", "publisher": "Databricks / PR Newswire", "date": "2024-12-17", "sourceType": "company_supplied_press_release"}], "link": {"customerId": "cg1-p1", "jobIds": ["jtbd-cg1-2"], "kpiIds": ["bo-cg1-top"]}}, {"id": "insight-finops-must-include-ai-units", "title": "FinOps has to move from cloud bills to AI unit economics", "summary": "Training jobs, inference endpoints, accelerator pools, warehouse queries, and storage all create different cost shapes. A single cloud bill view is too late and too coarse for teams trying to scale AI features responsibly.", "implication": "Expose unit cost by workload, model, feature, query path, and customer-facing AI journey before spend reaches finance review.", "priority": "high", "tags": ["finops", "unit-economics", "ai-cost", "workload-operations"], "sources": [{"id": "amazon_q4_2025", "title": "Amazon.com Announces Fourth Quarter Results", "url": "https://ir.aboutamazon.com/news-release/news-release-details/2026/Amazon-com-Announces-Fourth-Quarter-Results/default.aspx", "publisher": "Amazon Investor Relations", "sourceType": "official_investor_relations"}, {"id": "alphabet_q4_2025", "title": "Alphabet Announces Fourth Quarter and Fiscal Year 2025 Results", "url": "https://www.sec.gov/Archives/edgar/data/1652044/000165204426000012/googexhibit991q42025.htm", "publisher": "Alphabet / SEC", "sourceType": "sec_filing_exhibit"}, {"id": "oracle_q2_fy2026", "title": "Oracle Announces Fiscal Year 2026 Second Quarter Financial Results", "url": "https://investor.oracle.com/investor-news/news-details/2025/Oracle-Announces-Fiscal-Year-2026-Second-Quarter-Financial-Results/default.aspx", "publisher": "Oracle Investor Relations", "sourceType": "official_investor_relations"}], "link": {"customerId": "cg1-p1", "jobIds": ["jtbd-cg1-2"], "kpiIds": ["bo-cg1-top"]}}, {"id": "insight-specialists-compete-on-data-workflow-depth", "title": "Specialist platforms compete through data workflow depth", "summary": "Snowflake and Databricks compete less on broad infrastructure coverage and more on integrated data, governance, warehouse, lakehouse, ML, and AI application workflows. Their signal is that enterprises will pay for fewer handoffs between data engineering, analytics, and AI delivery.", "implication": "Hyperscaler-style breadth needs packaged data-and-AI journeys that feel as coherent as specialist platforms, especially for governed data products and production AI launches.", "priority": "high", "tags": ["specialist-platforms", "workflow-depth", "data-cloud", "lakehouse"], "sources": [{"id": "snowflake_q4_fy2026", "title": "Snowflake Reports Financial Results for the Fourth Quarter and Full-Year of Fiscal 2026", "url": "https://www.snowflake.com/en/news/press-releases/snowflake-reports-financial-results-for-the-fourth-quarter-and-full-year-of-fiscal-2026/", "publisher": "Snowflake", "sourceType": "official_newsroom"}, {"id": "databricks_series_j", "title": "Databricks is Raising $10B Series J Investment at $62B Valuation", "url": "https://www.prnewswire.com/news-releases/databricks-is-raising-10b-series-j-investment-at-62b-valuation-302333822.html", "publisher": "Databricks / PR Newswire", "date": "2024-12-17", "sourceType": "company_supplied_press_release"}], "link": {"customerId": "cg1-p1", "jobIds": ["jtbd-cg1-1"], "kpiIds": ["co-cg1-top"]}}, {"id": "insight-procurement-is-a-product-surface", "title": "Procurement and partner paths are part of product adoption", "summary": "Marketplace, private offers, partner integrations, support, and migration factories materially shape enterprise buying because customers need commercial approval, implementation help, and risk transfer before they standardize on a platform.", "implication": "Design marketplace, partner, migration, and support flows as first-class onboarding journeys connected to product telemetry and success playbooks.", "priority": "medium", "tags": ["marketplace", "partners", "enterprise-adoption", "migration"], "sources": [{"id": "microsoft_fy2025_q4", "title": "Microsoft Cloud and AI strength fuels fourth quarter results", "url": "https://news.microsoft.com/source/2025/07/30/microsoft-cloud-and-ai-strength-fuels-fourth-quarter-results/", "publisher": "Microsoft News", "date": "2025-07-30", "sourceType": "official_newsroom"}, {"id": "oracle_q2_fy2026", "title": "Oracle Announces Fiscal Year 2026 Second Quarter Financial Results", "url": "https://investor.oracle.com/investor-news/news-details/2025/Oracle-Announces-Fiscal-Year-2026-Second-Quarter-Financial-Results/default.aspx", "publisher": "Oracle Investor Relations", "sourceType": "official_investor_relations"}], "link": {"customerId": "cg1-p1", "jobIds": ["jtbd-cg1-1"], "kpiIds": ["bo-cg1-b1-c2", "bo-cg1-b1-c1"]}}, {"id": "insight-observability-is-expansion-control", "title": "Observability determines whether launched workloads expand", "summary": "After first launch, customers decide whether to expand based on latency, failure visibility, incident recovery, cost variance, and data-quality signals. These signals must be visible to builders, operators, and executives at the same time.", "implication": "Connect observability, data quality, incident operations, and FinOps signals into shared workload-health views instead of separate operational dashboards.", "priority": "high", "tags": ["observability", "incident-operations", "expansion", "workload-health"], "sources": [{"id": "amazon_q4_2025", "title": "Amazon.com Announces Fourth Quarter Results", "url": "https://ir.aboutamazon.com/news-release/news-release-details/2026/Amazon-com-Announces-Fourth-Quarter-Results/default.aspx", "publisher": "Amazon Investor Relations", "sourceType": "official_investor_relations"}, {"id": "microsoft_fy2025_q4", "title": "Microsoft Cloud and AI strength fuels fourth quarter results", "url": "https://news.microsoft.com/source/2025/07/30/microsoft-cloud-and-ai-strength-fuels-fourth-quarter-results/", "publisher": "Microsoft News", "date": "2025-07-30", "sourceType": "official_newsroom"}, {"id": "alphabet_q4_2025", "title": "Alphabet Announces Fourth Quarter and Fiscal Year 2025 Results", "url": "https://www.sec.gov/Archives/edgar/data/1652044/000165204426000012/googexhibit991q42025.htm", "publisher": "Alphabet / SEC", "sourceType": "sec_filing_exhibit"}], "link": {"customerId": "cg1-p1", "jobIds": ["jtbd-cg1-1", "jtbd-cg1-2"], "kpiIds": ["bo-cg1-b2-c2", "co-cg1-top"]}}, {"id": "insight-federation-reduces-lock-in-anxiety", "title": "Federation reduces lock-in anxiety without removing data gravity", "summary": "Enterprise buyers want the productivity of a primary platform but resist uncontrolled copying and hard lock-in. Federated query, sharing, partner integrations, and governed catalog controls help customers adopt a platform while preserving cross-cloud and ecosystem options.", "implication": "Position federation and data sharing as trust-building adoption capabilities, not only technical integration features.", "priority": "medium", "tags": ["federation", "data-sharing", "multicloud", "trust"], "sources": [{"id": "snowflake_q4_fy2026", "title": "Snowflake Reports Financial Results for the Fourth Quarter and Full-Year of Fiscal 2026", "url": "https://www.snowflake.com/en/news/press-releases/snowflake-reports-financial-results-for-the-fourth-quarter-and-full-year-of-fiscal-2026/", "publisher": "Snowflake", "sourceType": "official_newsroom"}, {"id": "databricks_series_j", "title": "Databricks is Raising $10B Series J Investment at $62B Valuation", "url": "https://www.prnewswire.com/news-releases/databricks-is-raising-10b-series-j-investment-at-62b-valuation-302333822.html", "publisher": "Databricks / PR Newswire", "date": "2024-12-17", "sourceType": "company_supplied_press_release"}], "link": {"customerId": "cg1-p1", "jobIds": ["jtbd-cg1-1"], "kpiIds": ["co-cg1-top"]}}, {"id": "insight-regulated-ai-needs-default-controls", "title": "Regulated AI needs default controls, not optional add-ons", "summary": "Security, identity, key management, policy enforcement, posture management, audit logs, and responsible-AI controls must be active before broad AI usage. When controls are optional or late-stage, adoption slows and risk review becomes a bottleneck.", "implication": "Make identity, secrets, policy, audit, posture, and safety controls part of workspace provisioning and model release by default.", "priority": "high", "tags": ["regulated-ai", "security", "auditability", "default-controls"], "sources": [{"id": "ibm_q4_2025", "title": "IBM RELEASES FOURTH-QUARTER RESULTS", "url": "https://newsroom.ibm.com/2026-01-28-IBM-RELEASES-FOURTH-QUARTER-RESULTS?hl=en-US", "publisher": "IBM Newsroom", "date": "2026-01-28", "sourceType": "official_newsroom"}], "link": {"customerId": "cg1-p1", "jobIds": ["jtbd-cg1-2"], "kpiIds": ["bo-cg1-b2-c1"]}}, {"id": "insight-migration-factory-is-adoption-engine", "title": "Migration factories turn modernization from projects into repeatable product motions", "summary": "Data estate modernization is rarely a single migration. Customers need assessment, dependency mapping, workload sequencing, validation, rollback, and success follow-through across warehouses, lakes, pipelines, and AI services.", "implication": "Connect migration assessment, transformation, catalog, support, and success playbooks so modernization creates reusable patterns rather than one-off projects.", "priority": "medium", "tags": ["migration", "modernization", "repeatability", "customer-success"], "sources": [{"id": "microsoft_fy2025_q4", "title": "Microsoft Cloud and AI strength fuels fourth quarter results", "url": "https://news.microsoft.com/source/2025/07/30/microsoft-cloud-and-ai-strength-fuels-fourth-quarter-results/", "publisher": "Microsoft News", "date": "2025-07-30", "sourceType": "official_newsroom"}, {"id": "oracle_q2_fy2026", "title": "Oracle Announces Fiscal Year 2026 Second Quarter Financial Results", "url": "https://investor.oracle.com/investor-news/news-details/2025/Oracle-Announces-Fiscal-Year-2026-Second-Quarter-Financial-Results/default.aspx", "publisher": "Oracle Investor Relations", "sourceType": "official_investor_relations"}, {"id": "ibm_q4_2025", "title": "IBM RELEASES FOURTH-QUARTER RESULTS", "url": "https://newsroom.ibm.com/2026-01-28-IBM-RELEASES-FOURTH-QUARTER-RESULTS?hl=en-US", "publisher": "IBM Newsroom", "date": "2026-01-28", "sourceType": "official_newsroom"}], "link": {"customerId": "cg1-p1", "jobIds": ["jtbd-cg1-1"], "kpiIds": ["bo-cg1-b1-c1", "co-cg1-top"]}}, {"id": "insight-regional-clouds-shape-residency-and-ecosystem-strategy", "title": "Regional clouds shape residency and ecosystem strategy", "summary": "Global leaders dominate broad cloud narratives, but regional providers and hybrid-cloud players influence buying where data residency, ecosystem relationships, procurement channels, and sovereignty concerns are material.", "implication": "Keep residency, regional partner integrations, private networking, and audit evidence visible in the product model rather than treating them as late deployment details.", "priority": "medium", "tags": ["regional-cloud", "sovereignty", "ecosystem", "residency"], "sources": [{"id": "alibaba_fy2025", "title": "Alibaba Group Announces March Quarter 2025 and Fiscal Year 2025 Results", "url": "https     function jobNamesForCustomer(jobIds) {
        const jobs = (customer.jobsToBeDone || []);
        const jobLookup = {};
        jobs.forEach(job => {
            if (job.id) {
                jobLookup[job.id] = job.name || job.id;
            }
        });
        return (jobIds || []).map(jobId => jobLookup[jobId] || jobId);
    }

    function kpiNamesForLink(link) {
        // Prefer stable KPI IDs resolved against this customer's KPI pyramid; fall back to legacy display-name kpis.
        if (link && link.kpiIds && link.kpiIds.length) {
            const lookup = {};
            function walk(node) {
                if (!node) return;
                if (node.id) {
                    lookup[node.id] = node.name || node.id;
                }
                (node.branches || []).forEach(walk);
                (node.children || []).forEach(walk);
            }
            const pyramids = (customer || {}).kpiPyramids || {};
            ['customerOutcomes', 'businessOutcomes'].forEach(key => {
                const pyramid = pyramids[key];
                if (!pyramid) return;
                walk(pyramid.top);
                (pyramid.branches || []).forEach(walk);
            });
            return link.kpiIds.map(kpiId => lookup[kpiId] || kpiId);
        }
        return (link && link.kpis) || [];
    }

    function kpiIconFile(node) {
        return (node && node.icon) ? node.icon : 'kpi.png';
    }

    function kpiCurrentValue(node) {
        if (!node || !node.currentValue) {
            return '';
        }
        return String(node.currentValue) + (node.unit ? ' (' + String(node.unit) + ')' : '');
    }

    function kpiValueStatusLabel(node) {
        if (!node || !node.valueStatus) {
            return '';
        }
        const labels = {
            example: 'illustrative example',
            baseline: 'measured baseline',
            target: 'target',
            placeholder: 'placeholder'
        };
        return labels[node.valueStatus] || String(node.valueStatus);
    }

    function renderKpiMeta(node) {
        let html = '';
        if (node && node.currentValue) {
            const statusLabel = kpiValueStatusLabel(node);
            const valueLabel = (node.valueStatus === 'target') ? 'Target:' : 'Current:';
            html += '<div style="font-size: 80%; color: #1d4ed8; margin-top: 4px"><b>' + valueLabel + '</b> ' + escapeHtml(kpiCurrentValue(node));
            if (statusLabel) {
                html += ' <span style="color:#888; font-style: italic;">(' + escapeHtml(statusLabel) + ')</span>';
            }
            html += '</div>';
        }
        if (node && node.target) {
            html += '<div style="font-size: 80%; color: #047857; margin-top: 2px"><b>Target:</b> ' + escapeHtml(String(node.target)) + '</div>';

            if (node.period) { html += '<div><b>Period:</b> ' + escapeHtml(String(node.period)) + '</div>'; }
            if (node.calculationMethod) { html += '<div><b>How measured:</b> ' + escapeHtml(String(node.calculationMethod)) + '</div>'; }
            if (node.valueSource) { html += '<div><b>Value source:</b> ' + escapeHtml(String(node.valueSource)) + '</div>'; }

            html += '<div style="font-size: 76%; color: #7c3aed; margin-top: 3px"><b>Composite guardrail:</b> ' + escapeHtml(String(node.guardrail)) + '</div>';

    function normalizeRoadmapKpi(value, supportingKey) {
        if (!value) {
            return {northStar: '', [supportingKey]: []};

        if (typeof value === 'string') {
            return {northStar: value, [supportingKey]: []};
        }
        const normalized = Object.assign({}, value);
        normalized.northStar = normalized.northStar || normalized.name || '';
        normalized[supportingKey] = normalized[supportingKey] || [];
        return normalized;
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function formatDate(dateValue) {
        if (!dateValue) return 'No date';
        const date = new Date(dateValue + 'T00:00:00');
        if (isNaN(date.getTime())) return dateValue;
        return date.toLocaleDateString('en-GB', {year: 'numeric', month: 'short', day: 'numeric'});
    }

    function renderKpis(items) {
        let html = '';
        items.forEach(item => {
            html += '<div><b>' + escapeHtml(item.kpi) + '</b>';
            if (item.unit) {
                html += ' <span class="activity-muted">(' + escapeHtml(item.unit) + ')</span>';
            }
            if (item.expectedImpact) {
                html += ': ' + escapeHtml(item.expectedImpact);
            }
            if (item.currentValue) {
                html += '<div class="activity-muted"><b>Current:</b> ' + escapeHtml(String(item.currentValue)) + '</div>';
            }
            if (item.description) {
                html += '<div class="activity-muted">' + escapeHtml(item.description) + '</div>';
            }
            if (item.link) {
                html += '<div class="activity-muted"><a target="_blank" rel="noopener noreferrer" href="' + escapeHtml(item.link) + '">' + escapeHtml(item.linkLabel || 'Open link') + '</a></div>';
            }
            html += '</div>';
        });
        return html;
    }

    function renderImpactCell(item, currentCustomerId) {
        let html = '';
        (item.customerImpact || []).forEach(impact => {
            const isCurrent = impact.customerId === currentCustomerId;
            html += '<div class="activity-block' + (isCurrent ? ' activity-pill-highlight' : '') + '">';
            html += '<div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">';
            html += '<img class="activity-icon activity-icon-round" src="../icons/' + escapeHtml(impact.customer.icon) + '" onerror="this.onerror=null;this.src=\'../icons/customer.png\'">';
            html += '<div><div style="font-weight:bold; color:' + (isCurrent ? '#1d4ed8' : '#111827') + '">' + escapeHtml(impact.customer.name) + ' <span class="activity-muted">(' + escapeHtml(impact.customerId) + ')</span></div></div>';
            html += '</div>';
            html += renderKpis(impact.customerKPIs || []);
            html += renderKpis(impact.businessKPIs || []);
            html += '</div>';
        });
        return html || '<span class="activity-muted">No customer impact listed</span>';
    }

    function renderBrickCell(item) {
        let html = '';
        (item.productBricks || []).forEach(brick => {
            html += '<div class="activity-pill">';
            html += '<img class="activity-icon" src="../../product-bricks/icons/' + escapeHtml(brick.brick.icon) + '" onerror="this.onerror=null;this.src=\'../../product-bricks/icons/logo.png\'">';
            html += '<div><div><b>' + escapeHtml(brick.brick.name) + '</b> <span class="activity-muted">(#' + escapeHtml(brick.brickId) + ')</span></div><div class="activity-muted">' + escapeHtml(brick.change) + '</div></div>';
            html += '</div>';
        });
        return html || '<span class="activity-muted">No product bricks listed</span>';
    }

    function renderChannelCell(item) {
        let html = '';
        (item.deliveryChannels || []).forEach(channel => {
            html += '<div class="activity-pill">';
            html += '<img class="activity-icon" src="../../product-deployments/icons/' + escapeHtml(channel.channel.icon) + '" onerror="this.onerror=null;this.src=\'../../product-deployments/icons/product.png\'">';
            html += '<div><div><b>' + escapeHtml(channel.channel.name) + '</b> <span class="activity-muted">(' + escapeHtml(channel.channelId) + ')</span></div><div class="activity-muted">' + escapeHtml(channel.change) + '</div></div>';
            html += '</div>';
        });
        return html || '<span class="activity-muted">No delivery channels listed</span>';
    }

    function renderActivityTable(data, kind, currentCustomerId) {
        const items = (data && data.items) ? data.items : [];
        let html = '';
        html += '<div class="activity-summary">';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.length + '</div><div class="activity-stat-label">' + kind + '</div></div>';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.filter(item => (item.customerImpact || []).length > 0).length + '</div><div class="activity-stat-label">With customer impact</div></div>';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.filter(item => (item.productBricks || []).length > 0).length + '</div><div class="activity-stat-label">With bricks</div></div>';
        html += '</div>';

        if (!items.length) {
            html += '<div class="group" style="margin-top:0">No related ' + kind.toLowerCase() + ' found for this customer.</div>';
            return html;
        }

        html += '<table class="activity-table">';
        html += '<tr><th>Date</th><th>Description</th><th>Customer Impact</th><th>Product Bricks</th><th>Delivery Channels</th></tr>';
        items.forEach(item => {
            html += '<tr>';
            html += '<td style="white-space:nowrap">' + escapeHtml(formatDate(item.date)) + '</td>';
            html += '<td><a class="activity-link" target="_blank" rel="noopener noreferrer" href="../../' + kind.toLowerCase() + '/landing_pages/' + item.landingPageIndex + '.html">' + escapeHtml(item.description || item.name || kind) + '</a></td>';
            html += '<td>' + renderImpactCell(item, currentCustomerId) + '</td>';
            html += '<td>' + renderBrickCell(item) + '</td>';
            html += '<td>' + renderChannelCell(item) + '</td>';
            html += '</tr>';
        });
        html += '</table>';
        return html;
    }

    addHeader();
    addHome();
    addJBTD();
    addJourneys();
    addKPIs();
    addProductVision();
    addInsights();


</script>

    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Cloud Data and AI Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Customers"
    },
    {
      "label": "Enterprise Data and AI Leader"
    }
  ]
};
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
