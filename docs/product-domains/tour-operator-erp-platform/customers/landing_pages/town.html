cription": "Enter passport data, seat preferences, room sharing, dietary requirements and emergency contacts once, and see them reflected in the booking.", "streamsNeeded": [{"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "howItSupports": "Captures passenger data and wishes through the portal into the booking file."}, {"id": "operate-group-departures", "name": "Operate Group Departures", "howItSupports": "Uses the submitted seat and room wishes in seat allocation and room lists."}], "media": [{"type": "image", "src": "media/jbtd-trav-jtbd-trav-2-2.png", "title": "Traveler and Booker JTBD step 2: Complete passenger details and wishes", "alt": "Enterprise infographic for step 2 of the job \"Manage my booking and documents myself\": Complete passenger details and wishes."}]}, {"step": "Pay the balance and add extras", "description": "Pay the balance when reminded, add excursions, insurance or an eSIM, and see the updated invoice.", "streamsNeeded": [{"id": "collect-payments-and-invoice", "name": "Collect Payments and Invoice", "howItSupports": "Runs balance reminders, payment links and updated invoices for extras."}, {"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "howItSupports": "Records added extras and changes on the booking."}], "media": [{"type": "image", "src": "media/jbtd-trav-jtbd-trav-2-3.png", "title": "Traveler and Booker JTBD step 3: Pay the balance and add extras", "alt": "Enterprise infographic for step 3 of the job \"Manage my booking and documents myself\": Pay the balance and add extras."}]}, {"step": "Download documents and itinerary", "description": "Receive a notification when documents are ready, download vouchers, tickets and the day-by-day itinerary from the portal or app, and share them with fellow travelers.", "streamsNeeded": [{"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "howItSupports": "Publishes travel documents and the itinerary to the portal and app."}], "media": [{"type": "image", "src": "media/jbtd-trav-jtbd-trav-2-4.png", "title": "Traveler and Booker JTBD step 4: Download documents and itinerary", "alt": "Enterprise infographic for step 4 of the job \"Manage my booking and documents myself\": Download documents and itinerary."}]}], "media": [{"type": "image", "src": "media/jbtd-trav-jtbd-trav-2.png", "title": "Traveler and Booker JTBD infographic: Manage my booking and documents myself", "alt": "Enterprise infographic for the job \"Manage my booking and documents myself\" for customer \"Traveler and Booker\"."}]}, {"id": "jtbd-trav-3", "name": "Travel informed and share feedback", "whatItIs": "During the trip, have the itinerary, practical information, guide contact and changes at hand in the app, stay connected with an eSIM, raise problems while they can still be fixed, and afterwards share honest feedback through the survey and a public review.", "outcome": "The traveler feels looked after during the trip, problems are solved on the spot, and the feedback loop leads to a review and a next booking.", "steps": [{"step": "Get ready for departure", "description": "Receive pickup point, departure time, guide name and packing information through the app and messages, and activate the eSIM before leaving.", "streamsNeeded": [{"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "howItSupports": "Sends pre-departure information and offers eSIM and app activation."}, {"id": "operate-group-departures", "name": "Operate Group Departures", "howItSupports": "Supplies departure times, pickup points and guide assignment for the messages."}], "media": [{"type": "image", "src": "media/jbtd-trav-jtbd-trav-3-1.png", "title": "Traveler and Booker JTBD step 1: Get ready for departure", "alt": "Enterprise infographic for step 1 of the job \"Travel informed and share feedback\": Get ready for departure."}]}, {"step": "Follow the trip in the app", "description": "See the daily programme, hotel details and changes in the app, and message the guide or the office when something is unclear.", "streamsNeeded": [{"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "howItSupports": "Keeps the itinerary current in the app and provides messaging with the office and guide."}], "media": [{"type": "image", "src": "media/jbtd-trav-jtbd-trav-3-2.png", "title": "Traveler and Booker JTBD step 2: Follow the trip in the app", "alt": "Enterprise infographic for step 2 of the job \"Travel informed and share feedback\": Follow the trip in the app."}]}, {"step": "Raise a problem and get it solved", "description": "Report a wrong room, a missed transfer or a health issue through the app or guide and see it handled while still travelling.", "streamsNeeded": [{"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "howItSupports": "Logs complaints and in-trip issues and tracks their resolution."}, {"id": "request-and-confirm-supplier-services", "name": "Request and Confirm Supplier Services", "howItSupports": "Lets the office fix the issue with the hotel or DMC quickly."}], "media": [{"type": "image", "src": "media/jbtd-trav-jtbd-trav-3-3.png", "title": "Traveler and Booker JTBD step 3: Raise a problem and get it solved", "alt": "Enterprise infographic for step 3 of the job \"Travel informed and share feedback\": Raise a problem and get it solved."}]}, {"step": "Share feedback and rebook", "description": "Complete the post-trip survey, leave a Trustpilot review, and use the customer portal to see past bookings and book the next trip.", "streamsNeeded": [{"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "howItSupports": "Sends the survey and review request after the trip."}, {"id": "market-and-retain-customers", "name": "Market and Retain Customers", "howItSupports": "Uses survey and review data for retention and repeat-booking campaigns."}], "media": [{"type": "image", "src": "media/jbtd-trav-jtbd-trav-3-4.png", "title": "Traveler and Booker JTBD step 4: Share feedback and rebook", "alt": "Enterprise infographic for step 4 of the job \"Travel informed and share feedback\": Share feedback and rebook."}]}], "media": [{"type": "image", "src": "media/jbtd-trav-jtbd-trav-3.png", "title": "Traveler and Booker JTBD infographic: Travel informed and share feedback", "alt": "Enterprise infographic for the job \"Travel informed and share feedback\" for customer \"Traveler and Booker\"."}]}], "customerJourneyStories": [{"id": "journey-trav-1", "name": "Booking online and approving the quote in the booking-inzien page", "linkedJobIds": ["jtbd-trav-1", "jtbd-trav-2"], "summary": "A couple planning a tailor-made journey adopts the operator's online proposal and booking flow: triggered by a first inquiry, discovering the operator's real-time website and visual proposal, evaluating trust through package-travel information, SGR cover and Trustpilot, trialling it by approving and paying online, and staying because the my-trip portal makes the run-up to departure effortless.", "stages": [{"stage": "Trigger", "narrative": "After weeks of comparing forum posts and generic OTA pages for a three-week Vietnam journey, the couple wants someone who knows the country and one place where the whole trip lives. An inquiry to a specialist via a friend's recommendation is the start.", "media": [{"type": "image", "src": "media/journey-trav-trav-1-1.png", "title": "Traveler and Booker journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"Booking online and approving the quote in the booking-inzien page\": Trigger."}]}, {"stage": "Discovery", "narrative": "The specialist's website turns out to be built on the platform: sample itineraries with live prices, Trustpilot reviews on every page, and a promise of a visual online proposal within two days. The proposal arrives as a booking-inzien link with maps, hotel photos, day-by-day programme and price per person.", "media": [{"type": "image", "src": "media/journey-trav-trav-1-2.png", "title": "Traveler and Booker journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"Booking online and approving the quote in the booking-inzien page\": Discovery."}]}, {"stage": "Evaluation", "narrative": "Before approving, the couple reads the package-travel information form, checks the SGR guarantee-fund logo and ANVR membership, compares the cancellation terms with a competitor's proposal, asks for a different hotel in Hoi An through the proposal's change request, and sees the revised version the next morning.", "media": [{"type": "image", "src": "media/journey-trav-trav-1-3.png", "title": "Traveler and Booker journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"Booking online and approving the quote in the booking-inzien page\": Evaluation."}]}, {"stage": "Trial", "narrative": "They approve the proposal online and pay the deposit through iDEAL from the same page. The confirmation and invoice arrive within a minute, the my-trip portal opens with the payment schedule and a passenger-details form, and the whole thing took fifteen minutes on a phone.", "media": [{"type": "image", "src": "media/journey-trav-trav-1-4.png", "title": "Traveler and Booker journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"Booking online and approving the quote in the booking-inzien page\": Trial."}]}, {"stage": "Engagement", "narrative": "Over the following months they enter passport details, add a cooking class and an eSIM, receive a balance reminder with a payment link, and download the vouchers and itinerary the day they are published. They never phone the office.", "media": [{"type": "image", "src": "media/journey-trav-trav-1-5.png", "title": "Traveler and Booker journey stage 5: Engagement", "alt": "Enterprise journey panel for stage 5 of \"Booking online and approving the quote in the booking-inzien page\": Engagement."}]}, {"stage": "Retention", "narrative": "Back home they complete the survey, leave a Trustpilot review, and find the trip in their customer portal history with a rebook suggestion for Japan. The next proposal from the same specialist is approved without a second thought.", "media": [{"type": "image", "src": "media/journey-trav-trav-1-6.png", "title": "Traveler and Booker journey stage 6: Retention", "alt": "Enterprise journey panel for stage 6 of \"Booking online and approving the quote in the booking-inzien page\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-trav-trav-1.png", "title": "Traveler and Booker customer journey: Booking online and approving the quote in the booking-inzien page", "alt": "Enterprise journey storyboard for \"Booking online and approving the quote in the booking-inzien page\" for customer \"Traveler and Booker\"."}]}, {"id": "journey-trav-2", "name": "Living in the my-trip portal and app", "linkedJobIds": ["jtbd-trav-2", "jtbd-trav-3"], "summary": "A retired couple on a coach round trip adopt the operator's my-trip portal and partner app after years of paper documents and phone calls: triggered by a lost document envelope, discovering the portal through the confirmation email and a reminder from the desk, evaluating it for simplicity and safety, trying it for one trip, and using it for every booking since.", "stages": [{"stage": "Trigger", "narrative": "On last year's trip the travel document envelope arrived four days before departure and the pickup time in it was outdated; the couple spent an hour on hold to check. This year the confirmation email mentions a my-trip page and the desk agent suggests trying it.", "media": [{"type": "image", "src": "media/journey-trav-trav-2-1.png", "title": "Traveler and Booker journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"Living in the my-trip portal and app\": Trigger."}]}, {"stage": "Discovery", "narrative": "The confirmation email carries a booking-inzien link; the couple's daughter opens it with them and they see their booking, the seats they were promised, the deposit paid and the balance date. The desk agent explains that documents will appear there and in the app, which is available in the app store under the operator's brand.", "media": [{"type": "image", "src": "media/journey-trav-trav-2-2.png", "title": "Traveler and Booker journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"Living in the my-trip portal and app\": Discovery."}]}, {"stage": "Evaluation", "narrative": "They check whether the page shows exactly what was booked, whether payment via the link is safe (Mollie, iDEAL) and whether the paper option still exists if needed. The clear layout, the SGR and ANVR marks, and the fact that the desk can see the same page win them over.", "media": [{"type": "image", "src": "media/journey-trav-trav-2-3.png", "title": "Traveler and Booker journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"Living in the my-trip portal and app\": Evaluation."}]}, {"stage": "Trial", "narrative": "They enter seat preferences and a dietary wish in the portal, pay the balance through the payment link when the reminder arrives, and receive a notification when the documents are ready. They install the app for the trip and see the daily programme and the driver's pickup point.", "media": [{"type": "image", "src": "media/journey-trav-trav-2-4.png", "title": "Traveler and Booker journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"Living in the my-trip portal and app\": Trial."}]}, {"stage": "Engagement", "narrative": "During the trip the app shows a changed departure time after a road closure, and a message to the guide about a room issue is answered within the hour. Afterwards they complete the survey and leave a five-star Trustpilot review.", "media": [{"type": "image", "src": "media/journey-trav-trav-2-5.png", "title": "Traveler and Booker journey stage 5: Engagement", "alt": "Enterprise journey panel for stage 5 of \"Living in the my-trip portal and app\": Engagement."}]}, {"stage": "Retention", "narrative": "For the next booking they go straight to the operator's website, log into their customer portal, see past trips, and book a new round trip with their details pre-filled. They tell friends at the bridge club to look for the my-trip page.", "media": [{"type": "image", "src": "media/journey-trav-trav-2-6.png", "title": "Traveler and Booker journey stage 6: Retention", "alt": "Enterprise journey panel for stage 6 of \"Living in the my-trip portal and app\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-trav-trav-2.png", "title": "Traveler and Booker customer journey: Living in the my-trip portal and app", "alt": "Enterprise journey storyboard for \"Living in the my-trip portal and app\" for customer \"Traveler and Booker\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-trav-top", "name": "Booking completion rate", "description": "Share of started online bookings and sent tailor-made proposals that end in a confirmed booking with the deposit paid, the traveler's headline measure of a confident, frictionless booking.", "unit": "%", "currentValue": "58", "targetValue": "78", "link": "https://dashboard.example.com/tour-operator-erp-platform/customers/trav/kpis/co-trav-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-trav-co-trav-top.png"}, "branches": [{"id": "co-trav-b1", "name": "Confident booking and payment", "description": "How smoothly a traveler moves from choice to paid confirmation and how rarely the result differs from what was chosen.", "currentValue": "60", "icon": "kpi-trav-co-trav-b1.png", "children": [{"id": "co-trav-b1-c1", "name": "Booking funnel drop-off rate ": "Document self-service rate", "description": "Share of travel documents downloaded by travelers from the portal or app rather than sent or requested by email or phone.", "unit": "%", "currentValue": "55", "targetValue": "90", "icon": "kpi-trav-co-trav-b2-c1.png", "children": [{"id": "co-trav-b2-c1-l1", "name": "My-trip portal activation rate", "description": "Share of bookings where the traveler logs into the my-trip portal or app at least once before departure.", "unit": "%", "currentValue": "48", "targetValue": "85", "icon": "kpi-trav-co-trav-b2-c1-l1.png", "children": []}, {"id": "co-trav-b2-c1-l2", "name": "Documents downloaded within 24 hours", "description": "Share of published document sets opened by the traveler within a day of release.", "unit": "%", "currentValue": "60", "targetValue": "90", "icon": "kpi-trav-co-trav-b2-c1-l2.png", "children": []}]}, {"id": "co-trav-b2-c2", "name": "Traveler satisfaction score", "description": "Average post-trip survey score on a ten-point scale across all departures and trip files.", "unit": "score (1-10)", "currentValue": "8.2", "targetValue": "8.8", "icon": "kpi-trav-co-trav-b2-c2.png", "children": [{"id": "co-trav-b2-c2-l1", "name": "Trustpilot review score", "description": "Average public review score collected after trips through the platform's review request.", "unit": "stars (1-5)", "currentValue": "4.3", "targetValue": "4.7", "icon": "kpi-trav-co-trav-b2-c2-l1.png", "children": []}, {"id": "co-trav-b2-c2-l2", "name": "Post-trip survey response rate", "description": "Share of travelers completing the post-trip survey.", "unit": "%", "currentValue": "22", "targetValue": "40", "icon": "kpi-trav-co-trav-b2-c2-l2.png", "children": []}]}]}]}, "businessOutcomes": {"top": {"id": "bo-trav-top", "name": "Traveler portal adoption across tenants", "description": "Share of all bookings processed on the platform for which the traveler uses the my-trip portal, booking-inzien page or app, the platform's measure of self-service that saves operators handling time and creates portal revenue.", "unit": "%", "currentValue": "52", "targetValue": "90", "link": "https://dashboard.example.com/tour-operator-erp-platform/customers/trav/kpis/bo-trav-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-trav-bo-trav-top.png"}, "branches": [{"id": "bo-trav-b1", "name": "Portal and website reach", "description": "How many tenants expose the booking website, portal and app to travelers and how actively travelers use them.", "currentValue": "55", "icon": "kpi-trav-bo-trav-b1.png", "children": [{"id": "bo-trav-b1-c1", "name": "Tenants with live online booking site", "description": "Share of tenants whose customer website takes real-time bookings on the platform.", "unit": "%", "currentValue": "63", "targetValue": "90", "icon": "kpi-trav-bo-trav-b1-c1.png", "children": [{"id": "bo-trav-b1-c1-l1", "name": "Website module attach rate", "description": "Share of tenants subscribing to the customer website and online booking module.", "unit": "%", "currentValue": "58", "targetValue": "85", "icon": "kpi-trav-bo-trav-b1-c1-l1.png", "children": []}, {"id": "bo-trav-b1-c1-l2", "name": "Partner app activation rate", "description": "Share of tenants offering a branded traveler app through partners such as Travelia or Appit.", "unit": "%", "currentValue": "18", "targetValue": "50", "icon": "kpi-trav-bo-trav-b1-c1-l2.png", "children": []}]}, {"id": "bo-trav-b1-c2", "name": "Monthly active travelers on portals", "description": "Distinct travelers using the portal or app per month across all tenants.", "unit": "thousand travelers / month", "currentValue": "95", "targetValue": "260", "icon": "kpi-trav-bo-trav-b1-c2.png", "children": [{"id": "bo-trav-b1-c2-l1", "name": "Traveler logins per booking", "description": "Average number of portal or app sessions per booking between confirmation and return.", "unit": "sessions / booking", "currentValue": "3.1", "targetValue": "5.0", "icon": "kpi-trav-bo-trav-b1-c2-l1.png", "childr  "children": []}, {"id": "bo-trav-b2-c2-l2", "name": "Insurance and extras upsell rate", "description": "Share of bookings adding insurance, excursions or upgrades through the portal after confirmation.", "unit": "%", "currentValue": "12", "targetValue": "25", "icon": "kpi-trav-bo-trav-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Let every traveler of every platform operator book, pay, prepare, travel and review in one branded my-trip experience, so that the operator's service feels personal at scale and the traveler never needs to call the office to find out what is going on.", "timeHorizons": {"year1": {"focus": "Bring the booking-inzien pages, customer portal and online booking of both brands onto shared traveler portals and partner apps, with payment links, document delivery and proposal approval working the same way for group and tailor-made travelers.", "productTheme": "One my-trip experience across both brands", "customerKPI": {"northStar": "Booking completion rate", "supporting": ["Booking funnel drop-off rate", "My-trip portal activation rate"]}, "businessKPI": {"northStar": "Traveler portal adoption across tenants", "revenueStreams": ["Website and online booking modules", "Traveler portal and app modules", "Partner app licences"], "supporting": ["Tenants with live online booking site", "Website module attach rate"]}, "milestones": ["Launch the shared traveler portal with proposal approval, payments, passenger details and documents for both brands", "Connect Travelia and Appit apps to the shared portal data so every tenant can offer a branded app", "Standardise real-time online booking on the platform CMS for group departures"]}, "year3": {"focus": "Make the traveler portal the default channel for every platform tenant: documents, payments and changes are portal-first, marketplace partners add eSIM, insurance and excursions in the flow, and reviews and surveys feed the operator's marketing.", "productTheme": "Portal-first service with marketplace extras", "customerKPI": {"northStar": "Booking completion rate", "supporting": ["Document self-service rate", "Traveler satisfaction score"]}, "businessKPI": {"northStar": "Traveler portal adoption across tenants", "revenueStreams": ["Traveler portal subscriptions", "Marketplace partner revenue share on extras", "Review and survey add-ons"], "supporting": ["Monthly active travelers on portals", "Ancillary revenue via portal"]}, "milestones": ["Reach portal-first document delivery and balance payment for the majority of bookings across tenants", "Integrate eSIM, insurance and excursion partners into the booking and portal flow through the marketplace", "Feed surveys and Trustpilot reviews automatically into segmentation and repeat-booking campaigns"]}, "year5": {"focus": "Give travelers in multiple countries and languages an AI-assisted trip companion that answers questions, handles changes and resolves issues in the app under operator supervision, with demand and satisfaction data flowing back into the platform's data products.", "productTheme": "AI trip companion across European markets", "customerKPI": {"northStar": "Booking completion rate", "supporting": ["Booking error rate", "Portal messaging usage rate"]}, "businessKPI": {"northStar": "Traveler portal adoption across tenants", "revenueStreams": ["AI trip companion subscriptions", "Multi-country portal licences", "Traveler demand data products"], "supporting": ["Handling minutes saved per booking", "Partner app activation rate"]}, "milestones": ["Launch the AI trip companion for questions, changes and issue resolution in the app with operator supervision", "Localise the portal and app for at least two new European markets", "Publish satisfaction and demand benchmarks per destination as a data product"]}}}, "domain": "Travelers and Trade Partners"}, {"id": "rsel", "name": "Reseller Travel Agent", "description": "Retail travel agent at a high-street or online agency, an affiliated agent in a franchise chain, or an independent ZRA-style travel adviser working from home, who sells the operator's group departures and tailor-made products to their own clients on commission. Historically booked by phone or email and waited for confirmations and documents; now expected to use the operator's reseller portal to check availability, book, place options, retrieve documents and follow changes for their clients. Wants to serve a client in one conversation and be paid the right commission without arguments.", "icon": "rsel.png", "careAbout": ["Confirming availability and price for a client while they are still in the shop or on the phone", "Earning the agreed commission on every booking and seeing it at quote time, not at invoice time", "Documents and changes for their clients arriving through the portal so the agent looks in control", "Placing and converting options without losing seats to direct bookings", "One portal login per operator that works the same for group departures and tailor-made products", "Not being cut out: the operator's direct website should not undercut the agent's price"], "winsThem": ["A reseller portal with live availability, net and gross prices, commission shown, and instant booking confirmation", "Options with clear expiry, automatic reminders, and one-click conversion to a booking", "Client documents and change notifications retrievable in the portal with the agent's own branding on the cover", "A monthly commission statement that matches the bookings made, reconciled without emails", "Product feeds and API connections that bring the operator's products into the agency's own systems"], "theirFear": ["A client losing a departure because the operator's portal showed stale availability and the booking failed", "Being the last to hear about a schedule or hotel change and looking incompetent in front of the client", "Commission disputes and late statements that make the operator not worth selling"], "jobsToBeDone": [{"id": "jtbd-rsel-1", "name": "Book operator products for my clients without phone calls", "whatItIs": "Find the right departure or tailor-made product for a client, confirm availability and commissionable price instantly in the reseller portal, place an option or book, collect the client's details and deposit, and receive confirmation while the client is still in the conversation.", "outcome": "A confirmed booking made in the portal in one client conversation, with the agent's commission recorded and no phone call or email to the operator required.", "steps": [{"step": "Search availability and price", "description": "Search the operator's products in the reseller portal by destination, date and room type, see live availability, gross price, net price and commission, and shortlist for the client.", "streamsNeeded": [{"id": "distribute-through-resellers-and-partners", "name": "Distribute Through Resellers and Partners", "howItSupports": "Provides the reseller portal with live availability, reseller pricing and commission per product."}, {"id": "build-and-price-travel-products", "name": "Build and Price Travel Products", "howItSupports": "Supplies the products, departures, prices and availability that the portal shows."}], "media": [{"type": "image", "src": "media/jbtd-rsel-jtbd-rsel-1-1.png", "title": "Reseller Travel Agent JTBD step 1: Search availability and price", "alt": "Enterprise infographic for step 1 of the job \"Book operator products for my clients without phone calls\": Search availability and price."}]}, {"step": "Place an option or book directly", "description": "Hold seats with an option that has a clear expiry, or book directly with traveler names, room wishes and the client's contact details.", "streamsNeeded": [{"id": "distribute-through-resellers-and-partners", "name": "Distribute Through Resellers and Partners", "howItSupports": "Creates options and bookings from the portal with reseller attribution."}, {"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "howItSupports": "Records the booking file, option expiry and traveler details in the back office."}], "media": [{"type": "image", "src": "media/jbtd-rsel-jtbd-rsel-1-2.png", "title": "Reseller Travel Agent JTBD step 2: Place an option or book directly", "alt": "Enterprise infographic for step 2 of the job \"Book operator products for my clients without phone calls\": Place an option or book directly."}]}, {"step": "Collect deposit and confirm", "description": "Collect the deposit from the client directly or through a payment link, and receive the confirmation and invoice in the portal with commission shown.", "streamsNeeded": [{"id": "collect-payments-and-invoice", "name": "Collect Payments and Invoice", "howItSupports": "Issues the invoice and payment link with reseller commission handled correctly."}, {"id": "distribute-through-resellers-and-partners", "name": "Distribute Through Resellers and Partners", "howItSupports": "Delivers confirmation and invoice documents into the reseller portal."}], "media": [{"type": "image", "src": "media/jbtd-rsel-jtbd-rsel-1-3.png", "title": "Reseller Travel Agent JTBD step 3: Collect deposit and confirm", "alt": "Enterprise infographic for step 3 of the job \"Book operator products for my clients without phone calls\": Collect deposit and confirm."}]}, {"step": "Convert options and reconcile commission", "description": "Follow option reminders, convert or release options before expiry, and reconcile the monthly commission statement against the portal booking list.", "streamsNeeded": [{"id": "distribute-through-resellers-and-partners", "name": "Distribute Through Resellers and Partners", "howItSupports": "Manages option reminders, conversion and commission statements in the portal."}, {"id": "settle-suppliers-and-close-books", "name": "Settle Suppliers and Close Books", "howItSupports": "Produces the commission statement and settles it with the operator's finance."}], "media": [{"type": "image", "src": "media/jbtd-rsel-jtbd-rsel-1-4.png", "title": "Reseller Travel Agent JTBD step 4: Convert options and reconcile commission", "alt": "Enterprise infographic for step 4 of the job \"Book operator products for my clients without phone calls\": Convert options and reconcile commission."}]}], "media": [{"type": "image", "src": "media/jbtd-rsel-jtbd-rsel-1.png", "title": "Reseller Travel Agent JTBD infographic: Book operator products for my clients without phone calls", "alt": "Enterprise infographic for the job \"Book operator products for my clients without phone calls\" for customer \"Reseller Travel Agent\"."}]}, {"id": "jtbd-rsel-2", "name": "Keep my clients informed with documents and changes", "whatItIs": "Retrieve travel documents, itineraries and invoices for clients from the reseller portal as soon as they are ready, receive change notifications about departures, hotels, schedules and payments in time, and pass information to clients under the agency's own name.", "outcome": "Clients receive correct documents and timely change information from their agent, and the agent never has to chase the operator by phone.", "steps": [{"step": "Retrieve documents for clients", "description": "Get a notification when a client's documents are published, download vouchers, tickets and itineraries from the portal, and forward or hand them over under the agency's branding.", "streamsNeeded": [{"id": "distribute-through-resellers-and-partners", "name": "Distribute Through Resellers and Partners", "howItSupports": "Publishes client documents to the reseller portal with notifications and reseller branding."}, {"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "howItSupports": "Generates the travel documents and itinerary per booking."}], "media": [{"type": "image", "src": "media/jbtd-rsel-jtbd-rsel-2-1.png", "title": "Reseller Travel Agent JTBD step 1: Retrieve documents for clients", "alt": "Enterprise infographic for step 1 of the job \"Keep my clients informed with documents and changes\": Retrieve documents for clients."}]}, {"step": "Track payments and due dates", "description": "See per booking what the client has paid, what is due and when, and remind the client or settle through the agency's own accounts.", "streamsNeeded": [{"id": "collect-payments-and-invoice", "name": "Collect Payments and Invoice", "howItSupports": "Shows payment status, due dates and open amounts per reseller booking."}, {"id": "distribute-through-resellers-and-partners", "name": "Distribute Through Resellers and Partners", "howItSupports": "Displays payment status and reminders in the reseller portal."}], "media": [{"type": "image", "src": "media/jbtd-rsel-jtbd-rsel-2-2.png", "title": "Reseller Travel Agent JTBD step 2: Track payments and due dates", "alt": "Enterprise infographic for step 2 of the job \"Keep my clients informed with documents and changes\": Track payments and due dates."}]}, {"step": "Receive and relay changes", "description": "Receive change notifications about departure times, hotels, pickup points and cancellations for the agent's bookings, and relay them to clients or manage rebooking in the portal.", "streamsNeeded": [{"id": "distribute-through-resellers-and-partners", "name": "Distribute Through Resellers and Partners", "howItSupports": "Sends change notifications to the reseller for affected bookings and allows rebooking."}, {"id": "operate-group-departures", "name": "Operate Group Departures", "howItSupports": "Originates departure changes such as times, pickups and hotel swaps."}], "media": [{"type": "image", "src": "media/jbtd-rsel-jtbd-rsel-2-3.png", "title": "Reseller Travel Agent JTBD step 3: Receive and relay changes", "alt": "Enterprise infographic for step 3 of the job \"Keep my clients informed with documents and changes\": Receive and relay changes."}]}, {"step": "Handle after-travel questions", "description": "Answer client questions after the trip about invoices, complaints and rebooking using the portal's booking history and messaging with the operator.", "streamsNeeded": [{"id": "distribute-through-resellers-and-partners", "name": "Distribute Through Resellers and Partners", "howItSupports": "Provides booking history and messaging with the operator in the portal."}, {"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "howItSupports": "Logs complaints and after-travel service requests against the booking."}], "media": [{"type": "image", "src": "media/jbtd-rsel-jtbd-rsel-2-4.png", "title": "Reseller Travel Agent JTBD step 4: Handle after-travel questions", "alt": "Enterprise infographic for step 4 of the job \"Keep my clients informed with documents and changes\": Handle after-travel questions."}]}], "media": [{"type": "image", "src": "media/jbtd-rsel-jtbd-rsel-2.png", "title": "Reseller Travel Agent JTBD infographic: Keep my clients informed with documents and changes", "alt": "Enterprise infographic for the job \"Keep my clients informed with documents and changes\" for customer \"Reseller Travel Agent\"."}]}], "customerJourneyStories": [{"id": "journey-rsel-1", "name": "From phone bookings to the reseller portal", "linkedJobIds": ["jtbd-rsel-1"], "summary": "An independent travel adviser adopts a coach operator's reseller portal after years of booking by phone: triggered by lost seats and hold times, discovering the portal through the operator's trade newsletter and an ANVR trade fair, evaluating it on live availability and commission visibility, trialling with one client booking, and making it the default for every client since.", "stages": [{"stage": "Trigger", "narrative": "In the January booking peak the adviser waits twenty minutes on hold to check a departure for a client, only to find the seats sold to a direct customer while she was waiting. The client books elsewhere. The adviser decides she will only sell operators she can book instantly.", "media": [{"type": "image", "src": "media/journey-rsel-rsel-1-1.png", "title": "Reseller Travel Agent journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"From phone bookings to the reseller portal\": Trigger."}]}, {"stage": "Discovery", "narrative": "The operator's trade newsletter announces a reseller portal with live availability and commission shown; at the ANVR trade fair the operator's sales manager shows it on a tablet and hands out a login form. A colleague in the franchise chain already uses it and shows the option and document features on her screen.", "media": [{"type": "image", "src": "media/journey-rsel-rsel-1-2.png", "title": "Reseller Travel Agent journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"From phone bookings to the reseller portal\": Discovery."}]}, {"stage": "Evaluation", "narrative": "The adviser tests whether the portal shows the same availability as the operator's own website, whether the commission is visible before booking, how options work, whether the agency's branding appears on client documents, and how the monthly commission statement is delivered. She also checks the operator's ANVR and SGR status because her clients ask.", "media": [{"type": "image", "src": "media/journey-rsel-rsel-1-3.png", "title": "Reseller Travel Agent journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"From phone bookings to the reseller portal\": Evaluation."}]}, {"stage": "Trial", "narrative": "The first real booking is a couple for a spring round trip: the adviser searches, places an option during the shop conversation, converts it to a booking the next day, and collects the deposit through the operator's payment link. Confirmation and invoice appear in the portal within seconds; no phone call was needed.", "media": [{"type": "image", "src": "media/journey-rsel-rsel-1-4.png", "title": "Reseller Travel Agent journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"From phone bookings to the reseller portal\": Trial."}]}, {"stage": "Engagement", "narrative": "Within a season all bookings for this operator go through the portal, options are placed while clients are still deciding, and the adviser checks the commission statement against the portal booking list at month-end. She asks the operator to expose tailor-made products in the portal too.", "media": [{"type": "image", "src": "media/journey-rsel-rsel-1-5.png", "title": "Reseller Travel Agent journey stage 5: Engagement", "alt": "Enterprise journey panel for stage 5 of \"From phone bookings to the reseller portal\": Engagement."}]}, {"stage": "Retention", "narrative": "The adviser's repeat bookings with this operator rise because booking is effortless, and she recommends the operator to fellow advisers. When a second operator on the same platform offers a portal login, she recognises the interface and is booking within a day.", "media": [{"type": "image", "src": "media/journey-rsel-rsel-1-6.png", "title": "Reseller Travel Agent journey stage 6: Retention", "alt": "Enterprise journey panel for stage 6 of \"From phone bookings to the reseller portal\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-rsel-rsel-1.png", "title": "Reseller Travel Agent customer journey: From phone bookings to the reseller portal", "alt": "Enterprise journey storyboard for \"From phone bookings to the reseller portal\" for customer \"Reseller Travel Agent\"."}]}, {"id": "journey-rsel-2", "name": "Documents and changes without calling the operator", "linkedJobIds": ["jtbd-rsel-2"], "summary": "A high-street agency adopts the document and change-notification side of an operator's reseller portal: triggered by a client change the agency heard about last, discovering the feature in the portal and from the operator's account manager, evaluating branding and notification rules, trialling on a busy summer, and staying because clients see the agency as in control.", "stages": [{"stage": "Trigger", "narrative": "A departure time change reaches the client by the operator's email before the agency knows about it, and the client calls the agency angry. Two days later the client's documents arrive by post at the agency and are handed over late. The agency manager wants change and document control back.", "media": [{"type": "image", "src": "media/journey-rsel-rsel-2-1.png", "title": "Reseller Travel Agent journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"Documents and changes without calling the operator\": Trigger."}]}, {"stage": "Discovery", "narrative": "The operator's account manager points out that the reseller portal already carries document downloads with agency branding and change notifications per booking; a short video in the portal shows the notification settings and a colleague at another branch confirms it works.", "media": [{"type": "image", "src": "media/journey-rsel-rsel-2-2.png", "title": "Reseller Travel Agent journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"Documents and changes without calling the operator\": Discovery."}]}, {"stage": "Evaluation", "narrative": "The manager checks who receives change notifications first, whether the agency can suppress operator emails to the client for its own bookings, how the agency logo appears on document covers, and whether payment status per client is visible. A test booking with a deliberate hotel change proves the sequence.", "media": [{"type": "image", "src": "media/journey-rsel-rsel-2-3.png", "title": "Reseller Travel Agent journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"Documents and changes without calling the operator\": Evaluation."}]}, {"stage": "Trial", "narrative": "During the summer peak the agency handles all client documents from the portal, receives change notifications before the client does, and relays them in its own words. Payment reminders are handled from the portal's status view instead of from the operator's calls.", "media": [{"type": "image", "src": "media/journey-rsel-rsel-2-4.png", "title": "Reseller Travel Agent journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"Documents and changes without calling the operator\": Trial."}]}, {"stage": "Engagement", "narrative": "Document downloads and change handling become routine for every booking, the agency's staff onboard new colleagues on the portal in an afternoon, and after-travel questions are answered from the booking history and messaging with the operator.", "media": [{"type": "image", "src": "media/journey-rsel-rsel-2-5.png", "title": "Reseller Travel Agent journey stage 5: Engagement", "alt": "Enterprise journey panel for stage 5 of \"Documents and changes without calling the operator\": Engagement."}]}, {"stage": "Retention", "narrative": "Clients experience the agency as the party in control, complaints about late information disappear, and the agency prioritises operators whose portals work this way. The manager asks the operator for API access to bring product content into the agency's own system.", "media": [{"type": "image", "src": "media/journey-rsel-rsel-2-6.png", "title": "Reseller Travel Agent journey stage 6: Retention", "alt": "Enterprise journey panel for stage 6 of \"Documents and changes without calling the operator\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-rsel-rsel-2.png", "title": "Reseller Travel Agent customer journey: Documents and changes without calling the operator", "alt": "Enterprise journey storyboard for \"Documents and changes without calling the operator\" for customer \"Reseller Travel Agent\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-rsel-top", "name": "Portal booking share", "description": "Share of all reseller bookings with the operator that are made in the reseller portal rather than by phone or email, the agent's headline measure of frictionless distribution.", "unit": "%", "currentValue": "44", "targetVa     const customer = {"id": "town", "name": "Travel Company Owner", "description": "Managing director or owner of a Dutch or Belgian travel organisation of 5 to 150 FTE: a coach or group tour operator such as Kras Busreizen, Oad, Djoser or SRC Reizen, a tailor-made specialist such as Van Verre, Tenzing Travel or SNP Natuurreizen, an OTA, a MICE agency or a small travel entrepreneur just past the point where spreadsheets and a generic CRM stop scaling. Signs the ERP subscription (1TIS publishes a base package from EUR 129 per month plus modules; TravelSpirit runs start packages and enterprise contracts), decides which modules and portals get switched on, and is personally accountable to ANVR, SGR and the package-travel rules. Judges the platform on margin, bookings per FTE, online share under the own brand, and total cost of ownership rather than on feature lists.", "icon": "town.png", "careAbout": ["Growing bookings and travel revenue without adding back-office headcount in a tight Dutch labour market", "A healthy operating margin in a trade where 3 to 6 percent is normal and one bad season can wipe it out", "A larger share of bookings arriving directly through the own-brand website instead of through commissioned resellers and bed banks", "One system of record from first lead to aftercare so that product, sales, operations and finance stop re-keying each other's data", "Staying compliant with SGR travel-guarantee-fund reporting, the package-travel regulation and ANVR conditions without a compliance department", "Predictable total cost of ownership: a monthly subscription that scales with modules, not surprise consultancy invoices"], "winsThem": ["A live demo on the operator's own products and departures, followed by a reference call with a peer such as Djoser or Van Verre who runs the same setup", "A migration plan that imports products, customers and open bookings from the legacy back office or spreadsheets and allows a bounded parallel run", "A real-time bookable website in the own brand that goes live within the first season and visibly moves the online booking share", "Management dashboards (Travel Intelligence) that show margin per departure and per trip file without exporting to Excel", "AI assistants that draft quotes and triage the shared inbox so the same team handles more bookings in peak weeks"], "theirFear": ["A failed migration in the middle of the booking season, with staff working two systems and travelers receiving wrong documents", "Being locked into a vendor whose roadmap is decided by its biggest customer while the monthly subscription keeps creeping up", "An SGR or regulator finding, or a Trustpilot storm, that damages the brand built over decades"], "jobsToBeDone": [{"id": "jtbd-town-1", "name": "Scale bookings and revenue without scaling headcount", "whatItIs": "Grow the number of departures, trip files and passengers the organisation handles per season while keeping the back office the same size, by removing re-keying between product, sales, operations and finance and by automating the routine work of the booking desk.", "outcome": "Revenue per FTE rises season over season; peak weeks are absorbed without temporary staff; the owner can add a new destination or a second brand without a new administrator.", "steps": [{"step": "Map where the hours go today", "description": "Walk the trade lifecycle Product to Sell to Book to Operate to Serve to Settle to Steer with the team and count the hand-offs: product data in Excel, bookings in the legacy back office, room lists in Word, invoices in the accounting package, questions in a shared mailbox.", "streamsNeeded": [{"id": "steer-the-travel-business-with-insight", "name": "Steer the Travel Business with Insight", "howItSupports": "Provides the baseline of bookings, hours and cost per process step that shows where headcount is being spent."}, {"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "howItSupports": "Exposes how many bookings still need manual touches from inquiry to paid deposit."}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-1-1.png", "title": "Travel Company Owner JTBD step 1: Map where the hours go today", "alt": "Enterprise infographic for step 1 of the job \"Scale bookings and revenue without scaling headcount\": Map where the hours go today."}]}, {"step": "Move product, booking and finance onto one data model", "description": "Load packages, departures, components, supplier contracts and pricing rules once so that quotes, bookings, room lists, invoices and dashboards all read the same record; retire the parallel spreadsheets one by one.", "streamsNeeded": [{"id": "build-and-price-travel-products", "name": "Build and Price Travel Products", "howItSupports": "Turns supplier contracts into sellable packages and departures with yield rules that every downstream step reuses."}, {"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "howItSupports": "Makes the booking file the single dossier that sales, operations and finance work from."}, {"id": "collect-payments-and-invoice", "name": "Collect Payments and Invoice", "howItSupports": "Generates invoices and payment links straight from the booking file, removing double entry into finance."}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-1-2.png", "title": "Travel Company Owner JTBD step 2: Move product, booking and finance onto one data model", "alt": "Enterprise infographic for step 2 of the job \"Scale bookings and revenue without scaling headcount\": Move product, booking and finance onto one data model."}]}, {"step": "Automate the routine desk work", "description": "Switch on workflow tasks, alerts and AI assistants for quote drafting and inbox triage so reservations agents spend their time on selling and exceptions rather than on copying data and chasing status.", "streamsNeeded": [{"id": "quote-and-sell-tailor-made-trips", "name": "Quote and Sell Tailor-Made Trips", "howItSu ithout scaling headcount\": Let travelers, resellers and suppliers serve themselves."}]}, {"step": "Measure bookings per FTE and reinvest", "description": "Track bookings, passengers and revenue per FTE per month on the management dashboard, compare seasons, and decide where the freed capacity goes: new destinations, a second brand, or more direct marketing.", "streamsNeeded": [{"id": "steer-the-travel-business-with-insight", "name": "Steer the Travel Business with Insight", "howItSupports": "Shows revenue per FTE, handling time and margin trends so the owner sees the effect of each automation step."}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-1-5.png", "title": "Travel Company Owner JTBD step 5: Measure bookings per FTE and reinvest", "alt": "Enterprise infographic for step 5 of the job \"Scale bookings and revenue without scaling headcount\": Measure bookings per FTE and reinvest."}]}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-1.png", "title": "Travel Company Owner JTBD infographic: Scale bookings and revenue without scaling headcount", "alt": "Enterprise infographic for the job \"Scale bookings and revenue without scaling headcount\" for customer \"Travel Company Owner\"."}]}, {"id": "jtbd-town-2", "name": "Grow direct online sales under the own brand", "whatItIs": "Shift bookings from commissioned resellers, bed banks and phone calls to a real-time bookable website and customer portal in the operator's own brand, fed directly from the back office inventory and prices, and supported by segmented email marketing and reviews.", "outcome": "A higher online booking share at lower distribution cost, a brand that customers book with directly, and repeat bookings driven from the operator's own CRM data.", "steps": [{"step": "Decide the channel mix and brand positioning", "description": "Look at the current split between direct website, phone, resellers and partner feeds, the commission paid per channel, and decide which products should be online-bookable in real time and which stay quote-led.", "streamsNeeded": [{"id": "steer-the-travel-business-with-insight", "name": "Steer the Travel Business with Insight", "howItSupports": "Provides channel share, commission cost and conversion per product line to base the mix decision on."}, {"id": "distribute-through-resellers-and-partners", "name": "Distribute Through Resellers and Partners", "howItSupports": "Shows which reseller and partner channels earn their commission and which cannibalise direct sales."}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-2-1.png", "title": "Travel Company Owner JTBD step 1: Decide the channel mix and brand positioning", "alt": "Enterprise infographic for step 1 of the job \"Grow direct online sales under the own brand\": Decide the channel mix and brand positioning."}]}, {"step": "Launch the real-time booking website", "description": "Build or migrate the website on the platform CMS (1TIS Klantwebsite or TravelSpirit SPoE) so that availability, prices, departures and options come live from the back office and a completed web booking creates a booking file with deposit paid.", "streamsNeeded": [{"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "howItSupports": "Connects the website booking flow to real-time inventory and creates the booking file without desk intervention."}, {"id": "build-and-price-travel-products", "name": "Build and Price Travel Products", "howItSupports": "Supplies the product content, departures, prices and availability the website renders."}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-2-2.png", "title": "Travel Company Owner JTBD step 2: Launch the real-time booking website", "alt": "Enterprise infographic for step 2 of the job \"Grow direct online sales under the own brand\": Launch the real-time booking website."}]}, {"step": "Turn the customer base into a marketing asset", "description": "Segment the CRM by destination, travel type, season and past spend, run email campaigns through Spotler, collect Trustpilot reviews after each trip and show them on the website.", "streamsNeeded": [{"id": "market-and-retain-customers", "name": "Market and Retain Customers", "howItSupports": "Runs segmentation, campaigns, review collection and repeat-booking programmes from the CRM data."}, {"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "howItSupports": "Triggers the post-trip survey and review request that feeds the marketing loop."}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-2-3.png", "title": "Travel Company Owner JTBD step 3: Turn the customer base into a marketing asset", "alt": "Enterprise infographic for step 3 of the job \"Grow direct online sales under the own brand\": Turn the customer base into a marketing asset."}]}, {"step": "Open the customer portal for repeat business", "description": "Give travelers a login where they see past bookings, download documents, message the office and rebook, so the brand relationship survives between trips.", "streamsNeeded": [{"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "howItSupports": "Provides the my-trip portal and app with booking history, documents and messaging."}, {"id": "market-and-retain-customers", "name": "Market and Retain Customers", "howItSupports": "Uses portal activity and booking history to target the next trip."}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-2-4.png", "title": "Travel Company Owner JTBD step 4: Open the customer portal for repeat business", "alt": "Enterprise infographic for step 4 of the job \"Grow direct online sales under the own brand\": Open the customer portal for repeat business."}]}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-2.png", "title": "Travel Company Owner JTBD infographic: Grow direct online sales under the own brand", "alt": "Enterprise infographic for the job \"Grow direct online sales under the own brand\" for customer \"Travel Company Owner\"."}]}, {"id": "jtbd-town-3", "name": "Run a compliant, insight-driven travel business", "whatItIs": "Steer the organisation on live margin, load factor and cash data instead of month-old exports, and satisfy SGR, ANVR, package-travel and tax obligations as a by-product of daily operations rather than as a quarterly scramble.", "outcome": "The owner opens one dashboard on Monday morning and knows margin per departure, cash position and risk exposure; fund and regulator reporting is produced from the system with no spreadsheet reconciliation.", "steps": [{"step": "Define the steering KPIs", "description": "Agree with finance and operations on the handful of numbers that run the business: revenue per FTE, operating margin, load factor per departure, online share, overdue receivables and days to close.", "streamsNeeded": [{"id": "steer-the-travel-business-with-insight", "name": "Steer the Travel Business with Insight", "howItSupports": "Turns the KPI definitions into dashboards fed from booking, invoice and departure data."}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-3-1.png", "title": "Travel Company Owner JTBD step 1: Define the steering KPIs", "alt": "Enterprise infographic for step 1 of the job \"Run a compliant, insight-driven travel business\": Define the steering KPIs."}]}, {"step": "Get margin per departure and per trip file live", "description": "Have purchase cost, sales price, currency and yield changes flow into a live margin view so that pricing and capacity decisions are made on facts during the season, not after it.", "streamsNeeded": [{"id": "build-and-price-travel-products", "name": "Build and Price Travel Products", "howItSupports": "Holds contract cost, price and yield rules that determine planned margin."}, {"id": "operate-group-departures", "name": "Operate Group Departures", "howItSupports": "Adds actual load factor and minimum-participant decisions per departure."}, {"id": "settle-suppliers-and-close-books", "name": "Settle Suppliers and Close Books", "howItSupports": "Adds actual supplier invoices so realised margin replaces planned margin."}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-3-2.png", "title": "Travel Company Owner JTBD step 2: Get margin per departure and per trip file live", "alt": "Enterprise infographic for step 2 of the job \"Run a compliant, insight-driven travel business\": Get margin per departure and per trip file live."}]}, {"step": "Make compliance a by-product of the process", "description": "Ensure every package booking carries the guarantee-fund flag, the package-travel information form and the correct invoice wording, and that the SGR report, VAT and travel-tax figures come straight from the booking and invoice records.", "streamsNeeded": [{"id": "collect-payments-and-invoice", "name": "Collect Payments and Invoice", "howItSupports": "Produces compliant invoices and payment records per booking."}, {"id": "settle-suppliers-and-close-books", "name": "Settle Suppliers and Close Books", "howItSupports": "Generates guarantee-fund reporting and closes the month from settled records."}, {"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "howItSupports": "Captures the package-travel information and consent at booking time."}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-3-3.png", "title": "Travel Company Owner JTBD step 3: Make compliance a by-product of the process", "alt": "Enterprise infographic for step 3 of the job \"Run a compliant, insight-driven travel business\": Make compliance a by-product of the process."}]}, {"step": "Review, decide, and adjust weekly", "description": "Run the weekly management meeting from the dashboard: cancel or merge departures under minimum, re-price slow sellers, chase overdue receivables and track the effect next week.", "streamsNeeded": [{"id": "steer-the-travel-business-with-insight", "name": "Steer the Travel Business with Insight", "howItSupports": "Provides weekly KPI trends and drill-down to departure and file level."}, {"id": "operate-group-departures", "name": "Operate Group Departures", "howItSupports": "Executes the capacity decisions taken in the meeting."}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-3-4.png", "title": "Travel Company Owner JTBD step 4: Review, decide, and adjust weekly", "alt": "Enterprise infographic for step 4 of the job \"Run a compliant, insight-driven travel business\": Review, decide, and adjust weekly."}]}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-3.png", "title": "Travel Company Owner JTBD infographic: Run a compliant, insight-driven travel business", "alt": "Enterprise infographic for the job \"Run a compliant, insight-driven travel business\" for customer \"Travel Company Owner\"."}]}], "customerJourneyStories": [{"id": "journey-town-1", "name": "From spreadsheets and a legacy back office to one travel ERP", "linkedJobIds": ["jtbd-town-1", "jtbd-town-3"], "summary": "The owner of a 40-FTE group tour operator replaces a home-grown back office and a forest of spreadsheets with the travel ERP: discovering it through peers at ANVR events, evaluating it on a demo with own departures and reference calls, running a bounded parallel run on one season, and renewing on bookings per FTE.", "stages": [{"stage": "Trigger", "narrative": "The spring season shows the cracks: two experienced administrators announce retirement, the home-grown back office built by a freelancer in 2012 cannot produce SGR figures without a weekend of Excel work, and a duplicate room list sends a family to the wrong hotel. The owner decides the systems are the constraint on growth, not the people.", "media": [{"type": "image", "src": "media/journey-town-town-1-1.png", "title": "Travel Company Owner journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"From spreadsheets and a legacy back office to one travel ERP\": Trigger."}]}, {"stage": "Discovery", "narrative": "At an ANVR members' meeting two owners of comparable coach operators describe running seat allocation, room lists and invoicing in one platform; the owner recognises the reference logos on the vendor site (Kras Busreizen, Oad, Djoser, SRC Reizen) and reads that the same group now also owns the tailor-made suite used by Van Verre and Tenzing Travel. The published base package from EUR 129 per month makes the first conversation low-risk.", "media": [{"type": "image", "src": "media/journey-town-town-1-2.png", "title": "Travel Company Owner journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"From spreadsheets and a legacy back office to one travel ERP\": Discovery."}]}, {"stage": "Evaluation", "narrative": "The vendor demos with the operator's own summer programme loaded: a departure with bus seating, a hotel room list and the invoice produced from it. The owner calls two reference customers, asks finance to check the Exact integration and the SGR report, and compares three years of subscription plus onboarding against the cost of the retiring administrators and the freelancer's maintenance. Vendor stability after the Vortex acquisition and a written migration plan settle the decision.", "media": [{"type": "image", "src": "media/journey-town-town-1-3.png", "title": "Travel Company Owner journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"From spreadsheets and a legacy back office to one travel ERP\": Evaluation."}]}, {"stage": "Trial", "narrative": "The trial is a parallel run on the autumn programme: products and open bookings are imported, the desk books new autumn departures in the new system while the legacy system finishes the summer, and the first room lists, seat plans and invoices are checked side by side. Two data-quality issues in the import are fixed within a week and the finance lead signs off the first month-end from the new system.", "media": [{"type": "image", "src": "media/journey-town-town-1-4.png", "title": "Travel Company Owner journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"From spreadsheets and a legacy back office to one travel ERP\": Trial."}]}, {"stage": "Engagement", "narrative": "By the next spring every departure, booking and invoice lives in the platform, the customer website is on the platform CMS, and the weekly management meeting runs from the Travel Intelligence dashboard. The AI inbox assistant is switched on for the peak booking weeks and the team absorbs a 20 percent larger programme without temporary staff.", "media": [{"type": "image", "src": "media/journey-town-town-1-5.png", "title": "Travel Company Owner journey stage 5: Engagement", "alt": "Enterprise journey panel for stage 5 of \"From spreadsheets and a legacy back office to one travel ERP\": Engagement."}]}, {"stage": "Retention", "narrative": "Renewal is not a discussion: revenue per FTE is up, the SGR report takes an afternoon, and the onboarding consultant has become the owner's process adviser. The owner joins the customer advisory group, adds the reseller portal module, and gives the reference call to the next operator considering the switch.", "media": [{"type": "image", "src": "media/journey-town-town-1-6.png", "title": "Travel Company Owner journey stage 6: Retention", "alt": "Enterprise journey panel for stage 6 of \"From spreadsheets and a legacy back office to one travel ERP\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-town-town-1.png", "title": "Travel Company Owner customer journey: From spreadsheets and a legacy back office to one travel ERP", "alt": "Enterprise journey storyboard for \"From spreadsheets and a legacy back office to one travel ERP\" for customer \"Travel Company Owner\"."}]}, {"id": "journey-town-2", "name": "Launching the own-brand real-time booking website", "linkedJobIds": ["jtbd-town-2"], "summary": "A tailor-made specialist's owner adopts the platform website and online booking module to lift the direct online share: triggered by rising reseller commissions, discovered through the platform's SPoE case studies, evaluated on conversion economics, piloted on one product line, and retained on measured online share.", "stages": [{"stage": "Trigger", "narrative": "The annual channel review shows 45 percent of bookings still coming through resellers and bed banks at 10 to 15 percent commission, while the agency website is a brochure that sends travelers to a contact form. A competitor's real-time bookable site appears in the same Google results with prices and availability.", "media": [{"type": "image", "src": "media/journey-town-town-2-1.png", "title": "Travel Company Owner journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"Launching the own-brand real-time booking website\": Trigger."}]}, {"stage": "Discovery", "narrative": "The owner already uses the back office and sees in the vendor newsletter and a user-day session that the customer website module reads availability and prices live from the same product data; a peer specialist demonstrates how a completed web booking simply appears as a booking file with the deposit paid through a Mollie link.", "media": [{"type": "image", "src": "media/journey-town-town-2-2.png", "title": "Travel Company Owner journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"Launching the own-brand real-time booking website\": Discovery."}]}, {"stage": "Evaluation", "narrative": "The evaluation is about economics and brand: the module cost against commission saved per online booking, whether the CMS supports the agency's design and multi-language content, how quotes and online bookings coexist for tailor-made products, and whether Trustpilot reviews and package-travel information can be shown correctly. A reference site of a similar specialist decides it.", "media": [{"type": "image", "src": "media/journey-town-town-2-3.png", "title": "Travel Company Owner journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"Launching the own-brand real-time booking website\": Evaluation."}]}, {"stage": "Trial", "narrative": "The pilot puts one product line with fixed departures online with real-time booking while tailor-made journeys stay quote-led with online proposal approval. The first web bookings arrive with deposits paid, no desk involvement and correct documents; conversion and abandonment are tracked from day one.", "media": [{"type": "image", "src": "media/journey-town-town-2-4.png", "title": "Travel Company Owner journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"Launching the own-brand real-time booking website\": Trial."}]}, {"stage": "Engagement", "narrative": "The whole catalogue moves online over two seasons, campaigns from the CRM drive traffic to bookable pages, reviews are collected automatically after each trip, and the customer portal lets travelers rebook. The owner starts pricing reseller products differently now that direct share is measurable.", "media": [{"type": "image", "src": "media/journey-town-town-2-5.png", "title": "Travel Company Owner journey stage 5: Engagement", "alt": "Enterprise journey panel for stage 5 of \"Launching the own-brand real-time booking website\": Engagement."}]}, {"stage": "Retention", "narrative": "Online booking share passes the target the owner set at evaluation, distribution cost per booking falls, and the website has become the brand's main sales channel. The owner extends the subscription to the marketing and BI modules and treats the vendor as part of the growth plan rather than as an IT cost.", "media": [{"type": "image", "src": "media/journey-town-town-2-6.png", "title": "Travel Company Owner journey stage 6: Retention", "alt": "Enterprise journey panel for stage 6 of \"Launching the own-brand real-time booking website\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-town-town-2.png", "title": "Travel Company Owner customer journey: Launching the own-brand real-time booking website", "alt": "Enterprise journey storyboard for \"Launching the own-brand real-time booking website\" for customer \"Travel Company Owner\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-town-top", "name": "Revenue per FTE", "description": "Annual travel revenue (gross booking value) handled per full-time employee of the travel organisation, the owner's headline measure of scaling without headcount.", "unit": "EUR k / FTE / year", "currentValue": "620", "targetValue": "850", "link": "https://dashboard.example.com/tour-operator-erp-platform/customers/town/kpis/co-town-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-town-co-town-top.png"}, "branches": [{"id": "co-town-b1", "name": "Scalable operations", "description": "How much booking and departure volume the organisation absorbs per person, and at what margin, once re-keying and manual handling are removed.", "currentValue": "61", "icon": "kpi-town-co-town-b1.png", "children": [{"id": "co-town-b1-c1", "name": "Bookings handled per FTE", "description": "Confirmed bookings per full-time employee per year across desk, web and reseller channels.", "unit": "bookings / FTE / year", "currentValue": "410", "targetValue": "560", "icon": "kpi-town-co-town-b1-c1.png", "children": [{"id": "co-town-b1-c1-l1", "name": "Straight-through online booking share", "description": "Share of bookings created and paid online without any desk touch before confirmation.", "unit": "%", "currentValue": "34", "targetValue": "55", "icon": "kpi-town-co-town-b1-c1-l1.png", "children": []}, {"id": "co-town-b1-c1-l2", "name": "Manual re-keying incidents per 100 bookings", "description": "Corrections caused by data typed twice across product, booking, operations or finance records.", "unit": "incidents / 100 bookings", "currentValue": "6.5", "ta n": [{"id": "bo-town-b2-c1-l1", "name": "Demo-to-contract conversion rate", "description": "Share of demos on the prospect's own products that convert to a signed subscription.", "unit": "%", "currentValue": "28", "targetValue": "40", "icon": "kpi-town-bo-town-b2-c1-l1.png", "children": []}, {"id": "bo-town-b2-c1-l2", "name": "Reference-sourced lead share", "description": "Share of new leads originating from reference customers, user days and ANVR or VVKR networks.", "unit": "%", "currentValue": "35", "targetValue": "50", "icon": "kpi-town-bo-town-b2-c1-l2.png", "children": []}]}, {"id": "bo-town-b2-c2", "name": "Logo churn rate", "description": "Share of tenants that terminate their subscription in a year.", "unit": "%", "currentValue": "5.5", "targetValue": "3.0", "icon": "kpi-town-bo-town-b2-c2.png", "children": [{"id": "bo-town-b2-c2-l1", "name": "Onboarding time to first live booking", "description": "Days from contract signature to the first real booking made in the platform.", "unit": "days", "currentValue": "95", "targetValue": "45", "icon": "kpi-town-bo-town-b2-c2-l1.png", "children": []}, {"id": "bo-town-b2-c2-l2", "name": "Subscription renewal rate", "description": "Share of contracts renewed at term without downgrade.", "unit": "%", "currentValue": "92", "targetValue": "96.5", "icon": "kpi-town-bo-town-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Give every travel organisation owner, from a EUR 129 per month start package to a 150-FTE enterprise contract, one travel ERP that runs the whole trade lifecycle and lets the business grow in bookings, brand and margin without growing the back office.", "timeHorizons": {"year1": {"focus": "Keep both brands live while making the combined platform the obvious choice for owners: shared portals and integrations, AI assistance for quotes and inbox triage, and professionalised onboarding with a migration plan and parallel run that de-risks the switch from spreadsheets and legacy back offices.", "productTheme": "One platform, two brands: safe migration and AI-assisted scaling", "customerKPI": {"northStar": "Revenue per FTE", "supporting": ["Bookings handled per FTE", "Manual re-keying incidents per 100 bookings"]}, "businessKPI": {"northStar": "Annual recurring revenue per tenant", "revenueStreams": ["ERP base subscriptions", "Module and portal add-ons", "Onboarding and migration services"], "supporting": ["Onboarding time to first live booking", "Demo-to-contract conversion rate"]}, "milestones": ["Publish a standard migration and parallel-run playbook with import tooling for legacy back offices and spreadsheets", "Ship the AI quote and inbox assistants to group and tailor-made tenants of both brands", "Cross-sell group-operations depth to tailor-made tenants and Visual Tour Builder to group operators"]}, "year3": {"focus": "Become the travel ERP standard for the Benelux trade under a single brand: a modular ERP where finance and compliance are a standard attach, a partner marketplace of integrations replaces bespoke connectors, and selective acquisitions add payments, apps and BI value.", "productTheme": "The Benelux travel-ERP standard with finance attach and partner marketplace", "customerKPI": {"northStar": "Revenue per FTE", "supporting": ["Operating margin", "Compliance readiness score"]}, "businessKPI": {"northStar": "Annual recurring revenue per tenant", "revenueStreams": ["Single-brand ERP subscriptions", "Finance and compliance module fees", "Partner marketplace revenue share"], "supporting": ["Finance module attach rate", "Net revenue retention"]}, "milestones": ["Launch the single-brand modular ERP with finance and compliance in the standard package", "Open the partner marketplace with certified payment, app, eSIM, accounting and marketing integrations", "Reach the majority of ANVR group and tailor-made operators as tenants"]}, "year5": {"focus": "Scale beyond the Netherlands and Belgium and let AI agents run routine operations under human supervision, so owners in several countries steer their business on platform data products such as margin benchmarks and demand forecasts.", "productTheme": "European scale and AI-run operations", "customerKPI": {"northStar": "Revenue per FTE", "supporting": ["Online booking share", "Management meetings run on live dashboard"]}, "businessKPI": {"northStar": "Annual recurring revenue per tenant", "revenueStreams": ["Multi-country ERP subscriptions", "AI operations agents", "Data products: margin benchmarks and demand forecasts"], "supporting": ["Upsell revenue share", "Logo churn rate"]}, "milestones": ["Go live with tenants in at least two new European markets with local compliance packs", "Run supplier requests, document generation and reconciliation through supervised AI agents for the majority of bookings", "Publish trade-wide margin and demand benchmarks as a subscribed data product"]}}}, "domain": "Travel Business Owners and Finance"};
