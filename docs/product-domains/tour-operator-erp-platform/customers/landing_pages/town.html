    const customerInsights = [{"id": "toe-01", "title": "One integrated data model, not two brands, is the strategic asset of the combined platform", "summary": "On 7 May 2026 Vortex Capital Partners acquired 1TIS and a majority stake in TravelSpirit to build one travel ERP platform: together the two systems serve 3,000+ daily users, process roughly \u20ac1.5 billion in annual travel revenue and employ about 40 people. Both brands stay live for now, with a single brand and strategy planned later.", "implication": "Every roadmap decision should be judged by whether it deepens the shared product-booking-passenger-payment-supplier record that portals, automation, AI and BI compound on; brand unification is secondary to data-model unification.", "priority": "high", "tags": ["platform", "data-model", "scale"], "sources": [{"id": "vortex-news", "title": "Vortex partners with 1TIS and TravelSpirit to accelerate growth", "url": "https://vortexcp.com/news/travel-software/", "publisher": "Vortex Capital Partners", "date": "2026-05-07"}, {"id": "livingstone-deal", "title": "Livingstone advised the shareholders of 1TIS on the sale to Vortex Capital Partners", "url": "https://livingstonepartners.com/transaction/livingstone-advised-the-shareholders-of-1tis-on-the-sale-to-vortex-capital-partners/", "publisher": "Livingstone Partners", "date": "2026-05-07"}, {"id": "vortex-investment", "title": "1TIS and TravelSpirit \u2014 investment", "url": "https://vortexcp.com/investment/1tis-travelspirit/", "publisher": "Vortex Capital Partners", "date": "2026-05-07"}], "link": {"customerId": "town", "jobIds": ["jtbd-town-1"], "kpiIds": ["co-town-top", "co-town-b1-c1", "bo-town-b1-c1"]}}, {"id": "toe-02", "title": "Group-travel depth and tailor-made flexibility are complementary segments to cross-sell, not competing products", "summary": "Livingstone and Vortex describe 1TIS as ERP for the travel industry with a focus on group travel and TravelSpirit as the complementary provider for tailor-made travel operators and DMCs; the investment thesis explicitly combines the two market positions and TravelSpirit adds advisory services for process optimisation across the customer journey.", "implication": "Model group-operations modules as an upsell to tailor-made tenants and the Visual Tour Builder as an upsell to group operators; measure cross-sell rather than treating the two customer groups as separate businesses.", "priority": "high", "tags": ["segments", "cross-sell", "positioning"], "sources": [{"id": "livingstone-deal", "title": "Livingstone advised the shareholders of 1TIS on the sale to Vortex Capital Partners", "url": "https://livingstonepartners.com/transaction/livingstone-advised-the-shareholders-of-1tis-on-the-sale-to-vortex-capital-partners/", "publisher": "Livingstone Partners", "date": "2026-05-07"}, {"id": "vortex-investment", "title": "1TIS and TravelSpirit \u2014 investment", "url": "https://vortexcp.com/investment/1tis-travelspirit/", "publisher": "Vortex Capital Partners", "date": "2026-05-07"}], "link": {"customerId": "town", "jobIds": ["jtbd-town-1"], "kpiIds": ["bo-town-b1-c1", "bo-town-b1-c2"]}}, {"id": "toe-03", "title": "Low-entry modular pricing sets the commercial model: land on a base package, expand per module and per user", "summary": "1TIS publishes a \u20ac129/month base package (CRM, booking registration, invoicing, mail integration, product management, alerts and documents) with optional modules at \u20ac10\u2013\u20ac25/month and pricing that scales with user licences. TravelSpirit publishes a Start package from \u20ac99/month for 1 user, Professional from \u20ac279/month for 3 users, Business from \u20ac899/month for 10 users, Enterprise from 30 users on request, and \u20ac65/month per extra user.", "implication": "Revenue growth per tenant comes from module attach and seat expansion, so instrument attach rates and seat activation as first-class business outcomes and design onboarding so a \u20ac99\u2013\u20ac129 tenant reaches its first live booking fast.", "priority": "high", "tags": ["pricing", "modular", "expansion"], "sources": [{"id": "1tis-groepsreizen", "title": "Software voor groepsreizen \u2014 1TIS", "url": "https://www.1tis.nl/software-voor/groepsreizen", "publisher": "1TIS", "date": "2026-09-03"}, {"id": "1tis-maatwerk", "title": "Software voor individuele maatwerkreizen \u2014 1TIS", "url": "https://www.1tis.nl/software-voor/individuele_maatwerkreizen", "publisher": "1TIS", "date": "2026-09-03"}, {"id": "travelspirit-pricing", "title": "TravelSpirit pricing \u2014 Start, Professional, Business, Enterprise", "url": "https://www.travelspirit.nl/pricing/", "publisher": "TravelSpirit", "date": "2026-09-03"}], "link": {"customerId": "town", "jobIds": ["jtbd-town-1", "jtbd-town-3"], "kpiIds": ["bo-town-top", "bo-town-b1-c1", "bo-town-b1-c2-l2", "bo-town-b2-c2-l1"]}}, {"id": "toe-07", "title": "Payments, accounting, apps and reviews come from a partner ecosystem, not from the ERP vendor", "summary": "TravelSpirit lists Mollie (payments and payment links), Exact (accounting), Spotler (email marketing), Travel Intelligence (BI), WeCloudIT (telephony), Airtrotter (availability), Travelia and Appit (mobile apps) and Hubby eSIM as partners. The partners are large horizontal platforms: Mollie states more than 250,000 businesses across Europe and a 1,000-strong team, Exact states more than 675,000 companies and 2,000 specialists, and Trustpilot reports 400 million+ reviews with 200,000+ written daily.", "implication": "Invest in an integration hub with connector-health and activation KPIs rather than building payments, ledgers or review engines; partner attach (accounting, payment links, apps, eSIM) is both a retention and an ancillary-revenue lever.", "priority": "high", "tags": ["integrations", "partners", "ecosystem"], "sources": [{"id": "travelspirit-partners", "title": "TravelSpirit partners", "url": "https://www.travelspirit.nl/partners/", "publisher": "TravelSpirit", "date": "2026-09-03"}, {"id": "mollie-about", "title": "About Mollie", "url": "https://www.mollie.com/about", "publisher": "Mollie", "date": "2026-09-03"}, {"id": "exact-home", "title": "Exact business software for SMEs and their accountants", "url": "https://www.exact.com/", "publisher": "Exact", "date": "2026-09-03"}, {"id": "trustpilot-business", "title": "Trustpilot Business: collect customer service and product reviews", "url": "https://business.trustpilot.com/", "publisher": "Trustpilot", "date": "2026-09-03"}], "link": {"customerId": "town", "jobIds": ["jtbd-town-3"], "kpiIds": ["bo-town-b1-c1-l1", "bo-town-b1-c1-l2"]}}, {"id": "toe-09", "title": "Guarantee-fund participation is a hard, per-booking compliance attach in the Dutch trade", "summary": "SGR has 650 participants and, together with the GGTO fund for smaller operators integrated into SGR since January 2025 (nearly 350 participants), approaches 1,000; the fund reports \u20ac220 million own capital and a 200% Solvency II ratio. SGR's consumer-contribution regulation obliges participants to pay a \u20ac5 per-person contribution (per booking in some cases) on package travel, linked travel arrangements, transport and accommodation agreements, with the participant that receives the customer's payment liable for the levy.", "implication": "Guarantee-fund levies, participant reporting and the SGR logo on booking confirmations must be native to the booking and invoicing flow; measure report preparation time and on-time filings as finance outcomes.", "priority": "high", "tags": ["compliance", "sgr", "guarantee-fund"], "sources": [{"id": "sgr-travmagazine", "title": "SGR laat coronacrisis definitief achter zich", "url": "https://www.travmagazine.nl/sgr-laat-coronacrisis-definitief-achter-zich/", "publisher": "TravMagazine", "date": "2026-08-24"}, {"id": "sgr-consumentenbijdrage", "title": "Uitvoeringsregeling Consumentenbijdrage SGR (versie 202403)", "url": "https://www.sgr.nl/app/uploads/SGR-Uitvoeringsregeling-Consumentenbijdrage-202403.pdf", "publisher": "Stichting Garantiefonds Reisgelden", "date": "2024-03-01"}], "link": {"customerId": "town", "jobIds": ["jtbd-town-3"], "kpiIds": ["co-town-b2-c2", "co-town-b2-c2-l1"]}}, {"id": "toe-10", "title": "The revised Package Travel Directive changes deposit, refund and complaint flows for every organiser", "summary": "Directive (EU) 2015/2302 already obliges organisers to provide insolvency protection, to give clear pre-contractual information, to allow free cancellation when the price rises by more than 8%, and to be liable for performance regardless of who delivers the services. The Commission proposed a revision on 29 November 2023 and Council and Parliament reached a provisional agreement on 2 December 2025: complaints must be acknowledged within 7 days and answered within 60 days, vouchers are allowed as refund alternatives only with traveller consent and are insolvency-protected, the proposed EU-wide 25% downpayment cap was replaced by national limits, and member states get 28 months to transpose.", "implication": "Build deposit schedules, refund and voucher handling, complaint SLAs and pre-contractual information forms as configurable compliance rules per country, ready before transposition deadlines rather than as tenant-by-tenant customisation.", "priority": "high", "tags": ["regulation", "package-travel", "eu"], "sources": [{"id": "ec-ptd", "title": "Package travel directive \u2014 Directive (EU) 2015/2302", "url": "https://commission.europa.eu/law/law-topic/consumer-protection-law/travel-and-timeshare-law/package-travel-directive_en", "publisher": "European Commission", "date": "2026-09-03"}, {"id": "ep-ptd-train", "title": "Revision of the package travel Directive (REFIT) \u2014 legislative train", "url": "https://www.europarl.europa.eu/legislative-train/theme-supporting-people-strengthening-our-societies-and-our-social-model/file-revision-of-the-package-travel-directive", "publisher": "European Parliament", "date": "2026-06-20"}], "link": {"customerId": "town", "jobIds": ["jtbd-town-3"], "kpiIds": ["co-town-b2-c2"]}}, {"id": "toe-11", "title": "Dutch holiday demand is large, outbound and car-heavy, which keeps coach and group products alive", "summary": "CBS counts 21.9 million summer holidays in 2025 taken by 10.8 million people, 72% of residents aged 15+; 12.9 million were abroad and 9.0 million domestic, with France (2.15 million), Germany (1.73 million), Spain (1.35 million), Belgium (1.15 million) and Italy (1.11 million) the top foreign destinations. 13.4 million holidays were by car, 4.9 million by plane and 1.7 million by train; participation ranged from 41% in the lowest-income households to 87% in the highest.", "implication": "Departure yielding and capacity decisions for coach and group products should be modelled around nearby European destinations and seasonal peaks; the addressable market for the operators on the platform is measured in millions of trips, not niche volumes.", "priority": "medium", "tags": ["market", "netherlands", "demand"], "sources": [{"id": "cbs-zomer-2025", "title": "Bijna 22 miljoen zomervakanties in 2025, Frankrijk populairste bestemming", "url": "https://www.cbs.nl/nl-nl/nieuws/2026/27/bijna-22-miljoen-zomervakanties-in-2025-frankrijk-populairste-bestemming", "publisher": "CBS (Statistics Netherlands)", "date": "2026-07-03"}], "link": {"customerId": "town", "jobIds": ["jtbd-town-2"], "kpiIds": ["co-town-b2-c1"]}}, {"id": "toe-12", "title": "European travel is overwhelmingly intra-EU, so multi-country operation is the expansion path", "summary": "Eurostat reports 1.19 billion trips by EU residents in 2024 (up 4.4% on 2023), of which 850 million were domestic (71%) and 250 million to other EU countries (21%), so 92% of trips were intra-EU; residents spent \u20ac618 billion, on average \u20ac518 per person per trip, with foreign trips averaging 8 nights. Compliance under the Package Travel Directive in one member state is sufficient to sell to consumers in another.", "implication": "Multi-language, multi-currency and per-country compliance rules are the prerequisites for the year-5 horizon beyond the Netherlands and Belgium; DMCs and suppliers across the EU are the natural first cross-border users of the portals.", "priority": "medium", "tags": ["europe", "expansion", "market"], "sources": [{"id": "eurostat-intra-eu", "title": "Wanderlust within: 92% of EU residents' trips are intra-EU", "url": "https://ec.europa.eu/eurostat/web/products-eurostat-news/w/ddn-20251010-3", "publisher": "Eurostat", "date": "2025-10-10"}, {"id": "ec-ptd", "title": "Package travel directive \u2014 Directive (EU) 2015/2302", "url": "https://commission.europa.eu/law/law-topic/consumer-protection-law/travel-and-timeshare-law/package-travel-directive_en", "publisher": "European Commission", "date": "2026-09-03"}], "link": {"customerId": "town", "jobIds": ["jtbd-town-1", "jtbd-town-2"], "kpiIds": ["bo-town-b2-c1"]}}, {"id": "toe-13", "title": "The addressable trade is a long tail of small, organised operators that buy through associations and references", "summary": "ANVR has around 400 members, a few large enterprises and a large majority of SMEs; VvKR unites 546 small-scale travel specialists (founded 2011) that all offer a travel guarantee on package tours and carry mandatory liability insurance. TravelSpirit is a member of ANVR and VVKR and states that 100+ travel companies use its software; 1TIS states more than 140 travel organisations across the Netherlands, Belgium and Germany.", "implication": "Go-to-market runs through associations, reference customers and low-friction start packages; measure reference-sourced leads and tenant counts per segment rather than enterprise pipeline alone.", "priority": "medium", "tags": ["market", "associations", "go-to-market"], "sources": [{"id": "anvr-vno", "title": "Branchevereniging aan het woord: ANVR, de brancheorganisatie voor ondernemers in de reisbranche", "url": "https://www.vno-ncw.nl/artikelen/branchevereniging-aan-het-woord-anvr-de-brancheorganisatie-voor-ondernemers-in-de-reisbranche", "publisher": "VNO-NCW", "date": "2022-05-18"}, {"id": "vvkr-over", "title": "Over VvKR \u2014 Vereniging van Kleinschalige Reisorganisaties", "url": "https://www.vvkr.nl/over-vvkr", "publisher": "VvKR", "date": "2026-09-03"}, {"id": "travelspirit-home", "title": "TravelSpirit \u2014 travel software voor elke fase van de customer journey", "url": "https://www.travelspirit.nl/", "publisher": "TravelSpirit", "date": "2026-09-03"}, {"id": "1tis-over-ons", "title": "Over ons \u2014 1TIS", "url": "https://www.1tis.nl/over-ons", "publisher": "1TIS", "date": "2026-09-03"}], "link": {"customerId": "town", "jobIds": ["jtbd-town-1"], "kpiIds": ["bo-town-b2-c1", "bo-town-b2-c1-l2"]}}, {"id": "toe-14", "title": "A 40-person company can only reach ERP-standard status by embedding AI and automation into the office work", "summary": "Vortex's thesis is to build a market-leading travel ERP by enhancing product capabilities, embedding AI, professionalising the organisation and making selective acquisitions; the combined company has about 40 employees and 1TIS states 20 employees who develop everything in-house with Dutch programmers for more than 140 travel organisations. Michiel Stoffels (CEO) and Rico van Loenen (CPO) lead the combination.", "implication": "AI assistants for reply drafting, inbox triage and itinerary drafting are the scaling lever for both the vendor and its tenants; measure assistant acceptance and attach as leading indicators of revenue per FTE on both sides.", "priority": "high", "tags": ["ai", "automation", "organisation"], "sources": [{"id": "vortex-investment", "title": "1TIS and TravelSpirit \u2014 investment", "url": "https://vortexcp.com/investment/1tis-travelspirit/", "publisher": "Vortex Capital Partners", "date": "2026-05-07"}, {"id": "vortex-news", "title": "Vortex partners with 1TIS and TravelSpirit to accelerate growth", "url": "https://vortexcp.com/news/travel-software/", "publisher": "Vortex Capital Partners", "date": "2026-05-07"}, {"id": "1tis-over-ons", "title": "Over ons \u2014 1TIS", "url": "https://www.1tis.nl/over-ons", "publisher": "1TIS", "date": "2026-09-03"}], "link": {"customerId": "town", "jobIds": ["jtbd-town-1"], "kpiIds": ["co-town-top", "co-town-b1-c1"]}}];

    function jobNamesForCustomer(jobIds) {
        const jobs = (customer.jobsToBeDone || []);
        const jobLookup = {};
        jobs.forEach(job => {
            if (job.id) {
                jobLookup[job.id] = job.name || job.id;
            }
        });
        return (jobIds || []).map(jobId => jobLookup[jobId] || jobId);
    }

    function kpiNamesForLink(link) {
        // Prefer stable KPI IDs resolved against this customer's KPI pyramid; fall back to legacy display-name kpis.
        if (link && link.kpiIds && link.kpiIds.length) {
            const lookup = {};
            function walk(node) {
                if (!node) return;
                if (node.id) {
                    lookup[node.id] = node.name || node.id;
                }
                (node.branches || []).forEach(walk);
                (node.children || []).forEach(walk);
            }
            const pyramids = (customer || {}).kpiPyramids || {};
            ['customerOutcomes', 'businessOutcomes'].forEach(key => {
                const pyramid = pyramids[key];
                if (!pyramid) return;
                walk(pyramid.top);
                (pyramid.branches || []).forEach(walk);
            });
            return link.kpiIds.map(kpiId => lookup[kpiId] || kpiId);
        }
        return (link && link.kpis) || [];
    }

    function kpiIconFile(node) {
        return (node && node.icon) ? node.icon : 'kpi.png';
    }

    function kpiCurrentValue(node) {
        if (!node || !node.currentValue) {
            return '';
        }
        return String(node.currentValue) + (node.unit ? ' (' + String(node.unit) + ')' : '');
    }

    function kpiValueStatusLabel(node) {
        if (!node || !node.valueStatus) {
            return '';
        }
        const labels = {
            example: 'illustrative example',
            baseline: 'measured baseline',
            target: 'target',
            placeholder: 'placeholder'
        };
        return labels[node.valueStatus] || String(node.valueStatus);
    }

    function renderKpiMeta(node) {
        let html = '';
        if (node && node.currentValue) {
            const statusLabel = kpiValueStatusLabel(node);
            const valueLabel = (node.valueStatus === 'target') ? 'Target:' : 'Current:';
            html += '<div style="font-size: 80%; color: #1d4ed8; margin-top: 4px"><b>' + valueLabel + '</b> ' + escapeHtml(kpiCurrentValue(node));
            if (statusLabel) {
                html += ' <span style="color:#888; font-style: italic;">(' + escapeHtml(statusLabel) + ')</span>';
            }
            html += '</div>';
        }
        if (node && node.target) {
            html += '<div style="font-size: 80%; color: #047857; margin-top: 2px"><b>Target:</b> ' + escapeHtml(String(node.target)) + '</div>';

            html += '<div style="font-size: 76%; color: #6b7280; margin-top: 3px">';
            if (node.period) { html += '<div><b>Period:</b> ' + escapeHtml(String(node.period)) + '</div>'; }
            if (node.calculationMethod) { html += '<div><b>How measured:</b> ' + escapeHtml(String(node.calculationMethod)) + '</div>'; }
            if (node.valueSource) { html += '<div><b>Value source:</b> ' + escapeHtml(String(node.valueSource)) + '</div>'; }

        if (node && node.guardrail) {
            html += '<div style="font-size: 76%; color: #7c3aed; margin-top: 3px"><b>Composite guardrail:</b> ' + escapeHtml(String(node.guardrail)) + '</div>';

    function normalizeRoadmapKpi(value, supportingKey) {
        if (!value) {
            return {northStar: '', [supportingKey]: []};
        }
        if (typeof value === 'string') {
            return {northStar: value, [supportingKey]: []};
        }
        const normalized = Object.assign({}, value);
        normalized.northStar = normalized.northStar || normalized.name || '';
        normalized[supportingKey] = normalized[supportingKey] || [];
        return normalized;
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function formatDate(dateValue) {
        if (!dateValue) return 'No date';
        const date = new Date(dateValue + 'T00:00:00');
        if (isNaN(date.getTime())) return dateValue;
        return date.toLocaleDateString('en-GB', {year: 'numeric', month: 'short', day: 'numeric'});
    }

    function renderKpis(items) {
        let html = '';
        items.forEach(item => {
            html += '<div><b>' + escapeHtml(item.kpi) + '</b>';
            if (item.unit) {
                html += ' <span class="activity-muted">(' + escapeHtml(item.unit) + ')</span>';
            }
            if (item.expectedImpact) {
                html += ': ' + escapeHtml(item.expectedImpact);
            }
            if (item.currentValue) {
                html += '<div class="activity-muted"><b>Current:</b> ' + escapeHtml(String(item.currentValue)) + '</div>';
            }
            if (item.description) {
                html += '<div class="activity-muted">' + escapeHtml(item.description) + '</div>';
            }
            if (item.link) {
                html += '<div class="activity-muted"><a target="_blank" rel="noopener noreferrer" href="' + escapeHtml(item.link) + '">' + escapeHtml(item.linkLabel || 'Open link') + '</a></div>';
            }
            html += '</div>';
        });
        return html;
    }

    function renderImpactCell(item, currentCustomerId) {
        let html = '';
        (item.customerImpact || []).forEach(impact => {
            const isCurrent = impact.customerId === currentCustomerId;
            html += '<div class="activity-block' + (isCurrent ? ' activity-pill-highlight' : '') + '">';
            html += '<div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">';
            html += '<img class="activity-icon activity-icon-round" src="../icons/' + escapeHtml(impact.customer.icon) + '" onerror="this.onerror=null;this.src=\'../icons/customer.png\'">';
            html += '<div><div style="font-weight:bold; color:' + (isCurrent ? '#1d4ed8' : '#111827') + '">' + escapeHtml(impact.customer.name) + ' <span class="activity-muted">(' + escapeHtml(impact.customerId) + ')</span></div></div>';
            html += '</div>';
            html += renderKpis(impact.customerKPIs || []);
            html += renderKpis(impact.businessKPIs || []);
            html += '</div>';
        });
        return html || '<span class="activity-muted">No customer impact listed</span>';
    }

    function renderBrickCell(item) {
        let html = '';
        (item.productBricks || []).forEach(brick => {
            html += '<div class="activity-pill">';
            html += '<img class="activity-icon" src="../../product-bricks/icons/' + escapeHtml(brick.brick.icon) + '" onerror="this.onerror=null;this.src=\'../../product-bricks/icons/logo.png\'">';
            html += '<div><div><b>' + escapeHtml(brick.brick.name) + '</b> <span class="activity-muted">(#' + escapeHtml(brick.brickId) + ')</span></div><div class="activity-muted">' + escapeHtml(brick.change) + '</div></div>';
            html += '</div>';
        });
        return html || '<span class="activity-muted">No product bricks listed</span>';
    }

    function renderChannelCell(item) {
        let html = '';
        (item.deliveryChannels || []).forEach(channel => {
            html += '<div class="activity-pill">';
            html += '<img class="activity-icon" src="../../product-deployments/icons/' + escapeHtml(channel.channel.icon) + '" onerror="this.onerror=null;this.src=\'../../product-deployments/icons/product.png\'">';
            html += '<div><div><b>' + escapeHtml(channel.channel.name) + '</b> <span class="activity-muted">(' + escapeHtml(channel.channelId) + ')</span></div><div class="activity-muted">' + escapeHtml(channel.change) + '</div></div>';
            html += '</div>';
        });
        return html || '<span class="activity-muted">No delivery channels listed</span>';
    }

    function renderActivityTable(data, kind, currentCustomerId) {
        const items = (data && data.items) ? data.items : [];
        let html = '';
        html += '<div class="activity-summary">';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.length + '</div><div class="activity-stat-label">' + kind + '</div></div>';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.filter(item => (item.customerImpact || []).length > 0).length + '</div><div class="activity-stat-label">With customer impact</div></div>';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.filter(item => (item.productBricks || []).length > 0).length + '</div><div class="activity-stat-label">With bricks</div></div>';
        html += '</div>';

        if (!items.length) {
            html += '<div class="group" style="margin-top:0">No related ' + kind.toLowerCase() + ' found for this customer.</div>';
            return html;
        }

        html += '<table class="activity-table">';
        html += '<tr><th>Date</th><th>Description</th><th>Customer Impact</th><th>Product Bricks</th><th>Delivery Channels</th></tr>';
        items.forEach(item => {
            html += '<tr>';
            html += '<td style="white-space:nowrap">' + escapeHtml(formatDate(item.date)) + '</td>';
            html += '<td><a class="activity-link" target="_blank" rel="noopener noreferrer" href="../../' + kind.toLowerCase() + '/landing_pages/' + item.landingPageIndex + '.html">' + escapeHtml(item.description || item.name || kind) + '</a></td>';
            html += '<td>' + renderImpactCell(item, currentCustomerId) + '</td>';
            html += '<td>' + renderBrickCell(item) + '</td>';
            html += '<td>' + renderChannelCell(item) + '</td>';
            html += '</tr>';
        });
        html += '</table>';
        return html;
    }

    addHeader();
    addHome();
    addJBTD();
    addJourneys();
    addKPIs();
    addProductVision();
    addInsights();


</script>

    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Tour Operator ERP Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Customers"
    },
    {
      "label": "Travel Company Owner"
    }
  ]
};
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
