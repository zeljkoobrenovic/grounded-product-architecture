ions or insurance, deposit and balance payments, and cancellations under the operator's conditions, without touching three systems.", "outcome": "Every amendment is recorded once on the booking file and flows to invoice, supplier request, operational lists and traveler documents automatically, and no option quietly expires that could have been a booking.", "steps": [{"step": "Convert options before they expire", "description": "Work the list of options approaching expiry, contact the customer with a personalised reminder, and convert or release the option so held seats and rooms go back on sale.", "streamsNeeded": [{"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "howItSupports": "Lists expiring options per agent and converts an option into a booking with all captured data intact."}, {"id": "market-and-retain-customers", "name": "Market and Retain Customers", "howItSupports": "Sends the option reminder through email or SMS with a link to confirm online."}], "media": [{"type": "image", "src": "media/jbtd-resa-jtbd-resa-2-1.png", "title": "Reservations and Sales Agent JTBD step 1: Convert options before they expire", "alt": "Enterprise infographic for step 1 of the job \"Handle changes, options and payments without re-keying\": Convert options before they expire."}]}, {"step": "Process amendments on the booking file", "description": "Apply name changes, room type changes, an added excursion, an extra night, a different pick-up point or an insurance product, with the price difference and conditions calculated and the supplier and operations consequences triggered.", "streamsNeeded": [{"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "howItSupports": "Applies the amendment to the booking file, recalculates the price and reissues the confirmation."}, {"id": "request-and-confirm-supplier-services", "name": "Request and Confirm Supplier Services", "howItSupports": "Raises the change request to the hotel, DMC or coach company when the amendment affects a confirmed service."}], "media": [{"type": "image", "src": "media/jbtd-resa-jtbd-resa-2-2.png", "title": "Reservations and Sales Agent JTBD step 2: Process amendments on the booking file", "alt": "Enterprise infographic for step 2 of the job \"Handle changes, options and payments without re-keying\": Process amendments on the booking file."}]}, {"step": "Take payments and chase deposits and balances", "description": "See which bookings have an outstanding deposit or balance, send payment links and reminders, register bank transfers and card payments, and answer the customer's questions about what is due and when.", "streamsNeeded": [{"id": "collect-payments-and-invoice", "name": "Collect Payments and Invoice", "howItSupports": "Shows outstanding amounts per booking, sends payment links and reminders and reconciles received payments automatically."}], "media": [{"type": "image", "src": "media/jbtd-resa-jtbd-resa-2-3.png", "title": "Reservations and Sales Agent JTBD step 3: Take payments and chase deposits and balances", "alt": "Enterprise infographic for step 3 of the job \"Handle changes, options and payments without re-keying\": Take payments and chase deposits and balances."}]}, {"step": "Handle cancellations and refunds under the conditions", "description": "Cancel a booking or a single traveler, apply the operator's cancellation scale and insurance claims, issue the credit note or refund, and release inventory and supplier services.", "streamsNeeded": [{"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "howItSupports": "Applies the cancellation conditions, releases seats and rooms and updates the booking status."}, {"id": "collect-payments-and-invoice", "name": "Collect Payments and Invoice", "howItSupports": "Issues the credit note and refund and updates the customer's balance."}, {"id": "settle-suppliers-and-close-books", "name": "Settle Suppliers and Close Books", "howItSupports": "Records supplier cancellation costs so the margin impact is visible to finance."}], "media": [{"type": "image", "src": "media/jbtd-resa-jtbd-resa-2-4.png", "title": "Reservations and Sales Agent JTBD step 4: Handle cancellations and refunds under the conditions", "alt": "Enterprise infographic for step 4 of the job \"Handle changes, options and payments without re-keying\": Handle cancellations and refunds under the conditions."}]}], "media": [{"type": "image", "src": "media/jbtd-resa-jtbd-resa-2.png", "title": "Reservations and Sales Agent JTBD infographic: Handle changes, options and payments without re-keying", "alt": "Enterprise infographic for the job \"Handle changes, options and payments without re-keying\" for customer \"Reservations and Sales Agent\"."}]}, {"id": "jtbd-resa-3", "name": "Answer any customer question from one booking view", "whatItIs": "Answer the questions customers call and email about: is my trip guaranteed, did you receive my payment, where are my documents, can I change my room, who is my guide, and what is the pick-up time, from a single booking view that shows every fact and every previous contact.", "outcome": "The customer gets a correct answer in the first contact, the contact is logged on the booking, and questions that a traveler could answer themselves are routed to the my-trip portal instead of the phone queue.", "steps": [{"step": "Recognise the caller and open the booking file", "description": "Let telephony and email integration open the right booking file when the customer calls or writes, including the party, departure status, payment status and document status at a glance.", "streamsNeeded": [{"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "howItSupports": "Pops the booking file on incoming calls and links incoming emails to the right dossier."}, {"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "howItSupports": "Shows what the traveler already received and viewed in the my-trip portal, so the agent knows what they have seen."}], "media": [{"type": "image", "src": "media/jbtd-resa-jtbd-resa-3-1.png", "title": "Reservations and Sales Agent JTBD step 1: Recognise the caller and open the booking file", "alt": "Enterprise infographic for step 1 of the job \"Answer any customer question from one booking view\": Recognise the caller and open the booking file."}]}, {"step": "Answer status questions in one view", "description": "See whether the departure is guaranteed, whether the deposit and balance are received, whether documents are released, which guide and pick-up point apply, and what the supplier confirmed, without switching to operations or finance.", "streamsNeeded": [{"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "howItSupports": "Surfaces document and itinerary status per traveler."}, {"id": "collect-payments-and-invoice", "name": "Collect Payments and Invoice", "howItSupports": "Shows received and outstanding payments per booking in real time."}, {"id": "operate-group-departures", "name": "Operate Group Departures", "howItSupports": "Exposes departure guarantee status, guide assignment and pick-up times to the desk."}], "media": [{"type": "image", "src": "media/jbtd-resa-jtbd-resa-3-2.png", "title": "Reservations and Sales Agent JTBD step 2: Answer status questions in one view", "alt": "Enterprise infographic for step 2 of the job \"Answer any customer question from one booking view\": Answer status questions in one view."}]}, {"step": "Steer travelers to self-service", "description": "For questions about documents, passenger details, payment and wishes, send the traveler a link to their my-trip page or app so that the next question does not become a phone call.", "streamsNeeded": [{"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "howItSupports": "Provides the my-trip portal and app where travelers view documents, pay, and enter passenger details and wishes themselves."}], "media": [{"type": "image", "src": "media/jbtd-resa-jtbd-resa-3-3.png", "title": "Reservations and Sales Agent JTBD step 3: Steer travelers to self-service", "alt": "Enterprise infographic for step 3 of the job \"Answer any customer question from one booking view\": Steer travelers to self-service."}]}, {"step": "Log the contact and set the follow-up", "description": "Record the contact reason and outcome on the booking, create a task or alert when something must be checked with operations or a supplier, and let the AI assistant draft the follow-up reply.", "streamsNeeded": [{"id": "market-and-retain-customers", "name": "Market and Retain Customers", "howItSupports": "Keeps the contact history on the customer profile so later campaigns and reviews use it."}, {"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "howItSupports": "Creates the follow-up task on the booking and drafts the reply from the booking context."}], "media": [{"type": "image", "src": "media/jbtd-resa-jtbd-resa-3-4.png", "title": "Reservations and Sales Agent JTBD step 4: Log the contact and set the follow-up", "alt": "Enterprise infographic for step 4 of the job \"Answer any customer question from one booking view\": Log the contact and set the follow-up."}]}], "media": [{"type": "image", "src": "media/jbtd-resa-jtbd-resa-3.png", "title": "Reservations and Sales Agent JTBD infographic: Answer any customer question from one booking view", "alt": "Enterprise infographic for the job \"Answer any customer question from one booking view\" for customer \"Reservations and Sales Agent\"."}]}], "customerJourneyStories": [{"id": "journey-resa-1", "name": "From three screens to one booking desk", "linkedJobIds": ["jtbd-resa-1", "jtbd-resa-3"], "summary": "A reservations agent at a group and tailor-made operator experiences the employer's move from a legacy booking application, a separate email client and a payment spreadsheet to one integrated booking desk with telephony and email built in, from scepticism at the announcement to becoming the desk's power user.", "stages": [{"stage": "Trigger", "narrative": "The agent's morning starts with the booking application, a shared mailbox, a payment spreadsheet from finance and a printed list of expiring options. A customer calls to ask whether her payment arrived and the agent puts her on hold to check three places. Management announces that the company will replace the booking application with an integrated travel ERP before the next season.", "media": [{"type": "image", "src": "media/journey-resa-resa-1-1.png", "title": "Reservations and Sales Agent journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"From three screens to one booking desk\": Trigger."}]}, {"stage": "Discovery", "narrative": "The agent is invited to a vendor demo the owner has arranged after seeing the system at another operator. On screen, an incoming call opens the customer's booking, the payment status is on the same page, and a reply is drafted from the booking context. Colleagues who worked at an operator already on the platform describe how the desk works there.", "media": [{"type": "image", "src": "media/journey-resa-resa-1-2.png", "title": "Reservations and Sales Agent journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"From three screens to one booking desk\": Discovery."}]}, {"stage": "Evaluation", "narrative": "The agent joins the key-user group that tests the desk with the company's own products: how fast a booking with four travelers and two pick-up points is made, whether options and amendments behave like the operator's conditions, and how the payment link and my-trip page appear to a customer. The group asks for the telephony integration to be part of the go-live.", "media": [{"type": "image", "src": "media/journey-resa-resa-1-3.png", "title": "Reservations and Sales Agent journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"From three screens to one booking desk\": Evaluation."}]}, {"stage": "Trial", "narrative": "During a two-week parallel run, the key users handle real inquiries in the new desk while the rest of the team stays on the old application. The agent makes her first booking in one contact with confirmation and payment link sent before hanging up, and the first amendment flows to the invoice without a call to finance.", "media": [{"type": "image", "src": "media/journey-resa-resa-1-4.png", "title": "Reservations and Sales Agent journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"From three screens to one booking desk\": Trial."}]}, {"stage": "Engagement", "narrative": "After go-live the desk is where the agent lives all day: calls pop the booking file, options are worked from a queue, and payment questions are answered from the same screen. The agent starts steering travelers to the my-trip page for documents and passenger details, and the phone queue in the week before departures becomes quieter.", "media": [{"type": "image", "src": "media/journey-resa-resa-1-5.png", "title": "Reservations and Sales Agent journey stage 5: Engagement", "alt": "Enterprise journey panel for stage 5 of \"From three screens to one booking desk\": Engagement."}]}, {"stage": "Retention", "narrative": "Six months in, the agent's handling time per booking has halved and she trains new colleagues on the desk. When the vendor introduces the AI office assistant, the team asks to be in the pilot, and the owner cites the desk's numbers when renewing the subscription with more seats.", "media": [{"type": "image", "src": "media/journey-resa-resa-1-6.png", "title": "Reservations and Sales Agent journey stage 6: Retention", "alt": "Enterprise journey panel for stage 6 of \"From three screens to one booking desk\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-resa-resa-1.png", "title": "Reservations and Sales Agent customer journey: From three screens to one booking desk", "alt": "Enterprise journey storyboard for \"From three screens to one booking desk\" for customer \"Reservations and Sales Agent\"."}]}, {"id": "journey-resa-2", "name": "Letting the AI assistant draft the reply", "linkedJobIds": ["jtbd-resa-2", "jtbd-resa-1"], "summary": "With the booking desk established, the operator enables the AI office assistant; the agent moves from suspicion that it will produce wrong quotes to relying on it to triage the inbox and draft replies and amendments that she checks and sends.", "stages": [{"stage": "Trigger", "narrative": "The Monday inbox holds two hundred emails: option confirmations, change requests, payment questions and new inquiries mixed together. Two customers complain about waiting three days for a reply. The operator's owner enables the AI office assistant add-on that the vendor has been previewing since the two brands unified their roadmap.", "media": [{"type": "image", "src": "media/journey-resa-resa-2-1.png", "title": "Reservations and Sales Agent journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"Letting the AI assistant draft the reply\": Trigger."}]}, {"stage": "Discovery", "narrative": "The agent first sees the assistant in the vendor's release notes and in a short lunch session where the vendor shows it classifying an inbox into inquiries, changes and payments and drafting a reply from the booking file. A colleague at another operator reports that the assistant's drafts are usually right because they are built from the same booking data.", "media": [{"type": "image", "src": "media/journey-resa-resa-2-2.png", "title": "Reservations and Sales Agent journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"Letting the AI assistant draft the reply\": Discovery."}]}, {"stage": "Evaluation", "narrative": "The agent tests the assistant on last week's emails: does it recognise the booking, does it propose the right departure alternatives, does it respect the cancellation scale, and does it clearly mark a draft as unsent? The team agrees that every draft is reviewed by an agent and that the assistant never sends on its own.", "media": [{"type": "image", "src": "media/journey-resa-resa-2-3.png", "title": "Reservations and Sales Agent journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"Letting the AI assistant draft the reply\": Evaluation."}]}, {"stage": "Trial", "narrative": "For two weeks the assistant triages the shared mailbox and drafts replies for payment and document questions only. The agent edits about a third of the drafts, accepts the rest, and the answer time for those categories drops from days to hours.", "media": [{"type": "image", "src": "media/journey-resa-resa-2-4.png", "title": "Reservations and Sales Agent journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"Letting the AI assistant draft the reply\": Trial."}]}, {"stage": "Engagement", "narrative": "The assistant now drafts amendment confirmations and first replies to new inquiries with priced alternatives, and flags emails that need operations or finance. The agent spends her time on the customers on the phone and on closing options, not on typing the same answer forty times.", "media": [{"type": "image", "src": "media/journey-resa-resa-2-5.png", "title": "Reservations and Sales Agent journey stage 5: Engagement", "alt": "Enterprise journey panel for stage 5 of \"Letting the AI assistant draft the reply\": Engagement."}]}, {"stage": "Retention", "narrative": "When the operator reviews the add-on after a season, the agent's team shows the reply time and the conversion of inquiries that got a same-day answer. The operator keeps the assistant, extends it to the tailor-made desk, and the agent contributes prompts to the vendor's shared template library.", "media": [{"type": "image", "src": "media/journey-resa-resa-2-6.png", "title": "Reservations and Sales Agent journey stage 6: Retention", "alt": "Enterprise journey panel for stage 6 of \"Letting the AI assistant draft the reply\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-resa-resa-2.png", "title": "Reservations and Sales Agent customer journey: Letting the AI assistant draft the reply", "alt": "Enterprise journey storyboard for \"Letting the AI assistant draft the reply\" for customer \"Reservations and Sales Agent\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-resa-top", "name": "Quote-to-booking conversion rate", "description": "Share of priced quotes and options issued by the reservations desk that become confirmed bookings within the option period. Modeled seed value for a Dutch group and tailor-made operator, not an official 1TIS or TravelSpirit figure.", "unit": "%", "currentValue": "31", "targetValue": "42", "link": "https://dashboard.example.com/tour-operator-erp-platform/customers/resa/kpis/co-resa-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-resa-co-resa-top.png"}, "branches": [{"id": "co-resa-b1", "name": "Speed of service", "description": "How fast an inquiry becomes a quote, an option or a booking, and how much manual typing stands in the way.", "currentValue": "62", "icon": "kpi-resa-co-resa-b1.png", "children": [{"id": "co-resa-b1-c1", "name": "Booking handling time", "description": "Average agent time from the start of an inquiry to a confirmed booking or dated option, including confirmation and payment link.", "unit": "minutes", "currentValue": "18", "targetValue": "9", "icon": "kpi-resa-co-resa-b1-c1.png", "children": [{"id": "co-resa-b1-c1-l1", "name": "Bookings completed in one contact", "description": "Share of inquiries that end the first contact as a booking or option without a call-back.", "unit": "%", "currentValue": "58", "targetValue": "80", "icon": "kpi-resa-co-resa-b1-c1-l1.png", "children": []}, {"id": "co-resa-b1-c1-l2", "name": "Re-keyed fields per booking", "description": "Number of data fields the agent types more than once across booking, invoice, supplier request and document systems.", "unit": "fields per booking", "currentValue": "11", "targetValue": "0", "icon": "kpi-resa-co-resa-b1-c1-l2.png", "children": []}]}, {"id": "co-resa-b1-c2", "name": "Quote response time", "description": "Average elapsed time from an email or web inquiry to the first priced reply.", "unit": "hours", "currentValue": "6.5", "targetValue": "1.5", "icon": "kpi-resa-co-resa-b1-c2.png", "children": [{"id": "co-resa-b1-c2-l1", "name": "AI-drafted reply usage rate", "description": "Share of outgoing desk replies that started from an assistant draft built on the booking or inquiry context.", "unit": "%", "currentValue": "0", "targetValue": "60", "icon": "kpi-resa-co-resa-b1-c2-l1.png", "children": []}, {"id": "co-resa-b1-c2-l2", "name": "Inbox triage backlog at end of day", "description": "Number of unanswered inquiry, change and payment emails in the shared mailbox at close of business.", "unit": "emails", "currentValue": "24", "targetValue": "5", "icon": "kpi-resa-co-resa-b1-c2-l2.png", "children": []}]}]}, {"id": "co-resa-b2", "name": "Service quality", "description": "Whether customers get the right answer and the right booking the first time.", "currentValue": "68", "icon": "kpi-resa-co-resa-b2.png", "children": [{"id": "co-resa-b2-c1", "name": "First-contact resolution rate", "description": "Share of customer contacts resolved in the first call or reply without a hand-off to operations or finance.", "unit": "%", "currentValue": "67", "targetValue": "88", "icon": "kpi-resa-co-resa-b2-c1.png", "children": [{"id": "co-resa-b2-c1-l1", "name": "Payment status questions self-served", "description": "Share of payment and document status questions answered by the traveler in the my-trip portal rather than by the desk.", "unit": "%", "currentValue": "35", "targetValue": "75", "icon": "kpi-resa-co-resa-b2-c1-l1.png", "children": []}, {"id": "co-resa-b2-c1-l2", "name": "Booking view completeness score", "description": "Share of desk contacts where departure, payment, document and supplier status were all visible on the booking file without switching applications.", "unit": "%", "currentValue": "72", "targetValue": "95", "icon": "kpi-resa-co-resa-b2-c1-l2.png", "children": []}]}, {"id": "co-resa-b2-c2", "name": "Booking error rate", "description": "Share of bookings requiring a correction after confirmation because of a desk error such as wrong name, room type, pick-up point or price.", "unit": "%", "currentValue": "4.8", "targetValue": "1.2", "icon": "kpi-resa-co-resa-b2-c2.png", "children": [{"id": "co-resa-b2-c2-l1", "name": "Option expiry conversion rate", "description": "Share of options converted to bookings before expiry.", "unit": "%", "currentValue": "44", "targetValue": "62", "icon": "kpi-resa-co-resa-b2-c2-l1.png", "children": []}, {"id": "co-resa-b2-c2-l2", "name": "Amendment rework rate", "description": "Share of amendments that had to be redone because the change did not reach invoice, supplier or documents correctly.", "unit": "%", "currentValue": "9", "targetValue": "2", "icon": "kpi-resa-co-resa-b2-c2-l2.png", "children": []}]}]}]}, "businessOutcomes": {"top": {"id": "bo-resa-top", "name": "Bookings processed per agent seat", "description": "Average number of bookings and options created per licensed reservations seat per month across all tenants during the season. Modeled seed value.", "unit": "bookings per seat per month", "currentValue": "165", "targetValue": "260", "link": "https://dashboard.example.com/tour-operator-erp-platform/customers/resa/kpis/bo-resa-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-resa-bo-resa-top.png"}, "branches": [{"id": "bo-resa-b1", "name": "Booking desk adoption", "description": "How many agents work in the desk daily and how quickly the AI office assistant becomes part of their routine.", "currentValue": "55", "icon": "kpi-resa-bo-resa-b1.png", "children": [{"id": "bo-resa-b1-c1", "name": "Active agent seats", "description": "Number of licensed reservations and sales seats across all tenants active in the booking desk in the month.", "unit": "seats", "currentValue": "1400", "targetValue": "2200", "icon": "kpi-resa-bo-resa-b1-c1.png", "children": [{"id": "bo-resa-b1-c1-l1", "name": "Agent seat activation within 30 days", "description": "Share of newly licensed seats that created a booking within thirty days of provisioning.", "unit": "%", "currentValue": "70", "targetValue": "92", "icon": "kpi-resa-bo-resa-b1-c1-l1.png", "children": []}, {"id": "bo-resa-b1-c1-l2", "name": "Daily active agent share", "description": "Share of licensed agent seats active on an average working day in the season.", "unit": "%", "currentValue": "78", "targetValue": "92", "icon": "kpi-resa-bo-resa-b1-c1-l2.png", "children": []}]}, {"id": "bo-resa-b1-c2", "name": "AI office assistant attach rate", "description": "Share of tenants with reservations seats that license the AI office assistant add-on.", "unit": "%", "currentValue": "0", "targetValue": "55", "icon": "kpi-resa-bo-resa-b1-c2.png", "children": [{"id": "bo-resa-b1-c2-l1", "name": "Assistant suggestions accepted", "description": "Share of assistant drafts and triage labels accepted by agents without major edits.", "unit": "%", "currentValue": "0", "targetValue": "65", "icon": "kpi-resa-bo-resa-b1-c2-l1.png", "children": []}, {"id": "bo-resa-b1-c2-l2", "name": "Assistant add-on revenue per tenant", "description": "Average monthly recurring revenue from the AI office assistant per tenant that licenses it.", "unit": "EUR per month", "currentValue": "0", "targetValue": "180", "icon": "kpi-resa-bo-resa-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-resa-b2", "name": "Booking flow value", "description": "How much of the booking volume flows straight through the platform, and what the desk seats are worth.", "currentValue": "51", "icon": "kpi-resa-bo-resa-b2.png", "children": [{"id": "bo-resa-b2-c1", "name": "Straight-through booking share", "description": "Share of bookings whose confirmation, invoice, payment and supplier request were created without manual intervention outside the desk flow.", "unit": "%", "currentValue": "46", "targetValue": "75", "icon": "kpi-resa-bo-resa-b2-c1.png", "children": [{"id": "bo-resa-b2-c1-l1", "name": "Bookings with automated confirmation", "description": "Share of bookings whose confirmation, invoice and payment link were sent automatically at creation.", "unit": "%", "currentValue": "52", "targetValue": "90", "icon": "kpi-resa-bo-resa-b2-c1-l1.png", "children": []}, {"id": "bo-resa-b2-c1-l2", "name": "Support tickets per 1,000 bookings", "description": "Number of vendor support tickets raised by desk users per thousand bookings created.", "unit": "tickets per 1,000 bookings", "currentValue": "14", "targetValue": "5", "icon": "kpi-resa-bo-resa-b2-c1-l2.png", "children": []}]}, {"id": "bo-resa-b2-c2", "name": "Booking desk seat revenue", "description": "Annual recurring revenue from reservations and sales seats across all tenants.", "unit": "EUR k per year", "currentValue": "1650", "targetValue": "2900", "icon": "kpi-resa-bo-resa-b2-c2.png", "children": [{"id": "bo-resa-b2-c2-l1", "name": "Seat expansion rate", "description": "Net growth of licensed desk seats within existing tenants per year.", "unit": "%", "currentValue": "6", "targetValue": "15", "icon": "kpi-resa-bo-resa-b2-c2-l1.png", "children": []}, {"id": "bo-resa-b2-c2-l2", "name": "Seat churn rate", "description": "Share of licensed desk seats cancelled per year, excluding seasonal downsizing that is re-activated.", "unit": "%", "currentValue": "5", "targetValue": "2.5", "icon": "kpi-resa-bo-resa-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Give every reservations agent one booking desk where the customer, the trip, the payment and the supplier are on the same screen and the assistant has the reply half written, so the desk converts more and types less.", "timeHorizons": {"year1": {"focus": "Unify the 1TIS and TravelSpirit booking desks on a shared CRM, telephony and email integration, and put the first AI office assistant for inbox triage and reply drafting in the hands of agents at both brands.", "productTheme": "One desk, one screen, assisted replies", "customerKPI": {"northStar": "Quote-to-booking conversion rate", "supporting": ["Booking handling time", "AI-drafted reply usage rate"]}, "businessKPI": {"northStar": "Bookings processed per agent seat", "revenueStreams": ["Group Travel ERP and Tailor-Made Suite seat subscriptions", "AI office assistant add-on", "Telephony and email integration add-ons"], "supporting": ["Active agent seats", "AI office assistant attach rate"]}, "milestones": ["Ship the shared booking file view with payment, document, departure and supplier status for both brands", "Release the AI office assistant for inbox triage and draft replies with agent review at ten pilot tenants", "Make automated confirmation, invoice and payment link the default booking flow at every tenant"]}, "year3": {"focus": "Make the desk the Benelux standard for travel sales work: straight-through bookings, self-service for status questions, and an assistant that handles amendments and priced alternatives inside the operator's conditions.", "productTheme": "Straight-through booking desk", "customerKPI": {"northStar": "Quote-to-booking conversion rate", "supporting": ["First-contact resolution rate", "Option expiry conversion rate"]}, "businessKPI": {"northStar": "Straight-through booking share", "revenueStreams": ["Modular Travel ERP seat subscriptions", "AI office assistant add-on", "Payments and my-trip portal attach"], "supporting": ["Bookings with automated confirmation", "Seat expansion rate"]}, "milestones": ["Extend the assistant to draft amendments, cancellations and priced alternatives within the tenant's conditions", "Route payment and document status questions to the my-trip portal by default with desk fallback", "Reach straight-through processing for the majority of desk bookings, including supplier requests"]}, "year5": {"focus": "Let the assistant run routine desk work across languages and markets: it answers, amends and converts under the agent's supervision, while agents focus on complex sales and service moments.", "productTheme": "Supervised AI on the sales desk", "customerKPI": {"northStar": "Quote-to-booking conversion rate", "supporting": ["Quote response time", "Booking error rate"]}, "businessKPI": {"northStar": "Booking desk seat revenue", "revenueStreams": ["Multi-country seat subscriptions", "AI desk agent add-ons", "Conversion and service benchmark data products"], "supporting": ["Assistant suggestions accepted", "Seat churn rate"]}, "milestones": ["Deploy a desk agent that converts simple inquiries and options end to end with agent approval per tenant policy", "Support multilingual desks for operators in Belgium, Germany and the Nordics with the same assistant", "Publish conversion and response-time benchmarks per segment from anonymised cross-tenant data"]}}}, "domain": "Group and Coach Tour Operators"}, {"id": "tspc", "name": "Tailor-Made Travel Specialist", "description": "Builds individual journeys at a tailor-made travel specialist such as Van Verre, Tenzing Travel, SNP Natuurreizen, S-Cape Travel, Matoke Tours or Pin High Golftravel: composes day-by-day itineraries from stored accommodations, transport, activities and content, sends visual online proposals, iterates with the client, closes at target margin, and gets every component confirmed by lodges, DMCs and guides before the travel documents go out. Usually a destination expert with sales targets, working in a team of two to fifteen specialists whose employer licenses the suite.", "icon": "tspc.png", "careAbout": ["A proposal that looks like the trip, with photos, maps and a day-by-day story, out the door the same day as the inquiry", "Building from sample itineraries and a component library with this season's contracted rates, not from old Word files", "Seeing the margin of the file while swapping components, so upgrades and discounts are conscious decisions", "Every lodge, transfer and guide confirmed in writing before documents are released, without an inbox of chasers", "Versions and client reactions on one online quote instead of attachments and email threads", "The accepted proposal becoming the trip file, the documents and the app itinerary without retyping"], "winsThem": ["A drag-and-drop Visual Tour Builder that starts from sample itineraries and prices components from contracted rates as they are placed", "Customised online quotes the client can open on any device, comment on, forward to travel companions and accept with a deposit payment", "A confirmation board per file with supplier requests, expiries, rejections and counter-offers, fed by the supplier portal", "An AI assistant that drafts the first itinerary from the brief and writes the follow-up and supplier chasers for the specialist to check", "Flight imports and passenger self-service that fill the file before supplier requests go out"], "theirFear": ["Losing the client to a competitor whose proposal arrived first and looked better", "Selling a file at a margin that evaporates when the lodge sends this season's price", "A family arriving at a lodge that never confirmed, because the request sat in someone's inbox"], "jobsToBeDone": [{"id": "jtbd-tspc-1", "name": "Turn a travel wish into a compelling visual proposal fast", "whatItIs": "Take a lead's travel wish (three weeks in Namibia with children, a golf week in the Algarve, a self-drive through Scotland) and compose a day-by-day itinerary from stored accommodations, transport, activities and content in the Visual Tour Builder, priced at the target margin and published as a customised online quote with photos, maps and texts.", "outcome": "The client receives a personal, visual proposal within a day of the inquiry, built from priced components rather than from scratch, and the specialist has spent an hour, not an afternoon.", "steps": [{"step": "Qualify the lead and capture travel wishes", "description": "Register the inquiry from the website form, phone call or referral in the CRM with travel period, party, budget, interests, pace and must-haves, check whether the lead is a returning client, and decide which sample itinerary comes closest.", "streamsNeeded": [{"id": "market-and-retain-customers", "name": "Market and Retain Customers", "howItSupports": "Captures the lead with source and consent and shows history for returning clients so the proposal starts from what they loved last time."}, {"id": "quote-and-sell-tailor-made-trips", "name": "Quote and Sell Tailor-Made Trips", "howItSupports": "Opens the quote with the captured wishes as the brief the itinerary is built against."}], "media": [{"type": "image", "src": "media/jbtd-tspc-jtbd-tspc-1-1.png", "title": "Tailor-Made Travel Specialist JTBD step 1: Qualify the lead and capture travel wishes", "alt": "Enterprise infographic for step 1 of the job \"Turn a travel wish into a compelling visual proposal fast\": Qualify the lead and capture travel wishes."}]}, {"step": "Compose the itinerary in the Visual Tour Builder", "description": "Start from a sample itinerary or a previous trip file, then drag and drop accommodations, transfers, flights, rental cars, guided activities and free days onto the day-by-day plan, swapping components while the map and the trip photos update.", "streamsNeeded": [{"id": "quote-and-sell-tailor-made-trips", "name": "Quote and Sell Tailor-Made Trips", "howItSupports": "Provides the drag-and-drop day-by-day builder with sample itineraries, component search and automatic map and text generation."}, {"id": "build-and-price-travel-products", "name": "Build and Price Travel Products", "howItSupports": "Supplies the component library with descriptions, photos, seasons and contracted rates that the builder draws from."}], "media": [{"type": "image", "src": "media/jbtd-tspc-jtbd-tspc-1-2.png", "title": "Tailor-Made Travel Specialist JTBD step 2: Compose the itinerary in the Visual Tour Builder", "alt": "Enterprise infographic for step 2 of the job \"Turn a travel wish into a compelling visual proposal fast\": Compose the itinerary in the Visual Tour Builder."}]}, {"step": "Price the itinerary at the target margin", "description": "Let the builder calculate purchase cost per component from contracted rates and seasons, apply the company's margin rule per component type and market, add flights and insurance, and check the total against the client's budget before deciding on upgrades or cheaper alternatives.", "streamsNeeded": [{"id": "build-and-price-travel-products", "name": "Build and Price Travel Products", "howItSupports": "Calculates purchase costs and applies margin rules per component so the sales price is consistent with the company's targets."}, {"id": "quote-and-sell-tailor-made-trips", "name": "Quote and Sell Tailor-Made Trips", "howItSupports": "Shows margin and total against budget while the specialist swaps components, and warns when the file falls below target."}], "media": [{"type": "image", "src": "media/jbtd-tspc-jtbd-tspc-1-3.png", "title": "Tailor-Made Travel Specialist JTBD step 3: Price the itinerary at the target margin", "alt": "Enterprise infographic for step 3 of the job \"Turn a travel wish into a compelling visual proposal fast\": Price the itinerary at the target margin."}]}, {"step": "Publish the customised online quote", "description": "Generate the online proposal with the client's name, day-by-day story, photos from the media library, map, inclusions, price and conditions, and send it as a personal link that the client can read on any device and react to.", "streamsNeeded": [{"id": "quote-and-sell-tailor-made-trips", "name": "Quote and Sell Tailor-Made Trips", "howItSupports": "Publishes the itinerary as a personalised online quote page with photos, maps, pricing and an accept button."}, {"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "howItSupports": "Reuses the same itinerary content later for the travel documents and the my-trip app, so nothing is written twice."}], "media": [{"type": "image", "src": "media/jbtd-tspc-jtbd-tspc-1-4.png", "title": "Tailor-Made Travel Specialist JTBD step 4: Publish the customised online quote", "alt": "Enterprise infographic for step 4 of the job \"Turn a travel wish into a compelling visual proposal fast\": Publish the customised online quote."}]}], "media": [{"type": "image", "src": "media/jbtd-tspc-jtbd-tspc-1.png", "title": "Tailor-Made Travel Specialist JTBD infographic: Turn a travel wish into a compelling visual proposal fast", "alt": "Enterprise infographic for the job \"Turn a travel wish into a compelling visual proposal fast\" for customer \"Tailor-Made Travel Specialist\"."}]}, {"id": "jtbd-tspc-2", "name": "Close the proposal at target margin", "whatItIs": "Guide the client from the first proposal to an accepted trip: handle their reactions and change wishes in new versions of the online quote, follow up at the right moment, protect the margin through the iterations, and let the client accept and pay the deposit online so the trip file opens with all data in place.", "outcome": "The client accepts a version of the proposal that is still at or above target margin, pays the deposit online, and the trip file is open with travelers, components and flights without retyping.", "steps": [{"step": "Iterate versions with the client in the online quote", "description": "Read the client's comments on the quote, swap or upgrade components, add or remove days, and publish a new version that keeps the history so the client can compare and the specialist can see what changed.", "streamsNeeded": [{"id": "quote-and-sell-tailor-made-trips", "name": "Quote and Sell Tailor-Made Trips", "howItSupports": "Manages quote versions with change tracking and republishing so the client always sees the latest proposal and the specialist keeps the trail."}, {"id": "market-and-retain-customers", "name": "Market and Retain Customers", "howItSupports": "Records the client's engagement with each version, such as opens and time on page, to guide the next contact."}], "media": [{"type": "image", "src": "media/jbtd-tspc-jtbd-tspc-2-1.png", "title": "Tailor-Made Travel Specialist JTBD step 1: Iterate versions with the client in the online quote", "alt": "Enterprise infographic for step 1 of the job \"Close the proposal at target margin\": Iterate versions with the client in the online quote."}]}, {"step": "Follow up at the right moment", "description": "Use workflow alerts on quote opens, days since last contact and travel period to call or email at the moment the client is deciding, with the AI assistant drafting the follow-up from the quote context.", "streamsNeeded": [{"id": "market-and-retain-customers", "name": "Market and Retain Customers", "howItSupports": "Triggers follow-up tasks and drafts from engagement signals and the sales cadence the company has set."}, {"id": "quote-and-sell-tailor-made-trips", "name": "Quote and Sell Tailor-Made Trips", "howItSupports": "Shows the pipeline of open quotes with value, margin and next action per specialist."}], "media": [{"type": "image", "src": "media/jbtd-tspc-jtbd-tspc-2-2.png", "title": "Tailor-Made Travel Specialist JTBD step 2: Follow up at the right moment", "alt": "Enterprise infographic for step 2 of the job \"Close the proposal at target margin\": Follow up at the right moment."}]}, {"step": "Accept online, pay the deposit and open the trip file", "description": "Let the client accept the quote and pay the deposit through the online link, which converts the quote into a trip file with components, prices, conditions and traveler placeholders, and sends the confirmation and invoice.", "streamsNeeded": [{"id": "quote-and-sell-tailor-made-trips", "name": "Quote and Sell Tailor-Made Trips", "howItSupports": "Converts the accepted quote into a trip file without re-entry."}, {"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "howItSupports": "Creates the booking with conditions and insurance and issues the confirmation."}, {"id": "collect-payments-and-invoice", "name": "Collect Payments and Invoice", "howItSupports": "Collects the deposit through the payment link and records it on the file."}], "media": [{"type": "image", "src": "media/jbtd-tspc-jtbd-tspc-2-3.png", "title": "Tailor-Made Travel Specialist JTBD step 3: Accept online, pay the deposit and open the trip file", "alt": "Enterprise infographic for step 3 of the job \"Close the proposal at target margin\": Accept online, pay the deposit and open the trip file."}]}, {"step": "Register travelers and flights", "description": "Collect passenger details through the my-trip page, import the booked flights from the GDS or ticketing partner into the file, and check that names, dates and passports match before supplier requests go out.", "streamsNeeded": [{"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "howItSupports": "Imports flight bookings and tickets into the trip file and validates passenger data against them."}, {"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "howItSupports": "Lets travelers enter their own passport and contact details in the my-trip portal."}], "media": [{"type": "image", "src": "media/jbtd-tspc-jtbd-tspc-2-4.png", "title": "Tailor-Made Travel Specialist JTBD step 4: Register travelers and flights", "alt": "Enterprise infographic for step 4 of the job \"Close the proposal at target margin\": Register travelers and flights."}]}], "media": [{"type": "image", "src": "media/jbtd-tspc-jtbd-tspc-2.png", "title": "Tailor-Made Travel Specialist JTBD infographic: Close the proposal at target margin", "alt": "Enterprise infographic for the job \"Close the proposal at target margin\" for customer \"Tailor-Made Travel Specialist\"."}]}, {"id": "jtbd-tspc-3", "name": "Confirm every ad-hoc component with suppliers before departure", "whatItIs": "For a tailor-made trip, every lodge, transfer, guide and activity is an individual request to a supplier or DMC, often in another time zone. Turn the trip file into supplier requests, chase confirmations, replace what is rejected, and lock the itinerary before documents go out.", "outcome": "Every component in the file is confirmed in writing by its supplier before the travel documents are released, rejections are replaced without losing the client's approval, and the final itinerary matches what suppliers will deliver.", "steps": [{"step": "Generate supplier requests from the trip file", "description": "Create requests per supplier from the file's component lines with dates, pax, room types, pick-up times and contracted prices, send them through the supplier portal, email or the DMC's own system, and set expiry dates so nothing waits unnoticed.", "streamsNeeded": [{"id": "request-and-confirm-supplier-services", "name": "Request and Confirm Supplier Services", "howItSupports": "Creates structured requests per supplier from the file's components and tracks them per trip with expiry and status."}], "media": [{"type": "image", "src": "media/jbtd-tspc-jtbd-tspc-3-1.png", "title": "Tailor-Made Travel Specialist JTBD step 1: Generate supplier requests from the trip file", "alt": "Enterprise infographic for step 1 of the job \"Confirm every ad-hoc component with suppliers before departure\": Generate supplier requests from the trip file."}]}, {"step": "Chase confirmations and resolve rejections", "description": "Watch the confirmation status per component, remind suppliers before expiry, and when a lodge is full or a guide unavailable, swap in an alternative from the component library, re-price if needed, and confirm the change with the client.", "streamsNeeded": [{"id": "request-and-confirm-supplier-services", "name": "Request and Confirm Supplier Services", "howItSupports": "Shows pending, confirmed and rejected components per trip and logs every supplier answer with the file."}, {"id": "quote-and-sell-tailor-made-trips", "name": "Quote and Sell Tailor-Made Trips", "howItSupports": "Lets the specialist swap the rejected component and republish the itinerary version for the client's approval."}], "media": [{"type": "image", "src": "media/jbtd-tspc-jtbd-tspc-3-2.png", "title": "Tailor-Made Travel Specialist JTBD step 2: Chase confirmations and resolve rejections", "alt": "Enterprise infographic for step 2 of the job \"Confirm every ad-hoc component with suppliers before departure\": Chase confirmations and resolve rejections."}]}, {"step": "Lock the itinerary and produce documents", "description": "Once all components are confirmed and the balance is paid, freeze the file, generate the travel documents, vouchers and the day-by-day itinerary for the my-trip app, and record supplier contact details for the traveler's emergency card.", "streamsNeeded": [{"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "howItSupports": "Generates documents, vouchers and the app itinerary from the confirmed file."}, {"id": "request-and-confirm-supplier-services", "name": "Request and Confirm Supplier Services", "howItSupports": "Provides the confirmation numbers and supplier contacts that appear on vouchers."}], "media": [{"type": "image", "src": "media/jbtd-tspc-jtbd-tspc-3-3.png", "title": "Tailor-Made Travel Specialist JTBD step 3: Lock the itinerary and produce documents", "alt": "Enterprise infographic for step 3 of the job \"Confirm every ad-hoc component with suppliers before departure\": Lock the itinerary and produce documents."}]}, {"step": "Hand over to finance and aftercare", "description": "Pass the confirmed file to finance for supplier settlement and the balance invoice, and set the aftercare cadence: pre-departure check, in-trip contact, and the review request after return.", "streamsNeeded": [{"id": "collect-payments-and-invoice", "name": "Collect Payments and Invoice", "howItSupports": "Issues the balance invoice and confirms the file is fully paid before departure."}, {"id": "settle-suppliers-and-close-books", "name": "Settle Suppliers and Close Books", "howItSupports": "Prepares supplier invoice matching against the confirmed components."}, {"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "howItSupports": "Schedules pre-departure, in-trip and post-trip contacts and the review request."}], "media": [{"type": "image", "src": "media/jbtd-tspc-jtbd-tspc-3-4.png", "title": "Tailor-Made Travel Specialist JTBD step 4: Hand over to finance and aftercare", "alt": "Enterprise infographic for step 4 of the job \"Confirm every ad-hoc component with suppliers before departure\": Hand over to finance and aftercare."}]}], "media": [{"type": "image", "src": "media/jbtd-tspc-jtbd-tspc-3.png", "title": "Tailor-Made Travel Specialist JTBD infographic: Confirm every ad-hoc component with suppliers before departure", "alt": "Enterprise infographic for the job \"Confirm every ad-hoc component with suppliers before departure\" for customer \"Tailor-Made Travel Specialist\"."}]}], "customerJourneyStories": [{"id": "journey-tspc-1", "name": "From Word documents to the Visual Tour Builder", "linkedJobIds": ["jtbd-tspc-1", "jtbd-tspc-2"], "summary": "A tailor-made specialist at a Dutch long-haul specialist experiences the company's move from proposals written in Word and priced in Excel to the Visual Tour Builder and online quotes, from the busy season that exposed the old way to becoming the colleague who builds the sample itineraries everyone starts from.", "stages": [{"stage": "Trigger", "narrative": "In the January peak the specialist has thirty open inquiries and writes each proposal in Word, copying hotel texts from old files and pricing in a spreadsheet that does not know this season's rates. Two clients book elsewhere because the proposal came a week late, and one file goes out with last year's price. The owner decides that proposals must come out of the system.", "media": [{"type": "image", "src": "media/journey-tspc-tspc-1-1.png", "title": "Tailor-Made Travel Specialist journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"From Word documents to the Visual Tour Builder\": Trigger."}]}, {"stage": "Discovery", "narrative": "The specialist hears from a former colleague at a competitor that their proposals are visual online pages built by dragging components onto a day-by-day plan. The owner comes back from a VVKR members' meeting with the same story about TravelSpirit's Visual Tour Builder, and the team watches a demo built on one of their own Namibia itineraries.", "media": [{"type": "image", "src": "media/journey-tspc-tspc-1-2.png", "title": "Tailor-Made Travel Specialist journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"From Word documents to the Visual Tour Builder\": Discovery."}]}, {"stage": "Evaluation", "narrative": "The team evaluates the builder against staying on Word and against a stand-alone itinerary tool: does it use the company's own contracted rates, does the online quote look like the brand, how fast can a proposal be built from a sample itinerary, does the accepted quote become a trip file, and what happens with the ten years of old proposals. The vendor's process advice on component structure settles the question.", "media": [{"type": "image", "src": "media/journey-tspc-tspc-1-3.png", "title": "Tailor-Made Travel Specialist journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"From Word documents to the Visual Tour Builder\": Evaluation."}]}, {"stage": "Trial", "narrative": "The specialist builds the first ten sample itineraries and uses the builder for all new Southern Africa inquiries for a month while colleagues stay on Word. Proposals go out the same day as online pages, and the first client accepts online and pays the deposit before the specialist has called back.", "media": [{"type": "image", "src": "media/journey-tspc-tspc-1-4.png", "title": "Tailor-Made Travel Specialist journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"From Word documents to the Visual Tour Builder\": Trial."}]}, {"stage": "Engagement", "narrative": "The whole team builds in the tool. Sample itineraries and the component library grow with each trip, margin per file is visible while building, versions replace email attachments, and the specialist follows a pipeline of open quotes instead of a folder of documents. The online quote becomes the thing clients forward to their travel companions.", "media": [{"type": "image", "src": "media/journey-tspc-tspc-1-5.png", "title": "Tailor-Made Travel Specialist journey stage 5: Engagement", "alt": "Enterprise journey panel for stage 5 of \"From Word documents to the Visual Tour Builder\": Engagement."}]}, {"stage": "Retention", "narrative": "After the first full season the specialist's proposal turnaround has dropped from two days to hours and acceptance has risen. The company renews, adds the my-trip app so the itinerary content is reused for travelers, and the specialist presents the company's setup at the vendor's user day.", "media": [{"type": "image", "src": "media/journey-tspc-tspc-1-6.png", "title": "Tailor-Made Travel Specialist journey stage 6: Retention", "alt": "Enterprise journey panel for stage 6 of \"From Word documents to the Visual Tour Builder\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-tspc-tspc-1.png", "title": "Tailor-Made Travel Specialist customer journey: From Word documents to the Visual Tour Builder", "alt": "Enterprise journey storyboard for \"From Word documents to the Visual Tour Builder\" for customer \"Tailor-Made Travel Specialist\"."}]}, {"id": "journey-tspc-2", "name": "From inbox chasing to confirmed components", "linkedJobIds": ["jtbd-tspc-3", "jtbd-tspc-2"], "summary": "Once proposals live in the builder, the specialist adopts structured supplier requests and the AI assistant for the unglamorous part of the job: getting every lodge, transfer and guide confirmed before documents go out, without an inbox full of chasers.", "stages": [{"stage": "Trigger", "narrative": "A family departs for Costa Rica with a lodge that was never confirmed; the request sat in a colleague's inbox during her holiday. The specialist keeps a private spreadsheet of pending confirmations per file and knows it will fail again. The company wants supplier confirmations tracked on the file itself.", "media": [{"type": "image", "src": "media/journey-tspc-tspc-2-1.png", "title": "Tailor-Made Travel Specialist journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"From inbox chasing to confirmed components\": Trigger."}]}, {"stage": "Discovery", "narrative": "During the vendor's quarterly release call, the specialist sees that the trip file can generate supplier requests per component, that DMCs and lodges can confirm through the supplier portal, and that the AI office assistant drafts and triages the supplier correspondence. A specialist at another operator shows her confirmation board during a user-group session.", "media": [{"type": "image", "src": "media/journey-tspc-tspc-2-2.png", "title": "Tailor-Made Travel Specialist journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"From inbox chasing to confirmed components\": Discovery."}]}, {"stage": "Evaluation", "narrative": "The team checks whether their main DMCs in Southern Africa and Latin America will work in the portal, how requests behave with expiry and counter-offers, whether the assistant drafts in English and Spanish, and how confirmation numbers flow into vouchers. Finance wants confirmed components to match supplier invoices.", "media": [{"type": "image", "src": "media/journey-tspc-tspc-2-3.png", "title": "Tailor-Made Travel Specialist journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"From inbox chasing to confirmed components\": Evaluation."}]}, {"stage": "Trial", "narrative": "Two destinations, one season: all component requests for Namibia and Costa Rica files are generated from the file and tracked on the confirmation board, with the two main DMCs on the portal. The assistant drafts reminders for expiring requests, and the specialist sees for the first time which files are not yet fully confirmed.", "media": [{"type": "image", "src": "media/journey-tspc-tspc-2-4.png", "title": "Tailor-Made Travel Specialist journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"From inbox chasing to confirmed components\": Trial."}]}, {"stage": "Engagement", "narrative": "Every file goes out with structured requests; the confirmation board replaces the private spreadsheet, rejected components are swapped in the builder and republished to the client, and documents are only released from fully confirmed files. The assistant handles routine supplier chasers and flags the answers that need a decision.", "media": [{"type": "image", "src": "media/journey-tspc-tspc-2-5.png", "title": "Tailor-Made Travel Specialist journey stage 5: Engagement", "alt": "Enterprise journey panel for stage 5 of \"From inbox chasing to confirmed components\": Engagement."}]}, {"stage": "Retention", "narrative": "The season ends without an unconfirmed departure. The operator makes the portal a standard clause in its DMC agreements and expands the assistant to all specialists, and the vendor uses the confirmation numbers as evidence in its next partner marketplace pitch.", "media": [{"type": "image", "src": "media/journey-tspc-tspc-2-6.png", "title": "Tailor-Made Travel Specialist journey stage 6: Retention", "alt": "Enterprise journey panel for stage 6 of \"From inbox chasing to confirmed components\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-tspc-tspc-2.png", "title": "Tailor-Made Travel Specialist customer journey: From inbox chasing to confirmed components", "alt": "Enterprise journey storyboard for \"From inbox chasing to confirmed components\" for customer \"Tailor-Made Travel Specialist\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-tspc-top", "name": "Proposal turnaround time", "description": "Elapsed time from a qualified tailor-made inquiry to the first personalised online proposal reaching the client. Modeled seed value for a Dutch long-haul specialist, not an official TravelSpirit figure.", "unit": "hours", "currentValue": "48", "targetValue": "8", "link": "https://dashboard.example.com/tour-operator-erp-platform/customers/tspc/kpis/co-tspc-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-tspc-co-tspc-top.png"}, "branches": [{"id": "co-tspc-b1", "name": "Proposal speed and quality", "description": "How fast a proposal is built and how often it convinces the client.", "currentValue": "57", "icon": "kpi-tspc-co-tspc-b1.png", "children": [{"id": "co-tspc-b1-c1", "name": "Proposal build time", "description": "Specialist hours to compose, price and publish the first version of a proposal.", "unit": "hours", "currentValue": "5.5", "targetValue": "1.5", "icon": "kpi-tspc-co-tspc-b1-c1.png", "children": [{"id": "co-tspc-b1-c1-l1", "name": "Sample itinerary reuse rate", "description": "Share of new proposals started from a sample itinerary or a previous trip file rather than from a blank plan.", "unit": "%", "currentValue": "35", "targetValue": "75", "icon": "kpi-tspc-co-tspc-b1-c1-l1.png", "children": []}, {"id": "co-tspc-b1-c1-l2", "name": "AI-drafted itinerary share", "description": "Share of proposals whose first day-by-day draft was generated by the assistant from the brief and the com  of the job \"Deliver ground services with correct passenger and room data\": Brief local guides and drivers."}]}, {"step": "Invoice the operator against confirmed services", "description": "Produce the invoice from the confirmed services and final passenger numbers, including acknowledged changes and no-shows, so the operator's finance team can match it automatically and pay on time.", "streamsNeeded": [{"id": "settle-suppliers-and-close-books", "name": "Settle Suppliers and Close Books", "howItSupports": "Matches the DMC invoice lines to confirmed services and passenger counts on the operator's side and flags deviations before payment."}, {"id": "collect-payments-and-invoice", "name": "Collect Payments and Invoice", "howItSupports": "Records the operator's payment against the invoice so both sides see the balance."}], "media": [{"type": "image", "src": "media/jbtd-dmcm-jtbd-dmcm-2-4.png", "title": "DMC Ground Operations Manager JTBD step 4: Invoice the operator against confirmed services", "alt": "Enterprise infographic for step 4 of the job \"Deliver ground services with correct passenger and room data\": Invoice the operator against confirmed services."}]}], "media": [{"type": "image", "src": "media/jbtd-dmcm-jtbd-dmcm-2.png", "title": "DMC Ground Operations Manager JTBD infographic: Deliver ground services with correct passenger and room data", "alt": "Enterprise infographic for the job \"Deliver ground services with correct passenger and room data\" for customer \"DMC Ground Operations Manager\"."}]}], "customerJourneyStories": [{"id": "journey-dmcm-1", "name": "From an inbox of PDFs to the operator's supplier portal", "linkedJobIds": ["jtbd-dmcm-1", "jtbd-dmcm-2"], "summary": "The ground operations manager of an incoming agency in Portugal is invited by a Dutch coach operator to handle its requests in the supplier portal of the operator's ERP; she moves from reluctance about yet another login to running the operator's whole programme through the portal and asking other clients to do the same.", "stages": [{"stage": "Trigger", "narrative": "A hotel change the DMC confirmed by email never reaches the operator's room list and forty travelers arrive at the wrong hotel. Both sides search three inboxes for who said what. The Dutch operator tells the DMC that from next season all requests, confirmations and room lists will go through its supplier portal.", "media": [{"type": "image", "src": "media/journey-dmcm-dmcm-1-1.png", "title": "DMC Ground Operations Manager journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"From an inbox of PDFs to the operator's supplier portal\": Trigger."}]}, {"stage": "Discovery", "narrative": "The invitation email from the operator explains the portal and links to a short vendor guide; the manager learns that the portal belongs to the ERP the operator runs on and that other Dutch operators she works for use the same system. A DMC colleague in Spain already confirms for two Dutch operators in it and shows her the request queue.", "media": [{"type": "image", "src": "media/journey-dmcm-dmcm-1-2.png", "title": "DMC Ground Operations Manager journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"From an inbox of PDFs to the operator's supplier portal\": Discovery."}]}, {"stage": "Evaluation", "narrative": "The manager checks what it costs (nothing for the DMC), whether it supports English and Portuguese, how requests, expiry and counter-offers work, whether her hotel confirmation numbers and prices appear on the operator's vouchers, and whether the communication log would protect the DMC in an invoice dispute. She asks for the room list in the format her hotels accept.", "media": [{"type": "image", "src": "media/journey-dmcm-dmcm-1-3.png", "title": "DMC Ground Operations Manager journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"From an inbox of PDFs to the operator's supplier portal\": Evaluation."}]}, {"stage": "Trial", "narrative": "For one departure series the operator sends every hotel and transfer request through the portal. The manager approves most within a day, rejects one full hotel with a counter-offer that the operator accepts in one click, and downloads the room lists herself at the cut-off instead of waiting for an email.", "media": [{"type": "image", "src": "media/journey-dmcm-dmcm-1-4.png", "title": "DMC Ground Operations Manager journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"From an inbox of PDFs to the operator's supplier portal\": Trial."}]}, {"stage": "Engagement", "narrative": "The portal becomes the DMC's request queue for the operator's whole programme: pending requests are worked every morning, changes arrive as deltas with old and new values, and the manager's own operations sheet is built from the confirmed services. Invoices are produced against confirmed services and are paid faster.", "media": [{"type": "image", "src": "media/journey-dmcm-dmcm-1-5.png", "title": "DMC Ground Operations Manager journey stage 5: Engagement", "alt": "Enterprise journey panel for stage 5 of \"From an inbox of PDFs to the operator's supplier portal\": Engagement."}]}, {"stage": "Retention", "narrative": "At the end of the season the DMC has no disputed invoices with the operator and half the email traffic. The manager asks the operator's vendor whether her other Dutch clients can be connected to the same account, and the DMC's reliability in the portal becomes an argument when the operator allocates next season's volume.", "media": [{"type": "image", "src": "media/journey-dmcm-dmcm-1-6.png", "title": "DMC Ground Operations Manager journey stage 6: Retention", "alt": "Enterprise journey panel for stage 6 of \"From an inbox of PDFs to the operator's supplier portal\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-dmcm-dmcm-1.png", "title": "DMC Ground Operations Manager customer journey: From an inbox of PDFs to the operator's supplier portal", "alt": "Enterprise journey storyboard for \"From an inbox of PDFs to the operator's supplier portal\" for customer \"DMC Ground Operations Manager\"."}]}, {"id": "journey-dmcm-2", "name": "One portal account for many operators", "linkedJobIds": ["jtbd-dmcm-1", "jtbd-dmcm-2"], "summary": "With one operator on the portal, the manager discovers that a second and third Dutch client run on the same platform; the DMC turns a single-operator login into its standard channel for the Benelux market and starts using the platform's reach to win new operators.", "stages": [{"stage": "Trigger", "narrative": "A second Dutch operator, a tailor-made specialist, starts sending requests by email that the DMC now finds clumsy compared with the portal queue, and the manager notices that the specialist's documents carry the same vendor name as the coach operator's. She wants one queue for all her Dutch clients.", "media": [{"type": "image", "src": "media/journey-dmcm-dmcm-2-1.png", "title": "DMC Ground Operations Manager journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"One portal account for many operators\": Trigger."}]}, {"stage": "Discovery", "narrative": "The vendor's partner page and the operator's account manager explain that a DMC account can be connected to any tenant on the platform, and that a directory of connected DMCs is being built for the partner marketplace. A vendor webinar for suppliers shows multi-operator queues, shared availability remarks and the invoice matching operators use.", "media": [{"type": "image", "src": "media/journey-dmcm-dmcm-2-2.png", "title": "DMC Ground Operations Manager journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"One portal account for many operators\": Discovery."}]}, {"stage": "Evaluation", "narrative": "The manager weighs asking clients to move to the portal against keeping email: response times operators expect, whether connecting to multiple tenants keeps each operator's contracts and prices separate, what the marketplace listing shows to prospective operators, and whether a premium account with own-availability sharing is worth it.", "media": [{"type": "image", "src": "media/journey-dmcm-dmcm-2-3.png", "title": "DMC Ground Operations Manager journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"One portal account for many operators\": Evaluation."}]}, {"stage": "Trial", "narrative": "The tailor-made specialist connects the DMC's existing account; component requests from its trip files land in the same queue next to the coach operator's group requests, with each operator's contracts kept apart. The manager confirms the first tailor-made lodge requests from her phone during a site inspection.", "media": [{"type": "image", "src": "media/journey-dmcm-dmcm-2-4.png", "title": "DMC Ground Operations Manager journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"One portal account for many operators\": Trial."}]}, {"stage": "Engagement", "narrative": "Three Dutch operators and a Belgian one run through the same account; the manager sets answer-time targets per operator, shares seasonal availability remarks to reduce rejections, and the DMC's confirmation speed appears in the operators' supplier dashboards.", "media": [{"type": "image", "src": "media/journey-dmcm-dmcm-2-5.png", "title": "DMC Ground Operations Manager journey stage 5: Engagement", "alt": "Enterprise journey panel for stage 5 of \"One portal account for many operators\": Engagement."}]}, {"stage": "Retention", "narrative": "The DMC lists itself in the partner marketplace and wins two new Dutch operators that found it through the connected-supplier directory. The manager moves to a premium account and makes portal connectivity a selling point in the DMC's own pitches to Benelux operators.", "media": [{"type": "image", "src": "media/journey-dmcm-dmcm-2-6.png", "title": "DMC Ground Operations Manager journey stage 6: Retention", "alt": "Enterprise journey panel for stage 6 of \"One portal account for many operators\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-dmcm-dmcm-2.png", "title": "DMC Ground Operations Manager customer journey: One portal account for many operators", "alt": "Enterprise journey storyboard for \"One portal account for many operators\" for customer \"DMC Ground Operations Manager\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-dmcm-top", "name": "Service request confirmation time", "description": "Average elapsed time between an operator sending a service request and the DMC's confirmation, rejection or counter-offer. Modeled seed value for a mid-sized incoming agency serving Benelux operators, not an official figure.", "unit": "hours", "currentValue": "30", "targetValue": "6", "link": "https://dashboard.example.com/tour-operator-erp-platform/customers/dmcm/kpis/co-dmcm-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-dmcm-co-dmcm-top.png"}, "branches": [{"id": "co-dmcm-b1", "name": "Request responsiveness", "description": "How fast and how completely the DMC answers operator requests.", "currentValue": "52", "icon": "kpi-dmcm-co-dmcm-b1.png", "children": [{"id": "co-dmcm-b1-c1", "name": "Requests confirmed within 24 hours", "description": "Share of operator service requests answered with a confirmation, rejection or counter-offer within one working day.", "unit": "%", "currentValue": "55", "targetValue": "92", "icon": "kpi-dmcm-co-dmcm-b1-c1.png", "children": [{"id": "co-dmcm-b1-c1-l1", "name": "Requests received via portal", "description": "Share of operator requests arriving through the supplier portal or data exchange rather than email.", "unit": "%", "currentValue": "30", "targetValue": "85", "icon": "kpi-dmcm-co-dmcm-b1-c1-l1.png", "children": []}, {"id": "co-dmcm-b1-c1-l2", "name": "Requests expiring without response", "description": "Share of requests that reach their answer deadline without a DMC response.", "unit": "%"
