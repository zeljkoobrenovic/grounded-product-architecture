<script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

s and yield rules that move demand to weak departures without a spreadsheet"], "theirFear": ["A bus arriving at a hotel that has an old room list, or two families allocated the same seats on departure morning", "Guaranteeing a departure on a hunch and paying for an empty bus, or cancelling too late and paying hotel penalties", "A DMC change confirmed by email that never reaches the operational lists, discovered by forty travelers at the wrong hotel"], "jobsToBeDone": [{"id": "jtbd-gops-1", "name": "Fill and yield every departure profitably", "whatItIs": "Manage a season of fixed-date group departures (bus round trips, adventure tours, concert travel, cycling and walking groups) from the moment the series is published: set capacity and minimum participants per departure, watch fill rates against the guarantee deadline, apply tiered and dynamic prices, and decide to guarantee, merge, add or cancel departures.", "outcome": "Every departure that runs is guaranteed on time at a load factor that covers the bus, the guide and the hotel allotments, and departures that will not fill are cancelled or merged early enough to avoid supplier penalties and traveler disappointment.", "steps": [{"step": "Set up the departure series with capacity and minimum participants", "description": "Create the series from the package: departure dates, bus or flight capacity, seat and room allotments per hotel, the minimum number of participants for a guaranteed departure and the date by which that decision must be made. Link the supplier contracts so purchase costs per participant are known before the first booking arrives.", "streamsNeeded": [{"id": "build-and-price-travel-products", "name": "Build and Price Travel Products", "howItSupports": "Turns packages and supplier contracts into departures with capacity, allotments, minimum-participant thresholds and purchase-cost calculations."}, {"id": "operate-group-departures", "name": "Operate Group Departures", "howItSupports": "Registers each departure with its guarantee deadline, capacity and status so operations can steer it from day one."}], "media": [{"type": "image", "src": "media/jbtd-gops-jtbd-gops-1-1.png", "title": "Group Travel Operations Manager JTBD step 1: Set up the departure series with capacity and minimum participants", "alt": "Enterprise infographic for step 1 of the job \"Fill and yield every departure profitably\": Set up the departure series with capacity and minimum participants."}]}, {"step": "Watch fill rates and apply tiered pricing", "description": "Follow bookings per departure against capacity and minimum participants; apply the early-bird tier, price steps at 60 and 80 percent occupancy, last-seat surcharges and single-room availability so demand shifts to weak departures and strong ones are not sold too cheaply.", "streamsNeeded": [{"id": "build-and-price-travel-products", "name": "Build and Price Travel Products", "howItSupports": "Holds the tiered price ladders and yield rules that reprice a departure automatically as occupancy moves."}, {"id": "steer-the-travel-business-with-insight", "name": "Steer the Travel Business with Insight", "howItSupports": "Shows fill rate, pace versus last year and expected margin per departure so pricing decisions are made on numbers, not gut feeling."}], "media": [{"type": "image", "src": "media/jbtd-gops-jtbd-gops-1-2.png", "title": "Group Travel Operations Manager JTBD step 2: Watch fill rates and apply tiered pricing", "alt": "Enterprise infographic for step 2 of the job \"Fill and yield every departure profitably\": Watch fill rates and apply tiered pricing."}]}, {"step": "Decide go or no-go at the guarantee deadline", "description": "On the deadline, review each departure that has not reached its minimum: check pending options, group inquiries and reseller bookings in the pipeline, and either guarantee it, extend the deadline, or start the merge or cancellation procedure with the hotels and coach company.", "streamsNeeded": [{"id": "operate-group-departures", "name": "Operate Group Departures", "howItSupports": "Lists departures approaching their guarantee deadline with occupancy, options and pipeline so the decision is a queue rather than a spreadsheet hunt."}, {"id": "request-and-confirm-supplier-services", "name": "Request and Confirm Supplier Services", "howItSupports": "Records the cancellation windows and penalties agreed with hotels and coach companies so the cost of waiting is visible."}], "media": [{"type": "image", "src": "media/jbtd-gops-jtbd-gops-1-3.png", "title": "Group Travel Operations Manager JTBD step 3: Decide go or no-go at the guarantee deadline", "alt": "Enterprise infographic for step 3 of the job \"Fill and yield every departure profitably\": Decide go or no-go at the guarantee deadline."}]}, {"step": "Merge, cancel or add departures and inform everyone", "description": "Move participants from a cancelled date to a neighbouring departure or a comparable trip, add an extra departure when a date sells out, and let travelers, resellers and suppliers know in one action with the right documents and refund or rebooking conditions applied.", "streamsNeeded": [{"id": "operate-group-departures", "name": "Operate Group Departures", "howItSupports": "Rebooks participants between departures in bulk and keeps seat, room and guide assignments consistent."}, {"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "howItSupports": "Sends the change notification and updated documents to every affected traveler through email and the my-trip portal."}, {"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "howItSupports": "Closes cancelled dates for sale and opens extra departures on the website and reseller portal immediately."}], "media": [{"type": "image", "src": "media/jbtd-gops-jtbd-gops-1-4.png", "title": "Group Travel Operations Manager JTBD step 4: Merge, cancel or add departures and inform everyone", "alt": "Enterprise infographic for step 4 of the job \"Fill and yield every departure profitably\": Merge, cancel or add departures and inform everyone."}]}, {"step": "Review departure margin after the trip", "description": "Compare realised revenue and purchase costs per departure with the calculation made at publication: load factor, tier mix, single-room supplements, guide and bus cost, and DMC invoices. Feed the lessons into next season's capacity and minimum-participant settings.", "streamsNeeded": [{"id": "steer-the-travel-business-with-insight", "name": "Steer the Travel Business with Insight", "howItSupports": "Produces the departure margin report that compares calculated and realised costs and revenues per date."}, {"id": "settle-suppliers-and-close-books", "name": "Settle Suppliers and Close Books", "howItSupports": "Matches supplier invoices to the departure so the realised purchase cost is complete before the review."}], "media": [{"type": "image", "src": "media/jbtd-gops-jtbd-gops-1-5.png", "title": "Group Travel Operations Manager JTBD step 5: Review departure margin after the trip", "alt": "Enterprise infographic for step 5 of the job \"Fill and yield every departure profitably\": Review departure margin after the trip."}]}], "media": [{"type": "image", "src": "media/jbtd-gops-jtbd-gops-1.png", "title": "Group Travel Operations Manager JTBD infographic: Fill and yield every departure profitably", "alt": "Enterprise infographic for the job \"Fill and yield every departure profitably\" for customer \"Group Travel Operations Manager\"."}]}, {"id": "jtbd-gops-2", "name": "Turn confirmed bookings into flawless departure operations (seats, rooms, guides, lists)", "whatItIs": "In the weeks before departure, convert the booking file of a guaranteed departure into the operational lists everyone needs: bus seating list for the driver, hotel room lists with guest wishes and dietary requirements, the participant list for the tour guide and group leader, and the final documents for travelers.", "outcome": "The driver, every hotel, the guide and the travelers all work from the same up-to-date lists on departure day, without manual re-typing, and no participant arrives at a hotel that does not know their room type, allergy or arrival time.", "steps": [{"step": "Collect passenger data and travel wishes", "description": "Chase missing passport details, dietary requirements, mobility needs, seat preferences and room-sharing wishes through the traveler's my-trip page rather than by phone, and flag incomplete bookings before the room-list cut-off date.", "streamsNeeded": [{"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "howItSupports": "Lets travelers enter and correct their own passenger details and wishes in the my-trip portal, with reminders for missing data."}, {"id": "operate-group-departures", "name": "Operate Group Departures", "howItSupports": "Shows data completeness per departure so operations can focus on the bookings that block the room list."}], "media": [{"type": "image", "src": "media/jbtd-gops-jtbd-gops-2-1.png", "title": "Group Travel Operations Manager JTBD step 1: Collect passenger data and travel wishes", "alt": "Enterprise infographic for step 1 of the job \"Turn confirmed bookings into flawless departure operations (seats, rooms, guides, lists)\": Collect passenger data and travel wishes."}]}, {"step": "Allocate bus seats and produce the seating list", "description": "Assign seats on the coach plan in booking order or by preference, keep couples and families together, honour pre-paid front seats, handle wheelchair and extra-legroom requests, and generate the seating list for the driver and boarding list per pick-up point.", "streamsNeeded": [{"id": "operate-group-departures", "name": "Operate Group Departures", "howItSupports": "Provides the coach seat plan, drag-and-drop allocation, pick-up point sequence and printable seating and boarding lists."}], "media": [{"type": "image", "src": "media/jbtd-gops-jtbd-gops-2-2.png", "title": "Group Travel Operations Manager JTBD step 2: Allocate bus seats and produce the seating list", "alt": "Enterprise infographic for step 2 of the job \"Turn confirmed bookings into flawless departure operations (seats, rooms, guides, lists)\": Allocate bus seats and produce the seating list."}]}, {"step": "Build hotel room lists with wishes and dietary requirements", "description": "Compose the room list per hotel from the booking lines: room types and sharing, single supplements, twin or double, adjoining rooms, arrival times, allergies and vegetarian, halal or gluten-free meals, and send it to the hotel in its preferred format.", "streamsNeeded": [{"id": "operate-group-departures", "name": "Operate Group Departures", "howItSupports": "Generates room lists per hotel night from the room allocation, including guest wishes and dietary codes."}, {"id": "request-and-confirm-supplier-services", "name": "Request and Confirm Supplier Services", "howItSupports": "Delivers the room list to the hotel or DMC through the supplier portal or email and records that it was received."}], "media": [{"type": "image", "src": "media/jbtd-gops-jtbd-gops-2-3.png", "title": "Group Travel Operations Manager JTBD step 3: Build hotel room lists with wishes and dietary requirements", "alt": "Enterprise infographic for step 3 of the job \"Turn confirmed bookings into flawless departure operations (seats, rooms, guides, lists)\": Build hotel room lists with wishes and dietary requirements."}]}, {"step": "Assign the tour guide and publish the participant list", "description": "Select an available guide or group leader for the departure, share the participant list with contact details, medical notes and pick-up points in the guide portal, and give the guide the itinerary, vouchers and supplier contacts for the trip.", "streamsNeeded": [{"id": "operate-group-departures", "name": "Operate Group Departures", "howItSupports": "Manages guide availability and assignment per departure and publishes the participant list to the guide and group-leader portal."}, {"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "howItSupports": "Makes the guide's contact details and meeting points visible to travelers in their documents and app."}], "media": [{"type": "image", "src": "media/jbtd-gops-jtbd-gops-2-4.png", "title": "Group Travel Operations Manager JTBD step 4: Assign the tour guide and publish the participant list", "alt": "Enterprise infographic for step 4 of the job \"Turn confirmed bookings into flawless departure operations (seats, rooms, guides, lists)\": Assign the tour guide and publish the participant list."}]}, {"step": "Run final checks and release travel documents", "description": "Verify that all balances are paid, that the number of participants matches the bus and hotel lists, that flight tickets are issued for fly-coach trips, and release the travel documents, vouchers and emergency numbers to travelers and resellers.", "streamsNeeded": [{"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "howItSupports": "Generates and releases travel documents and vouchers to the my-trip portal, app and reseller."}, {"id": "collect-payments-and-invoice", "name": "Collect Payments and Invoice", "howItSupports": "Flags unpaid balances per departure so documents are only released to bookings that are settled or approved."}], "media": [{"type": "image", "src": "media/jbtd-gops-jtbd-gops-2-5.png", "title": "Group Travel Operations Manager JTBD step 5: Run final checks and release travel documents", "alt": "Enterprise infographic for step 5 of the job \"Turn confirmed bookings into flawless departure operations (seats, rooms, guides, lists)\": Run final checks and release travel documents."}]}], "media": [{"type": "image", "src": "media/jbtd-gops-jtbd-gops-2.png", "title": "Group Travel Operations Manager JTBD infographic: Turn confirmed bookings into flawless departure operations (seats, rooms, guides, lists)", "alt": "Enterprise infographic for the job \"Turn confirmed bookings into flawless departure operations (seats, rooms, guides, lists)\" for customer \"Group Travel Operations Manager\"."}]}, {"id": "jtbd-gops-3", "name": "Keep suppliers and DMCs in sync with every change", "whatItIs": "Maintain a single, current picture of what has been requested, confirmed and changed with every hotel, coach company, ferry, excursion provider and destination management company that delivers a departure, so that a name change, an extra night or a cancellation reaches the supplier once and is confirmed back.", "outcome": "Every service on every departure is confirmed by its supplier in writing, every subsequent change is acknowledged, and the confirmed services match the supplier invoice at settlement without disputes.", "steps": [{"step": "Send service requests from the booking lines", "description": "Generate requests to hotels, coach companies and DMCs directly from the departure's booking lines and allotments, with dates, pax numbers, room mix, meal plan and contracted prices attached, instead of retyping them into emails.", "streamsNeeded": [{"id": "request-and-confirm-supplier-services", "name": "Request and Confirm Supplier Services", "howItSupports": "Creates structured supplier requests from booking lines and sends them through the supplier portal, email or a one-to-one data exchange with the DMC."}], "media": [{"type": "image", "src": "media/jbtd-gops-jtbd-gops-3-1.png", "title": "Group Travel Operations Manager JTBD step 1: Send service requests from the booking lines", "alt": "Enterprise infographic for step 1 of the job \"Keep suppliers and DMCs in sync with every change\": Send service requests from the booking lines."}]}, {"step": "Track approvals, rejections and counter-offers", "description": "Follow every request in a status board: approved, rejected, pending, expiring. Handle rejections by asking the DMC for an alternative hotel or by rerouting the night to a second contracted supplier, and keep the communication log with the departure.", "streamsNeeded": [{"id": "request-and-confirm-supplier-services", "name": "Request and Confirm Supplier Services", "howItSupports": "Shows request status per departure and supplier, logs the approve or reject decisions taken in the supplier portal and escalates expiring requests."}], "media": [{"type": "image", "src": "media/jbtd-gops-jtbd-gops-3-2.png", "title": "Group Travel Operations Manager JTBD step 2: Track approvals, rejections and counter-offers", "alt": "Enterprise infographic for step 2 of the job \"Keep suppliers and DMCs in sync with every change\": Track approvals, rejections and counter-offers."}]}, {"step": "Propagate late changes to every affected supplier", "description": "When a traveler changes name, a couple books late, a participant cancels or a room type changes, push the delta to the hotel room list, the coach seating list and the DMC's passenger file automatically and ask for renewed confirmation where the contract requires it.", "streamsNeeded": [{"id": "request-and-confirm-supplier-services", "name": "Request and Confirm Supplier Services", "howItSupports": "Turns a change on a booking line into a change request to the affected suppliers with the previous and new values side by side."}, {"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "howItSupports": "Captures the amendment on the booking file once, so operations does not learn about it from an angry hotel."}, {"id": "operate-group-departures", "name": "Operate Group Departures", "howItSupports": "Re-issues room lists, seating lists and participant lists as new versions after the change."}], "media": [{"type": "image", "src": "media/jbtd-gops-jtbd-gops-3-3.png", "title": "Group Travel Operations Manager JTBD step 3: Propagate late changes to every affected supplier", "alt": "Enterprise infographic for step 3 of the job \"Keep suppliers and DMCs in sync with every change\": Propagate late changes to every affected supplier."}]}, {"step": "Reconcile confirmed services with supplier invoices", "description": "After the departure, compare the DMC and hotel invoices against the confirmed services and final passenger numbers, dispute deviations with the communication log as evidence, and approve invoices for payment.", "streamsNeeded": [{"id": "settle-suppliers-and-close-books", "name": "Settle Suppliers and Close Books", "howItSupports": "Matches supplier invoice lines to confirmed services and passenger counts per departure and routes deviations for dispute."}, {"id": "request-and-confirm-supplier-services", "name": "Request and Confirm Supplier Services", "howItSupports": "Provides the confirmation history that settles who agreed to what and when."}], "media": [{"type": "image", "src": "media/jbtd-gops-jtbd-gops-3-4.png", "title": "Group Travel Operations Manager JTBD step 4: Reconcile confirmed services with supplier invoices", "alt": "Enterprise infographic for step 4 of the job \"Keep suppliers and DMCs in sync with every change\": Reconcile confirmed services with supplier invoices."}]}], "media": [{"type": "image", "src": "media/jbtd-gops-jtbd-gops-3.png", "title": "Group Travel Operations Manager JTBD infographic: Keep suppliers and DMCs in sync with every change", "alt": "Enterprise infographic for the job \"Keep suppliers and DMCs in sync with every change\" for customer \"Group Travel Operations Manager\"."}]}], "customerJourneyStories": [{"id": "journey-gops-1", "name": "From spreadsheets and phone calls to one departure cockpit", "linkedJobIds": ["jtbd-gops-1", "jtbd-gops-2"], "summary": "An operations manager at a Dutch coach and group tour operator lives through the company's switch from a home-grown booking system plus Excel seat plans to an integrated group-travel ERP, from the season that broke the old way of working to the renewal where the operations team asks for more modules.", "stages": [{"stage": "Trigger", "narrative": "The summer season ends with two departures that left with a wrong room list, a bus that was double-allocated because two agents edited the same Excel seat plan, and a guide who received the participant list as a photo of a printout. The owner tells the operations manager that next season must run on a system that operations, sales and finance all share.", "media": [{"type": "image", "src": "media/journey-gops-gops-1-1.png", "title": "Group Travel Operations Manager journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"From spreadsheets and phone calls to one departure cockpit\": Trigger."}]}, {"stage": "Discovery", "narrative": "The operations manager visits peers at the ANVR group-travel network and hears that Kras-style bus operators and adventure operators such as Djoser and Sawadee run their departures on 1TIS GRIP. A demo at a trade event shows seat allocation on a coach plan, room lists with dietary codes and a guide portal, and a reference call with an operator of similar size confirms the operations team does not need IT to run it.", "media": [{"type": "image", "src": "media/journey-gops-gops-1-2.png", "title": "Group Travel Operations Manager journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"From spreadsheets and phone calls to one departure cockpit\": Discovery."}]}, {"stage": "Evaluation", "narrative": "The owner and the operations manager evaluate the group-travel ERP against a generic booking system and a tailor-made suite. The decisive checks are how minimum participants and tiered prices work per departure, whether room lists can carry hotel-specific formats and wishes, how the supplier portal handles DMC approvals, and what migration of next season's series would cost. Pricing from the published base package plus modules fits the budget.", "media": [{"type": "image", "src": "media/journey-gops-gops-1-3.png", "title": "Group Travel Operations Manager journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"From spreadsheets and phone calls to one departure cockpit\": Evaluation."}]}, {"stage": "Trial", "narrative": "The first real use is one product line: the spring city-trip series is set up with capacity, minimum participants and price tiers, and its departures run on the new system while the rest of the programme stays on the old one. Seat plans and room lists come out of the system for the first time and the guide receives her participant list in the portal a week earlier than usual.", "media": [{"type": "image", "src": "media/journey-gops-gops-1-4.png", "title": "Group Travel Operations Manager journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"From spreadsheets and phone calls to one departure cockpit\": Trial."}]}, {"stage": "Engagement", "narrative": "The full programme moves over for the summer season. Departure decisions at the guarantee deadline become a weekly queue instead of a spreadsheet review, late name changes flow straight into hotel room lists, and the operations manager starts using the departure margin report to argue for smaller buses on shoulder-season dates.", "media": [{"type": "image", "src": "media/journey-gops-gops-1-5.png", "title": "Group Travel Operations Manager journey stage 5: Engagement", "alt": "Enterprise journey panel for stage 5 of \"From spreadsheets and phone calls to one departure cockpit\": Engagement."}]}, {"stage": "Retention", "narrative": "At renewal the operations manager presents the season with zero wrong room lists and the hours saved per departure. The company adds the guide portal for all group leaders and the supplier portal for its three largest DMCs, and the operations manager becomes the reference call for the next operator considering the switch.", "media": [{"type": "image", "src": "media/journey-gops-gops-1-6.png", "title": "Group Travel Operations Manager journey stage 6: Retention", "alt": "Enterprise journey panel for stage 6 of \"From spreadsheets and phone calls to one departure cockpit\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-gops-gops-1.png", "title": "Group Travel Operations Manager customer journey: From spreadsheets and phone calls to one departure cockpit", "alt": "Enterprise journey storyboard for \"From spreadsheets and phone calls to one departure cockpit\" for customer \"Group Travel Operations Manager\"."}]}, {"id": "journey-gops-2", "name": "Bringing DMCs and hotels into the supplier portal", "linkedJobIds": ["jtbd-gops-3", "jtbd-gops-2"], "summary": "Having run departures on the ERP for a season, the operations manager adopts the supplier and DMC portal to replace email confirmations, starting with one destination partner, and ends up with a supplier network that confirms in the system and invoices against confirmed services.", "stages": [{"stage": "Trigger", "narrative": "A DMC in Portugal confirms a hotel change by email that never reaches the room list; forty travelers arrive at the wrong hotel. The post-mortem shows three inboxes, two versions of the room list and no record of who approved what. The operations manager wants suppliers to confirm inside the system.", "media": [{"type": "image", "src": "media/journey-gops-gops-2-1.png", "title": "Group Travel Operations Manager journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"Bringing DMCs and hotels into the supplier portal\": Trigger."}]}, {"stage": "Discovery", "narrative": "The account manager of the ERP vendor shows during the quarterly review that the supplier portal the company already licenses lets DMCs approve or reject requests, download room lists and upload their own confirmations, and that other operators exchange data one-to-one with the same DMCs. A short webinar with an operator that already has a dozen DMCs on the portal makes the model concrete.", "media": [{"type": "image", "src": "media/journey-gops-gops-2-2.png", "title": "Group Travel Operations Manager journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"Bringing DMCs and hotels into the supplier portal\": Discovery."}]}, {"stage": "Evaluation", "narrative": "The operations manager checks with the two largest DMCs whether they are willing to work in a portal, which languages and formats it supports, how request expiry and counter-offers behave, and whether the communication log would hold up in an invoice dispute. Finance confirms that confirmed services can be matched to supplier invoices at settlement.", "media": [{"type": "image", "src": "media/journey-gops-gops-2-3.png", "title": "Group Travel Operations Manager journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"Bringing DMCs and hotels into the supplier portal\": Evaluation."}]}, {"stage": "Trial", "narrative": "One destination, one DMC, one season: all hotel and transfer requests for the Portugal programme go through the portal. The DMC approves within a day instead of a week of email tennis, and a rejected hotel night is replaced with a counter-offer the operations manager accepts with one click.", "media": [{"type": "image", "src": "media/journey-gops-gops-2-4.png", "title": "Group Travel Operations Manager journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"Bringing DMCs and hotels into the supplier portal\": Trial."}]}, {"stage": "Engagement", "narrative": "The portal becomes the default for every DMC and the larger hotels; email is only used for the smallest suppliers. Change requests carry the old and new values, room lists are downloaded by hotels themselves, and the request status board replaces the operations team's morning chase list.", "media": [{"type": "image", "src": "media/journey-gops-gops-2-5.png", "title": "Group Travel Operations Manager journey stage 5: Engagement", "alt": "Enterprise journey panel for stage 5 of \"Bringing DMCs and hotels into the supplier portal\": Engagement."}]}, {"stage": "Retention", "narrative": "When the summer season closes, supplier invoice disputes have halved and the operations manager pushes the last three DMCs to join by making the portal a condition in next year's contracts. The company's supplier network on the platform becomes an argument in the vendor's next reference visit.", "media": [{"type": "image", "src": "media/journey-gops-gops-2-6.png", "title": "Group Travel Operations Manager journey stage 6: Retention", "alt": "Enterprise journey panel for stage 6 of \"Bringing DMCs and hotels into the supplier portal\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-gops-gops-2.png", "title": "Group Travel Operations Manager customer journey: Bringing DMCs and hotels into the supplier portal", "alt": "Enterprise journey storyboard for \"Bringing DMCs and hotels into the supplier portal\" for customer \"Group Travel Operations Manager\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-gops-top", "name": "Operational hours per departure", "description": "Staff hours spent by the operations team per executed group departure on capacity decisions, seat allocation, room lists, guide briefing, supplier confirmations and document release. Modeled seed value for a mid-sized Dutch group operator, not an official 1TIS figure.", "unit": "hours per departure", "currentValue": "14.5", "targetValue": "9.0", "link": "https://dashboard.example.com/tour-operator-erp-platform/customers/gops/kpis/co-gops-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-gops-co-gops-top.png"}, "branches": [{"id": "co-gops-b1", "name": "Departure economics", "description": "How well departures are filled, priced and guaranteed so that each executed date carries its bus, guide and hotel commitments.", "currentValue": "64", "icon": "kpi-gops-co-gops-b1.png", "children": [{"id": "co-gops-b1-c1", "name": "Departure load factor", "description": "Occupied seats or places as a share of capacity across executed departures in the season.", "unit": "%", "currentValue": "78", "targetValue": "86", "icon": "kpi-gops-co-gops-b1-c1.png", "children": [{"id": "co-gops-b1-c1-l1", "name": "Departures cancelled below minimum participants", "description": "Share of published departures cancelled because the minimum number of participants was not reached by the guarantee deadline.", "unit": "%", "currentValue": "9", "targetValue": "5", "icon": "kpi-gops-co-gops-b1-c1-l1.png", "children": []}, {"id": "co-gops-b1-c1-l2", "name": "Tiered-price upgrade share", "description": "Share of bookings sold above the base price tier through early-bird, occupancy steps or last-seat surcharges.", "unit": "%", "currentValue": "22", "targetValue": "35", "icon": "kpi-gops-co-gops-b1-c1-l2.png", "children": []}]}, {"id": "co-gops-b1-c2", "name": "Departure contribution margin", "description": "Realised revenue minus purchase costs (bus, hotels, guide, DMC services) per departure as a share of revenue.", "unit": "%", "currentValue": "17", "targetValue": "21", "icon": "kpi-gops-co-gops-b1-c2.png", "children": [{"id": "co-gops-b1-c2-l1", "name": "Merged or rescheduled departure share", "description": "Share of departures whose participants were moved to another date or trip because the date was cancelled or merged.", "unit": "%", "currentValue": "6", "targetValue": "3.5", "icon": "kpi-gops-co-gops-b1-c2-l1.png", "children": []}, {"id": "co-gops-b1-c2-l2", "name": "Yield rule automation share", "description": "Share of price changes on departures applied by configured yield rules rather than manually.", "unit": "%", "currentValue": "40", "targetValue": "80", "icon": "kpi-gops-co-gops-b1-c2-l2.png", "children": []}]}]}, {"id": "co-gops-b2", "name": "Operational accuracy", "description": "Whether the seat, room, guide and passenger lists that reach drivers, hotels and guides are complete, correct and on time. ns tenant churn rate"]}, "milestones": ["Deploy an operations agent that generates seat, room and guide lists and propagates changes to suppliers with human approval", "Publish departure demand forecasts and load-factor benchmarks per destination from anonymised cross-tenant data", "Run group operations for operators in Germany, Belgium and the Nordics on the same multi-language, multi-currency cockpit"]}}}, "domain": "Group and Coach Tour Operators"}, {"id": "resa", "name": "Reservations and Sales Agent", "description": "The daily booking-desk user at a group or tailor-made tour operator: answers phone, email, chat and web inquiries, makes bookings and options on group departures and tailor-made trip files, sends confirmations and quotes, takes deposits and balances, processes amendments and cancellations, and answers every question a customer has about their booking. Works in a team of three to twenty agents whose employer bought the ERP; the agent's productivity and the customer's experience are where the system proves itself or fails.", "icon": "resa.png", "careAbout": ["Finishing a booking while the customer is still on the phone, with confirmation and payment link sent before hanging up", "Typing passenger names, room types and pick-up points once and never again", "Seeing payment, document, departure and supplier status on the booking without asking finance or operations", "Options that are worked before they expire instead of discovered afterwards", "Replies to emails that go out the same day, in the operator's tone, without copying the same answer forty times", "Knowing the conditions for changes and cancellations are applied correctly so no customer is quoted the wrong amount"], "winsThem": ["Incoming calls and emails that open the right customer and booking file automatically", "Real-time availability and price tiers for every departure and component inside the booking flow, with alternatives priced on the spot", "Amendments that recalculate the price and update invoice, supplier request and documents in one action", "An option and payment queue per agent with reminders that go out with a link to confirm or pay online", "An AI assistant that triages the inbox and drafts replies from the booking context for the agent to check and send"], "theirFear": ["Confirming a departure date or price that turns out to be sold out or wrong because the screen was not live", "A customer who calls three times about the same payment because nobody could see it", "An amendment typed into the booking that never reached the hotel, discovered at check-in"], "jobsToBeDone": [{"id": "jtbd-resa-1", "name": "Convert an inquiry into a confirmed booking in one contact", "whatItIs": "Take a phone call, web form, email or chat about a specific trip or departure and turn it into a confirmed booking or a dated option while the customer is still on the line: recognise the customer, check real-time availability and price, propose alternatives, capture passengers, and send the confirmation with a payment link.", "outcome": "The customer ends the first contact with a confirmed booking or an option that will convert, and the agent has typed the details exactly once.", "steps": [{"step": "Recognise the customer and capture the inquiry", "description": "Find the caller or sender in the CRM by phone number or email, see previous trips, open quotes and marketing consent, and log the inquiry with the trip, departure date, party composition and budget the customer has in mind.", "streamsNeeded": [{"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "howItSupports": "Opens the inquiry against the customer record with telephony and email integration so the agent starts from context, not a blank screen."}, {"id": "market-and-retain-customers", "name": "Market and Retain Customers", "howItSupports": "Shows the customer's history, segment and consent so the agent can tailor the offer and avoid asking known information again."}], "media": [
