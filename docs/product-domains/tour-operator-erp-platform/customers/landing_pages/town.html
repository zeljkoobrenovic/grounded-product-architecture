accounts", "currentValue": "1900", "targetValue": "5500", "icon": "kpi-dmcm-bo-dmcm-b1-c1.png", "children": [{"id": "bo-dmcm-b1-c1-l1", "name": "DMCs connected to multiple operators", "description": "Share of DMC accounts connected to two or more operator tenants.", "unit": "%", "currentValue": "18", "targetValue": "45", "icon": "kpi-dmcm-bo-dmcm-b1-c1-l1.png", "children": []}, {"id": "bo-dmcm-b1-c1-l2", "name": "Supplier invitation acceptance rate", "description": "Share of supplier and DMC invitations from operators that result in an activated portal account.", "unit": "%", "currentValue": "48", "targetValue": "80", "icon": "kpi-dmcm-bo-dmcm-b1-c1-l2.png", "children": []}]}, {"id": "bo-dmcm-b1-c2", "name": "Operators sending requests via portal", "description": "Share of operator tenants that send the majority of their supplier requests through the portal or data exchange.", "unit": "%", "currentValue": "34", "targetValue": "80", "icon": "kpi-dmcm-bo-dmcm-b1-c2.png", "children": [{"id": "bo-dmcm-b1-c2-l1", "name": "Portal share of operator supplier requests", "description": "Share of all supplier requests across tenants sent through the portal rather than email.", "unit": "%", "currentValue": "34", "targetValue": "80", "icon": "kpi-dmcm-bo-dmcm-b1-c2-l1.png", "children": []}, {"id": "bo-dmcm-b1-c2-l2", "name": "Requests per active supplier per month", "description": "Average number of requests handled per active supplier or DMC account per month.", "unit": "requests per month", "currentValue": "8", "targetValue": "16", "icon": "kpi-dmcm-bo-dmcm-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-dmcm-b2", "name": "Portal value and monetisation", "description": "What the supplier network is worth in module revenue, retention and new business.", "currentValue": "41", "icon": "kpi-dmcm-bo-dmcm-b2.png", "children": [{"id": "bo-dmcm-b2-c1", "name": "Supplier portal revenue contribution", "description": "Annual recurring revenue from supplier portal modules at operators and premium DMC accounts.", "unit": "EUR k per year", "currentValue": "220", "targetValue": "900", "icon": "kpi-dmcm-bo-dmcm-b2-c1.png", "children": [{"id": "bo-dmcm-b2-c1-l1", "name": "Operators with portal module", "description": "Number of operator tenants licensing the supplier and DMC portal module.", "unit": "tenants", "currentValue": "70", "targetValue": "160", "icon": "kpi-dmcm-bo-dmcm-b2-c1-l1.png", "children": []}, {"id": "bo-dmcm-b2-c1-l2", "name": "Premium DMC account revenue", "description": "Annual revenue from premium DMC accounts with availability sharing and marketplace listing.", "unit": "EUR k per year", "currentValue": "0", "targetValue": "250", "icon": "kpi-dmcm-bo-dmcm-b2-c1-l2.png", "children": []}]}, {"id": "bo-dmcm-b2-c2", "name": "Portal-driven retention", "description": "Renewal rate of operator tenants that run most supplier communication through the portal.", "unit": "%", "currentValue": "93", "targetValue": "98", "icon": "kpi-dmcm-bo-dmcm-b2-c2.png", "children": [{"id": "bo-dmcm-b2-c2-l1", "name": "Operator churn with connected suppliers", "description": "Annual churn of operator tenants with at least five connected suppliers or DMCs.", "unit": "%", "currentValue": "3", "targetValue": "1.5", "icon": "kpi-dmcm-bo-dmcm-b2-c2-l1.png", "children": []}, {"id": "bo-dmcm-b2-c2-l2", "name": "Supplier-referred operator leads", "description": "Number of operator sales leads per year originating from connected DMCs and suppliers.", "unit": "leads per year", "currentValue": "2", "targetValue": "12", "icon": "kpi-dmcm-bo-dmcm-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make the supplier portal the place where DMCs and suppliers work with every Benelux operator on the platform, so a request is answered once, a change is acknowledged once, and an invoice matches without a dispute.", "timeHorizons": {"year1": {"focus": "Unify the 1TIS supplier portal and the TravelSpirit supplier requests into one shared portal that DMCs use for group and tailor-made requests alike, with approve, reject and counter-offer and room lists in the DMC's format.", "productTheme": "One supplier portal for both brands", "customerKPI": {"northStar": "Service request confirmation time", "supporting": ["Requests received via portal", "Requests confirmed within 24 hours"]}, "businessKPI": {"northStar": "Operator request volume", "revenueStreams": ["Supplier and DMC portal module at operators", "Group Travel ERP and Tailor-Made Suite subscriptions", "Onboarding and integration services"], "supporting": ["Active DMC and supplier accounts", "Supplier invitation acceptance rate"]}, "milestones": ["Launch the shared supplier portal with a single DMC account across group and tailor-made tenants", "Deliver room lists and passenger lists as versioned downloads in hotel-ready formats", "Run a supplier onboarding campaign with the ten largest operator tenants to invite their DMCs"]}, "year3": {"focus": "Turn the portal into the partner marketplace's supply side: a connected-supplier directory, availability sharing, change deltas with acknowledgement, and invoice matching that makes the platform's DMCs the easiest to work with.", "productTheme": "Connected supplier network with invoice matching", "customerKPI": {"northStar": "Service request confirmation time", "supporting": ["Request change error rate", "Rejections with alternative offered"]}, "businessKPI": {"northStar": "Supplier portal revenue contribution", "revenueStreams": ["Supplier portal module and premium DMC accounts", "Partner marketplace listing fees", "Finance and settlement attach at operators"], "supporting": ["DMCs connected to multiple operators", "Operators with portal module"]}, "milestones": ["Open the connected-supplier directory in the partner marketplace with confirmation-speed indicators", "Introduce premium DMC accounts with availability sharing and multi-operator queues", "Make DMC invoice matching against confirmed services standard in operator settlement"]}, "year5": {"focus": "Let AI agents handle routine requests on both sides under supervision and connect DMCs to operators across Europe, so the portal becomes the standard channel between European tour operators and destination suppliers.", "productTheme": "AI-handled supplier requests at European scale", "customerKPI": {"northStar": "Service request confirmation time", "supporting": ["Ground service delivery incidents", "Pending request backlog"]}, "businessKPI": {"northStar": "Portal network growth", "revenueStreams": ["Multi-country supplier portal and premium accounts", "AI request-handling agent add-ons", "Supplier performance benchmark data products"], "supporting": ["Requests per active supplier per month", "Supplier-referred operator leads"]}, "milestones": ["Deploy a request agent that confirms standard services from shared availability with DMC approval rules", "Connect DMCs to operators in Germany, Belgium and the Nordics through the same account", "Publish supplier confirmation-time and accuracy benchmarks per destination"]}}}, "domain": "Tailor-Made Travel Specialists and DMCs"}, {"id": "town", "name": "Travel Company Owner", "description": "Managing director or owner of a Dutch or Belgian travel organisation of 5 to 150 FTE: a coach or group tour operator such as Kras Busreizen, Oad, Djoser or SRC Reizen, a tailor-made specialist such as Van Verre, Tenzing Travel or SNP Natuurreizen, an OTA, a MICE agency or a small travel entrepreneur just past the point where spreadsheets and a generic CRM stop scaling. Signs the ERP subscription (1TIS publishes a base package from EUR 129 per month plus modules; TravelSpirit runs start packages and enterprise contracts), decides which modules and portals get switched on, and is personally accountable to ANVR, SGR and the package-travel rules. Judges the platform on margin, bookings per FTE, online share under the own brand, and total cost of ownership rather than on feature lists.", "icon": "town.png", "careAbout": ["Growing bookings and travel revenue without adding back-office headcount in a tight Dutch labour market", "A healthy operating margin in a trade where 3 to 6 percent is normal and one bad season can wipe it out", "A larger share of bookings arriving directly through the own-brand website instead of through commissioned resellers and bed banks", "One system of record from first lead to aftercare so that product, sales, operations and finance stop re-keying each other's data", "Staying compliant with SGR travel-guarantee-fund reporting, the package-travel regulation and ANVR conditions without a compliance department", "Predictable total cost of ownership: a monthly subscription that scales with modules, not surprise consultancy invoices"], "winsThem": ["A live demo on the operator's own products and departures, followed by a reference call with a peer such as Djoser or Van Verre who runs the same setup", "A migration plan that imports products, customers and open bookings from the legacy back office or spreadsheets and allows a bounded parallel run", "A real-time bookable website in the own brand that goes live within the first season and visibly moves the online booking share", "Management dashboards (Travel Intelligence) that show margin per departure and per trip file without exporting to Excel", "AI assistants that draft quotes and triage the shared inbox so the same team handles more bookings in peak weeks"], "theirFear": ["A failed migration in the middle of the booking season, with staff working two systems and travelers receiving wrong documents", "Being locked into a vendor whose roadmap is decided by its biggest customer while the monthly subscription keeps creeping up", "An SGR or regulator finding, or a Trustpilot storm, that damages the brand built over decades"], "jobsToBeDone": [{"id": "jtbd-town-1", "name": "Scale bookings and revenue without scaling headcount", "whatItIs": "Grow the number of departures, trip files and passengers the organisation handles per season while keeping the back office the same size, by removing re-keying between product, sales, operations and finance and by automating the routine work of the booking desk.", "outcome": "Revenue per FTE rises season over season; peak weeks are absorbed without temporary staff; the owner can add a new destination or a second brand without a new administrator.", "steps": [{"step": "Map where the hours go today", "description": "Walk the trade lifecycle Product to Sell to Book to Operate to Serve to Settle to Steer with the team and count the hand-offs: product data in Excel, bookings in the legacy back office, room lists in Word, invoices in the accounting package, questions in a shared mailbox.", "streamsNeeded": [{"id": "steer-the-travel-business-with-insight", "name": "Steer the Travel Business with Insight", "howItSupports": "Provides the baseline of bookings, hours and cost per process step that shows where headcount is being spent."}, {"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "howItSupports": "Exposes how many bookings still need manual touches from inquiry to paid deposit."}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-1-1.png", "title": "Travel Company Owner JTBD step 1: Map where the hours go today", "alt": "Enterprise infographic for step 1 of the job \"Scale bookings and revenue without scaling headcount\": Map where the hours go today."}]}, {"step": "Move product, booking and finance onto one data model", "description": "Load packages, departures, components, supplier contracts and pricing rules once so that quotes, bookings, room lists, invoices and dashboards all read the same record; retire the parallel spreadsheets one by one.", "streamsNeeded": [{"id": "build-and-price-travel-products", "name": "Build and Price Travel Products", "howItSupports": "Turns supplier contracts into sellable packages and departures with yield rules that every downstream step reuses."}, {"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "howItSupports": "Makes the booking file the single dossier that sales, operations and finance work from."}, {"id": "collect-payments-and-invoice", "name": "Collect Payments and Invoice", "howItSupports": "Generates invoices and payment links straight from the booking file, removing double entry into finance."}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-1-2.png", "title": "Travel Company Owner JTBD step 2: Move product, booking and finance onto one data model", "alt": "Enterprise infographic for step 2 of the job \"Scale bookings and revenue without scaling headcount\": Move product, booking and finance onto one data model."}]}, {"step": "Automate the routine desk work", "description": "Switch on workflow tasks, alerts and AI assistants for quote drafting and inbox triage so reservations agents spend their time on selling and exceptions rather than on copying data and chasing status.", "streamsNeeded": [{"id": "quote-and-sell-tailor-made-trips", "name": "Quote and Sell Tailor-Made Trips", "howItSupports": "Speeds up proposal drafting with stored components and AI-assisted itineraries so specialists close more files per week."}, {"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "howItSupports": "Lets the desk confirm bookings, options and changes in one contact without re-keying."}, {"id": "request-and-confirm-supplier-services", "name": "Request and Confirm Supplier Services", "howItSupports": "Sends supplier and DMC requests automatically from booking lines and logs the answers."}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-1-3.png", "title": "Travel Company Owner JTBD step 3: Automate the routine desk work", "alt": "Enterprise infographic for step 3 of the job \"Scale bookings and revenue without scaling headcount\": Automate the routine desk work."}]}, {"step": "Let travelers, resellers and suppliers serve themselves", "description": "Open the my-trip portal, reseller portal and supplier portal so that document downloads, payments, passenger details and confirmations happen without a phone call to the office.", "streamsNeeded": [{"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "howItSupports": "Moves document delivery, payment and passenger-data capture to traveler self-service."}, {"id": "distribute-through-resellers-and-partners", "name": "Distribute Through Resellers and Partners", "howItSupports": "Lets agents book and retrieve documents in the reseller portal instead of by phone."}, {"id": "request-and-confirm-supplier-services", "name": "Request and Confirm Supplier Services", "howItSupports": "Lets suppliers and DMCs confirm requests and update room lists in their own portal."}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-1-4.png", "title": "Travel Company Owner JTBD step 4: Let travelers, resellers and suppliers serve themselves", "alt": "Enterprise infographic for step 4 of the job \"Scale bookings and revenue without scaling headcount\": Let travelers, resellers and suppliers serve themselves."}]}, {"step": "Measure bookings per FTE and reinvest", "description": "Track bookings, passengers and revenue per FTE per month on the management dashboard, compare seasons, and decide where the freed capacity goes: new destinations, a second brand, or more direct marketing.", "streamsNeeded": [{"id": "steer-the-travel-business-with-insight", "name": "Steer the Travel Business with Insight", "howItSupports": "Shows revenue per FTE, handling time and margin trends so the owner sees the effect of each automation step."}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-1-5.png", "title": "Travel Company Owner JTBD step 5: Measure bookings per FTE and reinvest", "alt": "Enterprise infographic for step 5 of the job \"Scale bookings and revenue without scaling headcount\": Measure bookings per FTE and reinvest."}]}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-1.png", "title": "Travel Company Owner JTBD infographic: Scale bookings and revenue without scaling headcount", "alt": "Enterprise infographic for the job \"Scale bookings and revenue without scaling headcount\" for customer \"Travel Company Owner\"."}]}, {"id": "jtbd-town-2", "name": "Grow direct online sales under the own brand", "whatItIs": "Shift bookings from commissioned resellers, bed banks and phone calls to a real-time bookable website and customer portal in the operator's own brand, fed directly from the back office inventory and prices, and supported by segmented email marketing and reviews.", "outcome": "A higher online booking share at lower distribution cost, a brand that customers book with directly, and repeat bookings driven from the operator's own CRM data.", "steps": [{"step": "Decide the channel mix and brand positioning", "description": "Look at the current split between direct website, phone, resellers and partner feeds, the commission paid per channel, and decide which products should be online-bookable in real time and which stay quote-led.", "streamsNeeded": [{"id": "steer-the-travel-business-with-insight", "name": "Steer the Travel Business with Insight", "howItSupports": "Provides channel share, commission cost and conversion per product line to base the mix decision on."}, {"id": "distribute-through-resellers-and-partners", "name": "Distribute Through Resellers and Partners", "howItSupports": "Shows which reseller and partner channels earn their commission and which cannibalise direct sales."}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-2-1.png", "title": "Travel Company Owner JTBD step 1: Decide the channel mix and brand positioning", "alt": "Enterprise infographic for step 1 of the job \"Grow direct online sales under the own brand\": Decide the channel mix and brand positioning."}]}, {"step": "Launch the real-time booking website", "description": "Build or migrate the website on the platform CMS (1TIS Klantwebsite or TravelSpirit SPoE) so that availability, prices, departures and options come live from the back office and a completed web booking creates a booking file with deposit paid.", "streamsNeeded": [{"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "howItSupports": "Connects the website booking flow to real-time inventory and creates the booking file without desk intervention."}, {"id": "build-and-price-travel-products", "name": "Build and Price Travel Products", "howItSupports": "Supplies the product content, departures, prices and availability the website renders."}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-2-2.png", "title": "Travel Company Owner JTBD step 2: Launch the real-time booking website", "alt": "Enterprise infographic for step 2 of the job \"Grow direct online sales under the own brand\": Launch the real-time booking website."}]}, {"step": "Turn the customer base into a marketing asset", "description": "Segment the CRM by destination, travel type, season and past spend, run email campaigns through Spotler, collect Trustpilot reviews after each trip and show them on the website.", "streamsNeeded": [{"id": "market-and-retain-customers", "name": "Market and Retain Customers", "howItSupports": "Runs segmentation, campaigns, review collection and repeat-booking programmes from the CRM data."}, {"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "howItSupports": "Triggers the post-trip survey and review request that feeds the marketing loop."}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-2-3.png", "title": "Travel Company Owner JTBD step 3: Turn the customer base into a marketing asset", "alt": "Enterprise infographic for step 3 of the job \"Grow direct online sales under the own brand\": Turn the customer base into a marketing asset."}]}, {"step": "Open the customer portal for repeat business", "description": "Give travelers a login where they see past bookings, download documents, message the office and rebook, so the brand relationship survives between trips.", "streamsNeeded": [{"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "howItSupports": "Provides the my-trip portal and app with booking history, documents and messaging."}, {"id": "market-and-retain-customers", "name": "Market and Retain Customers", "howItSupports": "Uses portal activity and booking history to target the next trip."}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-2-4.png", "title": "Travel Company Owner JTBD step 4: Open the customer portal for repeat business", "alt": "Enterprise infographic for step 4 of the job \"Grow direct online sales under the own brand\": Open the customer portal for repeat business."}]}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-2.png", "title": "Travel Company Owner JTBD infographic: Grow direct online sales under the own brand", "alt": "Enterprise infographic for the job \"Grow direct online sales under the own brand\" for customer \"Travel Company Owner\"."}]}, {"id": "jtbd-town-3", "name": "Run a compliant, insight-driven travel business", "whatItIs": "Steer the organisation on live margin, load factor and cash data instead of month-old exports, and satisfy SGR, ANVR, package-travel and tax obligations as a by-product of daily operations rather than as a quarterly scramble.", "outcome": "The owner opens one dashboard on Monday morning and knows margin per departure, cash position and risk exposure; fund and regulator reporting is produced from the system with no spreadsheet reconciliation.", "steps": [{"step": "Define the steering KPIs", "description": "Agree with finance and operations on the handful of numbers that run the business: revenue per FTE, operating margin, load factor per departure, online share, overdue receivables and days to close.", "streamsNeeded": [{"id": "steer-the-travel-business-with-insight", "name": "Steer the Travel Business with Insight", "howItSupports": "Turns the KPI definitions into dashboards fed from booking, invoice and departure data."}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-3-1.png", "title": "Travel Company Owner JTBD step 1: Define the steering KPIs", "alt": "Enterprise infographic for step 1 of the job \"Run a compliant, insight-driven travel business\": Define the steering KPIs."}]}, {"step": "Get margin per departure and per trip file live", "description": "Have purchase cost, sales price, currency and yield changes flow into a live margin view so that pricing and capacity decisions are made on facts during the season, not after it.", "streamsNeeded": [{"id": "build-and-price-travel-products", "name": "Build and Price Travel Products", "howItSupports": "Holds contract cost, price and yield rules that determine planned margin."}, {"id": "operate-group-departures", "name": "Operate Group Departures", "howItSupports": "Adds actual load factor and minimum-participant decisions per departure."}, {"id": "settle-suppliers-and-close-books", "name": "Settle Suppliers and Close Books", "howItSupports": "Adds actual supplier invoices so realised margin replaces planned margin."}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-3-2.png", "title": "Travel Company Owner JTBD step 2: Get margin per departure and per trip file live", "alt": "Enterprise infographic for step 2 of the job \"Run a compliant, insight-driven travel business\": Get margin per departure and per trip file live."}]}, {"step": "Make compliance a by-product of the process", "description": "Ensure every package booking carries the guarantee-fund flag, the package-travel information form and the correct invoice wording, and that the SGR report, VAT and travel-tax figures come straight from the booking and invoice records.", "streamsNeeded": [{"id": "collect-payments-and-invoice", "name": "Collect Payments and Invoice", "howItSupports": "Produces compliant invoices and payment records per booking."}, {"id": "settle-suppliers-and-close-books", "name": "Settle Suppliers and Close Books", "howItSupports": "Generates guarantee-fund reporting and closes the month from settled records."}, {"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "howItSupports": "Captures the package-travel information and consent at booking time."}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-3-3.png", "title": "Travel Company Owner JTBD step 3: Make compliance a by-product of the process", "alt": "Enterprise infographic for step 3 of the job \"Run a compliant, insight-driven travel business\": Make compliance a by-product of the process."}]}, {"step": "Review, decide, and adjust weekly", "description": "Run the weekly management meeting from the dashboard: cancel or merge departures under minimum, re-price slow sellers, chase overdue receivables and track the effect next week.", "streamsNeeded": [{"id": "steer-the-travel-business-with-insight", "name": "Steer the Travel Business with Insight", "howItSupports": "Provides weekly KPI trends and drill-down to departure and file level."}, {"id": "operate-group-departures", "name": "Operate Group Departures", "howItSupports": "Executes the capacity decisions taken in the meeting."}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-3-4.png", "title": "Travel Company Owner JTBD step 4: Review, decide, and adjust weekly", "alt": "Enterprise infographic for step 4 of the job \"Run a compliant, insight-driven travel business\": Review, decide, and adjust weekly."}]}], "media": [{"type": "image", "src": "media/jbtd-town-jtbd-town-3.png", "title": "Travel Company Owner JTBD infographic: Run a compliant, insight-driven travel business", "alt": "Enterprise infographic for the job \"Run a compliant, insight-driven travel business\" for customer \"Travel Company Owner\"."}]}], "customerJourneyStories": [{"id": "journey-town-1", "name": "From spreadsheets and a legacy back office to one travel ERP", "linkedJobIds": ["jtbd-town-1", "jtbd-town-3"], "summary": "The owner of a 40-FTE group tour operator replaces a home-grown back office and a forest of spreadsheets with the travel ERP: discovering it through peers at ANVR events, evaluating it on a demo with own departures and reference calls, running a bounded parallel run on one season, and renewing on bookings per FTE.", "stages": [{"stage": "Trigger", "narrative": "The spring season shows the cracks: two experienced administrators announce retirement, the home-grown back office built by a freelancer in 2012 cannot produce SGR figures without a weekend of Excel work, and a duplicate room list sends a family to the wrong hotel. The owner decides the systems are the constraint on growth, not the people.", "media": [{"type": "image", "src": "media/journey-town-town-1-1.png", "title": "Travel Company Owner journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"From spreadsheets and a legacy back office to one travel ERP\": Trigger."}]}, {"stage": "Discovery", "narrative": "At an ANVR members' meeting two owners of comparable coach operators describe running seat allocation, room lists and invoicing in one platform; the owner recognises the reference logos on the vendor site (Kras Busreizen, Oad, Djoser, SRC Reizen) and reads that the same group now also owns the tailor-made suite used by Van Verre and Tenzing Travel. The published base package from EUR 129 per month makes the first conversation low-risk.", "media": [{"type": "image", "src": "media/journey-town-town-1-2.png", "title": "Travel Company Owner journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"From spreadsheets and a legacy back office to one travel ERP\": Discovery."}]}, {"stage": "Evaluation", "narrative": "The vendor demos with the operator's own summer programme loaded: a departure with bus seating, a hotel room list and the invoice produced from it. The owner calls two reference customers, asks finance to check the Exact integration and the SGR report, and compares three years of subscription plus onboarding against the cost of the retiring administrators and the freelancer's maintenance. Vendor stability after the Vortex acquisition and a written migration plan settle the decision.", "media": [{"type": "image", "src": "media/journey-town-town-1-3.png", "title": "Travel Company Owner journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"From spreadsheets and a legacy back office to one travel ERP\": Evaluation."}]}, {"stage": "Trial", "narrative": "The trial is a parallel run on the autumn programme: products and open bookings are imported, the desk books new autumn departures in the new system while the legacy system finishes the summer, and the first room lists, seat plans and invoices are checked side by side. Two data-quality issues in the import are fixed within a week and the finance lead signs off the first month-end from the new system.", "media": [{"type": "image", "src": "media/journey-town-town-1-4.png", "title": "Travel Company Owner journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"From spreadsheets and a legacy back office to one travel ERP\": Trial."}]}, {"stage": "Engagement", "narrative": "By the next spring every departure, booking and invoice lives in the platform, the customer website is on the platform CMS, and the weekly management meeting runs from the Travel Intelligence dashboard. The AI inbox assistant is switched on for the peak booking weeks and the team absorbs a 20 percent larger programme without temporary staff.", "media": [{"type": "image", "src": "media/journey-town-town-1-5.png", "title": "Travel Company Owner journey stage 5: Engagement", "alt": "Enterprise journey panel for stage 5 of \"From spreadsheets and a legacy back office to one travel ERP\": Engagement."}]}, {"stage": "Retention", "narrative": "Renewal is not a discussion: revenue per FTE is up, the SGR report takes an afternoon, and the onboarding consultant has become the owner's process adviser. The owner joins the customer advisory group, adds the reseller portal module, and gives the reference call to the next operator considering the switch.", "media": [{"type": "image", "src": "media/journey-town-town-1-6.png", "title": "Travel Company Owner journey stage 6: Retention", "alt": "Enterprise journey panel for stage 6 of \"From spreadsheets and a legacy back office to one travel ERP\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-town-town-1.png", "title": "Travel Company Owner customer journey: From spreadsheets and a legacy back office to one travel ERP", "alt": "Enterprise journey storyboard for \"From spreadsheets and a legacy back office to one travel ERP\" for customer \"Travel Company Owner\"."}]}, {"id": "journey-town-2", "name": "Launching the own-brand real-time booking website", "linkedJobIds": ["jtbd-town-2"], "summary": "A tailor-made specialist's owner adopts the platform website and online booking module to lift the direct online share: triggered by rising reseller commissions, discovered through the platform's SPoE case studies, evaluated on conversion economics, piloted on one product line, and retained on measured online share.", "stages": [{"stage": "Trigger", "narrative": "The annual channel review shows 45 percent of bookings still coming through resellers and bed banks at 10 to 15 percent commission, while the agency website is a brochure that sends travelers to a contact form. A competitor's real-time bookable site appears in the same Google results with prices and availability.", "media": [{"type": "image", "src": "media/journey-town-town-2-1.png", "title": "Travel Company Owner journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"Launching the own-brand real-time booking website\": Trigger."}]}, {"stage": "Discovery", "narrative": "The owner already uses the back office and sees in the vendor newsletter and a user-day session that the customer website module reads availability and prices live from the same product data; a peer specialist demonstrates how a completed web booking simply appears as a booking file with the deposit paid through a Mollie link.", "media": [{"type": "image", "src": "media/journey-town-town-2-2.png", "title": "Travel Company Owner journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"Launching the own-brand real-time booking website\": Discovery."}]}, {"stage": "Evaluation", "narrative": "The evaluation is about economics and brand: the module cost against commission saved per online booking, whether the CMS supports the agency's design and multi-language content, how quotes and online bookings coexist for tailor-made products, and whether Trustpilot reviews and package-travel information can be shown correctly. A reference site of a similar specialist decides it.", "media": [{"type": "image", "src": "media/journey-town-town-2-3.png", "title": "Travel Company Owner journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"Launching the own-brand real-time booking website\": Evaluation."}]}, {"stage": "Trial", "narrative": "The pilot puts one product line with fixed departures online with real-time booking while tailor-made journeys stay quote-led with online proposal approval. The first web bookings arrive with deposits paid, no desk involvement and correct documents; conversion and abandonment are tracked from day one.", "media": [{"type": "image", "src": "media/journey-town-town-2-4.png", "title": "Travel Company Owner journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"Launching the own-brand real-time booking website\": Trial."}]}, {"stage": "Engagement", "narrative": "The whole catalogue moves online over two seasons, campaigns from the CRM drive traffic to bookable pages, reviews are collected automatically after each trip, and the customer portal lets travelers rebook. The owner starts pricing reseller products differently now that direct share is measurable.", "media": [{"type": "image", "src": "media/journey-town-town-2-5.png", "title": "Travel Company Owner journey stage 5: Engagement", "alt": "Enterprise journey panel for stage 5 of \"Launching the own-brand real-time booking website\": Engagement."}]}, {"stage": "Retention", "narrative": "Online booking share passes the target the owner set at evaluation, distribution cost per booking falls, and the website has become the brand's main sales channel. The owner extends the subscription to the marketing and BI modules and treats the vendor as part of the growth plan rather than as an IT cost.", "media": [{"type": "image", "src": "media/journey-town-town-2-6.png", "title": "Travel Company Owner journey stage 6: Retention", "alt": "Enterprise journey panel for stage 6 of \"Launching the own-brand real-time booking website\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-town-town-2.png", "title": "Travel Company Owner customer journey: Launching the own-brand real-time booking website", "alt": "Enterprise journey storyboard for \"Launching the own-brand real-time booking website\" for customer \"Travel Company Owner\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-town-top", "name": "Revenue per FTE", "description": "Annual travel revenue (gross booking value) handled per full-time employee of the travel organisation, the owner's headline measure of scaling without headcount.", "unit": "EUR k / FTE / year", "currentValue": "620", "targetValue": "850", "link": "https://dashboard.example.com/tour-operator-erp-platform/customers/town/kpis/co-town-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-town-co-town-top.png"}, "branches": [{"id": "co-town-b1", "name": "Scalabl er a single brand: a modular ERP where finance and compliance are a standard attach, a partner marketplace of integrations replaces bespoke connectors, and selective acquisitions add payments, apps and BI value.", "productTheme": "The Benelux travel-ERP standard with finance attach and partner marketplace", "customerKPI": {"northStar": "Revenue per FTE", "supporting": ["Operating margin", "Compliance readiness score"]}, "businessKPI": {"northStar": "Annual recurring revenue per tenant", "revenueStreams": ["Single-brand ERP subscriptions", "Finance and compliance module fees", "Partner marketplace revenue share"], "supporting": ["Finance module attach rate", "Net revenue retention"]}, "milestones": ["Launch the single-brand modular ERP with finance and compliance in the standard package", "Open the partner marketplace with certified payment, app, eSIM, accounting and marketing integrations", "Reach the majority of ANVR group and tailor-made operators as tenants"]}, "year5": {"focus": "Scale beyond the Netherlands and Belgium and let AI agents run routine operations under human supervision, so owners in several countries steer their business on platform data products such as margin benchmarks and demand forecasts.", "productTheme": "European scale and AI-run operations", "customerKPI": {"northStar": "Revenue per FTE", "supporting": ["Online booking share", "Management meetings run on live dashboard"]}, "businessKPI": {"northStar": "Annual recurring revenue per tenant", "revenueStreams": ["Multi-country ERP subscriptions", "AI operations agents", "Data products: margin benchmarks and demand forecasts"], "supporting": ["Upsell revenue share", "Logo churn rate"]}, "milestones": ["Go live with tenants in at least two new European markets with local compliance packs", "Run supplier requests, document generation and reconciliation through supervised AI agents for the majority of bookings", "Publish trade-wide margin and demand benchmarks as a subscribed data product"]}}}, "domain": "Travel Business Owners and Finance"}, {"id": "fina", "name": "Finance and Administration Lead", "description": "Head of finance and administration at a travel organisation, often a one- or two-person team reporting to the owner and working with an external accountant. Owns customer invoicing and payment collection, supplier settlement, flight ticket settlement through IATA HOT and Airtrade files, the accounting integration with Exact or a similar package, electronic invoicing, SGR guarantee-fund reporting, package-travel-regulation obligations, VAT and the month-end close. Lives with the seasonality of the trade: deposits in January, balances in May, supplier invoices all summer, and a year-end where the auditor asks for reconciliations that today live in spreadsheets.", "icon": "fina.png", "careAbout": ["Every invoice correct the first time: right traveler, right package, right deposit and balance dates, right guarantee-fund and VAT treatment", "Cash collected on time so the operator can pay suppliers before departure without bridging finance", "Supplier and flight settlement that matches what was booked, without manual line-by-line reconciliation of IATA HOT and Airtrade files", "An accounting integration that posts sales, purchases, payments and bank movements automatically and reconciles cleanly in Exact", "SGR, package-travel and tax reporting produced from system records rather than rebuilt in spreadsheets each quarter", "A month-end close that takes days, not weeks, and an audit trail the accountant accepts"], "winsThem": ["Invoices, payment links and reminders generated from the booking file, with Mollie payment status flowing back automatically", "An Exact integration that has been proven at a reference customer with the same chart of accounts and cost-centre logic", "Automatic matching of supplier invoices and flight settlement files against booking lines, with exceptions surfaced as tasks", "A guarantee-fund report and package-travel compliance view that come straight out of the system", "A finance consultant from the vendor who understands the travel trade's deposit, balance and cancellation logic"], "theirFear": ["Migrating open receivables and payables mid-season and losing track of who has paid what", "An accounting integration that double-posts or silently drops entries and is only discovered at year-end by the auditor", "Missing an SGR or package-travel obligation and exposing the owner personally"], "jobsToBeDone": [{"id": "jtbd-fina-1", "name": "Collect every customer payment on time", "whatItIs": "Invoice every booking correctly, collect deposits and balances by their due dates through payment links and reminders, handle changes, cancellations and refunds without manual recalculation, and know at any moment which bookings are unpaid before departure.", "outcome": "Deposits and balances arrive on time for the vast majority of bookings, overdue receivables are a short exception list, and no traveler departs unpaid or is chased for money already received.", "steps": [{"step": "Configure invoicing and payment rules per product", "description": "Set deposit percentages, balance due dates, cancellation fees, guarantee-fund contributions, VAT and invoice wording per product type and brand so that every booking invoices itself correctly.", "streamsNeeded": [{"id": "collect-payments-and-invoice", "name": "Collect Payments and Invoice", "howItSupports": "Applies the invoicing rules to every booking file and generates compliant invoices and payment schedules."}, {"id": "build-and-price-travel-products", "name": "Build and Price Travel Products", "howItSupports": "Holds the product-level price, deposit and cancellation conditions the invoice rules refer to."}], "media": [{"type": "image", "src": "media/jbtd-fina-jtbd-fina-1-1.png", "title": "Finance and Administration Lead JTBD step 1: Configure invoicing and payment rules per product", "alt": "Enterprise infographic for step 1 of the job \"Collect every customer payment on time\": Configure invoicing and payment rules per product."}]}, {"step": "Invoice from the booking file automatically", "description": "Let confirmed bookings, options turned into bookings, extras and changes generate invoices and credit notes automatically, including electronic invoices for business travelers and resellers.", "streamsNeeded": [{"id": "collect-payments-and-invoice", "name": "Collect Payments and Invoice", "howItSupports": "Creates invoices, credit notes and electronic invoices from booking events without re-keying."}, {"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "howItSupports": "Provides the booking, option and change events that trigger invoicing."}], "media": [{"type": "image", "src": "media/jbtd-fina-jtbd-fina-1-2.png", "title": "Finance and Administration Lead JTBD step 2: Invoice from the booking file automatically", "alt": "Enterprise infographic for step 2 of the job \"Collect every customer payment on time\": Invoice from the booking file automatically."}]}, {"step": "Collect through payment links and reminders", "description": "Send Mollie payment links with the invoice, let travelers pay in the my-trip portal, and let reminders and alerts run on due dates so the team only handles exceptions.", "streamsNeeded": [{"id": "collect-payments-and-invoice", "name": "Collect Payments and Invoice", "howItSupports": "Runs payment links, status updates, reminders and alerts on deposit and balance due dates."}, {"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "howItSupports": "Offers travelers a place in the portal to see open amounts and pay them."}], "media": [{"type": "image", "src": "media/jbtd-fina-jtbd-fina-1-3.png", "title": "Finance and Administration Lead JTBD step 3: Collect through payment links and reminders", "alt": "Enterprise infographic for step 3 of the job \"Collect every customer payment on time\": Collect through payment links and reminders."}]}, {"step": "Handle changes, cancellations and refunds", "description": "Recalculate invoices when bookings change, apply cancellation conditions, issue refunds through the payment provider and keep the booking file, invoice and ledger in agreement.", "streamsNeeded": [{"id": "collect-payments-and-invoice", "name": "Collect Payments and Invoice", "howItSupports": "Recomputes invoices and refunds on booking changes and cancellations and records them."}, {"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "howItSupports": "Records the change or cancellation on the booking file that drives the recalculation."}], "media": [{"type": "image", "src": "media/jbtd-fina-jtbd-fina-1-4.png", "title": "Finance and Administration Lead JTBD step 4: Handle changes, cancellations and refunds", "alt": "Enterprise infographic for step 4 of the job \"Collect every customer payment on time\": Handle changes, cancellations and refunds."}]}, {"step": "Chase the exception list before departure", "description": "Work the list of bookings with unpaid balances close to departure, block documents where policy requires, and escalate to the desk or owner where needed.", "streamsNeeded": [{"id": "collect-payments-and-invoice", "name": "Collect Payments and Invoice", "howItSupports": "Surfaces overdue balances per departure and drives reminder escalation."}, {"id": "steer-the-travel-business-with-insight", "name": "Steer the Travel Business with Insight", "howItSupports": "Shows overdue receivables by departure and season so the team prioritises correctly."}], "media": [{"type": "image", "src": "media/jbtd-fina-jtbd-fina-1-5.png", "title": "Finance and Administration Lead JTBD step 5: Chase the exception list before departure", "alt": "Enterprise infographic for step 5 of the job \"Collect every customer payment on time\": Chase the exception list before departure."}]}], "media": [{"type": "image", "src": "media/jbtd-fina-jtbd-fina-1.png", "title": "Finance and Administration Lead JTBD infographic: Collect every customer payment on time", "alt": "Enterprise infographic for the job \"Collect every customer payment on time\" for customer \"Finance and Administration Lead\"."}]}, {"id": "jtbd-fina-2", "name": "Settle suppliers and flights accurately", "whatItIs": "Match supplier invoices, DMC invoices and flight settlement files (IATA HOT, Airtrade) against what was booked and confirmed, pay suppliers on time in the right currency, and post every purchase to accounting without manual reconciliation.", "outcome": "Supplier and flight costs are matched to booking lines automatically, differences are resolved as exceptions, payment runs go out on time, and realised margin per departure and trip file is known when the supplier invoice arrives.", "steps": [{"step": "Capture what was booked and confirmed", "description": "Make sure every booking line has a confirmed supplier service with the agreed price and currency, so there is something to match invoices against.", "streamsNeeded": [{"id": "request-and-confirm-supplier-services", "name": "Request and Confirm Supplier Services", "howItSupports": "Records the confirmed supplier and DMC services and their agreed prices per booking line."}, {"id": "build-and-price-travel-products", "name": "Build and Price Travel Products", "howItSupports": "Holds contract prices and conditions used to validate supplier invoices."}], "media": [{"type": "image", "src": "media/jbtd-fina-jtbd-fina-2-1.png", "title": "Finance and Administration Lead JTBD step 1: Capture what was booked and confirmed", "alt": "Enterprise infographic for step 1 of the job \"Settle suppliers and flights accurately\": Capture what was booked and confirmed."}]}, {"step": "Import and match supplier invoices", "description": "Receive supplier and DMC invoices, match them automatically to booking lines and departures, and route price differences, duplicates and missing confirmations as tasks.", "streamsNeeded": [{"id": "settle-suppliers-and-close-books", "name": "Settle Suppliers and Close Books", "howItSupports": "Matches supplier invoices to confirmed services and raises exceptions for differences."}, {"id": "request-and-confirm-supplier-services", "name": "Request and Confirm Supplier Services", "howItSupports": "Provides the confirmed service records and the communication log used to resolve differences."}], "media": [{"type": "image", "src": "media/jbtd-fina-jtbd-fina-2-2.png", "title": "Finance and Administration Lead JTBD step 2: Import and match supplier invoices", "alt": "Enterprise infographic for step 2 of the job \"Settle suppliers and flights accurately\": Import and match supplier invoices."}]}, {"step": "Reconcile flight settlement files", "description": "Import IATA HOT and Airtrade settlement files, match tickets to passengers and booking files, catch ADMs, refunds and unused tickets, and post the net amounts.", "streamsNeeded": [{"id": "settle-suppliers-and-close-books", "name": "Settle Suppliers and Close Books", "howItSupports": "Imports and matches flight settlement files against ticket records."}, {"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "howItSupports": "Holds the flight import and ticket data per booking that the settlement is matched against."}], "media": [{"type": "image", "src": "media/jbtd-fina-jtbd-fina-2-3.png", "title": "Finance and Administration Lead JTBD step 3: Reconcile flight settlement files", "alt": "Enterprise infographic for step 3 of the job \"Settle suppliers and flights accurately\": Reconcile flight settlement files."}]}, {"step": "Run payment batches and post to accounting", "description": "Approve payment batches per supplier and currency, execute them from the bank, and post purchases, payments and FX differences to Exact automatically.", "streamsNeeded": [{"id": "settle-suppliers-and-close-books", "name": "Settle Suppliers and Close Books", "howItSupports": "Generates payment batches and posts purchase entries and payments to the accounting integration."}, {"id": "steer-the-travel-business-with-insight", "name": "Steer the Travel Business with Insight", "howItSupports": "Updates realised margin per departure and file once purchase cost is settled."}], "media": [{"type": "image", "src": "media/jbtd-fina-jtbd-fina-2-4.png", "title": "Finance and Administration Lead JTBD step 4: Run payment batches and post to accounting", "alt": "Enterprise infographic for step 4 of the job \"Settle suppliers and flights accurately\": Run payment batches and post to accounting."}]}], "media": [{"type": "image", "src": "media/jbtd-fina-jtbd-fina-2.png", "title": "Finance and Administration Lead JTBD infographic: Settle suppliers and flights accurately", "alt": "Enterprise infographic for the job \"Settle suppliers and flights accurately\" for customer \"Finance and Administration Lead\"."}]}, {"id": "jtbd-fina-3", "name": "Close the books and report to fund and regulator without spreadsheets", "whatItIs": "Close each month and the year from the platform: reconcile sales, purchases, payments and bank, produce the SGR guarantee-fund report, package-travel and VAT figures, and give the accountant and auditor an audit trail from booking to ledger.", "outcome": "Monthly books close within a week, the SGR and regulatory reports are generated rather than rebuilt, and the year-end audit runs on system records with no spreadsheet reconciliations.", "steps": [{"step": "Keep the ledger in sync every day", "description": "Have sales invoices, credit notes, payments, supplier invoices and bank movements post to the accounting package daily, with a reconciliation view that flags anything the integration could not post.", "streamsNeeded": [{"id": "settle-suppliers-and-close-books", "name": "Settle Suppliers and Close Books", "howItSupports": "Posts all financial events to accounting and reports integration exceptions."}, {"id": "collect-payments-and-invoice", "name": "Collect Payments and Invoice", "howItSupports": "Supplies the sales-side invoices and payment transactions."}], "media": [{"type": "image", "src": "media/jbtd-fina-jtbd-fina-3-1.png", "title": "Finance and Administration Lead JTBD step 1: Keep the ledger in sync every day", "alt": "Enterprise infographic for step 1 of the job \"Close the books and report to fund and regulator without spreadsheets\": Keep the ledger in sync every day."}]}, {"step": "Reconcile and close the month", "description": "Run the close checklist: match bank, payment-provider and ledger balances, review unmatched supplier invoices, accrue known costs for departed trips, and lock the period.", "streamsNeeded": [{"id": "settle-suppliers-and-close-books", "name": "Settle Suppliers and Close Books", "howItSupports": "Provides the close checklist, reconciliations and period lock."}], "media": [{"type": "image", "src": "media/jbtd-fina-jtbd-fina-3-2.png", "title": "Finance and Administration Lead JTBD step 2: Reconcile and close the month", "alt": "Enterprise infographic for step 2 of the job \"Close the books and report to fund and regulator without spreadsheets\": Reconcile and close the month."}]}, {"step": "Produce fund and regulatory reporting", "description": "Generate the SGR guarantee-fund report from booking and payment records, the package-travel compliance evidence, VAT and travel-tax figures, and the electronic invoicing archive.", "streamsNeeded": [{"id": "settle-suppliers-and-close-books", "name": "Settle Suppliers and Close Books", "howItSupports": "Produces guarantee-fund and regulatory reports from settled records."}, {"id": "steer-the-travel-business-with-insight", "name": "Steer the Travel Business with Insight", "howItSupports": "Adds the trend and exposure views the owner and the fund ask for."}], "media": [{"type": "image", "src": "media/jbtd-fina-jtbd-fina-3-3.png", "title": "Finance and Administration Lead JTBD step 3: Produce fund and regulatory reporting", "alt": "Enterprise infographic for step 3 of the job \"Close the books and report to fund and regulator without spreadsheets\": Produce fund and regulatory reporting."}]}, {"step": "Hand the auditor a trail, not a spreadsheet", "description": "Give the accountant and auditor drill-down from ledger entry to invoice to booking to supplier confirmation, so year-end questions are answered from the system.", "streamsNeeded": [{"id": "settle-suppliers-and-close-books", "name": "Settle Suppliers and Close Books", "howItSupports": "Keeps the booking-to-ledger audit trail and year-end pack."}, {"id": "steer-the-travel-business-with-insight", "name": "Steer the Travel Business with Insight", "howItSupports": "Provides the annual analyses the auditor and owner review together."}], "media": [{"type": "image", "src": "media/jbtd-fina-jtbd-fina-3-4.png", "title": "Finance and Administration Lead JTBD step 4: Hand the auditor a trail, not a spreadsheet", "alt": "Enterprise infographic for step 4 of the job \"Close the books and report to fund and regulator without spreadsheets\": Hand the auditor a trail, not a spreadsheet."}]}], "media": [{"type": "image", "src": "media/jbtd-fina-jtbd-fina-3.png", "title": "Finance and Administration Lead JTBD infographic: Close the books and report to fund and regulator without spreadsheets", "alt": "Enterprise infographic for the job \"Close the books and report to fund and regulator without spreadsheets\" for customer \"Finance and Administration Lead\"."}]}], "customerJourneyStories": [{"id": "journey-fina-1", "name": "Adopting the finance module and Exact integration", "linkedJobIds": ["jtbd-fina-1", "jtbd-fina-3"], "summary": "The finance lead of a tailor-made operator moves invoicing, payment collection and the accounting link onto the platform's Finance and Accounting module: triggered by a painful year-end, discovered through the vendor's finance consultant and a reference customer, evaluated on a chart-of-accounts mapping and a test posting, piloted on one month in parallel, and retained on days-to-close.", "stages": [{"stage": "Trigger", "narrative": "The year-end audit takes three weeks because invoices are produced in the back office, payments tracked in a spreadsheet, and Exact updated by hand from monthly exports; the auditor finds two bookings invoiced twice and one deposit never chased. The owner asks how many more seasons this can go on.", "media": [{"type": "image", "src": "media/journey-fina-fina-1-1.png", "title": "Finance and Administration Lead journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"Adopting the finance module and Exact integration\": Trigger."}]}, {"stage": "Discovery", "narrative": "The operator already runs the back office; at the vendor's user day the finance lead sits in the Finance and Accounting session and hears a peer from a comparable specialist describe daily automatic posting to Exact, Mollie payment links and an SGR report generated in minutes. The vendor's finance consultant offers a working session on the operator's own chart of accounts.", "media": [{"type": "image", "src": "media/journey-fina-fina-1-2.png", "title": "Finance and Administration Lead journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"Adopting the finance module and Exact integration\": Discovery."}]}, {"stage": "Evaluation", "narrative": "The evaluation is concrete: a mapping of ledger accounts, cost centres and VAT codes, a test posting of one week of real invoices and payments into a sandbox Exact administration, a check that the deposit and balance logic matches the operator's terms, and a call with the reference customer's finance lead about the year-end. The external accountant reviews the audit trail and approves.", "media": [{"type": "image", "src": "media/journey-fina-fina-1-3.png", "title": "Finance and Administration Lead journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"Adopting the finance module and Exact integration\": Evaluation."}]}, {"stage": "Trial", "narrative": "The pilot is one month in parallel: invoices and payment links go out from the platform while the old process continues, the daily postings are reconciled against the manual ones, and reminders run on real due dates. Three mapping corrections later, the finance lead closes the pilot month from the platform and the manual process stops.", "media": [{"type": "image", "src": "media/journey-fina-fina-1-4.png", "title": "Finance and Administration Lead journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"Adopting the finance module and Exact integration\": Trial."}]}, {"stage": "Engagement", "narrative": "Within two seasons all receivables, credit notes, refunds and bank reconciliation run through the module; electronic invoicing is switched on for business and reseller clients, and the SGR report is generated rather than rebuilt. The close checklist replaces the personal to-do list and the accountant logs into the audit trail directly.", "media": [{"type": "image", "src": "media/journey-fina-fina-1-5.png", "title": "Finance and Administration Lead journey stage 5: Engagement", "alt": "Enterprise journey panel for stage 5 of \"Adopting the finance module and Exact integration\": Engagement."}]}, {"stage": "Retention", "narrative": "Days to close drop from twelve to under a week, overdue receivables become a short list rather than a season-long chase, and the year-end audit takes days. The finance lead becomes the reference for the next operator, asks for the flight settlement module, and would resist any owner's suggestion to switch platforms.", "media": [{"type": "image", "src": "media/journey-fina-fina-1-6.png", "title": "Finance and Administration Lead journey stage 6: Retention", "alt": "Enterprise journey panel for stage 6 of \"Adopting the finance module and Exact integration\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-fina-fina-1.png", "title": "Finance and Administration Lead customer journey: Adopting the finance module and Exact integration", "alt": "Enterprise journey storyboard for \"Adopting the finance module and Exact integration\" for customer \"Finance and Administration Lead\"."}]}, {"id": "journey-fina-2", "name": "Moving flight settlement and supplier invoices into the platform", "linkedJobIds": ["jtbd-fina-2"], "summary": "A group operator's finance lead adopts supplier settlement and flight settlement file matching after years of manual reconciliation: triggered by IATA HOT surprises, discovered from the vendor roadmap and the Airtrade partnership, evaluated on a match-rate test with real files, piloted on one season's departures, and retained on supplier match rate and realised margin visibility.", "stages": [{"stage": "Trigger", "narrative": "A quarterly IATA HOT file contains ADMs and ticket refunds nobody can trace to booking files, and a DMC in Portugal invoices thirty extra room nights that operations swears were cancelled. Reconciling both takes the finance lead two weeks and the realised margin of the spring departures is still unknown in July.", "media": [{"type": "image", "src": "media/journey-fina-fina-2-1.png", "title": "Finance and Administration Lead journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"Moving flight settlement and supplier invoices into the platform\": Trigger."}]}, {"stage": "Discovery", "narrative": "During a support call about the invoicing module the finance lead learns that the platform imports HOT and Airtrade settlement files and matches supplier invoices to confirmed services; a webinar with the Airtrade partner shows the matching on real files, and a peer coach operator confirms the DMC portal keeps confirmations in sync.", "media": [{"type": "image", "src": "media/journey-fina-fina-2-2.png", "title": "Finance and Administration Lead journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"Moving flight settlement and supplier invoices into the platform\": Discovery."}]}, {"stage": "Evaluation", "narrative": "The finance lead sends three months of anonymised HOT files, DMC invoices and booking data for a match-rate test, checks how unmatched lines are surfaced as tasks, how currencies and FX differences post to Exact, and whether the DMC portal will make suppliers confirm changes instead of emailing them. A written exception-handling procedure agreed with the vendor's finance consultant closes the evaluation.", "media": [{"type": "image", "src": "media/journey-fina-fina-2-3.png", "title": "Finance and Administration Lead journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"Moving flight settlement and supplier invoices into the platform\": Evaluation."}]}, {"stage": "Trial", "narrative": "The pilot covers one season's departures: supplier invoices and settlement files are imported and matched while the old spreadsheet reconciliation runs alongside, and every difference is investigated together with operations. The match rate rises each week as suppliers start confirming through the portal.", "media": [{"type": "image", "src": "media/journey-fina-fina-2-4.png", "title": "Finance and Administration Lead journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"Moving flight settlement and supplier invoices into the platform\": Trial."}]}, {"stage": "Engagement", "narrative": "Payment batches per supplier and currency are approved in the platform, purchase postings flow daily into Exact, and realised margin per departure appears as soon as the supplier invoice is matched. The finance lead reviews exceptions in a daily task list instead of chasing files at quarter-end.", "media": [{"type": "image", "src": "media/journey-fina-fina-2-5.png", "title": "Finance and Administration Lead journey stage 5: Engagement", "alt": "Enterprise journey panel for stage 5 of \"Moving flight settlement and supplier invoices into the platform\": Engagement."}]}, {"stage": "Retention", "narrative": "Supplier invoice matching and flight settlement are now routine, ADMs and unused tickets are caught within the settlement period, and the owner sees realised margin in the weekly meeting. The finance lead tells the auditor there are no spreadsheets left to review and presents the setup at the next user day.", "media": [{"type": "image", "src": "media/journey-fina-fina-2-6.png", "title": "Finance and Administration Lead journey stage 6: Retention", "alt": "Enterprise journey panel for stage 6 of \"Moving flight settlement and supplier invoices into the platform\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-fina-fina-2.png", "title": "Finance and Administration Lead customer journey: Moving flight settlement and supplier invoices into the platform", "alt": "Enterprise journey storyboard for \"Moving flight settlement and supplier invoices into the platform\" for customer \"Finance and Administration Lead\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-fina-top", "name": "Days to close monthly books", "description": "Working days from the last day of the month until the period is reconciled, posted and locked in accounting, the finance lead's headline measure of a spreadsheet-free administration.", "unit": "days", "currentValue": "12", "targetValue": "5", "link": "https://dashboard.example.com/tour-operator-erp-platform/customers/fina/kpis/co-fina-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-fina-co-fina-top.png"}, "branches": [{"id": "co-fina-b1", "name": "Receivables and cash collection", "description": "How completely and quickly customer money arrives and how accurate the invoices behind it are.", "currentValue": "64", "icon": "kpi-fina-co-fina-b1.png", "children": [{"id": "co-fina-b1-c1", "name": "Overdue receivables share", "description": "Share of open customer receivables past their deposit or balance due date.", "unit": "%", "currentValue": "8.5", "targetValue": "3.0", "icon": "kpi-fina-c ules instead of by hand.", "unit": "%", "currentValue": "48", "targetValue": "90", "icon": "kpi-fina-bo-fina-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-fina-b2", "name": "Efficiency of the finance service", "description": "How cheaply the platform supports finance tenants and how loyally they renew.", "currentValue": "57", "icon": "kpi-fina-bo-fina-b2.png", "children": [{"id": "bo-fina-b2-c1", "name": "Finance support tickets per tenant", "description": "Support tickets per finance-module tenant per quarter.", "unit": "tickets / quarter", "currentValue": "7.5", "targetValue": "2.5", "icon": "kpi-fina-bo-fina-b2-c1.png", "children": [{"id": "bo-fina-b2-c1-l1", "name": "Close-related support ticket share", "description": "Share of finance tickets raised during month-end or year-end close.", "unit": "%", "currentValue": "35", "targetValue": "12", "icon": "kpi-fina-bo-fina-b2-c1-l1.png", "children": []}, {"id": "bo-fina-b2-c1-l2", "name": "Integration-failure tickets per quarter", "description": "Tickets per tenant caused by failed or mismatched accounting postings.", "unit": "tickets / quarter", "currentValue": "3", "targetValue": "0.5", "icon": "kpi-fina-bo-fina-b2-c1-l2.png", "children": []}]}, {"id": "bo-fina-b2-c2", "name": "Finance module renewal rate", "description": "Share of finance-module subscriptions renewed at term.", "unit": "%", "currentValue": "93", "targetValue": "97", "icon": "kpi-fina-bo-fina-b2-c2.png", "children": [{"id": "bo-fina-b2-c2-l1", "name": "Finance advisory engagements per year", "description": "Paid process-optimisation engagements delivered by the vendor's finance consultants.", "unit": "engagements / year", "currentValue": "12", "targetValue": "30", "icon": "kpi-fina-bo-fina-b2-c2-l1.png", "children": []}, {"id": "bo-fina-b2-c2-l2", "name": "Compliance feature usage rate", "description": "Share of finance tenants generating SGR and regulatory reports from the platform.", "unit": "%", "currentValue": "60", "targetValue": "90", "icon": "kpi-fina-bo-fina-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make finance and compliance a by-product of running the travel business on the platform: every booking invoices, collects, settles and reports itself, and the finance lead closes the month from a checklist instead of a spreadsheet.", "timeHorizons": {"year1": {"focus": "Unify the finance capabilities of both brands: invoicing, Mollie payment links and reminders, and a proven Exact integration with a finance-consultant-led onboarding and parallel run, so finance leads of group and tailor-made operators trust the platform with receivables.", "productTheme": "One trusted finance backbone for both brands", "customerKPI": {"northStar": "Days to close monthly books", "supporting": ["Overdue receivables share", "Invoice accuracy rate"]}, "businessKPI": {"northStar": "Finance and payments revenue per tenant", "revenueStreams": ["Finance module subscriptions", "Payment-link services", "Finance onboarding and advisory"], "supporting": ["Finance module attach rate", "Accounting integration activation rate"]}, "milestones": ["Deliver the shared invoicing and payment-link engine with automated reminders to tenants of both brands", "Certify the Exact integration with a standard chart-of-accounts mapping and a parallel-run playbook", "Staff finance onboarding with travel-trade finance consultants"]}, "year3": {"focus": "Make finance and compliance the standard attach of the single-brand ERP: automatic supplier and flight settlement matching, guarantee-fund and package-travel reporting generated from records, electronic invoicing, and payment and accounting partners certified in the marketplace.", "productTheme": "Finance and compliance as the standard attach", "customerKPI": {"northStar": "Days to close monthly books", "supporting": ["Supplier invoice auto-match rate", "Regulatory reporting effort"]}, "businessKPI": {"northStar": "Finance and payments revenue per tenant", "revenueStreams": [" by phone and email, approves online quotes on the \"booking inzien\" pages, pays deposits and balances through payment links, submits passenger details, room wishes and dietary requirements, downloads documents from the my-trip portal, travels with the partner app and an eSIM, and leaves a review on Trustpilot afterwards. Uses the portals for free; the operator pays, and the traveler's self-service is what saves the operator handling time.", "icon": "trav.png", "careAbout": ["Being sure the trip, dates, hotel, seats and price are exactly what was promised before paying", "A booking and payment flow that works on a phone in ten minutes, with iDEAL or card, and immediate confirmation", "Knowing at any time what has been paid, what is still due, and when the travel documents arrive", "Sharing passenger details, seat and room wishes, and dietary needs once, and seeing them honoured", "Travel documents, itinerary, and practical information in one place, including on the road without a data plan surprise", "Being heard when something goes wrong and having the review reflect the real experience"], "winsThem": ["A website that shows real availability and prices and turns a completed booking into an instant confirmation with the deposit paid", "A visual online proposal for a tailor-made journey that can be approved, tweaked and paid with one link", "A my-trip portal and app with documents, itinerary, payments and messaging, plus past bookings to rebook from", "Clear package-travel information, SGR guarantee-fund cover and Trustpilot reviews that make an unknown operator trustworthy", "Proactive messages about changes, departure times and pickup points instead of having to call the office"], "theirFear": ["Paying a large balance months in advance to an operator that might fail or disappear, with no guarantee-fund cover", "Arriving to find the hotel, seat or room arrangement is not what was booked because details were lost", "Documents arriving too late or in an email that got lost, and no way to reach anyone during the trip"], "jobsToBeDone": [{"id": "jtbd-trav-1", "name": "Find, book and pay for the right trip with confidence", "whatItIs": "Choose the right departure, room and options or accept a tailor-made proposal, understand exactly what is included and what the package-travel rules and guarantee-fund cover mean, and complete the booking and deposit payment in one sitting without needing to call.", "outcome": "A confirmed booking with the deposit paid, a clear invoice and payment schedule, and the certainty that the trip, price and conditions are exactly as chosen.", "steps": [{"step": "Compare departures, rooms and options", "description": "Browse the operator's website or the proposal, see real availability per departure, room types, single supplements, excursions and price per person, and shortlist the right combination.", "streamsNeeded": [{"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "howItSupports": "Shows live availability, prices and options from the back office so the comparison is accurate."}, {"id": "build-and-price-travel-products", "name": "Build and Price Travel Products", "howItSupports": "Supplies the product content, departures, pricing and availability that the website renders."}], "media": [{"type": "image", "src": "media/jbtd-trav-jtbd-trav-1-1.png", "title": "Traveler and Booker JTBD step 1: Compare departures, rooms and options", "alt": "Enterprise infographic for step 1 of the job \"Find, book and pay for the right trip with confidence\": Compare departures, rooms and options."}]}, {"step": "Approve the proposal or start the booking", "description": "For tailor-made trips, review the visual online proposal on the booking-inzien page, ask for changes, and approve; for fixed departures, start the booking and enter travelers and wishes.", "streamsNeeded": [{"id": "quote-and-sell-tailor-made-trips", "name": "Quote and Sell Tailor-Made Trips", "howItSupports": "Provides the visual pr
