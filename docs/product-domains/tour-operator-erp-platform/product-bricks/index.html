 seats together and a triple room if sold.", "The system shows only the deltas so the operator can sanity-check them in a minute."], "painPoints": ["Re-doing the whole seating plan for one change is where errors enter.", "Triple rooms not available at every hotel go unnoticed until check-in."], "dependencies": [{"type": "brick", "id": "seat", "name": "Seat and Room Allocation", "description": "Delta re-allocation.", "how": "Updates seats and rooms for changed files."}, {"type": "brick", "id": "dept", "name": "Departures and Capacity Management", "description": "Capacity after the change.", "how": "Reflects new load factor and margin."}]}, {"id": "propagate-to-hotels-and-coach", "title": "Propagate the change to hotels and the coach company", "actor": "Group Travel Operations Manager", "keyFacts": ["Hotels and the coach company receive an updated list or a change notice highlighting the delta, one to one from the change on the file.", "Portal suppliers see the updated list immediately; email suppliers get a versioned document."], "painPoints": ["Sending a full new list without highlighting the delta makes hotels miss the change.", "Unsent changes are the root of most wrong room assignments."], "dependencies": [{"type": "brick", "id": "sprt", "name": "Supplier and DMC Portal", "description": "Updated lists in the supplier portal.", "how": "Publishes the changed list with delta."}, {"type": "brick", "id": "supl", "name": "Supplier Management and Communication", "description": "Change notices by email.", "how": "Sends versioned change notices and logs them."}]}, {"id": "update-guide-and-documents", "title": "Update the guide's list and regenerate documents", "actor": "Group Travel Operations Manager", "keyFacts": ["The guide portal reflects the change immediately; affected travelers receive regenerated documents in their portal.", "The changed party is notified which documents changed."], "painPoints": ["Guides find out about changes from the passengers.", "Old documents in travelers' inboxes contradict new ones."], "dependencies": [{"type": "brick", "id": "guid", "name": "Guide and Group Leader Portal", "description": "Live participant list.", "how": "Shows the updated list to the guide."}, {"type": "brick", "id": "docs", "name": "Travel Documents and Itinerary Delivery", "description": "Regenerated documents.", "how": "Reissues documents for affected bookings."}]}, {"id": "settle-financial-effect", "title": "Settle the financial effect of the change", "actor": "Finance and Administration Lead", "keyFacts": ["Cancellation fees, refunds and new invoices are created from the change; the supplier cost side is adjusted for finance.", "Refunds due under the conditions are paid within the statutory period."], "painPoints": ["Refunds forgotten after a cancellation create complaints and regulatory exposure.", "Supplier cost not adjusted overstates margin."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Financial lines after the change.", "how": "Provides fees and refunds to invoicing."}]}]}], "outcomes": ["Fewer operational hours per departure, because seat, room, guide and passenger lists are generated from the booking files instead of rebuilt by hand", "Higher departure load factor and fewer cancelled departures, thanks to timely go/no-go decisions and yield actions", "Accurate room lists and dietary information at every hotel, with changes propagated the moment a booking changes"], "brickDependencies": [{"targetBrickId": "dept", "type": "composition"}, {"targetBrickId": "seat", "type": "composition"}, {"targetBrickId": "guid", "type": "composition"}, {"targetBrickId": "pass", "type": "composition"}, {"targetBrickId": "book", "type": "composition"}, {"targetBrickId": "sprt", "type": "composition"}, {"targetBrickId": "supl", "type": "composition"}, {"targetBrickId": "docs", "type": "composition"}, {"targetBrickId": "wflw", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "Coach Operator Planning", "type": "supplier-system", "interface": "Seating plan and driver list exchange", "description": "The bus company that receives the seating list and driver instructions for a departure."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []}, {"id": "request-and-confirm-supplier-services", "name": "Request and Confirm Supplier Services", "icon": "request-and-confirm-supplier-services.png", "type": "outcome-based-stream", "description": "Take booking lines \u2014 an on-request lodge, a DMC ground package, a private transfer, a group's hotel block \u2014 to confirmed supplier services with every request, confirmation, rejection and change logged against the file. Suppliers and DMCs work in a portal or by structured email; changes on the operator side propagate one to one to the supplier, and supplier responses update the file without re-keying.", "group": "Operations and Supply Journeys", "rootGroup": "Operations and Supply Journeys", "flows": [{"id": "request-confirm-and-sync-services-with-a-dmc", "title": "Request, Confirm and Sync Services with a DMC", "description": "A tour operator sends the ground services of a group departure to its destination management company, the DMC confirms in the portal, and later changes flow both ways.", "primaryActor": "DMC Ground Operations Manager", "trigger": "A group departure is guaranteed and the operator releases the ground-services request to the DMC.", "successSignal": "All ground services are confirmed by the DMC, the file shows confirmed status per line, and later changes are acknowledged in the portal.", "steps": [{"id": "generate-service-requests", "title": "Generate service requests from the booking lines", "actor": "Group Travel Operations Manager", "keyFacts": ["Every on-request or DMC line on the file becomes a structured service request: service, dates, pax, room types, special wishes and the contracted rate.", "Requests are bundled per supplier and per departure so the DMC receives one request set, not twenty emails."], "painPoints": ["Requests written by hand omit the detail the supplier needs and trigger a round of questions.", "Requests sent per booking overwhelm DMCs with fragments they must consolidate."], "dependencies": [{"type": "brick", "id": "supl", "name": "Supplier Management and Communication", "description": "Request generation and bundling.", "how": "Creates structured requests per supplier."}, {"type": "brick", "id": "cont", "name": "Purchasing and Supplier Contracts", "description": "Contracted rates and terms.", "how": "Attaches the agreed rate to each request."}]}, {"id": "deliver-request-to-supplier", "title": "Deliver the request via portal, email or API", "actor": "Group Travel Operations Manager", "keyFacts": ["Portal suppliers get a notification and see the request in their work list; email suppliers receive a structured message; API-connected suppliers receive it machine to machine.", "Delivery and read status are tracked so the operator knows what is pending."], "painPoints": ["Unread requests discovered a week later derail the timeline.", "Suppliers without a portal still need a clear, complete request."], "dependencies": [{"type": "brick", "id": "sprt", "name": "Supplier and DMC Portal", "description": "Supplier portal work list.", "how": "Shows the request to the DMC and tracks its status."}, {"type": "brick", "id": "intg", "name": "Integration Hub and Partner APIs", "description": "Supplier API delivery.", "how": "Delivers requests to API-connected suppliers."}]}, {"id": "dmc-reviews-and-confirms", "title": "The DMC reviews and confirms or rejects each service", "actor": "DMC Ground Operations Manager", "keyFacts": ["The DMC confirms each line, adds a supplier reference and can propose an alternative (different lodge, changed time) instead of rejecting.", "Confirmation captures the DMC's own cancellation terms per service."], "painPoints": ["Confirmations by free-text email have to be interpreted and typed into the file.", "Alternatives offered by phone are lost and re-requested."], "dependencies": [{"type": "brick", "id": "sprt", "name": "Supplier and DMC Portal", "description": "Line-level confirmation in the portal.", "how": "Records confirm, reject or alternative per line with references."}]}, {"id": "update-file-and-notify", "title": "Update the file and notify the operator", "actor": "Group Travel Operations Manager", "keyFacts": ["Confirmed lines flip to confirmed on the file with the supplier reference; rejections and alternatives create a task for the operator.", "Travel documents can only be issued when all lines are confirmed, which the workflow enforces."], "painPoints": ["Files that show 'requested' forever hide the risk of unconfirmed services.", "Documents issued with unconfirmed services lead to travelers standing at closed doors."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Line status and supplier references.", "how": "Updates line status from supplier responses."}, {"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Tasks for rejections and document gating.", "how": "Creates tasks and blocks documents until all lines are confirmed."}]}, {"id": "share-passenger-and-room-data", "title": "Share passenger and room data with the DMC", "actor": "Group Travel Operations Manager", "keyFacts": ["Closer to departure the DMC receives the passenger list, room list and wishes for the confirmed services, generated from the same file data.", "Only data needed for the service is shared, per supplier."], "painPoints": ["Room lists sent to DMCs by spreadsheet diverge from the hotel lists sent by the operator.", "Oversharing passenger data with every supplier is a privacy exposure."], "dependencies": [{"type": "brick", "id": "pass", "name": "Passenger Data and Operational Lists", "description": "Passenger and room data per supplier.", "how": "Generates supplier-specific passenger lists."}, {"type": "brick", "id": "sprt", "name": "Supplier and DMC Portal", "description": "Passenger lists in the portal.", "how": "Publishes the lists to the DMC."}]}, {"id": "propagate-changes-one-to-one", "title": "Propagate operator changes one to one to the DMC", "actor": "Group Travel Operations Manager", "keyFacts": ["A change on the file (extra passenger, changed room type, cancelled excursion) creates a versioned change request for the affected line only.", "The DMC acknowledges the change in the portal; unacknowledged changes are escalated by workflow."], "painPoints": ["Changes communicated in an email thread are the leading cause of DMC service errors.", "Without acknowledgement, the operator assumes the DMC knows."], "dependencies": [{"type": "brick", "id": "supl", "name": "Supplier Management and Communication", "description": "Versioned change requests.", "how": "Creates change deltas per affected line."}, {"type": "brick", "id": "sprt", "name": "Supplier and DMC Portal", "description": "Change acknowledgement.", "how": "Lets the DMC acknowledge or dispute the change."}]}, {"id": "dmc-reports-delivery-and-invoices", "title": "The DMC reports delivery and invoices the operator", "actor": "DMC Ground Operations Manager", "keyFacts": ["After the service the DMC marks delivery, reports no-shows and uploads its invoice against the confirmed lines.", "Invoice lines matched to confirmed service lines make the operator's supplier settlement a check, not a reconstruction."], "painPoints": ["Invoices that do not reference the request cannot be matched.", "No-shows unreported by the DMC are invoiced anyway."], "dependencies": [{"type": "brick", "id": "sprt", "name": "Supplier and DMC Portal", "description": "Delivery status and invoice upload.", "how": "Captures delivery and the supplier invoice."}]}]}, {"id": "confirm-ad-hoc-components-for-a-tailor-made-trip", "title": "Confirm Ad-Hoc Components for a Tailor-Made Trip", "description": "A specialist confirms every on-request lodge, transfer and activity of an accepted tailor-made proposal before travel documents are released.", "primaryActor": "Tailor-Made Travel Specialist", "trigger": "A client approved a proposal with twelve on-request components across three countries.", "successSignal": "All twelve components are confirmed with supplier references, or replaced by confirmed alternatives, before the document deadline.", "steps": [{"id": "list-unconfirmed-lines", "title": "List the unconfirmed lines and their deadlines", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["The file shows each on-request line with the supplier, the days since request and the deadline by which it must be confirmed for the trip to hold.", "Lines from bed-bank or API suppliers may already be instantly confirmed."], "painPoints": ["Specialists tracking confirmations in a notebook lose lines.", "Instant-confirm suppliers mixed with slow ones hide where the risk is."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Unconfirmed lines per file.", "how": "Lists lines by status and deadline."}, {"type": "brick", "id": "comp", "name": "Components, Inventory and Availability", "description": "Instant versus on-request components.", "how": "Distinguishes instantly confirmed components."}]}, {"id": "send-requests-to-suppliers", "title": "Send requests to all suppliers in one action", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["All open lines are requested in one action, each supplier receiving its own structured request by portal, email or API.", "Request texts are templated per supplier language."], "painPoints": ["Writing twelve emails by hand takes an afternoon.", "Requests in the wrong language get slower answers."], "dependencies": [{"type": "brick", "id": "supl", "name": "Supplier Management and Communication", "description": "Batch request per supplier.", "how": "Generates and sends requests for all open lines."}, {"type": "brick", "id": "comm", "name": "Email and Telephony Integration", "description": "Templated supplier emails.", "how": "Sends language-specific request emails."}]}, {"id": "chase-with-workflow", "title": "Chase overdue confirmations automatically", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Workflow sends reminders to suppliers and raises a task for the specialist when a line passes its expected confirmation time.", "The AI assistant drafts follow-up messages and flags supplier replies that need a decision."], "painPoints": ["Chasing by memory means the slowest supplier is discovered last.", "Inbox triage of supplier replies eats the specialist's morning."], "dependencies": [{"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Reminders and overdue tasks.", "how": "Automates chasing and escalation."}]}, {"id": "process-supplier-replies", "title": "Process supplier replies and alternatives", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Replies from portal and API update lines automatically; email replies are attached to the line and confirmed with one click.", "Alternatives are re-priced and, if the price changes, the client is informed via the portal."], "painPoints": ["Manual reading of confirmations misses changed dates or prices in the reply.", "Price changes not passed to the client surface at final invoice."], "dependencies": [{"type": "brick", "id": "sprt", "name": "Supplier and DMC Portal", "description": "Portal and API confirmations.", "how": "Records supplier responses per line."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Line confirmation and re-pricing.", "how": "Updates status and price on the line."}]}, {"id": "verify-all-confirmed", "title": "Verify all lines confirmed and release documents", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Documents are gated on full confirmation; the file shows a single 'ready' status when every line has a supplier reference.", "Supplier references are printed on vouchers so the traveler can prove the booking on site."], "painPoints": ["Documents released with a missing confirmation are the worst-case failure for a tailor-made operator.", "Vouchers without supplier references are refused at reception."], "dependencies": [{"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Document release gate.", "how": "Allows document generation only when all lines are confirmed."}]}, {"id": "log-history-on-file", "title": "Keep the full communication history on the file", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Every request, reply, change and confirmation is stored on the booking line, visible to any colleague covering the file.", "History is the evidence base for disputes with suppliers and clients."], "painPoints": ["Communication in personal mailboxes disappears with the employee.", "Disputes without history are settled at the operator's cost."], "dependencies": [{"type": "brick", "id": "supl", "name": "Supplier Management and Communication", "description": "Communication log per line.", "how": "Stores all supplier communication."}, {"type": "brick", "id": "comm", "name": "Email and Telephony Integration", "description": "Email threads attached to lines.", "how": "Links mail threads to booking lines."}]}]}], "outcomes": ["Faster supplier confirmation, because requests are generated from the file and answered in a portal rather than composed and parsed by hand", "Fewer change errors between operator and DMC, because every change is a versioned delta on the same request", "Complete communication history per booking line, so anyone can see what was requested, confirmed and changed"], "brickDependencies": [{"targetBrickId": "supl", "type": "composition"}, {"targetBrickId": "sprt", "type": "composition"}, {"targetBrickId": "book", "type": "composition"}, {"targetBrickId": "comp", "type": "composition"}, {"targetBrickId": "cont", "type": "composition"}, {"targetBrickId": "pass", "type": "composition"}, {"targetBrickId": "wflw", "type": "composition"}, {"targetBrickId": "comm", "type": "composition"}, {"targetBrickId": "intg", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "WeCloudIT Email and Telephony", "type": "communication-platform", "interface": "Mailbox sync and click-to-dial / caller identification", "description": "Links inbound email and calls to the contact and booking file that the agent is working on."}, {"system": "Bed-Bank and Supplier Content Feeds", "type": "supply-integration", "interface": "Availability, rate and content APIs", "description": "Live accommodation and activity content that feeds components, availability and pricing."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []}, {"id": "collect-payments-and-invoice", "name": "Collect Payments and Invoice", "icon": "collect-payments-and-invoice.png", "type": "outcome-based-stream", "description": "Take every booking from confirmation to fully paid: issue deposit and balance invoices from the file, send payment links, let travelers and resellers pay in the portal, match incoming payments automatically, remind before the due date and alert after it, and keep the receivables position current for finance without spreadsheets.", "group": "Finance and Compliance Journeys", "rootGroup": "Finance and Compliance Journeys", "flows": [{"id": "from-deposit-to-final-payment", "title": "From Deposit to Final Payment", "description": "The standard collection cycle of a package booking: deposit at booking, balance six to eight weeks before departure, automatic reminders and matching.", "primaryActor": "Finance and Administration Lead", "trigger": "A booking is confirmed and the deposit invoice is due.", "successSignal": "The booking is fully paid before the balance due date, with every payment matched to its invoice and visible in the file.", "steps": [{"id": "issue-deposit-invoice", "title": "Issue the deposit invoice from the booking", "actor": "Reservations and Sales Agent", "keyFacts": ["The deposit invoice is generated from the file with the deposit percentage from the conditions, the SGR contribution and any insurance premium as separate lines.", "Invoice numbering, VAT treatment (including the travel agents' margin scheme where applicable) and layout are configured per tenant."], "painPoints": ["Invoices typed in a separate accounting tool differ from the booking.", "Wrong VAT treatment on travel invoices is a recurring audit finding."], "dependencies": [{"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Invoice generation and numbering.", "how": "Creates the deposit invoice from booking lines."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Booking lines and conditions.", "how": "Provides amounts, percentages and lines."}]}, {"id": "send-payment-link", "title": "Send the payment link with the invoice", "actor": "Reservations and Sales Agent", "keyFacts": ["The invoice email carries a hosted payment link; iDEAL is the dominant method for Dutch consumers and settles within seconds.", "Travelers can also pay from the my-trip portal, where the open amount is always current."], "painPoints": ["Bank transfers with free-text references are matched by hand.", "Portals that show a stale open amount cause double payments."], "dependencies": [{"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Payment link issuance.", "how": "Attaches the link to the invoice."}, {"type": "brick", "id": "mytp", "name": "Traveler Portal and My-Trip App", "description": "Pay in the traveler portal.", "how": "Shows the open amount and offers payment."}]}, {"id": "match-incoming-payments", "title": "Match incoming payments automatically", "actor": "Finance and Administration Lead", "keyFacts": ["Payments via links are matched instantly; bank transfers are matched on invoice number, amount and payer with a review queue for exceptions.", "Partial payments and overpayments are handled by rule and shown on the file."], "painPoints": ["Manual matching of hundreds of transfers per week is the most tedious finance task at an operator.", "Unmatched payments trigger reminders to customers who already paid."], "dependencies": [{"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Payment matching and review queue.", "how": "Matches payments to invoices and flags exceptions."}]}, {"id": "remind-before-balance-due", "title": "Remind before the balance is due", "actor": "Finance and Administration Lead", "keyFacts": ["Workflow sends the balance invoice and a friendly reminder on a schedule relative to departure, with the payment link included.", "Reminder tone and timing are configurable per tenant and customer type."], "painPoints": ["Reminders sent by hand are late or forgotten in the high season.", "One-size reminders annoy good customers and do not move late ones."], "dependencies": [{"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Scheduled balance and reminder tasks.", "how": "Triggers reminders relative to departure."}, {"type": "brick", "id": "comm", "name": "Email and Telephony Integration", "description": "Reminder emails.", "how": "Sends and logs reminders."}]}, {"id": "alert-on-overdue", "title": "Alert the desk on overdue balances", "actor": "Finance and Administration Lead", "keyFacts": ["Overdue balances raise an alert on the file and a task for the responsible agent, with escalation to finance after a configurable period.", "Departures with unpaid files are visible to operations, since unpaid travelers should not receive documents."], "painPoints": ["Overdue lists exported weekly are outdated by the time someone calls.", "Documents issued to unpaid travelers remove the last leverage."], "dependencies": [{"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Overdue alerts and escalation.", "how": "Creates alerts and escalations for overdue files."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Payment status on the file.", "how": "Shows paid, open and overdue per file."}]}, {"id": "confirm-paid-and-release", "title": "Confirm paid status and release documents", "actor": "Reservations and Sales Agent", "keyFacts": ["Full payment flips the file to paid and releases document generation and the traveler's portal downloads.", "The contact record shows payment behaviour for future credit decisions."], "painPoints": ["Paid status checked by hand before every document run costs hours.", "Repeat late payers unrecognised get the same terms again."], "dependencies": [{"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Paid status.", "how": "Marks the file as fully paid."}, {"type": "brick", "id": "crmr", "name": "CRM and Contact Management", "description": "Payment behaviour on the contact.", "how": "Records payment history per contact."}]}, {"id": "report-receivables", "title": "Report the receivables position", "actor": "Finance and Administration Lead", "keyFacts": ["Open, overdue and prepaid amounts are reported per departure, product and customer type, which also feeds the guarantee-fund exposure calculation.", "Prepaid customer money is tracked separately because it is covered by the SGR guarantee until the trip is delivered."], "painPoints": ["Receivables in spreadsheets cannot answer 'what is our exposure per departure'.", "Mixing prepayments with revenue misstates the financial position."], "dependencies": [{"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Receivables reporting.", "how": "Reports open and prepaid positions."}]}]}], "outcomes": ["Lower overdue receivables, because reminders and payment links e purchase side: supplier and DMC invoices matched to confirmed lines, prepayments applied, and airline tickets reconciled with the BSP HOT or Airtrade settlement file.", "primaryActor": "Finance and Administration Lead", "trigger": "Supplier invoices arrive by email and portal, and the twice-monthly settlement file is available.", "successSignal": "All supplier invoices are matched or disputed, flight tickets reconcile with the settlement file, and purchase entries are posted.", "steps": [{"id": "receive-supplier-invoices", "title": "Receive supplier invoices against confirmed lines", "actor": "Finance and Administration Lead", "keyFacts": ["Invoices arrive via the supplier portal, e-invoicing or email; each is linked to the booking lines it covers, ideally by the supplier reference on the confirmation.", "Invoice capture extracts amounts, currency and references so matching can start immediately."], "painPoints": ["Invoices in a shared mailbox are matched by memory and often twice.", "Invoices without references need a call to the supplier."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Supplier invoice capture.", "how": "Registers invoices and links them to lines."}]}, {"id": "three-way-match", "title": "Match invoice, confirmation and delivery", "actor": "Finance and Administration Lead", "keyFacts": ["Each invoice line is matched to the confirmed rate, the delivered service and the actual passenger count reported by the guide or DMC.", "Deviations above a tolerance go to a dispute queue with the supplier communication attached."], "painPoints": ["Paying every invoice as received leaks margin through no-shows and rate errors.", "Disputes without the original request take weeks."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Three-way matching and disputes.", "how": "Matches invoices and routes deviations."}, {"type": "brick", "id": "supl", "name": "Supplier Management and Communication", "description": "Communication history for disputes.", "how": "Supplies the request and confirmation trail."}]}, {"id": "apply-prepayments-and-currencies", "title": "Apply prepayments and currency differences", "actor": "Finance and Administration Lead", "keyFacts": ["Prepayments made to lodges and DMCs are applied to the matching invoice; exchange differences are posted per file.", "Multi-currency purchase costs update the realised margin of each file."], "painPoints": ["Prepayments forgotten at invoice time are paid twice.", "Currency differences booked only at year end distort file margins."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Prepayment application and FX.", "how": "Applies prepayments and posts differences."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Realised margin per file.", "how": "Updates the file margin with actual cost."}]}, {"id": "reconcile-flight-settlement", "title": "Reconcile tickets with the BSP HOT or Airtrade settlement file", "actor": "Finance and Administration Lead", "keyFacts": ["Imported tickets are matched to the BSP HOT file or the Airtrade consolidator statement on ticket number, fare, taxes and commission.", "Refunds, ADMs and voids are identified and posted to the right file."], "painPoints": ["Ticket settlement checked by hand from a PDF statement misses ADMs.", "Unmatched tickets become unexplained ledger differences."], "dependencies": [{"type": "brick", "id": "flgt", "name": "Flight Import and Ticket Settlement", "description": "Ticket records and settlement import.", "how": "Imports and matches the settlement file to tickets."}]}, {"id": "approve-payment-runs", "title": "Approve supplier payment runs", "actor": "Finance and Administration Lead", "keyFacts": ["Matched invoices are grouped into payment runs by due date and currency and approved by the owner above a threshold.", "Payment files are exported to the bank; paid status flows back to the invoice."], "painPoints": ["Ad-hoc payments outside a run lose control and discounts.", "Owners approving from email lack the matching evidence."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Payment runs and approval.", "how": "Prepares and tracks payment runs."}]}, {"id": "post-to-accounting", "title": "Post purchase and sales entries to accounting", "actor": "Finance and Administration Lead", "keyFacts": ["Sales invoices, credit notes, payments and matched purchase invoices are posted to Exact through the integration with cost centres per product and departure.", "Posting is idempotent and logged, so a re-run does not duplicate entries."], "painPoints": ["Manual journal exports create duplicate or missing entries.", "Accounting without departure-level cost centres cannot explain margin."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Accounting posting.", "how": "Generates and sends journal entries."}, {"type": "brick", "id": "intg", "name": "Integration Hub and Partner APIs", "description": "Accounting connector.", "how": "Transports entries to the accounting system."}]}, {"id": "review-file-margins", "title": "Review realised versus sold margin per file", "actor": "Travel Company Owner", "keyFacts": ["With purchase invoices matched, the realised margin per file and per departure is compared with the margin at sale.", "Outliers point to pricing, supplier or operational issues."], "painPoints": ["Margin known only at year end cannot steer the next season.", "Sold margin without realised margin flatters performance."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Margin reporting per file and departure.", "how": "Reports sold versus realised margin."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Sold and realised margin on the file.", "how": "Provides both margin figures."}]}]}, {"id": "close-the-month-and-report-to-the-guarantee-fund", "title": "Close the Month and Report to the Guarantee Fund", "description": "The month-end and compliance flow: reconcile, recognise revenue on departure, report to SGR and keep package-travel evidence ready.", "primaryActor": "Finance and Administration Lead", "trigger": "The month ends and the finance lead starts the close.", "successSignal": "The books are closed, revenue is recognised per departed trip, the SGR report is submitted from system data and the compliance evidence is complete.", "steps": [{"id": "reconcile-subledgers", "title": "Reconcile receivables, payables and payment provider", "actor": "Finance and Administration Lead", "keyFacts": ["Debtors, creditors and the payment-provider settlement account are reconciled between the ERP and accounting.", "Mollie payouts are matched to the individual payments they contain."], "painPoints": ["Payment-provider settlements booked as lump sums cannot be reconciled to invoices.", "Differences between ERP and ledger found at year end take weeks to explain."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Subledger reconciliation.", "how": "Reconciles ERP balances to accounting."}, {"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Payment provider settlement detail.", "how": "Breaks payouts into individual payments."}]}, {"id": "recognise-revenue-on-departure", "title": "Recognise revenue and cost on departure", "actor": "Finance and Administration Lead", "keyFacts": ["Revenue and cost are recognised when the trip departs; prepaid bookings stay on the balance sheet until then.", "The departure close-out from operations is the trigger for recognition."], "painPoints": ["Recognising revenue at invoice overstates results in the booking season.", "Departure dates maintained separately in accounting drift from operations."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Revenue recognition on departure.", "how": "Posts recognition entries on departure."}]}, {"id": "report-to-sgr", "title": "Report covered bookings and turnover to SGR", "actor": "Finance and Administration Lead", "keyFacts": ["SGR participants report covered turnover and bookings periodically and remit the per-booking consumer contribution collected on the invoice.", "The report is generated from booking and invoice data with the coverage rules applied per product type."], "painPoints": ["Reports assembled from exports take days and invite errors that affect the fund contribution.", "Unclear coverage rules per product type lead to over- or under-reporting."], "dependencies": [{"type": "brick", "id": "gfnd", "name": "Guarantee Fund and Regulatory Reporting", "description": "SGR reporting.", "how": "Generates the fund report and contribution statement."}]}, {"id": "evidence-package-travel-compliance", "title": "Evidence package-travel obligations", "actor": "Finance and Administration Lead", "keyFacts": ["The Package Travel Directive requires pre-contractual information, accepted conditions, insolvency protection notice and price-change records per booking; the ERP keeps them per file.", "Price increases after booking are capped and must be notified at least 20 days before departure; the system enforces and records this."], "painPoints": ["Compliance evidence spread over email and website versions is hard to produce on request.", "Unrecorded price changes expose the operator to refunds and fines."], "dependencies": [{"type": "brick", "id": "gfnd", "name": "Guarantee Fund and Regulatory Reporting", "description": "Compliance evidence per file.", "how": "Stores and reports the required records."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Accepted conditions and price history.", "how": "Holds the per-file evidence."}]}, {"id": "produce-management-pack", "title": "Produce the management pack", "actor": "Finance and Administration Lead", "keyFacts": ["Closing figures \u2014 revenue, margin, load factor, receivables, exposure \u2014 go to the owner as a dashboard rather than a spreadsheet.", "Historical months are frozen so figures do not change after the pack is sent."], "painPoints": ["Packs built by hand are late and inconsistent month to month.", "Figures that change after reporting undermine trust."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Management dashboards.", "how": "Presents the closing figures."}]}, {"id": "lock-the-period", "title": "Lock the period", "actor": "Finance and Administration Lead", "keyFacts": ["The period is locked in the ERP and in accounting; later corrections go into the next period with an audit trail.", "Lock status is visible to agents so they do not change closed invoices."], "painPoints": ["Invoices edited after the close break the reconciliation.", "Corrections without trail fail the audit."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Period lock and corrections.", "how": "Locks the period and routes corrections."}, {"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Invoice lock after close.", "how": "Prevents changes to closed invoices."}]}]}], "outcomes": ["Fewer days to close the monthly books, because purchase, sales and payment entries are posted from the ERP into accounting", "Accurate supplier settlement, because supplier invoices are matched to confirmed service lines and flight tickets to settlement files", "Guarantee-fund and package-travel obligations reported from system data rather than reconstructed"], "brickDependencies": [{"targetBrickId": "acct", "type": "composition"}, {"targetBrickId": "invc", "type": "composition"}, {"targetBrickId": "flgt", "type": "composition"}, {"targetBrickId": "gfnd", "type": "composition"}, {"targetBrickId": "intg", "type": "composition"}, {"targetBrickId": "book", "type": "composition"}, {"targetBrickId": "supl", "type": "composition"}, {"targetBrickId": "bint", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "Exact Online Accounting", "type": "accounting-system", "interface": "Sales and purchase journal API", "description": "General ledger, debtors and creditors that receive invoices and settlements from the ERP."}, {"system": "IATA BSP Settlement", "type": "settlement-network", "interface": "BSP HOT file and remittance statements", "description": "Periodic ticket settlement data that must be reconciled against imported tickets and supplier invoices."}, {"system": "GDS and Airtrade Flight Content", "type": "flight-distribution", "interface": "PNR import and ticket data files", "description": "Flight bookings and tickets issued via a GDS or the Airtrade consolidator, imported into the booking file."}, {"system": "SGR Guarantee Fund", "type": "regulatory-body", "interface": "Participant reporting and per-booking contribution files", "description": "The Dutch travel guarantee fund that requires periodic reporting of covered bookings and turnover."}, {"system": "Peppol E-Invoicing Network", "type": "e-invoicing-network", "interface": "UBL invoice exchange", "description": "Electronic exchange of supplier and B2B customer invoices."}, {"system": "Mollie Payment Platform", "type": "payment-service-provider", "interface": "Payment links, iDEAL, cards and webhooks", "description": "Hosted payment links and status webhooks for deposits, balances and refunds."}, {"system": "Travel Intelligence BI", "type": "analytics-platform", "interface": "Nightly data export and dashboard embedding", "description": "Trade-specific BI dashboards for bookings, margin, load factor and forecast."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []}, {"id": "serve-travelers-before-during-and-after-the-trip", "name": "Serve Travelers Before, During and After the Trip", "icon": "serve-travelers-before-during-and-after-the-trip.png", "type": "outcome-based-stream", "description": "Take a traveler from booking confirmation to a completed, reviewed trip: complete passenger details and wishes in the my-trip portal, receive documents and itineraries at the right moment, travel with the app and in-trip updates, get help when something goes wrong, and share feedback through surveys and reviews that feed quality and marketing.", "group": "Traveler, Market and Steering Journeys", "rootGroup": "Traveler, Market and Steering Journeys", "flows": [{"id": "from-confirmation-to-departure-in-the-traveler-portal", "title": "From Confirmation to Departure in the Traveler Portal", "description": "The pre-trip service journey: portal access, data completion, ancillaries, documents and the pre-departure briefing.", "primaryActor": "Traveler and Booker", "trigger": "The traveler receives the booking confirmation with a portal link.", "successSignal": "The traveler has completed all data, paid, downloaded the documents and installed the app before departure without contacting the desk.", "steps": [{"id": "activate-portal", "title": "Activate the my-trip portal", "actor": "Traveler and Booker", "keyFacts": ["The traveler activates access to the personal environment where booking, invoices, documents and tasks are visible.", "The portal is branded per tenant so the traveler sees the operator's brand, not the software vendor's."], "painPoints": ["Travelers emailing 'where is my booking' is the most common desk question.", "Unbranded portals confuse travelers who booked with a brand."], "dependencies": [{"type": "brick", "id": "mytp", "name": "Traveler Portal and My-Trip App", "description": "Portal activation and branding.", "how": "Provides the branded personal environment."}]}, {"id": "complete-passenger-data", "title": "Complete passenger details and wishes", "actor": "Traveler and Booker", "keyFacts": ["Passport data, dietary wishes, mobility needs and emergency contacts are completed in the portal with deadlines set by workflow.", "Validation catches names that differ from the passport, which matters for flight tickets."], "painPoints": ["Passport data collected by email is a privacy and accuracy problem.", "Name mismatches discovered at ticketing cost rebooking fees."], "dependencies": [{"type": "brick", "id": "mytp", "name": "Traveler Portal and My-Trip App", "description": "Data completion tasks in the portal.", "how": "Collects passenger data from the traveler."}, {"type": "brick", "id": "pass", "name": "Passenger Data and Operational Lists", "description": "Passenger record.", "how": "Stores the completed data for lists and tickets."}]}, {"id": "add-ancillaries", "title": "Add ancillaries such as excursions, insurance and eSIM", "actor": "Traveler and Booker", "keyFacts": ["Ancillaries can be added after booking in the portal; an eSIM for the destination is offered via the Hubby partnership and delivered digitally.", "Each addition creates an invoice line and, where needed, a supplier request."], "painPoints": ["Ancillaries sold only at booking miss the traveler's later needs.", "Additions handled by the desk are re-keyed and often missing from documents."], "dependencies": [{"type": "brick", "id": "mytp", "name": "Traveler Portal and My-Trip App", "description": "Ancillary shop in the portal.", "how": "Offers and sells post-booking extras."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Ancillary lines on the file.", "how": "Adds lines and triggers invoicing."}]}, {"id": "receive-documents", "title": "Receive travel documents on schedule", "actor": "Traveler and Booker", "keyFacts": ["Documents are published in the portal and pushed to the app at a configured number of days before departure, once the file is paid and confirmed.", "The traveler is notified by email and push and can download or view documents offline."], "painPoints": ["Documents by post or as email attachments are lost and outdated.", "Travelers unsure whether documents were sent call the desk."], "dependencies": [{"type": "brick", "id": "docs", "name": "Travel Documents and Itinerary Delivery", "description": "Scheduled document publication.", "how": "Generates and publishes documents on schedule."}, {"type": "brick", "id": "mytp", "name": "Traveler Portal and My-Trip App", "description": "Documents in portal and app.", "how": "Makes documents available to the traveler."}]}, {"id": "install-app-and-view-itinerary", "title": "Install the app and view the itinerary", "actor": "Traveler and Booker", "keyFacts": ["The itinerary, hotel details, pickup times and guide contact are available in a branded partner app fed from the ERP.", "App content updates automatically when the file changes."], "painPoints": ["Printed itineraries cannot change after printing.", "Apps not connected to the back office show wrong information."], "dependencies": [{"type": "brick", "id": "mytp", "name": "Traveler Portal and My-Trip App", "description": "App content feed.", "how": "Publishes itinerary data to the app."}, {"type": "brick", "id": "intg", "name": "Integration Hub and Partner APIs", "description": "Partner app integration.", "how": "Delivers the itinerary feed to partner apps."}]}, {"id": "pre-departure-briefing", "title": "Receive the pre-departure briefing", "actor": "Traveler and Booker", "keyFacts": ["A pre-departure message with weather, packing tips, meeting point and guide name is sent from a template per product.", "Group travelers see their seat and pickup; tailor-made travelers see their first transfer details."], "painPoints": ["Generic briefings ignore the specifics of the trip.", "Missing meeting-point information is the top departure-day call."], "dependencies": [{"type": "brick", "id": "comm", "name": "Email and Telephony Integration", "description": "Pre-departure message.", "how": "Sends the templated briefing."}, {"type": "brick", "id": "docs", "name": "Travel Documents and Itinerary Delivery", "description": "Trip-specific details in the briefing.", "how": "Supplies seat, pickup and transfer details."}]}, {"id": "ask-a-question", "title": "Ask a question and get an answer from the booking view", "actor": "Traveler and Booker", "keyFacts": ["Questions asked in the portal or by email land on the file; the agent answers from one booking view with the full history.", "AI assistance drafts answers to routine questions from the file data for the agent to approve."], "painPoints": ["Questions answered without the file lead to contradictions.", "Routine questions consume agent time that should go to sales."], "dependencies": [{"type": "brick", "id": "mytp", "name": "Traveler Portal and My-Trip App", "description": "Questions from the portal.", "how": "Captures traveler questions against the file."}, {"type": "brick", "id": "comm", "name": "Email and Telephony Integration", "description": "Answering from the booking view.", "how": "Links replies to the file."}]}]}, {"id": "in-trip-support-and-aftercare", "title": "In-Trip Support and Aftercare", "description": "The journey during and after travel: in-trip updates, incidents and complaints, surveys, reviews and retention hand-off.", "primaryActor": "Traveler and Booker", "trigger": "The traveler departs.", "successSignal": "The trip is completed with incidents resolved, the survey answered, a review published and the traveler flagged for the next campaign.", "steps": [{"id": "receive-in-trip-updates", "title": "Receive in-trip updates and changes", "actor": "Traveler and Booker", "keyFacts": ["Changes during the trip \u2014 a changed pickup time, a hotel swap \u2014 are pushed to the app and portal from the file, and the guide sees the same information.", "Emergency messages reach all participants of a departure at once."], "painPoints": ["Updates by phone to each traveler do not scale during an incident.", "Guides and travelers with different information create confusion."], "dependencies": [{"type": "brick", "id": "mytp", "name": "Traveler Portal and My-Trip App", "description": "Push updates in the app.", "how": "Delivers changes to travelers."}, {"type": "brick", "id": "guid", "name": "Guide and Group Leader Portal", "description": "Guide view of the same changes.", "how": "Keeps the guide in sync with travelers."}]}, {"id": "report-incident", "title": "Report an incident or complaint on tour", "actor": "Traveler and Booker", "keyFacts": ["Incidents reported by the guide or the traveler are logged against the file with photos and time, and routed to the responsible agent.", "Serious incidents trigger the emergency workflow with escalation to management."], "painPoints": ["Complaints made verbally to the guide never reach the office.", "Late incident logging weakens the operator's position with suppliers."], "dependencies": [{"type": "brick", "id": "qual", "name": "Quality, Complaints, Surveys and Reviews", "description": "Incident and complaint logging.", "how": "Records incidents against the file."}, {"type": "brick", "id": "guid", "name": "Guide and Group Leader Portal", "description": "Guide incident reporting.", "how": "Lets the guide log incidents in the portal."}]}, {"id": "resolve-and-compensate", "title": "Resolve the complaint and settle compensation", "actor": "Reservations and Sales Agent", "keyFacts": ["Complaints follow a defined process with response deadlines; compensation is recorded on the file and recovered from the supplier where applicable.", "Outcomes feed supplier quality scores."], "painPoints": ["Complaints handled in email threads miss response deadlines under trade codes.", "Compensation paid but not recovered from suppliers erodes margin."], "dependencies": [{"type": "brick", "id": "qual", "name": "Quality, Complaints, Surveys and Reviews", "description": "Complaint process and compensation.", "how": "Manages the complaint to resolution."}]}, {"id": "answer-survey", "title": "Answer the post-trip survey", "actor": "Traveler and Booker", "keyFacts": ["A survey is sent a few days after return; results are stored per departure, hotel, guide and component.", "Low scores create a task for follow-up before a public review appears."], "painPoints": ["Surveys in a separate tool cannot be linked to hotels or guides.", "Unhappy travelers not contacted write the public review first."], "dependencies": [{"type": "brick", "id": "qual", "name": "Quality, Complaints, Surveys and Reviews", "description": "Surveys per departure and component.", "how": "Sends surveys and stores results."}, {"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Follow-up on low scores.", "how": "Creates tasks for low ratings."}]}, {"id": "invite-review", "title": "Invite a public review", "actor": "Traveler and Booker", "keyFacts": ["Satisfied travelers are invited to review on Trustpilot; reviews are shown on the website next to the product.", "Invitation timing is tuned to the survey response."], "painPoints": ["Review invitations sent to everyone amplify the unhappy minority.", "Reviews not shown on product pages are wasted conversion power."], "dependencies": [{"type": "brick", "id": "qual", "name": "Quality, Complaints, Surveys and Reviews", "description": "Review invitations.", "how": "Triggers review invitations after positive surveys."}]}, {"id": "hand-off-to-retention", "title": "Hand the traveler off to retention", "actor": "Reservations and Sales Agent", "keyFacts": ["Trip completion, survey score and interests update the contact so marketing can target the next trip.", "Consent captured at booking governs which campaigns the traveler receives."], "painPoints": ["Returning travelers treated as new leads waste the relationship.", "Campaigns without consent tracking breach GDPR."], "dependencies": [{"type": "brick", "id": "crmr", "name": "CRM and Contact Management", "description": "Updated contact after the trip.", "how": "Records trip outcome and interests."}, {"type": "brick", "id": "mktg", "name": "Email Marketing and Segmentation", "description": "Segment membership and consent.", "how": "Places the traveler in the right segments."}]}]}], "outcomes": ["Higher document self-service, because travelers download documents and complete data in the portal instead of calling", "Higher traveler satisfaction, because information arrives on time on the device the traveler uses", "Complaints and surveys closed in the system, feeding quality improvement and reviews rather than an inbox"], "brickDependencies": [{"targetBrickId": "docs", "type": "composition"}, {"targetBrickId": "mytp", "type": "composition"}, {"targetBrickId": "book", "type": "composition"}, {"targetBrickId": "pass", "type": "composition"}, {"targetBrickId": "qual", "type": "composition"}, {"targetBrickId": "comm", "type": "composition"}, {"targetBrickId": "wflw", "type": "composition"}, {"targetBrickId": "guid", "type": "composition"}, {"targetBrickId": "intg", "type": "composition"}, {"targetBrickId": "crmr", "type": "composition"}, {"targetBrickId": "mktg", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "Travelia and Appit Traveler Apps", "type": "partner-mobile-app", "interface": "Itinerary and document feed API", "description": "Branded traveler apps that render itinerary, documents and in-trip updates from the ERP."}, {"system": "Hubby eSIM", "type": "travel-service-partner", "interface": "eSIM order and activation API", "description": "Adds a destination eSIM to the trip as an ancillary and delivers activation details in the portal."}, {"system": "Trustpilot Reviews", "type": "review-platform", "interface": "Review invitation API and review feed", "description": "Collects post-trip reviews and feeds ratings back to the website and quality module."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []}, {"id": "market-and-retain-customers", "name": "Market and Retain Customers", "icon": "market-and-retain-customers.png", "type": "outcome-based-stream", "description": "Take the owner and marketing lead from CRM data to campaigns and repeat bookings: build segments from booking history, interests and consent, run email campaigns through Spotler, publish reviews and inspiration on the website, measure conversion back to bookings, and turn past travelers into repeat bookers under the operator's own brand.", "group": "Traveler, Market and Steering Journeys", "rootGroup": "Traveler, Market and Steering Journeys", "flows": [{"id": "segment-campaign-and-convert", "title": "Segment, Campaign and Convert", "description": "From a marketing goal to a measured campaign: define the segment, sync to Spotler, send, land on the website and attribute bookings.", "primaryActor": "Travel Company Owner", "trigger": "The owner wants to fill the spring departures of a coach series that is at 40% load.", "successSignal": "The campaign is sent to the right segment, bookings are attributed to it and the load factor of the target departures rises.", "steps": [{"id": "define-goal-and-segment", "title": "Define the campaign goal and segment", "actor": "Travel Company Owner", "keyFacts": ["Segments combine booking history (destination, product type, travel month), value, survey score and consent status from the CRM.", "The segment size and expected response are shown before sending."], "painPoints": ["Mass mailings to the whole database hurt deliverability and brand.", "Segments built in the mail tool lack booking data."], "dependencies": [{"type": "brick", "id": "mktg", "name": "Email Marketing and Segmentation", "description": "Segment builder on CRM data.", "how": "Defines segments with consent applied."}, {"type": "brick", "id": "crmr", "name": "CRM and Contact Management", "description": "Contact and history data.", "how": "Provides the attributes for segmentation."}]}, {"id": "select-products-and-offers", "title": "Select the products and offers to promote", "actor": "Travel Company Owner", "keyFacts": ["Underperforming departures and their current price tier are selected from the load-factor view; offers are configured as time-limited price tiers.", "Offers are visible on the website and at the desk at the same time."], "painPoints": ["Offers announced by email but not applied at the desk anger customers.", "Promoting departures that are already full wastes attention."], "dependencies": [{"type": "brick", "id": "dept", "name": "Departures and Capacity Management", "description": "Load factor per departure.", "how": "Identifies departures to promote."}, {"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Promotional price tiers.", "how": "Creates time-limited offers."}]}, {"id": "draft-with-ai", "title": "Draft the campaign content with the AI assistant", "actor": "Travel Company Owner", "keyFacts": ["The assistant drafts subject lines and copy from the product content and the segment profile in the tenant's tone.", "Drafts are reviewed and edited; nothing is sent automatically."], "painPoints": ["Copywriting bottlenecks delay campaigns past the booking window.", "Generic copy ignores what the segment has already travelled."], "dependencies": [{"type": "brick", "id": "aiaa", "name": "AI Office Assistants", "description": "Campaign copy drafting.", "how": "Generates draft copy from product and segment data."}]}, {"id": "sync-and-send", "title": "Sync the segment and send through Spotler", "actor": "Travel Company Owner", "keyFacts": ["The segment is synced to Spotler with consent flags; the campaign is sent and engagement flows back to the contact records.", "Unsubscribes are written back to the CRM immediately."], "painPoints": ["Lists exported to the mail tool drift from the CRM.", "Unsubscribes not synced back lead to GDPR complaints."], "dependencies": [{"type": "brick", "id": "mktg", "name": "Email Marketing and Segmentation", "description": "Campaign sync and engagement write-back.", "how": "Syncs segments and returns engagement."}]}, {"id": "land-on-bookable-pages", "title": "Land on real-time bookable landing pages", "actor": "Traveler and Booker", "keyFacts": ["Campaign links land on product pages with live availability, the offer price and reviews, and the traveler can book without a call.", "Campaign parameters are stored on the booking for attribution."], "painPoints": ["Landing pages with 'request a quote' lose most of the campaign's momentum.", "Bookings without campaign attribution make marketing spend unmeasurable."], "dependencies": [{"type": "brick", "id": "webs", "name": "Customer Website, CMS and Online Booking", "description": "Landing pages with live booking.", "how": "Renders bookable offers with attribution."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Campaign attribution on the booking.", "how": "Stores the campaign source on the file."}]}, {"id": "measure-bookings-and-margin", "title": "Measure bookings and margin per campaign", "actor": "Travel Company Owner", "keyFacts": ["Dashboards show bookings, revenue and margin per campaign and segment, and the load-factor change of the promoted departures.", "Results feed the next segment definition."], "painPoints": ["Open and click rates say nothing about margin.", "Campaign effects unknown per departure repeat the same discount mistakes."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Campaign performance dashboards.", "how": "Attributes bookings and margin to campaigns."}, {"type": "brick", "id": "mktg", "name": "Email Marketing and Segmentation", "description": "Campaign results.", "ho  "crmr", "name": "CRM and Contact Management", "description": "Contact context for the call.", "how": "Shows trip and survey context."}]}, {"id": "publish-reviews-and-stories", "title": "Publish reviews and travel stories on the website", "actor": "Travel Company Owner", "keyFacts": ["Trustpilot reviews and traveler photos appear on product pages and inspiration articles managed in the CMS.", "Fresh reviews on a product page measurably improve conversion of campaign traffic."], "painPoints": ["Reviews on a third-party site only do not help the own brand's pages.", "Stale content on the website signals an inactive operator."], "dependencies": [{"type": "brick", "id": "webs", "name": "Customer Website, CMS and Online Booking", "description": "Reviews and stories in the CMS.", "how": "Publishes reviews and content on product pages."}]}, {"id": "send-next-trip-nudges", "title": "Send next-trip nudges and loyalty offers", "actor": "Travel Company Owner", "keyFacts": ["Automated flows send anniversary, 'similar trips' and loyalty offers based on the last trip and interests, within consent.", "Loyalty pricing applies automatically at booking for eligible contacts."], "painPoints": ["Loyalty promised in a mailing but not applied at booking breaks trust.", "Nudges without consent tracking are a compliance risk."], "dependencies": [{"type": "brick", "id": "mktg", "name": "Email Marketing and Segmentation", "description": "Automated retention flows.", "how": "Sends nudges based on history and consent."}, {"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Loyalty price rules.", "how": "Applies loyalty pricing at booking."}]}, {"id": "measure-repeat-rate", "title": "Measure the repeat booking rate", "actor": "Travel Company Owner", "keyFacts": ["Repeat rate per segment, product and season is tracked over time and compared with campaign spend.", "The owner sees the share of revenue from returning travelers as a health metric."], "pain
