: "Alert the desk on overdue balances", "actor": "Finance and Administration Lead", "keyFacts": ["Overdue balances raise an alert on the file and a task for the responsible agent, with escalation to finance after a configurable period.", "Departures with unpaid files are visible to operations, since unpaid travelers should not receive documents."], "painPoints": ["Overdue lists exported weekly are outdated by the time someone calls.", "Documents issued to unpaid travelers remove the last leverage."], "dependencies": [{"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Overdue alerts and escalation.", "how": "Creates alerts and escalations for overdue files."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Payment status on the file.", "how": "Shows paid, open and overdue per file."}]}, {"id": "confirm-paid-and-release", "title": "Confirm paid status and release documents", "actor": "Reservations and Sales Agent", "keyFacts": ["Full payment flips the file to paid and releases document generation and the traveler's portal downloads.", "The contact record shows payment behaviour for future credit decisions."], "painPoints": ["Paid status checked by hand before every document run costs hours.", "Repeat late payers unrecognised get the same terms again."], "dependencies": [{"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Paid status.", "how": "Marks the file as fully paid."}, {"type": "brick", "id": "crmr", "name": "CRM and Contact Management", "description": "Payment behaviour on the contact.", "how": "Records payment history per contact."}]}, {"id": "report-receivables", "title": "Report the receivables position", "actor": "Finance and Administration Lead", "keyFacts": ["Open, overdue and prepaid amounts are reported per departure, product and customer type, which also feeds the guarantee-fund exposure calculation.", "Prepaid customer money is tracked separately because it is covered by the SGR guarantee until the trip is delivered."], "painPoints": ["Receivables in spreadsheets cannot answer 'what is our exposure per departure'.", "Mixing prepayments with revenue misstates the financial position."], "dependencies": [{"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Receivables reporting.", "how": "Reports open and prepaid positions."}]}]}], "outcomes": ["Lower overdue receivables, because reminders and payment links run on schedule and payment status is visible per file", "Invoice accuracy at first issue, since invoices are generated from the booking lines and change with them", "Less finance handling time per booking, because payments are matched to invoices automatically"], "brickDependencies": [{"targetBrickId": "invc", "type": "composition"}, {"targetBrickId": "book", "type": "composition"}, {"targetBrickId": "mytp", "type": "composition"}, {"targetBrickId": "wflw", "type": "composition"}, {"targetBrickId": "comm", "type": "composition"}, {"targetBrickId": "crmr", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "Mollie Payment Platform", "type": "payment-service-provider", "interface": "Payment links, iDEAL, cards and webhooks", "description": "Hosted payment links and status webhooks for deposits, balances and refunds."}, {"system": "Bank Statement Feeds", "type": "banking", "interface": "CAMT.053 / MT940 statement import", "description": "Daily bank statements used to match incoming transfers against open invoices."}, {"system": "Peppol E-Invoicing Network", "type": "e-invoicing-network", "interface": "UBL invoice exchange", "description": "Electronic exchange of supplier and B2B customer invoices."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []}, {"id": "settle-suppliers-and-close-books", "name": "Settle Suppliers and Close Books", "icon": "settle-suppliers-and-close-books.png", "type": "outcome-based-stream", "description": "Take the finance lead from supplier invoices, DMC statements and flight settlement files to matched purchase entries, correct margins per file, accounting entries in Exact, guarantee-fund reporting and a closed month \u2014 without rebuilding the trade's numbers in spreadsheets.", "group": "Finance and Compliance Journeys", "rootGroup": "Finance and Compliance Journeys", "flows": [{"id": "match-supplier-invoices-and-settle-flights", "title": "Match Supplier Invoices and Settle Flights", "description": "The purchase side: supplier and DMC invoices matched to confirmed lines, prepayments applied, and airline tickets reconciled with the BSP HOT or Airtrade settlement file.", "primaryActor": "Finance and Administration Lead", "trigger": "Supplier invoices arrive by email and portal, and the twice-monthly settlement file is available.", "successSignal": "All supplier invoices are matched or disputed, flight tickets reconcile with the settlement file, and purchase entries are posted.", "steps": [{"id": "receive-supplier-invoices", "title": "Receive supplier invoices against confirmed lines", "actor": "Finance and Administration Lead", "keyFacts": ["Invoices arrive via the supplier portal, e-invoicing or email; each is linked to the booking lines it covers, ideally by the supplier reference on the confirmation.", "Invoice capture extracts amounts, currency and references so matching can start immediately."], "painPoints": ["Invoices in a shared mailbox are matched by memory and often twice.", "Invoices without references need a call to the supplier."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Supplier invoice capture.", "how": "Registers invoices and links them to lines."}]}, {"id": "three-way-match", "title": "Match invoice, confirmation and delivery", "actor": "Finance and Administration Lead", "keyFacts": ["Each invoice line is matched to the confirmed rate, the delivered service and the actual passenger count reported by the guide or DMC.", "Deviations above a tolerance go to a dispute queue with the supplier communication attached."], "painPoints": ["Paying every invoice as received leaks margin through no-shows and rate errors.", "Disputes without the original request take weeks."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Three-way matching and disputes.", "how": "Matches invoices and routes deviations."}, {"type": "brick", "id": "supl", "name": "Supplier Management and Communication", "description": "Communication history for disputes.", "how": "Supplies the request and confirmation trail."}]}, {"id": "apply-prepayments-and-currencies", "title": "Apply prepayments and currency differences", "actor": "Finance and Administration Lead", "keyFacts": ["Prepayments made to lodges and DMCs are applied to the matching invoice; exchange differences are posted per file.", "Multi-currency purchase costs update the realised margin of each file."], "painPoints": ["Prepayments forgotten at invoice time are paid twice.", "Currency differences booked only at year end distort file margins."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Prepayment application and FX.", "how": "Applies prepayments and posts differences."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Realised margin per file.", "how": "Updates the file margin with actual cost."}]}, {"id": "reconcile-flight-settlement", "title": "Reconcile tickets with the BSP HOT or Airtrade settlement file", "actor": "Finance and Administration Lead", "keyFacts": ["Imported tickets are matched to the BSP HOT file or the Airtrade consolidator statement on ticket number, fare, taxes and commission.", "Refunds, ADMs and voids are identified and posted to the right file."], "painPoints": ["Ticket settlement checked by hand from a PDF statement misses ADMs.", "Unmatched tickets become unexplained ledger differences."], "dependencies": [{"type": "brick", "id": "flgt", "name": "Flight Import and Ticket Settlement", "description": "Ticket records and settlement import.", "how": "Imports and matches the settlement file to tickets."}]}, {"id": "approve-payment-runs", "title": "Approve supplier payment runs", "actor": "Finance and Administration Lead", "keyFacts": ["Matched invoices are grouped into payment runs by due date and currency and approved by the owner above a threshold.", "Payment files are exported to the bank; paid status flows back to the invoice."], "painPoints": ["Ad-hoc payments outside a run lose control and discounts.", "Owners approving from email lack the matching evidence."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Payment runs and approval.", "how": "Prepares and tracks payment runs."}]}, {"id": "post-to-accounting", "title": "Post purchase and sales entries to accounting", "actor": "Finance and Administration Lead", "keyFacts": ["Sales invoices, credit notes, payments and matched purchase invoices are posted to Exact through the integration with cost centres per product and departure.", "Posting is idempotent and logged, so a re-run does not duplicate entries."], "painPoints": ["Manual journal exports create duplicate or missing entries.", "Accounting without departure-level cost centres cannot explain margin."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Accounting posting.", "how": "Generates and sends journal entries."}, {"type": "brick", "id": "intg", "name": "Integration Hub and Partner APIs", "description": "Accounting connector.", "how": "Transports entries to the accounting system."}]}, {"id": "review-file-margins", "title": "Review realised versus sold margin per file", "actor": "Travel Company Owner", "keyFacts": ["With purchase invoices matched, the realised margin per file and per departure is compared with the margin at sale.", "Outliers point to pricing, supplier or operational issues."], "painPoints": ["Margin known only at year end cannot steer the next season.", "Sold margin without realised margin flatters performance."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Margin reporting per file and departure.", "how": "Reports sold versus realised margin."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Sold and realised margin on the file.", "how": "Provides both margin figures."}]}]}, {"id": "close-the-month-and-report-to-the-guarantee-fund", "title": "Close the Month and Report to the Guarantee Fund", "description": "The month-end and compliance flow: reconcile, recognise revenue on departure, report to SGR and keep package-travel evidence ready.", "primaryActor": "Finance and Administration Lead", "trigger": "The month ends and the finance lead starts the close.", "successSignal": "The books are closed, revenue is recognised per departed trip, the SGR report is submitted from system data and the compliance evidence is complete.", "steps": [{"id": "reconcile-subledgers", "title": "Reconcile receivables, payables and payment provider", "actor": "Finance and Administration Lead", "keyFacts": ["Debtors, creditors and the payment-provider settlement account are reconciled between the ERP and accounting.", "Mollie payouts are matched to the individual payments they contain."], "painPoints": ["Payment-provider settlements booked as lump sums cannot be reconciled to invoices.", "Differences between ERP and ledger found at year end take weeks to explain."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Subledger reconciliation.", "how": "Reconciles ERP balances to accounting."}, {"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Payment provider settlement detail.", "how": "Breaks payouts into individual payments."}]}, {"id": "recognise-revenue-on-departure", "title": "Recognise revenue and cost on departure", "actor": "Finance and Administration Lead", "keyFacts": ["Revenue and cost are recognised when the trip departs; prepaid bookings stay on the balance sheet until then.", "The departure close-out from operations is the trigger for recognition."], "painPoints": ["Recognising revenue at invoice overstates results in the booking season.", "Departure dates maintained separately in accounting drift from operations."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Revenue recognition on departure.", "how": "Posts recognition entries on departure."}]}, {"id": "report-to-sgr", "title": "Report covered bookings and turnover to SGR", "actor": "Finance and Administration Lead", "keyFacts": ["SGR participants report covered turnover and bookings periodically and remit the per-booking consumer contribution collected on the invoice.", "The report is generated from booking and invoice data with the coverage rules applied per product type."], "painPoints": ["Reports assembled from exports take days and invite errors that affect the fund contribution.", "Unclear coverage rules per product type lead to over- or under-reporting."], "dependencies": [{"type": "brick", "id": "gfnd", "name": "Guarantee Fund and Regulatory Reporting", "description": "SGR reporting.", "how": "Generates the fund report and contribution statement."}]}, {"id": "evidence-package-travel-compliance", "title": "Evidence package-travel obligations", "actor": "Finance and Administration Lead", "keyFacts": ["The Package Travel Directive requires pre-contractual information, accepted conditions, insolvency protection notice and price-change records per booking; the ERP keeps them per file.", "Price increases after booking are capped and must be notified at least 20 days before departure; the system enforces and records this."], "painPoints": ["Compliance evidence spread over email and website versions is hard to produce on request.", "Unrecorded price changes expose the operator to refunds and fines."], "dependencies": [{"type": "brick", "id": "gfnd", "name": "Guarantee Fund and Regulatory Reporting", "description": "Compliance evidence per file.", "how": "Stores and reports the required records."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Accepted conditions and price history.", "how": "Holds the per-file evidence."}]}, {"id": "produce-management-pack", "title": "Produce the management pack", "actor": "Finance and Administration Lead", "keyFacts": ["Closing figures \u2014 revenue, margin, load factor, receivables, exposure \u2014 go to the owner as a dashboard rather than a spreadsheet.", "Historical months are frozen so figures do not change after the pack is sent."], "painPoints": ["Packs built by hand are late and inconsistent month to month.", "Figures that change after reporting undermine trust."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Management dashboards.", "how": "Presents the closing figures."}]}, {"id": "lock-the-period", "title": "Lock the period", "actor": "Finance and Administration Lead", "keyFacts": ["The period is locked in the ERP and in accounting; later corrections go into the next period with an audit trail.", "Lock status is visible to agents so they do not change closed invoices."], "painPoints": ["Invoices edited after the close break the reconciliation.", "Corrections without trail fail the audit."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Period lock and corrections.", "how": ortal", "title": "Activate the my-trip portal", "actor": "Traveler and Booker", "keyFacts": ["The traveler activates access to the personal environment where booking, invoices, documents and tasks are visible.", "The portal is branded per tenant so the traveler sees the operator's brand, not the software vendor's."], "painPoints": ["Travelers emailing 'where is my booking' is the most common desk question.", "Unbranded portals confuse travelers who booked with a brand."], "dependencies": [{"type": "brick", "id": "mytp", "name": "Traveler Portal and My-Trip App", "description": "Portal activation and branding.", "how": "Provides the branded personal environment."}]}, {"id": "complete-passenger-data", "title": "Complete passenger details and wishes", "actor": "Traveler and Booker", "keyFacts": ["Passport data, dietary wishes, mobility needs and emergency contacts are completed in the portal with deadlines set by workflow.", "Validation catches names that differ from the passport, which matters for flight tickets."], "painPoints": ["Passport data collected by email is a privacy and accuracy problem.", "Name mismatches discovered at ticketing cost rebooking fees."], "dependencies": [{"type": "brick", "id": "mytp", "name": "Traveler Portal and My-Trip App", "description": "Data completion tasks in the portal.", "how": "Collects passenger data from the traveler."}, {"type": "brick", "id": "pass", "name": "Passenger Data and Operational Lists", "description": "Passenger record.", "how": "Stores the completed data for lists and tickets."}]}, {"id": "add-ancillaries", "title": "Add ancillaries such as excursions, insurance and eSIM", "actor": "Traveler and Booker", "keyFacts": ["Ancillaries can be added after booking in the portal; an eSIM for the destination is offered via the Hubby partnership and delivered digitally.", "Each addition creates an invoice line and, where needed, a supplier request."], "painPoints": ["Ancillaries sold only at booking miss the traveler's later ident reporting.", "how": "Lets the guide log incidents in the portal."}]}, {"id": "resolve-and-compensate", "title": "Resolve the complaint and settle compensation", "actor": "Reservations and Sales Agent", "keyFacts": ["Complaints follow a defined process with response deadlines; compensation is recorded on the file and recovered from the supplier where applicable.", "Outcomes feed supplier quality scores."], "painPoints": ["Complaints handled in email threads miss response deadlines under trade codes.", "Compensation paid but not recovered from suppliers erodes margin."], "dependencies": [{"type": "brick", "id": "qual", "name": "Quality, Complaints, Surveys and Reviews", "description": "Complaint process and compensation.", "how": "Manages the complaint to resolution."}]}, {"id": "answer-survey", "title": "Answer the post-trip survey", "actor": "Traveler and Booker", "keyFacts": ["A survey is sent a few days after return; results are stored per departure, hotel, guide and component.", "Low scores create a task for follow-up before a public review appears."], "painPoints": ["Surveys in a separate tool cannot be linked to hotels or guides.", "Unhappy travelers not contacted write the public review first."], "dependencies": [{"type": "brick", "id": "qual", "name": "Quality, Complaints, Surveys and Reviews", "description": "Surveys per departure and component.", "how": "Sends surveys and stores results."}, {"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Follow-up on low scores.", "how": "Creates tasks for low ratings."}]}, {"id": "invite-review", "title": "Invite a public review", "actor": "Traveler and Booker", "keyFacts": ["Satisfied travelers are invited to review on Trustpilot; reviews are shown on the website next to the product.", "Invitation timing is tuned to the survey response."], "painPoints": ["Review invitations sent to everyone amplify the unhappy minority.", "Reviews not shown on product pages are wasted conversion romoted departures.", "Results feed the next segment definition."], "painPoints": ["Open and click rates say nothing about margin.", "Campaign effects unknown per departure repeat the same discount mistakes."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Campaign performance dashboards.", "how": "Attributes bookings and margin to campaigns."}, {"type": "brick", "id": "mktg", "name": "Email Marketing and Segmentation", "description": "Campaign results.", "how": "Links engagement to booking outcomes."}]}]}, {"id": "turn-returning-travelers-into-repeat-bookers", "title": "Turn Returning Travelers into Repeat Bookers", "description": "The retention loop: survey and review, loyalty recognition, personal follow-up and next-trip nudges.", "primaryActor": "Reservations and Sales Agent", "trigger": "A group of travelers returns from a trip and the survey results come in.", "successSignal": "A measurable share of returning travelers books a next trip within a year, under the operator's own brand.", "steps": [{"id": "score-and-segment-returners", "title": "Score returning travelers on satisfaction and value", "actor": "Travel Company Owner", "keyFacts": ["Survey score, complaint history and lifetime value place each returning traveler in a retention segment.", "Promoters get review invitations; detractors get a personal call task."], "painPoints": ["Treating all returners the same wastes the promoters and loses the detractors.", "Value unknown per traveler misdirects effort."], "dependencies": [{"type": "brick", "id": "qual", "name": "Quality, Complaints, Surveys and Reviews", "description": "Survey and complaint data.", "how": "Provides satisfaction per traveler."}, {"type": "brick", "id": "mktg", "name": "Email Marketing and Segmentation", "description": "Retention segments.", "how": "Assigns travelers to retention segments."}]}, {"id": "personal-follow-up", "title": "Personal follow-up by the agent", "actor": "Reservations and Sales Agent", "keyFacts": ["Agents get follow-up tasks for high-value or detractor travelers with the trip summary and survey in one view.", "Calls are logged and outcomes update the segment."], "painPoints": ["Follow-up left to goodwill happens only in quiet weeks.", "Agents calling without context sound scripted."], "dependencies": [{"type": "brick", "id": "comm", "name": "Email and Telephony Integration", "description": "Call logging.", "how": "Logs the call on the contact."}, {"type": "brick", "id": "crmr", "name": "CRM and Contact Management", "description": "Contact context for the call.", "how": "Shows trip and survey context."}]}, {"id": "publish-reviews-and-stories", "title": "Publish reviews and travel stories on the website", "actor": "Travel Company Owner", "keyFacts": ["Trustpilot reviews and traveler photos appear on product pages and inspiration articles managed in the CMS.", "Fresh reviews on a product page measurably improve conversion of campaign traffic."], "painPoints": ["Reviews on a third-party site only do not help the own brand's pages.", "Stale content on the website signals an inactive operator."], "dependencies": [{"type": "brick", "id": "webs", "name": "Customer Website, CMS and Online Booking", "description": "Reviews and stories in the CMS.", "how": "Publishes reviews and content on product pages."}]}, {"id": "send-next-trip-nudges", "title": "Send next-trip nudges and loyalty offers", "actor": "Travel Company Owner", "keyFacts": ["Automated flows send anniversary, 'similar trips' and loyalty offers based on the last trip and interests, within consent.", "Loyalty pricing applies automatically at booking for eligible contacts."], "painPoints": ["Loyalty promised in a mailing but not applied at booking breaks trust.", "Nudges without consent tracking are a compliance risk."], "dependencies": [{"type": "brick", "id": "mktg", "name": "Email Marketing and Segmentation", "description": "Automated retention flows.", "how": ile.", "how": "Holds capacity as an option."}]}, {"id": "book-and-enter-passengers", "title": "Book and enter the client's passengers", "actor": "Reseller Travel Agent", "keyFacts": ["The reseller books with passenger data, seat and wishes; the booking file is created with the agency as booker and the passengers as travelers.", "The operator's desk sees the booking like any other file."], "painPoints": ["Bookings emailed by resellers are re-keyed by the desk.", "Files that mix agency and traveler contact data confuse communication."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Reseller booking file.", "how": "Creates the file with agency and passengers."}, {"type": "brick", "id": "rsel", "name": "Reseller and Agent Portal", "description": "Reseller booking form.", "how": "Captures the booking in the portal."}]}, {"id": "invoice-with-commission", "title": "Receive the invoice with commission applied", "actor": "Reseller Travel Agent", "keyFacts": ["The invoice to the agency reflects the agreed net or commission model; the traveler receives no invoice from the operator unless configured.", "Payment terms may allow the agency to pay at balance date only."], "painPoints": ["Invoices sent to the traveler instead of the agency breach the agency relationship.", "Commission errors are the main cause of reseller disputes."], "dependencies": [{"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Agency invoicing.", "how": "Issues invoices under agency terms."}, {"type": "brick", "id": "rsel", "name": "Reseller and Agent Portal", "description": "Agency terms.", "how": "Provides the invoicing model."}]}, {"id": "retrieve-documents-for-client", "title": "Retrieve documents for the client", "actor": "Reseller Travel Agent", "keyFacts": ["Travel documents appear in the reseller portal with the agency branding option and can be forwarded to the client.", "Changes made by the ope title": "Review the north-star KPIs", "actor": "Travel Company Owner", "keyFacts": ["The owner dashboard shows revenue per FTE, operating margin, online booking share, quote-to-booking conversion and days to close, with trends and targets.", "Each KPI drills down to the departures, agents or products behind it."], "painPoints": ["KPIs presented once a quarter are too late to act on the season.", "Dashboards without drill-down invite speculation about causes."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "KPI dashboards with drill-down.", "how": "Presents north-star KPIs and trends."}]}, {"id": "analyse-margin-and-load", "title": "Analyse margin and load factor per departure and product", "actor": "Travel Company Owner", "keyFacts": ["Sold versus realised margin and load factor per departure identify products to reprice, merge or drop.", "Supplier cost trends highlight contracts to renegotiate."], "painPoints": ["Product decisions made on revenue alone keep loss-making departures alive.", "Supplier cost creep unnoticed erodes a whole season."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Margin and load analysis.", "how": "Analyses margin and load per departure."}, {"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Realised supplier cost.", "how": "Supplies matched purchase costs."}]}, {"id": "analyse-sales-and-service-performance", "title": "Analyse sales and service performance per agent and channel", "actor": "Travel Company Owner", "keyFacts": ["Conversion, handling time, first-contact resolution and proposal turnaround are shown per agent, specialist and channel.", "Complaint and survey scores per guide, hotel and product complete the picture."], "painPoints": ["Agents judged on booking counts alone ignore margin and service.", "Service quality unmeasured per supplier repeats bad choices."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Sales and service dashboards.", "how": "Reports per agent, channel and supplier."}, {"type": "brick", "id": "crmr", "name": "CRM and Contact Management", "description": "Contact and interaction data.", "how": "Supplies conversion and handling data."}]}, {"id": "decide-and-act", "title": "Decide and turn decisions into actions", "actor": "Travel Company Owner", "keyFacts": ["Decisions become concrete changes: a price tier adjusted, a departure merged, a supplier flagged, a follow-up campaign \u2014 each created as a rule change or a task from the meeting.", "The AI assistant summarises the week's anomalies and proposes actions for review."], "painPoints": ["Decisions minuted but not executed are the norm without a task system.", "Owners drowning in dashboards need a summary, not more charts."], "dependencies": [{"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Decisions as tasks.", "how": "Creates tasks with owners and due dates."}, {"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Price rule changes.", "how": "Applies repricing decisions."}]}, {"id": "track-compliance-and-risk", "title": "Track compliance and financial risk indicators", "actor": "Finance and Administration Lead", "keyFacts": ["Guarantee-fund exposure, overdue receivables, unconfirmed services near departure and open complaints are tracked as risk indicators.", "Thresholds alert the owner before a risk becomes a regulatory or cash problem."], "painPoints": ["Risk seen only in the annual audit is seen too late.", "Exposure to the guarantee fund unknown surprises the owner at contribution time."], "dependencies": [{"type": "brick", "id": "gfnd", "name": "Guarantee Fund and Regulatory Reporting", "description": "Exposure and compliance indicators.", "how": "Supplies fund exposure and compliance status."}, {"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Risk dashboards and alerts.", "how": "Presents risk indicators with thresholds."}]}]}, {"id": "forecast-demand-and-decide-capacity", "title": "Forecast Demand and Decide Capacity", "description": "Use booking curves and history to forecast demand per product and departure, and decide capacity and pricing for the coming season.", "primaryActor": "Travel Company Owner", "trigger": "Planning for next season's series starts and the owner needs to decide how many departures and coaches to contract.", "successSignal": "Next season's departures, capacity and price tiers are set on forecast demand, with early warnings during the booking season.", "steps": [{"id": "build-booking-curves", "title": "Build booking curves from history", "actor": "Finance and Administration Lead", "keyFacts": ["Booking curves show, per product and departure month, how bookings accumulate relative to departure across past seasons.", "Curves separate direct, reseller and partner channels."], "painPoints": ["Without curves, an early slow season looks like a disaster and a late one like a success.", "History in old spreadsheets cannot be compared across seasons."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Booking curve analysis.", "how": "Builds curves from historical bookings."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Historical booking data.", "how": "Supplies booking dates and departures."}]}, {"id": "forecast-next-season", "title": "Forecast next season's demand", "actor": "Travel Company Owner", "keyFacts": ["Forecasts per product combine curves, current early bookings, campaign plans and market signals; the AI assistant flags products whose forecast deviates from last year.", "Forecasts are shown with ranges, not single numbers."], "painPoints": ["Contracting capacity on last year's final numbers ignores trend changes.", "Point forecasts create false confidence."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Demand forecasting.", "how": "Produces forecasts with ranges per product."}, {"type": "brick", "id": "aiaa", "name": "AI Office Assistants", "description": "Forecast deviation flags.", "how": "Highlights products deviating from trend."}]}, {"id": "decide-departures-and-capacity", "title": "Decide departures, capacity and minimums", "actor": "Group Travel Operations Manager", "keyFacts": ["The number of departures, coach size, hotel allotments and minimum participants per departure are set from the forecast and margin scenarios.", "Decisions feed directly into the departure series and purchasing targets."], "painPoints": ["Capacity decisions disconnected from the product setup are re-entered by hand.", "Minimums set too high cancel departures that would have filled."], "dependencies": [{"type": "brick", "id": "dept", "name": "Departures and Capacity Management", "description": "Departure series and capacity.", "how": "Applies the capacity decisions to departures."}]}, {"id": "set-yield-strategy", "title": "Set the yield and pricing strategy", "actor": "Travel Company Owner", "keyFacts": ["Early-bird tiers, load-based tiers and last-minute rules are set per product from the forecast and last year's realised prices.", "Rules are simulated against the curve before activation."], "painPoints": ["Prices set by gut feel leave money on strong departures and empty weak ones.", "Untested rules produce surprising prices on the website."], "dependencies": [{"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Yield rules and simulation.", "how": "Configures and simulates tiered pricing."}, {"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Realised price and demand analysis.", "how": "Supplies price history and curves."}]}, {"id": "monitor-season-against-forecast", "title": "Monitor the season against forecast with early warnings", "actor": "Travel Company Owner", "keyFacts": ["During the booking season the actual curve is tracked against forecast; deviations raise alerts to adjust prices, campaigns or capacity in time.", "Each alert links to the action that can be taken in the ERP."], "painPoints": ["Deviations discovered at the go/no-go deadline are too late to fix.", "Alerts without an action path are ignored."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Forecast tracking and alerts.", "how": "Compares actuals to forecast and alerts."}, {"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Alerts as tasks.", "how": "Turns deviations into actionable tasks."}]}]}], "outcomes": ["Revenue per FTE tracked and improved, because the owner sees where handling time goes and which processes scale", "Capacity and pricing decisions taken on load-factor and margin data per departure, weeks earlier than before", "One set of numbers shared by sales, operations and finance, closing the gap between sold and realised margin"], "brickDependencies": [{"targetBrickId": "bint", "type": "composition"}, {"targetBrickId": "book", "type": "composition"}, {"targetBrickId": "invc", "type": "composition"}, {"targetBrickId": "dept", "type": "composition"}, {"targetBrickId": "pric", "type": "composition"}, {"targetBrickId": "crmr", "type": "composition"}, {"targetBrickId": "acct", "type": "composition"}, {"targetBrickId": "gfnd", "type": "composition"}, {"targetBrickId": "wflw", "type": "composition"}, {"targetBrickId": "aiaa", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "Travel Intelligence BI", "type": "analytics-platform", "interface": "Nightly data export and dashboard embedding", "description": "Trade-specific BI dashboards for bookings, margin, load factor and forecast."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []}]};
        const dataAssetsPayload = {"metadata": {"title": "Tour Operator ERP Platform Data Assets", "description": "Catalog of the product, supplier, booking, passenger, operational, financial, marketing, and tenant data assets that power the travel trade lifecycle (Product, Sell, Book, Operate, Serve, Settle, Steer) on the combined 1TIS + TravelSpirit ERP platform, with classification, GDPR and Dutch fiscal governance, backing stores, and team ownership.", "modelVersion": "1.0"}, "rootGroups": [{"name": "Travel Product and Supply Data", "description": "What the travel organisation sells and what it buys: packages, departure series, and individual components with their availability, pricing and yield rules, supplier contracts, and the texts and photos that describe them. This is tenant-owned commercial data with almost no personal data, but it is the operator's intellectual property and the basis of every price on every invoice.", "subGroups": [{"name": "Product Catalog and Pricing", "description": "The sellable catalog and its price logic: products, components, price and yield rules, and travel content.", "assets": [{"id": "travel-product", "name": "Travel Product", "kind": "master-data", "description": "A sellable travel product of a tenant: a fixed-date group tour or bus round trip with its departure series, a packaged itinerary, a single-service product (hotel stay, excursion, transfer), or a tailor-made template. Carries product type, day-by-day programme, included and optional components, sales periods, brand and market assignments, minimum and maximum participants, target margin, and publication state per channel (own website, reseller portal, partner feeds). Maintained in Travel Products and Packages (prod), priced by Pricing, Yield and Group Calculations (pric), and published to the Customer Website, CMS and Online Booking (webs).", "businessMeaning": "The commercial promise the operator makes to the market: one product equals one thing a traveler can book and the operator must deliver and account for.", "status": "active", "tags": ["travel-product-and-supply", "sales-and-booking"], "classification": "confidential", "personalDataLevel": "none", "dataSubjects": [], "legalTags": ["package-travel-directive"], "securityCriticality": "high", "accessScope": "product managers and sales staff of the owning tenant; published attributes visible to travelers, resellers, and partner channels per channel rules", "systemOfRecordBrickId": "prod", "ownerTeamId": "product-and-pricing", "stewardTeamIds": ["web-and-channels"], "derivedFromAssetIds": ["travel-component", "supplier-contract"], "stores": [{"storeId": "travel-product-db", "role": "system-of-record"}, {"storeId": "product-availability-cache", "role": "serving"}, {"storeId": "travel-content-index", "role": "serving"}, {"storeId": "travel-data-warehouse", "role": "analytics-warehouse"}], "interfaces": [{"type": "api", "name": "travel-product api", "description": "CRUD, publication, and availability-lookup API for products and departure series, used by the back-office product module, the online booking website, the reseller portal, and the partner product feed."}, {"type": "event", "name": "product publication events", "description": "Product created, updated, published, unpublished, and sold-out events consumed by website caches, channel feeds, and the data warehouse."}], "governance": {"retention": "product lifecycle plus 7 years of version history so that every historical booking and invoice can be traced to the product definition it was sold under", "residency": "eu", "sharingPolicy": "owned by the tenant; published attributes shared with the tenant's own website, resellers, and partner channels; never shared between tenants; anonymised product-type facts may feed cross-tenant benchmarks"}}, {"id": "travel-component", "name": "Travel Component", "kind": "master-data", "description": "An individually bookable building block of a trip: an accommodation and room type, a transport leg (flight, bus, train, ferry, transfer), an excursion or activity, a guide service, or an ancillary such as insurance or eSIM. Holds the supplier, destination, service description, allotment and release rules, blocked inventory, availability calendars, purchase cost basis linked to the supplier contract, and the texts and photos used when the component appears in a proposal. Components are the raw material of the Visual Tour Builder (vtbl) and of package composition, and their availability drives real-time bookability on the website.", "businessMeaning": "The unit of supply the operator composes trips from: every proposal, package, and supplier request is a list of components with dates and quantities.", "status": "active", "tags": ["travel-product-and-supply"], "classification": "confidential", "personalDataLevel": "none", "dataSubjects": [], "legalTags": [], "securityCriticality": "medium", "accessScope": "product and purchasing staff of the owning tenant for maintenance; tour builders and booking agents read; availability served to booking channels", "systemOfRecordBrickId": "comp", "ownerTeamId": "product-and-pricing", "stewardTeamIds": ["tour-builder"], "derivedFromAssetIds": ["supplier-contract", "supplier-profile"], "stores": [{"storeId": "travel-product-db", "role": "system-of-record"}, {"storeId": "product-availability-cache", "role": "serving"}, {"storeId": "travel-content-index", "role": "serving"}], "interfaces": [{"type": "api", "name": "component and availability api", "description": "Search, detail, and availability-check API for components, used by the tour builder, package composition, the online booking flow, and bed-bank and channel connectors that update allotments."}, {"type": "event", "name": "availability change events", "description": "Allotment consumed, released, stop-sale, and reopened events that refresh availability caches and alert product managers via the workflow module."}], "governance": {"retention": "active while the supplier relationship lasts; retired components kept 7 years for cost-basis traceability of past bookings", "residency": "eu", "sharingPolicy": "internal to the tenant; availability and descriptive content exposed to the tenant's own channels; purchase cost never exposed outside the tenant"}}, {"id": "price-and-yield-rule", "name": "Price and Yield Rule", "kind": "reference-data", "description": "The price logic applied to products and departures: base prices per season, room type, and age band, supplements and discounts, early-booking and last-minute rules, currency and exchange-rate assumptions, tour-operator margin (TOMS VAT) treatment, group calculation sheets that spread fixed costs (bus, guide, permits) over expected participants, and yield tiers that raise or lower a departure's price as the load factor changes. Owned by Pricing, Yield and Group Calculations (pric) and evaluated at quote, booking, and invoice time so that every amount on a booking line can be reproduced.", "businessMeaning": "How the operator turns cost into a sales price and protects margin per departure: the rules that decide whether a trip is profitable before it runs.", "status": "active", "tags": ["travel-product-and-supply", "finance-and-insight"], "classification": "confidential", "personalDataLevel": "none", "dataSubjects": [], "legalTags": ["toms-vat"], "securityCriticality": "high", "accessScope": "pricing and product managers of the owning tenant; evaluated server-side for booking channels, which see resulting prices but not cost or margin", "systemOfRecordBrickId": "pric", "ownerTeamId": "product-and-pricing", "stewardTeamIds": ["payments-and-invoicing"], "derivedFromAssetIds": ["supplier-contract"], "stores": [{"storeId": "travel-product-db", "role": "system-of-record"}, {"storeId": "product-availability-cache", "role": "serving"}, {"storeId": "travel-data-warehouse", "role": "analytics-warehouse"}], "interfaces": [{"type": "api", "name": "price calculation api", "description": "Price-a-trip and price-a-departure API returning itemised sales price, cost, and margin for a proposal, booking, or departure scenario; used by the tour builder, booking desk, website, and reseller portal."}, {"type": "event", "name": "price and yield change events", "description": "Rule versions published and yield tier changes per departure, consumed by website price caches, channel feeds, and BI margin dashboards."}], "governance": {"retention": "every rule version kept 7 years after its last use so that invoiced amounts remain reproducible for fiscal and consumer-dispute purposes", "residency": "eu", "sharingPolicy": "strictly internal to the tenant; only resulting sales prices leave the system; cost and margin are never shown to travelers, resellers, or suppliers"}}, {"id": "travel-content-asset", "name": "Travel Content Asset", "kind": "document", "description": "The texts, photos, videos, maps, and PDF brochures that describe destinations, products, and components: multilingual descriptions, highlight bullets, practical information, hotel and excursion photo sets managed in the MediaSpirit-style media library, licence and photographer credits, and usage rights per channel. Managed in Travel Content and Media Management (ctnt), attached to products by Travel Products and Packages (prod), and rendered in proposals by the Visual Tour Builder (vtbl), on the website, and in travel documents.", "businessMeaning": "The operator's storytelling capital: reusable content that makes a proposal or website page compelling without rewriting it per trip.", "status": "active", "tags": ["travel-product-and-supply", "sales-and-booking"], "classification": "internal", "personalDataLevel": "none", "dataSubjects": [], "legalTags": ["copyright-licensing"], "securityCriticality": "medium", "accessScope": "content editors of the owning tenant; published content public on the tenant's website and proposals; licensed stock content restricted to permitted channels", "systemOfRecordBrickId": "ctnt", "ownerTeamId": "product-and-pricing", "stewardTeamIds": ["tour-builder", "web-and-channels"], "derivedFromAssetIds": [], "stores": [{"storeId": "travel-content-store", "role": "system-of-record"}, {"storeId": "travel-content-index", "role": "serving"}], "interfaces": [{"type": "api", "name": "content and media api", "description": "Upload, tag, search, and render API for texts and media, including CDN-ready image variants, used by the product module, tour builder, CMS, document generation, and the traveler portal."}, {"type": "event", "name": "content published events", "description": "Content created, updated, and licence-expired events that invalidate website and document caches and warn editors about expiring image rights."}], "governance": {"retention": "kept while the tenant licenses the platform; licensed third-party media purged when its usage rights expire; deleted with the tenant on off-boarding after export", "residency": "eu", "sharingPolicy": "public once published on the tenant's own channels; media rights determine whether content may appear in reseller or partner channels; not shared between tenants"}}]}, {"name": "Supplier Contracts and Network", "description": "The buy side: supplier and DMC master data, contracted purchase conditions, and the request/confirmation traffic that keeps suppliers in sync with bookings.", "assets": [{"id": "supplier-contract", "name": "Supplier Contract", "kind": "financial-record", "description": "The purchasing agreement with a hotel, bus company, airline consolidator, DMC, or activity provider: contract period, purchase rates per season and room or seat type, allotments and release days, free places for guides, cancellation and deposit terms, currency, commission or net basis, and signed contract documents. Maintained in Purchasing and Supplier Contracts (cont) and used by Components, Inventory and Availability (comp) to price components and manage allotments, and by settlement to validate supplier invoices.", "businessMeaning": "What the operator owes suppliers per booked service: the cost basis behind margin, the allotment behind availability, and the reference every supplier invoice is checked against.", "status": "active", "tags": ["travel-product-and-supply", "finance-and-insight"], "classification": "confidential", "personalDataLevel": "personal", "dataSubjects": ["partner"], "legalTags": ["gdpr", "fiscal-retention-nl"], "securityCriticality": "high", "accessScope": "purchasing and finance staff of the owning tenant; product staff read rates and allotments; never visible to travelers or resellers", "systemOfRecordBrickId": "cont", "ownerTeamId": "product-and-pricing", "stewardTeamIds": ["supplier-network", "accounting-and-compliance"], "derivedFromAssetIds": ["supplier-profile"], "stores": [{"storeId": "travel-product-db", "role": "system-of-record"}, {"storeId": "travel-document-store", "role": "archive"}, {"storeId": "travel-data-warehouse", "role": "analytics-warehouse"}], "interfaces": [{"type": "api", "name": "supplier-contract api", "description": "Contract, rate, and allotment maintenance API with rate lookup by service and date, used by the purchasing module, component pricing, and supplier-invoice matching."}, {"type": "event", "name": "contract lifecycle events", "description": "Contract signed, rates updated, allotment released, and contract expiring events consumed by pricing, availability, and workflow alerts."}], "governance": {"retention": "contract period plus 7 years under Dutch fiscal retention because contracts substantiate supplier invoices and cost of sales", "residency": "eu", "sharingPolicy": "internal to the tenant; contract terms shared only with the counterparty supplier through the supplier portal; supplier contact persons' details limited to the business relationship"}}, {"id": "supplier-profile", "name": "Supplier Profile", "kind": "master-data", "description": "Master record of a supplier or DMC in a tenant's network: legal entity, addresses, bank details, VAT number, supplier type (hotel, transport, DMC, activity, airline consolidator), contact persons with roles and languages, preferred communication channel, portal accounts, service quality history, and payment terms. Maintained in Supplier Management and Communication (supl), referenced by Purchasing and Supplier Contracts (cont), and used to route supplier requests, invoices, and payments.", "businessMeaning": "Who the operator buys from and how to reach them: the address book, credentials, and track record behind every supplier request and settlement.", "status": "active", "tags": ["travel-product-and-supply"], "classification": "confidential", "personalDataLevel": "personal", "dataSubjects": ["partner"], "legalTags": ["gdpr"], "securityCriticality": "medium", "accessScope": "purchasing, operations, and finance staff of the owning tenant; suppliers manage their own contact data via the supplier portal", "systemOfRecordBrickId": "supl", "ownerTeamId": "supplier-network", "stewardTeamIds": ["product-and-pricing"], "derivedFromAssetIds": [], "stores": [{"storeId": "supplier-network-db", "role": "system-of-record"}, {"storeId": "accounting-provider-mirror", "role": "projection"}], "interfaces": [{"type": "api", "name": "supplier-profile api", "description": "Supplier master data and contact API, used by purchasing, supplier requests, invoice matching, the supplier portal, and accounting-package creditor synchronisation."}, {"type": "event", "name": "supplier master events", "description": "Supplier created, contact changed, bank details changed (with four-eyes approval), and supplier blocked events consumed by settlement and workflow alerts."}], "governance": {"retention": "active while the supplier relationship lasts plus 7 years after the last settled invoice; contact-person details removed when a person leaves the supplier", "residency": "eu", "sharingPolicy": "internal to the tenant; creditor data synchronised to the tenant's accounting package; never shared between tenants even when they use the same supplier"}}, {"id": "supplier-request", "name": "Supplier Request", "kind": "operational-state", "description": "A service request from an operator to a supplier or DMC for one or more booking lines: requested services, dates, quantities, passenger names and room configuration, special wishes, deadline, and the full request/approval cycle (requested, confirmed, rejected, amended, cancelled) with confirmation numbers and every email or portal message exchanged. Created and tracked in Supplier Management and Communication (supl), answered through the Supplier and DMC Portal (sprt), and updated automatically when the underlying booking changes so that suppliers always work from the latest version.", "businessMeaning": "The operator's proof that a service is actually secured: no booking line is deliverable until its supplier request is confirmed, and every change must travel through it.", "status": "active", "tags": ["travel-product-and-supply", "operations-and-traveler-service"], "classification": "confidential", "personalDataLevel": "personal", "dataSubjects": ["customer", "partner"], "legalTags": ["gdpr"], "securityCriticality": "high", "accessScope": "operations and purchasing staff of the owning tenant; the addressed supplier or DMC sees only its own requests through the portal", "systemOfRecordBrickId": "supl", "ownerTeamId": "supplier-network", "stewardTeamIds": ["group-operations"], "derivedFromAssetIds": ["booking-file", "supplier-contract"], "stores": [{"storeId": "supplier-network-db", "role": "system-of-record"}, {"storeId": "booking-event-topic", "role": "event-source"}, {"storeId": "crm-communication-archive", "role": "archive"}], "interfaces": [{"type": "api", "name": "supplier-request api", "description": "Create, send, confirm, reject, and amend API for supplier requests, used by the back office, the supplier and DMC portal, email parsing of supplier replies, and partner DMC system integrations."}, {"type": "event", "name": "supplier request status events", "description": "Requested, confirmed, rejected, changed, and overdue events that drive booking-line status, workflow alerts for unconfirmed services, and passenger-list synchronisation."}], "governance": {"retention": "3 years after the service date for dispute handling; passenger names in requests minimised after the trip plus claims window; requests linked to settled supplier invoices kept 7 years", "residency": "eu", "sharingPolicy": "shared with the addressed supplier or DMC only, limited to the passenger details that supplier needs to deliver the service (names, room configuration, relevant wishes); never with other suppliers or tenants"}}]}]}, {"name": "Sales and Booking Data", "description": "The sell and book stage: visual proposals for tailor-made trips, the booking file that becomes the single dossier for a trip, imported flight tickets, and the customer and reseller master data behind them. This is where personal data enters the platform and where the fiscal trail begins.", "subGroups": [{"name": "Quotes and Booking Files", "description": "From proposal to confirmed dossier: quote versions, the booking file with its lines and travelers, and flight ticket records.", "assets": [{"id": "quote-proposal", "name": "Quote Proposal", "kind": "logical-object", "description": "A visual, day-by-day travel proposal for a tailor-made trip built from stored components in the Visual Tour Builder (vtbl): itinerary days with texts and photos, selected accommodations and activities, itemised price with margin, validity date, alternatives, and version history. Each version is shared with the client as an online proposal page where the client can comment, request changes, and accept with a deposit. AI Office Assistants (aiaa) draft proposal texts and suggest components; acceptance opens a booking file.", "businessMeaning": "The conversion instrument of the tailor-made business: the faster and more compelling the proposal, the higher the acceptance rate and the margin it closes at.", "status": "active", "tags": ["sales-and-booking"], "classification": "confidential", "personalDataLevel": "personal", "dataSubjects": ["customer"], "legalTags": ["gdpr"], "securityCriticality": "medium", "accessScope": "sales staff of the owning tenant; the client reads and accepts through a tokenised proposal link; cost and margin are hidden from the client view", "systemOfRecordBrickId": "vtbl", "ownerTeamId": "tour-builder", "stewardTeamIds": ["booking-desk", "ai-enablement"], "derivedFromAssetIds": ["travel-component", "travel-content-asset", "customer-profile"], "stores": [{"storeId": "quote-proposal-db", "role": "system-of-record"}, {"storeId": "travel-content-store", "role": "serving"}, {"storeId": "travel-data-warehouse", "role": "analytics-warehouse"}], "interfaces": [{"type": "api", "name": "proposal api", "description": "Build, version, price, publish, and accept API for proposals, used by the tour builder web app, the client-facing proposal page, AI drafting assistants, and booking-file creation on acceptance."}, {"type": "event", "name": "proposal lifecycle events", "description": "Proposal sent, viewed, commented, accepted, expired, and lost events consumed by workflow follow-up tasks, CRM lead status, and conversion dashboards."}], "governance": {"retention": "unconverted proposals deleted 24 months after the last client activity; accepted proposals follow the retention of the booking file they created", "residency": "eu", "sharingPolicy": "shared with the addressed client only via an expiring personal link; proposal content may be reused as anonymised templates within the tenant; never shared between tenants"}}, {"id": "booking-file", "name": "Booking File", "kind": "logical-object", "description": "The dossier of one trip for one booking party: booking number, booker and travelers, booking lines per component or package with dates, quantities, prices and status (option, reques cation (seat) and the Guide and Group Leader Portal (guid).", "businessMeaning": "The profit-and-loss unit of a group operator: each departure either fills to a viable load factor or gets cancelled, and every operational list hangs off it.", "status": "active", "tags": ["operations-and-traveler-service", "travel-product-and-supply"], "classification": "confidential", "personalDataLevel": "personal", "dataSubjects": ["employee", "partner"], "legalTags": ["gdpr", "package-travel-directive"], "securityCriticality": "high", "accessScope": "operations and product staff of the owning tenant; assigned guides see their departures in the guide portal; availability status served to booking channels", "systemOfRecordBrickId": "dept", "ownerTeamId": "group-operations", "stewardTeamIds": ["product-and-pricing"], "derivedFromAssetIds": ["travel-product"], "stores": [{"storeId": "group-operations-db", "role": "system-of-record"}, {"storeId": "product-availability-cache", "role": "serving"}, {"storeId": "booking-event-topic", "role": "event-source"}, {"storeId": "travel-data-warehouse", "role": "analytics-warehouse"}], "interfaces": [{"type": "api", "name": "departure api", "description": "Departure calendar, capacity, guarantee decision, assignment, and passenger-count API used by the operations dashboard, booking availability checks, the guide portal, and website departure lists."}, {"type": "event", "name": "departure status events", "description": "Departure opened, guaranteed, nearly full, full, cancelled, and departed events consumed by pricing yield tiers, website availability, workflow alerts for minimum-participant deadlines, and BI load-factor dashboards."}], "governance": {"retention": "7 years after the departure date as operational history linked to bookings; guide and driver assignments pseudonymised after 2 years", "residency": "eu", "sharingPolicy": "internal to the tenant; open/full status exposed to booking channels; passenger counts and room configuration shared ist changed, and seat conflict events that trigger re-sends to hotels and DMCs and alerts when a booking change invalidates an already-sent list."}], "governance": {"retention": "deleted 6 months after the trip end date; only anonymised occupancy statistics kept in the warehouse for capacity planning", "residency": "eu", "sharingPolicy": "shared per service with the hotel, bus company, or DMC that delivers it, limited to the travelers on that service; never shared beyond the delivering supplier"}}, {"id": "passenger-record", "name": "Passenger Record", "kind": "logical-object", "description": "The per-traveler operational data collected for a booking: full names as on passport, date of birth, nationality, passport number, issue and expiry dates and Advance Passenger Information (APIS) fields required by airlines and authorities, emergency contacts, and the dietary requirements, mobility and medical wishes, and allergies travelers share so that hotels, guides, and DMCs can accommodate them. Collected through the traveler portal and desk in Passenger Data and Operational Lists (pass), exposed to guides through the Guide and Group Leader Portal (guid), and fed into rooming lists, participant lists, and supplier requests only as far as each recipient needs.", "businessMeaning": "The data that lets the trip actually run safely: the airline needs APIS, the hotel needs the dietary list, the guide needs to know who has a mobility limitation. It is also the highest-risk data the platform holds.", "status": "active", "tags": ["operations-and-traveler-service"], "classification": "restricted", "personalDataLevel": "sensitive", "dataSubjects": ["customer"], "legalTags": ["gdpr", "gdpr-special-category", "apis"], "securityCriticality": "critical", "accessScope": "operations staff of the owning tenant with an explicit passenger-data role; travelers edit their own record; guides, hotels, and DMCs receive field-level extracts per service; passport numbers masked outside the flight les; suppliers see their own invoice status through the supplier portal", "systemOfRecordBrickId": "acct", "ownerTeamId": "accounting-and-compliance", "stewardTeamIds": ["supplier-network", "payments-and-invoicing"], "derivedFromAssetIds": ["supplier-request", "supplier-contract"], "stores": [{"storeId": "finance-ledger-db", "role": "system-of-record"}, {"storeId": "travel-document-store", "role": "archive"}, {"storeId": "accounting-provider-mirror", "role": "projection"}, {"storeId": "travel-data-warehouse", "role": "analytics-warehouse"}], "interfaces": [{"type": "api", "name": "supplier-invoice api", "description": "Register, match, approve, dispute, and schedule-for-payment API for supplier invoices, used by the finance workspace, supplier portal upload, invoice-recognition assistants, and accounting export."}, {"type": "file", "name": "accounting and e-invoice exchange", "description": "Scheduled export of approved purchase invoices and payment runs to the tenant's accounting package (Exact-style connector) and intake of UBL e-invoices from suppliers."}, {"type": "event", "name": "supplier invoice events", "description": "Invoice received, matched, discrepancy flagged, approved, paid, and disputed events consumed by workflow approvals, cash-flow forecasting, and margin-per-trip dashboards."}], "governance": {"retention": "7 years after the fiscal year of receipt under Dutch fiscal retention; original invoice images retained immutably", "residency": "eu", "sharingPolicy": "shared with the tenant's accounting package and accountant; status shared with the issuing supplier; never shared between tenants"}}]}, {"name": "Regulatory Reporting", "description": "Reports the Dutch travel trade owes its guarantee fund and regulators.", "assets": [{"id": "guarantee-fund-report", "name": "Guarantee Fund Report", "kind": "derived-dataset", "description": "Periodic and ad-hoc reports required by the travel guarantee fund (SGR-style) and package-travel regulation: forward bookings and prepaid customer money per departure period as the fund's exposure basis, per-booking guarantee contributions collected, insolvency-coverage declarations, package versus linked-travel-arrangement classification of sold products, and the audit trail of the figures back to booking files, invoices, and payments. Compiled by Guarantee Fund and Regulatory Reporting (gfnd) from the booking file and financial records and filed on the fund's schedule.", "businessMeaning": "The operator's licence to trade: without correct guarantee-fund reporting the operator cannot sell packages, and understated exposure is a personal liability for the owner.", "status": "active", "tags": ["finance-and-insight"], "classification": "confidential", "personalDataLevel": "none", "dataSubjects": [], "legalTags": ["sgr-guarantee-fund", "package-travel-directive", "fiscal-retention-nl"], "securityCriticality": "high", "accessScope": "finance lead and owner of the tenant; the guarantee fund receives the filed report; auditors get read access on request", "systemOfRecordBrickId": "gfnd", "ownerTeamId": "accounting-and-compliance", "stewardTeamIds": ["payments-and-invoicing"], "derivedFromAssetIds": ["booking-file", "customer-invoice", "payment-transaction"], "stores": [{"storeId": "compliance-report-archive", "role": "system-of-record"}, {"storeId": "travel-data-warehouse", "role": "analytics-warehouse"}], "interfaces": [{"type": "api", "name": "regulatory report api", "description": "Compile, preview, approve, and archive API for guarantee-fund and package-travel reports with drill-down to source bookings, used by the finance workspace and auditor read access."}, {"type": "file", "name": "guarantee fund filing", "description": "Filing export in the fund's required format, delivered on the fund's reporting calendar and archived with the approval record."}], "governance": {"retention": "7 years after filing, immutable once approved, with the source snapshot preserved for audit", "residency": rivedFromAssetIds": ["customer-profile", "booking-file"], "stores": [{"storeId": "marketing-segment-db", "role": "system-of-record"}, {"storeId": "email-marketing-mirror", "role": "projection"}, {"storeId": "travel-data-warehouse", "role": "analytics-warehouse"}], "interfaces": [{"type": "api", "name": "consent and segment api", "description": "Consent capture, preference centre, segment definition, and audience export API used by the website, traveler portal, back office, and the email-marketing connector."}, {"type": "event", "name": "consent and segment events", "description": "Consent granted, withdrawn, segment membership changed, and campaign sent events consumed by the marketing provider sync, CRM, and campaign attribution in BI."}], "governance": {"retention": "consent records kept while consent is active and 2 years after withdrawal as proof of lawful processing; segments recalculated nightly and not kept as history beyond 13 months", "residency": "eu", "sharingPolicy": "consented contacts and segment tags shared with the tenant's email-marketing provider under a processor agreement; never shared between tenants; special-category data from passenger records is never used for segmentation"}}]}, {"name": "Tenant and Access Data", "description": "The multi-tenant foundation: each travel company as a tenant with its subscription, users, roles, and brand settings.", "assets": [{"id": "tenant-organization", "name": "Tenant Organization", "kind": "master-data", "description": "The travel company as a tenant of the platform: legal entity and trade memberships (ANVR, VVKR, guarantee fund), subscription and licensed modules and portals, brands and websites with their styling and document templates, fiscal settings (VAT, invoice sequences, currencies), users with roles and permissions, single sign-on and API credentials, integration configurations (accounting, payment, flight, marketing, telephony), and audit logs of administrative changes. Maintained by Identity, Tenants and Access (iden) and used by the Integration Hub and Partner APIs (intg) to scope every partner call to one tenant.", "businessMeaning": "The boundary of trust in a multi-tenant ERP: every other asset belongs to exactly one tenant, and the tenant's licensed modules, users, and brand settings decide what its people and partners can do.", "status": "active", "tags": ["platform-foundation"], "classification": "restricted", "personalDataLevel": "personal", "dataSubjects": ["employee", "partner"], "legalTags": ["gdpr"], "securityCriticality": "critical", "accessScope": "tenant administrators for their own tenant; platform operator support and tenant administration back office under logged access; API credentials visible only at creation", "systemOfRecordBrickId": "iden", "ownerTeamId": "platform-core", "stewardTeamIds": ["customer-success-and-consulting"], "derivedFromAssetIds": [], "stores": [{"storeId": "tenant-identity-db", "role": "system-of-record"}, {"storeId": "integration-event-bus", "role": "event-source"}], "interfaces": [{"type": "api", "name": "tenant and identity api", "description": "Tenant provisioning, module licensing, brand configuration, user and role management, authentication, and API-credential API used by all web applications, portals, the partner REST API gateway, and the tenant administration back office."}, {"type": "event", "name": "tenant and access events", "description": "Tenant created, module licensed, user invited, role changed, credential rotated, and tenant suspended events consumed by every module's authorisation cache, integration hub routing, and platform usage reporting."}], "governance": {"retention": "subscription period plus 7 years for contract and billing records; user accounts deleted 90 days after deactivation; administrative audit logs kept 24 months; tenant data exported and deleted within 90 days of off-boarding", "residency": "eu", "sharingPolicy": "visible only to the tenant's own administrators and the platform op ion, and availability-lookup API for products and departure series, used by the back-office product module, the online booking website, the reseller portal, and the partner product feed."}, {"type": "event", "name": "product publication events", "description": "Product created, updated, published, unpublished, and sold-out events consumed by website caches, channel feeds, and the data warehouse."}], "governance": {"retention": "product lifecycle plus 7 years of version history so that every historical booking and invoice can be traced to the product definition it was sold under", "residency": "eu", "sharingPolicy": "owned by the tenant; published attributes shared with the tenant's own website, resellers, and partner channels; never shared between tenants; anonymised product-type facts may feed cross-tenant benchmarks"}}, {"id": "travel-component", "name": "Travel Component", "kind": "master-data", "description": "An individually bookable building block of a trip: an accommodation and room type, a transport leg (flight, bus, train, ferry, transfer), an excursion or activity, a guide service, or an ancillary such as insurance or eSIM. Holds the supplier, destination, service description, allotment and release rules, blocked inventory, availability calendars, purchase cost basis linked to the supplier contract, and the texts and photos used when the component appears in a proposal. Components are the raw material of the Visual Tour Builder (vtbl) and of package composition, and their availability drives real-time bookability on the website.", "businessMeaning": "The unit of supply the operator composes trips from: every proposal, package, and supplier request is a list of components with dates and quantities.", "status": "active", "tags": ["travel-product-and-supply"], "classification": "confidential", "personalDataLevel": "none", "dataSubjects": [], "legalTags": [], "securityCriticality": "medium", "accessScope": "product and purchasing staff of the owning tenant for ed.", "businessMeaning": "How the operator turns cost into a sales price and protects margin per departure: the rules that decide whether a trip is profitable before it runs.", "status": "active", "tags": ["travel-product-and-supply", "finance-and-insight"], "classification": "confidential", "personalDataLevel": "none", "dataSubjects": [], "legalTags": ["toms-vat"], "securityCriticality": "high", "accessScope": "pricing and product managers of the owning tenant; evaluated server-side for booking channels, which see resulting prices but not cost or margin", "systemOfRecordBrickId": "pric", "ownerTeamId": "product-and-pricing", "stewardTeamIds": ["payments-and-invoicing"], "derivedFromAssetIds": ["supplier-contract"], "stores": [{"storeId": "travel-product-db", "role": "system-of-record"}, {"storeId": "product-availability-cache", "role": "serving"}, {"storeId": "travel-data-warehouse", "role": "analytics-warehouse"}], "interfaces": [{"type": "api", "name": "price calculation api", "description": "Price-a-trip and price-a-departure API returning itemised sales price, cost, and margin for a proposal, booking, or departure scenario; used by the tour builder, booking desk, website, and reseller portal."}, {"type": "event", "name": "price and yield change events", "description": "Rule versions published and yield tier changes per departure, consumed by website price caches, channel feeds, and BI margin dashboards."}], "governance": {"retention": "every rule version kept 7 years after its last use so that invoiced amounts remain reproducible for fiscal and consumer-dispute purposes", "residency": "eu", "sharingPolicy": "strictly internal to the tenant; only resulting sales prices leave the system; cost and margin are never shown to travelers, resellers, or suppliers"}}, {"id": "travel-content-asset", "name": "Travel Content Asset", "kind": "document", "description": "The texts, photos, videos, maps, and PDF brochures that describe destinations, products, and components: mu cept with a deposit. AI Office Assistants (aiaa) draft proposal texts and suggest components; acceptance opens a booking file.", "businessMeaning": "The conversion instrument of the tailor-made business: the faster and more compelling the proposal, the higher the acceptance rate and the margin it closes at.", "status": "active", "tags": ["sales-and-booking"], "classification": "confidential", "personalDataLevel": "personal", "dataSubjects": ["customer"], "legalTags": ["gdpr"], "securityCriticality": "medium", "accessScope": "sales staff of the owning tenant; the client reads and accepts through a tokenised proposal link; cost and margin are hidden from the client view", "systemOfRecordBrickId": "vtbl", "ownerTeamId": "tour-builder", "stewardTeamIds": ["booking-desk", "ai-enablement"], "derivedFromAssetIds": ["travel-component", "travel-content-asset", "customer-profile"], "stores": [{"storeId": "quote-proposal-db", "role": "system-of-record"}, {"storeId": "travel-content-store", "role": "serving"}, {"storeId": "travel-data-warehouse", "role": "analytics-warehouse"}], "interfaces": [{"type": "api", "name": "proposal api", "description": "Build, version, price, publish, and accept API for proposals, used by the tour builder web app, the client-facing proposal page, AI drafting assistants, and booking-file creation on acceptance."}, {"type": "event", "name": "proposal lifecycle events", "description": "Proposal sent, viewed, commented, accepted, expired, and lost events consumed by workflow follow-up tasks, CRM lead status, and conversion dashboards."}], "governance": {"retention": "unconverted proposals deleted 24 months after the last client activity; accepted proposals follow the retention of the booking file they created", "residency": "eu", "sharingPolicy": "shared with the addressed client only via an expiring personal link; proposal content may be reused as anonymised templates within the tenant; never shared between tenants"}}, {"id": "booking-file", "name": "B ier requests, and document generation."}, {"type": "event", "name": "passenger data events", "description": "Passenger data completed, passport expiring before travel, special wish added, and record purged events that drive workflow reminders and re-sends of operational lists."}], "governance": {"retention": "passport and APIS fields deleted 30 days after the return date; dietary, medical, and mobility wishes deleted after the trip end plus a 3-month claims window; only names and dates of birth survive on the booking file for fiscal retention; explicit consent recorded for special-category fields", "residency": "eu", "sharingPolicy": "shared strictly per purpose: APIS with airlines and authorities, dietary and room wishes with the delivering hotel or DMC, mobility and medical notes with the assigned guide; never used for marketing, never shared between tenants; encrypted at rest and access-logged"}}, {"id": "travel-document", "name": "Travel Document", "kind": "document", "description": "A generated document for a booking: booking confirmation, invoice copy, travel programme and itinerary booklet, vouchers and e-tickets per service, hotel and transfer details, practical information, insurance certificate, and departure information letter, in the tenant's branding and the traveler's language, each with version and send history. Generated by Travel Documents and Itinerary Delivery (docs) from the booking file, content assets, and passenger data, and delivered through email, the Traveler Portal and My-Trip App (mytp), and partner mobile apps.", "businessMeaning": "The tangible output of the booking that the traveler holds during the trip and that legally records what was agreed and delivered.", "status": "active", "tags": ["operations-and-traveler-service"], "classification": "confidential", "personalDataLevel": "personal", "dataSubjects": ["customer"], "legalTags": ["gdpr", "package-travel-directive"], "securityCriticality": "medium", "accessScope": "booking and opera
