    <style>
    /* Shared design tokens for all generated pages.
       Canonical palette promoted from the evidence-explorer page, plus the
       de-facto grays/blues already used across templates. New CSS should use
       these instead of hex literals; existing literals migrate opportunistically. */
    :root {
        /* surfaces */
        --bg: #f6f8fb;
        --panel: #ffffff;
        --surface: #f8fafc;
        --surface-muted: #eef2f7;
        --surface-fallback: #f8fafc;

        /* text */
        --ink: #1f2430;
        --ink-soft: #5b6472;
        --muted: #6b7280;
        --muted-strong: #8a94a6;

        /* lines and borders */
        --line: #e5e7eb;
        --line-strong: #d1d5db;
        --group-border: #d8e0ea;

        /* accent */
        --accent: #2563eb;
        --accent-ink: #1d4ed8;
        --accent-soft: #eff4ff;
        --accent-line: #c9dbff;
        --highlight-color: #dbeafe;

        /* shape and depth */
        --radius: 14px;
        --radius-sm: 10px;
        --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 6px 18px rgba(16, 24, 40, 0.06);
        --shadow-hover: 0 2px 6px rgba(16, 24, 40, 0.08), 0 14px 30px rgba(16, 24, 40, 0.12);
        --card-shadow: rgba(0, 0, 0, 0.15) 0px 2px 8px;
    }
</style>

    <style>
    .tab {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 4px;
    }

    .tab button {
        position: relative;
        background-color: transparent;
        border: none;
        outline: none;
        cursor: pointer;
        padding: 11px 16px;
        margin-bottom: -1px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        color: #6b7280;
        border-bottom: 2px solid transparent;
        border-radius: 8px 8px 0 0;
        transition: color 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
    }

    .tab button:hover {
        color: #1f2937;
        background-color: #f3f4f6;
    }

    .tab button:focus-visible {
        outline: 2px solid #1d4ed8;
        outline-offset: -2px;
    }

    .tab button.active {
        color: #1d4ed8;
        border-bottom-color: #1d4ed8;
    }

    .tabcontent {
        display: none;
        padding: 2px 2px;
        animation: tabContentFade 0.2s ease;
    }

    @keyframes tabContentFade {
        from {
            opacity: 0;
            transform: translateY(3px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 720px) {
        .tab {
            flex-direction: column;
            gap: 0;
        }

        .tab button {
            width: 100%;
            text-align: left;
            margin-bottom: 0;
            border-bottom: 1px solid #e5e7eb;
            border-radius: 0;
        }

        .tab button.active {
            border-bottom-color: #1d4ed8;
        }
    }
</style>

            border-radius: 8px;
            background-color: #f8fafc;
            padding: 14px;
        }

        .matrix-shell {
            min-width: 0;
        }

        .matrix-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }

        .matrix-table-wrap {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background-color: white;
            overflow: auto;
            max-height: 75vh;
        }

        .matrix-table {
            border-collapse: collapse;
            width: max-content;
            min-width: 100%;
        }

        .matrix-table th,
        .matrix-table td {
            border-bottom: 1px solid #e5e7eb;
            border-right: 1px solid #f3f4f6;
            padding: 6px;
            text-align: center;
            vertical-align: middle;
        }

        .matrix-table th {
            position: sticky;
            top: 0;
            background-color: #f8fafc;
            z-index: 1;
        }

        .matrix-row-head {
            position: sticky;
            left: 0;
            background-color: white;
            min-width: 220px;
            text-align: left;
            z-index: 1;
        }

        .matrix-corner {
            position: sticky;
            left: 0;
            top: 0;
            z-index: 2;
            background-color: #f8fafc;
            min-width: 220px;
            text-align: left;
        }

        .matrix-col-icon {
            width: 14px;
            height: 14px;
            object-fit: contain;
        }

        .matrix-col-count {
            font-size: 10px;
            color: #6b7280;
            min-width: 24px;
        }

        .matrix-row-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 80%;
            text-align: left;
        }

        .matrix-row-count {
            margin-left: auto;
            font-size: 11px;
            color: #6b7280;
            padding-left: 8px;
            white-space: nowrap;
        }

        .matrix-row-icon {
            width: 18px;
            height: 18px;
            object-fit: contain;
            flex: 0 0 auto;
        }

        .matrix-hit {
            background-color: #dbeafe;
            color: #1e3a8a;
            font-size: 11px;
            line-height: 1.2;
            max-width: 6px;
        }

        .matrix-hit-external {
            background-color: #ecfccb;
            color: #365314;
            font-size: 10px;
            line-height: 1.2;
            max-width: 6px;
        }

        .matrix-empty-cell {
            color: #d1d5db;
        }

        @media (max-width: 1080px) {
            .dependencies-layout {
                grid-template-columns: 1fr;
            }

            .matrix-layout {
                grid-template-columns: 1fr;
            }
        }

        const streamsPayload = {"metadata": {"title": "Product Streams", "description": "Outcome-based product streams for the Tour Operator ERP Platform domain: the travel trade lifecycle Product -> Sell -> Book -> Operate -> Serve -> Settle -> Steer as run by group and coach tour operators, tailor-made specialists and DMCs on the combined 1TIS + TravelSpirit platform, plus the marketing, reseller distribution and insight journeys that hang off it.", "sources": ["https://www.vortexcp.com/investment/1tis-travelspirit/", "https://www.1tis.nl/", "https://www.travelspirit.nl/", "https://www.livingstonepartners.com/", "https://www.sgr.nl/", "https://www.anvr.nl/", "https://eur-lex.europa.eu/eli/dir/2015/2302/oj", "https://www.acm.nl/nl/onderwerpen/verkoopvoorwaarden/pakketreizen"], "flowModelVersion": "3.2", "flowModelNote": "Each stream carries only stream-specific flows, names the supporting bricks used in each step and the persona acting in it, and lists the external systems (payment provider, accounting, GDS/BSP, guarantee fund, marketing, review and partner-app platforms) the flow depends on.", "definitions": {"productBrick": "A reusable implementation-facing building block used to realize one or more product streams.", "productStream": "A high-level, outcome-based experience that delivers customer or business value."}}, "rootGroups": [{"name": "Product and Sales Journeys", "description": "From supplier contracts to sellable products and from a travel wish or website visit to a confirmed booking: the journeys that bring revenue into the travel organisation through the desk, the website and the Visual Tour Builder.", "subGroups": [], "streams": [{"id": "build-and-price-travel-products", "name": "Build and Price Travel Products", "icon": "build-and-price-travel-products.png", "type": "outcome-based-stream", "description": "Take a travel organisation from negotiated supplier contracts to sellable packages, fixed-date departures, series and individual components with prices, yield rules and group calculations, so that every channel \u2014 desk, website, reseller portal and Visual Tour Builder \u2014 sells from one product master instead of a brochure spreadsheet.", "group": "Product and Sales Journeys", "rootGroup": "Product and Sales Journeys", "flows": [{"id": "contract-compose-and-price-a-departure-series", "title": "Contract, Compose and Price a Group Departure Series", "description": "From a hotel and coach contract to a published series of fixed-date departures with tiered yield pricing and minimum-participant rules.", "primaryActor": "Group Travel Operations Manager", "trigger": "The season's purchasing round closes and contracted rates arrive from hotels, coach companies and DMCs.", "successSignal": "The series is live on the website with correct prices, capacity and cancellation deadlines per departure.", "steps": [{"id": "register-supplier-contracts", "title": "Register supplier contracts and purchase rates", "actor": "Group Travel Operations Manager", "keyFacts": ["A coach round trip typically combines one coach contract, six to ten hotel contracts, ferry or toll components and a local DMC agreement per departure.", "Contracts carry allotments, release dates, child and single-room supplements and currency, all of which drive the group calculation later."], "painPoints": ["Contract terms living in email attachments mean release dates are missed and rooms are paid for that were never sold.", "Re-keying the same hotel rates into a purchase sheet and a sales sheet is the top source of margin errors."], "dependencies": [{"type": "brick", "id": "cont", "name": "Purchasing and Supplier Contracts", "description": "Stores supplier contracts, allotments and release dates.", "how": "Captures each contract once as the purchasing basis for every product that uses it."}, {"type": "brick", "id": "supl", "name": "Supplier Management and Communication", "description": "Supplier master data and communication history.", "how": "Links the contract to the supplier record and its contacts."}]}, {"id": "compose-components", "title": "Compose components and inventory", "actor": "Group Travel Operations Manager", "keyFacts": ["A component is a reusable accommodation, transport or activity block with its own availability, so a hotel night can be used in a group series and in a tailor-made itinerary alike.", "Allotment and on-request components behave differently at booking time: allotment sells immediately, on-request needs a supplier confirmation."], "painPoints": ["Duplicated components per product make a single hotel rate change a multi-hour edit.", "Unclear allotment versus on-request status leads agents to confirm rooms that do not exist."], "dependencies": [{"type": "brick", "id": "comp", "name": "Components, Inventory and Availability", "description": "Reusable components with inventory and availability.", "how": "Turns contract lines into bookable components with allotment rules."}]}, {"id": "build-package-and-itinerary", "title": "Build the package and day-by-day itinerary", "actor": "Group Travel Operations Manager", "keyFacts": ["A package fixes the sequence of components per day and the inclusions and exclusions shown to the traveler.", "Package templates are cloned per season so that only dates, prices and changed hotels need editing."], "painPoints": ["Itineraries copied by hand into the website CMS drift from what operations actually runs.", "Inclusion texts written per product instead of per component are inconsistent across the catalogue."], "dependencies": [{"type": "brick", "id": "prod", "name": "Travel Products and Packages", "description": "Packages and their day-by-day structure.", "how": "Assembles components into a sellable package with itinerary and inclusions."}, {"type": "brick", "id": "ctnt", "name": "Travel Content and Media Management", "description": "Photos, texts and media per product and destination.", "how": "Attaches destination texts and MediaSpirit-style photo sets to the package."}]}, {"id": "generate-departures", "title": "Generate the departure series with capacity", "actor": "Group Travel Operations Manager", "keyFacts": ["A series generates fixed-date departures from a rhythm (for example every Saturday from April to October) with capacity per departure derived from coach size and hotel allotments.", "Each departure carries a minimum number of participants; under the Package Travel Directive the operator must cancel at least 20 days before departure for trips longer than six days if that minimum is not met."], "painPoints": ["Creating departures one by one invites date and capacity typos that surface only when a bus is overbooked.", "Minimum-participant deadlines tracked in a wall calendar are missed, exposing the operator to full refunds."], "dependencies": [{"type": "brick", "id": "dept", "name": "Departures and Capacity Management", "description": "Departures with capacity, minimums and deadlines.", "how": "Generates the departure series and stores capacity and go/no-go deadlines."}]}, {"id": "run-group-calculation", "title": "Run the group calculation and set tiered yield prices", "actor": "Group Travel Operations Manager", "keyFacts": ["The group calculation divides fixed costs (coach, guide, ferry) over the expected participant count and adds variable costs per person to reach a break-even and target-margin price.", "Yield tiers raise or lower the price by departure and by booking window, for example an early-bird price until a fixed date and a higher price when the bus is more than 80% full."], "painPoints": ["Calculations kept in personal spreadsheets cannot be reproduced when finance asks why a departure lost money.", "Manual price updates per departure lag behind demand, so full buses are sold at early-bird prices."], "dependencies": [{"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Pricing, yield rules and group calculations.", "how": "Computes break-even, target-margin and tiered prices per departure."}]}, {"id": "review-margin-and-approve", "title": "Review margin and approve the product for sale", "actor": "Travel Company Owner", "keyFacts": ["The owner sees expected margin per departure at the minimum, break-even and full-bus scenario before a single seat is sold.", "Approval locks the price list and cancellation deadlines that finance and the website will use."], "painPoints": ["Without a scenario view, owners approve products that only break even at a full bus.", "Late price corrections after publication create different prices for the same departure across channels."], "dependencies": [{"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Margin scenarios per departure.", "how": "Presents minimum, break-even and full-capacity margin for approval."}, {"type": "brick", "id": "prod", "name": "Travel Products and Packages", "description": "Product status and publication control.", "how": "Sets the product to sellable once approved."}]}, {"id": "publish-to-channels", "title": "Publish to website, desk and reseller channels", "actor": "Group Travel Operations Manager", "keyFacts": ["Publication pushes the same product, prices and real-time availability to the customer website, the booking desk and the reseller portal.", "Content, price and availability changes after publication propagate automatically instead of via a CMS edit."], "painPoints": ["A separately maintained website catalogue is the main reason customers see a price that the desk cannot honour.", "Unpublished changes to inclusions cause complaints when the trip differs from what was sold."], "dependencies": [{"type": "brick", "id": "webs", "name": "Customer Website, CMS and Online Booking", "description": "Customer website and online booking.", "how": "Renders the approved product with live prices and availability."}, {"type": "brick", "id": "prod", "name": "Travel Products and Packages", "description": "Product master as the single source for all channels.", "how": "Distributes one product definition to every channel."}]}]}, {"id": "maintain-components-and-content-for-tailor-made-selling", "title": "Maintain Components and Content for Tailor-Made Selling", "description": "Keep the component library, sample itineraries and media current so specialists can compose proposals from stored, correctly priced building blocks.", "primaryActor": "Tailor-Made Travel Specialist", "trigger": "A destination manager receives new season rates from lodges, transfers and excursions in a destination.", "successSignal": "Every component in the destination has valid rates, content and photos for the coming season and appears in the Visual Tour Builder.", "steps": [{"id": "update-destination-rates", "title": "Update destination component rates and validity", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Tailor-made specialists maintain hundreds of lodges, transfers and excursions per destination, each with seasonal rate bands and validity dates.", "Rates are held in supplier currency and converted at booking with a configurable margin on the exchange rate."], "painPoints": ["Rate sheets in PDF are re-typed per season, which is where wrong nights and wrong seasons creep in.", "Missing validity dates make expired rates appear in proposals for next year."], "dependencies": [{"type": "brick", "id": "comp", "name": "Components, Inventory and Availability", "description": "Component rates with seasonal validity.", "how": "Stores rate bands per season and currency."}, {"type": "brick", "id": "cont", "name": "Purchasing and Supplier Contracts", "description": "Supplier contract terms behind the rates.", "how": "Keeps the contractual basis for each rate band."}]}, {"id": "curate-content-and-media", "title": "Curate destination content and photos", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Each component carries description texts in the tenant's languages and a curated photo set that the Visual Tour Builder places into proposals automatically.", "Photo rights and supplier-provided imagery are tracked per asset so that proposals never use unlicensed images."], "painPoints": ["Specialists searching shared drives for photos spend more time on layout than on the itinerary.", "Outdated lodge photos are the leading cause of 'this is not what we booked' complaints."], "dependencies": [{"type": "brick", "id": "ctnt", "name": "Travel Content and Media Management", "description": "Content and media library per component.", "how": "Provides the texts and photos that proposals reuse."}]}, {"id": "build-sample-itineraries", "title": "Build sample itineraries as starting points", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["A sample itinerary is a stored sequence of components \u2014 for example a 14-day Tanzania safari \u2014 used as the first draft for most requests.", "Sample itineraries are also published to the website as inspiration and are directly requestable by the traveler."], "painPoints": ["Every proposal started from a blank page is slower and less consistent than one started from a template.", "Samples that are not re-priced each season mislead customers on the website."], "dependencies": [{"type": "brick", "id": "prod", "name": "Travel Products and Packages", "description": "Products that wrap sample itineraries for publication.", "how": "Publishes samples as requestable products."}]}, {"id": "set-margin-rules", "title": "Set margin and pricing rules per component type", "actor": "Travel Company Owner", "keyFacts": ["Margin targets differ per component type \u2014 accommodation, international flights and local transfers rarely carry the same markup.", "Rules can also apply per customer segment or reseller so that agent bookings automatically carry the agreed commission."], "painPoints": ["Margins applied by hand in each proposal vary per specialist and are hard to audit.", "A single wrong markup rule silently underprices a whole destination."], "dependencies": [{"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Margin and markup rules.", "how": "Applies configurable margins per component type and channel."}]}, {"id": "verify-supplier-terms", "title": "Verify supplier payment and cancellation terms", "actor": "Finance and Administration Lead", "keyFacts": ["Supplier cancellation terms determine the operator's own cancellation ladder toward the traveler under the Package Travel Directive.", "Prepayment requirements per supplier drive the cash-flow planning for the season."], "painPoints": ["Unknown supplier deadlines turn every customer cancellation into a negotiation.", "Prepayment obligations not visible to finance cause surprise outflows."], "dependencies": [{"type": "brick", "id": "cont", "name": "Purchasing and Supplier Contracts", "description": "Supplier terms and prepayment rules.", "how": "Records cancellation ladders and prepayment obligations."}, {"type": "brick", "id": "supl", "name": "Supplier Management and Communication", "description": "Supplier records and contacts.", "how": "Keeps the accountable supplier contact for each term."}]}, {"id": "release-to-builder", "title": "Release the destination library to the builder and website", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Released components become draggable blocks in the Visual Tour Builder and searchable on the SPoE website.", "Release checks flag components without price, photo or validity before they reach a proposal."], "painPoints": ["Incomplete components discovered during a customer call embarrass the specialist.", "Unreleased updates leave the website showing last year's itineraries."], "dependencies": [{"type": "brick", "id": "webs", "name": "Customer Website, CMS and Online Booking", "description": "Destination pages and inspiration itineraries.", "how": "Publishes released content on the website."}]}]}], "outcomes": ["One product master feeds every sales channel, d, compose and price the itinerary, publish it online and convert the approval into a trip file.", "primaryActor": "Tailor-Made Travel Specialist", "trigger": "A traveler submits a request form on the website or calls with a wish such as 'three weeks Namibia self-drive in October for a family of four'.", "successSignal": "The client approves the proposal online, pays the deposit and a trip file exists with all components and the target margin.", "steps": [{"id": "capture-and-qualify-lead", "title": "Capture and qualify the travel wish", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Website request forms, inbound email and phone calls land as leads on the contact record, with travel dates, party, budget and interests captured in structured fields.", "Inbound email and calls are matched to the contact automatically, so the specialist sees earlier trips and open proposals before answering."], "painPoints": ["Leads spread over personal mailboxes are followed up late or twice.", "Unstructured wishes force a second call before any drafting can start."], "dependencies": [{"type": "brick", "id": "crmr", "name": "CRM and Contact Management", "description": "Contact, lead and interaction history.", "how": "Creates the lead against the contact with structured wish data."}, {"type": "brick", "id": "comm", "name": "Email and Telephony Integration", "description": "Email and telephony linked to the contact.", "how": "Attaches the inbound email or call to the lead."}]}, {"id": "draft-with-ai-assistant", "title": "Draft a first outline with the AI assistant", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["The AI office assistant reads the wish and proposes a route outline and candidate sample itineraries from the tenant's own library, not from the open internet.", "The specialist keeps full control: the assistant suggests, the human composes and prices."], "painPoints": ["Blank-page drafting is the slowest part of the specialist's day.", "Generic AI text that ignores the operator's own stock of lodges creates proposals that cannot be delivered."], "dependencies": [{"type": "brick", "id": "aiaa", "name": "AI Office Assistants", "description": "AI assistance for proposal drafting.", "how": "Suggests routes and sample itineraries matching the wish."}, {"type": "brick", "id": "vtbl", "name": "Visual Tour Builder, Quotes and Itineraries", "description": "Sample itineraries as starting points.", "how": "Loads the chosen sample itinerary as the first draft."}]}, {"id": "compose-itinerary-visually", "title": "Compose the day-by-day itinerary by drag and drop", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Stored components \u2014 lodges, transfers, excursions, flights \u2014 are dragged onto a day-by-day canvas; texts and photos come along automatically.", "Availability and rate validity are checked per component as it is placed, so the draft is buildable from the start."], "painPoints": ["Word documents assembled from copied text and photos take hours and look different per specialist.", "Components dragged in without an availability check produce proposals that fall apart on confirmation."], "dependencies": [{"type": "brick", "id": "vtbl", "name": "Visual Tour Builder, Quotes and Itineraries", "description": "Drag-and-drop itinerary composition.", "how": "Places components on the day canvas with text and media."}, {"type": "brick", "id": "comp", "name": "Components, Inventory and Availability", "description": "Component availability and rates.", "how": "Validates each placed component against inventory and validity."}]}, {"id": "price-at-target-margin", "title": "Price the proposal at target margin", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["The calculation sums supplier costs in their currencies, applies margin rules per component type and shows the resulting margin against the target before the price is shown to the client.", "Optional items and alternative lodges can be priced as choices the client toggles online."], "painPoints": ["Margins computed by hand in a side spreadsheet differ from the eventual invoice.", "Specialists under sales pressure quietly give margin away without visibility for the owner."], "dependencies": [{"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Margin rules and currency handling.", "how": "Calculates cost, margin and sales price per line and in total."}, {"type": "brick", "id": "vtbl", "name": "Visual Tour Builder, Quotes and Itineraries", "description": "Priced proposal with options.", "how": "Shows the specialist the margin and the client the price."}]}, {"id": "publish-proposal-online", "title": "Publish the proposal for online review", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["The proposal is published as a personal web page with maps, photos, day texts and price, and a link is emailed to the client.", "Views and time-on-page are tracked so the specialist knows when to follow up."], "painPoints": ["PDF proposals cannot be updated after sending and are read on a phone with difficulty.", "Specialists follow up blind, without knowing whether the client opened the proposal."], "dependencies": [{"type": "brick", "id": "vtbl", "name": "Visual Tour Builder, Quotes and Itineraries", "description": "Online proposal pages.", "how": "Renders the itinerary as a personal web page and tracks views."}, {"type": "brick", "id": "mytp", "name": "Traveler Portal and My-Trip App", "description": "Traveler portal where proposals are reviewed.", "how": "Presents the proposal in the client's personal environment."}]}, {"id": "iterate-on-feedback", "title": "Iterate on client feedback", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Clients comment per day or component in the portal; the specialist swaps a lodge or adds a night and republishes as a new version.", "Version history keeps every proposal variant with its price so a client can return to an earlier option."], "painPoints": ["Changes exchanged by email get lost, and the final trip differs from what the client remembers.", "Re-pricing a change by hand takes longer than the change itself."], "dependencies": [{"type": "brick", "id": "vtbl", "name": "Visual Tour Builder, Quotes and Itineraries", "description": "Proposal versions and client comments.", "how": "Applies changes and republishes a versioned proposal."}, {"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Re-pricing on each change.", "how": "Recomputes price and margin for every version."}]}, {"id": "client-approves-and-pays-deposit", "title": "Client approves online and pays the deposit", "actor": "Traveler and Booker", "keyFacts": ["The client approves the proposal with one click, accepts the travel conditions and pays the deposit via a payment link in the same session.", "Acceptance timestamps and accepted conditions are stored as the contract record required under the Package Travel Directive."], "painPoints": ["Approval by email reply and a separate bank transfer delays the confirmation by days.", "Missing proof of accepted conditions weakens the operator's position in disputes."], "dependencies": [{"type": "brick", "id": "mytp", "name": "Traveler Portal and My-Trip App", "description": "Approval and payment in the traveler portal.", "how": "Records the approval and triggers the deposit payment."}]}, {"id": "convert-to-trip-file", "title": "Convert the accepted proposal into a trip file", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Conversion creates the booking file with every component as a booking line, the calculated margin and the supplier requests still to be sent.", "The proposal remains linked to the file so later changes are traceable to what was sold."], "painPoints": ["Re-keying accepted proposals into the booking system is where names, dates and prices get corrupted.", "Unlinked proposals make it impossible to compare sold margin with realised margin."], "d es and Capacity Management", "description": "Departure availability and status.", "how": "Provides seats left and guarantee status per date."}]}, {"id": "choose-seat-and-room", "title": "Choose a bus seat and room type", "actor": "Traveler and Booker", "keyFacts": ["The seat map of the assigned coach is shown at booking; travelers pick their seat and the seat is reserved immediately \u2014 a 1TIS hallmark for coach operators.", "Room types (double, single with supplement, triple) reduce hotel allotment per night as they are chosen."], "painPoints": ["Seat allocation done later by phone generates a wave of calls in the week before departure.", "Selling room types without allotment checks overbooks single rooms that hotels cannot supply."], "dependencies": [{"type": "brick", "id": "seat", "name": "Seat and Room Allocation", "description": "Seat map and room allocation.", "how": "Reserves the chosen seat and room at booking."}, {"type": "brick", "id": "comp", "name": "Components, Inventory and Availability", "description": "Hotel allotment per night.", "how": "Decrements the room allotment for the selected type."}]}, {"id": "enter-travelers-and-wishes", "title": "Enter traveler details, wishes and extras", "actor": "Traveler and Booker", "keyFacts": ["Passenger names as in the passport, dietary wishes and mobility needs are captured at booking so they flow to room lists and guides without a later call.", "Extras such as insurance, excursions or an eSIM are offered as priced options."], "painPoints": ["Dietary wishes collected later by email arrive too late for the hotel.", "Insurance and excursions sold separately by phone are margin left on the table."], "dependencies": [{"type": "brick", "id": "webs", "name": "Customer Website, CMS and Online Booking", "description": "Booking form with passengers and extras.", "how": "Captures passenger data, wishes and options."}]}, {"id": "accept-conditions-and-pay-deposit", "title": "Accept conditions and pay the deposit", "actor": "Traveler and Booker", "keyFacts": ["The traveler accepts the package travel conditions and the SGR guarantee is shown before payment, as required for package sales in the Netherlands.", "Deposit is paid in the same session via iDEAL or card through a hosted payment link."], "painPoints": ["Bookings that wait for a bank transfer are abandoned or double-booked in the meantime.", "Missing evidence of accepted conditions costs the operator disputes."], "dependencies": [{"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Deposit invoice and payment registration.", "how": "Creates the deposit request and records the payment."}]}, {"id": "create-booking-file", "title": "Create the booking file and confirm", "actor": "Reservations and Sales Agent", "keyFacts": ["The booking file is created in the back office in real time with status confirmed, the seat, room, passengers, price tier and payment already attached.", "A contact record is created or matched, so the traveler's history starts here."], "painPoints": ["Website bookings that arrive as email to be re-keyed are the number-one source of desk errors.", "Duplicate contacts created per booking make marketing and history useless."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Booking file with all lines.", "how": "Stores the confirmed booking as the system of record."}, {"type": "brick", "id": "crmr", "name": "CRM and Contact Management", "description": "Contact matching and creation.", "how": "Links the booking to a single contact record."}]}, {"id": "send-confirmation-and-portal-access", "title": "Send confirmation and my-trip access", "actor": "Reservations and Sales Agent", "keyFacts": ["The confirmation email contains the invoice, the balance due date and a link to the traveler portal where documents will appear.", "Workflow rules schedule the balance reminder and passenger-data completion tasks automatically."], "painPoints": ["Confirmations typed by hand are inconsistent and miss legal information.", "Follow-up tasks left to memory are the reason balances go unpaid."], "dependencies": [{"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Automatic follow-up tasks.", "how": "Schedules reminders and data-completion tasks."}, {"type": "brick", "id": "comm", "name": "Email and Telephony Integration", "description": "Confirmation email.", "how": "Sends and logs the confirmation."}]}, {"id": "monitor-capacity-effect", "title": "Monitor the capacity and yield effect", "actor": "Group Travel Operations Manager", "keyFacts": ["Each booking updates the departure's load factor and may trigger the next price tier or the minimum-participant threshold.", "Operations sees departures approaching full, so a second coach or hotel allotment increase can be arranged in time."], "painPoints": ["Capacity checked once a week misses the moment to add a coach.", "Price tiers switched by hand lag behind demand."], "dependencies": [{"type": "brick", "id": "dept", "name": "Departures and Capacity Management", "description": "Load factor and thresholds per departure.", "how": "Updates capacity and flags thresholds crossed."}, {"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Automatic tier switching.", "how": "Applies the next price tier when the rule fires."}]}]}, {"id": "agent-books-at-the-desk-from-a-phone-inquiry", "title": "Agent Books at the Desk from a Phone Inquiry", "description": "A reservations agent turns a phone or email inquiry into an option or confirmed booking in one contact, including flights imported from the GDS and a payment link sent during the call.", "primaryActor": "Reservations and Sales Agent", "trigger": "A customer calls about a group trip seen in the brochure and wants to book for two with a specific seat and a flight from Amsterdam.", "successSignal": "The booking is confirmed in the same c  Agent", "keyFacts": ["Options hold capacity and seat for a configurable period and expire automatically, releasing the seat.", "A confirmed booking creates the file with passengers, wishes and extras captured during the call."], "painPoints": ["Options never released block seats that could have been sold.", "Bookings written on paper and entered later lose the seat to a web booking in between."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Options and bookings.", "how": "Creates the file with option expiry or confirmed status."}, {"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Option expiry handling.", "how": "Expires options and releases capacity automatically."}]}, {"id": "import-flights", "title": "Import flights from the GDS or Airtrade", "actor": "Reservations and Sales Agent", "keyFacts": ["Flight segments booked in the GDS or through the Airtrade consolidator are imported by PNR into the booking file with fare, taxes and ticketing deadline.", "The ticketing deadline becomes a task so the ticket is issued before the fare expires."], "painPoints": ["Flight details typed from a GDS screen produce wrong times on travel documents.", "Missed ticketing deadlines cost the fare and the customer's trust."], "dependencies": [{"type": "brick", "id": "flgt", "name": "Flight Import and Ticket Settlement", "description": "PNR import and ticketing deadlines.", "how": "Imports flight lines and deadlines into the file."}]}, {"id": "send-payment-link-during-call", "title": "Send the payment link during the call", "actor": "Reservations and Sales Agent", "keyFacts": ["A deposit payment link is sent by email or SMS while the customer is on the line, and the payment status appears in the file within seconds.", "Paid deposit flips the booking from option to confirmed without agent action."], "painPoints": ["Waiting for a transfer means calling back days later to confirm.", "Manual payment matching delays confirmation even when the customer paid immediately."], "dependencies": [{"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Payment link and status.", "how": "Issues the link and registers the payment."}]}, {"id": "confirm-and-log-contact", "title": "Confirm and log the contact", "actor": "Reservations and Sales Agent", "keyFacts": ["Confirmation, invoice and portal invitation go out automatically; the call and its outcome are logged on the contact.", "Any follow-up (passport data, seat change request) becomes a task with an owner and due date."], "painPoints": ["Unlogged calls mean the next agent cannot answer 'what did we agree'.", "Follow-ups in sticky notes are lost."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Confirmed booking file.", "how": "Holds the confirmed booking and its history."}, {"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Follow-up tasks.", "how": "Creates tasks for open items."}]}, {"id": "handle-change-request", "title": "Handle a change request without re-keying", "actor": "Reservations and Sales Agent", "keyFacts": ["Changes to dates, passengers, seat or room are made on the file; price differences, change fees and a corrected invoice are calculated automatically.", "Every change is versioned and propagates to seat lists, room lists and supplier requests."], "painPoints": ["Changes handled by email outside the file are the reason room lists are wrong.", "Manual recalculation of change fees is inconsistent between agents."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Booking changes with versioning.", "how": "Applies and versions the change."}, {"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Corrected invoice.", "how": "Reissues the invoice with the difference."}]}]}], "outcomes": ["Higher online booking share, because the website sells real-time availability and prices from the back office instead of a request form", "Bookings confirmed in one contact at the desk, with capacity, seats, price and deposit handled in the same screen", "Zero re-keying between website, desk and booking file, so options, changes and payments carry the same data"], "brickDependencies": [{"targetBrickId": "webs", "type": "composition"}, {"targetBrickId": "book", "type": "composition"}, {"targetBrickId": "crmr", "type": "composition"}, {"targetBrickId": "comp", "type": "composition"}, {"targetBrickId": "dept", "type": "composition"}, {"targetBrickId": "seat", "type": "composition"}, {"targetBrickId": "pric", "type": "composition"}, {"targetBrickId": "invc", "type": "composition"}, {"targetBrickId": "flgt", "type": "composition"}, {"targetBrickId": "comm", "type": "composition"}, {"targetBrickId": "wflw", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "Mollie Payment Platform", "type": "payment-service-provider", "interface": "Payment links, iDEAL, cards and webhooks", "description": "Hosted payment links and status webhooks for deposits, balances and refunds."}, {"system": "WeCloudIT Email and Telephony", "type": "communication-platform", "interface": "Mailbox sync and click-to-dial / caller identification", "description": "Links inbound email and calls to the contact and booking file that the agent is working on."}, {"system": "GDS and Airtrade Flight Content", "type": "flight-distribution", "interface": "PNR import and ticket data files", "description": "Flight bookings and tickets issued via a GDS or the Airtrade consolidator, imported into the booking file."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []}]}, {"name": "Operations and Supply Journeys", "description": "The journeys that turn confirmed bookings into delivered trips: group departure operations with seats, rooms, guides and lists, and the request-confirm-change loop with suppliers and DMCs.", "subGroups": [], "streams": [{"id": "operate-group-departures", "name": "Operate Group Departures", "icon": "operate-group-departures.png", "type": "outcome-based-stream", "description": "Take a group tour operator from a set of confirmed bookings to an executed departure: decide go/no-go against minimum participants and the Package Travel Directive deadlines, allocate bus seats and hotel rooms, send room lists with dietary wishes to hotels and seating lists to the coach company, assign the guide or group leader and give them the participant list in their portal, and keep all lists correct as late bookings and changes arrive.", "group": "Operations and Supply Journeys", "rootGroup": "Operations and Supply Journeys", "flows": [{"id": "from-capacity-decision-to-departure-day", "title": "From Capacity Decision to Departure Day", "description": "The end-to-end operations flow for a fixed-date group departure, from the go/no-go decision through lists and portals to the day the coach leaves.", "primaryActor": "Group Travel Operations Manager", "trigger": "The minimum-participant deadline for a departure approaches and the departure dashboard flags it for decision.", "successSignal": "The coach leaves with a seating list, every hotel has a correct room list, and the guide has the participant list and documents in the portal.", "steps": [{"id": "decide-go-no-go", "title": "Decide go/no-go against minimum participants", "actor": "Group Travel Operations Manager", "keyFacts": ["The departure dashboard shows bookings versus the minimum, the legal cancellation deadline (20 days before departure for trips over six days, 7 days for two-to-six-day trips, 48 hours for shorter trips) and the margin at the current load.", "Operators often guarantee a departure below minimum when margin allows, or merge two departures to fill one coach."], "painPoints": ["Deadlines tracked outside the system lead to late cancellations and full refund obligations under the Package Travel Directive.", "Cancelling a departure that would have filled with the last two weeks of bookings loses revenue and reputation."], "dependencies": [{"type": "brick", "id": "dept", "name": "Departures and Capacity Management", "description": "Departure status, minimums and deadlines.", "how": "Presents the decision data and records the go/no-go."}, {"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Deadline alerts.", "how": "Raises the decision task before the legal deadline."}]}, {"id": "rebook-or-merge-if-cancelled", "title": "Rebook or merge participants if a departure is cancelled", "actor": "Reservations and Sales Agent", "keyFacts": ["Participants of a cancelled departure are offered an alternative date or a full refund; rebooking moves the file including seat and room wishes.", "Merging two departures re-runs seat and room allocation for the combined group."], "painPoints": ["Rebooking by phone without moving the file duplicates bookings.", "Refunds processed late breach the 14-day refund rule of the Package Travel Directive."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Rebooking and cancellation on the file.", "how": "Moves or cancels files with full history."}, {"type": "brick", "id": "dept", "name": "Departures and Capacity Management", "description": "Merged departures.", "how": "Combines capacity and bookings of merged departures."}]}, {"id": "allocate-seats-and-rooms", "title": "Allocate bus seats and hotel rooms", "actor": "Group Travel Operations Manager", "keyFacts": ["Seats reserved at booking are checked against the final coach; travelers who did not choose are placed by rule (couples together, mobility needs in front).", "Room allocation groups passengers per booking into the room types sold and flags mismatches against the hotel allotment."], "painPoints": ["Seat drawings on paper are redone for every late change.", "Room lists that do not match the sold room types cause check-in chaos."], "dependencies": [{"type": "brick", "id": "seat", "name": "Seat and Room Allocation", "description": "Seat and room allocation.", "how": "Finalises seats and rooms per departure."}, {"type": "brick", "id": "pass", "name": "Passenger Data and Operational Lists", "description": "Passenger data behind the allocation.", "how": "Provides names, companions and needs per passenger."}]}, {"id": "send-room-lists-to-hotels", "title": "Send room lists with dietary wishes to hotels", "actor": "Group Travel Operations Manager", "keyFacts": ["Each hotel receives a room list for its nights with names, room types, arrival and departure and dietary or accessibility wishes, generated from the booking files.", "Hotels with portal access download the current list themselves and confirm it; others receive it by email from the supplier record."], "painPoints": ["Room lists assembled in Excel per hotel are the most error-prone document in group travel.", "Dietary wishes lost between booking and hotel are the most common complaint on tour."], "dependencies": [{"type": "brick", "id": "pass", "name": "Passenger Data and Operational Lists", "description": "Operational lists per hotel.", "how": "Generates room lists with wishes per hotel and night."}, {"type": "brick", "id": "sprt", "name": "Supplier and DMC Portal", "description": "Supplier portal with room lists.", "how": "Publishes the list for the hotel to view and confirm."}]}, {"id": "send-seating-list-to-coach", "title": "Send the seating list and driver instructions to the coach company", "actor": "Group Travel Operations Manager", "keyFacts": ["The coach company receives the seating list, the route with pickup points and the driver's contact list.", "Pickup points and times per passenger are derived from the booking, so the driver list is right by construction."], "painPoints": ["Drivers working from an outdated list leave passengers at the wrong pickup.", "Coach companies re-typing passenger lists into their own system introduce errors."], "dependencies": [{"type": "brick", "id": "seat", "name": "Seat and Room Allocation", "description": "Seating list per coach.", "how": "Produces the final seating list."}, {"type": "brick", "id": "docs", "name": "Travel Documents and Itinerary Delivery", "description": "Driver and pickup documents.", "how": "Generates the driver instructions and pickup schedule."}]}, {"id": "assign-guide-and-share-participant-list", "title": "Assign the guide and share the participant list in the portal", "actor": "Group Travel Operations Manager", "keyFacts": ["The tour guide or group leader is assigned to the departure and sees the participant list, wishes, hotel details and documents in the guide portal on their phone.", "Emergency contacts and medical notes are visible to the guide only, in line with data-minimisation rules."], "painPoints": ["Guides working from printed lists cannot see changes made after printing.", "Sharing full passenger data by email violates privacy expectations."], "dependencies": [{"type": "brick", "id": "guid", "name": "Guide and Group Leader Portal", "description": "Guide portal with participant list.", "how": "Gives the guide the live list and documents."}, {"type": "brick", "id": "pass", "name": "Passenger Data and Operational Lists", "description": "Participant data for guides.", "how": "Provides the guide view of passenger data."}]}, {"id": "issue-travel-documents", "title": "Issue travel documents to participants", "actor": "Reservations and Sales Agent", "keyFacts": ["Travel documents (itinerary, vouchers, hotel list, pickup time) are generated per booking and published in the traveler portal a fixed number of days before departure.", "Documents are regenerated automatically when the seat, pickup or hotel changes."], "painPoints": ["Documents mailed by hand are late and inconsistent.", "Static PDFs do not reflect last-minute changes."], "dependencies": [{"type": "brick", "id": "docs", "name": "Travel Documents and Itinerary Delivery", "description": "Travel documents per booking.", "how": "Generates and publishes the documents."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Booking file as the document source.", "how": "Provides the confirmed data for documents."}]}, {"id": "run-departure-day", "title": "Run departure day and handle no-shows", "actor": "Group Travel Operations Manager", "keyFacts": ["On departure day the guide checks in participants in the portal; no-shows update the lists and hotels in real time.", "The departure is closed operationally, releasing unused allotments and feeding actual participant counts to finance."], "painPoints": ["No-shows reported by phone to the office are not passed to the hotels.", "Actual participant counts unknown to finance delay supplier settlement."], "dependencies": [{"type": "brick", "id": "guid", "name": "Guide and Group Leader Portal", "description": "Check-in in the guide portal.", "how": "Records participants present and no-shows."}, {"type": "brick", "id": "dept", "name": "Departures and Capacity Management", "description": "Departure close-out.", "how": "Closes the departure with actual counts."}]}]}, {"id": "handle-a-late-change-to-a-running-departure", "title": "Handle a Late Change to a Running Departure", "description": "A late booking, cancellation or hotel change hits a departure that already has lists out; every dependent list, portal and supplier is updated from the single change.", "primaryActor": "Group Travel Operations Manager", "trigger": "Two days before departure a couple cancels and a new booking of three arrives for the same coach tour.", "successSignal": "Seat, room, guide and hotel lists are all updated from the two file changes without any manual list editing.", "steps": [{"id": "register-the-change", "title": "Register the change on the booking file", "actor": "Reservations and Sales Agent", "keyFacts": ["Cancellations and late bookings are handled on the file; cancellation fees follow the ladder in the conditions.", "The change is flagged as 'lists already sent' so operations knows what must be re-communicated."], "painPoints": ["Changes noted on paper never reach the lists.", "Cancellation fees calculated ad hoc cause disputes."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Change on the file with fee calculation.", "how": "Records the change and its financial effect."}, {"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Change alerts to operations.", "how": "Notifies operations that sent lists are affected."}]}, {"id": "recompute-seats-and-rooms", "title": "Recompute seats and rooms", "actor": "Group Travel Operations Manager", "keyFacts": ["Freed seats and rooms are reallocated; the new party of three gets seats together and a triple room if sold.", "The system shows only the deltas so the operator can sanity-check them in a minute."], "painPoints": ["Re-doing the whole seating plan for one change is where errors enter.", "Triple rooms not available at every hotel go unnoticed until check-in."], "dependencies": [{"type": "brick", "id": "seat", "name": "Seat and Room Allocation", "description": "Delta re-allocation.", "how": "Updates seats and rooms for changed files."}, {"type": "brick", "id": "dept", "name": "Departures and Capacity Management", "description": "Capacity after the change.", "how": "Reflects new load factor and margin."}]}, {"id": "propagate-to-hotels-and-coach", "title": "Propagate the change to hotels and the coach company", "actor": "Group Travel Operations Manager", "keyFacts": ["Hotels and the coach company receive an updated list or a change notice highlighting the delta, one to one from the change on the file.", "Portal suppliers see the updated list immediately; email suppliers get a versioned document."], "painPoints": ["Sending a full new list without highlighting the delta makes hotels miss the change.", "Unsent changes are the root of most wrong room assignments."], "dependencies": [{"type": "brick", "id": "sprt", "name": "Supplier and DMC Portal", "description": "Updated lists in the supplier portal.", "how": "Publishes the changed list with delta."}, {"type": "brick", "id": "supl", "name": "Supplier Management and Communication", "description": "Change notices by email.", "how": "Sends versioned change notices and logs them."}]}, {"id": "update-guide-and-documents", "title": "Update the guide's list and regenerate documents", "actor": "Group Travel Operations Manager", "keyFacts": ["The guide portal reflects the change immediately; affected travelers receive regenerated documents in their portal.", "The changed party is notified which documents changed."], "painPoints": ["Guides find out about changes from the passengers.", "Old documents in travelers' inboxes contradict new ones."], "dependencies": [{"type": "brick", "id": "guid", "name": "Guide and Group Leader Portal", "description": "Live participant list.", "how": "Shows the updated list to the guide."}, {"type": "brick", "id": "docs", "name": "Travel Documents and Itinerary Delivery", "description": "Regenerated documents.", "how": "Reissues documents for affected bookings."}]}, {"id": "settle-financial-effect", "title": "Settle the financial effect of the change", "actor": "Finance and Administration Lead", "keyFacts": ["Cancellation fees, refunds and new invoices are created from the change; the supplier cost side is adjusted for finance.", "Refunds due under the conditions are paid within the statutory period."], "painPoints": ["Refunds forgotten after a cancellation create complaints and regulatory exposure.", "Supplier cost not adjusted overstates margin."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Financial lines after the change.", "how": "Provides fees and refunds to invoicing."}]}]}], "outcomes": ["Fewer operational hours per departure, because seat, room, guide and passenger lists are generated from the booking files instead of rebuilt by hand", "Higher departure load factor and fewer cancelled departures, thanks to timely go/no-go decisions and yield actions", "Accurate room lists and dietary information at every hotel, with changes propagated the moment a booking changes"], "brickDependencies": [{"targetBrickId": "dept", "type": "composition"}, {"targetBrickId": "seat", "type": "composition"}, {"targetBrickId": "guid", "type": "composition"}, {"targetBrickId": "pass", "type": "composition"}, {"targetBrickId": "book", "type": "composition"}, {"targetBrickId": "sprt", "type": "composition"}, {"targetBrickId": "supl", "type": "composition"}, {"targetBrickId": "docs", "type": "composition"}, {"targetBrickId": "wflw", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "Coach Operator Planning", "type": "supplier-system", "interface": "Seating plan and driver list exchange", "description": "The bus company that receives the seating list and driver instructions for a departure."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []}, {"id": "request-and-confirm-supplier-services", "name": "Request and Confirm Supplier Services", "icon": "request-and-confirm-supplier-services.png", "type": "outcome-based-stream", "description": "Take booking lines \u2014 an on-request lodge, a DMC ground package, a private transfer, a group's hotel block \u2014 to confirmed supplier services with every request, confirmation, rejection and change logged against the file. Suppliers and DMCs work in a portal or by structured email; changes on the operator side propagate one to one to the supplier, and supplier responses update the file without re-keying.", "group": "Operations and Supply Journeys", "rootGroup": "Operations and Supply Journeys", "flows": [{"id": "request-confirm-and-sync-services-with-a-dmc", "title": "Request, Confirm and Sync Services with a DMC", "description": "A tour operator sends the ground services of a group departure to its destination management company, the DMC confirms in the portal, and later changes flow both ways.", "primaryActor": "DMC Ground Operations Manager", "trigger": "A group departure is guaranteed and the operator releases the ground-services request to the DMC.", "successSignal": "All ground services are confirmed by the DMC, the file shows confirmed status per line, and later changes are acknowledged in the portal.", "steps": [{"id": "generate-service-requests", "title": "Generate service requests from the booking lines", "actor": "Group Travel Operations Manager", "keyFacts": ["Every on-request or DMC line on the file becomes a structured service request: service, dates, pax, room types, special wishes and the contracted rate.", "Requests are bundled per supplier and per departure so the DMC receives one request set, not twenty emails."], "painPoints": ["Requests written by hand omit the detail the supplier needs and trigger a round of questions.", "Requests sent per booking overwhelm DMCs with fragments they must consolidate."], "dependencies": [{"type": "brick", "id": "supl", "name": "Supplier Management and Communication", "description": "Request generation and bundling.", "how": "Creates structured requests per supplier."}, {"type": "brick", "id": "cont", "name": "Purchasing and Supplier Contracts", "description": "Contracted rates and terms.", "how": "Attaches the agreed rate to each request."}]}, {"id": "deliver-request-to-supplier", "title": "Deliver the request via portal, email or API", "actor": "Group Travel Operations Manager", "keyFacts": ["Portal suppliers get a notification and see the request in their work list; email suppliers receive a structured message; API-connected suppliers receive it machine to machine.", "Delivery and read status are tracked so the operator knows what is pending."], "painPoints": ["Unread requests discovered a week later derail the timeline.", "Suppliers without a portal still need a clear, complete request."], "dependencies": [{"type": "brick", "id": "sprt", "name": "Supplier and DMC Portal", "description": "Supplier portal work list.", "how": "Shows the request to the DMC and tracks its status."}, {"type": "brick", "id": "intg", "name": "Integration Hub and Partner APIs", "description": "Supplier API delivery.", "how": "Delivers requests to API-connected suppliers."}]}, {"id": "dmc-reviews-and-confirms", "title": "The DMC reviews and confirms or rejects each service", "actor": "DMC Ground Operations Manager", "keyFacts": ["The DMC confirms each line, adds a supplier reference and can propose an alternative (different lodge, changed time) instead of rejecting.", "Confirmation captures the DMC's own cancellation terms per service."], "painPoints": ["Confirmations by free-text email have to be interpreted and typed into the file.", "Alternatives offered by phone are lost and re-requested."], "dependencies": [{"type": "brick", "id": "sprt", "name": "Supplier and DMC Portal", "description": "Line-level confirmation in the portal.", "how": "Records confirm, reject or alternative per line with references."}]}, {"id": "update-file-and-notify", "title": "Update the file and notify the operator", "actor": "Group Travel Operations Manager", "keyFacts": ["Confirmed lines flip to confirmed on the file with the supplier reference; rejections and alternatives create a task for the operator.", "Travel documents can only be issued when all lines are confirmed, which the workflow enforces."], "painPoints": ["Files that show 'requested' forever hide the risk of unconfirmed services.", "Documents issued with unconfirmed services lead to travelers standing at closed doors."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Line status and supplier references.", "how": "Updates line status from supplier responses."}, {"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Tasks for rejections and document gating.", "how": "Creates tasks and blocks documents until all lines are confirmed."}]}, {"id": "share-passenger-and-room-data", "title": "Share passenger and room data with the DMC", "actor": "Group Travel Operations Manager", "keyFacts": ["Closer to departure the DMC receives the passenger list, room list and wishes for the confirmed services, generated from the same file data.", "Only data needed for the service is shared, per supplier."], "painPoints": ["Room lists sent to DMCs by spreadsheet diverge from the hotel lists sent by the operator.", "Oversharing passenger data with every supplier is a privacy exposure."], "dependencies": [{"type": "brick", "id": "pass", "name": "Passenger Data and Operational Lists", "description": "Passenger and room data per supplier.", "how": "Generates supplier-specific passenger lists."}, {"type": "brick", "id": "sprt", "name": "Supplier and DMC Portal", "description": "Passenger lists in the portal.", "how": "Publishes the lists to the DMC."}]}, {"id": "propagate-changes-one-to-one", "title": "Propagate operator changes one to one to the DMC", "actor": "Group Travel Operations Manager", "keyFacts": ["A change on the file (extra passenger, changed room type, cancelled excursion) creates a versioned change request for the affected line only.", "The DMC acknowledges the change in the portal; unacknowledged changes are escalated by workflow."], "painPoints": ["Changes communicated in an email thread are the leading cause of DMC service errors.", "Without acknowledgement, the operator assumes the DMC knows."], "dependencies": [{"type": "brick", "id": "supl", "name": "Supplier Management and Communication", "description": "Versioned change requests.", "how": "Creates change deltas per affected line."}, {"type": "brick", "id": "sprt", "name": "Supplier and DMC Portal", "description": "Change acknowledgement.", "how": "Lets the DMC acknowledge or dispute the change."}]}, {"id": "dmc-reports-delivery-and-invoices", "title": "The DMC reports delivery and invoices the operator", "actor": "DMC Ground Operations Manager", "keyFacts": ["After the service the DMC marks delivery, reports no-shows and uploads its invoice against the confirmed lines.", "Invoice lines matched to confirmed service lines make the operator's supplier settlement a check, not a reconstruction."], "painPoints": ["Invoices that do not reference the request cannot be matched.", "No-shows unreported by the DMC are invoiced anyway."], "dependencies": [{"type": "brick", "id": "sprt", "name": "Supplier and DMC Portal", "description": "Delivery status and invoice upload.", "how": "Captures delivery and the supplier invoice."}]}]}, {"id": "confirm-ad-hoc-components-for-a-tailor-made-trip", "title": "Confirm Ad-Hoc Components for a Tailor-Made Trip", "description": "A specialist confirms every on-request lodge, transfer and activity of an accepted tailor-made proposal before travel documents are released.", "primaryActor": "Tailor-Made Travel Specialist", "trigger": "A client approved a proposal with twelve on-request components across three countries.", "successSignal": "All twelve components are confirmed with supplier references, or replaced by confirmed alternatives, before the document deadline.", "steps": [{"id": "list-unconfirmed-lines", "title": "List the unconfirmed lines and their deadlines", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["The file shows each on-request line with the supplier, the days since request and the deadline by which it must be confirmed for the trip to hold.", "Lines from bed-bank or API suppliers may already be instantly confirmed."], "painPoints": ["Specialists tracking confirmations in a notebook lose lines.", "Instant-confirm suppliers mixed with slow ones hide where the risk is."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Unconfirmed lines per file.", "how": "Lists lines by status and deadline."}, {"type": "brick", "id": "comp", "name": "Components, Inventory and Availability", "description": "Instant versus on-request components.", "how": "Distinguishes instantly confirmed components."}]}, {"id": "send-requests-to-suppliers", "title": "Send requests to all suppliers in one action", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["All open lines are requested in one action, each supplier receiving its own structured request by portal, email or API.", "Request texts are templated per supplier language."], "painPoints": ["Writing twelve emails by hand takes an afternoon.", "Requests in the wrong language get slower answers."], "dependencies": [{"type": "brick", "id": "supl", "name": "Supplier Management and Communication", "description": "Batch request per supplier.", "how": "Generates and sends requests for all open lines."}, {"type": "brick", "id": "comm", "name": "Email and Telephony Integration", "description": "Templated supplier emails.", "how": "Sends language-specific request emails."}]}, {"id": "chase-with-workflow", "title": "Chase overdue confirmations automatically", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Workflow sends reminders to suppliers and raises a task for the specialist when a line passes its expected confirmation time.", "The AI assistant drafts follow-up messages and flags supplier replies that need a decision."], "painPoints": ["Chasing by memory means the slowest supplier is discovered last.", "Inbox triage of supplier replies eats the specialist's morning."], "dependencies": [{"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Reminders and overdue tasks.", "how": "Automates chasing and escalation."}]}, {"id": "process-supplier-replies", "title": "Process supplier replies and alternatives", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Replies from portal and API update lines automatically; email replies are attached to the line and confirmed with one click.", "Alternatives are re-priced and, if the price changes, the client is informed via the portal."], "painPoints": ["Manual reading of confirmations misses changed dates or prices in the reply.", "Price changes not passed to the client surface at final invoice."], "dependencies": [{"type": "brick", "id": "sprt", "name": "Supplier and DMC Portal", "description": "Portal and API confirmations.", "how": "Records supplier responses per line."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Line confirmation and re-pricing.", "how": "Updates status and price on the line."}]}, {"id": "verify-all-confirmed", "title": "Verify all lines confirmed and release documents", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Documents are gated on full confirmation; the file shows a single 'ready' status when every line has a supplier reference.", "Supplier references are printed on vouchers so the traveler can prove the booking on site."], "painPoints": ["Documents released with a missing confirmation are the worst-case failure for a tailor-made operator.", "Vouchers without supplier references are refused at reception."], "dependencies": [{"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Document release gate.", "how": "Allows document generation only when all lines are confirmed."}]}, {"id": "log-history-on-file", "title": "Keep the full communication history on the file", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Every request, reply, change and confirmation is stored on the booking line, visible to any colleague covering the file.", "History is the evidence base for disputes with suppliers and clients."], "painPoints": ["Communication in personal mailboxes disappears with the employee.", "Disputes without history are settled at the operator's cost."], "dependencies": [{"type": "brick", "id": "supl", "name": "Supplier Management an ent link included.", "Reminder tone and timing are configurable per tenant and customer type."], "painPoints": ["Reminders sent by hand are late or forgotten in the high season.", "One-size reminders annoy good customers and do not move late ones."], "dependencies": [{"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Scheduled balance and reminder tasks.", "how": "Triggers reminders relative to departure."}, {"type": "brick", "id": "comm", "name": "Email and Telephony Integration", "description": "Reminder emails.", "how": "Sends and logs reminders."}]}, {"id": "alert-on-overdue", "title": "Alert the desk on overdue balances", "actor": "Finance and Administration Lead", "keyFacts": ["Overdue balances raise an alert on the file and a task for the responsible agent, with escalation to finance after a configurable period.", "Departures with unpaid files are visible to operations, since unpaid travelers should not receive documents."], "painPoints": ["Overdue lists exported weekly are outdated by the time someone calls.", "Documents issued to unpaid travelers remove the last leverage."], "dependencies": [{"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Overdue alerts and escalation.", "how": "Creates alerts and escalations for overdue files."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Payment status on the file.", "how": "Shows paid, open and overdue per file."}]}, {"id": "confirm-paid-and-release", "title": "Confirm paid status and release documents", "actor": "Reservations and Sales Agent", "keyFacts": ["Full payment flips the file to paid and releases document generation and the traveler's portal downloads.", "The contact record shows payment behaviour for future credit decisions."], "painPoints": ["Paid status checked by hand before every document run costs hours.", "Repeat late payers unrecognised get the same terms again."], "dependencies": [{"type" ts amounts, currency and references so matching can start immediately."], "painPoints": ["Invoices in a shared mailbox are matched by memory and often twice.", "Invoices without references need a call to the supplier."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Supplier invoice capture.", "how": "Registers invoices and links them to lines."}]}, {"id": "three-way-match", "title": "Match invoice, confirmation and delivery", "actor": "Finance and Administration Lead", "keyFacts": ["Each invoice line is matched to the confirmed rate, the delivered service and the actual passenger count reported by the guide or DMC.", "Deviations above a tolerance go to a dispute queue with the supplier communication attached."], "painPoints": ["Paying every invoice as received leaks margin through no-shows and rate errors.", "Disputes without the original request take weeks."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Three-way matching and disputes.", "how": "Matches invoices and routes deviations."}, {"type": "brick", "id": "supl", "name": "Supplier Management and Communication", "description": "Communication history for disputes.", "how": "Supplies the request and confirmation trail."}]}, {"id": "apply-prepayments-and-currencies", "title": "Apply prepayments and currency differences", "actor": "Finance and Administration Lead", "keyFacts": ["Prepayments made to lodges and DMCs are applied to the matching invoice; exchange differences are posted per file.", "Multi-currency purchase costs update the realised margin of each file."], "painPoints": ["Prepayments forgotten at invoice time are paid twice.", "Currency differences booked only at year end distort file margins."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Prepayment application and FX.", licate entries."], "painPoints": ["Manual journal exports create duplicate or missing entries.", "Accounting without departure-level cost centres cannot explain margin."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Accounting posting.", "how": "Generates and sends journal entries."}, {"type": "brick", "id": "intg", "name": "Integration Hub and Partner APIs", "description": "Accounting connector.", "how": "Transports entries to the accounting system."}]}, {"id": "review-file-margins", "title": "Review realised versus sold margin per file", "actor": "Travel Company Owner", "keyFacts": ["With purchase invoices matched, the realised margin per file and per departure is compared with the margin at sale.", "Outliers point to pricing, supplier or operational issues."], "painPoints": ["Margin known only at year end cannot steer the next season.", "Sold margin without realised margin flatters performance."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Margin reporting per file and departure.", "how": "Reports sold versus realised margin."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Sold and realised margin on the file.", "how": "Provides both margin figures."}]}]}, {"id": "close-the-month-and-report-to-the-guarantee-fund", "title": "Close the Month and Report to the Guarantee Fund", "description": "The month-end and compliance flow: reconcile, recognise revenue on departure, report to SGR and keep package-travel evidence ready.", "primaryActor": "Finance and Administration Lead", "trigger": "The month ends and the finance lead starts the close.", "successSignal": "The books are closed, revenue is recognised per departed trip, the SGR report is submitted from system data and the compliance evidence is complete.", "steps": [{"id": "reconcile-subledgers", "title": "Reconcile receivables, payables and payment provider", "actor": "Finance and Administration Lead", "keyFacts": ["Debtors, creditors and the payment-provider settlement account are reconciled between the ERP and accounting.", "Mollie payouts are matched to the individual payments they contain."], "painPoints": ["Payment-provider settlements booked as lump sums cannot be reconciled to invoices.", "Differences between ERP and ledger found at year end take weeks to explain."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Subledger reconciliation.", "how": "Reconciles ERP balances to accounting."}, {"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Payment provider settlement detail.", "how": "Breaks payouts into individual payments."}]}, {"id": "recognise-revenue-on-departure", "title": "Recognise revenue and cost on departure", "actor": "Finance and Administration Lead", "keyFacts": ["Revenue and cost are recognised when the trip departs; prepaid bookings stay on the balance sheet until then.", "The departure close-out from operations is the trigger for recognition."], "painPoints": ["Recognising revenue at invoice overstates results in the booking season.", "Departure dates maintained separately in accounting drift from operations."], "dependencies": [{"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Revenue recognition on departure.", "how": "Posts recognition entries on departure."}]}, {"id": "report-to-sgr", "title": "Report covered bookings and turnover to SGR", "actor": "Finance and Administration Lead", "keyFacts": ["SGR participants report covered turnover and bookings periodically and remit the per-booking consumer contribution collected on the invoice.", "The report is generated from booking and invoice data with the coverage rules applied per product type."], "painPoints": ["Reports assembled from expor ected by email is a privacy and accuracy problem.", "Name mismatches discovered at ticketing cost rebooking fees."], "dependencies": [{"type": "brick", "id": "mytp", "name": "Traveler Portal and My-Trip App", "description": "Data completion tasks in the portal.", "how": "Collects passenger data from the traveler."}, {"type": "brick", "id": "pass", "name": "Passenger Data and Operational Lists", "description": "Passenger record.", "how": "Stores the completed data for lists and tickets."}]}, {"id": "add-ancillaries", "title": "Add ancillaries such as excursions, insurance and eSIM", "actor": "Traveler and Booker", "keyFacts": ["Ancillaries can be added after booking in the portal; an eSIM for the destination is offered via the Hubby partnership and delivered digitally.", "Each addition creates an invoice line and, where needed, a supplier request."], "painPoints": ["Ancillaries sold only at booking miss the traveler's later needs.", "Additions handled by the desk are re-keyed and often missing from documents."], "dependencies": [{"type": "brick", "id": "mytp", "name": "Traveler Portal and My-Trip App", "description": "Ancillary shop in the portal.", "how": "Offers and sells post-booking extras."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Ancillary lines on the file.", "how": "Adds lines and triggers invoicing."}]}, {"id": "receive-documents", "title": "Receive travel documents on schedule", "actor": "Traveler and Booker", "keyFacts": ["Documents are published in the portal and pushed to the app at a configured number of days before departure, once the file is paid and confirmed.", "The traveler is notified by email and push and can download or view documents offline."], "painPoints": ["Documents by post or as email attachments are lost and outdated.", "Travelers unsure whether documents were sent call the desk."], "dependencies": [{"type": "brick", "id": "docs", "name": "Travel Documents and Itinerary Delivery", "descripti
