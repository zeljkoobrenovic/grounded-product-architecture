n answer from the booking view", "actor": "Traveler and Booker", "keyFacts": ["Questions asked in the portal or by email land on the file; the agent answers from one booking view with the full history.", "AI assistance drafts answers to routine questions from the file data for the agent to approve."], "painPoints": ["Questions answered without the file lead to contradictions.", "Routine questions consume agent time that should go to sales."], "dependencies": [{"type": "brick", "id": "mytp", "name": "Traveler Portal and My-Trip App", "description": "Questions from the portal.", "how": "Captures traveler questions against the file."}, {"type": "brick", "id": "comm", "name": "Email and Telephony Integration", "description": "Answering from the booking view.", "how": "Links replies to the file."}]}]}, {"id": "in-trip-support-and-aftercare", "title": "In-Trip Support and Aftercare", "description": "The journey during and after travel: in-trip updates, incidents and complaints, surveys, reviews and retention hand-off.", "primaryActor": "Traveler and Booker", "trigger": "The traveler departs.", "successSignal": "The trip is completed with incidents resolved, the survey answered, a review published and the traveler flagged for the next campaign.", "steps": [{"id": "receive-in-trip-updates", "title": "Receive in-trip updates and changes", "actor": "Traveler and Booker", "keyFacts": ["Changes during the trip \u2014 a changed pickup time, a hotel swap \u2014 are pushed to the app and portal from the file, and the guide sees the same information.", "Emergency messages reach all participants of a departure at once."], "painPoints": ["Updates by phone to each traveler do not scale during an incident.", "Guides and travelers with different information create confusion."], "dependencies": [{"type": "brick", "id": "mytp", "name": "Traveler Portal and My-Trip App", "description": "Push updates in the app.", "how": "Delivers changes to travelers."}, {"type": "brick", "id": "guid", "na ": "Applies agency pricing rules."}, {"type": "brick", "id": "comp", "name": "Components, Inventory and Availability", "description": "Live availability.", "how": "Supplies seats and rooms available."}]}, {"id": "quote-client", "title": "Quote the client from the portal", "actor": "Reseller Travel Agent", "keyFacts": ["A branded quote for the client, with the agency's own logo, is generated from the portal and can be turned into a booking later.", "Options hold capacity for the reseller for a limited time."], "painPoints": ["Quotes typed by the agent contain wrong inclusions.", "Without options, the seat is gone when the client decides."], "dependencies": [{"type": "brick", "id": "rsel", "name": "Reseller and Agent Portal", "description": "Reseller quotes and options.", "how": "Creates quotes and options for the agency."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Option on the file.", "how": "Holds capacity as an option."}]}, {"id": "book-and-enter-passengers", "title": "Book and enter the client's passengers", "actor": "Reseller Travel Agent", "keyFacts": ["The reseller books with passenger data, seat and wishes; the booking file is created with the agency as booker and the passengers as travelers.", "The operator's desk sees the booking like any other file."], "painPoints": ["Bookings emailed by resellers are re-keyed by the desk.", "Files that mix agency and traveler contact data confuse communication."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Reseller booking file.", "how": "Creates the file with agency and passengers."}, {"type": "brick", "id": "rsel", "name": "Reseller and Agent Portal", "description": "Reseller booking form.", "how": "Captures the booking in the portal."}]}, {"id": "invoice-with-commission", "title": "Receive the invoice with commission applied", "actor": "Reseller Travel Agent", "keyFacts": ["The invoice to the agency reflects the agreed net or commission model; the traveler receives no invoice from the operator unless configured.", "Payment terms may allow the agency to pay at balance date only."], "painPoints": ["Invoices sent to the traveler instead of the agency breach the agency relationship.", "Commission errors are the main cause of reseller disputes."], "dependencies": [{"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Agency invoicing.", "how": "Issues invoices under agency terms."}, {"type": "brick", "id": "rsel", "name": "Reseller and Agent Portal", "description": "Agency terms.", "how": "Provides the invoicing model."}]}, {"id": "retrieve-documents-for-client", "title": "Retrieve documents for the client", "actor": "Reseller Travel Agent", "keyFacts": ["Travel documents appear in the reseller portal with the agency branding option and can be forwarded to the client.", "Changes made by the operator are visible in the portal with notifications."], "painPoints": ["Resellers asking the operator for documents by phone cost both sides time.", "Clients receiving documents with a brand they never dealt with are confused."], "dependencies": [{"type": "brick", "id": "docs", "name": "Travel Documents and Itinerary Delivery", "description": "Reseller-branded documents.", "how": "Generates documents with agency branding."}, {"type": "brick", "id": "rsel", "name": "Reseller and Agent Portal", "description": "Document retrieval in the portal.", "how": "Makes documents available to the agency."}]}, {"id": "change-or-cancel-for-client", "title": "Change or cancel on behalf of the client", "actor": "Reseller Travel Agent", "keyFacts": ["Changes and cancellations follow the same conditions and fee ladders as direct bookings and are processed in the portal.", "The operator's operations lists update automatically."], "painPoints": ["Reseller changes by email are missed in room and seat lists.", "Cancellation fees calculated differently for resellers cause disputes."], "dependencies": [{"type": "brick", "id": "rsel", "name": "Reseller and Agent Portal", "description": "Changes in the portal.", "how": "Lets the agency change or cancel."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Change processing on the file.", "how": "Applies the change and fees."}]}]}, {"id": "publish-to-partner-channels-and-import-bookings", "title": "Publish to Partner Channels and Import Bookings", "description": "Feed products to partner channels through the integration hub and receive their bookings as native booking files.", "primaryActor": "Travel Company Owner", "trigger": "The owner signs a distribution agreement with a travel-agency consortium and a niche marketplace.", "successSignal": "Products are live on the partner channels with correct prices and availability and partner bookings appear as normal files with the partner as reseller.", "steps": [{"id": "configure-partner-channel", "title": "Configure the partner channel and its terms", "actor": "Travel Company Owner", "keyFacts": ["Each partner channel is registered with its product selection, price rules, commission and the technical connection type.", "Channels can receive a subset of products, for example only guaranteed departures."], "painPoints": ["Sending the whole catalogue to every partner exposes unsuitable products.", "Terms kept in contracts but not in the system cause wrong commissions."], "dependencies": [{"type": "brick", "id": "intg", "name": "Integration Hub and Partner APIs", "description": "Partner channel configuration.", "how": "Registers the channel and its connection."}, {"type": "brick", "id": "rsel", "name": "Reseller and Agent Portal", "description": "Partner as reseller with terms.", "how": "Holds commission and product selection."}]}, {"id": "export-product-feed", "title": "Export the product feed with prices and availability", "actor": "Travel Company Owner", "keyFacts": ["A structured feed with products, departures, prices and availability is exported on schedule or on change to the partner's API.", "Feed content is the same catalogue the website uses, so partners never show stale data."], "painPoints": ["Partners working from a brochure PDF sell cancelled departures.", "Hand-maintained partner spreadsheets lag price changes."], "dependencies": [{"type": "brick", "id": "intg", "name": "Integration Hub and Partner APIs", "description": "Product feed export.", "how": "Publishes the feed to the partner."}, {"type": "brick", "id": "prod", "name": "Travel Products and Packages", "description": "Product data for the feed.", "how": "Provides the products and departures."}]}, {"id": "receive-partner-booking", "title": "Receive a partner booking through the API", "actor": "Reservations and Sales Agent", "keyFacts": ["Partner bookings arrive through the integration hub and create a booking file with the partner as reseller and the passengers attached.", "Validation rejects bookings that no longer fit availability, returning a clear reason."], "painPoints": ["Partner bookings by email are re-keyed and often overbook.", "Silent rejections leave the partner without a reason."], "dependencies": [{"type": "brick", "id": "intg", "name": "Integration Hub and Partner APIs", "description": "Booking import API.", "how": "Receives and validates partner bookings."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Booking file from the partner booking.", "how": "Creates the file with the partner as booker."}]}, {"id": "confirm-and-return-status", "title": "Confirm and return the status to the partner", "actor": "Reservations and Sales Agent", "keyFacts": ["Confirmation, invoice and document status flow back to the partner through the API so the partner's agents can inform the client.", "Changes made by the operator are pushed to the partner as events."], "painPoints": ["Partners not informed of a cancelled departure sell it anyway.", "Status by email is not visible in the partner's system."], "dependencies": [{"type": "brick", "id": "intg", "name": "Integration Hub and Partner APIs", "description": "Status and event push to the partner.", "how": "Returns confirmation and changes."}, {"type": "brick", "id": "docs", "name": "Travel Documents and Itinerary Delivery", "description": "Documents for partner clients.", "how": "Makes documents available through the channel."}]}, {"id": "settle-partner-commissions", "title": "Settle partner commissions", "actor": "Finance and Administration Lead", "keyFacts": ["Commission statements per partner are generated from the bookings and matched with the partner's own statement.", "Disputes reference the individual booking."], "painPoints": ["Commission reconciled by spreadsheet is a monthly fight.", "Unmatched statements delay payment to the partner."], "dependencies": [{"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Commission statements.", "how": "Generates partner commission statements."}]}, {"id": "review-channel-performance", "title": "Review channel performance", "actor": "Travel Company Owner", "keyFacts": ["Bookings, margin after commission and cancellation rate per channel are compared with direct sales.", "The owner decides where to invest and which channels to prune."], "painPoints": ["Channels judged on gross bookings hide their true margin.", "Without cancellation data, high-cancel channels look attractive."], "dependencies": [{"type": "brick", "id": "rsel", "name": "Reseller and Agent Portal", "description": "Channel and reseller data.", "how": "Provides the channel attribution."}]}]}], "outcomes": ["Higher portal booking share among resellers, because the portal shows the same live availability, seats and prices as the desk", "Lower reseller handling time per booking, since quotes, documents and changes are self-service", "Partner channel bookings that arrive as normal booking files, not emails to re-key"], "brickDependencies": [{"targetBrickId": "rsel", "type": "composition"}, {"targetBrickId": "prod", "type": "composition"}, {"targetBrickId": "comp", "type": "composition"}, {"targetBrickId": "pric", "type": "composition"}, {"targetBrickId": "book", "type": "composition"}, {"targetBrickId": "docs", "type": "composition"}, {"targetBrickId": "invc", "type": "composition"}, {"targetBrickId": "intg", "type": "composition"}, {"targetBrickId": "iden", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "Partner Channel and Agency Systems", "type": "distribution-partner", "interface": "Product feed export and booking import API", "description": "Travel-agency consortia, affiliate networks and niche marketplaces that resell the operator's products."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []}, {"id": "steer-the-travel-business-with-insight", "name": "Steer the Travel Business with Insight", "icon": "steer-the-travel-business-with-insight.png", "type": "outcome-based-stream", "description": "Take the owner and finance lead from transaction data \u2014 bookings, departures, invoices, supplier costs, campaigns \u2014 to BI dashboards, margin analysis, demand forecasts and KPI steering, so that capacity, pricing and headcount decisions are made on the platform's numbers rather than on gut feel and spreadsheets.", "group": "Traveler, Market and Steering Journeys", "rootGroup": "Traveler, Market and Steering Journeys", "flows": [{"id": "from-transaction-data-to-weekly-steering", "title": "From Transaction Data to Weekly Steering", "description": "The recurring steering loop: data refresh, dashboards, KPI review, decisions and actions back into the operation.", "primaryActor": "Travel Company Owner", "trigger": "The weekly management meeting is scheduled and the dashboards refresh overnight.", "successSignal": "Decisions on pricing, capacity and follow-up are taken from the dashboards and turned into tasks and rule changes in the ERP.", "steps": [{"id": "refresh-data-model", "title": "Refresh the analytical data model", "actor": "Finance and Administration Lead", "keyFacts": ["Bookings, departures, invoices, payments, supplier costs, campaigns and complaints are loaded nightly into the analytical model, per tenant.", "Definitions (booking, passenger, revenue, margin) are fixed once so every dashboard uses the same numbers."], "painPoints": ["Exports to Excel every Monday produce a different number per person.", "Undefined metrics turn every meeting into a debate about the data."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Analytical data model.", "how": "Loads and harmonises the data nightly."}, {"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Invoice and payment data.", "how": "Supplies revenue and receivables."}]}, {"id": "review-north-star-kpis", "title": "Review the north-star KPIs", "actor": "Travel Company Owner", "keyFacts": ["The owner dashboard shows revenue per FTE, operating margin, online booking share, quote-to-booking conversion and days to close, with trends and targets.", "Each KPI drills down to the departures, agents or products behind it."], "painPoints": ["KPIs presented once a quarter are too late to act on the season.", "Dashboards without drill-down invite speculation about causes."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "KPI dashboards with drill-down.", "how": "Presents north-star KPIs and trends."}]}, {"id": "analyse-margin-and-load", "title": "Analyse margin and load factor per departure and product", "actor": "Travel Company Owner", "keyFacts": ["Sold versus realised margin and load factor per departure identify products to reprice, merge or drop.", "Supplier cost trends highlight contracts to renegotiate."], "painPoints": ["Product decisions made on revenue alone keep loss-making departures alive.", "Supplier cost creep unnoticed erodes a whole season."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Margin and load analysis.", "how": "Analyses margin and load per departure."}, {"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Realised supplier cost.", "how": "Supplies matched purchase costs."}]}, {"id": "analyse-sales-and-service-performance", "title": "Analyse sales and service performance per agent and channel", "actor": "Travel Company Owner", "keyFacts": ["Conversion, handling time, first-contact resolution and proposal turnaround are shown per agent, specialist and channel.", "Complaint and survey scores per guide, hotel and product complete the picture."], "painPoints": ["Agents judged on booking counts alone ignore margin and service.", "Service quality unmeasured per supplier repeats bad choices."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Sales and service dashboards.", "how": "Reports per agent, channel and supplier."}, {"type": "brick", "id": "crmr", "name": "CRM and Contact Management", "description": "Contact and interaction data.", "how": "Supplies conversion and handling data."}]}, {"id": "decide-and-act", "title": "Decide and turn decisions into actions", "actor": "Travel Company Owner", "keyFacts": ["Decisions become concrete changes: a price tier adjusted, a departure merged, a supplier flagged, a follow-up campaign \u2014 each created as a rule change or a task from the meeting.", "The AI assistant summarises the week's anomalies and proposes actions for review."], "painPoints": ["Decisions minuted but not executed are the norm without a task system.", "Owners drowning in dashboards need a summary, not more charts."], "dependencies": [{"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Decisions as tasks.", "how": "Creates tasks with owners and due dates."}, {"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Price rule changes.", "how": "Applies repricing decisions."}]}, {"id": "track-compliance-and-risk", "title": "Track compliance and financial risk indicators", "actor": "Finance and Administration Lead", "keyFacts": ["Guarantee-fund exposure, overdue receivables, unconfirmed services near departure and open complaints are tracked as risk indicators.", "Thresholds alert the owner before a risk becomes a regulatory or cash problem."], "painPoints": ["Risk seen only in the annual audit is seen too late.", "Exposure to the guarantee fund unknown surprises the owner at contribution time."], "dependencies": [{"type": "brick", "id": "gfnd", "name": "Guarantee Fund and Regulatory Reporting", "description": "Exposure and compliance indicators.", "how": "Supplies fund exposure and compliance status."}, {"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Risk dashboards and alerts.", "how": "Presents risk indicators with thresholds."}]}]}, {"id": "forecast-demand-and-decide-capacity", "title": "Forecast Demand and Decide Capacity", "description": "Use booking curves and history to forecast demand per product and departure, and decide capacity and pricing for the coming season.", "primaryActor": "Travel Company Owner", "trigger": "Planning for next season's series starts and the owner needs to decide how many departures and coaches to contract.", "successSignal": "Next season's departures, capacity and price tiers are set on forecast demand, with early warnings during the booking season.", "steps": [{"id": "build-booking-curves", "title": "Build booking curves from history", "actor": "Finance and Administration Lead", "keyFacts": ["Booking curves show, per product and departure month, how bookings accumulate relative to departure across past seasons.", "Curves separate direct, reseller and partner channels."], "painPoints": ["Without curves, an early slow season looks like a disaster and a late one like a success.", "History in old spreadsheets cannot be compared across seasons."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Booking curve analysis.", "how": "Builds curves from historical bookings."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Historical booking data.", "how": "Supplies booking dates and departures."}]}, {"id": "forecast-next-season", "title": "Forecast next season's demand", "actor": "Travel Company Owner", "keyFacts": ["Forecasts per product combine curves, current early bookings, campaign plans and market signals; the AI assistant flags products whose forecast deviates from last year.", "Forecasts are shown with ranges, not single numbers."], "painPoints": ["Contracting capacity on last year's final numbers ignores trend changes.", "Point forecasts create false confidence."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Demand forecasting.", "how": "Produces forecasts with ranges per product."}, {"type": "brick", "id": "aiaa", "name": "AI Office Assistants", "description": "Forecast deviation flags.", "how": "Highlights products deviating from trend."}]}, {"id": "decide-departures-and-capacity", "title": "Decide departures, capacity and minimums", "actor": "Group Travel Operations Manager", "keyFacts": ["The number of departures, coach size, hotel allotments and minimum participants per departure are set from the forecast and margin scenarios.", "Decisions feed directly into the departure series and purchasing targets."], "painPoints": ["Capacity decisions disconnected from the product setup are re-entered by hand.", "Minimums set too high cancel departures that would have filled."], "dependencies": [{"type": "brick", "id": "dept", "name": "Departures and Capacity Management", "description": "Departure series and capacity.", "how": "Applies the capacity decisions to departures."}]}, {"id": "set-yield-strategy", "title": "Set the yield and pricing strategy", "actor": "Travel Company Owner", "keyFacts": ["Early-bird tiers, load-based tiers and last-minute rules are set per product from the forecast and last year's realised prices.", "Rules are simulated against the curve before activation."], "painPoints": ["Prices set by gut feel leave money on strong departures and empty weak ones.", "Untested rules produce surprising prices on the website."], "dependencies": [{"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Yield rules and simulation.", "how": "Configures and simulates tiered pricing."}, {"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Realised price and demand analysis.", "how": "Supplies price history and curves."}]}, {"id": "monitor-season-against-forecast", "title": "Monitor the season against forecast with early warnings", "actor": "Travel Company Owner", "keyFacts": ["During the booking season the actual curve is tracked against forecast; deviations raise alerts to adjust prices, campaigns or capacity in time.", "Each alert links to the action that can be taken in the ERP."], "painPoints": ["Deviations discovered at the go/no-go deadline are too late to fix.", "Alerts without an action path are ignored."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Forecast tracking and alerts.", "how": "Compares actuals to forecast and alerts."}, {"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Alerts as tasks.", "how": "Turns deviations into actionable tasks."}]}]}], "outcomes": ["Revenue per FTE tracked and improved, because the owner sees where handling time goes and which processes scale", "Capacity and pricing decisions taken on load-factor and margin data per departure, weeks earlier than before", "One set of numbers shared by sales, operations and finance, closing the gap between sold and realised margin"], "brickDependencies": [{"targetBrickId": "bint", "type": "composition"}, {"targetBrickId": "book", "type": "composition"}, {"targetBrickId": "invc", "type": "composition"}, {"targetBrickId": "dept", "type": "composition"}, {"targetBrickId": "pric", "type": "composition"}, {"targetBrickId": "crmr", "type": "composition"}, {"targetBrickId": "acct", "type": "composition"}, {"targetBrickId": "gfnd", "type": "composition"}, {"targetBrickId": "wflw", "type": "composition"}, {"targetBrickId": "aiaa", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "Travel Intelligence BI", "type": "analytics-platform", "interface": "Nightly data export and dashboard embedding", "description": "Trade-specific BI dashboards for bookings, margin, load factor and forecast."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []}]}], "experiences": [{"id": "build-and-price-travel-products", "name": "Build and Price Travel Products", "icon": "build-and-price-travel-products.png", "type": "outcome-based-stream", "description": "Take a travel organisation from negotiated supplier contracts to sellable packages, fixed-date departures, series and individual components with prices, yield rules and group calculations, so that every channel \u2014 desk, website, reseller portal and Visual Tour Builder \u2014 sells from one product master instead of a brochure spreadsheet.", "group": "Product and Sales Journeys", "rootGroup": "Product and Sales Journeys", "flows": [{"id": "contract-compose-and-price-a-departure-series", "title": "Contract, Compose and Price a Group Departure Series", "description": "From a hotel and coach contract to a published series of fixed-date departures with tiered yield pricing and minimum-participant rules.", "primaryActor": "Group Travel Operations Manager", "trigger": "The season's purchasing round closes and contracted rates arrive from hotels, coach companies and DMCs.", "successSignal": "The series is live on the website with correct prices, capacity and cancellation deadlines per departure.", "steps": [{"id": "register-supplier-contracts", "title": "Register supplier contracts and purchase rates", "actor": "Group Travel Operations Manager", "keyFacts": ["A coach round trip typically combines one coach contract, six to ten hotel contracts, ferry or toll components and a local DMC agreement per departure.", "Contracts carry allotments, release dates, child and single-room supplements and currency, all of which drive the group calculation later."], "painPoints": ["Contract terms living in email attachments mean release dates are missed and rooms are paid for that were never sold.", "Re-keying the same hotel rates into a purchase sheet and a sales sheet is the top source of margin errors."], "dependencies": [{"type": "brick", "id": "cont", "name": "Purchasing and Supplier Contracts", "description": "Stores supplier contracts, allotments and release dates.", "how": "Captures each contract once as the purchasing basis for every product that uses it."}, {"type": "brick", "id": "supl", "name": "Supplier Management and Communication", "description": "Supplier master data and communication history.", "how": "Links the contract to the supplier record and its contacts."}]}, {"id": "compose-components", "title": "Compose components and inventory", "actor": "Group Travel Operations Manager", "keyFacts": ["A component is a reusable accommodation, transport or activity block with its own availability, so a hotel night can be used in a group series and in a tailor-made itinerary alike.", "Allotment and on-request components behave differently at booking time: allotment sells immediately, on-request needs a supplier confirmation."], "painPoints": ["Duplicated components per product make a single hotel rate change a multi-hour edit.", "Unclear allotment versus on-request status leads agents to confirm rooms that do not exist."], "dependencies": [{"type": "brick", "id": "comp", "name": "Components, Inventory and Availability", "description": "Reusable components with inventory and availability.", "how": "Turns contract lines into bookable components with allotment rules."}]}, {"id": "build-package-and-itinerary", "title": "Build the package and day-by-day itinerary", "actor": "Group Travel Operations Manager", "keyFacts": ["A package fixes the sequence of components per day and the inclusions and exclusions shown to the traveler.", "Package templates are cloned per season so that only dates, prices and changed hotels need editing."], "painPoints": ["Itineraries copied by hand into the website CMS drift from what operations actually runs.", "Inclusion texts written per product instead of per component are inconsistent across the catalogue."], "dependencies": [{"type": "brick", "id": "prod", "name": "Travel Products and Packages", "description": "Packages and their day-by-day structure.", "how": "Assembles components into a sellable package with itinerary and inclusions."}, {"type": "brick", "id": "ctnt", "name": "Travel Content and Media Management", "description": "Photos, texts and media per product and destination.", "how": "Attaches destination texts and MediaSpirit-style photo sets to the package."}]}, {"id": "generate-departures", "title": "Generate the departure series with capacity", "actor": "Group Travel Operations Manager", "keyFacts": ["A series generates fixed-date departures from a rhythm (for example every Saturday from April to October) with capacity per departure derived from coach size and hotel allotments.", "Each departure carries a minimum number of participants; under the Package Travel Directive the operator must cancel at least 20 days before departure for trips longer than six days if that minimum is not met."], "painPoints": ["Creating departures one by one invites date and capacity typos that surface only when a bus is overbooked.", "Minimum-participant deadlines tracked in a wall calendar are missed, exposing the operator to full refunds."], "dependencies": [{"type": "brick", "id": "dept", "name": "Departures and Capacity Management", "description": "Departures with capacity, minimums and deadlines.", "how": "Generates the departure series and stores capacity and go/no-go deadlines."}]}, {"id": "run-group-calculation", "title": "Run the group calculation and set tiered yield prices", "actor": "Group Travel Operations Manager", "keyFacts": ["The group calculation divides fixed costs (coach, guide, ferry) over the expected participant count and adds variable costs per person to reach a break-even and target-margin price.", "Yield tiers raise or lower the price by departure and by booking window, for example an early-bird price until a fixed date and a higher price when the bus is more than 80% full."], "painPoints": ["Calculations kept in personal spreadsheets cannot be reproduced when finance asks why a departure lost money.", "Manual price updates per departure lag behind demand, so full buses are sold at early-bird prices."], "dependencies": [{"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Pricing, yield rules and group calculations.", "how": "Computes break-even, target-margin and tiered prices per departure."}]}, {"id": "review-margin-and-approve", "title": "Review margin and approve the product for sale", "actor": "Travel Company Owner", "keyFacts": ["The owner sees expected margin per departure at the minimum, break-even and full-bus scenario before a single seat is sold.", "Approval locks the price list and cancellation deadlines that finance and the website will use."], "painPoints": ["Without a scenario view, owners approve products that only break even at a full bus.", "Late price corrections after publication create different prices for the same departure across channels."], "dependencies": [{"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Margin scenarios per departure.", "how": "Presents minimum, break-even and full-capacity margin for approval."}, {"type": "brick", "id": "prod", "name": "Travel Products and Packages", "description": "Product status and publication control.", "how": "Sets the product to sellable once approved."}]}, {"id": "publish-to-channels", "title": "Publish to website, desk and reseller channels", "actor": "Group Travel Operations Manager", "keyFacts": ["Publication pushes the same product, prices and real-time availability to the customer website, the booking desk and the reseller portal.", "Content, price and availability changes after publication propagate automatically instead of via a CMS edit."], "painPoints": ["A separately maintained website catalogue is the main reason customers see a price that the desk cannot honour.", "Unpublished changes to inclusions cause complaints when the trip differs from what was sold."], "dependencies": [{"type": "brick", "id": "webs", "name": "Customer Website, CMS and Online Booking", "description": "Customer website and online booking.", "how": "Renders the approved product with live prices and availability."}, {"type": "brick", "id": "prod", "name": "Travel Products and Packages", "description": "Product master as the single source for all channels.", "how": "Distributes one product definition to every channel."}]}]}, {"id": "maintain-components-and-content-for-tailor-made-selling", "title": "Maintain Components and Content for Tailor-Made Selling", "description": "Keep the component library, sample itineraries and media current so specialists can compose proposals from stored, correctly priced building blocks.", "primaryActor": "Tailor-Made Travel Specialist", "trigger": "A destination manager receives new season rates from lodges, transfers and excursions in a destination.", "successSignal": "Every component in the destination has valid rates, content and photos for the coming season and appears in the Visual Tour Builder.", "steps": [{"id": "update-destination-rates", "title": "Update destination component rates and validity", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Tailor-made specialists maintain hundreds of lodges, transfers and excursions per destination, each with seasonal rate bands and validity dates.", "Rates are held in supplier currency and converted at booking with a configurable margin on the exchange rate."], "painPoints": ["Rate sheets in PDF are re-typed per season, which is where wrong nights and wrong seasons creep in.", "Missing validity dates make expired rates appear in proposals for next year."], "dependencies": [{"type": "brick", "id": "comp", "name": "Components, Inventory and Availability", "description": "Component rates with seasonal validity.", "how": "Stores rate bands per season and currency."}, {"type": "brick", "id": "cont", "name": "Purchasing and Supplier Contracts", "description": "Supplier contract terms behind the rates.", "how": "Keeps the contractual basis for each rate band."}]}, {"id": "curate-content-and-media", "title": "Curate destination content and photos", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Each component carries description texts in the tenant's languages and a curated photo set that the Visual Tour Builder places into proposals automatically.", "Photo rights and supplier-provided imagery are tracked per asset so that proposals never use unlicensed images."], "painPoints": ["Specialists searching shared drives for photos spend more time on layout than on the itinerary.", "Outdated lodge photos are the leading cause of 'this is not what we booked' complaints."], "dependencies": [{"type": "brick", "id": "ctnt", "name": "Travel Content and Media Management", "description": "Content and media library per component.", "how": "Provides the texts and photos that proposals reuse."}]}, {"id": "build-sample-itineraries", "title": "Build sample itineraries as starting points", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["A sample itinerary is a stored sequence of components \u2014 for example a 14-day Tanzania safari \u2014 used as the first draft for most requests.", "Sample itineraries are also published to the website as inspiration and are directly requestable by the traveler."], "painPoints": ["Every proposal started from a blank page is slower and less consistent than one started from a template.", "Samples that are not re-priced each season mislead customers on the website."], "dependencies": [{"type": "brick", "id": "prod", "name": "Travel Products and Packages", "description": "Products that wrap sample itineraries for publication.", "how": "Publishes samples as requestable products."}]}, {"id": "set-margin-rules", "title": "Set margin and pricing rules per component type", "actor": "Travel Company Owner", "keyFacts": ["Margin targets differ per component type \u2014 accommodation, international flights and local transfers rarely carry the same markup.", "Rules can also apply per customer segment or reseller so that agent bookings automatically carry the agreed commission."], "painPoints": ["Margins applied by hand in each proposal vary per specialist and are hard to audit.", "A single wrong markup rule silently underprices a whole destination."], "dependencies": [{"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Margin and markup rules.", "how": "Applies configurable margins per component type and channel."}]}, {"id": "verify-supplier-terms", "title": "Verify supplier payment and cancellation terms", "actor": "Finance and Administration Lead", "keyFacts": ["Supplier cancellation terms determine the operator's own cancellation ladder toward the traveler under the Package Travel Directive.", "Prepayment requirements per supplier drive the cash-flow planning for the season."], "painPoints": ["Unknown supplier deadlines turn every customer cancellation into a negotiation.", "Prepayment obligations not visible to finance cause surprise outflows."], "dependencies": [{"type": "brick", "id": "cont", "name": "Purchasing and Supplier Contracts", "description": "Supplier terms and prepayment rules.", "how": "Records cancellation ladders and prepayment obligations."}, {"type": "brick", "id": "supl", "name": "Supplier Management and Communication", "description": "Supplier records and contacts.", "how": "Keeps the accountable supplier contact for each term."}]}, {"id": "release-to-builder", "title": "Release the destination library to the builder and website", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Released components become draggable blocks in the Visual Tour Builder and searchable on the SPoE website.", "Release checks flag components without price, photo or validity before they reach a proposal."], "painPoints": ["Incomplete components discovered during a customer call embarrass the specialist.", "Unreleased updates leave the website showing last year's itineraries."], "dependencies": [{"type": "brick", "id": "webs", "name": "Customer Website, CMS and Online Booking", "description": "Destination pages and inspiration itineraries.", "how": "Publishes released content on the website."}]}]}], "outcomes": ["One product master feeds every sales channel, so prices and availability never diverge between brochure, website and desk", "Departure margins are known before the first booking, because group calculations tie purchase cost, minimum participants and yield tiers together", "Seasonal product setup takes days instead of weeks, with contracts, content and pricing reused across seasons"], "brickDependencies": [{"targetBrickId": "prod", "type": "composition"}, {"targetBrickId": "comp", "type": "composition"}, {"targetBrickId": "pric", "type": "composition"}, {"targetBrickId": "cont", "type": "composition"}, {"targetBrickId": "ctnt", "type": "composition"}, {"target e Travel Specialist", "keyFacts": ["Stored components \u2014 lodges, transfers, excursions, flights \u2014 are dragged onto a day-by-day canvas; texts and photos come along automatically.", "Availability and rate validity are checked per component as it is placed, so the draft is buildable from the start."], "painPoints": ["Word documents assembled from copied text and photos take hours and look different per specialist.", "Components dragged in without an availability check produce proposals that fall apart on confirmation."], "dependencies": [{"type": "brick", "id": "vtbl", "name": "Visual Tour Builder, Quotes and Itineraries", "description": "Drag-and-drop itinerary composition.", "how": "Places components on the day canvas with text and media."}, {"type": "brick", "id": "comp", "name": "Components, Inventory and Availability", "description": "Component availability and rates.", "how": "Validates each placed component against inventory and validity."}]}, {"id": "price-at-target-margin", "title": "Price the proposal at target margin", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["The calculation sums supplier costs in their currencies, applies margin rules per component type and shows the resulting margin against the target before the price is shown to the client.", "Optional items and alternative lodges can be priced as choices the client toggles online."], "painPoints": ["Margins computed by hand in a side spreadsheet differ from the eventual invoice.", "Specialists under sales pressure quietly give margin away without visibility for the owner."], "dependencies": [{"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Margin rules and currency handling.", "how": "Calculates cost, margin and sales price per line and in total."}, {"type": "brick", "id": "vtbl", "name": "Visual Tour Builder, Quotes and Itineraries", "description": "Priced proposal with options.", "how": "Shows the specialist the margin and the client the price."}]}, {"id": "publish-proposal-online", "title": "Publish the proposal for online review", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["The proposal is published as a personal web page with maps, photos, day texts and price, and a link is emailed to the client.", "Views and time-on-page are tracked so the specialist knows when to follow up."], "painPoints": ["PDF proposals cannot be updated after sending and are read on a phone with difficulty.", "Specialists follow up blind, without knowing whether the client opened the proposal."], "dependencies": [{"type": "brick", "id": "vtbl", "name": "Visual Tour Builder, Quotes and Itineraries", "description": "Online proposal pages.", "how": "Renders the itinerary as a personal web page and tracks views."}, {"type": "brick", "id": "mytp", "name": "Traveler Portal and My-Trip App", "description": "Traveler portal where proposals are reviewed.", "how": "Presents the proposal in the client's personal environment."}]}, {"id": "iterate-on-feedback", "title": "Iterate on client feedback", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Clients comment per day or component in the portal; the specialist swaps a lodge or adds a night and republishes as a new version.", "Version history keeps every proposal variant with its price so a client can return to an earlier option."], "painPoints": ["Changes exchanged by email get lost, and the final trip differs from what the client remembers.", "Re-pricing a change by hand takes longer than the change itself."], "dependencies": [{"type": "brick", "id": "vtbl", "name": "Visual Tour Builder, Quotes and Itineraries", "description": "Proposal versions and client comments.", "how": "Applies changes and republishes a versioned proposal."}, {"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Re-pricing on each change.", "how": "Recomputes price and margin for every version."}]}, {"id": "client-approves-and-pays-deposit", "title": "Client approves online and pays the deposit", "actor": "Traveler and Booker", "keyFacts": ["The client approves the proposal with one click, accepts the travel conditions and pays the deposit via a payment link in the same session.", "Acceptance timestamps and accepted conditions are stored as the contract record required under the Package Travel Directive."], "painPoints": ["Approval by email reply and a separate bank transfer delays the confirmation by days.", "Missing proof of accepted conditions weakens the operator's position in disputes."], "dependencies": [{"type": "brick", "id": "mytp", "name": "Traveler Portal and My-Trip App", "description": "Approval and payment in the traveler portal.", "how": "Records the approval and triggers the deposit payment."}]}, {"id": "convert-to-trip-file", "title": "Convert the accepted proposal into a trip file", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Conversion creates the booking file with every component as a booking line, the calculated margin and the supplier requests still to be sent.", "The proposal remains linked to the file so later changes are traceable to what was sold."], "painPoints": ["Re-keying accepted proposals into the booking system is where names, dates and prices get corrupted.", "Unlinked proposals make it impossible to compare sold margin with realised margin."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Booking file with lines and margin.", "how": "Creates the file from the accepted proposal without re-entry."}, {"type": "brick", "id": "vtbl", "name": "Visual Tour Builder, Quotes and Itineraries", "description": "Accepted proposal as the source of the file.", "how": "Hands over lines, prices and versions to the booking file."}]}]}], "outcomes": ["Proposal turnaround measured in hours rather than days, because itineraries are composed from priced components and sample trips", "Higher proposal acceptance, because clients review a visual, photo-rich itinerary online and approve it with one click", "Every accepted proposal becomes a trip file at the calculated margin, with no re-keying between quote and booking"], "brickDependencies": [{"targetBrickId": "vtbl", "type": "composition"}, {"targetBrickId": "comp", "type": "composition"}, {"targetBrickId": "pric", "type": "composition"}, {"targetBrickId": "crmr", "type": "composition"}, {"targetBrickId": "book", "type": "composition"}, {"targetBrickId": "mytp", "type": "composition"}, {"targetBrickId": "aiaa", "type": "composition"}, {"targetBrickId": "comm", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "WeCloudIT Email and Telephony", "type": "communication-platform", "interface": "Mailbox sync and click-to-dial / caller identification", "description": "Links inbound email and calls to the contact and booking file that the agent is working on."}, {"system": "Mollie Payment Platform", "type": "payment-service-provider", "interface": "Payment links, iDEAL, cards and webhooks", "description": "Hosted payment links and status webhooks for deposits, balances and refunds."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []}, {"id": "book-online-and-at-the-desk", "name": "Book Online and at the Desk", "icon": "book-online-and-at-the-desk.png", "type": "outcome-based-stream", "description": "Take an inquiry from the website, phone or email to a confirmed booking with deposit paid \u2014 whether the traveler completes the booking on the real-time customer website or the reservations agent books in the back office. Both paths use the same product master, capacity, seat map and price rules, so a web booking and a desk booking are indistinguishable in the file.", "group": "Product and Sales Journeys", "rootGroup": "Product and Sales Journeys", "flows": [{"id": "traveler-books-a-group-departure-on-the-website", "title": "Traveler Books a Group Departure on the Real-Time Website", "description": "A traveler finds a coach or group tour, picks a departure, chooses a bus seat and room type, pays the deposit and receives the confirmation \u2014 with the booking file created in the back office at the same moment.", "primaryActor": "Traveler and Booker", "trigger": "A traveler lands on the operator's website looking for a spring coach tour to Tuscany.", "successSignal": "The booking file is confirmed, the deposit is received via a payment link and the traveler has the confirmation in the my-trip portal.", "steps": [{"id": "search-and-select-departure", "title": "Search the catalogue and select a departure", "actor": "Traveler and Booker", "keyFacts": ["The website shows the departure calendar with live availability and the price tier valid at that moment for each date.", "Departures below minimum participants show as bookable but carry the guaranteed/not-yet-guaranteed status transparently."], "painPoints": ["Websites that show brochure prices and 'request availability' convert far worse than real-time booking.", "Hidden 'not guaranteed' status leads to angry customers when a departure is cancelled."], "dependencies": [{"type": "brick", "id": "webs", "name": "Customer Website, CMS and Online Booking", "description": "Catalogue and departure calendar.", "how": "Renders products and departures with live prices."}, {"type": "brick", "id": "dept", "name": "Departures and Capacity Management", "description": "Departure availability and status.", "how": "Provides seats left and guarantee status per date."}]}, {"id": "choose-seat-and-room", "title": "Choose a bus seat and room type", "actor": "Traveler and Booker", "keyFacts": ["The seat map of the assigned coach is shown at booking; travelers pick their seat and the seat is reserved immediately \u2014 a 1TIS hallmark for coach operators.", "Room types (double, single with supplement, triple) reduce hotel allotment per night as they are chosen."], "painPoints": ["Seat allocation done later by phone generates a wave of calls in  "Creates the deposit request and records the payment."}]}, {"id": "create-booking-file", "title": "Create the booking file and confirm", "actor": "Reservations and Sales Agent", "keyFacts": ["The booking file is created in the back office in real time with status confirmed, the seat, room, passengers, price tier and payment already attached.", "A contact record is created or matched, so the traveler's history starts here."], "painPoints": ["Website bookings that arrive as email to be re-keyed are the number-one source of desk errors.", "Duplicate contacts created per booking make marketing and history useless."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Booking file with all lines.", "how": "Stores the confirmed booking as the system of record."}, {"type": "brick", "id": "crmr", "name": "CRM and Contact Management", "description": "Contact matching and creation.", "how": "Links the booking to a single contact record."}]}, {"id": "send-confirmation-and-portal-access", "title": "Send confirmation and my-trip access", "actor": "Reservations and Sales Agent", "keyFacts": ["The confirmation email contains the invoice, the balance due date and a link to the traveler portal where documents will appear.", "Workflow rules schedule the balance reminder and passenger-data completion tasks automatically."], "painPoints": ["Confirmations typed by hand are inconsistent and miss legal information.", "Follow-up tasks left to memory are the reason balances go unpaid."], "dependencies": [{"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Automatic follow-up tasks.", "how": "Schedules reminders and data-completion tasks."}, {"type": "brick", "id": "comm", "name": "Email and Telephony Integration", "description": "Confirmation email.", "how": "Sends and logs the confirmation."}]}, {"id": "monitor-capacity-effect", "title": "Monitor the capacity and yield effect", "actor": "Group Travel Operations Manager", "keyFacts": ["Each booking updates the departure's load factor and may trigger the next price tier or the minimum-participant threshold.", "Operations sees departures approaching full, so a second coach or hotel allotment increase can be arranged in time."], "painPoints": ["Capacity checked once a week misses the moment to add a coach.", "Price tiers switched by hand lag behind demand."], "dependencies": [{"type": "brick", "id": "dept", "name": "Departures and Capacity Management", "description": "Load factor and thresholds per departure.", "how": "Updates capacity and flags thresholds crossed."}, {"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Automatic tier switching.", "how": "Applies the next price tier when the rule fires."}]}]}, {"id": "agent-books-at-the-desk-from-a-phone-inquiry", "title": "Agent Books at the Desk from a Phone Inquiry", "description": "A reservations agent turns a phone or email inquiry into an option or confirmed booking in one contact, including flights imported from the GDS and a payment link sent during the call.", "primaryActor": "Reservations and Sales Agent", "trigger": "A customer calls about a group trip seen in the brochure and wants to book for two with a specific seat and a flight from Amsterdam.", "successSignal": "The booking is confirmed in the same call, the payment link is paid and the customer receives the confirmation before hanging up.", "steps": [{"id": "identify-caller-and-open-contact", "title": "Identify the caller and open the contact", "actor": "Reservations and Sales Agent", "keyFacts": ["Caller identification opens the contact record and any open options before the agent says hello.", "Inbound emails are attached to the contact and can be turned into a booking with one action."], "painPoints": ["Agents asking 'have you booked with us before' start every call on the back foot.", "Emails in personal inboxes are handled twice or not at all."], "dependencies": [{"type": "brick", "id": "crmr", "name": "CRM and Contact Management", "description": "Contact record and open options.", "how": "Shows the caller's history and open items."}, {"type": "brick", "id": "comm", "name": "Email and Telephony Integration", "description": "Telephony and email integration.", "how": "Pops the contact on the call."}]}, {"id": "check-availability-and-price", "title": "Check availability, seat and price in one screen", "actor": "Reservations and Sales Agent", "keyFacts": ["The agent sees the same availability, seat map and price tier the website shows, plus agent-only options such as manual discounts within limits.", "Alternative departures are suggested when the requested one is full."], "painPoints": ["Switching between a brochure, a capacity sheet and a seat drawing takes minutes per call.", "Agents quoting a price different from the website destroy trust."], "dependencies": [{"type": "brick", "id": "dept", "name": "Departures and Capacity Management", "description": "Departure availability.", "how": "Shows seats left and status per departure."}, {"type": "brick", "id": "seat", "name": "Seat and Room Allocation", "description": "Seat map at the desk.", "how": "Lets the agent reserve the requested seat."}]}, {"id": "place-option-or-booking", "title": "Place an option or a confirmed booking", "actor": "Reservations and Sales Agent", "keyFacts": ["Options hold capacity and seat for a configurable period and expire automatically, releasing the seat.", "A confirmed booking creates the file with passengers, wishes and extras captured during the call."], "painPoints": ["Options never released block seats that could have been sold.", "Bookings written on paper and entered later lose the seat to a web booking in between."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Options and bookings.", "how": "Creates the file with option expiry or confirmed status."}, {"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Option expiry handling.", "how": "Expires options and releases capacity automatically."}]}, {"id": "import-flights", "title": "Import flights from the GDS or Airtrade", "actor": "Reservations and Sales Agent", "keyFacts": ["Flight segments booked in the GDS or through the Airtrade consolidator are imported by PNR into the booking file with fare, taxes and ticketing deadline.", "The ticketing deadline becomes a task so the ticket is issued before the fare expires."], "painPoints": ["Flight details typed from a GDS screen produce wrong times on travel documents.", "Missed ticketing deadlines cost the fare and the customer's trust."], "dependencies": [{"type": "brick", "id": "flgt", "name": "Flight Import and Ticket Settlement", "description": "PNR import and ticketing deadlines.", "how": "Imports flight lines and deadlines into the file."}]}, {"id": "send-payment-link-during-call", "title": "Send the payment link during the call", "actor": "Reservations and Sales Agent", "keyFacts": ["A deposit payment link is sent by email or SMS while the customer is on the line, and the payment status appears in the file within seconds.", "Paid deposit flips the booking from option to confirmed without agent action."], "painPoints": ["Waiting for a transfer means calling back days later to confirm.", "Manual payment matching delays confirmation even when the customer paid immediately."], "dependencies": [{"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Payment link and status.", "how": "Issues the link and registers the payment."}]}, {"id": "confirm-and-log-contact", "title": "Confirm and log the contact", "actor": "Reservations and Sales Agent", "keyFacts": ["Confirmation, invoice and portal invitation go out automatically; the call and its outcome are logged on the contact.", "Any follow-up (passport data, seat change request) becomes a task with an owner and due date."], "painPoints": ["Unlogged calls mean the next agent cannot answer 'what did we agree'.", "Follow-ups in sticky notes are lost."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Confirmed booking file.", "how": "Holds the confirmed booking and its history."}, {"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Follow-up tasks.", "how": "Creates tasks for open items."}]}, {"id": "handle-change-request", "title": "Handle a change request without re-keying", "actor": "Reservations and Sales Agent", "keyFacts": ["Changes to dates, passengers, seat or room are made on the file; price differences, change fees and a corrected invoice are calculated automatically.", "Every change is versioned and propagates to seat lists, room lists and supplier requests."], "painPoints": ["Changes handled by email outside the file are the reason room lists are wrong.", "Manual recalculation of change fees is inconsistent between agents."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Booking changes with versioning.", "how": "Applies and versions the change."}, {"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Corrected invoice.", "how": "Reissues the invoice with the difference."}]}]}], "outcomes": ["Higher online booking share, because the website sells real-time availability and prices from the back office instead of a request form", "Bookings confirmed in one contact at the desk, with capacity, seats, price and deposit handled in the same screen", "Zero re-keying between website, desk and booking file, so options, changes and payments carry the same data"], "brickDependencies": [{"targetBrickId": "webs", "type": "composition"}, {"targetBrickId": "book", "type": "composition"}, {"targetBrickId": "crmr", "type": "composition"}, {"targetBrickId": "comp", "type": "composition"}, {"targetBrickId": "The end-to-end operations flow for a fixed-date group departure, from the go/no-go decision through lists and portals to the day the coach leaves.", "primaryActor": "Group Travel Operations Manager", "trigger": "The minimum-participant deadline for a departure approaches and the departure dashboard flags it for decision.", "successSignal": "The coach leaves with a seating list, every hotel has a correct room list, and the guide has the participant list and documents in the portal.", "steps": [{"id": "decide-go-no-go", "title": "Decide go/no-go against minimum participants", "actor": "Group Travel Operations Manager", "keyFacts": ["The departure dashboard shows bookings versus the minimum, the legal cancellation deadline (20 days before departure for trips over six days, 7 days for two-to-six-day trips, 48 hours for shorter trips) and the margin at the current load.", "Operators often guarantee a departure below minimum when margin allows, or merge two departures to fill one coach."], "painPoints": ["Deadlines tracked outside the system lead to late cancellations and full refund obligations under the Package Travel Directive.", "Cancelling a departure that would have filled with the last two weeks of bookings loses revenue and reputation."], "dependencies": [{"type": "brick", "id": "dept", "name": "Departures and Capacity Management", "description": "Departure status, minimums and deadlines.", "how": "Presents the decision data and records the go/no-go."}, {"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Deadline alerts.", "how": "Raises the decision task before the legal deadline."}]}, {"id": "rebook-or-merge-if-cancelled", "title": "Rebook or merge participants if a departure is cancelled", "actor": "Reservations and Sales Agent", "keyFacts": ["Participants of a cancelled departure are offered an alternative date or a full refund; rebooking moves the file including seat and room wishes.", "Merging two departures re-runs seat and room allocation for the combined group."], "painPoints": ["Rebooking by phone without moving the file duplicates bookings.", "Refunds processed late breach the 14-day refund rule of the Package Travel Directive."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Rebooking and cancellation on the file.", "how": "Moves or cancels files with full history."}, {"type": "brick", "id": "dept", "name": "Departures and Capacity Management", "description": "Merged departures.", "how": "Combines capacity and bookings of merged departures."}]}, {"id": "allocate-seats-and-rooms", "title": "Allocate bus seats and hotel rooms", "actor": "Group Travel Operations Manager", "keyFacts": ["Seats reserved at booking are checked against the final coach; travelers who did not choose are placed by rule (couples together, mobility needs in front).", "Room allocation groups passengers per booking into the room types sold and flags mismatches against the hotel allotment."], "painPoints": ["Seat drawings on paper are redone for every late change.", "Room lists that do not match the sold room types cause check-in chaos."], "dependencies": [{"type": "brick", "id": "seat", "name": "Seat and Room Allocation", "description": "Seat and room allocation.", "how": "Finalises seats and rooms per departure."}, {"type": "brick", "id": "pass", "name": "Passenger Data and Operational Lists", "description": "Passenger data behind the allocation.", "how": "Provides names, companions and needs per passenger."}]}, {"id": "send-room-lists-to-hotels", "title": "Send room lists with dietary wishes to hotels", "actor": "Group Travel Operations Manager", "keyFacts": ["Each hotel receives a room list for its nights with names, room types, arrival and departure and dietary or accessibility wishes, generated from the booking files.", "Hotels with portal access download the current list themselves and confirm it; others receive it by email from the supplier record  "painPoints": ["Guides working from printed lists cannot see changes made after printing.", "Sharing full passenger data by email violates privacy expectations."], "dependencies": [{"type": "brick", "id": "guid", "name": "Guide and Group Leader Portal", "description": "Guide portal with participant list.", "how": "Gives the guide the live list and documents."}, {"type": "brick", "id": "pass", "name": "Passenger Data and Operational Lists", "description": "Participant data for guides.", "how": "Provides the guide view of passenger data."}]}, {"id": "issue-travel-documents", "title": "Issue travel documents to participants", "actor": "Reservations and Sales Agent", "keyFacts": ["Travel documents (itinerary, vouchers, hotel list, pickup time) are generated per booking and published in the traveler portal a fixed number of days before departure.", "Documents are regenerated automatically when the seat, pickup or hotel changes."], "painPoints": ["Documents mailed by hand are late and inconsistent.", "Static PDFs do not reflect last-minute changes."], "dependencies": [{"type": "brick", "id": "docs", "name": "Travel Documents and Itinerary Delivery", "description": "Travel documents per booking.", "how": "Generates and publishes the documents."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Booking file as the document source.", "how": "Provides the confirmed data for documents."}]}, {"id": "run-departure-day", "title": "Run departure day and handle no-shows", "actor": "Group Travel Operations Manager", "keyFacts": ["On departure day the guide checks in participants in the portal; no-shows update the lists and hotels in real time.", "The departure is closed operationally, releasing unused allotments and feeding actual participant counts to finance."], "painPoints": ["No-shows reported by phone to the office are not passed to the hotels.", "Actual participant counts unknown to finance delay supplier settlement."], "dependencies": [{
