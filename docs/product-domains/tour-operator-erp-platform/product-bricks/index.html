ers-and-partners.png", "type": "outcome-based-stream", "description": "Take the operator's products to reseller agents, independent agents and partner channels: give resellers a portal to book, quote and retrieve documents for their clients without phone calls, feed products to partner channels through the integration hub, import partner bookings into the same booking files, and settle commissions correctly.", "group": "Traveler, Market and Steering Journeys", "rootGroup": "Traveler, Market and Steering Journeys", "flows": [{"id": "reseller-books-a-product-in-the-portal", "title": "A Reseller Books a Product in the Portal", "description": "A travel agent books an operator's group tour for a client in the reseller portal, from availability check to documents.", "primaryActor": "Reseller Travel Agent", "trigger": "A client of a retail travel agent asks for a specific coach tour date.", "successSignal": "The reseller has booked, the client's documents are retrievable in the portal and the commission is recorded, without a call to the operator.", "steps": [{"id": "log-in-with-agency-account", "title": "Log in with the agency account", "actor": "Reseller Travel Agent", "keyFacts": ["Reseller users belong to an agency with agreed commission and payment terms; access rights are managed per agency by the operator.", "Independent (ZRA-style) agents are supported as one-person agencies."], "painPoints": ["Shared logins make it impossible to know who booked.", "Onboarding agencies by hand delays new distribution."], "dependencies": [{"type": "brick", "id": "iden", "name": "Identity, Tenants and Access", "description": "Agency accounts and roles.", "how": "Authenticates reseller users per agency."}, {"type": "brick", "id": "rsel", "name": "Reseller and Agent Portal", "description": "Agency profile and terms.", "how": "Holds commission and payment terms."}]}, {"id": "search-availability-and-net-price", "title": "Search availability and see net or gross prices", "actor": "Reseller Travel Agent", "keyFacts": ["The portal shows live availability, seat map and either gross price with commission or net price, according to the agency terms.", "Product content and photos come from the same catalogue as the website."], "painPoints": ["Resellers calling to check availability defeat the purpose of a portal.", "Portals with brochure prices only cannot close a sale."], "dependencies": [{"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Commission and net pricing.", "how": "Applies agency pricing rules."}, {"type": "brick", "id": "comp", "name": "Components, Inventory and Availability", "description": "Live availability.", "how": "Supplies seats and rooms available."}]}, {"id": "quote-client", "title": "Quote the client from the portal", "actor": "Reseller Travel Agent", "keyFacts": ["A branded quote for the client, with the agency's own logo, is generated from the portal and can be turned into a booking later.", "Options hold capacity for the reseller for a limited time."], "painPoints": ["Quotes typed by the agent contain wrong inclusions.", "Without options, the seat is gone when the client decides."], "dependencies": [{"type": "brick", "id": "rsel", "name": "Reseller and Agent Portal", "description": "Reseller quotes and options.", "how": "Creates quotes and options for the agency."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Option on the file.", "how": "Holds capacity as an option."}]}, {"id": "book-and-enter-passengers", "title": "Book and enter the client's passengers", "actor": "Reseller Travel Agent", "keyFacts": ["The reseller books with passenger data, seat and wishes; the booking file is created with the agency as booker and the passengers as travelers.", "The operator's desk sees the booking like any other file."], "painPoints": ["Bookings emailed by resellers are re-keyed by the desk.", "Files that mix agency and traveler contact data confuse communication."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Reseller booking file.", "how": "Creates the file with agency and passengers."}, {"type": "brick", "id": "rsel", "name": "Reseller and Agent Portal", "description": "Reseller booking form.", "how": "Captures the booking in the portal."}]}, {"id": "invoice-with-commission", "title": "Receive the invoice with commission applied", "actor": "Reseller Travel Agent", "keyFacts": ["The invoice to the agency reflects the agreed net or commission model; the traveler receives no invoice from the operator unless configured.", "Payment terms may allow the agency to pay at balance date only."], "painPoints": ["Invoices sent to the traveler instead of the agency breach the agency relationship.", "Commission errors are the main cause of reseller disputes."], "dependencies": [{"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Agency invoicing.", "how": "Issues invoices under agency terms."}, {"type": "brick", "id": "rsel", "name": "Reseller and Agent Portal", "description": "Agency terms.", "how": "Provides the invoicing model."}]}, {"id": "retrieve-documents-for-client", "title": "Retrieve documents for the client", "actor": "Reseller Travel Agent", "keyFacts": ["Travel documents appear in the reseller portal with the agency branding option and can be forwarded to the client.", "Changes made by the operator are visible in the portal with notifications."], "painPoints": ["Resellers asking the operator for documents by phone cost both sides time.", "Clients receiving documents with a brand they never dealt with are confused."], "dependencies": [{"type": "brick", "id": "docs", "name": "Travel Documents and Itinerary Delivery", "description": "Reseller-branded documents.", "how": "Generates documents with agency branding."}, {"type": "brick", "id": "rsel", "name": "Reseller and Agent Portal", "description": "Document retrieval in the portal.", "how": "Makes documents available to the agency."}]}, {"id": "change-or-cancel-for-client", "title": "Change or cancel on behalf of the client", "actor": "Reseller Travel Agent", "keyFacts": ["Changes and cancellations follow the same conditions and fee ladders as direct bookings and are processed in the portal.", "The operator's operations lists update automatically."], "painPoints": ["Reseller changes by email are missed in room and seat lists.", "Cancellation fees calculated differently for resellers cause disputes."], "dependencies": [{"type": "brick", "id": "rsel", "name": "Reseller and Agent Portal", "description": "Changes in the portal.", "how": "Lets the agency change or cancel."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Change processing on the file.", "how": "Applies the change and fees."}]}]}, {"id": "publish-to-partner-channels-and-import-bookings", "title": "Publish to Partner Channels and Import Bookings", "description": "Feed products to partner channels through the integration hub and receive their bookings as native booking files.", "primaryActor": "Travel Company Owner", "trigger": "The owner signs a distribution agreement with a travel-agency consortium and a niche marketplace.", "successSignal": "Products are live on the partner channels with correct prices and availability and partner bookings appear as normal files with the partner as reseller.", "steps": [{"id": "configure-partner-channel", "title": "Configure the partner channel and its terms", "actor": "Travel Company Owner", "keyFacts": ["Each partner channel is registered with its product selection, price rules, commission and the technical connection type.", "Channels can receive a subset of products, for example only guaranteed departures."], "painPoints": ["Sending the whole catalogue to every partner exposes unsuitable products.", "Terms kept in contracts but not in the system cause wrong commissions."], "dependencies": [{"type": "brick", "id": "intg", "name": "Integration Hub and Partner APIs", "description": "Partner channel configuration.", "how": "Registers the channel and its connection."}, {"type": "brick", "id": "rsel", "name": "Reseller and Agent Portal", "description": "Partner as reseller with terms.", "how": "Holds commission and product selection."}]}, {"id": "export-product-feed", "title": "Export the product feed with prices and availability", "actor": "Travel Company Owner", "keyFacts": ["A structured feed with products, departures, prices and availability is exported on schedule or on change to the partner's API.", "Feed content is the same catalogue the website uses, so partners never show stale data."], "painPoints": ["Partners working from a brochure PDF sell cancelled departures.", "Hand-maintained partner spreadsheets lag price changes."], "dependencies": [{"type": "brick", "id": "intg", "name": "Integration Hub and Partner APIs", "description": "Product feed export.", "how": "Publishes the feed to the partner."}, {"type": "brick", "id": "prod", "name": "Travel Products and Packages", "description": "Product data for the feed.", "how": "Provides the products and departures."}]}, {"id": "receive-partner-booking", "title": "Receive a partner booking through the API", "actor": "Reservations and Sales Agent", "keyFacts": ["Partner bookings arrive through the integration hub and create a booking file with the partner as reseller and the passengers attached.", "Validation rejects bookings that no longer fit availability, returning a clear reason."], "painPoints": ["Partner bookings by email are re-keyed and often overbook.", "Silent rejections leave the partner without a reason."], "dependencies": [{"type": "brick", "id": "intg", "name": "Integration Hub and Partner APIs", "description": "Booking import API.", "how": "Receives and validates partner bookings."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Booking file from the partner booking.", "how": "Creates the file with the partner as booker."}]}, {"id": "confirm-and-return-status", "title": "Confirm and return the status to the partner", "actor": "Reservations and Sales Agent", "keyFacts": ["Confirmation, invoice and document status flow back to the partner through the API so the partner's agents can inform the client.", "Changes made by the operator are pushed to the partner as events."], "painPoints": ["Partners not informed of a cancelled departure sell it anyway.", "Status by email is not visible in the partner's system."], "dependencies": [{"type": "brick", "id": "intg", "name": "Integration Hub and Partner APIs", "description": "Status and event push to the partner.", "how": "Returns confirmation and changes."}, {"type": "brick", "id": "docs", "name": "Travel Documents and Itinerary Delivery", "description": "Documents for partner clients.", "how": "Makes documents available through the channel."}]}, {"id": "settle-partner-commissions", "title": "Settle partner commissions", "actor": "Finance and Administration Lead", "keyFacts": ["Commission statements per partner are generated from the bookings and matched with the partner's own statement.", "Disputes reference the individual booking."], "painPoints": ["Commission reconciled by spreadsheet is a monthly fight.", "Unmatched statements delay payment to the partner."], "dependencies": [{"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Commission statements.", "how": "Generates partner commission statements."}]}, {"id": "review-channel-performance", "title": "Review channel performance", "actor": "Travel Company Owner", "keyFacts": ["Bookings, margin after commission and cancellation rate per channel are compared with direct sales.", "The owner decides where to invest and which channels to prune."], "painPoints": ["Channels judged on gross bookings hide their true margin.", "Without cancellation data, high-cancel channels look attractive."], "dependencies": [{"type": "brick", "id": "rsel", "name": "Reseller and Agent Portal", "description": "Channel and reseller data.", "how": "Provides the channel attribution."}]}]}], "outcomes": ["Higher portal booking share among resellers, because the portal shows the same live availability, seats and prices as the desk", "Lower reseller handling time per booking, since quotes, documents and changes are self-service", "Partner channel bookings that arrive as normal booking files, not emails to re-key"], "brickDependencies": [{"targetBrickId": "rsel", "type": "composition"}, {"targetBrickId": "prod", "type": "composition"}, {"targetBrickId": "comp", "type": "composition"}, {"targetBrickId": "pric", "type": "composition"}, {"targetBrickId": "book", "type": "composition"}, {"targetBrickId": "docs", "type": "composition"}, {"targetBrickId": "invc", "type": "composition"}, {"targetBrickId": "intg", "type": "composition"}, {"targetBrickId": "iden", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "Partner Channel and Agency Systems", "type": "distribution-partner", "interface": "Product feed export and booking import API", "description": "Travel-agency consortia, affiliate networks and niche marketplaces that resell the operator's products."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []}, {"id": "steer-the-travel-business-with-insight", "name": "Steer the Travel Business with Insight", "icon": "steer-the-travel-business-with-insight.png", "type": "outcome-based-stream", "description": "Take the owner and finance lead from transaction data \u2014 bookings, departures, invoices, supplier costs, campaigns \u2014 to BI dashboards, margin analysis, demand forecasts and KPI steering, so that capacity, pricing and headcount decisions are made on the platform's numbers rather than on gut feel and spreadsheets.", "group": "Traveler, Market and Steering Journeys", "rootGroup": "Traveler, Market and Steering Journeys", "flows": [{"id": "from-transaction-data-to-weekly-steering", "title": "From Transaction Data to Weekly Steering", "description": "The recurring steering loop: data refresh, dashboards, KPI review, decisions and actions back into the operation.", "primaryActor": "Travel Company Owner", "trigger": "The weekly management meeting is scheduled and the dashboards refresh overnight.", "successSignal": "Decisions on pricing, capacity and follow-up are taken from the dashboards and turned into tasks and rule changes in the ERP.", "steps": [{"id": "refresh-data-model", "title": "Refresh the analytical data model", "actor": "Finance and Administration Lead", "keyFacts": ["Bookings, departures, invoices, payments, supplier costs, campaigns and complaints are loaded nightly into the analytical model, per tenant.", "Definitions (booking, passenger, revenue, margin) are fixed once so every dashboard uses the same numbers."], "painPoints": ["Exports to Excel every Monday produce a different number per person.", "Undefined metrics turn every meeting into a debate about the data."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Analytical data model.", "how": "Loads and harmonises the data nightly."}, {"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Invoice and payment data.", "how": "Supplies revenue and receivables."}]}, {"id": "review-north-star-kpis", "title": "Review the north-star KPIs", "actor": "Travel Company Owner", "keyFacts": ["The owner dashboard shows revenue per FTE, operating margin, online booking share, quote-to-booking conversion and days to close, with trends and targets.", "Each KPI drills down to the departures, agents or products behind it."], "painPoints": ["KPIs presented once a quarter are too late to act on the season.", "Dashboards without drill-down invite speculation about causes."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "KPI dashboards with drill-down.", "how": "Presents north-star KPIs and trends."}]}, {"id": "analyse-margin-and-load", "title": "Analyse margin and load factor per departure and product", "actor": "Travel Company Owner", "keyFacts": ["Sold versus realised margin and load factor per departure identify products to reprice, merge or drop.", "Supplier cost trends highlight contracts to renegotiate."], "painPoints": ["Product decisions made on revenue alone keep loss-making departures alive.", "Supplier cost creep unnoticed erodes a whole season."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Margin and load analysis.", "how": "Analyses margin and load per departure."}, {"type": "brick", "id": "acct", "name": "Accounting Integration and Supplier Settlement", "description": "Realised supplier cost.", "how": "Supplies matched purchase costs."}]}, {"id": "analyse-sales-and-service-performance", "title": "Analyse sales and service performance per agent and channel", "actor": "Travel Company Owner", "keyFacts": ["Conversion, handling time, first-contact resolution and proposal turnaround are shown per agent, specialist and channel.", "Complaint and survey scores per guide, hotel and product complete the picture."], "painPoints": ["Agents judged on booking counts alone ignore margin and service.", "Service quality unmeasured per supplier repeats bad choices."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Sales and service dashboards.", "how": "Reports per agent, channel and supplier."}, {"type": "brick", "id": "crmr", "name": "CRM and Contact Management", "description": "Contact and interaction data.", "how": "Supplies conversion and handling data."}]}, {"id": "decide-and-act", "title": "Decide and turn decisions into actions", "actor": "Travel Company Owner", "keyFacts": ["Decisions become concrete changes: a price tier adjusted, a departure merged, a supplier flagged, a follow-up campaign \u2014 each created as a rule change or a task from the meeting.", "The AI assistant summarises the week's anomalies and proposes actions for review."], "painPoints": ["Decisions minuted but not executed are the norm without a task system.", "Owners drowning in dashboards need a summary, not more charts."], "dependencies": [{"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Decisions as tasks.", "how": "Creates tasks with owners and due dates."}, {"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Price rule changes.", "how": "Applies repricing decisions."}]}, {"id": "track-compliance-and-risk", "title": "Track compliance and financial risk indicators", "actor": "Finance and Administration Lead", "keyFacts": ["Guarantee-fund exposure, overdue receivables, unconfirmed services near departure and open complaints are tracked as risk indicators.", "Thresholds alert the owner before a risk becomes a regulatory or cash problem."], "painPoints": ["Risk seen only in the annual audit is seen too late.", "Exposure to the guarantee fund unknown surprises the owner at contribution time."], "dependencies": [{"type": "brick", "id": "gfnd", "name": "Guarantee Fund and Regulatory Reporting", "description": "Exposure and compliance indicators.", "how": "Supplies fund exposure and compliance status."}, {"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Risk dashboards and alerts.", "how": "Presents risk indicators with thresholds."}]}]}, {"id": "forecast-demand-and-decide-capacity", "title": "Forecast Demand and Decide Capacity", "description": "Use booking curves and history to forecast demand per product and departure, and decide capacity and pricing for the coming season.", "primaryActor": "Travel Company Owner", "trigger": "Planning for next season's series start minimums", "actor": "Group Travel Operations Manager", "keyFacts": ["The number of departures, coach size, hotel allotments and minimum participants per departure are set from the forecast and margin scenarios.", "Decisions feed directly into the departure series and purchasing targets."], "painPoints": ["Capacity decisions disconnected from the product setup are re-entered by hand.", "Minimums set too high cancel departures that would have filled."], "dependencies": [{"type": "brick", "id": "dept", "name": "Departures and Capacity Management", "description": "Departure series and capacity.", "how": "Applies the capacity decisions to departures."}]}, {"id": "set-yield-strategy", "title": "Set the yield and pricing strategy", "actor": "Travel Company Owner", "keyFacts": ["Early-bird tiers, load-based tiers and last-minute rules are set per product from the forecast and last year's realised prices.", "Rules are simulated against the curve before activation."], "painPoints": ["Prices set by gut feel leave money on strong departures and empty weak ones.", "Untested rules produce surprising prices on the website."], "dependencies": [{"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Yield rules and simulation.", "how": "Configures and simulates tiered pricing."}, {"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Realised price and demand analysis.", "how": "Supplies price history and curves."}]}, {"id": "monitor-season-against-forecast", "title": "Monitor the season against forecast with early warnings", "actor": "Travel Company Owner", "keyFacts": ["During the booking season the actual curve is tracked against forecast; deviations raise alerts to adjust prices, campaigns or capacity in time.", "Each alert links to the action that can be taken in the ERP."], "painPoints": ["Deviations discovered at the go/no-go deadline are too late to fix.", "Alerts without an action path are ignored."], "dependencies": [{"type": "brick", "id": "bint", "name": "Business Intelligence and Reporting", "description": "Forecast tracking and alerts.", "how": "Compares actuals to forecast and alerts."}, {"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Alerts as tasks.", "how": "Turns deviations into actionable tasks."}]}]}], "outcomes": ["Revenue per FTE tracked and improved, because the owner sees where handling time goes and which processes scale", "Capacity and pricing decisions taken on load-factor and margin data per departure, weeks earlier than before", "One set of numbers shared by sales, operations and finance, closing the gap between sold and realised margin"], "brickDependencies": [{"targetBrickId": "bint", "type": "composition"}, {"targetBrickId": "book", "type": "composition"}, {"targetBrickId": "invc", "type": "composition"}, {"targetBrickId": "dept", "type": "composition"}, {"targetBrickId": "pric", "type": "composition"}, {"targetBrickId": "crmr", "type": "composition"}, {"targetBrickId": "acct", "type": "composition"}, {"targetBrickId": "gfnd", "type": "composition"}, {"targetBrickId": "wflw", "type": "composition"}, {"targetBrickId": "aiaa", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "Travel Intelligence BI", "type": "analytics-platform", "interface": "Nightly data export and dashboard embedding", "description": "Trade-specific BI dashboards for bookings, margin, load factor and forecast."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []}], "streams": [{"id": "build-and-price-travel-products", "name": "Build and Price Travel Products", "icon": "build-and-price-travel-products.png", "type": "outcome-based-stream", "description": "Take a travel organisation from negotiated supplier contracts to sellable packages, fixed-date departures, series and individual components with prices, yield rules and group calculations, so that every channel \u2014 desk, website, reseller portal and Visual Tour Builder \u2014 sells from one product master instead of a brochure spreadsheet.", "group": "Product and Sales Journeys", "rootGroup": "Product and Sales Journeys", "flows": [{"id": "contract-compose-and-price-a-departure-series", "title": "Contract, Compose and Price a Group Departure Series", "description": "From a hotel and coach contract to a published series of fixed-date departures with tiered yield pricing and minimum-participant rules.", "primaryActor": "Group Travel Operations Manager", "trigger": "The season's purchasing round closes and contracted rates arrive from hotels, coach companies and DMCs.", "successSignal": "The series is live on the website with correct prices, capacity and cancellation deadlines per departure.", "steps": [{"id": "register-supplier-contracts", "title": "Register supplier contracts and purchase rates", "actor": "Group Travel Operations Manager", "keyFacts": ["A coach round trip typically combines one coach contract, six to ten hotel contracts, ferry or toll components and a local DMC agreement per departure.", "Contracts carry allotments, release dates, child and single-room supplements and currency, all of which drive the group calculation later."], "painPoints": ["Contract terms living in email attachments mean release dates are missed and rooms are paid for that were never sold.", "Re-keying the same hotel rates into a purchase sheet and a sales sheet is the top source of margin errors."], "dependencies": [{"type": "brick", "id": "cont", "name": "Purchasing and Supplier Contracts", "description": "Stores supplier contracts, allotments and release dates.", "how": "Captures each contract once as the purchasing basis for every product that uses it."}, {"type": "brick", "id": "supl", "name": "Supplier Management and Communication", "description": "Supplier master data and communication history.", "how": "Links the contract to the supplier record and its contacts."}]}, {"id": "compose-components", "title": "Compose components and inventory", "actor": "Group Travel Operations Manager", "keyFacts": ["A component is a reusable accommodation, transport or activity block with its own availability, so a hotel night can be used in a group series and in a tailor-made itinerary alike.", "Allotment and on-request components behave differently at booking time: allotment sells immediately, on-request needs a supplier confirmation."], "painPoints": ["Duplicated components per product make a single hotel rate change a multi-hour edit.", "Unclear allotment versus on-request status leads agents to confirm rooms that do not exist."], "dependencies": [{"type": "brick", "id": "comp", "name": "Components, Inventory and Availability", "description": "Reusable components with inventory and availability.", "how": "Turns contract lines into bookable components with allotment rules."}]}, {"id": "build-package-and-itinerary", "title": "Build the package and day-by-day itinerary", "actor": "Group Travel Operations Manager", "keyFacts": ["A package fixes the sequence of components per day and the inclusions and exclusions shown to the traveler.", "Package templates are cloned per season so that only dates, prices and changed hotels need editing."], "painPoints": ["Itineraries copied by hand into the website CMS drift from what operations actually runs.", "Inclusion texts written per product instead of per component are inconsistent across the catalogue."], "dependencies": [{"type": "brick", "id": "prod", "name": "Travel Products and Packages", "description": "Packages and their day-by-day structure.", "how": "Assembles components into a sellable package with itinerary and inclusions."}, {"type": "brick", "id": "ctnt", "name": "Travel Content and Media Management", "description": "Photos, texts and media per product and destination.", "how": "Attaches destination texts and MediaSpirit-style photo sets to the package."}]}, {"id": "generate-departures", "title": "Generate the departure series with capacity", "actor": "Group Travel Operations Manager", "keyFacts": ["A series generates fixed-date departures from a rhythm (for example every Saturday from April to October) with capacity per departure derived from coach size and hotel allotments.", "Each departure carries a minimum number of participants; under the Package Travel Directive the operator must cancel at least 20 days before departure for trips longer than six days if that minimum is not met."], "painPoints": ["Creating departures one by one invites date and capacity typos that surface only when a bus is overbooked.", "Minimum-participant deadlines tracked in a wall calendar are missed, exposing the operator to full refunds."], "dependencies": [{"type": "brick", "id": "dept", "name": "Departures and Capacity Management", "description": "Departures with capacity, minimums and deadlines.", "how": "Generates the departure series and stores capacity and go/no-go deadlines."}]}, {"id": "run-group-calculation", "title": "Run the group calculation and set tiered yield prices", "actor": "Group Travel Operations Manager", "keyFacts": ["The group calculation divides fixed costs (coach, guide, ferry) over the expected participant count and adds variable costs per person to reach a break-even and target-margin price.", "Yield tiers raise or lower the price by departure and by booking window, for example an early-bird price until a fixed date and a higher price when the bus is more than 80% full."], "painPoints": ["Calculations kept in personal spreadsheets cannot be reproduced when finance asks why a departure lost money.", "Manual price updates per departure lag behind demand, so full buses are sold at early-bird prices."], "dependencies": [{"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Pricing, yield rules and group calculations.", "how": "Computes break-even, target-margin and tiered prices per departure."}]}, {"id": "review-margin-and-approve", "title": "Review margin and approve the product for sale", "actor": "Travel Company Owner", "keyFacts": ["The owner sees expected margin per departure at the minimum, break-even and full-bus scenario before a single seat is sold.", "Approval locks the price list and cancellation deadlines that finance and the website will use."], "painPoints": ["Without a scenario view, owners approve products that only break even at a full bus.", "Late price corrections after publication create different prices for the same departure across channels."], "dependencies": [{"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Margin scenarios per departure.", "how": "Presents minimum, break-even and full-capacity margin for approval."}, {"type": "brick", "id": "prod", "name": "Travel Products and Packages", "description": "Product status and publication control.", "how": "Sets the product to sellable once approved."}]}, {"id": "publish-to-channels", "title": "Publish to website, desk and reseller channels", "actor": "Group Travel Operations Manager", "keyFacts": ["Publication pushes the same product, prices and real-time availability to the customer website, the booking desk and the reseller portal.", "Content, price and availability changes after publication propagate automatically instead of via a CMS edit."], "painPoints": ["A separately maintained website catalogue is the main reason customers see a price that the desk cannot honour.", "Unpublished changes to inclusions cause complaints when the trip differs from what was sold."], "dependencies": [{"type": "brick", "id": "webs", "name": "Customer Website, CMS and Online Booking", "description": "Customer website and online booking.", "how": "Renders the approved product with live prices and availability."}, {"type": "brick", "id": "prod", "name": "Travel Products and Packages", "description": "Product master as the single source for all channels.", "how": "Distributes one product definition to every channel."}]}]}, {"id": "maintain-components-and-content-for-tailor-made-selling", "title": "Maintain Components and Content for Tailor-Made Selling", "description": "Keep the component library, sample itineraries and media current so specialists can compose proposals from stored, correctly priced building blocks.", "primaryActor": "Tailor-Made Travel Specialist", "trigger": "A destination manager receives new season rates from lodges, transfers and excursions in a destination.", "successSignal": "Every component in the destination has valid rates, content and photos for the coming season and appears in the Visual Tour Builder.", "steps": [{"id": "update-destination-rates", "title": "Update destination component rates and validity", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Tailor-made specialists maintain hundreds of lodges, transfers and excursions per destination, each with seasonal rate bands and validity dates.", "Rates are held in supplier currency and converted at booking with a configurable margin on the exchange rate."], "painPoints": ["Rate sheets in PDF are re-typed per season, which is where wrong nights and wrong seasons creep in.", "Missing validity dates make expired rates appear in proposals for next year."], "dependencies": [{"type": "brick", "id": "comp", "name": "Components, Inventory and Availability", "description": "Component rates with seasonal validity.", "how": "Stores rate bands per season and currency."}, {"type": "brick", "id": "cont", "name": "Purchasing and Supplier Contracts", "description": "Supplier contract terms behind the rates.", "how": "Keeps the contractual basis for each rate band."}]}, {"id": "curate-content-and-media", "title": "Curate destination content and photos", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Each component carries description texts in the tenant's languages and a curated photo set that the Visual Tour Builder places into proposals automatically.", "Photo rights and supplier-provided imagery are tracked per asset so that proposals never use unlicensed images."], "painPoints": ["Specialists searching shared drives for photos spend more time on layout than on the itinerary.", "Outdated lodge photos are the leading cause of 'this is not what we booked' complaints."], "dependencies": [{"type": "brick", "id": "ctnt", "name": "Travel Content and Media Management", "description": "Content and media library per component.", "how": "Provides the texts and photos that proposals reuse."}]}, {"id": "build-sample-itineraries", "title": "Build sample itineraries as starting points", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["A sample itinerary is a stored sequence of components \u2014 for example a 14-day Tanzania safari \u2014 used as the first draft for most requests.", "Sample itineraries are also published to the website as inspiration and are directly requestable by the traveler."], "painPoints": ["Every proposal started from a blank page is slower and less consistent than one started from a template.", "Samples that are not re-priced each season mislead customers on the website."], "dependencies": [{"type": "brick", "id": "prod", "name": "Travel Products and Packages", "description": "Products that wrap sample itineraries for publication.", "how": "Publishes samples as requestable products."}]}, {"id": "set-margin-rules", "title": "Set margin and pricing rules per component type", "actor": "Travel Company Owner", "keyFacts": ["Margin targets differ per component type \u2014 accommodation, international flights and local transfers rarely carry the same markup.", "Rules can also apply per customer segment or reseller so that agent bookings automatically carry the agreed commission."], "painPoints": ["Margins applied by hand in each proposal vary per specialist and are hard to audit.", "A single wrong markup rule silently underprices a whole destination."], "dependencies": [{"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Margin and markup rules.", "how": "Applies configurable margins per component type and channel."}]}, {"id": "verify-supplier-terms", "title": "Verify supplier payment and cancellation terms", "actor": "Finance and Administration Lead", "keyFacts": ["Supplier cancellation terms determine the operator's own cancellation ladder toward the traveler under the Package Travel Directive.", "Prepayment requirements per supplier drive the cash-flow planning for the season."], "painPoints": ["Unknown supplier deadlines turn every customer cancellation into a negotiation.", "Prepayment obligations not visible to finance cause surprise outflows."], "dependencies": [{"type": "brick", "id": "cont", "name": "Purchasing and Supplier Contracts", "description": "Supplier terms and prepayment rules.", "how": "Records cancellation ladders and prepayment obligations."}, {"type": "brick", "id": "supl", "name": "Supplier Management and Communication", "description": "Supplier records and contacts.", "how": "Keeps the accountable supplier contact for each term."}]}, {"id": "release-to-builder", "title": "Release the destination library to the builder and website", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Released components become draggable blocks in the Visual Tour Builder and searchable on the SPoE website.", "Release checks flag components without price, photo or validity before they reach a proposal."], "painPoints": ["Incomplete components discovered during a customer call embarrass the specialist.", "Unreleased updates leave the website showing last year's itineraries."], "dependencies": [{"type": "brick", "id": "webs", "name": "Customer Website, CMS and Online Booking", "description": "Destination pages and inspiration itineraries.", "how": "Publishes released content on the website."}]}]}], "outcomes": ["One product master feeds every sales channel, so prices and availability never diverge between brochure, website and desk", "Departure margins are known before the first booking, because group calculations tie purchase cost, minimum participants and yield tiers together", "Seasonal product setup takes days instead of weeks, with contracts, content and pricing reused across seasons"], "brickDependencies": [{"targetBrickId": "prod", "type": "composition"}, {"targetBrickId": "comp", "type": "composition"}, {"targetBrickId": "pric", "type": "composition"}, {"targetBrickId": "cont", "type": "composition"}, {"targetBrickId": "ctnt", "type": "composition"}, {"targetBrickId": "supl", "type": "composition"}, {"targetBrickId": "webs", "type": "composition"}, {"targetBrickId": "dept", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "Bed-Bank and Supplier Content Feeds", "type": "supply-integration", "interface": "Availability, rate and content APIs", "description": "Live accommodation and activity content that feeds components, availability and pricing."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []}, {"id": "quote-and-sell-tailor-made-trips", "name": "Quote and Sell Tailor-Made Trips", "icon": "quote-and-sell-tailor-made-trips.png", "type": "outcome-based-stream", "description": "Take a tailor-made specialist from an inbound travel wish to an accepted visual proposal and an opened trip file: capture the lead in the CRM, compose a day-by-day itinerary by dragging stored components into the Visual Tour Builder, price it at target margin, publish the proposal online for the client to review and approve, iterate on changes, and convert the accepted proposal into a booking file without re-entering a single line.", "group": "Product and Sales Journeys", "rootGroup": "Product and Sales Journeys", "flows": [{"id": "from-travel-wish-to-approved-visual-proposal", "title": "From Travel Wish to Approved Visual Proposal", "description": "The core Visual Tour Builder flow: qualify the lead, compose and price the itinerary, publish it online and convert the approval into a trip file.", "primaryActor": "Tailor-Made Travel Specialist", "trigger": "A traveler submits a request form on the website or calls with a wish such as 'three weeks Namibia self-drive in October for a family of four'.", "successSignal": "The client approves the proposal online, pays the deposit and a trip file exists with all components and the target margin.", "steps": [{"id": "capture-and-qualify-lead", "title": "Capture and qualify the travel wish", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Website request forms, inbound email and phone calls land as leads on the contact record, with travel dates, party, budget and interests captured in structured fields.", "Inbound email and calls are matched to the contact automatically, so the specialist sees earlier trips and open proposals before answering."], "painPoints": ["Leads spread over personal mailboxes are followed up late or twice.", "Unstructured wishes force a second call before any drafting can start."], "dependencies": [{"type": "brick", "id": "crmr", "name": "CRM and Contact Management", "description": "Contact, lead and interaction history.", "how": "Creates the lead against the contact with structured wish data."}, {"type": "brick", "id": "comm", "name": "Email and Telephony Integration", "description": "Email and telephony linked to the contact.", "how": "Attaches the inbound email or call to the lead."}]}, {"id": "draft-with-ai-assistant", "title": "Draft a first outline with the AI assistant", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["The AI office assistant reads the wish and proposes a route outline and candidate sample itineraries from the tenant's own library, not from the open internet.", "The specialist keeps full control: the assistant suggests, the human composes and prices."], "painPoints": ["Blank-page drafting is the slowest part of the specialist's day.", "Generic AI text that ignores the operator's own stock of lodges creates proposals that cannot be delivered."], "dependencies": [{"type": "brick", "id": "aiaa", "name": "AI Office Assistants", "description": "AI assistance for proposal drafting.", "how": "Suggests routes and sample itineraries matching the wish."}, {"type": "brick", "id": "vtbl", "name": "Visual Tour Builder, Quotes and Itineraries", "description": "Sample itineraries as starting points.", "how": "Loads the chosen sample itinerary as the first draft."}]}, {"id": "compose-itinerary-visually", "title": "Compose the day-by-day itinerary by drag and drop", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Stored components \u2014 lodges, transfers, excursions, flights \u2014 are dragged onto a day-by-day canvas; texts and photos come along automatically.", "Availability and rate validity are checked per component as it is placed, so the draft is buildable from the start."], "painPoints": ["Word documents assembled from copied text and photos take hours and look different per specialist.", "Components dragged in without an availability check produce proposals that fall apart on confirmation."], "dependencies": [{"type": "brick", "id": "vtbl", "name": "Visual Tour Builder, Quotes and Itineraries", "description": "Drag-and-drop itinerary composition.", "how": "Places components on the day canvas with text and media."}, {"type": "brick", "id": "comp", "name": "Components, Inventory and Availability", "description": "Component availability and rates.", "how": "Validates each placed component against inventory and validity."}]}, {"id": "price-at-target-margin", "title": "Price the proposal at target margin", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["The calculation sums supplier costs in their currencies, applies margin rules per component type and shows the resulting margin against the target before the price is shown to the client.", "Optional items and alternative lodges can be priced as choices the client toggles online."], "painPoints": ["Margins computed by hand in a side spreadsheet differ from the eventual invoice.", "Specialists under sales pressure quietly give margin away without visibility for the owner."], "dependencies": [{"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Margin rules and currency handling.", "how": "Calculates cost, margin and sales price per line and in total."}, {"type": "brick", "id": "vtbl", "name": "Visual Tour Builder, Quotes and Itineraries", "description": "Priced proposal with options.", "how": "Shows the specialist the margin and the client the price."}]}, {"id": "publish-proposal-online", "title": "Publish the proposal for online review", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["The proposal is published as a personal web page with maps, photos, day texts and price, and a link is emailed to the client.", "Views and time-on-page are tracked so the specialist knows when to follow up."], "painPoints": ["PDF proposals cannot be updated after sending and are read on a phone with difficulty.", "Specialists follow up blind, without knowing whether the client opened the proposal."], "dependencies": [{"type": "brick", "id": "vtbl", "name": "Visual Tour Builder, Quotes and Itineraries", "description": "Online proposal pages.", "how": "Renders the itinerary as a personal web page and tracks views."}, {"type": "brick", "id": "mytp", "name": "Traveler Portal and My-Trip App", "description": "Traveler portal where proposals are reviewed.", "how": "Presents the proposal in the client's personal environment."}]}, {"id": "iterate-on-feedback", "title": "Iterate on client feedback", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Clients comment per day or component in the portal; the specialist swaps a lodge or adds a night and republishes as a new version.", "Version history keeps every proposal variant with its price so a client can return to an earlier option."], "painPoints": ["Changes exchanged by email get lost, and the final trip differs from what the client remembers.", "Re-pricing a change by hand takes longer than the change itself."], "dependencies": [{"type": "brick", "id": "vtbl", "name": "Visual Tour Builder, Quotes and Itineraries", "description": "Proposal versions and client comments.", "how": "Applies changes and republishes a versioned proposal."}, {"type": "brick", "id": "pric", "name": "Pricing, Yield and Group Calculations", "description": "Re-pricing on each change.", "how": "Recomputes price and margin for every version."}]}, {"id": "client-approves-and-pays-deposit", "title": "Client approves online and pays the deposit", "actor": "Traveler and Booker", "keyFacts": ["The client approves the proposal with one click, accepts the travel conditions and pays the deposit via a payment link in the same session.", "Acceptance timestamps and accepted conditions are stored as the contract record required under the Package Travel Directive."], "painPoints": ["Approval by email reply and a separate bank transfer delays the confirmation by days.", "Missing proof of accepted conditions weakens the operator's position in disputes."], "dependencies": [{"type": "brick", "id": "mytp", "name": "Traveler Portal and My-Trip App", "description": "Approval and payment in the traveler portal.", "how": "Records the approval and triggers the deposit payment."}]}, {"id": "convert-to-trip-file", "title": "Convert the accepted proposal into a trip file", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Conversion creates the booking file with every component as a booking line, the calculated margin and the supplier requests still to be sent.", "The proposal remains linked to the file so later changes are traceable to what was sold."], "painPoints": ["Re-keying accepted proposals into the booking system is where names, dates and prices get corrupted.", "Unlinked proposals make it impossible to compare sold margin with realised margin."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "descrip  \u2014 whether the traveler completes the booking on the real-time customer website or the reservations agent books in the back office. Both paths use the same product master, capacity, seat map and price rules, so a web booking and a desk booking are indistinguishable in the file.", "group": "Product and Sales Journeys", "rootGroup": "Product and Sales Journeys", "flows": [{"id": "traveler-books-a-group-departure-on-the-website", "title": "Traveler Books a Group Departure on the Real-Time Website", "description": "A traveler finds a coach or group tour, picks a departure, chooses a bus seat and room type, pays the deposit and receives the confirmation \u2014 with the booking file created in the back office at the same moment.", "primaryActor": "Traveler and Booker", "trigger": "A traveler lands on the operator's website looking for a spring coach tour to Tuscany.", "successSignal": "The booking file is confirmed, the deposit is received via a payment link and the traveler has the confirmation in the my-trip portal.", "steps": [{"id": "search-and-select-departure", "title": "Search the catalogue and select a departure", "actor": "Traveler and Booker", "keyFacts": ["The website shows the departure calendar with live availability and the price tier valid at that moment for each date.", "Departures below minimum participants show as bookable but carry the guaranteed/not-yet-guaranteed status transparently."], "painPoints": ["Websites that show brochure prices and 'request availability' convert far worse than real-time booking.", "Hidden 'not guaranteed' status leads to angry customers when a departure is cancelled."], "dependencies": [{"type": "brick", "id": "webs", "name": "Customer Website, CMS and Online Booking", "description": "Catalogue and departure calendar.", "how": "Renders products and departures with live prices."}, {"type": "brick", "id": "dept", "name": "Departures and Capacity Management", "description": "Departure availability and status.", "how": "Provides seats left and guarantee status per date."}]}, {"id": "choose-seat-and-room", "title": "Choose a bus seat and room type", "actor": "Traveler and Booker", "keyFacts": ["The seat map of the assigned coach is shown at booking; travelers pick their seat and the seat is reserved immediately \u2014 a 1TIS hallmark for coach operators.", "Room types (double, single with supplement, triple) reduce hotel allotment per night as they are chosen."], "painPoints": ["Seat allocation done later by phone generates a wave of calls in the week before departure.", "Selling room types without allotment checks overbooks single rooms that hotels cannot supply."], "dependencies": [{"type": "brick", "id": "seat", "name": "Seat and Room Allocation", "description": "Seat map and room allocation.", "how": "Reserves the chosen seat and room at booking."}, {"type": "brick", "id": "comp", "name": "Components, Inventory and Availability", "description": "Hotel allotment per night.", "how": "Decrements the room allotment for the selected type."}]}, {"id": "enter-travelers-and-wishes", "title": "Enter traveler details, wishes and extras", "actor": "Traveler and Booker", "keyFacts": ["Passenger names as in the passport, dietary wishes and mobility needs are captured at booking so they flow to room lists and guides without a later call.", "Extras such as insurance, excursions or an eSIM are offered as priced options."], "painPoints": ["Dietary wishes collected later by email arrive too late for the hotel.", "Insurance and excursions sold separately by phone are margin left on the table."], "dependencies": [{"type": "brick", "id": "webs", "name": "Customer Website, CMS and Online Booking", "description": "Booking form with passengers and extras.", "how": "Captures passenger data, wishes and options."}]}, {"id": "accept-conditions-and-pay-deposit", "title": "Accept conditions and pay the deposit", "actor": "Traveler and Booker", "keyFacts": ["The traveler accepts the package travel conditions and the SGR guarantee is shown before payment, as required for package sales in the Netherlands.", "Deposit is paid in the same session via iDEAL or card through a hosted payment link."], "painPoints": ["Bookings that wait for a bank transfer are abandoned or double-booked in the meantime.", "Missing evidence of accepted conditions costs the operator disputes."], "dependencies": [{"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Deposit invoice and payment registration.", "how": "Creates the deposit request and records the payment."}]}, {"id": "create-booking-file", "title": "Create the booking file and confirm", "actor": "Reservations and Sales Agent", "keyFacts": ["The booking file is created in the back office in real time with status confirmed, the seat, room, passengers, price tier and payment already attached.", "A contact record is created or matched, so the traveler's history starts here."], "painPoints": ["Website bookings that arrive as email to be re-keyed are the number-one source of desk errors.", "Duplicate contacts created per booking make marketing and history useless."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Booking file with all lines.", "how": "Stores the confirmed booking as the system of record."}, {"type": "brick", "id": "crmr", "name": "CRM and Contact Management", "description": "Contact matching and creation.", "how": "Links the booking to a single contact record."}]}, {"id": "send-confirmation-and-portal-access", "title": "Send confirmation and my-trip access", "actor": "Reservations and Sales Agent", "keyFacts": ["The confirmation email contains the invoice, the balance due date and a link to the traveler portal where documents will appear.", "Workflow rules schedule the balance reminder and passenger-data completion tasks automatically."], "painPoints": ["Confirmations typed by hand are inconsistent and miss legal information.", he Package Travel Directive deadlines, allocate bus seats and hotel rooms, send room lists with dietary wishes to hotels and seating lists to the coach company, assign the guide or group leader and give them the participant list in their portal, and keep all lists correct as late bookings and changes arrive.", "group": "Operations and Supply Journeys", "rootGroup": "Operations and Supply Journeys", "flows": [{"id": "from-capacity-decision-to-departure-day", "title": "From Capacity Decision to Departure Day", "description": "The end-to-end operations flow for a fixed-date group departure, from the go/no-go decision through lists and portals to the day the coach leaves.", "primaryActor": "Group Travel Operations Manager", "trigger": "The minimum-participant deadline for a departure approaches and the departure dashboard flags it for decision.", "successSignal": "The coach leaves with a seating list, every hotel has a correct room list, and the guide has the participant list and documents in the portal.", "steps": [{"id": "decide-go-no-go", "title": "Decide go/no-go against minimum participants", "actor": "Group Travel Operations Manager", "keyFacts": ["The departure dashboard shows bookings versus the minimum, the legal cancellation deadline (20 days before departure for trips over six days, 7 days for two-to-six-day trips, 48 hours for shorter trips) and the margin at the current load.", "Operators often guarantee a departure below minimum when margin allows, or merge two departures to fill one coach."], "painPoints": ["Deadlines tracked outside the system lead to late cancellations and full refund obligations under the Package Travel Directive.", "Cancelling a departure that would have filled with the last two weeks of bookings loses revenue and reputation."], "dependencies": [{"type": "brick", "id": "dept", "name": "Departures and Capacity Management", "description": "Departure status, minimums and deadlines.", "how": "Presents the decision data and records the go/  allocation.", "how": "Provides names, companions and needs per passenger."}]}, {"id": "send-room-lists-to-hotels", "title": "Send room lists with dietary wishes to hotels", "actor": "Group Travel Operations Manager", "keyFacts": ["Each hotel receives a room list for its nights with names, room types, arrival and departure and dietary or accessibility wishes, generated from the booking files.", "Hotels with portal access download the current list themselves and confirm it; others receive it by email from the supplier record."], "painPoints": ["Room lists assembled in Excel per hotel are the most error-prone document in group travel.", "Dietary wishes lost between booking and hotel are the most common complaint on tour."], "dependencies": [{"type": "brick", "id": "pass", "name": "Passenger Data and Operational Lists", "description": "Operational lists per hotel.", "how": "Generates room lists with wishes per hotel and night."}, {"type": "brick", "id": "sprt", "name": "Supplier and DMC Portal", "description": "Supplier portal with room lists.", "how": "Publishes the list for the hotel to view and confirm."}]}, {"id": "send-seating-list-to-coach", "title": "Send the seating list and driver instructions to the coach company", "actor": "Group Travel Operations Manager", "keyFacts": ["The coach company receives the seating list, the route with pickup points and the driver's contact list.", "Pickup points and times per passenger are derived from the booking, so the driver list is right by construction."], "painPoints": ["Drivers working from an outdated list leave passengers at the wrong pickup.", "Coach companies re-typing passenger lists into their own system introduce errors."], "dependencies": [{"type": "brick", "id": "seat", "name": "Seat and Room Allocation", "description": "Seating list per coach.", "how": "Produces the final seating list."}, {"type": "brick", "id": "docs", "name": "Travel Documents and Itinerary Delivery", "description": "Driver and pickup documents.", "how": "Generates the driver instructions and pickup schedule."}]}, {"id": "assign-guide-and-share-participant-list", "title": "Assign the guide and share the participant list in the portal", "actor": "Group Travel Operations Manager", "keyFacts": ["The tour guide or group leader is assigned to the departure and sees the participant list, wishes, hotel details and documents in the guide portal on their phone.", "Emergency contacts and medical notes are visible to the guide only, in line with data-minimisation rules."], "painPoints": ["Guides working from printed lists cannot see changes made after printing.", "Sharing full passenger data by email violates privacy expectations."], "dependencies": [{"type": "brick", "id": "guid", "name": "Guide and Group Leader Portal", "description": "Guide portal with participant list.", "how": "Gives the guide the live list and documents."}, {"type": "brick", "id": "pass", "name": "Passenger Data and Operational Lists", "description": "Participant data for guides.", "how": "Provides the guide view of passenger data."}]}, {"id": "issue-travel-documents", "title": "Issue travel documents to participants", "actor": "Reservations and Sales Agent", "keyFacts": ["Travel documents (itinerary, vouchers, hotel list, pickup time) are generated per booking and published in the traveler portal a fixed number of days before departure.", "Documents are regenerated automatically when the seat, pickup or hotel changes."], "painPoints": ["Documents mailed by hand are late and inconsistent.", "Static PDFs do not reflect last-minute changes."], "dependencies": [{"type": "brick", "id": "docs", "name": "Travel Documents and Itinerary Delivery", "description": "Travel documents per booking.", "how": "Generates and publishes the documents."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Booking file as the document source.", "how": "Provides the confirmed data for documents."}]}, {"id": "run-departure-day", " ame": "Booking Files and Dossiers", "description": "Change on the file with fee calculation.", "how": "Records the change and its financial effect."}, {"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Change alerts to operations.", "how": "Notifies operations that sent lists are affected."}]}, {"id": "recompute-seats-and-rooms", "title": "Recompute seats and rooms", "actor": "Group Travel Operations Manager", "keyFacts": ["Freed seats and rooms are reallocated; the new party of three gets seats together and a triple room if sold.", "The system shows only the deltas so the operator can sanity-check them in a minute."], "painPoints": ["Re-doing the whole seating plan for one change is where errors enter.", "Triple rooms not available at every hotel go unnoticed until check-in."], "dependencies": [{"type": "brick", "id": "seat", "name": "Seat and Room Allocation", "description": "Delta re-allocation.", "how": "Updates seats and rooms for changed files."}, {"type": "brick", "id": "dept", "name": "Departures and Capacity Management", "description": "Capacity after the change.", "how": "Reflects new load factor and margin."}]}, {"id": "propagate-to-hotels-and-coach", "title": "Propagate the change to hotels and the coach company", "actor": "Group Travel Operations Manager", "keyFacts": ["Hotels and the coach company receive an updated list or a change notice highlighting the delta, one to one from the change on the file.", "Portal suppliers see the updated list immediately; email suppliers get a versioned document."], "painPoints": ["Sending a full new list without highlighting the delta makes hotels miss the change.", "Unsent changes are the root of most wrong room assignments."], "dependencies": [{"type": "brick", "id": "sprt", "name": "Supplier and DMC Portal", "description": "Updated lists in the supplier portal.", "how": "Publishes the changed list with delta."}, {"type": "brick", "id": "supl", "name": "Supplier Management and Communication", "description": "Change notices by email.", "how": "Sends versioned change notices and logs them."}]}, {"id": "update-guide-and-documents", "title": "Update the guide's list and regenerate documents", "actor": "Group Travel Operations Manager", "keyFacts": ["The guide portal reflects the change immediately; affected travelers receive regenerated documents in their portal.", "The changed party is notified which documents changed."], "painPoints": ["Guides find out about changes from the passengers.", "Old documents in travelers' inboxes contradict new ones."], "dependencies": [{"type": "brick", "id": "guid", "name": "Guide and Group Leader Portal", "description": "Live participant list.", "how": "Shows the updated list to the guide."}, {"type": "brick", "id": "docs", "name": "Travel Documents and Itinerary Delivery", "description": "Regenerated documents.", "how": "Reissues documents for affected bookings."}]}, {"id": "settle-financial-effect", "title": "Settle the financial effect of the change", "actor": "Finance and Administration Lead", "keyFacts": ["Cancellation fees, refunds and new invoices are created from the change; the supplier cost side is adjusted for finance.", "Refunds due under the conditions are paid within the statutory period."], "painPoints": ["Refunds forgotten after a cancellation create complaints and regulatory exposure.", "Supplier cost not adjusted overstates margin."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Financial lines after the change.", "how": "Provides fees and refunds to invoicing."}]}]}], "outcomes": ["Fewer operational hours per departure, because seat, room, guide and passenger lists are generated from the booking files instead of rebuilt by hand", "Higher departure load factor and fewer cancelled departures, thanks to timely go/no-go decisions and yield actions", "Accurate room lists and dietary information at every hotel, with changes propagated the mome  "successSignal": "All ground services are confirmed by the DMC, the file shows confirmed status per line, and later changes are acknowledged in the portal.", "steps": [{"id": "generate-service-requests", "title": "Generate service requests from the booking lines", "actor": "Group Travel Operations Manager", "keyFacts": ["Every on-request or DMC line on the file becomes a structured service request: service, dates, pax, room types, special wishes and the contracted rate.", "Requests are bundled per supplier and per departure so the DMC receives one request set, not twenty emails."], "painPoints": ["Requests written by hand omit the detail the supplier needs and trigger a round of questions.", "Requests sent per booking overwhelm DMCs with fragments they must consolidate."], "dependencies": [{"type": "brick", "id": "supl", "name": "Supplier Management and Communication", "description": "Request generation and bundling.", "how": "Creates structured requests per supplier."}, {"type": "brick", "id": "cont", "name": "Purchasing and Supplier Contracts", "description": "Contracted rates and terms.", "how": "Attaches the agreed rate to each request."}]}, {"id": "deliver-request-to-supplier", "title": "Deliver the request via portal, email or API", "actor": "Group Travel Operations Manager", "keyFacts": ["Portal suppliers get a notification and see the request in their work list; email suppliers receive a structured message; API-connected suppliers receive it machine to machine.", "Delivery and read status are tracked so the operator knows what is pending."], "painPoints": ["Unread requests discovered a week later derail the timeline.", "Suppliers without a portal still need a clear, complete request."], "dependencies": [{"type": "brick", "id": "sprt", "name": "Supplier and DMC Portal", "description": "Supplier portal work list.", "how": "Shows the request to the DMC and tracks its status."}, {"type": "brick", "id": "intg", "name": "Integration Hub and Partner APIs", "description": "Supplier API delivery.", "how": "Delivers requests to API-connected suppliers."}]}, {"id": "dmc-reviews-and-confirms", "title": "The DMC reviews and confirms or rejects each service", "actor": "DMC Ground Operations Manager", "keyFacts": ["The DMC confirms each line, adds a supplier reference and can propose an alternative (different lodge, changed time) instead of rejecting.", "Confirmation captures the DMC's own cancellation terms per service."], "painPoints": ["Confirmations by free-text email have to be interpreted and typed into the file.", "Alternatives offered by phone are lost and re-requested."], "dependencies": [{"type": "brick", "id": "sprt", "name": "Supplier and DMC Portal", "description": "Line-level confirmation in the portal.", "how": "Records confirm, reject or alternative per line with references."}]}, {"id": "update-file-and-notify", "title": "Update the file and notify the operator", "actor": "Group Travel Operations Manager", "keyFacts": ["Confirmed lines flip to confirmed on the file with the supplier reference; rejections and alternatives create a task for the operator.", "Travel documents can only be issued when all lines are confirmed, which the workflow enforces."], "painPoints": ["Files that show 'requested' forever hide the risk of unconfirmed services.", "Documents issued with unconfirmed services lead to travelers standing at closed doors."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Line status and supplier references.", "how": "Updates line status from supplier responses."}, {"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Tasks for rejections and document gating.", "how": "Creates tasks and blocks documents until all lines are confirmed."}]}, {"id": "share-passenger-and-room-data", "title": "Share passenger and room data with the DMC", "actor": "Group Travel Operations Manager", "keyFacts": ["Closer to departure the DMC receives the passenger list, room list and wishes for the confirmed services, generated from the same file data.", "Only data needed for the service is shared, per supplier."], "painPoints": ["Room lists sent to DMCs by spreadsheet diverge from the hotel lists sent by the operator.", "Oversharing passenger data with every supplier is a privacy exposure."], "dependencies": [{"type": "brick", "id": "pass", "name": "Passenger Data and Operational Lists", "description": "Passenger and room data per supplier.", "how": "Generates supplier-specific passenger lists."}, {"type": "brick", "id": "sprt", "name": "Supplier and DMC Portal", "description": "Passenger lists in the portal.", "how": "Publishes the lists to the DMC."}]}, {"id": "propagate-changes-one-to-one", "title": "Propagate operator changes one to one to the DMC", "actor": "Group Travel Operations Manager", "keyFacts": ["A change on the file (extra passenger, changed room type, cancelled excursion) creates a versioned change request for the affected line only.", "The DMC acknowledges the change in the portal; unacknowledged changes are escalated by workflow."], "painPoints": ["Changes communicated in an email thread are the leading cause of DMC service errors.", "Without acknowledgement, the operator assumes the DMC knows."], "dependencies": [{"type": "brick", "id": "supl", "name": "Supplier Management and Communication", "description": "Versioned change requests.", "how": "Creates change deltas per affected line."}, {"type": "brick", "id": "sprt", "name": "Supplier and DMC Portal", "description": "Change acknowledgement.", "how": "Lets the DMC acknowledge or dispute the change."}]}, {"id": "dmc-reports-delivery-and-invoices", "title": "The DMC reports delivery and invoices the operator", "actor": "DMC Ground Operations Manager", "keyFacts": ["After the service the DMC marks delivery, reports no-shows and uploads its invoice against the confirmed lines.", "Invoice lines matched to confirmed service lines make the operator's supplier settlement a check, not a reconstruction."], "painPoints": ["Invoices that do not reference the request cannot be matched.", "No-shows unreported by the DMC are invoiced anyway."], "dependencies": [{"type": "brick", "id": "sprt", "name": "Supplier and DMC Portal", "description": "Delivery status and invoice upload.", "how": "Captures delivery and the supplier invoice."}]}]}, {"id": "confirm-ad-hoc-components-for-a-tailor-made-trip", "title": "Confirm Ad-Hoc Components for a Tailor-Made Trip", "description": "A specialist confirms every on-request lodge, transfer and activity of an accepted tailor-made proposal before travel documents are released.", "primaryActor": "Tailor-Made Travel Specialist", "trigger": "A client approved a proposal with twelve on-request components across three countries.", "successSignal": "All twelve components are confirmed with supplier references, or replaced by confirmed alternatives, before the document deadline.", "steps": [{"id": "list-unconfirmed-lines", "title": "List the unconfirmed lines and their deadlines", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["The file shows each on-request line with the supplier, the days since request and the deadline by which it must be confirmed for the trip to hold.", "Lines from bed-bank or API suppliers may already be instantly confirmed."], "painPoints": ["Specialists tracking confirmations in a notebook lose lines.", "Instant-confirm suppliers mixed with slow ones hide where the risk is."], "dependencies": [{"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Unconfirmed lines per file.", "how": "Lists lines by status and deadline."}, {"type": "brick", "id": "comp", "name": "Components, Inventory and Availability", "description": "Instant versus on-request components.", "how": "Distinguishes instantly confirmed components."}]}, {"id": "send-requests-to-suppliers", "title": "Send requests to all suppliers in one action", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["All open lines are requested in one action, each supplier receiving its own structured request by portal, email or API.", "Request texts are templated per supplier language."], "painPoints": ["Writing twelve emails by hand takes an afternoon.", "Requests in the wrong language get slower answers."], "dependencies": [{"type": "brick", "id": "supl", "name": "Supplier Management and Communication", "description": "Batch request per supplier.", "how": "Generates and sends requests for all open lines."}, {"type": "brick", "id": "comm", "name": "Email and Telephony Integration", "description": "Templated supplier emails.", "how": "Sends language-specific request emails."}]}, {"id": "chase-with-workflow", "title": "Chase overdue confirmations automatically", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Workflow sends reminders to suppliers and raises a task for the specialist when a line passes its expected confirmation time.", "The AI assistant drafts follow-up messages and flags supplier replies that need a decision."], "painPoints": ["Chasing by memory means the slowest supplier is discovered last.", "Inbox triage of supplier replies eats the specialist's morning."], "dependencies": [{"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Alerts", "description": "Reminders and overdue tasks.", "how": "Automates chasing and escalation."}]}, {"id": "process-supplier-replies", "title": "Process supplier replies and alternatives", "actor": "Tailor-Made Travel Specialist", "keyFacts": ["Replies from portal and API update lines automatically; email replies are attached to the line and confirmed with one click.", "Alternatives are re-priced and, if the price changes, the client is informed via the portal."], "painPoints": ["Manual reading of confirmations misses changed dates or prices in the reply.", "Price changes not passed to the client surface at final invoice."], "dependencies": [{"type": "brick", "id": "sprt", "name": o-final-payment", "title": "From Deposit to Final Payment", "description": "The standard collection cycle of a package booking: deposit at booking, balance six to eight weeks before departure, automatic reminders and matching.", "primaryActor": "Finance and Administration Lead", "trigger": "A booking is confirmed and the deposit invoice is due.", "successSignal": "The booking is fully paid before the balance due date, with every payment matched to its invoice and visible in the file.", "steps": [{"id": "issue-deposit-invoice", "title": "Issue the deposit invoice from the booking", "actor": "Reservations and Sales Agent", "keyFacts": ["The deposit invoice is generated from the file with the deposit percentage from the conditions, the SGR contribution and any insurance premium as separate lines.", "Invoice numbering, VAT treatment (including the travel agents' margin scheme where applicable) and layout are configured per tenant."], "painPoints": ["Invoices typed in a separate accounting tool differ from the booking.", "Wrong VAT treatment on travel invoices is a recurring audit finding."], "dependencies": [{"type": "brick", "id": "invc", "name": "Invoicing, Payment Links and Collection", "description": "Invoice generation and numbering.", "how": "Creates the deposit invoice from booking lines."}, {"type": "brick", "id": "book", "name": "Booking Files and Dossiers", "description": "Booking lines and conditions.", "how": "Provides amounts, percentages and lines."}]}, {"id": "send-payment-link", "title": "Send the payment link with the invoice", "actor": "Reservations and Sales Agent", "keyFacts": ["The invoice email carries a hosted payment link; iDEAL is the dominant method for Dutch consumers and settles within seconds.", "Travelers can also pay from the my-trip portal, where the open amount is always current."], "painPoints": ["Bank transfers with free-text references are matched by hand.", "Portals that show a stale open amount cause double payments."], "dependencie
