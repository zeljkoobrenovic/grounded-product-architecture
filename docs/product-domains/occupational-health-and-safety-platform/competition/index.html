    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;

        container.innerHTML = '';

                }
                html += '<span>' + suffix + '</span>';

rtals and cross-module KPIs, hosted on HDS- and ISO 27001-certified infrastructure, together with a services arm that assesses, configures, migrates, trains and supports every customer. It serves large organisations in France, Belgium, Luxembourg and the Netherlands (SNCF, Thales, Ville de Paris, Ville de Bruxelles, Umicore, Empreva, Engie, BNP, EIB, Stellantis, EDF, RATP, CNRS, Disney, BASF) and has been backed by Vortex Capital Partners since a strategic partnership announced on 29 March 2022 that funds the 'Kitry as a Service' pure-play SaaS transition. It is listed so the other players' figures can be read against its own.", "businessStats": [{"metric": "years_of_expertise", "value": "35+ years of expertise", "period": "accessed 2026-09-05", "scope": "company", "sourceTitle": "Kitry - Occupational health and safety software", "sourceUrl": "https://www.kitry.com/en/"}, {"metric": "employee_records_tracked", "value": "4 M+ employee records tracked", "period": "accessed 2026-09-05", "scope": "platform", "sourceTitle": "Kitry - Occupational health and safety software", "sourceUrl": "https://www.kitry.com/en/"}, {"metric": "active_users", "value": "6,000+ active users", "period": "accessed 2026-09-05", "scope": "platform", "sourceTitle": "Kitry - Occupational health and safety software", "sourceUrl": "https://www.kitry.com/en/"}, {"metric": "self_service_adoption", "value": "50%+ of employees in autonomous services use self-service (FR / BE / LU)", "period": "accessed 2026-09-05", "scope": "platform (customers with autonomous occupational health services in France, Belgium and Luxembourg)", "sourceTitle": "Kitry - Occupational health and safety software", "sourceUrl": "https://www.kitry.com/en/"}, {"metric": "certifications", "value": "HDS (H\u00e9bergeur de Donn\u00e9es de Sant\u00e9) and ISO 27001 certified hosting", "period": "accessed 2026-09-05", "scope": "company", "sourceTitle": "Kitry - Occupational health and safety software", "sourceUrl": "https://www.kitry.com/en/"}, {"metric": "customers", "value": "more than 150 customers, including blue-chip companies and public institutions, across healthcare, chemicals, financial services, manufacturing and government", "period": "accessed 2026-09-05", "scope": "company", "sourceTitle": "Kitry - Vortex", "sourceUrl": "https://vortexcp.com/investment/kitry/"}, {"metric": "medical_files", "value": "more than 2.5 million medical files stored securely via the platform", "period": "accessed 2026-09-05", "scope": "platform", "sourceTitle": "Kitry - Vortex", "sourceUrl": "https://vortexcp.com/investment/kitry/"}, {"metric": "ownership", "value": "Vortex Capital Partners strategic partnership / buyout announced 29 March 2022 (Kitry CEO Pierre Letargez; Vortex partner Evert Jan de Groot), backing commercial expansion, international roll-out and the 'Kitry as a Service' offering; more than 100 customers in Belgium, France and the Netherlands at the time", "period": "published 2022-03-29", "scope": "company", "sourceTitle": "Kitry attracts Vortex Capital Partners as strategic partner - Vortex", "sourceUrl": "https://vortexcp.com/news/kitry-attracts-vortex-capital-partners-as-strategic-partner/"}], "links": {"website": "https://www.kitry.com/en/", "website_fr": "https://www.kitry.com/fr/", "investor_page": "https://vortexcp.com/investment/kitry/", "investor_press_release": "https://vortexcp.com/news/kitry-attracts-vortex-capital-partners-as-strategic-partner/"}, "logo_path": "logos/kitry.png"}, {"id": "cority", "logo": "logos/cority.png", "name": "Cority", "hq": "Toronto, Canada", "category": "global-ehs-suite", "primaryRegions": ["north_america", "europe", "asia_pacific"], "description": "Cority is the global EHS and sustainability suite whose roots are in occupational health: its CorityOne platform bundles a Health Cloud (occupational health, clinical case management, medical surveillance, industrial hygiene) with safety, environmental, quality and sustainability clouds, and it reinforced the health side in January 2025 by acquiring Meddbase, a UK cloud-native occupational medicine and practice-management vendor. Cority states that it was named a Leader for the sixth time in Verdantix's Green Quadrant EHS Software 2025 report, with the highest industrial hygiene score and standout occupational health results. For a Kitry prospect it is the enterprise-grade, English-first alternative when a multinational's group HQ standardises occupational health on one global suite rather than a Benelux/France specialist.", "businessStats": [{"metric": "customers", "value": "over 1,500 organizations worldwide", "period": "published 2025-01-23", "scope": "company", "sourceTitle": "Cority Acquires Meddbase, Innovator in Occupational Health and Enterprise Practice Management Software", "sourceUrl": "https://www.globenewswire.com/news-release/2025/01/23/3014139/0/en/Cority-Acquires-Meddbase-Innovator-in-Occupational-Health-and-Enterprise-Practice-Management-Software.html"}, {"metric": "years_of_operation", "value": "operating for over 35 years as an EHS and sustainability software provider", "period": "published 2025-01-23", "scope": "company", "sourceTitle": "Cority Acquires Meddbase, Innovator in Occupational Health and Enterprise Practice Management Software", "sourceUrl": "https://www.globenewswire.com/news-release/2025/01/23/3014139/0/en/Cority-Acquires-Meddbase-Innovator-in-Occupational-Health-and-Enterprise-Practice-Management-Software.html"}, {"metric": "acquisition", "value": "acquired Meddbase (founded 2004; cloud-native occupational medicine and enterprise medical practice management software; North America, Europe, Australia) to strengthen the Health Cloud", "period": "published 2025-01-23", "scope": "company", "sourceTitle": "Cority Acquires Meddbase, Innovator in Occupational Health and Enterprise Practice Management Software", "sourceUrl": "https://www.globenewswire.com/news-release/2025/01/23/3014139/0/en/Cority-Acquires-Meddbase-Innovator-in-Occupational-Health-and-Enterprise-Practice-Management-Software.html"}, {"metric": "headquarters", "value": "Toronto (press-release dateline and boilerplate)", "period": "published 2025-01-23", "scope": "company", "sourceTitle": "Cority Acquires Meddbase, Innovator in Occupational Health and Enterprise Practice Management Software", "sourceUrl": "https://www.globenewswire.com/news-release/2025/01/23/3014139/0/en/Cority-Acquires-Meddbase-Innovator-in-Occupational-Health-and-Enterprise-Practice-Management-Software.html"}], "links": {"website": "https://www.cority.com/", "occupational_health_page": "https://www.cority.com/health-cloud/occupational-health-solutions/", "newsroom": "https://www.cority.com/news/", "acquisition_announcement": "https://www.cority.com/news-media/cority-acquires-occupational-health-software-meddbase/"}, "logo_path": "logos/cority.png"}, {"id": "enablon", "logo": "logos/enablon.png", "name": "Enablon (Wolters Kluwer)", "hq": "Paris, France and Chicago, United States (Wolters Kluwer: Alphen aan den Rijn, Netherlands)", "category": "global-ehs-suite", "primaryRegions": ["europe", "north_america", "asia_pacific"], "description": "Enablon is the EHS & ESG software suite inside Wolters Kluwer's Corporate Performance & ESG division: a French-born integrated risk-management platform (Paris and Chicago hubs) covering safety, incident and permit management, environmental compliance, operational risk and ESG reporting for large industrial groups. It is not a clinical occupational health system, but many of Kitry's French and Belgian industrial prospects already run Enablon for HSE, so it competes for the workplace safety, accident and chemical-inventory modules and sets the group-wide integration expectations Kitry must meet. Figures are reported at Wolters Kluwer group and division level only; no Enablon product revenue is disclosed.", "businessStats": [{"metric": "revenue", "value": "EUR 6,125 million revenues, up 7% in constant currencies and up 6% organically" iod": "accessed 2026-09-05", "scope": "company (all products)", "sourceTitle": "Powerful EHS Software. Made Simple. | VelocityEHS", "sourceUrl": "https://www.ehs.com/"}, {"metric": "certifications", "value": "ISO 27001 certified and SOC 2 Type II attested; 16 U.S. patents; Verdantix Green Quadrant Leader", "period": "accessed 2026-09-05", "scope": "company", "sourceTitle": "Powerful EHS Software. Made Simple. | VelocityEHS", "sourceUrl": "https://www.ehs.com/"}, {"metric": "ownership", "value": "Partners Group agreed to acquire a significant minority stake from CVC Growth Funds (investor since 2017); at the time over 18,000 customers and more than 10 million users worldwide; headquartered in Chicago, founded 1996", "period": "published 2022-08-16", "scope": "company", "sourceTitle": "Partners Group to acquire a significant minority stake in VelocityEHS", "sourceUrl": "https://www.ehs.com/press_releases/partners-group-to-acquire-a-significant-minority-stake-in-velocityehs-a-leading-environmental-health-safety-and-sustainability-software-platform/"}, {"metric": "formation", "value": "VelocityEHS formed in 2015 from KMI (est. 2003) and MSDSonline (est. 1996), then acquired Humantech (est. 1979), ChemTel (est. 1989), OneLook Systems (est. 2008), Contractor Compliance (est. 2015) and others", "period": "accessed 2026-09-05", "scope": "company", "sourceTitle": "About VelocityEHS", "sourceUrl": "https://www.ehs.com/about-us/"}], "links": {"website": "https://www.ehs.com/", "about": "https://www.ehs.com/about-us/", "history": "https://www.ehs.com/about-us/history/", "newsroom": "https://www.ehs.com/resources/press-releases/"}, "logo_path": "logos/velocityehs.png"}, {"id": "sphera", "logo": "logos/sphera.png", "name": "Sphera (Blackstone)", "hq": "Chicago, United States", "category": "global-ehs-suite", "primaryRegions": ["north_america", "europe", "asia_pacific"], "description": "Sphera, carved out of IHS's Operational Excellence & Risk Management group in 2016 and owned by Blackstone since 2021, sells EHS&S, operational risk (process safety), product stewardship and ESG software, data and consulting to heavy industry and chemicals. It is a Verdantix Green Quadrant leader for process safety management and a frequent incumbent for chemical product stewardship at the industrial and pharmaceutical groups Kitry targets; it competes for the safety, chemical and reporting modules rather than for the occupational medical file, and its scale figures are company-wide across all product lines.", "businessStats": [{"metric": "customers", "value": "over 7,000 customers and a million-plus users in 80 countries; more than 30 years of service", "period": "published 2023-09-29", "scope": "company (all products)", "sourceTitle": "Sphera's 2022 ESG Report Illustrates How the Company Is Optimizing Its Own ESG Performance While Supporting Its More Than 7,000 Customers in Operationalizing ESG", "sourceUrl": "https://sphera.com/company/news/spheras-2022-esg-report-illustrates-how-the-company-is-optimizing-its-own-esg-performance-while-supporting-its-more-than-7000-customers-in-operationalizing-esg/"}, {"metric": "employees", "value": "grew from about 500 employees at founding (2016) to 1,000 employees globally", "period": "published 2021-06-01", "scope": "company", "sourceTitle": "Sphera Celebrates 5 Years of Creating a Safer, More Sustainable and Productive World", "sourceUrl": "https://sphera.com/company/news/sphera-celebrates-5-years-of-creating-a-safer-more-sustainable-and-productive-world/"}, {"metric": "countries_served", "value": "services provided in 124 countries with offices across North America, EMEA and APAC", "period": "accessed 2026-09-05", "scope": "company", "sourceTitle": "Offices & Locations | Global Coverage in 124 Countries", "sourceUrl": "https://sphera.com/our-locations/"}, {"metric": "ownership", "value": "portfolio company of Blackstone (acquired from Genstar in 2021); founded 2016 after IHS divested its Operational Excellence & Ris     let showDetails = false;

    function escapeHtml(value) {
        return String(value || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function titleCase(value) {
        return String(value || '')
            .split('_')
            .filter(Boolean)
            .map(part => part.charAt(0).toUpperCase() + part.slice(1))
            .join(' ');
    }

    function firstLetterLogo(player) {
        return '<div class="player-logo-fallback">' + escapeHtml((player.name || '?').charAt(0).toUpperCase()) + '</div>';
    }

    function renderPlayerLogo(player) {
        const fallback = firstLetterLogo(player);
        if (!player.logo_path) {
            return fallback;
        }

        return ''
            + '<div class="player-logo-wrap">'
            + '<img class="player-logo" src="' + escapeHtml(player.logo_path) + '" alt="' + escapeHtml(player.name) + ' logo"'
            + ' onerror="this.style.display=\'none\'; if (this.nextElementSibling) { this.nextElementSibling.style.display=\'flex\'; }">'
            + '<div class="player-logo-fallback" style="display:none;">' + escapeHtml((player.name || '?').charAt(0).toUpperCase()) + '</div>'
            + '</div>';
    }

    function renderHero() {
        const players = competitionData.players || [];
        document.getElementById('heroSubtitle').innerHTML = escapeHtml(competitionData.scope && competitionData.scope.description || '');
        document.getElementById('heroMeta').innerHTML = ''
            + '<div class="meta-chip">Updated ' + escapeHtml(competitionData.generatedOn || '') + '</div>';
    }

    function renderScope() {
        const scope = competitionData.scope || {};
        document.getElementById('scopeCopy').textContent = scope.description || '';
        const notes = Array.isArray(scope.notes) ? scope.notes : (scope.notes ? [scope.notes] : []);
        document.getElementById('scopeNotes').innerHTML = notes.map(item => '<div class="pill">' + escapeHtml(item) + '</div>').join('');
    }

    function renderPlayer(player) {
        const logoHtml = renderPlayerLogo(player);
        const detailUrl = 'landing_pages/' + encodeURIComponent(player.id) + '.html';

        const stats = (player.businessStats || []).slice(0, 3).map(stat => ''
            + '<div class="stat-item">'
            + '<div class="stat-metric">' + escapeHtml(titleCase(stat.metric)) + '</div>'
            + '<div class="stat-value">' + escapeHtml(stat.value || '') + '</div>'
            + '<div class="stat-meta">' + escapeHtml((stat.period || '') + (stat.scope ? ' • ' + titleCase(stat.scope) : '')) + '</div>'
            + '</div>'
        ).join('');

        const links = Object.entries(player.links || {}).slice(0, 4).map(([key, value]) => ''
            + '<a class="link-item" href="' + escapeHtml(value) + '" target="_blank" rel="noopener noreferrer">'
            + '<div><strong>' + escapeHtml(titleCase(key)) + '</strong></div>'
            + '<div class="link-meta">' + escapeHtml(value) + '</div>'
            + '</a>'
        ).join('');

        const regions = (player.primaryRegions || []).map(region => '<div class="pill">' + escapeHtml(titleCase(region)) + '</div>').join('');

        return ''
            + '<div class="player-card" data-detail-url="' + escapeHtml(detailUrl) + '">'
            + '<div class="player-header">'
            + logoHtml
            + '<div>'
            + '<div class="category-chip">' + escapeHtml(titleCase(player.category || 'competitor')) + '</div>'
            + (player.role ? '<div class="category-chip" style="' + ({ direct: 'background:#fdecea;color:#b71c1c', substitute: 'background:#fff4e5;color:#8a4b00', benchmark: 'background:#eef2f7;color:#37474f' }[player.role] || '') + '">' + escapeHtml(({ direct: 'Direct', substitute: 'Substitute', benchmark: 'Benchmark' }[player.role] || player.role)) + '</div>' : '')
            + '<div class="player-name">' + escapeHtml(player.name || '') + '</div>'
            + '<div class="player-meta">' + escapeHtml(player.hq || '') + (player.regionRelevance ? ' · ' + escapeHtml(player.regionRelevance) : '') + '</div>'
            + '</div>'
            + '</div>'
            + '<div class="player-description">' + escapeHtml(player.description || '') + '</div>'
            + '<div class="section-title">Primary Regions</div>'
            + '<div class="regions-row">' + regions + '</div>'
            + '<div class="player-details-block' + (showDetails ? '' : ' details-hidden') + '">'
            + '<div class="section-title">Selected Stats</div>'
            + '<div class="stats-list">' + stats + '</div>'
            + '<div class="section-title">Official Links</div>'
            + '<div class="links-list">' + links + '</div>'
            + '</div>'
            + '</div>';
    }

    function renderPlayers() {
        document.getElementById('playersGrid').innerHTML = (competitionData.players || []).map(renderPlayer).join('');
        bindPlayerCardNavigation();
        syncDetailsToggle();
        syncPlayerTabLabel();
    }

    function bindPlayerCardNavigation() {
        document.querySelectorAll('.player-card').forEach(card => {
            card.addEventListener('click', function (event) {
                const interactive = event.target.closest('a, button');
                if (interactive) {
                    return;
                }
                const detailUrl = card.getAttribute('data-detail-url');
                if (detailUrl) {
                    window.open(detailUrl, '_blank');
                }
            });
        });
    }

    function syncDetailsToggle() {
        const button = document.getElementById('detailsToggleButton');
        if (!button) {
            return;
        }
        button.textContent = showDetails ? 'Hide details' : 'Show details';
        button.className = 'toggle-button' + (showDetails ? ' toggle-button-active' : '');
    }

    function toggleDetails() {
        showDetails = !showDetails;
        renderPlayers();
    }

    function syncPlayerTabLabel() {
        const button = document.getElementById('tab_PlayersTab');
        if (!button) {
            return;
        }
        button.textContent = 'Players (' + String((competitionData.players || []).length) + ')';
    }

    renderHero();
    renderScope();
    renderPlayers();
</script>
