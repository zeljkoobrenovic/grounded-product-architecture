    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

ety and event figures", "actor": "HSE Manager / Prevention Adviser", "keyFacts": ["Accident counts and rates, occupational diseases, hazardous situations, inspections, action closure, chemical inventory status and prevention plan progress are computed for the same year and perimeter.", "The Belgian report requires the same data structure every year, which the template enforces."], "painPoints": ["Safety and health figures reported separately contradict each other.", "Prevention plan progress is described qualitatively because nobody tracked it."], "dependencies": [{"type": "brick", "id": "rept", "name": "Regulatory and Annual Reports", "description": "Safety figures.", "how": "Computes safety and event figures."}, {"type": "brick", "id": "rcaa", "name": "Event Analysis and Statistics", "description": "Accident statistics.", "how": "Supplies event statistics."}, {"type": "brick", "id": "actn", "name": "Action Plan Management", "description": "Plan progress.", "how": "Supplies action closure and plan progress."}]}, {"id": "review-with-the-physician-and-add-analysis", "title": "Review with the physician and add the qualitative analysis", "actor": "Occupational Physician", "keyFacts": ["The physician reviews the figures, adds the medical analysis and prevention recommendations (the French report includes the physician's observations on working conditions), and validates the sections under their responsibility.", "Collective health findings are included in anonymised form."], "painPoints": ["Reports written by administrators without medical analysis have no prevention value.", "Physicians validate reports whose figures they cannot check."], "dependencies": [{"type": "brick", "id": "rept", "name": "Regulatory and Annual Reports", "description": "Narrative sections.", "how": "Captures the physician's analysis and validation."}, {"type": "brick", "id": "cohm", "name": "Collective Health Monitoring", "description": "Collective findings.", "how": "Supplies anonymised collective health findings."}]}, {"id": "present-to-the-committee-and-employer", "title": "Present to the CSE/CPPT and the employer", "actor": "Occupational Health Service Manager / Coordinator", "keyFacts": ["The report is presented to the committee and the employer; the presentation date and the committee's opinion are recorded; the employer's decisions on resources feed next year's plan.", "Worker representatives get read access to the report."], "painPoints": ["Reports presented late lose their influence on the budget.", "Committee opinions are not recorded with the report."], "dependencies": [{"type": "brick", "id": "rept", "name": "Regulatory and Annual Reports", "description": "Presentation record.", "how": "Records the presentation and opinion."}, {"type": "brick", "id": "iden", "name": "Identity, SSO, Roles and Consent", "description": "Representative access.", "how": "Grants read access to representatives."}]}, {"id": "file-and-archive-the-report", "title": "File where required and archive with its data snapshot", "actor": "Occupational Health Service Manager / Coordinator", "keyFacts": ["The report is filed where a country requires it (transmitted to the labour inspection or kept available on request) and archived with the data snapshot that produced it, for the legal retention period.", "Archived reports are the evidence for the next inspection."], "painPoints": ["Reports archived without their data cannot be reproduced when contested.", "Filing deadlines missed by the service manager."], "dependencies": [{"type": "brick", "id": "rept", "name": "Regulatory and Annual Reports", "description": "Filing and archiving.", "how": "Files the report and archives it with its snapshot."}, {"type": "brick", "id": "audt", "name": "Audit Trail and Data Retention", "description": "Snapshot retention.", "how": "Retains the data snapshot."}]}]}, {"id": "monitor-collective-health-and-steer-prevention", "title": "Monitor Collective Health and Steer Prevention from Live Indicators", "description": "The physician and the HSE manager review live dashboards and collective health indicators, detect a signal on a population, investigate it with the prevention adviser and turn it into prevention advice and actions.", "primaryActor": "Occupational Physician", "trigger": "The monthly review, a signal in the indicators (hearing shifts on a line, musculoskeletal complaints in a unit, a cluster of accidents) or an employer question about a population.", "successSignal": "The signal is confirmed or dismissed with data, the employer receives documented prevention advice, actions are created and the indicators show the effect over time.", "steps": [{"id": "review-live-dashboards", "title": "Review live dashboards per site and population", "actor": "Occupational Health Service Manager / Coordinator", "keyFacts": ["Dashboards show surveillance coverage, medical capacity utilisation, overdue visits, accident rates, action closure, chemical inventory completeness and portal self-service rate per site, entity and period, with drill-down for authorised roles.", "Each persona has a default dashboard: service manager, HSE manager, physician, HR, employer."], "painPoints": ["Managers run on last quarter's figures.", "One dashboard for everyone shows too much to some and too little to others."], "dependencies": [{"type": "brick", "id": "dash", "name": "Dashboards and KPIs", "description": "Role dashboards.", "how": "Provides role-specific dashboards with drill-down."}, {"type": "brick", "id": "iden", "name": "Identity, SSO, Roles and Consent", "description": "Role scoping.", "how": "Scopes dashboards to the user's role and perimeter."}]}, {"id": "detect-a-collective-health-signal", "title": "Detect a collective health signal on a population", "actor": "Occupational Physician", "keyFacts": ["Collective monitoring aggregates anonymised findings (audiometry shifts, spirometry declines, blood pressure, questionnaire scores, opinions with restrictions) by workstation, ex s and situations."}]}, {"id": "advise-the-employer-and-create-actions", "title": "Advise the employer and create prevention actions", "actor": "Occupational Physician", "keyFacts": ["The physician issues documented prevention advice to the employer (a legal role of the occupational physician in France and Belgium), and the adviser creates actions with owners; the advice and the employer's response are recorded.", "Advice is presented to the CSE/CPPT where appropriate."], "painPoints": ["Advice given verbally in a meeting is not followed and not traceable.", "Employers who ignore written advice carry the liability, but only if the advice is recorded."], "dependencies": [{"type": "brick", "id": "cohm", "name": "Collective Health Monitoring", "description": "Advice record.", "how": "Records the advice and the employer's response."}, {"type": "brick", "id": "actn", "name": "Action Plan Management", "description": "Prevention actions.", "how": "Creates and follows the actions."}]}, {"id": "track-the-effect-over-time", "title": "Track the effect of measures over time", "actor": "HSE Manager / Prevention Adviser", "keyFacts": ["The indicators for the population are followed after the measures, and the case is closed when the signal returns to baseline or a new surveillance rule is set; the outcome is reported in the annual report.", "Effects across sites inform group-wide standards."], "painPoints": ["Measures are never evaluated.", "Lessons stay on one site."], "dependencies": [{"type": "brick", "id": "dash", "name": "Dashboards and KPIs", "description": "Trend tracking.", "how": "Shows indicator trends after measures."}, {"type": "brick", "id": "cohm", "name": "Collective Health Monitoring", "description": "Case closure.", "how": "Closes the case with the outcome."}, {"type": "brick", "id": "surv", "name": "Surveillance Rules and Periodicity Engine", "description": "Surveillance adjustment.", "how": "Adjusts surveillance rules where decided."}]}]}], "outcomes": ["Service     function escapeHtml(value) {

            .replaceAll("'", '&#39;');

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }

        });
        return Array.from(dependencyIndex.values());

            trigger: flow.trigger || firstStep.trigger || '',

                    html += '<span class="muted">No pain points listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';
            html += '</thead><tbody>';

            dependenciesInFlow.forEach(dependency => {
                const dependencyTypeLabel = 'Product Brick';
                html += '<tr>';
                html += '<td>';
                html += '<div class="flow-dependency-header">';
                html += renderFlowDependencyIcon(dependency, 'flow-dependency-icon');
                html += '<div>';
                html += '<a class="flow-dependency-name" href="../landing_pages/' + escapeHtml(dependency.id) + '.html">' + escapeHtml(dependency.name || dependency.id) + '</a>';
                if (dependency.interface) {
                    html += '<div class="muted">' + escapeHtml(dependency.interface) + '</div>';
                }
                html += '</div>';
                html += '</div>';
                html += '</td>';
                (flow.steps || []).forEach(step => {
                    const stepDependency = getStepDependency(step, dependency);
                    if (!stepDependency) {
                        html += '<td class="flow-cell-empty">-</td>';
                        return;
                    }
                    html += '<td class="flow-cell-active">';
                    html += '<div class="flow-cell-copy">' + escapeHtml(simplifySupportCopy(stepDependency.how || stepDependency.description || 'Supports this step.')) + '</div>';
                    html += '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            html += '</div>';
            html += '</div>';
        });

        document.getElementById('tab_content_flows').innerHTML = html;
    }

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';
        }
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-title">' + escapeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                count++;
                html += '<div class="link-entry">';
                html += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(link.link || '#') + '">'
                    + escapeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>


<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Occupational Health and Safety Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Streams Index"
    },
    {
      "label": "Monitor health and safety performance"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
