2", "link": "https://dashboard.example.com/real-estate-erp-platform/customers/mdir/kpis/bo-mdir-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-mdir-bo-mdir-top.png"}, "branches": [{"id": "bo-mdir-b1", "name": "Module attach and expansion", "description": "How far each tenant expands beyond the core modules into portals, hyper automation, projects, VvE and the API Platform.", "currentValue": "55", "icon": "kpi-mdir-bo-mdir-b1.png", "children": [{"id": "bo-mdir-b1-c1", "name": "Modules per tenant", "description": "Average number of paid modules, portals and add-ons active per tenant out of the eight modules and the foundation add-ons.", "unit": "modules", "currentValue": "4.6", "targetValue": "6.8", "icon": "kpi-mdir-bo-mdir-b1-c1.png", "children": [{"id": "bo-mdir-b1-c1-l1", "name": "Portal module attach rate", "description": "Share of tenants with at least one branded tenant, owner or supplier portal live.", "unit": "%", "currentValue": "52", "targetValue": "85", "icon": "kpi-mdir-bo-mdir-b1-c1-l1.png", "children": []}, {"id": "bo-mdir-b1-c1-l2", "name": "Hyper automation attach rate", "description": "Share of tenants running at least one financial or technical robot in production.", "unit": "%", "currentValue": "38", "targetValue": "75", "icon": "kpi-mdir-bo-mdir-b1-c1-l2.png", "children": []}]}, {"id": "bo-mdir-b1-c2", "name": "Net revenue retention", "description": "Recurring revenue from last year's tenants this year, including unit growth, module expansion and churn.", "unit": "%", "currentValue": "106", "targetValue": "118", "icon": "kpi-mdir-bo-mdir-b1-c2.png", "children": [{"id": "bo-mdir-b1-c2-l1", "name": "Upsell revenue share", "description": "Share of recurring revenue coming from modules, portals and units added after the initial contract.", "unit": "%", "currentValue": "11", "targetValue": "22", "icon": "kpi-mdir-bo-mdir-b1-c2-l1.png", "children": []}, {"id": "bo-mdir-b1-c2-l2", "name": "Price realization vs list", "description": "Realised subscription price as a share of list price after discounts, including migrated Informant contracts.", "unit": "%", "currentValue": "85", "targetValue": "94", "icon": "kpi-mdir-bo-mdir-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-mdir-b2", "name": "Acquisition and migration", "description": "How fast new real estate organisations and migrating Informant customers sign and go live, and how reliably existing tenants renew.", "currentValue": "50", "icon": "kpi-mdir-bo-mdir-b2.png", "children": [{"id": "bo-mdir-b2-c1", "name": "New tenants per quarter", "description": "Real estate organisations signing a subscription per quarter, new logos and Informant migrations combined.", "unit": "tenants / quarter", "currentValue": "12", "targetValue": "25", "icon": "kpi-mdir-bo-mdir-b2-c1.png", "children": [{"id": "bo-mdir-b2-c1-l1", "name": "Demo-to-contract conversion rate", "description": "Share of demos on the prospect's own portfolio that convert to a signed subscription.", "unit": "%", "currentValue": "30", "targetValue": "42", "icon": "kpi-mdir-bo-mdir-b2-c1-l1.png", "children": []}, {"id": "bo-mdir-b2-c1-l2", "name": "Informant migrations completed per quarter", "description": "Informant customers fully live on the platform per quarter under the phased migration programme running until end 2027.", "unit": "migrations / quarter", "currentValue": "6", "targetValue": "20", "icon": "kpi-mdir-bo-mdir-b2-c1-l2.png", "children": []}]}, {"id": "bo-mdir-b2-c2", "name": "Logo churn rate", "description": "Share of tenants that terminate their subscription in a year, including Informant customers that do not migrate.", "unit": "%", "currentValue": "4.5", "targetValue": "2.5", "icon": "kpi-mdir-bo-mdir-b2-c2.png", "children": [{"id": "bo-mdir-b2-c2-l1", "name": "Onboarding time to first rent run", "description": "Days from contract signature to the first live rent run produced in the platform.", "unit": "days", "currentValue": "110", "targetValue": "50", "icon": "kpi-mdir-bo-mdir-b2-c2-l1.png", "children": []}, {"id": "bo-mdir-b2-c2-l2", "name": "Subscription renewal rate", "description": "Share of contracts renewed at term without downgrade.", "unit": "%", "currentValue": "93", "targetValue": "97", "icon": "kpi-mdir-bo-mdir-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Give every director of a real estate organisation, from a 50-unit private manager to a 20,000-unit investor, one real estate ERP that runs the whole lifecycle from object to bank statement and lets the business grow in units, clients and margin without growing the back office.", "timeHorizons": {"year1": {"focus": "Bring the Informant base onto the platform without losing trusted service: a phased, free migration with a parallel run, VvE administration as a full module, deeper financial and technical hyper automation, and professionalised onboarding, support and sales under the new CEO so that a director experiences the switch as an upgrade.", "productTheme": "One platform, migrated base: safe migration and automation that pays back in a quarter", "customerKPI": {"northStar": "Revenue per FTE", "supporting": ["Units managed per FTE", "Manual re-keying incidents per 100 units"]}, "businessKPI": {"northStar": "Annual recurring revenue per tenant", "revenueStreams": ["ERP core subscriptions", "Portal, VvE and hyper automation add-ons", "Implementation, migration and training services"], "supporting": ["Informant migrations completed per quarter", "Onboarding time to first rent run"]}, "milestones": ["Publish the Informant migration playbook with import tooling, parallel-run checklist and per-firm migration plan", "Ship reconciliation, invoice-coding and indexation robots to every tenant on the financial module", "Launch the VvE module on the platform and move the first association administrators off Informant"]}, "year3": {"focus": "Become the real estate ERP standard for the Netherlands and gain a foothold in Germany: a modular platform where portals and the API Platform are a standard attach, a certified-integration marketplace replaces bespoke connectors, German accounting, VAT and tenancy-law localisation, and selective acquisitions that add segments, geography or capabilities.", "productTheme": "The Dutch real estate ERP standard with portals and integrations as standard attach", "customerKPI": {"northStar": "Revenue per FTE", "supporting": ["Operating margin", "Client retention rate"]}, "businessKPI": {"northStar": "Annual recurring revenue per tenant", "revenueStreams": ["Modular ERP subscriptions scaled by units", "Portal and API Platform fees", "Certified-integration marketplace revenue share"], "supporting": ["Portal module attach rate", "Net revenue retention"]}, "milestones": ["Open the certified-integration marketplace with accounting, bank, BI, e-mail, e-signing and maintenance partner connectors", "Go live with the first German tenants on a localised accounting, VAT and tenancy pack", "Complete at least one further acquisition and migrate its customers with the standard tooling"]}, "year5": {"focus": "Scale across Europe and let AI agents run routine administration under human supervision, so directors in several countries steer their business on platform data products such as rent benchmarks, maintenance forecasts and portfolio market analysis.", "productTheme": "European scale and autonomous administration", "customerKPI": {"northStar": "Revenue per FTE", "supporting": ["Straight-through processed transactions share", "Management meetings run on live dashboard"]}, "businessKPI": {"northStar": "Annual recurring revenue per tenant", "revenueStreams": ["Multi-country ERP subscriptions", "AI administration agents", "Data products: rent benchmarks, maintenance forecasts and market analysis"], "supporting": ["Upsell revenue share", "Logo churn rate"]}, "milestones": ["Run invoice coding, reconciliation, ticket triage and indexation letters through supervised AI agents for the majority of tenants", "Operate tenants in at least three European countries with local compliance packs", "Publish rent benchmark and maintenance forecast data products subscribed by investors and managers"]}}}, "domain": "Real Estate Business Leadership"}, {"id": "tena", "name": "Tenant", "description": "The person or business that rents from an organisation on the platform: a couple in a Rockfield or Urban Interest apartment, a family in a social or mid-rent home administered by a property manager such as FIT Vastgoedbeheer, a shop owner in a retail unit, a logistics company in a warehouse or a healthcare practice in a converted office. Pays rent and service charges monthly, receives the annual indexation letter and the service charge settlement, reports a leaking tap or a broken lift, wants to know what has been paid and what is due, and needs the contract, the inspection report and the deposit statement when moving in or out. Uses the branded tenant portal and app for free; the organisation pays, and the tenant's self-service is what saves the manager handling time and errors.", "icon": "tena.png", "careAbout": ["Knowing at any time what rent and service charges are due, what has been paid and when the direct debit runs, without calling the office", "Reporting a fault in two minutes on a phone with photos, and then seeing who is coming, when, and that it was fixed", "Understanding the annual indexation and the service charge settlement in plain language and being able to check the numbers", "Having the contract, the house rules, the inspection report and every letter in one place instead of in old e-mails", "Giving notice, changing a co-tenant or updating a bank account once and seeing it processed", "Being treated the same whether the property is owned by a fund, a private owner or an association, and being heard when something goes wrong"], "winsThem": ["A branded app on iOS and Android that shows rent, charges, payment status and documents the day the account is activated", "A fault report with photos that turns into a ticket with a status, a supplier appointment and a completion message without a phone call", "iDEAL payment and direct debit management in the portal, with a payment arrangement option when money is tight", "Indexation letters and service charge settlements that explain the calculation and link to the underlying contract clause", "A digital move-in: e-signed contract, inspection report with photos and deposit confirmation before the keys are handed over"], "theirFear": ["Paying twice or being chased for arrears that were caused by a wrong account number or a failed direct debit nobody told them about", "A fault report that disappears into a mailbox while the leak spreads, and a supplier who arrives when nobody is home", "Losing the deposit or being surprised by a service charge settlement they cannot verify"], "jobsToBeDone": [{"id": "jtbd-tena-1", "name": "Pay rent and understand my charges without calling", "whatItIs": "See every month what rent, service charges and other amounts are due and paid, pay through iDEAL or direct debit, arrange a payment plan when needed, and understand indexation and the annual service charge settlement from the documents in the portal instead of from a phone call to the office.", "outcome": "The tenant pays on time with no surprises, arrears and reminders are avoided or resolved in the portal, and the manager's office receives no payment status questions.", "steps": [{"step": "Activate the tenant portal or app", "description": "Open the invitation from the contract confirmation e-mail, verify identity, set a password or use a login link, install the branded app from the app store and see the contract, the unit and the first invoice.", "streamsNeeded": [{"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Creates the portal account linked to the tenant's relation and contract and delivers the branded web and app experience."}]}, {"step": "See rent, charges and payment status", "description": "Check the monthly rent invoice with its split into net rent, service charges and other items, see whether the direct debit has run, what is still open and when the next debit is planned.", "streamsNeeded": [{"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Produces the periodic rent invoice and the payment status from the rent run and bank reconciliation."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Shows invoices, payments and the open balance in the tenant portal and app in real time."}]}, {"step": "Pay, set up direct debit or arrange a payment plan", "description": "Pay an open invoice with iDEAL, give or change a direct debit mandate, update the bank account, and when money is tight request a payment arrangement that the manager approves in the same thread.", "streamsNeeded": [{"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Handles online payments, direct debit mandates, arrears follow-up and payment arrangements on the contract."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Offers payment, mandate and arrangement requests as self-service actions in the portal."}]}, {"step": "Understand indexation and the service charge settlement", "description": "Read the annual indexation letter with the applied percentage and the legal cap, and the service charge settlement with advances paid, actual costs and the amount to pay or receive, and ask a question on the document if something does not add up.", "streamsNeeded": [{"id": "manage-leases-through-their-lifecycle", "name": "Manage Leases Through Their Lifecycle", "howItSupports": "Calculates indexation and service charge settlements per contract and generates the explanatory letters."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Publishes the letters and settlements to the tenant with a question thread on each document."}]}]}, {"id": "jtbd-tena-2", "name": "Report a fault and see it fixed", "whatItIs": "Report a defect in the home, the building or the installation with photos and a description, be told who is responsible and when someone comes, let the supplier in at a time that suits, confirm the work was done, and rate the result, all from the app and without chasing the office.", "outcome": "Faults are fixed at the first visit, the tenant always knows the status, and nobody has to call the office to find out what is happening.", "steps": [{"step": "Report the fault with photos", "description": "Pick the unit, the room and the category (heating, water, electricity, doors and locks, common areas), add photos and a description, indicate urgency and availability, and receive a ticket number immediately.", "streamsNeeded": [{"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Creates the ticket on the unit with photos, category and urgency and starts triage."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Provides the guided fault report form in the tenant app with photo upload and availability."}]}, {"step": "Get triaged and scheduled", "description": "See whether the fault is the tenant's, the owner's or the association's responsibility, which supplier has been assigned, and pick or confirm an appointment slot proposed by the supplier.", "streamsNeeded": [{"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Triages responsibility, creates the work order, dispatches the supplier and captures the appointment."}, {"id": "plan-and-execute-periodic-maintenance", "name": "Plan and Execute Periodic Maintenance", "howItSupports": "Links the fault to the installation register so the right maintenance contractor and warranty apply."}]}, {"step": "Let the supplier in and confirm the work", "description": "Receive a reminder before the visit, let the technician in or use the arranged key handover, and confirm in the app that the fault is solved or report that it is not.", "streamsNeeded": [{"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Records the supplier's completion report and the tenant's confirmation on the ticket."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Sends reminders and status notifications and lets the tenant confirm or reopen from the app."}]}, {"step": "Rate the result and keep the history", "description": "Rate the handling of the ticket, see the full history of reports on the unit, and refer back to it when the same installation fails again or at the move-out inspection.", "streamsNeeded": [{"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Closes the ticket with the rating and keeps the maintenance history per unit."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Shows the tenant's ticket history and ratings in the app."}]}]}, {"id": "jtbd-tena-3", "name": "Manage my tenancy documents and changes myself", "whatItIs": "From signing to moving out, find the contract, the house rules, inspection reports, letters and settlements in one place, request changes such as a co-tenant, a name change or a new bank account, give notice with the right notice period, and settle the deposit after the final inspection, without visiting or calling the office.", "outcome": "The tenant has every document at hand, changes are processed once and correctly, and the move-out and deposit settlement hold no surprises.", "steps": [{"step": "Sign digitally and find the contract and documents", "description": "E-sign the lease and the house rules from the invitation, and afterwards find the signed contract, the energy label, the move-in inspection report with photos and every letter in the document section of the portal.", "streamsNeeded": [{"id": "let-units-and-sign-contracts", "name": "Let Units and Sign Contracts", "howItSupports": "Generates the contract from the unit and candidate data and runs the e-signing and move-in inspection."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Files every contract, report and letter on the tenant's portal account."}]}, {"step": "Request changes to the tenancy", "description": "Ask to add or remove a co-tenant, change a name or bank account, request a pet or a small alteration, or exercise a break option, and follow the request until the manager confirms it.", "streamsNeeded": [{"id": "manage-leases-through-their-lifecycle", "name": "Manage Leases Through Their Lifecycle", "howItSupports": "Processes contract changes, special terms and break options with the correct addendum."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Offers change requests as guided self-service actions with status tracking."}]}, {"step": "Give notice and plan the move-out", "description": "Give notice in the portal, see the end date calculated from the notice period, receive the move-out checklist and inspection appointment, and hand back the keys against a signed final inspection report.", "streamsNeeded": [{"id": "manage-leases-through-their-lifecycle", "name": "Manage Leases Through Their Lifecycle", "howItSupports": "Registers the termination, calculates the end date and schedules the final inspection."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Provides the notice form, the checklist and the inspection appointment in the app."}]}, {"step": "Settle the deposit and the final charges", "description": "Receive the deposit statement with any deductions explained by inspection photos, the final service charge settlement and the last rent invoice, and see the refund arrive on the registered account.", "streamsNeeded": [{"id": "manage-leases-through-their-lifecycle", "name": "Manage Leases Through Their Lifecycle", "howItSupports": "Settles the deposit and the final service charges against the inspection findings."}, {"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Issues the final invoice and pays out the deposit refund through the bank integration."}]}]}], "customerJourneyStories": [{"id": "journey-tena-1", "name": "From calling the office to the tenant app", "linkedJobIds": ["jtbd-tena-1", "jtbd-tena-2"], "summary": "A family renting from a property manager that has just switched to the platform adopts the branded tenant app: triggered by a failed direct debit and a leak, discovering the app through the manager's letter and the caretaker, evaluating it for trust and simplicity, trying it with one fault report and one payment, and using it for everything since.", "stages": [{"stage": "Trigger", "narrative": "In the same month a direct debit fails after the bank changed the account number, a reminder letter arrives, and the kitchen tap starts leaking. Three phone calls to the manager's office, two of them on hold, leave the family unsure whether the arrears are cleared and when the plumber comes."}, {"stage": "Discovery", "narrative": "The manager's letter about the new system mentions a tenant app in the manager's own name, and the caretaker shows it on his phone during a visit: the invoice, the payment status and a fault report form with photos. The invitation e-mail with the activation link is still in the inbox."}, {"stage": "Evaluation", "narrative": "Before activating, the family checks that the app is the one the manager named, that payment goes through iDEAL and that the manager's office sees the same information. The clear split of rent and service charges, the visible direct debit date and the option to add a second account holder win them over."}, {"stage": "Trial", "narrative": "They report the leaking tap with two photos and pick a morning slot; the plumber's appointment appears the next day and the tap is fixed at the first visit. They update the bank account and pay the open month with iDEAL from the same screen, and the arrears disappear from the overview that afternoon."}, {"stage": "Engagement", "narrative": "The indexation letter and the service charge settlement arrive in the app with the calculation explained; a question on the settlement is answered in the document thread within two days. The app is the first place the family looks when anything about the home comes up."}, {"stage": "Retention", "narrative": "A year later they add a co-tenant through a change request, download the inspection report to check a scratch on the floor, and rate the handling of a heating ticket five stars. They have not called the office since the tap."}]}, {"id": "journey-tena-2", "name": "A digital move-in from e-signature to deposit refund", "linkedJobIds": ["jtbd-tena-3", "jtbd-tena-1"], "summary": "A young professional renting a mid-rent apartment from a fund's asset manager experiences the whole tenancy digitally: triggered by a successful application, discovering the portal through the e-signing invitation, evaluating its trustworthiness on the contract and rent-price check, trialling it with the move-in inspection and first payment, living in it for three years and leaving with a same-week deposit refund.", "stages": [{"stage": "Trigger", "narrative": "After weeks of viewings the application for an apartment is accepted; the letting agent explains that the contract will be signed digitally and that everything about the tenancy will run through the owner's tenant portal. The tenant wants to be sure the rent is legal and the deposit is safe before signing."}, {"stage": "Discovery", "narrative": "The e-signing invitation opens the contract, the rent-price check result, the house rules and a portal preview showing the first invoice and the direct debit mandate. The letting agent's e-mail carries the app store links under the asset manager's brand."}, {"stage": "Evaluation", "narrative": "The tenant reads the contract clause by clause, checks the indexation clause against the legal cap, sees the rent-price check and the deposit amount confirmed, and looks up the asset manager's reviews. The transparency of the documents and the fact that the deposit confirmation appears in the portal on payment settle the doubt."}, {"stage": "Trial", "narrative": "The contract is signed on a phone, the deposit and first month are paid with iDEAL, and the move-in inspection is done with the agent on a tablet: photos and meter readings land in the portal the same afternoon, before the keys are handed over."}, {"stage": "Engagement", "narrative": "For three years rent runs by direct debit, the annual indexation letter and settlement appear with explanations, a broken intercom is fixed after a ticket with a photo, and a name change after a marriage is processed through a change request in a week."}, {"stage": "Retention", "narrative": "Notice is given in the portal, the end date and the inspection appointment are confirmed automatically, the final inspection matches the move-in photos, and the deposit refund arrives the same week with a statement. The tenant asks the next landlord whether they have the same app."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-tena-top", "name": "Self-service resolution rate", "description": "Share of tenant questions, payments, fault reports and change requests that are fully resolved through the portal and app without a phone call, e-mail or visit to the office, the tenant's headline measure of being served without chasing.", "unit": "%", "currentValue": "46", "targetValue": "75", "link": "https://dashboard.example.com/real-estate-erp-platform/customers/tena/kpis/co-tena-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-tena-co-tena-top.png"}, "branches": [{"id": "co-tena-b1", "name": "Money and documents clarity", "description": "How well the tenant understands and manages rent, charges, payments and documents without asking the office.", "currentValue": "52", "icon": "kpi-tena-co-tena-b1.png", "children": [{"id": "co-tena-b1-c1", "name": "Rent and charges self-service share", "description": "Share of payments, mandate changes and payment arrangements completed by tenants in the portal.", "unit": "%", "currentValue": "41", "targetValue": "75", "icon": "kpi-tena-co-tena-b1-c1.png", "children": [{"id": "co-tena-b1-c1-l1", "name": "Tenant portal activation rate", "description": "Share of active contracts with at least one activated tenant portal or app account.", "unit": "%", "currentValue": "48", "targetValue": "85", "icon": "kpi-tena-co-tena-b1-c1-l1.png", "children": []}, {"id": "co-tena-b1-c1-l2", "name": "Payment status calls per 100 tenants", "description": "Phone calls and e-mails to the office per month asking what has been paid or is due.", "unit": "calls / 100 tenants / month", "currentValue": "9", "targetValue": "2", "icon": "kpi-tena-co-tena-b1-c1-l2.png", "children": []}]}, {"id": "co-tena-b1-c2", "name": "Document self-service rate", "description": "Share of contract, letter, settlement and inspection documents retrieved by tenants from the portal instead of requested from the office.", "unit": "%", "currentValue": "55", "targetValue": "90", "icon": "kpi-tena-co-tena-b1-c2.png", "children": [{"id": "co-tena-b1-c2-l1", "name": "Documents retrieved within 24 hours", "description": "Share of published indexation letters and settlements opened by the tenant within a day of the notification.", "unit": "%", "currentValue": "38", "targetValue": "70", "icon": "kpi-tena-co-tena-b1-c2-l1.png", "children": []}, {"id": "co-tena-b1-c2-l2", "name": "Settlement questions per 100 settlements", "description": "Questions and disputes raised on annual service charge settlements, a measure of how understandable the settlement is.", "unit": "questions / 100 settlements", "currentValue": "14", "targetValue": "5", "icon": "kpi-tena-co-tena-b1-c2-l2.png", "children": []}]}]}, {"id": "co-tena-b2", "name": "Faults fixed and being heard", "description": "How quickly and visibly fault reports are handled, and how satisfied tenants are with the organisation behind the app.", "currentValue": "58", "icon": "kpi-tena-co-tena-b2.png", "children": [{"id": "co-tena-b2-c1", "name": "Fault report response time", "description": "Hours from a tenant's fault report to the first substantive response with responsibility and next step.", "unit": "hours", "currentValue": "31", "targetValue": "8", "icon": "kpi-tena-co-tena-b2-c1.png", "children": [{"id": "co-tena-b2-c1-l1", "name": "First response within one working day", "description": "Share of fault reports that receive triage and a supplier assignment within one working day.", "unit": "%", "currentValue": "62", "targetValue": "95", "icon": "kpi-tena-co-tena-b2-c1-l1.png", "children": []}, {"id": "co-tena-b2-c1-l2", "name": "Status updates per ticket", "description": "Average number of status notifications the tenant receives per ticket from report to closure.", "unit": "updates / ticket", "currentValue": "1.8", "targetValue": "4", "icon": "kpi-tena-co-tena-b2-c1-l2.png", "children": []}]}, {"id": "co-tena-b2-c2", "name": "Tenant satisfaction score", "description": "Average tenant rating of the organisation's service across ticket ratings and periodic surveys.", "unit": "score 1-10", "currentValue": "7.1", "targetValue": "8.2", "icon": "kpi-tena e", "description": "Share of portal organisations that have published the branded iOS and Android app, not only the web portal.", "unit": "%", "currentValue": "40", "targetValue": "75", "icon": "kpi-tena-bo-tena-b1-c1-l2.png", "children": []}]}, {"id": "bo-tena-b1-c2", "name": "Monthly active tenants on portals", "description": "Tenant accounts with at least one login per month as a share of activated accounts.", "unit": "%", "currentValue": "33", "targetValue": "55", "icon": "kpi-tena-bo-tena-b1-c2.png", "children": [{"id": "bo-tena-b1-c2-l1", "name": "Tenant logins per unit per month", "description": "Average portal and app sessions per rental unit per month.", "unit": "sessions / unit / month", "currentValue": "1.4", "targetValue": "3", "icon": "kpi-tena-bo-tena-b1-c2-l1.png", "children": []}, {"id": "bo-tena-b1-c2-l2", "name": "Portal messaging usage rate", "description": "Share of tenant-to-manager conversations started in the portal thread rather than by e-mail or phone.", "unit": "%", "currentValue": "29", "targetValue": "65", "icon": "kpi-tena-bo-tena-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-tena-b2", "name": "Handling cost and collection impact", "description": "What tenant self-service saves the organisation in handling time and what it does for on-time rent collection.", "currentValue": "51", "icon": "kpi-tena-bo-tena-b2.png", "children": [{"id": "bo-tena-b2-c1", "name": "Handling minutes saved per unit", "description": "Estimated office handling minutes per unit per month avoided through portal self-service, versus a phone and e-mail baseline.", "unit": "minutes / unit / month", "currentValue": "9", "targetValue": "22", "icon": "kpi-tena-bo-tena-b2-c1.png", "children": [{"id": "bo-tena-b2-c1-l1", "name": "Rent questions to office per 100 units", "description": "Rent, charge and document questions reaching the office by phone or e-mail per month.", "unit": "questions / 100 units / month", "currentValue": "12", "targetValue": "3", "icon": "kpi-tena-bo-tena-b2-c1-l1.png", "children": []}, {"id": "bo-tena-b2-c1-l2", "name": "Fault reports by phone share", "description": "Share of fault reports that still arrive by phone or e-mail instead of through the app.", "unit": "%", "currentValue": "54", "targetValue": "15", "icon": "kpi-tena-bo-tena-b2-c1-l2.png", "children": []}]}, {"id": "bo-tena-b2-c2", "name": "Rent paid on time via portal", "description": "Share of rent invoices of portal-active tenants paid by the due date.", "unit": "%", "currentValue": "93", "targetValue": "97.5", "icon": "kpi-tena-bo-tena-b2-c2.png", "children": [{"id": "bo-tena-b2-c2-l1", "name": "Direct debit mandate share", "description": "Share of active contracts paying by direct debit mandate managed in the portal.", "unit": "%", "currentValue": "71", "targetValue": "88", "icon": "kpi-tena-bo-tena-b2-c2-l1.png", "children": []}, {"id": "bo-tena-b2-c2-l2", "name": "Online payment success rate", "description": "Share of iDEAL and card payments started in the portal that complete successfully.", "unit": "%", "currentValue": "94", "targetValue": "98", "icon": "kpi-tena-bo-tena-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Let every tenant of every organisation on the platform pay, report, sign and find everything about their home or business premises in one branded app, so that the organisation's service feels personal at scale and the tenant never has to call the office to find out what is going on.", "timeHorizons": {"year1": {"focus": "Bring the tenant portal and app of both the platform and the migrated Informant base onto one branded experience with rent and payment status, iDEAL and direct debit, guided fault reports with photos, document delivery and change requests working the same way for residential and commercial tenants.", "productTheme": "One branded tenant app across the migrated base", "customerKPI": {"northStar": "Self-service resolution rate", "supporting": ["Tenant portal activation rate", "Fault report response time"]}, "businessKPI": {"northStar": "Tenant portal adoption across client organisations", "revenueStreams": ["Tenant portal and app module subscriptions", "Branded app publishing fees", "Payment and direct debit transaction services"], "supporting": ["Organisations with live tenant portal", "Tenant portal module attach rate"]}, "milestones": ["Launch the unified tenant portal and app with payment status, iDEAL, mandates, fault reports and documents for every tenant organisation", "Migrate Informant tenants to the branded app with activation campaigns run by the property managers", "Ship the digital move-in flow: e-signing, inspection report with photos and deposit confirmation in the app"]}, "year3": {"focus": "Make the tenant app the standard channel for Dutch tenants of platform organisations and localise it for Germany: proactive notifications on tickets and payments, explained indexation and settlements, payment arrangements, and app ratings that property managers use as a selling point to owners.", "productTheme": "The standard tenant channel in the Netherlands, ready for Germany", "customerKPI": {"northStar": "Self-service resolution rate", "supporting": ["Document self-service rate", "Tenant satisfaction score"]}, "businessKPI": {"northStar": "Tenant portal adoption across client organisations", "revenueStreams": ["Tenant portal subscriptions scaled by units", "Payment services and arrangement handling fees", "German tenant app licences"], "supporting": ["Monthly active tenants on portals", "Rent paid on time via portal"]}, "milestones": ["Reach the majority of platform units with a live branded tenant app", "Add explained indexation, settlement and payment arrangement flows with in-document question threads", "Launch the German-language tenant app with local payment methods and tenancy rules"]}, "year5": {"focus": "Let an AI assistant in the tenant app answer rent, settlement and contract questions and triage fault reports before a human is involved, across several European countries, so that tenant service runs largely unattended under the manager's supervision.", "productTheme": "AI-assisted tenant service across Europe", "customerKPI": {"northStar": "Self-service resolution rate", "supporting": ["Rent and charges self-service share", "Status updates per ticket"]}, "businessKPI": {"northStar": "Tenant portal adoption across client organisations", "revenueStreams": ["AI tenant assistant subscriptions", "Multi-country tenant app licences", "Tenant experience benchmark data products"], "supporting": ["Handling minutes saved per unit", "Portal messaging usage rate"]}, "milestones": ["Run first-line tenant questions and ticket triage through a supervised AI assistant for the majority of tenant organisations", "Operate the tenant app in at least three European countries", "Publish tenant service benchmarks that organisations use in owner and investor reporting"]}}}, "domain": "Tenants, Owners and Maintenance Partners"}, {"id": "ownr", "name": "Private Property Owner", "description": "An individual, family or small company that owns rental property or an apartment but does not administer it: a retired couple with six apartments managed by a firm such as FIT Vastgoedbeheer or Ruijters, a dentist whose practice building and two shops are let by a property manager, a family office with a portfolio of forty homes, or the owner of an apartment in a building whose owners' association is administered by a VvE administrator from the Informant base. Wants to know what the property earns, what it costs, what has been paid out and why, wants to approve repairs, quotes and association decisions quickly, and wants every statement, contract, meeting document and tax overview in one place. Uses the branded owner portal for free; the manager or administrator pays, and the owner's self-service is what keeps mandates renewing.", "icon": "ownr.png", "careAbout": ["Seeing the monthly or quarterly statement on time, with rent received, costs deducted, management fee and the amount paid out, and being able to check every line", "Knowing the net return on each property and whether vacancy, arrears or maintenance cost is eating into it", "Approving a repair quote, a new tenant or an association decision from a phone in minutes, with enough information to decide", "Finding the management agreement, lease contracts, annual statements for the tax return and association documents without asking", "Being told before a problem becomes expensive: a leak, an arrears case, a lapsed inspection or a reserve fund that is too low", "Trusting that the manager handles their money and tenants correctly and compliantly, and being able to see it"], "winsThem": ["An owner portal in the manager's brand with a dashboard per property: occupancy, rent, arrears, costs and net return updated from the same ledger the statement comes from", "Statements published on a fixed day each period with the underlying invoices and bank lines attached", "Approval requests with quote, photos, budget context and a one-tap decision, and visible follow-through on the work", "Annual statements and tax overviews per property downloadable in one click, plus association meeting documents and decisions in the same portal", "Notifications on tickets, arrears, inspections and reserve fund status before the manager calls"], "theirFear": ["Being paid out less than they are owed or being charged for work that was never done, and finding out only at the annual statement", "A decision taken on their property or in their association without their knowledge, or a delay because their approval sat in someone's inbox", "The manager or administrator changing systems and losing years of documents and history"], "jobsToBeDone": [{"id": "jtbd-ownr-1", "name": "See how my property performs and what I am paid", "whatItIs": "Follow, per property and in total, what rent is invoiced and received, what costs and fees are deducted, what arrears and vacancy exist and what the net payout and return are, from the same figures the manager's ledger and statement are based on, and ask about anything that looks wrong.", "outcome": "The owner trusts the statement, knows the return on each property, and raises questions from facts rather than from suspicion.", "steps": [{"step": "Activate the owner portal and see the dashboard", "description": "Open the invitation from the manager, verify identity, and see the properties, units, tenants, occupancy and the current period's rent and costs on one dashboard.", "streamsNeeded": [{"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Creates the owner account linked to the owner's entities and objects and renders the branded owner dashboard."}, {"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Provides the occupancy, rent and cost figures per property the dashboard shows."}]}, {"step": "Read the periodic statement", "description": "Receive the notification that the statement is ready, open it, and see rent received, costs, management fee, VAT where applicable and the amount paid out, each line linked to the invoice or bank line behind it.", "streamsNeeded": [{"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Produces the owner statement from the closed period of the owner's entity."}, {"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Supplies the invoiced and received rent per unit that the statement summarises."}]}, {"step": "Compare income, costs, arrears and return over time", "description": "Look at rent growth after indexation, vacancy days, maintenance cost per unit, arrears cases and net return per property over the last years, and compare properties with each other.", "streamsNeeded": [{"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Provides the multi-period analysis of income, cost, vacancy and return per property."}, {"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Shows current arrears cases and the dunning steps taken per tenant."}]}, {"step": "Ask and discuss with the manager", "description": "Ask a question on a statement line or a cost item in the portal thread, receive the answer with the document attached, and keep the conversation with the history of the property.", "streamsNeeded": [{"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Provides document-level question threads between owner and manager with full history."}]}]}, {"id": "jtbd-ownr-2", "name": "Approve decisions and expenses quickly", "whatItIs": "Decide on repair quotes above the mandate threshold, on a proposed tenant and rent, on a renovation or on an owners' association resolution from a phone with the quote, photos, budget context and the manager's advice at hand, and see that the approved work or decision is carried out.", "outcome": "Decisions are taken within days instead of weeks, the tenant's fault or the association's plan does not wait for an e-mail, and the owner has an audit trail of every decision.", "steps": [{"step": "Receive an approval request with context", "description": "Get a notification with the fault report, the supplier's quote, photos, the maintenance history of the installation, the budget position and the manager's recommendation.", "streamsNeeded": [{"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Attaches the ticket, quote and photos to the approval request when the work exceeds the mandate threshold."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Delivers the approval request to the owner portal with a notification and a decision action."}]}, {"step": "Decide in the portal", "description": "Approve, reject or ask for an alternative quote with one tap and a comment, and see the decision logged with date and amount against the property.", "streamsNeeded": [{"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Records the owner's decision and pushes it back into the workflow of the manager."}, {"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Turns the approval into a work order and the rejection into a new quote request."}]}, {"step": "Vote on association decisions", "description": "For an apartment in an owners' association, read the meeting agenda and the budget proposal, vote in the meeting or by proxy through the portal, and see the recorded decisions and the effect on the contribution.", "streamsNeeded": [{"id": "run-owners-association-administration", "name": "Run Owners' Association Administration", "howItSupports": "Publishes agendas, budgets and resolutions and records votes and decisions per owner."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Offers meeting documents and voting to association owners in the owner portal."}]}, {"step": "Track execution and cost", "description": "Follow the approved work order to completion with photos and the supplier invoice, and see the cost land on the next statement and in the multi-year maintenance plan.", "streamsNeeded": [{"id": "plan-and-execute-periodic-maintenance", "name": "Plan and Execute Periodic Maintenance", "howItSupports": "Places the approved work in the maintenance plan and budget of the property."}, {"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Shows completion, photos and the matched supplier invoice on the closed ticket."}]}]}, {"id": "jtbd-ownr-3", "name": "Find every document and statement in one place", "whatItIs": "Have the management agreement, lease contracts, inspection reports, statements, annual overviews for the tax return, insurance policies, association deeds, meeting minutes and decisions per property in one portal that survives a change of manager or system, and share them with an accountant or a buyer when needed.", "outcome": "The owner never asks the manager for a document again, the tax return is prepared from one download, and a sale or a change of manager does not lose history.", "steps": [{"step": "Find contracts and mandate documents", "description": "Open the management agreement, the lease contract per unit with its indexation history, the move-in and move-out inspection reports and the insurance policies from the property's document section.", "streamsNeeded": [{"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Files every contract, report and policy on the owner's property record with search."}, {"id": "manage-leases-through-their-lifecycle", "name": "Manage Leases Through Their Lifecycle", "howItSupports": "Keeps the lease contract, addenda, indexation history and settlements per unit up to date."}]}, {"step": "Download annual statements for the tax return", "description": "Download the annual statement per property and per entity with rent, costs, fees and VAT, in a format the accountant can use, and the WOZ and valuation information the manager holds.", "streamsNeeded": [{"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Produces the annual owner statement per entity from the closed ledger."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Offers the annual statements and valuation documents as downloads in the owner portal."}]}, {"step": "Find association documents and decisions", "description": "For an apartment, open the deed of division, the house rules, the multi-year maintenance plan, meeting minutes, decisions and the reserve fund statement in the same portal.", "streamsNeeded": [{"id": "run-owners-association-administration", "name": "Run Owners' Association Administration", "howItSupports": "Maintains the association's documents, minutes, decisions and reserve fund statements."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Presents association documents to each owner in the branded owner portal."}]}, {"step": "Share with an accountant, a buyer or a new manager", "description": "Give the accountant read access to the statements, prepare a document pack for a buyer's due diligence, or export the full history when the property moves to another manager.", "streamsNeeded": [{"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Provides delegated access for accountants and document pack exports for buyers."}, {"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Delivers statements to the accountant's software and exports history through the API."}]}]}], "customerJourneyStories": [{"id": "journey-ownr-1", "name": "From a quarterly PDF by e-mail to the owner portal", "linkedJobIds": ["jtbd-ownr-1", "jtbd-ownr-2"], "summary": "A retired couple owning six apartments managed by a property management firm adopt the firm's owner portal after the firm moves to the platform: triggered by a statement they could not reconcile and a slow repair approval, discovering the portal through the firm's letter and their accountant, evaluating it for accuracy and security, trying it for one quarter, and renewing the mandate on transparency.", "stages": [{"stage": "Trigger", "narrative": "The quarterly statement PDF shows a payout that is lower than expected, with a maintenance line the couple does not remember approving. Two weeks of e-mail with the manager clear it up, but meanwhile a tenant's boiler replacement waits for their approval in an inbox they rarely check."}, {"stage": "Discovery", "narrative": "The manager's letter about the new system announces an owner portal under the firm's name, and the couple's accountant mentions that other clients send him statements straight from such a portal. The manager's account manager offers to activate it and walk through it on a call."}, {"stage": "Evaluation", "narrative": "The couple check whether the portal shows exactly the same statement as the PDF, whether every line links to an invoice or bank line, how login and two-factor work, and whether the accountant can be given read access. Seeing the disputed maintenance line with the tenant's fault report, the quote and their own e-mailed approval attached settles their doubts."}, {"stage": "Trial", "narrative": "For one quarter they use the portal alongside the PDF: the statement appears on the fifth working day with the bank lines behind it, a repair quote arrives as an approval request with photos and is approved from the phone in an hour, and the dashboard shows one apartment with rising arrears before the manager calls about it."}, {"stage": "Engagement", "narrative": "The PDF is switched off. The couple check the dashboard monthly, approve quotes within a day, download the annual statements for the tax return themselves and ask questions in the document thread instead of by e-mail. The accountant works from the portal directly."}, {"stage": "Retention", "narrative": "When the management agreement comes up for renewal, transparency decides it: the couple renew for five years, move two apartments inherited from a relative to the same manager, and recommend the firm to a friend with a small portfolio."}]}, {"id": "journey-ownr-2", "name": "An apartment owner goes digital after the association's Informant migration", "linkedJobIds": ["jtbd-ownr-2", "jtbd-ownr-3"], "summary": "The owner of an apartment in a 48-unit building adopts the owner portal after the VvE administrator migrates from Informant to the platform: triggered by a missed meeting and a contribution increase, discovering the portal through the administrator's migration letter, evaluating it on completeness of documents and voting, trying it at the next meeting, and staying because reserve fund, decisions and documents are finally in one place.", "stages": [{"stage": "Trigger", "narrative": "The owner misses the annual meeting because the paper invitation arrived while abroad, and learns from a neighbour that the contribution has been raised to fund a roof renovation decided at that meeting. Requests for the minutes and the multi-year maintenance plan take weeks to answer."}, {"stage": "Discovery", "narrative": "The administrator's letter explains that the association's administration is moving from Informant to the platform and that every owner gets a portal with documents, meetings, decisions and the reserve fund. The neighbour who chairs the association shows the agenda for the next meeting already published there."}, {"stage": "Evaluation", "narrative": "The owner checks whether the deed of division, house rules, past minutes and the maintenance plan are all there after the migration, whether proxy and online voting are possible, and whether the contribution overview and payment status match the bank statements. The completeness of the migrated history convinces them."}, {"stage": "Trial", "narrative": "At the next meeting the owner reads the budget proposal in the portal, votes by proxy on the roof renovation contractor, and afterwards sees the recorded decisions, the updated reserve fund statement and the new contribution amount within days."}, {"stage": "Engagement", "narrative": "Contribution invoices, the annual statement, meeting invitations and decisions all arrive in the portal; a leak in the common corridor reported by another owner is followed as a ticket, and the owner approves an extra levy for the lift from a phone while travelling."}, {"stage": "Retention", "narrative": "When the apartment is sold, the notary's document request is answered with a portal export in a day, and the buyer is invited to the same portal on transfer. The owner asks the administrator of another building they own an apartment in why it does not offer the same."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-ownr-top", "name": "Owner statement timeliness", "description": "Working days after period end until the owner statement with payout is published in the owner portal, the owner's headline measure of a manager that has its administration under control.", "unit": "working days", "currentValue": "14", "targetValue": "5", "link": "https://dashboard.example.com/real-estate-erp-platform/customers/ownr/kpis/co-ownr-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-ownr-co-ownr-top.png"}, "branches": [{"id": "co-ownr-b1", "name": "Transparent performance", "description": "How well the owner can see and trust what the property earns, costs and pays out.", "currentValue": "54", "icon": "kpi-ownr-co-ownr-b1.png", "children": [{"id": "co-ownr-b1-c1", "name": "Net return on managed property", "description": "Net rental income after costs and fees as a share of property value, as shown to the owner per property.", "unit": "%", "currentValue": "3.6", "targetValue": "4.2", "icon": "kpi-ownr-co-ownr-b1-c1.png", "children": [{"id": "co-ownr-b1-c1-l1", "name": "Occupancy of owned units", "description": "Share of the owner's units let and paying at period end.", "unit": "%", "currentValue": "95.5", "targetValue": "97.5", "icon": "kpi-ownr-co-ownr-b1-c1-l1.png", "children": []}, {"id": "co-ownr-b1-c1-l2", "name": "Maintenance cost per unit", "description": "Repair and periodic maintenance c ument are visible and actionable, so that trust in the manager is earned every period and mandates renew on transparency rather than on habit.", "timeHorizons": {"year1": {"focus": "Bring the owner portal of the platform and the VvE owner portal of the Informant base onto one branded experience: statements with underlying lines, per-property dashboard, approval requests with context, association meetings, decisions and reserve funds, and a complete migrated document history.", "productTheme": "One owner portal for managed property and associations", "customerKPI": {"northStar": "Owner statement timeliness", "supporting": ["Owner portal activation rate", "Approvals completed in portal share"]}, "businessKPI": {"northStar": "Owner portal adoption across client organisations", "revenueStreams": ["Owner portal module subscriptions", "VvE owner portal add-on for association administrators", "Statement and document distribution services"], "supporting": ["Organisations with live owner portal", "VvE owner portal attach rate"]}, "milestones": ["Launch the unified owner portal with statements, dashboard, approvals and documents for property managers and VvE administrators", "Migrate Informant association owners with their full document and decision history into the portal", "Ship approval requests with quote, photos, history and budget context and one-tap decisions"]}, "year3": {"focus": "Make the owner portal the standard way Dutch managers and administrators account to owners, with online voting and proxy for associations, accountant access and buyer document packs, and a German version for cross-border managers.", "productTheme": "The standard owner accounting channel, ready for Germany", "customerKPI": {"northStar": "Owner statement timeliness", "supporting": ["Statement accuracy", "Owner satisfaction score"]}, "businessKPI": {"northStar": "Owner portal adoption across client organisations", "revenueStreams": ["Owner portal subscriptions scaled by owners and units", "Online meeting and voting add-on for associations", "Accountant and buyer access licences"], "supporting": ["Monthly active owners on portals", "Approvals routed through portal"]}, "milestones": ["Reach the majority of managed units and association apartments with a live owner portal", "Launch online meetings, proxy and voting with recorded decisions for owners' associations", "Release the German owner portal with local statement and association formats"]}, "year5": {"focus": "Let owners across Europe see forecasts and benchmarks for their property, with an AI assistant explaining statements and advising on maintenance and rent decisions, so that the owner portal becomes the owner's operating view of their real estate rather than an archive.", "productTheme": "AI-assisted owner insight across Europe", "customerKPI": {"northStar": "Owner statement timeliness", "supporting": ["Net return on managed property", "Approval turnaround time"]}, "businessKPI": {"northStar": "Owner portal adoption across client organisations", "revenueStreams": ["AI owner assistant subscriptions", "Multi-country owner portal licences", "Rent and maintenance benchmark data products for owners"], "supporting": ["Handling minutes saved per owner", "Mandate retention attributable to portal"]}, "milestones": ["Run statement explanation and approval advice through a supervised AI assistant in the owner portal", "Operate the owner portal in at least three European countries", "Publish rent and maintenance benchmarks per property type that owners see next to their own figures"]}}}, "domain": "Tenants, Owners and Maintenance Partners"}, {"id": "supp", "name": "Maintenance Supplier", "description": "A contractor, installer, plumber, electrician, painter, cleaning company, lift or heating service firm or handyman that does the technical work for organisations on the platform: from a one-person handyman on call for a property manager's residential portfolio to a regional installation company with periodic maintenance contracts for hundreds of boilers, lifts and fire installations. Receives work orders from fault reports and from the periodic maintenance schedule, submits quotes when the work exceeds the mandate, plans visits with tenants, reports completion with photos, updates the installation register and invoices against the work order, either through the branded supplier portal or through a connected partner system such as Ziezodan or Proprli. Uses the portal for free; the organisation pays, and the supplier's self-service is what removes phone calls, disputes and late payments on both sides.", "icon": "supp.png", "careAbout": ["Receiving work orders with everything needed to do the job at the first visit: address, access, tenant contact, installation details, photos and the mandate amount", "Accepting or declining work in a minute from a phone, and planning visits directly with the tenant instead of through the manager's office", "Getting quotes approved quickly so that the job is not lost to waiting", "Being paid on time because the invoice matches the work order and needs no chasing", "Fewer phone calls and e-mails per job, and one place where all jobs for all clients on the platform are visible", "Being a preferred supplier because completion reports, ratings and response times show the quality of the work"], "winsThem": ["A supplier portal that shows every open work order across all the organisations that use the platform, with accept, quote, plan, complete and invoice actions", "Tenant availability and contact details on the work order, and appointment confirmation sent to the tenant automatically", "Automatic reminders from the installation register for periodic maintenance, so the annual boiler or lift visits are planned without a call", "Invoice submission against the work order with automatic matching and a visible payment status, or through the partner integration the supplier already uses", "Completion reports with photos that close the ticket for the tenant and the owner at the same time"], "theirFear": ["Driving to a job where nobody is home, the key is not there or the installation details are wrong, and not being paid for the wasted visit", "An invoice that sits in an inbox for months because it does not match a purchase order nobody sent", "Losing a good client because a competitor is easier to work with digitally"], "jobsToBeDone": [{"id": "jtbd-supp-1", "name": "Receive and accept work orders without phone calls", "whatItIs": "Get every repair job and every scheduled maintenance visit from the organisations the supplier works for as a complete work order in one portal or in the supplier's own connected system, assess it, quote when required, accept or decline, and plan the visit with the tenant, without a phone call to the manager's office.", "outcome": "The supplier accepts more jobs faster with complete information, fixes them at the first visit, and stops losing time on calls, wrong addresses and wasted trips.", "steps": [{"step": "Set up the supplier account and connection", "description": "Accept the invitation from the manager, register the company, trades, service areas, rates and certificates, choose whether to work in the portal or connect the own planning system through the maintenance partner integration, and add colleagues who receive jobs.", "streamsNeeded": [{"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Creates the supplier organisation and user accounts on the branded supplier portal with trades and service areas."}, {"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Connects the supplier's own system through certified maintenance partner integrations such as Ziezodan and Proprli."}]}, {"step": "Receive and assess the work order", "description": "Get a notification for a new work order with the fault report, photos, address, access instructions, tenant contact, installation record, warranty status, urgency and the mandate amount, and decide whether it can be done directly or needs a quote.", "streamsNeeded": [{"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Dispatches the work order with ticket details, photos and the mandate amount to the assigned supplier."}, {"id": "plan-and-execute-periodic-maintenance", "name": "Plan and Execute Periodic Maintenance", "howItSupports": "Attaches the installation record, service history and warranty to the work order and creates scheduled maintenance orders automatically."}]}, {"step": "Quote where the work exceeds the mandate", "description": "Submit a quote with lines, materials, lead time and photos in the portal, see when the manager or owner approves it, and receive the approved work order without re-entering anything.", "streamsNeeded": [{"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Routes the quote to the manager and, above the threshold, to the owner for approval and converts it into a work order."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Provides quote submission and approval status in the supplier portal."}]}, {"step": "Accept and plan the visit with the tenant", "description": "Accept the work order, propose appointment slots based on the tenant's availability, get the tenant's confirmation and a reminder sent automatically, and see the day's jobs on a route.", "streamsNeeded": [{"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Records acceptance and the appointment on the work order and notifies the tenant and the manager."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Lets the supplier propose slots and the tenant confirm them in their respective portals."}]}]}, {"id": "jtbd-supp-2", "name": "Report completed work and get paid on time", "whatItIs": "Close each job with a completion report and photos that satisfies the tenant, the manager and the owner, update the installation register with what was replaced or inspected, submit the invoice against the work order so that it matches automatically, and see when it will be paid, without chasing.", "outcome": "Invoices are paid within the agreed term without disputes, the installation register stays accurate, and the supplier's completion quality is visible to every client on the platform.", "steps": [{"step": "Report completion with photos and findings", "description": "Mark the work order complete from the phone with photos, hours, materials, findings and any follow-up advice, so that the tenant is asked to confirm and the ticket closes for the manager and the owner.", "streamsNeeded": [{"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Records the completion report on the work order and triggers tenant confirmation and ticket closure."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Provides the mobile completion form with photo upload in the supplier portal."}]}, {"step": "Update the installation register and next service date", "description": "Record the replaced boiler, the inspected lift or the certified fire installation with serial number, certificate and next inspection date, so that the next periodic visit is scheduled automatically.", "streamsNeeded": [{"id": "plan-and-execute-periodic-maintenance", "name": "Plan and Execute Periodic Maintenance", "howItSupports": "Updates the installation record, stores certificates and schedules the next periodic maintenance order."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Lets the supplier edit installation details and upload certificates from the portal."}]}, {"step": "Submit the invoice against the work order", "description": "Create or upload the invoice referencing the work order number, with lines that match the approved quote or mandate, in the portal or from the own system through the integration, and see it matched automatically or flagged with the reason.", "streamsNeeded": [{"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Matches the supplier invoice to the work order and approved amount and flags deviations."}, {"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Books the matched supplier invoice to the right entity, object and VAT code for payment."}]}, {"step": "Track payment and build the track record", "description": "See the invoice status from received to approved to paid with the expected payment date, get paid within the agreed term, and see response time, first-time-fix rate and ratings per client that make the supplier preferred for the next job.", "streamsNeeded": [{"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Runs the payment batch and exposes the payment status and date per invoice."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Shows invoice status, payment dates and the supplier's performance metrics in the supplier portal."}]}]}], "customerJourneyStories": [{"id": "journey-supp-1", "name": "From phone calls and PDF invoices to the supplier portal", "linkedJobIds": ["jtbd-supp-1", "jtbd-supp-2"], "summary": "A five-person plumbing and heating company working for two property managers adopts the supplier portal when one manager moves to the platform: triggered by wasted visits and a late invoice, discovering the portal through the manager's invitation, evaluating it for effort and payment reliability, trying it on a week of jobs, and asking its other clients for the same.", "stages": [{"stage": "Trigger", "narrative": "In one week a technician drives to an apartment where the tenant is not home because the appointment was passed on by phone through the manager's office, a job turns out to need a boiler part nobody mentioned, and an invoice from three months ago is still unpaid because it cannot be matched to an order. The owner of the company spends Friday afternoon on the phone."}, {"stage": "Discovery", "narrative": "The property manager's technical manager sends an invitation to the supplier portal in the manager's brand and explains that from now on jobs, quotes, appointments and invoices run through it. A colleague installer who already works for a platform organisation shows the app on his phone with the day's jobs and tenant contacts."}, {"stage": "Evaluation", "narrative": "The owner checks how much extra work the portal means per job, whether the own planning software can be connected through the Ziezodan integration, whether the tenant's availability and access details are really on the order, and whether invoice status is visible. The promise that a matched invoice is paid within the agreed term without chasing decides it."}, {"stage": "Trial", "narrative": "The first week's jobs arrive with photos, tenant slots and the mandate amount; technicians accept from the phone, appointments are confirmed to tenants automatically and every job is fixed at the first visit. A quote for a boiler replacement is approved by the owner in a day, and the first invoice submitted against a work order shows as approved for payment within 48 hours."}, {"stage": "Engagement", "narrative": "All jobs for the manager run through the portal or the connected planning system, periodic boiler maintenance orders arrive from the installation register each autumn, completion reports with photos close tickets without a call, and the company's first-time-fix rate and response time appear on its supplier profile."}, {"stage": "Retention", "narrative": "The company becomes preferred supplier for the manager's residential portfolio and asks its second property manager client, still on Informant, whether they will offer the same portal after migration. Late invoices have disappeared from the Friday afternoon."}]}, {"id": "journey-supp-2", "name": "An installation company onboarded through the installation register", "linkedJobIds": ["jtbd-supp-2", "jtbd-supp-1"], "summary": "A regional installation company with maintenance contracts for lifts, fire installations and heating in an investor's commercial portfolio adopts the platform's periodic maintenance flow: triggered by a missed inspection and a compliance question from the investor, discovering the installation register through the technical manager, evaluating it on data quality and integration, trialling it on one building's installations, and staying because the register and the invoices now run themselves.", "stages": [{"stage": "Trigger", "narrative": "An annual fire installation inspection in an office building is missed because the reminder lived in a spreadsheet on a departed employee's laptop; the investor's asset manager asks for proof of compliance across the portfolio and the installation company cannot produce it without a week of searching."}, {"stage": "Discovery", "narrative": "The investor's technical manager explains that every installation is now in the platform's register with next inspection dates and that maintenance orders and reminders are generated from it and sent to the supplier portal or through the Proprli integration. The installation company sees its contracted installations listed with certificates and service history."}, {"stage": "Evaluation", "narrative": "The company checks whether the register data matches its own records, whether certificates and inspection reports can be uploaded per installation, whether scheduled orders can be planned in bulk per building and whether its service management system can connect. A joint clean-up of the register for one building shows the data can be trusted."}, {"stage": "Trial", "narrative": "For one building the annual lift, fire and heating inspections are executed from generated maintenance orders, planned in bulk, reported with certificates uploaded per installation, and invoiced against the orders; the investor's compliance overview turns green for that building without an e-mail."}, {"stage": "Engagement", "narrative": "The whole contracted portfolio moves to the register-driven flow: reminders arrive weeks ahead, replaced installations are registered with serial numbers by the technician on site, and the investor's asset manager pulls the compliance report for lenders from the platform."}, {"stage": "Retention", "narrative": "At contract renewal the installation company's on-time inspection rate and complete certificate coverage are the argument for a three-year extension, and it proposes the same register-driven flow to its other clients on the platform."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-supp-top", "name": "Work order turnaround time", "description": "Working days from the work order being dispatched to the supplier until the completion report is filed, the supplier's headline measure of jobs flowing without friction.", "unit": "working days", "currentValue": "8.5", "targetValue": "4", "link": "https://dashboard.example.com/real-estate-erp-platform/customers/supp/kpis/co-supp-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-supp-co-supp-top.png"}, "branches": [{"id": "co-supp-b1", "name": "Clear work, less chasing", "description": "How complete and actionable the work the supplier receives is, and how often it is fixed at the first visit.", "currentValue": "57", "icon": "kpi-supp-co-supp-b1.png", "children": [{"id": "co-supp-b1-c1", "name": "Work order accepta nd quotes before the invoice arrives.", "unit": "%", "currentValue": "71", "targetValue": "95", "icon": "kpi-supp-bo-supp-b2-c2.png", "children": [{"id": "bo-supp-b2-c2-l1", "name": "Work orders within budget share", "description": "Share of completed work orders invoiced within the mandate or approved quote amount.", "unit": "%", "currentValue": "82", "targetValue": "96", "icon": "kpi-supp-bo-supp-b2-c2-l1.png", "children": []}, {"id": "bo-supp-b2-c2-l2", "name": "Quotes approved within target time", "description": "Share of supplier quotes approved or rejected by manager and owner within the agreed number of days.", "unit": "%", "currentValue": "48", "targetValue": "90", "icon": "kpi-supp-bo-supp-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Let every maintenance supplier of every organisation on the platform receive, plan, complete and invoice work through one supplier portal or their own connected system, so that jobs are fixed at the first visit, invoices are paid on time and the supplier's quality is visible to every client.", "timeHorizons": {"year1": {"focus": "Bring the supplier portal of the platform and the maintenance flows of the migrated Informant base onto one branded experience with complete work orders, quotes, tenant appointment planning, completion reports with photos, installation register updates and invoice submission against the work order, plus the Ziezodan and Proprli integrations for suppliers with their own systems.", "productTheme": "One supplier portal with complete work orders and matched invoices", "customerKPI": {"northStar": "Work order turnaround time", "supporting": ["Work orders with complete information share", "Supplier portal activation rate"]}, "businessKPI": {"northStar": "Supplier portal adoption across client organisations", "revenueStreams": ["Supplier portal module subscriptions", "Maintenance partner integration fees", "Technical management module subscriptions driven by portal attach"], "supporti
