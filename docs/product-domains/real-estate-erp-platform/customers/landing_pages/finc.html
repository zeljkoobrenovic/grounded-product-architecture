<script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

xation run that calculates, letters and posts thousands of rent increases in one batch, with exceptions for capped, regulated and special-term contracts surfaced for review", "Valuations and market data linked to objects, so yield, value per square metre and loan-to-value update the moment a new appraisal or rent change lands", "Investor and lender report packs generated from the ledger and the rent roll per fund, entity and lender, published through the owner and investor portal", "Projects and transformation budgets tracked in the same system as exploitation, so a delivered building moves into the rent roll without re-keying"], "theirFear": ["Presenting an occupancy or net rental income figure to investors that the auditor or a lender later proves wrong because two spreadsheets disagreed", "Missing indexation on a slice of contracts for a year and only finding out when the acquirer's due diligence spots it", "Discovering that a transformation project overran its budget months after the fact because project spend lived outside the exploitation books"], "jobsToBeDone": [{"id": "jtbd-asmg-1", "name": "Know portfolio performance in real time", "whatItIs": "Maintain a continuously correct operational and financial picture of the whole portfolio: which units are let, vacant or in notice, what rent is contracted, invoiced and collected per entity, how valuations and yields move against the market, and how capex and project spend track their budgets. The picture must hold for every legal entity and fund structure the investor uses, in the Netherlands and increasingly in Germany.", "outcome": "Occupancy, rent roll, arrears, valuations and capex are available per unit, complex, entity and fund from one system of record, are reconciled with the ledger without a monthly reconciliation exercise, and the asset manager can answer any performance question the same day with figures that survive audit and due diligence.", "steps": [{"step": "Keep object, unit, entity and contract master data complete", "description": "Register every complex, building, unit, parking place and storage box with its surface, energy label, WOZ value, ownership entity and financing, and link every active lease, option and special term to its unit and tenant. When a portfolio is acquired or migrated from a legacy system such as Informant, import the objects, relations, contracts and opening balances in one structured onboarding rather than re-keying them over months.", "streamsNeeded": [{"id": "onboard-portfolio-and-entities", "name": "Onboard Portfolio and Entities", "howItSupports": "Brings entities, objects, complexes, units, relations, contracts and opening balances from contracts, spreadsheets or a legacy system into one structured portfolio with validation of gaps and duplicates."}, {"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Shows master-data completeness per complex and entity so the asset manager knows which units lack surface, energy label or contract links before they distort a report."}]}, {"step": "Monitor occupancy, vacancy and the rent roll", "description": "Follow let, vacant and in-notice units per complex and entity, the contracted versus market rent per square metre, upcoming expiries and break options, and the letting pipeline of the property manager. Distinguish structural vacancy from turnover vacancy and see for how many days a unit has been empty and why.", "streamsNeeded": [{"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Provides the occupancy, vacancy-days, expiry and rent-roll dashboards per entity, complex and unit type, refreshed from contracts and letting status rather than from a monthly extract."}, {"id": "manage-leases-through-their-lifecycle", "name": "Manage Leases Through Their Lifecycle", "howItSupports": "Keeps every contract's start, end, notice, break option and rent history current so the rent roll reflects what is actually signed."}, {"id": "let-units-and-sign-contracts", "name": "Let Units and Sign Contracts", "howItSupports": "Feeds vacancy and letting-pipeline status per unit so the asset manager sees when a vacant unit is listed, has viewings or a candidate in screening."}]}, {"step": "Track collection, arrears and cash per entity", "description": "See invoiced rent, collected rent and arrears per entity, complex and tenant, with ageing buckets and the dunning stage each debtor is in. Judge whether a dip in collection is a payment-timing effect, a tenant in trouble or a direct-debit mandate problem, and follow up with the property manager or the finance controller.", "streamsNeeded": [{"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Supplies invoiced, collected and outstanding amounts per contract and entity, ageing buckets and dunning stage, straight from the rent runs and bank reconciliation."}, {"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Puts collection rate and arrears next to occupancy and rent growth per entity, so cash performance is read in the same cockpit as operational performance."}]}, {"step": "Follow valuations, yields and market position", "description": "Record external appraisals and internal valuations per object, compare gross and net initial yields with market benchmarks and transactions, watch loan-to-value and interest cover per financed entity, and prepare the valuation inputs (rent roll, vacancy, capex, lease terms) that appraisers and lenders request each half year.", "streamsNeeded": [{"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Links valuations and market data to objects and computes yield, value per square metre and covenant ratios per entity, with a valuation-input export for appraisers and lenders."}, {"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Provides the audited net rental income and balance-sheet figures per entity that valuation and covenant calculations must reconcile with."}]}, {"step": "Watch capex and project spend against budget", "description": "Track renovation, sustainability and transformation projects per object with budget, commitments, invoices and milestones, see forecast-to-complete against the business case, and follow the hand-over of a delivered building or renovated units into the exploitation books and the rent roll.", "streamsNeeded": [{"id": "manage-development-and-transformation-projects", "name": "Manage Development and Transformation Projects", "howItSupports": "Holds project budgets, commitments, invoices and milestones per object and moves delivered units into exploitation without re-keying."}, {"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Shows capex spent and committed against budget per complex alongside the rent effect of the investment."}]}]}, {"id": "jtbd-asmg-2", "name": "Grow rental income through indexation, letting and active asset management", "whatItIs": "Increase net rental income of the portfolio year on year within the legal frame: apply annual rent indexation correctly on every eligible contract, shorten vacancy and turnover time, manage renewals, break options and rent reviews on commercial leases, recover service charges fully, and decide where capex, transformation or a sale creates more value than holding. In the Netherlands this means CPI-based indexation, regulated-sector rent rules and the Huurcommissie; in Germany Indexmiete and Staffelmiete clauses, the Mietpreisbremse and Betriebskosten settlements.", "outcome": "Every eligible contract is indexed on time with the correct index and cap, vacancy days per turnover and structural vacancy fall, renewals and rent reviews are decided before deadlines pass, service charges are recovered rather than absorbed, and net rental income grows like-for-like without a compliance incident.", "steps": [{"step": "Run the annual indexation round across the portfolio", "description": "Select the contracts due for indexation by anniversary date or by 1 July, apply the contractual index (CPI, CPI plus a percentage, Staffel) and the legal or contractual caps, generate the rent-increase letters with the required notice period, post the new rents to the next rent run, and handle objections and regulated-sector exceptions without pausing the batch.", "streamsNeeded": [{"id": "manage-leases-through-their-lifecycle", "name": "Manage Leases Through Their Lifecycle", "howItSupports": "Calculates indexation per contract from the index series and contract terms, produces the letters and posts the new rent, with an exception list for capped, regulated and special-term contracts."}, {"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Picks up the new rent amounts in the next periodic rent run and adjusts direct-debit amounts and mandates."}, {"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Runs the indexation batch and letter generation as a scheduled robot job so thousands of contracts are processed without a manual campaign."}]}, {"step": "Shorten vacancy and turnover time with the property manager", "description": "Set target rents and letting conditions per unit type and complex, watch listed units, viewings, screened candidates and rent-price checks in the letting pipeline, approve exceptions such as incentives or below-target rents, and push the property manager on units that exceed the vacancy-day norm.", "streamsNeeded": [{"id": "let-units-and-sign-contracts", "name": "Let Units and Sign Contracts", "howItSupports": "Runs listing, viewings, candidate screening, rent-price check, contract generation and e-signing so a unit moves from notice to signed lease in one flow with approvals for the asset manager."}, {"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Reports vacancy days per turnover and per complex against the norm and flags units that stall in the pipeline."}]}, {"step": "Manage renewals, break options and commercial rent reviews", "description": "Get a rolling view of commercial leases approaching expiry, break or review dates, decide whether to renew, re-let or renegotiate, negotiate rent-free periods and incentives, and record the outcome as a contract change so the rent roll and cash flow forecast update immediately.", "streamsNeeded": [{"id": "manage-leases-through-their-lifecycle", "name": "Manage Leases Through Their Lifecycle", "howItSupports": "Tracks break options, expiries and review clauses per contract, generates the renewal or termination documents and records rent changes and incentives with effective dates."}, {"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Shows expiry and break-option exposure per year and the rent-roll effect of each renewal decision."}]}, {"step": "Recover service charges fully and defensibly", "description": "Set the service charge advances per complex at a realistic level, monitor recoverable costs during the year, review the annual settlement per complex and tenant within the legal deadline, and adjust advances so that non-recoverable cost and tenant disputes shrink year on year.", "streamsNeeded": [{"id": "manage-leases-through-their-lifecycle", "name": "Manage Leases Through Their Lifecycle", "howItSupports": "Calculates the annual service charge settlement per complex and contract from booked costs and distribution keys and produces the tenant statements."}, {"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Delivers the booked recoverable and non-recoverable costs per complex that the settlement and the recovery-rate analysis rest on."}]}, {"step": "Decide on capex, transformation and hold or sell", "description": "Build the case for a renovation, energy-label upgrade, transformation of offices into housing or a disposal on the object's rent roll, vacancy, valuation, capex forecast and financing, run the project when approved, and compare the realised rent and value uplift with the business case afterwards.", "streamsNeeded": [{"id": "manage-development-and-transformation-projects", "name": "Manage Development and Transformation Projects", "howItSupports": "Carries the approved project budget, commitments and milestones and hands the delivered units over into exploitation."}, {"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Provides the object-level rent, vacancy, valuation and yield history and the before-and-after comparison for each investment case."}]}]}, {"id": "jtbd-asmg-3", "name": "Report to investors and lenders without a reporting project", "whatItIs": "Produce the quarterly and annual reporting that fund managers, institutional and private investors, joint-venture partners and financing banks require: rent roll and occupancy, net rental income and cost ratios, valuations and yields, loan covenants such as loan-to-value and interest cover, capex and project progress, and increasingly ESG and energy-label data. The packs must reconcile with the closed ledger per entity and fund and be reproducible for the auditor.", "outcome": "Investor and lender reports are generated from the closed period and the live rent roll in days rather than weeks, every figure traces back to contracts, invoices and bank lines, ad-hoc questions are answered from the same data, and the asset manager spends the quarter steering assets instead of assembling spreadsheets.", "steps": [{"step": "Define the reporting pack per fund, investor and lender", "description": "Agree with each fund, investor and lender which figures, definitions and layouts they need (rent roll, occupancy, net rental income, covenants, capex, ESG), map them to entities and ledger accounts, and set the reporting calendar so the pack is a template that refreshes every quarter rather than a new document.", "streamsNeeded": [{"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Holds the report definitions per fund, entity and lender, mapped to ledger accounts and rent-roll fields, and the reporting calendar."}, {"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Supplies the standard real estate KPI definitions (occupancy, yield, rent per square metre) that the packs reuse so investors see consistent numbers."}]}, {"step": "Close the period with the finance controller", "description": "Confirm with finance that rent runs, bank reconciliation, supplier invoices, accruals and valuation postings are complete per entity, review the period-close checklist, and freeze the figures so the operating data in the report and the ledger tell the same story.", "streamsNeeded": [{"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Runs the close checklist per entity, consolidates the entities of a fund and locks the period so reports are built on frozen figures."}, {"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Confirms that all rent runs are invoiced and payments matched for the period, so invoiced and collected rent in the report equal the ledger."}]}, {"step": "Generate the quarterly reports and dashboards", "description": "Produce the investor pack per fund and the lender pack per financed entity from the closed period: rent roll and occupancy, net rental income versus budget, arrears, valuations and yields, covenant ratios, capex and projects. Review exceptions and commentary, and publish interactive dashboards for investors who prefer them to a PDF.", "streamsNeeded": [{"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Generates the investor and lender report packs from the closed ledger and the rent roll with the agreed definitions and layouts."}, {"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Provides the interactive dashboards and Power BI datasets that investors and the asset management team explore between quarterly packs."}]}, {"step": "Answer covenant tests and ad-hoc investor questions", "description": "Run the loan-to-value, interest-cover and debt-service tests per financed entity when the bank asks, answer questions on a specific complex, tenant concentration, expiry profile or energy-label distribution within a day, and keep every answer traceable to the data it came from.", "streamsNeeded": [{"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Lets the asset manager slice occupancy, rent, expiries, valuations and energy labels by entity, complex and tenant on demand and export the answer with its source."}, {"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Provides an AI assistant that drafts answers to recurring investor and lender questions from the portfolio data and the API that feeds the investor's own BI tools."}]}, {"step": "Share reports and approvals through the investor and owner portal", "description": "Publish the packs, dashboards, valuation reports and project updates to investors, joint-venture partners and lenders in a branded portal with the right access per fund and entity, collect approvals for capex and sale decisions where the structure requires them, and retire the e-mail-and-attachment distribution.", "streamsNeeded": [{"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Gives investors and partners a portal with reports, statements, documents and approvals scoped to their funds and entities."}, {"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Publishes the released report versions and investor statements to the portal and keeps the distribution history."}]}]}], "customerJourneyStories": [{"id": "journey-asmg-1", "name": "From Excel rent rolls to a live portfolio cockpit", "linkedJobIds": ["jtbd-asmg-1", "jtbd-asmg-3"], "summary": "An asset manager at a Dutch residential and commercial investor with about 3,000 units in a dozen entities lives through the firm's move from a generic accounting package plus Excel rent rolls to a real estate ERP, from the quarter in which the numbers stopped adding up to the renewal in which the firm adds analytics and the investor portal.", "stages": [{"stage": "Trigger", "narrative": "A lender's covenant test and the investor pack for the same quarter show different occupancy figures for the same fund, because the property manager's Excel rent roll and the accounting package were reconciled at different dates. The fund manager asks the asset manager for one set of numbers per entity that finance, the property manager and the investors all work from, in time for the next quarter."}, {"stage": "Discovery", "narrative": "The asset manager asks peers at an IVBN and Vastgoedmanagement Nederland meeting which system investors of similar size run on, and hears that Rockfield, Urban Interest and Burgstate operate on Bloxs. A demo shows objects, contracts, rent runs and the ledger in one database with dashboards on top, and a reference visit to an investor with a comparable entity structure confirms that the asset management team can run it without an IT department."}, {"stage": "Evaluation", "narrative": "Together with the finance controller the asset manager evaluates the real estate ERP against extending the accounting package with a rent-roll add-on and against a larger international platform. The decisive checks are multi-entity accounting and consolidation per fund, indexation and service charge settlement under Dutch rules, the Power BI connector, the investor reporting module and what it costs to migrate a dozen entities and 3,000 contracts. Security documentation and the SaaS hosting terms pass the investor's review, and the modular price fits the budget."}, {"stage": "Trial", "narrative": "The first real use is one fund: its four entities, complexes, units, contracts and opening balances are migrated with the vendor's implementation team, and one quarter runs in parallel with the old setup. For the first time the occupancy figure in the investor pack, the rent roll and the ledger come from the same place, and the covenant test for that fund is answered from a dashboard instead of a spreadsheet."}, {"stage": "Engagement", "narrative": "All entities move over within two quarters. The weekly asset management meeting runs on the portfolio cockpit, the indexation round is executed as a batch with an exception list, and the asset manager uses the expiry and break-option view to plan commercial renewals a year ahead. Quarter-end changes from a reporting project into a review of generated packs."}, {"stage": "Retention", "narrative": "At renewal the asset manager presents investor packs produced in three days instead of three weeks and a clean audit. The firm adds the data analytics module and the investor portal so partners and lenders read dashboards themselves, and the asset manager becomes the reference call for the next investor that considers the switch."}]}, {"id": "journey-asmg-2", "name": "Turning the investor pack into a self-service portal and analytics", "linkedJobIds": ["jtbd-asmg-3", "jtbd-asmg-2"], "summary": "Having run the portfolio on the ERP for a year, the asset manager adopts data analytics and the investor and owner portal so joint-venture partners, institutional investors and lenders serve themselves, and ends up using the same analytics to steer indexation, vacancy and capex.", "stages": [{"stage": "Trigger", "narrative": "A joint-venture partner asks for a mid-quarter view of arrears and vacancy per complex, a lender wants energy-label distribution for a green loan, and a new institutional investor requires INREV-style reporting. Each request becomes a separate spreadsheet and the asset manager realises the quarterly pack is no longer enough."}, {"stage": "Discovery", "narrative": "During the quarterly account review the vendor's customer success manager shows that the data analytics module and the owner and investor portal the firm has not yet licensed can publish dashboards per fund and entity, and that other investors let partners and lenders log in rather than e-mailing packs. A short session with an investor already using the portal makes the model concrete."}, {"stage": "Evaluation", "narrative": "The asset manager checks with two partners and the main lender whether they would use a portal, verifies access scoping per fund and entity, the audit trail on published figures, how the Power BI connector feeds the investor's own analysts, and whether the ESG and energy-label data can be reported per object. Finance confirms that published dashboards read from the closed period and cannot drift from the ledger."}, {"stage": "Trial", "narrative": "One fund and its two partners go first: the quarterly pack, the covenant test and a vacancy-and-arrears dashboard are published in the portal, and partners answer their own questions for a quarter. The lender receives the green-loan reporting from the same source, and the number of ad-hoc requests to the asset manager drops noticeably."}, {"stage": "Engagement", "narrative": "The portal becomes the default channel for every investor, partner and lender, and the asset manager starts using the same analytics internally: indexation coverage per entity, vacancy days per complex against the norm, service charge recovery and capex progress are reviewed weekly, and hold-or-sell cases are built on the object history rather than on a fresh data pull."}, {"stage": "Retention", "narrative": "At the next renewal the firm reports higher like-for-like rent growth and fewer investor questions per quarter, and makes the portal a condition in new joint-venture agreements. The asset manager asks the vendor for market benchmarks and forecasts on top of the analytics, becoming an early adopter of the data products on the roadmap."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-asmg-top", "name": "Net rental income growth", "description": "Year-on-year growth of net rental income (contracted rent minus vacancy loss and non-recoverable operating costs) on a like-for-like portfolio. Modeled seed value for a mid-sized Dutch investor, not an official Bloxs or customer figure.", "unit": "% year on year", "currentValue": "3.1", "targetValue": "5.0", "link": "https://dashboard.example.com/real-estate-erp-platform/customers/asmg/kpis/co-asmg-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-asmg-co-asmg-top.png"}, "branches": [{"id": "co-asmg-b1", "name": "Occupancy and rent growth", "description": "How fully the portfolio is let and how much contracted rent grows through indexation, re-letting and renewals.", "currentValue": "68", "icon": "kpi-asmg-co-asmg-b1.png", "children": [{"id": "co-asmg-b1-c1", "name": "Portfolio occupancy rate", "description": "Let lettable floor area (or units for residential) as a share of total lettable area across the portfolio, measured monthly.", "unit": "%", "currentValue": "94.2", "targetValue": "97.0", "icon": "kpi-asmg-co-asmg-b1-c1.png", "children": [{"id": "co-asmg-b1-c1-l1", "name": "Vacancy days per turnover", "description": "Average number of days between the end of one lease and the start of the next on units that were re-let in the period.", "unit": "days", "currentValue": "38", "targetValue": "21", "icon": "kpi-asmg-co-asmg-b1-c1-l1.png", "children": []}, {"id": "co-asmg-b1-c1-l2", "name": "Structural vacancy share", "description": "Share of lettable area vacant for more than six months, excluding units under renovation or transformation.", "unit": "%", "currentValue": "2.4", "targetValue": "1.0", "icon": "kpi-asmg-co-asmg-b1-c1-l2.png", "children": []}]}, {"id": "co-asmg-b1-c2", "name": "Like-for-like rent growth", "description": "Growth of contracted rent on units held throughout the year, driven by indexation, re-letting at market rent and renewals.", "unit": "% year on year", "currentValue": "3.6", "targetValue": "4.8", "icon": "kpi-asmg-co-asmg-b1-c2.png", "children": [{"id": "co-asmg-b1-c2-l1", "name": "Indexation applied on time rate", "description": "Share of contracts eligible for indexation in the year whose rent increase was calculated, lettered with the legal notice and posted on the contractual date.", "unit": "%", "currentValue": "91", "targetValue": "99.5", "icon": "kpi-asmg-co-asmg-b1-c2-l1.png", "children": []}, {"id": "co-asmg-b1-c2-l2", "name": "Commercial renewal retention rate", "description": "Share of commercial leases reaching expiry or a break option in the year that were renewed or extended rather than terminated.", "unit": "%", "currentValue": "72", "targetValue": "82", "icon": "kpi-asmg-co-asmg-b1-c2-l2.png", "children": []}]}]}, {"id": "co-asmg-b2", "name": "Cost recovery and reporting speed", "description": "Whether recoverable costs actually come back from tenants and how quickly the portfolio picture can be turned into a report investors and lenders trust.", "currentValue": "61", "icon": "kpi-asmg-co-asmg-b2.png", "children": [{"id": "co-asmg-b2-c1", "name": "Service charge recovery rate", "description": "Recoverable service costs actually charged to and settled with tenants as a share of total recoverable costs booked per complex.", "unit": "%", "currentValue": "88", "targetValue": "96", "icon": "kpi-asmg-co-asmg-b2-c1.png", "children": [{"id": "co-asmg-b2-c1-l1", "name": "Service charge settlements issued within the legal deadline", "description": "Share of complexes whose annual service charge settlement was sent to tenants within the statutory period after year end.", "unit": "%", "currentValue": "76", "targetValue": "100", "icon": "kpi-asmg-co-asmg-b2-c1-l1.png", "children": []}, {"id": "co-asmg-b2-c1-l2", "name": "Non-recoverable operating cost ratio", "description": "Operating costs that cannot be passed on to tenants as a share of gross rental income.", "unit": "% of gross rent", "currentValue": "17.5", "targetValue": "14.0", "icon": "kpi-asmg-co-asmg-b2-c1-l2.png", "children": []}]}, {"id": "co-asmg-b2-c2", "name": "Investor report preparation time", "description": "Working days from period close to the release of the quarterly investor and lender packs for all funds.", "unit": "working days", "currentValue": "15", "targetValue": "3", "icon": "kpi-asmg-co-asmg-b2-c2.png", "children": [{"id": "co-asmg-b2-c2-l1", "name": "Report figures corrected after release", "description": "Number of figures per quarter that had to be restated to investors or lenders after the pack was released.", "unit": "corrections per quarter", "currentValue": "4", "targetValue": "0", "icon": "kpi-asmg-co-asmg-b2-c2-l1.png", "children": []}, {"id": "co-asmg-b2-c2-l2", "name": "Ad-hoc investor question turnaround", "description": "Average working days to answer an ad-hoc investor or lender question on occupancy, arrears, valuations or covenants with traceable figures.", "unit": "working days", "currentValue": "3.5", "targetValue": "1.0", "icon": "kpi-asmg-co-asmg-b2-c2-l2.png", "children": []}]}]}]}, "businessOutcomes": {"top": {"id": "bo-asmg-top", "name": "Rent invoiced through the platform", "description": "Annual rent invoiced by all tenants of the platform through its rent runs. The current value mirrors the published bloxs.com figure of about \u20ac4 billion per year; the target is a modeled seed value.", "unit": "EUR billion per year", "currentValue": "4.0", "targetValue": "6.5", "link": "https://dashboard.example.com/real-estate-erp-platform/customers/asmg/kpis/bo-asmg-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-asmg-bo-asmg-top.png"}, "branches": [{"id": "bo-asmg-b1", "name": "Investor segment adoption", "description": "How many investors and asset managers run their portfolios on the platform and how deeply they use the analytics, projects and reporting modules.", "currentValue": "56", "icon": "kpi-asmg-bo-asmg-b1.png", "children": [{"id": "bo-asmg-b1-c1", "name": "Analytics and investor reporting attach rate", "description": "Share of investor and asset manager tenants that license the data analytics and investor reporting modules on top of the ERP core.", "unit": "%", "currentValue": "48", "targetValue": "80", "icon": "kpi-asmg-bo-asmg-b1-c1.png", "children": [{"id": "bo-asmg-b1-c1-l1", "name": "Weekly active asset managers on dashboards", "description": "Share of asset manager users at investor tenants who open a portfolio dashboard in a given week.", "unit": "%", "currentValue": "54", "targetValue": "85", "icon": "kpi-asmg-bo-asmg-b1-c1-l1.png", "children": []}, {"id": "bo-asmg-b1-c1-l2", "name": "Investor report packs generated per quarter", "description": "Number of investor and lender report packs generated on the platform across all tenants per quarter.", "unit": "packs per quarter", "currentValue": "620", "targetValue": "2000", "icon": "kpi-asmg-bo-asmg-b1-c1-l2.png", "children": []}]}, {"id": "bo-asmg-b1-c2", "name": "Units under asset management per investor tenant", "description": "Average number of rental units administered per investor or asset manager tenant, a proxy for portfolio depth on the platform.", "unit": "units per tenant", "currentValue": "2400", "targetValue": "3500", "icon": "kpi-asmg-bo-asmg-b1-c2.png", "children": [{"id": "bo-asmg-b1-c2-l1", "name": "Portfolio onboarding time to first investor report", "description": "Weeks from contract signature until a new investor tenant produces its first investor pack from the platform.", "unit": "weeks", "currentValue": "16", "targetValue": "8", "icon": "kpi-asmg-bo-asmg-b1-c2-l1.png", "children": []}, {"id": "bo-asmg-b1-c2-l2", "name": "Projects module attach rate", "description": "Share of investor tenants that run development and transformation project finance on the platform.", "unit": "%", "currentValue": "31", "targetValue": "60", "icon": "kpi-asmg-bo-asmg-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-asmg-b2", "name": "Investor segment revenue and retention", "description": "What the investor segment is worth in recurring revenue and how reliably those tenants stay and expand.", "currentValue": "63", "icon": "kpi-asmg-bo-asmg-b2.png", "children": [{"id": "bo-asmg-b2-c1", "name": "Investor segment recurring revenue growth", "description": "Year-on-year growth of annual recurring revenue from investor and asset manager tenants, including add-on modules.", "unit": "% year on year", "currentValue": "18", "targetValue": "30", "icon": "kpi-asmg-bo-asmg-b2-c1.png", "children": [{"id": "bo-asmg-b2-c1-l1", "name": "Add-on revenue share for investor tenants", "description": "Share of investor tenant recurring revenue coming from add-on modules such as analytics, investor reporting, projects, portals and API Platform.", "unit": "%", "currentValue": "27", "targetValue": "45", "icon": "kpi-asmg-bo-asmg-b2-c1-l1.png", "children": []}, {"id": "bo-asmg-b2-c1-l2", "name": "Net revenue retention of investor tenants", "description": "Recurring revenue from investor tenants that existed a year ago, including expansion and churn, as a share of their revenue a year ago.", "unit": "%", "currentValue": "108", "targetValue": "120", "icon": "kpi-asmg-bo-asmg-b2-c1-l2.png", "children": []}]}, {"id": "bo-asmg-b2-c2", "name": "Investor tenant churn rate", "description": "Share of investor and asset manager tenants that leave the platform per year, including losses through acquisition by non-customers.", "unit": "%", "currentValue": "4", "targetValue": "2", "icon": "kpi-asmg-bo-asmg-b2-c2.png", "children": [{"id": "bo-asmg-b2-c2-l1", "name": "Investor tenants acting as reference customers", "description": "Number of investor and asset manager tenants willing to take reference calls or appear as named customers.", "unit": "tenants", "currentValue": "8", "targetValue": "20", "icon": "kpi-asmg-bo-asmg-b2-c2-l1.png", "children": []}, {"id": "bo-asmg-b2-c2-l2", "name": "German investor tenants onboarded per year", "description": "Number of new investor or asset manager tenants with German portfolios onboarded per year, tracking the international expansion.", "unit": "tenants per year", "currentValue": "2", "targetValue": "10", "icon": "kpi-asmg-bo-asmg-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make the platform the cockpit in which an investor steers every asset from object and contract to valuation and investor report, so net rental income grows on evidence and reporting is a by-product of running the portfolio rather than a project.", "timeHorizons": {"year1": {"focus": "Give investor and asset manager tenants one reconciled portfolio picture across entities and funds, make indexation and service charge settlement batch-safe under Dutch rules, and turn investor and lender packs into generated reports on the closed period.", "productTheme": "One reconciled portfolio picture per fund", "customerKPI": {"northStar": "Net rental income growth", "supporting": ["Portfolio occupancy rate", "Investor report preparation time"]}, "businessKPI": {"northStar": "Rent invoiced through the platform", "revenueStreams": ["Real Estate ERP Core subscriptions", "Data analytics and investor reporting add-ons", "Implementation and data migration services"], "supporting": ["Analytics and investor reporting attach rate", "Portfolio onboarding time to first investor report"]}, "milestones": ["Ship generated investor and lender packs per fund and financed entity with covenant tests reconciled to the closed ledger", "Run the portfolio-wide indexation round as a robot batch with an exception list for capped, regulated and special-term contracts", "Cut onboarding of an acquired or migrated portfolio to the first investor report to under ten weeks with the migration tooling"]}, "year3": {"focus": "Make the platform the real estate ERP standard for Dutch investors and a credible choice for German portfolios: valuations, market data and ESG next to operating data, investor and owner portals as standard attach, and German accounting, VAT and tenancy rules built in.", "productTheme": "Investor-grade insight across two countries", "customerKPI": {"northStar": "Net rental income growth", "supporting": ["Like-for-like rent growth", "Service charge recovery rate"]}, "businessKPI": {"northStar": "Rent invoiced through the platform", "revenueStreams": ["Modular Real Estate ERP subscriptions", "Investor portal and API Platform attach", "Certified integration marketplace fees"], "supporting": ["Investor segment recurring revenue growth", "German investor tenants onboarded per year"]}, "milestones": ["Launch German localisation for indexation (Indexmiete, Staffelmiete), Betriebskosten settlement and VAT so a Dutch investor can run its German entities on the same tenant", "Add valuation, ESG and energy-label reporting per object with market data connectors and INREV-style fund reporting templates", "Make the investor and owner portal standard attach for every investor tenant with scoped access per fund and entity"]}, "year5": {"focus": "Let AI agents prepare indexation, renewals, covenant tests and investor packs for the asset manager's approval, and turn anonymised cross-tenant data into rent benchmarks, vacancy forecasts and portfolio market analysis that investors across Europe steer by.", "productTheme": "AI-prepared asset management with market intelligence", "customerKPI": {"northStar": "Net rental income growth", "supporting": ["Vacancy days per turnover", "Ad-hoc investor question turnaround"]}, "businessKPI": {"northStar": "Investor segment adoption", "revenueStreams": ["Multi-country Real Estate ERP subscriptions", "AI asset management agent add-ons", "Rent benchmark and portfolio market analysis data products"], "supporting": ["Net revenue retention of investor tenants", "Investor tenant churn rate"]}, "milestones": ["Deploy an asset management agent that drafts indexation letters, renewal proposals, covenant tests and investor commentary for human approval", "Publish rent benchmarks, vacancy forecasts and yield comparisons per segment and region from anonymised cross-tenant data", "Run investor portfolios in the Netherlands, Germany and a third European market on one multi-entity, multi-currency, multi-language tenant"]}}}, "domain": "Real Estate Investors and Asset Managers"}, {"id": "finc", "name": "Real Estate Finance Controller", "description": "Runs the financial administration of a real estate investor, fund or asset manager: a group of ten to a hundred legal entities that each own objects, borrow from banks and invoice rent. Prepares the periodic rent runs and direct debits, reconciles bank statements per entity every day, manages debtors and dunning, processes supplier and maintenance invoices, handles VAT with its mix of exempt residential rent and taxed commercial leases, settles service charges per complex, closes the period, consolidates the entities per fund and produces investor and owner statements for the auditor and the asset manager. Leads a small team of two to six accounting staff and is judged on how fast and how cleanly the period closes.", "icon": "finc.png", "careAbout": ["Every active contract invoiced in the periodic rent run at the right amount, with indexation, service charge advances and VAT treatment applied without manual correction", "Bank statements of every entity matched to invoices and supplier payments the same day, so the debtor and creditor positions are true at any moment", "A dunning process that runs on schedule, treats tenants correctly and hands over to collection with a complete file, without the team chasing individual invoices", "Supplier and maintenance invoices captured, coded, approved and paid within terms and matched to work orders and contracts", "VAT returns per entity, pro-rata calculations and taxed-lease options handled correctly, and the ICP and audit file ready without a rebuild", "A period close per entity and consolidation per fund that finishes in days, with service charge settlements and investor statements produced from the same books"], "winsThem": ["A rent run that generates thousands of invoices and SEPA direct debits per entity from the contracts in minutes, with a pre-run check that flags anomalies", "Bank integration that imports statements automatically and matches the large majority of lines by robot, leaving only true exceptions for the team", "A multi-entity general ledger with intercompany handling, a close checklist per entity and consolidation per fund in one system, connected to the accountant's and auditor's tools", "Hyper automation and AI assistants that code supplier invoices, run the dunning cycle and prepare the VAT return without a person touching each document", "Service charge settlements calculated per complex from the booked costs and distribution keys, with tenant statements and ledger postings produced in one step"], "theirFear": ["A rent run going out with wrong indexation or VAT on a few hundred invoices and the team spending a week on credit notes and tenant calls", "The auditor finding unreconciled bank lines or an intercompany imbalance in the year-end file that pushes the close and the investor statements weeks out", "Service charge settlements missed past the legal deadline for a complex, forfeiting the recovery and triggering tenant disputes"], "jobsToBeDone": [{"id": "jtbd-finc-1", "name": "Invoice and collect every euro of rent on time", "whatItIs": "Turn the active lease contracts of every entity into correct rent invoices each period, collect the money through SEPA direct debit and bank transfer, match every incoming payment to its invoice, and follow up arrears through a structured dunning process that respects tenant rights and hands over to collection when needed. Residential rent is invoiced monthly and largely direct-debited; commercial rent quarterly or monthly with VAT where the lease is opted for taxation.", "outcome": "The rent run per entity goes out on the invoicing date without manual corrections, direct debits are collected on schedule, payments are matched automatically, arrears are visible and acted on by ageing bucket, and the collection rate stays above target with a complete file for every case handed to collection.", "steps": [{"step": "Prepare and check the periodic rent run", "description": "Before the invoicing date, review contract changes since the last run (new leases, terminations, indexations, changed service charge advances, deposit settlements), run the pre-invoicing check per entity for anomalies such as zero amounts, missing VAT codes or overlapping periods, and release the run.", "streamsNeeded": [{"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Builds the periodic rent run per entity from active contracts and runs the pre-invoicing check that flags anomalies before invoices are generated."}, {"id": "manage-leases-through-their-lifecycle", "name": "Manage Leases Through Their Lifecycle", "howItSupports": "Delivers the contract changes with effective dates (indexation, changes, terminations, advances) that the rent run must reflect."}]}, {"step": "Issue invoices and collect through direct debit", "description": "Generate the invoices with the correct VAT treatment per contract, deliver them to tenants by e-mail and the tenant portal, create the SEPA direct debit batch per entity with valid mandates and pre-notifications, submit it to the bank and process rejections and reversals.", "streamsNeeded": [{"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Generates invoices and SEPA direct debit batches per entity, submits them through the bank integration and books rejections and reversals back to the debtor."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Publishes invoices, payment status and mandate details to the tenant portal and app so tenants pay and check without calling."}]}, {"step": "Match incoming payments to invoices every day", "description": "Import bank statements per entity daily, let the matching rules and robot allocate transfers and direct debit collections to open invoices by reference, amount and debtor, handle partial payments, overpayments and payments on the wrong entity, and keep the debtor position true at the end of each day.", "streamsNeeded": [{"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Matches bank lines to open rent invoices automatically per entity and queues the unmatched remainder for manual allocation."}, {"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Runs the daily statement import and matching robot and learns allocation rules from the controller's manual decisions."}]}, {"step": "Run dunning and agree payment arrangements", "description": "Execute the dunning schedule per entity and tenant type (reminder, formal notice, final notice with costs), pause it for tenants with an agreed payment plan or a dispute, register payment arrangements and monitor compliance, and coordinate with the property manager on tenants who need a conversation rather than a letter.", "streamsNeeded": [{"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Runs the configurable dunning schedule, records payment arrangements and disputes, and reports arrears by ageing bucket and dunning stage."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Lets tenants see their arrears, propose a payment plan and pay online, reducing the letters and calls the team handles."}]}, {"step": "Hand over to collection and settle deposits and write-offs", "description": "For tenants that do not respond, compile the collection file (contract, invoices, dunning history, correspondence) for the collection agency or bailiff, follow the case, settle deposits against final invoices at termination, and book write-offs and provisions per entity with the asset manager's approval.", "streamsNeeded": [{"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Assembles the collection file from the debtor history and tracks handed-over cases, recoveries and write-offs per entity."}, {"id": "manage-leases-through-their-lifecycle", "name": "Manage Leases Through Their Lifecycle", "howItSupports": "Settles the deposit against the final invoice and damages at termination and closes the contract's financial position."}, {"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Books provisions and write-offs per entity so the debtor position in the closed period is realistic."}]}]}, {"id": "jtbd-finc-2", "name": "Keep multi-entity books accurate and reconciled every day", "whatItIs": "Maintain the general ledger of every legal entity in the group as a true, reconciled record at any point in the month: entity structure and chart of accounts, supplier and maintenance invoices with approval, bank reconciliation per entity, VAT with exempt and taxed rent, intercompany positions, fixed assets and loans. The books must be ready for the accountant, the auditor and the asset manager without a monthly clean-up.", "outcome": "Every entity's ledger is reconciled with its bank accounts, debtors and creditors at the end of each day, supplier invoices are approved and paid within terms, VAT is filed correctly per entity, intercompany positions balance, and the finance team spends its time on exceptions and analysis rather than on booking and reconciling.", "steps": [{"step": "Maintain the entity structure, chart of accounts and opening balances", "description": "Set up each legal entity with its objects, bank accounts, loans, VAT status and reporting group, apply the group chart of accounts and cost-centre structure per complex, and load opening balances when an entity or portfolio is acquired or migrated from a legacy system.", "streamsNeeded": [{"id": "onboard-portfolio-and-entities", "name": "Onboard Portfolio and Entities", "howItSupports": "Creates entities, bank accounts, chart of accounts mappings and opening balances as part of portfolio onboarding, including migrations from legacy systems."}, {"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Holds the multi-entity ledger, cost centres per complex and the consolidation structure per fund that all postings follow."}]}, {"step": "Capture, code and approve supplier and maintenance invoices", "description": "Receive supplier invoices by e-mail, portal or e-invoicing, let the AI assistant extract and code them to entity, complex, cost account and recoverability, match them to work orders, maintenance contracts or project commitments, route them through the approval workflow and schedule payment within terms.", "streamsNeeded": [{"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Runs accounts payable: invoice capture, coding to entity, complex and account, approval workflow and payment batches per entity."}, {"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Provides the work orders and completion reports that maintenance invoices are matched against before approval."}, {"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Supplies the AI invoice-coding assistant and the inbox robot that turn incoming invoices into coded, matched drafts."}]}, {"step": "Reconcile bank accounts per entity daily", "description": "Import statements for every entity's bank accounts through the bank connectors, match rent receipts, supplier payments, loan instalments, interest and bank costs to the ledger, book the unmatched lines, and confirm at day end that every bank balance equals the ledger balance per entity.", "streamsNeeded": [{"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Imports bank statements per entity through the bank integration and matches receipts and payments to open items."}, {"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Reconciles bank balances to ledger balances per entity and books the remaining lines such as interest, loan instalments and bank costs."}, {"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Runs the daily reconciliation robot and reports the automation rate and the exceptions that need a person."}]}, {"step": "Handle VAT, pro-rata and tax positions per entity", "description": "Apply the right VAT treatment per contract and invoice (exempt residential rent, taxed commercial leases with an opted lease, service charges), calculate the pro-rata deduction on mixed-use entities, prepare and file the VAT return and ICP per entity, and keep the transfer tax, property tax and depreciation positions correct for the accountant.", "streamsNeeded": [{"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Handles VAT coding per contract and invoice, pro-rata calculations, VAT return preparation and tax positions per entity."}, {"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Applies the contract's VAT treatment to every rent and service charge invoice so the VAT return is built from correct source documents."}]}, {"step": "Balance intercompany positions and automate recurring postings", "description": "Book management fees, recharges and loans between entities as matched intercompany pairs, run recurring postings for depreciation, accruals, loan interest and prepayments per entity on schedule, and let robots and integrations with the accountant's software take over repetitive work so the team handles only exceptions.", "streamsNeeded": [{"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Posts intercompany pairs, recurring journals and accruals per entity and checks that intercompany positions balance across the group."}, {"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Schedules the recurring posting robots and connects the ledger to the accountant's and auditor's tools through certified integrations and the API."}]}]}, {"id": "jtbd-finc-3", "name": "Close the period and settle service charges without spreadsheets", "whatItIs": "Close each month, quarter and year per entity and consolidate per fund from the reconciled ledger: run the close checklist, post accruals, prepayments, depreciation and valuation results, settle the annual service charges per complex with tenants within the statutory period, produce investor and owner statements and the audit file, and hand over to the accountant and auditor through integrations rather than exports.", "outcome": "The period closes per entity in days with a documented checklist, consolidation per fund and investor statements come out of the same books, service charge settlements are issued to every tenant before the legal deadline with postings that reconcile to the ledger, and the auditor works from a complete file without a spreadsheet trail.", "steps": [{"step": "Run the period-close checklist per entity", "description": "Work through the close checklist per entity: rent runs complete, bank reconciled, supplier invoices booked, VAT reconciled, intercompany balanced, sub-ledgers tied to the general ledger. Track who completed what, resolve open items and lock the period when the checklist is green.", "streamsNeeded": [{"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Provides the close checklist per entity with status per task, sub-ledger tie-outs and the period lock."}, {"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Runs the tie-out checks and reminder tasks automatically so the controller sees only the entities and items that are not green."}]}, {"step": "Post accruals, depreciation, valuations and loan positions", "description": "Book accruals for costs not yet invoiced, prepayments, depreciation per object, loan interest and repayments, and the valuation results and deferred tax positions per entity, using the valuation records and project data already in the system rather than a separate valuation spreadsheet.", "streamsNeeded": [{"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Posts accruals, depreciation, loan and valuation journals per entity from configured schedules and the valuation and project records."}, {"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Provides the valuation records per object that the revaluation postings and the investor statements rely on."}]}, {"step": "Settle service charges per complex within the legal deadline", "description": "After year end, gather the recoverable costs booked per complex, apply the distribution keys and the contractual and legal rules per tenant, calculate the settlement against the advances paid, issue the statements to tenants and post the receivables or payables and the next year's advances in one run, complex by complex, before the statutory deadline.", "streamsNeeded": [{"id": "manage-leases-through-their-lifecycle", "name": "Manage Leases Through Their Lifecycle", "howItSupports": "Calculates the service charge settlement per complex and contract from booked costs, keys and advances, produces tenant statements and updates the advances."}, {"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Supplies the booked recoverable costs per complex and posts the settlement receivables and payables per entity."}, {"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Invoices or refunds the settlement amounts and collects them through the normal direct debit and dunning cycle."}]}, {"step": "Consolidate per fund and produce investor and owner statements", "description": "Consolidate the entities of each fund with intercompany eliminations, produce the balance sheet, profit and loss and cash flow per entity and fund, generate investor and owner statements with distributions, and publish them to the investor and owner portal for the asset manager and the investors.", "streamsNeeded": [{"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Consolidates entities per fund, eliminates intercompany positions and generates the financial statements and investor statements."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Publishes the statements and distributions to investors and owners in their portal with scoped access per fund."}]}, {"step": "Hand over to the accountant and auditor through integrations", "description": "Give the accountant and auditor access to the closed period, the audit file and the supporting documents through certified integrations with their software and the API, answer sample requests from the document trail, and process the annual accounts adjustments back into the ledger without re-keying.", "streamsNeeded": [{"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Provides the certified accounting integrations, the audit-file export and the API through which the accountant and auditor read the closed period."}, {"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Keeps the document trail from every posting to its invoice, bank line or contract and books the year-end adjustments into the locked period under control."}]}]}], "customerJourneyStories": [{"id": "journey-finc-1", "name": "From a generic accounting package plus spreadsheets to a real estate ledger", "linkedJobIds": ["jtbd-finc-2", "jtbd-finc-3"], "summary": "A finance controller at a Dutch investor with thirty entities and 2,500 units lives through the move from a generic accounting package, a separate rent-roll tool and a folder of spreadsheets to an integrated real estate ERP, from the year-end that took until April to the renewal in which the controller asks for hyper automation.", "stages": [{"stage": "Trigger", "narrative": "The year-end close drags into April: bank lines of six entities are still unreconciled, the service charge settlements of four complexes miss the legal deadline, and the auditor asks for a spreadsheet trail that explains why the rent roll and the ledger differ. The asset manager and the managing director tell the controller that next year the books, the contracts and the rent runs must live in one system."}, {"stage": "Discovery", "narrative": "The controller asks the firm's accountant and peers at a real estate finance network which systems investors of similar size use and hears that investors such as Dunavast and Rockfield run their financial administration on Bloxs. A demo shows rent runs, direct debits, bank reconciliation and a multi-entity ledger in the same database as the contracts, and a call with a controller at a comparable investor confirms that the close no longer needs spreadsheets."}, {"stage": "Evaluation", "narrative": "The controller evaluates the real estate ERP against upgrading the accounting package with a rent-roll module and against a large international property platform. Decisive checks are multi-entity accounting with consolidation per fund, SEPA direct debit and bank connectors for the firm's two banks, VAT handling for mixed exempt and taxed portfolios, service charge settlement under Dutch rules, the certified integration with the accountant's software and the cost and duration of migrating thirty entities with opening balances. The SaaS security documentation satisfies the auditor."}, {"stage": "Trial", "narrative": "One fund with five entities goes first: entities, objects, contracts, bank accounts and opening balances are migrated with the implementation team, and one quarter runs in parallel with the old package. The first rent run and direct debit batch go out from the new system without corrections, the daily bank reconciliation matches most lines automatically, and the quarter closes per entity from a checklist instead of an e-mail thread."}, {"stage": "Engagement", "narrative": "All entities move over before the next year end. The team reconciles every entity daily, supplier invoices flow through the approval workflow, VAT returns come out per entity, and the year-end service charge settlements are calculated per complex from the booked costs and issued before the deadline. The auditor works from the audit file and the document trail, and the close per entity drops from weeks to days."}, {"stage": "Retention", "narrative": "At renewal the controller presents a year end closed in weeks instead of months, settlements issued on time for every complex and a clean audit. The firm adds the API Platform for the accountant's and the bank's connections and asks the vendor about hyper automation for the rent run and reconciliation, and the controller becomes a reference for other finance teams evaluating the platform."}]}, {"id": "journey-finc-2", "name": "Letting robots and AI assistants run the repetitive finance work", "linkedJobIds": ["jtbd-finc-1", "jtbd-finc-2"], "summary": "Having run the books on the ERP for a year, the finance controller adopts hyper automation and AI assistants to take over the rent run, bank reconciliation, invoice coding and dunning, starting with one process and one entity group, and ends up with a finance team that handles exceptions rather than transactions.", "stages": [{"stage": "Trigger", "narrative": "The firm acquires a portfolio that adds twelve entities and 900 units, and the managing director declines to add finance headcount. The controller counts the hours per month spent on statement matching, invoice coding and dunning letters and concludes that the team cannot absorb the growth by working the same way."}, {"stage": "Discovery", "narrative": "During the account review the vendor's customer success manager shows the hyper automation foundation of the platform: robots that run the rent run, import and match bank statements and execute the dunning cycle, and an AI assistant that codes supplier invoices from the inbox. A published customer testimonial about fully automated repetitive financial processes and a session with a controller already running the robots make the model concrete."}, {"stage": "Evaluation", "narrative": "The controller and the auditor check how the robots log every action, how matching rules and coding suggestions are reviewed and corrected, what happens when a bank connection fails, how approvals stay with a person, and how the automation rate is reported per entity. The controller compares the module price with the headcount the acquired portfolio would otherwise require and confirms the data stays within the SaaS security terms."}, {"stage": "Trial", "narrative": "Bank reconciliation for one fund runs by robot for two months while the team reviews the results daily. The automated matching rate climbs as the rules learn from corrections, unmatched lines at day end fall to a handful, and the acquired entities are onboarded with the robot running from day one."}, {"stage": "Engagement", "narrative": "Robots take over the rent run checks, direct debit batches, statement matching and the dunning schedule for all entities, the AI assistant codes the bulk of supplier invoices for approval, and the VAT return is prepared automatically per entity. The finance team's day starts with the exception queue and the automation dashboard, and the acquired portfolio is absorbed without a new hire."}, {"stage": "Retention", "narrative": "At renewal the controller reports the same team closing more entities faster, with a higher collection rate and fewer manual journals, and asks the vendor for the next agents: automated period-close tie-outs and AI-drafted settlement explanations for tenants. The firm's automation rate becomes a figure in the vendor's next customer story."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-finc-top", "name": "Days to close the period", "description": "Working days from the last day of the month or quarter until every entity is closed, consolidated per fund and the figures are released to the asset manager. Modeled seed value for a mid-sized Dutch investor, not an official Bloxs or customer figure.", "unit": "working days", "currentValue": "12", "targetValue": "5", "link": "https://dashboard.example.com/real-estate-erp-platform/customers/finc/kpis/co-finc-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-finc-co-finc-top.png"}, "branches": [{"id": "co-finc-b1", "name": "Cash collection and reconciliation", "description": "How completely rent is collected and how much of the daily bank and debtor work runs without a person touching
