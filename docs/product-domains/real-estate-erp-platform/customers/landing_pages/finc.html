tribution proposal, the reserve fund position, the multi-year maintenance plan, quotes for proposed works, board proposals and the previous minutes into one pack per association, published to owners before the meeting.", "streamsNeeded": [{"id": "run-owners-association-administration", "name": "Run Owners' Association Administration", "howItSupports": "Generates the pack from the association's accounts, budget, reserve fund and decisions and publishes it with the agenda."}, {"id": "plan-and-execute-periodic-maintenance", "name": "Plan and Execute Periodic Maintenance", "howItSupports": "Supplies the multi-year plan summary and the quotes for proposed maintenance works."}]}, {"step": "Run the meeting with attendance, proxies and votes", "description": "Register attendance and proxies, check the quorum against the apportionment keys, present the agenda items, take votes weighted by the keys or by head as the regulations prescribe, and record each decision with the vote result during the meeting, also for hybrid or online meetings.", "streamsNeeded": [{"id": "run-owners-association-administration", "name": "Run Owners' Association Administration", "howItSupports": "Handles attendance, proxies, quorum and weighted voting and records decisions with the vote result."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Lets owners give a proxy or vote online where the regulations allow it."}]}, {"step": "Record decisions and execute the actions", "description": "Draft the minutes from the recorded decisions, turn each decision into actions for the administrator, the board or a supplier, such as awarding a maintenance contract, starting a renovation, changing the house rules or adjusting the contribution, and track them until completed.", "streamsNeeded": [{"id": "run-owners-association-administration", "name": "Run Owners' Association Administration", "howItSupports": "Produces the minutes from the decisions and keeps the action list per association with owners and due dates."}, {"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Creates the work orders for maintenance decisions and links them to the decision."}, {"id": "plan-and-execute-periodic-maintenance", "name": "Plan and Execute Periodic Maintenance", "howItSupports": "Updates the multi-year plan and reserve fund with approved large maintenance decisions."}]}, {"step": "Communicate the outcomes and track completion", "description": "Publish the minutes and decisions to every owner in the portal and by mail where required, answer questions, inform owners of the progress of approved works, and report at the next meeting which actions were completed.", "streamsNeeded": [{"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Publishes minutes, decisions and progress updates to owners and notifies them of changes."}, {"id": "run-owners-association-administration", "name": "Run Owners' Association Administration", "howItSupports": "Reports action status per decision and carries open actions into the next meeting agenda."}]}]}, {"id": "jtbd-vvea-3", "name": "Serve owners with self-service information", "whatItIs": "Give the owners of every managed association access to their own information without calling the administrator: activate them on the owner portal, publish documents, decisions, contributions and accounts, let them report faults in common areas and follow the ticket, handle owner changes at sale with the notary statement, and keep contact details and preferences current.", "outcome": "Owners find their contribution overview, documents, minutes and the status of a fault report in the portal, notary questions at a sale are answered from the record within a day, and the administrator's phone and mailbox are used for exceptions rather than routine questions.", "steps": [{"step": "Activate owners on the portal", "description": "Invite every owner with an account linked to their apartment right, verify identity, capture communication preferences and consent for digital convocation, and support the board members with their additional role in the portal.", "streamsNeeded": [{"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Creates and activates owner and board accounts linked to apartment rights with the right roles and preferences."}, {"id": "onboard-portfolio-and-entities", "name": "Onboard Portfolio and Entities", "howItSupports": "Provides the owner and apartment-right data from the association set-up so accounts are created in bulk."}]}, {"step": "Publish documents, decisions and financial information", "description": "Make the splitting deed, regulations, house rules, insurance policies, minutes, decisions, budgets, annual accounts, the contribution overview and payment status of each owner available in the portal, per association and per owner, with the right visibility.", "streamsNeeded": [{"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Shows association documents, decisions and each owner's own contribution and payment overview in the portal."}, {"id": "run-owners-association-administration", "name": "Run Owners' Association Administration", "howItSupports": "Supplies the association's decisions, budgets, accounts and contribution ledgers as the source for the portal."}]}, {"step": "Let owners report faults in common areas and follow tickets", "description": "Receive fault reports on lifts, entrance doors, roofs, lighting and other common parts from owners in the portal and app with photos, route them to the association's contracted suppliers within the board's mandate, and show owners the status until the fault is fixed.", "streamsNeeded": [{"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Lets owners report common-area faults with photos and follow the ticket status in the portal."}, {"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Turns the report into a ticket and work order for the association's supplier within the board's approval mandate."}]}, {"step": "Handle owner changes at sale and notary requests", "description": "When an apartment is sold, answer the notary's request with the contribution position, arrears, the reserve fund share and the pending decisions, settle the contribution between seller and buyer at transfer, register the new owner, and close the old owner's account.", "streamsNeeded": [{"id": "run-owners-association-administration", "name": "Run Owners' Association Administration", "howItSupports": "Produces the notary statement from the association record and transfers the apartment right to the new owner with the settlement."}, {"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Drafts the notary statement automatically from the ledger and the decisions so it is answered within a day."}]}]}], "customerJourneyStories": [{"id": "journey-vvea-1", "name": "Migrating a VvE practice from Informant to the platform", "linkedJobIds": ["jtbd-vvea-1", "jtbd-vvea-2"], "summary": "A VvE administrator at a firm that has run its 150 associations on Informant for two decades goes through the acquisition announcement, the decision to migrate, a pilot with twenty associations and the season in which all associations, their meetings and their accounts move to the new platform without a board noticing a gap in service.", "stages": [{"stage": "Trigger", "narrative": "In July 2025 the firm learns that Informant has been acquired by Bloxs, that migration is free of charge and phased, and that Informant support continues until 31 December 2027. The administrator has just finished a meeting season in which every pack was assembled by hand and a board asked for an owner portal the firm could not offer. The director asks whether to migrate early or wait."}, {"stage": "Discovery", "narrative": "The administrator attends the migration webinar for Informant customers, hears the Informant managing director explain the phased plan, and sees the VvE suite with the meeting module, the owner portal and the robots for contribution runs. Two peer administrators at a VvE trade meeting report on their first migrated associations."}, {"stage": "Evaluation", "narrative": "The firm checks whether the apportionment keys, owner history, reserve fund positions and decisions of every association survive the migration, how weighted voting and hybrid meetings are supported, whether the association bank accounts stay separated and reconciled, what the owner portal costs per association, and how support is organised by people who know the VvE trade. The audit committee of the largest association is shown the accounts format."}, {"stage": "Trial", "narrative": "Twenty associations with a meeting due in the autumn are migrated first. Their contribution runs, bank reconciliation and meeting packs come out of the new platform while the rest stays on Informant, and the administrator reconciles every balance with the Informant figures. Two boards receive their first meeting pack in the owner portal."}, {"stage": "Engagement", "narrative": "The remaining associations move in waves before the spring meeting season. Contribution runs and reconciliation become robot jobs with an exception queue, the meeting module handles convocations, proxies and weighted votes, and annual accounts are generated per association instead of assembled. The administrator's association count rises without a new hire."}, {"stage": "Retention", "narrative": "A year after the announcement all associations run on the platform, the meeting season closed with every pack on time, and the firm has won a dozen associations from a competitor by showing the owner portal. The administrator asks for the AI assistant that drafts minutes from the recorded decisions."}]}, {"id": "journey-vvea-2", "name": "Bringing the owners of every association onto the portal", "linkedJobIds": ["jtbd-vvea-3", "jtbd-vvea-2"], "summary": "Having run the associations' administration on the platform for a season, a VvE administrator adopts the owner portal and app to replace letters, phone calls and e-mail with owners, starting with the largest associations, and ends up with owners who serve themselves and boards that ask for digital meetings.", "stages": [{"stage": "Trigger", "narrative": "After the meeting season the administrator counts hundreds of owner e-mails asking for minutes, contribution overviews or the status of a lift repair, and a notary complains that a statement for a sale took a week. A board of a 200-apartment association threatens to switch administrator unless owners can see their information online."}, {"stage": "Discovery", "narrative": "The vendor's customer success manager shows in the quarterly review that the owner portal the firm already licenses for a few associations can be activated for all of them, that owners can report common-area faults in the app and follow tickets, and that notary statements can be generated from the record. A webinar with a firm that has 8,000 owners on the portal makes the model concrete."}, {"stage": "Evaluation", "narrative": "The administrator checks how owners are identified and invited, how visibility per association and per owner is controlled, whether digital convocation is valid under each association's regulations, how board members get their extra rights, and what the roll-out to thousands of owners will cost in support. The board of the largest association reviews the portal with three owners."}, {"stage": "Trial", "narrative": "The ten largest associations are activated first: owners are invited in bulk, the last minutes and accounts are published, and common-area fault reports start arriving in the app. Within a quarter most owners of those associations have activated their account and the e-mail volume for them drops visibly."}, {"stage": "Engagement", "narrative": "The portal becomes the default for every association. Convocations, packs and minutes are published there, owners see their contribution and payment status, notary statements are produced from the record within a day, and boards start using the portal to approve small works. The administrator handles exceptions rather than routine questions."}, {"stage": "Retention", "narrative": "At renewal the firm shows boards that owner queries per association have fallen sharply and that no meeting was convened late, and it uses the portal as the argument in every pitch to a new association. The administrator asks for online voting in hybrid meetings for the next season."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-vvea-top", "name": "Associations managed per FTE", "description": "Number of owners' associations administered per full-time administrator, including financial administration, meetings and owner communication. Modeled seed value for a Dutch VvE administration firm, not an official Bloxs or Informant figure.", "unit": "associations per FTE", "currentValue": "45", "targetValue": "70", "link": "https://dashboard.example.com/real-estate-erp-platform/customers/vvea/kpis/co-vvea-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-vvea-co-vvea-top.png"}, "branches": [{"id": "co-vvea-b1", "name": "Financial administration accuracy", "description": "Whether contributions are collected, accounts reconciled, reserve funds maintained and annual accounts delivered correctly and on time for every association.", "currentValue": "70", "icon": "kpi-vvea-co-vvea-b1.png", "children": [{"id": "co-vvea-b1-c1", "name": "Contribution collection rate", "description": "Contributions received within 30 days of the due date as a share of contributions invoiced across all managed associations.", "unit": "%", "currentValue": "94", "targetValue": "98.5", "icon": "kpi-vvea-co-vvea-b1-c1.png", "children": [{"id": "co-vvea-b1-c1-l1", "name": "Direct debit share of contributions", "description": "Share of owner contributions collected by direct debit mandate rather than by manual transfer.", "unit": "%", "currentValue": "72", "targetValue": "90", "icon": "kpi-vvea-co-vvea-b1-c1-l1.png", "children": []}, {"id": "co-vvea-b1-c1-l2", "name": "Contribution arrears older than 90 days", "description": "Open contributions older than 90 days as a share of the annual contributions invoiced.", "unit": "%", "currentValue": "3.5", "targetValue": "1.2", "icon": "kpi-vvea-co-vvea-b1-c1-l2.png", "children": []}]}, {"id": "co-vvea-b1-c2", "name": "Annual accounts delivery time", "description": "Average number of days after the association's financial year-end until the annual accounts and audit committee pack are delivered.", "unit": "days", "currentValue": "95", "targetValue": "45", "icon": "kpi-vvea-co-vvea-b1-c2.png", "children": [{"id": "co-vvea-b1-c2-l1", "name": "Automated bank reconciliation rate for associations", "description": "Share of bank statement lines on association accounts matched automatically to contributions and supplier invoices.", "unit": "%", "currentValue": "60", "targetValue": "95", "icon": "kpi-vvea-co-vvea-b1-c2-l1.png", "children": []}, {"id": "co-vvea-b1-c2-l2", "name": "Reserve fund plan coverage", "description": "Share of associations whose reserve fund contribution is based on a current multi-year maintenance plan and meets the legal minimum.", "unit": "%", "currentValue": "70", "targetValue": "100", "icon": "kpi-vvea-co-vvea-b1-c2-l2.png", "children": []}]}]}, {"id": "co-vvea-b2", "name": "Owner engagement and governance", "description": "Whether meetings are prepared efficiently and validly, decisions are executed, and owners serve themselves instead of calling the administrator.", "currentValue": "56", "icon": "kpi-vvea-co-vvea-b2.png", "children": [{"id": "co-vvea-b2-c1", "name": "Meeting preparation time", "description": "Administrator hours spent per meeting on convocation, pack assembly, proxies and attendance preparation.", "unit": "hours per meeting", "currentValue": "6", "targetValue": "2", "icon": "kpi-vvea-co-vvea-b2-c1.png", "children": [{"id": "co-vvea-b2-c1-l1", "name": "Meeting packs sent on time", "description": "Share of meetings whose convocation and complete pack reached owners within the notice period required by the regulations.", "unit": "%", "currentValue": "80", "targetValue": "99", "icon": "kpi-vvea-co-vvea-b2-c1-l1.png", "children": []}, {"id": "co-vvea-b2-c1-l2", "name": "Decisions executed within the agreed term", "description": "Share of meeting decisions whose resulting actions were completed by the date agreed in the meeting.", "unit": "%", "currentValue": "65", "targetValue": "92", "icon": "kpi-vvea-co-vvea-b2-c1-l2.png", "children": []}]}, {"id": "co-vvea-b2-c2", "name": "Owner self-service rate", "description": "Share of owner interactions (document requests, contribution questions, fault reports, notary information) handled through the portal without administrator involvement.", "unit": "%", "currentValue": "35", "targetValue": "75", "icon": "kpi-vvea-co-vvea-b2-c2.png", "children": [{"id": "co-vvea-b2-c2-l1", "name": "Owner portal activation rate", "description": "Share of owners across managed associations who have activated their portal account.", "unit": "%", "currentValue": "40", "targetValue": "85", "icon": "kpi-vvea-co-vvea-b2-c2-l1.png", "children": []}, {"id": "co-vvea-b2-c2-l2", "name": "Owner queries per association per month", "description": "Number of owner phone calls and e-mails per association per month that require administrator handling.", "unit": "queries per association per month", "currentValue": "6", "targetValue": "2", "icon": "kpi-vvea-co-vvea-b2-c2-l2.png", "children": []}]}]}]}, "businessOutcomes": {"top": {"id": "bo-vvea-top", "name": "Associations administered on the platform", "description": "Number of owners' associations administered on the platform across all VvE tenants, including migrated Informant customers. Modeled seed value.", "unit": "associations", "currentValue": "9000", "targetValue": "20000", "link": "https://dashboard.example.com/real-estate-erp-platform/customers/vvea/kpis/bo-vvea-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-vvea-bo-vvea-top.png"}, "branches": [{"id": "bo-vvea-b1", "name": "VvE suite adoption", "description": "How many VvE administrators run on the platform, how fast associations are onboarded and how deeply the owner portal and meeting capabilities are used.", "currentValue": "48", "icon": "kpi-vvea-bo-vvea-b1.png", "children": [{"id": "bo-vvea-b1-c1", "name": "VvE administrator tenant count", "description": "Number of VvE administration firms and VvE departments with an active subscription to the owners' association suite.", "unit": "tenants", "currentValue": "90", "targetValue": "200", "icon": "kpi-vvea-bo-vvea-b1-c1.png", "children": [{"id": "bo-vvea-b1-c1-l1", "name": "Informant VvE customers migrated", "description": "Share of Informant VvE administration customers whose associations have been migrated to the platform before Informant support ends.", "unit": "%", "currentValue": "10", "targetValue": "100", "icon": "kpi-vvea-bo-vvea-b1-c1-l1.png", "children": []}, {"id": "bo-vvea-b1-c1-l2", "name": "Onboarding time per association", "description": "Average administrator and implementation hours to set up or migrate one association with keys, owners, balances and documents.", "unit": "hours per association", "currentValue": "6", "targetValue": "1.5", "icon": "kpi-vvea-bo-vvea-b1-c1-l2.png", "children": []}]}, {"id": "bo-vvea-b1-c2", "name": "Associations per tenant", "description": "Average number of associations administered per VvE tenant on the platform.", "unit": "associations per tenant", "currentValue": "100", "targetValue": "140", "icon": "kpi-vvea-bo-vvea-b1-c2.png", "children": [{"id": "bo-vvea-b1-c2-l1", "name": "Owner portal attach rate for associations", "description": "Share of associations on the platform whose owners have access to the owner portal.", "unit": "%", "currentValue": "30", "targetValue": "80", "icon": "kpi-vvea-bo-vvea-b1-c2-l1.png", "children": []}, {"id": "bo-vvea-b1-c2-l2", "name": "Meeting module usage share", "description": "Share of associations whose annual meeting was convened, voted and minuted through the meeting module.", "unit": "%", "currentValue": "45", "targetValue": "90", "icon": "kpi-vvea-bo-vvea-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-vvea-b2", "name": "VvE automation value", "description": "How much of association bookkeeping runs on robots and what the VvE segment is worth in add-on revenue, cross-sell and retention.", "currentValue": "36", "icon": "kpi-vvea-bo-vvea-b2.png", "children": [{"id": "bo-vvea-b2-c1", "name": "Automated association bookkeeping share", "description": "Share of contribution runs, reconciliations, arrears letters and account drafts executed by robots with exception-only human review.", "unit": "%", "currentValue": "30", "targetValue": "80", "icon": "kpi-vvea-bo-vvea-b2-c1.png", "children": [{"id": "bo-vvea-b2-c1-l1", "name": "Contribution runs executed by robots", "description": "Share of periodic contribution and direct debit runs across all associations executed as scheduled robot jobs.", "unit": "%", "currentValue": "40", "targetValue": "95", "icon": "kpi-vvea-bo-vvea-b2-c1-l1.png", "children": []}, {"id": "bo-vvea-b2-c1-l2", "name": "Robot-drafted annual accounts", "description": "Share of association annual accounts whose first draft, including reserve fund statement and notes, was produced automatically.", "unit": "%", "currentValue": "10", "targetValue": "60", "icon": "kpi-vvea-bo-vvea-b2-c1-l2.png", "children": []}]}, {"id": "bo-vvea-b2-c2", "name": "VvE suite expansion revenue", "description": "Annual recurring revenue from owner portal, meeting, technical and automation add-ons sold to existing VvE tenants.", "unit": "EUR k per year", "currentValue": "200", "targetValue": "700", "icon": "kpi-vvea-bo-vvea-b2-c2.png", "children": [{"id": "bo-vvea-b2-c2-l1", "name": "Technical module cross-sell to VvE tenants", "description": "Share of VvE tenants that also license the technical management module for common-area tickets and multi-year plans.", "unit": "%", "currentValue": "20", "targetValue": "60", "icon": "kpi-vvea-bo-vvea-b2-c2-l1.png", "children": []}, {"id": "bo-vvea-b2-c2-l2", "name": "VvE tenant churn rate", "description": "Share of VvE administration tenants that leave the platform per year, including Informant customers lost during migration.", "unit": "%", "currentValue": "5", "targetValue": "2", "icon": "kpi-vvea-bo-vvea-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make one association record the place where a VvE administrator budgets, collects, reserves, meets, decides and informs for every association, so an administrator serves more associations and their owners with fewer errors and boards choose the firm for its transparency.", "timeHorizons": {"year1": {"focus": "Migrate the Informant VvE base onto the platform phase by phase without a board noticing a service gap, make contribution runs and reconciliation robot jobs, and give every association a meeting module and an owner portal.", "productTheme": "The Informant VvE heritage on one platform", "customerKPI": {"northStar": "Associations managed per FTE", "supporting": ["Contribution collection rate", "Meeting preparation time"]}, "businessKPI": {"northStar": "Associations administered on the platform", "revenueStreams": ["Owners' Association Suite subscriptions", "Owner portal add-ons per association", "Migration and implementation services"], "supporting": ["Informant VvE customers migrated", "Owner portal attach rate for associations"]}, "milestones": ["Deliver the Informant migration tooling that moves associations, apportionment keys, owners, reserve funds and decision history with a reconciled parallel run", "Ship the meeting module with statutory notice checks, proxies, weighted voting, decisions and minutes for every VvE tenant", "Run contribution invoicing, direct debit and bank reconciliation per association as scheduled robots with an exception queue"]}, "year3": {"focus": "Automate association bookkeeping and annual accounts end to end, connect reserve funds to multi-year maintenance plans and common-area tickets, and make owner self-service with online voting the norm.", "productTheme": "Automated association administration with self-serving owners", "customerKPI": {"northStar": "Associations managed per FTE", "supporting": ["Annual accounts delivery time", "Owner self-service rate"]}, "businessKPI": {"northStar": "Associations administered on the platform", "revenueStreams": ["Modular VvE suite subscriptions", "Technical management cross-sell", "Hyper automation robot add-ons"], "supporting": ["Automated association bookkeeping share", "Technical module cross-sell to VvE tenants"]}, "milestones": ["Generate annual accounts, reserve fund statements and audit committee packs automatically per association from the ledger", "Link every association's reserve fund to a multi-year maintenance plan and its common-area tickets to the technical module", "Launch online proxies and voting for hybrid meetings and notary statements produced from the record"]}, "year5": {"focus": "Let AI agents draft budgets, minutes, owner letters and notary statements and run routine association administration under the administrator's supervision, and extend the suite to the German community-of-owners market.", "productTheme": "AI-assisted association administration across countries", "customerKPI": {"northStar": "Associations managed per FTE", "supporting": ["Reserve fund plan coverage", "Decisions executed within the agreed term"]}, "businessKPI": {"northStar": "VvE automation value", "revenueStreams": ["Multi-country association administration subscriptions", "AI association agent add-ons", "Reserve fund and maintenance benchmark data products"], "supporting": ["VvE suite expansion revenue", "VvE tenant churn rate"]}, "milestones": ["Deploy an association agent that drafts budgets, minutes, arrears letters and notary statements for administrator approval", "Publish reserve fund and maintenance cost benchmarks per building type from anonymised cross-tenant association data", "Localise the suite for German owners' communities with their meeting, voting and accounting rules"]}}}, "domain": "Property Management and VvE Firms"}, {"id": "mdir", "name": "Real Estate Company Director", "description": "Managing director, owner or partner of a Dutch or German real estate organisation of 5 to 200 FTE: an investment and asset management firm such as Rockfield, Urban Interest, Burgstate or Dunavast, a third-party property manager such as FIT Vastgoedbeheer, Ruijters or CRMD Vastgoed Management, or one of the hundreds of property managers and VvE administrators that grew up on Informant since the 1990s. Signs the ERP subscription, decides which of the eight modules (Relaties, Projecten, Objecten, Techniek, Contracten, Financieel, Rapportages, Portalen) and which add-ons (portals, API Platform, hyper automation) get switched on, sponsors the migration from Informant, a legacy package or spreadsheets, and is personally accountable to owners, investors, lenders, the tax authority and the Huurcommissie rent rules. Judges the platform on units and associations managed per FTE, operating margin, client retention, compliance and total cost of ownership rather than on feature lists.", "icon": "mdir.png", "careAbout": ["Growing the number of units, entities and associations under management without adding back-office headcount in a tight Dutch labour market", "A healthy operating margin in a trade where management fees are a few percent of rent and every manual correction eats into it", "Keeping owner and investor mandates for decades by delivering statements, reports and service that clients can check for themselves", "One system of record from object to bank statement so that letting, technical management, finance and reporting stop re-keying each other's data", "Passing every audit, rent-price check, VAT return and investor covenant test as a by-product of daily operations rather than a quarterly scramble", "Predictable total cost of ownership: a subscription that scales with modules and portfolio size, not surprise consultancy invoices or a forced migration"], "winsThem": ["A live demo on the firm's own portfolio: a complex loaded with units, contracts, a rent run and the resulting owner statement, followed by a reference call with a peer such as FIT Vastgoedbeheer or Ruijters", "A written migration plan that imports entities, objects, contracts, relations and open balances from Informant or the legacy package, with a bounded parallel run and no migration fee", "Hyper automation that visibly removes repetitive financial work (bank reconciliation, invoice coding, indexation letters) within the first quarter, backed by the published testimonial of 100 percent time savings on repetitive financial processes", "Branded tenant, owner and supplier portals that go live within the first year and measurably cut phone calls and e-mails to the office", "Management dashboards that show units per FTE, arrears, vacancy and margin per client and per entity without exporting to Excel, and a support desk rated 8.9 out of 10"], "theirFear": ["A failed migration in the middle of the year, with staff working two systems, rent runs going out twice and owners receiving wrong statements", "Being locked into a vendor whose roadmap is decided by its largest customer or its private-equity owner, while the subscription keeps creeping up", "A Huurcommissie ruling, a tax finding or a lost investor mandate that damages the reputation built over decades"], "jobsToBeDone": [{"id": "jtbd-mdir-1", "name": "Scale units under management without scaling headcount", "whatItIs": "Grow the number of rental units, legal entities and owners' associations the organisation administers while keeping the back office the same size, by removing re-keying between letting, technical management, finance and reporting, by automating routine financial and technical processes with robots and AI assistants, and by moving tenants, owners and suppliers to self-service portals.", "outcome": "Units and associations per FTE rise year over year; a newly acquired portfolio or a migrated Informant client is absorbed without a new administrator; the director can take on a new mandate or buy a competitor without first hiring.", "steps": [{"step": "Map where the hours go today", "description": "Walk the lifecycle Portfolio to Let to Contract to Collect to Maintain to Account to Report to Serve with the team and count the hand-offs: objects in one package, contracts in Word, rent runs in the accounting system, bank statements matched by hand, fault reports in a shared mailbox, owner statements in Excel.", "streamsNeeded": [{"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Provides the baseline of units, hours and cost per process step that shows where headcount is being spent."}, {"id": "onboard-portfolio-and-entities", "name": "Onboard Portfolio and Entities", "howItSupports": "Exposes how many parallel registers of objects, contracts and relations exist and must be consolidated."}]}, {"step": "Bring the portfolio onto one data model", "description": "Load entities, objects, complexes, units, relations, contracts and opening balances once so that rent runs, tickets, ledgers, statements and dashboards all read the same record; retire the parallel spreadsheets and the legacy package one by one.", "streamsNeeded": [{"id": "onboard-portfolio-and-entities", "name": "Onboard Portfolio and Entities", "howItSupports": "Imports the portfolio from Informant, spreadsheets or a legacy system into one structure of entities, objects, units, relations and contracts."}, {"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Generates the rent run, direct debit and reconciliation straight from the contracts, removing double entry into finance."}, {"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Makes the multi-entity ledger and the owner and investor statements read from the same transactions."}]}, {"step": "Automate repetitive financial and technical work", "description": "Switch on hyper automation robots for bank reconciliation, invoice coding, indexation letters and dunning, and AI assistants for inbox triage and document drafting, so administrators spend their time on exceptions and clients rather than on copying data.", "streamsNeeded": [{"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Runs robots and AI assistants on repetitive tasks and connects accounting, bank, e-mail and maintenance partners through certified integrations."}, {"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Turns rent runs, direct debits, reconciliation and dunning into a mostly unattended process."}, {"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Routes fault reports to work orders and suppliers automatically, with supplier invoices matched on completion."}]}, {"step": "Let tenants, owners and suppliers serve themselves", "description": "Open the branded tenant portal and app, the owner portal and the supplier portal so that rent questions, fault reports, statements, approvals, work orders and invoices happen without a phone call or e-mail to the office.", "streamsNeeded": [{"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Moves rent, documents, fault reports, statements, approvals and work orders to stakeholder self-service."}, {"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Lets tenants report and suppliers accept, plan and complete work in their own portals."}]}, {"step": "Absorb acquired portfolios and firms", "description": "When a new mandate is won, a portfolio is bought or a competing manager is acquired, import its entities, objects, contracts and relations with the migration tooling, map its chart of accounts and put its owners and tenants on the same portals within a quarter.", "streamsNeeded": [{"id": "onboard-portfolio-and-entities", "name": "Onboard Portfolio and Entities", "howItSupports": "Provides the import, mapping and validation tooling to bring an acquired portfolio or firm onto the same platform."}, {"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Shows the acquired portfolio's occupancy, arrears and cost next to the existing one from day one."}]}, {"step": "Measure units per FTE and reinvest", "description": "Track units, associations and revenue per FTE per month on the management dashboard, compare years, and decide where the freed capacity goes: new mandates, a second office, a German portfolio or more asset management advice for clients.", "streamsNeeded": [{"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Shows units per FTE, handling time and margin trends so the director sees the effect of each automation and portal step."}]}]}, {"id": "jtbd-mdir-2", "name": "Win and retain owner and investor clients with service quality", "whatItIs": "Keep existing management mandates and investor relationships for years and win new ones on service quality: statements and reports that arrive on time and are right, responsiveness on faults and approvals that the client can see for themselves, and an onboarding of a new mandate that takes weeks rather than months.", "outcome": "Owner and investor mandates renew without a tender, referrals become the main source of new clients, and a new mandate is live on the platform and its portals within a quarter.", "steps": [{"step": "Define the service promise per client type", "description": "Agree with the team what a private owner, an institutional investor, an owners' association and a lender each get: statement timing, report content, approval thresholds, response times on faults and the portal they use.", "streamsNeeded": [{"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Provides the performance and service data the promise is built on and measured against."}, {"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Defines the standard owner statement and investor report content per client type."}]}, {"step": "Deliver owner statements and investor reports on time, every period", "description": "Have the monthly or quarterly owner statement and the investor report produced from the closed ledger by the same robot every period, reviewed by the controller, and published to the owner portal without a spreadsheet in between.", "streamsNeeded": [{"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Closes the period and produces owner and investor statements from the multi-entity ledger."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Publishes statements and reports to the owner portal with notifications and an audit trail."}]}, {"step": "Show responsiveness through the portals", "description": "Let owners see fault reports, work orders, quotes and approvals in real time in their portal, and let tenants follow their tickets, so the quality of technical and tenant management is visible instead of asserted.", "streamsNeeded": [{"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Gives owners real-time visibility of tickets, approvals and documents on their property."}, {"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Supplies the ticket, work order and completion data that owners and tenants follow."}]}, {"step": "Onboard a new mandate in weeks", "description": "Import the new client's objects, units, contracts and relations, set up the entity and bank connection, let the vacant units, and give the owner portal access before the first rent run, so the client experiences the switch as an upgrade.", "streamsNeeded": [{"id": "onboard-portfolio-and-entities", "name": "Onboard Portfolio and Entities", "howItSupports": "Brings the new mandate's portfolio and contracts onto the platform with validated data."}, {"id": "let-units-and-sign-contracts", "name": "Let Units and Sign Contracts", "howItSupports": "Fills vacant units of the new mandate with screened tenants and e-signed contracts from the first month."}]}, {"step": "Track retention and referrals", "description": "Review mandate renewals, lost clients, owner satisfaction and referral-sourced leads per quarter, and act on the clients whose statements were late or whose approvals stalled.", "streamsNeeded": [{"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Reports client retention, statement timeliness and service KPIs per client on the management dashboard."}]}]}, {"id": "jtbd-mdir-3", "name": "Run a compliant, insight-driven real estate business", "whatItIs": "Steer the organisation on live occupancy, arrears, margin and cash data instead of month-old exports, and satisfy rent-price rules, tenancy law, VAT, audit and investor covenant obligations as a by-product of daily operations, with data secured in a SaaS environment the auditor and the clients trust.", "outcome": "The director opens one dashboard on Monday morning and knows occupancy, arrears, margin per client and per entity and cash position; rent-price checks, indexation, VAT returns and audit files come from the system with no spreadsheet reconciliation.", "steps": [{"step": "Define the steering KPIs", "description": "Agree with finance, letting and technical management on the handful of numbers that run the business: units per FTE, operating margin, occupancy, arrears share, ticket resolution time, days to close and client retention.", "streamsNeeded": [{"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Turns the KPI definitions into dashboards fed from contract, invoice, ticket and ledger data."}]}, {"step": "Get margin and arrears live per client and per entity", "description": "Have management fees, staff cost, rent invoiced, rent collected and supplier cost flow into a live margin and arrears view per client, entity and complex, so pricing of mandates and collection decisions are made on facts during the year, not after it.", "streamsNeeded": [{"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Provides the drill-down from portfolio to client, entity, complex and unit."}, {"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Supplies invoiced, collected and overdue rent per contract in real time."}, {"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Adds actual supplier invoices and fees so realised margin replaces planned margin."}]}, {"step": "Make compliance a by-product of the process", "description": "Ensure every letting runs a rent-price check and candidate screening, every indexation follows the legal cap and the contract clause, every service charge settlement is issued on time and every VAT return and audit file comes straight from the ledger.", "streamsNeeded": [{"id": "let-units-and-sign-contracts", "name": "Let Units and Sign Contracts", "howItSupports": "Embeds rent-price checks and screening in every letting before the contract is signed."}, {"id": "manage-leases-through-their-lifecycle", "name": "Manage Leases Through Their Lifecycle", "howItSupports": "Applies indexation caps, special terms and settlement deadlines automatically across all contracts."}, {"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Produces VAT returns, audit files and investor covenant reports from the closed ledger."}]}, {"step": "Keep data secure and integrations under control", "description": "Manage who in the firm, at clients and at partners can see and change what, keep accounting, bank, e-mail and maintenance partner connections certified and monitored, and be able to show the auditor and the investor how the SaaS environment is secured.", "streamsNeeded": [{"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Provides certified integrations, API connections and monitored robot runs with an audit trail."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Controls what each tenant, owner and supplier can see and do in the branded portals."}]}, {"step": "Review, decide and adjust weekly", "description": "Run the weekly management meeting from the dashboard: chase arrears, decide on vacant units and rent levels, prioritise maintenance budgets, review late statements and track the effect next week.", "streamsNeeded": [{"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Provides weekly KPI trends and drill-down to client, entity and unit level."}, {"id": "plan-and-execute-periodic-maintenance", "name": "Plan and Execute Periodic Maintenance", "howItSupports": "Shows maintenance budgets and multi-year plans against actual spend for the meeting's capex decisions."}]}]}], "customerJourneyStories": [{"id": "journey-mdir-1", "name": "From Informant and spreadsheets to one real estate ERP", "linkedJobIds": ["jtbd-mdir-1", "jtbd-mdir-3"], "summary": "The director of a 30-FTE property management and VvE administration firm that has run on Informant since 2004 moves to the platform after the 2025 acquisition: discovering the migration offer through the vendor's letter and a peer, evaluating it on a demo with the firm's own complexes and on the free migration and support-until-2027 terms, running a bounded parallel run on one client portfolio, and renewing on units per FTE.", "stages": [{"stage": "Trigger", "narrative": "The July 2025 announcement that Informant has been acquired lands on the same week as two other signals: the senior administrator who knows every Informant workaround announces retirement, and an institutional client asks for a monthly owner statement and a portal the firm cannot deliver without a weekend of Excel work. The director decides the system, not the people, is the constraint on growth."}, {"stage": "Discovery", "narrative": "The vendor's letter explains the phased migration, that moving to the platform is free of charge and that Informant support continues until 31 December 2027. At a Vastgoedmanagement Nederland meeting the director of a comparable firm describes running letting, technical management, finance and VvE administration in one platform with branded portals, and the reference logos on the vendor site (FIT Vastgoedbeheer, Ruijters, CRMD Vastgoed Management) are firms the director knows."}, {"stage": "Evaluation", "narrative": "The vendor demos with two of the firm's own complexes loaded from the Informant export: a rent run, a fault report turned into a work order, a service charge settlement and the resulting owner statement. The director calls two reference customers, asks the controller to check the accounting and bank integrations and the VAT handling, and compares three years of subscription against the cost of the retiring administrator and the Excel hours. Vendor stability under Vortex, the 8.9 support rating and a written migration plan with a parallel run settle the decision."}, {"stage": "Trial", "narrative": "The trial is a parallel run on one client portfolio of 600 units and four associations: entities, objects, contracts, relations and opening balances are imported, the team runs the next two rent runs and the quarterly VvE contributions in both systems and compares bank reconciliation and owner statements side by side. Two mapping issues in the chart of accounts are fixed within a week and the controller signs off the first period close from the new system."}, {"stage": "Engagement", "narrative": "Within a year every client portfolio and association lives in the platform, the tenant and owner portals carry the firm's brand, the reconciliation and invoice-coding robots run overnight and the weekly management meeting runs from the dashboard. Informant is switched off long before the support deadline and the firm takes on two new mandates without hiring."}, {"stage": "Retention", "narrative": "Renewal is not a discussion: units per FTE are up, owner statements go out on the third working day, and the implementation consultant has become the director's process adviser. The director joins the customer advisory group, adds the API Platform module for the firm's BI tool, and gives the reference call to the next Informant firm considering the switch."}]}, {"id": "journey-mdir-2", "name": "Buying a portfolio and a competitor without buying a back office", "linkedJobIds": ["jtbd-mdir-1", "jtbd-mdir-2"], "summary": "The director of a 60-FTE investment and asset management firm already on the platform uses it as the integration engine for growth: triggered by the acquisition of a 2,000-unit residential portfolio and a small regional manager, discovering the migration tooling and the hyper automation add-on through the account manager and a user day, evaluating them on integration time and headcount avoided, piloting on the acquired portfolio, and expanding the subscription as each acquisition is absorbed.", "stages": [{"stage": "Trigger", "narrative": "The fund the firm manages closes on a 2,000-unit residential portfolio held in six entities, and the same quarter the firm agrees to buy a regional property manager with 25 owner clients and its own legacy package. The board asks how both can be absorbed without doubling the finance and letting teams."}, {"stage": "Discovery", "narrative": "The account manager shows how other tenants used the migration tooling to bring acquired portfolios in as new entities, and at the user day a peer investor describes running rent runs, reconciliation and indexation for a 20,000-unit portfolio with robots. The director learns that the hyper automation and API Platform add-ons are switched on per tenant, not re-implemented."}, {"stage": "Evaluation", "narrative": "The evaluation is about integration time and headcount: how many weeks to import six entities and 2,000 contracts with opening balances, whether the acquired manager's owners can be moved to the owner portal in a quarter, what the robots remove in reconciliation and invoice coding hours, and what the add-on subscription costs against the three administrators the board expected to hire. A reference call with an investor who did the same decides it."}, {"stage": "Trial", "narrative": "The acquired portfolio is imported first: entities, objects, units, contracts and relations from the seller's data room, opening balances from the closing statement, bank connections for each entity. The first rent run goes out on time, the reconciliation robot matches most bank lines overnight and the investor dashboard shows the new portfolio next to the old one within six weeks."}, {"stage": "Engagement", "narrative": "The regional manager's clients follow a quarter later through the same tooling; its owners get the owner portal and its tenants the app, its suppliers the supplier portal. The combined firm runs on one platform, one chart of accounts per entity and one management dashboard, and the finance team is the same size as before the two deals."}, {"stage": "Retention", "narrative": "With the next acquisition already in due diligence, the director treats the platform as part of the buy-and-build plan rather than as an IT cost: the subscription grows with units, the API Platform feeds the fund's BI tool and the director asks the vendor for a German localisation roadmap for the first cross-border portfolio."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-mdir-top", "name": "Revenue per FTE", "description": "Annual management fee and asset management revenue handled per full-time employee of the real estate organisation, the director's headline measure of scaling without headcount.", "unit": "EUR k / FTE / year", "currentValue": "165", "targetValue": "230", "link": "https://dashboard.example.com/real-estate-erp-platform/customers/mdir/kpis/co-mdir-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-mdir-co-mdir-top.png"}, "branches": [{"id": "co-mdir-b1", "name": "Scalable operations", "description": "How many units and associations the organisation administers per person, and at what margin, once re-keying and manual handling are removed.", "currentValue": "58", "icon": "kpi-mdir-co-mdir-b1.png", "children": [{"id": "co-mdir-b1-c1", "name": "Units managed per FTE", "description": "Rental units under management per full-time employee across letting, technical, finance and VvE staff.", "unit": "units / FTE", "currentValue": "310", "targetValue": "450", "icon": "kpi-mdir-co-mdir-b1-c1.png", "children"
