ous maintenance dispatch across Europe", "customerKPI": {"northStar": "Work order turnaround time", "supporting": ["Work order acceptance rate", "Phone calls per work order"]}, "businessKPI": {"northStar": "Supplier portal adoption across client organisations", "revenueStreams": ["AI dispatch and invoice matching agents", "Multi-country supplier portal licences", "Maintenance forecast data products"], "supporting": ["Handling minutes saved per work order", "Completion reports filed in portal share"]}, "milestones": ["Run ticket triage, supplier selection and invoice matching through supervised AI agents for the majority of technical management organisations", "Operate the supplier portal in at least three European countries", "Publish maintenance cost and lifecycle forecasts per installation type as a data product for investors and managers"]}}}, "domain": "Tenants, Owners and Maintenance Partners"}];
    const customer = {"id": "finc", "name": "Real Estate Finance Controller", "description": "Runs the financial administration of a real estate investor, fund or asset manager: a group of ten to a hundred legal entities that each own objects, borrow from banks and invoice rent. Prepares the periodic rent runs and direct debits, reconciles bank statements per entity every day, manages debtors and dunning, processes supplier and maintenance invoices, handles VAT with its mix of exempt residential rent and taxed commercial leases, settles service charges per complex, closes the period, consolidates the entities per fund and produces investor and owner statements for the auditor and the asset manager. Leads a small team of two to six accounting staff and is judged on how fast and how cleanly the period closes.", "icon": "finc.png", "careAbout": ["Every active contract invoiced in the periodic rent run at the right amount, with indexation, service charge advances and VAT treatment applied without manual correction", "Bank statements of every entity matched to invoices and supplier payments the same day, so the debtor and creditor positions are true at any moment", "A dunning process that runs on schedule, treats tenants correctly and hands over to collection with a complete file, without the team chasing individual invoices", "Supplier and maintenance invoices captured, coded, approved and paid within terms and matched to work orders and contracts", "VAT returns per entity, pro-rata calculations and taxed-lease options handled correctly, and the ICP and audit file ready without a rebuild", "A period close per entity and consolidation per fund that finishes in days, with service charge settlements and investor statements produced from the same books"], "winsThem": ["A rent run that generates thousands of invoices and SEPA direct debits per entity from the contracts in minutes, with a pre-run check that flags anomalies", "Bank integration that imports statements automatically and matches the large majority of lines by robot, leaving only true exceptions for the team", "A multi-entity general ledger with intercompany handling, a close checklist per entity and consolidation per fund in one system, connected to the accountant's and auditor's tools", "Hyper automation and AI assistants that code supplier invoices, run the dunning cycle and prepare the VAT return without a person touching each document", "Service charge settlements calculated per complex from the booked costs and distribution keys, with tenant statements and ledger postings produced in one step"], "theirFear": ["A rent run going out with wrong indexation or VAT on a few hundred invoices and the team spending a week on credit notes and tenant calls", "The auditor finding unreconciled bank lines or an intercompany imbalance in the year-end file that pushes the close and the investor statements weeks out", "Service charge settlements missed past the legal deadline for a complex, forfeiting the recovery and triggering tenant disputes"], "jobsToBeDone": [{"id": "jtbd-finc-1", "name": "Invoice and collect every euro of rent on time", "whatItIs": "Turn the active lease contracts of every entity into correct rent invoices each period, collect the money through SEPA direct debit and bank transfer, match every incoming payment to its invoice, and follow up arrears through a structured dunning process that respects tenant rights and hands over to collection when needed. Residential rent is invoiced monthly and largely direct-debited; commercial rent quarterly or monthly with VAT where the lease is opted for taxation.", "outcome": "The rent run per entity goes out on the invoicing date without manual corrections, direct debits are collected on schedule, payments are matched automatically, arrears are visible and acted on by ageing bucket, and the collection rate stays above target with a complete file for every case handed to collection.", "steps": [{"step": "Prepare and check the periodic rent run", "description": "Before the invoicing date, review contract changes since the last run (new leases, terminations, indexations, changed service charge advances, deposit settlements), run the pre-invoicing check per entity for anomalies such as zero amounts, missing VAT codes or overlapping periods, and release the run.", "streamsNeeded": [{"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Builds the periodic rent run per entity from active contracts and runs the pre-invoicing check that flags anomalies before invoices are generated."}, {"id": "manage-leases-through-their-lifecycle", "name": "Manage Leases Through Their Lifecycle", "howItSupports": "Delivers the contract changes with effective dates (indexation, changes, terminations, advances) that the rent run must reflect."}]}, {"step": "Issue invoices and collect through direct debit", "description": "Generate the invoices with the correct VAT treatment per contract, deliver them to tenants by e-mail and the tenant portal, create the SEPA direct debit batch per entity with valid mandates and pre-notifications, submit it to the bank and process rejections and reversals.", "streamsNeeded": [{"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Generates invoices and SEPA direct debit batches per entity, submits them through the bank integration and books rejections and reversals back to the debtor."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Publishes invoices, payment status and mandate details to the tenant portal and app so tenants pay and check without calling."}]}, {"step": "Match incoming payments to invoices every day", "description": "Import bank statements per entity daily, let the matching rules and robot allocate transfers and direct debit collections to open invoices by reference, amount and debtor, handle partial payments, overpayments and payments on the wrong entity, and keep the debtor position true at the end of each day.", "streamsNeeded": [{"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Matches bank lines to open rent invoices automatically per entity and queues the unmatched remainder for manual allocation."}, {"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Runs the daily statement import and matching robot and learns allocation rules from the controller's manual decisions."}]}, {"step": "Run dunning and agree payment arrangements", "description": "Execute the dunning schedule per entity and tenant type (reminder, formal notice, final notice with costs), pause it for tenants with an agreed payment plan or a dispute, register payment arrangements and monitor compliance, and coordinate with the property manager on tenants who need a conversation rather than a letter.", "streamsNeeded": [{"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Runs the configurable dunning schedule, records payment arrangements and disputes, and reports arrears by ageing bucket and dunning stage."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Lets tenants see their arrears, propose a payment plan and pay online, reducing the letters and calls the team handles."}]}, {"step": "Hand over to collection and settle deposits and write-offs", "description": "For tenants that do not respond, compile the collection file (contract, invoices, dunning history, correspondence) for the collection agency or bailiff, follow the case, settle deposits against final invoices at termination, and book write-offs and provisions per entity with the asset manager's approval.", "streamsNeeded": [{"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Assembles the collection file from the debtor history and tracks handed-over cases, recoveries and write-offs per entity."}, {"id": "manage-leases-through-their-lifecycle", "name": "Manage Leases Through Their Lifecycle", "howItSupports": "Settles the deposit against the final invoice and damages at termination and closes the contract's financial position."}, {"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Books provisions and write-offs per entity so the debtor position in the closed period is realistic."}]}]}, {"id": "jtbd-finc-2", "name": "Keep multi-entity books accurate and reconciled every day", "whatItIs": "Maintain the general ledger of every legal entity in the group as a true, reconciled record at any point in the month: entity structure and chart of accounts, supplier and maintenance invoices with approval, bank reconciliation per entity, VAT with exempt and taxed rent, intercompany positions, fixed assets and loans. The books must be ready for the accountant, the auditor and the asset manager without a monthly clean-up.", "outcome": "Every entity's ledger is reconciled with its bank accounts, debtors and creditors at the end of each day, supplier invoices are approved and paid within terms, VAT is filed correctly per entity, intercompany positions balance, and the finance team spends its time on exceptions and analysis rather than on booking and reconciling.", "steps": [{"step": "Maintain the entity structure, chart of accounts and opening balances", "description": "Set up each legal entity with its objects, bank accounts, loans, VAT status and reporting group, apply the group chart of accounts and cost-centre structure per complex, and load opening balances when an entity or portfolio is acquired or migrated from a legacy system.", "streamsNeeded": [{"id": "onboard-portfolio-and-entities", "name": "Onboard Portfolio and Entities", "howItSupports": "Creates entities, bank accounts, chart of accounts mappings and opening balances as part of portfolio onboarding, including migrations from legacy systems."}, {"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Holds the multi-entity ledger, cost centres per complex and the consolidation structure per fund that all postings follow."}]}, {"step": "Capture, code and approve supplier and maintenance invoices", "description": "Receive supplier invoices by e-mail, portal or e-invoicing, let the AI assistant extract and code them to entity, complex, cost account and recoverability, match them to work orders, maintenance contracts or project commitments, route them through the approval workflow and schedule payment within terms.", "streamsNeeded": [{"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Runs accounts payable: invoice capture, coding to entity, complex and account, approval workflow and payment batches per entity."}, {"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Provides the work orders and completion reports that maintenance invoices are matched against before approval."}, {"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Supplies the AI invoice-coding assistant and the inbox robot that turn incoming invoices into coded, matched drafts."}]}, {"step": "Reconcile bank accounts per entity daily", "description": "Import statements for every entity's bank accounts through the bank connectors, match rent receipts, supplier payments, loan instalments, interest and bank costs to the ledger, book the unmatched lines, and confirm at day end that every bank balance equals the ledger balance per entity.", "streamsNeeded": [{"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Imports bank statements per entity through the bank integration and matches receipts and payments to open items."}, {"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Reconciles bank balances to ledger balances per entity and books the remaining lines such as interest, loan instalments and bank costs."}, {"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Runs the daily reconciliation robot and reports the automation rate and the exceptions that need a person."}]}, {"step": "Handle VAT, pro-rata and tax positions per entity", "description": "Apply the right VAT treatment per contract and invoice (exempt residential rent, taxed commercial leases with an opted lease, service charges), calculate the pro-rata deduction on mixed-use entities, prepare and file the VAT return and ICP per entity, and keep the transfer tax, property tax and depreciation positions correct for the accountant.", "streamsNeeded": [{"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Handles VAT coding per contract and invoice, pro-rata calculations, VAT return preparation and tax positions per entity."}, {"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Applies the contract's VAT treatment to every rent and service charge invoice so the VAT return is built from correct source documents."}]}, {"step": "Balance intercompany positions and automate recurring postings", "description": "Book management fees, recharges and loans between entities as matched intercompany pairs, run recurring postings for depreciation, accruals, loan interest and prepayments per entity on schedule, and let robots and integrations with the accountant's software take over repetitive work so the team handles only exceptions.", "streamsNeeded": [{"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Posts intercompany pairs, recurring journals and accruals per entity and checks that intercompany positions balance across the group."}, {"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Schedules the recurring posting robots and connects the ledger to the accountant's and auditor's tools through certified integrations and the API."}]}]}, {"id": "jtbd-finc-3", "name": "Close the period and settle service charges without spreadsheets", "whatItIs": "Close each month, quarter and year per entity and consolidate per fund from the reconciled ledger: run the close checklist, post accruals, prepayments, depreciation and valuation results, settle the annual service charges per complex with tenants within the statutory period, produce investor and owner statements and the audit file, and hand over to the accountant and auditor through integrations rather than exports.", "outcome": "The period closes per entity in days with a documented checklist, consolidation per fund and investor statements come out of the same books, service charge settlements are issued to every tenant before the legal deadline with postings that reconcile to the ledger, and the auditor works from a complete file without a spreadsheet trail.", "steps": [{"step": "Run the period-close checklist per entity", "description": "Work through the close checklist per entity: rent runs complete, bank reconciled, supplier invoices booked, VAT reconciled, intercompany balanced, sub-ledgers tied to the general ledger. Track who completed what, resolve open items and lock the period when the checklist is green.", "streamsNeeded": [{"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Provides the close checklist per entity with status per task, sub-ledger tie-outs and the period lock."}, {"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Runs the tie-out checks and reminder tasks automatically so the controller sees only the entities and items that are not green."}]}, {"step": "Post accruals, depreciation, valuations and loan positions", "description": "Book accruals for costs not yet invoiced, prepayments, depreciation per object, loan interest and repayments, and the valuation results and deferred tax positions per entity, using the valuation records and project data already in the system rather than a separate valuation spreadsheet.", "streamsNeeded": [{"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Posts accruals, depreciation, loan and valuation journals per entity from configured schedules and the valuation and project records."}, {"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Provides the valuation records per object that the revaluation postings and the investor statements rely on."}]}, {"step": "Settle service charges per complex within the legal deadline", "description": "After year end, gather the recoverable costs booked per complex, apply the distribution keys and the contractual and legal rules per tenant, calculate the settlement against the advances paid, issue the statements to tenants and post the receivables or payables and the next year's advances in one run, complex by complex, before the statutory deadline.", "streamsNeeded": [{"id": "manage-leases-through-their-lifecycle", "name": "Manage Leases Through Their Lifecycle", "howItSupports": "Calculates the service charge settlement per complex and contract from booked costs, keys and advances, produces tenant statements and updates the advances."}, {"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Supplies the booked recoverable costs per complex and posts the settlement receivables and payables per entity."}, {"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Invoices or refunds the settlement amounts and collects them through the normal direct debit and dunning cycle."}]}, {"step": "Consolidate per fund and produce investor and owner statements", "description": "Consolidate the entities of each fund with intercompany eliminations, produce the balance sheet, profit and loss and cash flow per entity and fund, generate investor and owner statements with distributions, and publish them to the investor and owner portal for the asset manager and the investors.", "streamsNeeded": [{"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Consolidates entities per fund, eliminates intercompany positions and generates the financial statements and investor statements."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Publishes the statements and distributions to investors and owners in their portal with scoped access per fund."}]}, {"step": "Hand over to the accountant and auditor through integrations", "description": "Give the accountant and auditor access to the closed period, the audit file and the supporting documents through certified integrations with their software and the API, answer sample requests from the document trail, and process the annual accounts adjustments back into the ledger without re-keying.", "streamsNeeded": [{"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Provides the certified accounting integrations, the audit-file export and the API through which the accountant and auditor read the closed period."}, {"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Keeps the document trail from every posting to its invoice, bank line or contract and books the year-end adjustments into the locked period under control."}]}]}], "customerJourneyStories": [{"id": "journey-finc-1", "name": "From a generic accounting package plus spreadsheets to a real estate ledger", "linkedJobIds": ["jtbd-finc-2", "jtbd-finc-3"], "summary": "A finance controller at a Dutch investor with thirty entities and 2,500 units lives through the move from a generic accounting package, a separate rent-roll tool and a folder of spreadsheets to an integrated real estate ERP, from the year-end that took until April to the renewal in which the controller asks for hyper automation.", "stages": [{"stage": "Trigger", "narrative": "The year-end close drags into April: bank lines of six entities are still unreconciled, the service charge settlements of four complexes miss the legal deadline, and the auditor asks for a spreadsheet trail that explains why the rent roll and the ledger differ. The asset manager and the managing director tell the controller that next year the books, the contracts and the rent runs must live in one system."}, {"stage": "Discovery", "narrative": "The controller asks the firm's accountant and peers at a real estate finance network which systems investors of similar size use and hears that investors such as Dunavast and Rockfield run their financial administration on Bloxs. A demo shows rent runs, direct debits, bank reconciliation and a multi-entity ledger in the same database as the contracts, and a call with a controller at a comparable investor confirms that the close no longer needs spreadsheets."}, {"stage": "Evaluation", "narrative": "The controller evaluates the real estate ERP against upgrading the accounting package with a rent-roll module and against a large international property platform. Decisive checks are multi-entity accounting with consolidation per fund, SEPA direct debit and bank connectors for the firm's two banks, VAT handling for mixed exempt and taxed portfolios, service charge settlement under Dutch rules, the certified integration with the accountant's software and the cost and duration of migrating thirty entities with opening balances. The SaaS security documentation satisfies the auditor."}, {"stage": "Trial", "narrative": "One fund with five entities goes first: entities, objects, contracts, bank accounts and opening balances are migrated with the implementation team, and one quarter runs in parallel with the old package. The first rent run and direct debit batch go out from the new system without corrections, the daily bank reconciliation matches most lines automatically, and the quarter closes per entity from a checklist instead of an e-mail thread."}, {"stage": "Engagement", "narrative": "All entities move over before the next year end. The team reconciles every entity daily, supplier invoices flow through the approval workflow, VAT returns come out per entity, and the year-end service charge settlements are calculated per complex from the booked costs and issued before the deadline. The auditor works from the audit file and the document trail, and the close per entity drops from weeks to days."}, {"stage": "Retention", "narrative": "At renewal the controller presents a year end closed in weeks instead of months, settlements issued on time for every complex and a clean audit. The firm adds the API Platform for the accountant's and the bank's connections and asks the vendor about hyper automation for the rent run and reconciliation, and the controller becomes a reference for other finance teams evaluating the platform."}]}, {"id": "journey-finc-2", "name": "Letting robots and AI assistants run the repetitive finance work", "linkedJobIds": ["jtbd-finc-1", "jtbd-finc-2"], "summary": "Having run the books on the ERP for a year, the finance controller adopts hyper automation and AI assistants to take over the rent run, bank reconciliation, invoice coding and dunning, starting with one process and one entity group, and ends up with a finance team that handles exceptions rather than transactions.", "stages": [{"stage": "Trigger", "narrative": "The firm acquires a portfolio that adds twelve entities and 900 units, and the managing director declines to add finance headcount. The controller counts the hours per month spent on statement matching, invoice coding and dunning letters and concludes that the team cannot absorb the growth by working the same way."}, {"stage": "Discovery", "narrative": "During the account review the vendor's customer success manager shows the hyper automation foundation of the platform: robots that run the rent run, import and match bank statements and execute the dunning cycle, and an AI assistant that codes supplier invoices from the inbox. A published customer testimonial about fully automated repetitive financial processes and a session with a controller already running the robots make the model concrete."}, {"stage": "Evaluation", "narrative": "The controller and the auditor check how the robots log every action, how matching rules and coding suggestions are reviewed and corrected, what happens when a bank connection fails, how approvals stay with a person, and how the automation rate is reported per entity. The controller compares the module price with the headcount the acquired portfolio would otherwise require and confirms the data stays within the SaaS security terms."}, {"stage": "Trial", "narrative": "Bank reconciliation for one fund runs by robot for two months while the team reviews the results daily. The automated matching rate climbs as the rules learn from corrections, unmatched lines at day end fall to a handful, and the acquired entities are onboarded with the robot running from day one."}, {"stage": "Engagement", "narrative": "Robots take over the rent run checks, direct debit batches, statement matching and the dunning schedule for all entities, the AI assistant codes the bulk of supplier invoices for approval, and the VAT return is prepared automatically per entity. The finance team's day starts with the exception queue and the automation dashboard, and the acquired portfolio is absorbed without a new hire."}, {"stage": "Retention", "narrative": "At renewal the controller reports the same team closing more entities faster, with a higher collection rate and fewer manual journals, and asks the vendor for the next agents: automated period-close tie-outs and AI-drafted settlement explanations for tenants. The firm's automation rate becomes a figure in the vendor's next customer story."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-finc-top", "name": "Days to close the period", "description": "Working days from the last day of the month or quarter until every entity is closed, consolidated per fund and the figures are released to the asset manager. Modeled seed value for a mid-sized Dutch investor, not an official Bloxs or customer figure.", "unit": "working days", "currentValue": "12", "targetValue": "5", "link": "https://dashboard.example.com/real-estate-erp-platform/customers/finc/kpis/co-finc-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-finc-co-finc-top.png"}, "branches": [{"id": "co-finc-b1", "name": "Cash collection and reconciliation", "description": "How completely rent is collected and how much of the daily bank and debtor work runs without a person touching each line.", "currentValue": "70", "icon": "kpi-finc-co-finc-b1.png", "children": [{"id": "co-finc-b1-c1", "name": "Rent collection rate", "description": "Rent and service charge advances collected within 30 days of the invoice date as a share of the amount invoiced in the period.", "unit": "%", "currentValue": "96.8", "targetValue": "98.5", "icon": "kpi-finc-co-finc-b1-c1.png", "children": [{"id": "co-finc-b1-c1-l1", "name": "Direct debit share of rent invoiced", "description": "Share of invoiced rent collected through SEPA direct debit with a valid mandate rather than by transfer.", "unit": "%", "currentValue": "71", "targetValue": "85", "icon": "kpi-finc-co-finc-b1-c1-l1.png", "children": []}, {"id": "co-finc-b1-c1-l2", "name": "Arrea businessKPI": {"northStar": "Finance module adoption", "revenueStreams": ["Multi-country Real Estate ERP subscriptions", "Autonomous finance agent add-ons", "Continuous audit and assurance data products"], "supporting": ["AI invoice coding acceptance rate", "Finance tenant churn rate"]}, "milestones": ["Deploy a finance agent that runs the rent run, reconciliation, dunning and VAT preparation end to end per entity with exception-only human review", "Provide auditors and accountants a continuous audit trail and assurance dashboard through the API instead of a year-end file", "Operate multi-entity real estate accounting in the Netherlands, Germany and a third European market on one tenant with local rules per entity"]}}}, "domain": "Real Estate Investors and Asset Managers"};

    const customerInsights = [{"id": "rep-01", "title": "The integrated object-contract-money-maintenance record is the asset a buy-and-build strategy compounds on", "summary": "Vortex Capital Partners became majority shareholder of Bloxs in a buyout announced on 28 October 2024, alongside management and other investors; Bloxs (Utrecht, founded 2015, 35 employees, customers in the Netherlands and Germany including Rockfield, Urban Interest and Burgstate) sells one SaaS system for relationship, building, contract, technical and financial management with API connections to reporting and BI tools. Vortex reports more than \u20ac4 billion of annual rent invoiced and more than 500,000 rented properties on the platform, and the thesis is to expand functionality and market position through Dutch and international buy-and-build acquisitions.", "implication": "Judge every acquisition and roadmap item by whether it deepens the shared object, unit, contract, invoice, bank line and ticket model that portals, robots, AI and investor reporting reuse; a bolt-on product that keeps its own data model adds support cost without adding platform value.", "priority": "high", "tags": ["platform", "data-model", "buy-and-build"], "sources": [{"id": "vortex-bloxs-news", "title": "Real estate software specialist Bloxs accelerates growth with support from Vortex", "url": "https://vortexcp.com/news/real-estate-software-specialist-bloxs-accelerates-growth-with-support-from-vortex/", "publisher": "Vortex Capital Partners", "date": "2024-10-28"}, {"id": "vortex-bloxs-investment", "title": "Bloxs \u2014 Vortex investment page", "url": "https://vortexcp.com/investment/bloxs/", "publisher": "Vortex Capital Partners", "date": "2026-09-04"}], "link": {"customerId": "finc", "jobIds": ["jtbd-finc-2"], "kpiIds": ["co-finc-top"]}}, {"id": "rep-03", "title": "Annual rent indexation is a government-set, sector-specific calculation that changes every year", "summary": "For 2026 the Dutch government capped rent increases at 4.1% in the social sector (from 1 July 2026, the three-year average inflation of 3.6% plus 0.5 percentage point, with fixed \u20ac25, \u20ac50 or \u20ac100 amounts for low rents and higher incomes), 6.1% in the regulated mid-rent sector (from 1 January 2026, CAO wage growth of 5.1% plus 1 point) and 4.4% in the free sector (from 1 January 2026, the lower of inflation 3.4% and wage growth plus 1 point); a rent may be raised once a year and never above the contractual or points-based maximum. CBS measured actual rents 4.9% higher in July 2025 than a year earlier (5.1% at housing corporations, 4.7% at other social landlords, 4.4% in the free sector; about 4.1% excluding tenant changes), after the 5.4% of July 2024 that was the largest increase in more than 30 years.", "implication": "Model indexation as a rules engine keyed on sector, contract start date, points ceiling, income class and the yearly government percentages, with letter generation and tenant-portal explanation built in; every mis-indexed contract is both lost income and a Huurcommissie dispute.", "priority": "high", "tags": ["indexation", "regulation", "rent"], "sources": [{"id": "rijksoverheid-huurverhoging-2026", "title": "Maximale huurverhoging 2026 in sociale sector 4,1%, middenhuur 6,1% en vrije sector 4,4%", "url": "https://www.rijksoverheid.nl/actueel/nieuws/2025/12/15/maximale-huurverhoging-2026-in-sociale-sector-41-middenhuur-61-en-vrije-sector-44", "publisher": "Rijksoverheid", "date": "2025-12-15"}, {"id": "cbs-huren-2025", "title": "Huren stijgen met 4,9 procent", "url": "https://www.cbs.nl/nl-nl/nieuws/2025/36/huren-stijgen-met-4-9-procent", "publisher": "CBS (Statistics Netherlands)", "date": "2025-09-05"}], "link": {"customerId": "finc", "jobIds": ["jtbd-finc-1"], "kpiIds": ["co-finc-top"]}}, {"id": "rep-05", "title": "Good-landlordship rules turn deposits, contracts, service charges and tenant selection into audited obligations", "summary": "The Wet goed verhuurderschap applies since 1 July 2023: deposits are capped at two months' bare rent and must be refunded within 14 days with deductions limited to arrears, service costs, damage and energy-performance fees; every tenancy needs a written contract; landlords must inform tenants in writing about rights, deposit terms, contact details, service-cost breakdown and the municipal complaints procedure; service charges may only recover actual costs with a mandatory annual statement; discrimination and intimidation are prohibited; since 1 January 2024 a written, transparent selection procedure is required and every municipality runs a reporting point, with administrative fines for violations.", "implication": "Build deposit ledgers with refund deadlines, contract and information-letter generation, itemised annual service-charge statements and a logged candidate-selection trail as standard workflow, so a manager can prove compliance per tenancy to owners and municipalities.", "priority": "high", "tags": ["regulation", "tenancy", "service-charges"], "sources": [{"id": "vhn-goed-verhuurderschap", "title": "Landelijke regels van goed verhuurderschap", "url": "https://www.volkshuisvestingnederland.nl/onderwerpen/huren-en-wonen/wet-goed-verhuurderschap/landelijke-regels-van-goed-verhuurderschap", "publisher": "Ministerie van Volkshuisvesting en Ruimtelijke Ordening", "date": "2026-09-04"}], "link": {"customerId": "finc", "jobIds": ["jtbd-finc-3"], "kpiIds": ["co-finc-top"]}}, {"id": "rep-07", "title": "Licensed open-banking feeds plus AI matching move rent reconciliation from month-end to continuous", "summary": "Under PSD2, a regulated provider may access a payment account with the account holder's explicit consent; account information services (service 8) and payment initiation (service 7) are licensed and registered by De Nederlandsche Bank, and all Dutch banks expose the Berlin Group NextGenPSD2 API. Bloxs' certified Yapily Connect integration retrieves bank transactions automatically up to three times a day, and on 6 November 2025 Bloxs launched ClearMatch, an AI reconciliation tool tested for months with large customers that matches incoming payments to contracts, relations and objects, learns from manual corrections and runs continuously in the background rather than only at period end.", "implication": "Measure automated bank reconciliation rate and days to close as the finance north star and treat the bank connector, matching model and dunning as one collection loop; every unmatched payment is a tenant call and a delayed owner statement.", "priority": "high", "tags": ["banking", "reconciliation", "ai"], "sources": [{"id": "betaalvereniging-open-banking", "title": "Open Banking \u2014 Dutch Payments Association knowledge base", "url": "https://www.betaalvereniging.nl/en/knowledge-base/european-legislation/open-banking/", "publisher": "Betaalvereniging Nederland", "date": "2026-09-04"}, {"id": "bloxs-koppelingen", "title": "Ontdek onze gecertificeerde koppelpartners", "url": "https://www.bloxs.com/gecertificeerde-koppelingen/", "publisher": "Bloxs", "date": "2026-09-04"}, {"id": "bloxs-clearmatch", "title": "Bloxs lanceert ClearMatch: AI-aflettertool voor vastgoedbeheer", "url": "https://www.bloxs.com/bloxs-lanceert-clearmatch/", "publisher": "Bloxs", "date": "2025-11-06"}], "link": {"customerId": "finc", "jobIds": ["jtbd-finc-1", "jtbd-finc-2"], "kpiIds": ["co-finc-top", "bo-finc-top"]}}, {"id": "rep-08", "title": "Structured e-invoicing over Peppol becomes mandatory for B2B by 2030, so supplier invoices and rent invoices must be machine-readable", "summary": "Peppol is the international standard for e-invoicing and e-ordering that the Dutch central government already uses, with e-invoicing mandatory for certain transactions with the Rijksoverheid. On 10 March 2026 the Ministry of Finance sent Parliament an analysis of ViDA implementation that recommends a decentralised Peppol-based model with EN16931 invoices and near-real-time digital reporting, covering domestic as well as cross-border B2B; the proposed timeline is domestic B2B e-invoicing from 1 January 2030, the EU ViDA cross-border obligation from 1 July 2030 and domestic digital reporting around 2032, with draft legislation planned for consultation at the end of 2026.", "implication": "Design accounts payable, rent invoicing and the supplier portal around structured invoices now (Peppol delivery, EN16931 fields, automatic work-order matching), so that the 2030 obligation becomes a switch rather than a rebuild for hundreds of tenant organisations.", "priority": "medium", "tags": ["e-invoicing", "peppol", "regulation"], "sources": [{"id": "rvo-peppol", "title": "Peppol: wereldwijd snel, makkelijk en veilig digitaal zakendoen", "url": "https://www.rvo.nl/onderwerpen/digitaliseren-en-e-commerce/peppol", "publisher": "RVO (Netherlands Enterprise Agency)", "date": "2026-09-04"}, {"id": "kpmg-vida-nl", "title": "Netherlands: Proposed e-invoicing and digital reporting framework under ViDA", "url": "https://kpmg.com/us/en/taxnewsflash/news/2026/05/tnf-netherlands-proposed-e-invoicing-and-digital-reporting-framework-under-vida.html", "publisher": "KPMG", "date": "2026-05-01"}], "link": {"customerId": "finc", "jobIds": ["jtbd-finc-2", "jtbd-finc-3"], "kpiIds": ["co-finc-top"]}}, {"id": "rep-11", "title": "Germany is a live second market whose Betriebskosten and Mietspiegel rules must be native, not configured around", "summary": "On 10 April 2025 Bloxs announced RDB Real Estate, a German company managing about 1,000 residential units, live on its accounting, CRM, buildings, technical management, contracts, files and reporting modules, with the platform adapted to German processes and regulation and German-language features planned. German tenancy law sets hard deadlines: under \u00a7 556 BGB the landlord must issue the annual operating-cost settlement within twelve months after the end of the settlement period or lose the right to a supplementary claim, and the tenant has twelve months after receipt to object. The Mietspiegelreformgesetz in force since 1 July 2022 obliges municipalities above 50,000 inhabitants to publish a rent index (simple by 1 January 2023, qualified by 1 January 2024) and obliges owners and tenants to supply dwelling data on request.", "implication": "Treat country localisation as a product line (German chart of accounts and VAT, Betriebskostenabrechnung with deadline tracking, Mietspiegel-based rent adjustment, bilingual documents) with its own KPIs, because the year-3 German foothold depends on settlement and indexation being as automated as the Dutch flows.", "priority": "medium", "tags": ["germany", "localisation", "service-charges"], "sources": [{"id": "bloxs-rdb", "title": "Bloxs Software breidt succes uit in Duitsland met RDB Real Estate", "url": "https://www.bloxs.com/succesvolle-uitbreiding-in-duitsland-voor-bloxs-software-met-rdb-real-estate/", "publisher": "Bloxs", "date": "2025-04-10"}, {"id": "bgb-556", "title": "\u00a7 556 BGB \u2014 Vereinbarungen \u00fcber Betriebskosten", "url": "https://www.gesetze-im-internet.de/bgb/__556.html", "publisher": "Bundesministerium der Justiz", "date": "2026-09-04"}, {"id": "hausundgrund-mietspiegel", "title": "Reform des Mietspiegelrechts in Kraft", "url": "https://www.hausundgrund.de/srv/bhz/reform-des-mietspiegelrechts-kraft", "publisher": "Haus & Grund Deutschland", "date": "2022-07-01"}], "link": {"customerId": "finc", "jobIds": ["jtbd-finc-3"], "kpiIds": ["co-finc-top"]}}, {"id": "rep-12", "title": "A 35-person vendor and its 5\u2013200 FTE customers both scale only through hyper automation of the back office", "summary": "Bloxs publishes 5,000+ users, 450,000+ rental units, \u20ac4 billion of annual rent invoiced, \u20ac70 billion of property value managed and an 8.9/10 support rating; Capterra describes more than 250 real estate organisations managing from 50 up to thousands of residential and logistics units. Customer CRMD Vastgoed Management runs commercial portfolios with staff at the office only one or two days a week and credits automation and AI with removing manual errors and executing tasks at the right moment, reporting that vacancy in newly acquired complexes fell from 30% to below 5% within six to twelve months. On 1 May 2025 Andr\u00e9 Proost (ex CompuGroup Medical and Centric) became CEO, stating that real estate is digitalising rapidly and Bloxs is well positioned to lead, while founder Dennis Gubbels stays as board member, shareholder and M&A director.", "implication": "Instrument robot and AI-assistant adoption (rent runs, invoice coding, indexation letters, ticket triage) as leading indicators of units per FTE and revenue per FTE for both the vendor and its tenants; professionalising sales, onboarding and support under the new CEO is what turns automation into retained, expanding subscriptions.", "priority": "high", "tags": ["automation", "scale", "organisation"], "sources": [{"id": "bloxs-home", "title": "Bloxs \u2014 Grip op vastgoed", "url": "https://www.bloxs.com/", "publisher": "Bloxs", "date": "2026-09-04"}, {"id": "capterra-bloxs", "title": "Bloxs software pricing, alternatives and more", "url": "https://www.capterra.com/p/208063/Bloxs/", "publisher": "Capterra", "date": "2026-09-04"}, {"id": "bloxs-crmd", "title": "Dankzij hyper automation kan CRMD commercieel vastgoed laten floreren", "url": "https://www.bloxs.com/dankzij-hyper-automation-kan-crmd-commercieel-vastgoed-laten-floreren/", "publisher": "Bloxs", "date": "2026-09-04"}, {"id": "vortex-proost", "title": "Real estate software specialist Bloxs appoints Andr\u00e9 Proost to lead next growth phase", "url": "https://vortexcp.com/news/real-estate-software-specialist-bloxs-appoints-andre-proost-to-lead-next-growth-phase/", "publisher": "Vortex Capital Partners", "date": "2025-05-01"}], "link": {"customerId": "finc", "jobIds": ["jtbd-finc-2"], "kpiIds": ["co-finc-top", "bo-finc-top"]}}];

        return (jobIds || []).map(jobId => jobLookup[jobId] || jobId);
    }

    function kpiNamesForLink(link) {
        // Prefer stable KPI IDs resolved against this customer's KPI pyramid; fall back to legacy display-name kpis.
        if (link && link.kpiIds && link.kpiIds.length) {
            const lookup = {};
            function walk(node) {
                if (!node) return;
                if (node.id) {
                    lookup[node.id] = node.name || node.id;
                }
                (node.branches || []).forEach(walk);
                (node.children || []).forEach(walk);
            }
            const pyramids = (customer || {}).kpiPyramids || {};
            ['customerOutcomes', 'businessOutcomes'].forEach(key => {
                const pyramid = pyramids[key];
                if (!pyramid) return;
                walk(pyramid.top);
                (pyramid.branches || []).forEach(walk);
            });
            return link.kpiIds.map(kpiId => lookup[kpiId] || kpiId);
        }
        return (link && link.kpis) || [];
    }

    function normalizeRoadmapKpi(value, supportingKey) {
        if (!value) {
            return {northStar: '', [supportingKey]: []};
        }
        if (typeof value === 'string') {
            return {northStar: value, [supportingKey]: []};
        }
        const normalized = Object.assign({}, value);
        normalized.northStar = normalized.northStar || normalized.name || '';
        normalized[supportingKey] = normalized[supportingKey] || [];
        return normalized;
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function formatDate(dateValue) {
        if (!dateValue) return 'No date';
        const date = new Date(dateValue + 'T00:00:00');
        if (isNaN(date.getTime())) return dateValue;
        return date.toLocaleDateString('en-GB', {year: 'numeric', month: 'short', day: 'numeric'});
    }

    function renderKpis(items) {
        let html = '';
        items.forEach(item => {
            html += '<div><b>' + escapeHtml(item.kpi) + '</b>';
            if (item.unit) {
                html += ' <span class="activity-muted">(' + escapeHtml(item.unit) + ')</span>';
            }
            if (item.expectedImpact) {
                html += ': ' + escapeHtml(item.expectedImpact);
            }
            if (item.currentValue) {
                html += '<div class="activity-muted"><b>Current:</b> ' + escapeHtml(String(item.currentValue)) + '</div>';
            }
            if (item.description) {
                html += '<div class="activity-muted">' + escapeHtml(item.description) + '</div>';
            }
            if (item.link) {
                html += '<div class="activity-muted"><a target="_blank" rel="noopener noreferrer" href="' + escapeHtml(item.link) + '">' + escapeHtml(item.linkLabel || 'Open link') + '</a></div>';
            }
            html += '</div>';
        });
        return html;
    }

    function renderImpactCell(item, currentCustomerId) {
        let html = '';
        (item.customerImpact || []).forEach(impact => {
            const isCurrent = impact.customerId === currentCustomerId;
            html += '<div class="activity-block' + (isCurrent ? ' activity-pill-highlight' : '') + '">';
            html += '<div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">';
            html += '<img class="activity-icon activity-icon-round" src="../icons/' + escapeHtml(impact.customer.icon) + '" onerror="this.onerror=null;this.src=\'../icons/customer.png\'">';
            html += '<div><div style="font-weight:bold; color:' + (isCurrent ? '#1d4ed8' : '#111827') + '">' + escapeHtml(impact.customer.name) + ' <span class="activity-muted">(' + escapeHtml(impact.customerId) + ')</span></div></div>';
            html += '</div>';
            html += renderKpis(impact.customerKPIs || []);
            html += renderKpis(impact.businessKPIs || []);
            html += '</div>';
        });
        return html || '<span class="activity-muted">No customer impact listed</span>';
    }

    function renderBrickCell(item) {
        let html = '';
        (item.productBricks || []).forEach(brick => {
            html += '<div class="activity-pill">';
            html += '<img class="activity-icon" src="../../product-bricks/icons/' + escapeHtml(brick.brick.icon) + '" onerror="this.onerror=null;this.src=\'../../product-bricks/icons/logo.png\'">';
            html += '<div><div><b>' + escapeHtml(brick.brick.name) + '</b> <span class="activity-muted">(#' + escapeHtml(brick.brickId) + ')</span></div><div class="activity-muted">' + escapeHtml(brick.change) + '</div></div>';
            html += '</div>';
        });
        return html || '<span class="activity-muted">No product bricks listed</span>';
    }

    function renderChannelCell(item) {
        let html = '';
        (item.deliveryChannels || []).forEach(channel => {
            html += '<div class="activity-pill">';
            html += '<img class="activity-icon" src="../../product-deployments/icons/' + escapeHtml(channel.channel.icon) + '" onerror="this.onerror=null;this.src=\'../../product-deployments/icons/product.png\'">';
            html += '<div><div><b>' + escapeHtml(channel.channel.name) + '</b> <span class="activity-muted">(' + escapeHtml(channel.channelId) + ')</span></div><div class="activity-muted">' + escapeHtml(channel.change) + '</div></div>';
            html += '</div>';
        });
        return html || '<span class="activity-muted">No delivery channels listed</span>';
    }

    function renderActivityTable(data, kind, currentCustomerId) {
        const items = (data && data.items) ? data.items : [];
        let html = '';
        html += '<div class="activity-summary">';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.length + '</div><div class="activity-stat-label">' + kind + '</div></div>';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.filter(item => (item.customerImpact || []).length > 0).length + '</div><div class="activity-stat-label">With customer impact</div></div>';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.filter(item => (item.productBricks || []).length > 0).length + '</div><div class="activity-stat-label">With bricks</div></div>';
        html += '</div>';

        if (!items.length) {
            html += '<div class="group" style="margin-top:0">No related ' + kind.toLowerCase() + ' found for this customer.</div>';
            return html;
        }

        html += '<table class="activity-table">';
        html += '<tr><th>Date</th><th>Description</th><th>Customer Impact</th><th>Product Bricks</th><th>Delivery Channels</th></tr>';
        items.forEach(item => {
            html += '<tr>';
            html += '<td style="white-space:nowrap">' + escapeHtml(formatDate(item.date)) + '</td>';
            html += '<td><a class="activity-link" target="_blank" rel="noopener noreferrer" href="../../' + kind.toLowerCase() + '/landing_pages/' + item.landingPageIndex + '.html">' + escapeHtml(item.description || item.name || kind) + '</a></td>';
            html += '<td>' + renderImpactCell(item, currentCustomerId) + '</td>';
            html += '<td>' + renderBrickCell(item) + '</td>';
            html += '<td>' + renderChannelCell(item) + '</td>';
            html += '</tr>';
        });
        html += '</table>';
        return html;
    }

    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
