nts per entity", "description": "Number of journal entries booked into a period after it was closed and released, per entity per quarter.", "unit": "adjustments per entity", "currentValue": "5", "targetValue": "1", "icon": "kpi-finc-co-finc-b2-c2-l2.png", "children": []}]}]}]}, "businessOutcomes": {"top": {"id": "bo-finc-top", "name": "Automated finance transaction share", "description": "Share of financial transactions on the platform (rent invoices, direct debits, bank lines, supplier invoices, dunning actions, recurring postings) processed by robots, rules and AI assistants without a person touching the document. Modeled seed value across all tenants.", "unit": "%", "currentValue": "58", "targetValue": "85", "link": "https://dashboard.example.com/real-estate-erp-platform/customers/finc/kpis/bo-finc-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-finc-bo-finc-top.png"}, "branches": [{"id": "bo-finc-b1", "name": "Finance module adoption", "description": "How many tenants run their real estate accounting natively on the platform and how deeply they use bank integration and hyper automation.", "currentValue": "62", "icon": "kpi-finc-bo-finc-b1.png", "children": [{"id": "bo-finc-b1-c1", "name": "Financial module attach rate", "description": "Share of tenants that run rent invoicing, bank reconciliation and the general ledger on the platform rather than exporting to an external accounting package.", "unit": "%", "currentValue": "66", "targetValue": "85", "icon": "kpi-finc-bo-finc-b1-c1.png", "children": [{"id": "bo-finc-b1-c1-l1", "name": "Bank connector activation rate", "description": "Share of financial-module tenants with at least one bank connection importing statements automatically.", "unit": "%", "currentValue": "72", "targetValue": "95", "icon": "kpi-finc-bo-finc-b1-c1-l1.png", "children": []}, {"id": "bo-finc-b1-c1-l2", "name": "Entities administered per finance tenant", "description": "Average number of legal entities whose ledger is kept on the platform per financial-module tenant.", "unit": "entities per tenant", "currentValue": "14", "targetValue": "22", "icon": "kpi-finc-bo-finc-b1-c1-l2.png", "children": []}]}, {"id": "bo-finc-b1-c2", "name": "Hyper automation attach rate", "description": "Share of financial-module tenants that have at least one finance robot (rent run, reconciliation, dunning, invoice coding) active in production.", "unit": "%", "currentValue": "41", "targetValue": "80", "icon": "kpi-finc-bo-finc-b1-c2.png", "children": [{"id": "bo-finc-b1-c2-l1", "name": "Robot job runs per finance tenant per month", "description": "Average number of scheduled automation jobs executed per financial-module tenant per month.", "unit": "runs per tenant", "currentValue": "180", "targetValue": "600", "icon": "kpi-finc-bo-finc-b1-c2-l1.png", "children": []}, {"id": "bo-finc-b1-c2-l2", "name": "AI invoice coding acceptance rate", "description": "Share of AI-proposed supplier invoice codings across all tenants accepted by the finance user without change.", "unit": "%", "currentValue": "68", "targetValue": "92", "icon": "kpi-finc-bo-finc-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-finc-b2", "name": "Finance segment economics", "description": "What the financial module, automation and integration add-ons earn per tenant and how efficiently the vendor supports finance users.", "currentValue": "55", "icon": "kpi-finc-bo-finc-b2.png", "children": [{"id": "bo-finc-b2-c1", "name": "Finance add-on revenue per tenant", "description": "Annual recurring revenue per financial-module tenant from hyper automation, API Platform, bank and accounting integration add-ons.", "unit": "EUR k per tenant per year", "currentValue": "9.5", "targetValue": "18", "icon": "kpi-finc-bo-finc-b2-c1.png", "children": [{"id": "bo-finc-b2-c1-l1", "name": "API Platform attach rate for finance tenants", "description": "Share of financial-module tenants that license the API Platform add-on for accountant, bank or BI connections.", "unit": "%", "currentValue": "29", "targetValue": "60", "icon": "kpi-finc-bo-finc-b2-c1-l1.png", "children": []}, {"id": "bo-finc-b2-c1-l2", "name": "Implementation hours per finance go-live", "description": "Vendor implementation and migration hours consumed per tenant to bring the financial module live, including opening balances.", "unit": "hours", "currentValue": "220", "targetValue": "120", "icon": "kpi-finc-bo-finc-b2-c1-l2.png", "children": []}]}, {"id": "bo-finc-b2-c2", "name": "Finance support ticket rate", "description": "Support tickets raised by finance users per financial-module tenant per month, a driver of the unlimited-support cost and of the support rating.", "unit": "tickets per tenant per month", "currentValue": "6.5", "targetValue": "3.0", "icon": "kpi-finc-bo-finc-b2-c2.png", "children": [{"id": "bo-finc-b2-c2-l1", "name": "Period-close support tickets per tenant", "description": "Support tickets per financial-module tenant in the first ten working days of a month or quarter, when close problems surface.", "unit": "tickets per tenant", "currentValue": "2.8", "targetValue": "1.0", "icon": "kpi-finc-bo-finc-b2-c2-l1.png", "children": []}, {"id": "bo-finc-b2-c2-l2", "name": "Finance tenant churn rate", "description": "Share of financial-module tenants that leave the platform or move their accounting to an external package per year.", "unit": "%", "currentValue": "3", "targetValue": "1.5", "icon": "kpi-finc-bo-finc-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make the platform the real estate accounting system in which rent runs, bank lines, supplier invoices, VAT and service charges of every entity are processed by robots and AI under the controller's supervision, so the period closes in days and the finance team grows with exceptions, not with transactions.", "timeHorizons": {"year1": {"focus": "Make the native financial module the default for every tenant, including migrated Informant customers: reliable rent runs and SEPA direct debit per entity, bank connectors with high automatic matching, a close checklist per entity and service charge settlement that meets the legal deadline.", "productTheme": "Every entity reconciled daily, closed in days", "customerKPI": {"northStar": "Days to close the period", "supporting": ["Rent collection rate", "Automated bank reconciliation rate"]}, "businessKPI": {"northStar": "Automated finance transaction share", "revenueStreams": ["Real Estate ERP Core financial module subscriptions", "Hyper automation add-ons", "Implementation and data migration services"], "supporting": ["Financial module attach rate", "Bank connector activation rate"]}, "milestones": ["Deliver the daily bank reconciliation robot with learning matching rules for every bank connector and report the automation rate per entity", "Ship the period-close checklist per entity with automatic sub-ledger tie-outs and a period lock", "Migrate the financial administrations of the first Informant customers with opening balances through the migration tooling"]}, "year3": {"focus": "Extend the real estate ledger to German entities (VAT, Betriebskosten, local accounting rules), make certified accountant, bank and BI integrations a marketplace, and push invoice coding, dunning and VAT preparation to AI assistants with human approval.", "productTheme": "Automated multi-country real estate accounting", "customerKPI": {"northStar": "Days to close the period", "supporting": ["Supplier invoice processing time", "Service charge settlement cycle time"]}, "businessKPI": {"northStar": "Automated finance transaction share", "revenueStreams": ["Modular Real Estate ERP subscriptions", "API Platform and certified integration fees", "AI assistant add-ons"], "supporting": ["Hyper automation attach rate", "Finance add-on revenue per tenant"]}, "milestones": ["Launch German ledger localisation with VAT, Betriebskosten settlement and local statutory reports on the same multi-entity tenant", "Open the certified integration marketplace with accountant, bank, e-invoicing and Power BI connectors managed through the API Platform", "Make AI invoice coding and automated dunning standard for every financial-module tenant with an approval workflow and full audit log"]}, "year5": {"focus": "Run routine real estate accounting autonomously: agents that execute the rent run, reconcile, code, dun, prepare VAT and tie out the close across countries, with the controller supervising exceptions and the auditor reading a continuous audit trail.", "productTheme": "Autonomous administration under the controller's supervision", "customerKPI": {"northStar": "Days to close the period", "supporting": ["Manual journal entries per entity per month", "Post-close adjustments per entity"]}, "businessKPI": {"northStar": "Finance module adoption", "revenueStreams": ["Multi-country Real Estate ERP subscriptions", "Autonomous finance agent add-ons", "Continuous audit and assurance data products"], "supporting": ["AI invoice coding acceptance rate", "Finance tenant churn rate"]}, "milestones": ["Deploy a finance agent that runs the rent run, reconciliation, dunning and VAT preparation end to end per entity with exception-only human review", "Provide auditors and accountants a continuous audit trail and assurance dashboard through the API instead of a year-end file", "Operate multi-entity real estate accounting in the Netherlands, Germany and a third European market on one tenant with local rules per entity"]}}}, "domain": "Real Estate Investors and Asset Managers"}, {"id": "prpm", "name": "Property Manager", "description": "Manages leases and tenant relations on behalf of owner clients at a Dutch property management firm: lets vacant units, screens candidates and checks the rent price against the points system, creates and e-signs contracts, runs the annual indexation, processes changes and terminations, settles deposits and service charges, and sends owners their periodic statements. Typical employer: a firm such as FIT Vastgoedbeheer, Ruijters or CRMD Vastgoed Management, or one of the property managers from the Informant base, administering a few hundred to several thousand residential and commercial units for dozens of private owners, family offices and small investors, with a lettings and administration team of two to fifteen people.", "icon": "prpm.png", "careAbout": ["Every vacant unit re-let within weeks, to a candidate whose income, identity and rental history were checked and documented before the contract was drafted", "A rent price that is demonstrably within the legal maximum for regulated and mid-rent units, with the points calculation and rent-price check stored on the contract", "One lease record that drives the contract text, the rent invoice, the indexation letter, the service charge advance and the deposit, so a change is made once and lands everywhere", "Indexation, terminations, deposit returns and service charge settlements executed on the legal deadlines without a colleague remembering them", "Owners who see their statements, payouts and documents without calling, and who approve a repair or a new tenant in a day rather than a week", "Units administered per employee growing when a new owner mandate arrives, instead of a vacancy in the team"], "winsThem": ["A letting pipeline from termination notice to signed contract, with viewings, candidate screening, the Huurprijscheck rent-price check and e-signing as steps in the system rather than emails and PDFs", "Lease contracts generated from the unit and candidate data, signed digitally, and immediately visible to finance for the first rent run and the deposit", "An indexation run that calculates the permitted increase per contract type, produces the letters and updates the invoices in one supervised batch", "Automatic deposit settlement and service charge settlement per unit, with the tenant's final statement produced from the ledger", "An owner portal and automatic quarterly statements that end the monthly ritual of exporting, formatting and emailing reports per owner"], "theirFear": ["A tenant taking the firm to the Huurcommissie because the rent exceeded the points-based maximum, with the owner learning about it from the ruling", "An indexation letter sent late or with the wrong percentage, so a whole year of rent increase is lost across dozens of contracts", "A deposit returned late, a service charge settled twice or an owner paid the wrong amount, discovered only when the owner's accountant asks for the underlying documents"], "jobsToBeDone": [{"id": "jtbd-prpm-1", "name": "Fill a vacant unit with the right tenant fast and compliantly", "whatItIs": "From the moment a tenant gives notice until a new tenant has signed, paid the deposit and received the keys: prepare the unit, publish the listing, organise viewings, screen candidates against income and identity requirements, set a rent price that is within the legal maximum, generate the lease contract, sign it digitally and hand over the unit with a documented inspection report.", "outcome": "Each vacancy is filled within weeks rather than months by a screened tenant, at a rent that is documented as compliant, with a signed contract and a paid deposit before the keys change hands, and every step traceable for the owner and for a rent tribunal.", "steps": [{"step": "Register the termination and prepare the unit for re-letting", "description": "Record the tenant's notice against the contract, calculate the end date and the notice period, plan the pre-inspection and final inspection, and raise the small repairs and cleaning needed before viewings can start. Decide with the owner whether the unit is re-let at the same rent, renovated first or upgraded to a higher points class.", "streamsNeeded": [{"id": "manage-leases-through-their-lifecycle", "name": "Manage Leases Through Their Lifecycle", "howItSupports": "Registers the termination against the lease, calculates end date and notice period and schedules the inspections and deposit settlement."}, {"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Turns the pre-inspection findings into work orders for cleaning and repairs so the unit is ready before the first viewing."}, {"id": "let-units-and-sign-contracts", "name": "Let Units and Sign Contracts", "howItSupports": "Opens the vacancy record with the expected availability date so the unit appears in the letting pipeline as soon as notice is given."}]}, {"step": "Publish the listing and organise viewings", "description": "Create the listing from the unit record with photos, floor area, energy label, points score and asking rent, publish it to the firm's website and listing channels, and plan viewings in slots that candidates book themselves. Keep the owner informed of interest and viewing results.", "streamsNeeded": [{"id": "let-units-and-sign-contracts", "name": "Let Units and Sign Contracts", "howItSupports": "Generates the listing from the unit data, tracks candidate interest and viewing appointments per vacancy."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Lets candidates register interest and book viewings online and shows the owner the letting status of their unit in the owner portal."}]}, {"step": "Screen candidates and check the rent price", "description": "Collect the candidate's identity, income and employer documents through a secure upload, apply the firm's income ratio and guarantor rules, check the rental history and any sanctions or fraud lists that the firm uses, and calculate the points score so the asking rent is verified against the legal maximum for regulated and mid-rent units before an offer is made.", "streamsNeeded": [{"id": "let-units-and-sign-contracts", "name": "Let Units and Sign Contracts", "howItSupports": "Holds the candidate file, applies screening rules, ranks candidates and records the reasons for acceptance or rejection for the owner and the tenant."}, {"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Connects the Huurprijscheck.app rent-price check so the points calculation and the maximum rent are fetched and stored on the vacancy instead of retyped."}]}, {"step": "Generate the lease contract and get it e-signed", "description": "Draft the contract from the firm's template for the contract type (indefinite, fixed-term, room, commercial under the 290 or 230a regime), with the special terms, service charge advances, deposit and indexation clause filled from the unit and candidate record, send it for digital signature to the tenant, guarantor and owner, and store the signed version on the lease.", "streamsNeeded": [{"id": "let-units-and-sign-contracts", "name": "Let Units and Sign Contracts", "howItSupports": "Generates the contract from templates and structured lease data and routes it through e-signing to every signing party."}, {"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Runs the e-signing integration and files the signed document and audit trail on the lease automatically."}]}, {"step": "Collect the deposit and first rent and hand over the keys", "description": "Invoice the deposit and the first rent period, watch the incoming payments, activate the direct debit mandate, schedule the check-in inspection with meter readings and photos, and release the keys only when the money is in and the inspection report is signed by both parties.", "streamsNeeded": [{"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Creates the deposit and first-rent invoices, matches the payments on the bank statement and activates the direct debit mandate for the periodic rent."}, {"id": "let-units-and-sign-contracts", "name": "Let Units and Sign Contracts", "howItSupports": "Records the check-in inspection with meter readings and photos and closes the vacancy when the keys are handed over."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Gives the new tenant a portal account with the contract, the inspection report and the payment overview from day one."}]}]}, {"id": "jtbd-prpm-2", "name": "Run every lease through indexation, changes and termination without errors", "whatItIs": "Administer the whole lifecycle of hundreds to thousands of active leases: apply the annual rent increase per contract type within the statutory limits, process co-tenants, renewals, break options and special terms, keep arrears under control, handle terminations with the final inspection and deposit settlement, and settle the service charges every year against the real costs.", "outcome": "No lease misses its indexation, no termination is processed late, deposits and service charges are settled correctly and on the legal deadlines, and the firm can show for every lease event who did what and when.", "steps": [{"step": "Run the annual rent indexation", "description": "Select the leases due for increase, apply the permitted percentage per segment (regulated, mid-rent and liberalised follow different rules, and commercial contracts follow their own index clause), generate the increase letters within the statutory notice period, update the rent invoices and direct debit amounts, and handle objections.", "streamsNeeded": [{"id": "manage-leases-through-their-lifecycle", "name": "Manage Leases Through Their Lifecycle", "howItSupports": "Calculates the permitted increase per lease and contract type, generates the letters and records the new rent with its effective date."}, {"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Runs the indexation as a supervised robot batch across all owners and entities so a team of two can index thousands of leases in a day."}, {"id": tlement", "description": "Confirm the termination and end date, plan the pre-inspection and final inspection, document damage beyond normal wear with photos, calculate deductions, and return the remaining deposit within the legal term with a statement the tenant can check.", "streamsNeeded": [{"id": "manage-leases-through-their-lifecycle", "name": "Manage Leases Through Their Lifecycle", "howItSupports": "Runs the termination checklist, records both inspections and produces the deposit settlement statement with deductions."}, {"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Turns damage from the final inspection into work orders and links the supplier cost to the deposit deduction."}, {"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Pays out the remaining deposit and closes the tenant's debtor account so nothing is left open after move-out."}]}, {"step": "Settle the service charges every year", "description": "Collect the real costs of energy, cleaning, caretaking and shared installations per complex, apportion them to the units by the agreed keys, compare them with the advances paid, and issue the annual settlement statement with a refund or additional charge per tenant before the deadline.", "streamsNeeded": [{"id": "manage-leases-through-their-lifecycle", "name": "Manage Leases Through Their Lifecycle", "howItSupports": "Apportions the real costs to the leases by the agreed keys and produces the settlement statement per tenant."}, {"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Provides the booked supplier costs per complex and cost type as the basis for the settlement."}]}]}, {"id": "jtbd-prpm-3", "name": "Keep owners informed and paid with minimal effort", "whatItIs": "Serve the private owners, family offices and small investors whose units the firm manages: onboard their portfolio and mandate, pay out the rent minus costs and fees on time, produce the periodic statements their accountants need, obtain approvals for repairs and new tenants, and review the performance of their property with them.", "outcome": "Owners receive correct statements and payouts on time every period, find every document in the portal, approve decisions within a day, and renew the management mandate because the firm is transparent and easy to work with.", "steps": [{"step": "Onboard the owner's portfolio and mandate", "description": "Capture the owner as a relation with their entities and bank accounts, register the objects, units, existing leases, deposits and outstanding items from the previous manager or spreadsheets, and configure the mandate: fee percentage, approval limits for repairs, payout frequency and reporting preferences.", "streamsNeeded": [{"id": "onboard-portfolio-and-entities", "name": "Onboard Portfolio and Entities", "howItSupports": "Imports objects, units, leases and opening balances from the previous system or spreadsheets and links them to the owner's entities."}, {"id": "let-units-and-sign-contracts", "name": "Let Units and Sign Contracts", "howItSupports": "Validates the imported leases so that rent, indexation dates and deposits are complete before the first rent run."}]}, {"step": "Produce periodic owner statements and payouts", "description": "Every month or quarter, calculate the rent collected, the arrears, the supplier costs, the management fee and VAT per owner and per entity, produce the statement in the owner's format and pay out the balance to the owner's account by batch payment.", "streamsNeeded": [{"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Generates the owner statement from the ledger per entity and object, including fees and VAT, and archives it."}, {"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Supplies the collected rent and arrears per owner and creates the payout batch to the owners' bank accounts."}, {"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Runs the statement and payout cycle as a scheduled robot with exceptions routed to the property manager."}]}, {"step": "Give owners self-service through the owner portal", "description": "Activate every owner on a branded portal where they see occupancy, rent collected, open tickets, statements, contracts and documents for their properties in real time, so that the standard questions stop arriving by phone and email.", "streamsNeeded": [{"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Provides the owner portal with statements, documents, tickets and performance per property, updated from the system of record."}]}, {"step": "Obtain approvals for expenses and new tenants", "description": "Route repair quotes above the mandate limit, candidate tenant proposals and rent changes to the owner for approval with the underlying documents, record the decision with a timestamp, and continue the process automatically once approved.", "streamsNeeded": [{"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Presents approval requests in the owner portal and app and records the owner's decision on the ticket, candidate or lease."}, {"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Holds the work order until the owner has approved the quote and releases it to the supplier afterwards."}]}, {"step": "Review the property's performance with the owner", "description": "Prepare the annual review: gross and net yield, vacancy, arrears, maintenance spend, indexation applied and the market rent compared with the contract rent, and advise the owner on renovation, rent policy or sale.", "streamsNeeded": [{"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Produces yield, vacancy and cost dashboards per owner and property and compares contract rents with market data."}, {"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Delivers the annual owner report with the financial statements per entity and property."}]}]}], "customerJourneyStories": [{"id": "journey-prpm-1", "name": "From Informant and spreadsheets to one letting and lease desk", "linkedJobIds": ["jtbd-prpm-2", "jtbd-prpm-3"], "summary": "A property manager at a regional Dutch firm that has run its administration on Informant for fifteen years lives through the announcement that Informant has joined Bloxs, the decision to migrate, the parallel run on one owner portfolio and the season in which the whole firm moves its leases, indexation and owner statements to the new platform.", "stages": [{"stage": "Trigger", "narrative": "In July 2025 the firm receives the letter that Informant Software has been acquired by Bloxs, that migration to Bloxs is free of charge and that Informant support continues until 31 December 2027. At the same time the changed rent regulation has made the points calculation relevant for many more units, and the owner statements still take the administration team a full week every quarter in Excel. The director asks the property manager to lead the assessment."}, {"stage": "Discovery", "narrative": "The property manager attends the migration webinar organised for Informant customers, talks to two peers at a regional property managers' meeting who already run their firms on Bloxs, and reads the customer stories of FIT Vastgoedbeheer and Ruijters on bloxs.com. The demo shows the letting pipeline, the indexation run and the owner portal that Informant never had."}, {"stage": "Evaluation", "narrative": "The firm compares staying on Informant until 2027, moving to Bloxs or switching to another Dutch real estate package. The decisive checks are the migration plan for relations, objects, leases and open items, whether the rent-price check and e-signing work in the letting flow, how indexation handles the mixed regulated, mid-rent and commercial portfolio, the SaaS security documentation for the owners' auditors, and the subscription cost against the modules the firm really needs."}, {"stage": "Trial", "narrative": "One owner with 180 units is migrated first and run in parallel for two months. The property manager re-lets three units through the new letting pipeline with digital screening and e-signing, runs the first quarterly owner statement out of the system and compares it line by line with the Informant version. The differences turn out to be two deposits booked wrongly years ago."}, {"stage": "Engagement", "narrative": "The remaining owners are migrated in three waves before the annual indexation. The indexation is run as one supervised batch for all owners, terminations follow the checklist with the deposit statement produced from the ledger, and owners who used to call for their statement now find it in the portal. The property manager starts to use the arrears dashboard every Monday morning."}, {"stage": "Retention", "narrative": "At the first renewal the firm has taken on two new owner mandates without adding staff, quarterly statements go out on the fifth working day instead of the fifteenth, and the property manager asks for the hyper automation robots for the payout cycle. The firm becomes a reference for other Informant customers deciding when to migrate."}]}, {"id": "journey-prpm-2", "name": "Adopting the compliant letting flow with rent-price check and e-signing", "linkedJobIds": ["jtbd-prpm-1", "jtbd-prpm-2"], "summary": "A property manager at a firm already using Bloxs for administration adopts the letting workflow with candidate screening, the Huurprijscheck rent-price check and digital signing after a rent tribunal case, and ends up with a letting process that owners trust and that closes vacancies faster.", "stages": [{"stage": "Trigger", "narrative": "A tenant successfully challenges the rent of a mid-rent apartment at the Huurcommissie; the points calculation had been done on paper and could not be found. The owner is angry, the firm refunds the difference, and the director wants every new rent to be checked and documented before a contract is drafted."}, {"stage": "Discovery", "narrative": "During the quarterly account review the Bloxs customer success manager shows the letting module the firm already licenses but never switched on: candidate files, screening rules, the Huurprijscheck.app integration that stores the points and the maximum rent on the vacancy, and e-signing of the generated contract. A peer firm confirms in a call that its lettings staff went digital in a month."}, {"stage": "Evaluation", "narrative": "The property manager and the firm's legal adviser check whether the contract templates cover the firm's residential, room and commercial variants, how candidate data is stored and deleted under privacy rules, what the rent-price check costs per unit, and whether the signed contract and audit trail would hold up at the tribunal. The letting team tests the viewing scheduler with candidates for two vacancies."}, {"stage": "Trial", "narrative": "Every vacancy in one residential complex runs through the new flow for one quarter: listing generated from the unit record, candidates uploading documents themselves, the rent-price check attached to each offer, contracts signed on a phone. Vacancy days on the complex drop and the owner receives the candidate proposals in the portal."}, {"stage": "Engagement", "narrative": "The flow becomes the standard for every unit and every owner. Rejected candidates get a documented reason, the screening rules are tuned per owner mandate, and the property manager uses the pipeline board in the weekly letting meeting instead of a shared spreadsheet. Finance sees the deposit and first rent before the keys are handed over."}, {"stage": "Retention", "narrative": "A year on, no new lease has been challenged on rent price, vacancy per turnover has halved, and the firm wins a mandate from a family office that asked specifically about compliant letting. The property manager asks for the AI assistant that drafts the rejection and welcome letters."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-prpm-top", "name": "Units managed per FTE", "description": "Number of rental units administered per full-time employee in the letting and lease administration team of a property management firm. Modeled seed value for a mid-sized Dutch property manager, not an official Bloxs figure.", "unit": "units per FTE", "currentValue": "210", "targetValue": "320", "link": "https://dashboard.example.com/real-estate-erp-platform/customers/prpm/kpis/co-prpm-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-prpm-co-prpm-top.png"}, "branches": [{"id": "co-prpm-b1", "name": "Letting speed and compliance", "description": "How quickly vacant units are re-let and how well each new lease is documented as compliant with rent rules and screening obligations.", "currentValue": "66", "icon": "kpi-prpm-co-prpm-b1.png", "children": [{"id": "co-prpm-b1-c1", "name": "Vacancy days per turnover", "description": "Average number of days between the end of the old lease and the start of the new lease for units re-let in the period.", "unit": "days", "currentValue": "28", "targetValue": "16", "icon": "kpi-prpm-co-prpm-b1-c1.png", "children": [{"id": "co-prpm-b1-c1-l1", "name": "Time from notice to listing published", "description": "Working days between the tenant's termination notice and the listing going live on the firm's channels.", "unit": "days", "currentValue": "9", "targetValue": "2", "icon": "kpi-prpm-co-prpm-b1-c1-l1.png", "children": []}, {"id": "co-prpm-b1-c1-l2", "name": "Candidate screening turnaround", "description": "Working days between a 1.png", "children": []}, {"id": "bo-prpm-b2-c2-l2", "name": "Property management tenant churn rate", "description": "Share of property management tenants that leave the platform per year.", "unit": "%", "currentValue": "4", "targetValue": "2", "icon": "kpi-prpm-bo-prpm-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make one letting and lease desk the place where a property manager re-lets, contracts, indexes, settles and reports every unit, so the number of units a team can administer grows without the number of people and every lease event is compliant by construction.", "timeHorizons": {"year1": {"focus": "Migrate the Informant property-management base onto the platform without losing trusted service, make the letting flow with rent-price check and e-signing standard for every tenant, and take the indexation and owner statement cycle out of spreadsheets.", "productTheme": "One lease desk for the combined customer base", "customerKPI": {"northStar": "Units managed per FTE", "supporting": ["Vacancy days per turnover", "Rent arrears share"]}, "businessKPI": {"northStar": "Rental units administered by property managers on the platform", "revenueStreams": ["Real Estate ERP Core subscriptions", "Letting and e-signing add-ons", "Implementation and data migration services"], "supporting": ["Informant customers migrated", "Letting module attach rate"]}, "milestones": ["Deliver the Informant migration playbook that moves relations, objects, leases, deposits and open items in a parallel run of under eight weeks", "Ship the letting pipeline with candidate screening, the Huurprijscheck.app rent-price check and e-signing for every property management tenant", "Run the annual indexation for regulated, mid-rent, liberalised and commercial leases as one supervised batch per tenant"]}, "year3": {"focus": "Make lease lifecycle events run on rules and robots with exception-only review, put every owner on the portal with automatic statements and approvals, and extend the letting flow to German tenancy law for the first German property managers.", "productTheme": "Rule-driven lease lifecycle and owner self-service", "customerKPI": {"northStar": "Units managed per FTE", "supporting": ["Compliant lease share", "Owner statement effort"]}, "businessKPI": {"northStar": "Rental units administered by property managers on the platform", "revenueStreams": ["Modular real estate ERP subscriptions", "Owner and tenant portal add-ons", "Hyper automation robot add-ons"], "supporting": ["Automated lease events share", "Owner portal attach rate"]}, "milestones": ["Automate deposit settlement and service charge settlement end to end from the final inspection and the ledger", "Make owner statements, payouts and approvals a scheduled cycle with the owner portal as the default channel for every mandate", "Localise contract templates, indexation rules and deposit law for the German market"]}, "year5": {"focus": "Let AI agents draft contracts, letters and owner communication, propose rent policy per unit from market and points data, and handle the routine lease events across countries under the property manager's supervision.", "productTheme": "AI-assisted lease administration under supervision", "customerKPI": {"northStar": "Units managed per FTE", "supporting": ["Indexation letters sent on time", "Deposit settlement time"]}, "businessKPI": {"northStar": "Automation and expansion value", "revenueStreams": ["Multi-country real estate ERP subscriptions", "AI lease agent add-ons", "Rent benchmark and market data products"], "supporting": ["Property management expansion revenue", "Property management tenant churn rate"]}, "milestones": ["Deploy a lease agent that drafts contracts, addenda, indexation and termination letters and routes them for approval and signature", "Publish rent benchmarks per unit type and municipality from anonymised cross-tenant lease data to support rent policy advice to owners", "Run letting and lease administration for property managers in the Netherlands, Germany and Belgium on one multi-language, multi-jurisdiction lease desk"]}}}, "domain": "Property Management and VvE Firms"}, {"id": "tecm", "name": "Technical and Maintenance Manager", "description": "Runs the technical side of a managed portfolio at a property management firm or an investor's in-house management organisation: receives fault reports from tenants and owners, triages them, dispatches work orders to installers, plumbers, painters and lift companies, follows execution and matches the supplier invoices, keeps the installation register and the schedule of periodic maintenance and legal inspections per building, and builds the multi-year maintenance plan and budget that owners and associations approve. Typical employer: a firm such as FIT Vastgoedbeheer or CRMD Vastgoed Management, or the technical department of a residential or commercial investor, responsible for a few hundred to several thousand units with a technical team of one to eight people and a network of dozens of suppliers.", "icon": "tecm.png", "careAbout": ["Every fault report answered the same day, with the right supplier on site and the tenant informed without the technical team acting as a call centre", "A work order that carries the correct address, access details, fault description, photos and cost limit so the supplier fixes it on the first visit", "An installation register per building that says which boiler, lift, fire alarm, emergency lighting and legionella installation exists, who maintains it and when the next legal inspection is due", "Supplier invoices that match an approved work order and a completion report, so nothing is paid twice and nothing is paid without proof", "A multi-year maintenance plan per complex that owners and associations approve on evidence, with realised spend tracked against it", "Knowing which owner or association pays for what, and getting approvals above the mandate limit within a day"], "winsThem": ["A ticket board where tenant portal and app reports, e-mails and phone calls become tickets with photos, priority and unit context, triaged by rules and AI instead of by hand", "Work orders dispatched to the supplier portal or through maintenance partners such as Ziezodan and Proprli, accepted, planned and reported complete without a single phone call", "Automatic supplier reminders from the installation register for periodic maintenance and legal inspections, with certificates stored on the installation", "Supplier invoices matched to work orders and completion reports by robots, routed to the right owner or association ledger and approved with one click", "A multi-year maintenance plan built from condition scores and installation life cycles, with budgets per year and per owner that feed the owner report and the association reserve fund"], "theirFear": ["A lift or boiler inspection missed because the schedule lived in a spreadsheet, and an accident or an insurer refusing a claim afterwards", "A tenant without heating for a week because the work order was lost between three inboxes and two suppliers", "A supplier invoice paid twice or booked to the wrong owner, surfacing in the owner's annual statement or the association's accounts check"], "jobsToBeDone": [{"id": "jtbd-tecm-1", "name": "Resolve every fault report quickly with the right supplier", "whatItIs": "Handle the reactive maintenance stream of the portfolio from the moment a tenant, owner or caretaker reports a fault: register and triage the report, decide who pays and whether approval is needed, create the work order and dispatch it to the right supplier with the information needed to fix it on the first visit, follow execution and completion, inform the tenant, and match the supplier invoice before the ticket is closed.", "outcome": "Fault reports are resolved in days rather than weeks, mostly at the first visit, with the tenant informed at each step, the right party charged, and the supplier invoice matched to an approved work order and a completion report.", "steps": [{"step": "Receive and triage the fault report", "description": "Collect reports from the tenant portal and app, the owner portal, e-mail and phone into one ticket queue with unit, contract, photos and description; classify the fault (leak, heating, lift, lock, mould, pest), set the priority and response time according to urgency, and check whether the same installation already has an open ticket or a maintenance contract.", "streamsNeeded": [{"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Creates tickets from every channel with unit and installation context, classifies and prioritises them and detects duplicates on the same installation."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Lets tenants report faults with photos and preferred visit times in the app and see the status of their ticket afterwards."}]}, {"step": "Decide who pays and whether approval is needed", "description": "Determine from the lease and the management mandate whether the repair is for the tenant, the owner, the association or an insurer, whether it falls under a maintenance contract, and whether the expected cost is above the owner's approval limit; route the approval request with the quote to the owner where needed and keep the tenant informed of the delay.", "streamsNeeded": [{"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Applies the cost allocation rules from the lease and mandate and holds the ticket in an approval state with the quote attached."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Presents the approval request with the quote and photos in the owner portal and app and records the owner's decision on the ticket."}]}, {"step": "Create the work order and dispatch it to the supplier", "description": "Convert the ticket into a work order with address, access instructions, contact details of the tenant, fault description, photos, cost limit and required completion date; select the supplier from the panel by trade, region and contract price, and send the order to the supplier portal or through a connected maintenance partner such as Ziezodan or Proprli for acceptance and planning.", "streamsNeeded": [{"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Generates the work order from the ticket, proposes suppliers from the panel and tracks acceptance, planned date and status."}, {"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Sends work orders to maintenance partner platforms and the supplier portal through certified integrations and syncs status changes back to the ticket."}]}, {"step": "Follow execution and completion with the tenant", "description": "Watch that the supplier plans the visit within the response time, that the tenant confirms the appointment, that the work is reported complete with photos and used materials, and that follow-up work is raised where the first visit could not fix the fault; ask the tenant to confirm or rate the resolution.", "streamsNeeded": [{"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Escalates work orders that miss their response time, records completion reports and raises follow-up orders for unresolved faults."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Notifies the tenant of the planned visit and completion in the app and lets the supplier report completion with photos in the supplier portal."}]}, {"step": "Match the supplier invoice and close the ticket", "description": "Receive the supplier invoice electronically, match it to the work order and completion report, check it against the agreed price or cost limit, book it to the right owner, entity or association and cost type, recharge the tenant where the fault was theirs, approve it for payment and close the ticket.", "streamsNeeded": [{"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Matches the invoice to the work order and completion report and closes the ticket once the cost is booked."}, {"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Books the approved supplier invoice to the correct entity, object and cost type so it appears in the owner statement and the period close."}, {"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Uses robots to read the invoice, match it to the work order and propose the booking so the technical manager only handles exceptions."}]}]}, {"id": "jtbd-tecm-2", "name": "Keep installations compliant and maintained on schedule", "whatItIs": "Maintain a complete register of the technical installations in every building (heating and hot water, lifts, fire alarm and emergency lighting, ventilation, legionella-relevant water systems, roof safety, doors and gates), plan their periodic maintenance and the inspections required by law or insurer, make sure suppliers execute and certify them on time, handle the findings, and prove compliance to owners, associations and auditors.", "outcome": "No legal inspection or periodic maintenance is missed, every installation has a current certificate and a known maintainer, findings become work orders automatically, and compliance per building can be shown to any owner, insurer or authority within minutes.", "steps": [{"step": "Build and keep the installation register per building", "description": "Record every installation with type, brand, year, location, maintenance contract, supplier, inspection regime and expected lifetime, from the technical hand-over files, supplier contracts and site visits, and link it to the complex, building and units it serves.", "streamsNeeded": [{"id": "plan-and-execute-periodic-maintenance", "name": "Plan and Execute Periodic Maintenance", "howItSupports": "Holds the installation register with contracts, suppliers and inspection regimes linked to buildings and units."}, {"id": "onboard-portfolio-and-entities", "name": "Onboard Portfolio and Entities", "howItSupports": "Imports installations and maintenance contracts from the previous manager's files or system when a portfolio is taken on."}]}, {"step": "Schedule periodic maintenance and legal inspections", "description": "Derive the maintenance and inspection calendar from the register: annual boiler service, lift inspections, fire alarm and emergency lighting checks, legionella sampling, electrical safety inspections, roof and facade checks, with the frequency required by law, insurer or manufacturer, and assign each to the contracted supplier.", "streamsNeeded": [{"id": "plan-and-execute-periodic-maintenance", "name": "Plan and Execute Periodic Maintenance", "howItSupports": "Generates the recurring maintenance and inspection schedule per installation and shows what is due per building and month."}]}, {"step": "Remind suppliers automatically and record certificates", "description": "Send suppliers automatic reminders before each due date, receive the planned date and completion report through the supplier portal, store the inspection certificate or maintenance report on the installation, and escalate when a due date passes without a report.", "streamsNeeded": [{"id": "plan-and-execute-periodic-maintenance", "name": "Plan and Execute Periodic Maintenance", "howItSupports": "Sends supplier reminders from the schedule, tracks execution and files certificates on the installation with the next due date."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Gives suppliers a portal to confirm planned dates, upload reports and certificates and see their open periodic orders."}, {"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Runs the reminder and escalation cycle as a scheduled robot and reads certificates to update the register."}]}, {"step": "Turn inspection findings into follow-up work", "description": "Read the findings and defects in each inspection report, assess their urgency, create work orders for repairs with the right supplier and the right cost allocation, and track them until the installation is compliant again.", "streamsNeeded": [{"id": "plan-and-execute-periodic-maintenance", "name": "Plan and Execute Periodic Maintenance", "howItSupports": "Registers findings per inspection and links them to the installation so open defects are visible per building."}, {"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Creates and dispatches work orders for the defects and closes the loop when the repair is reported complete."}]}, {"step": "Prove compliance to owners, associations and auditors", "description": "Produce the compliance overview per building and per owner: installations, last and next inspection, certificates, open defects and maintenance contracts, and publish it in the owner portal and the association meeting pack, so insurers, auditors and buyers in a due diligence get it without a search through folders.", "streamsNeeded": [{"id": "plan-and-execute-periodic-maintenance", "name": "Plan and Execute Periodic Maintenance", "howItSupports": "Reports compliance status and certificates per building, installation and owner from the register."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Shows the compliance overview and certificates to owners in the owner portal."}, {"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Adds technical compliance and maintenance backlog to the portfolio dashboards used for hold, sell and renovation decisions."}]}]}, {"id": "jtbd-tecm-3", "name": "Plan and budget multi-year maintenance for the portfolio", "whatItIs": "Build and maintain the multi-year maintenance plan per complex and building: assess the condition of building parts and installations, plan replacements and large maintenance over ten to twenty years, translate it into a budget per year, per owner and per association, obtain approval, execute the planned projects and keep the plan current from the work actually done.", "outcome": "Every complex has an approved, funded multi-year maintenance plan, the annual budget per owner and association is set on evidence, planned work is executed within budget, and the plan stays current instead of being redone every five years by a consultant.", "steps": [{"step": "Assess condition and build the multi-year plan", "description": "Combine condition scores from site inspections, the installation register with expected lifetimes and the history of reactive repairs into a plan of large maintenance and replacements per building element (roof, facade, joinery, installations, common areas) over ten to twenty years, with cost estimates per activity.", "streamsNeeded": [{"id": "plan-and-execute-periodic-maintenance", "name": "Plan and Execute Periodic Maintenance", "howItSupports": "Holds the multi-year plan per building with elements, condition scores, planned years and cost estimates fed from the installation register."}, {"id": "resolve-maintenance-requests", "name": "Resolve Maintenance Requests", "howItSupports": "Provides the history of reactive tickets per installation that reveals elements at end of life."}]}, {"step": "Budget per year, per owner and per association", "description": "Translate the plan into annual maintenance budgets per owner, entity and association, distinguishing planned maintenance, contract maintenance and a reactive reserve, and align them with the owner's cash planning and the association's reserve fund contribution.", "streamsNeeded": [{"id": "plan-and-execute-periodic-maintenance", "name": "Plan and Execute Periodic Maintenance", "howItSupports": "Aggregates the plan into budgets per year and per owner or association and tracks committed and realised spend against them."}, {"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Carries the maintenance budget into the entity budgets and the owner and investor reports."}, {"id": "run-owners-association-administration", "name": "Run Owners' Association Administration", "howItSupports": "Feeds the planned large maintenance into the association's reserve fund calculation and contribution proposal."}]}, {"step": "Obtain approval from owners and associations", "description": "Present the plan and the budget to the owner in the portal or to the association in the annual meeting with the condition evidence, alternative scenarios and the effect on contributions, and record the approved version and any amendments.", "streamsNeeded": [{"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Presents the plan and budget for approval in the owner portal and records the decision."}, {"id": "run-owners-association-administration", "name": "Run Owners' Association Administration", "howItSupports": "Puts the plan on the meeting agenda, records the decision and links it to the association budget."}]}, {"step": "Execute planned projects and track spend against budget", "description": "Turn the approved activities of the year into projects and work orders: request quotes from several suppliers, award, plan the execution with the residents informed, supervise the work, approve stage invoices and follow committed and realised cost against the budget line.", "streamsNeeded": [{"id": "plan-and-execute-periodic-maintenance", "name": "Plan and Execute Periodic Maintenance", "howItSupports": "Converts approved plan activities into work orders and quote requests and records realised cost per activity."}, {"id": "manage-development-and-transformation-projects", "name": "Manage Development and Transformation Projects", "howItSupports": "Runs the larger renovation and replacement activities as projects with commitments, stage invoices and milestone tracking."}, {"id": "serve-tenants-owners-and-partners-through-portals", "name": "Serve Tenants, Owners and Partners Through Portals", "howItSupports": "Collects supplier quotes and completion reports through the supplier portal and informs tenants of planned works."}]}, {"step": "Update the plan from realised work", "description": "After each year, update the plan with the work done, the real costs, the new condition of replaced elements and the shifted activities, compare planned and realised spend per owner and association, and use the outcome to improve the estimates and the contribution advice for the next cycle.", "streamsNeeded": [{"id": "plan-and-execute-periodic-maintenance", "name": "Plan and Execute Periodic Maintenance", "howItSupports": "Rolls the plan forward with realised activities and costs and recalculates the forecast per building."}, {"id": "steer-portfolio-performance", "name": "Steer Portfolio Performance", "howItSupports": "Shows planned versus realised maintenance spend and technical condition per complex in the portfolio dashboards."}]}]}], "customerJourneyStories": [{"id": "journey-tecm-1", "name": "From a shared inbox to a ticket and work order cockpit", "linkedJobIds": ["jtbd-tecm-1", "jtbd-tecm-2"], "summary": "A technical manager at a property management firm that already administers its leases and finance on the platform switches the technical department from a shared mailbox, a phone and a spreadsheet of inspections to the technical management module, from the winter that broke the old way of working to the year in which suppliers and tenants work in the same system.", "stages": [{"stage": "Trigger", "narrative": "A cold week in January produces sixty heating complaints in three days. Tickets live in a shared mailbox, two colleagues send the same plumber to the same address, a tenant without heating for six days complains to the owner, and the lift inspection of one complex turns out to have lapsed because the spreadsheet was not updated after a supplier change. The director asks the technical manager to fix the process, not just the boilers."}, {"stage": "Discovery", "narrative": "The technical manager already sees tickets arriving from the tenant portal in the administration system the firm uses and asks the vendor what the Techniek module adds. A demo shows the ticket board, work orders to the supplier portal and to Ziezodan and Proprli, the installation register with automatic supplier reminders and the invoice matching. A colleague at another management firm confirms in a call that its technical team of three runs 2,500 units this way."}, {"stage": "Evaluation", "narrative": "The technical manager and the finance controller assess how tickets flow into work orders and how invoices are matched and booked per owner, whether the firm's twenty core suppliers will accept orders in a portal, how the installation register would be filled from the existing files, what the maintenance partner integrations cost, and whether the cost allocation rules from the mandates can be configured. The owner with the largest portfolio is asked whether approvals in the owner app are acceptable."}, {"stage": "Trial", "narrative": "One residential complex of 300 units and its eight suppliers go live for one quarter. Tenants report faults in the app, the technical manager triages them from the board, work orders go to the supplier portal, and the installation register of the complex is built from the hand-over file. The first quarter shows faster first visits and the first invoice matched automatically to a work order."}, {"stage": "Engagement", "narrative": "The whole portfolio follows within six months. The shared mailbox is closed, e-mails become tickets automatically, the installation register covers every building and the reminders go out to suppliers without the technical manager touching them. Owner approvals above the mandate limit arrive in the owner app and are answered within a day."}, {"stage": "Retention", "narrative": "At the year review the technical manager shows that resolution time has halved, that no legal inspection was missed and that supplier invoice disputes have almost disappeared. The firm adds the multi-year maintenance planning module for its associations and the technical manager becomes the reference for the vendor's next technical management prospect."}]}, {"id": "journey-tecm-2", "name": "Bringing suppliers into the portal and maintenance automation", "linkedJobIds": ["jtbd-tecm-1", "jtbd-tecm-3"], "summary": "Having run tickets on the platform for a year, a technical manager moves the supplier network from phone and e-mail to the supplier portal and connected maintenance partners, lets robots match invoices, and uses the resulting data to build multi-year maintenance plans that owners fund.", "stages": [{"stage": "Trigger", "narrative": "A plumber invoices the same leak twice under two work orders and a painter's invoice arrives for a job nobody can find. The finance controller counts 400 supplier invoices a month that the technical team checks by hand, and the largest owner asks for a funded maintenance plan before renewing the mandate."}, {"stage": "Discovery", "narrative": "During the quarterly review the vendor's customer success manager shows that the supplier portal and the Ziezodan and Proprli connectors the firm licenses can carry every work order, that hyper automation robots read and match supplier invoices, and that the multi-year maintenance planning module builds plans from the installation register. A webinar with a firm that has forty suppliers on the portal makes the model concrete."}, {"stage": "Evaluation", "narrative": "The technical manager asks the ten largest suppliers whether they will accept and report work in a portal or through their own maintenance platform, checks how the robots handle invoices without a work order number and how disputes are logged, and tests with finance whether matched invoices land in the right owner ledger. The owner is shown a sample plan with condition scores and a ten-year budget."}, {"stage": "Trial", "narrative": "All work orders for the largest owner's portfolio go through the portal and the connectors for one quarter, and the invoice robot runs on that owner's invoices. Acceptance within a day becomes normal, the technical manager approves matched invoices in batches, and the first multi-year plan is built for the owner's three complexes."}, {"stage": "Engagement", "narrative": "The portal and the connectors become a condition in the supplier agreements. Robots match most invoices, the technical manager handles exceptions from a queue, and the multi-year plans of all complexes feed the owner budgets and the association reserve funds. Planned maintenance grows as a share of all work because end-of-life installations are replaced before they fail."}, {"stage": "Retention", "narrative": "At the next renewal the supplier invoice backlog is gone, the largest owner has renewed the mandate on the strength of the funded plan, and the firm wins two associations that want the same. The technical manager asks for AI triage of tickets so the team can take on the next portfolio without a new hire."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-tecm-top", "name": "Ticket resolution time", "description": "Average number of calendar days between a fault report being registered and the ticket being closed with the sociation, and consolidated dashboards across all associations the firm manages", "A free, phased migration from Informant with the association history intact, and support from people who know the VvE trade"], "theirFear": ["An annual meeting convened one day too late or a decision counted with the wrong vote weights, making a renovation decision voidable after the contractor has started", "An association whose reserve fund is below the legal minimum or whose money was mixed with another association's account, found by the audit committee or a buyer's notary", "Losing the association history and the trust of a hundred boards in a migration from the software the firm has used for twenty years"], "jobsToBeDone": [{"id": "jtbd-vvea-1", "name": "Run association budgets, contributions and reserves accurately", "whatItIs": "Keep the finances of every managed association correct through the year: set the association up from the splitting deed with its apportionment keys and owners, draft the annual budget and the contribution per owner, collect contributions and follow arrears, manage the reserve fund and its savings against the multi-year maintenance plan, keep the bank accounts reconciled and produce the annual accounts and audit committee pack.", "outcome": "Every association has an approved budget, correct contributions, collected money on its own reconciled bank account, a reserve fund that meets the legal minimum and the plan, and annual accounts delivered in time for the meeting, with the administrator handling exceptions rather than every association by hand.", "steps": [{"step": "Set up the association from the splitting deed", "description": "Register the association as an entity with its statutory details, the apartment rights and their apportionment keys for contributions and votes from the splitting deed and regulations, the owners and their contact and bank details, the board and audit committee, the bank accounts and the opening balances, whether from Informant, another package or paper files.", "streamsNeeded": [{"id": "onboard-portfolio-and-entities", "name": "Onboard Portfolio and Entities", "howItSupports": "Imports associations, apartment rights, owners, keys and opening balances from Informant or other sources and validates them before go-live."}, {"id": "run-owners-association-administration", "name": "Run Owners' Association Administration", "howItSupports": "Holds the association record with apportionment keys, owners, board, bank accounts and regulations that every later process uses."}]}, {"step": "Draft the annual budget and contributions per owner", "description": "Build next year's budget from this year's realised costs, the maintenance contracts, insurance, utilities, the administrator's fee and the reserve fund contribution required by the multi-year plan and the legal minimum, and derive the contribution per owner per period from the apportionment keys, ready for approval at the meeting.", "streamsNeeded": [{"id": "run-owners-association-administration", "name": "Run Owners' Association Administration", "howItSupports": "Generates the budget proposal from realised costs and contracts and calculates the contribution per owner from the keys."}, {"id": "plan-and-execute-periodic-maintenance", "name": "Plan and Execute Periodic Maintenance", "howItSupports": "Supplies the multi-year maintenance plan that determines the reserve fund contribution."}]}, {"step": "Collect contributions by direct debit and follow arrears", "description": "Run the periodic contribution invoices per association, collect by direct debit or transfer on the association's own bank account, reconcile the bank statements daily, send reminders and arrears letters in the sequence the regulations allow, charge interest and costs where agreed, and involve the board or a bailiff when an owner does not pay.", "streamsNeeded": [{"id": "invoice-and-collect-rent", "name": "Invoice and Collect Rent", "howItSupports": "Runs the contribution invoices, direct debits, bank reconciliation and dunning per association on the association's own accounts."}, {"id": "run-owners-association-administration", "name": "Run Owners' Association Administration", "howItSupports": "Applies the association's regulations on reminders, interest and costs and reports arrears per association to the board."}, {"id": "automate-and-integrate-the-back-office", "name": "Automate and Integrate the Back Office", "howItSupports": "Executes the contribution runs and reconciliation across hundreds of associations as scheduled robots with exceptions for the administrator."}]}, {"step": "Manage the reserve fund and its savings", "description": "Keep the reserve fund per association on a separate savings account, book the periodic contribution into it, check it against the legal minimum and the multi-year plan, fund approved large maintenance from it and report its position to the board and the meeting.", "streamsNeeded": [{"id": "run-owners-association-administration", "name": "Run Owners' Association Administration", "howItSupports": "Tracks the reserve fund per association against the legal minimum and the plan and books withdrawals for approved works."}, {"id": "plan-and-execute-periodic-maintenance", "name": "Plan and Execute Periodic Maintenance", "howItSupports": "Provides the planned large maintenance per year that the reserve fund must cover."}]}, {"step": "Produce the annual accounts and audit committee pack", "description": "Close the association's year: book the last supplier invoices, settle the utilities and service costs per owner where the regulations require it, produce the balance sheet, income statement, reserve fund statement and the explanatory notes, and prepare the pack for the audit committee before the meeting.", "streamsNeeded": [{"id": "close-books-and-report-to-investors", "name": "Close Books and Report to Investors", "howItSupports": "Closes the period per association entity and produces the balance sheet, income
