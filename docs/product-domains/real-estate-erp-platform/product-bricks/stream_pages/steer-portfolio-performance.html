    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

e following year."], "painPoints": ["Forecasts in personal models cannot be reproduced by the next asset manager.", "Capex needed for energy labels is discovered only when a lender asks for the ESG plan."], "dependencies": [{"type": "brick", "id": "dash", "name": "Dashboards and Data Analytics", "description": "Scenario and forecast models.", "how": "Runs the scenarios and produces the forecasts."}, {"type": "brick", "id": "mjop", "name": "Multi-Year Maintenance Planning and Budgets", "description": "Maintenance and capex plans.", "how": "Provides the planned maintenance and capex per object."}, {"type": "brick", "id": "valu", "name": "Valuations and Market Data", "description": "Valuation and yield assumptions.", "how": "Supplies exit yields and value assumptions."}]}, {"id": "update-the-asset-plan-and-decide", "title": "Update the asset plan and decide hold, invest or sell", "actor": "Asset and Portfolio Manager", "keyFacts": ["Each object gets an asset plan with the decision, target rent, planned works and disposal timing; the decision is recorded with the supporting analysis for the investment committee.", "Disposal candidates enter a sales process with the data room built from the object's documents."], "painPoints": ["Decisions without a recorded rationale are re-argued at every committee.", "Data rooms assembled by hand delay sales by months."], "dependencies": [{"type": "brick", "id": "objt", "name": "Objects, Complexes and Units", "description": "Asset plan per object.", "how": "Stores the plan, decision and targets on the object."}, {"type": "brick", "id": "docm", "name": "Documents and Correspondence", "description": "Data room from object documents.", "how": "Assembles the object's documents for a sales process."}, {"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Notifications", "description": "Committee approval workflow.", "how": "Routes the decision for approval."}]}, {"id": "assign-actions-and-budgets", "title": "Assign actions and budgets to the teams", "actor": "Asset and Portfolio Manager", "keyFacts": ["Actions (re-let at market, renovate, energy measures, sell) are assigned to property, technical and finance teams with budgets and dates and tracked against the plan.", "Progress is visible in the dashboard next to the KPIs the actions should move."], "painPoints": ["Actions agreed in a meeting evaporate without owners and dates.", "Budgets not linked to plans are spent twice."], "dependencies": [{"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Notifications", "description": "Action tasks with owners and dates.", "how": "Creates and tracks the actions per object."}, {"type": "brick", "id": "mjop", "name": "Multi-Year Maintenance Planning and Budgets", "description": "Budget allocation for planned works.", "how": "Reserves budget for the planned works."}, {"type": "brick", "id": "dash", "name": "Dashboards and Data Analytics", "description": "Action progress against KPIs.", "how": "Shows progress and KPI movement together."}]}]}, {"id": "run-the-management-firm-on-numbers", "title": "Run the Management Firm on Numbers", "description": "The director's steering loop for a property management or VvE firm: units and associations per FTE, revenue and margin per client, service quality and compliance status, with Power BI for the board and the sales pipeline for growth.", "primaryActor": "Real Estate Company Director", "trigger": "The monthly management meeting reviews the firm's KPIs and a large owner client is up for contract renewal.", "successSignal": "The director knows margin per client, units per FTE and open compliance items, and the renewal is priced on measured service quality.", "steps": [{"id": "measure-units-per-fte-and-margin-per-client", "title": "Measure units per FTE and margin per client", "actor": "Real Estate Company Director", "keyFacts": ["Management fees, hours and cost per client mandate are combined into margin per client; units and associations per FTE track the scalability the firm sells to its owners.", "Benchmarks from industry associations put a well-automated firm well above the manual average in units per FTE."], "painPoints": ["Firms that do not know margin per client keep loss-making mandates for years.", "Growth by acquisition without scalability metrics only adds headcount."], "dependencies": [{"type": "brick", "id": "dash", "name": "Dashboards and Data Analytics", "description": "Firm KPIs per client and FTE.", "how": "Computes margin per client and units per FTE."}, {"type": "brick", "id": "ledg", "name": "Multi-Entity General Ledger and Period Close", "description": "Fee revenue and cost per mandate.", "how": "Provides fee income and costs per client entity."}]}, {"id": "track-service-quality-and-compliance", "title": "Track service quality and compliance status", "actor": "Real Estate Company Director", "keyFacts": ["Ticket resolution times, owner statement timeliness, deposit settlement terms, expired inspections and open Good Landlord Act items are tracked as compliance and quality indicators per client.", "Support rating of the platform provider itself (published at 8.9 out of 10) is part of the firm's tooling review."], "painPoints": ["Compliance failures found by a municipality cost the mandate.", "Service quality argued anecdotally at renewal time loses to a competitor's numbers."], "dependencies": [{"type": "brick", "id": "dash", "name": "Dashboards and Data Analytics", "description": "Quality and compliance indicators.", "how": "Aggregates service and compliance metrics per client."}, {"type": "brick", "id": "inst", "name": "Installations and Periodic Maintenance", "description": "Inspection status.", "how": "Supplies expired and upcoming legal inspections."}, {"type": "brick", "id": "tick", "name": "Fault Reports and Tickets", "description": "Ticket resolution metrics.", "how": "Supplies resolution times and first-time-fix rates."}]}, {"id": "publish-board-reports-in-power-bi", "title": "Publish board reports in Power BI", "actor": "Real Estate Company Director", "keyFacts": ["Certified datasets are exposed to Power BI so the board and shareholders combine platform data with HR and CRM data in their own models.", "Datasets are refreshed automatically and scoped by the user's access rights."], "painPoints": ["Exports to Excel for the board break the data lineage.", "BI models built on unstable extracts fail after every release."], "dependencies": [{"type": "brick", "id": "apip", "name": "Open API and Certified Integrations", "description": "Power BI connector and datasets.", "how": "Exposes governed datasets to the BI tool."}, {"type": "brick", "id": "dash", "name": "Dashboards and Data Analytics", "description": "Dataset definitions.", "how": "Defines the datasets and their refresh schedule."}]}, {"id": "prepare-client-renewals-and-growth", "title": "Prepare client renewals and the growth pipeline", "actor": "Real Estate Company Director", "keyFacts": ["Renewal proposals are priced on measured service levels and the client's portfolio growth; the pipeline of owner and investor prospects is tracked in the CRM with the portfolios they bring.", "Acquisition targets (other managers) are evaluated on the units and systems they would bring onto the platform."], "painPoints": ["Renewals negotiated without service data become pure price discussions.", "Prospects tracked in a personal spreadsheet leave with the salesperson."], "dependencies": [{"type": "brick", "id": "rela", "name": "Relations and CRM", "description": "Client and prospect CRM.", "how": "Tracks clients, prospects and renewal dates."}, {"type": "brick", "id": "ivrp", "name": "Investor and Owner Reporting", "description": "Service reports for renewal talks.", "how": "Produces the service and performance report per client."}, {"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Notifications", "description": "Renewal tasks and reminders.", "how": "Schedules renewal preparation ahead of contract end."}]}, {"id": "act-on-the-numbers", "title": "Act on the numbers and follow through", "actor": "Real Estate Company Director", "keyFacts": ["Decisions (re-price a mandate, automate a process, hire, acquire) are recorded with owners and measured on the next month's KPIs.", "Automation opportunities are ranked by the hours they free per month."], "painPoints": ["Management meetings that end without assigned actions repeat themselves.", "Automation chosen by gut feeling misses the biggest time sinks."], "dependencies": [{"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Notifications", "description": "Management actions and follow-up.", "how": "Tracks decisions and their owners."}, {"type": "brick", "id": "auto", "name": "Hyper Automation and Robots", "description": "Automation opportunity ranking.", "how": "Shows hours spent per repetitive process and the robot candidates."}, {"type": "brick", "id": "dash", "name": "Dashboards and Data Analytics", "description": "KPI follow-up.", "how": "Measures the effect of actions on the KPIs."}]}]}], "outcomes": ["Portfolio performance is known in real time per object, complex and fund instead of a month later in Excel", "Every object carries an asset plan with a recorded decision, budget and owner, and the actions are measured on the KPIs they should move", "Directors steer on units per FTE, margin per client and compliance status, and renew clients on measured service quality"], "brickDependencies": [{"targetBrickId": "dash", "type": "composition"}, {"targetBrickId": "objt", "type": "composition"}, {"targetBrickId": "valu", "type": "composition"}, {"targetBrickId": "cntr", "type": "composition"}, {"targetBrickId": "mjop", "type": "composition"}, {"targetBrickId": "docm", "type": "composition"}, {"targetBrickId": "wflw", "type": "composition"}, {"targetBrickId": "ledg", "type": "composition"}, {"targetBrickId": "inst", "type": "composition"}, {"targetBrickId": "tick", "type": "composition"}, {"targetBrickId": "apip", "type"         }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Outcomes</div>';
        if (!(currentStream.outcomes || []).length) {
            html += '<div class="muted">No outcomes listed for this stream.</div>';
        } else {
            html += '<div class="card"><ul class="list">' + currentStream.outcomes.map(outcome => '<li>' + escapeHtml(outcome) + '</li>').join('') + '</ul></div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Supporting Product Bricks</div>';
        if (!related_bricks.length) {
            html += '<div class="muted">No linked product bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            related_bricks.forEach(brick => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../landing_pages/' + escapeHtml(brick.id) + '.html">';
                html += '<div class="card-meta">' + escapeHtml((brick.group || brick.domain || 'Product Brick')) + '</div>';
                html += '<div class="card-header">';
                html += '<img class="card-icon" src="../icons/' + escapeHtml(brick.id) + '.png" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
                html += '<div class="card-title">' + escapeHtml(brick.name || brick.id) + '</div>';
                html += '</div>';
                html += '<div class="card-copy">' + escapeHtml(brick.description || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Linked Products</div>';
        if (!linked_products.length) {
            html += '<div class="muted">No linked products were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            linked_products.forEach(product => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../../product-deployments/landing_pages/' + escapeHtml(product.id) + '.html">';
                html += '<div class="card-meta">' + escapeHtml(product.type || 'Product') + '</div>';
                html += '<div class="card-header">';
                html += '<img class="card-icon" src="../../product-deployments/icons/' + escapeHtml(product.icon) + '" alt="" onerror="this.onerror=null;this.src=\'../../product-deployments/icons/product.png\'">';
                html += '<div class="card-title">' + escapeHtml(product.name || product.id) + '</div>';
                html += '</div>';
                html += '<div class="card-copy">' + escapeHtml(product.whyUsed || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Related Teams</div>';
        if (!related_teams.length) {
            html += '<div class="muted">No teams were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            related_teams.forEach(team => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../../teams/landing_pages/' + escapeHtml(team.teamId) + '.html">';
                html += '<div class="card-meta">' + escapeHtml(team.roleLabel || team.teamType || 'Team') + '</div>';
                html += '<div class="card-title">' + escapeHtml(team.teamName || team.teamId) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(team.groupName || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Supported Customer Jobs</div>';
        if (!supported_jobs.length) {
            html += '<div class="muted">No customer jobs were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            supported_jobs.forEach(job => {
                html += '<div class="card">';
                html += '<div class="card-meta">' + escapeHtml(job.customerGroup || '') + (job.productName ? ' | ' + escapeHtml(job.productName) : '') + '</div>';
                html += '<div class="card-title">' + escapeHtml(job.jobName || job.jobId) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(job.jobOutcome || job.jobWhatItIs || '') + '</div>';
                if (job.supportRationale) {
                    html += '<div class="card-copy"><strong>Why this stream matters here:</strong> ' + escapeHtml(job.supportRationale) + '</div>';
                }
                if ((job.usedInSteps || []).length) {
                    html += '<ul class="list">' + job.usedInSteps.map(step => '<li>' + escapeHtml(step.step || step.description || '') + '</li>').join('') + '</ul>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        html += '</div>';

        document.getElementById('tab_content_home').innerHTML = html;
    }

    function renderFlows() {
        const flows = getFlows();
        const totalSteps = flows.reduce((count, flow) => count + ((flow.steps || []).length), 0);
        let html = '';

        document.getElementById('tab_flows').innerHTML = 'Flow Narratives (' + flows.length + ')';

        flows.forEach(flow => {
            const dependenciesInFlow = getFlowDependencies(flow);
            const summary = summarizeFlow(flow);
            html += '<div class="group">';
            html += '<div class="section-title">Flow</div>';
            html += '<div class="flow-title">' + escapeHtml(flow.title || flow.id) + '</div>';
            html += '<div class="flow-description">' + escapeHtml(flow.description || '') + '</div>';
            if (summary.actor || summary.trigger || summary.result) {
                html += '<div class="card" style="margin-bottom:16px;">';
                if (summary.actor) {
                    html += '<div class="card-copy"><strong>Primary actor:</strong> ' + escapeHtml(summary.actor) + '</div>';
                }
                if (summary.trigger) {
                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';
                }
                html += '</div>';
            }

            html += '<div class="section-title">Dependency Traceability</div>';
            html += '<div class="flow-matrix-wrap">';
            html += '<table class="flow-matrix">';
            html += '<thead>';
            html += '<tr><th class="flow-dependency-col"></th>';
            (flow.steps || []).forEach((step, index) => {
                html += '<th class="flow-step-col"><div class="flow-step-label">Step ' + (index + 1) + '</div><div class="card-title">' + escapeHtml(step.title || step.id) + '</div></th>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right">Key Facts</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkblue">';
                if ((step.keyFacts || []).length) {
                    html += '<ul class="flow-insight-list">' + step.keyFacts.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No key facts listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right; color: darkred">Pain Points</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkred">';
                if ((step.painPoints || []).length) {
                    html += '<ul class="flow-insight-list">' + step.painPoints.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No pain points listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';
            html += '</thead><tbody>';

            dependenciesInFlow.forEach(dependency => {
                const dependencyTypeLabel = 'Product Brick';
                html += '<tr>';
                html += '<td>';
                html += '<div class="flow-dependency-header">';
                html += renderFlowDependencyIcon(dependency, 'flow-dependency-icon');
                html += '<div>';
                html += '<a class="flow-dependency-name" href="../landing_pages/' + escapeHtml(dependency.id) + '.html">' + escapeHtml(dependency.name || dependency.id) + '</a>';
                if (dependency.interface) {
                    html += '<div class="muted">' + escapeHtml(dependency.interface) + '</div>';
                }
                html += '</div>';
                html += '</div>';
                html += '</td>';
                (flow.steps || []).forEach(step => {
                    const stepDependency = getStepDependency(step, dependency);
                    if (!stepDependency) {
                        html += '<td class="flow-cell-empty">-</td>';
                        return;
                    }
                    html += '<td class="flow-cell-active">';
                    html += '<div class="flow-cell-copy">' + escapeHtml(simplifySupportCopy(stepDependency.how || stepDependency.description || 'Supports this step.')) + '</div>';
                    html += '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            html += '</div>';
            html += '</div>';
        });

        document.getElementById('tab_content_flows').innerHTML = html;
    }

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';
        }
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-title">' + escapeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                count++;
                html += '<div class="link-entry">';
                html += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(link.link || '#') + '">'
                    + escapeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>


<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Real Estate ERP Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Streams Index"
    },
    {
      "label": "Steer Portfolio Performance"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
