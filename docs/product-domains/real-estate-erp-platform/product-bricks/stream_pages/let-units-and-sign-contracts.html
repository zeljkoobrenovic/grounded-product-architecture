    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

", "Only data necessary for the decision is stored, and rejected candidates' documents are deleted after the retention period, as the GDPR and the Good Landlord Act demand."], "painPoints": ["Copies of passports in mailboxes are a data breach waiting to happen.", "Undocumented selection exposes the manager to discrimination complaints."], "dependencies": [{"type": "brick", "id": "vacm", "name": "Vacancy, Letting and Candidate Screening", "description": "Candidate applications, screening and ranking.", "how": "Captures applications, runs the screening rules and records the selection rationale."}, {"type": "brick", "id": "rela", "name": "Relations and CRM", "description": "Candidate relation records.", "how": "Creates the candidate as a relation with restricted retention."}]}, {"id": "generate-the-lease-contract", "title": "Generate the lease from the contract template", "actor": "Property Manager", "keyFacts": ["The contract is generated from the template for the rent regime (regulated, mid-rent, free sector) with rent components, service charge advances, deposit of at most two months' basic rent and the mandatory information for tenants.", "Temporary contracts are only allowed in the exceptions that survived the Fixed Rental Contracts Act of 1 July 2024; the template enforces the contract type."], "painPoints": ["Contracts edited in Word drift from the model and miss mandatory clauses.", "A deposit above two months' rent is unlawful and must be refunded."], "dependencies": [{"type": "brick", "id": "cntr", "name": "Lease Contracts and E-Signing", "description": "Contract generation from templates.", "how": "Creates the lease with components, deposit and clauses from the chosen template."}, {"type": "brick", "id": "docm", "name": "Documents and Correspondence", "description": "Contract document and mandatory attachments.", "how": "Compiles the lease PDF with energy label, house rules and information sheet."}, {"type": "brick", "id": "aiag", "name": "AI Assistants", "description": "Drafting assistance for special clauses.", "how": "Suggests wording for special terms within the template rules."}]}, {"id": "e-sign-and-collect-deposit", "title": "E-sign the contract and collect deposit and first rent", "actor": "Tenant", "keyFacts": ["The tenant signs in the e-signing flow and pays deposit and first rent through a payment link or bank transfer; a SEPA direct debit mandate is signed in the same session.", "The signed contract with audit trail is filed on the relation and the unit, and the contract is activated on receipt of payment."], "painPoints": ["Paper contracts sent by post add a week to the vacancy.", "Keys handed over before the deposit is received are the start of every bad tenancy."], "dependencies": [{"type": "brick", "id": "cntr", "name": "Lease Contracts and E-Signing", "description": "E-signing envelope and activation.", "how": "Sends the contract for signature and activates it once signed and paid."}, {"type": "brick", "id": "bank", "name": "Bank Integration and Reconciliation", "description": "Deposit and first-rent receipt.", "how": "Matches the incoming payment to the contract and registers the SEPA mandate."}]}, {"id": "hand-over-keys-with-inspection-report", "title": "Hand over keys with an inspection report", "actor": "Property Manager", "keyFacts": ["The check-in inspection records the condition per room with photos and meter readings; it is signed by both parties in the app and becomes the reference for the check-out.", "Meter readings are passed to the tenant for their energy contracts and to service charge settlement where applicable."], "painPoints": ["Without a signed check-in report the landlord cannot deduct damage from the deposit.", "Meter readings on paper are lost by the time the settlement is made."], "dependencies": [{"type": "brick", "id": "docm", "name": "Documents and Correspondence", "description": "Inspection report and photos.", "how": "Stores the signed check-in report with photos and readings."}, {"type": "brick", "id": "objt", "name": "Objects, Complexes and Units", "description": "Unit meter and condition data.", "how": "Records meter readings and condition at the start of the tenancy."}, {"type": "brick", "id": "tenp", "name": "Tenant Portal and App", "description": "Tenant app check-in signature.", "how": "Lets the tenant view and sign the report in the app."}]}, {"id": "activate-invoicing-and-portal", "title": "Activate invoicing and the tenant portal", "actor": "Property Manager", "keyFacts": ["The active contract enters the next rent run with pro rata rent for the first month; the direct debit mandate is pre-notified and the tenant sees invoices and documents in the portal.", "Vacancy days and time-to-let are closed on the vacancy record for the property manager's KPI."], "painPoints": ["Contracts activated after the rent run miss a month of collection.", "Tenants without portal access call the office for every question."], "dependencies": [{"type": "brick", "id": "rent", "name": "Rent Invoicing and Billing Runs", "description": "Contract enters the billing run.", "how": "Schedules the pro rata first invoice and the recurring rent."}, {"type": "brick", "id": "tenp", "name": "Tenant Portal and App", "description": "Tenant portal onboarding.", "how": "Invites the tenant and shows contract, invoices and documents."}, {"type": "brick", "id": "vacm", "name": "Vacancy, Letting and Candidate Screening", "description": "Vacancy closed with letting metrics.", "how": "Closes the vacancy and records vacancy days and time-to-let."}]}]}, {"id": "let-commercial-space-and-negotiate-the-lease", "title": "Let Commercial Space and Negotiate the Lease", "description": "From an empty office or retail unit to a signed ROZ-model lease: marketing through brokers, proposals with incentives, credit assessment of the business tenant, negotiated special terms, e-signing and fit-out hand-over.", "primaryActor": "Asset and Portfolio Manager", "trigger": "A 1,200 m2 office floor becomes vacant after a break option is exercised.", "successSignal": "A creditworthy business tenant has signed a multi-year lease with agreed incentives, and rent, service charges and VAT are invoicing from the commencement date.", "steps": [{"id": "brief-brokers-and-publish", "title": "Brief brokers and publish the availability", "actor": "Asset and Portfolio Manager", "keyFacts": ["Commercial vacancies are marketed through brokers under a mandate with agreed fees; the availability sheet carries surface per NEN 2580, asking rent per m2, service charge estimate and delivery level.", "Broker leads and viewings are logged on the vacancy so the asset manager sees the pipeline per unit."], "painPoints": ["Availability lists maintained by brokers show units already let.", "Leads kept by brokers are lost when the mandate ends."], "dependencies": [{"type": "brick", "id": "vacm", "name": "Vacancy, Letting and Candidate Screening", "description": "Commercial vacancy with broker mandate and leads.", "how": "Registers the vacancy, mandate, lead pipeline and viewings."}, {"type": "brick", "id": "rela", "name": "Relations and CRM", "description": "Broker and prospect relations.", "how": "Holds broker and prospect relations and their contacts."}]}, {"id": "issue-a-proposal-with-incentives", "title": "Issue a proposal with rent, incentives and term", "actor": "Asset and Portfolio Manager", "keyFacts": ["A proposal defines rent, indexation clause, term (for example 5+5 years under the retail regime), rent-free months, fit-out contribution and break options, with the effective rent calculated over the term.", "Proposal versions are kept so the asset manager can compare negotiated variants and their effect on the cash flow."], "painPoints": ["Effective rent calculated in a spreadsheet differs from what finance books later.", "Incentives agreed by e-mail never reach the invoicing schedule."], "dependencies": [{"type": "brick", "id": "cntr", "name": "Lease Contracts and E-Signing", "description": "Proposals, versions and incentives.", "how": "Creates the proposal with incentives and term as a draft contract."}, {"type": "brick", "id": "dash", "name": "Dashboards and Data Analytics", "description": "Effective rent and cash flow effect.", "how": "Calculates the effective rent and shows the cash flow impact per variant."}]}, {"id": "assess-tenant-credit-and-security", "title": "Assess tenant credit and security", "actor": "Real Estate Finance Controller", "keyFacts": ["The business tenant is checked on KvK data, financial statements and credit score; security is set as a deposit or bank guarantee, typically three months' rent plus service charges and VAT.", "Guarantees are registered with expiry dates so they can be called or renewed before they lapse."], "painPoints": ["Bank guarantees in a drawer expire unnoticed.", "A tenant that fails within a year costs more than the vacancy it filled."], "dependencies": [{"type": "brick", "id": "vacm", "name": "Vacancy, Letting and Candidate Screening", "description": "Credit assessment of business candidates.", "how": "Records the assessment and the required security."}, {"type": "brick", "id": "rela", "name": "Relations and CRM", "description": "Business tenant relation with KvK data.", "how": "Stores the legal entity, signatories and group structure."}]}, {"id": "negotiate-special-terms", "title": "Negotiate special terms and VAT option", "actor": "Asset and Portfolio Manager", "keyFacts": ["Special terms (exclusivity, expansion rights, indexation floors, sustainability obligations) are recorded as structured clauses; the VAT-taxed lease option is only valid when the tenant uses the space for at least 90 percent VAT-taxed activities.", "Break options and renewal notice dates become dated obligations that trigger tasks years later."], "painPoints": ["Special terms buried in the PDF are forgotten by the time they matter.", "An invalid VAT option leads to VAT corrections on the landlord's investment costs."], "dependencies": [{"type": "brick", "id": "cntr", "name": "Lease Contracts and E-Signing", "description": "Structured special clauses and VAT option.", "how": "Records special terms, break options and the VAT option on the contract."}, {"type": "brick", "id": "vatx", "name": "VAT and Tax Handling", "description": "VAT regime per contract.", "how": "Sets the taxed or exempt treatment for invoicing and pro rata deduction."}, {"type": "brick", "id": "wflw", "name": "Workflow, Tasks and Notifications", "description": "Dated obligations as future tasks.", "how": "Creates tasks for break, renewal and obligation dates."}]}, {"id": "sign-electronically-with-signatories", "title": "Sign electronically with the authorised signatories", "actor": "Asset and Portfolio Manager", "keyFacts": ["The ROZ-model lease and general conditions are signed by the authorised signatories of both entities in a multi-party e-signing flow with identity verification.", "The signed contract is filed on the entity, unit and tenant relation with the guarantee document."], "painPoints": ["Wet-ink signatures with couriers add weeks to commencement.", "Signatures by unauthorised persons make the lease contestable."], "dependencies": [{"type": "brick", "id": "cntr", "name": "Lease Contracts and E-Signing", "description": "Multi-party e-signing and activation.", "how": "Runs the signature flow and activates the lease on completion."}, {"type": "brick", "id": "docm", "name": "Documents and Correspondence", "description": "Signed lease, conditions and guarantee filing.", "how": "Files the signed documents and the guarantee."}]}, {"id": "deliver-space-and-start-invoicing", "title": "Deliver the space and start invoicing", "actor": "Property Manager", "keyFacts": ["Delivery is recorded with a signed report and photos; rent-free months are applied as scheduled credits so invoices show the agreed rent from the commencement date.", "Service charge advances and VAT are invoiced with the rent, and the fit-out contribution is paid against the tenant's invoice."], "painPoints": ["Rent-free periods applied by hand in the rent run are the most common invoicing error on commercial leases.", "Delivery disputes without a signed report end up in court."], "dependencies": [{"type": "brick", "id": "rent", "name": "Rent Invoicing and Billing Runs", "description": "Rent schedule with incentives.", "how": "Invoices rent, advances and VAT with rent-free credits applied."}, {"type": "brick", "id": "svcc", "name": "Service Charges and Settlements", "description": "Service charge advances for the unit.", "how": "Sets the advances based on the building's service charge budget."}, {"type": "brick", "id": "docm", "name": "Documents and Correspondence", "description": "Delivery report.", "how": "Files the signed delivery report."}]}]}], "outcomes": ["Fewer vacancy days per turnover, because listing, viewings, screening, signing and payment run in one flow instead of across e-mail, Word and the bank", "Every new letting is rent-price compliant and documented, so Rent Tribunal reductions and Good Landlord Act fines are avoided", "Contracts are captured once as structured data, so indexation, settlements, break options and terminations run from the contract without re-keying"], "brickDependencies": [{"targetBrickId": "vacm", "type": "composition"}, {"targetBrickId": "objt", "type": "composition"}, {"targetBrickId": "cntr", "type": "composition"}, {"targetBrickId": "rela", "type": "composition"}, {"targetBrickId": "docm", "type": "composition"}, {"targetBrickId": "bank", "type": "composition"}, {"targetBrickId": "tenp", "type": "composition"}, {"targetBrickId": "rent", "type": "composition"}, {"targetBrickId": "wflw", "type": "composition"}, {"targetBrickId": "aiag", "type": "composition"}, {"targetBrickId": "svcc", "type": "composition"}, {"targetBrickId": "vatx", "type": "composition"}, {"targetBrickId": "dash", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "Huurprijscheck.app Rent-Price Check", "type": "compliance-partner", "interface": "WWS points calculation and maximum-rent API", "description": "Calculates the housing valuation system (WWS) points and the maximum legal rent of a dwelling so a letting is checked for rent-price compliance before the contract is issued."}, {"system": "E-mail, Push and SMS Gateway", "type": "messaging-gateway", "interface": "Transactional e-mail, app push and SMS", "description": "Delivers rent invoices, pre-notifications, reminders, ticket updates, meeting convocations and portal invitations to tenants, owners and suppliers."}, {"system": "Credit and Identity Check Providers", "type": "screening-provider", "interface": "Credit score, identity verification and income check APIs", "description": "Screening providers used during candidate selection to verify identity, income and payment history within the rules of the Good Landlord Act and GDPR."}, {"system": "E-Signing Provider", "type": "digital-signature-service", "interface": "Signature envelopes, signer authentication and status webhooks", "description": "Sends lease contracts, addenda and association documents for legally valid electronic signature and returns the signed PDF with its audit trail."}, {"system": "KvK Business Register", "type": "public-register", "interface": "KvK number lookup and company data API", "description": "Chamber of Commerce register used to validate business tenants, suppliers and legal entities and to register owners' associations."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []};

        const seen = new Set();
        const ordered = [];
        items.forEach(item => {

            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;

        <button class="tablinks" id="tab_links" onclick="openTab('links')">Links</button>
    </div>

    <div id="tab_content_home" class="tabcontent"></div>
    <div id="tab_content_flows" class="tabcontent"></div>
    <div id="tab_content_links" class="tabcontent"></div>


</div>

<script>
    function streamMetaPath(stream) {
        const parts = [];
        if (stream.group) {
            parts.push(stream.group);
        }
        if (stream.rootGroup && stream.rootGroup !== stream.group) {
            parts.push(stream.rootGroup);
        }
        if (!parts.length) {
            parts.push('Stream');
        }
        return parts.join(' / ');
    }

    let headerHtml = '<div class="nav-strip">';
    allStreams.forEach(item => {
        headerHtml += '<a class="nav-link" href="' + escapeHtml(item.id) + '.html">';
        headerHtml += '<img src="../icons/' + escapeHtml(item.icon || 'stream.png') + '" class="' + (item.id === currentStream.id ? 'tab-image-selected' : 'tab-image') + '" alt="" onerror="this.onerror=null;this.src=\'../icons/stream.png\'">';
        headerHtml += '</a>';
    });
    headerHtml += '</div>';

    headerHtml += '<div class="page">';
    headerHtml += '<div class="header">';
    headerHtml += '<img class="header-icon" src="../icons/' + escapeHtml(currentStream.icon || 'stream.png') + '" alt="" onerror="this.onerror=null;this.src=\'../icons/stream.png\'">';
    headerHtml += '<div>';
    headerHtml += '<div class="header-meta">';
    headerHtml += '<div class="page-type-badge">Stream</div>';
    headerHtml += escapeHtml(streamMetaPath(currentStream)) + ' / <span style="color:blue;font-weight:bold;">' + escapeHtml((currentStream.id || '').toUpperCase()) + '</span></div>';
    headerHtml += '<div class="header-title">' + escapeHtml(currentStream.name || currentStream.id) + '</div>';
    headerHtml += '<div class="header-copy">' + escapeHtml(currentStream.description || '') + '</div>';
    headerHtml += '</div></div></div>';
    document.getElementById('Header').innerHTML = headerHtml;

    function renderHome() {
        const flows = getFlows();
        const totalSteps = flows.reduce((count, flow) => count + ((flow.steps || []).length), 0);
        const primaryActors = getPrimaryActors();
        let html = '';

        html += '<div class="group"><div class="section-title">Flow Narratives (' + flows.length + ')</div>';
        if (!flows.length) {
            html += '<div class="muted">No flows listed for this stream.</div>';
        } else {
            html += '<div class="card-grid">';
            flows.forEach(flow => {
                const summary = summarizeFlow(flow);
                html += '<div class="card">';
                html += '<div class="card-meta">' + escapeHtml(streamMetaPath(currentStream)) + '</div>';
                html += '<div class="card-title">' + escapeHtml(flow.title || flow.id) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(flow.description || '') + '</div>';
                html += '<div class="muted">' + ((flow.steps || []).length) + ' steps</div>';
                if (summary.actor) {
                    html += '<div class="card-copy"><strong>Actor:</strong> ' + escapeHtml(summary.actor) + '</div>';
                }
                if (summary.trigger) {
                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Outcomes</div>';
        if (!(currentStream.outcomes || []).length) {
            html += '<div class="muted">No outcomes listed for this stream.</div>';
        } else {
            html += '<div class="card"><ul class="list">' + currentStream.outcomes.map(outcome => '<li>' + escapeHtml(outcome) + '</li>').join('') + '</ul></div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Supporting Product Bricks</div>';
        if (!related_bricks.length) {
            html += '<div class="muted">No linked product bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            related_bricks.forEach(brick => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../landing_pages/' + escapeHtml(brick.id) + '.html">';
                html += '<div class="card-meta">' + escapeHtml((brick.group || brick.domain || 'Product Brick')) + '</div>';
                html += '<div class="card-header">';
                html += '<img class="card-icon" src="../icons/' + escapeHtml(brick.id) + '.png" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
                html += '<div class="card-title">' + escapeHtml(brick.name || brick.id) + '</div>';
                html += '</div>';
                html += '<div class="card-copy">' + escapeHtml(brick.description || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Linked Products</div>';
        if (!linked_products.length) {
            html += '<div class="muted">No linked products were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            linked_products.forEach(product => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../../product-deployments/landing_pages/' + escapeHtml(product.id) + '.html">';
                html += '<div class="card-meta">' + escapeHtml(product.type || 'Product') + '</div>';
                html += '<div class="card-header">';
                html += '<img class="card-icon" src="../../product-deployments/icons/' + escapeHtml(product.icon) + '" alt="" onerror="this.onerror=null;this.src=\'../../product-deployments/icons/product.png\'">';
                html += '<div class="card-title">' + escapeHtml(product.name || product.id) + '</div>';
                html += '</div>';
                html += '<div class="card-copy">' + escapeHtml(product.whyUsed || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Related Teams</div>';
        if (!related_teams.length) {
            html += '<div class="muted">No teams were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            related_teams.forEach(team => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../../teams/landing_pages/' + escapeHtml(team.teamId) + '.html">';
                html += '<div class="card-meta">' + escapeHtml(team.roleLabel || team.teamType || 'Team') + '</div>';
                html += '<div class="card-title">' + escapeHtml(team.teamName || team.teamId) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(team.groupName || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Supported Customer Jobs</div>';
        if (!supported_jobs.length) {
            html += '<div class="muted">No customer jobs were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            supported_jobs.forEach(job => {
                html += '<div class="card">';
                html += '<div class="card-meta">' + escapeHtml(job.customerGroup || '') + (job.productName ? ' | ' + escapeHtml(job.productName) : '') + '</div>';
                html += '<div class="card-title">' + escapeHtml(job.jobName || job.jobId) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(job.jobOutcome || job.jobWhatItIs || '') + '</div>';
                if (job.supportRationale) {
                    html += '<div class="card-copy"><strong>Why this stream matters here:</strong> ' + escapeHtml(job.supportRationale) + '</div>';
                }
                if ((job.usedInSteps || []).length) {
                    html += '<ul class="list">' + job.usedInSteps.map(step => '<li>' + escapeHtml(step.step || step.description || '') + '</li>').join('') + '</ul>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        html += '</div>';

        document.getElementById('tab_content_home').innerHTML = html;
    }

    function renderFlows() {
        const flows = getFlows();
        const totalSteps = flows.reduce((count, flow) => count + ((flow.steps || []).length), 0);
        let html = '';

        document.getElementById('tab_flows').innerHTML = 'Flow Narratives (' + flows.length + ')';

        flows.forEach(flow => {
            const dependenciesInFlow = getFlowDependencies(flow);
            const summary = summarizeFlow(flow);
            html += '<div class="group">';
            html += '<div class="section-title">Flow</div>';
            html += '<div class="flow-title">' + escapeHtml(flow.title || flow.id) + '</div>';
            html += '<div class="flow-description">' + escapeHtml(flow.description || '') + '</div>';
            if (summary.actor || summary.trigger || summary.result) {
                html += '<div class="card" style="margin-bottom:16px;">';
                if (summary.actor) {
                    html += '<div class="card-copy"><strong>Primary actor:</strong> ' + escapeHtml(summary.actor) + '</div>';
                }
                if (summary.trigger) {
                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';
                }
                html += '</div>';
            }

            html += '<div class="section-title">Dependency Traceability</div>';
            html += '<div class="flow-matrix-wrap">';
            html += '<table class="flow-matrix">';
            html += '<thead>';
            html += '<tr><th class="flow-dependency-col"></th>';
            (flow.steps || []).forEach((step, index) => {
                html += '<th class="flow-step-col"><div class="flow-step-label">Step ' + (index + 1) + '</div><div class="card-title">' + escapeHtml(step.title || step.id) + '</div></th>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right">Key Facts</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkblue">';
                if ((step.keyFacts || []).length) {
                    html += '<ul class="flow-insight-list">' + step.keyFacts.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No key facts listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right; color: darkred">Pain Points</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkred">';
                if ((step.painPoints || []).length) {
                    html += '<ul class="flow-insight-list">' + step.painPoints.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No pain points listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';
            html += '</thead><tbody>';

            dependenciesInFlow.forEach(dependency => {
                const dependencyTypeLabel = 'Product Brick';
                html += '<tr>';
                html += '<td>';
                html += '<div class="flow-dependency-header">';
                html += renderFlowDependencyIcon(dependency, 'flow-dependency-icon');
                html += '<div>';
                html += '<a class="flow-dependency-name" href="../landing_pages/' + escapeHtml(dependency.id) + '.html">' + escapeHtml(dependency.name || dependency.id) + '</a>';
                if (dependency.interface) {
                    html += '<div class="muted">' + escapeHtml(dependency.interface) + '</div>';
                }
                html += '</div>';
                html += '</div>';
                html += '</td>';
                (flow.steps || []).forEach(step => {
                    const stepDependency = getStepDependency(step, dependency);
                    if (!stepDependency) {
                        html += '<td class="flow-cell-empty">-</td>';
                        return;
                    }
                    html += '<td class="flow-cell-active">';
                    html += '<div class="flow-cell-copy">' + escapeHtml(simplifySupportCopy(stepDependency.how || stepDependency.description || 'Supports this step.')) + '</div>';
                    html += '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            html += '</div>';
            html += '</div>';
        });

        document.getElementById('tab_content_flows').innerHTML = html;
    }

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';
        }
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-title">' + escapeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                count++;
                html += '<div class="link-entry">';
                html += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(link.link || '#') + '">'
                    + escapeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>


<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Real Estate ERP Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Streams Index"
    },
    {
      "label": "Let Units and Sign Contracts"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
