    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

jtbd-cg1-1", "jtbd-cg1-2"], "summary": "A Prime household shopper starts with a practical need, uses search and product trust signals to decide quickly, then expects fast delivery and easy issue resolution to justify repeat behavior.", "stages": [{"stage": "Trigger", "narrative": "The shopper realizes an item is needed quickly and defaults to Amazon because they expect the easiest path from intent to doorstep.", "media": [{"type": "image", "src": "media/journey-cg1-p1-cg1-p1-1-1.jpeg", "title": "Prime Household Shopper journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"Urgent household replenishment with Prime confidence\": Trigger."}]}, {"stage": "Discovery", "narrative": "The shopper rarely discovers Amazon itself; they rediscover it per purchase mission. When a household need appears, the realistic shortlist forms from habit and household context: the Amazon app already on their phone, a Walmart or Target run they could combine with errands, Instacart or a grocery app for same-day consumables, or the brand's own site if a promotion or loyalty program reaches them. Prime membership, remembered past deliveries, and price-comparison muscle memory decide whether Amazon even enters this mission's consideration set.", "media": [{"type": "image", "src": "media/journey-cg1-p1-cg1-p1-1-2.jpeg", "title": "Prime Household Shopper journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"Urgent household replenishment with Prime confidence\": Discovery."}]}, {"stage": "Evaluation", "narrative": "Before opening the app with intent to buy, the shopper weighs Amazon against the practical alternatives for this specific need: is Walmart or Target cheaper for this basket, would Instacart or a store trip get it home faster today, is the brand's own site more trustworthy for this category? The decision criteria are total landed price, credible delivery date versus urgency, confidence that reviews and listings are authentic for this product type, and how painless a return would be if the item disappoints. Amazon wins the mission when Prime speed plus return ease beat the best alternative on effort, not only on price.", "media": [{"type": "image", "src": "media/journey-cg1-p1-cg1-p1-1-3.jpeg", "title": "Prime Household Shopper journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"Urgent household replenishment with Prime confidence\": Evaluation."}]}, {"stage": "Trial", "narrative": "They place the order and immediately test whether checkout feels fast and the promised arrival window feels credible.", "media": [{"type": "image", "src": "media/journey-cg1-p1-cg1-p1-1-4.jpeg", "title": "Prime Household Shopper journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"Urgent household replenishment with Prime confidence\": Trial."}]}, {"stage": "Engagement", "narrative": "Order tracking, notifications, delivery speed, and any return or refund flow determine whether the experience feels reliably low effort.", "media": [{"type": "image", "src": "media/journey-cg1-p1-cg1-p1-1-5.jpeg", "title": "Prime Household Shopper journey stage 5: Engagement", "alt": "Enterprise journey panel for stage 5 of \"Urgent household replenishment with Prime confidence\": Engagement."}]}, {"stage": "Retention", "narrative": "Amazon earns the next order when the shopper feels the platform consistently saves time and protects them from bad purchase outcomes.", "media": [{"type": "image", "src": "media/journey-cg1-p1-cg1-p1-1-6.jpeg", "title": "Prime Household Shopper journey stage 6: Retention", "alt": "Enterprise journey panel for stage 6 of \"Urgent household replenishment with Prime confidence\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-cg1-p1-cg1-p1-1.jpeg", "title": "Prime Household Shopper customer journey: Urgent household replenishment with Prime confidence", "alt": "Enterprise journey storyboard for \"Urgent household replenishment with Prime confiden ery", "narrative": "Operators do not discover the marketplace; they discover the tooling and process that make this job survivable. Awareness comes through internal trust-program rollouts, escalation postmortems that expose gaps, peer trust-and-safety practice such as conference talks and regulator guidance like FTC INFORM material, and vendor pitches for external verification and detection services that get compared against building in-house.", "media": []}, {"stage": "Evaluation", "narrative": "Before adopting a new detection capability or workflow, the operator team evaluates it against the realistic alternatives: extending in-house risk models, buying a third-party verification or brand-protection service, or adding manual review headcount. The criteria are detection precision on historical cases, false-positive impact on legitimate sellers, evidence quality for appeals and regulators, integration with existing case tooling, and cost per reviewed case.", "media": []}, {"stage": "Trial", "narrative": "The cluster is worked as a case: sample test purchases confirm counterfeits, the linked accounts are mapped through shared identity and banking signals, and enforcement is staged so clear-cut accounts are suspended immediately while borderline sellers get listing-level suppression pending review.", "media": []}, {"stage": "Engagement", "narrative": "The operator coordinates outcomes: the brand sees takedown confirmations, wrongly swept sellers are reinstated through appeal within the SLA, refunds are triggered for affected orders, and the case evidence is packaged so an INFORM or DSA inquiry could be answered from the record.", "media": []}, {"stage": "Retention", "narrative": "The process earns trust when the postmortem shows the cluster was caught before measurable customer harm, appeal overturns stay rare, and the detection models absorb the new pattern \u2014 so the next cluster is caught earlier with less manual work.", "media": []}], "media": []}], "kpiPyramid     function topCustomerKpi(customer) {
        return (((customer || {}).kpiPyramids || {}).customerOutcomes || {}).top || null;
    }

    function formatCurrentValue(kpi) {
        if (!kpi || !kpi.currentValue) {
            return '';
        }
        return String(kpi.currentValue) + (kpi.unit ? ' (' + String(kpi.unit) + ')' : '');
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function customerLookup() {
        const lookup = {};
        customers.forEach(group => {
            group.customers.forEach(customer => {
                lookup[customer.id] = customer;
            });
        });
        return lookup;
    }

    function jobNamesForCustomer(customer, jobIds) {
        const jobs = ((customer || {}).jobsToBeDone || []);
        const jobLookup = {};
        jobs.forEach(job => {
            if (job.id) {
                jobLookup[job.id] = job.name || job.id;
            }
        });
        return (jobIds || []).map(jobId => jobLookup[jobId] || jobId);
    }

    function kpiLookupForCustomer(customer) {
        const lookup = {};
        function walk(node) {
            if (!node) return;
            if (node.id) {
                lookup[node.id] = node.name || node.id;
            }
            (node.branches || []).forEach(walk);
            (node.children || []).forEach(walk);
        }
        const pyramids = (customer || {}).kpiPyramids || {};
        ['customerOutcomes', 'businessOutcomes'].forEach(key => {
            const pyramid = pyramids[key];
            if (!pyramid) return;
            walk(pyramid.top);
            (pyramid.branches || []).forEach(walk);
        });
        return lookup;
    }

    function kpiNamesForCustomer(customer, link) {
        // Prefer stable KPI IDs; fall back to legacy display-name kpis.
        if (link && link.kpiIds && link.kpiIds.length) {
            const lookup = kpiLookupForCustomer(customer);
            return link.kpiIds.map(kpiId => lookup[kpiId] || kpiId);
        }
        return (link && link.kpis) || [];
    }

    function renderAttribute(iconFile, label, items) {
        if (!items || !items.length) return '';
        let html = '<div class="customer-attribute">';
        html += '<img class="customer-attribute-icon" src="icons/' + escapeHtml(iconFile) + '" onerror="this.onerror=null;this.src=\'icons/logo.png\'">';
        html += '<div class="customer-attribute-body">';
        html += '<div class="customer-attribute-label">' + escapeHtml(label) + '</div>';
        items.forEach(item => {
            html += '<div class="customer-attribute-item">' + escapeHtml(item) + '</div>';
        });
        html += '</div></div>';
        return html;
    }

    function customerMatchesSearch(customer, groupName, query) {
        if (!query) return true;
        const haystack = [customer.id, customer.name, customer.description, groupName]
            .concat(customer.careAbout || [], customer.winsThem || [], customer.theirFear || [])
            .filter(Boolean).join(' ').toLowerCase();
        return haystack.includes(query);
    }

    let customerUrlStateRestored = false;

    function renderCustomers() {
        const searchInput = document.getElementById('CustomerSearch');
        if (!customerUrlStateRestored) {
            customerUrlStateRestored = true;
            const initialQuery = new URLSearchParams(window.location.search).get('q');
            if (initialQuery && searchInput) searchInput.value = initialQuery;
        }
        const query = searchInput ? searchInput.value.trim().toLowerCase() : '';
        if (window.history && window.history.replaceState) {
            const params = new URLSearchParams(window.location.search);
            if (query) params.set('q', query); else params.delete('q');
            const qs = params.toString();
            window.history.replaceState({}, '', window.location.pathname + (qs ? '?' + qs : '') + window.location.hash);
        }
        let visible = 0;
        let total = 0;
        let html = '<div style="padding: 12px">';

        customers.forEach(group => {
            total += group.customers.length;
            const matching = group.customers.filter(customer => customerMatchesSearch(customer, group.group, query));
            visible += matching.length;
            if (!matching.length) return;
            html += '<div class="customer-group">';
            html += '<div class="customer-group-label">' + escapeHtml(group.group) + '</div>';
            matching.forEach(customer => {
                html += '<a target="_blank" href="landing_pages/' + escapeHtml(customer.id) + '.html">';
                html += '<div class="customer-card">';
                html += '<img class="customer-card-photo" src="icons/' + escapeHtml(customer.icon) + '" onerror="this.onerror=null;this.src=\'icons/customer.png\'">';
                html += '<div class="customer-card-name">' + escapeHtml(customer.name) + '</div>';
                const topKpi = topCustomerKpi(customer);
                if (topKpi && topKpi.name) {
                    html += '<div class="kpi-badge">';
                    html += '<div>KPI: ' + escapeHtml(topKpi.name) + '</div>';
                    html += '</div>';
                }
                html += renderAttribute('care.png', 'Care about', customer.careAbout);
                html += renderAttribute('win.png', 'Wins them', customer.winsThem);
                html += renderAttribute('fear.png', 'Their fear', customer.theirFear);
                html += '</div></a>';
            });
            html += '</div>';
        });

        html += '</div>';
        if (!visible) {
            html = '<div class="customer-search-empty">No customers match the current search.</div>';
        }
        document.getElementById('CustomerCards').innerHTML = html;
        const summary = document.getElementById('CustomerSearchSummary');
        if (summary) {
            summary.textContent = query ? `Showing ${visible} of ${total} customers` : '';
        }
    }

            const evType = insight.evidenceType || ((insight.sourceIds && insight.sourceIds.length) || (insight.sources && insight.sources.length) ? 'sourced' : 'assumption');
            const evStyles = {
                sourced: 'background:#e3f2e6;color:#1b5e20',
                assumption: 'background:#fdecea;color:#b71c1c',
                hypothesis: 'background:#fff4e5;color:#8a4b00',
                inferred: 'background:#eef2f7;color:#37474f'
            };
            const evLabels = { sourced: 'Sourced finding', assumption: 'Assumption', hypothesis: 'Hypothesis', inferred: 'Inferred strategy' };
            html += '<div style="margin-bottom:8px"><span style="font-size:75%;font-weight:bold;padding:2px 8px;border-radius:10px;' + (evStyles[evType] || evStyles.inferred) + '">' + escapeHtml(evLabels[evType] || evType) + '</span></div>';
            html += '<div class="insight-summary">' + escapeHtml(insight.summary) + '</div>';
            if (insight.implication) {
                html += '<div style="margin-bottom:12px"><b>Product implication:</b> ' + escapeHtml(insight.implication) + '</div>';
            }
            if (insight.validation) {
                const v = insight.validation;
                html += '<div style="margin-bottom:12px;padding:8px 10px;border-left:3px solid #8a4b00;background:#fff8ee">';
                html += '<div style="font-size:80%;font-weight:bold;color:#8a4b00;margin-bottom:4px">Validation path (high-assumption inference)</div>';
                if (v.researchQuestion) { html += '<div class="insight-source"><b>Open question:</b> ' + escapeHtml(v.researchQuestion) + '</div>'; }
                if (v.evidenceTarget) { html += '<div class="insight-source"><b>Evidence to gather:</b> ' + escapeHtml(v.evidenceTarget) + '</div>'; }
                if (v.wouldRaiseConfidenceIf) { html += '<div class="insight-source"><b>Would raise confidence if:</b> ' + escapeHtml(v.wouldRaiseConfidenceIf) + '</div>'; }
                html += '</div>';
            }
            if (insight.tags && insight.tags.length) {
                html += '<div style="margin-bottom:10px">';
                insight.tags.forEach(tag => {
                    html += '<span class="insight-tag">' + escapeHtml(tag) + '</span>';
                });
                html += '</div>';
            }
            if (insight.linkedCustomers && insight.linkedCustomers.length) {
                html += '<div style="margin-bottom:8px"><b>Connected customers:</b></div>';
                insight.linkedCustomers.forEach(link => {
                    const customer = lookup[link.customerId];
                    html += '<div class="insight-customer-link">';
                    if (customer) {
                        html += '<a target="_blank" href="landing_pages/' + escapeHtml(customer.id) + '.html" style="color:#315b7c;font-weight:bold">' + escapeHtml(customer.name) + '</a>';
                    } else {
                        html += '<span style="font-weight:bold">' + escapeHtml(link.customerId) + '</span>';
                    }
                    if (link.jobIds && link.jobIds.length) {
                        html += '<div class="insight-source"><b>Jobs:</b> ' + escapeHtml(jobNamesForCustomer(customer, link.jobIds).join(', ')) + '</div>';
                    }
                    const kpiNames = kpiNamesForCustomer(customer, link);
                    if (kpiNames.length) {
                        html += '<div class="insight-source"><b>KPIs:</b> ' + escapeHtml(kpiNames.join(', ')) + '</div>';
                    }
                    html += '</div>';
                });
            }
            if (insight.sources && insight.sources.length) {
                html += '<div><b>Sources:</b></div>';
                insight.sources.forEach(source => {
                    html += '<div class="insight-source">';
                    html += '<a target="_blank" href="' + escapeHtml(source.url) + '" style="color:#315b7c">' + escapeHtml(source.title) + '</a>';
                    html += ' <span style="color:#6b7280">(' + escapeHtml(source.publisher || '') + (source.date ? ', ' + escapeHtml(source.date) : '') + ')</span>';
                    html += '</div>';
                });
            }
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_insights').innerHTML = html;
    }

    function renderLinks() {
        const groups = (links.groups || []).filter(group => (group.links || []).length);

        if (!groups.length) {
            document.getElementById('tab_content_links').innerHTML = '<div style="padding:16px;color:#6b7280">No external links defined for this domain yet.</div>';
            return;
        }

        let html = '<div class="links-section">';
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-label">' + escapeHtml(group.group) + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            html += '<div class="links-grid">';
            (group.links || []).forEach(link => {
                html += '<a class="link-card" target="_blank" rel="noopener" href="' + escapeHtml(link.url) + '">';
                html += '<div class="link-title">' + escapeHtml(link.title) + '</div>';
                if (link.relevance) {
                    html += '<div class="link-relevance">' + escapeHtml(link.relevance) + '</div>';
                }
                if (link.tags && link.tags.length) {
                    html += '<div>';
                    link.tags.forEach(tag => {
                        html += '<span class="link-tag">' + escapeHtml(tag) + '</span>';
                    });
                    html += '</div>';
                }
                if (link.references && link.references.length) {
                    html += '<div style="margin-top:8px;font-size:72%;color:#6b7280">Grounds: ';
                    html += link.references.map(r => escapeHtml(r.label || (r.type + ':' + r.id))).join(' · ');
                    html += '</div>';
                }
                html += '</a>';
            });
            html += '</div></div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
    }

    update();
    renderInsights();
    renderLinks();
    updateTabLabels();
</script>
<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../start/index.html",
      "label": "Online Retail Marketplace Home"
    },
    {
      "label": "Customers"
    }
  ]
};
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
