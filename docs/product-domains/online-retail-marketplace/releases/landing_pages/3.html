    <style>

    <style>
        body {

        .entity-link {

        }

        .impact-header {

            margin-bottom: 8px;

        .impact-line {

        .pill {

            padding: 7px 11px;
            border-radius: 999px;
            background-color: #eef2f6;
            font-size: 13px;

        .linked-icon {
            width: 28px;
            height: 28px;
            object-fit: cover;
            border-radius: 50%;
            border: 1px solid #d7dce1;
            background-color: white;
        }

        .pill-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
            border-radius: 4px;
            border: 1px solid #d7dce1;
            background-color: white;
        }

        .pill-name {
            font-weight: bold;
            color: blue;

<script>
    const release = {"title": "AI-Assisted Discovery Quality Release", "date": "2026-05-16", "description": "Release focused on better broad-intent shopping resolution through search refinement, Rufus guidance, and stronger recommendation grounding.", "customerImpact": [{"customerId": "cg1-p1", "customer": {"id": "cg1-p1", "name": "Prime Household Shopper", "group": "Demand-Side Consumers", "icon": "shopper.png"}, "customerKPIs": [{"kpi": "Search-to-detail rate", "expectedImpact": "Increase the share of shopping sessions that reach a relevant product detail decision surface quickly.", "description": "", "unit": "", "currentValue": "", "link": "", "linkLabel": "", "kind": "customer"}, {"kpi": "Purchase confidence-adjusted order frequency", "expectedImpact": "Increase repeat orders by making product discovery less effortful.", "description": "Increase repeat order frequency among active Prime households to 3.8 orders per month without raising return regret.", "unit": "orders per active household per month", "currentValue": "4.9", "link": "https://dashboard.example.com/online-retail-marketplace/customers/cg1-p1/kpis/co-cg1-top", "linkLabel": "Open KPI dashboard", "kind": "customer"}], "businessKPIs": [{"kpi": "Prime paid retention", "expectedImpact": "Improve shopping habit strength through better first-session utility.", "description": "Keep paid Prime household retention above 93% in mature cohorts by making shopping and fulfillment habit-forming.", "unit": "% of paid Prime households", "currentValue": "91.3", "link": "https://dashboard.example.com/online-retail-marketplace/customers/cg1-p1/kpis/bo-cg1-top", "linkLabel": "Open KPI dashboard", "kind": "business"}]}], "productBricks": [{"brickId": "sear", "change": "Improve ranking and category refinement for broad-intent shopping.", "brick": {"id": "sear", "name": "Search, Browse & Facets", "type": "full-stack", "status": "invest", "description": "Search, browse, filters, category navigation, and ranking for broad and explicit shopping intent.", "links": [], "domain": "Shopper Experience", "group": "Discovery and evaluation", "layers": [{"layer": "ui", "description": "User-facing web, mobile, backoffice, and operator experience modules.", "modules": [{"id": "module-search-ui", "name": "Search UI", "type": "web-component", "description": "Keyword, browse, and filter shopping surface.", "dependencies": {"modules": [{"moduleId": "module-search-index-and-ranking", "type": "uses", "description": "UI module calls the brick API or backing service for this experience."}]}}]}, {"layer": "service", "description": "Stateful services and domain service modules that own behavior, policy, workflow, data, or operations.", "modules": [{"id": "module-search-index-and-ranking", "name": "Search index and ranking", "type": "service", "description": "Indexes catalog entities and ranks offer relevance."}]}], "dataDependencies": [{"assetId": "search-browse-facets", "moduleIds": ["module-search-index-and-ranking"], "role": "own", "description": "Acts as the primary owning brick for Search Browse Facets."}], "brickDependencies": [{"targetBrickId": "list", "moduleId": "module-catalog-authoring-pipeline", "sourceModuleId": "module-search-index-and-ranking", "type": "data", "description": "Depends on normalized product attributes and category content."}], "externalSystemsThisBrickDependsOn": [], "externalSystemsDependingOnThisBrick": [], "icon": "sear.png"}}, {"brickId": "rufu", "change": "Improve assistant grounding and product comparison responses.", "brick": {"id": "rufu", "name": "AI Shopping Assistant", "type": "full-stack", "status": "invest", "description": "Conversational and guided shopping assistance that clarifies product tradeoffs and helps shoppers narrow broad intent.", "links": [], "domain": "Shopper Experience", "group": "Discovery and evaluation", "layers": [{"layer": "ui", "description": "User-facing web, mobile, backoffice, and operator experience modules.", "modules": [{"id": "module-assistant-conversation-ui", "name": "Assistant conversation UI", "type": "web-component", "description": "In-session guided shopping interaction.", "dependencies": {"modules": [{"moduleId": "module-intent-interpretation-and-grounding", "type": "uses", "description": "UI module calls the brick API or backing service for this experience."}]}}]}, {"layer": "service", "description": "Stateful services and domain service modules that own behavior, policy, workflow, data, or operations.", "modules": [{"id": "module-intent-interpretation-and-grounding", "name": "Intent interpretation and grounding", "type": "service", "description": "Transforms natural-language shopping questions into catalog-aware comparisons and suggestions."}]}], "dataDependencies": [{"assetId": "customer-contact-point", "moduleIds": ["module-intent-interpretation-and-grounding"], "role": "read", "description": "Reads Customer Contact Point to support domain workflows."}, {"assetId": "audit-log", "moduleIds": ["module-intent-interpretation-and-grounding"], "role": "publish", "description": "Publishes events or audit records related to Audit Log."}], "brickDependencies": [{"targetBrickId": "sear", "moduleId": "module-search-index-and-ranking", "sourceModuleId": "module-intent-interpretation-and-grounding", "type": "composition", "description": "Uses ranked catalog results and attribute data."}, {"targetBrickId": "pdet", "moduleId": "module-offer-and-content-assembly", "sourceModuleId": "module-intent-interpretation-and-grounding", "type": "context", "description": "Uses product content and offer context for grounded assistance."}], "externalSystemsThisBrickDependsOn": [], "externalSystemsDependingOnThisBrick": [], "icon": "rufu.png"}}, {"brickId": "reco", "change": "Improve recommendation quality on entry and detail surfaces.", "brick": {"id": "reco", "name": "Personalization & Recommendations", "type": "full-stack", "status": "sustaining", "description": "Personalized merchandising, replenishment suggestions, and recirculation logic across shopping surfaces.", "links": [], "domain": "Marketplace Foundations", "group": "Shared intelligence and integration", "layers": [{"layer": "interfaces", "description": "APIs, BFFs, and explicit service boundary interfaces exposed to clients or other systems.", "modules": [{"id": "module-recommendation-apis", "name": "Recommendation APIs", "type": "api", "description": "Recommendation interfaces for home and detail surfaces.", "dependencies": {"modules": [{"moduleId": "module-recommendation-model-serving", "type": "delegates", "description": "Interface module delegates request handling to the backing service layer."}]}}]}, {"layer": "service", "description": "Stateful services and domain service modules that own behavior, policy, workflow, data, or operations.", "modules": [{"id": "module-recommendation-model-serving", "name": "Recommendation model serving", "type": "service", "description": "Serves personalized product and category suggestions."}]}], "dataDependencies": [{"assetId": "transaction", "moduleIds": ["module-recommendation-model-serving"], "role": "read", "description": "Reads Transaction to support domain workflows."}, {"assetId": "search-browse-facets", "moduleIds": ["module-recommendation-model-serving"], "role": "read", "description": "Reads Search Browse Facets to support domain workflows."}], "brickDependencies": [{"targetBrickId": "anal", "moduleId": "module-measurement-apis", "sourceModuleId": "module-recommendation-model-serving", "type": "insight", "description": "Uses shared behavior and experiment signals."}], "externalSystemsThisBrickDependsOn": [], "externalSystemsDependingOnThisBrick": [], "icon": "reco.png"}}], "deliveryChannels": [{"channelId": "ios-app-store", "change": "Roll out updated shopping assistant and search treatments to iOS.", "channel": {"productId": "ios", "productName": "", "name": "ios-app-store", "type": "product", "icon": "product.png"}}, {"channelId": "android-play-store", "change": "Roll out updated shopping assistant and search treatments to Android.", "channel": {"productId": "android", "productName": "", "name": "android-play-store", "type": "product", "icon": "product.png"}}], "teams": {"primaryTeamIds": ["shopping-discovery"], "supportingTeamIds": ["commerce-intelligence", "trust-and-identity"]}, "initiativeId": "initiative-online-retail-marketplace-2026-04-15-01", "landingPageIndex": 3, "objectiveLandingPageUrl": ""};
    const domainName = 'Online Retail Marketplace';

    function formatDate(dateValue) {
        if (!dateValue) return 'No date';
        const date = new Date(dateValue + 'T00:00:00');
        if (isNaN(date.getTime())) return dateValue;
        return date.toLocaleDateString('en-GB', {year: 'numeric', month: 'short', day: 'numeric'});
    }

    function escapeHtml(value) {
        return (value || '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function linkOf(href, label, className) {
        if (!href) return '<span class="' + className + '">' + escapeHtml(label) + '</span>';
        return '<a class="entity-link ' + className + '" href="' + escapeHtml(href) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(label) + '</a>';
    }

    function renderImpactLines(items) {
        let html = '';
        items.forEach(item => {
            html += '<div class="impact-line"><b>' + escapeHtml(item.kpi) + '</b>';
            if (item.unit) {
                html += ' <span style="color:#6b7280">(' + escapeHtml(item.unit) + ')</span>';
            }
            html += ': ' + escapeHtml(item.expectedImpact);
            if (item.description) {
                html += '<div style="color:#6b7280; font-size:12px; margin-top:2px">' + escapeHtml(item.description) + '</div>';
            }
            html += '</div>';
        });
        return html;
    }

    document.getElementById('Title').innerHTML = escapeHtml(release.title || release.description || 'Release');
    document.getElementById('Meta').innerHTML = escapeHtml(domainName) + ' | ' + escapeHtml(formatDate(release.date));

    let html = '';
    if (release.description) {
        html += '<div class="section"><div class="section-title">Description</div><div class="description">' + escapeHtml(release.description) + '</div></div>';
    }

    if (release.customerImpact && release.customerImpact.length) {
        html += '<div class="section"><div class="section-title">Customer Impact</div>';
        release.customerImpact.forEach(impact => {
            html += '<div class="impact-block">';
            html += '<div class="impact-header">';
            html += '<img class="linked-icon" src="../../customers/icons/' + escapeHtml(impact.customer.icon) + '" onerror="this.onerror=null;this.src=\'../../customers/icons/customer.png\'">';
            html += '<div class="impact-id">' + linkOf('../../customers/landing_pages/' + impact.customer.id + '.html', impact.customer.name, '') + ' <span style="color:#6b7280; font-weight:normal">(' + escapeHtml(impact.customerId) + ')</span></div>';
            html += '</div>';
            html += renderImpactLines(impact.customerKPIs || []);
            html += renderImpactLines(impact.businessKPIs || []);
            html += '</div>';
        });
        html += '</div>';
    }

    if (release.productBricks && release.productBricks.length) {
        html += '<div class="section"><div class="section-title">Product Bricks</div>';
        release.productBricks.forEach(brick => {
            html += '<div class="pill"><img class="pill-icon" src="../../product-bricks/icons/' + escapeHtml(brick.brick.icon) + '" onerror="this.onerror=null;this.src=\'../../product-bricks/icons/logo.png\'"><div><div class="pill-name">' + linkOf('../../product-bricks/landing_pages/' + brick.brickId + '.html', brick.brick.name, 'pill-name') + ' <span class="pill-meta">(#' + escapeHtml(brick.brickId) + ')</span></div><div>' + escapeHtml(brick.change) + '</div></div></div>';
        });
        html += '</div>';
    }

    if (release.deliveryChannels && release.deliveryChannels.length) {
        html += '<div class="section"><div class="section-title">Delivery Channels</div>';
        release.deliveryChannels.forEach(channel => {
            html += '<div class="pill"><img class="pill-icon" src="../../product-deployments/icons/' + escapeHtml(channel.channel.icon) + '" onerror="this.onerror=null;this.src=\'../../product-deployments/icons/product.png\'"><div><div class="pill-name">' + linkOf('../../product-deployments/landing_pages/' + channel.channel.productId + '.html', channel.channel.name, 'pill-name') + ' <span class="pill-meta">(' + escapeHtml(channel.channelId) + ')</span></div><div>' + escapeHtml(channel.change) + '</div></div></div>';
        });
        html += '</div>';
    }

    document.getElementById('Content').innerHTML = html;
</script>
<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Online Retail Marketplace Home"
    },
    {
      "link": "../index.html",
      "label": "Releases"
    },
    {
      "label": "AI-Assisted Discovery Quality Release"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
