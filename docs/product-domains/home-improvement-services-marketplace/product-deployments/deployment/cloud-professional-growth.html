<script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

    const channelRef = "public-cloud/cloud-professional-growth";

    function escapeHtml(value) {
        return String(value || '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function deploymentIconFile(channel, group) {
        const text = [
            group && group.groupId,
            group && group.groupName,
            channel && channel.subChannelId,
            channel && channel.subChannelName,
            channel && channel.channelType
        ].join(' ').toLowerCase();

        if (text.includes('ios')) return 'app_store_ios.png';
        if (text.includes('android') || text.includes('play store') || text.includes('play-store')) return 'app_store_android.png';
        if (text.includes('private cloud') || text.includes('private-cloud')) return 'private_cloud.png';
        if (text.includes('cloud') || text.includes('runtime') || text.includes('edge') || text.includes('cdn')) return 'public_cloud.png';
        if (text.includes('saas') || text.includes('analytics') || text.includes('crm') || text.includes('datadog') || text.includes('snowflake') || text.includes('databricks') || text.includes('salesforce')) return 'saas.png';
        return 'deployment.png';
    }

    function interfaceIconFile(iface) {
        const text = [iface && iface.type, iface && iface.name].join(' ').toLowerCase();
        if (text.includes('partner_api')) return 'partner_api.png';
        if (text.includes('public_api') || text.includes('public api')) return 'public_api.png';
        if (text.includes('api')) return 'api.png';
        if (text.includes('mobile web')) return 'mobile_web.png';
        if (text.includes('mobile') || text.includes('app')) return 'mobile_app.png';
        if (text.includes('dashboard') || text.includes('cockpit')) return 'dashboard.png';
        if (text.includes('notification')) return 'notification.png';
        if (text.includes('search')) return 'search_engine.png';
        if (text.includes('social')) return 'social_media.png';
        return 'web.png';
    }

    function buildDeploymentChannelRecords() {
        const records = [];
        (deployment.channels || []).forEach(group => {
            (group.channels || []).forEach(channel => {
                records.push({
                    ref: (group.groupId || '') + '/' + (channel.subChannelId || ''),
                    group: group,
                    channel: channel
                });
            });
        });
        return records;
    }

    function findCurrentRecord() {
        return buildDeploymentChannelRecords().find(record => record.ref === channelRef) || null;
    }

    // Bricks live directly on a channel (subchannel): channel.deployedBricks.
    function channelDeployedBricks(channel) {
        return (channel && channel.deployedBricks) || [];
    }

    function buildChannelProductUsage(record) {
        // Derive products from this channel's deployedBricks[].usedInProducts.
        const productLookup = {};
        ((products.portfolio || {}).products || []).forEach(product => {
            productLookup[product.id] = product;
        });
        const byProduct = {};
        channelDeployedBricks(record.channel).forEach(brick => {
            (brick.usedInProducts || []).forEach(use => {
                const pid = use.productId;
                if (!pid) return;
                if (!byProduct[pid]) {
                    const product = productLookup[pid] || {};
                    byProduct[pid] = {
                        id: pid,
                        name: product.name || pid,
                        icon: product.icon || 'product.png',
                        brickCount: 0
                    };
                }
                byProduct[pid].brickCount += 1;
            });
        });
        return Object.values(byProduct).sort((left, right) => left.name.localeCompare(right.name));
    }

    function renderChip(iconPath, fallbackPath, title, copy, href) {
        let html = '';
        if (href) html += '<a href="' + href + '" target="_blank">';
        html += '<div class="chip">';
        html += '<img class="chip-icon" src="' + iconPath + '" alt="' + escapeHtml(title) + '" onerror="this.onerror=null;this.src=\'' + fallbackPath + '\'">';
        html += '<div><div class="chip-title">' + escapeHtml(title) + '</div>';
        if (copy) html += '<div class="chip-copy">' + escapeHtml(copy) + '</div>';
        html += '</div></div>';
        if (href) html += '</a>';
        return html;
    }

            navHtml += '<img class="channel-nav-icon" src="../icons/deployment/' + fileName + '" alt="' + escapeHtml(record.channel.subChannelName || record.channel.subChannelId || 'Deployment channel') + '" onerror="this.onerror=null;this.src=\'../icons/deployment/deployment.png\'">';
            navHtml += '</a>';
        });
        navHtml += '</div>';

        header += '<div>';
        header += '<div class="page-type-badge" style="margin-top: 8px;">Deployment Channel</div>';
        header += '<div class="chip-copy">' + escapeHtml(current.group.groupName || current.group.groupId || '') + ' · ' + escapeHtml(current.channel.channelType || 'channel') + '</div>';
        header += '<div class="hero-title">' + escapeHtml(current.channel.subChannelName || current.channel.subChannelId || 'Deployment channel') + '</div>';
        if (current.channel.description) {

        header += '</div>';

    function renderHome() {
        const current = findCurrentRecord();
        const container = document.getElementById('tab_content_HomeTab');
        if (!current) {
            container.innerHTML = '<div class="empty-state">Deployment channel not found.</div>';
            return;
        }

        const productUsage = buildChannelProductUsage(current);
        const deployedBricks = channelDeployedBricks(current.channel);

        let html = '';

        const intro = [deployment.metadata && deployment.metadata.description, current.group.description, current.channel.description].filter(Boolean).join(' ');
        if (intro) html += '<div class="deployment-copy">' + escapeHtml(intro) + '</div>';

        html += '<div class="deployment-section-title">Deployed Bricks (' + deployedBricks.length + ')</div>';
        if (deployedBricks.length) {
            html += '<div class="chip-row">';
            deployedBricks.forEach(brick => {
                const productCount = (brick.usedInProducts || []).length;
                const meta = [brick.deploymentRole || '', productCount ? 'Used in ' + productCount + (productCount === 1 ? ' product' : ' products') : ''].filter(Boolean).join(' · ');
                html += renderChip('../../product-bricks/icons/' + escapeHtml(brick.brickId) + '.png', '../../product-bricks/icons/logo.png', brick.brickName || brick.brickId || 'Product brick', meta, '../../product-bricks/landing_pages/' + escapeHtml(brick.brickId) + '.html');
            });
            html += '</div>';
        } else {
            html += '<div class="empty-state">No bricks deployed in this channel.</div>';
        }

        html += '<div class="deployment-section-title">Products Using This Channel (' + productUsage.length + ')</div>';
        if (productUsage.length) {
            html += '<div class="chip-row">';
            productUsage.forEach(product => {
                const meta = product.brickCount + (product.brickCount === 1 ? ' brick' : ' bricks');
                html += renderChip('../icons/' + escapeHtml(product.icon), '../icons/product.png', product.name, meta, '../landing_pages/' + escapeHtml(product.id) + '.html');
            });
            html += '</div>';
        } else {
            html += '<div class="empty-state">No products currently reference this channel.</div>';
        }

        html += '<div class="deployment-section-title">Brick to Product Dependencies</div>';
        html += '<div class="bpd-layout">';
        html += '<div class="bpd-controls" id="BpdControls"></div>';
        html += '<div class="bpd-graph" id="BpdGraph"></div>';
        html += '</div>';

        container.innerHTML = html;
        renderBrickProductDependencies(current);
    }

    // --- Brick -> Product dependency diagram (mermaid) ---
    let bpdSelected = null; // Set of selected node ids (null = all)

    function bpdNodes(record) {
        const productLookup = {};
        ((products.portfolio || {}).products || []).forEach(product => { productLookup[product.id] = product; });
        const bricks = [];
        const productMap = {};
        const edges = [];
        channelDeployedBricks(record.channel).forEach(brick => {
            const uses = (brick.usedInProducts || []).filter(use => productLookup[use.productId]);
            if (!uses.length) return;
            const brickNodeId = 'brick:' + brick.brickId;
            bricks.push({id: brickNodeId, name: brick.brickName || brick.brickId, type: 'brick'});
            uses.forEach(use => {
                const product = productLookup[use.productId];
                const productNodeId = 'product:' + product.id;
                if (!productMap[productNodeId]) {
                    productMap[productNodeId] = {id: productNodeId, name: product.name || product.id, type: 'product'};
                }
                edges.push({source: brickNodeId, target: productNodeId});
            });
        });
        // dedupe brick nodes (a brick appears once)
        const seen = {};
        const brickNodes = bricks.filter(n => seen[n.id] ? false : (seen[n.id] = true));
        return {bricks: brickNodes, products: Object.values(productMap), edges: edges};
    }

    function bpdAllNodeIds(model) {
        return model.bricks.concat(model.products).map(n => n.id);
    }

    function bpdIsSelected(id) {
        return bpdSelected === null || bpdSelected.has(id);
    }

    function renderBrickProductDependencies(record) {
        const model = bpdNodes(record);
        if (bpdSelected === null) {
            bpdSelected = new Set(bpdAllNodeIds(model));
        }
        renderBpdControls(model);
        renderBpdGraph(model);
    }

    function renderBpdControls(model) {
        const groups = [
            {label: 'Bricks', color: '#059669', nodes: model.bricks.slice().sort((a, b) => a.name.localeCompare(b.name))},
            {label: 'Products', color: '#ea580c', nodes: model.products.slice().sort((a, b) => a.name.localeCompare(b.name))}
        ];
        let html = '<div class="bpd-actions">' +
            '<button type="button" class="pdg-action" onclick="setAllBpdNodes(true)">Show all</button>' +
            '<button type="button" class="pdg-action" onclick="setAllBpdNodes(false)">Hide all</button>' +
            '</div><div class="bpd-checklist">';
        groups.forEach(group => {
            if (!group.nodes.length) return;
            html += '<div class="pdg-type-header">' + escapeHtml(group.label) + ' (' + group.nodes.length + ')</div>';
            group.nodes.forEach(node => {
                html += '<label class="pdg-check-item node" title="' + escapeHtml(node.name) + '">' +
                    '<input type="checkbox" value="' + escapeHtml(node.id) + '"' + (bpdIsSelected(node.id) ? ' checked' : '') + ' onchange="toggleBpdNode(this.value, this.checked)">' +
                    '<span class="pdg-swatch" style="background-color:' + group.color + '"></span>' +
                    '<span class="label">' + escapeHtml(node.name) + '</span>' +
                    '</label>';
            });
        });
        html += '</div>';
        document.getElementById('BpdControls').innerHTML = html;
    }

    function toggleBpdNode(id, checked) {
        if (bpdSelected === null) {
            bpdSelected = new Set(bpdAllNodeIds(bpdNodes(findCurrentRecord())));
        }
        if (checked) { bpdSelected.add(id); } else { bpdSelected.delete(id); }
        renderBpdGraph(bpdNodes(findCurrentRecord()));
    }

    function setAllBpdNodes(selected) {
        const model = bpdNodes(findCurrentRecord());
        bpdSelected = selected ? new Set(bpdAllNodeIds(model)) : new Set();
        renderBpdControls(model);
        renderBpdGraph(model);
    }

    function bpdMermaidId(value) {
        return 'n_' + String(value).replace(/[^a-zA-Z0-9_]/g, '_');
    }

    function bpdMermaidLabel(value) {
        return String(value || '')
            .replaceAll('&', 'and').replaceAll('"', '').replaceAll("'", '')
            .replaceAll('<', '').replaceAll('>', '')
            .replaceAll('[', '(').replaceAll(']', ')')
            .replaceAll('{', '(').replaceAll('}', ')').replaceAll('|', '/');
    }

    function renderBpdGraph(model) {
        const container = document.getElementById('BpdGraph');
        if (!container) return;
        const bricks = model.bricks.filter(n => bpdIsSelected(n.id));
        const productsSel = model.products.filter(n => bpdIsSelected(n.id));
        const visible = new Set(bricks.concat(productsSel).map(n => n.id));
        const edges = model.edges.filter(e => visible.has(e.source) && visible.has(e.target));

        if (typeof mermaid === 'undefined') {
            container.innerHTML = '<div class="empty-state">Diagram library failed to load.</div>';
            return;
        }
        if (!bricks.length || !productsSel.length || !edges.length) {
            container.innerHTML = '<div class="empty-state">Select bricks and products that share dependencies to render the diagram.</div>';
            return;
        }

        let chart = 'flowchart LR\n\n';
        // Bricks grouped in one unnamed subgraph.
        chart += 'subgraph bpdBricks [" "]\n';
        bricks.forEach(node => { chart += bpdMermaidId(node.id) + '["' + bpdMermaidLabel(node.name) + '"]\n'; });
        chart += 'end\n';
        productsSel.forEach(node => { chart += bpdMermaidId(node.id) + '["' + bpdMermaidLabel(node.name) + '"]\n'; });
        edges.forEach(edge => { chart += bpdMermaidId(edge.source) + ' --> ' + bpdMermaidId(edge.target) + '\n'; });
        chart += 'classDef brickCls fill:#dcfce7,stroke:#059669,color:#065f46,stroke-width:2px;\n';
        chart += 'classDef productCls fill:#ffedd5,stroke:#ea580c,color:#7c2d12,stroke-width:2px;\n';
        const brickIds = bricks.map(n => bpdMermaidId(n.id));
        const productIds = productsSel.map(n => bpdMermaidId(n.id));
        if (brickIds.length) chart += 'class ' + brickIds.join(',') + ' brickCls;\n';
        if (productIds.length) chart += 'class ' + productIds.join(',') + ' productCls;\n';

        const renderId = 'bpd-mermaid-' + (bpdRenderCounter++);
        Promise.resolve(mermaid.render(renderId, chart)).then(result => {
            container.innerHTML = result.svg;
        }).catch(() => {
            container.innerHTML = '<div class="empty-state">Unable to render the dependency diagram.</div>';
        });
    }
    let bpdRenderCounter = 0;
</script>

        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>

</body>
</html>
