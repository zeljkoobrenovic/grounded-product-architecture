    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

-home-care-in-europe.html", "publisher": "Evondos Group", "date": "2023-02-02"}, {"id": "jbi-ahmd", "title": "Automated home medication dispensers (Medido adherence outcomes)", "url": "https://jbi.global/news/article/automated-home-medication-dispensers", "publisher": "JBI / Leiden scholarly publication", "date": "2022-01-01"}, {"id": "oecd-ltc-2024", "title": "Is Care Affordable for Older People? (long-term care spending and home-care share)", "url": "https://www.oecd.org/en/publications/is-care-affordable-for-older-people_450ea778-en.html", "publisher": "OECD", "date": "2024-01-01"}, {"id": "bruegel-ltc", "title": "Prepare now: Europe must get ready for the coming long-term care surge", "url": "https://www.bruegel.org/policy-brief/prepare-now-europe-must-get-ready-coming-long-term-care-surge", "publisher": "Bruegel (citing European Commission / OECD)", "date": "2024-01-01"}], "items": [{"id": "dmm-01", "title": "Automated dispensing sustains ~99% medication adherence in home care", "summary": "In the peer-reviewed Rantanen pilot, home-dwelling elderly patients retrieved their medicine sachets for 99% of alerts, and Evondos reports ~99\u201399.5% adherence at scale across its deployed base.", "implication": "Adherence is the domain's north-star and is achievable and defensible with a closed-loop dispense-confirm-escalate design \u2014 but the value depends on the missed-dose safety net, not the dispenser alone.", "priority": "high", "tags": ["adherence", "clinical-evidence", "outcomes"], "sourceIds": ["rantanen-2017", "evondos-ceo-2025"], "linkedCustomers": [{"customerId": "pati", "jobIds": ["live-independently"], "kpis": ["Medication Adherence Rate", "Dose Confirmation Rate"]}, {"customerId": "caom", "jobIds": ["prove-value"], "kpis": ["Medication Adherence Rate", "Adverse Medication Events Avoided"]}], "sources": [{"id": "rantanen-2017", "title": "An In-home Advanced Robotic System to Manage Elderly Home-care Patients' Medications: A Pilot Safety and Usability Study", "url": "https://www.clinicaltherapeutics.com/article/S0149-2918(17)30179-6/fulltext", "publisher": "Clinical Therapeutics 39(5):1054-1061 (Rantanen et al.)", "date": "2017-05-01"}, {"id": "evondos-ceo-2025", "title": "Evondos appoints Frans Cromme as CEO to lead next phase of international growth and portfolio expansion", "url": "https://www.evondos.com/news/evondos-appoints-frans-cromme-as-ceo-to-lead-next-phase-of-international-growth-and-portfolio-expansion", "publisher": "Evondos Group", "date": "2025-08-18"}]}, {"id": "dmm-02", "title": "The safety net is the missed-dose lock-and-escalate loop, not the dispenser", "summary": "After repeated reminders an untaken dose is locked back inside the cabinet and an alert is sent to care staff or next of kin, converting a potential error into a managed exception.", "implication": "Missed-Dose Alarm Response Time and Alarm Resolution Rate are as important as raw dispensing accuracy; alarm quality and routing directly drive both patient safety and nurse trust.", "priority": "high", "tags": ["safety", "alarms", "escalation"], "sourceIds": ["evondos-howitworks", "rantanen-2017"], "linkedCustomers": [{"customerId": "pati", "jobIds": ["stay-safe"], "kpis": ["Missed-Dose Alarm Response Time", "Safe Days at Home"]}, {"customerId": "nurs", "jobIds": ["respond-alarms"], "kpis": ["Missed-Dose Alarm Response Time", "Alarm Resolution Rate"]}], "sources": [{"id": "evondos-howitworks", "title": "Evondos \u2014 How the medicine dispensing service works", "url": "https://www.evondos.co.uk/our-service/how-it-works", "publisher": "Evondos UK", "date": "2025-01-01"}, {"id": "rantanen-2017", "title": "An In-home Advanced Robotic System to Manage Elderly Home-care Patients' Medications: A Pilot Safety and Usability Study", "url": "https://www.clinicaltherapeutics.com/article/S0149-2918(17)30179-6/fulltext", "publisher": "Clinical Therapeutics 39(5):1054-1061 (Rantanen et al.)", "date": "2017-05-01"}]}, {"id": "dmm-03", "title": "Remote  "implication": "Pouch supply reliability and order-to-dispense reconciliation are a distinct value chain; the pharmacy partner and pouch logistics are a first-class part of the service, and prescription changes must flow safely into packing.", "priority": "medium", "tags": ["pharmacy", "logistics", "supply-chain"], "sourceIds": ["evondos-howitworks"], "linkedCustomers": [{"customerId": "phar", "jobIds": ["fulfil-pouches", "integrate-orders"], "kpis": ["Pouch Order Accuracy", "Pouch Fulfillment Lead Time"]}], "sources": [{"id": "evondos-howitworks", "title": "Evondos \u2014 How the medicine dispensing service works", "url": "https://www.evondos.co.uk/our-service/how-it-works", "publisher": "Evondos UK", "date": "2025-01-01"}]}, {"id": "dmm-07", "title": "Video-assisted medication extends the service to higher-acuity patients", "summary": "The device now includes an integrated screen and two-way camera (VideoMed); in assisted mode staff can release medication and watch it being taken, and Medido data shows adherence rising from 49% to 97% after six months with automated dispensing.", "implication": "Video support widens the addressable population beyond self-sufficient patients and is a natural premium add-on that lifts Revenue per Care Organization and Safe Days at Home.", "priority": "medium", "tags": ["video", "assisted-mode", "expansion"], "sourceIds": ["evondos-about", "jbi-ahmd"], "linkedCustomers": [{"customerId": "pati", "jobIds": ["stay-safe"], "kpis": ["Safe Days at Home"]}, {"customerId": "nurs", "jobIds": ["respond-alarms"], "kpis": ["Alarm Resolution Rate"]}], "sources": [{"id": "evondos-about", "title": "Evondos \u2014 About Us (company history, certifications, milestones)", "url": "https://www.evondos.com/about-us", "publisher": "Evondos Group", "date": "2025-01-01"}, {"id": "jbi-ahmd", "title": "Automated home medication dispensers (Medido adherence outcomes)", "url": "https://jbi.global/news/article/automated-home-medication-dispensers", "publisher": "JBI / Leiden scholarly publication", "date": "2022-01-01"}]}, {"id": "dmm-08", "title": "Aging populations and home-care shift are the structural tailwind", "summary": "EU residents needing long-term care rise from 30.8M (2019) to 38.1M (2050), and 69% of OECD formal long-term-care recipients are already cared for at home; Nordic systems are heavily public-funded, which makes municipality-funded device programmes viable.", "implication": "Demand is driven by a workforce squeeze meeting rising need, so the buyer's core problem is capacity \u2014 reinforcing Home Visits Avoided per Device and Cost-to-Serve per Device as the economic engine of the domain.", "priority": "medium", "tags": ["market", "demographics", "home-care"], "sourceIds": ["bruegel-ltc", "oecd-ltc-2024"], "linkedCustomers": [{"customerId": "caom", "jobIds": ["deploy-service"], "kpis": ["Cost-to-Serve per Device", "Home Visits Avoided per Device"]}], "sources": [{"id": "bruegel-ltc", "title": "Prepare now: Europe must get ready for the coming long-term care surge", "url": "https://www.bruegel.org/policy-brief/prepare-now-europe-must-get-ready-coming-long-term-care-surge", "publisher": "Bruegel (citing European Commission / OECD)", "date": "2024-01-01"}, {"id": "oecd-ltc-2024", "title": "Is Care Affordable for Older People? (long-term care spending and home-care share)", "url": "https://www.oecd.org/en/publications/is-care-affordable-for-older-people_450ea778-en.html", "publisher": "OECD", "date": "2024-01-01"}]}, {"id": "dmm-09", "title": "Growth and consolidation: Verdane backing and European roll-up", "summary": "Verdane became majority owner in 2020; Evondos secured a \u20ac42M BlackRock private-credit facility in 2022, acquired Dutch leader Medido in 2023 and Vitacam vitals-monitoring in 2024, and entered the UK in 2025 \u2014 with standalone revenue growing from \u20ac9.0M (2020) to \u20ac23.3M (2023), still investing ahead of profit.", "implication": "The strategy is a European roll-up moving f     const links = {"domainId": "digital-medication-management", "updated": "2026-07-04", "groups": [{"group": "Product surfaces", "description": "How the modeled service works and what each side actually uses.", "links": [{"title": "Evondos \u2014 How the medicine dispensing service works", "url": "https://www.evondos.co.uk/our-service/how-it-works", "relevance": "The canonical end-to-end description of the dispense-confirm-lock-escalate loop this domain models.", "tags": ["patient", "service"]}, {"title": "Evondos medicine dispensing robot (device)", "url": "https://www.evondos.co.uk/evondos-medicine-dispensing-robot", "relevance": "Describes the locked device, two-sachet-roll capacity, prompts, and confirmation button that anchor the dispensing bricks.", "tags": ["device", "patient"]}, {"title": "Evondos care portal (care.evondos.com)", "url": "https://care.evondos.com/", "relevance": "The remote-monitoring portal front-line nurses use to supervise a caseload \u2014 the reference for the monitoring stream.", "tags": ["nurse", "portal"]}]}, {"group": "Evidence and outcomes", "description": "The clinical and outcome basis for the adherence and savings claims.", "links": [{"title": "Rantanen et al. (2017), Clinical Therapeutics \u2014 pilot safety and usability study", "url": "https://www.sciencedirect.com/science/article/pii/S0149291817302023", "relevance": "Peer-reviewed source for the ~99% adherence figure that grounds the domain's north-star metric.", "tags": ["evidence", "adherence"]}, {"title": "JBI / Leiden \u2014 automated home medication dispensers", "url": "https://jbi.global/news/article/automated-home-medication-dispensers", "relevance": "Independent outcomes for the Dutch Medido dispenser (adherence 49% to 97% at six months), relevant to the acquired product line.", "tags": ["evidence", "medido"]}]}, {"group": "Market and policy context", "description": "The demographic and long-term-care economics behind demand.", "links": [{"title": "OECD \u2014 Is Care Affordable for Older People?", "url": "https://www.oecd.org/en/publications/is-care-affordable-for-older-people_450ea778-en.html", "relevance": "Long-term-care spending levels and the 69% at-home share that make municipality-funded dispensing viable.", "tags": ["market", "policy"]}, {"title": "Bruegel \u2014 Europe's coming long-term care surge", "url": "https://www.bruegel.org/policy-brief/prepare-now-europe-must-get-ready-coming-long-term-care-surge", "relevance": "Quantifies the rising long-term-care need (30.8M to 38.1M) driving the workforce squeeze this service addresses.", "tags": ["market", "demographics"]}]}, {"group": "Regulation and trust", "description": "The medical-device and data-protection regime the service operates under.", "links": [{"title": "Evondos \u2014 About Us (certifications and milestones)", "url": "https://www.evondos.com/about-us", "relevance": "Company reference for CE marking, ISO 13485, and ISO/IEC 27001 that shape the compliance and data-governance bricks.", "tags": ["regulation", "compliance"]}]}]};
    const customerCount = customers.reduce((total, group) => total + ((group.customers || []).length), 0);
    const insightCount = (insights.items || []).length;
    const linkCount = (links.groups || []).reduce((total, group) => total + ((group.links || []).length), 0);

    function updateTabLabels() {
        document.getElementById('tab_customers').textContent = 'Customers (' + customerCount + ')';
        document.getElementById('tab_insights').textContent = 'Insights (' + insightCount + ')';
        document.getElementById('tab_links').textContent = 'Links (' + linkCount + ')';
    }

    function topCustomerKpi(customer) {
        return (((customer || {}).kpiPyramids || {}).customerOutcomes || {}).top || null;
    }

    function formatCurrentValue(kpi) {
        if (!kpi || !kpi.currentValue) {
            return '';
        }
        return String(kpi.currentValue) + (kpi.unit ? ' (' + String(kpi.unit) + ')' : '');
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function customerLookup() {
        const lookup = {};
        customers.forEach(group => {
            group.customers.forEach(customer => {
                lookup[customer.id] = customer;
            });
        });
        return lookup;
    }

    function jobNamesForCustomer(customer, jobIds) {
        const jobs = ((customer || {}).jobsToBeDone || []);
        const jobLookup = {};
        jobs.forEach(job => {
            if (job.id) {
                jobLookup[job.id] = job.name || job.id;
            }
        });
        return (jobIds || []).map(jobId => jobLookup[jobId] || jobId);
    }

    function kpiLookupForCustomer(customer) {
        const lookup = {};
        function walk(node) {
            if (!node) return;
            if (node.id) {
                lookup[node.id] = node.name || node.id;
            }
            (node.branches || []).forEach(walk);
            (node.children || []).forEach(walk);
        }
        const pyramids = (customer || {}).kpiPyramids || {};
        ['customerOutcomes', 'businessOutcomes'].forEach(key => {
            const pyramid = pyramids[key];
            if (!pyramid) return;
            walk(pyramid.top);
            (pyramid.branches || []).forEach(walk);
        });
        return lookup;
    }

    function kpiNamesForCustomer(customer, link) {
        // Prefer stable KPI IDs; fall back to legacy display-name kpis.
        if (link && link.kpiIds && link.kpiIds.length) {
            const lookup = kpiLookupForCustomer(customer);
            return link.kpiIds.map(kpiId => lookup[kpiId] || kpiId);
        }
        return (link && link.kpis) || [];
    }

    function renderAttribute(iconFile, label, items) {
        if (!items || !items.length) return '';
        let html = '<div class="customer-attribute">';
        html += '<img class="customer-attribute-icon" src="icons/' + escapeHtml(iconFile) + '" onerror="this.onerror=null;this.src=\'icons/logo.png\'">';
        html += '<div class="customer-attribute-body">';
        html += '<div class="customer-attribute-label">' + escapeHtml(label) + '</div>';
        items.forEach(item => {
            html += '<div class="customer-attribute-item">' + escapeHtml(item) + '</div>';
        });
        html += '</div></div>';
        return html;
    }

    function customerMatchesSearch(customer, groupName, query) {
        if (!query) return true;
        const haystack = [customer.id, customer.name, customer.description, groupName]
            .concat(customer.careAbout || [], customer.winsThem || [], customer.theirFear || [])
            .filter(Boolean).join(' ').toLowerCase();
        return haystack.includes(query);
    }

    let customerUrlStateRestored = false;

    function renderCustomers() {
        const searchInput = document.getElementById('CustomerSearch');
        if (!customerUrlStateRestored) {
            customerUrlStateRestored = true;
            const initialQuery = new URLSearchParams(window.location.search).get('q');
            if (initialQuery && searchInput) searchInput.value = initialQuery;
        }
        const query = searchInput ? searchInput.value.trim().toLowerCase() : '';
        if (window.history && window.history.replaceState) {
            const params = new URLSearchParams(window.location.search);
            if (query) params.set('q', query); else params.delete('q');
            const qs = params.toString();
            window.history.replaceState({}, '', window.location.pathname + (qs ? '?' + qs : '') + window.location.hash);
        }
        let visible = 0;
        let total = 0;
        let html = '<div style="padding: 12px">';

        customers.forEach(group => {
            total += group.customers.length;
            const matching = group.customers.filter(customer => customerMatchesSearch(customer, group.group, query));
            visible += matching.length;
            if (!matching.length) return;
            html += '<div class="customer-group">';
            html += '<div class="customer-group-label">' + escapeHtml(group.group) + '</div>';
            matching.forEach(customer => {
                html += '<a target="_blank" href="landing_pages/' + escapeHtml(customer.id) + '.html">';
                html += '<div class="customer-card">';
                html += '<img class="customer-card-photo" src="icons/' + escapeHtml(customer.icon) + '" onerror="this.onerror=null;this.src=\'icons/customer.png\'">';
                html += '<div class="customer-card-name">' + escapeHtml(customer.name) + '</div>';
                const topKpi = topCustomerKpi(customer);
                if (topKpi && topKpi.name) {
                    html += '<div class="kpi-badge">';
                    html += '<div>KPI: ' + escapeHtml(topKpi.name) + '</div>';
                    html += '</div>';
                }
                html += renderAttribute('care.png', 'Care about', customer.careAbout);
                html += renderAttribute('win.png', 'Wins them', customer.winsThem);
                html += renderAttribute('fear.png', 'Their fear', customer.theirFear);
                html += '</div></a>';
            });
            html += '</div>';
        });

        html += '</div>';
        if (!visible) {
            html = '<div class="customer-search-empty">No customers match the current search.</div>';
        }
        document.getElementById('CustomerCards').innerHTML = html;
        const summary = document.getElementById('CustomerSearchSummary');
        if (summary) {
            summary.textContent = query ? `Showing ${visible} of ${total} customers` : '';
        }
    }

    function update() {
        renderCustomers();
    }

    function renderInsights() {
        const lookup = customerLookup();

        if (!insights.items || insights.items.length === 0) {
            document.getElementById('tab_content_insights').innerHTML = '<div style="padding:16px;color:#6b7280">No customer insights defined for this domain yet.</div>';
            return;
        }

        let html = '<div class="insight-grid">';
        insights.items.forEach(insight => {
            html += '<div class="insight-card">';
            html += '<div class="insight-title">' + escapeHtml(insight.title) + '</div>';
            const evType = insight.evidenceType || ((insight.sourceIds && insight.sourceIds.length) || (insight.sources && insight.sources.length) ? 'sourced' : 'assumption');
            const evStyles = {
                sourced: 'background:#e3f2e6;color:#1b5e20',
                assumption: 'background:#fdecea;color:#b71c1c',
                hypothesis: 'background:#fff4e5;color:#8a4b00',
                inferred: 'background:#eef2f7;color:#37474f'
            };
            const evLabels = { sourced: 'Sourced finding', assumption: 'Assumption', hypothesis: 'Hypothesis', inferred: 'Inferred strategy' };
            html += '<div style="margin-bottom:8px"><span style="font-size:75%;font-weight:bold;padding:2px 8px;border-radius:10px;' + (evStyles[evType] || evStyles.inferred) + '">' + escapeHtml(evLabels[evType] || evType) + '</span></div>';
            html += '<div class="insight-summary">' + escapeHtml(insight.summary) + '</div>';
            if (insight.implication) {
                html += '<div style="margin-bottom:12px"><b>Product implication:</b> ' + escapeHtml(insight.implication) + '</div>';
            }
            if (insight.validation) {
                const v = insight.validation;
                html += '<div style="margin-bottom:12px;padding:8px 10px;border-left:3px solid #8a4b00;background:#fff8ee">';
                html += '<div style="font-size:80%;font-weight:bold;color:#8a4b00;margin-bottom:4px">Validation path (high-assumption inference)</div>';
                if (v.researchQuestion) { html += '<div class="insight-source"><b>Open question:</b> ' + escapeHtml(v.researchQuestion) + '</div>'; }
                if (v.evidenceTarget) { html += '<div class="insight-source"><b>Evidence to gather:</b> ' + escapeHtml(v.evidenceTarget) + '</div>'; }
                if (v.wouldRaiseConfidenceIf) { html += '<div class="insight-source"><b>Would raise confidence if:</b> ' + escapeHtml(v.wouldRaiseConfidenceIf) + '</div>'; }
                html += '</div>';
            }
            if (insight.tags && insight.tags.length) {
                html += '<div style="margin-bottom:10px">';
                insight.tags.forEach(tag => {
                    html += '<span class="insight-tag">' + escapeHtml(tag) + '</span>';
                });
                html += '</div>';
            }
            if (insight.linkedCustomers && insight.linkedCustomers.length) {
                html += '<div style="margin-bottom:8px"><b>Connected customers:</b></div>';
                insight.linkedCustomers.forEach(link => {
                    const customer = lookup[link.customerId];
                    html += '<div class="insight-customer-link">';
                    if (customer) {
                        html += '<a target="_blank" href="landing_pages/' + escapeHtml(customer.id) + '.html" style="color:#315b7c;font-weight:bold">' + escapeHtml(customer.name) + '</a>';
                    } else {
                        html += '<span style="font-weight:bold">' + escapeHtml(link.customerId) + '</span>';
                    }
                    if (link.jobIds && link.jobIds.length) {
                        html += '<div class="insight-source"><b>Jobs:</b> ' + escapeHtml(jobNamesForCustomer(customer, link.jobIds).join(', ')) + '</div>';
                    }
                    const kpiNames = kpiNamesForCustomer(customer, link);
                    if (kpiNames.length) {
                        html += '<div class="insight-source"><b>KPIs:</b> ' + escapeHtml(kpiNames.join(', ')) + '</div>';
                    }
                    html += '</div>';
                });
            }
            if (insight.sources && insight.sources.length) {
                html += '<div><b>Sources:</b></div>';
                insight.sources.forEach(source => {
                    html += '<div class="insight-source">';
                    html += '<a target="_blank" href="' + escapeHtml(source.url) + '" style="color:#315b7c">' + escapeHtml(source.title) + '</a>';
                    html += ' <span style="color:#6b7280">(' + escapeHtml(source.publisher || '') + (source.date ? ', ' + escapeHtml(source.date) : '') + ')</span>';
                    html += '</div>';
                });
            }
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_insights').innerHTML = html;
    }

    function renderLinks() {
        const groups = (links.groups || []).filter(group => (group.links || []).length);

        if (!groups.length) {
            document.getElementById('tab_content_links').innerHTML = '<div style="padding:16px;color:#6b7280">No external links defined for this domain yet.</div>';
            return;
        }

        let html = '<div class="links-section">';
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-label">' + escapeHtml(group.group) + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            html += '<div class="links-grid">';
            (group.links || []).forEach(link => {
                html += '<a class="link-card" target="_blank" rel="noopener" href="' + escapeHtml(link.url) + '">';
                html += '<div class="link-title">' + escapeHtml(link.title) + '</div>';
                if (link.relevance) {
                    html += '<div class="link-relevance">' + escapeHtml(link.relevance) + '</div>';
                }
                if (link.tags && link.tags.length) {
                    html += '<div>';
                    link.tags.forEach(tag => {
                        html += '<span class="link-tag">' + escapeHtml(tag) + '</span>';
                    });
                    html += '</div>';
                }
                if (link.references && link.references.length) {
                    html += '<div style="margin-top:8px;font-size:72%;color:#6b7280">Grounds: ';
                    html += link.references.map(r => escapeHtml(r.label || (r.type + ':' + r.id))).join(' · ');
                    html += '</div>';
                }
                html += '</a>';
            });
            html += '</div></div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
    }

    update();
    renderInsights();
    renderLinks();
    updateTabLabels();
</script>
<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../start/index.html",
      "label": "Digital Medication Management Home"
    },
    {
      "label": "Customers"
    }
  ]
};
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
