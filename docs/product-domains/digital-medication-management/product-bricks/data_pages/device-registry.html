    <style>
    .tab {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 4px;
    }

    .tab button {
        position: relative;
        background-color: transparent;
        border: none;
        outline: none;
        cursor: pointer;
        padding: 11px 16px;
        margin-bottom: -1px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        color: #6b7280;
        border-bottom: 2px solid transparent;
        border-radius: 8px 8px 0 0;
        transition: color 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
    }

    .tab button:hover {
        color: #1f2937;
        background-color: #f3f4f6;
    }

    .tab button:focus-visible {
        outline: 2px solid #1d4ed8;
        outline-offset: -2px;
    }

    .tab button.active {
        color: #1d4ed8;
        border-bottom-color: #1d4ed8;
    }

    .tabcontent {
        display: none;
        padding: 2px 2px;
        animation: tabContentFade 0.2s ease;
    }

    @keyframes tabContentFade {
        from {
            opacity: 0;
            transform: translateY(3px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 720px) {
        .tab {
            flex-direction: column;
            gap: 0;
        }

        .tab button {
            width: 100%;
            text-align: left;
            margin-bottom: 0;
            border-bottom: 1px solid #e5e7eb;
            border-radius: 0;
        }

            border-bottom-color: #1d4ed8;
        }

    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function titleCase(value) {
        return String(value || '')
            .split('-')
            .filter(Boolean)
            .map(part => part.charAt(0).toUpperCase() + part.slice(1))
            .join(' ');
    }

    function storeById(storeId) {
        return allStores.find(item => item.id === storeId) || { id: storeId, name: storeId };
    }

    function assetMetaPath(asset) {
        const parts = [];
        if (asset.rootGroup) {
            parts.push(asset.rootGroup);
        }
        if (asset.group && asset.group !== asset.rootGroup) {
            parts.push(asset.group);
        }
        if (!parts.length) {
            parts.push('Data Asset');
        }
        return parts.join(' / ');
    }

<div class="page" id="MainContent"></div>

<script>
    let headerHtml = '<div class="nav-strip">';
    allAssets.forEach(item => {
        headerHtml += '<a class="nav-link" href="' + escapeHtml(item.id) + '.html" title="' + escapeHtml(item.name || item.id) + '">';
        headerHtml += '<img src="../icons/data.png" class="' + (item.id === currentAsset.id ? 'tab-image-selected' : 'tab-image') + '" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
        headerHtml += '</a>';
    });
    headerHtml += '</div>';

    headerHtml += '<div class="page">';
    headerHtml += '<div class="header">';
    headerHtml += '<img class="header-icon" src="../icons/data.png" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
    headerHtml += '<div>';
    headerHtml += '<div class="header-meta">';
    headerHtml += '<div class="page-type-badge">Data Asset</div>';
    headerHtml += escapeHtml(assetMetaPath(currentAsset)) + ' / <span style="color:blue;font-weight:bold;">' + escapeHtml((currentAsset.id || '').toUpperCase()) + '</span></div>';
    headerHtml += '<div class="header-title">' + escapeHtml(currentAsset.name || currentAsset.id) + '</div>';
    headerHtml += '<div class="header-copy">' + escapeHtml(currentAsset.description || '') + '</div>';

    headerHtml += '<div class="badge-row">';
    if (currentAsset.kind) {
        headerHtml += '<span class="badge">' + escapeHtml(titleCase(currentAsset.kind)) + '</span>';
    }
    const classification = String(currentAsset.classification || '').toLowerCase();
    if (classification) {
        headerHtml += '<span class="badge ' + (classification === 'restricted' ? 'badge-restricted' : '') + '">' + escapeHtml(titleCase(classification)) + '</span>';
    }
    const pii = String(currentAsset.personalDataLevel || 'none').toLowerCase();
    if (pii && pii !== 'none') {
        headerHtml += '<span class="badge badge-pii">' + escapeHtml(titleCase(pii)) + ' Data</span>';
    }
    const criticality = String(currentAsset.securityCriticality || '').toLowerCase();
    if (criticality) {
        const critClass = criticality === 'critical' ? 'badge-critical' : (criticality === 'high' ? 'badge-high' : '');
        headerHtml += '<span class="badge ' + critClass + '">' + escapeHtml(titleCase(criticality)) + ' Criticality</span>';
    }
    (currentAsset.legalTags || []).forEach(tag => {
        headerHtml += '<span class="badge">' + escapeHtml(String(tag).toUpperCase()) + '</span>';
    });
    headerHtml += '</div>';

    headerHtml += '</div></div></div>';
    document.getElementById('Header').innerHTML = headerHtml;

    function renderMetaItem(label, value) {
        if (!value) {
            return '';
        }
        return '<div class="meta-item"><div class="meta-label">' + escapeHtml(label) + '</div><div class="meta-value">' + escapeHtml(value) + '</div></div>';
    }

    function renderBrickPills(items, emptyLabel) {
        if (!items.length) {
            return '<div class="muted">' + escapeHtml(emptyLabel) + '</div>';
        }
        let html = '<div class="card-grid">';
        items.forEach(brick => {
            html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../landing_pages/' + escapeHtml(brick.id) + '.html">';
            html += '<div class="card-meta">' + escapeHtml(titleCase(brick.role || '') || 'Brick') + '</div>';
            html += '<div class="card-header">';
            html += '<img class="card-icon" src="../icons/' + escapeHtml(brick.id) + '.png" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
            html += '<div class="card-title">' + escapeHtml(brick.name || brick.id) + '</div>';
            html += '</div>';
            if (brick.description) {
                html += '<div class="card-copy">' + escapeHtml(brick.description) + '</div>';
            }
            html += '</a>';
        });
        html += '</div>';
        return html;
    }

    function renderMain() {
        let html = '';

        // Overview / governance
        html += '<div class="group"><div class="section-title">Overview & Governance</div>';
        html += '<div class="meta-grid">';
        html += renderMetaItem('Kind', titleCase(currentAsset.kind || ''));
        html += renderMetaItem('Status', titleCase(currentAsset.status || ''));
        html += renderMetaItem('Classification', titleCase(currentAsset.classification || ''));
        html += renderMetaItem('Personal Data', titleCase(currentAsset.personalDataLevel || ''));
        html += renderMetaItem('Security Criticality', titleCase(currentAsset.securityCriticality || ''));
        html += renderMetaItem('Data Subjects', (currentAsset.dataSubjects || []).map(titleCase).join(', '));
        html += renderMetaItem('Legal Tags', (currentAsset.legalTags || []).map(tag => String(tag).toUpperCase()).join(', '));
        html += renderMetaItem('Access Scope', currentAsset.accessScope || '');
        html += renderMetaItem('System Of Record Brick', currentAsset.systemOfRecordBrickId || '');
        const gov = currentAsset.governance || {};
        html += renderMetaItem('Retention', gov.retention || '');
        html += renderMetaItem('Residency', (gov.residency || '').toUpperCase());
        html += renderMetaItem('Sharing Policy', gov.sharingPolicy || '');
        html += '</div>';
        if (currentAsset.businessMeaning && currentAsset.businessMeaning !== currentAsset.description) {
            html += '<div class="card-copy" style="margin-top:14px;"><strong>Business meaning:</strong> ' + escapeHtml(currentAsset.businessMeaning) + '</div>';
        }
        html += '</div>';

        // Stores
        html += '<div class="group"><div class="section-title">Stores</div>';
        const storeLinks = currentAsset.stores || [];
        if (!storeLinks.length) {
            html += '<div class="muted">No stores linked to this asset.</div>';
        } else {
            html += '<div class="card-grid">';
            storeLinks.forEach(link => {
                const store = storeById(link.storeId);
                html += '<div class="card">';
                html += '<div class="card-meta">' + escapeHtml(titleCase(link.role || 'store')) + '</div>';
                html += '<div class="card-title">' + escapeHtml(store.name || link.storeId) + '</div>';
                const storeMeta = [store.kind ? titleCase(store.kind) : '', store.technology || ''].filter(Boolean).join(' | ');
                if (storeMeta) {
                    html += '<div class="muted">' + escapeHtml(storeMeta) + '</div>';
                }
                if (store.description) {
                    html += '<div class="card-copy">' + escapeHtml(store.description) + '</div>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        html += '</div>';

        // Producing bricks
        html += '<div class="group"><div class="section-title">Producing Bricks</div>';
        html += renderBrickPills(producingBricks, 'No bricks own, write, or publish this asset.');
        html += '</div>';

        // Consuming bricks
        html += '<div class="group"><div class="section-title">Consuming Bricks</div>';
        html += renderBrickPills(consumingBricks, 'No bricks read or query this asset.');
        html += '</div>';

        // Interfaces
        html += '<div class="group"><div class="section-title">Interfaces</div>';
        const interfaces = currentAsset.interfaces || [];
        if (!interfaces.length) {
            html += '<div class="muted">No access interfaces listed.</div>';
        } else {
            html += '<div class="card-grid">';
            interfaces.forEach(iface => {
                html += '<div class="card">';
                html += '<div class="card-meta">' + escapeHtml(titleCase(iface.type || 'interface')) + '</div>';
                html += '<div class="card-title">' + escapeHtml(iface.name || iface.type || 'Interface') + '</div>';
                if (iface.description) {
                    html += '<div class="card-copy">' + escapeHtml(iface.description) + '</div>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        html += '</div>';

        // Ownership
        html += '<div class="group"><div class="section-title">Ownership</div>';
        if (!ownerTeam && !stewardTeams.length) {
            html += '<div class="muted">No owning or steward teams listed for this asset.</div>';
        } else {
            html += '<div class="card-grid">';
            if (ownerTeam) {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../../teams/landing_pages/' + escapeHtml(ownerTeam.teamId) + '.html">';
                html += '<div class="card-meta">Owner Team</div>';
                html += '<div class="card-title">' + escapeHtml(ownerTeam.teamName || ownerTeam.teamId) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(ownerTeam.groupName || '') + '</div>';
                html += '</a>';
            }
            stewardTeams.forEach(team => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../../teams/landing_pages/' + escapeHtml(team.teamId) + '.html">';
                html += '<div class="card-meta">Steward Team</div>';
                html += '<div class="card-title">' + escapeHtml(team.teamName || team.teamId) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(team.groupName || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        // Lineage
        const derivedIds = currentAsset.derivedFromAssetIds || [];
        if (derivedIds.length) {
            html += '<div class="group"><div class="section-title">Derived From</div>';
            html += '<div class="card-grid">';
            derivedIds.forEach(id => {
                const source = allAssets.find(item => item.id === id) || { id: id, name: id };
                html += '<a class="card" href="' + escapeHtml(id) + '.html">';
                html += '<div class="card-meta">Source Asset</div>';
                html += '<div class="card-title">' + escapeHtml(source.name || id) + '</div>';
                if (source.description) {
                    html += '<div class="card-copy">' + escapeHtml(source.description) + '</div>';
                }
                html += '</a>';
            });
            html += '</div>';
            html += '</div>';
        }

        document.getElementById('MainContent').innerHTML = html;
    }

    renderMain();
</script>

;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
