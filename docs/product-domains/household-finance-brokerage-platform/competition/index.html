    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

st mirror of Aanbieders.be and of the Hasselt and Oujda customer-care model (phone advisors who compare and switch, free for the household), backed by an international group; it lacks the mortgage offices, the feasibility certificate and the household contract vault that let Peasy start from the mortgage and expand into fixed costs.", "businessStats": [{"metric": "group", "value": "part of the Selectra group, founded 2007 and active in 18 countries", "period": "accessed 2026-09-05", "scope": "group", "sourceTitle": "CallMePower - about us", "sourceUrl": "https://callmepower.be/en/about-us"}, {"metric": "services", "value": "free comparison and advice for energy, broadband, mobile, TV, insurance and moving in Belgium; advisors compare and switch by phone", "period": "accessed 2026-09-05", "scope": "Belgium", "sourceTitle": "CallMePower - about us", "sourceUrl": "https://callmepower.be/en/about-us"}], "links": {"website": "https://callmepower.be/", "about": "https://callmepower.be/en/about-us"}, "logo_path": "logos/callmepower.png"}, {"id": "daretocompare", "logo": "logos/daretocompare.png", "name": "DareToCompare.be / DurfBesparen.be", "hq": "Belgium", "category": "energy-and-telecom-comparator", "primaryRegions": ["europe"], "description": "DareToCompare.be (DurfBesparen.be) is an independent energy and telecom comparator for families and the self-employed, founded (relaunched) in 2021 by Evert Engelen, who has more than 20 years of market experience and launched the first Belgian online energy and telecom comparator in 2007. Versus Peasy: a lean, founder-led self-service comparator that competes with Aanbieders.be for the online energy and telecom switch; it has no mortgage offer, no office network of experts and no contract-monitoring relationship, so its edge is speed and independence for the household that wants to switch alone.", "businessStats": [{"metric": "founded_year", "value": "founded (relaunched) in 2021 by Evert Engelen; first Belgian online energy and telecom comparator launched in 2007; 20+ years of market experience", "period": "accessed 2026-09-05", "scope": "company", "sourceTitle": "DareToCompare.be - about", "sourceUrl": "https://www.daretocompare.be/about"}], "links": {"website": "https://www.daretocompare.be/", "about": "https://www.daretocompare.be/about"}, "logo_path": "logos/daretocompare.png"}, {"id": "topcompare", "logo": "logos/topcompare.png", "name": "TopCompare.be", "hq": "Brussels, Belgium", "category": "financial-comparison-site", "primaryRegions": ["europe"], "description": "TopCompare.be is a Brussels-based financial comparison site covering personal loans, mortgages, credit cards, bank accounts and insurance policies. Versus Peasy: it captures the first online research step of a refinancer or consumer-credit borrower and hands the lead to lenders, without simulators tied to an office appointment, expert-assembled credit files or switch execution; it competes for the upload-your-proposal and consumer-credit traffic rather than for the concluded contract. No verified business statistics are available on its official site, so none are listed.", "businessStats": [], "links": {"website": "https://www.topcompare.be/"}, "logo_path": "logos/topcompare.png"}, {"id": "wikifin", "logo": "logos/wikifin.png", "name": "Wikifin (FSMA)", "hq": "Brussels, Belgium", "category": "public-comparison-tool", "primaryRegions": ["europe"], "description": "Wikifin is the financial-education programme of the Belgian financial regulator FSMA, launched on 31 January 2013. It is non-commercial and offers independent information, a savings-account comparison tool and the IMMOsimulator for home-purchase costs, plus Wikifin School and the Wikifin Lab. Versus Peasy: it does not broker or earn commissions and is explicitly outside Peasy's scope, but its neutral simulators and comparison tools are where many first-time buyers start before booking an appointment, and they set the public benchmark for what an independent comparison should disclose.", "businessStats": [{"metric": "launched", "value": "launched 31 January 2013 as the FSMA financial-education programme", "period": "accessed 2026-09-05", "scope": "programme (FSMA)", "sourceTitle": "Wikifin - over Wikifin", "sourceUrl": "https://www.wikifin.be/nl/over-wikifin"}, {"metric": "tools", "value": "independent information, savings-account comparison tool, IMMOsimulator, Wikifin School and Wikifin Lab", "period": "accessed 2026-09-05", "scope": "programme (FSMA)", "sourceTitle": "Wikifin - over Wikifin", "sourceUrl": "https://www.wikifin.be/nl/over-wikifin"}], "links": {"website": "https://www.wikifin.be/", "about": "https://www.wikifin.be/nl/over-wikifin"}, "logo_path": "logos/wikifin.png"}, {"id": "vreg-v-test", "logo": "logos/vreg-v-test.png", "name": "VREG V-test and V-check", "hq": "Brussels, Belgium (Flemish energy regulator)", "category": "public-comparison-tool", "primaryRegions": ["europe"], "description": "The V-test and V-check are the public, non-commercial energy-contract comparison tools of the Flemish energy regulator VREG. The V-test compares electricity and gas contracts; the V-check reads the invoice code that suppliers must print on invoices since 1 July 2025 to pre-fill the comparison, and VRT NWS reported tens of thousands of uses in its first two months. Versus Peasy: it is the reference households and journalists use to judge whether a commercial comparator is honest, it takes no commission and executes no switch, so Aanbieders.be competes by adding the advisor, the switch execution and the monitoring that the V-test deliberately leaves to the consumer.", "businessStats": [{"metric": "invoice_code", "value": "V-check reads the invoice code that is mandatory on energy invoices since 1 July 2025", "period": "since 2025-07-01", "scope": "Flanders", "sourceTitle": "VREG - V-test", "sourceUrl": "https://vtest.vreg.be/"}], "links": {"website": "https://vtest.vreg.be/", "regulator": "https://www.vreg.be/"}, "logo_path": "logos/vreg-v-test.png"}]};
    let showDetails = false;

    function escapeHtml(value) {
        return String(value || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function titleCase(value) {
        return String(value || '')
            .split('_')
            .filter(Boolean)
            .map(part => part.charAt(0).toUpperCase() + part.slice(1))
            .join(' ');
    }

    function firstLetterLogo(player) {
        return '<div class="player-logo-fallback">' + escapeHtml((player.name || '?').charAt(0).toUpperCase()) + '</div>';
    }

    function renderPlayerLogo(player) {
        const fallback = firstLetterLogo(player);
        if (!player.logo_path) {
            return fallback;
        }

        return ''
            + '<div class="player-logo-wrap">'
            + '<img class="player-logo" src="' + escapeHtml(player.logo_path) + '" alt="' + escapeHtml(player.name) + ' logo"'
            + ' onerror="this.style.display=\'none\'; if (this.nextElementSibling) { this.nextElementSibling.style.display=\'flex\'; }">'
            + '<div class="player-logo-fallback" style="display:none;">' + escapeHtml((player.name || '?').charAt(0).toUpperCase()) + '</div>'
            + '</div>';
    }

    function renderHero() {
        const players = competitionData.players || [];
        document.getElementById('heroSubtitle').innerHTML = escapeHtml(competitionData.scope && competitionData.scope.description || '');
        document.getElementById('heroMeta').innerHTML = ''
            + '<div class="meta-chip">Updated ' + escapeHtml(competitionData.generatedOn || '') + '</div>';
    }

    function renderScope() {
        const scope = competitionData.scope || {};
        document.getElementById('scopeCopy').textContent = scope.description || '';
        const notes = Array.isArray(scope.notes) ? scope.notes : (scope.notes ? [scope.notes] : []);
        document.getElementById('scopeNotes').innerHTML = notes.map(item => '<div class="pill">' + escapeHtml(item) + '</div>').join('');
    }

    function renderPlayer(player) {
        const logoHtml = renderPlayerLogo(player);
        const detailUrl = 'landing_pages/' + encodeURIComponent(player.id) + '.html';

        const stats = (player.businessStats || []).slice(0, 3).map(stat => ''
            + '<div class="stat-item">'
            + '<div class="stat-metric">' + escapeHtml(titleCase(stat.metric)) + '</div>'
            + '<div class="stat-value">' + escapeHtml(stat.value || '') + '</div>'
            + '<div class="stat-meta">' + escapeHtml((stat.period || '') + (stat.scope ? ' • ' + titleCase(stat.scope) : '')) + '</div>'
            + '</div>'
        ).join('');

        const links = Object.entries(player.links || {}).slice(0, 4).map(([key, value]) => ''
            + '<a class="link-item" href="' + escapeHtml(value) + '" target="_blank" rel="noopener noreferrer">'
            + '<div><strong>' + escapeHtml(titleCase(key)) + '</strong></div>'
            + '<div class="link-meta">' + escapeHtml(value) + '</div>'
            + '</a>'
        ).join('');

        const regions = (player.primaryRegions || []).map(region => '<div class="pill">' + escapeHtml(titleCase(region)) + '</div>').join('');

        return ''
            + '<div class="player-card" data-detail-url="' + escapeHtml(detailUrl) + '">'
            + '<div class="player-header">'
            + logoHtml
            + '<div>'
            + '<div class="category-chip">' + escapeHtml(titleCase(player.category || 'competitor')) + '</div>'
            + (player.role ? '<div class="category-chip" style="' + ({ direct: 'background:#fdecea;color:#b71c1c', substitute: 'background:#fff4e5;color:#8a4b00', benchmark: 'background:#eef2f7;color:#37474f' }[player.role] || '') + '">' + escapeHtml(({ direct: 'Direct', substitute: 'Substitute', benchmark: 'Benchmark' }[player.role] || player.role)) + '</div>' : '')
            + '<div class="player-name">' + escapeHtml(player.name || '') + '</div>'
            + '<div class="player-meta">' + escapeHtml(player.hq || '') + (player.regionRelevance ? ' · ' + escapeHtml(player.regionRelevance) : '') + '</div>'
            + '</div>'
            + '</div>'
            + '<div class="player-description">' + escapeHtml(player.description || '') + '</div>'
            + '<div class="section-title">Primary Regions</div>'
            + '<div class="regions-row">' + regions + '</div>'
            + '<div class="player-details-block' + (showDetails ? '' : ' details-hidden') + '">'
            + '<div class="section-title">Selected Stats</div>'
            + '<div class="stats-list">' + stats + '</div>'
            + '<div class="section-title">Official Links</div>'
            + '<div class="links-list">' + links + '</div>'
            + '</div>'
            + '</div>';
    }

    function renderPlayers() {
        document.getElementById('playersGrid').innerHTML = (competitionData.players || []).map(renderPlayer).join('');
        bindPlayerCardNavigation();
        syncDetailsToggle();
        syncPlayerTabLabel();
    }

    function bindPlayerCardNavigation() {
        document.querySelectorAll('.player-card').forEach(card => {
            card.addEventListener('click', function (event) {
                const interactive = event.target.closest('a, button');
                if (interactive) {
                    return;
                }
                const detailUrl = card.getAttribute('data-detail-url');
                if (detailUrl) {
                    window.open(detailUrl, '_blank');
                }
            });
        });
    }

    function syncDetailsToggle() {
        const button = document.getElementById('detailsToggleButton');
        if (!button) {
            return;
        }
        button.textContent = showDetails ? 'Hide details' : 'Show details';
        button.className = 'toggle-button' + (showDetails ? ' toggle-button-active' : '');
    }

    function toggleDetails() {
        showDetails = !showDetails;
        renderPlayers();
    }

    function syncPlayerTabLabel() {
        const button = document.getElementById('tab_PlayersTab');
        if (!button) {
            return;
        }
        button.textContent = 'Players (' + String((competitionData.players || []).length) + ')';
    }

    renderHero();
    renderScope();
    renderPlayers();
</script>
</body>
</html>
