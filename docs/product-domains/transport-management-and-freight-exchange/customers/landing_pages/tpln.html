<script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

], "media": [{"type": "image", "src": "media/jbtd-tdir-jtbd-tdir-1-4.png", "title": "Transportation Director JTBD step 4: Publish rate cards and routing guides", "alt": "Enterprise infographic for step 4 of the job \"Secure yearly capacity at target cost\": Publish rate cards and routing guides."}]}, {"step": "Monitor compliance and close gaps", "description": "Track routing-guide compliance, carrier acceptance, and rate erosion quarterly; re-tender broken lanes and cover structural gaps with managed spot buying rather than panic phone calls.", "streamsNeeded": [{"id": "analyze-network-performance", "name": "Analyze Network Performance", "howItSupports": "Reports guide compliance, acceptance decay, and realized-vs-contracted cost per lane each quarter."}, {"id": "match-spot-freight", "name": "Match Spot Freight", "howItSupports": "Covers structurally under-contracted lanes on the exchange at transparent market prices until re-tendering."}], "media": [{"type": "image", "src": "media/jbtd-tdir-jtbd-tdir-1-5.png", "title": "Transportation Director JTBD step 5: Monitor compliance and close gaps", "alt": "Enterprise infographic for step 5 of the job \"Secure yearly capacity at target cost\": Monitor compliance and close gaps."}]}], "media": [{"type": "image", "src": "media/jbtd-tdir-jtbd-tdir-1.png", "title": "Transportation Director JTBD infographic: Secure yearly capacity at target cost", "alt": "Enterprise infographic for the job \"Secure yearly capacity at target cost\" for customer \"Transportation Director\"."}]}, {"id": "jtbd-tdir-2", "name": "Control total freight spend end to end", "whatItIs": "Keep the freight budget honest from planned cost through executed order to audited invoice: expected costs at order creation, automatic audit against rate cards, self-billing where possible, and variance analysis that names causes.", "outcome": "Freight spend that closes each month within budget tolerance, with deviations explained by cause \u2014 not discovered in quarter-end accruals.", "steps": [{"step": "Set budgets and expected costs per lane", "description": "Translate rate cards and forecast volumes into lane- and plant-level freight budgets with expected cost attached to every planned shipment.", "streamsNeeded": [{"id": "procure-freight-capacity", "name": "Procure Freight Capacity", "howItSupports": "Provides the contracted rate structures that expected costs and budgets are built from."}, {"id": "analyze-network-performance", "name": "Analyze Network Performance", "howItSupports": "Models budget scenarios from volume forecasts and historical accessorial patterns."}], "media": [{"type": "image", "src": "media/jbtd-tdir-jtbd-tdir-2-1.png", "title": "Transportation Director JTBD step 1: Set budgets and expected costs per lane", "alt": "Enterprise infographic for step 1 of the job \"Control total freight spend end to end\": Set budgets and expected costs per lane."}]}, {"step": "Capture actual costs at order level", "description": "Rate every transport order at tender time \u2014 base rate, diesel floater, tolls, accessorials \u2014 so cost is known when the load is booked, not when the invoice arrives.", "streamsNeeded": [{"id": "execute-transport-orders", "name": "Execute Transport Orders", "howItSupports": "Rates each order against the applicable rate card at tendering and carries the expected cost through execution."}, {"id": "settle-and-audit-freight", "name": "Settle and Audit Freight", "howItSupports": "Registers the rated amount as the audit reference the carrier invoice must match."}], "media": [{"type": "image", "src": "media/jbtd-tdir-jtbd-tdir-2-2.png", "title": "Transportation Director JTBD step 2: Capture actual costs at order level", "alt": "Enterprise infographic for step 2 of the job \"Control total freight spend end to end\": Capture actual costs at order level."}]}, {"step": "Audit invoices and run self-billing", "description": "Auto-match carrier invoices against rated orders and proof of delivery; move high-volume contracted carriers to self-billing so invoices are generated from execution data instead of being checked against it.", "streamsNeeded": [{"id": "settle-and-audit-freight", "name": "Settle and Audit Freight", "howItSupports": "Matches invoice lines to rated orders and PODs, flags deviations, and issues self-billing statements."}], "media": [{"type": "image", "src": "media/jbtd-tdir-jtbd-tdir-2-3.png", "title": "Transportation Director JTBD step 3: Audit invoices and run self-billing", "alt": "Enterprise infographic for step 3 of the job \"Control total freight spend end to end\": Audit invoices and run self-billing."}]}, {"step": "Explain variance and act", "description": "Review monthly cost variance by cause \u2014 volume, mix, diesel, spot exposure, accessorials \u2014 and feed systematic causes back into planning rules and the next tender.", "streamsNeeded": [{"id": "analyze-network-performance", "name": "Analyze Network Performance", "howItSupports": "Decomposes budget variance by cause and lane, and tracks the effect of corrective actions."}, {"id": "procure-freight-capacity", "name": "Procure Freight Capacity", "howItSupports": "Receives re-tender triggers for lanes where contracted rates or compliance have structurally drifted."}], "media": [{"type": "image", "src": "media/jbtd-tdir-jtbd-tdir-2-4.png", "title": "Transportation Director JTBD step 4: Explain variance and act", "alt": "Enterprise infographic for step 4 of the job \"Control total freight spend end to end\": Explain variance and act."}]}], "media": [{"type": "image", "src": "media/jbtd-tdir-jtbd-tdir-2.png", "title": "Transportation Director JTBD infographic: Control total freight spend end to end", "alt": "Enterprise infographic for the job \"Control total freight spend end to end\" for customer \"Transportation Director\"."}]}, {"id": "jtbd-tdir-3", "name": "De-risk and decarbonize the carrier base", "whatItIs": "Keep the carrier portfolio compliant, fraud-free, resilient, and progressively lower-carbon: continuous vetting, diversified capacity, shipment-level emissions measurement, and CSRD-grade reporting.", "outcome": "A carrier base the shipper can defend to auditors, insurers, and customers \u2014 with emissions numbers built from primary execution data and a credible reduction path.", "steps": [{"step": "Vet and continuously monitor carriers", "description": "Screen every carrier for licenses, insurance, financial health, and fraud signals at onboarding and continuously \u2014 not just once a year \u2014 including subcontracting chains on sensitive freight.", "streamsNeeded": [{"id": "onboard-and-trust-network", "name": "Onboard and Trust the Network", "howItSupports": "Runs document checks, trust scoring, and fraud screening across the contracted and spot carrier base."}], "media": [{"type": "image", "src": "media/jbtd-tdir-jtbd-tdir-3-1.png", "title": "Transportation Director JTBD step 1: Vet and continuously monitor carriers", "alt": "Enterprise infographic for step 1 of the job \"De-risk and decarbonize the carrier base\": Vet and continuously monitor carriers."}]}, {"step": "Diversify capacity and reduce concentration risk", "description": "Balance volume across carriers and corridors so no lane depends on a single company; qualify network carriers as vetted backups before the crisis, not during it.", "streamsNeeded": [{"id": "procure-freight-capacity", "name": "Procure Freight Capacity", "howItSupports": "Structures awards to cap single-carrier concentration and pre-qualify backup capacity per lane."}, {"id": "match-spot-freight", "name": "Match Spot Freight", "howItSupports": "Gives access to 80,000+ network carriers as a vetted overflow pool when contracted capacity fails."}], "media": [{"type": "image", "src": "media/jbtd-tdir-jtbd-tdir-3-2.png", "title": "Transportation Director JTBD step 2: Diversify capacity and reduce concentration risk", "alt": "Enterprise infographic for step 2 of the job \"De-risk and decarbonize the carrier base\": Diversify capacity and reduce concentration risk."}]}, {"step": "Measure emissions per shipment", "description": "Calculate CO2e per shipment from actual distance, vehicle class, load factor, and fuel type captured during execution, replacing spend-based estimates lane by lane.", "streamsNeeded": [{"id": "analyze-network-performance", "name": "Analyze Network Performance", "howItSupports": "Computes shipment-level emissions from execution records and aggregates them by lane, carrier, and business unit."}, {"id": "execute-transport-orders", "name": "Execute Transport Orders", "howItSupports": "Captures the vehicle, route, and load data that primary-data emissions calculations need."}], "media": [{"type": "image", "src": "media/jbtd-tdir-jtbd-tdir-3-3.png", "title": "Transportation Director JTBD step 3: Measure emissions per shipment", "alt": "Enterprise infographic for step 3 of the job \"De-risk and decarbonize the carrier base\": Measure emissions per shipment."}]}, {"step": "Report and steer reduction", "description": "Produce auditable CSRD scope-3 transport disclosures, set lane-level reduction targets, and make emissions a scored criterion in the next procurement cycle.", "streamsNeeded": [{"id": "analyze-network-performance", "name": "Analyze Network Performance", "howItSupports": "Generates auditable emissions reports and tracks reduction against targets."}, {"id": "procure-freight-capacity", "name": "Procure Freight Capacity", "howItSupports": "Adds emissions intensity to bid scoring so decarbonization shifts volume, not just slideware."}], "media": [{"type": "image", "src": "media/jbtd-tdir-jtbd-tdir-3-4.png", "title": "Transportation Director JTBD step 4: Report and steer reduction", "alt": "Enterprise infographic for step 4 of the job \"De-risk and decarbonize the carrier base\": Report and steer reduction."}]}], "media": [{"type": "image", "src": "media/jbtd-tdir-jtbd-tdir-3.png", "title": "Transportation Director JTBD infographic: De-risk and decarbonize the carrier base", "alt": "Enterprise infographic for the job \"De-risk and decarbonize the carrier base\" for customer \"Transportation Director\"."}]}], "customerJourneyStories": [{"id": "journey-tdir-1", "name": "From spreadsheet tenders to digital procurement", "linkedJobIds": ["jtbd-tdir-1", "jtbd-tdir-2"], "summary": "A transportation director goes from a chaotic, spreadsheet-driven yearly tender to adopting a digital freight procurement product: discovering it through peers and analyst coverage, proving it on three pilot corridors, and renewing on realized savings.", "stages": [{"stage": "Trigger", "narrative": "Contract rates expire in Q1 and the board wants freight spend under control. Last year's tender ran across 40 spreadsheets and hundreds of emails, two awarded carriers never performed, and off-guide spot buys quietly ate the promised savings. The director decides the process itself is the problem.", "media": [{"type": "image", "src": "media/journey-tdir-tdir-1-1.png", "title": "Transportation Director journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"From spreadsheet tenders to digital procurement\": Trigger."}]}, {"stage": "Discovery", "narrative": "At a logistics conference the director hears two peer directors compare digital tender platforms, then finds the vendor positioned as a Challenger in Gartner's Magic Quadrant for Transportation Management Systems. A reference call with a peer FMCG shipper already running tenders on the platform turns curiosity into a shortlist.", "media": [{"type": "image", "src": "media/journey-tdir-tdir-1-2.png", "title": "Transportation Director journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"From spreadsheet tenders to digital procurement\": Discovery."}]}, {"stage": "Evaluation", "narrative": "Procurement runs a structured evaluation: IT reviews security and the SAP integration path, the vendor demos with the company's own lane file, and the business case weighs subscription cost against benchmark-implied overpayment on six corridors. The pre-vetted carrier network \u2014 tens of thousands of carriers across Europe \u2014 becomes the differentiator no spreadsheet can match.", "media": [{"type": "image", "src": "media/journey-tdir-tdir-1-3.png", "title": "Transportation Director journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"From spreadsheet tenders to digital procurement\": Evaluation."}]}, {"stage": "Trial", "narrative": "The pilot is one tender wave on three problem corridors with incumbents plus network carriers invited. Bids arrive normalized on the same diesel-floater basis, negotiation time goes into target lanes instead of spreadsheet reconciliation, and the wave closes in three weeks instead of nine.", "media": [{"type": "image", "src": "media/journey-tdir-tdir-1-4.png", "title": "Transportation Director journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"From spreadsheet tenders to digital procurement\": Trial."}]}, {"stage": "Engagement", "narrative": "The full tender season runs on the platform: awards publish directly into rate cards and routing guides, mini-tenders handle volatile lanes mid-year, and monthly reviews compare paid rates against market benchmarks. Procurement stops being an annual event and becomes a continuous capability.", "media": [{"type": "image", "src": "media/journey-tdir-tdir-1-5.png", "title": "Transportation Director journey stage 5: Engagement", "alt": "Enterprise journey panel for stage 5 of \"From spreadsheet tenders to digital procurement\": Engagement."}]}, {"stage": "Retention", "narrative": "At renewal the director presents realized savings and a tender cycle cut by two thirds; the contract expands to include freight audit and settlement. The company joins the vendor's reference list \u2014 the same proof point that once convinced the director now convinces others.", "media": [{"type": "image", "src": "media/journey-tdir-tdir-1-6.png", "title": "Transportation Director journey stage 6: Retention", "alt": "Enterprise journey panel for stage 6 of \"From spreadsheet tenders to digital procurement\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-tdir-tdir-1.png", "title": "Transportation Director customer journey: From spreadsheet tenders to digital procurement", "alt": "Enterprise journey storyboard for \"From spreadsheet tenders to digital procurement\" for customer \"Transportation Director\"."}]}, {"id": "journey-tdir-2", "name": "Proving transport emissions for CSRD", "linkedJobIds": ["jtbd-tdir-3", "jtbd-tdir-2"], "summary": "Pushed by CSRD disclosure requirements, the director discovers the emissions module inside the platform the company already executes on, validates its methodology with auditors, and makes carrier carbon intensity part of procurement.", "stages": [{"stage": "Trigger", "narrative": "The CFO asks for auditable transport emissions for the CSRD disclosure and rejects the consultants' quote for a manual data-collection exercise. Spend-based estimates will not survive an audit, and the deadline is fixed.", "media": [{"type": "image", "src": "media/journey-tdir-tdir-2-1.png", "title": "Transportation Director journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"Proving transport emissions for CSRD\": Trigger."}]}, {"stage": "Discovery", "narrative": "The director learns in a vendor webinar that the platform already carrying the company's transport orders has an ISO 14083-aligned emissions module \u2014 the activity data needed for credible numbers is already flowing through execution and settlement.", "media": [{"type": "image", "src": "media/journey-tdir-tdir-2-2.png", "title": "Transportation Director journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"Proving transport emissions for CSRD\": Discovery."}]}, {"stage": "Evaluation", "narrative": "The evaluation compares the embedded module against standalone carbon tools: methodology transparency, GLEC alignment, carrier data coverage, and whether auditors will accept the calculation trail. Reusing execution data wins on both cost and credibility.", "media": [{"type": "image", "src": "media/journey-tdir-tdir-2-3.png", "title": "Transportation Director journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"Proving transport emissions for CSRD\": Evaluation."}]}, {"stage": "Trial", "narrative": "The team back-fills one quarter of shipments and compares calculated emissions against the old spend-based estimate; the auditors walk the methodology end to end and accept it. Gaps in carrier-specific fuel data are flagged lane by lane.", "media": [{"type": "image", "src": "media/journey-tdir-tdir-2-4.png", "title": "Transportation Director journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"Proving transport emissions for CSRD\": Trial."}]}, {"stage": "Engagement", "narrative": "Emissions dashboards enter the quarterly business review, carrier-level carbon intensity becomes a scored criterion in tenders, and the sustainability team pulls disclosure extracts without touching a spreadsheet.", "media": [{"type": "image", "src": "media/journey-tdir-tdir-2-5.png", "title": "Transportation Director journey stage 5: Engagement", "alt": "Enterprise journey panel for stage 5 of \"Proving transport emissions for CSRD\": Engagement."}]}, {"stage": "Retention", "narrative": "The CSRD disclosure passes audit on the first pass. The subscription renews with lane benchmarking added, and the director starts pushing strategic carriers to submit primary fuel data to sharpen next year's numbers.", "media": [{"type": "image", "src": "media/journey-tdir-tdir-2-6.png", "title": "Transportation Director journey stage 6: Retention", "alt": "Enterprise journey panel for stage 6 of \"Proving transport emissions for CSRD\": Retention."}]}], "media": [{"type": "image", "src": "media/jou }, "businessKPI": {"northStar": "Platform-managed freight spend", "revenueStreams": ["Enterprise TMS subscriptions", "Transport execution transaction fees", "Freight procurement subscriptions"], "supporting": ["API-tendered load share", "Subscription renewal rate"]}, "milestones": ["Connect the top enterprise accounts' ERP order flow to network tendering via the execution API", "Publish tender awards as live routing guides consumed directly by daily execution", "Extend carrier vetting and trust scoring to every carrier touching enterprise freight"]}, "year3": {"focus": "Expand each account from its entry product to the full lifecycle \u2014 settlement and freight audit as a standard attach, emissions reporting on primary data.", "productTheme": "Full-lifecycle attach and data-backed spend control", "customerKPI": {"northStar": "Freight budget predictability", "supporting": ["Invoice deviation rate", "Shipments with primary CO2 data"]}, "businessKPI": {"northStar": "Lifecycle module attach rate", "revenueStreams": ["Settlement and freight audit fees", "Analytics and benchmark subscriptions", "TMS and procurement subscriptions"], "supporting": ["Settlement attach rate", "Net revenue retention"]}, "milestones": ["Make self-billing and freight audit the default settlement path for contracted carriers", "Ship CSRD-grade emissions reporting computed from execution records", "Launch lane benchmark subscriptions built on network transaction data"]}, "year5": {"focus": "Optimize across the network, not within one account: continuous procurement, predictive capacity, and automated spot-contract balancing per lane.", "productTheme": "Network-optimized procurement", "customerKPI": {"northStar": "Capacity coverage on critical lanes", "supporting": ["Spot exposure share", "Carrier base resilience"]}, "businessKPI": {"northStar": "Integrated execution volume", "revenueStreams": ["Continuous procurement services", "Data products: benchmarks, ETA, and CO2", "Network optimization fees"], "supporting": ["Straight-through order share", "Analytics module adoption"]}, "milestones": ["Introduce continuous mini-tendering that re-prices drifting lanes automatically", "Predict lane-level capacity shortfalls and pre-qualify network backups before they bite", "Automate spot-vs-contract arbitrage inside director-set risk guardrails"]}}}, "domain": "Enterprise Shippers"}, {"id": "tpln", "name": "Transport Planner", "description": "Runs daily planning, tendering, execution, and exception handling for a cluster of plants and distribution centers at an enterprise shipper. Lives in the TMS all day: turns ERP orders into loads, tenders them down the routing guide, books dock slots, watches ETAs, and firefights whatever the road throws back. Judged on loads shipped on time and on how few things escalate.", "icon": "tpln.png", "careAbout": ["Getting the daily load plan tendered and confirmed before the morning is gone", "Carriers who confirm fast with driver and plate details, not silence until pickup", "Live ETAs and alerts that surface problems before the consignee's call does", "Spot cover for rejected loads in minutes, at a defensible price, from carriers that are safe to use", "Dock slots that match the plan so drivers are not queuing while orders slip", "Clean handover to settlement \u2014 no missing PODs chasing at month end"], "winsThem": ["An optimization engine whose load proposals are good enough to accept unchanged", "Routing-guide tendering that cascades automatically and escalates only real problems", "One screen showing every in-transit shipment with credible ETAs and ranked exceptions", "One-click posting of uncovered loads to a spot exchange with pre-vetted responders", "eCMR and POD flowing back digitally, closing orders without paper chasing"], "theirFear": ["Finding out at 16:00 that a morning tender was never accepted and the load hasn't moved", "A production line or retail customer stopped by a delay the planner learned about last", "Covering a hot load with an unknown carrier who turns out to be a fraudster or no-show"], "jobsToBeDone": [{"id": "jtbd-tpln-1", "name": "Plan and tender the daily load plan", "whatItIs": "Turn the overnight ERP order drop into optimized FTL/LTL loads, tender them through the routing guide, and get every load confirmed with carrier, driver, and dock slot before cutoff.", "outcome": "The day's orders become confirmed, dispatched transport orders with minimal manual touches and no loads left silently uncovered.", "steps": [{"step": "Import and validate orders", "description": "Receive transport demand automatically from the ERP, validate addresses, quantities, and delivery windows, and flag incomplete orders before they poison the plan.", "streamsNeeded": [{"id": "plan-and-optimize-transport", "name": "Plan and Optimize Transport", "howItSupports": "Ingests ERP orders, validates master data, and stages them for load building."}], "media": [{"type": "image", "src": "media/jbtd-tpln-jtbd-tpln-1-1.png", "title": "Transport Planner JTBD step 1: Import and validate orders", "alt": "Enterprise infographic for step 1 of the job \"Plan and tender the daily load plan\": Import and validate orders."}]}, {"step": "Build and optimize loads", "description": "Consolidate orders into FTL and LTL loads by route, weight, and time window; review the engine's proposals and adjust only where local knowledge beats the algorithm.", "streamsNeeded": [{"id": "plan-and-optimize-transport", "name": "Plan and Optimize Transport", "howItSupports": "Proposes consolidated, routed loads that respect equipment, driver-time, and delivery-window constraints."}], "media": [{"type": "image", "src": "media/jbtd-tpln-jtbd-tpln-1-2.png", "title": "Transport Planner JTBD step 2: Build and optimize loads", "alt": "Enterprise infographic for step 2 of the job \"Plan and tender the daily load plan\": Build and optimize loads."}]}, {"step": "Tender down the routing guide", "description": "Send each load to the awarded -tpln-2", "name": "Track shipments and resolve exceptions before customers notice", "whatItIs": "Monitor every in-transit shipment against plan, catch delays and disruptions early, execute recovery \u2014 re-slot, re-route, inform \u2014 and close each order with clean delivery evidence.", "outcome": "Disruptions are caught and handled before consignees feel them, and closed orders carry complete documentation into settlement.", "steps": [{"step": "Watch live positions and ETAs", "description": "Track all moving shipments on one board fed by telematics and carrier updates, with ETAs recomputed against booked delivery windows and dock slots.", "streamsNeeded": [{"id": "track-and-manage-exceptions", "name": "Track and Manage Exceptions", "howItSupports": "Aggregates telematics and status feeds into live ETAs matched against promised windows."}], "media": [{"type": "image", "src": "media/jbtd-tpln-jtbd-tpln-2-1.png", "title": "Transport Planner JTBD step 1: Watch live positions and ETAs", "alt": "Enterprise infographic for step 1 of the job \"Track shipments and resolve exceptions before customers notice\": Watch live positions and ETAs."}]}, {"step": "Triage at-risk shipments", "description": "Work a ranked exception queue \u2014 late, silent, or off-route shipments scored by customer impact \u2014 instead of scanning hundreds of green rows for the three red ones.", "streamsNeeded": [{"id": "track-and-manage-exceptions", "name": "Track and Manage Exceptions", "howItSupports": "Scores and ranks exceptions by lateness risk and customer criticality with suggested actions."}], "media": [{"type": "image", "src": "media/jbtd-tpln-jtbd-tpln-2-2.png", "title": "Transport Planner JTBD step 2: Triage at-risk shipments", "alt": "Enterprise infographic for step 2 of the job \"Track shipments and resolve exceptions before customers notice\": Triage at-risk shipments."}]}, {"step": "Execute recovery actions", "description": "Rebook dock slots, notify consignees, arrange rescue capa prise infographic for the job \"Track shipments and resolve exceptions before customers notice\" for customer \"Transport Planner\"."}]}, {"id": "jtbd-tpln-3", "name": "Cover uncovered loads fast on the spot market", "whatItIs": "When the routing guide is exhausted or capacity vanishes, find trustworthy spot capacity on the exchange in minutes: post, compare responders, vet, book, and pull the load back into normal execution.", "outcome": "Uncovered loads become covered loads within the hour, at transparent market prices, with carriers that pass vetting \u2014 no gambling on unknown phone numbers.", "steps": [{"step": "Detect uncovered loads early", "description": "Get alerted the moment a cascade exhausts or a carrier cancels, with hours of runway instead of discovering the gap at pickup time.", "streamsNeeded": [{"id": "execute-transport-orders", "name": "Execute Transport Orders", "howItSupports": "Flags exhausted tender cascades and late cancellations the moment they happen."}], "media": [{"type": "image", "src": "media/jbtd-tpln-jtbd-tpln-3-1.png", "title": "Transport Planner JTBD step 1: Detect uncovered loads early", "alt": "Enterprise infographic for step 1 of the job \"Cover uncovered loads fast on the spot market\": Detect uncovered loads early."}]}, {"step": "Post to the exchange with a target rate", "description": "Publish the load to the freight exchange with equipment, window, and a benchmark-informed target price, reaching tens of thousands of carriers instead of a personal phone list.", "streamsNeeded": [{"id": "match-spot-freight", "name": "Match Spot Freight", "howItSupports": "Posts the load to the network and attracts matching capacity within minutes."}, {"id": "analyze-network-performance", "name": "Analyze Network Performance", "howItSupports": "Suggests a realistic spot price from current lane benchmark data."}], "media": [{"type": "image", "src": "media/jbtd-tpln-jtbd-tpln-3-2.png", "title": "Transport Planner JTBD step 2: Post to the exchange with a target rate", "alt": "Enterprise infographic for step 2 of the job \"Cover uncovered loads fast on the spot market\": Post to the exchange with a target rate."}]}, {"step": "Compare responders and vet before booking", "description": "Review offers with trust scores, documents, and history visible; exclude anyone who fails vetting, however attractive the price.", "streamsNeeded": [{"id": "match-spot-freight", "name": "Match Spot Freight", "howItSupports": "Ranks responding carriers by price, fit, and rating in one comparison view."}, {"id": "onboard-and-trust-network", "name": "Onboard and Trust the Network", "howItSupports": "Shows vetting status, trust score, and fraud signals for every responder before commitment."}], "media": [{"type": "image", "src": "media/jbtd-tpln-jtbd-tpln-3-3.png", "title": "Transport Planner JTBD step 3: Compare responders and vet before booking", "alt": "Enterprise infographic for step 3 of the job \"Cover uncovered loads fast on the spot market\": Compare responders and vet before booking."}]}, {"step": "Book and fold back into execution", "description": "Book the chosen carrier and have the spot load flow into the same execution, tracking, and settlement pipeline as contracted freight \u2014 one process, not a side channel.", "streamsNeeded": [{"id": "match-spot-freight", "name": "Match Spot Freight", "howItSupports": "Confirms the booking and hands over the agreed terms."}, {"id": "execute-transport-orders", "name": "Execute Transport Orders", "howItSupports": "Executes the spot load with the same orders, documents, and tracking as contracted freight."}], "media": [{"type": "image", "src": "media/jbtd-tpln-jtbd-tpln-3-4.png", "title": "Transport Planner JTBD step 4: Book and fold back into execution", "alt": "Enterprise infographic for step 4 of the job \"Cover uncovered loads fast on the spot market\": Book and fold back into execution."}]}], "media": [{"type": "image", "src": "media/jbtd-tpln-jtbd-tpln-3.png", "title": "Transport Planner JTBD infographic: Cover uncovered loads fast on the spot market", "alt": "Enterprise infographic for the job \"Cover uncovered loads fast on the spot market\" for customer \"Transport Planner\"."}]}], "customerJourneyStories": [{"id": "journey-tpln-1", "name": "From phone-and-email tendering to one workspace", "linkedJobIds": ["jtbd-tpln-1", "jtbd-tpln-2"], "summary": "A skeptical transport planner is rolled into the company's new TMS, tests it against their own worst lanes, runs a two-week parallel operation, and ends up the site's key user training new hires.", "stages": [{"stage": "Trigger", "narrative": "The company announces a TMS rollout while the planner is covering loads by phone and email across three plants. The planner has been burned by clunky corporate tools before, and the daily reality is fifty loads with constant interruptions.", "media": [{"type": "image", "src": "media/journey-tpln-tpln-1-1.png", "title": "Transport Planner journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"From phone-and-email tendering to one workspace\": Trigger."}]}, {"stage": "Discovery", "narrative": "In the rollout town hall the planner sees the tender waterfall demoed, then gets a sandbox login and an hour with a planner from the pilot site who shows real screens: routing-guide tendering, carrier responses, and the exception board, not marketing slides.", "media": [{"type": "image", "src": "media/journey-tpln-tpln-1-2.png", "title": "Transport Planner journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"From phone-and-email tendering to one workspace\": Discovery."}]}, {"stage": "Evaluation", "narrative": "The planner stress-tests the sandbox with their own nastiest lanes \u2014 multi-stop deliveries, weekend slots, carriers that only answer by phone \u2014 and files the gaps with the vendor. What convinces them is speed: tendering a load takes seconds, and the exception view shows only what needs a human.", ne-and-email tendering to one workspace\" for customer \"Transport Planner\"."}]}, {"id": "journey-tpln-2", "name": "Covering uncovered loads on the spot market", "linkedJobIds": ["jtbd-tpln-3", "jtbd-tpln-2"], "summary": "When contracted carriers reject Friday loads, the planner discovers the spot-market fallback built into the TMS, books vetted network carriers within the hour, and turns spot cover into a standard part of the planning routine.", "stages": [{"stage": "Trigger", "narrative": "Two contracted carriers reject Friday-afternoon loads and production cannot wait until Monday. The planner's personal list of backup carriers is exhausted by the third phone call, and escalation to the director looms.", "media": [{"type": "image", "src": "media/journey-tpln-tpln-2-1.png", "title": "Transport Planner journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"Covering uncovered loads on the spot market\": Trigger."}]}, {"stage": "Discovery", "narrative": "A colleague points at the button the planner had ignored: post the uncovered load straight from the TMS to the connected freight exchange \u2014 a network of tens of thousands of carriers with hundreds of thousands of offers moving daily.", "media": [{"type": "image", "src": "media/journey-tpln-tpln-2-2.png", "title": "Transport Planner journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"Covering uncovered loads on the spot market\": Discovery."}]}, {"stage": "Evaluation", "narrative": "The planner hesitates over unknown carriers, then inspects what the platform shows per bidder: vetting status, verified insurance, ratings from other shippers, and payment-security options. Spot prices sit within tolerance of contracted rates for the corridor.", "media": [{"type": "image", "src": "media/journey-tpln-tpln-2-3.png", "title": "Transport Planner journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"Covering uncovered loads on the spot market\": Evaluation."}]}, {"stage": "Trial", "narrative": "The two stranded loads are posted; offers arrive within the hour. The planner books a vetted carrier for each, tracking flows into the same exception board as contracted loads, and both deliveries land on time.", "media": [{"type": "image", "src": "media/journey-tpln-tpln-2-4.png", "title": "Transport Planner journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"Covering uncovered loads on the spot market\": Trial."}]}, {"stage": "Engagement", "narrative": "Spot cover becomes the standing fallback: recurring overflow lanes get posting templates, the planner watches the spot-versus-contract spread per corridor, and Friday rejections stop being emergencies.", "media": [{"type": "image", "src": "media/journey-tpln-tpln-2-5.png", "title": "Transport Planner journey stage 5: Engagement", "alt": "Enterprise journey panel for stage 5 of \"Covering uncovered loads on the spot market\": Engagement."}]}, {"stage": "Retention", "narrative": "Coverage without escalation becomes the norm through peak season. The planner asks the vendor for auto-posting rules on aged uncovered loads \u2014 adopting the product deeply enough to shape how it evolves.", "media": [{"type": "image", "src": "media/journey-tpln-tpln-2-6.png", "title": "Transport Planner journey stage 6: Retention", "alt": "Enterprise journey panel for stage 6 of \"Covering uncovered loads on the spot market\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-tpln-tpln-2.png", "title": "Transport Planner customer journey: Covering uncovered loads on the spot market", "alt": "Enterprise journey storyboard for \"Covering uncovered loads on the spot market\" for customer \"Transport Planner\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-tpln-top", "name": "Planner touches per load", "description": "Average number of manual interventions \u2014 calls, emails, re-tenders, status chases \u2014 a planner spends per load from rier Dispatcher journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"Filling empty return legs\": Trigger."}]}, {"stage": "Discovery", "narrative": "A dispatcher at another carrier mentions covering return legs on a freight exchange; the dispatcher compares the big European networks and their coverage on the fleet's corridors, drawn by the volume of daily offers on the lanes they actually run.", "media": [{"type": "image", "src": "media/journey-cdsp-cdsp-1-2.png", "title": "Carrier Dispatcher journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"Filling empty return legs\": Discovery."}]}, {"stage": "Evaluation", "narrative": "The membership fee is weighed against a single saved empty leg per week. The dispatcher checks how counterparties are vetted, whether payment protection is available for unknown shippers, and how disputes are handled across languages and borders.", "media": [{"type": "image", "src": "media/journey-cdsp-cdsp-1-3.png", "title": "Carrier Dispatcher journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"Filling empty return legs\": Evaluation."}]}, {"stage": "Trial", "narrative": "A one-month trial: the first return load out of Lyon is found and booked in forty minutes, the truck comes home loaded, and payment lands on terms. Three more return legs follow in week two.", "media": [{"type": "image", "src": "media/journey-cdsp-cdsp-1-4.png", "title": "Carrier Dispatcher journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"Filling empty return legs\": Trial."}]}, {"stage": "Engagement", "narrative": "Exchange search becomes part of the daily dispatch rhythm \u2014 free capacity is posted ahead of known empty legs, ratings steer counterparty choice, and international legs that used to run empty now carry paying freight.", "media": [{"type": "image", "src": "media/journey-cdsp-cdsp-1-5.png", "title": "Carrier Dispatcher journey stage 5: Engagement", "alt": "Enterprise journey panel for stage 5 of \"Filling empty return legs\": Engagement."}]}, {"stage": "Retention", "narrative": "Empty kilometers drop measurably and the membership upgrades a tier. Through counterparties met on the exchange, the carrier picks up two standing contract relationships \u2014 the spot network becomes a sales channel.", "media": [{"type": "image", "src": "media/journey-cdsp-cdsp-1-6.png", "title": "Carrier Dispatcher journey stage 6: Retention", "alt": "Enterprise journey panel for stage 6 of \"Filling empty return legs\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-cdsp-cdsp-1.png", "title": "Carrier Dispatcher customer journey: Filling empty return legs", "alt": "Enterprise journey storyboard for \"Filling empty return legs\" for customer \"Carrier Dispatcher\"."}]}, {"id": "journey-cdsp-2", "name": "Getting connected to enterprise shippers", "linkedJobIds": ["jtbd-cdsp-2", "jtbd-cdsp-3"], "summary": "When a key shipper mandates digital tendering, the dispatcher onboards to the carrier portal, connects telematics, and discovers that one platform login serves several shipper customers \u2014 turning a compliance demand into a competitive edge.", "stages": [{"stage": "Trigger", "narrative": "The fleet's biggest shipper announces that from next quarter tenders, status updates, and PODs must flow digitally \u2014 fax and phone will no longer be accepted. Losing the contract is not an option.", "media": [{"type": "image", "src": "media/journey-cdsp-cdsp-2-1.png", "title": "Carrier Dispatcher journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"Getting connected to enterprise shippers\": Trigger."}]}, {"stage": "Discovery", "narrative": "The shipper's invitation email leads to the carrier portal onboarding webinar, where the dispatcher realizes the platform behind the mandate is a network: other shippers the fleet serves are already on it, reachable through the same login.", "media": [{"type": "image"  terms both ways, and grow the pool deliberately on lanes where coverage is thin.", "outcome": "A rated, growing pool that covers most volume at predictable quality \u2014 with the open network as overflow, not as a nightly gamble.", "steps": [{"step": "Vet before first use", "description": "Run every candidate through document, insurance, and fraud screening before they touch client cargo \u2014 including the subtle checks for cloned identities and double-brokering fronts.", "streamsNeeded": [{"id": "onboard-and-trust-network", "name": "Onboard and Trust the Network", "howItSupports": "Provides deep vetting reports, identity verification, and fraud-pattern screening for candidate carriers."}], "media": [{"type": "image", "src": "media/jbtd-fwdr-jtbd-fwdr-2-1.png", "title": "Freight Forwarder Operator JTBD step 1: Vet before first use", "alt": "Enterprise infographic for step 1 of the job \"Manage a trusted subcontractor pool\": Vet before first use."}]}, {"step": "Rate performance after every load", "description": "Capture punctuality, communication, document speed, and incidents per carrier automatically from execution data, building the pool ranking from facts rather than memory.", "streamsNeeded": [{"id": "onboard-and-trust-network", "name": "Onboard and Trust the Network", "howItSupports": "Aggregates per-carrier performance into ratings visible at booking time."}, {"id": "analyze-network-performance", "name": "Analyze Network Performance", "howItSupports": "Trends pool performance by carrier and lane, flagging decay before clients notice it."}], "media": [{"type": "image", "src": "media/jbtd-fwdr-jtbd-fwdr-2-2.png", "title": "Freight Forwarder Operator JTBD step 2: Rate performance after every load", "alt": "Enterprise infographic for step 2 of the job \"Manage a trusted subcontractor pool\": Rate performance after every load."}]}, {"step": "Secure terms and settlement both ways", "description": "Agree payment terms with pool carriers, keep settlement fast and ustry fraud case, and a major client responds by auditing the forwarder's subcontractor controls. The current control is a spreadsheet of insurance expiry dates, maintained when someone remembers.", "media": [{"type": "image", "src": "media/journey-fwdr-fwdr-2-1.png", "title": "Freight Forwarder Operator journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"Vetting subcontractors without spreadsheets\": Trigger."}]}, {"stage": "Discovery", "narrative": "In the wave of post-fraud webinars the forwarder sees the exchange's vetting and trust tooling properly for the first time: continuous license and insurance monitoring, company verification, and fraud signals on the carriers they already book.", "media": [{"type": "image", "src": "media/journey-fwdr-fwdr-2-2.png", "title": "Freight Forwarder Operator journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"Vetting subcontractors without spreadsheets\": Discovery."}]}, {"stage": "Evaluation", "narrative": "The evaluation pits automated monitoring against the true cost of manual document chasing across a fifty-carrier pool; legal reviews what data is checked and how counterparties consent. The audit deadline decides the timeline.", "media": [{"type": "image", "src": "media/journey-fwdr-fwdr-2-3.png", "title": "Freight Forwarder Operator journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"Vetting subcontractors without spreadsheets\": Evaluation."}]}, {"stage": "Trial", "narrative": "The top-fifty subcontractor pool goes under automated monitoring; two expired insurance certificates surface in the first week \u2014 exactly the exposure the client's auditors were probing for.", "media": [{"type": "image", "src": "media/journey-fwdr-fwdr-2-4.png", "title": "Freight Forwarder Operator journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"Vetting subcontractors without spreadsheets\": Trial."}]}, {"stage": "Engagement", "narrative": "The booking flow now blocks non-compliant subcontractors automatically, and the client audit passes with a system-generated evidence trail instead of a spreadsheet printout.", "media": [{"type": "image", "src": "media/journey-fwdr-fwdr-2-5.png", "title": "Freight Forwarder Operator journey stage 5: Engagement", "alt": "Enterprise journey panel for stage 5 of \"Vetting subcontractors without spreadsheets\": Engagement."}]}, {"stage": "Retention", "narrative": "Verified-pool coverage becomes a line in the forwarder's own sales pitch to enterprise clients, and monitoring extends to the entire subcontractor base. What began as audit pressure is now a differentiator.", "media": [{"type": "image", "src": "media/journey-fwdr-fwdr-2-6.png", "title": "Freight Forwarder Operator journey stage 6: Retention", "alt": "Enterprise journey panel for stage 6 of \"Vetting subcontractors without spreadsheets\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-fwdr-fwdr-2.png", "title": "Freight Forwarder Operator customer journey: Vetting subcontractors without spreadsheets", "alt": "Enterprise journey storyboard for \"Vetting subcontractors without spreadsheets\" for customer \"Freight Forwarder Operator\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-fwdr-top", "name": "Client load coverage rate", "description": "Share of client transport orders covered with subcontracted capacity by the promised deadline.", "unit": "%", "currentValue": "94", "targetValue": "99", "link": "https://dashboard.example.com/transport-management-and-freight-exchange/customers/fwdr/kpis/co-fwdr-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-fwdr-co-fwdr-top.png"}, "branches": [{"id": "co-fwdr-b1", "name": "Sourcing speed and depth", "description": "How fast and how reliably the desk finds trucks \u2014 from the trusted pool first, the open network second.", "currentValue": "61", "icon": "kpi-fwdr-co-fwdr-b1.png", "children": [{"id": "co-fwdr-b1-c1", "name": "Subco ount economics", "description": "Revenue per forwarder account and the retention that compounds it.", "currentValue": "55", "icon": "kpi-fwdr-bo-fwdr-b2.png", "children": [{"id": "bo-fwdr-b2-c1", "name": "Revenue per forwarder account", "description": "Monthly platform revenue per forwarder account across subscriptions, transactions, and trust services.", "unit": "EUR / month", "currentValue": "620", "targetValue": "900", "icon": "kpi-fwdr-bo-fwdr-b2-c1.png", "children": [{"id": "bo-fwdr-b2-c1-l1", "name": "Premium visibility attach rate", "description": "Share of accounts paying for boosted placement of their postings.", "unit": "%", "currentValue": "24", "targetValue": "40", "icon": "kpi-fwdr-bo-fwdr-b2-c1-l1.png", "children": []}, {"id": "bo-fwdr-b2-c1-l2", "name": "Trust report purchases per account", "description": "Paid vetting and trust reports pulled per account per month.", "unit": "per month", "currentValue": "11", "targetValue": "20", "icon": "kpi-fwdr-bo-fwdr-b2-c1-l2.png", "children": []}]}, {"id": "bo-fwdr-b2-c2", "name": "Forwarder account retention", "description": "Share of forwarder accounts renewing year over year.", "unit": "%", "currentValue": "90", "targetValue": "95", "icon": "kpi-fwdr-bo-fwdr-b2-c2.png", "children": [{"id": "bo-fwdr-b2-c2-l1", "name": "Support escalations per account", "description": "Support escalations per account per quarter \u2014 friction that predicts churn.", "unit": "per quarter", "currentValue": "2.6", "targetValue": "1.0", "icon": "kpi-fwdr-bo-fwdr-b2-c2-l1.png", "children": []}, {"id": "bo-fwdr-b2-c2-l2", "name": "Dispute resolution time", "description": "Median days to resolve a transaction dispute between network parties.", "unit": "days", "currentValue": "12", "targetValue": "4", "icon": "kpi-fwdr-bo-fwdr-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make the forwarder's subcontracting desk a data-driven operation: post, match, vet, book, track, and settle both sides of every load on one network.", "timeHorizons": {"year1": {"focus": "Win the desk's daily routine with fast two-sided liquidity and vetting strong enough to hand strangers a client's cargo.", "productTheme": "Liquidity with built-in vetting", "customerKPI": {"northStar": "Client load coverage rate", "supporting": ["Subcontractor fill time", "Pool response rate to offers"]}, "businessKPI": {"northStar": "Both-sides-active account share", "revenueStreams": ["Exchange subscriptions", "Posting and booking fees"], "supporting": ["Freight offers posted per account", "Truck searches per account"]}, "milestones": ["Unify posting and searching across the exchange brands into one forwarder workspace", "Ship staged pool-first, network-second posting flows", "Put deep vetting reports one click from every offer comparison"]}, "year3": {"focus": "Turn the subcontractor pool into a managed product: performance ratings from execution data, framework terms, and settlement that buys loyalty.", "productTheme": "The managed subcontractor pool", "customerKPI": {"northStar": "Trusted pool coverage", "supporting": ["Matching recommendation acceptance", "Subcontractor on-time delivery rate"]}, "businessKPI": {"northStar": "Revenue per forwarder account", "revenueStreams": ["Trust and vetting reports", "Premium visibility", "Subscriptions and transaction fees"], "supporting": ["Trust report purchases per account", "Premium visibility attach rate"]}, "milestones": ["Auto-rate subcontractor performance from execution and document data", "Launch pool management with framework terms and rotation analytics", "Make both-sides settlement a single flow from POD to two invoices"]}, "year5": {"focus": "Price and route across the whole network: margin intelligence per lane, predictive fill-time warnings, and cross-exchange arbitrage as a native tool.", "productTheme": "Margin intelligence across the network", "customerKPI": {"northStar": "Gross margin per load", "supporting": ["Buy rate vs lane benchmark", "POD returned within 48 hours"]}, "businessKPI": {"northStar": "Two-sided transactions per forwarder account", "revenueStreams": ["Transaction fees", "Benchmark data products", "Settlement services"], "supporting": ["Cross-exchange reach", "Forwarder account retention"]}, "milestones": ["Ship lane-level margin analytics comparing client rates, buy rates, and benchmarks", "Predict fill-time risk per lane and prompt pool recruitment before gaps open", "Enable cross-exchange capacity search as one liquidity pool"]}}}, "domain": "Freight Forwarders and Brokers"}, {"id": "dksm", "name": "Dock Site Manager", "description": "Runs inbound and outbound docks at a plant or distribution center. Owns the daily tension between warehouse shift capacity and the trucks that arrive whenever they arrive: a morning wall of unannounced arrivals, idle docks after lunch, detention claims at month end. Wants a day that flows \u2014 slots booked, trucks on time, crews steady \u2014 and hates being the bottleneck everyone else's KPI blames.", "icon": "dksm.png", "careAbout": ["Smooth slot utilization across the day instead of a 6 a.m. wall and dead afternoons", "Trucks arriving in their windows \u2014 and knowing early when they won't", "Short gate-to-gate turnaround that keeps carriers cooperative and detention claims low", "Warehouse crews planned against a believable arrival schedule, not a guess", "Paperless gates: no clipboard queues, no lost CMRs at the window", "Being able to prove with data which delays were the site's fault and which weren't"], "winsThem": ["Self-service slot booking that carriers actually use, with rules the site controls", "Live ETAs feeding the dock plan so late trucks are re-slotted before they collide with on-time ones", "A day view that turns arrival chaos into a schedule the warehouse can staff against", "App and kiosk check-in that clears the gate queue and feeds turnaround data automatically", "Turnaround and detention analytics that settle disputes with facts"], "theirFear": ["A peak morning where the yard gridlocks, crews stand idle, and production waits on trapped trailers", "Detention claims the site cannot disprove because arrival and loading times were never recorded", "Carriers derating the site as a slow, hostile stop \u2014 and pricing every future load accordingly"], "jobsToBeDone": [{"id": "jtbd-dksm-1", "name": "Smooth dock utilization across the day", "whatItIs": "Shape truck arrivals to the site's real capacity: publish slot capacity and booking rules, get carriers and planners booking ahead, rebalance the day with live ETAs, and learn from utilization patterns.", "outcome": "Arrivals spread across the operating day at a rhythm the warehouse can staff for \u2014 no morning wall, no dead docks, no overtime lottery.", "steps": [{"step": "Publish capacity and booking rules", "description": "Define slots per dock, equipment constraints, and booking rules \u2014 lead times, priorities for production-critical materials \u2014 and publish them where every carrier and planner books.", "streamsNeeded": [{"id": "schedule-docks-and-yards", "name": "Schedule Docks and Yards", "howItSupports": "Publishes slot capacity and enforces the site's booking rules automatically."}], "media": [{"type": "image", "src": "media/jbtd-dksm-jtbd-dksm-1-1.png", "title": "Dock Site Manager JTBD step 1: Publish capacity and booking rules", "alt": "Enterprise infographic for step 1 of the job \"Smooth dock utilization across the day\": Publish capacity and booking rules."}]}, {"step": "Get arrivals booked ahead", "description": "Pull shipper planners and carriers into pre-booking by making the booked lane visibly faster than turning up blind \u2014 bookings created from transport orders, not phone calls.", "streamsNeeded": [{"id": "schedule-docks-and-yards", "name": "Schedule Docks and Yards", "howItSupports": "Offers self-service booking to carriers and planners linked to their transport orders."}, {"id": "execute-transport-orders", "name": "Execute Transport Orders", "howItSupports": "Creates slot bookings directly from confirmed transport orders so the plan and the dock agree."}], "media": [{"type": "image", "src": "media/jbtd-dksm-jtbd-dksm-1-2.png", "title": "Dock Site Manager JTBD step 2: Get arrivals booked ahead", "alt": "Enterprise infographic for step 2 of the job \"Smooth dock utilization across the day\": Get arrivals booked ahead."}]}, {"step": "Rebalance the day on live ETAs", "description": "Watch inbound ETAs against booked slots and re-slot early \u2014 moving a late truck to 14:00 at 09:00 is a plan; discovering it at 11:55 is a queue.", "streamsNeeded": [{"id": "schedule-docks-and-yards", "name": "Schedule Docks and Yards", "howItSupports": "Re-slots at-risk bookings against remaining capacity with minimal disruption."}, {"id": "track-and-manage-exceptions", "name": "Track and Manage Exceptions", "howItSupports": "Feeds live ETAs that flag at-risk arrivals hours ahead."}], "media": [{"type": "image", "src": "media/jbtd-dksm-jtbd-dksm-1-3.png", "title": "Dock Site Manager JTBD step 3: Rebalance the day on live ETAs", "alt": "Enterprise infographic for step 3 of the job \"Smooth dock utilization across the day\": Rebalance the day on live ETAs."}]}, {"step": "Learn from utilization patterns", "description": "Review utilization, no-shows, and peak patterns weekly; adjust slot grids and rules so the schedule converges on how the site actually flows.", "streamsNeeded": [{"id": "analyze-network-performance", "name": "Analyze Network Performance", "howItSupports": "Reports utilization, no-show, and punctuality patterns by day, dock, and carrier."}], "media": [{"type": "image", "src": "media/jbtd-dksm-jtbd-dksm-1-4.png", "title": "Dock Site Manager JTBD step 4: Learn from utilization patterns", "alt": "Enterprise infographic for step 4 of the job \"Smooth dock utilization across the day\": Learn from utilization patterns."}]}], "media": [{"type": "image", "src": "media/jbtd-dksm-jtbd-dksm-1.png", "title": "Dock Site Manager JTBD infographic: Smooth dock utilization across the day", "alt": "Enterprise infographic for the job \"Smooth dock utilization across the day\" for customer \"Dock Site Manager\"."}]}, {"id": "jtbd-dksm-2", "name": "Cut truck waiting and turnaround times", "whatItIs": "Move every truck gate-in to gate-out fast: digital check-in, sequenced yard call-off, paperless documents at the dock, and turnaround data that finds the next bottleneck and kills detention disputes.", "outcome": "Turnaround times carriers plan around instead of pricing against, detention costs cut, and gate staff freed from clipboard triage.", "steps": [{"step": "Digitize gate check-in", "description": "Let drivers check in by app or kiosk with booking reference and digital documents, so the gate confirms identity and slot in seconds instead of processing paper in a queue.", "streamsNeeded": [{"id": "schedule-docks-and-yards", "name": "Schedule Docks and Yards", "howItSupports": "Runs app and kiosk check-in matched to bookings and captures arrival timestamps automatically."}], "media": [{"type": "image", "src": "media/jbtd-dksm-jtbd-dksm-2-1.png", "title": "Dock Site Manager JTBD step 1: Digitize gate check-in", "alt": "Enterprise infographic for step 1 of the job \"Cut truck waiting and turnaround times\": Digitize gate check-in."}]}, {"step": "Sequence the yard with call-offs", "description": "Hold checked-in trucks in a buffer and call them to docks in sequence \u2014 drivers wait informed in the cab, docks never idle waiting for a truck that's lost in the yard.", "streamsNeeded": [{"id": "schedule-docks-and-yards", "name": "Schedule Docks and Yards", "howItSupports": "Manages the yard buffer and pushes call-off notifications to drivers in their language."}], "media": [{"type": "image", "src": "media/jbtd-dksm-jtbd-dksm-2-2.png", "title": "Dock Site Manager JTBD step 2: Sequence the yard with call-offs", "alt": "Enterprise infographic for step 2 of the job \"Cut truck waiting and turnaround times\": Sequence the yard with call-offs."}]}, {"step": "Go paperless at the dock", "description": "Handle eCMR and delivery documents digitally at loading and unloading, cutting minutes per truck at the window and ending the lost-CMR payment blockers.", "streamsNeeded": [{"id": "execute-transport-orders", "name": "Execute Transport Orders", "howItSupports": "Provides eCMR signing and digital document exchange at the dock."}, {"id": "schedule-docks-and-yards", "name": "Schedule Docks and Yards", "howItSupports": "Ties document completion into the gate-out flow so paperwork never strands a loaded truck."}], "media": [{"type": "image", "src": "media/jbtd-dksm-jtbd-dksm-2-3.png", "title": "Dock Site Manager JTBD step 3: Go paperless at the dock", "alt": "Enterprise infographic for step 3 of the job \"Cut truck waiting and turnaround times\": Go paperless at the dock."}]}, {"step": "Measure turnaround and settle disputes with data", "description": "Track gate-in to gate-out per truck automatically, find the recurring bottlenecks, and resolve detention claims from timestamps instead of arguments.", "streamsNeeded": [{"id": "analyze-network-performance", "name": "Analyze Network Performance", "howItSupports": "Breaks down turnaround by stage and flags systematic bottlenecks."}, {"id": "settle-and-audit-freight", "name": "Settle and Audit Freight", "howItSupports": "Settles detention claims against recorded arrival and loading timestamps."}], "media": [{"type": "image", "src": "media/jbtd-dksm-jtbd-dksm-2-4.png", "title": "Dock Site Manager JTBD step 4: Measure turnaround and settle disputes with data", "alt": "Enterprise infographic for step 4 of the job \"Cut truck waiting and turnaround times\": Measure turnaround and settle disputes with data."}]}], "media": [{"type": "image", "src": "media/jbtd-dksm-jtbd-dksm-2.png", "title": "Dock Site Manager JTBD infographic: Cut truck waiting and turnaround times", "alt": "Enterprise infographic for the job \"Cut truck waiting and turnaround times\" for customer \"Dock Site Manager\"."}]}], "customerJourneyStories": [{"id": "journey-dksm-1", "name": "From queueing trucks to booked slots", "linkedJobIds": ["jtbd-dksm-1", "jtbd-dksm-2"], "summary": "A dock site manager plagued by Monday truck queues pilots slot booking on inbound docks, wins carrier adoption through the transport orders already on the platform, and rolls the model out to every dock and a sister site.", "stages": [{"stage": "Trigger", "narrative": "Eighteen trucks queue on a Monday morning, demurrage claims stack up, forklift crews burn overtime, and one carrier openly threatens to refuse the site. The yard, not the warehouse, has become the bottleneck.", "media": [{"type": "image", "src": "media/journey-dksm-dksm-1-1.png", "title": "Dock Site Manager journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"From queueing trucks to booked slots\": Trigger."}]}, {"stage": "Discovery", "narrative": "The company's transport team proposes the dock scheduling module of the platform that already carries their transport orders, and arranges a visit to a reference site where every arrival has a booked slot and the yard is quiet at 8 a.m.", "media": [{"type": "image", "src": "media/journey-dksm-dksm-1-2.png", "title": "Dock Site Manager journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"From queueing trucks to booked slots\": Discovery."}]}, {"stage": "Evaluation", "narrative": "The manager's core doubt is carrier adoption \u2014 will drivers actually book slots? The evaluation focuses on the booking link traveling with each transport order, the multilingual driver flow, and a shift-capacity model that matches warehouse reality; the business case is written in waiting-time claims.", "media": [{"type": "image", "src": "media/journey-dksm-dksm-1-3.png", "title": "Dock Site Manager journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"From queueing trucks to booked slots\": Evaluation."}]}, {"stage": "Trial", "narrative": "A six-week pilot on inbound docks only: carriers book through the link on their transport orders, slot compliance is measured weekly, and the Monday queue shrinks visibly by week three.", "media": [{"type": "image", "src": "media/journey-dksm-dksm-1-4.png", "title": "Dock Site Manager journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"From queueing trucks to booked slots\": Trial."}]}, {"stage": "Engagement", "narrative": "All docks run slot-managed; the day starts from the booked arrival plan, deviations are flagged as they develop, and slot data feeds daily shift planning. Demurrage conversations turn from arguments into exceptions.", "media": [{"type": "image", "src": "media/journey-dksm-dksm-1-5.png", "title": "Dock Site Manager journey stage 5: Engagement", "alt": "Enterprise journey panel for stage 5 of \"From queueing trucks to booked slots\": Engagement."}]}, {"stage": "Retention", "narrative": "Truck turnaround drops and waiting-time claims stop. Slots extend to outbound and weekends, and the manager exports the playbook to a sister site \u2014 the pilot skeptic is now the internal champion.", "media": [{"type": "image", "src": "media/journey-dksm-dksm-1-6.png", "title": "Dock Site Manager journey stage 6: Retention", "alt": "Enterprise journey panel for stage 6 of \"From queueing trucks to booked slots\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-dksm-dksm-1.png", "title": "Dock Site Manager customer journey: From queueing trucks to booked slots", "alt": "Enterprise journey storyboard for \"From queueing trucks to booked slots\" for customer \"Dock Site Manager\"."}]}, {"id": "journey-dksm-2", "name": "Making site performance visible", "linkedJobIds": ["jtbd-dksm-2", "jtbd-dksm-1"], "summary": "Challenged over poor carrier ratings of the site, the manager adopts the slot analytics in the dock module, validates the numbers against gate logs, and turns a monthly KPI pack into the company standard for all sites.", "stages": [{"stage": "Trigger", "narrative": "The logistics director forwards carrier feedback ranking the site among the worst they serve and asks for an explanation. Beyond anecdotes and a gatehouse logbook, the manager has no data to answer with.", "media": [{"type": "image", "src": "media/journey-dksm-dksm-2-1.png", "title": "Dock Site Manager journey stage 1: Trigger", "alt": "Enterprise journey panel for stage 1 of \"Making site performance visible\": Trigger."}]}, {"stage": "Discovery", "narrative": "Digging into the dock module the site already uses for slots, the manager finds the analytics view: turnaround times, slot adherence, arrival-curve patterns, and a benchmark against comparable sites on the network.", "media": [{"type": "image", "src": "media/journey-dksm-dksm-2-2.png", "title": "Dock Site Manager journey stage 2: Discovery", "alt": "Enterprise journey panel for stage 2 of \"Making site performance visible\": Discovery."}]}, {"stage": "Evaluation", "narrative": "Trust in the numbers comes first: a week of metrics is checked against the gate log by hand, and the manager confirms carriers see the same figures \u2014 a shared fact base rather than another internal report.", "media": [{"type": "image", "src": "media/journey-dksm-dksm-2-3.png", "title": "Dock Site Manager journey stage 3: Evaluation", "alt": "Enterprise journey panel for stage 3 of \"Making site performance visible\": Evaluation."}]}, {"stage": "Trial", "narrative": "One quarter of turnaround and slot-adherence reporting goes into the monthly ops review; late-slot patterns point at two recurring causes \u2014 a tightly stacked morning window and one chronically late-docking product line.", "media": [{"type": "image", "src": "media/journey-dksm-dksm-2-4.png", "title": "Dock Site Manager journey stage 4: Trial", "alt": "Enterprise journey panel for stage 4 of \"Making site performance visible\": Trial."}]},     function jobNamesForCustomer(jobIds) {
        const jobs = (customer.jobsToBeDone || []);
        const jobLookup = {};
        jobs.forEach(job => {
            if (job.id) {
                jobLookup[job.id] = job.name || job.id;
            }
        });
        return (jobIds || []).map(jobId => jobLookup[jobId] || jobId);
    }

    function kpiNamesForLink(link) {
        // Prefer stable KPI IDs resolved against this customer's KPI pyramid; fall back to legacy display-name kpis.
        if (link && link.kpiIds && link.kpiIds.length) {
            const lookup = {};
            function walk(node) {
                if (!node) return;
                if (node.id) {
                    lookup[node.id] = node.name || node.id;
                }
                (node.branches || []).forEach(walk);
                (node.children || []).forEach(walk);
            }
            const pyramids = (customer || {}).kpiPyramids || {};
            ['customerOutcomes', 'businessOutcomes'].forEach(key => {
                const pyramid = pyramids[key];
                if (!pyramid) return;
                walk(pyramid.top);
                (pyramid.branches || []).forEach(walk);
            });
            return link.kpiIds.map(kpiId => lookup[kpiId] || kpiId);
        }
        return (link && link.kpis) || [];
    }

    function kpiIconFile(node) {

    function kpiCurrentValue(node) {

        return String(node.currentValue) + (node.unit ? ' (' + String(node.unit) + ')' : '');
    }

    function kpiValueStatusLabel(node) {
        if (!node || !node.valueStatus) {
            return '';
        }
        const labels = {
            example: 'illustrative example',
            baseline: 'measured baseline',
            target: 'target',
            placeholder: 'placeholder'

        return labels[node.valueStatus] || String(node.valueStatus);
    }

    function renderKpiMeta(node) {
        let html = '';
        if (node && node.currentValue) {

            const valueLabel = (node.valueStatus === 'target') ? 'Target:' : 'Current:';
            html += '<div style="font-size: 80%; color: #1d4ed8; margin-top: 4px"><b>' + valueLabel + '</b> ' + escapeHtml(kpiCurrentValue(node));
            if (statusLabel) {
                html += ' <span style="color:#888; font-style: italic;">(' + escapeHtml(statusLabel) + ')</span>';
            }
            html += '</div>';
        }
        if (node && node.target) {
            html += '<div style="font-size: 80%; color: #047857; margin-top: 2px"><b>Target:</b> ' + escapeHtml(String(node.target)) + '</div>';
        }
        if (node && node.guardrailRole) {
            html += '<div style="font-size: 78%; color: #b91c1c; margin-top: 2px"><b>Guardrail:</b> ' + escapeHtml(String(node.guardrailRole)) + '</div>';
        }
        if (node && (node.period || node.calculationMethod || node.valueSource)) {
            html += '<div style="font-size: 76%; color: #6b7280; margin-top: 3px">';
            if (node.period) { html += '<div><b>Period:</b> ' + escapeHtml(String(node.period)) + '</div>'; }
            if (node.calculationMethod) { html += '<div><b>How measured:</b> ' + escapeHtml(String(node.calculationMethod)) + '</div>'; }
            if (node.valueSource) { html += '<div><b>Value source:</b> ' + escapeHtml(String(node.valueSource)) + '</div>'; }
            html += '</div>';
        }
        if (node && node.guardrail) {
            html += '<div style="font-size: 76%; color: #7c3aed; margin-top: 3px"><b>Composite guardrail:</b> ' + escapeHtml(String(node.guardrail)) + '</div>';

        if (node && node.link) {
            html += '<div style="font-size: 80%; margin-top: 4px"><a target="_blank" rel="noopener noreferrer" href="' + escapeHtml(node.link) + '">' + escapeHtml(node.linkLabel || 'Open link') + '</a></div>';

    function normalizeRoadmapKpi(value, supportingKey) {
        if (!value) {

        if (typeof value === 'string') {

        }
        const normalized = Object.assign({}, value);
        normalized.northStar = normalized.northStar || normalized.name || '';
        normalized[supportingKey] = normalized[supportingKey] || [];
        return normalized;
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function formatDate(dateValue) {
        if (!dateValue) return 'No date';
        const date = new Date(dateValue + 'T00:00:00');
        if (isNaN(date.getTime())) return dateValue;
        return date.toLocaleDateString('en-GB', {year: 'numeric', month: 'short', day: 'numeric'});
    }

    function renderKpis(items) {
        let html = '';
        items.forEach(item => {
            html += '<div><b>' + escapeHtml(item.kpi) + '</b>';
            if (item.unit) {
                html += ' <span class="activity-muted">(' + escapeHtml(item.unit) + ')</span>';
            }
            if (item.expectedImpact) {
                html += ': ' + escapeHtml(item.expectedImpact);
            }
            if (item.currentValue) {
                html += '<div class="activity-muted"><b>Current:</b> ' + escapeHtml(String(item.currentValue)) + '</div>';
            }
            if (item.description) {
                html += '<div class="activity-muted">' + escapeHtml(item.description) + '</div>';
            }
            if (item.link) {
                html += '<div class="activity-muted"><a target="_blank" rel="noopener noreferrer" href="' + escapeHtml(item.link) + '">' + escapeHtml(item.linkLabel || 'Open link') + '</a></div>';
            }
            html += '</div>';
        });
        return html;
    }

    function renderImpactCell(item, currentCustomerId) {
        let html = '';
        (item.customerImpact || []).forEach(impact => {
            const isCurrent = impact.customerId === currentCustomerId;
            html += '<div class="activity-block' + (isCurrent ? ' activity-pill-highlight' : '') + '">';
            html += '<div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">';
            html += '<img class="activity-icon activity-icon-round" src="../icons/' + escapeHtml(impact.customer.icon) + '" onerror="this.onerror=null;this.src=\'../icons/customer.png\'">';
            html += '<div><div style="font-weight:bold; color:' + (isCurrent ? '#1d4ed8' : '#111827') + '">' + escapeHtml(impact.customer.name) + ' <span class="activity-muted">(' + escapeHtml(impact.customerId) + ')</span></div></div>';
            html += '</div>';
            html += renderKpis(impact.customerKPIs || []);
            html += renderKpis(impact.businessKPIs || []);
            html += '</div>';
        });
        return html || '<span class="activity-muted">No customer impact listed</span>';
    }

    function renderBrickCell(item) {
        let html = '';
        (item.productBricks || []).forEach(brick => {
            html += '<div class="activity-pill">';
            html += '<img class="activity-icon" src="../../product-bricks/icons/' + escapeHtml(brick.brick.icon) + '" onerror="this.onerror=null;this.src=\'../../product-bricks/icons/logo.png\'">';
            html += '<div><div><b>' + escapeHtml(brick.brick.name) + '</b> <span class="activity-muted">(#' + escapeHtml(brick.brickId) + ')</span></div><div class="activity-muted">' + escapeHtml(brick.change) + '</div></div>';
            html += '</div>';

        return html || '<span class="activity-muted">No product bricks listed</span>';

    function renderChannelCell(item) {

            html += '<div><div><b>' + escapeHtml(channel.channel.name) + '</b> <span class="activity-muted">(' + escapeHtml(channel.channelId) + ')</span></div><div class="activity-muted">' + escapeHtml(channel.change) + '</div></div>';
            html += '</div>';

        return html || '<span class="activity-muted">No delivery channels listed</span>';
    }

    function renderActivityTable(data, kind, currentCustomerId) {
        const items = (data && data.items) ? data.items : [];
        let html = '';
        html += '<div class="activity-summary">';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.length + '</div><div class="activity-stat-label">' + kind + '</div></div>';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.filter(item => (item.customerImpact || []).length > 0).length + '</div><div class="activity-stat-label">With customer impact</div></div>';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.filter(item => (item.productBricks || []).length > 0).length + '</div><div class="activity-stat-label">With bricks</div></div>';
        html += '</div>';

        if (!items.length) {
            html += '<div class="group" style="margin-top:0">No related ' + kind.toLowerCase() + ' found for this customer.</div>';
            return html;
        }

        html += '<table class="activity-table">';
        html += '<tr><th>Date</th><th>Description</th><th>Customer Impact</th><th>Product Bricks</th><th>Delivery Channels</th></tr>';
        items.forEach(item => {
            html += '<tr>';
            html += '<td style="white-space:nowrap">' + escapeHtml(formatDate(item.date)) + '</td>';
            html += '<td><a class="activity-link" target="_blank" rel="noopener noreferrer" href="../../' + kind.toLowerCase() + '/landing_pages/' + item.landingPageIndex + '.html">' + escapeHtml(item.description || item.name || kind) + '</a></td>';
            html += '<td>' + renderImpactCell(item, currentCustomerId) + '</td>';
            html += '<td>' + renderBrickCell(item) + '</td>';
            html += '<td>' + renderChannelCell(item) + '</td>';
            html += '</tr>';
        });
        html += '</table>';
        return html;
    }

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);

            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }
