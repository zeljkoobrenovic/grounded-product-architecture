    <style>
    /* Shared design tokens for all generated pages.
       Canonical palette promoted from the evidence-explorer page, plus the
       de-facto grays/blues already used across templates. New CSS should use
       these instead of hex literals; existing literals migrate opportunistically. */
    :root {
        /* surfaces */
        --bg: #f6f8fb;
        --panel: #ffffff;
        --surface: #f8fafc;
        --surface-muted: #eef2f7;
        --surface-fallback: #f8fafc;

        /* text */
        --ink: #1f2430;
        --ink-soft: #5b6472;
        --muted: #6b7280;
        --muted-strong: #8a94a6;

        /* lines and borders */
        --line: #e5e7eb;
        --line-strong: #d1d5db;
        --group-border: #d8e0ea;

        /* accent */
        --accent: #2563eb;
        --accent-ink: #1d4ed8;
        --accent-soft: #eff4ff;
        --accent-line: #c9dbff;
        --highlight-color: #dbeafe;

        /* shape and depth */
        --radius: 14px;
        --radius-sm: 10px;
        --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 6px 18px rgba(16, 24, 40, 0.06);
        --shadow-hover: 0 2px 6px rgba(16, 24, 40, 0.08), 0 14px 30px rgba(16, 24, 40, 0.12);
        --card-shadow: rgba(0, 0, 0, 0.15) 0px 2px 8px;
    }
</style>

    <style>
    .tab {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 4px;
    }

    .tab button {
        position: relative;
        background-color: transparent;
        border: none;
        outline: none;
        cursor: pointer;
        padding: 11px 16px;
        margin-bottom: -1px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        color: #6b7280;
        border-bottom: 2px solid transparent;
        border-radius: 8px 8px 0 0;
        transition: color 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
    }

    .tab button:hover {
        color: #1f2937;
        background-color: #f3f4f6;
    }

    .tab button:focus-visible {
        outline: 2px solid #1d4ed8;
        outline-offset: -2px;
    }

    .tab button.active {
        color: #1d4ed8;
        border-bottom-color: #1d4ed8;
    }

    .tabcontent {
        display: none;
        padding: 2px 2px;
        animation: tabContentFade 0.2s ease;
    }

    @keyframes tabContentFade {
        from {
            opacity: 0;
            transform: translateY(3px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 720px) {
        .tab {
            flex-direction: column;
            gap: 0;
        }

        .tab button {
            width: 100%;
            text-align: left;
            margin-bottom: 0;
            border-bottom: 1px solid #e5e7eb;
            border-radius: 0;
        }

        .tab button.active {
            border-bottom-color: #1d4ed8;
        }
    }
</style>

            border-radius: 8px;
            background-color: #f8fafc;
            padding: 14px;
        }

        .matrix-shell {
            min-width: 0;
        }

        .matrix-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }

        .matrix-table-wrap {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background-color: white;
            overflow: auto;
            max-height: 75vh;
        }

        .matrix-table {
            border-collapse: collapse;
            width: max-content;
            min-width: 100%;
        }

        .matrix-table th,
        .matrix-table td {
            border-bottom: 1px solid #e5e7eb;
            border-right: 1px solid #f3f4f6;
            padding: 6px;
            text-align: center;
            vertical-align: middle;
        }

        .matrix-table th {
            position: sticky;
            top: 0;
            background-color: #f8fafc;
            z-index: 1;
        }

        .matrix-row-head {
            position: sticky;
            left: 0;
            background-color: white;
            min-width: 220px;
            text-align: left;
            z-index: 1;
        }

        .matrix-corner {
            position: sticky;
            left: 0;
            top: 0;
            z-index: 2;
            background-color: #f8fafc;
            min-width: 220px;
            text-align: left;
        }

        .matrix-col-icon {
            width: 14px;
            height: 14px;
            object-fit: contain;
        }

        .matrix-col-count {
            font-size: 10px;
            color: #6b7280;
            min-width: 24px;
        }

        .matrix-row-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 80%;
            text-align: left;
        }

        .matrix-row-count {
            margin-left: auto;
            font-size: 11px;
            color: #6b7280;
            padding-left: 8px;
            white-space: nowrap;
        }

        .matrix-row-icon {
            width: 18px;
            height: 18px;
            object-fit: contain;
            flex: 0 0 auto;
        }

        .matrix-hit {
            background-color: #dbeafe;
            color: #1e3a8a;
            font-size: 11px;
            line-height: 1.2;
            max-width: 6px;
        }

        .matrix-hit-external {
            background-color: #ecfccb;
            color: #365314;
            font-size: 10px;
            line-height: 1.2;
            max-width: 6px;
        }

        .matrix-empty-cell {
            color: #d1d5db;
        }

        @media (max-width: 1080px) {
            .dependencies-layout {
                grid-template-columns: 1fr;
            }

            .matrix-layout {
                grid-template-columns: 1fr;
            }

: ["A pan-European shipper tenders hundreds of lanes across plants, DCs, and borders in one yearly event.", "Executed cost and volume history from the same platform gives a baseline offline procurement never has."], "painPoints": ["Baselines assembled from ERP extracts and spreadsheets are stale before the RFP launches.", "Ambiguous lane and equipment definitions are the top cause of unusable carrier bids."], "dependencies": [{"type": "brick", "id": "mdat", "name": "Logistics Master Data", "description": "Shared locations, lanes, and equipment definitions.", "how": "Keeps tendered lanes on the same definitions planning and execution use."}]}, {"id": "launch-rfp-rounds", "title": "Launch RFP rounds to the carrier market", "keyFacts": ["Digital tendering reaches incumbents and new capacity from a network of 80,000+ carriers across 80 countries.", "Structured bid sheets keep thousands of line-item bids comparable across multi-round RFPs."], "painPoints": ["Email tenders drown transport directors in inconsistent spreadsheets that take weeks to normalize.", "Inviting only incumbents hides the real market price and leaves gaps on new lanes."], "dependencies": [{"type": "brick", "id": "tndr", "name": "Freight Procurement and Tendering", "description": "Runs RFPs, bid rounds, and structured bid collection.", "how": "Publishes the event, invites carriers, and collects structured bids per lane."}]}, {"id": "compare-bids-and-benchmarks", "title": "Compare bids against market benchmarks", "keyFacts": ["Comparison weighs price, capacity commitment, service history, and compliance \u2014 not price alone.", "Lane benchmarks from network transaction data show whether a bid sits above or below market."], "painPoints": ["Without benchmarks, an aggressive bid and an unsustainable one look identical until execution fails.", "Awarding purely on price selects carriers who decline tenders when the spot market pays better."], "dependencies": [{"type": "brick", "id": "anly", "name": "Transport Analytics and Benchmarking", "description": "Lane rate benchmarks from network transactions.", "how": "Positions every bid against the market rate for its lane."}]}, {"id": "negotiate-and-award", "title": "Negotiate and award capacity", "keyFacts": ["Final rounds run inside the tool, so the audit trail of offers and counteroffers is complete.", "Key lanes are deliberately awarded to a primary plus backups to balance cost and capacity risk."], "painPoints": ["Negotiations that drift to phone and email lose the audit trail and breed disputes over what was agreed.", "Single-carrier awards on critical lanes turn every hiccup into a spot-market emergency."], "dependencies": [{"type": "brick", "id": "tndr", "name": "Freight Procurement and Tendering", "description": "Manages negotiation rounds and documented awards.", "how": "Runs final rounds and records the award per lane and carrier."}]}, {"id": "activate-rate-cards", "title": "Activate rate cards and routing guides", "keyFacts": ["Awarded rates become structured rate cards with validity, surcharges, and fuel-indexation rules.", "Because procurement and execution share one platform, activated rates govern carrier selection the next morning."], "painPoints": ["Rate cards trapped in PDFs never reach daily carrier selection, so negotiated savings evaporate.", "Unmanaged surcharge and fuel-index rules cause invoice disputes months later."], "dependencies": [{"type": "brick", "id": "rate", "name": "Rates and Contract Management", "description": "Stores contracted rates, surcharges, and indexation rules.", "how": "Turns awards into executable rate cards with full surcharge logic."}, {"type": "brick", "id": "csel", "name": "Carrier Selection and Load Tendering", "description": "Applies routing guides and cascades to daily loads.", "how": "Lets the awarded routing guide drive daily tender sequences."}]}]}], "outcomes": ["Lower transport cost per shipment versus market benchmarks", "Contracted capacity coverage secured before the season starts, wired straight into daily execution"], "brickDependencies": [{"targetBrickId": "tndr", "type": "composition"}, {"targetBrickId": "rate", "type": "composition"}, {"targetBrickId": "csel", "type": "composition"}, {"targetBrickId": "anly", "type": "composition"}, {"targetBrickId": "mdat", "type": "composition"}], "externalSystemsThisStreamDependsOn": [], "externalSystemsDependingOnThisStream": [], "owningTeams": []}, {"id": "plan-and-optimize-transport", "name": "Plan and Optimize Transport", "icon": "plan-and-optimize-transport.png", "type": "outcome-based-stream", "description": "Turn raw ERP orders into an optimized, tendable load plan: consolidate orders into full loads, choose routes and equipment, and assign carriers per routing guide.", "group": "Shipper Journeys", "rootGroup": "Shipper Journeys", "flows": [{"id": "plan-and-optimize-transport-flow", "title": "Plan and Optimize Transport", "description": "From incoming ERP orders to a released, carrier-assigned load plan.", "steps": [{"id": "ingest-erp-orders", "title": "Ingest orders from ERP systems", "keyFacts": ["Deliveries and transport requirements flow continuously from SAP and other ERPs into managed transport orders.", "Order data quality \u2014 weights, time windows, incoterms \u2014 determines how much of planning can be automated."], "painPoints": ["Orders arriving by email or CSV force re-keying, introducing errors that surface at the dock.", "Missing weights and time windows push automatable loads into manual planning."], "dependencies": [{"type": "brick", "id": "intg", "name": "ERP and Systems Integration Hub", "description": "Connects shipper ERP and order systems to the platform.", "how": "Receives orders and status updates without manual entry."}]}, {"id": "consolidate-into-loads", "title": "Consolidate orders into loads", "keyFacts": ["Consolidation groups compatible orders by lane, date, and equipment into full truckloads and multi-stop tours.", "Around one in five truck , "how": "Attaches the contracted cascade and rates to every planned load."}]}, {"id": "release-plan-for-execution", "title": "Release the load plan for execution", "keyFacts": ["Released loads carry all data needed for tendering, documents, and tracking into the execution pipeline.", "A clean handover lets execution run at thousands of loads per day without planners re-touching each one."], "painPoints": ["Plans exported to another system for execution drift out of sync the moment anything changes.", "Untracked late changes send carriers to loads that were cancelled or moved."], "dependencies": [{"type": "brick", "id": "tord", "name": "Transport Order Management", "description": "Tracks order and load state through release and amendment.", "how": "Hands released loads to execution with consistent state and amendment history."}]}]}], "outcomes": ["Fewer planner touches per load through automated consolidation and carrier assignment", "Higher vehicle fill and a load plan that is executable as tendered"], "brickDependencies": [{"targetBrickId": "plan", "type": "composition"}, {"targetBrickId": "tord", "type": "composition"}, {"targetBrickId": "csel", "type": "composition"}, {"targetBrickId": "intg", "type": "composition"}, {"targetBrickId": "mdat", "type": "composition"}], "externalSystemsThisStreamDependsOn": [], "externalSystemsDependingOnThisStream": [], "owningTeams": []}, {"id": "execute-transport-orders", "name": "Execute Transport Orders", "icon": "execute-transport-orders.png", "type": "outcome-based-stream", "description": "Move every planned load through tender, acceptance, dispatch, and documented delivery via the connected carrier network \u2014 API-first execution that scales to thousands of loads per day.", "group": "Shipper Journeys", "rootGroup": "Shipper Journeys", "flows": [{"id": "execute-transport-orders-flow", "title": "Execute Transport Orders", "description": "From released load to accepted, dispatched, and documented delivery.", "steps": [{"id": "tender-to-contracted-carriers", "title": "Tender the load to contracted carriers", "keyFacts": ["Tenders follow the routing-guide cascade automatically \u2014 primary first, backups on timeout or rejection.", "The API-first model, relaunched as Transport Execution in January 2026, wires shipper ERP/TMS straight into the carrier network."], "painPoints": ["Phone-and-email tendering caps planner throughput and leaves no record of who declined what.", "Cascades without deadlines stall loads while everyone waits for a carrier who will never answer."], "dependencies": [{"type": "brick", "id": "texe", "name": "Transport Execution Orchestration", "description": "Orchestrates order execution across shipper systems and the network.", "how": "Drives the tender lifecycle at API speed and volume."}, {"type": "brick", "id": "csel", "name": "Carrier Selection and Load Tendering", "description": "Runs the tender cascade with rates and deadlines.", "how": "Executes the cascade per the routing guide with enforced response windows."}]}, {"id": "carrier-accepts-or-rejects", "title": "Carrier accepts or rejects digitally", "keyFacts": ["Carriers respond via portal, mobile app, or their own dispatch system through API/EDI \u2014 whichever fits their size.", "Digital acceptance creates a binding, timestamped commitment with the agreed rate attached."], "painPoints": ["Small carriers fall out of digital processes unless the portal and app are genuinely easy.", "Verbal acceptances create disputes when rate or load details were misheard."], "dependencies": [{"type": "brick", "id": "cprt", "name": "Carrier Portal and Mobile", "description": "Web and mobile access to tenders, loads, and documents.", "how": "Lets carriers of any size accept and manage loads digitally."}, {"type": "brick", "id": "conn", "name": "Carrier Connectivity Gateway", "description": "Connects carrier TMS and dispatch systems via API and EDI.", "how": "Lets integrated carriers respond system-to-system without portal logins."}]}, {"id": "escalate-uncovered-loads", "title": "Escalate uncovered loads", "keyFacts": ["Loads that exhaust their cascade are flagged with time-to-pickup context and a direct path to the spot market.", "Uncovered-load patterns per lane feed the next procurement cycle as evidence of capacity gaps."], "painPoints": ["Silent tender failures are discovered only when the dock asks where the truck is.", "Repeated escalations on the same lane signal a broken routing guide nobody is fixing."], "dependencies": [{"type": "brick", "id": "notf", "name": "Notifications and Messaging", "description": "Delivers alerts across web, mobile, and email.", "how": "Alerts planners the moment a cascade is exhausted."}]}, {"id": "dispatch-and-confirm-pickup", "title": "Dispatch and confirm pickup details", "keyFacts": ["Accepted loads carry confirmed pickup windows, dock references, and driver and vehicle details before the truck rolls.", "Driver and plate details shared in advance speed up gate check-in at security-conscious sites."], "painPoints": ["Trucks arriving without announced driver details get held at the gate, burning slot time.", "Pickup details changed by phone never reach the driver actually doing the job."], "dependencies": [{"type": "brick", "id": "texe", "name": "Transport Execution Orchestration", "description": "Coordinates dispatch data between shipper, carrier, and site.", "how": "Confirms pickup windows, vehicle, and driver assignments digitally."}]}, {"id": "document-and-confirm-delivery", "title": "Document the transport and confirm delivery", "keyFacts": ["Consignment notes and loading documents are generated from order data; eCMR adoption is spreading as European countries ratify the protocol.", "Drivers capture signature, photos, and remarks in the app \u2014 the digital POD starts the settlement clock the same day."], "painPoints": ["Paper CMRs get lost or sit in truck cabins for weeks, delaying payment and poisoning carrier relations.", "Undocumented delivery deviations turn into unresolvable claims months later."], "dependencies": [{"type": "brick", "id": "edoc", "name": "e-Documents (eCMR, POD)", "description": "Digital consignment notes and proof-of-delivery capture.", "how": "Issues eCMR from order data and attaches the signed POD in real time."}, {"type": "brick", "id": "tord", "name": "Transport Order Management", "description": "Closes the order lifecycle with delivery confirmation.", "how": "Marks the order delivered and releases it to settlement."}]}]}], "outcomes": ["High first-tender acceptance through contracted cascades and connected carriers", "Digital delivery evidence (eCMR, POD) ready for settlement the moment the truck leaves"], "brickDependencies": [{"targetBrickId": "texe", "type": "composition"}, {"targetBrickId": "tord", "type": "composition"}, {"targetBrickId": "csel", "type": "composition"}, {"targetBrickId": "conn", "type": "composition"}, {"targetBrickId": "cprt", "type": "composition"}, {"targetBrickId": "edoc", "type": "composition"}, {"targetBrickId": "notf", "type": "composition"}, {"targetBrickId": "apig", "type": "composition"}], "externalSystemsThisStreamDependsOn": [], "externalSystemsDependingOnThisStream": [], "owningTeams": []}, {"id": "track-and-manage-exceptions", "name": "Track and Manage Exceptions", "icon": "track-and-manage-exceptions.png", "type": "outcome-based-stream", "description": "Keep every dispatched order visible from pickup to delivery with live ETAs, detect disruptions early, and resolve them before the shipper's customer notices.", "group": "Shipper Journeys", "rootGroup": "Shipper Journeys", "flows": [{"id": "track-and-manage-exceptions-flow", "title": "Track and Manage Exceptions", "description": "From dispatched order to delivered, with live ETA and managed disruptions.", "steps": [{"id": "capture-tracking-events", "title": "Capture position and status events", "keyFacts": ["Position data flows in from carrier telematics, driver mobile apps, and carrier TMS integrations.", "In Europe's fragmented carrier market, the mobile app is often the only viable tracking source for small carriers."], "painPoints": ["Tracking coverage collapses on the last leg when subcontracted carriers are not connected.", "Every uncovered load means a planner phoning a dispatcher who phones a driver."], "dependencies": [{"type": "brick", "id": "conn", "name": "Carrier Connectivity Gateway", "description": "Integrates telematics, EDI, and API event sources.", "how": "Normalizes events from heterogeneous carrier systems into one stream."}]}, {"id": "compute-live-etas", "title": "Compute live ETAs per stop", "keyFacts": ["ETAs combine live position, route, traffic, remaining driving-time budget, and planned stops.", "A late truck often cannot simply drive faster \u2014 mandatory EU rest periods add hours a naive map estimate misses."], "painPoints": ["Map-only ETAs that ignore rest obligations are systematically optimistic and destroy trust in the tool.", "Stakeholders computing their own estimates guarantee contradictory answers to the same customer."], "dependencies": [{"type": "brick", "id": "trck", "name": "Real-Time Visibility and ETA", "description": "Computes and publishes live ETAs from the event stream.", "how": "Maintains one authoritative ETA per stop for all consumers."}]}, {"id": "detect-deviations", "title": "Detect deviations and raise exceptions", "keyFacts": ["Rules watch for late departures, ETA drift beyond windows, missed milestones, and silent loads with no signal.", "The exception queue, not the shipment list, is the planner's workspace \u2014 healthy loads manage themselves."], "painPoints": ["Alert floods train planners to ignore the dashboard, which is worse than no alerts.", "Silent failures \u2014 loads with no events at all \u2014 are the easiest to miss and the most expensive."], "dependencies": [{"type": "brick", "id": "excp", "name": "Exception Management", "description": "Detects, classifies, and queues shipment exceptions.", "how": "Turns deviation signals into a prioritized work queue."}]}, {"id": "notify-and-collaborate", "title": "Notify stakeholders and collaborate on resolution", "keyFacts": ["Exception context \u2014 order, carrier, position, ETA impact \u2014 is shared with carrier and receiving site in one thread.", "Proactive delay notice to the customer converts a service failure into a managed expectation."], "painPoints": ["Resolution scattered over phone and email leaves no record and repeats the same investigation twice.", "Customers who learn about a delay from the empty dock churn faster than those who got a warning."], "dependencies": [{"type": "brick", "id": "notf", "name": "Notifications and Messaging", "description": "Targeted alerts and shared communication threads.", "how": "Informs the right stakeholders with live exception context."}, {"type": "brick", "id": "cprt", "name": "Carrier Portal and Mobile", "description": "Brings the executing carrier into the thread.", "how": "Lets the carrier respond in the same shared context."}]}, {"id": "resolve-and-close", "title": "Resolve, re-plan, and close the shipment", "keyFacts": ["Resolution ranges from rebooking the dock slot to re-tendering the remainder of a failed transport, with all systems updated consistently.", "Closure stamps actual arrival against the promised window \u2014 the on-time actuals carrier reviews and analytics run on."], "painPoints": ["Recovery decided in one system but not propagated leaves docks, customers, and invoices on the old plan.", "Shipments that never formally close pollute on-time statistics and dangle in settlement."], "dependencies": [{"type": "brick", "id": "excp", "name": "Exception Management", "description": "Drives resolution workflows and records outcomes.", "how": "Executes and documents the chosen recovery path with reason codes."}, {"type": "brick", "id": "tord", "name": "Transport Order Management", "description": "Keeps order state consistent through re-planning and closure.", "how": "Propagates recovery decisions and closes the delivered order."}]}]}], "outcomes": ["High track-and-trace coverage across contracted and spot carriers", "Exceptions resolved before they become customer-facing failures"], "brickDependencies": [{"targetBrickId": "trck", "type": "composition"}, {"targetBrickId": "conn", "type": "composition"}, {"targetBrickId": "excp", "type": "composition"}, {"targetBrickId": "notf", "type": "composition"}, {"targetBrickId": "tord", "type": "composition"}, {"targetBrickId": "cprt", "type": "composition"}], "externalSystemsThisStreamDependsOn": [], "externalSystemsDependingOnThisStream": [], "owningTeams": []}, {"id": "settle-and-audit-freight", "name": "Settle and Audit Freight", "icon": "settle-and-audit-freight.png", "type": "outcome-based-stream", "description": "Turn proof of delivery into audited, correctly priced invoices \u2014 self-billing where possible, automated audit everywhere else \u2014 and secure the payment flow for carriers.", "group": "Shipper Journeys", "rootGroup": "Shipper Journeys", "flows": [{"id": "settle-and-audit-freight-flow", "title": "Settle and Audit Freight", "description": "From proof of delivery to audited invoice, self-billing, and secured payment.", "steps": [{"id": "accrue-expected-costs", "title": "Accrue expected costs per order", "keyFacts": ["Expected cost is computed at tender acceptance from the rate card, surcharges, and fuel indexation \u2014 before any invoice exists.", "Every later invoice line is compared against this expected cost, which is what makes automated audit possible."], "painPoints": ["Without accruals, freight spend is only known when invoices arrive weeks later, wrecking budget control.", "Rate cards not maintained in a system make expected cost a matter of opinion."], "dependencies": [{"type": "brick", "id": "cost", "name": "Freight Cost Management", "description": "Computes and accrues expected transport costs per order.", "how": "Accrues the expected cost from contracted rates at acceptance."}, {"type": "brick", "id": "rate", "name": "Rates and Contract Management", "description": "Contracted rates, surcharges, and indexation rules.", "how": "Serves as the pricing source of truth for every accrual."}]}, {"id": "audit-or-self-bill", "title": "Audit invoices or generate self-billing", "keyFacts": ["In self-billing, the shipper generates the invoice from confirmed execution data and digital POD \u2014 removing mismatch entirely.", "Automated audit checks every line against expected cost and delivery evidence, flagging only genuine discrepancies."], "painPoints": ["Manual invoice checking scales linearly with volume, so most invoices are effectively unchecked.", "Small recurring overcharges compound into material annual leakage across thousands of loads."], "dependencies": [{"type": "brick", "id": "audt", "name": "Freight Audit and Self-Billing", "description": "Automated invoice audit and self-billing generation.", "how": "Audits every line or replaces carrier invoicing with self-billing."}, {"type": "brick", "id": "edoc", "name": "e-Documents (eCMR, POD)", "description": "Digital delivery evidence linked to orders.", "how": "Supplies POD and eCMR evidence settlement verifies automatically."}]}, {"id": "resolve-settlement-disputes", "title": "Resolve discrepancies and disputes", "keyFacts": ["Flagged lines route into a structured workflow with order, rate, and evidence attached \u2014 both sides see the same data.", "Dispute patterns per carrier and surcharge type feed back into rate-card cleanup and the next tender."], "painPoints": ["Email dispute threads without shared evidence run for months and sour carrier relationships.", "Recurring disputes on the same surcharge signal a broken rate card nobody owns."], "dependencies": [{"type": "brick", "id": "audt", "name": "Freight Audit and Self-Billing", "description": "Dispute workflows on flagged invoice lines.", "how": "Runs evidence-backed dispute resolution." rier lateness from site slowness \u2014 ending the standing argument about whose fault the queue is."], "painPoints": ["Sites managed on anecdote fix the wrong bottleneck and keep the queues.", "Without shared metrics, carriers and sites blame each other for the same wasted hours indefinitely."], "dependencies": [{"type": "brick", "id": "dock", "name": "Dock Scheduling", "description": "Timestamped site event data for performance metrics.", "how": "Serves as the source of truth for turnaround and utilization measurement."}]}]}], "outcomes": ["Shorter truck turnaround times at plants and DCs", "Dock utilization smoothed across the day, with timestamped events ending waiting-time disputes"], "brickDependencies": [{"targetBrickId": "dock", "type": "composition"}, {"targetBrickId": "tord", "type": "composition"}, {"targetBrickId": "trck", "type": "composition"}, {"targetBrickId": "cprt", "type": "composition"}, {"targetBrickId": "notf", "type": "composition"}, {"targetBrickId": "mdat", "type": "composition"}], "externalSystemsThisStreamDependsOn": [], "externalSystemsDependingOnThisStream": [], "owningTeams": []}]}], "experiences": [{"id": "procure-freight-capacity", "name": "Procure Freight Capacity", "icon": "procure-freight-capacity.png", "type": "outcome-based-stream", "description": "Take a transportation director from a transport RFP through bid rounds and negotiation to signed rate cards and routing guides that planning and execution consume directly.", "group": "Shipper Journeys", "rootGroup": "Shipper Journeys", "flows": [{"id": "procure-freight-capacity-flow", "title": "Procure Freight Capacity", "description": "From lane baseline to awarded contracts and activated routing guides.", "steps": [{"id": "build-lane-baseline", "title": "Build the lane and volume baseline", "keyFacts": ["A pan-European shipper tenders hundreds of lanes across plants, DCs, and borders in one yearly event.", "Executed cost and volume history from the same platform gives a baseline off ules.", "how": "Serves as the pricing source of truth for every accrual."}]}, {"id": "audit-or-self-bill", "title": "Audit invoices or generate self-billing", "keyFacts": ["In self-billing, the shipper generates the invoice from confirmed execution data and digital POD \u2014 removing mismatch entirely.", "Automated audit checks every line against expected cost and delivery evidence, flagging only genuine discrepancies."], "painPoints": ["Manual invoice checking scales linearly with volume, so most invoices are effectively unchecked.", "Small recurring overcharges compound into material annual leakage across thousands of loads."], "dependencies": [{"type": "brick", "id": "audt", "name": "Freight Audit and Self-Billing", "description": "Automated invoice audit and self-billing generation.", "how": "Audits every line or replaces carrier invoicing with self-billing."}, {"type": "brick", "id": "edoc", "name": "e-Documents (eCMR, POD)", "description": "Digital delivery evidence linked to orders.", "how": "Supplies POD and eCMR evidence settlement verifies automatically."}]}, {"id": "resolve-settlement-disputes", "title": "Resolve discrepancies and disputes", "keyFacts": ["Flagged lines route into a structured workflow with order, rate, and evidence attached \u2014 both sides see the same data.", "Dispute patterns per carrier and surcharge type feed back into rate-card cleanup and the next tender."], "painPoints": ["Email dispute threads without shared evidence run for months and sour carrier relationships.", "Recurring disputes on the same surcharge signal a broken rate card nobody owns."], "dependencies": [{"type": "brick", "id": "audt", "name": "Freight Audit and Self-Billing", "description": "Dispute workflows on flagged invoice lines.", "how": "Runs evidence-backed dispute resolution."}]}, {"id": "post-to-finance", "title": "Post approved costs to ERP finance", "keyFacts": ["Approved invoices and self-bills post to the shipper's ERP with cost allocation to plant, pro lishes structured load and capacity offers to the network."}]}, {"id": "search-and-get-recommendations", "title": "Search and receive matched recommendations", "keyFacts": ["Matching ranks offers by lane fit, dates, equipment, price context, and counterparty quality \u2014 not just newest first.", "Return-load recommendations near a truck's delivery point attack the roughly one-in-five empty-kilometer share of European road freight."], "painPoints": ["In a raw list of thousands of offers, good return loads expire before a dispatcher scrolls to them.", "Matches that ignore equipment or ADR constraints waste the calls they trigger."], "dependencies": [{"type": "brick", "id": "mtch", "name": "Freight Matching and Recommendations", "description": "Ranks and recommends load-truck matches across the network.", "how": "Surfaces the best-fitting counterpart offers first."}, {"type": "brick", "id": "notf", "name": "Notifications and Messaging", "description": "Match alerts on saved searches and lanes.", "how": "Pushes matching offers to dispatchers in real time."}]}, {"id": "check-counterparty-trust", "title": "Check the counterparty before committing", "keyFacts": ["Every offer shows the counterparty's vetting status, trust indicators, and network history before any commitment.", "Cargo crime and identity fraud are persistent, documented risks in European road freight \u2014 counterparty checks are a survival habit."], "painPoints": ["One fraudulent counterparty can cost a small carrier a full load's value or an entire cargo.", "Manual background checking per deal is impossible at spot-market speed."], "dependencies": [{"type": "brick", "id": "trst", "name": "Trust Scores and Fraud Prevention", "description": "Counterparty trust signals and fraud screening.", "how": "Shows vetting status and risk signals on every offer."}]}, {"id": "negotiate-and-book", "title": "Negotiate and book the deal", "keyFacts": ["Price and conditions are agreed in the platform, producing a documented transaction both sides can rely on.", "A booked exchange deal carries the references settlement and payment-guarantee services later need."], "painPoints": ["Deals closed by phone leave price and conditions undocumented when a dispute appears.", "Slow negotiation loses the truck \u2014 spot capacity is gone in minutes at busy times."], "dependencies": [{"type": "brick", "id": "fxch", "name": "Freight Exchange Marketplace", "description": "Handles offer negotiation and deal booking.", "how": "Closes and documents the transaction."}]}, {"id": "confirm-execution-details", "title": "Confirm execution details and hand over", "keyFacts": ["The booked deal is confirmed with driver, vehicle, and loading references through the carrier portal or app.", "Spot deals flow into the same execution and tracking rails as contracted freight \u2014 one process for the carrier."], "painPoints": ["Spot loads executed outside the system lose tracking, documents, and payment protection at once.", "Missing loading references strand drivers at gates while the slot expires."], "dependencies": [{"type": "brick", "id": "cprt", "name": "Carrier Portal and Mobile", "description": "Carries confirmation details to carrier and driver.", "how": "Confirms execution details and connects the deal to execution."}]}]}], "outcomes": ["Fewer empty kilometers through fast return-load coverage", "Uncovered shipper loads closed on the spot market within hours, not days"], "brickDependencies": [{"targetBrickId": "fxch", "type": "composition"}, {"targetBrickId": "mtch", "type": "composition"}, {"targetBrickId": "trst", "type": "composition"}, {"targetBrickId": "cprt", "type": "composition"}, {"targetBrickId": "notf", "type": "composition"}], "externalSystemsThisStreamDependsOn": [], "externalSystemsDependingOnThisStream": [], "owningTeams": []}, {"id": "onboard-and-trust-network", "name": "Onboard and Trust the Network", "icon": "onboard-and-trust-network.png", "type": "outcome-based-stream", "description": "Take a carrier from signup to vetted, rated, fraud-screened network member \u2014 and keep the trust current for as long as they trade. Trust is what lets 80,000+ carriers and thousands of shippers transact with strangers safely.", "group": "Carrier and Network Journeys", "rootGroup": "Carrier and Network Journeys", "flows": [{"id": "onboard-and-trust-network-flow", "title": "Onboard and Trust the Network", "description": "From carrier signup to vetted, continuously monitored network membership.", "steps": [{"id": "register-and-verify-identity", "title": "Register the company and verify identity", "keyFacts": ["Signup captures legal entity, registration numbers, and authorized users, verified against business registries.", "Identity fraud \u2014 criminals impersonating legitimate carriers to steal cargo \u2014 is a known attack pattern, so identity is the first trust gate."], "painPoints": ["Weak identity checks at signup poison every downstream trust signal the network produces.", "Re-registering separately per product frustrates carriers and fragments their track record."], "dependencies": [{"type": "brick", "id": "iden", "name": "Identity and Organization Management", "description": "Organizations, users, and verified identities platform-wide.", "how": "Establishes one verified organization identity for all products."}]}, {"id": "screen-documents-and-licenses", "title": "Screen licenses, insurance, and documents", "keyFacts": ["Vetting checks transport licenses, insurance certificates, VAT status, and sanctions exposure before membership is granted.", "Documents carry expiry dates; validity is tracked continuously, not checked once at signup."], "painPoints": ["Expired insurance discovered after a cargo claim is a catastrophe for everyone involved.", "Manual document chasing at scale either blocks growth or quietly lowers the bar."], "dependencies": [{"type": "brick", "id": "cvet", "name": "Carrier Vetting and Compliance", "description": "Screens and monitors licenses, insurance, and compliance documents.", "how": "Enforces document validity at onboarding and continuously after."}]}, {"id": "activate-membership", "title": "Activate membership, billing, and access", "keyFacts": ["Approved carriers get exchange access, portal and mobile accounts, and a subscription matching their size and product mix.", "Fast activation matters commercially \u2014 a carrier who cannot trade for weeks churns before their first load."], "painPoints": ["Vetting rigor that turns into weeks of onboarding delay hands growth to less careful competitors.", "Billing surprises in the first month are a leading cause of early membership cancellation."], "dependencies": [{"type": "brick", "id": "bill", "name": "Subscription and Usage Billing", "description": "Memberships, subscriptions, and usage metering.", "how": "Activates and meters the carrier's membership from day one."}, {"type": "brick", "id": "cprt", "name": "Carrier Portal and Mobile", "description": "The carrier's daily working environment.", "how": "Gives the activated carrier immediate access to loads and tools."}]}, {"id": "build-and-monitor-trust", "title": "Build trust scores and monitor fraud continuously", "keyFacts": ["Completed transactions, payment behavior, and counterparty feedback accumulate into a living trust profile that boosts matching visibility.", "Continuous monitoring watches for account takeover, behavior shifts, and known fraud signatures \u2014 cargo theft via fake carriers is organized crime with real losses across Europe."], "painPoints": ["A vetted account taken over by fraudsters is more dangerous than an obvious fake, because it inherits earned trust.", "Scores that can be gamed with fake transactions are worse than no scores."], "dependencies": [{"type": "brick", "id": "trst", "name": "Trust Scores and Fraud Prevention", "description": "Trust scoring and continuous fraud detection.", "how": "Maintains earned, hard-to-game trust profiles and acts on fraud signals fast."}]}, {"id": "secure-payments-and-collections", "title": "Back membership with payment security", "keyFacts": ["Payment guarantees let carriers accept loads from unfamiliar counterparties knowing payment is protected.", "Collections handled centrally spare small carriers cross-border legal chasing they cannot afford."], "painPoints": ["Fear of non-payment keeps owner-operators off cross-border loads that would cut their empty kilometers.", "Chasing a foreign debtor through another country's courts costs more than most single invoices are worth."], "dependencies": [{"type": "brick", "id": "pgar", "name": "Payment Guarantee and Collections", "description": "Payment guarantees and centralized collections.", "how": "Protects members' revenue on network transactions."}]}]}], "outcomes": ["New carriers vetted and productive quickly without diluting trust standards", "Fraudulent actors kept out or removed before they can steal loads or money"], "brickDependencies": [{"targetBrickId": "cvet", "type": "composition"}, {"targetBrickId": "trst", "type": "composition"}, {"targetBrickId": "iden", "type": "composition"}, {"targetBrickId": "cprt", "type": "composition"}, {"targetBrickId": "pgar", "type": "composition"}, {"targetBrickId": "bill", "type": "composition"}], "externalSystemsThisStreamDependsOn": [], "externalSystemsDependingOnThisStream": [], "owningTeams": []}, {"id": "schedule-docks-and-yards", "name": "Schedule Docks and Yards", "icon": "schedule-docks-and-yards.png", "type": "outcome-based-stream", "description": "Turn booked transports into confirmed dock slots and fast site turnarounds: publish site capacity, let carriers self-book, absorb ETA changes, and run the gate-to-gate flow.", "group": "Site Operations", "rootGroup": "Site Operations", "flows": [{"id": "schedule-docks-and-yards-flow", "title": "Schedule Docks and Yards", "description": "From booked transport to confirmed slot, fast turnaround, and measured site performance.", "steps": [{"id": "publish-slot-capacity", "title": "Publish site slot capacity", "keyFacts": ["Sites define docks, operating hours, slot lengths, and handling constraints per equipment and goods type.", "Published capacity turns arrival management from first-come-first-served queues into scheduled flow."], "painPoints": ["Unscheduled sites concentrate arrivals into morning peaks that create long queues and afternoon idle docks.", "Slot definitions that ignore handling constraints produce bookings the site cannot actually serve."], "dependencies": [{"type": "brick", "id": "dock", "name": "Dock Scheduling", "description": "Site dock capacity, slots, and booking rules.", "how": "Publishes bookable capacity that reflects real site constraints."}, {"type": "brick", "id": "mdat", "name": "Logistics Master Data", "description": "Site, dock, and equipment definitions.", "how": "Aligns slot definitions with the platform-wide site model."}]}, {"id": "carrier-books-slot", "title": "Carrier books a slot for the transport", "keyFacts": ["Carriers self-book slots against their confirmed transports through the portal or app \u2014 no phone tag with the site office.", "Slot bookings link to the transport order, so site staff see what is arriving, from whom, with which references."], "painPoints": ["Phone-and-email slot booking consumes site office hours and still produces double bookings.", "Slots not linked to transport orders leave the site guessing what a booked truck actually carries."], "dependencies": [{"type": "brick", "id": "cprt", "name": "Carrier Portal and Mobile", "description": "Self-service slot booking for carriers.", "how": "Serves as the carrier's booking interface tied to their transports."}, {"type": "brick", "id": "tord", "name": "Transport Order Management", "description": "Links slot bookings to transport orders.", "how": "Gives every slot booking full order context."}]}, {"id": "adjust-slots-on-eta-changes", "title": "Adjust slots when ETAs change", "keyFacts": ["Live ETAs flag slot conflicts hours in advance \u2014 a truck running two hours late frees its slot for reassignment.", "Late-arrival patterns per carrier and lane feed the site's planning assumptions and carrier reviews."], "painPoints": ["Sites that learn about delays at the gate hold empty docks for absent trucks while present trucks wait.", "Manual rebooking by phone cannot keep up on a day when weather delays half the inbound flow."], "dependencies": [{"type": "brick", "id": "trck", "name": "Real-Time Visibility and ETA", "description": "Live ETAs against booked slots.", "how": "Detects slot conflicts before the truck arrives."}, {"type": "brick", "id": "notf", "name": "Notifications and Messaging", "description": "Alerts site and carrier to slot changes.", "how": "Coordinates rebooking between site and carrier in time to matter."}]}, {"id": "check-in-at-gate", "title": "Check the truck in at the gate", "keyFacts": ["Gate check-in matches the arriving truck against the booking \u2014 driver, plate, references \u2014 and timestamps the arrival.", "Arrival timestamps start the objective clock behind every later waiting-time discussion."], "painPoints": ["Unannounced trucks trigger manual verification that queues everyone behind them.", "Without timestamps, waiting-time claims are negotiations, not facts."], "dependencies": [{"type": "brick", "id": "dock", "name": "Dock Scheduling", "description": "Gate check-in against bookings with timestamps.", "how": "Verifies arrivals against bookings and records gate events."}]}, {"id": "load-unload-and-release", "title": "Load or unload and release the truck", "keyFacts": ["Yard statuses (called forward, at dock, loading, complete) keep drivers, dock teams, and planners on one picture.", "Fast release matters to carriers directly: turnaround time is lost driving time under EU driving-hours limits."], "painPoints": ["Drivers idling in yards without call-forward information block parking and miss their legal driving windows.", "Sites without handling-time data cannot tell which dock, product, or shift causes slow turnarounds."], "dependencies": [{"type": "brick", "id": "dock", "name": "Dock Scheduling", "description": "Yard and dock statuses through handling.", "how": "Runs the called-forward-to-release flow with full timestamps."}, {"type": "brick", "id": "cprt", "name": "Carrier Portal and Mobile", "description": "Live yard status and call-forward notices for drivers.", "how": "Keeps the driver informed from gate to release."}]}, {"id": "review-site-performance", "title": "Review site turnaround performance", "keyFacts": ["Turnaround time, slot utilization, and late-arrival shares are computed from gate and dock timestamps per site and carrier.", "Site metrics separate carrier lateness from site slowness \u2014 ending the standing argument about whose fault the queue is."], "painPoints": ["Sites managed on anecdote fix the wrong bottleneck and keep the queues.", "Without shared metrics, carriers and sites blame each other for the same wasted hours indefinitely."], "dependencies": [{"type": "brick", "id": "dock", "name": "Dock Scheduling", "description": "Timestamped site event data for performance metrics.", "how": "Serves as the source of truth for turnaround and utilization measurement."}]}]}], "outcomes": ["Shorter truck turnaround times at plants and DCs", "Dock utilization smoothed across the day, with timestamped events ending waiting-time disputes"], "brickDependencies": [{"targetBrickId": "dock", "type": "composition"}, {"targetBrickId": "tord", "type": "composition"}, {"targetBrickId": "trck", "type": "composition"}, {"targetBrickId": "cprt", "type": "composition"}, {"targetBrickId": "notf", "type": "composition"}, {"targetBrickId": "mdat", "type": "composition"}], "externalSystemsThisStreamDependsOn": [], "externalSystemsDependingOnThisStream": [], "owningTeams": []}]};
        const dataAssetsPayload = {"metadata": {"title": "Transport Management and Freight Exchange Data Assets", "description": "Catalog of the business, personal, financial, and network data assets that power the transport lifecycle (Plan, Procure, Execute, Track, Settle, Analyse) and the pan-European freight-exchange network, with classification, governance, and team ownership.", "modelVersion": "1.0"}, "rootGroups": [{"name": "Transport Order and Execution Data", "description": "The operational spine of the domain: transport orders flowing in from shipper ERPs and planning systems, their execution state across the carrier network, and the legal transport documents (eCMR, POD) that prove what happened.", "subGroups": [{"name": "Order Lifecycle Records", "description": "Durable order and execution records that every shipper-facing and carrier-facing workflow reads and writes.", "assets": [{"id": "transport-order", "name": "Transport Order", "kind": "logical-object", "description": "The canonical transport order: loads imported from shipper ERPs (SAP, Oracle, plant systems) or created by planners, with pickup and delivery stops, time windows, cargo lines, equipment requirements, and assigned carrier. Consumed by planning, tendering, execution, dock scheduling, settlement, and analytics. Stop contacts carry names and phone numbers of warehouse staff.", "businessMeaning": "The unit of work the whole platform revolves around: one order equals one movement of goods a shipper needs executed and a carrier gets paid for.", "status": "active", "tags": ["shipper-products", "execution-and-visibility"], "classification": "confidential", "personalDataLevel": "personal", "dataSubjects": ["customer", "partner"], "legalTags": ["gdpr"], "securityCriticality": "high", "accessScope": "owning shipper organization, assigned carrier, and internal execution workflows", "systemOfRecordBrickId": "tord", "ownerTeamId": "transport-planning", "stewardTeamIds": ["transport-execution"], "derivedFromAssetIds": [], "stores": [{"storeId": "transport-order-db", "role": "system-of-record"}, {"storeId": "transport-order-events", "role": "event-source"}, {"storeId": "network-data-warehouse", "role": "analytics-warehouse"}], "interfaces": [{"type": "api", "name": "transport-order api", "description": "CRUD and lifecycle API for transport orders, used by the TMS UI, Transport Execution API clients, and the ERP integration hub."}, {"type": "event", "name": "transport-order state events", "description": "Order created, tendered, accepted, dispatched, delivered, and cancelled events consumed by visibility, dock scheduling, and settlement."}], "governance": {"retention": "active lifecycle plus 24 months operational history; stop-contact personal data minimized after delivery closure", "residency": "eu", "sharingPolicy": "visible only to the owning shipper organization and the carriers assigned to the order; never shared across shipper tenants"}}, {"id": "shipment-execution-record", "name": "Shipment Execution Record", "kind": "operational-state", "description": "The execution-side record of a dispatched shipment: carrier acceptance, assigned vehicle and driver, planned vs actual times, milestone confirmations, deviations, and completion status. Originates from carrier confirmations via the portal, mobile app, and connectivity gateway; consumed by exception management, settlement, trust scoring, and emissions calculation. Contains driver names, phone numbers, and vehicle plates.", "businessMeaning": "The single account of how a transport actually went, and the evidence base for paying carriers, scoring reliability, and computing CO2.", "status": "active", "tags": ["execution-and-visibility"], "classification": "confidential", "personalDataLevel": "personal", "dataSubjects": ["partner"], "legalTags": ["gdpr"], "securityCriticality": "high", "accessScope": "shipper and carrier parties to the shipment, plus internal settlement, trust, and analytics workflows", "systemOfRecordBrickId": "texe", "ownerTeamId": "transport-execution", "stewardTeamIds": ["visibility"], "derivedFromAssetIds": [], "stores": [{"storeId": "shipment-execution-db", "role": "system-of-record"}, {"storeId": "network-data-warehouse", "role": "analytics-warehouse"}], "interfaces": [{"type": "api", "name": "shipment-execution api", "description": "Milestone and status API used by the carrier portal, mobile app, and Transport Execution integrations."}, {"type": "event", "name": "execution milestone events", "description": "Pickup, in-transit, delivery, and deviation events feeding exception management and downstream derivations."}], "governance": {"retention": "36 months for operational and dispute use; driver personal identifiers pseudonymized after 12 months", "residency": "eu", "sharingPolicy": "shared between the shipper and carrier parties to a shipment; only anonymized aggregates leave the transaction context (trust scores, benchmarks, emissions)"}}]}, {"name": "Transport Documents", "description": "Legally meaningful documents generated or captured during execution.", "assets": [{"id": "transport-document", "name": "Transport Document", "kind": "document", "description": "Digital transport documents attached to a shipment: electronic consignment notes (eCMR) with sender, carrier, and consignee signatures, proof-of-delivery photos and scans, pallet notes, and dangerous-goods declarations. Originates from the e-documents product via driver mobile signature capture and document upload; consumed by settlement (self-billing evidence), freight audit, dispute resolution, and shipper compliance archives. eCMR content includes driver names and handwritten signatures.", "businessMeaning": "The legal proof layer of road transport: what was handed over, to whom, when, in what condition, and under whose signature.", "status": "active", "tags": ["execution-and-visibility", "commercial-and-insight"], "classification": "restricted", "personalDataLevel": "personal", "dataSubjects": ["partner", "customer"], "legalTags": ["gdpr", "ecmr"], "securityCriticality": "high", "accessScope": "shipment parties, settlement and audit workflows, and legal or customs authorities on lawful request", "systemOfRecordBrickId": "edoc", "ownerTeamId": "transport-execution", "stewardTeamIds": ["settlement"], "derivedFromAssetIds": [], "stores": [{"storeId": "transport-document-store", "role": "system-of-record"}, {"storeId": "transport-document-index", "role": "projection"}], "interfaces": [{"type": "api", "name": "transport-document api", "description": "Upload, signature, retrieval, and verification API for eCMR and POD documents."}], "governance": {"retention": "statutory transport-document retention, typically 6-10 years depending on member state; immutable once countersigned", "residency": "eu", "sharingPolicy": "accessible to the named parties on the consignment note; disclosed to authorities only through the legal-request process"}}]}]}, {"name": "Procurement and Rate Data", "description": "Contracted rates and the tender activity that produced them: the commercial agreements between shippers and carriers that planning, execution, and settlement price against.", "subGroups": [{"name": "Contracts and Tenders", "description": "Rate cards, routing guides, and the RFP/RFQ event history behind them.", "assets": [{"id": "contract-rate-card", "name": "Contract Rate Card", "kind": "reference-data", "description": "Contracted lane rates, surcharges (fuel, tolls, accessorials), validity periods, allocation shares, and routing-guide positions agreed between a shipper and its carriers. Originates from awarded freight tenders in the procurement product or manual contract entry; consumed by carrier selection (routing-guide waterfall), transport planning (cost estimation), freight cost management, and freight audit (invoice-vs-contract matching). Commercially sensitive: rate leakage between carriers or across shippers would damage negotiations.", "businessMeaning": "The commercial contract expressed as data: which carrier hauls which lane at what price, and in what order carriers are asked.", "status": "active", "tags": ["shipper-products", "commercial-and-insight"], "classification": "confidential", "personalDataLevel": "none", "dataSubjects": [], "legalTags": [], "securityCriticality": "high", "accessScope": "owning shipper organization, the specific carrier for its own rates, and internal pricing workflows", "systemOfRecordBrickId": "rate", "ownerTeamId": "freight-procurement", "stewardTeamIds": ["settlement"], "derivedFromAssetIds": [], "stores": [{"storeId": "contract-rate-card-db", "role": "system-of-record"}, {"storeId": "network-data-warehouse", "role": "analytics-warehouse"}], "interfaces": [{"type": "api", "name": "contract-rate-card api", "description": "Rate lookup and routing-guide API used by carrier selection, cost management, and audit."}], "governance": {"retention": "contract validity plus 7 years for audit and dispute purposes", "residency": "eu", "sharingPolicy": "each carrier sees only its own rates; cross-customer use only as anonymized aggregates in lane benchmarks"}}, {"id": "tender-event", "name": "Tender Event", "kind": "event", "description": "The event history of freight procurement: RFP/RFQ rounds published to carriers, per-lane bids received, negotiation rounds, and award decisions, plus the daily-tendering trail of load offers sent through the routing guide and each carrier's accept, reject, or timeout response. Originates in the tendering and carrier-selection products; consumed by procurement analytics (bid comparison, savings tracking), tender acceptance KPIs, and lane rate benchmarking. Bids are strictly confidential between the bidding carrier and the tendering shipper.", "businessMeaning": "The negotiation record: what capacity was asked for, who bid what, who won, and how carriers respond to offered loads day to day.", "status": "active", "tags": ["shipper-products"], "classification": "confidential", "personalDataLevel": "none", "dataSubjects": [], "legalTags": [], "securityCriticality": "medium", "accessScope": "tendering shipper, each bidding carrier for its own bids, and internal procurement analytics", "systemOfRecordBrickId": "tndr", "ownerTeamId": "freight-procurement", "stewardTeamIds": ["analytics"], "derivedFromAssetIds": [], "stores": [{"storeId": "tender-event-db", "role": "system-of-record"}, {"storeId": "network-data-warehouse", "role": "analytics-warehouse"}], "interfaces": [{"type": "api", "name": "tender api", "description": "Tender publication, bidding, and award API for the procurement web application and carrier portal."}, {"type": "event", "name": "tender response events", "description": "Bid submitted, load accepted, load rejected, and tender awarded events feeding acceptance-rate analytics."}], "governance": {"retention": "7 years to support procurement audits and savings verification", "residency": "eu", "sharingPolicy": "bids visible only to the bidding carrier and the tendering shipper; aggregated and anonymized before entering cross-customer benchmarks"}}]}]}, {"name": "Freight Exchange and Network Trust Data", "description": "The marketplace side of the business: spot freight and truck-capacity offers flowing through the exchanges (Teleroute, Wtransnet, Bursa Transport heritage), and the identity, trust, fraud, and payment-security data that keeps a network of 80,000+ carriers safe to trade in.", "subGroups": [{"name": "Marketplace Offers", "description": "The transactional liquidity of the exchange: hundreds of thousands of freight and capacity offers per day.", "assets": [{"id": "spot-freight-offer", "name": "Spot Freight Offer", "kind": "logical-object", "description": "A load posted to the freight exchange: origin, destination, dates, cargo type, weight and loading meters, vehicle requirements, offered price, and the posting company's contact person with name and phone number. Posted by shippers, forwarders, and carriers, or automatically from uncovered TMS loads spilling to spot; consumed by matching, exchange search, and (anonymized) lane rate benchmarks. Short-lived: offers expire in hours to days.", "businessMeaning": "One side of the marketplace's liquidity: freight looking for a truck, priced by the spot market in near real time.", "status": "active", "tags": ["network-and-carrier-products"], "classification": "confidential", "personalDataLevel": "personal", "dataSubjects": ["customer", "partner"], "legalTags": ["gdpr"], "securityCriticality": "medium", "accessScope": "authenticated exchange members within the offer's visibility rules; contact details revealed on interest", "systemOfRecordBrickId": "fxch", "ownerTeamId": "freight-exchange", "stewardTeamIds": [], "derivedFromAssetIds": [], "stores": [{"storeId": "exchange-offer-db", "role": "system-of-record"}, {"storeId": "exchange-offer-search", "role": "serving"}, {"storeId": "network-data-warehouse", "role": "analytics-warehouse"}], "interfaces": [{"type": "api", "name": "freight-offer api", "description": "Post, search, and book API for spot freight offers, used by the exchange web app, mobile app, and TMS spot-spill integration."}, {"type": "event", "name": "offer lifecycle events", "description": "Offer posted, matched, booked, and expired events feeding matching and market analytics."}], "governance": {"retention": "90 days after expiry for dispute handling; anonymized transaction facts kept long-term for benchmarking", "residency": "eu", "sharingPolicy": "visible to vetted exchange members only; contact personal data shown on legitimate interest within a negotiation; aggregated and anonymized before any cross-customer analytics"}}, {"id": "vehicle-capacity-offer", "name": "Vehicle Capacity Offer", "kind": "logical-object", "description": "A free truck posted to the exchange: current or future availability location, radius or preferred destination lanes, vehicle type and equipment, available dates, and the dispatcher's contact details. Originates from carrier dispatchers and owner-operators looking for return loads; consumed by matching and recommendations (freight-to-truck pairing), exchange search, and network capacity analytics. Availability positions approximate vehicle whereabouts and are treated as personal data for owner-operators.", "businessMeaning": "The other side of marketplace liquidity: empty capacity looking for freight, the raw material for cutting empty kilometers.", "status": "active", "tags": ["network-and-carrier-products"], "classification": "confidential", "personalDataLevel": "personal", "dataSubjects": ["partner"], "legalTags": ["gdpr"], "securityCriticality": "medium", "accessScope": "authenticated exchange members within the offer's visibility rules", "systemOfRecordBrickId": "fxch", "ownerTeamId": "freight-exchange", "stewardTeamIds": [], "derivedFromAssetIds": [], "stores": [{"storeId": "exchange-offer-db", "role": "system-of-record"}, {"storeId": "exchange-offer-search", "role": "serving"}], "interfaces": [{"type": "api", "name": "capacity-offer api", "description": "Post and search API for available vehicles, used by the exchange web app and carrier mobile app."}], "governance": {"retention": "30 days after expiry; capacity patterns retained only as anonymized aggregates", "residency": "eu", "sharingPolicy": "visible to vetted exchange members; owner-operator location data never exposed outside the exchange context"}}]}, {"name": "Carrier Identity and Trust", "description": "Who is allowed to trade on the network, how trustworthy they are, and what happens when payment goes wrong.", "assets": [{"id": "carrier-profile", "name": "Carrier Profile", "kind": "master-data", "description": "The vetted identity of a network carrier: legal entity data, VAT and transport-license numbers, insurance certificates, fleet and equipment, operating lanes, contact persons, and vetting status with document evidence. Created at signup and continuously re-verified against license registries, insurance validity, and sanction lists; consumed by exchange access control, carrier selection, trust scoring, and guarantee underwriting. For owner-operators the legal entity is a natural person, so much of this profile is personal data.", "businessMeaning": "The network's membership register: proof that a carrier is real, licensed, insured, and safe to hand cargo to.", "status": "active", "tags": ["network-and-carrier-products"], "classification": "restricted", "personalDataLevel": "personal", "dataSubjects": ["partner"], "legalTags": ["gdpr"], "securityCriticality": "high", "accessScope": "vetting and trust workflows, exchange member directory (public subset), and shipper carrier-selection views", "systemOfRecordBrickId": "cvet", "ownerTeamId": "network-trust", "stewardTeamIds": ["carrier-experience"], "derivedFromAssetIds": [], "stores": [{"storeId": "carrier-profile-db", "role": "system-of-record"}, {"storeId": "carrier-document-store", "role": "data-files"}], "interfaces": [{"type": "api", "name": "carrier-profile api", "description": "Profile, vetting-status, and directory API used by the exchange, carrier portal, and shipper carrier-selection screens."}, {"type": "event", "name": "vetting status events", "description": "Carrier verified, document expiring, and membership suspended events consumed by exchange access control and trust scoring."}], "governance": {"retention": "membership lifetime plus 5 years; vetting evidence retained for fraud-defense purposes after offboarding", "residency": "eu", "sharingPolicy": "public directory subset visible to members; license and insurance documents restricted to vetting workflows; never sold or shared externally"}}, {"id": "network-trust-score", "name": "Network Trust Score", "kind": "derived-metric", "description": "Computed trust and fraud-risk scoring for every network member: reliability from executed shipments (on-time, disputes, cancellations), payment behavior from settlement history, fraud flags from anomaly detection (identity mismatches, cloned-company patterns, cargo-theft indicators), and peer ratings. Derived from carrier profiles, execution records, and payment-guarantee cases; consumed by exchange ranking, trust badges, and fraud-investigation queues. Scores attach to owner-operators as natural persons, so scoring logic and appeals fall under GDPR profiling rules.", "businessMeaning": "The network's immune system: the quantified answer to whether this counterparty will show up, deliver, and pay.", "status": "active", "tags": ["network-and-carrier-products"], "classification": "restricted", "personalDataLevel": "personal", "dataSubjects": ["partner", "customer"], "legalTags": ["gdpr"], "securityCriticality": "high", "accessScope": "trust and fraud workflows internally; coarse-grained badges and ratings visible to exchange members", "systemOfRecordBrickId": "trst", "ownerTeamId": "network-trust", "stewardTeamIds": ["freight-exchange"], "derivedFromAssetIds": ["carrier-profile", "shipment-execution-record", "payment-guarantee-case"], "stores": [{"storeId": "trust-score-db", "role": "system-of-record"}, {"storeId": "trust-feature-store", "role": "serving"}], "interfaces": [{"type": "api", "name": "trust-score api", "description": "Score and badge lookup API for exchange ranking, matching, and member profile pages; full score detail restricted to fraud operations."}], "governance": {"retention": "recomputed continuously; score history kept 5 years for fraud investigation and appeal handling", "residency": "eu", "sharingPolicy": "raw scores and fraud flags internal-only; members see coarse public badges; scoring inputs and logic documented for GDPR profiling transparency and appeals"}}, {"id": "payment-guarantee-case", "name": "Payment Guarantee Case", "kind": "financial-record", "description": "A payment-security case on an exchange transaction: the guaranteed amount, covered parties, underlying transaction references, debtor payment status, dunning and collection steps, payout decisions, and recovery outcomes. Originates when a carrier books a load under payment guarantee or reports non-payment; consumed by collections operations, trust scoring (payment behavior), guarantee underwriting, and finance reporting. Contains debtor financial data, claim correspondence, and bank details for payouts.", "businessMeaning": "The product that removes a carrier's worst fear on the spot market: if the freight payer defaults, the case record is the basis on which the carrier still gets paid.", "status": "active", "tags": ["network-and-carrier-products", "commercial-and-insight"], "classification": "restricted", "personalDataLevel": "personal", "dataSubjects": ["partner", "customer"], "legalTags": ["gdpr"], "securityCriticality": "high", "accessScope": "collections and guarantee operations, the claiming carrier for its own cases, and finance", "systemOfRecordBrickId": "pgar", "ownerTeamId": "network-trust", "stewardTeamIds": ["settlement"], "derivedFromAssetIds": [], "stores": [{"storeId": "payment-guarantee-db", "role": "system-of-record"}], "interfaces": [{"type": "api", "name": "payment-guarantee api", "description": "Case creation, status, and payout API for the carrier portal and internal collections tooling."}], "governance": {"retention": "10 years per financial-record obligations; collection correspondence retained for the legal claim period", "residency": "eu", "sharingPolicy": "case details visible only to the claiming carrier and internal operations; debtor payment behavior feeds trust scores in aggregated form only"}}]}]}, {"name": "Visibility and Site Operations Data", "description": "Live movement data and site scheduling: GPS and telematics streams from the connected carrier fleet, the ETA predictions computed on top of them, and dock-slot bookings that synchronize trucks with warehouses.", "subGroups": [{"name": "Tracking and Prediction", "description": "High-volume position telemetry and the derived pre                 return `
