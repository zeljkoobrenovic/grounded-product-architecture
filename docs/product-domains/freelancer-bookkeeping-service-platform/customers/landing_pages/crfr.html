ion and Scan & Herken by the end of the first quarter.", "unit": "%", "currentValue": "50", "targetValue": "80", "icon": "kpi-strt-bo-strt-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Be the first bookkeeper of every Dutch starter: the administration set up right from the KVK registration, the first filings right first time, and a platform and bookkeeper that grow with the business from starter to freelancer, VOF or BV.", "timeHorizons": {"year1": {"focus": "Win starters at the entry of the funnel with starter content, the free intro call and association benefits, and make the first quarter right first time with a set-up checklist, first upload coaching and reminders, while explaining KOR, startersaftrek and the hours criterion in plain language.", "productTheme": "First quarter right, first year calm", "customerKPI": {"northStar": "Time to first compliant filing", "supporting": ["Onboarding completion time", "First VAT return filed without correction"]}, "businessKPI": {"northStar": "Annual recurring revenue from starters", "revenueStreams": ["Starters package at the eenmanszaak fee of EUR 840 per year, invoiced monthly", "Bank connection add-on at EUR 5 per month per account", "Partner income tax return at EUR 125 incl. VAT"], "supporting": ["New starter clients per month", "Intro-to-active conversion for starters"]}, "milestones": ["Ship a starter set-up checklist (KVK, VAT number, KOR, bank account, trading names, cost rules) tracked by the bookkeeper in onboarding", "Publish starter content and 'Keep up' sessions on entrepreneurship next to a job, KOR and startersaftrek, with intro call booking on each page", "Send first-quarter reminders and a missing-items list so every starter's bookings are in before the review cut-off"]}, "year3": {"focus": "Make the starter path near-automatic: guided set-up in the app, KOR and reservation decisions supported by the starter's own numbers, deductions evidence collected from day one, and a seamless step to a VOF or BV on the same platform when the business grows.", "productTheme": "Guided start, automatic administration, one platform for growth", "customerKPI": {"northStar": "Time to first compliant filing", "supporting": ["Starter deductions captured", "Starter set-up checklist completed"]}, "businessKPI": {"northStar": "Annual recurring revenue from starters", "revenueStreams": ["Starters packages with high bank connection and Scan & Herken usage", "Plan upgrades to VOF and BV packages retained on the same platform", "Partner programme benefits for starters: insurance, pension, crowdfunding"], "supporting": ["Starters retained after the first fiscal year", "Bookkeeper hours per starter in year one"]}, "milestones": ["Deliver guided in-app set-up for starters that completes the checklist without bookkeeper time", "Collect hours and cost evidence for starter deductions automatically from app activity and bookings", "Ship the starter-to-VOF and starter-to-BV upgrade flows so the first bookkeeper stays the bookkeeper"]}, "year5": {"focus": "AI-assisted starter coaching with a human guarantee: proactive advice on reservations, KOR, deductions and legal form generated from the starter's numbers and confirmed by the bookkeeper, positioning Kees as the default first bookkeeper for new zzp'ers nationally.", "productTheme": "The default first bookkeeper for every new zzp'er", "customerKPI": {"northStar": "Time to first compliant filing", "supporting": ["Startersaftrek applied in the first eligible return", "First receipt and invoice submitted within seven days"]}, "businessKPI": {"northStar": "Annual recurring revenue from starters", "revenueStreams": ["Starters packages across the national inflow of new zzp'ers", "Lifetime revenue from starters growing into freelancer, VOF and BV packages", "Partner and financing referrals for growing starters"], "supporting": ["Starters still active after 24 months", "Starter acquisition cost"]}, "milestones": ["Provide proactive starter advice moments (KOR, reservation, hours criterion, legal form) generated from the starter's figures and confirmed by the bookkeeper", "Offer a real-time tax position for starters that combines salary from a job with business profit", "Become the referral partner of choice for KVK-adjacent starter channels, associations and financing partners"]}}}, "domain": "Freelancers and Sole Proprietors"}, {"id": "vofp", "name": "VOF Partner", "description": "One of two or more partners in a vennootschap onder firma who share one business, one administration and one profit, such as Yoeri and Elin who run a bakery together, two photographers with a studio, a couple with a shop and a webshop, or three consultants trading under one name. The partners buy and bank in each other's name, invoice under one or more trading names and, at year-end, need the profit split according to their partnership agreement and an income tax return for each of them, with the deductions each partner qualifies for. They pay the Kees VOF plan of EUR 1,140 per year for two partners plus EUR 100 for each extra partner (ex VAT, invoiced monthly), often with a bank connection, a partner income tax return for a fiscal partner at EUR 125, and payroll at EUR 17.50 per payslip once they employ someone. What they want from a bookkeeper is that it does not matter which partner did what, that both of them see the same figures, that nobody gets a surprise assessment, and that growing (an employee, a third partner, eventually a BV) never means changing bookkeeper.", "icon": "vofp.png", "careAbout": ["One administration that every partner can feed from their own phone, so it never matters who paid, who invoiced or who has the receipt", "A profit split and capital accounts that follow the partnership agreement exactly, so year-end does not become an argument between partners", "An income tax return for each partner filed on time with every deduction they qualify for, including the return of a fiscal partner at a known price", "Knowing per partner what will be owed and what to reserve before the assessment arrives, so monthly withdrawals are safe", "A fixed yearly price for the partnership, invoiced monthly, with clear add-on prices for payroll, bank connections and partner returns", "A bookkeeper who understands a small shop, studio or food business and answers a partner's question without a meter running"], "winsThem": ["A VOF plan at EUR 1,140 per year for two partners, plus EUR 100 per extra partner, that covers quarterly VAT, annual accounts and each partner's income tax return without hourly billing", "Scan & Herken and a Ponto bank connection that capture receipts and transactions from whichever partner handled them and match them automatically", "Client stories of partnerships like the bakers Yoeri and Elin, showing a business like theirs run by Kees for years", "Payroll at EUR 17.50 per payslip through the same bookkeeper the day they take on their first employee", "A personal bookkeeper backed by colleagues, so partner questions get a consistent answer during the busy season as well"], "theirFear": ["The profit split or a partner's private withdrawals are booked wrongly and one partner ends up paying income tax on the other's share", "Nobody uploaded the receipts of a busy quarter and the VAT return is filed late or wrong, with a fine and an amended return for the partnership", "Growing the business (an employee, a new partner, a BV) forces them to start over with a new accountant who does not know their history"], "jobsToBeDone": [{"id": "jtbd-vofp-1", "name": "Run one shared administration for all partners", "whatItIs": "Keep a single, complete administration for a vennootschap onder firma in which two or more partners buy, sell and bank in each other's name: receipts paid by whichever partner had a card at hand, invoices under one trading name, one business bank account plus the occasional private card, and one quarterly VAT return for the partnership. The job is to make it irrelevant who did what, so the partnership's books are complete without the partners reconciling with each other or with a bookkeeper by e-mail.", "outcome": "Every receipt, sales invoice and bank transaction of the partnership lands in one administration within days, no matter which partner handled it; the personal bookkeeper checks the quarter and files the VOF's VAT return before the last day of the month after the quarter; and each partner spends no more than two hours a month on administration.", "steps": [{"step": "Set up the partnership as one client with every partner on board", "description": "Register the VOF with Kees as one client on the VOF plan (EUR 1,140 per year for two partners, EUR 100 per extra partner, ex VAT, invoiced monthly), give each partner their own login to the same administration, and agree with the assigned bookkeeper who is the first contact for questions. Decide whether all partners upload receipts or one partner runs the admin for the others, and whether the partnership needs the bank connection for its business account.", "streamsNeeded": [{"id": "start-and-onboard-a-new-client", "name": "Start and Onboard a New Client", "howItSupports": "Runs the free intro call, the mutual-fit check and the plan choice by legal form, and assigns one personal bookkeeper who knows the partnership's story from day one."}, {"id": "manage-subscription-billing-and-plans", "name": "Manage Subscription Billing and Plans", "howItSupports": "Prices the VOF plan per number of partners and invoices the fixed yearly fee monthly, so the partners know the cost before the first quarter starts."}]}, {"step": "Capture receipts and purchases from whichever partner paid", "description": "Photograph flour, packaging, equipment and supplier invoices in the app the moment they are paid, whether from the business account, a partner's private card or in cash, and let Scan & Herken recognise the amount, the supplier and the VAT. Mark private payments so the bookkeeper can book them as a partner contribution instead of a business expense.", "streamsNeeded": [{"id": "capture-receipts-and-expenses", "name": "Capture Receipts and Expenses", "howItSupports": "Turns a photo or e-mailed invoice from any partner into a recognised, categorised expense booking with VAT, ready for bookkeeper review."}, {"id": "sync-and-match-bank-transactions", "name": "Sync and Match Bank Transactions", "howItSupports": "Syncs the partnership's business account four times a day through Ponto and matches transactions to the bookings automatically, leaving only privately paid items for manual matching."}]}, {"step": "Invoice customers under one name and get paid into the shared account", "description": "Send quotes and invoices from the same client account under the partnership's trading name, or under several trading names if the partners run a shop and a catering line, with the right VAT rule per customer, and see which invoices are still open without asking each other.", "streamsNeeded": [{"id": "create-quotes-and-invoices-and-get-paid", "name": "Create Quotes and Invoices and Get Paid", "howItSupports": "Provides templates, multiple trading names, VAT rules and status tracking so every partner invoices the same way and open invoices are visible to all."}, {"id": "sync-and-match-bank-transactions", "name": "Sync and Match Bank Transactions", "howItSupports": "Matches incoming payments to open invoices so the partners see what is paid without reconciling bank statements themselves."}]}, {"step": "Let the bookkeeper check the quarter and file one VAT return", "description": "Before the quarterly deadline, let the personal bookkeeper review the bookings, ask the partners about anything unclear (a private purchase, a missing receipt, a reverse-charge invoice), and file the VAT return for the partnership with the Belastingdienst. Pay the VAT due from the shared account on time.", "streamsNeeded": [{"id": "review-administration-and-file-vat-returns", "name": "Review Administration and File VAT Returns", "howItSupports": "Delivers a bookkeeper-checked quarter and a VAT return filed before the last day of the month after the quarter, with the amount to pay shown to all partners."}, {"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Routes the bookkeeper's questions to the partner who handled the item and keeps the answer in one thread instead of in three inboxes."}]}, {"step": "Watch the shared numbers together", "description": "Look at revenue per quarter, cost categories, profit and VAT to pay on the dashboard from any partner's phone, so partners talk about the same figures when they decide on a new oven, a price increase or hiring help.", "streamsNeeded": [{"id": "monitor-your-finances-on-the-dashboard", "name": "Monitor Your Finances on the Dashboard", "howItSupports": "Shows the partnership's real-time revenue, costs, profit and VAT position on web and mobile to every partner with a login."}]}]}, {"id": "jtbd-vofp-2", "name": "Split profit correctly and file every partner's income tax return", "whatItIs": "Turn the partnership's annual result into the correct share of profit per partner according to the partnership agreement, account for what each partner contributed and withdrew during the year, apply the deductions each partner is entitled to as an entrepreneur (zelfstandigenaftrek, startersaftrek, mkb-winstvrijstelling, subject to the hours criterion), and file every partner's income tax return, including the return of a fiscal partner where wanted. The job is to end the year with no argument between partners and no surprise from the Belastingdienst.", "outcome": "The annual accounts of the VOF are ready in the first months of the new year, the profit split matches the agreement to the euro, each partner's income tax return is filed before the deadline with every deduction they qualify for, and each partner knows in advance what they will owe and has reserved it.", "steps": [{"step": "Agree the profit split and record partner contributions and withdrawals", "description": "Confirm with the bookkeeper how the partnership agreement splits profit (equal shares, a fixed remuneration first, or a ratio), and keep private withdrawals and contributions per partner separate in the books during the year so the capital accounts are right at year-end.", "streamsNeeded": [{"id": "serve-partnerships-and-companies", "name": "Serve Partnerships and Companies", "howItSupports": "Models the profit-split rules and per-partner capital accounts so the year-end split is computed from the agreement, not from memory."}, {"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Explains how a chosen split, a partner's extra hours or an uneven capital contribution affects each partner's taxable profit."}]}, {"step": "Close the year for the partnership", "description": "After the fourth quarter is filed, answer the bookkeeper's year-end questions (stock, investments, private use of a van, unpaid invoices), review the draft annual accounts of the VOF and approve them.", "streamsNeeded": [{"id": "close-the-year-and-file-income-tax", "name": "Close the Year and File Income Tax", "howItSupports": "Produces the annual accounts of the partnership from the checked quarters, with investments, depreciation and stock handled by the bookkeeper."}, {"id": "review-administration-and-file-vat-returns", "name": "Review Administration and File VAT Returns", "howItSupports": "Guarantees that all four quarters are checked and filed, so the year-end starts from a complete administration."}]}, {"step": "Apply the deductions each partner is entitled to", "description": "Check per partner whether the hours criterion is met, whether the starter's deduction still applies, and how the zelfstandigenaftrek (EUR 1,200 in 2026, EUR 900 in 2027) and the mkb-winstvrijstelling reduce each partner's taxable share, so no deduction is missed and none is claimed wrongly.", "streamsNeeded": [{"id": "close-the-year-and-file-income-tax", "name": "Close the Year and File Income Tax", "howItSupports": "Applies entrepreneur deductions per partner on their share of the profit and keeps the calculation for the tax return."}, {"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Answers the partner-specific questions (part-time partner, a partner with a job on the side, a partner in the first three years) with consistent, knowledge-base-backed advice."}]}, {"step": "File each partner's income tax return", "description": "Let the bookkeeper prepare and file the income tax return of every partner from the partnership's figures, and add the return of a partner's fiscal partner for EUR 125 incl. VAT where the household wants one bookkeeper for everything.", "streamsNeeded": [{"id": "close-the-year-and-file-income-tax", "name": "Close the Year and File Income Tax", "howItSupports": "Files each partner's income tax return with the Belastingdienst from the same annual accounts, and partner returns on request."}, {"id": "serve-partnerships-and-companies", "name": "Serve Partnerships and Companies", "howItSupports": "Carries each partner's share, capital account and deductions into their individual return so the returns of the partners add up to the partnership."}, {"id": "manage-subscription-billing-and-plans", "name": "Manage Subscription Billing and Plans", "howItSupports": "Invoices the partner income tax return as a EUR 125 add-on on the monthly invoice, so there is no separate bill to negotiate."}]}, {"step": "Know what each partner owes and has reserved", "description": "See per partner the expected income tax and the reservation the bookkeeper advises, so the partners take their monthly withdrawals with the tax already set aside and nobody is caught out by the assessment.", "streamsNeeded": [{"id": "monitor-your-finances-on-the-dashboard", "name": "Monitor Your Finances on the Dashboard", "howItSupports": "Shows the tax reservation and profit to date so each partner can compare withdrawals with what will be owed."}, {"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Gives a proactive heads-up when a partner's expected assessment moves, for example after a strong quarter or a change in deductions."}]}]}, {"id": "jtbd-vofp-3", "name": "Add employees or a partner without changing bookkeeper", "whatItIs": "Grow the partnership, from taking on a first employee or a weekend helper, to bringing in a third partner, letting a partner leave, or deciding that the business has outgrown the VOF and should become a BV, while keeping the same bookkeeper, the same app and a continuous administration. The job is to make growth an administrative non-event rather than a reason to shop for a new accountant.", "outcome": "Payroll for the first employees runs monthly at EUR 17.50 per payslip through the same subscription, a partner joins or leaves with the plan, profit split and returns adjusted in one go, and if the partnership converts to a BV the same organisation (Kees and Founders) carries the administration across without a gap in filings.", "steps": [{"step": "Take on the first employee and run payroll", "description": "Register as an employer with the Belastingdienst, hand the bookkeeper the employee's data and contract terms, and receive monthly payslips, the wage tax filing and the payroll journal entries in the administration for EUR 17.50 per payslip per employee per month.", "streamsNeeded": [{"id": "run-payroll-for-small-employers", "name": "Run Payroll for Small Employers", "howItSupports": "Produces monthly payslips, files the wage tax and books the payroll journal entries, so the first employee does not require a separate payroll office."}, {"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Explains what registering as an employer means for the partnership, from wage tax to holiday allowance and sick pay."}]}, {"step": "Add a partner or let one leave", "description": "Bring a new partner into the administration with their own login, adjust the plan by EUR 100 per extra partner, update the profit split and capital accounts from the date of entry or exit, and make sure the leaving partner still gets a correct final income tax return.", "streamsNeeded": [{"id": "serve-partnerships-and-companies", "name": "Serve Partnerships and Companies", "howItSupports": "Applies the change in partners to the profit split, capital accounts and the set of income tax returns for the year of the change."}, {"id": "manage-subscription-billing-and-plans", "name": "Manage Subscription Billing and Plans", "howItSupports": "Adjusts the VOF plan and the monthly invoice for the new number of partners without a new contract."}]}, {"step": "Keep the administration continuous through the change", "description": "Continue uploading receipts, invoicing and bank matching during the transition so the quarter in which an employee starts or a partner changes is filed on time like any other.", "streamsNeeded": [{"id": "review-administration-and-file-vat-returns", "name": "Review Administration and File VAT Returns", "howItSupports": "Keeps the quarterly review and VAT filing on schedule while the payroll or partner change is processed."}, {"id": "sync-and-match-bank-transactions", "name": "Sync and Match Bank Transactions", "howItSupports": "Continues to match salary payments, wage tax and the new partner's contributions against the bookings automatically."}]}, {"step": "Decide when the partnership should become a BV", "description": "Discuss with the bookkeeper whether the partners' profit, liability and pension situation justifies converting to a BV with Founders, what it would cost per year (holding BV EUR 1,750, werkmaatschappij EUR 2,450) and how the switch would be timed around a year-end.", "streamsNeeded": [{"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Gives a consistent, personal answer on the VOF-versus-BV question using the knowledge base rather than a paid consultation."}, {"id": "serve-partnerships-and-companies", "name": "Serve Partnerships and Companies", "howItSupports": "Hands the partnership over to Founders for the BV structure so the partners keep one organisation for their administration."}]}]}], "customerJourneyStories": [{"id": "journey-vofp-1", "name": "Two bakers, one administration", "linkedJobIds": ["jtbd-vofp-1", "jtbd-vofp-2"], "summary": "Yoeri and Elin run a bakery together as a VOF. Between early mornings, a shop counter and a market stand, the administration lived in a shoebox and a spreadsheet, and the first year-end with an accountant charging by the hour left them with a bill and an argument about whose expenses were whose. This is how they became Kees clients and why they stayed.", "stages": [{"stage": "Trigger", "narrative": "The accountant's invoice for the first annual accounts arrives with a list of hours, and with it a request for receipts from March that neither baker can find. The two partners spend a Sunday evening reconstructing who paid what from bank statements and decide they will not do this again: they want one place where both of them can drop receipts, and someone who does the tax for a price they know in advance."}, {"stage": "Discovery", "narrative": "A fellow market stallholder mentions that she pays a fixed amount per year to Kees de Boekhouder and only opens the app when she has a receipt in her hand. Yoeri watches the video story of another VOF on keesdeboekhouder.nl, sees that the VOF plan is EUR 1,140 per year for two partners and that the intro call is free, and books a Google Meet for a quiet Tuesday afternoon."}, {"stage": "Evaluation", "narrative": "In the intro call the bakers ask the questions that matter to them: can both of them upload from their own phones, is the bank account of the VOF connected, what happens with the profit split and their two income tax returns, and what does it cost when they hire a Saturday helper. They compare with staying with the hourly accountant and with a software-only package that would still leave the tax to them. The fixed yearly fee invoiced monthly, the personal bookkeeper who understands a small food business, and the clear add-on prices for payroll and a partner's return settle it."}, {"stage": "Trial", "narrative": "After the mutual-fit check they get their logins, connect the business account via Ponto and photograph the first week of receipts in the app. Their bookkeeper calls once to walk them through marking a privately paid purchase and sets up the bakery's trading name for invoices to wholesale customers. The first quarterly VAT return goes out with a short message of what will be debited and when."}, {"stage": "Engagement", "narrative": "Within two quarters the routine holds: receipts are photographed at the counter, the bank connection matches most transactions overnight, the bookkeeper asks two or three questions per quarter by e-mail, and the dashboard on Elin's phone shows revenue per quarter and the VAT to pay. At year-end the bookkeeper closes the books, splits the profit as their agreement says, and files both income tax returns with the zelfstandigenaftrek applied for each partner."}, {"stage": "Retention", "narrative": "The second year-end is the first one without an argument, and the assessment matches what the bookkeeper told them to reserve. When they take on a weekend employee, the same bookkeeper adds payroll at EUR 17.50 per payslip. Yoeri and Elin agree to tell their story on the Kees site and send two other food entrepreneurs from the market to the free intro call."}]}, {"id": "journey-vofp-2", "name": "From a software-only package to a bookkeeper who grows with the partnership", "linkedJobIds": ["jtbd-vofp-3", "jtbd-vofp-2"], "summary": "Two photographers who run a studio as a VOF have done their own books in an online accounting package for three years. Hiring their first assistant, and a partner's plan to buy a house, turn the administration from a chore into a risk, and they switch to Kees de Boekhouder with the switch service.", "stages": [{"stage": "Trigger", "narrative": "The studio hires a full-time assistant, and the photographers discover that their accounting package does not do payroll and that they have no idea what registering as an employer means. In the same month one partner's mortgage adviser asks for annual accounts and an income statement signed by a bookkeeper, which they cannot produce from their own spreadsheets."}, {"stage": "Discovery", "narrative": "Through the DuPho member benefits page they find Kees de Boekhouder as a partner with a discount for members and read that payroll is included as an add-on per payslip and that a bookkeeper prepares the figures a mortgage lender asks for. A colleague in their studio building confirms she switched from doing it herself and has not looked back."}, {"stage": "Evaluation", "narrative": "They weigh three options: keep the package and add a separate payroll office, hire a local accountant by the hour, or move everything to Kees on the VOF plan. The deciding factors are that Kees does not accept external accounting software (so it is a real switch, not a bolt-on), that the switch service takes over the history from digital copies of the old returns, that the fee is fixed for the year, and that both partners keep their own login and the studio's bank connection at EUR 5 per month per account."}, {"stage": "Trial", "narrative": "After the intro call the switch service imports the previous VAT and income tax returns and the opening balances, and the bookkeeper sets up payroll for the assistant in time for the first month. The partners run one quarter with the old package still open for comparison, then close it when the first Kees VAT return and the first payslips arrive without corrections."}, {"stage": "Engagement", "narrative": "The bookkeeper prepares the annual accounts and the income statement the mortgage lender needs, files both partners' income tax returns and, at the partners' request, the return of one partner's fiscal partner for EUR 125. Payroll runs monthly without the partners touching it, and the dashboard replaces the spreadsheet in their quarterly studio meeting."}, {"stage": "Retention", "narrative": "When a third photographer joins the partnership the plan grows by EUR 100, the profit split is updated from her start date and the same bookkeeper handles the change. Two years in, the partners ask the bookkeeper whether a BV would make sense and get a clear, no-fee answer that it does not yet; they stay, and recommend Kees in the DuPho community."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-vofp-top", "name": "Administration hours per partner per month", "description": "Average hours per month that an individual VOF partner spends on administration: capturing receipts, invoicing, answering bookkeeper questions and checking figures, excluding the bookkeeper's own work. Modeled seed value for a two-to-three-partner service or retail partnership, not an official Kees de Boekhouder figure.", "unit": "hours per partner per month", "currentValue": "4.5", "targetValue": "2.0", "link": "https://dashboard.example.com/freelancer-bookkeeping-service-platform/customers/vofp/kpis/co-vofp-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-vofp-co-vofp-top.png"}, "branches": [{"id": "co-vofp-b1", "name": "Effortless shared administration", "description": "How little partner time the shared administration needs, driven by capture at the source and by how fast the bookkeeper resolves the questions that remain.", "currentValue": "61", "icon": "kpi-vofp-co-vofp-b1.png", "children": [{"id": "co-vofp-b1-c1", "name": "Bookings captured at the source by partners", "description": "Share of the partnership's expense and sales bookings that enter the administration through the app, the bank connection or e-mail within seven days of the transaction, rather than being reconstructed at quarter-end.", "unit": "%", "currentValue": "62", "targetValue": "90", "icon": "kpi-vofp-co-vofp-b1-c1.png", "children": [{"id": "co-vofp-b1-c1-l1", "name": "Receipts recognised without manual correction", "description": "Share of receipts photographed or uploaded by partners that Scan & Herken books with the correct amount, supplier and VAT rate without a partner or bookkeeper correcting them.", "unit": "%", "currentValue": "71", "targetValue": "92", "icon": "kpi-vofp-co-vofp-b1-c1-l1.png", "children": []}, {"id": "co-vofp-b1-c1-l2", "name": "Bank transactions matched automatically", "description": "Share of the partnership's synced bank transactions matched to a booking or an invoice by the matching engine without manual intervention.", "unit": "%", "currentValue": "66", "targetValue": "88", "icon": "kpi-vofp-co-vofp-b1-c1-l2.png", "children": []}]}, {"id": "co-vofp-b1-c2", "name": "Bookkeeper answer time for partner questions", "description": "Average working hours between a partner's question by e-mail, phone or app and a substantive answer from the personal bookkeeper or a backup colleague.", "unit": "working hours", "currentValue": "14", "targetValue": "6", "icon": "kpi-vofp-co-vofp-b1-c2.png", "children": [{"id": "co-vofp-b1-c2-l1", "name": "Questions resolved on first reply", "description": "Share of partner questions closed with the bookkeeper's first answer, without a follow-up round to clarify which partner, which transaction or which year is meant.", "unit": "%", "currentValue": "70", "targetValue": "88", "icon": "kpi-vofp-co-vofp-b1-c2-l1.png", "children": []}, {"id": "co-vofp-b1-c2-l2", "name": "Partners active on the dashboard each month", "description": "Share of registered partners of VOF clients who open the web or mobile dashboard at least once a month, a proxy for whether all partners see the same figures.", "unit": "%", "currentValue": "55", "targetValue": "85", "icon": "kpi-vofp-co-vofp-b1-c2-l2.png", "children": []}]}]}, {"id": "co-vofp-b2", "name": "Correct, on-time filings for every partner", "description": "Whether the partnership's VAT and each partner's income tax are filed on time, and whether the profit split and reservation hold up at assessment.", "currentValue": "77", "icon": "kpi-vofp-co-vofp-b2.png", "children": [{"id": "co-vofp-b2-c1", "name": "Partner return on-time rate", "description": "Share of individual partner income tax returns of VOF clients filed with the Belastingdienst before the applicable deadline, including postponed deadlines under the bookkeeper's extension scheme.", "unit": "%", "currentValue": "88", "targetValue": "99", "icon": "kpi-vofp-co-vofp-b2-c1.png", "children": [{"id": "co-vofp-b2-c1-l1", "name": "Quarterly VAT returns filed before deadline", "description": "Share of the partnership's quarterly VAT returns filed before the last day of the month after the quarter.", "unit": "%", "currentValue": "93", "targetValue": "100", "icon": "kpi-vofp-co-vofp-b2-c1-l1.png", "children": []}, {"id": "co-vofp-b2-c1-l2", "name": "Partner year-end data complete before 1 April", "description": "Share of VOF clients whose partners have answered all year-end questions and supplied private data for their returns before 1 April, so returns can be filed in the regular season.", "unit": "%", "currentValue": "64", "targetValue": "90", "icon": "kpi-vofp-co-vofp-b2-c1-l2.png", "children": []}]}, {"id": "co-vofp-b2-c2", "name": "Profit split accuracy", "description": "Share of VOF year-end closes in which the profit split per partner, the capital accounts and the partner returns match the partnership agreement and the filed VOF figures without a correction after the partners' review or after assessment.", "unit": "%", "currentValue": "91", "targetValue": "100", "icon": "kpi-vofp-co-vofp-b2-c2.png", "children": [{"id": "co-vofp-b2-c2-l1", "name": "Partner capital accounts reconciled at year-end", "description": "Share of VOF clients whose per-partner contributions and private withdrawals are fully reconciled in the capital accounts at the first draft of the annual accounts.", "unit": "%", "currentValue": "80", "targetValue": "98", "icon": "kpi-vofp-co-vofp-b2-c2-l1.png", "children": []}, {"id": "co-vofp-b2-c2-l2", "name": "Partners with a tax reservation shortfall at assessment", "description": "Share of VOF partners whose final income tax assessment exceeded the reservation advised by the bookkeeper by more than 10 percent.", "unit": "%", "currentValue": "22", "targetValue": "8", "icon": "kpi-vofp-co-vofp-b2-c2-l2.png", "children": []}]}]}]}, "businessOutcomes": {"top": {"id": "bo-vofp-top", "name": "Annual recurring revenue from VOF subscriptions", "description": "Annual recurring revenue from VOF plan subscriptions (EUR 1,140 per year for two partners plus EUR 100 per extra partner) and their add-ons: partner income tax returns, bank connections and payroll. Modeled seed value for the domain, not a reported Kees de Boekhouder figure.", "unit": "EUR million per year", "currentValue": "1.0", "targetValue": "2.2", "link": "https://dashboard.example.com/freelancer-bookkeeping-service-platform/customers/vofp/kpis/bo-vofp-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-vofp-bo-vofp-top.png"}, "branches": [{"id": "bo-vofp-b1", "name": "VOF client base", "description": "How many partnerships subscribe, how fast the base grows and how much each partnership adds beyond the base plan.", "currentValue": "54", "icon": "kpi-vofp-bo-vofp-b1.png", "children": [{"id": "bo-vofp-b1-c1", "name": "Active VOF subscriptions", "description": "Number of VOF clients with an active subscription at year-end. Modeled seed value consistent with a base of more than 10,000 entrepreneurs and a growth target of 20,000 clients.", "unit": "subscriptions", "currentValue": "850", "targetValue": "1800", "icon": "kpi-vofp-bo-vofp-b1-c1.png", "children": [{"id": "bo-vofp-b1-c1-l1", "name": "New VOF subscriptions per year", "description": "Number of partnerships that sign a VOF subscription in the year, from intro call through mutual-fit check to active client.", "unit": "subscriptions per year", "currentValue": "190", "targetValue": "420", "icon": "kpi-vofp-bo-vofp-b1-c1-l1.png", "children": []}, {"id": "bo-vofp-b1-c1-l2", "name": "Intro-to-active conversion rate for partnerships", "description": "Share of free intro calls with partnerships that become an active VOF client within 60 days.", "unit": "%", "currentValue": "38", "targetValue": "50", "icon": "kpi-vofp-bo-vofp-b1-c1-l2.png", "children": []}]}, {"id": "bo-vofp-b1-c2", "name": "Add-on revenue per VOF per year", "description": "Average annual revenue per VOF client from add-ons on top of the plan: bank connections at EUR 5 per month per account, partner income tax returns at EUR 125 and payroll at EUR 17.50 per payslip.", "unit": "EUR per year", "currentValue": "260", "targetValue": "420", "icon": "kpi-vofp-bo-vofp-b1-c2.png", "children": [{"id": "bo-vofp-b1-c2-l1", "name": "Payroll add-on attach rate among VOFs", "description": "Share of VOF clients with at least one employee on payroll through Kees during the year.", "unit": "%", "currentValue": "18", "targetValue": "35", "icon": "kpi-vofp-bo-vofp-b1-c2-l1.png", "children": []}, {"id": "bo-vofp-b1-c2-l2", "name": "Bank connection accounts per VOF", "description": "Average number of Ponto-connected bank accounts per VOF client, including the partnership's business account and any partner accounts used for business.", "unit": "accounts", "currentValue": "1.3", "targetValue": "1.8", "icon": "kpi-vofp-bo-vofp-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-vofp-b2", "name": "Retention and delivery productivity", "description": "How reliably partnerships stay through year-ends and changes in partners, and how many bookkeeper hours a VOF costs to serve.", "currentValue": "63", "icon": "kpi-vofp-bo-vofp-b2.png", "children": [{"id": "bo-vofp-b2-c1", "name": "VOF annual churn rate", "description": "Share of VOF clients that cancel in the year after the first full fiscal year, including partnerships that dissolve, excluding those converted to a BV with Founders.", "unit": "%", "currentValue": "9", "targetValue": "5", "icon": "kpi-vofp-bo-vofp-b2-c1.png", "children": [{"id": "bo-vofp-b2-c1-l1", "name": "VOFs referred by an existing client or partner", "description": "Share of new VOF subscriptions that come from a referral by an existing client, a client story or an ecosystem partner benefit.", "unit": "%", "currentValue": "31", "targetValue": "45", "icon": "kpi-vofp-bo-vofp-b2-c1-l1.png", "children": []}, {"id": "bo-vofp-b2-c1-l2", "name": "VOFs retained through a change in partners", "description": "Share of VOF clients that stay with Kees in the year a partner joins or leaves, a moment when partnerships typically reconsider their bookkeeper.", "unit": "%", "currentValue": "70", "targetValue": "90", "icon": "kpi-vofp-bo-vofp-b2-c1-l2.png", "children": []}]}, {"id": "bo-vofp-b2-c2", "name": "Bookkeeper hours per VOF per year", "description": "Average hours a personal bookkeeper and backup colleagues spend per VOF client per year on review, filings, year-end close, partner returns and questions.", "unit": "hours", "currentValue": "14", "targetValue": "9", "icon": "kpi-vofp-bo-vofp-b2-c2.png", "children": [{"id": "bo-vofp-b2-c2-l1", "name": "Year-end closes first time right for VOFs", "description": "Share of VOF annual accounts and profit splits approved by the partners and passed by the four-eyes check without a correction round.", "unit": "%", "currentValue": "82", "targetValue": "95", "icon": "kpi-vofp-bo-vofp-b2-c2-l1.png", "children": []}, {"id": "bo-vofp-b2-c2-l2", "name": "Partner returns prepared per bookkeeper day", "description": "Average number of partner income tax returns a bookkeeper prepares and files per working day in the return season.", "unit": "returns per day", "currentValue": "6", "targetValue": "10", "icon": "kpi-vofp-bo-vofp-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make Kees de Boekhouder the natural bookkeeper for partnerships: one shared administration that any partner can feed from their phone, one bookkeeper who knows the partners and their agreement, a profit split and a set of income tax returns that are right every year at a fixed price, and a subscription that grows with the first employee, the third partner and, when the time comes, the move to a BV.", "timeHorizons": {"year1": {"focus": "Make the VOF plan as effortless as the eenmanszaak plan: multi-partner logins and roles on one administration, per-partner tagging of privately paid items, bank matching that recognises partner accounts, and a year-end flow in which the profit split and all partner returns are prepared from the same figures.", "productTheme": "One administration, every partner on board", "customerKPI": {"northStar": "Administration hours per partner per month", "supporting": ["Bookings captured at the source by partners", "Partner return on-time rate"]}, "businessKPI": {"northStar": "Annual recurring revenue from VOF subscriptions", "revenueStreams": ["VOF plan subscriptions at EUR 1,140 per year for two partners, plus EUR 100 per extra partner", "Partner income tax returns at EUR 125 and bank connections at EUR 5 per month per account", "Payroll at EUR 17.50 per payslip for VOFs with staff"], "supporting": ["New VOF subscriptions per year", "Intro-to-active conversion rate for partnerships"]}, "milestones": ["Ship per-partner roles, private-payment tagging and partner capital accounts in the client app and the bookkeeper workspace", "Deliver a VOF year-end flow that computes the profit split from the agreement and prepares every partner's return from one close", "Publish partnership client stories, starting with the bakers, and a VOF pricing page that explains the plan, add-ons and cancellation terms in one screen"]}, "year3": {"focus": "Serve partnerships as a lifecycle: employees and payroll, partner entry and exit, and the VOF-to-BV transition with Founders handled on one platform, with the tax reservation per partner visible during the year and the bookkeeper's review focused on exceptions.", "productTheme": "Grow the partnership without changing bookkeeper", "customerKPI": {"northStar": "Administration hours per partner per month", "supporting": ["Profit split accuracy", "Bookkeeper answer time for partner questions"]}, "businessKPI": {"northStar": "Annual recurring revenue from VOF subscriptions", "revenueStreams": ["VOF subscriptions with multi-partner growth", "Payroll and partner-return add-ons at higher attach rates", "Conversions to Founders BV packages retained in the group"], "supporting": ["Add-on revenue per VOF per year", "VOFs retained through a change in partners"]}, "milestones": ["Handle partner entry and exit, including plan change, split re-basing and the leaving partner's final return, as one guided change in the workspace", "Show the expected income tax and advised reservation per partner on the dashboard during the year, updated as quarters are filed", "Offer a guided VOF-to-BV transition with Founders that keeps the bookkeeper, the app and the history"]}, "year5": {"focus": "Continuous bookkeeping for partnerships with a human guarantee: agentic booking and matching across partner accounts, draft annual accounts and partner returns generated after the fourth quarter and reviewed by the bookkeeper, and proactive advice on remuneration, hiring and legal form that software-only competitors cannot give.", "productTheme": "Continuous partnership bookkeeping with proactive advice", "customerKPI": {"northStar": "Administration hours per partner per month", "supporting": ["Partners with a tax reservation shortfall at assessment", "Bookkeeper hours per VOF per year"]}, "businessKPI": {"northStar": "Annual recurring revenue from VOF subscriptions", "revenueStreams": ["VOF subscriptions across the Netherlands as the go-to partnership bookkeeper", "Advice-led add-ons on remuneration, pension and legal form", "Partner and ecosystem benefits that bring partnerships from associations and platforms"], "supporting": ["VOF annual churn rate", "VOFs referred by an existing client or partner"]}, "milestones": ["Generate draft annual accounts, profit split and partner returns automatically after the fourth quarter, with the bookkeeper reviewing a diff rather than building the close", "Run agentic matching across the partnership's and partners' accounts so privately paid business items are found and booked without partner effort", "Deliver proactive, personal advice on partner remuneration, hiring and BV timing from the knowledge base, triggered by the partnership's own figures"]}}}, "domain": "Partnerships and Companies"}, {"id": "bvdg", "name": "BV Director-Major Shareholder (DGA)", "description": "The owner and director of a small besloten vennootschap, typically a holding BV that owns a werkmaatschappij, such as a marketing agency founder with two employees, an IT consultant who incorporated after years as a freelancer, or a physiotherapist who bought into a practice. As directeur-grootaandeelhouder they must pay themselves a customary-wage salary through payroll, may take dividends from the holding, and owe the company a set of statutory obligations that a sole proprietor does not: statutory annual accounts prepared and deposited at the KVK, a corporate tax (VPB) return per BV, dividend tax on distributions and a private income tax return with box 2 income. They are served by Founders, the sister company of Kees de Boekhouder founded in 2018, at a fixed fee per entity (holding BV EUR 1,750, werkmaatschappij EUR 2,450 per year ex VAT, invoiced monthly) with DGA payroll at EUR 17.50 per payslip. Many arrive from a traditional accountancy firm that billed by the hour, or from the Kees eenmanszaak plan after outgrowing sole proprietorship. They want no missed corporate deadline, a total cost of compliance they know in advance, correct salary and dividend decisions, and a bookkeeper who keeps holding and operating company in step.", "icon": "bvdg.png", "careAbout": ["Every corporate obligation (VAT, wage tax, statutory annual accounts, KVK deposit, corporate tax return) completed before its deadline without the DGA tracking it", "A total cost of compliance for the whole structure that is fixed per entity and known at the start of the year, with no hourly invoices for questions", "Taking money out of the company correctly: a DGA salary within the customary-wage rules, dividends after the balance-sheet test, and a current account that stays within the rules", "Holding and operating company kept consistent, with the management fee, loans and intercompany balances reconciled instead of discovered at year-end", "Annual accounts delivered early in the year rather than just before the deposit deadline, so financing, dividend and valuation decisions can be made in time", "One bookkeeper who knows the structure and its history, answers within days and does not need a consultation fee for a salary or dividend question"], "winsThem": ["Founders' fixed fee per entity, EUR 1,750 for a holding BV and EUR 2,450 for a werkmaatschappij per year, covering quarterly VAT, statutory annual accounts, KVK filing and the corporate tax return", "The same app, bank connection and personal-bookkeeper model that Kees de Boekhouder uses for more than 10,000 entrepreneurs, applied to companies", "DGA and employee payroll at EUR 17.50 per payslip on the same monthly invoice, with wage tax filed and payroll entries booked automatically", "A seamless move from the Kees eenmanszaak plan to a Founders BV structure with history, bank connections and bookkeeper carried across", "An AVG-compliant processing agreement and access restricted to authorised staff, so the company's and the DGA's personal data are handled properly"], "theirFear": ["The annual accounts are deposited late or the corporate tax return is filed late and the DGA faces a penalty, an estimated assessment or personal liability for the company's filings", "The DGA salary is set below the customary wage or the current account with the company grows into an undeclared loan, and the Belastingdienst corrects it with interest and penalties years later", "The accountant's fees rise every year while the annual accounts arrive later, and switching feels like losing years of history and starting from scratch"], "jobsToBeDone": [{"id": "jtbd-bvdg-1", "name": "Keep my BV compliant (corporate tax, annual accounts, KVK filing) at a fixed fee", "whatItIs": "Meet every obligation of a besloten vennootschap without an accountant charging by the hour: quarterly VAT for the operating company, statutory annual accounts prepared, adopted by the shareholders and deposited with the KVK within the legal term, the corporate tax (VPB) return filed for each BV, and the provisional assessments handled, all for the fixed Founders fee per entity (holding BV EUR 1,750, werkmaatschappij EUR 2,450, ex VAT per year, invoiced monthly). The job is to be a compliant company owner while spending the DGA's time on the business, not on statutory paperwork.", "outcome": "For every BV the DGA owns, the VAT returns, statutory annual accounts, KVK deposit and corporate tax return are completed before their deadlines by the Founders bookkeeper, at a cost known at the start of the year, with no late-filing penalty, no estimated assessment and no surprise invoice.", "steps": [{"step": "Choose the right Founders plan per entity", "description": "Decide with Founders which entities need a full administration (a holding BV at EUR 1,750 per year, a werkmaatschappij at EUR 2,450 per year), whether the holding only receives management fees and dividends or also holds real estate or investments, and which add-ons apply: DGA payroll per payslip, bank connections per account and the DGA's private income tax return.", "streamsNeeded": [{"id": "start-and-onboard-a-new-client", "name": "Start and Onboard a New Client", "howItSupports": "Runs the free intro call and mutual-fit check for a BV structure and assigns a Founders bookkeeper who serves companies rather than sole proprietors."}, {"id": "manage-subscription-billing-and-plans", "name": "Manage Subscription Billing and Plans", "howItSupports": "Prices each BV on its own plan and invoices the fixed yearly fee monthly, so the DGA knows the total cost of compliance for the structure in advance."}]}, {"step": "Keep the BV's bookkeeping current every quarter", "description": "Upload purchase invoices and receipts of the operating company, invoice customers from the app, let the bank connection sync the company accounts and the holding's account, and have the bookkeeper check the quarter and file the VAT return, so the year-end starts from a complete ledger.", "streamsNeeded": [{"id": "capture-receipts-and-expenses", "name": "Capture Receipts and Expenses", "howItSupports": "Captures the BV's purchase invoices and receipts with Scan & Herken so the ledger is complete without the DGA typing bookings."}, {"id": "sync-and-match-bank-transactions", "name": "Sync and Match Bank Transactions", "howItSupports": "Syncs the operating company's and holding's bank accounts four times a day and matches transactions, including intercompany transfers, to bookings."}, {"id": "review-administration-and-file-vat-returns", "name": "Review Administration and File VAT Returns", "howItSupports": "Delivers a bookkeeper-checked quarter and a filed VAT return for the operating company before the deadline."}]}, {"step": "Get the statutory annual accounts prepared and adopted", "description": "After the fourth quarter, answer the bookkeeper's year-end questions (work in progress, receivables, loans between holding and operating company, the current account with the DGA), review the draft annual accounts for each BV and adopt them in the general meeting of shareholders, usually the DGA alone, within the statutory term.", "streamsNeeded": [{"id": "serve-partnerships-and-companies", "name": "Serve Partnerships and Companies", "howItSupports": "Prepares the statutory annual accounts per BV in the required format, consolidating the intercompany positions between holding and operating company."}, {"id": "close-the-year-and-file-income-tax", "name": "Close the Year and File Income Tax", "howItSupports": "Supplies the closed ledger, depreciation and provisions from which the annual accounts and the corporate tax computation are built."}]}, {"step": "File the corporate tax return and deposit the accounts at KVK", "description": "Let the Founders bookkeeper prepare and file the VPB return for each BV, including the participation exemption for dividends received by the holding, and deposit the adopted annual accounts with the KVK within eight days of adoption and at the latest twelve months after year-end.", "streamsNeeded": [{"id": "serve-partnerships-and-companies", "name": "Serve Partnerships and Companies", "howItSupports": "Files the corporate tax return with the Belastingdienst and deposits the annual accounts with the KVK through the official channels, with copies archived in the client file."}]}, {"step": "Track deadlines and the provisional assessment", "description": "See on the dashboard which filings are due for each BV, what corporate tax is expected against the provisional assessment, and ask the bookkeeper to adjust the provisional assessment when the year is going better or worse than planned, so there is no interest charge or refund surprise.", "streamsNeeded": [{"id": "monitor-your-finances-on-the-dashboard", "name": "Monitor Your Finances on the Dashboard", "howItSupports": "Shows per BV the revenue, costs, profit and the expected corporate tax against the provisional assessment during the year."}, {"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Gives proactive notice of BV deadlines and rule changes and handles the request to change a provisional assessment."}]}]}, {"id": "jtbd-bvdg-2", "name": "Pay myself correctly as DGA (salary, dividend, holding structure)", "whatItIs": "Take money out of the company in the right form and the right order: a DGA salary that meets the customary-wage rules (gebruikelijk loon) and runs through payroll with wage tax, a management fee between the operating company and the holding, dividends from the holding when the profit and the balance sheet allow it with the dividend tax and box 2 consequences understood, and a current account with the DGA that does not drift into an undeclared loan. The job is to optimise the DGA's net income within the rules without becoming a tax specialist.", "outcome": "The DGA salary is set and paid monthly through payroll with the wage tax filed, dividend decisions are made with the bookkeeper before year-end with the balance-sheet test and the box 2 tax known, intercompany positions and the DGA current account are reconciled every quarter, and the DGA's private income tax return is filed on time with the box 2 income correct.", "steps": [{"step": "Set the DGA salary within the customary-wage rules", "description": "Decide with the bookkeeper what salary the DGA must at least take under the gebruikelijkloonregeling given the company's profit and comparable jobs, whether a lower salary can be substantiated in a start-up phase, and how the salary interacts with the management fee between the operating company and the holding.", "streamsNeeded": [{"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Answers the customary-wage and management-fee questions consistently from the knowledge base, with a personal recommendation for this DGA's situation."}, {"id": "run-payroll-for-small-employers", "name": "Run Payroll for Small Employers", "howItSupports": "Sets up the DGA as an employee of the holding or the operating company with the agreed salary so payroll can start in the first month."}]}, {"step": "Run monthly DGA payroll and wage tax filing", "description": "Receive the monthly payslip for the DGA and any staff, have the wage tax return filed and paid on time, and see the payroll journal entries land in the BV's ledger, for EUR 17.50 per payslip per employee per month.", "streamsNeeded": [{"id": "run-payroll-for-small-employers", "name": "Run Payroll for Small Employers", "howItSupports": "Produces the DGA's monthly payslip, files the wage tax and books the payroll entries in the right BV every month."}]}, {"step": "Decide on dividend from the holding", "description": "Before year-end, review with the bookkeeper the distributable reserves and the balance-sheet and liquidity tests, decide whether to pay a dividend from the operating company to the holding (participation exemption) and from the holding to the DGA in private (dividend tax and box 2), and record the shareholders' resolution.", "streamsNeeded": [{"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Explains the dividend options, the two-tier box 2 rate and the timing so the DGA decides with the numbers rather than after the fact."}, {"id": "serve-partnerships-and-companies", "name": "Serve Partnerships and Companies", "howItSupports": "Prepares the dividend resolution, the dividend tax return and the corresponding entries in both BVs."}]}, {"step": "Keep the holding and operating company in step", "description": "Book the management fee and any loans between the two BVs consistently in both ledgers, reconcile the DGA current account every quarter so private expenses paid by the company are settled or documented as a loan with interest, and avoid the excessive-borrowing rules for DGAs.", "streamsNeeded": [{"id": "serve-partnerships-and-companies", "name": "Serve Partnerships and Companies", "howItSupports": "Mirrors intercompany bookings between holding and operating company and tracks the DGA current account against the borrowing threshold."}, {"id": "sync-and-match-bank-transactions", "name": "Sync and Match Bank Transactions", "howItSupports": "Matches the transfers between the BVs' accounts and the DGA's private account so intercompany and current-account positions stay reconciled."}]}, {"step": "File the DGA's private income tax return", "description": "Have the bookkeeper file the DGA's personal income tax return with the salary, the box 2 dividend income and, where relevant, the fiscal partner's return, so the private and corporate side of the structure are consistent with each other.", "streamsNeeded": [{"id": "close-the-year-and-file-income-tax", "name": "Close the Year and File Income Tax", "howItSupports": "Files the DGA's income tax return from the payroll and dividend figures already in the administration, and the fiscal partner's return on request."}, {"id": "manage-subscription-billing-and-plans", "name": "Manage Subscription Billing and Plans", "howItSupports": "Adds the private and partner income tax returns to the monthly invoice as known add-ons rather than as an hourly bill."}]}]}, {"id": "jtbd-bvdg-3", "name": "Move from sole proprietorship to BV without losing my bookkeeper", "whatItIs": "Convert a successful eenmanszaak or VOF into a BV structure (usually a holding plus a werkmaatschappij) at the right moment, for the right reasons (profit level, liability, pension, selling the business one day), and carry the administration, the bank connection, the invoicing and the personal relationship with the bookkeeper across from Kees de Boekhouder to its sister company Founders without a gap in filings. The job is to grow into a company without starting over with an unknown accountant.", "outcome": "The decision to incorporate is taken on a clear comparison of tax, cost and risk, the sole proprietorship's last year is closed and its final income tax return filed by the same organisation, the BVs are set up in Founders with the history and bank connections in place on day one, and the first DGA payroll and the first corporate year run without a missed filing.", "steps": [{"step": "Get advice on whether and when a BV pays off", "description": "Ask the personal bookkeeper for an honest comparison of staying an eenmanszaak (zelfstandigenaftrek, mkb-winstvrijstelling) against a BV (corporate tax, DGA salary, box 2 dividend, Founders fees of EUR 1,750 and EUR 2,450 per year), including liability, pension and Wet DBA considerations, and pick a conversion date, typically a year-end.", "streamsNeeded": [{"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Provides a consistent, knowledge-base-backed comparison of eenmanszaak versus BV for this client's profit level without a paid consultation."}]}, {"step": "Close the sole proprietorship's last year and hand over", "description": "Let the Kees bookkeeper close the final year of the eenmanszaak, deal with the closing balance (assets, stock, goodwill going into the BV) and file the final income tax return, while the same file is handed to the Founders bookkeeper.", "streamsNeeded": [{"id": "close-the-year-and-file-income-tax", "name": "Close the Year and File Income Tax", "howItSupports": "Closes the sole proprietorship's final year and files its last income tax return with the cessation handled."}, {"id": "serve-partnerships-and-companies", "name": "Serve Partnerships and Companies", "howItSupports": "Carries the closing balance and history into the new BV administration so opening balances and goodwill are consistent."}]}, {"step": "Set up the BV administration with Founders", "description": "After incorporation at the notary and registration at the KVK, open the Founders client accounts for the holding and the operating company, connect their bank accounts, load the opening balances and switch the subscription from the eenmanszaak plan to the BV plans without a second onboarding.", "streamsNeeded": [{"id": "start-and-onboard-a-new-client", "name": "Start and Onboard a New Client", "howItSupports": "Creates the BV client accounts with Founders and assigns the bookkeeper, reusing the identity and history of the existing Kees client."}, {"id": "switch-from-a-previous-bookkeeper", "name": "Switch from a Previous Bookkeeper", "howItSupports": "Imports the previous returns and opening balances so the BV starts with a complete history instead of an empty ledger."}, {"id": "manage-subscription-billing-and-plans", "name": "Manage Subscription Billing and Plans", "howItSupports": "Ends the eenmanszaak plan and starts the holding and werkmaatschappij plans on the same monthly invoice, respecting the cancellation rules."}]}, {"step": "Keep invoicing and banking running on day one", "description": "Invoice customers from the operating company from the first day with the new KVK and VAT numbers, keep the trading names, and have the new bank accounts synced and matched, so cash flow does not stall during the change.", "streamsNeeded": [{"id": "create-quotes-and-invoices-and-get-paid", "name": "Create Quotes and Invoices and Get Paid", "howItSupports": "Moves templates, trading names and open invoices to the operating company so invoicing continues with the correct legal details."}, {"id": "sync-and-match-bank-transactions", "name": "Sync and Match Bank Transactions", "howItSupports": "Connects the BVs' new bank accounts through Ponto and matches transactions from the first sync."}]}, {"step": "Run the first DGA payroll and the first corporate year", "description": "Start the DGA salary through payroll in the first month, get the first quarterly VAT returns of the operating company filed, and reach the first statutory annual accounts and corporate tax return with the Founders bookkeeper without a missed deadline.", "streamsNeeded": [{"id": "run-payroll-for-small-employers", "name": "Run Payroll for Small Employers", "howItSupports": "Starts the DGA payroll and wage tax filing from the first month of the BV."}, {"id": "serve-partnerships-and-companies", "name": "Serve Partnerships and Companies", "howItSupports": "Takes the BV through its first annual accounts, KVK deposit and corporate tax return with the same organisation that served the sole proprietorship."}]}]}], "customerJourneyStories": [{"id": "journey-bvdg-1", "name": "From an accountant's hourly invoices to a fixed fee with Founders", "linkedJobIds": ["jtbd-bvdg-1", "jtbd-bvdg-2"], "summary": "The founder of a small marketing agency owns a holding BV and an operating company, employs two people and has used a traditional accountancy firm since incorporation. When the firm's invoices keep growing and the annual accounts keep arriving late, she moves both BVs to Founders, the sister company of Kees de Boekhouder, for a fixed fee per entity.", "stages": [{"stage": "Trigger", "narrative": "The accountancy firm's invoice for the year is a third higher than the year before, with hours for 'questions' the DGA does not remember asking, and the annual accounts of the operating company are still not ready in September, so the KVK deposit is at risk again. A former colleague who is now a freelancer keeps telling her that his bookkeeper costs a fixed amount and answers within a day."}, {"stage": "Discovery", "narrative": "Searching for a fixed-fee bookkeeper for a BV she finds Founders on founders.nl, sees the holding BV price of EUR 1,750 and the werkmaatschappij price of EUR 2,450 per year ex VAT invoiced monthly, and recognises the Kees de Boekhouder connection from her colleague's story. The pricing page lists what is included: quarterly VAT, statutory annual accounts, KVK filing and the corporate tax return."}, {"stage": "Evaluation", "narrative": "She compares Founders with staying at the firm, with a cheaper online accountant, and with doing the books herself in accounting software with a tax adviser at year-end. What matters is that a BV requires statutory accounts and a VPB return she cannot do herself, that the fee is fixed per entity with payroll at EUR 17.50 per payslip for her two employees and herself as DGA, that the AVG-compliant processing agreement is in place, and that her intercompany positions and DGA salary are handled by people who do this daily. The free intro call answers her questions about the customary wage and the current account with the holding."}, {"stage": "Trial", "narrative": "Founders takes over from the accountancy firm with digital copies of the last annual accounts and returns, connects the bank accounts of both BVs through Ponto and sets up payroll for the three employees, DGA included, in time for the next month. The first quarterly VAT return of the operating company and the first monthly payslips arrive without corrections, and she cancels the firm after their engagement letter's notice period."}, {"stage": "Engagement", "narrative": "The bookkeeper reconciles the intercompany management fee and her current account every quarter, prepares both sets of annual accounts in the spring, deposits them at the KVK after she adopts them, and files both corporate tax returns. In the autumn they discuss the dividend from the holding with the balance-sheet test and the box 2 tax in front of them, and adjust the provisional assessment when the year turns out better than planned."}, {"stage": "Retention", "narrative": "Two years in, her total cost of compliance is lower and predictable, the annual accounts are deposited months before the deadline, and every question gets a reply within a day without appearing on an invoice. When she considers a second operating company for a new venture, she asks Founders to set it up, and she recommends Founders to two other agency owners in her network."}]}, {"id": "journey-bvdg-2", "name": "A Kees freelancer grows into a Founders BV", "linkedJobIds": ["jtbd-bvdg-3", "jtbd-bvdg-2"], "summary": "A software consultant has been a Kees de Boekhouder client as an eenmanszaak for four years. With profit well above the level where a BV starts to pay off, the Wet DBA on his mind and a pension to build, he asks his bookkeeper whether to incorporate, and moves to a holding plus werkmaatschappij with Founders without leaving the platform.", "stages": [{"stage": "Trigger", "narrative": "A strong year pushes the consultant's profit to a level where his bookkeeper's tax reservation advice comes with a note: at this profit a BV may be worth looking at. At the same time his main client wants a clearer contracting arrangement under the Wet DBA enforcement, and a mortgage adviser mentions that a DGA salary and a holding are common among his peers."}, {"stage": "Discovery", "narrative": "Rather than searching for an accountant, he asks the question in the app to the bookkeeper he already has. The answer explains that BVs are served by Founders, the sister company of Kees founded in 2018 at the same address, on the same fixed-fee model, and that his history, bank connection and app would carry across. The Kees blog on the eenmanszaak-versus-BV question and a client story of a consultant who made the same move give him the outline."}, {"stage": "Evaluation", "narrative": "He weighs staying an eenmanszaak (keeping the zelfstandigenaftrek that is shrinking anyway, and the mkb-winstvrijstelling) against a holding and operating company at EUR 1,750 plus EUR 2,450 per year with Founders, a DGA salary at the customary-wage level through payroll, and the box 2 dividend route. He also considers an accountancy firm that specialises in IT contractors. The decisive points are the fixed fee, the fact that the same organisation closes his sole proprietorship and opens the BVs, and the bookkeeper's plain comparison of the net effect, given without a consultation fee."}, {"stage": "Trial", "narrative": "He incorporates at the notary with a year-end conversion date. Kees closes the eenmanszaak's final year and files its last income tax return; Founders opens the two BV administrations with the opening balances and goodwill, connects the new bank accounts via Ponto, moves his invoice templates and trading name to the operating company, and runs the first DGA payslip in January. The first quarterly VAT return of the operating company goes out in April as before."}, {"stage": "Engagement", "narrative": "The Founders bookkeeper books the management fee between the BVs monthly, reconciles his current account each quarter, and in the first spring delivers the annual accounts of both BVs and the corporate tax returns, followed by the KVK deposit. Before the second year-end they decide together on the first dividend from the holding, and his private income tax return with the box 2 income is filed by the same bookkeeper."}, {"stage": "Retention", "narrative": "The consultant renews without thinking about alternatives: filings are on time, the total cost is what the plan said, and the advice on salary, dividend and pension in the holding comes from someone who has known his numbers for six years. He becomes one of the client stories Founders uses for freelancers considering the same move."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-bvdg-top", "name": "Corporate filings completed on time", "description": "Share of statutory obligations of the DGA's BVs (quarterly VAT returns, wage tax returns, statutory annual accounts deposited at the KVK, corporate tax returns and dividend tax returns) completed before their legal or extended deadline in the year. Modeled seed value for a holding-plus-operating-company structure, not an official Founders figure.", "unit": "%", "currentValue": "92", "targetValue": "100", "link": "https://dashboard.example.com/freelancer-bookkeeping-service-platform/customers/bvdg/kpis/co-bvdg-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-bvdg-
