<script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

app so revenue is booked automatically", "description": "Create quotes and invoices in the app under the right trading name, with the correct VAT rule for a Dutch agency, an EU client (reverse charge) or a private customer, so that every sale is already in the administration and the bookkeeper never has to reconstruct revenue from bank statements.", "streamsNeeded": [{"id": "create-quotes-and-invoices-and-get-paid", "name": "Create Quotes and Invoices and Get Paid", "howItSupports": "Produces the invoice as a booking with the right VAT treatment and tracks its status, so revenue is complete without extra work."}]}, {"step": "Let the bank connection match the rest", "description": "Check the app once a week: transactions synced four times a day are matched automatically against invoices and receipts; the freelancer confirms the few open ones, books a direct expense for a small purchase without a receipt, and re-authorises the bank consent when the app asks every 90 to 180 days. Friction: an expired consent silently stops the sync and creates a backlog.", "streamsNeeded": [{"id": "sync-and-match-bank-transactions", "name": "Sync and Match Bank Transactions", "howItSupports": "Syncs and auto-matches transactions and asks for manual matching or direct booking only for the remainder; flags consent expiry before the sync stops."}, {"id": "monitor-your-finances-on-the-dashboard", "name": "Monitor Your Finances on the Dashboard", "howItSupports": "Shows the open to-dos and unmatched transactions on web and mobile so the weekly check takes minutes."}]}, {"step": "Respond to the bookkeeper's review questions", "description": "Before each quarterly VAT return the bookkeeper checks the administration and asks about anything unclear: a large purchase that may be an investment, a receipt without VAT, a payment from a foreign platform. Answer by e-mail or phone, upload the missing document, and let the bookkeeper close the quarter.", "streamsNeeded": [{"id": "review-administration-and-file-vat-returns", "name": "Review Administration and File VAT Returns", "howItSupports": "Structures the bookkeeper's check into concrete questions and to-dos for the client, so the quarter can be closed without a back-and-forth over e-mail."}, {"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Carries the questions and answers between client and bookkeeper by e-mail and phone, linked to the client file."}]}]}, {"id": "jtbd-crfr-2", "name": "Never miss a VAT or income tax deadline or get a surprise bill", "whatItIs": "Have the quarterly btw-aangifte and the yearly income tax return prepared, checked and filed with the Belastingdienst before the deadline by a bookkeeper who carries the fiscal responsibility, and know throughout the year what to reserve for VAT and income tax so that an assessment never comes as a shock. The job is peace of mind: deadlines are someone else's calendar, deductions are applied, and the reserved amount matches the bill.", "outcome": "Every VAT return is filed before the last day of the month after the quarter and every income tax return before its deadline, with zelfstandigenaftrek, mkb-winstvrijstelling and investment deductions applied, and the difference between the reserved amount and the final assessment stays within a small margin.", "steps": [{"step": "Know the deadlines and what the bookkeeper needs", "description": "Receive reminders in the app and by e-mail before the end of each quarter listing what is still missing (receipts, unmatched transactions, an invoice not yet sent), so the review can start on time. Friction: a reminder that arrives during a shoot week or a festival is easy to ignore.", "streamsNeeded": [{"id": "review-administration-and-file-vat-returns", "name": "Review Administration and File VAT Returns", "howItSupports": "Sets the review cut-off per quarter and derives the client to-do list of missing bookings from the administration."}, {"id": "monitor-your-finances-on-the-dashboard", "name": "Monitor Your Finances on the Dashboard", "howItSupports": "Surfaces deadlines, to-dos and notifications on the dashboard and in the mobile app."}]}, {"step": "Have the quarter checked and the VAT return filed", "description": "The bookkeeper reviews the bookings, corrects VAT categories where needed, confirms the VAT to pay or receive with the client and files the return through the official Belastingdienst channel; the client receives the amount and the payment reference with time to pay.", "streamsNeeded": [{"id": "review-administration-and-file-vat-returns", "name": "Review Administration and File VAT Returns", "howItSupports": "Runs the bookkeeper check, prepares the VAT return and files it with the Belastingdienst before the deadline, with the filed copy stored for the client."}]}, {"step": "Reserve the right amount for income tax during the year", "description": "Look at the dashboard's profit and tax reservation after each quarter and set money aside, or ask the bookkeeper to request a preliminary assessment (voorlopige aanslag) so that tax is paid monthly instead of in one lump. Decide with the bookkeeper whether an exceptionally good year justifies an investment before year-end.", "streamsNeeded": [{"id": "monitor-your-finances-on-the-dashboard", "name": "Monitor Your Finances on the Dashboard", "howItSupports": "Shows profit to date and the amount to reserve for VAT and income tax in real time as bookings are submitted."}, {"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Answers reservation questions and arranges a preliminary assessment so the tax bill is spread over the year."}]}, {"step": "Close the year and file the income tax return", "description": "Confirm the hours worked for the hours criterion, private use of the car or studio, and any investments; the bookkeeper prepares the annual figures, applies zelfstandigenaftrek (EUR 1,200 in 2026, EUR 900 in 2027), mkb-winstvrijstelling and investment deductions, and files the income tax return, plus a fiscal partner's return for EUR 125 incl. VAT when asked.", "streamsNeeded": [{"id": "close-the-year-and-file-income-tax", "name": "Close the Year and File Income Tax", "howItSupports": "Turns the checked administration into annual accounts and a filed income tax return with the deductions applied, including the partner return add-on."}]}, {"step": "Understand the assessment and deal with changes", "description": "When the assessment arrives, compare it with what was reserved and ask the bookkeeper about any difference; receive proactive updates about rule changes that matter to creative freelancers, such as the shrinking zelfstandigenaftrek, the KOR threshold of EUR 20,000 and Wet DBA enforcement since 2025.", "streamsNeeded": [{"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Explains the assessment and pushes proactive updates about deadlines and rule changes to the client, backed by the advice knowledge base."}]}]}, {"id": "jtbd-crfr-3", "name": "Get paid faster with professional quotes and invoices", "whatItIs": "Send quotes and invoices that look professional under the trading name the client knows, apply the right VAT rule for agencies, EU clients and private customers, see which invoices are open and remind clients politely, so that cash arrives sooner and the freelancer spends less time chasing money. The job is to make invoicing part of the creative workflow rather than a separate chore in Word or Excel.", "outcome": "Invoices go out the day the work is delivered, the share of invoices paid within the payment term rises, overdue invoices are reminded automatically before the freelancer has to make an awkward call, and every invoice is already booked for VAT and revenue.", "steps": [{"step": "Turn a request into a quote", "description": "Create a quote from a template with the freelancer's trading name, logo and terms, decide on day rate versus fixed fee, and send it from the app so that acceptance can be tracked. Friction: creative work often starts on a verbal yes, so the quote must be quick.", "streamsNeeded": [{"id": "create-quotes-and-invoices-and-get-paid", "name": "Create Quotes and Invoices and Get Paid", "howItSupports": "Provides quote templates per trading name with status tracking and one-click conversion to an invoice."}]}, {"step": "Invoice with the right VAT rule", "description": "Convert the accepted quote into an invoice, applying 21 percent VAT for a Dutch client, reverse charge for an EU agency, or the KOR exemption when the freelancer opted in, and attach it to the client's contact so the history is in one place.", "streamsNeeded": [{"id": "create-quotes-and-invoices-and-get-paid", "name": "Create Quotes and Invoices and Get Paid", "howItSupports": "Applies VAT rules including reverse charge, keeps multiple trading names per entity and books the invoice as revenue."}, {"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Answers the occasional question about a foreign client or a licence fee before the invoice goes out."}]}, {"step": "See what is open and when it was paid", "description": "Watch the invoice status change to paid when the bank connection matches the incoming payment, and see days outstanding per client on the dashboard, without checking the bank app manually.", "streamsNeeded": [{"id": "sync-and-match-bank-transactions", "name": "Sync and Match Bank Transactions", "howItSupports": "Matches incoming payments to open invoices automatically so status is current without manual work."}, {"id": "monitor-your-finances-on-the-dashboard", "name": "Monitor Your Finances on the Dashboard", "howItSupports": "Shows outstanding invoices and revenue per quarter in real time."}]}, {"step": "Remind late payers without damaging the relationship", "description": "Let the app send a friendly reminder after the payment term and a firmer one later, decide personally when to call, and ask the bookkeeper about statutory interest or a collection step for a client that never pays.", "streamsNeeded": [{"id": "create-quotes-and-invoices-and-get-paid", "name": "Create Quotes and Invoices and Get Paid", "howItSupports": "Tracks overdue invoices and sends reminders in the freelancer's tone, with the option to escalate."}]}]}], "customerJourneyStories": [{"id": "journey-crfr-1", "name": "From a shoebox of receipts to a bookkeeper on the phone", "linkedJobIds": ["jtbd-crfr-1", "jtbd-crfr-2"], "summary": "A furniture designer and maker in Amsterdam, three years into his eenmanszaak, moves from a shoebox of receipts and a once-a-year accountant to Kees de Boekhouder, from the fine that triggered the search to the second year in which he recommends Kees to his studio neighbours.", "stages": [{"stage": "Trigger", "narrative": "A letter from the Belastingdienst announces a fine for a VAT return filed late, and the accountant who does the annual return replies that quarterly VAT was never part of the deal. The designer realises he has paid VAT he could have reclaimed on materials and that a good year of commissions has left nothing reserved for income tax."}, {"stage": "Discovery", "narrative": "A studio neighbour, a photographer and DuPho member, mentions that her bookkeeper at Kees de Boekhouder answers within a day and that DuPho members get a benefit. The designer reads the client story of Jochem, a fellow furniture maker, on keesdeboekhouder.nl and sees that a personal bookkeeper plus app costs EUR 840 per year, invoiced monthly."}, {"stage": "Evaluation", "narrative": "He compares Kees with Moneybird and e-Boekhouden.nl, which are cheaper per month but leave the VAT and income tax filing to him, and with a local accountant who charges per hour. The free Google Meet intro settles it: the bookkeeper explains how mixed private and business use of the van and workshop is handled, confirms the first-year commitment and monthly cancellation afterwards, and that the fee includes the income tax return."}, {"stage": "Trial", "narrative": "In the first two weeks he uploads the shoebox in batches with Scan & Herken, connects his Knab account through Ponto and lets the bookkeeper coach him through the first upload. The first quarter is reviewed with a handful of questions about a second-hand lathe and a purchase from a German supplier, and the VAT return is filed a week before the deadline."}, {"stage": "Engagement", "narrative": "Photographing receipts at the timber yard becomes a habit, invoices go out from the app under his studio name, and the dashboard shows what to reserve each quarter. When a gallery in Belgium commissions a piece he e-mails his bookkeeper about reverse-charge VAT and gets an answer the same afternoon."}, {"stage": "Retention", "narrative": "After the first income tax return, with zelfstandigenaftrek and an investment deduction applied and an assessment close to what the dashboard had predicted, he stays without thinking about the alternatives. He records a client story for the Kees network profiles and two neighbours from the studio building book an intro call on his recommendation."}]}, {"id": "journey-crfr-2", "name": "From a first big year as a stylist to admin that fits in a phone", "linkedJobIds": ["jtbd-crfr-1", "jtbd-crfr-3"], "summary": "A stylist and content creator whose business grew from side gigs to a full-time eenmanszaak with brand deals and agency work adopts Kees de Boekhouder through a Kunstenbond member benefit, and stays because the app fits a life lived on set and on the road.", "stages": [{"stage": "Trigger", "narrative": "A brand deal from an agency in Paris, a growing number of small purchases for shoots and a first income tax assessment that surprises her make it clear that a spreadsheet and a friend who 'knows tax' are no longer enough. She has no time in the evenings and no interest in learning bookkeeping."}, {"stage": "Discovery", "narrative": "A Kunstenbond newsletter lists Kees de Boekhouder as a member benefit, and a post by Celeste, a stylist and influencer, describes doing her whole administration from her phone with a bookkeeper who calls her back. The Kees website shows quotes and invoices, Scan & Herken and the dashboard on a mobile screen."}, {"stage": "Evaluation", "narrative": "She checks that the app has a real iOS app, that foreign agency invoices are handled, that reminders for late payers can be sent in her own tone, and that the price is fixed at EUR 70 per month with a bank connection for EUR 5 extra. The intro call confirms that a bookkeeper who has other creative clients will be assigned and that there is no charge for questions."}, {"stage": "Trial", "narrative": "She signs up, connects her bunq account, photographs the receipts of her first shoot week and sends three invoices from the app, one with reverse-charge VAT to the Paris agency. The bookkeeper reviews the first month, corrects two categories and explains which part of her clothing budget can be business."}, {"stage": "Engagement", "narrative": "The app becomes part of set life: a receipt is photographed before the coffee is cold, brand deals are invoiced the day the content is delivered, and overdue invoices are reminded automatically. Each quarter the VAT amount and payment reference arrive by e-mail before the deadline, and the dashboard tells her what to reserve."}, {"stage": "Retention", "narrative": "After a year her days sales outstanding have dropped and the income tax return holds no surprises. When a software-only tool offers a cheaper plan she stays, because the bookkeeper knows her business and has already flagged the Wet DBA questions on a long-term agency contract. She joins the Kees entrepreneur network and refers two fellow creators."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-crfr-top", "name": "Hours spent on administration per mo "linkLabel": "Open KPI dashboard", "icon": "kpi-crfr-bo-crfr-top.png"}, "branches": [{"id": "bo-crfr-b1", "name": "Creative client base growth", "description": "How fast the creative segment grows through partner associations, client stories and referrals, on the road from 10,000 to 20,000 clients.", "currentValue": "55", "icon": "kpi-crfr-bo-crfr-b1.png", "children": [{"id": "bo-crfr-b1-c1", "name": "Active creative sole proprietor clients", "description": "Number of creative eenmanszaak clients on an active subscription at the end of the period.", "unit": "clients", "currentValue": "4000", "targetValue": "7500", "icon": "kpi-crfr-bo-crfr-b1-c1.png", "children": [{"id": "bo-crfr-b1-c1-l1", "name": "New creative clients per month", "description": "Creative clients activated per month after the intro call and fit check.", "unit": "clients per month", "currentValue": "90", "targetValue": "180", "icon": "kpi-crfr-bo-crfr-b1-c1-l1.png", "children": []}, {"id": "bo-crfr-b1-c1-l2", "name": "New creative clients via partner or referral", "description": "Share of new creative clients arriving through BNO, DuPho, Kunstenbond, Stichting BOK, voordekunst or a client referral.", "unit": "%", "currentValue": "35", "targetValue": "50", "icon": "kpi-crfr-bo-crfr-b1-c1-l2.png", "children": []}]}, {"id": "bo-crfr-b1-c2", "name": "Intro-to-active conversion for creative leads", "description": "Share of creative intro calls that become an active client within 30 days.", "unit": "%", "currentValue": "42", "targetValue": "55", "icon": "kpi-crfr-bo-crfr-b1-c2.png", "children": [{"id": "bo-crfr-b1-c2-l1", "name": "Intro calls booked from partner pages per month", "description": "Free Google Meet intros booked per month from partner benefit pages and client stories.", "unit": "calls per month", "currentValue": "60", "targetValue": "130", "icon": "kpi-crfr-bo-crfr-b1-c2-l1.png", "children": []}, {"id": "bo-crfr-b1-c2-l2", "name": "Creative onboarding completed within 14 days", "description": "Share of new creative clients with account, bank connection and first upload coaching completed within two weeks.", "unit": "%", "currentValue": "60", "targetValue": "85", "icon": "kpi-crfr-bo-crfr-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-crfr-b2", "name": "Retention and margin per creative client", "description": "Whether creative clients stay beyond the first fiscal year and how many bookkeeper hours each one costs.", "currentValue": "60", "icon": "kpi-crfr-bo-crfr-b2.png", "children": [{"id": "bo-crfr-b2-c1", "name": "Annual creative client churn rate", "description": "Share of creative clients cancelling per year after the first full fiscal year, with one calendar month notice.", "unit": "%", "currentValue": "12", "targetValue": "7", "icon": "kpi-crfr-bo-crfr-b2-c1.png", "children": [{"id": "bo-crfr-b2-c1-l1", "name": "Clients cancelling right after the first fiscal year", "description": "Share of creative clients who cancel in the first month after the first-year commitment ends.", "unit": "%", "currentValue": "9", "targetValue": "5", "icon": "kpi-crfr-bo-crfr-b2-c1-l1.png", "children": []}, {"id": "bo-crfr-b2-c1-l2", "name": "Creative clients leaving for software-only tools", "description": "Share of creative clients per year who cancel citing a self-service tool such as Moneybird, e-Boekhouden.nl or Tellow.", "unit": "%", "currentValue": "4", "targetValue": "2", "icon": "kpi-crfr-bo-crfr-b2-c1-l2.png", "children": []}]}, {"id": "bo-crfr-b2-c2", "name": "Bookkeeper hours per creative client per year", "description": "Bookkeeper time per creative client per year for review, filings, questions and corrections; the main driver of margin at a fixed fee.", "unit": "hours per client per year", "currentValue": "7", "targetValue": "5", "icon": "kpi-crfr-bo-crfr-b2-c2.png", "children": [{"id": "bo-crfr-b2-c2-l1", "name": "Bank connection add-on attach rate", "description": "Share of creative clients with at least one Ponto bank connection at EUR 5 per month.", "unit": "%", "currentValue": "55", "targetValue": "75", "icon": "kpi-crfr-bo-crfr-b2-c2-l1.png", "children": []}, {"id": "bo-crfr-b2-c2-l2", "name": "Receipts arriving as recognised bookings", "description": "Share of expense bookings that arrive via Scan & Herken or e-mail-in rather than as paper batches handed to the bookkeeper.", "unit": "%", "currentValue": "60", "targetValue": "90", "icon": "kpi-crfr-bo-crfr-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make Kees de Boekhouder the bookkeeper every creative freelancer recommends to the next: administration that fits in a phone, a personal bookkeeper who understands creative work, and no surprises at the VAT deadline or in the income tax assessment, at one fixed price.", "timeHorizons": {"year1": {"focus": "Grow the creative segment through the associations and client stories that already work (BNO, DuPho, Kunstenbond, Stichting BOK, voordekunst) while cutting the client's own administration time with better recognition, bank matching and reminders, and keeping every VAT and income tax return on time as zelfstandigenaftrek shrinks.", "productTheme": "Minutes of admin per month, filed on time, no surprises", "customerKPI": {"northStar": "Hours spent on administration per month", "supporting": ["Tax filing on-time rate", "Receipts recognised automatically by Scan & Herken"]}, "businessKPI": {"northStar": "Annual recurring revenue from creative sole proprietors", "revenueStreams": ["Eenmanszaak subscription at EUR 840 per year, invoiced monthly", "Bank connection add-on at EUR 5 per month per account", "Partner income tax return at EUR 125 incl. VAT"], "supporting": ["New creative clients per month", "New creative clients via partner or referral"]}, "milestones": ["Raise Scan & Herken recognition on small retail receipts and e-mail-in invoices so most creative expense bookings need no manual correction", "Warn clients in the app before a Ponto consent expires so bank syncs never silently stop", "Launch member-benefit pages and client stories with each creative association and track intro calls per partner"]}, "year3": {"focus": "Near-fully automated administration for standard creative sole proprietors with bookkeeper review by exception: booking rules learned per client, invoices and payments reconciled without touch, e-invoicing and Peppol ready, and the tax reservation on the dashboard trusted enough to replace the annual scare.", "productTheme": "Automated administration, human review by exception", "customerKPI": {"northStar": "Hours spent on administration per month", "supporting": ["Bank transactions matched automatically", "Unexpected tax bill incidence"]}, "businessKPI": {"northStar": "Annual recurring revenue from creative sole proprietors", "revenueStreams": ["Eenmanszaak subscriptions with a rising share of bank connection add-ons", "Partner programme benefits with insurers, pension and crowdfunding partners", "Quotes and invoices with e-invoicing as standard"], "supporting": ["Annual creative client churn rate", "Bookkeeper hours per creative client per year"]}, "milestones": ["Learn booking rules per client so recurring suppliers and subscriptions are booked and matched without review", "Bring the tax reservation deviation for creative clients below ten percent with quarterly reservation nudges", "Ship e-invoicing over Peppol for quotes and invoices ahead of the EU ViDA timeline"]}, "year5": {"focus": "Continuous, AI-assisted bookkeeping with a human guarantee for creatives: the real-time tax position of every client, agentic booking and drafting of returns supervised by the bookkeeper, and proactive advice on investments, grants and licence income that no software-only tool offers.", "productTheme": "Real-time tax position with a bookkeeper's guarantee", "customerKPI": {"northStar": "Hours spent on administration per month", "supporting": ["Tax reservation deviation from final assessment", "Clients setting aside the income tax reservation monthly"]}, "businessKPI": {"northStar": "Annual recurring revenue from creative sole proprietors", "revenueStreams": ["Eenmanszaak subscriptions across the national creative freelancer base", "Financial-home add-ons through partners: insurance, pension, financing", "Advisory moments on investments, grants and licence income"], "supporting": ["Active creative sole proprietor clients", "Creative clients leaving for software-only tools"]}, "milestones": ["Deliver agentic drafting of VAT and income tax returns for creative clients, reviewed and filed by their personal bookkeeper", "Offer a real-time tax position and reservation advice per client on web and mobile, updated with every booking", "Make Kees the financial home of the creative freelancer with partner insurance, pension and financing inside the app"]}}}, "domain": "Freelancers and Sole Proprietors"}, {"id": "kfrl", "name": "Knowledge Freelancer", "description": "A consultant, software developer, interim manager, project lead, coach or trainer who runs an eenmanszaak with a few larger clients at a time, invoices by the hour or per fixed-fee assignment and earns a higher revenue than the average zzp'er: often EUR 80,000 to 150,000 per year with relatively few, larger cost items such as a laptop, travel, training, pension contributions and a home office. Pays the fixed eenmanszaak fee of EUR 840 per year ex VAT, invoiced monthly, usually with a bank connection through Ponto at EUR 5 per month, and frequently adds the partner income tax return for EUR 125 incl. VAT. Sensitive to the Wet DBA (enforced by the Belastingdienst since 1 January 2025 with a soft landing in 2026), to claiming every deduction (zelfstandigenaftrek of EUR 1,200 in 2026, mkb-winstvrijstelling, pension and investment deductions) and to knowing the real profit and the tax to reserve at any moment. Faces big decisions along the way: buying a house on a freelancer's income, moving to a BV once profit stays high, choosing a pension product. Compares Kees de Boekhouder rationally with software-only tools such as Moneybird, Jortt or Tellow and with an accountant who charges per hour, and chooses the personal bookkeeper for the accuracy and the advice, not for the app alone.", "icon": "kfrl.png", "careAbout": ["An accurate tax position at any moment: real profit after costs, VAT to pay this quarter and the income tax to reserve, so that a good year does not turn into a cash problem", "Every deduction claimed correctly: zelfstandigenaftrek, mkb-winstvrijstelling, the hours criterion documented, pension contributions, home office and investments", "Staying on the right side of the Wet DBA on long assignments with one client, with a bookkeeper who reads the contract and warns before the Belastingdienst does", "Expert answers on big decisions (buying a house, moving to a BV, a pension product, a fiscal partner) included in the fixed fee rather than billed per hour", "A fixed, predictable EUR 840 per year with a clear scope, versus an accountant's open-ended hourly invoices", "A bank connection and app that keep the administration current with minimal effort, so the numbers on the dashboard can be trusted for decisions"], "winsThem": ["A personal bookkeeper who calls back the same day and whose income tax return has already been through a four-eyes check, at a fixed fee that includes the questions", "A dashboard with revenue per quarter, profit and the VAT and income tax to reserve, updated in real time from the Ponto bank connection and app invoices", "Advice on the hours criterion, the Wet DBA, a preliminary assessment and the timing of an investment from a bookkeeper backed by an advice knowledge base", "A seamless path to a BV through the sister company Founders (holding EUR 1,750, werkmaatschappij EUR 2,450 per year) without changing bookkeeper or platform", "A partner income tax return for EUR 125 incl. VAT, a mortgage-ready set of annual figures and a fixed price that a rational comparison with software-only tools cannot beat on total cost of ownership"], "theirFear": ["The Belastingdienst reclassifies a two-year assignment with one client as employment under the Wet DBA, and both the freelancer and the client face back taxes because nobody checked the contract", "A software-only tool files the income tax return without the pension deduction and the hours criterion evidence, and the freelancer pays thousands more than necessary", "Reserving too little in a strong year, then receiving an income tax assessment and a higher preliminary assessment at the same time, right when the mortgage application is under review"], "jobsToBeDone": [{"id": "jtbd-kfrl-1", "name": "Know my real profit, tax position and what to reserve at any moment", "whatItIs": "See the true financial state of the business whenever a decision comes up: revenue and outstanding invoices, costs and investments, profit to date, the VAT position for the current quarter and the income tax to reserve, with the bookkeeper confirming the numbers each quarter. The job is to run the business on real figures rather than on the bank balance.", "outcome": "The dashboard shows profit, VAT position and tax reservation that stay within a small margin of what the bookkeeper files and the Belastingdienst assesses, so that reservations, investments and a mortgage application can be based on the numbers on screen.", "steps": [{"step": "Connect the bank and keep transactions matched", "description": "Connect the business account through Ponto so transactions arrive four times a day and are matched to invoices and expenses automatically; confirm the few open ones weekly and re-authorise the consent when asked, so the dashboard reflects the bank without manual entry.", "streamsNeeded": [{"id": "sync-and-match-bank-transactions", "name": "Sync and Match Bank Transactions", "howItSupports": "Provides the PSD2 bank connection, automatic matching and re-authorisation flow that keep bookings and bank in step."}]}, {"step": "Invoice hours and fixed fees from the app", "description": "Invoice each client monthly or per milestone from the app, with the correct VAT treatment and the right trading name, so revenue is booked on the invoice date and outstanding amounts are visible per client.", "streamsNeeded": [{"id": "create-quotes-and-invoices-and-get-paid", "name": "Create Quotes and Invoices and Get Paid", "howItSupports": "Creates invoices with VAT rules and status tracking so revenue and receivables are current in the administration."}]}, {"step": "Book the few larger costs and investments correctly", "description": "Upload invoices for a laptop, training, travel, software and the home office; decide with the bookkeeper what is an investment to depreciate and what is a cost, and whether a mixed-use item is business at all.", "streamsNeeded": [{"id": "capture-receipts-and-expenses", "name": "Capture Receipts and Expenses", "howItSupports": "Recognises purchase invoices and proposes category and VAT, flagging investments above the threshold for the bookkeeper."}, {"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Answers the investment-versus-cost and mixed-use questions before the quarter is closed."}]}, {"step": "Read the tax position and reserve", "description": "Check the dashboard after each quarter: profit to date, VAT to pay, and the income tax reservation including zelfstandigenaftrek and mkb-winstvrijstelling; transfer the reserved amount to a savings account or let the bookkeeper request a preliminary assessment. Friction: reservation advice must reflect a fiscal partner's income and the shrinking zelfstandigenaftrek.", "streamsNeeded": [{"id": "monitor-your-finances-on-the-dashboard", "name": "Monitor Your Finances on the Dashboard", "howItSupports": "Shows revenue per quarter, costs, investments, profit and the VAT and income tax reservation in real time on web and mobile."}]}, {"step": "Have the quarter confirmed by the bookkeeper", "description": "Before each VAT return the bookkeeper checks the bookings and confirms or corrects the position, so the dashboard's numbers are validated four times a year and the year-end holds no surprises.", "streamsNeeded": [{"id": "review-administration-and-file-vat-returns", "name": "Review Administration and File VAT Returns", "howItSupports": "Runs the quarterly bookkeeper check that validates the bookings behind the dashboard and files the VAT return."}]}]}, {"id": "jtbd-kfrl-2", "name": "Claim every deduction and stay on the right side of the Wet DBA", "whatItIs": "Make sure that the income tax return uses every deduction the freelancer is entitled to, that the evidence for the hours criterion and business use exists when the Belastingdienst asks, and that assignments are structured and documented so they do not look like sham self-employment under the Wet DBA. The job is to minimise tax legally and to keep the freelance status defensible.", "outcome": "The filed income tax return includes zelfstandigenaftrek, mkb-winstvrijstelling, pension, home office and investment deductions where applicable with evidence on file, and every long assignment has been checked against the Wet DBA indicators before it starts, with no reclassification or correction afterwards.", "steps": [{"step": "Check a new assignment against the Wet DBA before signing", "description": "Send the draft contract or describe the assignment to the bookkeeper: duration, exclusivity, who directs the work, own tools and rates, number of clients. Decide together whether the assignment is defensible, whether a model agreement (usable until 31 December 2029) helps, and what to change. Friction: clients push for speed and the freelancer does not want to lose the assignment.", "streamsNeeded": [{"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Gives a consistent Wet DBA assessment backed by the knowledge base and records the advice in the client file."}]}, {"step": "Log hours and keep evidence for the hours criterion", "description": "Keep a simple record of hours worked on the business, including acquisition and administration, to meet the 1,225-hour criterion for zelfstandigenaftrek, and keep the evidence for business use of the home office, car and phone.", "streamsNeeded": [{"id": "monitor-your-finances-on-the-dashboard", "name": "Monitor Your Finances on the Dashboard", "howItSupports": "Keeps the to-do and document view where hours evidence and business-use notes are stored next to the figures."}, {"id": "capture-receipts-and-expenses", "name": "Capture Receipts and Expenses", "howItSupports": "Stores the invoices and receipts that back each deduction in the document archive."}]}, {"step": "Book pension, training and investments so they count", "description": "Pay pension contributions to a product that qualifies (for example through the BrightPensioen partner benefit), book training and investments in the year that benefits most, and confirm depreciation with the bookkeeper.", "streamsNeeded": [{"id": "capture-receipts-and-expenses", "name": "Capture Receipts and Expenses", "howItSupports": "Categorises pension, training and investment invoices so they flow to the right deduction at year-end."}, {"id": "grow-through-partners-and-referrals", "name": "Grow Through Partners and Referrals", "howItSupports": "Provides partner benefits such as the pension provider discount that make qualifying contributions easy."}]}, {"step": "Review the draft income tax return with the bookkeeper", "description": "Go through the year-end figures and the draft return: which deductions were applied, whether the fiscal partner's return is included for EUR 125 incl. VAT, and where next year's profit can be optimised.", "streamsNeeded": [{"id": "close-the-year-and-file-income-tax", "name": "Close the Year and File Income Tax", "howItSupports": "Prepares the annual accounts and the income tax return with all deductions applied and the partner return on request, ready for review and filing."}]}, {"step": "Stay informed about rule changes", "description": "Receive proactive updates from the bookkeeper when the rules change: zelfstandigenaftrek falling to EUR 900 in 2027, KOR changes, Wet DBA enforcement steps, and adjust the plan for the year.", "streamsNeeded": [{"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Pushes proactive updates about rule changes and deadlines to the client from the advice knowledge base."}]}]}, {"id": "jtbd-kfrl-3", "name": "Get expert answers on big decisions (house, BV, pension) without paying per hour", "whatItIs": "Get a clear, well-founded answer when a decision with fiscal consequences comes up: buying a house on freelance income, whether and when to move to a BV, choosing a pension product, taking on a fiscal partner, or taking a job next to the business. The job is access to expertise that is included in the subscription, consistent across bookkeepers, and turned into action on the same platform.", "outcome": "Each big decision is answered within days with a written recommendation and the figures to back it (mortgage-ready annual accounts, a BV comparison at the client's profit level, pension options), without extra fees, and executed on the same platform, for example through Founders when a BV is set up.", "steps": [{"step": "Ask the question with the numbers already there", "description": "Send the question by e-mail or book a call; the bookkeeper sees the client's revenue, profit history and reservations in the workspace so the answer is specific rather than generic. Friction: a decision like a mortgage has a deadline set by the bank.", "streamsNeeded": [{"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Routes the question to the personal bookkeeper with the client file open and a target response time, with video or in-person meetings on request."}]}, {"step": "Get mortgage-ready figures", "description": "Ask for annual accounts of the last years and a current-year forecast in the format mortgage lenders accept for self-employed applicants, plus the filed income tax returns from the archive.", "streamsNeeded": [{"id": "close-the-year-and-file-income-tax", "name": "Close the Year and File Income Tax", "howItSupports": "Delivers the annual accounts and filed returns that a mortgage lender asks for from a self-employed applicant."}, {"id": "monitor-your-finances-on-the-dashboard", "name": "Monitor Your Finances on the Dashboard", "howItSupports": "Provides the current-year figures and profit trend used for the forecast."}]}, {"step": "Compare eenmanszaak and BV at my profit level", "description": "Receive a comparison of income tax with deductions versus corporate tax, DGA salary and dividend at the client's actual profit, including the fixed Founders fees (holding EUR 1,750, werkmaatschappij EUR 2,450 per year), and decide when the switch pays off.", "streamsNeeded": [{"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Applies the knowledge base's BV comparison method to the client's figures and records the recommendation."}, {"id": "serve-partnerships-and-companies", "name": "Serve Partnerships and Companies", "howItSupports": "Prepares the eenmanszaak-to-BV transition through Founders when the client decides to switch, so the bookkeeper relationship continues."}]}, {"step": "Act on the advice without leaving the platform", "description": "Set up the pension contribution, add the fiscal partner's return, adjust the preliminary assessment or start the BV transition, with the bookkeeper tracking the follow-ups and the subscription changed accordingly.", "streamsNeeded": [{"id": "manage-subscription-billing-and-plans", "name": "Manage Subscription Billing and Plans", "howItSupports": "Adds the partner return add-on or changes the plan and legal form on the subscription without interrupting service."}, {"id": "grow-through-partners-and-referrals", "name": "Grow Through Partners and Referrals", "howItSupports": "Connects the client to partner offers for pension, insurance and legal counsel where the advice calls for them."}]}]}], "customerJourneyStories": [{"id": "journey-kfrl-1", "name": "From a self-service tool to a bookkeeper who reads the contract", "linkedJobIds": ["jtbd-kfrl-2", "jtbd-kfrl-1"], "summary": "A freelance software developer in Utrecht with one long assignment at a scale-up and a spreadsheet-plus-software-tool setup moves to Kees de Boekhouder after the Wet DBA enforcement makes his client nervous, and stays because the tax position on the dashboard finally matches the assessment.", "stages": [{"stage": "Trigger", "narrative": "In early 2025 his client's legal team asks every freelancer to confirm that their contract survives the Belastingdienst's Wet DBA enforcement. The developer realises his software tool files returns but gives no advice, and that his last income tax return missed the pension deduction he thought he had claimed."}, {"stage": "Discovery", "narrative": "A fellow developer in a Slack community mentions that his bookkeeper at Kees de Boekhouder checked his contract and rewrote two clauses. The Kees website lists a fixed price of EUR 840 per year with a personal bookkeeper, an FAQ about the Wet DBA and a free intro call via Google Meet."}, {"stage": "Evaluation", "narrative": "He builds a comparison: Moneybird and Jortt cost less per month but leave him with the filing and no adviser, Tellow's plan with a bookkeeper is close in price, and an accountant quotes hourly rates for advice. The intro call is decisive: the bookkeeper explains the Wet DBA indicators, the hours criterion evidence and how the dashboard shows the income tax reservation, and confirms that questions are included in the fee."}, {"stage": "Trial", "narrative": "He switches mid-year: Kees imports digital copies of the previous returns, he connects his Rabobank account via Ponto and sends his monthly invoice from the app. The bookkeeper reviews the contract, advises a change in the exclusivity clause and requests a preliminary assessment so income tax is paid monthly."}, {"stage": "Engagement", "narrative": "The monthly routine takes fifteen minutes: invoice, confirm two bank matches, upload a training invoice. Each quarter the bookkeeper confirms the VAT position and the dashboard's reservation; the year-end return includes zelfstandigenaftrek, mkb-winstvrijstelling and the pension contribution, with his partner's return added for EUR 125."}, {"stage": "Retention", "narrative": "When his profit stays above the level where a BV starts to make sense, the bookkeeper runs the comparison and Founders takes over the BV setup without a change of platform. He renews without looking at alternatives and points two colleagues from the scale-up to the intro call."}]}, {"id": "journey-kfrl-2", "name": "From an hourly accountant to mortgage-ready figures at a fixed fee", "linkedJobIds": ["jtbd-kfrl-3", "jtbd-kfrl-1"], "summary": "An interim project manager in Rotterdam, tired of her accountant's hourly invoices for every question, adopts Kees de Boekhouder while preparing to buy a house on freelance income, and stays for the predictable cost and the advice that comes with it.", "stages": [{"stage": "Trigger", "narrative": "A mortgage adviser asks for three years of annual figures and a current-year forecast within two weeks, and her accountant quotes a separate fee and a three-week lead time. Her last invoice from the accountant included charges for two e-mails about a preliminary assessment."}, {"stage": "Discovery", "narrative": "A search for 'boekhouder zzp hypotheek' and a recommendation from a former colleague lead her to Kees de Boekhouder's blog on buying a house as a freelancer and the Rotterdam office at Stationsplein. She books the free Google Meet intro the same day."}, {"stage": "Evaluation", "narrative": "She checks whether the fixed fee really includes advice and the income tax return, whether her previous returns can be transferred, how quickly the annual figures can be ready, and what the first-year commitment and monthly cancellation afterwards mean. Client stories and the AVG-compliant processing agreement close the trust gap."}, {"stage": "Trial", "narrative": "The switch service imports her previous returns and the bookkeeper produces the annual figures and forecast the mortgage lender accepts within the deadline. She connects her ABN AMRO account, starts invoicing from the app and the first quarter is reviewed with two questions about travel costs."}, {"stage": "Engagement", "narrative": "With the house bought, the dashboard becomes her monthly check on profit and the tax to reserve. She asks about a pension product and the BrightPensioen partner benefit, has her fiscal partner's return added, and receives an update from her bookkeeper when the zelfstandigenaftrek changes for 2027."}, {"stage": "Retention", "narrative": "At the end of the first fiscal year the total cost is exactly what the website said, the assessment matches the reservation, and every question was answered without an invoice. She stays, recommends Kees in her interim managers' network and considers the VOF package when she starts a joint venture with a colleague."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-kfrl-top", "name": "Tax position accuracy", "description": "Share of knowledge freelancer clients whose income tax and VAT reservation shown on the dashboard and confirmed by the bookkeeper stays within ten percent of the final assessment, so the numbers on screen can be trusted for decisions. Modeled seed value, not an official Kees de Boekhouder figure.", "unit": "%", "currentValue": "80", "targetValue": "95", "link": "https://dashboard.example.com/freelancer-bookkeeping-service-platform/customers/kfrl/kpis/co-kfrl-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-kfrl-co-kfrl-top.png"}, "branches": [{"id": "co-kfrl-b1", "name": "Real-time insight into profit and tax", "description": "Whether the dashboard reflects the business today and whether the reservation it advises is close to the eventual assessment.", "currentValue": "62", "icon": "kpi-kfrl-co-kfrl-b1.png", "children": [{"id": "co-kfrl-b1-c1", "name": "Days between transaction and booking on the dashboard", "description": "Average lag between a bank transaction or invoice and its appearance as a categorised booking in the dashboard figures.", "unit": "days", "currentValue": "12", "targetValue": "1", "icon": "kpi-kfrl-co-kfrl-b1-c1.png", "children": [{"id": "co-kfrl-b1-c1-l1", "name": "Bank transactions synced and matched same day", "description": "Share of synced transactions matched to a booking on the day they arrive through the Ponto connection.", "unit": "%", "currentValue": "70", "targetValue": "95", "icon": "kpi-kfrl-co-kfrl-b1-c1-l1.png", "children": []}, {"id": "co-kfrl-b1-c1-l2", "name": "Sales invoices created in the app", "description": "Share of the client's sales invoices created in the app rather than in an external tool and uploaded later.", "unit": "%", "currentValue": "65", "targetValue": "90", "icon": "kpi-kfrl-co-kfrl-b1-c1-l2.png", "children": []}]}, {"id": "co-kfrl-b1-c2", "name": "Tax reservation deviation from final assessment", "description": "Average absolute deviation between the income tax reservation advised during the year and the final assessment.", "unit": "%", "currentValue": "22", "targetValue": "8", "icon": "kpi-kfrl-co-kfrl-b1-c2.png", "children": [{"id": "co-kfrl-b1-c2-l1", "name": "Quarters with VAT position confirmed before the deadline", "description": "Share of client quarters where the bookkeeper confirmed the VAT to pay or receive with the client before the filing deadline.", "unit": "%", "currentValue": "85", "targetValue": "100", "icon": "kpi-kfrl-co-kfrl-b1-c2-l1.png", "ch the business interacts with a job", "A fixed price of EUR 840 per year invoiced monthly, so the cost is known before the first revenue arrives", "A human to ask stupid questions to, by e-mail or phone, without feeling judged or paying per question"], "winsThem": ["A free introduction call via Google Meet where a real bookkeeper explains the KVK, VAT number, KOR and startersaftrek steps in twenty minutes", "A Starters package at the same fixed eenmanszaak fee, invoiced monthly, with the income tax return included", "An app that makes the first receipt and the first invoice easy: photograph, recognise, send, and the bookkeeper checks it", "Starter content and 'Keep up' updates on entrepreneurship next to a job, the hours criterion and buying a house as a freelancer, written by the bookkeepers", "A platform that grows with the business, from starter to VOF to BV through Founders, so the first bookkeeper can stay the bookkeeper"], "theirFear": ["Registering for VAT wrongly or missing the first quarterly return, and starting the business with a fine and a letter from the Belastingdienst", "Filing the first income tax return with a free tool and missing startersaftrek, or claiming zelfstandigenaftrek without meeting the hours criterion next to a job", "Mixing private and business money in one account for a year and paying a bookkeeper hours to untangle it"], "jobsToBeDone": [{"id": "jtbd-strt-1", "name": "Start my business with the administration set up right from day one", "whatItIs": "Go from a KVK registration to a working administration in the first weeks: VAT number, the KOR decision, a business bank account connected, trading names, invoice templates and the rules for what is business and what is private, with a bookkeeper assigned who will carry the first filings. The job is to avoid the mistakes that cost hours and money to repair later.", "outcome": "Within two weeks of the intro call the starter has an active account, a connected business bank account, a recorded KOR decision, the first invoice sent from the app and the first receipts booked, and the bookkeeper has confirmed the set-up is complete for the first quarter.", "steps": [{"step": "Have the intro call and decide on the fit", "description": "Book the free Google Meet intro after or even before the KVK registration, describe the plans (part-time next to a job, full-time, expected turnover) and hear from a bookkeeper whether the Starters package fits, what the fixed fee covers and what the first-year commitment means. Decision: start now or wait for the first client.", "streamsNeeded": [{"id": "start-and-onboard-a-new-client", "name": "Start and Onboard a New Client", "howItSupports": "Runs the intro call, the mutual-fit check and plan choice, and assigns the personal bookkeeper for starters."}]}, {"step": "Get the fiscal basics right", "description": "Confirm the KVK registration and VAT number from the Belastingdienst, decide with the bookkeeper on the KOR (exemption up to EUR 20,000 turnover, but no VAT reclaim on investments), and understand what the hours criterion means next to a job. Friction: KOR looks attractive but blocks reclaiming VAT on a laptop or equipment.", "streamsNeeded": [{"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Provides the starter advice on VAT number, KOR, hours criterion and startersaftrek from the knowledge base, recorded in the client file."}, {"id": "start-and-onboard-a-new-client", "name": "Start and Onboard a New Client", "howItSupports": "Captures the KOR decision and entity details as part of onboarding so the first VAT return is set up correctly."}]}, {"step": "Open and connect a business bank account", "description": "Open a business account at a Ponto-connected bank (Knab, bunq, Rabobank, ABN AMRO), connect it for EUR 5 per month and keep private money out of it, so matching works from the first transaction.", "streamsNeeded": [{"id": "sync-and-match-bank-transactions", "name": "Sync and Match Bank Transactions", "howItSupports": "Establishes the PSD2 consent and starts syncing and matching from the first transaction."}]}, {"step": "Set up trading names and invoice templates", "description": "Add the trading name(s) from the KVK registration, upload a logo and payment terms, and send the first invoice from the app with the right VAT rule (or the KOR exemption text).", "streamsNeeded": [{"id": "create-quotes-and-invoices-and-get-paid", "name": "Create Quotes and Invoices and Get Paid", "howItSupports": "Provides templates per trading name with the correct VAT wording, including the KOR exemption."}]}, {"step": "Learn the capture habit with first upload coaching", "description": "Photograph the first receipts with Scan & Herken during the coaching session, learn which costs are business, what to do with a mixed-use phone or laptop, and how the dashboard will show revenue, costs and the VAT to pay.", "streamsNeeded": [{"id": "capture-receipts-and-expenses", "name": "Capture Receipts and Expenses", "howItSupports": "Recognises the first receipts and shows the starter how categorisation and VAT work in practice."}, {"id": "monitor-your-finances-on-the-dashboard", "name": "Monitor Your Finances on the Dashboard", "howItSupports": "Shows the starter's first revenue, costs and VAT position so the numbers make sense from week one."}]}]}, {"id": "jtbd-strt-2", "name": "File my first VAT return and first income tax return without mistakes", "whatItIs": "Get through the first quarterly btw-aangifte and, at the end of the first year, the first income tax return that combines business profit with salary from a job, with the bookkeeper checking every booking and filing on time. The job is a first cycle that is right first time, so the starter learns the rhythm and never fears the Belastingdienst.", "outcome": "The first VAT return is filed before the last day of the month after the quarter without a later correction, the first income tax return is filed with startersaftrek and zelfstandigenaftrek applied where the hours criterion is met, and the starter understands the amount to pay before the assessment arrives.", "steps": [{"step": "Submit the first quarter's bookings before the cut-off", "description": "Upload receipts, send invoices from the app and confirm bank matches before the bookkeeper's review cut-off; the app's reminders list what is missing. Friction: a starter next to a job easily forgets the first deadline.", "streamsNeeded": [{"id": "review-administration-and-file-vat-returns", "name": "Review Administration and File VAT Returns", "howItSupports": "Sets the review cut-off and reminds the starter what is missing for the first quarter."}, {"id": "capture-receipts-and-expenses", "name": "Capture Receipts and Expenses", "howItSupports": "Turns the first receipts into bookings the bookkeeper can review."}]}, {"step": "Let the bookkeeper check and explain", "description": "The bookkeeper reviews the first quarter with extra attention: private costs booked as business, VAT on a foreign subscription, a missing invoice; explains each correction so the second quarter needs fewer.", "streamsNeeded": [{"id": "review-administration-and-file-vat-returns", "name": "Review Administration and File VAT Returns", "howItSupports": "Runs the bookkeeper check with corrections and questions routed to the client."}, {"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Explains the corrections by e-mail or phone so the starter learns from the first quarter."}]}, {"step": "File the first VAT return and pay on time", "description": "Receive the confirmed VAT amount and payment reference before the deadline; the bookkeeper files through the Belastingdienst channel, and the filed copy is stored in the document archive.", "streamsNeeded": [{"id": "review-administration-and-file-vat-returns", "name": "Review Administration and File VAT Returns", "howItSupports": "Files the VAT return with the Belastingdienst and stores the filed copy for the starter."}]}, {"step": "Close the first year with salary and business combined", "description": "Provide the annual salary statement from the job and confirm the hours worked; the bookkeeper prepares the annual accounts and the income tax return that combines both, applies startersaftrek and zelfstandigenaftrek if the criterion is met, and explains the result.", "streamsNeeded": [{"id": "close-the-year-and-file-income-tax", "name": "Close the Year and File Income Tax", "howItSupports": "Prepares the annual accounts and the first income tax return with starter deductions applied and files it."}]}, {"step": "Understand the first assessment", "description": "Compare the assessment with what the dashboard advised to reserve, ask the bookkeeper about the difference and decide whether a preliminary assessment for the next year makes sense.", "streamsNeeded": [{"id": "monitor-your-finances-on-the-dashboard", "name": "Monitor Your Finances on the Dashboard", "howItSupports": "Shows the reservation and profit history against which the first assessment is understood."}, {"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Answers assessment questions and arranges a preliminary assessment where useful."}]}]}, {"id": "jtbd-strt-3", "name": "Learn what I can deduct and what I must reserve as a starter", "whatItIs": "Understand, in plain language and with the starter's own numbers, which costs are deductible, how startersaftrek, zelfstandigenaftrek and mkb-winstvrijstelling work, what the hours criterion requires next to a job, and how much of every invoice to set aside for VAT and income tax. The job is financial literacy for the first years, delivered by the bookkeeper and the app rather than by a course.", "outcome": "The starter can explain what to reserve from an invoice and which costs count, keeps hours evidence from the first month, and the first two income tax returns include every starter deduction the starter is entitled to, with no reservation shortfall.", "steps": [{"step": "Get the starter briefing", "description": "In the first weeks, read the starter content and 'Keep up' updates and have the bookkeeper walk through deductions, the hours criterion (including administration and acquisition hours) and the difference between VAT and income tax reservation.", "streamsNeeded": [{"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Delivers the starter briefing from the advice knowledge base and answers follow-up questions."}, {"id": "grow-through-partners-and-referrals", "name": "Grow Through Partners and Referrals", "howItSupports": "Provides starter content, client stories and 'Keep up' sessions that make the briefing concrete."}]}, {"step": "See the reservation on every invoice", "description": "Watch the dashboard update the VAT to pay and the income tax reservation as invoices and receipts come in, and transfer the reserved share to a savings account each month.", "streamsNeeded": [{"id": "monitor-your-finances-on-the-dashboard", "name": "Monitor Your Finances on the Dashboard", "howItSupports": "Shows the VAT and income tax reservation in real time so the starter learns the rhythm of setting money aside."}]}, {"step": "Keep hours and cost evidence from the first month", "description": "Log business hours simply, keep receipts for a laptop, phone, travel and training via Scan & Herken, and ask the bookkeeper about mixed-use items before buying.", "streamsNeeded": [{"id": "capture-receipts-and-expenses", "name": "Capture Receipts and Expenses", "howItSupports": "Stores receipts and purchase invoices as evidence for deductions from day one."}, {"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Answers 'is this deductible' questions before the purchase rather than after."}]}, {"step": "Review deductions at year-end and plan the next year", "description": "Go through the draft return with the bookkeeper: which deductions were applied, whether the hours criterion was met next to the job, and what changes next year (zelfstandigenaftrek EUR 900 in 2027, KOR turnover, moving to full-time).", "streamsNeeded": [{"id": "close-the-year-and-file-income-tax", "name": "Close the Year and File Income Tax", "howItSupports": "Applies startersaftrek, zelfstandigenaftrek and mkb-winstvrijstelling and shows their effect in the draft return."}, {"id": "manage-subscription-billing-and-plans", "name": "Manage Subscription Billing and Plans", "howItSupports": "Adjusts the plan when the starter grows: a partner return, a VOF with a co-founder, or later a BV through Founders."}]}]}], "customerJourneyStories": [{"id": "journey-strt-1", "name": "From a KVK registration next to a job to a first year done right", "linkedJobIds": ["jtbd-strt-1", "jtbd-strt-2"], "summary": "A physiotherapist in Utrecht who starts freelancing two days a week next to her employed job registers at the KVK, picks Kees de Boekhouder's Starters package after comparing it with a free-for-starters software tool, and stays after a first year in which every filing was right first time.", "stages": [{"stage": "Trigger", "narrative": "After registering an eenmanszaak at the KVK she receives a letter from the Belastingdienst with a VAT number and a first quarterly return date, plus a promotional e-mail from a software tool offering fifteen months free. She has no idea whether the KOR applies to her or what to do with her private bank account."}, {"stage": "Discovery", "narrative": "A colleague who freelances mentions that a real person at Kees de Boekhouder does her VAT returns and answers questions, and the Kees blog on entrepreneurship next to a job comes up in her search. The site offers a free intro via Google Meet and a Starters package at EUR 70 per month."}, {"stage": "Evaluation", "narrative": "She compares the free software tool with Kees: the tool is free but she would file herself and learn the rules; Kees costs EUR 840 per year, includes the income tax return and a bookkeeper who has seen a hundred starters. The intro call explains the KOR trade-off, the hours criterion next to a job and the first-year commitment, and she decides that the first year is the year to get it right."}, {"stage": "Trial", "narrative": "In two weeks she opens a Knab business account and connects it, adds her trading name, sends her first invoice from the app and photographs the first receipts during the upload coaching. The bookkeeper reviews the first quarter, moves two private expenses out, and files the first VAT return a week early."}, {"stage": "Engagement", "narrative": "The app becomes a Friday habit: receipts, invoices, two bank matches to confirm, a look at the reservation on the dashboard. At year-end she sends her salary statement and hours overview, and the bookkeeper files an income tax return that combines job and business with startersaftrek applied."}, {"stage": "Retention", "narrative": "The assessment matches the dashboard's reservation within a small margin. After the first fiscal year she keeps the subscription, drops to one job day when the practice grows, asks the bookkeeper about the hours criterion again, and refers a fellow physiotherapist who is about to register at the KVK."}]}, {"id": "journey-strt-2", "name": "From a free tool and a fine to a bookkeeper who explains", "linkedJobIds": ["jtbd-strt-3", "jtbd-strt-2"], "summary": "A junior developer who started a webshop and freelance work on a free accounting plan misses his first VAT return, receives a fine, and switches to Kees de Boekhouder through a friend's referral, staying because the reservations, deductions and explanations turn the second year into a calm one.", "stages": [{"stage": "Trigger", "narrative": "The first quarterly return date passes unnoticed while he sets up the webshop; a letter announces a fine and an estimated assessment. The free tool sent no reminder and its help pages could not tell him whether his equipment purchase was deductible under the KOR he had applied for with the Belastingdienst when he registered."}, {"stage": "Discovery", "narrative": "A friend who freelances shows him the Kees mobile app and mentions that her bookkeeper flagged a deadline before she noticed it. The Kees website's FAQ on switching, the client stories and the Rotterdam office address give him the sense of a real company rather than another app."}, {"stage": "Evaluation", "narrative": "He weighs the extra cost against the fine he just paid and the deductions he probably missed, checks that switching mid-year is possible and that the previous quarter can be corrected, and asks in the intro call whether he can still leave the KOR. The bookkeeper's answers and the fixed monthly invoice convince him."}, {"stage": "Trial", "narrative": "The switch service imports what exists, the bookkeeper corrects the missed return and files an objection to the estimated assessment, and he connects his bunq account. The first receipts are photographed and the dashboard shows what to reserve from the webshop sales."}, {"stage": "Engagement", "narrative": "He uses the reservation on the dashboard every month, keeps hours evidence, and asks before buying a camera whether it is deductible. Reminders reach him before each quarter and the first full income tax return with Kees applies zelfstandigenaftrek and startersaftrek."}, {"stage": "Retention", "narrative": "When the webshop grows he asks about payroll for a part-time helper and about a VOF with a friend, and the same bookkeeper stays with him. He records a client story for the Kees network and tells the developer community that the fine cost more than a year of Kees."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-strt-top", "name": "Time to first compliant filing", "description": "Days from the starter's firs
