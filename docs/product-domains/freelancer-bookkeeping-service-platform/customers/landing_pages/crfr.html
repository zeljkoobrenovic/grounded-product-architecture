ce.", "unit": "hours", "currentValue": "28", "targetValue": "20", "icon": "kpi-bvdg-bo-bvdg-b2-c2.png", "children": [{"id": "bo-bvdg-b2-c2-l1", "name": "Corporate tax returns filed first time right", "description": "Share of corporate tax returns that pass the four-eyes check and are accepted by the Belastingdienst without a corrected return.", "unit": "%", "currentValue": "88", "targetValue": "97", "icon": "kpi-bvdg-bo-bvdg-b2-c2-l1.png", "children": []}, {"id": "bo-bvdg-b2-c2-l2", "name": "BVs served per Founders bookkeeper", "description": "Average number of BV entities in the portfolio of one full-time Founders bookkeeper.", "unit": "entities per bookkeeper", "currentValue": "45", "targetValue": "65", "icon": "kpi-bvdg-bo-bvdg-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make Founders, the sister company of Kees de Boekhouder, the fixed-fee home for the owner-managed BV: every statutory filing done on time by a bookkeeper who knows the DGA, salary and dividend decided with the numbers in view, holding and operating company kept in step on one platform, and a path from freelancer to company owner that never requires changing bookkeeper.", "timeHorizons": {"year1": {"focus": "Bring the BV proposition onto the same platform as the sole-proprietor proposition: statutory annual accounts, KVK deposit and corporate tax return as tracked filings in the workspace and the dashboard, DGA payroll on the same monthly invoice, and a guided eenmanszaak-to-BV transition from Kees to Founders.", "productTheme": "Every corporate filing on time at a fixed fee", "customerKPI": {"northStar": "Corporate filings completed on time", "supporting": ["Annual accounts delivery lead time", "Total cost of compliance"]}, "businessKPI": {"northStar": "Annual recurring revenue from Founders BV subscriptions", "revenueStreams": ["Founders plans at EUR 1,750 per holding BV and EUR 2,450 per operating company per year", "DGA and employee payroll at EUR 17.50 per payslip", "Private and partner income tax returns and bank connections as add-ons"], "supporting": ["New BV subscriptions per year", "Eenmanszaak-to-BV conversions retained per year"]}, "milestones": ["Add corporate tax, statutory annual accounts and KVK deposit as deadline-tracked filings per BV in the filing calendar and the client dashboard", "Deliver the guided eenmanszaak-to-BV transition that closes the sole proprietorship in Kees and opens the BVs in Founders with history and bank connections carried over", "Publish Founders client stories and a BV pricing page that shows the total cost of compliance for a holding-plus-operating-company structure"]}, "year3": {"focus": "Serve the DGA's whole structure as one client: intercompany and current-account reconciliation, customary-wage and dividend planning with the balance-sheet test built in, the expected corporate tax against the provisional assessment on the dashboard, and multi-entity structures with additional operating companies, and e-invoicing and Peppol readiness ahead of EU ViDA.", "productTheme": "The DGA's structure managed as one client", "customerKPI": {"northStar": "Corporate filings completed on time", "supporting": ["DGA salary and dividend decisions made before year-end", "Provisional corporate tax assessment accuracy"]}, "businessKPI": {"northStar": "Annual recurring revenue from Founders BV subscriptions", "revenueStreams": ["Holding-plus-operating-company subscriptions and additional entities", "Payroll and advice-led add-ons at higher attach rates", "Switches from traditional accountancy firms to a fixed fee"], "supporting": ["Average subscription value per BV client", "Holding plus operating company pairs"]}, "milestones": ["Reconcile intercompany balances and the DGA current account automatically every quarter from the matched bank transactions of all entities", "Ship a salary-and-dividend planner that applies the customary-wage rules, the balance-sheet test and box 2 rates to the BV's live figures", "Show expected corporate tax against the provisional assessment per BV on the dashboard and let the DGA request an adjustment with one click"]}, "year5": {"focus": "Continuous, AI-assisted compliance for owner-managed companies with a human guarantee: draft annual accounts and corporate tax returns generated after the fourth quarter and reviewed by the bookkeeper, proactive advice on remuneration, pension and succession from the structure's own figures, and selective expansion into adjacent owner-managed small-company segments.", "productTheme": "Continuous BV compliance with proactive DGA advice", "customerKPI": {"northStar": "Corporate filings completed on time", "supporting": ["DGA hours spent on administration per month", "Bookkeeper hours per BV per year"]}, "businessKPI": {"northStar": "Annual recurring revenue from Founders BV subscriptions", "revenueStreams": ["Founders as the national fixed-fee brand for the owner-managed BV", "Advice-led services on remuneration, pension and succession", "Multi-entity and adjacent small-company segments"], "supporting": ["BV annual churn rate", "Net promoter score of BV clients"]}, "milestones": ["Generate draft statutory annual accounts and the corporate tax return automatically after the fourth quarter, with the Founders bookkeeper reviewing a diff before adoption and filing", "Deliver proactive, personal advice on DGA salary, dividend, pension in the holding and excessive-borrowing limits, triggered by the structure's own figures", "Make e-invoicing and Peppol standard for operating companies ahead of EU ViDA so BV invoicing and VAT stay compliant without DGA effort"]}}}, "domain": "Partnerships and Companies"}, {"id": "bkpr", "name": "Personal Bookkeeper", "description": "Works in one of the three Kees de Boekhouder offices in Amsterdam, Rotterdam or Utrecht and is one of the roughly 40 bookkeepers who make up about 40 percent of the company's ~100 staff. Was not hired from an accountancy firm but trained internally on the Kees method, the platform and the fiscal rules for freelancers, and carries a portfolio of a few hundred sole proprietors, starters and VOF partners as their named, personal bookkeeper. Every day the bookkeeper works the review queue of what clients submitted through the app: receipts recognised by Scan & Herken, quotes and invoices, and bank transactions synchronised through the Ponto connection, corrects categories and VAT treatment, chases missing documents, files the quarterly btw-aangifte with the Belastingdienst before the last day of the month after the quarter, prepares the annual accounts at year end and files the income tax return with zelfstandigenaftrek, startersaftrek and mkb-winstvrijstelling applied, plus partner returns on request. Answers client questions by e-mail and phone, with a video call or an in-person meeting at the office on request, and proactively tells clients about deadlines and rule changes such as the Wet DBA enforcement and the shrinking zelfstandigenaftrek. Is backed up by colleagues during holidays and peaks, works under four-eyes quality checks, and is judged on clients served, on-time filing, first-time-right quality and the satisfaction of the entrepreneurs in the portfolio.", "icon": "bkpr.png", "careAbout": ["A review queue that shows exactly which client bookings, unmatched transactions and missing documents need attention before each quarterly deadline, so nothing is discovered on the last day of the month", "Receipt recognition and bank matching that are right often enough that most bookings only need a glance, leaving bookkeeper time for the exceptions and the client conversation", "Clients who upload their receipts and invoices during the quarter rather than in one bundle the week before the VAT deadline", "Fiscal rules, deductions and standard answers that are maintained centrally in the knowledge base, so every bookkeeper in Amsterdam, Rotterdam and Utrecht gives the same answer to the same question", "Four-eyes checks and QA findings that teach rather than punish, because the bookkeeper carries the fiscal responsibility for a few hundred entrepreneurs without a formal accountancy title", "Colleagues who can take over a portfolio at a moment's notice with the complete client file, so holidays and illness do not become missed filings"], "winsThem": ["A bookkeeper client file and review queue that puts every client, open booking, unmatched transaction, question and deadline of the portfolio in one prioritised list per day", "Scan & Herken and the automatic bank match that book the routine correctly, so a standard sole proprietor's quarter is reviewed by exception in minutes", "A filing calendar that knows every client's VAT and income tax deadlines and orchestrates the quarter, from reminder to filed return, without spreadsheets", "An advice knowledge base with the current rules on zelfstandigenaftrek, startersaftrek, KOR, the hours criterion, Wet DBA and buying a house as a freelancer, so an answer is a lookup instead of a research task", "Internal training, workload planning and backup coverage that let a bookkeeper grow from a first small portfolio to a full one without burning out at quarter end"], "theirFear": ["Missing a quarterly VAT deadline for a client because a bundle of receipts arrived on the last day and the queue had no way to show what was still open", "Giving a client wrong advice about a deduction or the Wet DBA that leads to a correction, a fine or a surprise tax bill, and losing the trust of an entrepreneur who chose Kees for exactly that peace of mind", "Being measured only on clients per bookkeeper and losing the personal relationship that makes clients stay and recommend Kees to other freelancers"], "jobsToBeDone": [{"id": "jtbd-bkpr-1", "name": "Review every client administration and file on time with first-time-right quality", "whatItIs": "Run the quarterly and yearly cycle for every client in the portfolio: review the bookings that came in through the app, resolve unmatched bank transactions and missing documents with the client, prepare and file the VAT return before the deadline, close the year with annual accounts and the income tax return with every deduction applied, and pass the four-eyes check without rework.", "outcome": "Every client in the portfolio has a checked administration, a VAT return filed before the last day of the month after the quarter and an income tax return filed in the season, with no corrective filings caused by Kees, no surprise tax bill for the client, and QA findings that fall quarter over quarter.", "steps": [{"step": "Work the review queue of submitted bookings", "description": "Open the portfolio's review queue each morning and go through the bookings that clients submitted since the last check: receipts recognised by Scan & Herken with their supplier, amount and VAT, purchase bookings, sales invoices and credit notes. Confirm the category and VAT treatment, correct what recognition got wrong (private costs, reverse-charged EU services, investments above the depreciation threshold) and add a note for the client where a booking needs explanation.", "streamsNeeded": [{"id": "review-administration-and-file-vat-returns", "name": "Review Administration and File VAT Returns", "howItSupports": "Provides the bookkeeper's review queue per client with every submitted booking, its recognition confidence and the checks still open before the quarter can be filed."}, {"id": "capture-receipts-and-expenses", "name": "Capture Receipts and Expenses", "howItSupports": "Delivers the recognised, categorised expense bookings with VAT that the bookkeeper reviews, so routine receipts arrive ready to approve."}]}, {"step": "Resolve unmatched bank transactions and missing documents with the client", "description": "Go through the transactions the automatic matching could not tie to a booking, match them by hand or book them directly, and send the client a short list of what is missing: the receipt for a transaction, the invoice behind a payment, the explanation of a private withdrawal. Keep the list in the client file so the client sees it in the app and the colleague covering the portfolio sees what was asked.", "streamsNeeded": [{"id": "sync-and-match-bank-transactions", "name": "Sync and Match Bank Transactions", "howItSupports": "Shows the transactions synced four times a day through Ponto that are still unmatched, with manual matching and direct booking for the remainder."}, {"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Carries the missing-document request to the client by e-mail or app message and logs the answer on the client file."}]}, {"step": "Prepare and file the quarterly VAT return before the deadline", "description": "Once the quarter's bookings are reviewed, check the VAT return the engine prepares, including reverse-charged services, KOR status and the small differences that come from rounding or late corrections, look at the VAT to pay against the dashboard the client sees, and file with the Belastingdienst through the filing gateway well before the last day of the month after the quarter, then confirm to the client what to pay and by when.", "streamsNeeded": [{"id": "review-administration-and-file-vat-returns", "name": "Review Administration and File VAT Returns", "howItSupports": "Prepares the btw-aangifte from the reviewed bookings, shows the deadline per client and files it through the Belastingdienst channel with a stored copy."}]}, {"step": "Close the year, apply deductions and file the income tax return", "description": "After the fourth quarter, run the year-end close for each client: depreciation, private use, the hours criterion, zelfstandigenaftrek, startersaftrek where applicable, mkb-winstvrijstelling, and for VOF clients the profit split per partner. Produce the annual accounts, discuss the outcome and the tax reservation with the client, file the income tax return and the partner's return where ordered, and hand BV questions to Founders.", "streamsNeeded": [{"id": "close-the-year-and-file-income-tax", "name": "Close the Year and File Income Tax", "howItSupports": "Runs the year-end close, applies the deductions and produces annual accounts and the income tax return ready for filing and client review."}, {"id": "serve-partnerships-and-companies", "name": "Serve Partnerships and Companies", "howItSupports": "Handles the VOF profit split and partner returns, and routes clients who moved to a BV to the Founders corporate tax workflow."}]}, {"step": "Pass the four-eyes check and learn from QA findings", "description": "Submit filings above the QA thresholds, and a sample of the rest, to a colleague or fiscal specialist for a four-eyes check before they go out; resolve the findings, record the root cause (recognition error, client data, rule misread) and feed recurring issues back into the training and the knowledge base so the same mistake is not made across three offices.", "streamsNeeded": [{"id": "plan-bookkeeper-capacity-and-quality", "name": "Plan Bookkeeper Capacity and Quality", "howItSupports": "Provides the four-eyes QA checks, the finding categories and the first-time-right measurement per bookkeeper and office."}]}]}, {"id": "jtbd-bkpr-2", "name": "Serve more clients per week without losing the personal relationship", "whatItIs": "Carry a growing portfolio as Kees moves from 10,000 toward 20,000 clients while remaining the named, reachable bookkeeper each entrepreneur knows: start each day from a prioritised portfolio view, let recognition and matching do the routine work, coach clients into complete and timely uploads, answer questions in efficient batches by e-mail and phone with video on request, and hand over or take over portfolios smoothly with colleagues as backup.", "outcome": "The bookkeeper serves a larger portfolio within normal hours, clients still get an answer from their own bookkeeper within a day and see them proactively before deadlines, quarter-end overtime disappears, and client satisfaction and retention on the portfolio stay at the level that makes clients recommend Kees.", "steps": [{"step": "Start the day from a prioritised portfolio view", "description": "Open the workspace and see the portfolio ranked by urgency: clients with a filing due this month and open items, clients who have uploaded nothing for six weeks, new clients in their first quarter, open questions older than a day, and QA findings to resolve. Plan the day around that list instead of around the inbox.", "streamsNeeded": [{"id": "review-administration-and-file-vat-returns", "name": "Review Administration and File VAT Returns", "howItSupports": "Supplies the per-client status of bookings, open items and filing readiness that the portfolio view ranks."}, {"id": "plan-bookkeeper-capacity-and-quality", "name": "Plan Bookkeeper Capacity and Quality", "howItSupports": "Shows the bookkeeper's allocated clients, the expected workload for the coming filing month and where a colleague's backup is planned."}]}, {"step": "Let recognition and matching do the routine work", "description": "Trust the Scan & Herken recognition and the automatic bank match for the standard cases and review them by exception: approve batches of low-risk bookings in one pass, look only at low-confidence recognitions, new suppliers, high amounts and anything touching investments or private use, and use booking rules so a recurring supplier is booked the same way every month without a click.", "streamsNeeded": [{"id": "capture-receipts-and-expenses", "name": "Capture Receipts and Expenses", "howItSupports": "Recognises supplier, amount, date and VAT from photographed or uploaded receipts and proposes the booking with a confidence level."}, {"id": "sync-and-match-bank-transactions", "name": "Sync and Match Bank Transactions", "howItSupports": "Matches synced transactions automatically against bookings and invoices, leaving only the exceptions for the bookkeeper."}]}, {"step": "Coach clients toward complete, timely uploads", "description": "Teach each client the habit that saves both of them time: photograph the receipt on the spot, send invoices from the app, connect the bank, and look at the dashboard once a month. Use the dashboard and reminders to show the client what is missing and why the VAT figure will change, and intervene personally with clients who bundle everything in the last week before the deadline.", "streamsNeeded": [{"id": "monitor-your-finances-on-the-dashboard", "name": "Monitor Your Finances on the Dashboard", "howItSupports": "Gives the client the real-time view of revenue, costs, profit and VAT to pay that makes the value of timely uploads visible."}, {"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Carries the bookkeeper's coaching messages and proactive reminders to the client through the same channel as questions and answers."}]}, {"step": "Handle questions in batches by e-mail and phone, with video on request", "description": "Answer the day's client questions from the client file in a few blocks rather than one at a time: standard questions from the knowledge base, questions about the client's own numbers from the dashboard, and the ones that need a conversation by phone, a Google Meet or a visit to the office. Log every answer on the file so the colleague covering next week sees what was said.", "streamsNeeded": [{"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Provides the client messaging, e-mail and call log per client and the knowledge base answers the bookkeeper reuses."}]}, {"step": "Hand over and take over portfolios with colleagues as backup", "description": "Before a holiday, or when the office rebalances portfolios as the client base grows, hand a portfolio to a colleague with the complete client file, open items and pending questions, and take over another one the same way; onboard newly assigned clients with a personal introduction so the client never feels passed around.", "streamsNeeded": [{"id": "plan-bookkeeper-capacity-and-quality", "name": "Plan Bookkeeper Capacity and Quality", "howItSupports": "Plans backup coverage and portfolio reallocation across the three offices and keeps the complete client file with the portfolio."}, {"id": "start-and-onboard-a-new-client", "name": "Start and Onboard a New Client", "howItSupports": "Assigns newly onboarded clients to the bookkeeper with the onboarding notes and the first-upload coaching already done."}]}]}, {"id": "jtbd-bkpr-3", "name": "Give correct, consistent tax advice backed by the knowledge base", "whatItIs": "Answer the questions freelancers ask their personal bookkeeper all year (what can I deduct, how much should I reserve, am I within the KOR, do I meet the hours criterion, can I buy a house, should I become a BV, how does the Wet DBA affect me) correctly and the same way in every office, from the client's real numbers and the maintained knowledge base, proactively update clients on rule changes and deadlines, and escalate the complex cases to fiscal specialists or Founders.", "outcome": "Clients get a correct, understandable answer from their own bookkeeper within a day for standard questions and a scheduled conversation for the complex ones, no client is surprised by a rule change the bookkeeper knew about, and advice given across Amsterdam, Rotterdam and Utrecht is consistent enough that QA finds no contradictory answers.", "steps": [{"step": "Look up the rule before answering", "description": "Check the knowledge base for the current position on the question (zelfstandigenaftrek at EUR 1,200 in 2026 and EUR 900 in 2027, startersaftrek EUR 2,123, KOR up to EUR 20,000 turnover, hours criterion, Wet DBA model agreements) and the standard answer text, instead of answering from memory or from last year's rule.", "streamsNeeded": [{"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Provides the advice knowledge base with tax rule articles and standard answers maintained by the fiscal specialists."}]}, {"step": "Answer from the client's actual numbers", "description": "Combine the rule with the client's own administration: the profit to date, the VAT position, the hours and the investments on the dashboard, and the last income tax return, so the answer to 'what should I reserve' or 'can I afford this investment' is a number, not a generic explanation.", "streamsNeeded": [{"id": "monitor-your-finances-on-the-dashboard", "name": "Monitor Your Finances on the Dashboard", "howItSupports": "Shows the client's revenue, costs, profit, VAT to pay and tax reservation in real time as the basis for a concrete answer."}, {"id": "close-the-year-and-file-income-tax", "name": "Close the Year and File Income Tax", "howItSupports": "Gives access to last year's annual accounts and income tax return and the deductions applied, as context for advice on the current year."}]}, {"step": "Proactively update clients on deadlines and rule changes", "description": "When a rule changes or a deadline approaches, send the affected clients in the portfolio a personal update: the VAT deadline and the amount to expect, the lower zelfstandigenaftrek next year, what the Wet DBA enforcement means for a client with one main customer, or the KOR threshold for a small starter. Target the update at the clients it concerns rather than broadcasting to all.", "streamsNeeded": [{"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Delivers targeted proactive updates on deadlines and rule changes to the clients they concern, logged on the client file."}, {"id": "review-administration-and-file-vat-returns", "name": "Review Administration and File VAT Returns", "howItSupports": "Identifies which clients have a filing due and what their VAT position is, so the update carries the client's own figures."}]}, {"step": "Escalate complex cases to fiscal specialists and Founders", "description": "Route questions beyond the standard scope, such as a move from eenmanszaak to BV, a DGA salary, a holding structure, buying a house with irregular income, or a Wet DBA dispute, to the fiscal specialists or the Founders team, schedule the conversation for the client, and record the outcome in the knowledge base if it is a question that will come back.", "streamsNeeded": [{"id": "serve-partnerships-and-companies", "name": "Serve Partnerships and Companies", "howItSupports": "Hands BV, holding and DGA questions to the Founders workflow with the client's administration attached."}, {"id": "plan-bookkeeper-capacity-and-quality", "name": "Plan Bookkeeper Capacity and Quality", "howItSupports": "Provides the fiscal specialists, internal training and knowledge base maintenance that turn one bookkeeper's complex case into a standard answer for all."}]}]}], "customerJourneyStories": [{"id": "journey-bkpr-1", "name": "Joining Kees as an internally trained bookkeeper", "linkedJobIds": ["jtbd-bkpr-1", "jtbd-bkpr-3"], "summary": "A finance graduate without an accountancy title joins Kees de Boekhouder as a bookkeeper in the Rotterdam office, is trained internally on the platform and the Kees method, doubts whether he can carry fiscal responsibility for hundreds of freelancers, and grows within a year into a full portfolio with QA findings below the office average.", "stages": [{"stage": "Trigger", "narrative": "After two years of administrative work at a mid-sized accountancy firm, mostly typing up shoeboxes for the same partner, the bookkeeper applies to a Kees vacancy that promises a personal client portfolio, internal training and a job in a company of about 100 people that serves more than 10,000 entrepreneurs. What triggers the move is the promise of being the bookkeeper the client actually talks to, instead of a back-office data entry clerk."}, {"stage": "Discovery", "narrative": "In the first weeks the internal training programme puts him on the platform every day: he learns the bookkeeper workspace, the review queue, Scan & Herken and the bank connection from the client side and the bookkeeper side, and shadows a senior colleague in Rotterdam through a live quarter. He sees how the filing calendar drives the quarter and that answers to client questions come from a maintained knowledge base rather than from memory."}, {"stage": "Evaluation", "narrative": "He wonders whether a portfolio of a few hundred freelancers can be served correctly without a formal accountancy background. What convinces him is the safety net he sees in practice: the four-eyes check on filings, fiscal specialists a message away, the knowledge base with the standard answers, and colleagues who take over portfolios during holidays. He tests it on a client with a Wet DBA question and a house purchase and gets a reviewed, consistent answer within the day."}, {"stage": "Trial", "narrative": "His first own portfolio is a few dozen starters and creative freelancers in their first quarter, with a senior reviewing every filing. He works the queue daily, files the VAT returns a week before the deadline, and learns from the QA findings on his first income tax returns, most of which concern the hours criterion and private use, which the training then covers again for the whole office."}, {"stage": "Engagement", "narrative": "Within a year he carries a full portfolio: mornings in the prioritised queue, afternoons for questions by e-mail and phone with the occasional Google Meet or office visit, quarter ends without overtime because his clients have learned to upload during the quarter. He hands his portfolio to a colleague for three weeks of holiday with nothing more than the client file and a short note."}, {"stage": "Retention", "narrative": "He stays because the work is the client relationship rather than data entry: his clients recommend Kees to other freelancers by name, he trains the next intake of bookkeepers on the review queue, and he contributes standard answers to the knowledge base from the questions his creative clients ask about grants and irregular income."}]}, {"id": "journey-bkpr-2", "name": "Adopting the bookkeeper workspace as the place the quarter is run", "linkedJobIds": ["jtbd-bkpr-1", "jtbd-bkpr-2"], "summary": "The bookkeeping teams in the three offices move from mailboxes, shared spreadsheets and personal to-do lists to the bookkeeper workspace with its review queue, filing calendar and workload planning, after a quarter end in which a growing client base almost led to missed VAT filings, and end up running larger portfolios with first-time-right quality visible per bookkeeper.", "stages": [{"stage": "Trigger", "narrative": "In the last week before a VAT deadline the Amsterdam office discovers that a bookkeeper on sick leave has a portfolio whose open items live in her mailbox and a personal spreadsheet, and colleagues have to reconstruct which clients still need a return. The client base has grown past what an experienced bookkeeper can keep in her head, and the team leads ask for a system that shows every open item per client."}, {"stage": "Discovery", "narrative": "The product team, professionalised under Vortex, demonstrates the bookkeeper workspace built for exactly this: a client file and review queue per bookkeeper, a filing calendar that orchestrates every client's deadlines, workload planning per office with backup coverage, and QA findings recorded on the filing instead of in an e-mail. The bookkeepers recognise their own way of working, with the spreadsheets gone."}, {"stage": "Evaluation", "narrative": "The bookkeepers debate whether a workspace that counts clients per bookkeeper and review turnaround time will be used to push portfolios ever larger at the cost of the personal relationship. Team leads agree that the metrics will be read together with client satisfaction and first-time-right, that workload planning will respect the office's capacity, and that QA findings feed training rather than appraisals, and the concern subsides."}, {"stage": "Trial", "narrative": "The Utrecht office runs one quarter in the workspace while Amsterdam and Rotterdam continue as before. Utrecht files every VAT return before its internal deadline, the team lead sees for the first time which clients upload late and which bookkeepers are overloaded, and a holiday handover takes ten minutes because the client file is complete."}, {"stage": "Engagement", "narrative": "All three offices move into the workspace before the next quarter. Bookkeepers start the day from the prioritised queue, batch client questions in the afternoon, and approve routine bookings by exception; team leads plan capacity for the filing month from the calendar, and fiscal specialists route recurring QA findings into the knowledge base and training."}, {"stage": "Retention", "narrative": "By the income tax season the workspace is where the offices plan capacity toward 20,000 clients: portfolios grow without quarter-end overtime, first-time-right rates are compared across offices, and no bookkeeper wants the spreadsheets back because the queue is what lets them go on holiday."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-bkpr-top", "name": "Clients served per bookkeeper", "description": "Number of active clients a personal bookkeeper serves with a checked administration, on-time filings and answered questions, averaged across the three offices. Modeled seed value derived from ~10,000 clients and about 40 bookkeepers among ~100 staff; not an official Kees de Boekhouder figure.", "unit": "clients per bookkeeper", "currentValue": "230", "targetValue": "300", "link": "https://dashboard.example.com/freelancer-bookkeeping-service-platform/customers/bkpr/kpis/co-bkpr-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-bkpr-co-bkpr-top.png"}, "branches": [{"id": "co-bkpr-b1", "name": "Review throughput and speed", "description": "How quickly submitted bookings, unmatched transactions and client questions move through the bookkeeper's queue, and how much of the routine the platform absorbs.", "currentValue": "68", "icon": "kpi-bkpr-co-bkpr-b1.png", "children": [{"id": "co-bkpr-b1-c1", "name": "Review turnaround time", "description": "Working days from a client submitting a booking or bank transaction to the bookkeeper having reviewed it, averaged over the quarter.", "unit": "working days", "currentValue": "4", "targetValue": "2", "icon": "kpi-bkpr-co-bkpr-b1-c1.png", "children": [{"id": "co-bkpr-b1-c1-l1", "name": "Bookings approved without bookkeeper correction", "description": "Share of submitted bookings the bookkeeper approves as recognised and matched, without changing category, amount or VAT.", "unit": "%", "currentValue": "55", "targetValue": "75", "icon": "kpi-bkpr-co-bkpr-b1-c1-l1.png", "children": []}, {"id": "co-bkpr-b1-c1-l2", "name": "Open review items per client at quarter end", "description": "Average number of bookings, transactions and missing documents still open per client on the day the quarter closes.", "unit": "items", "currentValue": "6", "targetValue": "3", "icon": "kpi-bkpr-co-bkpr-b1-c1-l2.png", "children": []}]}, {"id": "co-bkpr-b1-c2", "name": "Bookkeeper hours per client per quarter", "description": "Bookkeeper hours logged per client per quarter for review, matching, VAT filing and questions, excluding year-end work.", "unit": "hours", "currentValue": "1.6", "targetValue": "1.1", "icon": "kpi-bkpr-co-bkpr-b1-c2.png", "children": [{"id": "co-bkpr-b1-c2-l1", "name": "Automatic bank match rate", "description": "Share of synced bank transactions matched automatically to a booking or invoice without manual work.", "unit": "%", "currentValue": "78", "targetValue": "90", "icon": "kpi-bkpr-co-bkpr-b1-c2-l1.png", "children": []}, {"id": "co-bkpr-b1-c2-l2", "name": "Client questions handled per hour", " per bookkeeper", "supporting": ["Review turnaround time", "Filing first-time-right rate"]}, "businessKPI": {"northStar": "Bookkeeping gross margin", "revenueStreams": ["Fixed yearly subscriptions for sole proprietors, starters and VOFs", "Partner income tax returns at EUR 125", "Payroll per payslip"], "supporting": ["Bookkeeping cost per client per year", "Bookkeeper utilisation"]}, "milestones": ["Run all three offices from the bookkeeper workspace with a prioritised review queue and the filing calendar for every client", "Raise the automatic bank match rate and the share of bookings approved without correction so routine quarters are reviewed by exception", "Record every four-eyes finding on the filing and route recurring causes into training and the knowledge base each quarter"]}, "year3": {"focus": "Plan bookkeeper capacity as a product: allocation, backup and QA driven by client volume per office, near-fully automated administration for standard sole proprietors with human review by exception, and consistent advice from one knowledge base across all offices and Founders.", "productTheme": "Capacity planning and automated standard administrations", "customerKPI": {"northStar": "Clients served per bookkeeper", "supporting": ["Bookkeeper hours per client per quarter", "Client satisfaction with bookkeeper"]}, "businessKPI": {"northStar": "Bookkeeping gross margin", "revenueStreams": ["Fixed yearly subscriptions for sole proprietors, starters and VOFs", "BV packages through Founders", "Add-ons: bank connection, partner returns, payroll"], "supporting": ["Client retention on bookkeeper portfolios", "Weeks from hire to full portfolio"]}, "milestones": ["Allocate clients and backup coverage per office from forecast volume and bookkeeper capacity, with portfolio rebalancing as a routine rather than a crisis", "Review standard sole-proprietor quarters fully by exception, with the engine preparing VAT returns that bookkeepers only confirm", "Serve BV transitions and DGA questions from the same client file through the Founders workflow so no client changes bookkeeper when changing legal form"]}, "year5": {"focus": "Let AI-assisted booking, drafting of returns and advice suggestions work under bookkeeper supervision, so a bookkeeper oversees continuously updated administrations for far more clients and the human guarantee becomes the differentiator against software-only competitors.", "productTheme": "Bookkeeper-supervised AI bookkeeping", "customerKPI": {"northStar": "Clients served per bookkeeper", "supporting": ["Bookings approved without bookkeeper correction", "Question response time"]}, "businessKPI": {"northStar": "Bookkeeping gross margin", "revenueStreams": ["Fixed yearly subscriptions across legal forms", "Proactive advice and financial-planning services", "Payroll and partner-return add-ons"], "supporting": ["Bookkeeper cost share of subscription revenue", "Bookkeeper retention"]}, "milestones": ["Deploy booking and return-drafting agents that prepare VAT and income tax filings for bookkeeper approval on every standard client", "Offer real-time tax position and reservation advice drafted by the platform and confirmed by the personal bookkeeper", "Grow portfolios well beyond today's size while holding client satisfaction and first-time-right at target through supervised automation"]}}}, "domain": "Kees Service Teams"}, {"id": "csux", "name": "Client Success and Sales Executive", "description": "Works in the sales, client success and support team of Kees de Boekhouder, alongside the bookkeepers in Amsterdam, Rotterdam and Utrecht, and is the first and the last person a client talks to. Picks up the requests that come in through the website and the partner pages, runs the free introduction via Google Meet, and checks the mutual fit: which legal form (eenmanszaak, VOF, BV through Founders), whether the entrepreneur is willing to work in the Kees app rather than in external accounting software, which is not accepted, and what the client expects from a personal bookkeeper. Explains the fixed yearly price per legal form, invoiced monthly, the add-ons (bank connection at EUR 5 per month per account, partner income tax return at EUR 125, payroll at EUR 17.50 per payslip) and the terms: a first full fiscal year, then monthly cancellation with one calendar month notice. Sets up account access, matches the client to a personal bookkeeper by office, expertise and capacity, coaches the first uploads and the bank connection, and runs the switch from a previous bookkeeper with digital copies of the old returns and the client's personal data. Later handles plan changes, an extra VOF partner, payroll, the move from eenmanszaak to BV, bookkeeper reassignments, cancellation requests and win-backs. Is judged on intro-to-active conversion, time to bookkeeper assignment, switch completeness and client churn.", "icon": "csux.png", "careAbout": ["An intro call that starts from what the website request and the partner referral already told her, so the free Google Meet is about the entrepreneur's situation and not about collecting basics", "A clear, honest mutual-fit check: the right legal form and plan, no external accounting software, realistic expectations of the personal bookkeeper, so clients who join stay", "Bookkeeper matching that sees the capacity and expertise of every bookkeeper in every office, so a signed client has a named bookkeeper within a day", "A switch process that collects the digital copies of old returns and personal data completely and once, so the new bookkeeper can continue the VAT and income tax history without gaps", "Every onboarding case, subscription change and cancellation request in one place with its status, instead of in mailboxes, calendars and a billing spreadsheet", "Early warning of clients at risk, such as no uploads for two months, unpaid subscription invoices or a bookkeeper change request, before the cancellation e-mail arrives"], "winsThem": ["Lead capture and intro booking that put the website request, the referral source and the entrepreneur's legal form on her screen before the Google Meet starts", "An onboarding case per client that runs the fit check, plan choice, account access, bookkeeper matching and first-upload coaching as steps with owners and dates", "A switch service that requests, receives and imports digital copies of old returns and personal data with a checklist the bookkeeper trusts", "Subscription plans and billing that apply the price per legal form, add-ons, the first-fiscal-year rule and the one-month notice correctly and automatically", "Risk signals from the app, billing and messaging that tell her which clients to call this week, and a client history that shows every plan change and conversation"], "theirFear": ["A client whose switch left a quarter unfiled because the old returns sat in an inbox and the new bookkeeper thought the previous one had filed it", "Signing an entrepreneur who was never a fit, such as someone who wanted to keep external software or expected unlimited advice hours, and losing them at the end of the first fiscal year with a bad review", "Losing a client to a software-only competitor over a plan change or a bookkeeper mismatch that a timely phone call would have solved"], "jobsToBeDone": [{"id": "jtbd-csux-1", "name": "Convert intro calls into active, well-matched clients fast", "whatItIs": "Take an entrepreneur from a website or partner request through the free Google Meet introduction, the mutual-fit check and the plan choice by legal form to a signed subscription, an account with access, a named personal bookkeeper and a first upload or bank connection, in days rather than weeks, so the client feels served from the first conversation and the bookkeeper receives a client who is ready to work.", "outcome": "A high share of intro calls becomes active clients, every signed client has a named bookkeeper within a working day and has uploaded or connected a bank within the first weeks, plan and legal form are right the first time, and the clients who were not a fit were told so honestly instead of signed and lost later.", "steps": [{"step": "Prepare the Google Meet intro from the website or partner request", "description": "Read the request before the call: legal form, starter or switcher, referral source such as BNO, DuPho, Kunstenbond or Stichting BOK, the sector and the questions the entrepreneur typed, and check which partner benefit applies. Book the free intro at a slot that suits the entrepreneur and send the confirmation with what to have at hand.", "streamsNeeded": [{"id": "start-and-onboard-a-new-client", "name": "Start and Onboard a New Client", "howItSupports": "Captures the website request and books the free Google Meet intro with the entrepreneur's details and questions on the case."}, {"id": "grow-through-partners-and-referrals", "name": "Grow Through Partners and Referrals", "howItSupports": "Shows the partner or client referral behind the request and the member benefit that must be honoured."}]}, {"step": "Run the intro and the mutual-fit check", "description": "In the intro, understand the entrepreneur's business, income pattern and worries, explain how the personal bookkeeper and the app work together, and check the fit both ways: the entrepreneur will work in the Kees app and not in external software, has the right legal form for the plan, and expects what a personal bookkeeper does, which is checking, filing and answering all year, not hourly consultancy. Say no kindly when it does not fit.", "streamsNeeded": [{"id": "start-and-onboard-a-new-client", "name": "Start and Onboard a New Client", "howItSupports": "Guides the intro with the fit-check questions and records the outcome and next step on the onboarding case."}]}, {"step": "Choose the plan by legal form and explain price and terms", "description": "Propose the plan that matches the legal form: eenmanszaak at EUR 840 per year, VOF at EUR 1,140 for two partners plus EUR 100 per extra partner, or a handover to Founders for a holding BV at EUR 1,750 or a werkmaatschappij at EUR 2,450, all ex VAT and invoiced monthly, with the relevant add-ons and the terms of a first full fiscal year and one calendar month notice afterwards. Confirm in writing so there is no surprise on the first invoice.", "streamsNeeded": [{"id": "manage-subscription-billing-and-plans", "name": "Manage Subscription Billing and Plans", "howItSupports": "Applies the plan and price per legal form, the add-ons, the first-year term and monthly invoicing to the new subscription."}, {"id": "serve-partnerships-and-companies", "name": "Serve Partnerships and Companies", "howItSupports": "Routes VOF specifics and BV clients to the partnership and Founders workflows so the plan matches the legal form from day one."}]}, {"step": "Set up the account and match a personal bookkeeper", "description": "Create the client account with the entity, trading names and users, and pick the personal bookkeeper by office proximity, expertise with the sector or legal form, and free capacity in the workload plan; introduce the bookkeeper to the client by name in the welcome message and schedule the first contact.", "streamsNeeded": [{"id": "start-and-onboard-a-new-client", "name": "Start and Onboard a New Client", "howItSupports": "Creates the account access and the bookkeeper assignment as steps of the onboarding case with the client's welcome communication."}, {"id": "plan-bookkeeper-capacity-and-quality", "name": "Plan Bookkeeper Capacity and Quality", "howItSupports": "Shows bookkeeper capacity and expertise per office so the match respects the workload plan."}]}, {"step": "Coach the first uploads and the bank connection until the client is active", "description": "Walk the client through the first receipt photographed with Scan & Herken, the first invoice from a template, and the Ponto bank connection for the business account, and follow up until the first bookings and transactions are in; only then close the onboarding case and hand the client fully to the bookkeeper.", "streamsNeeded": [{"id": "capture-receipts-and-expenses", "name": "Capture Receipts and Expenses", "howItSupports": "Lets the client photograph and upload the first receipts and see them recognised, the moment onboarding becomes real."}, {"id": "sync-and-match-bank-transactions", "name": "Sync and Match Bank Transactions", "howItSupports": "Sets up the Ponto consent for the client's business account so transactions start syncing four times a day from the first weeks."}]}]}, {"id": "jtbd-csux-2", "name": "Switch clients from a previous bookkeeper without gaps", "whatItIs": "Bring an entrepreneur who is leaving another bookkeeper or a software package onto Kees without a gap in the VAT or income tax history: time the switch, collect the digital copies of previous returns and the personal data, reconstruct the running year and opening balances in the client's administration, hand over to the personal bookkeeper with a complete checklist, and verify that the first Kees filing goes out on time.", "outcome": "Every switched client has a continuous administration with opening balances and prior filings on file, the first VAT return under Kees is filed on time, nothing is filed twice or not at all, and the switch takes days of the client's attention rather than weeks.", "steps": [{"step": "Time the switch and set expectations", "description": "Agree with the entrepreneur when the switch takes effect, ideally at a quarter boundary, who files the last return with the previous bookkeeper, when the notice to the previous provider goes out, and that the first fiscal year at Kees runs to the end of the year, so the client knows what happens to the running quarter.", "streamsNeeded": [{"id": "switch-from-a-previous-bookkeeper", "name": "Switch from a Previous Bookkeeper", "howItSupports": "Opens the switch case with the effective date, the last filing by the previous bookkeeper and the responsibilities per quarter."}, {"id": "manage-subscription-billing-and-plans", "name": "Manage Subscription Billing and Plans", "howItSupports": "Starts the subscription and the first-fiscal-year term from the agreed switch date with the plan for the client's legal form."}]}, {"step": "Collect digital copies of old returns and personal data", "description": "Request the digital copies of the previous VAT returns, the last income tax return and annual accounts, the fixed-asset list and the client's personal data, and let the client upload them to the switch case; chase what is missing with a checklist rather than a sequence of e-mails.", "streamsNeeded": [{"id": "switch-from-a-previous-bookkeeper", "name": "Switch from a Previous Bookkeeper", "howItSupports": "Provides the document checklist, the upload of digital copies of old returns and personal data and the status of what is still missing."}]}, {"step": "Reconstruct the running year and opening balances", "description": "Import the historical returns, book the opening balances and the bookings of the current year that the previous bookkeeper had processed, connect the bank so past transactions can be matched, and reconcile the VAT filed so far this year against the administration, so the first Kees return covers exactly the right period.", "streamsNeeded": [{"id": "switch-from-a-previous-bookkeeper", "name": "Switch from a Previous Bookkeeper", "howItSupports": "Imports the historical returns and opening balances into the client's administration and flags reconciliation differences."}, {"id": "close-the-year-and-file-income-tax", "name": "Close the Year and File Income Tax", "howItSupports": "Uses the previous annual accounts and income tax return as the starting point so the year-end and deductions continue without a break."}]}, {"step": "Hand over to the personal bookkeeper with the switch checklist", "description": "Introduce the client to the assigned bookkeeper with the completed switch checklist: what was filed by whom until when, opening balances, open questions from the previous bookkeeper's files, and the deadlines of the coming quarter, so the bookkeeper starts from a known state.", "streamsNeeded": [{"id": "start-and-onboard-a-new-client", "name": "Start and Onboard a New Client", "howItSupports": "Assigns the personal bookkeeper and carries the onboarding notes and welcome communication for the switched client."}, {"id": "review-administration-and-file-vat-returns", "name": "Review Administration and File VAT Returns", "howItSupports": "Puts the client's first Kees quarter and its deadline in the bookkeeper's queue with the reconstructed bookings ready for review."}]}, {"step": "Verify the first filing and close the switch", "description": "Check before the first deadline that the quarter is reviewed and the VAT return filed under Kees, that nothing was filed twice by the previous bookkeeper, and that the client's dashboard shows the continued history; ask the client how the switch went and close the case.", "streamsNeeded": [{"id": "switch-from-a-previous-bookkeeper", "name": "Switch from a Previous Bookkeeper", "howItSupports": "Tracks the switch case to closure with the first Kees filing confirmed and the client's feedback recorded."}, {"id": "review-administration-and-file-vat-returns", "name": "Review Administration and File VAT Returns", "howItSupports": "Confirms the first VAT return under Kees was filed with the Belastingdienst before the deadline."}]}]}, {"id": "jtbd-csux-3", "name": "Keep clients through changes in plan, legal form or bookkeeper", "whatItIs": "Notice and handle the moments in which clients leave: a plan or add-on change, an extra VOF partner or the first employee, the move from eenmanszaak to BV, a bookkeeper who does not click, a subscription invoice unpaid, or a cancellation request at the end of the first fiscal year, and turn each into a reason to stay by acting early, applying the terms fairly and keeping the client with a bookkeeper they trust.", "outcome": "Client churn stays low as the client base doubles, clients who change legal form or grow stay on the platform through Founders or a plan change, bookkeeper mismatches are resolved with a reassignment rather than a cancellation, and cancellation requests are handled within the rules with a real share won back.", "steps": [{"step": "Spot risk signals early", "description": "Review each week the clients with no uploads for two months, an unpaid subscription invoice, an open complaint, a bookkeeper change request or a question about cancellation terms, and call them before the problem becomes a decision; note the outcome on the client history.", "streamsNeeded": [{"id": "monitor-your-finances-on-the-dashboard", "name": "Monitor Your Finances on the Dashboard", "howItSupports": "Reveals inactive administrations and clients who no longer look at their numbers, an early sign of disengagement."}, {"id": "manage-subscription-billing-and-plans", "name": "Manage Subscription Billing and Plans", "howItSupports": "Flags unpaid subscription invoices, plan questions and notice-period enquiries on the client's subscription."}]}, {"step": "Handle plan changes and add-ons", "description": "Process the changes that come with a growing business: a bank connection for a second account, a partner's income tax return, payroll for a first employee, an extra VOF partner at EUR 100, or a downgrade when a business shrinks, and make sure the next monthly invoice reflects the change and the client understands it.", "streamsNeeded": [{"id": "manage-subscription-billing-and-plans", "name": "Manage Subscription Billing and Plans", "howItSupports": "Applies plan changes and add-ons to the subscription and the monthly invoicing with the correct pricing."}, {"id": "run-payroll-for-small-employers", "name": "Run Payroll for Small Employers", "howItSupports": "Starts payroll at EUR 17.50 per payslip when a client hires a first employee, without a change of bookkeeper."}]}, {"step": "Guide the change of legal form", "description": "When a sole proprietor adds a partner or a client wants to move to a BV, arrange the VOF plan or the handover to Founders for the holding and werkmaatschappij packages, keep the administration and history on the platform, and coordinate the timing with the bookkeeper and the Belastingdienst so the old and new entity are filed correctly in the transition year.", "streamsNeeded": [{"id": "serve-partnerships-and-companies", "name": "Serve Partnerships and Companies", "howItSupports": "Runs the eenmanszaak-to-VOF and eenmanszaak-to-BV transitions through the partnership and Founders workflows on the same client file."}, {"id": "manage-subscription-billing-and-plans", "name": "Manage Subscription Billing and Plans", "howItSupports": "Switches the subscription to the VOF or Founders plan from the agreed date with the correct terms."}]}, {"step": "Reassign a bookkeeper when the match does not work", "description": "When a client asks for a different bookkeeper or a bookkeeper flags a difficult relationship, find a better match in the same or another office within the workload plan, hand over the client file with the conversation history, and introduce the new bookkeeper personally so the client experiences a fresh start rather than a loss.", "streamsNeeded": [{"id": "plan-bookkeeper-capacity-and-quality", "name": "Plan Bookkeeper Capacity and Quality", "howItSupports": "Shows capacity and expertise across offices to find the new match within the workload plan."}, {"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Carries the client's message history to the new bookkeeper so the relationship continues from what was said before."}]}, {"step": "Handle cancellations within the rules and win back", "description": "When a cancellation request arrives, apply the terms transparently: the first full fiscal year, then one calendar month notice, and use the conversation to learn the reason; offer a plan change, a bookkeeper reassignment or a pause where that solves the problem, complete the offboarding cleanly where it does not, and ask departing clients who were satisfied to remain ambassadors.", "streamsNeeded": [{"id": "manage-subscription-billing-and-plans", "name": "Manage Subscription Billing and Plans", "howItSupports": "Processes the cancellation with the first-fiscal-year rule and one-month notice, the final invoice and the offboarding of the account."}, {"id": "grow-through-partners-and-referrals", "name": "Grow Through Partners and Referrals", "howItSupports": "Records the cancellation reason and keeps satisfied leavers in the network as ambassadors and future returners."}]}]}], "customerJourneyStories": [{"id": "journey-csux-1", "name": "Joining the client success team and learning to run the intro", "linkedJobIds": ["jtbd-csux-1", "jtbd-csux-3"], "summary": "A former hospitality manager joins Kees de Boekhouder as a client success executive in Amsterdam, is trained internally to run the free Google Meet intro, the fit check and onboarding on the platform, doubts whether she can talk about VAT and legal forms without a finance background, and within months converts intros into well-matched clients and owns the partner-referred onboarding.", "stages": [{"stage": "Trigger", "narrative": "After years of running a restaurant floor, she wants a job that keeps the contact with people but has regular hours, and applies to a Kees client success vacancy that asks for empathy with entrepreneurs rather than a finance degree. What triggers her is that she was a Kees client's guest at a network evening and heard how freelancers talk about their personal bookkeeper."}, {"stage": "Discovery", "narrative": "In the internal training she learns the proposition from the inside: the app and the bookkeeper, the plans per legal form, the add-ons and the terms, and the platform's onboarding case that runs from website request to first upload. She sits in on twenty intro calls with a senior colleague and sees that most questions repeat and that the fit check is a conversation, not a form."}, {"stage": "Evaluation", "narrative": "Her doubt is whether she can answer the tax questions that come up in an intro. What settles it is the setup she sees: the fit-check script with the standard answers, the knowledge base for the questions she does not know, a bookkeeper she can bring into a second call, and a Head of Growth who says that saying 'I will check with your future bookkeeper' is better than a wrong answer."}, {"stage": "Trial", "narrative": "Her first week of own intros is scheduled from the website requests and the partner pages, with a senior listening in on the first five. She converts a photographer referred through DuPho, declines an entrepreneur who insists on keeping his own software, and assigns her first clients a bookkeeper in the Amsterdam office from the workload plan within a day."}, {"stage": "Engagement", "narrative": "After three months she runs a full calendar of intros, onboarding cases and switches from the workspace: she prepares each intro from the request and the referral, closes cases only when the first upload or bank connection is in, and calls the clients whose risk signals light up on Monday morning. Her intro-to-active conversion sits above the team average."}, {"stage": "Retention", "narrative": "She stays because she sees the entrepreneurs she onboarded come back with stories and referrals, she owns the onboarding for the members of Stichting BOK and Kunstenbond, and her suggestions on the fit-check script and the welcome message are built into the onboarding case for every colleague in the three offices."}]}, {"id": "journey-csux-2", "name": "Moving onboarding, switches and subscription changes into the workspace", "linkedJobIds": ["jtbd-csux-2", "jtbd-csux-3"], "summary": "The sales, client success and support team adopts the onboarding case, switch service and subscription tooling in the bookkeeper workspace, replacing mailboxes, a shared calendar and a billing spreadsheet, after a switched client's quarter went unfiled, and ends up with switches completed in days, bookkeeper assignment within a day and churn visible before the cancellation e-mail.", "stages": [{"stage": "Trigger", "narrative": "A client switched from a previous bookkeeper in the summer has a VAT return missed because the old returns and the hand-over note sat in a colleague's inbox during holidays and the new bookkeeper assumed the previous provider had filed. The same month a partner benefit is applied wrongly on a first invoice and a cancellation is processed a month late. The team lead concludes that onboarding, switches and billing cannot run on mailboxes as the client base doubles."}, {"stage": "Discovery", "narrative": "The product team demonstrates the onboarding case, the switch service with its document checklist and import, and the subscription and billing tooling in the same workspace the bookkeepers use: every request, intro, fit-check outcome, bookkeeper assignment, switch document and plan change with an owner, a status and a date, visible to the bookkeeper who receives the client."}, {"stage": "Evaluation", "narrative": "The team worries that cases and dates will make the intro feel like a checklist and that conversion per executive will become a league table. Trying the case on a real intro shows it works as preparation rather than a script, and the agreement that conversion is read together with first-year retention and fit-check declines, which are a good thing, settles the discussion; the AVG review confirms personal data of switchers is safer in the case than in mailboxes."}, {"stage": "Trial", "narrative": "The Rotterdam office runs one quarter of onboardings and switches in the workspace. Switches close in days because the checklist chases the missing documents, every signed client has a bookkeeper within a day from the workload plan, the partner benefit is applied automatically to the first invoice, and the bookkeepers say the hand-over notes are the best they have had."}, {"stage": "Engagement", "narrative": "All offices move over before the next quarter. Executives prepare intros from the case, close onboarding only after the first upload, run switches through the checklist and import, process plan and legal-form changes on the subscription with billing following automatically, and start each week from the risk signals on inactive clients, unpaid invoices and change requests."}, {"stage": "Retention", "narrative": "By year end the workspace is where the team measures conversion, time to assignment, switch completeness and churn per office and per partner channel, cancellation requests are handled within the rules with a growing share won back, and nobody wants to go back to the calendar and the billing spreadsheet."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-csux-top", "name": "Intro-to-active conversion rate", "description": "Share of free Google Meet introductions that become active clients, meaning a signed subscription, a named bookkeeper and a first upload or bank connection within the onboarding period. Modeled seed value for a bookkeeping-as-a-service company, not an official Kees de Boekhouder figure.", "unit": "%", "currentValue": "41", "targetValue": "53", "link": "https://dashboard.example.com/freelancer-bookkeeping-service-platform/customers/csux/kpis/co-csux-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-csux-co-csux-top.png"}, "branches": [{"id": "co-csux-b1", "name": "Fast, well-matched onboarding", "description": "How quickly a signed client gets a named personal bookkeeper and becomes an active user of the app.", "currentValue": "62", "icon": "kpi-csux-co-csux-b1.png", "children": [{"id": "co-csux-b1-c1", "name": "Time to bookkeeper assignment", "description": "Working days from a signed subscription to a named personal bookkeeper introduced to the client.", "unit": on": "Share of active clients with at least one paid Ponto bank connection at EUR 5 per month.", "unit": "%", "currentValue": "45", "targetValue": "65", "icon": "kpi-csux-bo-csux-b2-c2-l1.png", "children": []}, {"id": "bo-csux-b2-c2-l2", "name": "Legal-form changes retained on platform", "description": "Share of clients changing from eenmanszaak to VOF or BV who stay with Kees or Founders rather than leaving for another provider.", "unit": "%", "currentValue": "70", "targetValue": "90", "icon": "kpi-csux-bo-csux-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make the client success executive the person who turns a free introduction into a loyal, well-matched client and keeps that client through every change: the platform prepares the intro, runs onboarding and switches as cases, applies plans and terms automatically and surfaces risk early, so the executive spends her time on the conversation that makes an entrepreneur choose and keep a personal bookkeeper.", "timeHorizons": {"year1": {"focus": "Run every intro, onboarding, switch and subscription change as a case in the workspace, assign a personal bookkeeper within a day from the workload plan, and complete switches without filing gaps, so the funnel toward 20,000 clients is measured and managed per office and per channel.", "productTheme": "Onboarding cases, switch service and subscription tooling", "customerKPI": {"northStar": "Intro-to-active conversion rate", "supporting": ["Time to bookkeeper assignment", "Switch completion time"]}, "businessKPI": {"northStar": "Client churn rate", "revenueStreams": ["Fixed yearly subscriptions per legal form", "Add-ons: bank connection, partner returns, payroll", "VOF and Founders BV packages"], "supporting": ["Active clients added per month", "First-year retention rate"]}, "milestones": ["Run onboarding, switches and subscription changes for all three offices from cases in the workspace with owners, dates and status", "Assign every signed client a named bookkeeper within one working day from the workload plan", "Close switch cases in ten days on average with historical returns imported and the first Kees filing confirmed"]}, "year3": {"focus": "Grow data-driven: intro booking and onboarding tuned per segment and partner channel, self-serve steps for account access and bank connection, an automated switch import, and risk signals that trigger the right conversation before a client decides to leave, with legal-form changes kept on the platform through Founders.", "productTheme": "Data-driven acquisition and retention", "customerKPI": {"northStar": "Intro-to-active conversion rate", "supporting": ["Time to first upload", "Onboarding satisfaction score"]}, "businessKPI": {"northStar": "Client churn rate", "revenueStreams": ["Fixed yearly subscriptions per legal form", "Partner-channel subscriptions with member benefits", "Founders BV packages from legal-form upgrades"], "supporting": ["Referral share of new clients", "Legal-form changes retained on platform"]}, "milestones": ["Book intros and run first-upload coaching per segment and partner channel with conversion and retention measured per channel", "Automate the switch import of historical returns and opening balances so a switch is a review step for the bookkeeper", "Trigger retention conversations from app, billing and messaging signals before clients reach the end of their first fiscal year"]}, "year5": {"focus": "Make onboarding and retention largely self-running: AI-assisted intro preparation and fit assessment, instant bookkeeper matching, continuous engagement scoring and proactive offers for plan changes, payroll and BV transitions, so executives focus on the entrepreneurs who need a conversation and the community that brings the next client.", "productTheme": "Self-running onboarding and proactive retention", "customerKPI": {"northStar": "Intro-to-active conversion rate", "supporting": ["Bank connection activated in first month", "Win-back rate on cancellation requests"]}, "businessKPI": {"northStar": "Client churn rate", "revenueStreams": ["Fixed yearly subscriptions across legal forms", "Proactive add-on and advice offers", "Partner and community-sourced subscriptions"], "supporting": ["Add-on revenue per client", "Cost per activated client"]}, "milestones": ["Prepare every intro with an AI summary of the request, the referral and the likely plan, and let executives confirm the fit in one conversation", "Match clients to bookkeepers instantly from capacity, expertise and language, with reassignments proposed when engagement drops", "Offer plan changes, payroll and the move to a BV proactively from the client's own numbers, keeping growing clients on the platform"]}}}, "domain": "Kees Service Teams"}, {"id": "ecop", "name": "Ecosystem Partner", "description": "The partnership or member-services manager of an organisation in the Kees de Boekhouder partner programme: a professional association such as BNO for designers, DuPho for photographers, Kunstenbond for artists and musicians or Stichting BOK with more than 2,300 members, a creative-sector platform such as voordekunst or Unfair, or a service provider for freelancers such as the insurer Insify, the pension provider BrightPensioen or the legal insurer DAS. The partnership works in two directions. Associations offer their members a Kees benefit, for example no administration costs plus three months free for Stichting BOK members, and in return give Kees access to a concentrated audience of freelancers who trust the association's recommendation. Service providers offer Kees clients a member benefit, such as the EUR 50 discount from BrightPensioen, and reach more than 10,000 entrepreneurs through the Kees partner page, newsletter and bookkeepers. The partner wants a benefit that is simple to explain, referrals and redemptions that are tracked and reported, co-marketing content and events, member data handled within the AVG, and no administrative burden on their small team. Is judged inside their own organisation on member value and uptake, and by Kees on referred members who actually become active clients.", "icon": "ecop.png", "careAbout": ["A benefit their members immediately understand and can claim without forms, such as three months free or no administration costs, honoured correctly on the first invoice", "Brand fit: Kees understands creative and freelance work, so recommending a bookkeeper to members strengthens the association's reputation rather than risking it", "Referral tracking that shows how many members requested an intro, joined and stayed, reported without the partner having to ask", "Member data that never leaves the member's control: the member chooses to contact Kees, and personal data is processed within the AVG", "Co-marketing that is ready to use: a partner page, a newsletter item, a client story from one of their own members, a workshop at their event", "A partnership that costs their small team a few hours per quarter, not a project"], "winsThem": ["A partner programme with a dedicated partner page, benefit codes and an intro booking route that carries the member's association and benefit into the onboarding case", "Referral tracking and a periodic partner report with intros, activations, benefit redemptions and retention of referred members", "Client stories and network profiles of members who are Kees clients, usable in the association's own channels", "Reverse benefits for Kees clients, such as a pension or insurance discount, promoted to more than 10,000 entrepreneurs through the partner page, newsletter and bookkeepers", "A partnership contact at Kees, in the growth and marketing team, who handles the agreement, the launch and the quarterly review in a few calls"], "theirFear": ["Recommending Kees to members and hearing complaints that the benefit was not applied or the bookkeeper did not understand their trade", "A partnership that produces no numbers, so the association cannot show its board what the member benefit delivered", "Members' personal data being used for marketing beyond what they consented to, exposing the association to an AVG complaint"], "jobsToBeDone": [{"id": "jtbd-ecop-1", "name": "Offer my members a trusted bookkeeper benefit", "whatItIs": "Set up and run a partnership in which the association's or platform's members get a clear Kees benefit and a personal bookkeeper who understands their trade: assess the fit and negotiate the benefit, set up the referral route and benefit code, launch to members with co-branded content, make sure member intros and onboarding honour the benefit, and gather member feedback and stories that show the partnership works.", "outcome": "Members claim the benefit without friction, the association's recommendation is confirmed by members' experience with their bookkeeper, the partner has stories and numbers to show its board, and the partnership runs on a few hours of the partner's time per quarter.", "steps": [{"step": "Assess the fit and negotiate the benefit", "description": "Check that Kees serves the members' legal forms and trades (creative freelancers, starters, VOFs, BVs through Founders), compare the proposition with software-only alternatives members ask about, and agree the benefit, such as no administration costs plus three months free, or a discount on an add-on, along with exclusivity, duration and how the benefit is reported.", "streamsNeeded": [{"id": "grow-through-partners-and-referrals", "name": "Grow Through Partners and Referrals", "howItSupports": "Holds the partner agreement, the benefit definition, its duration and the reporting commitments for the partnership."}]}, {"step": "Set up the referral route and benefit code", "description": "Get a partner page and benefit code, agree how members identify themselves (code, membership number, partner link), and confirm that the benefit is applied automatically to the subscription and the first invoice so no member has to chase it.", "streamsNeede nd grows from a listed benefit to a two-way partnership with tracked uptake and a place in the client's own numbers.", "stages": [{"stage": "Trigger", "narrative": "The provider's growth depends on reaching freelancers at the moment they think about pension or insurance, which is usually when their bookkeeper shows them their profit and tax reservation, and its own acquisition channels are expensive. The partnerships lead looks for a bookkeeper brand with a concentrated freelance audience and a trusted personal relationship."}, {"stage": "Discovery", "narrative": "She finds the Kees partner page listing BrightPensioen with its EUR 50 discount, Insify and DAS among the partners, hears from freelancers that their Kees bookkeeper is the person they ask about pension and insurance, and approaches the Kees growth team with a reverse-benefit proposal."}, {"stage": "Evaluation", "narrative": "Both sides check the fit: Kees does not sell financial products and must keep advice independent, so the benefit is a discount promoted on the partner page and in content, never a bookkeeper's sales pitch; the AVG position is that clients choose to contact the provider themselves. The provider evaluates the reach, the audience's match with its target group and the tracking Kees can report, and agrees a benefit and a content plan."}, {"stage": "Trial", "narrative": "The benefit goes live on the partner page and in one newsletter, with a code the client uses at the provider. In the first quarter a measurable number of Kees clients redeem it, the provider's report from Kees matches its own redemption count, and a bookkeeper's blog post on reserving for pension as a freelancer becomes the best-performing content of the quarter."}, {"stage": "Engagement", "narrative": "The partnership becomes part of both calendars: a content item each quarter around the moments a freelancer thinks about pension or insurance, the benefit mentioned in the year-end conversation material bookkeepers use when
