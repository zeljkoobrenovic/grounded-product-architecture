    const customer = {"id": "crfr", "name": "Creative Freelancer", "description": "A designer, photographer, stylist, make-up artist, furniture maker, illustrator, artist or content creator who runs an eenmanszaak and is the heart of the Kees de Boekhouder client base: the client stories of Jochem (furniture designer and maker), Celeste (stylist and influencer), Tynke (make-up artist and hairstylist) and Marloes (artist) all belong here. Typically a member of BNO, DuPho, Kunstenbond or Stichting BOK, earning an irregular income from a mix of assignments, commissions, day rates, licence fees and occasional grants, with many small purchases: materials, props, camera gear, studio rent, travel and subscriptions. Pays the fixed eenmanszaak fee of EUR 840 per year ex VAT, invoiced monthly, and often connects a business account through Ponto for EUR 5 per month. Wants administration to take almost no time, a bookkeeper who understands creative work (mixed private and business use, second-hand equipment, foreign clients, reverse-charge VAT for EU agencies) and the certainty that the quarterly VAT return and the income tax return are filed on time without a surprise bill. Judges the service on hours spent per month, on never missing a deadline and on a human being answering by e-mail or phone.", "icon": "crfr.png", "careAbout": ["Administration that takes minutes, not evenings: photograph a receipt, send an invoice, and let the bookkeeper and the app do the rest", "A personal bookkeeper who knows creative work, from mixed private and business use of a camera to a licence fee paid by a foreign agency", "Quarterly VAT and the yearly income tax return filed on time, every time, with the bookkeeper carrying the fiscal responsibility", "No surprise tax bill: knowing each quarter what to reserve, with zelfstandigenaftrek (EUR 1,200 in 2026) and mkb-winstvrijstelling applied correctly", "A fixed, transparent price of EUR 840 per year invoiced monthly, with no hourly fees for asking a question", "Getting paid faster through professional quotes and invoices under the trading name clients know, with reminders that do not damage the relationship"], "winsThem": ["Client stories from peers such as Jochem, Celeste, Tynke and Marloes, and a member benefit through BNO, DuPho, Kunstenbond or Stichting BOK (no administration costs and three months free for BOK members)", "Scan & Herken that recognises a photographed receipt, proposes the category and VAT, and turns a shoebox of paper into bookings on the phone", "A free introduction call via Google Meet with a mutual-fit check, followed by a named bookkeeper who answers by e-mail or phone all year", "A bank connection via Ponto that syncs Knab, Rabobank, ABN AMRO or bunq transactions four times a day and matches them to bookings automatically", "A dashboard that shows revenue per quarter, cost categories, profit and the VAT to pay or receive, so the tax position is never a guess"], "theirFear": ["A quarter of receipts lost in a jacket pocket or a camera bag, VAT paid that could have been reclaimed, and a return filed late with a fine because nobody chased them", "A tax assessment for a good year that arrives after the money has been spent on equipment and a holiday, because nothing was reserved", "Being treated as a number by an accountant who charges per e-mail and does not understand why a make-up artist buys 40 small items a month"], "jobsToBeDone": [{"id": "jtbd-crfr-1", "name": "Keep my administration complete with almost no time spent", "whatItIs": "Keep every receipt, purchase invoice, sales invoice and bank transaction of the business captured, categorised and reviewed by a bookkeeper, without turning evenings and weekends into administration time. The job is to make the administration a by-product of running the creative business: a photo at the till, an invoice from the app, a bank connection that does the rest, and a bookkeeper who reviews and asks only when something is unclear.", "outcome": "All bookings of a quarter are in the administration before the bookkeeper's review, with less than two hours of the freelancer's own time per month, no missing receipts at the VAT deadline and no backlog of unmatched bank transactions at year-end.", "steps": [{"step": "Start with the bookkeeper and get the app set up", "description": "After the free intro call, choose the eenmanszaak subscription, get access to mijn.keesdeboekhouder.nl and the mobile app, add the trading names clients know, and connect the business bank account through Ponto. Decide during the first upload coaching what counts as business (studio rent, camera, props) and what stays private, so later receipts need no discussion.", "streamsNeeded": [{"id": "start-and-onboard-a-new-client", "name": "Start and Onboard a New Client", "howItSupports": "Runs the free Google Meet intro, the mutual-fit check, account access, bookkeeper assignment and the first upload coaching that sets the rules for what to capture."}, {"id": "sync-and-match-bank-transactions", "name": "Sync and Match Bank Transactions", "howItSupports": "Establishes the Ponto PSD2 consent for the business account so that transactions arrive automatically from the first month."}]}, {"step": "Capture every receipt the moment it happens", "description": "Photograph the receipt at the art-supply store or the camera shop, forward the e-mail invoice from the stock-photo or software subscription, and let Scan & Herken recognise supplier, amount, VAT and category. Decide only on the exceptions the app flags: mixed private and business use, a second-hand purchase without VAT, a purchase from an EU webshop with reverse-charge VAT.", "streamsNeeded": [{"id": "capture-receipts-and-expenses", "name": "Capture Receipts and Expenses", "howItSupports": "Turns a photo, upload or e-mail into a recognised, categorised expense booking with VAT, ready for the bookkeeper's review, so the freelancer does not type anything."}]}, {"step": "Invoice from the app so revenue is booked automatically", "description": "Create quotes and invoices in the app under the right trading name, with the correct VAT rule for a Dutch agency, an EU client (reverse charge) or a private customer, so that every sale is already in the administration and the bookkeeper never has to reconstruct revenue from bank statements.", "streamsNeeded": [{"id": "create-quotes-and-invoices-and-get-paid", "name": "Create Quotes and Invoices and Get Paid", "howItSupports": "Produces the invoice as a booking with the right VAT treatment and tracks its status, so revenue is complete without extra work."}]}, {"step": "Let the bank connection match the rest", "description": "Check the app once a week: transactions synced four times a day are matched automatically against invoices and receipts; the freelancer confirms the few open ones, books a direct expense for a small purchase without a receipt, and re-authorises the bank consent when the app asks every 90 to 180 days. Friction: an expired consent silently stops the sync and creates a backlog.", "streamsNeeded": [{"id": "sync-and-match-bank-transactions", "name": "Sync and Match Bank Transactions", "howItSupports": "Syncs and auto-matches transactions and asks for manual matching or direct booking only for the remainder; flags consent expiry before the sync stops."}, {"id": "monitor-your-finances-on-the-dashboard", "name": "Monitor Your Finances on the Dashboard", "howItSupports": "Shows the open to-dos and unmatched transactions on web and mobile so the weekly check takes minutes."}]}, {"step": "Respond to the bookkeeper's review questions", "description": "Before each quarterly VAT return the bookkeeper checks the administration and asks about anything unclear: a large purchase that may be an investment, a receipt without VAT, a payment from a foreign platform. Answer by e-mail or phone, upload the missing document, and let the bookkeeper close the quarter.", "streamsNeeded": [{"id": "review-administration-and-file-vat-returns", "name": "Review Administration and File VAT Returns", "howItSupports": "Structures the bookkeeper's check into concrete questions and to-dos for the client, so the quarter can be closed without a back-and-forth over e-mail."}, {"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Carries the questions and answers between client and bookkeeper by e-mail and phone, linked to the client file."}]}]}, {"id": "jtbd-crfr-2", "name": "Never miss a VAT or income tax deadline or get a surprise bill", "whatItIs": "Have the quarterly btw-aangifte and the yearly income tax return prepared, checked and filed with the Belastingdienst before the deadline by a bookkeeper who carries the fiscal responsibility, and know throughout the year what to reserve for VAT and income tax so that an assessment never comes as a shock. The job is peace of mind: deadlines are someone else's calendar, deductions are applied, and the reserved amount matches the bill.", "outcome": "Every VAT return is filed before the last day of the month after the quarter and every income tax return before its deadline, with zelfstandigenaftrek, mkb-winstvrijstelling and investment deductions applied, and the difference between the reserved amount and the final assessment stays within a small margin.", "steps": [{"step": "Know the deadlines and what the bookkeeper needs", "description": "Receive reminders in the app and by e-mail before the end of each quarter listing what is still missing (receipts, unmatched transactions, an invoice not yet sent), so the review can start on time. Friction: a reminder that arrives during a shoot week or a festival is easy to ignore.", "streamsNeeded": [{"id": "review-administration-and-file-vat-returns", "name": "Review Administration and File VAT Returns", "howItSupports": "Sets the review cut-off per quarter and derives the client to-do list of missing bookings from the administration."}, {"id": "monitor-your-finances-on-the-dashboard", "name": "Monitor Your Finances on the Dashboard", "howItSupports": "Surfaces deadlines, to-dos and notifications on the dashboard and in the mobile app."}]}, {"step": "Have the quarter checked and the VAT return filed", "description": "The bookkeeper reviews the bookings, corrects VAT categories where needed, confirms the VAT to pay or receive with the client and files the return through the official Belastingdienst channel; the client receives the amount and the payment reference with time to pay.", "streamsNeeded": [{"id": "review-administration-and-file-vat-returns", "name": "Review Administration and File VAT Returns", "howItSupports": "Runs the bookkeeper check, prepares the VAT return and files it with the Belastingdienst before the deadline, with the filed copy stored for the client."}]}, {"step": "Reserve the right amount for income tax during the year", "description": "Look at the dashboard's profit and tax reservation after each quarter and set money aside, or ask the bookkeeper to request a preliminary assessment (voorlopige aanslag) so that tax is paid monthly instead of in one lump. Decide with the bookkeeper whether an exceptionally good year justifies an investment before year-end.", "streamsNeeded": [{"id": "monitor-your-finances-on-the-dashboard", "name": "Monitor Your Finances on the Dashboard", "howItSupports": "Shows profit to date and the amount to reserve for VAT and income tax in real time as bookings are submitted."}, {"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Answers reservation questions and arranges a preliminary assessment so the tax bill is spread over the year."}]}, {"step": "Close the year and file the income tax return", "description": "Confirm the hours worked for the hours criterion, private use of the car or studio, and any investments; the bookkeeper prepares the annual figures, applies zelfstandigenaftrek (EUR 1,200 in 2026, EUR 900 in 2027), mkb-winstvrijstelling and investment deductions, and files the income tax return, plus a fiscal partner's return for EUR 125 incl. VAT when asked.", "streamsNeeded": [{"id": "close-the-year-and-file-income-tax", "name": "Close the Year and File Income Tax", "howItSupports": "Turns the checked administration into annual accounts and a filed income tax return with the deductions applied, including the partner return add-on."}]}, {"step": "Understand the assessment and deal with changes", "description": "When the assessment arrives, compare it with what was reserved and ask the bookkeeper about any difference; receive proactive updates about rule changes that matter to creative freelancers, such as the shrinking zelfstandigenaftrek, the KOR threshold of EUR 20,000 and Wet DBA enforcement since 2025.", "streamsNeeded": [{"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Explains the assessment and pushes proactive updates about deadlines and rule changes to the client, backed by the advice knowledge base."}]}]}, {"id": "jtbd-crfr-3", "name": "Get paid faster with professional quotes and invoices", "whatItIs": "Send quotes and invoices that look professional under the trading name the client knows, apply the right VAT rule for agencies, EU clients and private customers, see which invoices are open and remind clients politely, so that cash arrives sooner and the freelancer spends less time chasing money. The job is to make invoicing part of the creative workflow rather than a separate chore in Word or Excel.", "outcome": "Invoices go out the day the work is delivered, the share of invoices paid within the payment term rises, overdue invoices are reminded automatically before the freelancer has to make an awkward call, and every invoice is already booked for VAT and revenue.", "steps": [{"step": "Turn a request into a quote", "description": "Create a quote from a template with the freelancer's trading name, logo and terms, decide on day rate versus fixed fee, and send it from the app so that acceptance can be tracked. Friction: creative work often starts on a verbal yes, so the quote must be quick.", "streamsNeeded": [{"id": "create-quotes-and-invoices-and-get-paid", "name": "Create Quotes and Invoices and Get Paid", "howItSupports": "Provides quote templates per trading name with status tracking and one-click conversion to an invoice."}]}, {"step": "Invoice with the right VAT rule", "description": "Convert the accepted quote into an invoice, applying 21 percent VAT for a Dutch client, reverse charge for an EU agency, or the KOR exemption when the freelancer opted in, and attach it to the client's contact so the history is in one place.", "streamsNeeded": [{"id": "create-quotes-and-invoices-and-get-paid", "name": "Create Quotes and Invoices and Get Paid", "howItSupports": "Applies VAT rules including reverse charge, keeps multiple trading names per entity and books the invoice as revenue."}, {"id": "ask-your-bookkeeper-and-get-advice", "name": "Ask Your Bookkeeper and Get Advice", "howItSupports": "Answers the occasional question about a foreign client or a licence fee before the invoice goes out."}]}, {"step": "See what is open and when it was paid", "description": "Watch the invoice status change to paid when the bank connection matches the incoming payment, and see days outstanding per client on the dashboard, without checking the bank app manually.", "streamsNeeded": [{"id": "sync-and-match-bank-transactions", "name": "Sync and Match Bank Transactions", "howItSupports": "Matches incoming payments to open invoices automatically so status is current without manual work."}, {"id": "monitor-your-finances-on-the-dashboard", "name": "Monitor Your Finances on the Dashboard", "howItSupports": "Shows outstanding invoices and revenue per quarter in real time."}]}, {"step": "Remind late payers without damaging the relationship", "description": "Let the app send a friendly reminder after the payment term and a firmer one later, decide personally when to call, and ask the bookkeeper about statutory interest or a collection step for a client that never pays.", "streamsNeeded": [{"id": "create-quotes-and-invoices-and-get-paid", "name": "Create Quotes and Invoices and Get Paid", "howItSupports": "Tracks overdue invoices and sends reminders in the freelancer's tone, with the option to escalate."}]}]}], "customerJourneyStories": [{"id": "journey-crfr-1", "name": "From a shoebox of receipts to a bookkeeper on the phone", "linkedJobIds": ["jtbd-crfr-1", "jtbd-crfr-2"], "summary": "A furniture designer and maker in Amsterdam, three years into his eenmanszaak, moves from a shoebox of receipts and a once-a-year accountant to Kees de Boekhouder, from the fine that triggered the search to the second year in which he recommends Kees to his studio neighbours.", "stages": [{"stage": "Trigger", "narrative": "A letter from the Belastingdienst announces a fine for a VAT return filed late, and the accountant who does the annual return replies that quarterly VAT was never part of the deal. The designer realises he has paid VAT he could have reclaimed on materials and that a good year of commissions has left nothing reserved for income tax."}, {"stage": "Discovery", "narrative": "A studio neighbour, a photographer and DuPho member, mentions that her bookkeeper at Kees de Boekhouder answers within a day and that DuPho members get a benefit. The designer reads the client story of Jochem, a fellow furniture maker, on keesdeboekhouder.nl and sees that a personal bookkeeper plus app costs EUR 840 per year, invoiced monthly."}, {"stage": "Evaluation", "narrative": "He compares Kees with Moneybird and e-Boekhouden.nl, which are cheaper per month but leave the VAT and income tax filing to him, and with a local accountant who charges per hour. The free Google Meet intro settles it: the bookkeeper explains how mixed private and business use of the van and workshop is handled, confirms the first-year commitment and monthly cancellation afterwards, and that the fee includes the income tax return."}, {"stage": "Trial", "narrative": "In the first two weeks he uploads the shoebox in batches with Scan & Herken, connects his Knab account through Ponto and lets the bookkeeper coach him through the first upload. The first quarter is reviewed with a handful of questions about a second-hand lathe and a purchase from a German supplier, and the VAT return is filed a week before the deadline."}, {"stage": "Engagement", "narrative": "Photographing receipts at the timber yard becomes a habit, invoices go out from the app under his studio name, and the dashboard shows what to reserve each quarter. When a gallery in Belgium commissions a piece he e-mails his bookkeeper about reverse-charge VAT and gets an answer the same afternoon."}, {"stage": "Retention", "narrative": "After the first income tax return, with zelfstandigenaftrek and an investment deduction applied and an assessment close to what the dashboard had predicted, he stays without thinking about the alternatives. He records a client story for the Kees network profiles and two neighbours from the studio building book an intro call on his recommendation."}]}, {"id": "journey-crfr-2", "name": "From a first big year as a stylist to admin that fits in a phone", "linkedJobIds": ["jtbd-crfr-1", "jtbd-crfr-3"], "summary": "A stylist and content creator whose business grew from side gigs to a full-time eenmanszaak with brand deals and agency work adopts Kees de Boekhouder through a Kunstenbond member benefit, and stays because the app fits a life lived on set and on the road.", "stages": [{"stage": "Trigger", "narrative": "A brand deal from an agency in Paris, a growing number of small purchases for shoots and a first income tax assessment that surprises her make it clear that a spreadsheet and a friend who 'knows tax' are no longer enough. She has no time in the evenings and no interest in learning bookkeeping."}, {"stage": "Discovery", "narrative": "A Kunstenbond newsletter lists Kees de Boekhouder as a member benefit, and a post by Celeste, a stylist and influencer, describes doing her whole administration from her phone with a bookkeeper who calls her back. The Kees website shows quotes and invoices, Scan & Herken and the dashboard on a mobile screen."}, {"stage": "Evaluation", "narrative": "She checks that the app has a real iOS app, that foreign agency invoices are handled, that reminders for late payers can be sent in her own tone, and that the price is fixed at EUR 70 per month with a bank connection for EUR 5 extra. The intro call confirms that a bookkeeper who has other creative clients will be assigned and that there is no charge for questions."}, {"stage": "Trial", "narrative": "She signs up, connects her bunq account, photographs the receipts of her first shoot week and sends three invoices from the app, one with reverse-charge VAT to the Paris agency. The bookkeeper reviews the first month, corrects two categories and explains which part of her clothing budget can be business."}, {"stage": "Engagement", "narrative": "The app becomes part of set life: a receipt is photographed before the coffee is cold, brand deals are invoiced the day the content is delivered, and overdue invoices are reminded automatically. Each quarter the VAT amount and payment reference arrive by e-mail before the deadline, and the dashboard tells her what to reserve."}, {"stage": "Retention", "narrative": "After a year her days sales outstanding have dropped and the income tax return holds no surprises. When a software-only tool offers a cheaper plan she stays, because the bookkeeper knows her business and has already flagged the Wet DBA questions on a long-term agency contract. She joins the Kees entrepreneur network and refers two fellow creators."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-crfr-top", "name": "Hours spent on administration per month", ctions matched automatically", "description": "Share of synced bank transactions matched to an invoice, receipt or booking rule without manual matching by the client or bookkeeper.", "unit": "%", "currentValue": "65", "targetValue": "90", "icon": "kpi-crfr-co-crfr-b1-c2.png", "children": [{"id": "co-crfr-b1-c2-l1", "name": "Bank connections active without expired consent", "description": "Share of creative clients whose Ponto consent is valid and syncing four times a day, i.e. not stalled by a missed 90 to 180 day re-authorisation.", "unit": "%", "currentValue": "78", "targetValue": "95", "icon": "kpi-crfr-co-crfr-b1-c2-l1.png", "children": []}, {"id": "co-crfr-b1-c2-l2", "name": "Unmatched transactions older than 30 days", "description": "Average number of open bank transactions per client that have waited more than 30 days for a match or a direct booking.", "unit": "transactions", "currentValue": "22", "targetValue": "3", "icon": "kpi-crfr-co-crfr-b1-c2-l2.png", "children": []}]}]}, {"id": "co-crfr-b2", "name": "Certainty about tax and money", "description": "Whether filings happen on time without the freelancer's attention and whether the tax bill matches what was reserved.", "currentValue": "64", "icon": "kpi-crfr-co-crfr-b2.png", "children": [{"id": "co-crfr-b2-c1", "name": "Tax filing on-time rate", "description": "Share of quarterly VAT returns and yearly income tax returns of creative clients filed with the Belastingdienst before the statutory deadline.", "unit": "%", "currentValue": "96", "targetValue": "100", "icon": "kpi-crfr-co-crfr-b2-c1.png", "children": [{"id": "co-crfr-b2-c1-l1", "name": "Quarters submitted before the review cut-off", "description": "Share of client quarters where all bookings and answers were in before the bookkeeper's review cut-off, leaving time for a calm filing.", "unit": "%", "currentValue": "72", "targetValue": "95", "icon": "kpi-crfr-co-crfr-b2-c1-l1.png", "children": []}, {"id": "co-crfr-b2-c1-l2", "name": "Deadline reminders acted on within three days", "description": "Share of missing-item reminders where the client uploaded or answered within three days.", "unit": "%", "currentValue": "55", "targetValue": "85", "icon": "kpi-crfr-co-crfr-b2-c1-l2.png", "children": []}]}, {"id": "co-crfr-b2-c2", "name": "Unexpected tax bill incidence", "description": "Share of creative clients per year who receive an income tax or VAT assessment materially above what the dashboard and bookkeeper told them to reserve.", "unit": "% of clients per year", "currentValue": "18", "targetValue": "5", "icon": "kpi-crfr-co-crfr-b2-c2.png", "children": [{"id": "co-crfr-b2-c2-l1", "name": "Tax reservation deviation from final assessment", "description": "Average absolute deviation between the amount the dashboard advised to reserve and the final income tax assessment.", "unit": "%", "currentValue": "25", "targetValue": "8", "icon": "kpi-crfr-co-crfr-b2-c2-l1.png", "children": []}, {"id": "co-crfr-b2-c2-l2", "name": "Clients setting aside the income tax reservation monthly", "description": "Share of creative clients who transfer the income tax reservation shown on the dashboard to a savings account, or pay it through a preliminary assessment, each month, so the final assessment is already funded when it arrives.", "unit": "%", "currentValue": "35", "targetValue": "75", "icon": "kpi-crfr-co-crfr-b2-c2-l2.png", "children": []}]}]}]}, "businessOutcomes": {"top": {"id": "bo-crfr-top", "name": "Annual recurring revenue from creative sole proprietors", "description": "Subscription and add-on revenue per year from creative eenmanszaak clients at the fixed fee of EUR 840 per year plus bank connection and partner return add-ons. Modeled seed value for a company serving 10,000+ clients, not an official Kees de Boekhouder figure.", "unit": "EUR million per year", "currentValue": "3.4", "targetValue": "6.5", "link": "https://dashboard.example.com/freelancer-bookkeeping-service-platform/customers/crfr/kpis/bo-crfr-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-crfr-bo-crfr-top.png"}, "branches": [{"id": "bo-crfr-b1", "name": "Creative client base growth", "description": "How fast the creative segment grows through partner associations, client stories and referrals, on the road from 10,000 to 20,000 clients.", "currentValue": "55", "icon": "kpi-crfr-bo-crfr-b1.png", "children": [{"id": "bo-crfr-b1-c1", "name": "Active creative sole proprietor clients", "description": "Number of creative eenmanszaak clients on an active subscription at the end of the period.", "unit": "clients", "currentValue": "4000", "targetValue": "7500", "icon": "kpi-crfr-bo-crfr-b1-c1.png", "children": [{"id": "bo-crfr-b1-c1-l1", "name": "New creative clients per month", "description": "Creative clients activated per month after the intro call and fit check.", "unit": "clients per month", "currentValue": "90", "targetValue": "180", "icon": "kpi-crfr-bo-crfr-b1-c1-l1.png", "children": []}, {"id": "bo-crfr-b1-c1-l2", "name": "New creative clients via partner or referral", "description": "Share of new creative clients arriving through BNO, DuPho, Kunstenbond, Stichting BOK, voordekunst or a client referral.", "unit": "%", "currentValue": "35", "targetValue": "50", "icon": "kpi-crfr-bo-crfr-b1-c1-l2.png", "children": []}]}, {"id": "bo-crfr-b1-c2", "name": "Intro-to-active conversion for creative leads", "description": "Share of creative intro calls that become an active client within 30 days.", "unit": "%", "currentValue": "42", "targetValue": "55", "icon": "kpi-crfr-bo-crfr-b1-c2.png", "children": [{"id": "bo-crfr-b1-c2-l1", "name": "Intro calls booked from partner pages per month", "description": "Free Google Meet intros booked per month from partner benefit pages and client stories.", "unit": "calls per month", "currentValue": "60", "targetValue": "130", "icon": "kpi-crfr-bo-crfr-b1-c2-l1.png", "children": []}, {"id": "bo-crfr-b1-c2-l2", "name": "Creative onboarding completed within 14 days", "description": "Share of new creative clients with account, bank connection and first upload coaching completed within two weeks.", "unit": "%", "currentValue": "60", "targetValue": "85", "icon": "kpi-crfr-bo-crfr-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-crfr-b2", "name": "Retention and margin per creative client", "description": "Whether creative clients stay beyond the first fiscal year and how many bookkeeper hours each one costs.", "currentValue": "60", "icon": "kpi-crfr-bo-crfr-b2.png", "children": [{"id": "bo-crfr-b2-c1", "name": "Annual creative client churn rate", "description": "Share of creative clients cancelling per year after the first full fiscal year, with one calendar month notice.", "unit": "%", "currentValue": "12", "targetValue": "7", "icon": "kpi-crfr-bo-crfr-b2-c1.png", "children": [{"id": "bo-crfr-b2-c1-l1", "name": "Clients cancelling right after the first fiscal year", "description": "Share of creative clients who cancel in the first month after the first-year commitment ends.", "unit": "%", "currentValue": "9", "targetValue": "5", "icon": "kpi-crfr-bo-crfr-b2-c1-l1.png", "children": []}, {"id": "bo-crfr-b2-c1-l2", "name": "Creative clients leaving for software-only tools", "description": "Share of creative clients per year who cancel citing a self-service tool such as Moneybird, e-Boekhouden.nl or Tellow.", "unit": "%", "currentValue": "4", "targetValue": "2", "icon": "kpi-crfr-bo-crfr-b2-c1-l2.png", "children": []}]}, {"id": "bo-crfr-b2-c2", "name": "Bookkeeper hours per creative client per year", "description": "Bookkeeper time per creative client per year for review, filings, questions and corrections; the main driver of margin at a fixed fee.", "unit": "hours per client per year", "currentValue": "7", "targetValue": "5", "icon": "kpi-crfr-bo-crfr-b2-c2.png", "children": [{"id": "bo-crfr-b2-c2-l1", "name": "Bank connection add-on attach rate", "description": "Share of creative clients with at least one Ponto bank connection at EUR 5 per month.", "unit": "%", "currentValue": "55", "targetValue": "75", "icon": "kpi-crfr-bo-crfr-b2-c2-l1.png", "children": []}, {"id": "bo-crfr-b2-c2-l2", "name": "Receipts arriving as recognised bookings", "description": "Share of expense bookings that arrive via Scan & Herken or e-mail-in rather than as paper batches handed to the bookkeeper.", "unit": "%", "currentValue": "60", "targetValue": "90", "icon": "kpi-crfr-bo-crfr-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make Kees de Boekhouder the bookkeeper every creative freelancer recommends to the next: administration that fits in a phone, a personal bookkeeper who understands creative work, and no surprises at the VAT deadline or in the income tax assessment, at one fixed price.", "timeHorizons": {"year1": {"focus": "Grow the creative segment through the associations and client stories that already work (BNO, DuPho, Kunstenbond, Stichting BOK, voordekunst) while cutting the client's own administration time with better recognition, bank matching and reminders, and keeping every VAT and income tax return on time as zelfstandigenaftrek shrinks.", "productTheme": "Minutes of admin per month, filed on time, no surprises", "customerKPI": {"northStar": "Hours spent on administration per month", "supporting": ["Tax filing on-time rate", "Receipts recognised automatically by Scan & Herken"]}, "businessKPI": {"northStar": "Annual recurring revenue from creative sole proprietors", "revenueStreams": ["Eenmanszaak subscription at EUR 840 per year, invoiced monthly", "Bank connection add-on at EUR 5 per month per account", "Partner income tax return at EUR 125 incl. VAT"], "supporting": ["New creative clients per month", "New creative clients via partner or referral"]}, "milestones": ["Raise Scan & Herken recognition on small retail receipts and e-mail-in invoices so most creative expense bookings need no manual correction", "Warn clients in the app before a Ponto consent expires so bank syncs never silently stop", "Launch member-benefit pages and client stories with each creative association and track intro calls per partner"]}, "year3": {"focus": "Near-fully automated administration for standard creative sole proprietors with bookkeeper review by exception: booking rules learned per client, invoices and payments reconciled without touch, e-invoicing and Peppol ready, and the tax reservation on the dashboard trusted enough to replace the annual scare.", "productTheme": "Automated administration, human review by exception", "customerKPI": {"northStar": "Hours spent on administration per month", "supporting": ["Bank transactions matched automatically", "Unexpected tax bill incidence"]}, "businessKPI": {"northStar": "Annual recurring revenue from creative sole proprietors", "revenueStreams": ["Eenmanszaak subscriptions with a rising share of bank connection add-ons", "Partner programme benefits with insurers, pension and crowdfunding partners", "Quotes and invoices with e-invoicing as standard"], "supporting": ["Annual creative client churn rate", "Bookkeeper hours per creative client per year"]}, "milestones": ["Learn booking rules per client so recurring suppliers and subscriptions are booked and matched without review", "Bring the tax reservation deviation for creative clients below ten percent with quarterly reservation nudges", "Ship e-invoicing over Peppol for quotes and invoices ahead of the EU ViDA timeline"]}, "year5": {"focus": "Continuous, AI-assisted bookkeeping with a human guarantee for creatives: the real-time tax position of every client, agentic booking and drafting of returns supervised by the bookkeeper, and proactive advice on investments, grants and licence income that no software-only tool offers.", "productTheme": "Real-time tax position with a bookkeeper's guarantee", "customerKPI": {"northStar": "Hours spent on administration per month", "supporting": ["Tax reservation deviation from final assessment", "Clients setting aside the income tax reservation monthly"]}, "businessKPI": {"northStar": "Annual recurring revenue from creative sole proprietors", "revenueStreams": ["Eenmanszaak subscriptions across the national creative freelancer base", "Financial-home add-ons through partners: insurance, pension, financing", "Advisory moments on investments, grants and licence income"], "supporting": ["Active creative sole proprietor clients", "Creative clients leaving for software-only tools"]}, "milestones": ["Deliver agentic drafting of VAT and income tax returns for creative clients, reviewed and filed by their personal bookkeeper", "Offer a real-time tax position and reservation advice per client on web and mobile, updated with every booking", "Make Kees the financial home of the creative freelancer with partner insurance, pension and financing inside the app"]}}}, "domain": "Freelancers and Sole Proprietors"};

    const customerInsights = [{"id": "fbs-01", "title": "A fixed yearly fee per legal form, invoiced monthly, is the promise that makes a personal bookkeeper affordable and predictable", "summary": "Kees de Boekhouder prices its service as a fixed yearly subscription per legal form, invoiced monthly and excluding VAT: \u20ac840 for an eenmanszaak, \u20ac1,140 for a VOF with two partners plus \u20ac100 per extra partner, and through the sister company Founders \u20ac1,750 for a holding BV and \u20ac2,450 for a werkmaatschappij. The fee includes the personal bookkeeper, the app, the quarterly VAT returns, the annual accounts and the income tax return; the FAQ lists add-ons separately (partner income tax return \u20ac125 incl. VAT, payroll \u20ac17.50 per payslip, bank connection \u20ac5 per account per month). The home page frames the sole-proprietor plan as \u20ac70 per month.", "implication": "Margin depends on how many clients one bookkeeper can serve well, not on billable hours: every product decision \u2014 recognition, matching, review tooling, self-service answers \u2014 should be judged by bookkeeper minutes saved per client per year, and plan rules (first full fiscal year, one-month notice afterwards) must be encoded in billing rather than handled by hand.", "priority": "high", "tags": ["pricing", "business-model", "subscription"], "sources": [{"id": "kdb-faq", "title": "Veelgestelde vragen \u2014 pricing, plans, cancellation and add-ons", "url": "https://www.keesdeboekhouder.nl/nl/faq/", "publisher": "Kees de Boekhouder", "date": "2026-09-05"}, {"id": "kdb-home", "title": "Kees de Boekhouder \u2014 personal bookkeeper and app for freelancers", "url": "https://www.keesdeboekhouder.nl/", "publisher": "Kees de Boekhouder", "date": "2026-09-05"}, {"id": "founders-prices", "title": "Founders \u2014 prices for holding and operating companies", "url": "https://www.founders.nl/en/prices/", "publisher": "Founders Finance B.V.", "date": "2026-09-05"}], "link": {"customerId": "crfr", "jobIds": ["jtbd-crfr-2"], "kpiIds": ["co-crfr-top", "bo-crfr-top"]}}, {"id": "fbs-02", "title": "Software captures the administration at the source so that the client's effort is a photo, an invoice and a glance at the dashboard", "summary": "The 'wat we doen' page describes the division of labour: the client photographs or uploads receipts and purchase invoices (Scan & Herken recognises them), sends quotes and invoices from the app under one or more trading names, and sees revenue per quarter, cost categories, investments, profit and the VAT to pay or receive on a dashboard that updates as bookings are submitted; the bookkeeper checks the administration, files the quarterly VAT return, prepares the annual accounts and files the income tax return. Documents are stored in the app and deadline reminders are sent.", "implication": "The client app is the intake funnel for the bookkeeper, so recognition quality, categorisation defaults and reminder timing are bookkeeper-productivity features as much as client features; measure 'hours on administration per month' on the client side and 'review turnaround' on the bookkeeper side against the same bookings.", "priority": "high", "tags": ["product", "capture", "automation"], "sources": [{"id": "kdb-wat-we-doen", "title": "Wat we doen \u2014 what the bookkeeper and the app do for you", "url": "https://www.keesdeboekhouder.nl/nl/wat-we-doen/", "publisher": "Kees de Boekhouder", "date": "2026-09-05"}, {"id": "kdb-dashboard", "title": "Dashboard \u2014 real-time insight into revenue, costs, profit and VAT", "url": "https://www.keesdeboekhouder.nl/nl/onze-tool/dashboard/", "publisher": "Kees de Boekhouder", "date": "2026-09-05"}], "link": {"customerId": "crfr", "jobIds": ["jtbd-crfr-1", "jtbd-crfr-3"], "kpiIds": ["co-crfr-top", "co-crfr-b1"]}}, {"id": "fbs-03", "title": "The Ponto bank connection syncs four times a day and matches automatically, but re-authorisation every 90 to 180 days is a recurring friction", "summary": "The bank connection page explains that Kees connects business bank accounts through Ponto (Isabel Group, a licensed PSD2 provider) to every bank Ponto supports, among them Knab, Rabobank, ABN AMRO and bunq. Transactions are retrieved four times a day and matched automatically against bookings in the administration; what cannot be matched is matched manually or booked directly. The connection costs \u20ac5 per month per connected account and the client must re-authorise the consent every 90 to 180 days depending on the bank.", "implication": "Treat consent expiry as a first-class event: predict it per bank, remind the client before the sync stops and show the bookkeeper which clients have a stale connection, because a silent gap in transactions surfaces as missing bookings at quarter-end review; matching precision is the lever that turns \u20ac5 add-on revenue into review time saved.", "priority": "high", "tags": ["banking", "psd2", "matching"], "sources": [{"id": "kdb-bankkoppeling", "title": "Bankkoppeling \u2014 bank connection through Ponto", "url": "https://www.keesdeboekhouder.nl/nl/onze-tool/bankkoppeling/", "publisher": "Kees de Boekhouder", "date": "2026-09-05"}], "link": {"customerId": "crfr", "jobIds": ["jtbd-crfr-1"], "kpiIds": ["co-crfr-b1"]}}, {"id": "fbs-04", "title": "Roughly 100 people, a large share of them internally trained bookkeepers in three offices, carry the fiscal responsibility for 10,000+ clients", "summary": "The team and vacancy pages present Kees de Boekhouder as a company of roughly 100 people \u2014 bookkeepers, marketers, IT and HR \u2014 working from offices in Amsterdam, Rotterdam and Utrecht, with bookkeepers trained internally in the company's own method and technology and backed up by colleagues. The home page states that the company has served more than 10,000 entrepreneurs throughout the Netherlands over 15 years; the Head of Growth vacancy confirms the ~100 staff and 10,000 clients and the ambition to grow to 20,000.", "implication": "The number of clients one bookkeeper serves per week is the domain's unit of scale: capacity must be planned per office with backup coverage, internal training must be a product (knowledge base, QA checks), and growth to 20,000 clients must not double the bookkeeper headcount \u2014 the workspace, not the hiring plan, has to absorb most of the growth.", "priority": "high", "tags": ["operations", "capacity", "company"], "sources": [{"id": "kdb-team", "title": "Team \u2014 the people behind Kees de Boekhouder", "url": "https://www.keesdeboekhouder.nl/team/", "publisher": "Kees de Boekhouder", "date": "2026-09-05"}, {"id": "kdb-vacatures", "title": "Vacatures \u2014 working at Kees de Boekhouder", "url": "https://www.keesdeboekhouder.nl/nl/vacatures/", "publisher": "Kees de Boekhouder", "date": "2026-09-05"}, {"id": "kdb-home", "title": "Kees de Boekhouder \u2014 personal bookkeeper and app for freelancers", "url": "https://www.keesdeboekhouder.nl/", "publisher": "Kees de Boekhouder", "date": "2026-09-05"}, {"id": "topofminds-hog", "title": "Vacature Head of Growth \u2014 Kees de Boekhouder", "url": "https://topofminds.com/vacature-head-of-growth-kees-de-boekhouder/", "publisher": "Top of Minds", "date": "2026-09-05"}], "link": {"customerId": "crfr", "jobIds": ["jtbd-crfr-2"], "kpiIds": ["co-crfr-b2"]}}, {"id": "fbs-05", "title": "Vortex's 2022 buyout backs a loyal, ambassador-driven client base and the professionalisation of leadership and technology", "summary": "On 24 May 2022 Vortex Capital Partners announced a stake in Kees de Boekhouder, then serving more than 6,500 clients, in a buyout that Accountancy Vanmorgen reported the next day. CEO and co-founder Kees Monteban spoke of solving administrative challenges for entrepreneurs nationwide, and Vortex partner Joost Moerland pointed to the loyal customer base whose clients act as brand ambassadors. Vortex's investment page now reports more than 10,000 clients and a revenue CAGR above 25 percent, and describes its focus as reinforcing leadership, organisational structure and professionalising the technology function, with the ambition to make Kees the go-to brand for bookkeeping services.", "implication": "Retention and referral are the growth engine the investor bought: measure churn and referred-client activation as north-star inputs, keep the personal bookkeeper visible in every scaling decision, and give the professionalised technology function a roadmap that is explicitly about bookkeeper leverage rather than feature parity with software-only tools.", "priority": "high", "tags": ["company", "growth", "investor"], "sources": [{"id": "vortex-news-2022", "title": "Kees de Boekhouder finds new strategic partner in Vortex", "url": "https://vortexcp.com/news/kees-de-boekhouder-finds-new-strategic-partner-in-vortex/", "publisher": "Vortex Capital Partners", "date": "2022-05-24"}, {"id": "avm-2022", "title": "Investeerder Vortex neemt belang in Kees de Boekhouder", "url": "https://www.accountancyvanmorgen.nl/2022/05/25/investeerder-vortex-neemt-belang-in-kees-de-boekhouder/", "publisher": "Accountancy Vanmorgen", "date": "2022-05-25"}, {"id": "vortex-kdb", "title": "Kees de Boekhouder \u2014 Vortex investment page", "url": "https://vortexcp.com/investment/kees-de-boekhouder/", "publisher": "Vortex Capital Partners", "date": "2026-09-05"}], "link": {"customerId": "crfr", "jobIds": ["jtbd-crfr-2"], "kpiIds": ["bo-crfr-top"]}}, {"id": "fbs-08", "title": "Shrinking deductions and the \u20ac20,000 KOR threshold make correct, timely tax advice worth more per euro than ever", "summary": "MKB Servicedesk reports that the zelfstandigenaftrek is reduced to \u20ac1,200 in 2026 and will fall further to \u20ac900 in 2027, continuing the phased reduction of the self-employed deduction. KVK explains the kleineondernemersregeling (KOR): entrepreneurs with turnover up to \u20ac20,000 per year can opt out of VAT obligations, which removes VAT returns but also the right to deduct input VAT. Kees' starters page positions guidance on the VAT number, KOR and startersaftrek as part of the Starters package.", "implication": "The deduction advice a bookkeeper gives is becoming a decision service (KOR yes or no, hours criterion, startersaftrek timing, mkb-winstvrijstelling) rather than a line on the return; encode these rules in the knowledge base with effective dates so every bookkeeper gives the same answer and the app can flag clients near the KOR threshold or the hours criterion before year-end.", "priority": "medium", "tags": ["regulation", "deductions", "advice"], "sources": [{"id": "mkb-zelfstandigenaftrek-2026", "title": "Zelfstandigenaftrek 2026 verlaagd", "url": "https://www.mkbservicedesk.nl/nieuws/ondernemersnieuws/zelfstandigenaftrek-2026-verlaagd", "publisher": "MKB Servicedesk", "date": "2026-09-05"}, {"id": "kvk-kor", "title": "Kleineondernemersregeling (KOR) gebruiken", "url": "https://www.kvk.nl/geldzaken/kleineondernemersregeling-gebruiken/", "publisher": "KVK (Netherlands Chamber of Commerce)", "date": "2026-09-05"}, {"id": "kdb-starters", "title": "Bookkeeper for starters \u2014 the Starters package", "url": "https://www.keesdeboekhouder.nl/en/bookkeeper-starters/", "publisher": "Kees de Boekhouder", "date": "2026-09-05"}], "link": {"customerId": "crfr", "jobIds": ["jtbd-crfr-2"], "kpiIds": ["co-crfr-b2"]}}, {"id": "fbs-10", "title": "A free intro call, a mutual-fit check and a no-external-software rule keep onboarding personal and the administration on one platform", "summary": "Kees describes its onboarding as a free introduction via Google Meet in which both sides check whether they fit, after which the client gets access to the app and a personal bookkeeper. Clients switching from a previous bookkeeper supply digital copies of earlier returns so the administration continues without gaps. The FAQ states that administrations kept in external accounting software are not accepted, that multiple trading names can be run in one administration, that the first subscription covers a full fiscal year, and that thereafter clients can cancel monthly with one calendar month's notice.", "implication": "The fit check is a deliberate filter: track intro-to-active conversion together with first-year retention so that sales does not win clients the bookkeepers cannot serve well; make the switch service (importing history, mapping old categories) a repeatable product because every switched client arrives with an administration that must be reconciled before the first VAT return.", "priority": "medium", "tags": ["onboarding", "switching", "policy"], "sources": [{"id": "kdb-faq", "title": "Veelgestelde vragen \u2014 pricing, plans, cancellation and add-ons", "url": "https://www.keesdeboekhouder.nl/nl/faq/", "publisher": "Kees de Boekhouder", "date": "2026-09-05"}, {"id": "kdb-wat-we-doen", "title": "Wat we doen \u2014 what the bookkeeper and the app do for you", "url": "https://www.keesdeboekhouder.nl/nl/wat-we-doen/", "publisher": "Kees de Boekhouder", "date": "2026-09-05"}, {"id": "kdb-home", "title": "Kees de Boekhouder \u2014 personal bookkeeper and app for freelancers", "url": "https://www.keesdeboekhouder.nl/", "publisher": "Kees de Boekhouder", "date": "2026-09-05"}], "link": {"customerId": "crfr", "jobIds": ["jtbd-crfr-1"], "kpiIds": ["bo-crfr-b1"]}}, {"id": "fbs-11", "title": "Professional associations and service providers concentrate the creative freelancer audience and lower acquisition cost through member benefits", "summary": "The partners page lists referral partnerships with voordekunst, BNO, Insify, DuPho, Unfair, Kunstenbond, BrightPensioen and DAS, and with Stichting BOK, which has more than 2,300 members and whose members join without administration costs and with three months free; BrightPensioen members receive a \u20ac50 discount. The home page and testimonials feature creative clients \u2014 a furniture designer, a stylist, a make-up artist, an artist and a pair of bakers \u2014     function jobNamesForCustomer(jobIds) {
        const jobs = (customer.jobsToBeDone || []);
        const jobLookup = {};
        jobs.forEach(job => {
            if (job.id) {
                jobLookup[job.id] = job.name || job.id;
            }
        });
        return (jobIds || []).map(jobId => jobLookup[jobId] || jobId);
    }

    function kpiNamesForLink(link) {
        // Prefer stable KPI IDs resolved against this customer's KPI pyramid; fall back to legacy display-name kpis.
        if (link && link.kpiIds && link.kpiIds.length) {
            const lookup = {};
            function walk(node) {
                if (!node) return;
                if (node.id) {
                    lookup[node.id] = node.name || node.id;
                }
                (node.branches || []).forEach(walk);
                (node.children || []).forEach(walk);
            }
            const pyramids = (customer || {}).kpiPyramids || {};
            ['customerOutcomes', 'businessOutcomes'].forEach(key => {
                const pyramid = pyramids[key];
                if (!pyramid) return;
                walk(pyramid.top);
                (pyramid.branches || []).forEach(walk);
            });
            return link.kpiIds.map(kpiId => lookup[kpiId] || kpiId);
        }
        return (link && link.kpis) || [];
    }

    function addInsights() {
        let html = '';

        html += '<div style="margin: 24px">';

        if (!customerInsights || customerInsights.length === 0) {
            html += '<div class="group">No customer-linked insights defined for this domain yet.</div>';
        } else {
            customerInsights.forEach(insight => {
                html += '<div class="group" style="width: 250px; display: inline-block; margin: 8px; padding: 16px; background: white">';
                html += '<div style="font-size: 150%; color: #1d4ed8; margin-bottom: 8px">' + escapeHtml(insight.title) + '</div>';
                html += '<div style="margin-bottom: 10px">' + escapeHtml(insight.summary) + '</div>';
                if (insight.implication) {
                    html += '<div style="margin-bottom: 10px"><b>Product implication:</b> ' + escapeHtml(insight.implication) + '</div>';
                }
                if (insight.link) {
                    if (insight.link.jobIds && insight.link.jobIds.length) {
                        html += '<div style="font-size: 13px; color: #4b5563; margin-bottom: 4px"><b>Jobs:</b> ' + escapeHtml(jobNamesForCustomer(insight.link.jobIds).join(', ')) + '</div>';
                    }
                    const kpiNames = kpiNamesForLink(insight.link);
                    if (kpiNames.length) {
                        html += '<div style="font-size: 13px; color: #4b5563; margin-bottom: 4px"><b>KPIs:</b> ' + escapeHtml(kpiNames.join(', ')) + '</div>';
                    }
                }
                if (insight.tags && insight.tags.length) {
                    html += '<div style="margin-top: 8px; margin-bottom: 10px">';
                    insight.tags.forEach(tag => {
                        html += '<span style="display:inline-block; margin:0 8px 6px 0; padding:4px 10px; border-radius:999px; background:#eef2f6; font-size:12px">' + escapeHtml(tag) + '</span>';
                    });
                    html += '</div>';
                }
                if (insight.sources && insight.sources.length) {
                    html += '<div style="margin-top: 8px">';
                    html += '<div style="font-size: 13px; color: #6b7280; margin-bottom: 4px">Sources</div>';
                    insight.sources.forEach(source => {
                        html += '<div style="font-size: 13px; margin-bottom: 4px">';
                        html += '<a class="activity-link" target="_blank" href="' + escapeHtml(source.url) + '">' + escapeHtml(source.title) + '</a>';
                        html += '<span class="activity-muted"> (' + escapeHtml(source.publisher || '') + (source.date ? ', ' + escapeHtml(source.date) : '') + ')</span>';
                        html += '</div>';
                    });
                    html += '</div>';
                }
                html += '</div>';
            });
        }
        html += '</div>';

        document.getElementById('Insights').innerHTML = html;
    }

    function kpiIconFile(node) {
        return (node && node.icon) ? node.icon : 'kpi.png';
    }

    function kpiCurrentValue(node) {
        if (!node || !node.currentValue) {
            return '';
        }
        return String(node.currentValue) + (node.unit ? ' (' + String(node.unit) + ')' : '');
    }

    function kpiValueStatusLabel(node) {
        if (!node || !node.valueStatus) {
            return '';
        }
        const labels = {
            example: 'illustrative example',
            baseline: 'measured baseline',
            target: 'target',
            placeholder: 'placeholder'
        };
        return labels[node.valueStatus] || String(node.valueStatus);
    }

    function renderKpiMeta(node) {
        let html = '';
        if (node && node.currentValue) {
            const statusLabel = kpiValueStatusLabel(node);
            const valueLabel = (node.valueStatus === 'target') ? 'Target:' : 'Current:';
            html += '<div style="font-size: 80%; color: #1d4ed8; margin-top: 4px"><b>' + valueLabel + '</b> ' + escapeHtml(kpiCurrentValue(node));
            if (statusLabel) {
                html += ' <span style="color:#888; font-style: italic;">(' + escapeHtml(statusLabel) + ')</span>';
            }
            html += '</div>';
        }
        if (node && node.target) {
            html += '<div style="font-size: 80%; color: #047857; margin-top: 2px"><b>Target:</b> ' + escapeHtml(String(node.target)) + '</div>';
        }
        if (node && node.guardrailRole) {
            html += '<div style="font-size: 78%; color: #b91c1c; margin-top: 2px"><b>Guardrail:</b> ' + escapeHtml(String(node.guardrailRole)) + '</div>';
        }
        if (node && (node.period || node.calculationMethod || node.valueSource)) {
            html += '<div style="font-size: 76%; color: #6b7280; margin-top: 3px">';
            if (node.period) { html += '<div><b>Period:</b> ' + escapeHtml(String(node.period)) + '</div>'; }
            if (node.calculationMethod) { html += '<div><b>How measured:</b> ' + escapeHtml(String(node.calculationMethod)) + '</div>'; }
            if (node.valueSource) { html += '<div><b>Value source:</b> ' + escapeHtml(String(node.valueSource)) + '</div>'; }
            html += '</div>';
        }
        if (node && node.guardrail) {
            html += '<div style="font-size: 76%; color: #7c3aed; margin-top: 3px"><b>Composite guardrail:</b> ' + escapeHtml(String(node.guardrail)) + '</div>';
        }
        if (node && node.link) {
            html += '<div style="font-size: 80%; margin-top: 4px"><a target="_blank" rel="noopener noreferrer" href="' + escapeHtml(node.link) + '">' + escapeHtml(node.linkLabel || 'Open link') + '</a></div>';
        }
        return html;
    }

        const normalized = Object.assign({}, value);

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function formatDate(dateValue) {
        if (!dateValue) return 'No date';
        const date = new Date(dateValue + 'T00:00:00');
        if (isNaN(date.getTime())) return dateValue;
        return date.toLocaleDateString('en-GB', {year: 'numeric', month: 'short', day: 'numeric'});
    }

    function renderKpis(items) {
        let html = '';
        items.forEach(item => {
            html += '<div><b>' + escapeHtml(item.kpi) + '</b>';
            if (item.unit) {
                html += ' <span class="activity-muted">(' + escapeHtml(item.unit) + ')</span>';
            }
            if (item.expectedImpact) {
                html += ': ' + escapeHtml(item.expectedImpact);
            }
            if (item.currentValue) {
                html += '<div class="activity-muted"><b>Current:</b> ' + escapeHtml(String(item.currentValue)) + '</div>';
            }
            if (item.description) {
                html += '<div class="activity-muted">' + escapeHtml(item.description) + '</div>';
            }
            if (item.link) {
                html += '<div class="activity-muted"><a target="_blank" rel="noopener noreferrer" href="' + escapeHtml(item.link) + '">' + escapeHtml(item.linkLabel || 'Open link') + '</a></div>';
            }
            html += '</div>';
        });
        return html;
    }

    function renderImpactCell(item, currentCustomerId) {
        let html = '';
        (item.customerImpact || []).forEach(impact => {
            const isCurrent = impact.customerId === currentCustomerId;
            html += '<div class="activity-block' + (isCurrent ? ' activity-pill-highlight' : '') + '">';
            html += '<div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">';
            html += '<img class="activity-icon activity-icon-round" src="../icons/' + escapeHtml(impact.customer.icon) + '" onerror="this.onerror=null;this.src=\'../icons/customer.png\'">';
            html += '<div><div style="font-weight:bold; color:' + (isCurrent ? '#1d4ed8' : '#111827') + '">' + escapeHtml(impact.customer.name) + ' <span class="activity-muted">(' + escapeHtml(impact.customerId) + ')</span></div></div>';
            html += '</div>';
            html += renderKpis(impact.customerKPIs || []);
            html += renderKpis(impact.businessKPIs || []);
            html += '</div>';
        });
        return html || '<span class="activity-muted">No customer impact listed</span>';
    }

    function renderBrickCell(item) {
        let html = '';
        (item.productBricks || []).forEach(brick => {
            html += '<div class="activity-pill">';
            html += '<img class="activity-icon" src="../../product-bricks/icons/' + escapeHtml(brick.brick.icon) + '" onerror="this.onerror=null;this.src=\'../../product-bricks/icons/logo.png\'">';
            html += '<div><div><b>' + escapeHtml(brick.brick.name) + '</b> <span class="activity-muted">(#' + escapeHtml(brick.brickId) + ')</span></div><div class="activity-muted">' + escapeHtml(brick.change) + '</div></div>';
            html += '</div>';
        });
        return html || '<span class="activity-muted">No product bricks listed</span>';
    }

    function renderChannelCell(item) {
        let html = '';
        (item.deliveryChannels || []).forEach(channel => {
            html += '<div class="activity-pill">';
            html += '<img class="activity-icon" src="../../product-deployments/icons/' + escapeHtml(channel.channel.icon) + '" onerror="this.onerror=null;this.src=\'../../product-deployments/icons/product.png\'">';
            html += '<div><div><b>' + escapeHtml(channel.channel.name) + '</b> <span class="activity-muted">(' + escapeHtml(channel.channelId) + ')</span></div><div class="activity-muted">' + escapeHtml(channel.change) + '</div></div>';
            html += '</div>';
        });
        return html || '<span class="activity-muted">No delivery channels listed</span>';
    }

    function renderActivityTable(data, kind, currentCustomerId) {
        const items = (data && data.items) ? data.items : [];
        let html = '';
        html += '<div class="activity-summary">';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.length + '</div><div class="activity-stat-label">' + kind + '</div></div>';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.filter(item => (item.customerImpact || []).length > 0).length + '</div><div class="activity-stat-label">With customer impact</div></div>';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.filter(item => (item.productBricks || []).length > 0).length + '</div><div class="activity-stat-label">With bricks</div></div>';
        html += '</div>';

        if (!items.length) {
            html += '<div class="group" style="margin-top:0">No related ' + kind.toLowerCase() + ' found for this customer.</div>';
            return html;
        }

        html += '<table class="activity-table">';
        html += '<tr><th>Date</th><th>Description</th><th>Customer Impact</th><th>Product Bricks</th><th>Delivery Channels</th></tr>';
        items.forEach(item => {
            html += '<tr>';
            html += '<td style="white-space:nowrap">' + escapeHtml(formatDate(item.date)) + '</td>';
            html += '<td><a class="activity-link" target="_blank" rel="noopener noreferrer" href="../../' + kind.toLowerCase() + '/landing_pages/' + item.landingPageIndex + '.html">' + escapeHtml(item.description || item.name || kind) + '</a></td>';
            html += '<td>' + renderImpactCell(item, currentCustomerId) + '</td>';
            html += '<td>' + renderBrickCell(item) + '</td>';
            html += '<td>' + renderChannelCell(item) + '</td>';
            html += '</tr>';
        });
        html += '</table>';
        return html;
    }

    addHeader();
    addHome();
    addJBTD();
    addJourneys();
    addKPIs();
    addProductVision();
    addInsights();


</script>

<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Freelancer Bookkeeping Service Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Customers"
    },
    {
      "label": "Creative Freelancer"
    }
  ]
};
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>

</body>
</html>
