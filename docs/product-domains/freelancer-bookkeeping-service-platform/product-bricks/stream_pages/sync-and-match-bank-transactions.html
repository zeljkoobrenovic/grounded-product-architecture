    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

e", "actor": "Knowledge Freelancer", "keyFacts": ["Transactions are imported from the consent date (and as far back as the bank allows) and the four-times-daily sync is scheduled; the client sees the balance and the transaction list in the app.", "Imported transactions are deduplicated against anything the client entered manually before the connection."], "painPoints": ["Manual transactions entered before the connection appear twice unless deduplicated.", "Banks that provide limited history leave a gap at the start of the quarter."], "dependencies": [{"type": "brick", "id": "bank", "name": "Bank Connection (Ponto PSD2)", "description": "Initial import and schedule.", "how": "Imports the history and schedules the sync four times a day."}, {"type": "brick", "id": "intg", "name": "Integration and API Gateway (Ponto, Belastingdienst, KVK, e-mail, payments)", "description": "Transaction API.", "how": "Fetches transactions from Ponto."}]}, {"id": "match-transactions-automatically", "title": "Match transactions automatically against bookings", "actor": "Knowledge Freelancer", "keyFacts": ["The matching engine pairs incoming payments with open invoices and outgoing payments with expense bookings and the Kees subscription invoice, using amount, date, counterparty and reference; matches above a confidence threshold are applied automatically.", "Recurring counterparties (phone, insurance, software) are learned so their next transaction is matched and booked without a receipt prompt beyond the first."], "painPoints": ["Round amounts from the same counterparty on the same day can be matched to the wrong invoice.", "A low threshold creates wrong matches that the bookkeeper has to undo; a high one leaves too much manual work."], "dependencies": [{"type": "brick", "id": "mtch", "name": "Transaction Matching Engine", "description": "Automatic matching.", "how": "Matches transactions to invoices, expenses and subscription invoices."}, {"type": "brick", "id": "invc", "name": "Invoices, Credit Notes and Trading Names", "description": "Open invoices.", "how": "Provides open invoices as match candidates."}, {"type": "brick", "id": "expn", "name": "Expense and Purchase Booking", "description": "Expense bookings.", "how": "Provides expense bookings as match candidates."}]}, {"id": "review-the-unmatched-list", "title": "Review the unmatched list and book directly from a transaction", "actor": "Knowledge Freelancer", "keyFacts": ["The remaining transactions appear as a list; the client matches them to an existing booking, books them directly as an expense or revenue with category and VAT, or marks them private.", "A receipt can be photographed from the transaction so the document and the booking are created together."], "painPoints": ["Clients mark too much as private to make the list disappear.", "Direct bookings without a receipt are fine for small amounts but leave larger ones without evidence."], "dependencies": [{"type": "brick", "id": "mtch", "name": "Transaction Matching Engine", "description": "Manual matching.", "how": "Lets the client match or split a transaction."}, {"type": "brick", "id": "expn", "name": "Expense and Purchase Booking", "description": "Book from transaction.", "how": "Creates an expense booking from the transaction."}, {"type": "brick", "id": "ledg", "name": "General Ledger and Booking Rules", "description": "Posting.", "how": "Posts the resulting bookings."}]}, {"id": "confirm-the-reconciled-bank-position", "title": "Confirm the reconciled bank position for the bookkeeper", "actor": "Personal Bookkeeper", "keyFacts": ["The bookkeeper sees the bank balance reconciled to the ledger, the count of unmatched transactions and the private items, and can question any of them from the client file.", "A reconciled bank account is the precondition for the quarterly VAT check."], "painPoints": ["Bookkeepers who reconcile from PDF statements spend hours per client per quarter.", "Unmatched transactions older than a quarter are rarely explained."], "dependencies": [{"type": "brick", "id": "bkws", "name": "Bookkeeper Client File and Review Queue", "description": "Bank reconciliation view.", "how": "Shows the reconciled position and unmatched items per client."}, {"type": "brick", "id": "ntfy", "name": "Deadlines, To-dos and Notifications", "description": "Unmatched to-do.", "how": "Creates to-dos for unmatched transactions the client must explain."}]}]}, {"id": "keep-the-connection-alive-and-re-authorise", "title": "Keep the Connection Alive and Re-authorise", "description": "The consent nears its 90 to 180 day expiry: the client is warned, re-authorises at the bank, the sync resumes and any gap is backfilled; a bank that changed its consent flow or an account that was closed is handled without losing the matching history.", "primaryActor": "Knowledge Freelancer", "trigger": "A consent is about to expire, a sync fails, or the client changes bank or closes an account.", "successSignal": "The connection is re-authorised before expiry or restored with a backfilled gap, and the matching history and add-on billing are correct.", "steps": [{"id": "warn-before-consent-expiry", "title": "Warn the client before the consent expires", "actor": "Knowledge Freelancer", "keyFacts": ["The client receives a push and e-mail notification two weeks and again a few days before the 90 to 180 day consent expires, with a one-tap re-authorisation link.", "The bookkeeper sees which clients have connections expiring before the next VAT deadline."], "painPoints": ["Expiries that fall in the holiday period are missed and the quarter starts with a gap.", "Clients ignore a warning that does not say what happens if they do nothing."], "dependencies": [{"type": "brick", "id": "ntfy", "name": "Deadlines, To-dos and Notifications", "description": "Expiry warnings.", "how": "Schedules the warnings from the consent expiry date."}, {"type": "brick", "id": "bank", "name": "Bank Connection (Ponto PSD2)", "description": "Consent expiry tracking.", "how": "Tracks the expiry per connection."}]}, {"id": "re-authorise-at-the-bank", "title": "Re-authorise at the bank through Ponto", "actor": "Knowledge Freelancer", "keyFacts": ["The client repeats the consent flow at the bank via Ponto; the connection keeps its identity so matching history and learned counterparties are preserved.", "Re-authorisation works from the mobile app in a minute when the bank's app is on the same phone."], "painPoints": ["Banks that change their consent flow between authorisations confuse clients who expect the previous screens.", "A re-authorisation that creates a new connection instead of renewing the old one duplicates history."], "dependencies": [{"type": "brick", "id": "intg", "name": "Integration and API Gateway (Ponto, Belastingdienst, KVK, e-mail, payments)", "description": "Renewal redirect.", "how": "Runs the Ponto renewal flow and returns the new expiry."}, {"type": "brick", "id": "bank", "name": "Bank Connection (Ponto PSD2)", "description": "Consent renewal.", "how": "Updates the connection's consent without changing its identity."}, {"type": "brick", "id": "mobi", "name": "Mobile App Shell (iOS/Android)", "description": "Renewal from the app.", "how": "Runs the flow in the app."}]}, {"id": "backfill-the-gap-after-a-lapse", "title": "Backfill the gap after a lapsed consent", "actor": "Knowledge Freelancer", "keyFacts": ["If the consent lapsed, the sync fetches the missed period from the bank as far as allowed and deduplicates against manually entered transactions; remaining gaps are shown to the client.", "Transactions in the gap go through the same automatic matching."], "painPoints": ["Banks with short history windows leave permanent gaps that must be filled from statements.", "Clients who entered transactions manually during the lapse get duplicates unless deduplication is exact."], "dependencies": [{"type": "brick", "id": "bank", "name": "Bank Connection (Ponto PSD2)", "description": "Gap backfill.", "how": "Fetches the missed period and reports remaining gaps."}, {"type": "brick", "id": "mtch", "name": "Transaction Matching Engine", "description": "Matching of backfilled transactions.", "how": "Matches the backfilled transactions and deduplicates."}]}, {"id": "handle-a-sync-failure-or-bank-change", "title": "Handle a sync failure, a closed account or a bank change", "actor": "Personal Bookkeeper", "keyFacts": ["Failed syncs are retried and surfaced to the client and bookkeeper if they persist; a closed account is ended with its history kept, and a new bank is connected as a new account.", "The add-on billing follows the number of active connections."], "painPoints": ["Silent sync failures are discovered at the quarterly check, weeks later.", "Closed accounts that are still billed at \u20ac5 per month break trust."], "dependencies": [{"type": "brick", "id": "bank", "name": "Bank Connection (Ponto PSD2)", "description": "Connection lifecycle.", "how": "Ends closed accounts, records failures and adds new banks."}, {"type": "brick", "id": "subs", "name": "Subscription Plans, Billing and Cancellation", "description": "Billing follows connections.", "how": "Adjusts the \u20ac5 per account add-on."}, {"type": "brick", "id": "bkws", "name": "Bookkeeper Client File and Review Queue", "description": "Connection health per client.", "how": "Shows the bookkeeper which clients have broken connections."}]}, {"id": "confirm-the-quarter-is-complete", "title": "Confirm the quarter's bank data is complete before the VAT check", "actor": "Personal Bookkeeper", "keyFacts": ["Before the quarterly check the bookkeeper confirms per client that connections were active for the whole quarter, gaps are filled and the unmatched list is empty or explained.", "Clients without a bank connection are asked for statements or manual entries instead."], "painPoints": ["A quarter with a two-week gap that nobody noticed produces a VAT return that misses revenue.", "Clients without a connection are the ones that take the longest to check."], "dependencies": [{"type": "brick", "id": "bkws", "name": "Bookkeeper Client File and Review Queue", "description": "Completeness confirmation.", "how": "Records that bank data is complete for the quarter."}, {"type": "brick", "id": "ledg", "name": "General Ledger and Booking Rules", "description": "Reconciled ledger.", "how": "Provides the reconciled bank ledger for the VAT preparation."}]}]}], "outcomes": ["Bank transactions arrive four times a day and the large majority are matched to bookings automatically, so completeness is a short list, not a search", "Re-authorisation every 90 to 180 days is done on time by the client, so no quarter starts with a broken connection", "Unmatched transactions become bookings in one tap, giving the bookkeeper a fully reconciled bank account at the quarterly check"], "brickDependencies": [{"targetBrickId": "bank", "type": "composition"}, {"targetBrickId": "mtch", "type": "composition"}, {"targetBrickId": "intg", "type": "composition"}, {"targetBrickId": "ntfy", "type": "composition"}, {"targetBrickId": "mobi", "type": "composition"}, {"targetBrickId": "expn", "type": "composition"}, {"targetBrickId": "invc", "type": "composition"}, {"targetBrickId": "ledg", "type": "composition"}, {"targetBrickId": "bkws", "type": "composition"}, {"targetBrickId": "subs", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "Ponto (Isabel Group) PSD2 platform", "type": "open-banking-provider", "interface": "PSD2 account-information consent flow and transaction API", "description": "Ponto's licensed PSD2 account-information service that connects Knab, Rabobank, ABN AMRO, bunq and other Ponto-connected banks to the client administration, delivers transactions four times a day and requires the client to re-authorise every 90 to 180 days."}, {"system": "Dutch Business Banks", "type": "bank", "interface": "Online banking consent screens and transaction data behind the Ponto connection", "description": "The client's business bank (Knab, Rabobank, ABN AMRO, bunq and others) where the freelancer approves the PSD2 consent and whose transactions Ponto synchronises; without a connection, clients upload or enter transactions themselves."}, {"system": "Apple App Store and Google Play", "type": "app-distribution-platform", "interface": "App distribution, review and push notification services", "description": "The mobile app stores through which the iOS and Android client app is distributed and updated, and the push notification services that deliver deadline and to-do alerts to the freelancer's phone."}, {"system": "E-mail provider", "type": "messaging-gateway", "interface": "Transactional and inbound e-mail", "description": "Delivers deadline reminders, to-dos, invoice and quote e-mails, payment reminders, bookkeeper messages and onboarding communication to clients, and receives receipts and purchase invoices forwarded by e-mail into the administration."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []};

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;

                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());

            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right; color: darkred">Pain Points</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkred">';
                if ((step.painPoints || []).length) {
                    html += '<ul class="flow-insight-list">' + step.painPoints.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No pain points listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';
            html += '</thead><tbody>';

            dependenciesInFlow.forEach(dependency => {
                const dependencyTypeLabel = 'Product Brick';
                html += '<tr>';
                html += '<td>';
                html += '<div class="flow-dependency-header">';
                html += renderFlowDependencyIcon(dependency, 'flow-dependency-icon');
                html += '<div>';
                html += '<a class="flow-dependency-name" href="../landing_pages/' + escapeHtml(dependency.id) + '.html">' + escapeHtml(dependency.name || dependency.id) + '</a>';
                if (dependency.interface) {
                    html += '<div class="muted">' + escapeHtml(dependency.interface) + '</div>';
                }
                html += '</div>';
                html += '</div>';
                html += '</td>';
                (flow.steps || []).forEach(step => {
                    const stepDependency = getStepDependency(step, dependency);
                    if (!stepDependency) {
                        html += '<td class="flow-cell-empty">-</td>';
                        return;
                    }
                    html += '<td class="flow-cell-active">';
                    html += '<div class="flow-cell-copy">' + escapeHtml(simplifySupportCopy(stepDependency.how || stepDependency.description || 'Supports this step.')) + '</div>';
                    html += '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            html += '</div>';
            html += '</div>';
        });

        document.getElementById('tab_content_flows').innerHTML = html;
    }

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';
        }
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-title">' + escapeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                count++;
                html += '<div class="link-entry">';
                html += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(link.link || '#') + '">'
                    + escapeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>


<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Freelancer Bookkeeping Service Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Streams Index"
    },
    {
      "label": "Sync and Match Bank Transactions"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
