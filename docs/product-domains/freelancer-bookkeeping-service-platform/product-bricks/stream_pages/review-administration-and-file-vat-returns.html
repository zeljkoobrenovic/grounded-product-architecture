    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

 "Personal Bookkeeper", "keyFacts": ["The bookkeeper reviews flagged bookings and samples the rest, corrects VAT codes (9% versus 21%, reverse charge, limited deductibility), moves investments to depreciation and removes private items.", "Corrections are booked with a reason so the client learns and the audit trail explains the change."], "painPoints": ["Reviewing every booking line by line makes the bookkeeper the bottleneck for growth.", "Corrections without a reason are repeated by the client next quarter."], "dependencies": [{"type": "brick", "id": "bkws", "name": "Bookkeeper Client File and Review Queue", "description": "Review workspace.", "how": "Presents flagged and sampled bookings with documents."}, {"type": "brick", "id": "ledg", "name": "General Ledger and Booking Rules", "description": "Corrections with reason.", "how": "Books corrections and reclassifications."}, {"type": "brick", "id": "audt", "name": "Audit Trail, AVG Compliance and Retention", "description": "Review trail.", "how": "Records who changed which booking and why."}]}, {"id": "prepare-the-vat-return", "title": "Prepare the VAT return and the ICP declaration", "actor": "Personal Bookkeeper", "keyFacts": ["The return is prepared from the ledger: output VAT per rate, reverse-charged purchases, input VAT, and the ICP declaration for intra-EU sales; the prepared figures are compared with the dashboard's expected amount and with the previous quarters.", "Anomalies (a large refund, a jump in revenue) are explained before filing."], "painPoints": ["Returns prepared without a comparison to previous quarters miss a missing month of invoices.", "ICP declarations forgotten for a client with one German customer trigger correction letters."], "dependencies": [{"type": "brick", "id": "vatr", "name": "VAT Return Preparation", "description": "Return preparation.", "how": "Builds the return and ICP figures from the ledger and runs plausibility checks."}, {"type": "brick", "id": "vatv", "name": "VAT Position and Tax Reservation View", "description": "Expected versus prepared.", "how": "Compares the prepared amount with the dashboard estimate."}]}, {"id": "four-eyes-check-for-higher-risk-files", "title": "Four-eyes check for higher-risk files", "actor": "Personal Bookkeeper", "keyFacts": ["Files with a refund above a threshold, a first return for a new client, a switch quarter or an unusual anomaly are checked by a colleague before filing; other files are sampled for quality.", "The check result is recorded for the first-time-right measurement."], "painPoints": ["Four-eyes on every return doubles the work; none at all means errors reach the Belastingdienst.", "Backup colleagues who check without context repeat the bookkeeper's review instead of challenging it."], "dependencies": [{"type": "brick", "id": "qaud", "name": "Quality Assurance and Four-eyes Checks", "description": "Risk-based four-eyes.", "how": "Selects files for a second check and records the finding."}, {"type": "brick", "id": "bkws", "name": "Bookkeeper Client File and Review Queue", "description": "Reviewer hand-off.", "how": "Routes the file to the checking colleague and back."}]}, {"id": "file-with-the-belastingdienst", "title": "File with the Belastingdienst and store the acknowledgement", "actor": "Personal Bookkeeper", "keyFacts": ["The return is submitted through the official digital channel; the acknowledgement and the filed copy are stored in the client file and the archive, and the filing task is closed.", "Filing happens as soon as the return is ready, not on deadline day, so the client has time to pay."], "painPoints": ["Submission failures at the tax authority on the last day of the month are the nightmare scenario.", "Returns filed without a stored acknowledgement cannot prove timeliness later."], "dependencies": [{"type": "brick", "id": "bdgw", "name": "Belastingdienst Filing Gateway", "description": "Submission and acknowledgement.", "how": "Submits the return and stores the acknowledgement."}, {"type": "brick", "id": "intg", "name": "Integration and API Gateway (Ponto, Belastingdienst, KVK, e-mail, payments)", "description": "Tax authority channel.", "how": "Handles the connection to the filing channel and retries."}, {"type": "brick", "id": "dlin", "name": "Filing Calendar and Deadline Orchestration", "description": "Task closure.", "how": "Closes the filing task and records the filing date."}]}, {"id": "inform-the-client-of-the-amount-and-deadline", "title": "Inform the client of the amount to pay and the payment deadline", "actor": "Personal Bookkeeper", "keyFacts": ["The client receives the filed amount, the Belastingdienst payment reference and the payment deadline (the same last day of the month) in the app and by e-mail; refunds are explained.", "The next quarter's expectations (for example the consent renewal, an investment to plan) can be added by the bookkeeper."], "painPoints": ["Clients who are told the amount without the payment reference pay wrongly.", "Refunds that arrive weeks later are mistaken for revenue."], "dependencies": [{"type": "brick", "id": "msgc", "name": "Client Messaging, E-mail and Call Log", "description": "Filing message.", "how": "Sends the amount, reference and deadline to the client and logs it."}, {"type": "brick", "id": "ntfy", "name": "Deadlines, To-dos and Notifications", "description": "Payment to-do.", "how": "Creates a payment to-do with the deadline."}]}]}, {"id": "correct-a-filed-return-with-a-supplementary-return", "title": "Correct a Filed Return with a Supplementary Return", "description": "A client finds an unbooked invoice or a large receipt after filing, or the Belastingdienst sends a question: the bookkeeper assesses whether a supplementary return is needed, prepares and files it, and closes the loop with the client.", "primaryActor": "Personal Bookkeeper", "trigger": "A material booking surfaces after the quarter was filed, or a Belastingdienst letter questions a filed return.", "successSignal": "The correction is filed or documented as immaterial, the client understands the consequence and the cause is logged for quality analysis.", "steps": [{"id": "detect-the-late-booking-or-letter", "title": "Detect the late booking or the Belastingdienst letter", "actor": "Personal Bookkeeper", "keyFacts": ["Bookings dated in a filed quarter are flagged automatically; letters from the Belastingdienst are uploaded by the client and appear on the bookkeeper's queue.", "The materiality of the difference is shown against the filed return."], "painPoints": ["Late bookings silently absorbed into the next quarter distort both quarters.", "Clients hold Belastingdienst letters for weeks before forwarding them."], "dependencies": [{"type": "brick", "id": "ledg", "name": "General Ledger and Booking Rules", "description": "Filed-period flag.", "how": "Flags bookings dated in a filed period."}, {"type": "brick", "id": "bkws", "name": "Bookkeeper Client File and Review Queue", "description": "Correction queue.", "how": "Shows late bookings and uploaded letters per client."}]}, {"id": "assess-materiality-and-decide", "title": "Assess materiality and decide on a supplementary return", "actor": "Personal Bookkeeper", "keyFacts": ["The bookkeeper applies the rule of thumb for small differences (corrected in the next return) versus material ones (a supplementary return), and consults the knowledge base for the current thresholds.", "The decision and its reason are recorded on the file."], "painPoints": ["Inconsistent decisions between bookkeepers for similar cases undermine the quality standard.", "Corrections that should have been a supplementary return surface in a later Belastingdienst check."], "dependencies": [{"type": "brick", "id": "vatr", "name": "VAT Return Preparation", "description": "Difference calculation.", "how": "Computes the difference against the filed return."}, {"type": "brick", "id": "qaud", "name": "Quality Assurance and Four-eyes Checks", "description": "Decision standard.", "how": "Applies the quality standard for corrections and records the decision."}]}, {"id": "prepare-and-check-the-supplementary-return", "title": "Prepare and four-eyes check the supplementary return", "actor": "Personal Bookkeeper", "keyFacts": ["The supplementary return is prepared for the original period with the corrected totals, and a colleague checks it as standard because corrections carry higher scrutiny.", "Interest or a penalty consequence is estimated for the client."], "painPoints": ["Supplementary returns prepared as a difference instead of a full corrected return are rejected.", "Clients are not told that a late correction can carry interest."], "dependencies": [{"type": "brick", "id": "vatr", "name": "VAT Return Preparation", "description": "Supplementary return.", "how": "Prepares the corrected return for the period."}, {"type": "brick", "id": "qaud", "name": "Quality Assurance and Four-eyes Checks", "description": "Mandatory second check.", "how": "Records the four-eyes check on the correction."}]}, {"id": "file-the-correction", "title": "File the correction and store the acknowledgement", "actor": "Personal Bookkeeper", "keyFacts": ["The supplementary return is submitted through the official channel, the acknowledgement stored and the calendar records a correction for the period.", "Responses to a Belastingdienst letter are sent with the supporting documents from the archive."], "painPoints": ["A correction filed without a stored acknowledgement reopens the question later.", "Supporting documents assembled from e-mails take hours; from the archive, minutes."], "dependencies": [{"type": "brick", "id": "bdgw", "name": "Belastingdienst Filing Gateway", "description": "Correction submission.", "how": "Submits the supplementary return and stores the acknowledgement."}, {"type": "brick", "id": "intg", "name": "Integration and API Gateway (Ponto, Belastingdienst, KVK, e-mail, payments)", "description": "Filing channel.", "how": "Connects to the tax authority channel."}, {"type": "brick", "id": "dlin", "name": "Filing Calendar and Deadline Orchestration", "description": "Correction record.", "how": "Records the correction against the period."}]}, {"id": "close-the-loop-and-log-the-cause", "title": "Close the loop with the client and log the cause", "actor": "Personal Bookkeeper", "keyFacts": ["The client is told what was corrected, what to pay or expect back and how to avoid it (for example forwarding supplier invoices by e-mail); the cause is coded for the first-time-right analysis.", "Recurring causes feed the internal training and the app's to-do rules."], "painPoints": ["Corrections handled quietly teach the client nothing.", "Causes not coded make quality improvement guesswork."], "dependencies": [{"type": "brick", "id": "msgc", "name": "Client Messaging, E-mail and Call Log", "description": "Correction message.", "how": "Informs the client and logs the conversation."}, {"type": "brick", "id": "qaud", "name": "Quality Assurance and Four-eyes Checks", "description": "Cause coding.", "how": "Codes the cause of the correction for quality analysis."}, {"type": "brick", "id": "audt", "name": "Audit Trail, AVG Compliance and Retention", "description": "Correction trail.", "how": "Keeps the trail of the original and corrected figures."}]}]}], "outcomes": ["Every client's quarterly VAT return is filed before the last day of the month after the quarter, with the payment amount communicated in time", "Review turnaround per client falls as exceptions, not bookings, drive the bookkeeper's work", "Filing first-time-right: supplementary returns and Belastingdienst corrections are rare and traceable to a cause"], "brickDependencies": [{"targetBrickId": "dlin", "type": "composition"}, {"targetBrickId": "bkws", "type": "composition"}, {"targetBrickId": "ledg", "type": "composition"}, {"targetBrickId": "mtch", "type": "composition"}, {"targetBrickId": "vatr", "type": "composition"}, {"targetBrickId": "qaud", "type": "composition"}, {"targetBrickId": "bdgw", "type": "composition"}, {"targetBrickId": "intg", "type": "composition"}, {"targetBrickId": "msgc", "type": "composition"}, {"targetBrickId": "ntfy", "type": "composition"}, {"targetBrickId": "vatv", "type": "composition"}, {"targetBrickId": "audt", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "Belastingdienst digital filing channel for intermediaries", "type": "tax-authority", "interface": "Official digital submission channels for btw-aangifte, inkomstenbelasting, vennootschapsbelasting and loonaangifte, with acknowledgements and assessments", "description": "The Dutch tax authority to which the bookkeeper files quarterly VAT returns, income tax returns, corporate tax returns and payroll tax returns through the official digital channels, and from which assessments, refunds and deadline rules originate."}, {"system": "E-mail provider", "type": "messaging-gateway", "interface": "Transactional and inbound e-mail", "description": "Delivers deadline reminders, to-dos, invoice and quote e-mails, payment reminders, bookkeeper messages and onboarding communication to clients, and receives receipts and purchase invoices forwarded by e-mail into the administration."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []};

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

    function getFlows() {
        return currentStream.flows || [];
    }

    function getFlowDependencies(flow) {
        const dependencyIndex = new Map();
        (flow.steps || []).forEach(step => {
            (step.dependencies || []).forEach(dependency => {
                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());
    }

    function getStepDependency(step, dependency) {
        return (step.dependencies || []).find(item => (item.type || '') === (dependency.type || '') && (item.id || '') === (dependency.id || '')) || null;
    }

    function getPrimaryActors() {
        const streamJobs = currentStream.supportedCustomerJobs || [];
        const allJobs = streamJobs.length ? streamJobs : supported_jobs;

    }

    function summarizeFlow(flow) {
        const steps = flow.steps || [];
        const firstStep = steps[0] || {};
        const lastStep = steps[steps.length - 1] || {};
        return {
            actor: flow.primaryActor || firstStep.actor || '',
            trigger: flow.trigger || firstStep.trigger || '',
            result: flow.successSignal || flow.outcome || lastStep.successSignal || lastStep.output || ''
        };

        }).join('') + '</div>';

                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Outcomes</div>';
        if (!(currentStream.outcomes || []).length) {
            html += '<div class="muted">No outcomes listed for this stream.</div>';
        } else {
            html += '<div class="card"><ul class="list">' + currentStream.outcomes.map(outcome => '<li>' + escapeHtml(outcome) + '</li>').join('') + '</ul></div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Supporting Product Bricks</div>';
        if (!related_bricks.length) {
            html += '<div class="muted">No linked product bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            related_bricks.forEach(brick => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../landing_pages/' + escapeHtml(brick.id) + '.html">';
                html += '<div class="card-meta">' + escapeHtml((brick.group || brick.domain || 'Product Brick')) + '</div>';
                html += '<div class="card-header">';
                html += '<img class="card-icon" src="../icons/' + escapeHtml(brick.id) + '.png" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
                html += '<div class="card-title">' + escapeHtml(brick.name || brick.id) + '</div>';
                html += '</div>';
                html += '<div class="card-copy">' + escapeHtml(brick.description || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Linked Products</div>';
        if (!linked_products.length) {
            html += '<div class="muted">No linked products were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            linked_products.forEach(product => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../../product-deployments/landing_pages/' + escapeHtml(product.id) + '.html">';
                html += '<div class="card-meta">' + escapeHtml(product.type || 'Product') + '</div>';
                html += '<div class="card-header">';
                html += '<img class="card-icon" src="../../product-deployments/icons/' + escapeHtml(product.icon) + '" alt="" onerror="this.onerror=null;this.src=\'../../product-deployments/icons/product.png\'">';
                html += '<div class="card-title">' + escapeHtml(product.name || product.id) + '</div>';
                html += '</div>';
                html += '<div class="card-copy">' + escapeHtml(product.whyUsed || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Related Teams</div>';
        if (!related_teams.length) {
            html += '<div class="muted">No teams were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            related_teams.forEach(team => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../../teams/landing_pages/' + escapeHtml(team.teamId) + '.html">';
                html += '<div class="card-meta">' + escapeHtml(team.roleLabel || team.teamType || 'Team') + '</div>';
                html += '<div class="card-title">' + escapeHtml(team.teamName || team.teamId) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(team.groupName || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Supported Customer Jobs</div>';
        if (!supported_jobs.length) {
            html += '<div class="muted">No customer jobs were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            supported_jobs.forEach(job => {
                html += '<div class="card">';
                html += '<div class="card-meta">' + escapeHtml(job.customerGroup || '') + (job.productName ? ' | ' + escapeHtml(job.productName) : '') + '</div>';
                html += '<div class="card-title">' + escapeHtml(job.jobName || job.jobId) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(job.jobOutcome || job.jobWhatItIs || '') + '</div>';
                if (job.supportRationale) {
                    html += '<div class="card-copy"><strong>Why this stream matters here:</strong> ' + escapeHtml(job.supportRationale) + '</div>';
                }
                if ((job.usedInSteps || []).length) {
                    html += '<ul class="list">' + job.usedInSteps.map(step => '<li>' + escapeHtml(step.step || step.description || '') + '</li>').join('') + '</ul>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        html += '</div>';

        document.getElementById('tab_content_home').innerHTML = html;
    }

    function renderFlows() {
        const flows = getFlows();
        const totalSteps = flows.reduce((count, flow) => count + ((flow.steps || []).length), 0);
        let html = '';

        document.getElementById('tab_flows').innerHTML = 'Flow Narratives (' + flows.length + ')';

        flows.forEach(flow => {
            const dependenciesInFlow = getFlowDependencies(flow);
            const summary = summarizeFlow(flow);
            html += '<div class="group">';
            html += '<div class="section-title">Flow</div>';
            html += '<div class="flow-title">' + escapeHtml(flow.title || flow.id) + '</div>';
            html += '<div class="flow-description">' + escapeHtml(flow.description || '') + '</div>';
            if (summary.actor || summary.trigger || summary.result) {
                html += '<div class="card" style="margin-bottom:16px;">';
                if (summary.actor) {
                    html += '<div class="card-copy"><strong>Primary actor:</strong> ' + escapeHtml(summary.actor) + '</div>';
                }
                if (summary.trigger) {
                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';
                }
                html += '</div>';
            }

            html += '<div class="section-title">Dependency Traceability</div>';
            html += '<div class="flow-matrix-wrap">';
            html += '<table class="flow-matrix">';
            html += '<thead>';
            html += '<tr><th class="flow-dependency-col"></th>';
            (flow.steps || []).forEach((step, index) => {
                html += '<th class="flow-step-col"><div class="flow-step-label">Step ' + (index + 1) + '</div><div class="card-title">' + escapeHtml(step.title || step.id) + '</div></th>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right">Key Facts</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkblue">';
                if ((step.keyFacts || []).length) {
                    html += '<ul class="flow-insight-list">' + step.keyFacts.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No key facts listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right; color: darkred">Pain Points</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkred">';
                if ((step.painPoints || []).length) {
                    html += '<ul class="flow-insight-list">' + step.painPoints.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No pain points listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';
            html += '</thead><tbody>';

            dependenciesInFlow.forEach(dependency => {
                const dependencyTypeLabel = 'Product Brick';
                html += '<tr>';
                html += '<td>';
                html += '<div class="flow-dependency-header">';
                html += renderFlowDependencyIcon(dependency, 'flow-dependency-icon');
                html += '<div>';
                html += '<a class="flow-dependency-name" href="../landing_pages/' + escapeHtml(dependency.id) + '.html">' + escapeHtml(dependency.name || dependency.id) + '</a>';
                if (dependency.interface) {
                    html += '<div class="muted">' + escapeHtml(dependency.interface) + '</div>';
                }
                html += '</div>';
                html += '</div>';
                html += '</td>';
                (flow.steps || []).forEach(step => {
                    const stepDependency = getStepDependency(step, dependency);
                    if (!stepDependency) {
                        html += '<td class="flow-cell-empty">-</td>';
                        return;
                    }
                    html += '<td class="flow-cell-active">';
                    html += '<div class="flow-cell-copy">' + escapeHtml(simplifySupportCopy(stepDependency.how || stepDependency.description || 'Supports this step.')) + '</div>';
                    html += '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            html += '</div>';
            html += '</div>';
        });

        document.getElementById('tab_content_flows').innerHTML = html;
    }

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';
        }
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-title">' + escapeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                count++;
                html += '<div class="link-entry">';
                html += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(link.link || '#') + '">'
                    + escapeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>


<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Freelancer Bookkeeping Service Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Streams Index"
    },
    {
      "label": "Review Administration and File VAT Returns"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
