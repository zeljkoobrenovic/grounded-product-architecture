    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

om memory diverge, and clients compare notes in the community.", "Rules that changed this year but not in the base produce confident wrong answers."], "dependencies": [{"type": "brick", "id": "advk", "name": "Advice Knowledge Base and Tax Rules Content", "description": "Rule lookup.", "how": "Provides the current rule, examples and standard answer."}, {"type": "brick", "id": "dash", "name": "Financial Dashboard and Quarterly Results", "description": "Client figures.", "how": "Provides the client's figures to tailor the answer."}]}, {"id": "answer-and-log-on-the-file", "title": "Answer and log the advice on the client file", "actor": "Personal Bookkeeper", "keyFacts": ["The answer goes to the client in the app and by e-mail and is logged on the file with the rule referenced, so the year-end and the backup colleague can see it.", "Follow-up actions (keep an hours log, register the studio) become to-dos."], "painPoints": ["Advice given by phone and not logged is disputed at year end.", "Answers without a follow-up to-do are forgotten by the client."], "dependencies": [{"type": "brick", "id": "msgc", "name": "Client Messaging, E-mail and Call Log", "description": "Answer and log.", "how": "Sends the answer and logs it with the rule reference."}, {"type": "brick", "id": "ntfy", "name": "Deadlines, To-dos and Notifications", "description": "Follow-up to-do.", "how": "Creates the follow-up to-dos."}]}, {"id": "escalate-or-enrich-the-knowledge-base", "title": "Escalate an unusual case or enrich the knowledge base", "actor": "Personal Bookkeeper", "keyFacts": ["Unusual cases go to the fiscal specialists in the quality and knowledge team; their answer becomes a new or updated article so the next bookkeeper finds it.", "Frequently asked questions become client-facing content."], "painPoints": ["Specialists answering the same unusual question ten times is wasted expertise.", "Articles without a review date go stale."], "dependencies": [{"type": "brick", "id": "qaud", "name": "Q eper Client File and Review Queue", "description": "Client attributes.", "how": "Provides legal form, start date and segment per client."}]}, {"id": "send-the-update-in-the-app-and-by-e-mail", "title": "Send the update in the app, by e-mail and in the digest", "actor": "Personal Bookkeeper", "keyFacts": ["The update explains what changes, when, what it means in euros for a typical client and what to do; it appears in the app, by e-mail and in the monthly digest.", "Blog and 'Keep up' content carry the public version."], "painPoints": ["Updates written in fiscal language are not read.", "Updates without a 'what to do' produce questions instead of actions."], "dependencies": [{"type": "brick", "id": "ntfy", "name": "Deadlines, To-dos and Notifications", "description": "Segmented update.", "how": "Sends the update to the selected clients through the app, e-mail and digest."}, {"type": "brick", "id": "mobi", "name": "Mobile App Shell (iOS/Android)", "description": "In-app update.", "how": "Shows the update in the app."}]}, {"id": "add-a-personal-note-for-high-impact-clients", "title": "Add a personal note for high-impact clients", "actor": "Personal Bookkeeper", "keyFacts": ["For clients where the change has a large effect (a consultant at risk under the Wet DBA, a starter losing a deduction) the bookkeeper adds a personal note with the client's own figures and offers a call.", "The note is logged and any decision becomes a to-do."], "painPoints": ["High-impact clients who get only the generic update feel the service is not personal.", "Bookkeepers cannot write hundreds of personal notes without a shortlist and a template."], "dependencies": [{"type": "brick", "id": "msgc", "name": "Client Messaging, E-mail and Call Log", "description": "Personal note.", "how": "Sends and logs the personal note."}, {"type": "brick", "id": "wkld", "name": "Client Allocation and Workload Planning", "description": "Time for proactive contact.", "how": "Reserves bookkeeper time for proactiv         return String(value ?? '')

            .replaceAll('"', '&quot;')

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

        (flow.steps || []).forEach(step => {

                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());
    }

            result: flow.successSignal || flow.outcome || lastStep.successSignal || lastStep.output || ''

            html += '<div class="muted">No flows listed for this stream.</div>';
        } else {
            html += '<div class="card-grid">';
            flows.forEach(flow => {
                const summary = summarizeFlow(flow);
                html += '<div class="card">';
                html += '<div class="card-meta">' + escapeHtml(streamMetaPath(currentStream)) + '</div>';
                html += '<div class="card-title">' + escapeHtml(flow.title || flow.id) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(flow.description || '') + '</div>';
                html += '<div class="muted">' + ((flow.steps || []).length) + ' steps</div>';
                if (summary.actor) {
                    html += '<div class="card-copy"><strong>Actor:</strong> ' + escapeHtml(summary.actor) + '</div>';
                }
                if (summary.trigger) {
                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Outcomes</div>';
        if (!(currentStream.outcomes || []).length) {
            html += '<div class="muted">No outcomes listed for this stream.</div>';
        } else {
            html += '<div class="card"><ul class="list">' + currentStream.outcomes.map(outcome => '<li>' + escapeHtml(outcome) + '</li>').join('') + '</ul></div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Supporting Product Bricks</div>';
        if (!related_bricks.length) {
            html += '<div class="muted">No linked product bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            related_bricks.forEach(brick => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../landing_pages/' + escapeHtml(brick.id) + '.html">';
                html += '<div class="card-meta">' + escapeHtml((brick.group || brick.domain || 'Product Brick')) + '</div>';
                html += '<div class="card-header">';
                html += '<img class="card-icon" src="../icons/' + escapeHtml(brick.id) + '.png" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
                html += '<div class="card-title">' + escapeHtml(brick.name || brick.id) + '</div>';
                html += '</div>';
                html += '<div class="card-copy">' + escapeHtml(brick.description || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Linked Products</div>';
        if (!linked_products.length) {
            html += '<div class="muted">No linked products were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            linked_products.forEach(product => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../../product-deployments/landing_pages/' + escapeHtml(product.id) + '.html">';
                html += '<div class="card-meta">' + escapeHtml(product.type || 'Product') + '</div>';
                html += '<div class="card-header">';
                html += '<img class="card-icon" src="../../product-deployments/icons/' + escapeHtml(product.icon) + '" alt="" onerror="this.onerror=null;this.src=\'../../product-deployments/icons/product.png\'">';
                html += '<div class="card-title">' + escapeHtml(product.name || product.id) + '</div>';
                html += '</div>';
                html += '<div class="card-copy">' + escapeHtml(product.whyUsed || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Related Teams</div>';
        if (!related_teams.length) {
            html += '<div class="muted">No teams were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            related_teams.forEach(team => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../../teams/landing_pages/' + escapeHtml(team.teamId) + '.html">';
                html += '<div class="card-meta">' + escapeHtml(team.roleLabel || team.teamType || 'Team') + '</div>';
                html += '<div class="card-title">' + escapeHtml(team.teamName || team.teamId) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(team.groupName || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Supported Customer Jobs</div>';
        if (!supported_jobs.length) {
            html += '<div class="muted">No customer jobs were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            supported_jobs.forEach(job => {
                html += '<div class="card">';
                html += '<div class="card-meta">' + escapeHtml(job.customerGroup || '') + (job.productName ? ' | ' + escapeHtml(job.productName) : '') + '</div>';
                html += '<div class="card-title">' + escapeHtml(job.jobName || job.jobId) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(job.jobOutcome || job.jobWhatItIs || '') + '</div>';
                if (job.supportRationale) {
                    html += '<div class="card-copy"><strong>Why this stream matters here:</strong> ' + escapeHtml(job.supportRationale) + '</div>';
                }
                if ((job.usedInSteps || []).length) {
                    html += '<ul class="list">' + job.usedInSteps.map(step => '<li>' + escapeHtml(step.step || step.description || '') + '</li>').join('') + '</ul>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        html += '</div>';

        document.getElementById('tab_content_home').innerHTML = html;
    }

    function renderFlows() {
        const flows = getFlows();
        const totalSteps = flows.reduce((count, flow) => count + ((flow.steps || []).length), 0);
        let html = '';

        document.getElementById('tab_flows').innerHTML = 'Flow Narratives (' + flows.length + ')';

        flows.forEach(flow => {
            const dependenciesInFlow = getFlowDependencies(flow);
            const summary = summarizeFlow(flow);
            html += '<div class="group">';
            html += '<div class="section-title">Flow</div>';
            html += '<div class="flow-title">' + escapeHtml(flow.title || flow.id) + '</div>';
            html += '<div class="flow-description">' + escapeHtml(flow.description || '') + '</div>';
            if (summary.actor || summary.trigger || summary.result) {
                html += '<div class="card" style="margin-bottom:16px;">';
                if (summary.actor) {
                    html += '<div class="card-copy"><strong>Primary actor:</strong> ' + escapeHtml(summary.actor) + '</div>';
                }
                if (summary.trigger) {
                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';
                }
                html += '</div>';
            }

            html += '<div class="section-title">Dependency Traceability</div>';
            html += '<div class="flow-matrix-wrap">';
            html += '<table class="flow-matrix">';
            html += '<thead>';
            html += '<tr><th class="flow-dependency-col"></th>';
            (flow.steps || []).forEach((step, index) => {
                html += '<th class="flow-step-col"><div class="flow-step-label">Step ' + (index + 1) + '</div><div class="card-title">' + escapeHtml(step.title || step.id) + '</div></th>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right">Key Facts</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkblue">';
                if ((step.keyFacts || []).length) {
                    html += '<ul class="flow-insight-list">' + step.keyFacts.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No key facts listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right; color: darkred">Pain Points</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkred">';
                if ((step.painPoints || []).length) {
                    html += '<ul class="flow-insight-list">' + step.painPoints.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No pain points listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';
            html += '</thead><tbody>';

            dependenciesInFlow.forEach(dependency => {
                const dependencyTypeLabel = 'Product Brick';
                html += '<tr>';
                html += '<td>';
                html += '<div class="flow-dependency-header">';
                html += renderFlowDependencyIcon(dependency, 'flow-dependency-icon');
                html += '<div>';
                html += '<a class="flow-dependency-name" href="../landing_pages/' + escapeHtml(dependency.id) + '.html">' + escapeHtml(dependency.name || dependency.id) + '</a>';
                if (dependency.interface) {
                    html += '<div class="muted">' + escapeHtml(dependency.interface) + '</div>';
                }
                html += '</div>';
                html += '</div>';
                html += '</td>';
                (flow.steps || []).forEach(step => {
                    const stepDependency = getStepDependency(step, dependency);
                    if (!stepDependency) {
                        html += '<td class="flow-cell-empty">-</td>';
                        return;
                    }
                    html += '<td class="flow-cell-active">';
                    html += '<div class="flow-cell-copy">' + escapeHtml(simplifySupportCopy(stepDependency.how || stepDependency.description || 'Supports this step.')) + '</div>';
                    html += '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            html += '</div>';
            html += '</div>';
        });

        document.getElementById('tab_content_flows').innerHTML = html;
    }

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';
        }
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-title">' + escapeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                count++;
                html += '<div class="link-entry">';
                html += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(link.link || '#') + '">'
                    + escapeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>


<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Freelancer Bookkeeping Service Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Streams Index"
    },
    {
      "label": "Ask Your Bookkeeper and Get Advice"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
