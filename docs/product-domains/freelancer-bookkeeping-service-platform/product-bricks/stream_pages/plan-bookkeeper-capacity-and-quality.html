    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

dar spreads the quarter's returns across the month after the quarter and the income tax returns across the season, with early-completeness clients first and known late clients chased earlier.", "Leave is planned around the peaks and backups are confirmed for the peak weeks."], "painPoints": ["Everyone filing in the last week of the month makes the tax authority channel the bottleneck.", "Peaks planned without leave data leave offices short in the holiday season."], "dependencies": [{"type": "brick", "id": "dlin", "name": "Filing Calendar and Deadline Orchestration", "description": "Deadline scheduling.", "how": "Distributes filing tasks across the period."}, {"type": "brick", "id": "wkld", "name": "Client Allocation and Workload Planning", "description": "Leave and peak planning.", "how": "Records leave and backup coverage for peak weeks."}]}, {"id": "set-review-priorities-and-four-eyes-rules", "title": "Set the review priorities and the four-eyes rules for the period", "actor": "Personal Bookkeeper", "keyFacts": ["Risk rules define which files get a second check (first returns, switches, refunds above a threshold, BVs) and the sampling rate for the rest; the rules are loaded into the queues.", "Rules are adjusted from last period's quality findings."], "painPoints": ["Rules that never change do not respond to new error patterns.", "Sampling rates set too high during the peak are silently abandoned."], "dependencies": [{"type": "brick", "id": "qaud", "name": "Quality Assurance and Four-eyes Checks", "description": "Risk rules and sampling.", "how": "Defines the four-eyes rules and sampling rate for the period."}, {"type": "brick", "id": "bkws", "name": "Bookkeeper Client File and Review Queue", "description": "Queue configuration.", "how": "Applies the priorities and rules to the review queues."}]}, {"id": "plan-training-and-hiring", "title": "Plan internal training and hiring per office", "actor": "Personal Bookkeeper", "keyFacts": ["Gaps between forecast and capacity become hiring plans per office; new bookkeepers follow the internal training on the platform, the entrepreneur's method and the knowledge base before taking a portfolio.", "Training topics come from the quality findings of the last period."], "painPoints": ["Hiring after the peak has started means training during the peak.", "Training built on generic accounting skills misses the Kees way of working."], "dependencies": [{"type": "brick", "id": "wkld", "name": "Client Allocation and Workload Planning", "description": "Capacity gap and hiring plan.", "how": "Shows the gap per office and the hiring plan."}, {"type": "brick", "id": "advk", "name": "Advice Knowledge Base and Tax Rules Content", "description": "Training content.", "how": "Provides the knowledge base as training material."}, {"type": "brick", "id": "iden", "name": "Identity, Login and Access Control", "description": "Trainee access.", "how": "Grants trainees restricted access during training."}]}, {"id": "review-the-plan-with-the-offices", "title": "Review the plan with the three offices and confirm", "actor": "Personal Bookkeeper", "keyFacts": ["Team leads in Amsterdam, Rotterdam and Utrecht review the plan, confirm allocations and backups and flag clients that need special attention.", "The confirmed plan is recorded and the queues are opened."], "painPoints": ["Plans made centrally without the team leads ignore what they know about their clients.", "Unconfirmed plans lead to two people working the same file."], "dependencies": [{"type": "brick", "id": "wkld", "name": "Client Allocation and Workload Planning", "description": "Plan confirmation.", "how": "Records the confirmed plan per office."}, {"type": "brick", "id": "audt", "name": "Audit Trail, AVG Compliance and Retention", "description": "Plan history.", "how": "Keeps the history of allocations and changes."}, {"type": "brick", "id": "ntfy", "name": "Deadlines, To-dos and Notifications", "description": "Plan notification.", "how": "Notifies bookkeepers of their portfolio and backups."}]}]}, {"id": "measure-quality-and-close-the-training-loop", "title": "Measure Quality and Close the Training Loop", "description": "After a filing period, the quality team measures first-time-right, corrections, review turnaround and client feedback per bookkeeper and office, reviews findings with the bookkeepers, updates the knowledge base and adjusts the rules for the next period.", "primaryActor": "Personal Bookkeeper", "trigger": "A filing period (a quarterly VAT cycle or the income tax season) is complete.", "successSignal": "Quality metrics per bookkeeper and office are reviewed, root causes are addressed in training and the knowledge base, and the next period's rules and allocations reflect the findings.", "steps": [{"id": "collect-the-quality-signals", "title": "Collect the quality signals of the period", "actor": "Personal Bookkeeper", "keyFacts": ["Four-eyes findings, supplementary returns and their coded causes, Belastingdienst correction letters, review turnaround per client and client feedback are collected per bookkeeper and office.", "Signals are linked to the file and the bookkeeper who handled it."], "painPoints": ["Findings recorded in e-mails and spreadsheets cannot be aggregated.", "Turnaround measured without the client's completeness date blames the bookkeeper for slow clients."], "dependencies": [{"type": "brick", "id": "qaud", "name": "Quality Assurance and Four-eyes Checks", "description": "Findings and causes.", "how": "Aggregates findings and coded causes per bookkeeper and office."}, {"type": "brick", "id": "bkws", "name": "Bookkeeper Client File and Review Queue", "description": "Turnaround data.", "how": "Provides review turnaround per client and completeness dates."}, {"type": "brick", "id": "dlin", "name": "Filing Calendar and Deadline Orchestration", "description": "Timeliness data.", "how": "Provides filing dates against deadlines."}]}, {"id": "compute-first-time-right-and-turnaround", "title": "Compute first-time-right, turnaround and clients served", "actor": "Personal Bookkeeper", "keyFacts": ["First-time-right (filings without correction), review turnaround from completeness to filing and clients served per bookkeeper are computed per period, office and client type.", "Metrics are compared with the previous period and with the office average."], "painPoints": ["Metrics not normalised by client complexity punish bookkeepers with BVs and VOFs.", "Publishing league tables creates competition instead of learning."], "dependencies": [{"type": "brick", "id": "qaud", "name": "Quality Assurance and Four-eyes Checks", "description": "Quality metrics.", "how": "Computes first-time-right and correction rates."}, {"type": "brick", "id": "wkld", "name": "Client Allocation and Workload Planning", "description": "Productivity metrics.", "how": "Computes clients served and turnaround per bookkeeper."}]}, {"id": "review-findings-with-the-bookkeeper", "title": "Review findings with the bookkeeper and team lead", "actor": "Personal Bookkeeper", "keyFacts": ["The team lead reviews the findings with each bookkeeper: patterns (VAT codes, private use, investments), client-related causes and workload effects; actions are agreed and recorded.", "Reviews are development conversations, not disciplinary ones."], "painPoints": ["Findings delivered as a list without the files behind them are not accepted.", "Reviews skipped during the peak lose the learning while it is fresh."], "dependencies": [{"type": "brick", "id": "qaud", "name": "Quality Assurance and Four-eyes Checks", "description": "Finding review.", "how": "Presents the findings with the files and records agreed actions."}, {"type": "brick", "id": "msgc", "name": "Client Messaging, E-mail and Call Log", "description": "Client-related causes.", "how": "Shows the client communication behind client-caused corrections."}]}, {"id": "update-training-and-the-knowledge-base", "title": "Update internal training and the knowledge base", "actor": "Personal Bookkeeper", "keyFacts": ["Recurring findings become training modules and knowledge base articles; standard answers and booking rules are adjusted so the error is prevented rather than caught.", "The app's to-do rules can be changed to catch the client-side causes."], "painPoints": ["Training that does not change a rule or an article has to be repeated every period.", "Client-side causes fixed by more review instead of better prompts do not scale."], "dependencies": [{"type": "brick", "id": "advk", "name": "Advice Knowledge Base and Tax Rules Content", "description": "Article and training update.", "how": "Updates articles, standard answers and training content."}, {"type": "brick", "id": "ntfy", "name": "Deadlines, To-dos and Notifications", "description": "Client-side rule changes.", "how": "Adjusts the to-do and reminder rules that prevent client-side causes."}]}, {"id": "adjust-rules-and-allocations-for-the-next-period", "title": "Adjust the four-eyes rules and allocations for the next period", "actor": "Personal Bookkeeper", "keyFacts": ["Four-eyes rules and sampling rates are tuned to the error patterns found, and allocations are adjusted where a bookkeeper's portfolio or client mix drove the findings.", "The adjustments and their rationale are recorded for the next review."], "painPoints": ["Rules tightened after every finding make the second check universal and the bottleneck permanent.", "Allocation changes without a rationale look arbitrary to bookkeepers."], "dependencies": [{"type": "brick", "id": "qaud", "name": "Quality Assurance and Four-eyes Checks", "description": "Rule tuning.", "how": "Updates the rules for the next period."}, {"type": "brick", "id": "wkld", "name": "Client Allocation and Workload Planning", "description": "Allocation adjustment.", "how": "Adjusts portfolios where findings were workload-driven."}, {"type": "brick", "id": "audt", "name": "Audit Trail, AVG Compliance and Retention", "description": "Rationale record.", "how": "Records the changes and their rationale."}]}, {"id": "report-to-leadership", "title": "Report quality and capacity to leadership", "actor": "Personal Bookkeeper", "keyFacts": ["A period report shows clients served per bookkeeper, first-time-right, turnaround, capacity gaps per office and training done, framed against the growth target of 20,000 clients at the same fixed fee.", "The report is the basis for the professionalisation of the technology function that Vortex emphasises: which review steps the platform should automate next."], "painPoints": ["Reports without the link to automation candidates keep capacity a hiring problem only.", "Leadership reports that arrive after the next period's plan is made are too late to matter."], "dependencies": [{"type": "brick", "id": "wkld", "name": "Client Allocation and Workload Planning", "description": "Capacity report.", "how": "Compiles clients served, capacity gaps and the hiring plan."}, {"type": "brick", "id": "qaud", "name": "Quality Assurance and Four-eyes Checks", "description": "Quality report.", "how": "Compiles the quality metrics and training done."}]}]}], "outcomes": ["Every bookkeeper carries a portfolio sized to their experience and the season, with a named backup, so no client waits because of a holiday or a departure", "Quality is measured (first-time-right, corrections, review turnaround) per bookkeeper and office and drives training, not blame", "Capacity for the next quarter and the income tax season is planned from client growth per office before the peak, not during it"], "brickDependencies": [{"targetBrickId": "wkld", "type": "composition"}, {"targetBrickId": "bkws", "type": "composition"}, {"targetBrickId": "dlin", "type": "composition"}, {"targetBrickId": "qaud", "type": "composition"}, {"targetBrickId": "advk", "type": "composition"}, {"targetBrickId": "onbd", "type": "composition"}, {"targetBrickId": "audt", "type": "composition"}, {"targetBrickId": "msgc", "type": "composition"}, {"targetBrickId": "ntfy", "type": "composition"}, {"targetBrickId": "iden", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "E-mail provider", "type": "messaging-gateway", "interface": "Transactional and inbound e-mail", "description": "Delivers deadline reminders, to-dos, invoice and quote e-mails, payment reminders, bookkeeper messages and onboarding communication to clients, and receives receipts and purchase invoices forwarded by e-mail into the administration."}, {"system": "Belastingdienst and Government Regulatory Sources", "type": "regulatory-source", "interface": "Published tax rules, rates, deadlines and enforcement announcements", "description": "Official publications on VAT deadlines, zelfstandigenaftrek and startersaftrek amounts, mkb-winstvrijstelling, the KOR, the hours criterion and Wet DBA enforcement that the tax knowledge base tracks and turns into advice and client updates."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []};

        items.forEach(item => {

            seen.add(key);
            ordered.push(item);

        return ordered;

        return dependency.icon || linkedBrick.icon || (dependencyId ? dependencyId + '.png' : 'brick.png');
    }

    function renderFlowDependencyIcon(dependency, className) {
        return '<img class="' + escapeHtml(className) + '" src="../icons/' + escapeHtml(flowDependencyIconFile(dependency)) + '" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
    }

    function renderStepDependencyPills(step) {
        const dependencies = step.dependencies || [];
        if (!dependencies.length) {
            return '<div class="muted">No step-specific dependencies listed.</div>';
        }

        return '<div class="flow-step-dependencies">' + dependencies.map(dep => {
            const label = dep.name || dep.id || 'Dependency';
            const kind = 'Brick';
            return '<span class="flow-cell-brick">' + renderFlowDependencyIcon(dep, 'flow-cell-brick-icon') + '<span>' + escapeHtml(kind + ': ' + label) + '</span></span>';
        }).join('') + '</div>';
    }

    function simplifySupportCopy(value) {
        const text = String(value || '').trim();
        if (!text) {
            return '';
        }
        const simplified = text.replace(/^Supports .*? by helping users help /i, 'Facilitate ');
        return simplified;
    }
</script>

<script>
    function streamMetaPath(stream) {
        const parts = [];
        if (stream.group) {
            parts.push(stream.group);
        }
        if (stream.rootGroup && stream.rootGroup !== stream.group) {
            parts.push(stream.rootGroup);
        }
        if (!parts.length) {
            parts.push('Stream');
        }
        return parts.join(' / ');
    }

    headerHtml += '<div>';
    headerHtml += '<div class="header-meta">';
    headerHtml += '<div class="page-type-badge">Stream</div>';

    headerHtml += '<div class="header-title">' + escapeHtml(currentStream.name || currentStream.id) + '</div>';
    headerHtml += '<div class="header-copy">' + escapeHtml(currentStream.description || '') + '</div>';
    headerHtml += '</div></div></div>';

    function renderHome() {
        const flows = getFlows();
        const totalSteps = flows.reduce((count, flow) => count + ((flow.steps || []).length), 0);
        const primaryActors = getPrimaryActors();
        let html = '';

        html += '<div class="group"><div class="section-title">Flow Narratives (' + flows.length + ')</div>';
        if (!flows.length) {
            html += '<div class="muted">No flows listed for this stream.</div>';
        } else {
            html += '<div class="card-grid">';
            flows.forEach(flow => {
                const summary = summarizeFlow(flow);
                html += '<div class="card">';
                html += '<div class="card-meta">' + escapeHtml(streamMetaPath(currentStream)) + '</div>';
                html += '<div class="card-title">' + escapeHtml(flow.title || flow.id) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(flow.description || '') + '</div>';
                html += '<div class="muted">' + ((flow.steps || []).length) + ' steps</div>';
                if (summary.actor) {
                    html += '<div class="card-copy"><strong>Actor:</strong> ' + escapeHtml(summary.actor) + '</div>';
                }
                if (summary.trigger) {
                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Outcomes</div>';
        if (!(currentStream.outcomes || []).length) {
            html += '<div class="muted">No outcomes listed for this stream.</div>';
        } else {
            html += '<div class="card"><ul class="list">' + currentStream.outcomes.map(outcome => '<li>' + escapeHtml(outcome) + '</li>').join('') + '</ul></div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Supporting Product Bricks</div>';
        if (!related_bricks.length) {
            html += '<div class="muted">No linked product bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            related_bricks.forEach(brick => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../landing_pages/' + escapeHtml(brick.id) + '.html">';
                html += '<div class="card-meta">' + escapeHtml((brick.group || brick.domain || 'Product Brick')) + '</div>';
                html += '<div class="card-header">';
                html += '<img class="card-icon" src="../icons/' + escapeHtml(brick.id) + '.png" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
                html += '<div class="card-title">' + escapeHtml(brick.name || brick.id) + '</div>';
                html += '</div>';
                html += '<div class="card-copy">' + escapeHtml(brick.description || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Linked Products</div>';
        if (!linked_products.length) {
            html += '<div class="muted">No linked products were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            linked_products.forEach(product => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../../product-deployments/landing_pages/' + escapeHtml(product.id) + '.html">';
                html += '<div class="card-meta">' + escapeHtml(product.type || 'Product') + '</div>';
                html += '<div class="card-header">';
                html += '<img class="card-icon" src="../../product-deployments/icons/' + escapeHtml(product.icon) + '" alt="" onerror="this.onerror=null;this.src=\'../../product-deployments/icons/product.png\'">';
                html += '<div class="card-title">' + escapeHtml(product.name || product.id) + '</div>';
                html += '</div>';
                html += '<div class="card-copy">' + escapeHtml(product.whyUsed || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Related Teams</div>';
        if (!related_teams.length) {
            html += '<div class="muted">No teams were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            related_teams.forEach(team => {

                html += '<div class="card-meta">' + escapeHtml(team.roleLabel || team.teamType || 'Team') + '</div>';
                html += '<div class="card-title">' + escapeHtml(team.teamName || team.teamId) + '</div>';

        html += '<div class="group"><div class="section-title">Supported Customer Jobs</div>';

            html += '<div class="muted">No customer jobs were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            supported_jobs.forEach(job => {
                html += '<div class="card">';
                html += '<div class="card-meta">' + escapeHtml(job.customerGroup || '') + (job.productName ? ' | ' + escapeHtml(job.productName) : '') + '</div>';
                html += '<div class="card-title">' + escapeHtml(job.jobName || job.jobId) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(job.jobOutcome || job.jobWhatItIs || '') + '</div>';
                if (job.supportRationale) {
                    html += '<div class="card-copy"><strong>Why this stream matters here:</strong> ' + escapeHtml(job.supportRationale) + '</div>';
                }
                if ((job.usedInSteps || []).length) {
                    html += '<ul class="list">' + job.usedInSteps.map(step => '<li>' + escapeHtml(step.step || step.description || '') + '</li>').join('') + '</ul>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        html += '</div>';

        document.getElementById('tab_content_home').innerHTML = html;
    }

    function renderFlows() {
        const flows = getFlows();
        const totalSteps = flows.reduce((count, flow) => count + ((flow.steps || []).length), 0);
        let html = '';

        document.getElementById('tab_flows').innerHTML = 'Flow Narratives (' + flows.length + ')';

        flows.forEach(flow => {
            const dependenciesInFlow = getFlowDependencies(flow);
            const summary = summarizeFlow(flow);
            html += '<div class="group">';
            html += '<div class="section-title">Flow</div>';
            html += '<div class="flow-title">' + escapeHtml(flow.title || flow.id) + '</div>';
            html += '<div class="flow-description">' + escapeHtml(flow.description || '') + '</div>';
            if (summary.actor || summary.trigger || summary.result) {
                html += '<div class="card" style="margin-bottom:16px;">';
                if (summary.actor) {
                    html += '<div class="card-copy"><strong>Primary actor:</strong> ' + escapeHtml(summary.actor) + '</div>';
                }
                if (summary.trigger) {
                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';
                }
                html += '</div>';
            }

            html += '<div class="section-title">Dependency Traceability</div>';
            html += '<div class="flow-matrix-wrap">';
            html += '<table class="flow-matrix">';
            html += '<thead>';
            html += '<tr><th class="flow-dependency-col"></th>';
            (flow.steps || []).forEach((step, index) => {
                html += '<th class="flow-step-col"><div class="flow-step-label">Step ' + (index + 1) + '</div><div class="card-title">' + escapeHtml(step.title || step.id) + '</div></th>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right">Key Facts</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkblue">';
                if ((step.keyFacts || []).length) {
                    html += '<ul class="flow-insight-list">' + step.keyFacts.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No key facts listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right; color: darkred">Pain Points</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkred">';
                if ((step.painPoints || []).length) {
                    html += '<ul class="flow-insight-list">' + step.painPoints.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No pain points listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';
            html += '</thead><tbody>';

            dependenciesInFlow.forEach(dependency => {
                const dependencyTypeLabel = 'Product Brick';
                html += '<tr>';
                html += '<td>';
                html += '<div class="flow-dependency-header">';
                html += renderFlowDependencyIcon(dependency, 'flow-dependency-icon');
                html += '<div>';
                html += '<a class="flow-dependency-name" href="../landing_pages/' + escapeHtml(dependency.id) + '.html">' + escapeHtml(dependency.name || dependency.id) + '</a>';
                if (dependency.interface) {
                    html += '<div class="muted">' + escapeHtml(dependency.interface) + '</div>';
                }
                html += '</div>';
                html += '</div>';
                html += '</td>';
                (flow.steps || []).forEach(step => {
                    const stepDependency = getStepDependency(step, dependency);
                    if (!stepDependency) {
                        html += '<td class="flow-cell-empty">-</td>';
                        return;
                    }
                    html += '<td class="flow-cell-active">';
                    html += '<div class="flow-cell-copy">' + escapeHtml(simplifySupportCopy(stepDependency.how || stepDependency.description || 'Supports this step.')) + '</div>';
                    html += '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            html += '</div>';
            html += '</div>';
        });

        document.getElementById('tab_content_flows').innerHTML = html;
    }

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';
        }
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-title">' + escapeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                count++;
                html += '<div class="link-entry">';
                html += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(link.link || '#') + '">'
                    + escapeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>

    }

}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
