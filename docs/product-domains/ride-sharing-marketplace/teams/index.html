<script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        document.getElementById('tab_' + resolvedTabName).className += ' active';
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

            groupsHtml += '<div class="meta-pill">Headcount: ' + escapeHtml(String(staffing.suggestedHeadcount || 0)) + '</div>';
            groupsHtml += '<div class="meta-pill">Roles: ' + escapeHtml(String((staffing.roles || []).length)) + '</div>';
            groupsHtml += '<div class="meta-pill">Customers: ' + escapeHtml(String((team.primaryCustomers || []).length)) + '</div>';
            groupsHtml += '</div>';

            if ((team.primaryCustomers || []).length) {
                groupsHtml += '<div class="section-title">Primary Customers</div>';
                (team.primaryCustomers || []).slice(0, 4).forEach(customer => {
                    groupsHtml += '<div class="customer-pill"><img class="linked-icon" src="../customers/icons/' + escapeHtml(customer.icon || 'customer.png') + '" onerror="this.onerror=null;this.src=\'../customers/icons/customer.png\'">' + escapeHtml(customer.customerName || customer.customerId) + '</div>';
                });
            }

            if ((team.ownedProductBricks || []).length) {
                groupsHtml += '<div class="section-title">Owned Product Bricks</div>';
                (team.ownedProductBricks || []).slice(0, 4).forEach(brick => {
                    groupsHtml += '<div class="brick-pill"><img class="brick-icon" src="../product-bricks/icons/' + escapeHtml((brick.brick || {}).icon || 'capability_404.png') + '" onerror="this.onerror=null;this.src=\'../product-bricks/icons/logo.png\'">' + escapeHtml(brick.brickName || brick.brickId) + '</div>';
                });
            }

            groupsHtml += '<div class="section-title">Role Mix</div>';
            groupsHtml += '<div class="role-summary">' + summarizeRoles(staffing.roles || []) + '</div>';

            groupsHtml += '<div class="activity-row">Discoveries: ' + escapeHtml(String((team.relatedDiscoveries || []).length)) + ' | Initiatives: ' + escapeHtml(String((team.relatedInitiatives || []).length)) + ' | Releases: ' + escapeHtml(String((team.relatedReleases || []).length)) + '</div>';
            groupsHtml += '</a>';
        });

        groupsHtml += '</div></div>';
    });
    document.getElementById('Groups').innerHTML = groupsHtml;

    let selectedOverviewRoleKey = '';

    function roleMatchesFilter(role) {
        return !selectedOverviewRoleKey || slugifyRole(role.role) === selectedOverviewRoleKey;
    }

    function hasMatchingRole(roles) {
        return !selectedOverviewRoleKey || (roles || []).some(roleMatchesFilter);
    }

    function renderOverviewRoleDots(roles) {
        let html = '<div class="overview-role-row">';
        (roles || []).filter(roleMatchesFilter).forEach(role => {
            const safeCount = Math.max(Number(role.count) || 0, 0);
            const color = roleColorMap[slugifyRole(role.role)] || '#94a3b8';
            html += '<div class="role-dot-group">';
            html += '<div class="role-label">' + escapeHtml(role.role) + ' (' + escapeHtml(String(safeCount)) + ')</div>';
            html += '<div class="role-dots">';
            for (let i = 0; i < safeCount; i++) {
                html += '<div class="role-dot" style="background-color: ' + color + '"></div>';
            }
            html += '</div>';
            html += '</div>';
        });
        html += '</div>';
        return html;
    }

    function renderOverviewRoleFilter() {
        let html = '<div class="legend-row">';
        html += '<button type="button" class="legend-pill' + (selectedOverviewRoleKey ? '' : ' active') + '" data-role-key="">Show all roles</button>';
        distinctRoles
            .sort((left, right) => left.localeCompare(right))
            .forEach(role => {
                const roleKey = slugifyRole(role);
                html += '<button type="button" class="legend-pill' + (selectedOverviewRoleKey === roleKey ? ' active' : '') + '" data-role-key="' + escapeHtml(roleKey) + '">';
                html += '<span class="legend-swatch" style="background-color: ' + roleColorMap[roleKey] + '"></span>';
                html += '<span>' + escapeHtml(role) + '</span>';
                html += '<span class="legend-count">' + escapeHtml(String(roleInstanceCounts[roleKey] || 0)) + '</span>';
                html += '</button>';
            });
        html += '</div>';
        document.getElementById('OverviewRoleFilter').innerHTML = html;
        document.querySelectorAll('#OverviewRoleFilter .legend-pill').forEach(button => {
            button.addEventListener('click', () => setOverviewRoleFilter(button.getAttribute('data-role-key') || ''));
        });
    }

    function renderOverview() {
        let overviewHtml = '<div class="overview-list">';
        (teamsData.groups || []).forEach(group => {
            const groupLeadershipRoles = ((group.groupLeadership || {}).roles) || [];
            const visibleTeams = (group.teams || []).filter(team => hasMatchingRole(((team.staffing || {}).roles) || []));
            const showGroupLeadership = group.groupLeadership && groupLeadershipRoles.length && hasMatchingRole(groupLeadershipRoles);
            if (selectedOverviewRoleKey && !showGroupLeadership && !visibleTeams.length) {
                return;
            }
            overviewHtml += '<div class="overview-group">';
            overviewHtml += '<div class="overview-group-name">' + escapeHtml(group.name) + '</div>';
            if (showGroupLeadership) {
                overviewHtml += '<div class="overview-team-group-level">';
                overviewHtml += '<div><div class="overview-team-name">Group Leadership</div><div class="overview-team-meta">Group-level coverage</div></div>';
                overviewHtml += renderOverviewRoleDots(groupLeadershipRoles);
                overviewHtml += '</div>';
            }
            visibleTeams.forEach(team => {
                overviewHtml += '<div class="overview-team">';
                overviewHtml += '<div><a class="overview-team-link" target="_blank" href="landing_pages/' + escapeHtml(team.id) + '.html"><div class="overview-team-name">' + escapeHtml(team.name) + '</div><div class="overview-team-meta">' + escapeHtml(team.teamType || 'team') + '</div></a></div>';
                overviewHtml += renderOverviewRoleDots(((team.staffing || {}).roles) || []);
                overviewHtml += '</div>';
            });
            overviewHtml += '</div>';
        });
        overviewHtml += '</div>';
        document.getElementById('Overview').innerHTML = overviewHtml;
    }

    function setOverviewRoleFilter(roleKey) {
        selectedOverviewRoleKey = selectedOverviewRoleKey === roleKey ? '' : roleKey;
        renderOverviewRoleFilter();
        renderOverview();
    }

    renderOverviewRoleFilter();
    renderOverview();

    let principlesHtml = '<div class="section-title">Design Principles</div>';
    principlesHtml += '<div>' + escapeHtml(teamsData.orgDesign.companyProfile || '') + '</div>';
    principlesHtml += '<ul>';
    (teamsData.orgDesign.designPrinciples || []).forEach(principle => {
        principlesHtml += '<li>' + escapeHtml(principle) + '</li>';
    });
    principlesHtml += '</ul>';
    document.getElementById('Principles').innerHTML = principlesHtml;

    function teamTypeMeta(team) {
        return [team.groupName || '', team.teamType || 'team'].filter(Boolean).join(' | ');
    }

    function dependencyTypeCatalog() {
        return [
            {id: 'depends_on', name: 'Explicit Depends On'},
            {id: 'supported_by', name: 'Default Supporting Team'},
            {id: 'shared_product_bricks', name: 'Shared Product Bricks'},
            {id: 'shared_initiatives', name: 'Shared Initiatives'},
            {id: 'shared_releases', name: 'Shared Releases'}
        ];
    }

    function renderChecklistItems(items, kind, className, onChangeHandler, emptyClass) {
        if (!items.length) {
            return '<div class="' + emptyClass + '">No items available.</div>';
        }
        return items.map(item => {
            const meta = kind === 'team' ? teamTypeMeta(item) : '';
            return '<label class="dependency-check-item">' +
                '<input type="checkbox" class="' + className + '" value="' + escapeHtml(item.id) + '" checked onchange="' + onChangeHandler + '()">' +
                '<span><span>' + escapeHtml(item.name) + '</span>' +
                (meta ? '<span class="dependency-check-meta">' + escapeHtml(meta) + '</span>' : '') +
                '</span></label>';
        }).join('');
    }

    function setAllCheckboxes(selector, checked) {
        document.querySelectorAll(selector).forEach(input => {
            input.checked = checked;
        });
        renderDependenciesView();
    }

    function selectedValues(selector) {
        return new Set(Array.from(document.querySelectorAll(selector))
            .filter(input => input.checked)
            .map(input => input.value));
    }

    function teamCatalog() {
        return flatTeams.slice().sort((left, right) => (left.name || '').localeCompare(right.name || ''));
    }

    function getTeamEdgeCatalog() {
        const teamNameMap = {};
        flatTeams.forEach(team => {
            teamNameMap[team.id] = team.name || team.id;
        });

        const sharedEdgeMap = {};
        const directEdges = [];
        flatTeams.forEach(team => {
            const dependencyData = team.dependencyData || {};

            (dependencyData.explicitRelationships || []).forEach(item => {
                directEdges.push({
                    source: team.id,
                    target: item.teamId,
                    type: item.relationshipType || 'depends_on',
                    typeLabel: item.relationshipLabel || item.relationshipType || 'relationship'
                });
            });

            [
                ['sharedProductBricks', 'shared_product_bricks', 'Shared Product Bricks'],
                ['sharedInitiatives', 'shared_initiatives', 'Shared Initiatives'],
                ['sharedReleases', 'shared_releases', 'Shared Releases']
            ].forEach(config => {
                const items = dependencyData[config[0]] || [];
                items.forEach(item => {
                    const pairKey = [team.id, item.teamId].sort().join('::') + '::' + config[1];
                    if (!sharedEdgeMap[pairKey]) {
                        const sortedPair = [team.id, item.teamId].sort();
                        sharedEdgeMap[pairKey] = {
                            source: sortedPair[0],
                            target: sortedPair[1],
                            type: config[1],
                            typeLabel: config[2]
                        };
                    }
                });
            });
        });

        return {
            teams: teamCatalog(),
            dependencyTypes: dependencyTypeCatalog(),
            edges: directEdges.concat(Object.values(sharedEdgeMap)).map(edge => ({
                ...edge,
                sourceName: teamNameMap[edge.source] || edge.source,
                targetName: teamNameMap[edge.target] || edge.target
            }))
        };
    }

    function renderDependenciesControls(catalog) {
        return '<div class="dependency-controls">' +
            '<div class="dependency-control-group">' +
            '<div class="dependency-control-title">Teams</div>' +
            '<div class="dependency-actions">' +
            '<button class="dependency-action" type="button" onclick="setAllCheckboxes(\'.dependency-team-checkbox\', true)">Show all</button>' +
            '<button class="dependency-action" type="button" onclick="setAllCheckboxes(\'.dependency-team-checkbox\', false)">Hide all</button>' +
            '</div><div class="dependency-checklist">' +
            renderChecklistItems(catalog.teams, 'team', 'dependency-team-checkbox', 'renderDependenciesView', 'dependency-empty') +
            '</div></div>' +
            '<div class="dependency-control-group">' +
            '<div class="dependency-control-title">Dependency Types</div>' +
            '<div class="dependency-actions">' +
            '<button class="dependency-action" type="button" onclick="setAllCheckboxes(\'.dependency-type-checkbox\', true)">Show all</button>' +
            '<button class="dependency-action" type="button" onclick="setAllCheckboxes(\'.dependency-type-checkbox\', false)">Hide all</button>' +
            '</div><div class="dependency-checklist">' +
            renderChecklistItems(catalog.dependencyTypes, 'type', 'dependency-type-checkbox', 'renderDependenciesView', 'dependency-empty') +
            '</div></div>' +
            '<div class="dependency-legend"><div class="dependency-control-title">Legend</div>' +
            '<div class="dependency-legend-items">' +
            '<div class="dependency-legend-item"><span class="dependency-legend-swatch" style="background-color:#dbeafe; border-color:#2563eb;"></span><span>Team</span></div>' +
            '<div class="dependency-legend-item"><span class="dependency-legend-swatch" style="background-color:#ecfccb; border-color:#65a30d;"></span><span>Shared dependency node</span></div>' +
            '</div></div></div>';
    }

    function buildTeamGraph(catalog, selectedTeamIds, selectedTypeIds) {
        return {
            teams: catalog.teams.filter(team => selectedTeamIds.has(team.id)),
            edges: catalog.edges.filter(edge =>
                selectedTeamIds.has(edge.source) &&
                selectedTeamIds.has(edge.target) &&
                selectedTypeIds.has(edge.type)
            )
        };
    }

    function renderDependenciesView() {
        const container = document.getElementById('DependenciesContent');
        if (!container) {
            return;
        }

        const catalog = getTeamEdgeCatalog();
        if (!dependenciesInitialized) {
            container.innerHTML = '<div class="dependencies-layout">' +
                renderDependenciesControls(catalog) +
                '<div><div id="DependenciesSummary" class="dependency-summary"></div><div id="DependenciesGraph" class="dependency-graph"></div></div>' +
                '</div>';
            dependenciesInitialized = true;
        }

        const selectedTeamIds = selectedValues('.dependency-team-checkbox');
        const selectedTypeIds = selectedValues('.dependency-type-checkbox');
        const graph = buildTeamGraph(catalog, selectedTeamIds, selectedTypeIds);

        document.getElementById('DependenciesSummary').innerHTML =
            '<div class="dependency-stat"><div class="dependency-stat-value">' + formatNumber(graph.teams.length) + '</div><div class="dependency-stat-label">Visible Teams</div></div>' +
            '<div class="dependency-stat"><div class="dependency-stat-value">' + formatNumber(graph.edges.length) + '</div><div class="dependency-stat-label">Visible Dependencies</div></div>' +
            '<div class="dependency-stat"><div class="dependency-stat-value">' + formatNumber(selectedTypeIds.size) + '</div><div class="dependency-stat-label">Active Types</div></div>';

        const graphContainer = document.getElementById('DependenciesGraph');
        if (!graph.teams.length || !graph.edges.length) {
            graphContainer.innerHTML = '<div class="dependency-empty">Select at least two connected teams and one dependency type.</div>';
            return;
        }

        let diagram = 'flowchart LR\n';
        graph.teams.forEach(team => {
            diagram += sanitizeMermaidId(team.id) + '["' + escapeMermaidLabel(team.name || team.id) + '"]\n';
            diagram += 'style ' + sanitizeMermaidId(team.id) + ' fill:#dbeafe,stroke:#2563eb,stroke-width:1px\n';
        });
        graph.edges.forEach((edge, index) => {
            const sourceId = sanitizeMermaidId(edge.source);
            const targetId = sanitizeMermaidId(edge.target);
            const label = escapeMermaidLabel(edge.typeLabel || edge.type || 'dependency');
            if (edge.type.indexOf('shared_') === 0) {
                const sharedId = sanitizeMermaidId('shared_' + edge.type + '_' + index);
                diagram += sharedId + '(("' + label + '"))\n';
                diagram += 'style ' + sharedId + ' fill:#ecfccb,stroke:#65a30d,stroke-width:1px\n';
                diagram += sourceId + ' --- ' + sharedId + '\n';
                diagram += sharedId + ' --- ' + targetId + '\n';
            } else {
                diagram += sourceId + ' -->|' + label + '| ' + targetId + '\n';
            }
        });

        const graphId = 'teams-dependency-graph-' + Date.now();
        graphContainer.innerHTML = '<div class="mermaid" id="' + graphId + '">' + diagram + '</div>';
        mermaid.run({querySelector: '#' + graphId});
    }
</script>
<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../start/index.html",
      "label": "Ride Sharing Marketplace Home"
    },
    {
      "label": "Teams"
    }
  ]
};
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>

</body>
