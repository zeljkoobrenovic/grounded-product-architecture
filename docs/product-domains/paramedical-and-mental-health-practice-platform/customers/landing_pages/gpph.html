-contracts depend on it", "A migration to HCI One on the practice's own timing, with the dossier content and integrations the team knows and the NEN 7510 and ISO 27001 certification unchanged"], "winsThem": ["Declarations generated from the agenda and submitted through Vecozo, with the option to hand return messages to HCI's billing services entirely", "Voice-to-text and AI summaries in the dossier, KNGF guideline templates and specialisation cards that make a session note a matter of minutes", "24/7 online booking on the practice website and in the Uw Zorg Online app, a mobile agenda for the therapist on the move and Mollie payment links on patient invoices", "A BI dashboard on production, revenue, treatment average, referrers and waiting times per therapist and location, and LDF and Keurmerk data delivered from the same episodes", "The promise that HCI One is built on the FysioRoadmap foundation, consolidates the best of SpotOnMedics, Incura and Evry, and is rolled out for physiotherapy first with no forced migration deadline"], "theirFear": ["A rejection spike after a declaration standard or contract change, with a quarter of revenue stuck in return messages while the practice keeps paying salaries", "A Keurmerk or insurer audit that finds incomplete dossiers and missing measurements and puts the plus-contract and the practice register listing at risk", "A forced migration from FysioRoadmap or SpotOnMedics that loses episodes, breaks the Vecozo and LDF connections and costs the team weeks of retraining in the middle of the year"], "jobsToBeDone": [{"id": "jtbd-fyth-1", "name": "Run the agenda and get every treatment declared and paid without rework", "whatItIs": "Keep the agenda of every therapist and location filled and accurate, and let each registered treatment flow to a paid claim without anyone retyping it: the insurance eligibility check before the first session, the treatment code and referral captured once in the agenda, the GDS801 declaration generated from the agenda and submitted to the insurer through Vecozo, return messages handled, and the uninsured remainder invoiced to the patient and paid through Mollie. The job is the practice's cash engine, and since 1 January 2025 it runs on the GDS801 standard that replaced PM304, which changed the message structure and the rejection reasons every practice sees.", "outcome": "Every treatment in the agenda is declared within a week, the first-time acceptance rate at the insurers is close to 100 percent, rejected claims are corrected within days rather than at quarter end, patient invoices are paid within two weeks, and the owner spends minutes rather than a working day per week reconciling the agenda, the declarations and the bank.", "steps": [{"step": "Book the patient into the right therapist's agenda", "description": "Take the request from the phone, the website, a ZorgDomein referral or the Uw Zorg Online app, pick the therapist with the right specialisation (manual therapy, pelvic, geriatric, sports) and location, and place the appointment so that it already carries the treatment type, location and referral needed later for the claim. Decide whether a chronic-list patient needs a referral, whether the patient is direct access (DTF) and whether the first slot is an intake or a treatment.", "streamsNeeded": [{"id": "schedule-appointments-and-online-booking", "name": "Schedule Appointments and Online Booking", "howItSupports": "Runs the multi-therapist, multi-location agenda with waiting list and reminders so every booked slot carries the data that the declaration needs."}, {"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "howItSupports": "Brings ZorgDomein referrals and GP correspondence into the agenda and dossier so the referral date and referrer are captured once."}]}, {"step": "Check eligibility and contract conditions before the first treatment", "description": "Run the COV check with Vecozo on the patient's BSN to confirm the insurer, the basic and supplementary policy and the number of reimbursed sessions, and see which contract HCI holds on record for that insurer: tariffs per treatment code, the plus-contract conditions, the maximum treatment average and the administrative requirements. Tell the patient at intake what will be reimbursed and what they will pay themselves, so there is no dispute at invoice time.", "streamsNeeded": [{"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Performs the Vecozo COV eligibility check and holds the insurer contracts and tariffs that determine what can be declared for this patient."}, {"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Authenticates the therapist with UZI or DigiD-based credentials and logs the BSN lookup as required under NEN 7510."}]}, {"step": "Register the treatment from the agenda so the claim writes itself", "description": "Confirm the appointment as treated, let the system derive the CSI code, treatment code and diagnosis code from the episode, and close the day without a separate declaration screen. Handle the exceptions: a no-show that may not be declared to the insurer, a long session that counts as one treatment, a patient who switched insurer on 1 January, a treatment on a public holiday.", "streamsNeeded": [{"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Holds the episode with diagnosis code, referral and treatment plan from which the treatment registration derives its codes."}, {"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Turns confirmed agenda items into declaration lines without retyping, applying the GDS801 rules and the insurer contract."}]}, {"step": "Submit GDS801 declarations through Vecozo and handle return messages", "description": "Batch the declarations per insurer, submit them through Vecozo, and process the return messages: fully accepted, partially rejected with a reason code, or rejected because the policy ended, the referral is missing or the treatment count exceeded the policy maximum. Correct and resubmit, or hand the whole cycle to HCI's billing services that process the return messages for the practice.", "streamsNeeded": [{"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Submits GDS801 batches through the Vecozo gateway, matches return messages to claims and drives correction or the outsourced billing service."}, {"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Shows rejection reasons per insurer and per therapist so recurring causes are fixed at the source instead of corrected every month."}]}, {"step": "Invoice the patient for the uninsured remainder and collect the money", "description": "Invoice the sessions beyond the policy maximum, the direct-access patients without supplementary insurance and the no-show fee, send the invoice by e-mail with a Mollie payment link or let the patient pay at the desk, send reminders that keep the relationship intact and export the ledger to the accountant in Twinfield.", "streamsNeeded": [{"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Produces patient invoices from the agenda, takes iDEAL payments through Mollie, tracks reminders and exports to accounting."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Lets the patient see and pay the invoice in the app rather than on paper."}]}, {"step": "Reconcile production, revenue and money in the dashboard", "description": "Compare per therapist and location the treatments performed, the declarations sent and accepted, the payments received from insurers and patients, and the open items older than 30 days, and decide where to act: a therapist who forgets to confirm appointments, an insurer that pays late, a policy maximum that keeps getting exceeded.", "streamsNeeded": [{"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Delivers the BI dashboard on production, declared and accepted value, revenue per insurer and outstanding receivables per therapist and location."}]}]}, {"id": "jtbd-fyth-2", "name": "Keep guideline-compliant records and quality data with minimal typing", "whatItIs": "Document every episode of care in a way that meets the KNGF guidelines, the dossier requirements of the insurer contracts and the audits of the Keurmerk practice register, while typing as little as possible: open the episode on a guideline-based care pathway, capture the anamnesis and examination in structured fields, dictate the treatment note, take the measurement instruments and PROMs at the right moment, report to the referrer and close the episode, and deliver the pseudonymised data to the Landelijke Database Fysiotherapie every month under the patient's opt-in consent.", "outcome": "Every episode passes a dossier audit without rework, the required measurements are taken at intake and closure, the treatment note is finished before the next patient walks in, the monthly LDF delivery is complete and on time, and the practice keeps its Keurmerk and plus-contracts without an audit scare.", "steps": [{"step": "Open the episode on the right KNGF care pathway", "description": "At intake choose the care pathway for the complaint (low back pain, knee osteoarthritis, COPD, claudication, pelvic complaints) so the dossier presents the guideline steps, the mandatory fields, the recommended measurement instruments and the treatment plan template for that pathway. Decide between a standard pathway and a custom one for complex or chronic-list patients.", "streamsNeeded": [{"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Provides discipline-specific care pathways and KNGF guideline templates that structure the episode from intake to closure."}]}, {"step": "Capture anamnesis, examination and diagnosis in structured fields", "description": "Record the history, red flags, clinical examination and the physiotherapeutic diagnosis in the structured fields of the pathway, with the diagnosis code and the prognosis needed later for the claim and for the LDF, using the specialisation cards and templates the practice has customised.", "streamsNeeded": [{"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Structures intake data so that the diagnosis code, treatment goals and referral flow into the claim and the quality data without retyping."}, {"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Captures the patient's consent for data sharing and LDF delivery at intake and logs it in the audit trail."}]}, {"step": "Document each session by voice while the patient is still in the room", "description": "Dictate the SOAP note or summarise the session in a few sentences and let voice-to-text and AI summarisation turn it into a structured note that only needs a glance and a signature. Decide what the AI may draft and what the therapist must write, and correct the note before the next patient.", "streamsNeeded": [{"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Runs voice-to-text and AI summaries in the dossier so session notes are complete without typing."}]}, {"step": "Measure at the right moments with PROMs and instruments", "description": "Send the PSK, NPRS, QBPDS or the pathway's instruments to the patient's app before intake and at the evaluation moments, capture the clinical measurements in the session, and see the scores against the previous ones and the benchmark so the treatment plan is adjusted on evidence.", "streamsNeeded": [{"id": "measure-outcomes-with-proms-and-rom", "name": "Measure Outcomes with PROMs and ROM", "howItSupports": "Schedules PROMs at the pathway's measurement moments, collects them from the patient app and shows scores and benchmarks in the dossier."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Delivers the questionnaire to the patient in Uw Zorg Online and reminds them before the session."}]}, {"step": "Report to the referrer and close the episode", "description": "Generate the report to the GP or specialist from the dossier, send it through ZorgMail, close the episode with its outcome and reason for closure, and make sure the closure date and treatment count are consistent with the declarations sent for that episode.", "streamsNeeded": [{"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "howItSupports": "Generates the referrer report from the dossier and sends it securely through ZorgMail with the loop closed in the dossier."}, {"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Closes the episode with the mandatory closure fields checked by the dossier audit rules."}]}, {"step": "Deliver LDF and Keurmerk data every month under opt-in consent", "description": "Let the EPD pseudonymise and deliver the monthly data set of episodes, diagnoses, measurements and treatment counts to the LDF, only for patients who gave opt-in consent, check the delivery report and the dossier completeness score, and use the LDF and Keurmerk benchmarks in the quarterly team meeting.", "streamsNeeded": [{"id": "measure-outcomes-with-proms-and-rom", "name": "Measure Outcomes with PROMs and ROM", "howItSupports": "Compiles and delivers the pseudonymised monthly data set to the LDF and Keurmerk register and reports what was excluded and why."}, {"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Shows dossier completeness and quality indicators per therapist ahead of the delivery and the audit."}]}]}, {"id": "jtbd-fyth-3", "name": "Fill the agenda and keep patients engaged between sessions", "whatItIs": "Keep the therapists' agendas full with the right mix of patients and keep every patient engaged between sessions so they finish their treatment: be findable and bookable 24/7 from the practice website and the patient app, reduce no-shows with reminders and self-service, give home exercise programmes through Physitrack that the patient actually does, run group lessons and subscriptions for chronic patients and prevention, and watch referrers, waiting times and drop-outs in the dashboard so the practice grows without adding phone hours.", "outcome": "Online bookings take a large share of new appointments, no-shows are rare, patients complete their treatment plans and their home programmes, group lessons run at capacity, and the owner sees per referrer and per location where demand comes from and where slots stay empty.", "steps": [{"step": "Be findable and bookable 24/7", "description": "Publish a practice website with the specialisations, therapists and locations, and let new and existing patients book an intake or a follow-up in the live agenda from the website or the Uw Zorg Online app at any hour, with the right slot lengths per treatment type and per therapist. Decide which slots are open for online booking and which are held for GP referrals.", "streamsNeeded": [{"id": "publish-and-run-a-practice-website", "name": "Publish and Run a Practice Website", "howItSupports": "Hosts the practice website with the online booking, e-consult and triage entry points that feed the agenda."}, {"id": "schedule-appointments-and-online-booking", "name": "Schedule Appointments and Online Booking", "howItSupports": "Exposes bookable slots per therapist and location and writes online bookings straight into the agenda."}]}, {"step": "Cut no-shows with reminders and self-service rescheduling", "description": "Send SMS, e-mail and app reminders, let patients reschedule and cancel themselves within the practice's rules, fill freed slots from the waiting list, and apply the no-show fee consistently.", "streamsNeeded": [{"id": "schedule-appointments-and-online-booking", "name": "Schedule Appointments and Online Booking", "howItSupports": "Sends reminders, handles self-service rescheduling within the rules and refills slots from the waiting list."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Gives patients appointment self-service and notifications in the app so they do not need to call."}]}, {"step": "Give a home programme the patient actually does", "description": "Prescribe an exercise programme from Physitrack or another integrated exercise partner directly from the dossier, with videos in the patient's app, and see adherence and pain scores come back before the next session so the plan is adjusted and the patient does not drop out.", "streamsNeeded": [{"id": "deliver-blended-and-e-health-care", "name": "Deliver Blended and E-health Care", "howItSupports": "Links exercise programmes from Physitrack and other partners to the episode and monitors home task completion."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Shows the programme, reminders and progress to the patient in Uw Zorg Online."}]}, {"step": "Run group lessons, programmes and subscriptions", "description": "Set up group lessons for COPD, oncology rehabilitation, falls prevention or medical fitness, manage capacity, attendance and the subscription or programme fee, and make sure group contacts are declared or invoiced correctly.", "streamsNeeded": [{"id": "schedule-appointments-and-online-booking", "name": "Schedule Appointments and Online Booking", "howItSupports": "Manages group lessons, programmes and subscriptions with capacity, attendance and self-enrolment."}, {"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Declares group treatments to insurers where allowed and invoices subscriptions and programme fees to patients."}]}, {"step": "Watch referrers, waiting times and drop-outs in the dashboard", "description": "See which GPs, specialists and websites bring patients, how long new patients wait for an intake per location, which therapists have empty slots, and which patients stopped coming before their treatment plan ended, and act with the team and the referrers.", "streamsNeeded": [{"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Provides referrer, waiting-time, occupancy and drop-out views per therapist and location."}]}]}], "customerJourneyStories": [{"id": "journey-fyth-1", "name": "From FysioRoadmap to HCI One without a migration deadline", "linkedJobIds": ["jtbd-fyth-1", "jtbd-fyth-2"], "summary": "The owner of a practice with seven physiotherapists on two locations in Brabant, a FysioRoadmap user for eight years, moves the practice to HCI One in the first wave for physiotherapy: from the GDS801 changeover and a rising administration load, via the announcement that HCI One would be built on the FysioRoadmap foundation with no forced migration, to a pilot on one location and a practice that no longer counts a working day per week as lost to administration.", "stages": [{"stage": "Trigger", "narrative": "The GDS801 changeover on 1 January 2025 goes through without rejections, but it makes the owner count what the practice actually spends on administration: the therapists confirm appointments in the agenda, then retype notes at the end of the day, then the office manager reconciles the Vecozo return messages by hand. A Fysiovakbond FDV report on working conditions in first-line physiotherapy lands in the same week and puts the figure at about a working day per week per physiotherapist."}, {"stage": "Discovery", "narrative": "At the FysioRoadmap user day HCI presents HCI One: a multidisciplinary platform built on the web-based FysioRoadmap foundation that will consolidate FysioRoadmap, SpotOnMedics, Incura, Evry and the other labels, rolled out per discipline starting with physiotherapy and with no forced migration date. The owner's account manager follows up with a demo of the voice-to-text documentation and the agenda-driven declarations, and a colleague from the regional physiotherapy network mentions that his practice is in the first wave."}, {"stage": "Evaluation", "narrative": "The owner compares three routes: stay on FysioRoadmap as long as it is supported, move to Intramed, which colleagues call the market standard, or join HCI One early. The decisive points are that HCI One keeps the FysioRoadmap dossier structure and KNGF pathways the team knows, that the NEN 7510 and ISO 27001 certification and the Vecozo, LDF and ZorgDomein connections come along unchanged, that the migration is done by HCI's implementation team and validated before go-live, and that HCI quotes the HCI One subscription for the practice's seven therapists and two locations before the pilot rather than after it, since no list price exists. The practice's data processing agreement is renewed and the therapists are consulted before the owner signs."}, {"stage": "Trial", "narrative": "One location with three therapists goes live on HCI One for a quarter while the other stays on FysioRoadmap. The implementation consultant migrates the open episodes and validates the patient, episode and declaration data against the old system, the therapists get two training sessions, and the first month's declarations are compared line by line with what FysioRoadmap would have produced. Voice-to-text is switched on for two therapists first."}, {"stage": "Engagement", "narrative": "After the second location follows, the agenda becomes the single place where treatments are registered, declarations leave every week without a separate step, and the monthly LDF delivery runs from the same episodes. The owner opens the dashboard on Monday mornings for production and rejections per therapist, and the therapists dictate notes between patients rather than after hours. Physitrack programmes are prescribed from the dossier for most new episodes."}, {"stage": "Retention", "narrative": "At renewal the practice has no reason to look elsewhere: the declaration first-time acceptance rate is higher than before, the Keurmerk audit passes on the first dossier check, and the therapists tell the owner that documentation no longer follows them home. The owner speaks at the next HCI user day about the migration and two practices from the regional network ask to join the following wave."}]}, {"id": "journey-fyth-2", "name": "A growing practice chooses SpotOnMedics for online booking and billing services", "linkedJobIds": ["jtbd-fyth-3", "jtbd-fyth-1"], "summary": "A practice owner in Haarlem who grows from three to five therapists and opens a second location replaces a legacy desktop package with SpotOnMedics: the phone as bottleneck and rejected declarations trigger the search, a Physitrack comparison and a colleague's screen surface SpotOnMedics, a quote within one business day and the billing service settle the evaluation, and a year later online booking and group lessons carry the growth.", "stages": [{"stage": "Trigger", "narrative": "The practice hires a fourth and fifth therapist and opens a second location, and the phone becomes the bottleneck: patients call to book, the assistant works two locations from one desktop agenda, and a batch of declarations bounces because the desktop package was updated late for GDS801. The owner spends the evenings correcting claims instead of treating."}, {"stage": "Discovery", "narrative": "Searching for practice software with online booking, the owner reads a Physitrack comparison of Dutch physiotherapy EPDs that lists SpotOnMedics as an option with 24/7 online booking, a mobile agenda and Mollie payments, and sees the HCI logo and the 'one in four paramedics' claim on the site. A colleague from a running-injury network shows the mobile agenda on her phone during a course, and the owner notices the practice website with a 'book online' button that writes directly into the agenda."}, {"stage": "Evaluation", "narrative": "The owner requests a quote and gets a custom proposal within one business day, based on five therapists, two locations, online booking, BI, Mollie and the optional billing service that takes over Vecozo submission and return messages. He compares it with Intramed and Fysiomanager on total cost, on whether online booking is native or a separate tool, and on who handles rejections. The EU cloud hosting, the NEN 7510 and ISO 27001 certification and the data processing agreement are checked with the practice's IT contact, and two reference practices are called."}, {"stage": "Trial", "narrative": "The practice starts with the agenda and online booking for the new location only, imports patients and open episodes with HCI's implementation consultant, and runs the first month of declarations through the billing service with the old package still open for comparison. The first online bookings arrive at 22:00 the day the website goes live, and the first return messages are handled by the billing service without the owner seeing them."}, {"stage": "Engagement", "narrative": "Within a quarter both locations run on SpotOnMedics: the assistant books in the mobile agenda from either location, half of the new appointments come in online, reminders cut no-shows, Mollie links settle the patient invoices, and the BI dashboard shows production and revenue per therapist and the referrers who bring patients. Group lessons for falls prevention are set up with subscriptions and attendance in the same agenda."}, {"stage": "Retention", "narrative": "The owner stays because the growth was absorbed without hiring a second assistant, the billing service keeps rejections invisible and the cash flow predictable, and the practice is already on the roadmap to HCI One with no deadline attached. When HCI invites the practice to the physiotherapy wave of HCI One, the owner asks to be in the early group because the agenda and online booking he depends on are the foundation of the new platform."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-fyth-top", "name": "Administration minutes per treatment", "description": "Minutes of administrative work per completed treatment across booking, eligibility checks, treatment registration, declaration correction, invoicing, documentation and quality data delivery, measured from time in the system per confirmed treatment and periodic therapist surveys. Modeled seed value derived from the reported working day per week on administration, not an official HCI or KNGF figure.", "unit": "minutes per treatment", "currentValue": "9", "targetValue": "5", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/co-fyth-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-co-fyth-top.png"}, "branches": [{"id": "co-fyth-b1", "name": "Every treatment declared and paid without rework", "description": "Whether the flow from the confirmed agenda item to money on the account runs without retyping, rejection handling or chasing, so the owner's administration time shrinks to exceptions.", "currentValue": "66", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/co-fyth-b1", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-co-fyth-b1.png", "children": [{"id": "co-fyth-b1-c1", "name": "Declaration first-time acceptance rate", "description": "Share of GDS801 declaration lines accepted by the insurer through Vecozo on first submission, without a rejection or partial rejection in the return message.", "unit": "%", "currentValue": "91", "targetValue": "98", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/co-fyth-b1-c1", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-co-fyth-b1-c1.png", "children": [{"id": "co-fyth-b1-c1-l1", "name": "Eligibility checks done before the first treatment", "description": "Share of new episodes where a Vecozo COV eligibility check was completed before the first treatment was registered.", "unit": "%", "currentValue": "74", "targetValue": "95", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/co-fyth-b1-c1-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-co-fyth-b1-c1-l1.png", "children": []}, {"id": "co-fyth-b1-c1-l2", "name": "Return messages resolved within five working days", "description": "Share of rejected or partially rejected claims that were corrected and resubmitted, or written off, within five working days of the return message.", "unit": "%", "currentValue": "60", "targetValue": "90", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/co-fyth-b1-c1-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-co-fyth-b1-c1-l2.png", "children": []}]}, {"id": "co-fyth-b1-c2", "name": "Days from treatment to paid claim", "description": "Average calendar days between the treatment date and the insurer or patient payment being matched to the claim or invoice.", "unit": "days", "currentValue": "32", "targetValue": "18", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/co-fyth-b1-c2", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-co-fyth-b1-c2.png", "children": [{"id": "co-fyth-b1-c2-l1", "name": "Declarations submitted within a week of treatment", "description": "Share of treatments whose declaration batch was submitted through Vecozo within seven days of the treatment date.", "unit": "%", "currentValue": "55", "targetValue": "90", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/co-fyth-b1-c2-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-co-fyth-b1-c2-l1.png", "children": []}, {"id": "co-fyth-b1-c2-l2", "name": "Patient invoices paid within 14 days", "description": "Share of patient invoices for uninsured treatments or no-show fees paid within 14 days, through Mollie, at the desk or by transfer.", "unit": "%", "currentValue": "48", "targetValue": "80", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/co-fyth-b1-c2-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-co-fyth-b1-c2-l2.png", "children": []}]}]}, {"id": "co-fyth-b2", "name": "Records and patient contact with minimal typing", "description": "Whether documentation and patient contact are absorbed by the dossier, voice-to-text and self-service rather than by the therapist's evenings and the assistant's phone.", "currentValue": "54", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/co-fyth-b2", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-co-fyth-b2.png", "children": [{"id": "co-fyth-b2-c1", "name": "Documentation minutes per session", "description": "Average minutes a therapist spends completing the dossier for one treatment session, from opening the note to signing it.", "unit": "minutes per session", "currentValue": "6", "targetValue": "3", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/co-fyth-b2-c1", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-co-fyth-b2-c1.png", "children": [{"id": "co-fyth-b2-c1-l1", "name": "Sessions documented with voice-to-text", "description": "Share of session notes created through voice-to-text or AI summarisation rather than typed in full.", "unit": "%", "currentValue": "15", "targetValue": "60", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/co-fyth-b2-c1-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-co-fyth-b2-c1-l1.png", "children": []}, {"id": "co-fyth-b2-c1-l2", "name": "Episodes opened on a KNGF care pathway template", "description": "Share of new episodes opened on a guideline-based care pathway rather than a blank dossier, which pre-fills fields and measurement moments.", "unit": "%", "currentValue": "70", "targetValue": "95", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/co-fyth-b2-c1-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-co-fyth-b2-c1-l2.png", "children": []}]}, {"id": "co-fyth-b2-c2", "name": "Online booking share", "description": "Share of appointments booked by patients themselves through the practice website or the Uw Zorg Online app rather than by phone or at the desk.", "unit": "%", "currentValue": "22", "targetValue": "50", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/co-fyth-b2-c2", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-co-fyth-b2-c2.png", "children": [{"id": "co-fyth-b2-c2-l1", "name": "No-show rate", "description": "Share of booked appointments where the patient did not attend and did not cancel within the practice's rules.", "unit": "%", "currentValue": "6", "targetValue": "3", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/co-fyth-b2-c2-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-co-fyth-b2-c2-l1.png", "children": []}, {"id": "co-fyth-b2-c2-l2", "name": "Phone calls per 100 appointments", "description": "Inbound phone calls handled by the practice per 100 booked appointments, a measure of how much contact self-service has absorbed.", "unit": "calls per 100 appointments", "currentValue": "40", "targetValue": "15", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/co-fyth-b2-c2-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-co-fyth-b2-c2-l2.png", "children": []}]}]}]}, "businessOutcomes": {"top": {"id": "bo-fyth-top", "name": "Annual recurring revenue from physiotherapy practices", "description": "Subscription, module, billing-service and payment revenue per year from physiotherapy practices on FysioRoadmap, SpotOnMedics, Incura and HCI One. Modeled seed value: about 12,000 physiotherapists on HCI labels at the modeled average of EUR 45 per therapist per month, for a group that reported EUR 20 million turnover in 2023 before the Embloom and SpotOnMedics acquisitions; HCI publishes no list prices and no segment revenue, so this is not an official HCI figure.", "unit": "EUR million per year", "currentValue": "6.5", "targetValue": "11", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/bo-fyth-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-bo-fyth-top.png"}, "branches": [{"id": "bo-fyth-b1", "name": "Physiotherapy practice base growth and HCI One migration", "description": "How fast the physiotherapy base grows and how quickly it moves onto HCI One, the platform that carries the future roadmap.", "currentValue": "48", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/bo-fyth-b1", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-bo-fyth-b1.png", "children": [{"id": "bo-fyth-b1-c1", "name": "Physiotherapy practices on HCI labels", "description": "Number of physiotherapy practices with an active subscription on any HCI paramedical label at the end of the period. Modeled seed value for a vendor that calls itself market leader in physiotherapy software; Nivel's 2024 registration network covered 543 practices and 7,848 physiotherapists, a sample rather than the national base, so no official practice count exists.", "unit": "practices", "currentValue": "1800", "targetValue": "2400", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/bo-fyth-b1-c1", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-bo-fyth-b1-c1.png", "children": [{"id": "bo-fyth-b1-c1-l1", "name": "New physiotherapy practices won per month", "description": "Physiotherapy practices that signed a subscription in the month, across all labels and HCI One.", "unit": "practices per month", "currentValue": "25", "targetValue": "40", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/bo-fyth-b1-c1-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-bo-fyth-b1-c1-l1.png", "children": []}, {"id": "bo-fyth-b1-c1-l2", "name": "Practices live on HCI One", "description": "Cumulative number of physiotherapy practices that completed migration to HCI One and switched off their previous label.", "unit": "practices", "currentValue": "120", "targetValue": "1600", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/bo-fyth-b1-c1-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-bo-fyth-b1-c1-l2.png", "children": []}]}, {"id": "bo-fyth-b1-c2", "name": "Trial-to-subscription conversion", "description": "Share of physiotherapy practices that started a demo, quote or pilot and signed a subscription within 90 days.", "unit": "%", "currentValue": "38", "targetValue": "55", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/bo-fyth-b1-c2", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-bo-fyth-b1-c2.png", "children": [{"id": "bo-fyth-b1-c2-l1", "name": "Quotes issued within one business day", "description": "Share of quote requests answered with a custom proposal within one business day, the service level SpotOnMedics advertises.", "unit": "%", "currentValue": "80", "targetValue": "98", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/bo-fyth-b1-c2-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-bo-fyth-b1-c2-l1.png", "children": []}, {"id": "bo-fyth-b1-c2-l2", "name": "Go-lives within the agreed onboarding window", "description": "Share of new practices and migrations that went live on the date agreed in the onboarding plan.", "unit": "%", "currentValue": "74", "targetValue": "92", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/bo-fyth-b1-c2-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-bo-fyth-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-fyth-b2", "name": "Retention and revenue per practice", "description": "Whether practices stay through the consolidation and whether each practice buys the modules and services that lift revenue per therapist.", "currentValue": "60", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/bo-fyth-b2", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-bo-fyth-b2.png", "children": [{"id": "bo-fyth-b2-c1", "name": "Annual physiotherapy practice churn rate", "description": "Share of physiotherapy practices that ended their subscription in the year, including practices lost during migration to HCI One.", "unit": "%", "currentValue": "5.5", "targetValue": "3", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/bo-fyth-b2-c1", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-bo-fyth-b2-c1.png", "children": [{"id": "bo-fyth-b2-c1-l1", "name": "Practices with an active billing-service contract", "description": "Share of physiotherapy practices that outsource Vecozo submission and return-message handling to HCI's billing services.", "unit": "%", "currentValue": "22", "targetValue": "35", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/bo-fyth-b2-c1-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-bo-fyth-b2-c1-l1.png", "children": []}, {"id": "bo-fyth-b2-c1-l2", "name": "Support tickets per practice per month", "description": "Average number of support tickets raised per physiotherapy practice per month, a driver of both churn and service cost.", "unit": "tickets per practice per month", "currentValue": "0.9", "targetValue": "0.5", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/bo-fyth-b2-c1-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-bo-fyth-b2-c1-l2.png", "children": []}]}, {"id": "bo-fyth-b2-c2", "name": "Average revenue per physiotherapist per month", "description": "Monthly recurring revenue from subscriptions, modules, billing services and payment fees divided by the number of physiotherapists on HCI labels. Modeled blended value across the labels; HCI quotes per practice and publishes no list prices, and third-party comparisons put SpotOnMedics FysioOne at roughly EUR 5 per user per month while FysioRoadmap and billing services sit far higher.", "unit": "EUR per therapist per month", "currentValue": "45", "targetValue": "58", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/bo-fyth-b2-c2", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-bo-fyth-b2-c2.png", "children": [{"id": "bo-fyth-b2-c2-l1", "name": "Add-on module attach rate", "description": "Share of practices with at least one paid add-on beyond the base agenda and dossier: online booking, BI, Mollie payments, group lessons or voice-to-text.", "unit": "%", "currentValue": "40", "targetValue": "65", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/bo-fyth-b2-c2-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-bo-fyth-b2-c2-l1.png", "children": []}, {"id": "bo-fyth-b2-c2-l2", "name": "Declaration value processed for physiotherapy practices", "description": "Annual value of GDS801 declarations submitted through HCI labels for physiotherapy practices, the base for billing-service fees. Modeled from the EUR 500 million+ annual declarations HCI reported in 2022 for 7,500 professionals (roughly EUR 65,000 per professional per year), scaled to the modeled physiotherapy base of about 12,000 therapists; not a reported figure.", "unit": "EUR million per year", "currentValue": "650", "targetValue": "900", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/fyth/kpis/bo-fyth-b2-c2-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-fyth-bo-fyth-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make HCI One the platform on which a physiotherapy practice runs from the agenda: every treatment declared and paid from the appointment, records and quality data that write themselves, patients who book and exercise in the app, and a migration from FysioRoadmap, SpotOnMedics or Incura that the practice chooses when it is ready and never has to fear.", "timeHorizons": {"year1": {"focus": "Take the first physiotherapy practices live on HCI One while FysioRoadmap, SpotOnMedics and Incura stay fully supported, keep GDS801 declarations flowing without rejection spikes, ship voice-to-text documentation, and raise online booking and app activation so that practices feel the administrative relief within the year.", "productTheme": "Declared from the agenda, documented by voice, no forced migration", "customerKPI": {"northStar": "Administration minutes per treatment", "supporting": ["Declaration first-time acceptance rate", "Online booking share"]}, "businessKPI": {"northStar": "Annual recurring revenue from physiotherapy practices", "revenueStreams": ["Practice subscriptions on FysioRoadmap, SpotOnMedics, Incura and HCI One, quoted per number of therapists, modules and integrations", "Billing services on the declaration value processed for practices", "Add-on modules: online booking, BI dashboards, Mollie payments, group lessons"], "supporting": ["Practices live on HCI One", "Trial-to-subscription conversion"]}, "milestones": ["Take the first wave of physiotherapy practices live on HCI One with validated migrations from FysioRoadmap and SpotOnMedics and hypercare in the first month", "Keep GDS801 first-time acceptance above the pre-changeover level by shipping insurer contract and return-message rules ahead of each yearly contract round", "Release voice-to-text session notes and KNGF pathway templates on HCI One and FysioRoadmap and switch online booking on by default for new practices"]}, "year3": {"focus": "Bring all physiotherapy practices onto HCI One with the best of every label: SpotOnMedics booking and BI, FysioRoadmap dossier content, Incura's multidisciplinary pathways; make Uw Zorg Online the default patient front door for physiotherapy; and let AI drafting, automated eligibility checks and exception-only rejection handling remove the remaining administration.", "productTheme": "One physiotherapy platform with the patient in the app", "customerKPI": {"northStar": "Administration minutes per treatment", "supporting": ["Documentation minutes per session", "Days from treatment to paid claim"]}, "businessKPI": {"northStar": "Annual recurring revenue from physiotherapy practices", "revenueStreams": ["HCI One subscriptions per practice with module tiers", "Billing services and payment fees on a rising declaration and patient invoice volume", "E-health and exercise content through the partner platform"], "supporting": ["Annual physiotherapy practice churn rate", "Add-on module attach rate"]}, "milestones": ["Complete the migration of FysioRoadmap and SpotOnMedics physiotherapy practices to HCI One and retire duplicate label infrastructure", "Deliver AI-drafted intake and evaluation reports and automated COV checks at booking so documentation and rejection handling become exception work", "Activate Uw Zorg Online for the majority of physiotherapy patients with booking, PROMs, exercise programmes and invoices in one app"]}, "year5": {"focus": "Position HCI One as the data-driven care platform for first-line physiotherapy in the Benelux: outcome benchmarks per pathway from LDF-grade data, prevention and remote-monitoring programmes reimbursed by insurers, and a practice that runs with a fraction of today's administration in a market short of therapists.", "productTheme": "Data-driven pathways and reimbursed remote care", "customerKPI": {"northStar": "Administration minutes per treatment", "supporting": ["Online booking share", "Declaration first-time acceptance rate"]}, "businessKPI": {"northStar": "Annual recurring revenue from physiotherapy practices", "revenueStreams": ["Platform subscriptions across the national physiotherapy base", "Remote monitoring and prevention programmes reimbursed by insurers and delivered through the platform", "Benchmark and outcome analytics for practices, networks and insurers"], "supporting": ["Average revenue per physiotherapist per month", "Physiotherapy practices on HCI labels"]}, "milestones": ["Offer outcome benchmarks per KNGF pathway to every practice and to the insurer contract negotiations of practice networks", "Launch reimbursed remote-monitoring and prevention programmes for chronic patients with exercise partners inside HCI One", "Extend HCI One physiotherapy to Belgium with the local declaration and guideline rules"]}}}, "domain": "Paramedical Practices"}, {"id": "alth", "name": "Allied Health Therapist", "description": "Speech therapist, occupational therapist, exercise therapist (Cesar or Mensendieck), dietitian or podiatrist in a solo practice or a small multidisciplinary practice, who treats patients most of the week and is also the practice's administrator: takes referrals from GPs, paediatricians, child health clinics and schools, works under the guideline and code list of the discipline (NVLF, Ergotherapie Nederland, VvOCM, NVD, podiatry), lives with policy limits that differ per discipline such as three hours of dietetics and ten hours of occupational therapy per year in the basic insurance, declares GDS801 claims through Vecozo since the standard replaced PM304 on 1 January 2025, and registers chain-care contacts for GP care groups and preventive or WMO contacts for municipalities. Runs the practice on Incura, the multidisciplinary EPD used by around 7,500 providers, or on Evry, the dietetics software that HCI acquired with Ensemble, and will move to HCI One in the wave for the discipline with no forced migration. Judges the software on whether it knows the rules of the discipline, whether referrals and reports flow through the dossier instead of being retyped, and whether outcomes can be shown to patients and payers without a separate spreadsheet.", "icon": "alth.png", "careAbout": ["Discipline-specific care pathways, guideline templates, measurement instruments and code lists that are maintained by the vendor, so the rules of speech therapy, occupational therapy, exercise therapy, dietetics or podiatry are applied by the software rather than remembered in the evening", "Policy limits per discipline visible at intake, so a contact beyond the reimbursed hours becomes a patient invoice with a payment link rather than a rejection and a dispute", "Referrals that arrive in the dossier through ZorgDomein and reports that leave from it through ZorgMail to the GP, the paediatrician, the school and the care group without a second document", "Chain-care and municipal contacts registered once and declared to the right payer with its tariff and message format, without a second registration in the payer's portal", "Outcomes the patient or parent sees in the app and the practice can show to referrers, care groups, municipalities and insurers when contracts are discussed", "A price that fits a solo or two-person practice at allied health tariffs, and a migration to HCI One that carries the Incura or Evry content and integrations along on the practice's own timing"], "winsThem": ["Incura's multidisciplinary dossier with pathways for physiotherapy, speech therapy, occupational therapy, exercise therapy and dietetics, and Evry's dietetics-specific measurements, diet plans and chain-care declarations", "Eligibility checks and remaining-hours tracking per discipline at intake, declarations generated from the agenda and submitted through Vecozo, and billing services that handle return messages for the practice", "ZorgDomein and ZorgMail connections that open episodes from referrals and send referrer reports from the dossier, and the municipal messaging model reused for youth and WMO contacts", "PROMs and measurement instruments per discipline with progress charts in the patient app, home programmes and diet modules between sessions, and dashboards on outcomes per programme and per referrer", "The promise that HCI One consolidates Incura, Evry, Podofile and Abakus per discipline with no forced migration, backed by NEN 7510 and ISO 27001 certification and a quote within one business day"], "theirFear": ["A discipline template or code list that the vendor stops maintaining after the acquisition, so the rules of speech therapy or dietetics are applied wrongly and the claims are rejected in bulk after a yearly contract round", "Being moved to HCI One on a physiotherapy timetable, losing the Evry or Incura content and the ZorgDomein and municipal connections that the small practice cannot rebuild itself", "Spending the tariff on administration: a solo therapist who loses a quarter of the working week to registrations in three payer portals and retyped reports while the waiting list grows"], "jobsToBeDone": [{"id": "jtbd-alth-1", "name": "Record and declare discipline-specific care correctly", "whatItIs": "Run an episode of speech therapy, occupational therapy, exercise therapy, dietetics or podiatry from referral to paid claim with the rules of that discipline applied by the software rather than remembered by the therapist: the NVLF, Ergotherapie Nederland, VvOCM, NVD or podiatry guideline that structures the dossier, the diagnosis and treatment codes of the discipline, the policy limits that differ per discipline (three hours of dietetics and ten hours of occupational therapy per year in the basic insurance, speech therapy with or without a referral), the GDS801 declaration through Vecozo since 1 January 2025, and the patient invoice for whatever the policy does not cover. In a solo or small multidisciplinary practice the therapist is also the administrator, so every rule the software does not know becomes a rejection or an evening of correction.", "outcome": "Every contact is registered once with the right discipline codes, declarations are accepted by the insurer on first submission, the remaining hours of the policy are visible before the session rather than in a return message, patient invoices for uncovered care go out the same week, and the therapist's administrative time per client contact drops to a few minutes.", "steps": [{"step": "Take the referral or direct-access intake with the discipline's indication", "description": "Register the patient from a GP or specialist referral, a ZorgDomein message, a school or child health clinic signal, or direct access where the discipline allows it, capture the indication, the referral date and the referrer, and decide whether the episode falls under the basic insurance, a supplementary policy, a chain-care contract with the GP care group or a municipal arrangement.", "streamsNeeded": [{"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Opens the episode with the discipline's intake structure and captures referral, indication and financing route once."}, {"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "howItSupports": "Brings ZorgDomein referrals and GP correspondence into the dossier so referral date and referrer are never retyped."}]}, {"step": "Check the policy limits and the contract for this discipline", "description": "Run the COV check with Vecozo, see how many hours of dietetics or occupational therapy remain in the calendar year and whether the supplementary policy covers more, check the tariff and the administrative conditions in the insurer contract for this discipline, and tell the patient at intake what will be reimbursed and what they will pay themselves.", "streamsNeeded": [{"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Performs the Vecozo eligibility check, tracks the remaining reimbursed hours per discipline and holds the insurer contracts with their tariffs and conditions."}, {"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Authenticates the therapist and logs the BSN lookup and consent capture as NEN 7510 and the AVG require."}]}, {"step": "Register the contact from the agenda with the discipline's codes", "description": "Confirm the contact in the agenda, let the system derive the treatment code, the time unit and the diagnosis code from the discipline's code list and the episode, and handle the exceptions: a home visit or school visit with a surcharge, a group session, a contact for a child paid by the municipality, a session that exceeds the yearly hours and becomes a patient invoice.", "streamsNeeded": [{"id": "schedule-appointments-and-online-booking", "name": "Schedule Appointments and Online Booking", "howItSupports": "Holds the agenda with contact type, location and duration so the registration carries what the claim needs."}, {"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Converts confirmed contacts into declaration lines using the discipline's code list and the GDS801 rules."}]}, {"step": "Submit through Vecozo and correct rejections at the source", "description": "Batch the declarations per insurer and per financing route, submit them through Vecozo, read the return messages, and correct the cause rather than the symptom: a missing referral date on a speech therapy claim, a dietetics contact beyond the three-hour limit, a wrong code for a home visit. Or hand the cycle to HCI's billing service that handles the return messages.", "streamsNeeded": [{"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Submits GDS801 batches through the Vecozo gateway, matches return messages to claims and drives correction or the outsourced billing service."}, {"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Shows rejection reasons per insurer and per discipline so the recurring causes are fixed in the templates."}]}, {"step": "Invoice the patient for uncovered care and keep the ledger clean", "description": "Invoice the hours beyond the policy limit, the direct-access contacts without cover, the no-show fee and the podiatry insoles or dietetics programme that insurers do not reimburse, with a Mollie payment link or a desk payment, and export everything to the accountant in Twinfield without a separate spreadsheet.", "streamsNeeded": [{"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Produces patient invoices from the agenda, collects iDEAL payments through Mollie and exports to accounting."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Lets the patient see and pay the invoice in the app rather than receiving it on paper."}]}]}, {"id": "jtbd-alth-2", "name": "Work with GPs, schools and municipalities without double registration", "whatItIs": "Deliver care that is almost always part of a network: the GP or paediatrician who refers and expects a report, the GP care group whose chain-care programme for diabetes or COPD pays the dietitian per patient, the school or child health clinic that signals a speech or motor problem and wants to know what happens, the municipality that funds preventive speech therapy or an occupational therapy advice under the WMO, and the pharmacy or specialist who needs to know about a diet or a compensation aid. The therapist wants each of these relationships to run on messages that leave from and arrive in the dossier, so no letter is retyped, no report is written twice for two systems, and no municipal contact is registered in a separate portal.", "outcome": "Every referral arrives in the dossier and every report to a referrer leaves from it through ZorgMail or ZorgDomein, chain-care and municipal contacts are registered once and declared to the right payer, schools and parents get an update without a phone call, and the therapist's network administration shrinks to signing what the dossier has already prepared.", "steps": [{"step": "Receive referrals and signals from GPs, schools and clinics into the dossier", "description": "Take the ZorgDomein referral, the GP letter through ZorgMail, the school's signal form or the child health clinic's message and let it create or update the episode with the referral date, the referrer and the question, instead of scanning a letter and typing its content into an intake screen.", "streamsNeeded": [{"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "howItSupports": "Receives ZorgDomein referrals and ZorgMail messages straight into the dossier with referral date and referrer captured."}, {"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Creates or updates the episode from the incoming referral so the intake starts with the referrer's question in place."}]}, {"step": "Register chain-care and municipal contacts once and declare them to the right payer", "description": "Register a diabetes chain-care contact that is paid per patient by the GP care group, a preventive speech therapy contact funded by the municipality or a WMO advice, and let the system route each to the right declaration flow and tariff without a second registration in the payer's portal.", "streamsNeeded": [{"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Routes contacts to the insurer, the care group or the municipal arrangement with the tariff and message format of that payer."}, {"id": "coordinate-ggz-treatment-and-medication", "name": "Coordinate GGZ Treatment and Medication", "howItSupports": "Provides the municipal (Jeugdwet and WMO) assignment and messaging model reused for youth speech therapy and WMO advice contacts."}]}, {"step": "Report back to the referrer from the dossier", "description": "Generate the intake report, the interim report and the final report to the GP, paediatrician or specialist from the dossier fields already filled, adjust the wording, and send it through ZorgMail or ZorgDomein with the loop closed in the episode, so a report is written once and the referrer's system files it automatically.", "streamsNeeded": [{"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "howItSupports": "Generates the referrer report from dossier content and sends it securely with delivery confirmation in the episode."}, {"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Keeps report templates per discipline and pre-fills them from the anamnesis, goals and evaluations."}]}, {"step": "Keep parents, schools and informal carers informed without a phone call", "description": "Share the home programme, the practice advice for the classroom and the progress update with parents through the patient app, let a parent or carer with a share permission see the plan, and answer questions in an e-consult instead of on the phone between two sessions.", "streamsNeeded": [{"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Gives parents and patients e-consult, programme and progress views in Uw Zorg Online."}, {"id": "manage-personal-health-data-and-sharing", "name": "Manage Personal Health Data and Sharing", "howItSupports": "Lets a parent or informal carer see the plan and progress under a granular share permission."}]}, {"step": "Coordinate with the pharmacy, specialist and multidisciplinary team on one record", "description": "In a multidisciplinary practice or a chain-care programme let the dietitian, the podiatrist and the exercise therapist see each other's goals and notes for the same diabetes patient, exchange the medication overview with the pharmacy, and prepare the multidisciplinary consultation from the shared episode rather than from three e-mails.", "streamsNeeded": [{"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Holds a multidisciplinary episode with per-discipline goals and notes visible to the treating team under consent."}, {"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "howItSupports": "Exchanges medication overviews and consultation letters with pharmacy and specialist systems through the HIS/AIS and ZorgMail connectors."}]}]}, {"id": "jtbd-alth-3", "name": "Measure progress and show outcomes to patients and payers", "whatItIs": "Prove that the treatment works, in the language of the patient, the referrer and the payer: take the discipline's measurement instruments and PROMs at intake, evaluation and closure (a speech intelligibility scale, the COPM for occupational therapy, weight, waist and diet quality for dietetics, a foot function index for podiatry), show the patient their own progress in the app, use the outcomes to adjust the treatment plan, deliver the quality data the discipline's register or the insurer contract asks for, and show in the practice dashboard which treatments, referrers and programmes produce results. Insurers increasingly attach quality conditions to allied health contracts and the discipline registers ask for outcome data the way LDF does for physiotherapy.", "outcome": "Every episode has measurements at start and end that the patient can see, treatment plans are adjusted on evidence rather than on habit, the quality data the register or the insurer asks for is delivered from the dossier without a separate extraction, and the practice can show referrers and payers outcomes per programme when contracts are negotiated.", "steps": [{"step": "Choose the measurement moments and instruments per discipline pathway", "description": "Open the episode on the discipline's care pathway so the instruments and moments are pre-planned: intake, six-week evaluation and closure, with the instrument the guideline recommends for that complaint and the one the insurer contract requires. Decide which instruments the patient fills in at home and which the therapist measures in the session.", "streamsNeeded": [{"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Provides discipline pathways with the guideline's measurement moments and instruments pre-planned per complaint."}, {"id": "measure-outcomes-with-proms-and-rom", "name": "Measure Outcomes with PROMs and ROM", "howItSupports": "Offers the instrument library per discipline and schedules the moments in the episode."}]}, {"step": "Collect PROMs from the patient before the session", "description": "Send the questionnaire to the patient's or parent's app before the intake and the evaluation moments, remind them the day before, and see the scores in the dossier when the patient walks in, with the previous scores and the benchmark next to them.", "streamsNeeded": [{"id": "measure-outcomes-with-proms-and-rom", "name": "Measure Outcomes with PROMs and ROM", "howItSupports": "Sends PROMs at the planned moments, collects responses and shows them against previous scores and benchmarks."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Delivers the questionnaire and the reminder to the patient or parent in Uw Zorg Online."}]}, {"step": "Record clinical measurements and adjust the plan on evidence", "description": "Enter the measurements taken in the session, compare them with the goals set at intake, decide with the patient whether to continue, intensify or close, and document the decision in the treatment plan so the evaluation report and the closure carry the same numbers.", "streamsNeeded": [{"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Links measurements to treatment goals and evaluation decisions in the plan and the reports."}, {"id": "measure-outcomes-with-proms-and-rom", "name": "Measure Outcomes with PROMs and ROM", "howItSupports": "Shows clinical measurements and PROMs on one timeline against goals and benchmarks."}]}, {"step": "Show the patient their own progress and home programme", "description": "Let the patient or parent see the scores, the goals and the home exercises or diet plan in the app, with the progress chart the therapist explains in the session, so motivation between sessions does not depend on memory and the patient finishes the programme.", "streamsNeeded": [{"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Shows progress, goals and programme to the patient in the app with notifications between sessions."}, {"id": "deliver-blended-and-e-health-care", "name": "Deliver Blended and E-health Care", "howItSupports": "Delivers home exercises, diet modules and monitoring tasks linked to the episode and reports completion back."}]}, {"step": "Deliver quality data and show outcomes to referrers and payers", "description": "Let the EPD deliver the pseudonymised data set the discipline's quality register or the insurer contract asks for, under opt-in consent, check the delivery report, and use the outcome and referrer dashboards in the annual conversation with the GP care group, the municipality and the insurer.", "streamsNeeded": [{"id": "measure-outcomes-with-proms-and-rom", "name": "Measure Outcomes with PROMs and ROM", "howItSupports": "Compiles and delivers pseudonymised quality data per discipline register and contract under consent."}, {"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Provides outcome, programme and referrer dashboards used in contract and network conversations."}]}]}], "customerJourneyStories": [{"id": "journey-alth-1", "name": "A speech therapy practice moves from a generic EPD to Incura", "linkedJobIds": ["jtbd-alth-1", "jtbd-alth-2"], "summary": "Two speech therapists in a practice in Overijssel that treats mostly children referred by GPs, child health clinics and schools leave a generic paramedical package for Incura: rejected claims after the GDS801 changeover and a school report typed twice trigger the search, an NVLF regional meeting and a colleague's dossier surface Incura, the discipline templates and the ZorgDomein and ZorgMail connections decide the evaluation, and a year later every referral arrives in the dossier and every report leaves from it.", "stages": [{"stage": "Trigger", "narrative": "After 1 January 2025 the practice's generic package handles the GDS801 changeover late and a month of speech therapy declarations bounces because the referral date is missing on claims for children. The same week a school asks for a progress report that the therapist has already written for the GP, and she retypes it in the school's format. The two therapists add up their evenings and find that administration takes a quarter of their working week at a tariff that leaves nothing for an assistant."}, {"stage": "Discovery", "narrative": "At an NVLF regional meeting a colleague shows her Incura dossier on a laptop: the speech therapy care pathway with the NVLF guideline fields, the ZorgDomein referral that opened the episode, and the report to the GP that was generated from the evaluation and sent through ZorgMail. The therapists learn that Incura is part of HCI, that it serves around 7,500 providers across physiotherapy, speech therapy, occupational therapy, exercise therapy and dietetics, and that it will become part of HCI One without a forced migration."}, {"stage": "Evaluation", "narrative": "The practice compares Incura with Intramed and Crossuite on three things: whether the speech therapy templates and code lists are maintained by the vendor, whether referrals and reports run through ZorgDomein and ZorgMail without a separate tool, and what a two-therapist practice pays for it. They ask HCI for a quote and get it within a business day, check the NEN 7510 and ISO 27001 certification and the data processing agreement, call two speech therapy practices that use Incura, and confirm that the municipality's preventive speech therapy contacts can be registered in the same dossier."}, {"stage": "Trial", "narrative": "The implementation consultant migrates the patient list and the open episodes, the therapists run one month with the new declarations checked against the old package, and the first GDS801 batch is accepted without a rejection. The first ZorgDomein referral from a GP opens an episode by itself, and the first report to a paediatrician leaves from the dossier through ZorgMail with the loop closed. Parents of the first children get the home programme in the app."}, {"stage": "Engagement", "narrative": "After a quarter the practice runs entirely on Incura: intake on the NVLF pathway, contacts registered from the agenda, declarations to the insurer and the municipal contacts routed to the right payer, PROMs sent to parents before the evaluation, and the report to the school generated from the same evaluation as the report to the GP. The therapists spend the evening they used to lose on administration on treatment preparation, and the dashboard shows which schools and clinics refer the most children."}, {"stage": "Retention", "narrative": "At renewal the question is not whether to stay but what to switch on next: declarations to the insurers and the municipality are accepted first time, the reports to the GP, the paediatrician and the school leave from the same evaluation, and the two therapists have stopped counting evenings. What keeps them on Incura is that HCI updated the NVLF pathway and the code list in the yearly contract round before the first claim of the year went out, and that HCI has confirmed the speech therapy wave of HCI One will carry the Incura templates and the ZorgDomein and municipal connections over on a date the practice picks. The therapists sign a second two-year term and ask to be told as soon as the speech therapy wave opens."}]}, {"id": "journey-alth-2", "name": "A dietetics practice grows on Evry and prepares for HCI One", "linkedJobIds": ["jtbd-alth-3", "jtbd-alth-1"], "summary": "A dietitian in Utrecht who starts a solo practice, joins a GP care group's diabetes and COPD chain-care programmes and later hires a second dietitian and a lifestyle coach chooses Evry, the dietetics practice software that HCI acquired with Ensemble: the three-hour policy limit and the chain-care declarations trigger the search, the NVD network and Evry's dietetics reputation surface it, outcome measurement and the chain-care declaration flow decide, and after two years the practice shows the care group its outcomes from the dashboard and prepares for HCI One.", "stages": [{"stage": "Trigger", "narrative": "The dietitian starts a solo practice and within months has patients under the three-hour basic insurance limit, patients with supplementary cover, a GP care group that pays per patient for diabetes and COPD chain care, and a GLI programme with a lifestyle coach. Each payer has its own registration and the spreadsheet she keeps to track the remaining hours per patient fails for the first time when a patient exceeds the limit and refuses the invoice."}, {"stage": "Discovery", "narrative": "In the NVD network and on the dietetics forums Evry is the name that comes up for dietitians: founded in 1996 in Alphen aan den Rijn, market leader for dietitians and weight consultants, and since 2023 part of HCI. A dietitian colleague in the care group shows the chain-care declaration in Evry and the weight, waist and diet quality measurements charted per patient, and mentions that the same company runs Incura and is building HCI One for all paramedical disciplines."}, {"stage": "Evaluation", "narrative": "The dietitian compares Evry with Intramed and with a generic package on how the remaining reimbursed hours are tracked, how chain-care contacts are declared to the care group, whether the measurements the NVD guideline recommends are built in, and what the patient app offers for diet plans between sessions. She checks the price for a solo practice, the NEN 7510 and ISO 27001 certification, and the data processing agreement the care group requires, and asks whether Evry customers will be moved to HCI One on a deadline; the answer is that the rollout is per discipline with no forced migration."}, {"stage": "Trial", "narrative": "She starts with Evry for the new patients and runs the first quarter of declarations for the insurers and the care group through it, with the eligibility check at intake showing the remaining hours. The first patient beyond the limit gets an invoice with a Mollie link the same day, the first chain-care batch is accepted by the care group, and the first patients fill in the diet quality questionnaire in the app before the evaluation."}, {"stage": "Engagement", "narrative": "Two years later the practice has two dietitians and a lifestyle coach, runs the GLI groups and the chain-care programmes from the same agenda, sends measurements and diet plans to patients in the app, and shows the care group in the annual meeting the outcomes per programme from the dashboard. Referrals from the GPs arrive through ZorgDomein and the reports go back through ZorgMail. The practice's administrative time per client contact is a fraction of the first year."}, {"stage": "Retention", "narrative": "The practice stays on Evry because the care group and the insurers get their data without extra work, because the remaining-hours check has not produced a disputed invoice since the first year, and because the outcome dashboard has become the practice's argument in its annual contract talks with the care group and the municipality. When HCI announces the dietetics wave of HCI One, the dietitian asks for an early slot on the condition that the Evry measurement content, the GLI group programmes and the chain-care declarations are validated in a staging tenant before the practice moves; HCI's consultant walks her through the migration validation report, and the practice books its cut-over between two GLI cohorts."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-alth-top", "name": "Administrative time per client contact", "description": "Minutes of administrative work per client contact across intake and referral handling, eligibility and policy-limit checks, contact registration, declaration correction, patient invoicing, reporting to referrers and payers, and quality data delivery, measured from time in the system per contact and periodic therapist surveys. Modeled seed value for solo and small multidisciplinary allied health practices, not an official HCI or professional-association figure.", "unit": "minutes per client contact", "currentValue": "11", "targetValue": "6", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/
