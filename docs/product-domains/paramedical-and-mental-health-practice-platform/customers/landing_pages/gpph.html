rtner management, support and engineering cost per active partner.", "unit": "EUR per year", "currentValue": "15000", "targetValue": "9000", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/intp/kpis/bo-intp-b2-c2", "linkLabel": "Open KPI dashboard", "icon": "kpi-intp-bo-intp-b2-c2.png", "children": [{"id": "bo-intp-b2-c2-l1", "name": "Partner support tickets per quarter", "description": "Support and incident tickets raised per active partner per quarter.", "unit": "tickets", "currentValue": "14", "targetValue": "6", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/intp/kpis/bo-intp-b2-c2-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-intp-bo-intp-b2-c2-l1.png", "children": []}, {"id": "bo-intp-b2-c2-l2", "name": "Engineering hours per partner release", "description": "HCI engineering hours spent per partner on coordination and fixes around an HCI release.", "unit": "hours", "currentValue": "24", "targetValue": "8", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/intp/kpis/bo-intp-b2-c2-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-intp-bo-intp-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make HCI's open platform the one connection an exercise, e-health, quality, accounting, payment or care-network vendor needs to reach more than 40,000 professionals across every label and HCI One: certified once, switchable by any practice in minutes, monitored per label, and stable through releases and label migrations, so that partners invest in better care content instead of connection maintenance.", "timeHorizons": {"year1": {"focus": "Bring the partners of the acquired labels (Physitrack, PhysioTrack, Fysio AI, Qualiview, MediQuest, Twinfield, Mollie, ZorgDomein, ZorgMail, HIS and AIS vendors) onto one versioned partner API before the HCI One physiotherapy rollout, with sandbox tenants per label, a published deprecation policy and a partner dashboard.", "productTheme": "One partner API across the labels", "customerKPI": {"northStar": "Integration time to live", "supporting": ["Partner onboarding lead time", "Partner API availability"]}, "businessKPI": {"northStar": "Partner ecosystem revenue", "revenueStreams": ["Partner programme fees", "Revenue share on partner subscriptions"], "supporting": ["Active integration partners", "Cost to serve per partner"]}, "milestones": ["Certify the existing exercise, quality and accounting partners on the shared interfaces so that every label reaches them through one connection", "Publish the release calendar, deprecation policy and per-label partner dashboard with alerting", "Cut partner onboarding lead time to one week with self-service credentials and sandbox tenants"]}, "year3": {"focus": "Make the partner API the standard way e-health content, devices and network services are added to HCI One, CRS and Uw Zorg Online, with a partner catalogue practices switch on themselves, revenue share as the default model, and GGZ and patient-facing interfaces opened to partners.", "productTheme": "The partner catalogue as the growth channel", "customerKPI": {"northStar": "Integration time to live", "supporting": ["Partner-initiated transactions per month", "Labels reachable per integration"]}, "businessKPI": {"northStar": "Partner ecosystem revenue", "revenueStreams": ["Partner programme fees", "Revenue share on partner subscriptions", "Paid interface tiers"], "supporting": ["Practices using at least one partner integration", "Revenue per active partner"]}, "milestones": ["Open GGZ, e-health and patient-app interfaces so that questionnaire, intervention and device partners reach CRS and Uw Zorg Online users", "Launch the practice-facing partner catalogue with self-service activation and usage reporting per practice", "Move the partner base to revenue-share agreements with transaction-level settlement"]}, "year5": {"focus": "Run the open platform as the care network ecosystem for first-line and mental health care in the Benelux and DACH region, with outcome data and remote-monitoring devices flowing through partner interfaces and partners following HCI into new markets.", "productTheme": "Ecosystem for the care network", "customerKPI": {"northStar": "Integration time to live", "supporting": ["Transaction error rate", "Practices with an active partner connection"]}, "businessKPI": {"northStar": "Partner ecosystem revenue", "revenueStreams": ["Revenue share on partner subscriptions", "Paid interface tiers", "Data and outcome services for partners"], "supporting": ["Partner churn rate", "Partner fee collection rate"]}, "milestones": ["Extend the partner API to remote-monitoring devices and prevention programmes reimbursed by insurers", "Offer partners anonymised outcome benchmarks as a paid data service under the quality-register consent model", "Take the partner programme to Belgian and Swiss labels so that partners follow HCI into new markets"]}}}, "domain": "Partners and HCI Operations"}, {"id": "impl", "name": "Implementation and Support Consultant", "description": "HCI staff member in the customer operations unit, one of the implementation, training, support desk and billing-service colleagues among HCI's roughly 250 employees, who takes newly signed practices live on HCI One, FysioRoadmap, SpotOnMedics, Incura, Evry or CRS, migrates the customers of acquired labels into HCI One in waves per discipline, trains therapists and assistants, answers support tickets across all labels and processes declaration return messages for practices that outsource billing to HCI. Often joined through an acquisition and knows one label deeply. Judged on go-lives on schedule, clean migrated data, resolution times and practices that stay through the consolidation.", "icon": "impl.png", "careAbout": ["Go-lives that happen on the agreed day with correct master data, migrated dossiers the therapists trust and a first declaration round that Vecozo accepts", "Migration tooling that carries a label's full history, financial items, partner links and patient-app accounts into HCI One and proves it with a validation report the practice can sign", "Templates for discipline pathways, declaration rules and tenant settings, so that configuration is applied from a proven baseline instead of typed per practice", "A support desk view that shows the practice's tenant, label, integrations and history, with logged access, so that a ticket does not start with reconstruction", "Return messages matched to declarations with readable rejection reasons, so that billing-service practices get their money within days", "Knowledge and ticket analytics that turn recurring questions and rejections into articles, defaults and product fixes"], "winsThem": ["Onboarding checklists, tenant and discipline templates and role-based training material for every label, with the practice's go-live pipeline visible to the team", "Import and migration tooling from the cloud runtime team with staging tenants, automated validation and per-practice sign-off reports for migration waves into HCI One", "Support desk tooling with cross-label tenant context, reproduction tools, defect routing to product teams and a knowledge base that also powers in-app help", "Billing-service tooling in the declaration engine that matches Vecozo and insurer return messages to claims and lets the consultant correct and resubmit in place", "Team reporting on go-lives on schedule, defect rates, resolution times and effort per go-live, so that the consultant's work is visible in the same figures the practices feel"], "theirFear": ["A migration wave that loses financial history or partner links for a practice, so that a loyal customer of the old label leaves HCI at the moment of consolidation", "A declaration standard or release change that causes a rejection spike for the billing-service practices, with the consultant explaining late payments instead of preventing them", "A support desk drowning in tickets during a release or a wave, so that a therapist is blocked in a treatment and the promised response times fail"], "jobsToBeDone": [{"id": "jtbd-impl-1", "name": "Take a practice live on schedule with clean data", "whatItIs": "Bring a newly signed paramedical or GGZ practice from contract to productive use of its HCI product (HCI One, FysioRoadmap, SpotOnMedics, Incura, Evry, CRS) on the agreed date: gather the practice's therapists, locations, agenda rules, insurer contracts, care pathways and templates, import patients and open episodes from the previous system, configure Vecozo, ZorgDomein, online booking and the patient app, train the team, and run the first declaration round. The consultant handles several go-lives in parallel and is measured on whether the practice starts on the planned day, declares correctly in the first month and does not flood the support desk.", "outcome": "The practice works in its new EPD from the planned go-live day with correct master data, migrated dossiers that pass the therapists' spot checks, a first declaration round accepted by Vecozo, trained users who found their own way through the first weeks, and a handover to the support desk with fewer than a handful of open points.", "steps": [{"step": "Plan the go-live and collect the practice configuration", "description": "Kick off with the practice owner, fix the go-live date around the practice's declaration cycle and holidays, and collect therapists, AGB codes, locations, agenda rules, insurer contracts and tariffs, discipline templates and the list of integrations to switch on, using the onboarding checklist that turns the intake into a configuration plan.", "streamsNeeded": [{"id": "onboard-migrate-and-consolidate-labels", "name": "Onboard, Migrate and Consolidate Labels", "howItSupports": "Provides the onboarding plan, checklist and configuration templates that structure the intake and the go-live date."}, {"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Lets the consultant see the go-live pipeline and the workload across the practices being implemented."}]}, {"step": "Configure the tenant from templates", "description": "Create the practice tenant, apply the discipline template for care pathways, measurement instruments and declaration rules (KNGF, NVLF, NVD or the zorgprestatiemodel settings for GGZ), set up the agenda, locations and online booking, load the insurer contracts, and connect Vecozo, ZorgDomein, Mollie and the patient app; keep manual settings to the exceptions the practice really needs.", "streamsNeeded": [{"id": "onboard-migrate-and-consolidate-labels", "name": "Onboard, Migrate and Consolidate Labels", "howItSupports": "Applies tenant and discipline templates so that a practice is configured from a proven baseline rather than by hand."}, {"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Holds the insurer contracts, Vecozo connection and declaration rules the consultant configures for the first declaration round."}, {"id": "schedule-appointments-and-online-booking", "name": "Schedule Appointments and Online Booking", "howItSupports": "Sets up the agenda, locations and online booking that the practice uses from day one."}]}, {"step": "Import patients and open episodes and validate them", "description": "Export patients, open episodes, notes and outstanding declarations from the previous system (Intramed, Fysiomanager, Crossuite, Abakus or a spreadsheet), map them into HCI's import format, run the automated validation for duplicates, missing BSN checks, broken referrals and open financial items, review the exceptions with the practice, and spot-check dossiers with two therapists before the import is final.", "streamsNeeded": [{"id": "onboard-migrate-and-consolidate-labels", "name": "Onboard, Migrate and Consolidate Labels", "howItSupports": "Runs the import, automated validation and exception reports that make a migration checkable before cut-over."}, {"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Receives the imported dossiers and episodes so that therapists continue treatment without re-registering."}]}, {"step": "Train the team on their own data", "description": "Deliver the role-based training for therapists, assistants and the practice owner on the practice's own tenant and migrated data, cover agenda, dossier, voice-to-text, declarations, patient app and management dashboards, and leave the practice with the e-learning and quick guides so that new colleagues can be trained without a consultant.", "streamsNeeded": [{"id": "onboard-migrate-and-consolidate-labels", "name": "Onboard, Migrate and Consolidate Labels", "howItSupports": "Provides the training programme, e-learning and quick guides delivered per role before go-live."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Covers activating the patient app and online booking in the training so that the practice starts digital from day one."}]}, {"step": "Run the first declaration round and hypercare", "description": "Be on hand in the first weeks, verify that appointments turn into treatments, declarations and invoices, submit the first Vecozo round and process the return messages together with the practice, resolve the questions that come from real use, and close the open points before the practice is handed to the support desk.", "streamsNeeded": [{"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Produces the first declaration round and the return messages the consultant reviews with the practice."}, {"id": "onboard-migrate-and-consolidate-labels", "name": "Onboard, Migrate and Consolidate Labels", "howItSupports": "Tracks hypercare issues per practice and the handover criteria to the support desk."}]}, {"step": "Hand over and record the lessons", "description": "Close the project with the practice owner, confirm the go-live date and open points in the customer record, hand over to the support desk and the billing service where applicable, and record what slowed the go-live so that the templates, checklist and import mappings improve for the next practice.", "streamsNeeded": [{"id": "onboard-migrate-and-consolidate-labels", "name": "Onboard, Migrate and Consolidate Labels", "howItSupports": "Records go-live dates, open points and lessons that feed back into the onboarding templates."}, {"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Reports go-lives on schedule, effort per go-live and post go-live tickets for the implementation team."}]}]}, {"id": "jtbd-impl-2", "name": "Migrate a label's customers into HCI One without losing them", "whatItIs": "Move the practices of an acquired label (FysioRoadmap, SpotOnMedics, Incura, Evry, Abakus, Podofile, Edevop, FysioLogic) onto HCI One in waves per discipline, without a forced deadline and without disturbing daily care: understand the label's data model and habits, build and test the migration mapping, prepare practices for what changes, migrate their full history including dossiers, financial items, partner links and patient-app accounts, validate every wave, and keep the practices satisfied enough that they do not use the migration as the moment to switch vendor. The consultant works with the migration tooling of the cloud runtime team and with the label's own former staff.", "outcome": "Practices arrive on HCI One with their complete history, their partner integrations and their patients' app accounts intact, feel that they got the best of their old label plus more, keep declaring without interruption across the cut-over, and the label's customer base migrates wave after wave with churn no higher than the normal year.", "steps": [{"step": "Understand the label and plan the waves", "description": "Learn the source label's data model, discipline specifics and customer habits from its former product and support staff, define which discipline goes first, group practices into waves by discipline, size, integrations and declaration cycle, and agree with product management which label features must exist on HCI One before a wave can start.", "streamsNeeded": [{"id": "onboard-migrate-and-consolidate-labels", "name": "Onboard, Migrate and Consolidate Labels", "howItSupports": "Holds the label migration plan, wave definitions and readiness criteria per discipline."}, {"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Provides the customer, usage and integration data per practice that the wave planning is based on."}]}, {"step": "Build and test the migration mapping", "description": "Map the label's patients, episodes, notes, measurements, declarations, invoices, agenda, templates and partner links onto HCI One, run trial migrations of real practices into a staging tenant, compare counts and samples, fix the mapping, and reach an automated validation report that a practice owner can read.", "streamsNeeded": [{"id": "onboard-migrate-and-consolidate-labels", "name": "Onboard, Migrate and Consolidate Labels", "howItSupports": "Provides the migration tooling, staging tenants and automated validation reports for trial runs."}, {"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Defines the target dossier and episode structure on HCI One that the mapping must fill correctly."}, {"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Defines how open declarations, return messages and invoices carry over so that money keeps flowing across the cut-over."}]}, {"step": "Prepare the practices for the change", "description": "Inform each practice in the wave what will change and what stays, show the HCI One equivalents of their favourite label features, let them choose a cut-over date around their declaration cycle, collect their partner integrations and patient-app usage, and give them the difference training so that the first day is not a surprise.", "streamsNeeded": [{"id": "onboard-migrate-and-consolidate-labels", "name": "Onboard, Migrate and Consolidate Labels", "howItSupports": "Runs the communication, difference training and cut-over scheduling per practice in a wave."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Ensures that patient-app accounts, online booking and e-consult continue to work for the practice's patients after the move."}]}, {"step": "Execute the wave and validate every practice", "description": "Freeze the source tenant at the agreed moment, run the migration, validate counts, financial totals, open episodes, agenda and partner links per practice, have the practice sign off the validation report, and open HCI One for use the next morning with the source label available read-only for a period.", "streamsNeeded": [{"id": "onboard-migrate-and-consolidate-labels", "name": "Onboard, Migrate and Consolidate Labels", "howItSupports": "Executes the migration batches, produces the validation report per practice and records the sign-off."}, {"id": "integrate-partners-through-the-open-platform", "name": "Integrate Partners through the Open Platform", "howItSupports": "Re-establishes partner tenant links on HCI One so that exercise, quality and accounting partners keep working."}, {"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Keeps audit logs and access controls intact across source and target so that the migration itself is auditable."}]}, {"step": "Run hypercare and watch for churn signals", "description": "Staff the wave's hypercare with consultants who know the source label, resolve the first-week questions within hours, watch declaration acceptance, ticket volumes and satisfaction per migrated practice, and escalate any practice that shows signs of leaving to the account manager before the renewal date.", "streamsNeeded": [{"id": "onboard-migrate-and-consolidate-labels", "name": "Onboard, Migrate and Consolidate Labels", "howItSupports": "Provides hypercare queues, migrated-practice health signals and escalation paths per wave."}, {"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Shows declaration acceptance, usage and ticket trends per migrated practice so that churn risks are visible early."}]}]}, {"id": "jtbd-impl-3", "name": "Resolve support and return-message issues fast", "whatItIs": "Answer the daily stream of support questions from practices on every label and, for the practices that bought HCI's billing services, process the return messages that Vecozo and insurers send back on declarations: rejected claims, tariff or contract mismatches, missing referral dates under the 2026 zorgprestatiemodel rules, and GDS801 format issues. The consultant on the support desk needs the practice's context, the knowledge base, the ability to see and fix the declaration, and a way to route product defects to the right team, so that a therapist is not kept from treating and a practice is not kept from its money.", "outcome": "Practices get a correct answer or fix within the promised time and increasingly find it themselves, rejected declarations are corrected and resubmitted within days so that the practice's cash flow is unaffected, recurring issues become product fixes or knowledge articles, and the support desk keeps its response times through releases and migration waves.", "steps": [{"step": "Triage incoming tickets with the practice's context", "description": "Pick up tickets from telephone, e-mail, chat and the in-app help across all labels, see the practice's tenant, label, integrations, recent changes and open tickets in one view, classify the ticket by urgency (a therapist blocked in a treatment goes first) and route it to the right queue or specialist.", "streamsNeeded": [{"id": "onboard-migrate-and-consolidate-labels", "name": "Onboard, Migrate and Consolidate Labels", "howItSupports": "Provides the support desk tooling with the practice's tenant context, ticket history and routing rules."}, {"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Governs how support staff access a practice's data with logged, purpose-bound access."}]}, {"step": "Solve from the knowledge base or reproduce and escalate", "description": "Answer known questions from the knowledge base and guided articles, reproduce the issue in the practice's tenant or a copy, fix configuration mistakes directly, and log a defect with the reproduction steps for the product team when the software is wrong, keeping the practice informed about what happens next.", "streamsNeeded": [{"id": "onboard-migrate-and-consolidate-labels", "name": "Onboard, Migrate and Consolidate Labels", "howItSupports": "Holds the knowledge base, reproduction tools and defect routing to product teams."}]}, {"step": "Process return messages for billing-service practices", "description": "Read the return messages from Vecozo and insurers for the billing-service portfolio, match them automatically to the declared treatments, understand the rejection reason (contract, tariff, referral date, patient insurance, format), correct the declaration or ask the practice for the missing information, and resubmit within the insurer's deadline.", "streamsNeeded": [{"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Matches return messages to claims, explains rejection reasons and lets the consultant correct and resubmit declarations."}, {"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Provides the episode and referral information the consultant needs to correct a rejected declaration."}]}, {"step": "Turn recurring issues into fixes and articles", "description": "Review weekly which questions and rejection reasons recur per label, write or update knowledge articles and in-app hints, propose configuration defaults or product changes that remove the cause, and check whether ticket volumes on that topic go down.", "streamsNeeded": [{"id": "onboard-migrate-and-consolidate-labels", "name": "Onboard, Migrate and Consolidate Labels", "howItSupports": "Provides ticket analytics per topic and label and the knowledge base editing tools."}, {"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Shows rejection reasons and declaration acceptance per practice and insurer so that structural causes are visible."}]}, {"step": "Keep the desk responsive through releases and waves", "description": "Prepare for each release and migration wave with release notes, expected questions and staffing, monitor response and resolution times per queue and label during the peak, and adjust routing and staffing so that the promised times hold for every practice.", "streamsNeeded": [{"id": "onboard-migrate-and-consolidate-labels", "name": "Onboard, Migrate and Consolidate Labels", "howItSupports": "Plans release and wave staffing and shows queue times per label so that the desk holds its promise."}, {"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Reports resolution times, first-contact resolution and ticket volumes for the support team's own steering."}]}]}], "customerJourneyStories": [{"id": "journey-impl-1", "name": "A consultant from an acquired label grows into the HCI One migration tooling", "linkedJobIds": ["jtbd-impl-1", "jtbd-impl-2"], "summary": "A support and implementation specialist who joined HCI when her physiotherapy label was acquired, used to going live with a spreadsheet and a shared mailbox, learns HCI's onboarding templates, import validation and migration tooling, and within a year leads a migration wave of her former customers onto HCI One.", "stages": [{"stage": "Trigger", "narrative": "Her label is acquired, the go-live and support practices she knew are replaced by HCI's ways of working, her former customers ask her what HCI One will mean for them, and she is asked to take practices live on the shared platform while still supporting the old label."}, {"stage": "Discovery", "narrative": "In the onboarding weeks she sees colleagues from Incura and SpotOnMedics use the onboarding checklist, tenant templates and import validation reports, hears in the implementation team meeting how migration waves are planned, and is pointed to the internal e-learning and the tooling that the cloud runtime team maintains."}, {"stage": "Evaluation", "narrative": "She judges whether the tooling is better than her old routine: the templates cover her discipline's pathways and declaration rules, the validation report catches the duplicate patients and broken referrals she used to find by hand, the migration tooling keeps financial history and partner links, and the support desk tooling shows her the tenant context she used to reconstruct from e-mails. She decides to invest in learning it rather than keeping a parallel process."}, {"stage": "Trial", "narrative": "Her first HCI One go-live for a new practice uses the templates and the validation report end to end; she still checks dossiers by hand, finds one mapping gap for her discipline, gets it added to the template, and delivers the go-live on the planned day with a first declaration round accepted by Vecozo."}, {"stage": "Engagement", "narrative": "She takes several practices live per month, runs trial migrations of her former customers into staging, contributes the label-specific mapping rules and the difference training, and co-leads a migration wave in which every practice signs off its validation report and keeps declaring across the cut-over; the go-live and defect figures of her practices are among the best in the team."}, {"stage": "Retention", "narrative": "She stays because the tooling turned her label knowledge into a shared asset rather than making it obsolete, her former customers trust her through the migration, the go-lives on schedule and the low defect rate are visible in the team's figures, and she is asked to design the wave approach for the next discipline."}]}, {"id": "journey-impl-2", "name": "A support desk colleague takes on billing-service return messages", "linkedJobIds": ["jtbd-impl-3", "jtbd-impl-1"], "summary": "A support consultant who joined HCI's support desk from a GGZ practice's administration, answering tickets across CRS and the paramedical labels, learns the return-message tooling of the billing services, absorbs the 2025 GDS801 and 2026 zorgprestatiemodel changes without a rejection spike for his practices, and becomes the person who turns recurring rejections into product fixes.", "stages": [{"stage": "Trigger", "narrative": "The support desk gets a wave of tickets and rejected declarations after a declaration standard changes, the billing-service practices call about money that has not arrived, and the new consultant realises that answering tickets one by one from memory and e-mail will not hold through the next release."}, {"stage": "Discovery", "narrative": "He sees a senior colleague work the return-message queue in which rejections are matched to claims and explained, hears in the team stand-up how the knowledge base and ticket analytics are used to spot recurring causes, and is invited to the release preparation where expected questions and staffing are planned."}, {"stage": "Evaluation", "narrative": "He checks whether the tooling really helps him: the ticket view shows the practice's tenant, label and integrations, the return messages are matched automatically to declarations with a readable reason, corrections and resubmissions are done in the same screen, and defects can be routed with reproduction steps to the declarations team; the alternative of a personal spreadsheet loses."}, {"stage": "Trial", "narrative": "In his first month on the billing-service queue he processes the return messages of a group of practices, resubmits corrected declarations within days, writes his first knowledge article on missing referral dates under the zorgprestatiemodel, and sees the tickets on that topic drop for his practices."}, {"stage": "Engagement", "narrative": "He works the support and return-message queues daily, prepares the desk for releases and migration waves with the expected questions, feeds the declarations team with the recurring rejection reasons that become product defaults, and keeps resolution times inside the promise even in the busiest weeks."}, {"stage": "Retention", "narrative": "He stays because the tooling lets him keep practices' cash flow safe and therapists treating: the return-message queue, the knowledge base and the defect routing turned a job of answering from memory into one where his articles and defect reports visibly reduce tickets, and the resolution figures of his queue are recognised in the team's monthly review. He is asked to help design the in-app help for HCI One and to prepare the support desk for the next zorgprestatiemodel rule set, the moment at which he can prevent a rejection spike rather than clean one up."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-impl-top", "name": "Go-live on schedule rate", "description": "Share of new-customer go-lives and label-migration cut-overs that happen on the date agreed with the practice, across all labels in the last four quarters. Modeled seed value for HCI's implementation team, not an official HCI figure.", "unit": "%", "currentValue": "74", "targetValue": "92", "link": "ht     const customer = {"id": "gpph", "name": "GP Practice and Pharmacy Manager", "description": "Practice manager of a general practice with two to six GPs and several thousand registered patients, or the pharmacist-manager of a community pharmacy, whose information system (Pharmapartners, CGM, Sanday, HealthConnected, Bricks or Vertimart) connects to Uw Zorg Online as the practice's digital front door. Responsible for reachability, the assistants' workload, the practice website and the practice's legal duties around online access, Wegiz and MedMij, without an IT department or a web agency. Judged by the GPs or pharmacists on fewer telephone interruptions, satisfied patients and a clean audit, and by HCI on activation and continued connection.", "icon": "gpph.png", "careAbout": ["Fewer telephone calls in the morning queue, because every appointment, e-consult and repeat prescription handled in the app is one call the assistants do not take", "A connection that lands digital requests in the practice's own HIS or AIS work list, so that staff never work on a second screen or register anything twice", "MedMij, online access and Wegiz obligations met through HCI's certification and DigiD login, with evidence ready for an insurer audit or an accreditation visit", "Patients, including older and chronic patients, who actually activate the app and keep using it, so that the digital route becomes the normal one", "A practice website that shows correct hours, team and services and leads straight into booking, e-consult and triage, changed in minutes without a developer", "Patient data that never leaves the certified environment, with NEN 7510 and ISO 27001 status HCI maintains and access logs patients can see"], "winsThem": ["Uw Zorg Online connected to the practice information system through supported connectors for Sanday, HealthConnected, Pharmapartners, CGM, Bricks and Vertimart, with appointments booked straight into the practice agenda", "E-consults, repeat prescriptions, record access and the \"Moet ik naar de dokter?\" triage in one app used by more than four million patients, so that patients already know it from their neighbouring practice", "MedMij-certified data exchange and DigiD authentication carried by HCI, so that online access and Wegiz compliance are a matter of settings rather than a project", "Practice websites from the Praktijkinfo portfolio with booking, e-consult and triage entry points embedded and content managed by the practice itself", "A reachability dashboard per practice with phone contacts, digital requests, activations and response times, so that the manager can show the GPs and the patient council what the digital front door delivers"], "theirFear": ["A digital request that gets lost between the app and the HIS or AIS, so that a patient's prescription or appointment is missed and the practice is blamed", "Patients who activate the app once and go back to calling, so that the assistants handle two channels instead of one", "An access or data-exchange rule that the practice turns out not to meet, discovered by a patient complaint, an auditor or the regulator rather than by the practice itself"], "jobsToBeDone": [{"id": "jtbd-gpph-1", "name": "Give patients a digital front door that cuts phone traffic", "whatItIs": "Open the practice or pharmacy to patients through Uw Zorg Online so that e-consults, appointments in the practice agenda, repeat prescriptions, record access and the \"Moet ik naar de dokter?\" triage arrive digitally instead of by telephone. The manager has to connect the app to the practice's own information system (Pharmapartners, CGM, Sanday, HealthConnected, Bricks or Vertimart), decide which appointment types, e-consult subjects and prescription flows are open to patients, get patients to activate their account with DigiD, and organise the assistants so that digital requests are handled inside the normal working day rather than on top of it.", "outcome": "Patients arrange most routine matters themselves in the app that is connected to the practice agenda and the HIS or AIS, the assistants spend their mornings on triage and care instead of on the telephone queue, and the practice can see in its own figures that phone contacts per 1,000 patients keep falling while patient satisfaction with reachability rises.", "steps": [{"step": "Connect Uw Zorg Online to the practice information system", "description": "Check that the practice's HIS or the pharmacy's AIS (Pharmapartners, CGM, Sanday, HealthConnected, Bricks or Vertimart) is on the list of supported connections, sign the agreement and the processing agreement with HCI, arrange the connector activation with the HIS or AIS vendor, and verify with a test patient that the agenda, medication overview and record summary appear in the app exactly as they stand in the practice system.", "streamsNeeded": [{"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "howItSupports": "Provides the HIS and AIS connectors that mirror agenda, medication and record data between the practice system and Uw Zorg Online."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Sets up the practice's presence in the app so that patients see the right services once the connection is live."}, {"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Covers the processing agreement, NEN 7510 controls and audit logging that the practice needs before patient data flows through the app."}]}, {"step": "Configure which services are open to patients", "description": "Decide with the GPs or pharmacists which appointment types and slots may be booked online, which e-consult subjects are allowed and who answers them, whether repeat prescriptions go straight to the pharmacy of choice, and whether patients can read their record summary and correspondence; set the practice's answering rules and response promise so that the app tells patients what to expect.", "streamsNeeded": [{"id": "schedule-appointments-and-online-booking", "name": "Schedule Appointments and Online Booking", "howItSupports": "Exposes the agenda slots and appointment types that the practice releases for patient self-service."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Holds the practice's e-consult, prescription and record-access settings and the response promise shown to patients."}]}, {"step": "Get patients to activate the app", "description": "Invite patients through the practice website, the waiting-room screen, the telephone menu and the assistant's standard answer, help older patients through DigiD activation, and prioritise the frequent callers, chronic patients and parents who generate most of the phone traffic; watch weekly how many invitations turn into activated accounts and first digital requests.", "streamsNeeded": [{"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Runs invitations, DigiD activation and the first-use nudges that turn an invitation into an active account."}, {"id": "publish-and-run-a-practice-website", "name": "Publish and Run a Practice Website", "howItSupports": "Places the activation call to action, app links and triage entry point on the practice website where patients look first."}]}, {"step": "Handle digital requests inside the daily workflow", "description": "Organise the assistants' morning so that e-consults, booking exceptions, prescription requests and triage outcomes appear in the HIS or AIS work list and are answered within the promised time, route clinical questions to the GP, and agree what still requires a telephone call; make sure a request never gets lost between the app and the practice system.", "streamsNeeded": [{"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Delivers e-consults, prescription requests and triage outcomes with their status so that the practice answers them in one queue."}, {"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "howItSupports": "Writes answers, bookings and prescriptions back into the HIS or AIS so that nothing is registered twice."}]}, {"step": "Measure phone traffic relief and adjust", "description": "Compare phone contacts per 1,000 patients, e-consult volume, online bookings and digital repeat prescriptions month by month, look at which patient groups still call, review complaints about response times, and adjust opening of slots, e-consult subjects and the practice's communication until the assistants feel the relief.", "streamsNeeded": [{"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Shows activation, digital request volumes and response times per practice next to the phone statistics."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Provides the usage figures per service that explain which digital routes patients actually use."}]}]}, {"id": "jtbd-gpph-2", "name": "Meet MedMij and Wegiz obligations without extra work", "whatItIs": "Fulfil the practice's or pharmacy's legal duties to give patients electronic access to their data and to exchange data digitally: online access to the record and medication overview, the Wegiz obligation to exchange data electronically (in force since April 2023), and the MedMij standards under which patients retrieve their data into a personal health environment such as Quli. The manager wants HCI to carry the certification, consent handling, DigiD authentication and standard conformance, so that the practice only has to switch on the right settings and can show auditors and the patient federation that it complies.", "outcome": "The practice complies with online access, Wegiz and MedMij through the same app and connection it already uses, patients can retrieve their data into any MedMij-labelled PGO without the practice answering paper requests, and the manager has the evidence for the accountant, the insurer's quality conditions and a NEN 7510 or AVG question without building anything themselves.", "steps": [{"step": "Understand what the practice must offer and by when", "description": "Translate the obligations for online access, Wegiz data exchange and MedMij into a short list of what patients must be able to do, which data sets are involved (record summary, medication overview, lab results, correspondence) and which deadlines apply to GP practices and pharmacies, and check what the HIS or AIS vendor and HCI already cover.", "streamsNeeded": [{"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Maintains the Wegiz and MedMij conformance status per connection and translates regulation into concrete settings and evidence."}, {"id": "manage-personal-health-data-and-sharing", "name": "Manage Personal Health Data and Sharing", "howItSupports": "Defines the MedMij data sets patients can retrieve so that the practice knows what will become visible."}]}, {"step": "Switch on MedMij retrieval through the certified connection", "description": "Rely on HCI's MedMij-certified role as the practice's exchange party: activate the data sets the practice offers, confirm that the connector delivers them from the HIS or AIS in the required standards, and test with a Quli or another MedMij PGO that a patient can retrieve their record summary and medication overview.", "streamsNeeded": [{"id": "manage-personal-health-data-and-sharing", "name": "Manage Personal Health Data and Sharing", "howItSupports": "Provides the MedMij-certified retrieval path and the PGO test flow for the practice's data sets."}, {"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "howItSupports": "Delivers the practice's HIS or AIS data through the connector in the standards MedMij requires."}]}, {"step": "Handle consent, authentication and identity questions", "description": "Make sure patients log in with DigiD, that parents and carers act only within the rules for children and representatives, that patients can see who accessed their data, and that objections or corrections are handled by the practice; write the practice's own short policy on top of HCI's standard texts.", "streamsNeeded": [{"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Provides DigiD authentication, consent records, audit logs and representative rules that the practice can rely on."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Shows patients their access log and consent settings in the same app they use for care."}]}, {"step": "Answer patient PGO and data requests without paper", "description": "Route questions about downloading data, sharing with family or an informal carer and combining GP, pharmacy and hospital data to the app and Quli instead of printing or mailing, and use the network care functions so that a patient's informal carer can act for them with the patient's permission.", "streamsNeeded": [{"id": "manage-personal-health-data-and-sharing", "name": "Manage Personal Health Data and Sharing", "howItSupports": "Lets patients retrieve, combine and share their data with family and carers so that the practice no longer handles paper copies."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Answers the practical questions about downloading and sharing inside the app's help and messaging."}]}, {"step": "Keep the evidence for audits and quality conditions", "description": "Collect the conformance statements, the processing agreement, the NEN 7510 and ISO 27001 certificates of HCI, the access logs and the yearly check of settings in one place, so that an insurer's quality audit, an Autoriteit Persoonsgegevens question or the practice accreditation can be answered in an afternoon.", "streamsNeeded": [{"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Publishes certificates, conformance statements and audit log exports that the practice files as evidence."}, {"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Reports MedMij retrievals, online access usage and open data requests per practice for the yearly review."}]}]}, {"id": "jtbd-gpph-3", "name": "Keep the practice findable and up to date online", "whatItIs": "Run a practice or pharmacy website from the Praktijkinfo portfolio that patients find when they search for the practice, that shows correct opening hours, team, services, holiday cover and news, and that leads directly into the digital front door: online booking, e-consult, repeat prescriptions and the triage tool. The manager has no web agency and wants to change content in minutes, know that the site is accessible and secure, and see that it actually brings patients into the app.", "outcome": "Patients find correct information and a working entry point into the app on the practice website, the manager keeps hours, team and news current without a developer, the site meets accessibility and security expectations, and the website is measurably the largest route into online booking, e-consults and app activations.", "steps": [{"step": "Set up the website from a practice template", "description": "Choose a template suited to a GP practice or pharmacy, load the practice details, team, locations, opening hours and services, connect the domain, and check the layout on a phone, since that is where most patients will look before they call.", "streamsNeeded": [{"id": "publish-and-run-a-practice-website", "name": "Publish and Run a Practice Website", "howItSupports": "Provides the templates, content management and hosting for the practice website without a developer."}]}, {"step": "Embed the digital front door on every page", "description": "Place online booking, e-consult, repeat prescription and triage entry points on the pages where patients arrive, link the Uw Zorg Online activation flow and app download, and make the emergency and out-of-hours instructions impossible to miss.", "streamsNeeded": [{"id": "publish-and-run-a-practice-website", "name": "Publish and Run a Practice Website", "howItSupports": "Embeds booking, e-consult and triage entry points and the app links into the site's pages."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Receives the patients who click through from the website into activation, booking and e-consult."}, {"id": "schedule-appointments-and-online-booking", "name": "Schedule Appointments and Online Booking", "howItSupports": "Serves the bookable slots that the website's booking entry point shows to patients."}]}, {"step": "Keep content current with minimal effort", "description": "Update holiday cover, a new colleague, vaccination campaigns, changed opening hours and practice news in a few minutes, use the shared content items that HCI provides for national campaigns, and delegate small updates to an assistant with limited rights.", "streamsNeeded": [{"id": "publish-and-run-a-practice-website", "name": "Publish and Run a Practice Website", "howItSupports": "Offers simple content editing, shared campaign content and role-based rights for assistants."}]}, {"step": "Meet accessibility, privacy and security expectations", "description": "Rely on the hosting, TLS, cookie handling, accessibility features and privacy statement templates HCI maintains, review the site once a year against the accessibility guidelines the sector expects, and make sure no patient data is ever entered outside the secure app.", "streamsNeeded": [{"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Maintains secure hosting, privacy statement templates and the controls that keep patient data out of the public website."}, {"id": "publish-and-run-a-practice-website", "name": "Publish and Run a Practice Website", "howItSupports": "Provides the accessibility features and yearly check that the practice reviews."}]}, {"step": "Track whether the site brings patients into the app", "description": "Look at visits, the most-used pages and the click-through into booking, e-consult and activation, compare this with phone volumes, and adjust page order, wording and the position of the entry points to make the digital route the obvious one.", "streamsNeeded": [{"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Shows website visits and click-through into the app next to phone and request volumes."}, {"id": "publish-and-run-a-practice-website", "name": "Publish and Run a Practice Website", "howItSupports": "Provides the page-level statistics and the ability to move or reword entry points."}]}]}], "customerJourneyStories": [{"id": "journey-gpph-1", "name": "A GP practice opens its digital front door", "linkedJobIds": ["jtbd-gpph-1", "jtbd-gpph-3"], "summary": "The practice manager of a three-GP practice with 7,000 patients, whose assistants are on the phone all morning, connects Uw Zorg Online to the practice's HIS, opens online booking and e-consults, replaces the outdated website with a Praktijkinfo site, and within a year sees phone contacts fall and patients using the app as the normal way to reach the practice.", "stages": [{"stage": "Trigger", "narrative": "The practice's telephone queue in the morning has become a source of complaints, two assistants have left, the patient council asks why other practices let patients book online, and the GPs want fewer interruptions for repeat prescriptions and simple questions. The manager has to give patients a digital route that the assistants can actually handle."}, {"stage": "Discovery", "narrative": "She sees a neighbouring practice on the same HIS handling e-consults in Uw Zorg Online, hears from the HIS vendor that the connection is standard, reads that more than four million patients already use the app, and receives a call from HCI after the regional GP organisation lists the app as the recommended patient environment."}, {"stage": "Evaluation", "narrative": "She compares Uw Zorg Online with the HIS vendor's own portal and a stand-alone booking tool: the deciding points are that appointments land directly in the practice agenda, repeat prescriptions go to the pharmacy, the connection is certified for NEN 7510 and MedMij, the assistants work from the HIS work list rather than a second screen, and the practice website can be replaced in the same move. The GPs approve after a demo with their own agenda."}, {"stage": "Trial", "narrative": "The connection goes live with online booking for two appointment types and e-consults for administrative questions only. The manager invites the frequent callers and parents first, the assistants answer e-consults before the phone lines open, and in the first month a few hundred patients activate their account and the morning queue is visibly shorter on two days a week."}, {"stage": "Engagement", "narrative": "Within six months online booking covers all routine appointment types, repeat prescriptions arrive digitally, the triage tool answers the question whether a visit is needed, the new website leads every visitor into the app, and the assistants plan their morning around the digital queue; the practice's dashboard shows phone contacts per 1,000 patients falling month after month."}, {"stage": "Retention", "narrative": "The manager stays because the app is now the way patients expect to reach the practice, the HIS connection keeps working through updates, the yearly MedMij and online-access checks are done for her, and she can show the GPs and the patient council the reachability figures; she recommends the app to the practices in her regional group and asks HCI to open video consultations next."}]}, {"id": "journey-gpph-2", "name": "A pharmacy moves repeat prescriptions and MedMij access to the app", "linkedJobIds": ["jtbd-gpph-1", "jtbd-gpph-2"], "summary": "The pharmacist-manager of a community pharmacy on Pharmapartners, facing the online-access and MedMij obligations and a counter that is constantly interrupted by repeat prescription calls, connects the pharmacy to Uw Zorg Online, moves repeat requests and the medication overview into the app, and keeps the pharmacy compliant without hiring anyone.", "stages": [{"stage": "Trigger", "narrative": "The pharmacy receives its second letter about giving patients online access to their medication data, the GP practices in the health centre have started sending patients to an app the pharmacy is not on, and the counter staff lose an hour a day to repeat prescription calls that could be digital."}, {"stage": "Discovery", "narrative": "The pharmacist learns from the local GP practices that their patients already use Uw Zorg Online, sees in the AIS vendor's newsletter that the connection to the app is supported, and finds at the regional pharmacists' meeting that colleagues use it for repeat prescriptions and the medication overview."}, {"stage": "Evaluation", "narrative": "He checks that the app supports the AIS, that HCI carries the MedMij certification and the DigiD login, that the processing agreement and NEN 7510 status are in order, and that a patient's repeat request lands in the pharmacy's own work list; the alternative, a separate pharmacy app, would mean a second login for patients who already use the GP's app, so the shared front door wins."}, {"stage": "Trial", "narrative": "The pharmacy connects to the app, starts with repeat prescriptions and the medication overview, and asks the GP practices to point patients to the pharmacy in the same app. In the first weeks the repeat requests arrive in the AIS work list, the counter staff notice fewer calls, and a first patient retrieves their medication data into a Quli PGO without the pharmacist doing anything."}, {"stage": "Engagement", "narrative": "Repeat prescriptions, pick-up notifications and medication questions run through the app, the pharmacist uses e-consults for medication reviews with chronic patients, MedMij retrievals happen without a request at the counter, and the yearly evidence for online access and Wegiz comes out of the same environment."}, {"stage": "Retention", "narrative": "The pharmacy keeps the connection because the digital route now handles most repeat prescriptions, the counter is no longer interrupted by calls that could have been a tap in the app, and the online-access and Wegiz evidence comes out of a connection HCI keeps certified rather than out of a project the pharmacist would have to run himself. When the group's two other pharmacies, on the same AIS, come up for renewal of their own patient apps, the pharmacist brings them onto the shared Uw Zorg Online connection so that patients of all three pharmacies see one app for both the GP and the pharmacy."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-gpph-top", "name": "Digital front door adoption rate", "description": "Share of the practice's or pharmacy's registered patients who used Uw Zorg Online at least once in the last twelve months for an appointment, e-consult, repeat prescription, record access or triage. Modeled seed value for a connected GP practice, not an official HCI figure.", "unit": "%", "currentValue": "38", "targetValue": "60", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/gpph/kpis/co-gpph-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-gpph-co-gpph-top.png"}, "branches": [{"id": "co-gpph-b1", "name": "Patient self-service uptake", "description": "Whether patients activate the app and use it to book and arrange things themselves instead of calling the practice.", "currentValue": "40", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/gpph/kpis/co-gpph-b1", "linkLabel": "Open KPI dashboard", "icon": "kpi-gpph-co-gpph-b1.png", "children": [{"id": "co-gpph-b1-c1", "name": "Appointment self-service share", "description": "Share of appointments in the practice agenda that patients booked or rescheduled themselves through the app or website.", "unit": "%", "currentValue": "22", "targetValue": "45", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/gpph/kpis/co-gpph-b1-c1", "linkLabel": "Open KPI dashboard", "icon": "kpi-gpph-co-gpph-b1-c1.png", "children": [{"id": "co-gpph-b1-c1-l1", "name": "Online bookable slots share", "description": "Share of the practice's routine appointment slots that are released for online booking.", "unit": "%", "currentValue": "35", "targetValue": "60", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/gpph/kpis/co-gpph-b1-c1-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-gpph-co-gpph-b1-c1-l1.png", "children": []}, {"id": "co-gpph-b1-c1-l2", "name": "Bookings completed without staff intervention", "description": "Share of online bookings that need no correction, call-back or manual confirmation by an assistant.", "unit": "%", "currentValue": "78", "targetValue": "95", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/gpph/kpis/co-gpph-b1-c1-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-gpph-co-g cts per week", "currentValue": "310", "targetValue": "200", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/gpph/kpis/co-gpph-b2-c1", "linkLabel": "Open KPI dashboard", "icon": "kpi-gpph-co-gpph-b2-c1.png", "children": [{"id": "co-gpph-b2-c1-l1", "name": "E-consult share of patient contacts", "description": "Share of all patient contacts with the practice that arrive as an e-consult or secure message.", "unit": "%", "currentValue": "18", "targetValue": "35", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/gpph/kpis/co-gpph-b2-c1-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-gpph-co-gpph-b2-c1-l1.png", "children": []}, {"id": "co-gpph-b2-c1-l2", "name": "Triage self-help completion rate", "description": "Share of started \"Moet ik naar de dokter?\" triage sessions that end in self-care advice or a digital booking rather than a call.", "unit": "%", "currentValue": "40", "targetValue": "60", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/gpph/kpis/co-gpph-b2-c1-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-gpph-co-gpph-b2-c1-l2.png", "children": []}]}, {"id": "co-gpph-b2-c2", "name": "Repeat prescription digital share", "description": "Share of repeat prescription requests that reach the practice or pharmacy through the app instead of by telephone or at the counter.", "unit": "%", "currentValue": "48", "targetValue": "75", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/gpph/kpis/co-gpph-b2-c2", "linkLabel": "Open KPI dashboard", "icon": "kpi-gpph-co-gpph-b2-c2.png", "children": [{"id": "co-gpph-b2-c2-l1", "name": "Repeat prescription handling time per request", "description": "Staff minutes spent per repeat prescription request from receipt to approval in the HIS or AIS.", "unit": "minutes", "currentValue": "4", "targetValue": "1.5", "link": "https://dashboard.     const customerInsights = [{"id": "pmhp-01", "title": "HCI One consolidates eight paramedical labels on the FysioRoadmap web foundation, discipline by discipline and without a forced migration deadline", "summary": "HCI One is presented as a new multidisciplinary paramedical platform built on the web-based FysioRoadmap foundation that brings FysioRoadmap, SpotOnMedics, Incura, Evry, Abakus, Podofile, Edevop and FysioLogic together in one environment for administration, documentation, planning and communication. The rollout is phased per discipline, physiotherapy first; existing users keep full support on their current label and choose their own transition moment, with no forced migration deadline. Vortex describes HCI as a 2021 buyout with founder Eric de Boer followed by a buy-and-build programme of more than 14 add-on acquisitions, and the May 2025 CEO announcement states that Robin Dunki Jacobs \u2014 who joined in 2024 as Business Unit Director responsible for integrating the labels \u2014 will integrate the acquired solutions, expand digital patient access through a unified network and invest in digital triage, AI and e-health.", "implication": "Label consolidation is the domain's multi-year operating risk, not a one-off project: every acquired label keeps a loyal user base that must be migrated voluntarily, so the migration tooling, per-discipline readiness and hypercare capacity of the implementation team decide how fast HCI One absorbs the installed base, while the CEO mandate ties the paramedical platform to the patient front door and triage roadmap.", "priority": "high", "tags": ["strategy", "consolidation", "hci-one", "buy-and-build"], "sources": [{"id": "hci-one", "title": "HCI One \u2014 the new multidisciplinary paramedical platform", "url": "https://hci-software.com/one/", "publisher": "Health Cloud Initiative", "date": "2026-09-05"}, {"id": "vortex-hci", "title": "Health Cloud Initiative \u2014 Vortex investment page", "url": "https://vortexcp.com/investment/hci/", "publisher": "Vortex Capital Partners", "date": "2026-09-05"}, {"id": "vortex-ceo-2025", "title": "Robin Dunki Jacobs appointed as new CEO of HCI", "url": "https://vortexcp.com/news/robin-dunki-jacobs-appointed-as-new-ceo-of-hci/", "publisher": "Vortex Capital Partners", "date": "2025-05-28"}], "link": {"customerId": "gpph", "jobIds": ["jtbd-gpph-1"], "kpiIds": ["co-gpph-top"]}}, {"id": "pmhp-06", "title": "The top-50 GGZ EPD market is held by five vendors and two portals; Quli reaches 4 percent of it while Wegiz pushes institutions toward PGO connections", "summary": "M&I/Partners' 2025 inventory of the 50 largest GGZ organisations by revenue counts SDB Groep at 15 organisations (30%), Nedap at 14 (27%), PinkRoccade at 7 (14%), Adapcare at 6 (12%) and Nexus at 5 (10%), notes that GGZ Friesland switched to Nedap, and lists client portals Caren and Karify at 22.5% each with Quli at 4% (two organisations). MedMij's FAQ for care providers explains that digital data exchange has been mandated by Wegiz since April 2023, that about 50% of GGZ institutions are connected to PGOs, that 16 MedMij-labelled PGOs existed in November 2025, and that paramedical care is still in an exploratory phase for PGO disclosure.", "implication": "For large institutions HCI competes as a portal and PGO layer on top of other vendors' EPDs at least as often as with CRS itself, so Quli's MedMij data exchange must work against SDB, Nedap and PinkRoccade records; for paramedical practices and GP partners the PGO obligation is still ahead, which makes Uw Zorg Online's MedMij position an early-mover asset rather than a compliance cost.", "priority": "high", "tags": ["market", "ggz", "pgo", "medmij", "wegiz"], "sources": [{"id": "mxi-ggz-epd-2025", "title": "EPD-inventarisatie GGZ 2025: Nedap nadert marktleider", "url": "https://mxi.nl/kennis/733/epd-inventarisatie-ggz-2025-nedap-nadert-marktleider", "publisher": "M&I/Partners", "date": "2025-10-01"}, {"id": "medmij-faq", "title":     function jobNamesForCustomer(jobIds) {
        const jobs = (customer.jobsToBeDone || []);
        const jobLookup = {};
        jobs.forEach(job => {
            if (job.id) {
                jobLookup[job.id] = job.name || job.id;
            }
        });
        return (jobIds || []).map(jobId => jobLookup[jobId] || jobId);
    }

    function kpiNamesForLink(link) {
        // Prefer stable KPI IDs resolved against this customer's KPI pyramid; fall back to legacy display-name kpis.
        if (link && link.kpiIds && link.kpiIds.length) {
            const lookup = {};
            function walk(node) {
                if (!node) return;
                if (node.id) {
                    lookup[node.id] = node.name || node.id;
                }
                (node.branches || []).forEach(walk);
                (node.children || []).forEach(walk);
            }
            const pyramids = (customer || {}).kpiPyramids || {};
            ['customerOutcomes', 'businessOutcomes'].forEach(key => {
                const pyramid = pyramids[key];
                if (!pyramid) return;
                walk(pyramid.top);
                (pyramid.branches || []).forEach(walk);
            });
            return link.kpiIds.map(kpiId => lookup[kpiId] || kpiId);
        }
        return (link && link.kpis) || [];
    }

    function addInsights() {

        html += '<div style="margin: 24px">';

                if (insight.implication) {
                    html += '<div style="margin-bottom: 10px"><b>Product implication:</b> ' + escapeHtml(insight.implication) + '</div>';

                if (insight.link) {

                        html += '<div style="font-size: 13px; color: #4b5563; margin-bottom: 4px"><b>KPIs:</b> ' + escapeHtml(kpiNames.join(', ')) + '</div>';
                    }
                }
                if (insight.tags && insight.tags.length) {
                    html += '<div style="margin-top: 8px; margin-bottom: 10px">';

                        html += '<span style="display:inline-block; margin:0 8px 6px 0; padding:4px 10px; border-radius:999px; background:#eef2f6; font-size:12px">' + escapeHtml(tag) + '</span>';

            example: 'illustrative example',

            placeholder: 'placeholder'

            html += '<div style="font-size: 80%; color: #1d4ed8; margin-top: 4px"><b>' + valueLabel + '</b> ' + escapeHtml(kpiCurrentValue(node));

            html += '</div>';
        }
        if (node && node.target) {
            html += '<div style="font-size: 80%; color: #047857; margin-top: 2px"><b>Target:</b> ' + escapeHtml(String(node.target)) + '</div>';
        }
        if (node && node.guardrailRole) {
            html += '<div style="font-size: 78%; color: #b91c1c; margin-top: 2px"><b>Guardrail:</b> ' + escapeHtml(String(node.guardrailRole)) + '</div>';
        }
        if (node && (node.period || node.calculationMethod || node.valueSource)) {
            html += '<div style="font-size: 76%; color: #6b7280; margin-top: 3px">';
            if (node.period) { html += '<div><b>Period:</b> ' + escapeHtml(String(node.period)) + '</div>'; }

            html += '<div style="font-size: 76%; color: #7c3aed; margin-top: 3px"><b>Composite guardrail:</b> ' + escapeHtml(String(node.guardrail)) + '</div>';

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function formatDate(dateValue) {
        if (!dateValue) return 'No date';
        const date = new Date(dateValue + 'T00:00:00');
        if (isNaN(date.getTime())) return dateValue;
        return date.toLocaleDateString('en-GB', {year: 'numeric', month: 'short', day: 'numeric'});
    }

    function renderKpis(items) {
        let html = '';
        items.forEach(item => {
            html += '<div><b>' + escapeHtml(item.kpi) + '</b>';
            if (item.unit) {
                html += ' <span class="activity-muted">(' + escapeHtml(item.unit) + ')</span>';
            }
            if (item.expectedImpact) {
                html += ': ' + escapeHtml(item.expectedImpact);
            }
            if (item.currentValue) {
                html += '<div class="activity-muted"><b>Current:</b> ' + escapeHtml(String(item.currentValue)) + '</div>';
            }
            if (item.description) {
                html += '<div class="activity-muted">' + escapeHtml(item.description) + '</div>';
            }
            if (item.link) {
                html += '<div class="activity-muted"><a target="_blank" rel="noopener noreferrer" href="' + escapeHtml(item.link) + '">' + escapeHtml(item.linkLabel || 'Open link') + '</a></div>';
            }
            html += '</div>';
        });
        return html;
    }

    function renderImpactCell(item, currentCustomerId) {
        let html = '';
        (item.customerImpact || []).forEach(impact => {
            const isCurrent = impact.customerId === currentCustomerId;
            html += '<div class="activity-block' + (isCurrent ? ' activity-pill-highlight' : '') + '">';
            html += '<div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">';
            html += '<img class="activity-icon activity-icon-round" src="../icons/' + escapeHtml(impact.customer.icon) + '" onerror="this.onerror=null;this.src=\'../icons/customer.png\'">';
            html += '<div><div style="font-weight:bold; color:' + (isCurrent ? '#1d4ed8' : '#111827') + '">' + escapeHtml(impact.customer.name) + ' <span class="activity-muted">(' + escapeHtml(impact.customerId) + ')</span></div></div>';
            html += '</div>';
            html += renderKpis(impact.customerKPIs || []);
            html += renderKpis(impact.businessKPIs || []);
            html += '</div>';
        });
        return html || '<span class="activity-muted">No customer impact listed</span>';
    }

    function renderBrickCell(item) {
        let html = '';
        (item.productBricks || []).forEach(brick => {
            html += '<div class="activity-pill">';
            html += '<img class="activity-icon" src="../../product-bricks/icons/' + escapeHtml(brick.brick.icon) + '" onerror="this.onerror=null;this.src=\'../../product-bricks/icons/logo.png\'">';
            html += '<div><div><b>' + escapeHtml(brick.brick.name) + '</b> <span class="activity-muted">(#' + escapeHtml(brick.brickId) + ')</span></div><div class="activity-muted">' + escapeHtml(brick.change) + '</div></div>';
            html += '</div>';
        });
        return html || '<span class="activity-muted">No product bricks listed</span>';
    }

    function renderChannelCell(item) {
        let html = '';
        (item.deliveryChannels || []).forEach(channel => {
            html += '<div class="activity-pill">';
            html += '<img class="activity-icon" src="../../product-deployments/icons/' + escapeHtml(channel.channel.icon) + '" onerror="this.onerror=null;this.src=\'../../product-deployments/icons/product.png\'">';
            html += '<div><div><b>' + escapeHtml(channel.channel.name) + '</b> <span class="activity-muted">(' + escapeHtml(channel.channelId) + ')</span></div><div class="activity-muted">' + escapeHtml(channel.change) + '</div></div>';
            html += '</div>';
        });
        return html || '<span class="activity-muted">No delivery channels listed</span>';
    }

    function renderActivityTable(data, kind, currentCustomerId) {
        const items = (data && data.items) ? data.items : [];
        let html = '';
        html += '<div class="activity-summary">';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.length + '</div><div class="activity-stat-label">' + kind + '</div></div>';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.filter(item => (item.customerImpact || []).length > 0).length + '</div><div class="activity-stat-label">With customer impact</div></div>';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.filter(item => (item.productBricks || []).length > 0).length + '</div><div class="activity-stat-label">With bricks</div></div>';
        html += '</div>';

        if (!items.length) {
            html += '<div class="group" style="margin-top:0">No related ' + kind.toLowerCase() + ' found for this customer.</div>';
            return html;
        }

        html += '<table class="activity-table">';
        html += '<tr><th>Date</th><th>Description</th><th>Customer Impact</th><th>Product Bricks</th><th>Delivery Channels</th></tr>';
        items.forEach(item => {
            html += '<tr>';
            html += '<td style="white-space:nowrap">' + escapeHtml(formatDate(item.date)) + '</td>';
            html += '<td><a class="activity-link" target="_blank" rel="noopener noreferrer" href="../../' + kind.toLowerCase() + '/landing_pages/' + item.landingPageIndex + '.html">' + escapeHtml(item.description || item.name || kind) + '</a></td>';
            html += '<td>' + renderImpactCell(item, currentCustomerId) + '</td>';
            html += '<td>' + renderBrickCell(item) + '</td>';
            html += '<td>' + renderChannelCell(item) + '</td>';
            html += '</tr>';
        });
        html += '</table>';
        return html;
    }

    addHeader();
    addHome();
    addJBTD();
    addJourneys();
    addKPIs();
    addProductVision();
    addInsights();


</script>

        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>

</body>
</html>
