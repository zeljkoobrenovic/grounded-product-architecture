ining reimbursed hours of the calendar year for that discipline were known in the dossier, so contacts beyond the limit became patient invoices rather than rejections.", "unit": "%", "currentValue": "52", "targetValue": "92", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/co-alth-b1-c1-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-co-alth-b1-c1-l2.png", "children": []}]}, {"id": "co-alth-b1-c2", "name": "Care pathway template coverage", "description": "Share of new allied health episodes opened on a discipline-specific care pathway with the guideline template of the NVLF, Ergotherapie Nederland, VvOCM, NVD or podiatry association rather than on a blank dossier.", "unit": "%", "currentValue": "45", "targetValue": "90", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/co-alth-b1-c2", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-co-alth-b1-c2.png", "children": [{"id": "co-alth-b1-c2-l1", "name": "Diagnosis and treatment codes derived from the pathway", "description": "Share of registered contacts whose diagnosis and treatment codes were derived from the pathway and episode rather than chosen by hand from the code list.", "unit": "%", "currentValue": "62", "targetValue": "95", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/co-alth-b1-c2-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-co-alth-b1-c2-l1.png", "children": []}, {"id": "co-alth-b1-c2-l2", "name": "Measurement moments pre-planned by the pathway", "description": "Share of episodes where the intake, evaluation and closure measurement moments were planned by the pathway template at opening rather than added later.", "unit": "%", "currentValue": "50", "targetValue": "90", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/co-alth-b1-c2-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-co-alth-b1-c2-l2.png", "children": []}]}]}, {"id": "co-alth-b2", "name": "Network care and outcomes without double registration", "description": "Whether referrals, reports, chain-care and municipal contacts and outcome measurements run through the dossier and the patient app instead of through a second system, a phone call or a retyped letter.", "currentValue": "41", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/co-alth-b2", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-co-alth-b2.png", "children": [{"id": "co-alth-b2-c1", "name": "Referral and reporting loop closed digitally", "description": "Share of allied health episodes where the referral arrived digitally into the dossier and the report to the referrer was sent from the dossier through ZorgMail or ZorgDomein with delivery confirmed.", "unit": "%", "currentValue": "40", "targetValue": "85", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/co-alth-b2-c1", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-co-alth-b2-c1.png", "children": [{"id": "co-alth-b2-c1-l1", "name": "ZorgDomein referrals received into the dossier", "description": "Share of referred episodes that were opened from a ZorgDomein or ZorgMail referral rather than from a scanned or typed letter.", "unit": "%", "currentValue": "35", "targetValue": "85", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/co-alth-b2-c1-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-co-alth-b2-c1-l1.png", "children": []}, {"id": "co-alth-b2-c1-l2", "name": "Referrer reports sent from the dossier", "description": "Share of intake, interim and final reports to GPs, paediatricians and specialists generated from the dossier and sent through ZorgMail without a separate document.", "unit": "%", "currentValue": "45", "targetValue": "90", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/co-alth-b2-c1-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-co-alth-b2-c1-l2.png", "children": []}]}, {"id": "co-alth-b2-c2", "name": "Outcome measurements shared with patients and payers", "description": "Share of closed allied health episodes with measurements at start and end that were visible to the patient in the app and included in the quality data or outcome dashboard used with referrers and payers.", "unit": "%", "currentValue": "38", "targetValue": "80", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/co-alth-b2-c2", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-co-alth-b2-c2.png", "children": [{"id": "co-alth-b2-c2-l1", "name": "PROMs completed at start and end of treatment", "description": "Share of closed episodes with the discipline's PROM or measurement instrument completed both at intake and at closure.", "unit": "%", "currentValue": "42", "targetValue": "85", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/co-alth-b2-c2-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-co-alth-b2-c2-l1.png", "children": []}, {"id": "co-alth-b2-c2-l2", "name": "Patients viewing their progress in the app", "description": "Share of active allied health patients or parents who opened their progress, goals or home programme in Uw Zorg Online in the last 30 days.", "unit": "%", "currentValue": "20", "targetValue": "60", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/co-alth-b2-c2-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-co-alth-b2-c2-l2.png", "children": []}]}]}]}, "businessOutcomes": {"top": {"id": "bo-alth-top", "name": "Annual recurring revenue from allied health practices", "description": "Subscription, module, billing-service and payment revenue per year from speech therapy, occupational therapy, exercise therapy, dietetics and podiatry practices on Incura, Evry, Podofile, Abakus and HCI One. Modeled seed value: about 6,000 allied health professionals at the modeled average of EUR 30 per professional per month, for a group that reported EUR 20 million turnover in 2023; HCI publishes no list prices and no segment revenue, so this is not an official HCI figure.", "unit": "EUR million per year", "currentValue": "2.2", "targetValue": "4.3", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/bo-alth-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-bo-alth-top.png"}, "branches": [{"id": "bo-alth-b1", "name": "Allied health base growth across disciplines", "description": "How fast the allied health base grows per discipline and how many practices add a second discipline or move onto HCI One when their discipline's wave arrives.", "currentValue": "44", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/bo-alth-b1", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-bo-alth-b1.png", "children": [{"id": "bo-alth-b1-c1", "name": "Allied health professionals on HCI labels", "description": "Number of speech, occupational and exercise therapists, dietitians and podiatrists with an active subscription on Incura, Evry, Podofile, Abakus or HCI One at the end of the period. Modeled seed value; Incura reports around 7,500 providers across all its disciplines including physiotherapy and Evry is described as market leader for dietitians, but HCI publishes no per-discipline counts.", "unit": "professionals", "currentValue": "6000", "targetValue": "8500", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/bo-alth-b1-c1", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-bo-alth-b1-c1.png", "children": [{"id": "bo-alth-b1-c1-l1", "name": "New allied health practices won per month", "description": "Allied health practices that signed a subscription in the month, across all labels and HCI One.", "unit": "practices per month", "currentValue": "22", "targetValue": "35", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/bo-alth-b1-c1-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-bo-alth-b1-c1-l1.png", "children": []}, {"id": "bo-alth-b1-c1-l2", "name": "Allied health professionals live on HCI One", "description": "Cumulative number of allied health professionals migrated to HCI One in their discipline's wave with their previous label switched off.", "unit": "professionals", "currentValue": "50", "targetValue": "5500", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/bo-alth-b1-c1-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-bo-alth-b1-c1-l2.png", "children": []}]}, {"id": "bo-alth-b1-c2", "name": "Multidisciplinary practice share", "description": "Share of allied health practices on HCI labels that run two or more disciplines on one subscription, the segment HCI One is designed for.", "unit": "%", "currentValue": "30", "targetValue": "45", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/bo-alth-b1-c2", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-bo-alth-b1-c2.png", "children": [{"id": "bo-alth-b1-c2-l1", "name": "Practices adding a second discipline per year", "description": "Allied health practices that added a second discipline to their existing subscription during the year.", "unit": "practices per year", "currentValue": "60", "targetValue": "150", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/bo-alth-b1-c2-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-bo-alth-b1-c2-l1.png", "children": []}, {"id": "bo-alth-b1-c2-l2", "name": "Discipline-specific module attach rate", "description": "Share of allied health practices with at least one paid discipline module beyond the base agenda and dossier: measurement instruments, chain-care declarations, group programmes or the patient app.", "unit": "%", "currentValue": "35", "targetValue": "60", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/bo-alth-b1-c2-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-bo-alth-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-alth-b2", "name": "Retention and revenue per allied health professional", "description": "Whether allied health practices stay through the consolidation of Incura, Evry, Podofile and Abakus into HCI One and whether each professional buys the services that lift revenue.", "currentValue": "56", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/bo-alth-b2", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-bo-alth-b2.png", "children": [{"id": "bo-alth-b2-c1", "name": "Annual allied health practice churn rate", "description": "Share of allied health practices that ended their subscription in the year, including practices lost during migration to HCI One.", "unit": "%", "currentValue": "6", "targetValue": "3.5", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/bo-alth-b2-c1", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-bo-alth-b2-c1.png", "children": [{"id": "bo-alth-b2-c1-l1", "name": "Practices lost during label migration", "description": "Allied health practices that ended their subscription within six months of a migration from Incura, Evry, Podofile or Abakus to HCI One.", "unit": "practices per year", "currentValue": "40", "targetValue": "10", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/bo-alth-b2-c1-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-bo-alth-b2-c1-l1.png", "children": []}, {"id": "bo-alth-b2-c1-l2", "name": "Support tickets per allied health practice per month", "description": "Average number of support tickets raised per allied health practice per month, a driver of both churn and service cost.", "unit": "tickets per practice per month", "currentValue": "0.5", "targetValue": "0.3", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/bo-alth-b2-c1-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-bo-alth-b2-c1-l2.png", "children": []}]}, {"id": "bo-alth-b2-c2", "name": "Average revenue per allied health professional per month", "description": "Monthly recurring revenue from subscriptions, modules, billing services and payment fees divided by the number of allied health professionals on HCI labels.", "unit": "EUR per professional per month", "currentValue": "30", "targetValue": "42", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/bo-alth-b2-c2", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-bo-alth-b2-c2.png", "children": [{"id": "bo-alth-b2-c2-l1", "name": "Billing-service adoption among allied health practices", "description": "Share of allied health practices that outsource Vecozo submission and return-message handling to HCI's billing services.", "unit": "%", "currentValue": "15", "targetValue": "30", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/bo-alth-b2-c2-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-bo-alth-b2-c2-l1.png", "children": []}, {"id": "bo-alth-b2-c2-l2", "name": "Declaration value processed for allied health practices", "description": "Annual value of GDS801 and municipal declarations submitted through HCI labels for allied health practices, the base for billing-service fees. Modeled share of the group's reported EUR 500 million+ annual declarations.", "unit": "EUR million per year", "currentValue": "110", "targetValue": "160", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/alth/kpis/bo-alth-b2-c2-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-alth-bo-alth-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make Incura, Evry and then HCI One the place where a speech therapist, occupational therapist, exercise therapist, dietitian or podiatrist runs a discipline-specific practice without being its administrator: the guideline pathway, code list and policy limits of the discipline applied by the software, referrals and reports flowing through ZorgDomein and ZorgMail, chain-care and municipal contacts declared to the right payer once, and outcomes the patient sees in the app and the payer sees in the contract conversation.", "timeHorizons": {"year1": {"focus": "Keep Incura and Evry fully supported and current for GDS801 and the yearly contract rounds, extend discipline-specific pathways and code lists across speech therapy, occupational therapy, exercise therapy, dietetics and podiatry, and close the referral and reporting loop with ZorgDomein and ZorgMail so that allied health therapists feel the relief in their evenings within the year.", "productTheme": "Discipline rules in the software, reports from the dossier", "customerKPI": {"northStar": "Administrative time per client contact", "supporting": ["Declaration first-time acceptance rate", "Care pathway template coverage"]}, "businessKPI": {"northStar": "Annual recurring revenue from allied health practices", "revenueStreams": ["Practice subscriptions on Incura, Evry, Podofile and Abakus, quoted per number of professionals, modules and integrations", "Billing services on the declaration value processed for allied health practices", "Discipline modules: measurement instruments, chain-care declarations, group programmes, patient app"], "supporting": ["Allied health professionals on HCI labels", "Discipline-specific module attach rate"]}, "milestones": ["Ship maintained guideline pathways and code lists for all five allied health disciplines on Incura and Evry with policy-limit tracking at intake", "Route chain-care and municipal contacts to the right payer from one registration and keep first-time acceptance above the pre-GDS801 level", "Open every referred episode from ZorgDomein or ZorgMail and send referrer reports from the dossier by default"]}, "year3": {"focus": "Bring the allied health disciplines onto HCI One in their own waves with the Incura and Evry content carried over, make the multidisciplinary episode the norm for chain care and youth care, let Uw Zorg Online carry PROMs, home programmes and parent communication, and use AI drafting to turn evaluations into referrer, school and payer reports.", "productTheme": "One multidisciplinary platform with outcomes the patient can see", "customerKPI": {"northStar": "Administrative time per client contact", "supporting": ["Referral and reporting loop closed digitally", "PROMs completed at start and end of treatment"]}, "businessKPI": {"northStar": "Annual recurring revenue from allied health practices", "revenueStreams": ["HCI One subscriptions per practice with discipline and module tiers", "Billing services and payment fees on a rising declaration and patient invoice volume", "Measurement and e-health content per discipline through the partner platform"], "supporting": ["Annual allied health practice churn rate", "Multidisciplinary practice share"]}, "milestones": ["Complete the speech therapy, dietetics and occupational therapy waves of HCI One with validated migrations from Incura and Evry and no practice left behind", "Deliver the multidisciplinary episode with per-discipline goals, shared measurements and one report set for chain-care and youth-care programmes", "Activate Uw Zorg Online for the majority of allied health patients and parents with PROMs, home programmes, e-consult and invoices in one app"]}, "year5": {"focus": "Position HCI One as the outcome platform for allied health care in the Benelux: pathway benchmarks per discipline from register-grade data, prevention and lifestyle programmes with dietitians and exercise therapists reimbursed by insurers and municipalities, and a solo practice that runs with a fraction of today's administration in a market short of therapists.", "productTheme": "Outcome benchmarks and reimbursed prevention per discipline", "customerKPI": {"northStar": "Administrative time per client contact", "supporting": ["Outcome measurements shared with patients and payers", "Care pathway template coverage"]}, "businessKPI": {"northStar": "Annual recurring revenue from allied health practices", "revenueStreams": ["Platform subscriptions across the national allied health base", "Prevention and lifestyle programmes reimbursed by insurers and municipalities and delivered through the platform", "Outcome and benchmark analytics for practices, care groups, municipalities and insurers"], "supporting": ["Average revenue per allied health professional per month", "Allied health professionals live on HCI One"]}, "milestones": ["Offer outcome benchmarks per discipline pathway to every practice and to the contract conversations of care groups and municipalities", "Launch reimbursed lifestyle and prevention programmes for dietitians and exercise therapists with e-health partners inside HCI One", "Extend HCI One allied health disciplines to Belgium with local declaration and guideline rules"]}}}, "domain": "Paramedical Practices"}, {"id": "rhab", "name": "Rehabilitation and Hospital Paramedical Coordinator", "description": "Team lead of a paramedical or rehabilitation department in a hospital or rehabilitation centre, usually a senior physiotherapist or occupational therapist who still treats part of the week and coordinates the rest: a team of ten to forty therapists across physiotherapy, occupational therapy, speech therapy and dietetics, working with rehabilitation physicians and psychologists on multidisciplinary trajectories for orthopaedic, neurological, cardiac, oncology, geriatric and paediatric patients. Works with ParaNICE for registration and multidisciplinary coordination next to the hospital information system that holds admissions, orders and the medical record but not the paramedical work, and with NICE Connect for remote trajectories after discharge, the model Amsterdam UMC has used since 2014 to follow premature infants and their parents at home. Reports production, waiting times and outcomes to hospital management, the finance department and the quality office, and prepares the budget round. Judges the software on whether the trajectory opens from the hospital system and closes back into it, whether every discipline works in one plan, whether remote follow-up lives in the same record and production, and whether the department report is a dashboard output rather than three days of spreadsheets.", "icon": "rhab.png", "careAbout": ["One trajectory record for all disciplines that opens from the hospital information system's admission or order and sends the report back, so nothing the hospital already knows is re-entered", "A multidisciplinary consultation prepared from the shared plan with decisions recorded back into it, so the rehabilitation physician and the team work from the same picture", "Same-day registration of every session with the activity and financing codes the finance department recognises, so the department's production matches the hospital's books", "Remote follow-up after discharge in the same record and production, with alerts that reach the treating discipline and replace visits rather than adding a separate app to check", "The department report, outcomes per programme and the quality register indicators produced from the registrations instead of from spreadsheets", "Certification, authentication, consent and audit that pass the hospital's information security and medical ethics reviews without a custom exception"], "winsThem": ["ParaNICE's multidisciplinary registration and trajectory plan built for hospital paramedical departments, with connectors to the hospital information systems that open trajectories from orders", "NICE Connect remote trajectories proven since 2014 with the Amsterdam UMC premature infant network and German rehabilitation centres, with tasks, measurements, video sessions, alerts and parent participation in the same record", "Registration completeness views, the department report and outcome dashboards per programme from the same registrations, aligned with the finance department's codes", "HCI's NEN 7510 and ISO 27001 certification, DigiD-level authentication and consent handling that satisfy hospital information security and medical ethics reviews", "The HCI platform behind ParaNICE: Embloom questionnaires, Emogy environments, exercise partners and Uw Zorg Online as the patient's single entry across hospital, paramedical and GP care"], "theirFear": ["A hospital information system upgrade or vendor change that breaks the connector, so trajectories are entered by hand again and the production gap with the finance department reopens", "A remote follow-up programme that the team stops checking, so a missed measurement leads to a readmission and the medical ethics committee withdraws its approval", "A budget round in which the department cannot show its production and outcomes in numbers the hospital recognises, and loses therapist capacity to another department"], "jobsToBeDone": [{"id": "jtbd-rhab-1", "name": "Coordinate multidisciplinary rehabilitation trajectories next to the hospital system", "whatItIs": "Run a rehabilitation or paramedical trajectory in which a physiotherapist, occupational therapist, speech therapist, dietitian, psychologist and rehabilitation physician each treat the same patient, inside a hospital or rehabilitation centre whose hospital information system holds the patient's admission, orders and medical record but not the paramedical work. The coordinator needs one trajectory record that receives the patient and the order from the hospital system, holds the goals, plans and notes of every discipline, prepares the multidisciplinary consultation, registers every contact for the department's production and the DBC or rehabilitation financing, and reports back into the hospital system, without the disciplines keeping their own spreadsheets and without the coordinator re-entering what the hospital already knows.", "outcome": "Every trajectory has one shared plan with per-discipline goals, patient and order data arrive from the hospital information system without retyping, the multidisciplinary consultation is prepared from the record in minutes, every contact is registered the same day for production and financing, and the coordinator's time per trajectory goes to clinical coordination rather than to chasing registrations.", "steps": [{"step": "Receive the patient and the order from the hospital information system", "description": "Let the admission, the referral order from the rehabilitation physician or specialist, the demographics and the relevant diagnoses arrive from the hospital information system into ParaNICE, open the trajectory with the order's question and the financing (DBC, medical specialist rehabilitation, geriatric rehabilitation), and assign the disciplines the order asks for.", "streamsNeeded": [{"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "howItSupports": "Connects ParaNICE to the hospital information system so admissions, orders and patient data open the trajectory without retyping."}, {"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Opens the multidisciplinary trajectory record with the order, financing and assigned disciplines in place."}]}, {"step": "Plan the disciplines' sessions around the ward and the outpatient agenda", "description": "Schedule the sessions of each discipline around the ward programme, the outpatient clinic and the patient's transport, keep the therapists' agendas balanced across wards and locations, and see at once which patients have not been seen by a discipline the order requires.", "streamsNeeded": [{"id": "schedule-appointments-and-online-booking", "name": "Schedule Appointments and Online Booking", "howItSupports": "Runs the multi-therapist agenda across wards, locations and outpatient slots with the trajectory's required disciplines visible."}, {"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Shows per trajectory which disciplines have started, which sessions are planned and where the plan is behind."}]}, {"step": "Keep one treatment plan with per-discipline goals and notes", "description": "Set the rehabilitation goals with the patient and the team, let each discipline record its own goals, measurements and session notes under the same plan, and see the whole picture without opening five dossiers or reading three e-mail threads.", "streamsNeeded": [{"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Holds one trajectory plan with per-discipline goals, notes and measurements visible to the whole treating team under the hospital's access rules."}, {"id": "measure-outcomes-with-proms-and-rom", "name": "Measure Outcomes with PROMs and ROM", "howItSupports": "Places the rehabilitation outcome instruments and PROMs on one timeline in the plan across disciplines."}]}, {"step": "Prepare and run the multidisciplinary consultation from the record", "description": "Generate the consultation overview per patient from the plan, the recent notes and the measurements, run the weekly multidisciplinary consultation with the rehabilitation physician, record the decisions and the revised goals back into the plan and assign the actions to the disciplines, so the outcome of the meeting is in the record before the next session.", "streamsNeeded": [{"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Generates the consultation overview from the plan and records decisions and revised goals as part of the trajectory."}, {"id": "coordinate-ggz-treatment-and-medication", "name": "Coordinate GGZ Treatment and Medication", "howItSupports": "Supplies the multidisciplinary treatment-plan and settings model reused for rehabilitation teams with psychologists and physicians."}]}, {"step": "Register every contact for production and financing the same day", "description": "Let therapists confirm their sessions in the agenda with the time, activity and discipline codes the department's financing and production reporting need, catch missing registrations at the end of the day, and pass the registrations to the hospital information system or the finance department for the DBC or rehabilitation claim.", "streamsNeeded": [{"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Turns confirmed sessions into registration lines with the activity and financing codes and passes them to the hospital's billing flow."}, {"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Flags missing or late registrations per therapist and ward before the day closes."}]}, {"step": "Report back into the hospital system and close the trajectory", "description": "Write the discharge or final report from the plan and the outcomes, send it into the hospital information system and to the GP or the next care provider through ZorgMail, and close the trajectory with its outcome and follow-up arrangement consistent with the registrations.", "streamsNeeded": [{"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "howItSupports": "Sends the final report into the hospital information system and to the GP or next provider through ZorgMail with the loop closed."}, {"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Closes the trajectory with the outcome, follow-up and closure fields the department's audit rules require."}]}]}, {"id": "jtbd-rhab-2", "name": "Follow patients remotely after discharge", "whatItIs": "Continue the trajectory after the patient leaves the ward or the outpatient programme without filling the agenda with follow-up visits: give the patient or the parents a remote environment with exercises, measurements, questionnaires and video sessions, watch the data that comes back, and step in when a patient falls behind or a measurement crosses a threshold. NICE Connect has run this since 2014 with the Amsterdam UMC network that follows premature infants and their parents after discharge, and the same model serves post-operative rehabilitation, cardiac and oncology programmes and German rehabilitation centres. The coordinator wants the remote trajectory to be part of the same record and the same production, not a separate app that the team checks when it remembers.", "outcome": "Patients complete their remote follow-up with the home tasks and measurements done on time, video sessions replace a large share of follow-up visits, the team is alerted on missed measurements and threshold breaches and acts within days, unplanned contacts and readmissions per trajectory fall, and remote contacts are registered and financed like any other session.", "steps": [{"step": "Design the remote trajectory per programme", "description": "Build the remote follow-up programme for the patient group with the team: which exercises and instructions, which measurements and questionnaires at which moments, which video sessions, which thresholds trigger an alert, and which parent or carer takes part, so every patient in the programme gets a consistent trajectory that can still be adjusted per patient.", "streamsNeeded": [{"id": "deliver-blended-and-e-health-care", "name": "Deliver Blended and E-health Care", "howItSupports": "Provides the NICE Connect trajectory builder with tasks, measurements, questionnaires, video sessions and alert thresholds per programme."}, {"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Links the remote programme to the trajectory record so goals and outcomes stay in one plan."}]}, {"step": "Enrol the patient and the family at discharge", "description": "Invite the patient or the parents before discharge, activate the remote environment on their phone with strong authentication, walk them through the first tasks on the ward, and set the consent for which data the team and the hospital see.", "streamsNeeded": [{"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Activates the patient or parent in the app with invitations, onboarding and notifications."}, {"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Handles DigiD-level authentication, consent and audit logging for remote access to medical data."}]}, {"step": "Run home tasks, measurements and video sessions", "description": "Let the patient do the exercises, log the measurements and fill in the questionnaires at home, hold video sessions with the physiotherapist or the nurse instead of a visit, and keep everything in the trajectory record with the discipline that owns it.", "streamsNeeded": [{"id": "deliver-blended-and-e-health-care", "name": "Deliver Blended and E-health Care", "howItSupports": "Runs home tasks, self-measurements, questionnaires and video sessions in the remote trajectory and reports completion to the record."}, {"id": "manage-personal-health-data-and-sharing", "name": "Manage Personal Health Data and Sharing", "howItSupports": "Lets parents and informal carers take part and share self-measurements and diaries under a share permission."}]}, {"step": "Watch the data and act on alerts", "description": "See per programme which patients are on track, which missed a task or a measurement and which crossed a threshold, assign the follow-up to the right discipline, contact the patient by message or video and record the intervention, so a problem is caught in days rather than at the next outpatient visit.", "streamsNeeded": [{"id": "deliver-blended-and-e-health-care", "name": "Deliver Blended and E-health Care", "howItSupports": "Monitors adherence and thresholds across the remote trajectories and raises alerts to the treating team."}, {"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Shows per programme and per therapist the open alerts, the response times and the patients falling behind."}]}, {"step": "Register remote contacts and close the follow-up with outcomes", "description": "Register video sessions and monitoring contacts with the codes the financing allows, evaluate the remote trajectory with the outcome instruments at its end, report the result to the treating physician and the GP, and close it in the same record as the clinical trajectory.", "streamsNeeded": [{"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Registers remote contacts and video sessions with the activity codes the hospital or rehabilitation financing allows."}, {"id": "measure-outcomes-with-proms-and-rom", "name": "Measure Outcomes with PROMs and ROM", "howItSupports": "Captures the outcome instruments at the end of the remote trajectory and compares them with discharge values."}]}]}, {"id": "jtbd-rhab-3", "name": "Report department productivity and outcomes", "whatItIs": "Answer, every month and at every budget round, what the paramedical or rehabilitation department delivers: contacts and treatment hours per discipline, per ward and per therapist, production against the DBC and rehabilitation budgets, waiting times for a first contact, outcomes per programme, the share of trajectories followed remotely, and the quality indicators the hospital, the insurers and the rehabilitation quality registers ask for. The coordinator has to deliver this to the hospital management, the rehabilitation physician, the finance department and the quality office from registrations that live in ParaNICE next to a hospital information system that reports on its own terms, and does not want to spend days per month in spreadsheets.", "outcome": "The monthly department report is produced from the registrations in hours rather than days, production and outcomes per discipline and programme are visible to the team without a request to the coordinator, the quality register and insurer indicators are delivered from the same data, and the budget conversation with the hospital is held on numbers that the finance department recognises.", "steps": [{"step": "Make complete and timely registration the norm", "description": "Show each therapist and ward at the end of the day which sessions are not confirmed or lack an activity code, follow up the exceptions weekly, and align the registration rules with the finance department so the department's production matches the hospital's books.", "streamsNeeded": [{"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Provides daily and weekly registration completeness views per therapist, ward and discipline."}, {"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Validates registrations against the financing rules so what the department reports is what finance can claim."}]}, {"step": "Build the monthly department report from the registrations", "description": "Compose the production, capacity and waiting-time report per discipline, ward and programme from the dashboard, compare it with the budget and the previous months, and send it to the management team and the finance department in the format they use, without exporting to a spreadsheet and rebuilding it by hand.", "streamsNeeded": [{"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Delivers the department report with production, capacity, waiting times and budget comparison per discipline, ward and programme."}]}, {"step": "Show outcomes per programme and per discipline", "description": "Report the rehabilitation outcome measures and PROMs per programme against discharge values and benchmarks, including the remote follow-up programmes, so the rehabilitation physician and the team see which programmes work and the quality office has evidence for the indicators.", "streamsNeeded": [{"id": "measure-outcomes-with-proms-and-rom", "name": "Measure Outcomes with PROMs and ROM", "howItSupports": "Aggregates outcome instruments and PROMs per programme and discipline against benchmarks."}, {"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Presents outcome and programme views next to production for the team and the quality office."}]}, {"step": "Deliver quality register and insurer indicators from the same data", "description": "Compile the indicators the rehabilitation quality register, the hospital's quality office and the insurers ask for from the trajectory records and registrations, under the hospital's consent and pseudonymisation rules, and check the delivery reports.", "streamsNeeded": [{"id": "measure-outcomes-with-proms-and-rom", "name": "Measure Outcomes with PROMs and ROM", "howItSupports": "Compiles pseudonymised indicator sets for quality registers and insurers from the trajectory data under consent."}, {"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Applies the hospital's consent, pseudonymisation and audit rules to every data delivery."}]}, {"step": "Prepare the budget and capacity conversation", "description": "Use the trend in contacts, hours, waiting times, remote share and outcomes per programme to argue for therapist capacity, remote-care extension or programme changes with the hospital management, in numbers the finance department recognises from its own reports.", "streamsNeeded": [{"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Provides multi-year trend and capacity views per discipline and programme for budget rounds."}]}]}], "customerJourneyStories": [{"id": "journey-rhab-1", "name": "A hospital paramedical department replaces spreadsheets with ParaNICE next to the HIS", "linkedJobIds": ["jtbd-rhab-1", "jtbd-rhab-3"], "summary": "The coordinator of a paramedical department with thirty therapists across physiotherapy, occupational therapy, speech therapy and dietetics in a regional hospital replaces discipline spreadsheets and a home-grown registration module with ParaNICE alongside the hospital information system: a missed production target and a failed audit trigger the search, a rehabilitation congress and a peer hospital surface ParaNICE, the hospital's information security review and the HIS connector decide, and a year later the department report is produced in hours.", "stages": [{"stage": "Trigger", "narrative": "The hospital's finance department reports that the paramedical department registered fifteen percent less production than the therapists say they delivered, and the quality office finds in an audit that the multidisciplinary plans live in four discipline spreadsheets and the hospital information system holds only the orders. The coordinator spends three days a month rebuilding the department report and cannot say which trajectories were seen by every discipline the order required."}, {"stage": "Discovery", "narrative": "At a rehabilitation congress the coordinator hears a peer hospital present how its paramedical department registers and coordinates in ParaNICE next to the hospital information system, with one trajectory plan for all disciplines and the department report from the dashboard. The peer mentions NICE Connect for remote follow-up, in use since 2014 with the Amsterdam UMC network for premature infants, and that NICE has been part of HCI since 2023 and shares its platform and certification."}, {"stage": "Evaluation", "narrative": "The coordinator, the CMIO and the information manager evaluate ParaNICE against extending the hospital information system's own module and against a generic paramedical EPD. The deciding factors are the multidisciplinary trajectory plan, the connector to the hospital information system that opens trajectories from orders and sends reports back, the department reporting, NICE Connect as an option for later, the NEN 7510 and ISO 27001 certification and the hospital's information security and data processing review, and references from two hospitals on the same hospital information system."}, {"stage": "Trial", "narrative": "One ward's physiotherapy and occupational therapy start on ParaNICE for a quarter with the connector live for admissions and orders, while the rest of the department stays on the spreadsheets. The implementation consultant configures the activity codes with the finance department, the therapists confirm sessions in the agenda from the first day, and the first monthly report from the dashboard is compared with the finance department's numbers."}, {"stage": "Engagement", "narrative": "After the rollout to all wards and disciplines the trajectory opens from the order, the multidisciplinary consultation runs from the record, every session is confirmed the same day and the coordinator sees each morning which trajectories are behind and which registrations are missing. The department report goes to management from the dashboard, and the outcome measures per programme are shown to the rehabilitation physicians in the quarterly meeting."}, {"stage": "Retention", "narrative": "At renewal the department's production matches the hospital's books for the fourth quarter in a row, the quality audit passes on the trajectory plans, and the hospital's information manager has stopped asking whether the paramedical module of the hospital information system would be cheaper: the connector survived the hospital system's major upgrade with one planned retest, and the department report has not been rebuilt in a spreadsheet since the first quarter. The coordinator negotiates a renewal that adds the dietetics team and the first NICE Connect programme for post-operative orthopaedic patients, and the finance department co-signs the business case because the numbers come from a source it already reconciles."}]}, {"id": "journey-rhab-2", "name": "A rehabilitation centre adopts NICE Connect for remote follow-up after discharge", "linkedJobIds": ["jtbd-rhab-2", "jtbd-rhab-1"], "summary": "The coordinator of the paediatric and cardiac rehabilitation programmes in a rehabilitation centre that already uses ParaNICE adds NICE Connect to follow patients and parents at home after discharge: a full outpatient agenda and drop-outs after discharge trigger the search, the Amsterdam UMC premature infant network and an HCI e-health session surface NICE Connect, a pilot with alerts and video sessions in the same record decides, and two years later a third of follow-up contacts run remotely.", "stages": [{"stage": "Trigger", "narrative": "The outpatient agenda of the rehabilitation centre is full for eight weeks, discharged patients wait for their follow-up and a share of them stop the home programme before the first visit, and the parents of children in the paediatric programme call the therapists with questions between visits. A readmission that a missed measurement would have flagged makes the rehabilitation physician ask for a remote follow-up programme."}, {"stage": "Discovery", "narrative": "The coordinator knows NICE Connect from the Amsterdam UMC network that has followed premature infants and their parents remotely since 2014, and attends an HCI e-health session where the remote trajectories, the Emogy environment for children and the integration in the ParaNICE record are shown. A German rehabilitation centre using NICE Connect describes how video sessions replaced part of its follow-up visits."}, {"stage": "Evaluation", "narrative": "The centre compares NICE Connect with a standalone remote monitoring app and a video consultation tool. The deciding factors are that the remote trajectory lives in the same ParaNICE record and production, that alerts on missed measurements and threshold breaches reach the treating discipline, that parents can take part with a share permission, that authentication and consent meet the centre's NEN 7510 policy, and that remote contacts can be registered with the codes the financing allows. The medical ethics and information security committees approve the pilot."}, {"stage": "Trial", "narrative": "The paediatric programme runs a six-month pilot with twenty families: parents are enrolled on the ward before discharge, home tasks and measurements are set per child, video sessions replace the second and third visits, and the team handles alerts in a daily fifteen-minute review. The pilot compares completion, unplanned contacts and parent satisfaction with the previous cohort."}, {"stage": "Engagement", "narrative": "After the pilot the cardiac and orthopaedic programmes follow, remote trajectories are designed per programme with the team, the daily alert review becomes part of the therapists' routine, and the dashboard shows completion, response times and remote share per programme. Remote contacts are registered like any session and appear in the department report."}, {"stage": "Retention", "narrative": "The centre renews NICE Connect because a third of follow-up contacts now run remotely, the outpatient waiting time has fallen from eight weeks to three, unplanned contacts per trajectory have halved and the parents in the paediatric programme ask for the programme by name at discharge. The renewal is priced on remote trajectory volume rather than on seats, the medical ethics committee extends its approval on the basis of the pilot's completion and readmission figures, and the coordinator joins HCI's remote-care user group to shape the alert and threshold features the cardiac programme needs next."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-rhab-top", "name": "Trajectory coordination time per patient", "description": "Minutes of coordination work per rehabilitation or paramedical trajectory spent by the coordinator and the therapists on receiving orders and patient data, assigning and scheduling disciplines, preparing consultations, chasing registrations, managing remote follow-up and reporting, measured from time in the system per trajectory and periodic team surveys. Modeled seed value for hospital paramedical and rehabilitation departments, not an official HCI or hospital figure.", "unit": "minutes per trajectory", "currentValue": "140", "targetValue": "75", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/co-rhab-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-co-rhab-top.png"}, "branches": [{"id": "co-rhab-b1", "name": "One trajectory across disciplines and the hospital system", "description": "Whether the trajectory runs on one shared plan fed by the hospital information system, so coordination is clinical decision-making rather than re-entry, chasing and spreadsheet consolidation.", "currentValue": "58", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/co-rhab-b1", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-co-rhab-b1.png", "children": [{"id": "co-rhab-b1-c1", "name": "Trajectory plan shared across all disciplines", "description": "Share of active trajectories where every discipline the order requires records its goals, notes and measurements in the shared ParaNICE plan rather than in a separate file.", "unit": "%", "currentValue": "55", "targetValue": "90", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/co-rhab-b1-c1", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-co-rhab-b1-c1.png", "children": [{"id": "co-rhab-b1-c1-l1", "name": "Trajectories opened from the hospital information system", "description": "Share of trajectories opened automatically from an admission or order received through the hospital information system connector rather than entered by hand.", "unit": "%", "currentValue": "60", "targetValue": "95", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/co-rhab-b1-c1-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-co-rhab-b1-c1-l1.png", "children": []}, {"id": "co-rhab-b1-c1-l2", "name": "Consultations prepared from the shared record", "description": "Share of multidisciplinary consultations whose patient overview was generated from the trajectory plan and whose decisions were recorded back into it.", "unit": "%", "currentValue": "40", "targetValue": "85", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/co-rhab-b1-c1-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-co-rhab-b1-c1-l2.png", "children": []}]}, {"id": "co-rhab-b1-c2", "name": "Department report preparation time", "description": "Hours per month the coordinator spends producing the department's production, capacity, waiting-time and outcome report for management, finance and the quality office.", "unit": "hours per month", "currentValue": "20", "targetValue": "4", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/co-rhab-b1-c2", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-co-rhab-b1-c2.png", "children": [{"id": "co-rhab-b1-c2-l1", "name": "Sessions registered the same day", "description": "Share of delivered sessions confirmed in the agenda with activity and discipline codes before the end of the working day.", "unit": "%", "currentValue": "70", "targetValue": "95", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/co-rhab-b1-c2-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-co-rhab-b1-c2-l1.png", "children": []}, {"id": "co-rhab-b1-c2-l2", "name": "Outcome measurements recorded per trajectory", "description": "Share of closed trajectories with the programme's outcome instruments recorded at start and end so outcome reporting needs no manual collection.", "unit": "%", "currentValue": "50", "targetValue": "85", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/co-rhab-b1-c2-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-co-rhab-b1-c2-l2.png", "children": []}]}]}, {"id": "co-rhab-b2", "name": "Patients followed remotely after discharge", "description": "Whether the trajectory continues at home in the same record, so follow-up visits are replaced by remote tasks and video sessions and problems are caught early instead of at the next visit.", "currentValue": "52", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/co-rhab-b2", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-co-rhab-b2.png", "children": [{"id": "co-rhab-b2-c1", "name": "Remote follow-up completion rate", "description": "Share of remote NICE Connect trajectories completed with the home tasks, measurements and sessions done as planned until the trajectory's end evaluation.", "unit": "%", "currentValue": "58", "targetValue": "85", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/co-rhab-b2-c1", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-co-rhab-b2-c1.png", "children": [{"id": "co-rhab-b2-c1-l1", "name": "Home tasks completed on time", "description": "Share of home tasks and measurements in remote trajectories completed within the planned window.", "unit": "%", "currentValue": "50", "targetValue": "80", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/co-rhab-b2-c1-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-co-rhab-b2-c1-l1.png", "children": []}, {"id": "co-rhab-b2-c1-l2", "name": "Remote sessions held as scheduled", "description": "Share of scheduled video sessions in remote trajectories that took place at the planned time without rescheduling or no-show.", "unit": "%", "currentValue": "72", "targetValue": "92", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/co-rhab-b2-c1-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-co-rhab-b2-c1-l2.png", "children": []}]}, {"id": "co-rhab-b2-c2", "name": "Unplanned contacts per trajectory", "description": "Average number of unplanned phone calls, extra visits and readmission-related contacts per remote trajectory, the outcome remote monitoring is meant to reduce.", "unit": "contacts per trajectory", "currentValue": "2.4", "targetValue": "1.2", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/co-rhab-b2-c2", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-co-rhab-b2-c2.png", "children": [{"id": "co-rhab-b2-c2-l1", "name": "Alerts handled within two working days", "description": "Share of alerts on missed measurements or threshold breaches assigned to a discipline and acted on within two working days.", "unit": "%", "currentValue": "45", "targetValue": "90", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/co-rhab-b2-c2-l1", "
