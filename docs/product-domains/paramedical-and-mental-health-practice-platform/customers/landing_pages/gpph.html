ed back from the HIS or AIS into the same thread", "Open self-service booking, rescheduling and cancellation in the practice agenda as the default configuration for every connected practice and therapist", "Ship activation flows with DigiD, practice branding and first-task guidance that lift invitation-to-activation above half"]}, "year3": {"focus": "Put the patient in the middle of the care network: Quli and Uw Zorg Online as MedMij-connected personal health environments across GP, pharmacy, paramedical and GGZ care, granular sharing with family and carers, home programmes from Embloom and exercise partners in the same app, and outcomes shown back to the patient over time.", "productTheme": "My data and my treatment in one place", "customerKPI": {"northStar": "Care tasks completed digitally", "supporting": ["Health data retrieved into the personal health environment", "Home programme completion rate"]}, "businessKPI": {"northStar": "Monthly active patient users across Uw Zorg Online and Quli", "revenueStreams": ["Institution and practice contracts for Quli and the client portal as part of the integrated GGZ and paramedical propositions", "MedMij PGO programme positions and public funding for personal health environments", "E-health content and blended-care programmes paid by providers and used by patients"], "supporting": ["Digital transactions per active user per month", "Monthly active share of registered users"]}, "milestones": ["Connect paramedical and GGZ dossiers to MedMij disclosure so a patient retrieves physiotherapy and GGZ data next to GP and hospital data", "Ship family, carer and representative sharing with per-category and per-period control and an access log the patient can read", "Bring Embloom modules, Emogy, exercise programmes and questionnaires into one home programme view with progress shown against treatment goals"]}, "year5": {"focus": "Make the patient environment the personal care companion for first-line and mental health care: an assistant that answers routine questions before they reach the practice, prevention and remote monitoring programmes reimbursed by insurers, and a consumer-scale front door that positions HCI as the answer to labour shortages in primary and mental health care in the Benelux and DACH.", "productTheme": "The personal care companion", "customerKPI": {"northStar": "Care tasks completed digitally", "supporting": ["E-consults resolved without a follow-up visit", "Users with an active family or carer share"]}, "businessKPI": {"northStar": "Monthly active patient users across Uw Zorg Online and Quli", "revenueStreams": ["Provider contracts for AI-assisted triage and self-service modules", "Prevention and remote monitoring programmes reimbursed under insurer contracts", "Patient environment connections for hospitals and care networks beyond primary care"], "supporting": ["Provider retention driven by patient engagement", "Premium module attach rate"]}, "milestones": ["Deliver an in-app assistant that resolves routine questions with practice-approved answers and hands the rest to the e-consult with context", "Launch remote monitoring and prevention programmes with self-measurements, thresholds and provider follow-up that insurers reimburse", "Extend the front door to hospitals and care networks so a patient keeps one app when care moves between first-line, mental health and hospital settings"]}}}, "domain": "Patients and Primary Care Network"}, {"id": "gpph", "name": "GP Practice and Pharmacy Manager", "description": "Practice manager of a general practice with two to six GPs and several thousand registered patients, or the pharmacist-manager of a community pharmacy, whose information system (Pharmapartners, CGM, Sanday, HealthConnected, Bricks or Vertimart) connects to Uw Zorg Online as the practice's digital front door. Responsible for reachability, the assistants' workload, the practice website and the practice's legal duties around online access, Wegiz and MedMij, without an IT department or a web agency. Judged by the GPs or pharmacists on fewer telephone interruptions, satisfied patients and a clean audit, and by HCI on activation and continued connection.", "icon": "gpph.png", "careAbout": ["Fewer telephone calls in the morning queue, because every appointment, e-consult and repeat prescription handled in the app is one call the assistants do not take", "A connection that lands digital requests in the practice's own HIS or AIS work list, so that staff never work on a second screen or register anything twice", "MedMij, online access and Wegiz obligations met through HCI's certification and DigiD login, with evidence ready for an insurer audit or an accreditation visit", "Patients, including older and chronic patients, who actually activate the app and keep using it, so that the digital route becomes the normal one", "A practice website that shows correct hours, team and services and leads straight into booking, e-consult and triage, changed in minutes without a developer", "Patient data that never leaves the certified environment, with NEN 7510 and ISO 27001 status HCI maintains and access logs patients can see"], "winsThem": ["Uw Zorg Online connected to the practice information system through supported connectors for Sanday, HealthConnected, Pharmapartners, CGM, Bricks and Vertimart, with appointments booked straight into the practice agenda", "E-consults, repeat prescriptions, record access and the \"Moet ik naar de dokter?\" triage in one app used by more than four million patients, so that patients already know it from their neighbouring practice", "MedMij-certified data exchange and DigiD authentication carried by HCI, so that online access and Wegiz compliance are a matter of settings rather than a project", "Practice websites from the Praktijkinfo portfolio with booking, e-consult and triage entry points embedded and content managed by the practice itself", "A reachability dashboard per practice with phone contacts, digital requests, activations and response times, so that the manager can show the GPs and the patient council what the digital front door delivers"], "theirFear": ["A digital request that gets lost between the app and the HIS or AIS, so that a patient's prescription or appointment is missed and the practice is blamed", "Patients who activate the app once and go back to calling, so that the assistants handle two channels instead of one", "An access or data-exchange rule that the practice turns out not to meet, discovered by a patient complaint, an auditor or the regulator rather than by the practice itself"], "jobsToBeDone": [{"id": "jtbd-gpph-1", "name": "Give patients a digital front door that cuts phone traffic", "whatItIs": "Open the practice or pharmacy to patients through Uw Zorg Online so that e-consults, appointments in the practice agenda, repeat prescriptions, record access and the \"Moet ik naar de dokter?\" triage arrive digitally instead of by telephone. The manager has to connect the app to the practice's own information system (Pharmapartners, CGM, Sanday, HealthConnected, Bricks or Vertimart), decide which appointment types, e-consult subjects and prescription flows are open to patients, get patients to activate their account with DigiD, and organise the assistants so that digital requests are handled inside the normal working day rather than on top of it.", "outcome": "Patients arrange most routine matters themselves in the app that is connected to the practice agenda and the HIS or AIS, the assistants spend their mornings on triage and care instead of on the telephone queue, and the practice can see in its own figures that phone contacts per 1,000 patients keep falling while patient satisfaction with reachability rises.", "steps": [{"step": "Connect Uw Zorg Online to the practice information system", "description": "Check that the practice's HIS or the pharmacy's AIS (Pharmapartners, CGM, Sanday, HealthConnected, Bricks or Vertimart) is on the list of supported connections, sign the agreement and the processing agreement with HCI, arrange the connector activation with the HIS or AIS vendor, and verify with a test patient that the agenda, medication overview and record summary appear in the app exactly as they stand in the practice system.", "streamsNeeded": [{"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "howItSupports": "Provides the HIS and AIS connectors that mirror agenda, medication and record data between the practice system and Uw Zorg Online."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Sets up the practice's presence in the app so that patients see the right services once the connection is live."}, {"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Covers the processing agreement, NEN 7510 controls and audit logging that the practice needs before patient data flows through the app."}]}, {"step": "Configure which services are open to patients", "description": "Decide with the GPs or pharmacists which appointment types and slots may be booked online, which e-consult subjects are allowed and who answers them, whether repeat prescriptions go straight to the pharmacy of choice, and whether patients can read their record summary and correspondence; set the practice's answering rules and response promise so that the app tells patients what to expect.", "streamsNeeded": [{"id": "schedule-appointments-and-online-booking", "name": "Schedule Appointments and Online Booking", "howItSupports": "Exposes the agenda slots and appointment types that the practice releases for patient self-service."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Holds the practice's e-consult, prescription and record-access settings and the response promise shown to patients."}]}, {"step": "Get patients to activate the app", "description": "Invite patients through the practice website, the waiting-room screen, the telephone menu and the assistant's standard answer, help older patients through DigiD activation, and prioritise the frequent callers, chronic patients and parents who generate most of the phone traffic; watch weekly how many invitations turn into activated accounts and first digital requests.", "streamsNeeded": [{"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Runs invitations, DigiD activation and the first-use nudges that turn an invitation into an active account."}, {"id": "publish-and-run-a-practice-website", "name": "Publish and Run a Practice Website", "howItSupports": "Places the activation call to action, app links and triage entry point on the practice website where patients look first."}]}, {"step": "Handle digital requests inside the daily workflow", "description": "Organise the assistants' morning so that e-consults, booking exceptions, prescription requests and triage outcomes appear in the HIS or AIS work list and are answered within the promised time, route clinical questions to the GP, and agree what still requires a telephone call; make sure a request never gets lost between the app and the practice system.", "streamsNeeded": [{"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Delivers e-consults, prescription requests and triage outcomes with their status so that the practice answers them in one queue."}, {"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "howItSupports": "Writes answers, bookings and prescriptions back into the HIS or AIS so that nothing is registered twice."}]}, {"step": "Measure phone traffic relief and adjust", "description": "Compare phone contacts per 1,000 patients, e-consult volume, online bookings and digital repeat prescriptions month by month, look at which patient groups still call, review complaints about response times, and adjust opening of slots, e-consult subjects and the practice's communication until the assistants feel the relief.", "streamsNeeded": [{"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Shows activation, digital request volumes and response times per practice next to the phone statistics."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Provides the usage figures per service that explain which digital routes patients actually use."}]}]}, {"id": "jtbd-gpph-2", "name": "Meet MedMij and Wegiz obligations without extra work", "whatItIs": "Fulfil the practice's or pharmacy's legal duties to give patients electronic access to their data and to exchange data digitally: online access to the record and medication overview, the Wegiz obligation to exchange data electronically (in force since April 2023), and the MedMij standards under which patients retrieve their data into a personal health environment such as Quli. The manager wants HCI to carry the certification, consent handling, DigiD authentication and standard conformance, so that the practice only has to switch on the right settings and can show auditors and the patient federation that it complies.", "outcome": "The practice complies with online access, Wegiz and MedMij through the same app and connection it already uses, patients can retrieve their data into any MedMij-labelled PGO without the practice answering paper requests, and the manager has the evidence for the accountant, the insurer's quality conditions and a NEN 7510 or AVG question without building anything themselves.", "steps": [{"step": "Understand what the practice must offer and by when", "description": "Translate the obligations for online access, Wegiz data exchange and MedMij into a short list of what patients must be able to do, which data sets are involved (record summary, medication overview, lab results, correspondence) and which deadlines apply to GP practices and pharmacies, and check what the HIS or AIS vendor and HCI already cover.", "streamsNeeded": [{"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Maintains the Wegiz and MedMij conformance status per connection and translates regulation into concrete settings and evidence."}, {"id": "manage-personal-health-data-and-sharing", "name": "Manage Personal Health Data and Sharing", "howItSupports": "Defines the MedMij data sets patients can retrieve so that the practice knows what will become visible."}]}, {"step": "Switch on MedMij retrieval through the certified connection", "description": "Rely on HCI's MedMij-certified role as the practice's exchange party: activate the data sets the practice offers, confirm that the connector delivers them from the HIS or AIS in the required standards, and test with a Quli or another MedMij PGO that a patient can retrieve their record summary and medication overview.", "streamsNeeded": [{"id": "manage-personal-health-data-and-sharing", "name": "Manage Personal Health Data and Sharing", "howItSupports": "Provides the MedMij-certified retrieval path and the PGO test flow for the practice's data sets."}, {"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "howItSupports": "Delivers the practice's HIS or AIS data through the connector in the standards MedMij requires."}]}, {"step": "Handle consent, authentication and identity questions", "description": "Make sure patients log in with DigiD, that parents and carers act only within the rules for children and representatives, that patients can see who accessed their data, and that objections or corrections are handled by the practice; write the practice's own short policy on top of HCI's standard texts.", "streamsNeeded": [{"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Provides DigiD authentication, consent records, audit logs and representative rules that the practice can rely on."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Shows patients their access log and consent settings in the same app they use for care."}]}, {"step": "Answer patient PGO and data requests without paper", "description": "Route questions about downloading data, sharing with family or an informal carer and combining GP, pharmacy and hospital data to the app and Quli instead of printing or mailing, and use the network care functions so that a patient's informal carer can act for them with the patient's permission.", "streamsNeeded": [{"id": "manage-personal-health-data-and-sharing", "name": "Manage Personal Health Data and Sharing", "howItSupports": "Lets patients retrieve, combine and share their data with family and carers so that the practice no longer handles paper copies."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Answers the practical questions about downloading and sharing inside the app's help and messaging."}]}, {"step": "Keep the evidence for audits and quality conditions", "description": "Collect the conformance statements, the processing agreement, the NEN 7510 and ISO 27001 certificates of HCI, the access logs and the yearly check of settings in one place, so that an insurer's quality audit, an Autoriteit Persoonsgegevens question or the practice accreditation can be answered in an afternoon.", "streamsNeeded": [{"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Publishes certificates, conformance statements and audit log exports that the practice files as evidence."}, {"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Reports MedMij retrievals, online access usage and open data requests per practice for the yearly review."}]}]}, {"id": "jtbd-gpph-3", "name": "Keep the practice findable and up to date online", "whatItIs": "Run a practice or pharmacy website from the Praktijkinfo portfolio that patients find when they search for the practice, that shows correct opening hours, team, services, holiday cover and news, and that leads directly into the digital front door: online booking, e-consult, repeat prescriptions and the triage tool. The manager has no web agency and wants to change content in minutes, know that the site is accessible and secure, and see that it actually brings patients into the app.", "outcome": "Patients find correct information and a working entry point into the app on the practice website, the manager keeps hours, team and news current without a developer, the site meets accessibility and security expectations, and the website is measurably the largest route into online booking, e-consults and app activations.", "steps": [{"step": "Set up the website from a practice template", "description": "Choose a template suited to a GP practice or pharmacy, load the practice details, team, locations, opening hours and services, connect the domain, and check the layout on a phone, since that is where most patients will look before they call.", "streamsNeeded": [{"id": "publish-and-run-a-practice-website", "name": "Publish and Run a Practice Website", "howItSupports": "Provides the templates, content management and hosting for the practice website without a developer."}]}, {"step": "Embed the digital front door on every page", "description": "Place online booking, e-consult, repeat prescription and triage entry points on the pages where patients arrive, link the Uw Zorg Online activation flow and app download, and make the emergency and out-of-hours instructions impossible to miss.", "streamsNeeded": [{"id": "publish-and-run-a-practice-website", "name": "Publish and Run a Practice Website", "howItSupports": "Embeds booking, e-consult and triage entry points and the app links into the site's pages."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Receives the patients who click through from the website into activation, booking and e-consult."}, {"id": "schedule-appointments-and-online-booking", "name": "Schedule Appointments and Online Booking", "howItSupports": "Serves the bookable slots that the website's booking entry point shows to patients."}]}, {"step": "Keep content current with minimal effort", "description": "Update holiday cover, a new colleague, vaccination campaigns, changed opening hours and practice news in a few minutes, use the shared content items that HCI provides for national campaigns, and delegate small updates to an assistant with limited rights.", "streamsNeeded": [{"id": "publish-and-run-a-practice-website", "name": "Publish and Run a Practice Website", "howItSupports": "Offers simple content editing, shared campaign content and role-based rights for assistants."}]}, {"step": "Meet accessibility, privacy and security expectations", "description": "Rely on the hosting, TLS, cookie handling, accessibility features and privacy statement templates HCI maintains, review the site once a year against the accessibility guidelines the sector expects, and make sure no patient data is ever entered outside the secure app.", "streamsNeeded": [{"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Maintains secure hosting, privacy statement templates and the controls that keep patient data out of the public website."}, {"id": "publish-and-run-a-practice-website", "name": "Publish and Run a Practice Website", "howItSupports": "Provides the accessibility features and yearly check that the practice reviews."}]}, {"step": "Track whether the site brings patients into the app", "description": "Look at visits, the most-used pages and the click-through into booking, e-consult and activation, compare this with phone volumes, and adjust page order, wording and the position of the entry points to make the digital route the obvious one.", "streamsNeeded": [{"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Shows website visits and click-through into the app next to phone and request volumes."}, {"id": "publish-and-run-a-practice-website", "name": "Publish and Run a Practice Website", "howItSupports": "Provides the page-level statistics and the ability to move or reword entry points."}]}]}], "customerJourneyStories": [{"id": "journey-gpph-1", "name": "A GP practice opens its digital front door", "linkedJobIds": ["jtbd-gpph-1", "jtbd-gpph-3"], "summary": "The practice manager of a three-GP practice with 7,000 patients, whose assistants are on the phone all morning, connects Uw Zorg Online to the practice's HIS, opens online booking and e-consults, replaces the outdated website with a Praktijkinfo site, and within a year sees phone contacts fall and patients using the app as the normal way to reach the practice.", "stages": [{"stage": "Trigger", "narrative": "The practice's telephone queue in the morning has become a source of complaints, two assistants have left, the patient council asks why other practices let patients book online, and the GPs want fewer interruptions for repeat prescriptions and simple questions. The manager has to give patients a digital route that the assistants can actually handle."}, {"stage": "Discovery", "narrative": "She sees a neighbouring practice on the same HIS handling e-consults in Uw Zorg Online, hears from the HIS vendor that the connection is standard, reads that more than four million patients already use the app, and receives a call from HCI after the regional GP organisation lists the app as the recommended patient environment."}, {"stage": "Evaluation", "narrative": "She compares Uw Zorg Online with the HIS vendor's own portal and a stand-alone booking tool: the deciding points are that appointments land directly in the practice agenda, repeat prescriptions go to the pharmacy, the connection is certified for NEN 7510 and MedMij, the assistants work from the HIS work list rather than a second screen, and the practice website can be replaced in the same move. The GPs approve after a demo with their own agenda."}, {"stage": "Trial", "narrative": "The connection goes live with online booking for two appointment types and e-consults for administrative questions only. The manager invites the frequent callers and parents first, the assistants answer e-consults before the phone lines open, and in the first month a few hundred patients activate their account and the morning queue is visibly shorter on two days a week."}, {"stage": "Engagement", "narrative": "Within six months online booking covers all routine appointment types, repeat prescriptions arrive digitally, the triage tool answers the question whether a visit is needed, the new website leads every visitor into the app, and the assistants plan their morning around the digital queue; the practice's dashboard shows phone contacts per 1,000 patients falling month after month."}, {"stage": "Retention", "narrative": "The manager stays because the app is now the way patients expect to reach the practice, the HIS connection keeps working through updates, the yearly MedMij and online-access checks are done for her, and she can show the GPs and the patient council the reachability figures; she recommends the app to the practices in her regional group and asks HCI to open video consultations next."}]}, {"id": "journey-gpph-2", "name": "A pharmacy moves repeat prescriptions and MedMij access to the app", "linkedJobIds": ["jtbd-gpph-1", "jtbd-gpph-2"], "summary": "The pharmacist-manager of a community pharmacy on Pharmapartners, facing the online-access and MedMij obligations and a counter that is constantly interrupted by repeat prescription calls, connects the pharmacy to Uw Zorg Online, moves repeat requests and the medication overview into the app, and keeps the pharmacy compliant without hiring anyone.", "stages": [{"stage": "Trigger", "narrative": "The pharmacy receives its second letter about giving patients online access to their medication data, the GP practices in the health centre have started sending patients to an app the pharmacy is not on, and the counter staff lose an hour a day to repeat prescription calls that could be digital."}, {"stage": "Discovery", "narrative": "The pharmacist learns from the local GP practices that their patients already use Uw Zorg Online, sees in the AIS vendor's newsletter that the connection to the app is supported, and finds at the regional pharmacists' meeting that colleagues use it for repeat prescriptions and the medication overview."}, {"stage": "Evaluation", "narrative": "He checks that the app supports the AIS, that HCI carries the MedMij certification and the DigiD login, that the processing agreement and NEN 7510 status are in order, and that a patient's repeat request lands in the pharmacy's own work list; the alternative, a separate pharmacy app, would mean a second login for patients who already use the GP's app, so the shared front door wins."}, {"stage": "Trial", "narrative": "The pharmacy connects to the app, starts with repeat prescriptions and the medication overview, and asks the GP practices to point patients to the pharmacy in the same app. In the first weeks the repeat requests arrive in the AIS work list, the counter staff notice fewer calls, and a first patient retrieves their medication data into a Quli PGO without the pharmacist doing anything."}, {"stage": "Engagement", "narrative": "Repeat prescriptions, pick-up notifications and medication questions run through the app, the pharmacist uses e-consults for medication reviews with chronic patients, MedMij retrievals happen without a request at the counter, and the yearly evidence for online access and Wegiz comes out of the same environment."}, {"stage": "Retention", "narrative": "The pharmacy keeps the connection because the digital route now handles most repeat prescriptions, the counter is no longer interrupted by calls that could have been a tap in the app, and the online-access and Wegiz evidence comes out of a connection HCI keeps certified rather than out of a project the pharmacist would have to run himself. When the group's two other pharmacies, on the same AIS, come up for renewal of their own patient apps, the pharmacist brings them onto the shared Uw Zorg Online connection so that patients of all three pharmacies see one app for both the GP and the pharmacy."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-gpph-top", "name": "Digital front door adoption rate", "description": "Share of the practice's or pharmacy's registered patients who used Uw Zorg Online at least once in the last twelve months for an appointment, e-consult, repeat prescription, record access or triage. Modeled seed value for a connected GP practice, not an official HCI figure.", "unit": "%", "currentValue": "38", "targetValue": "60", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/gpph/kpis/co-gpph-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-gpph-co-gpph-top.png"}, "branches": [{"id": "co-gpph-b1", "name": "Patient self-service uptake", "description": "Whether patients activate the app and use it to book and arrange things themselves instead of calling the practice.", "currentValue": "40", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/gpph/kpis/co-gpph-b1", "linkLabel": "Open KPI dashboard", "icon": "kpi-gpph-co-gpph-b1.png", "children": [{"id": "co-gpph-b1-c1", "name": "Appointment self-service share", "description": "Share of appointments in the practice agenda that patients booked or rescheduled themselves through the app or website.", "unit": "%", "currentValue": "22", "targetValue": "45", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/gpph/kpis/co-gpph-b1-c1", "linkLabel": "Open KPI dashboard", "icon": "kpi-gpph-co-gpph-b1-c1.png", "children": [{"id": "co-gpph-b1-c1-l1", "name": "Online bookable slots share", "description": "Share of the practice's routine appointment slots that are released for online booking.", "unit": "%", "currentValue": "35", "targetValue": "60", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/gpph/kpis/co-gpph-b1-c1-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-gpph-co-gpph-b1-c1-l1.png", "children": []}, {"id": "co-gpph-b1-c1-l2", "name": "Bookings completed without staff intervention", "description": "Share of online bookings that need no correction, call-back or manual confirmation by an assistant.", "unit": "%", "currentValue": "78", "targetValue": "95", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/gpph/kpis/co-gpph-b1-c1-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-gpph-co-gpph-b1-c1-l2.png", "children": []}]}, {"id": "co-gpph-b1-c2", "name": "Patient portal activation rate", "description": "Share of the practice's registered patients with an activated Uw Zorg Online account linked to the practice.", "unit": "%", "currentValue": "42", "targetValue": "65", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/gpph/kpis/co-gpph-b1-c2", "linkLabel": "Open KPI dashboard", "icon": "kpi-gpph-co-gpph-b1-c2.png", "children": [{"id": "co-gpph-b1-c2-l1", "name": "Invitations accepted within 30 days", northStar": "Primary care front door recurring revenue", "revenueStreams": ["Uw Zorg Online practice subscriptions", "Practice website subscriptions"], "supporting": ["Connected GP practices and pharmacies", "Cost to serve per practice"]}, "milestones": ["Ship activation kits and in-app nudges that lift invitations accepted within 30 days above half", "Open online booking and digital repeat prescriptions as the default configuration for every new connection", "Give every connected practice a reachability dashboard with phone contacts, e-consults and bookings per month"]}, "year3": {"focus": "Position the app as the MedMij-connected front door across GP, pharmacy, paramedical and GGZ care, with digital triage and AI assistants answering routine questions before they reach the assistant, and Quli as the personal health environment patients use to combine and share data.", "productTheme": "One front door across the care network", "customerKPI": {"northStar": "Digital front door adoption rate", "supporting": ["Repeat prescription digital share", "Appointment self-service share"]}, "businessKPI": {"northStar": "Primary care front door recurring revenue", "revenueStreams": ["Uw Zorg Online practice subscriptions", "Practice website subscriptions", "Premium triage and video modules"], "supporting": ["Average recurring revenue per practice", "Practice churn rate"]}, "milestones": ["Deliver MedMij retrieval and network care for every connected practice through the same connection", "Extend digital triage with AI-assisted answers and routing into e-consult, booking or self-care", "Let patients reach GP, pharmacy, therapist and GGZ institution from one account with one login"]}, "year5": {"focus": "Turn the front door into the care network platform for first-line care in the Benelux and DACH region: prevention and remote monitoring programmes reimbursed by insurers, outcome data that practices use in contract talks, and the app as the answer to labour shortages in GP practices and pharmacies.", "productTheme": "Care network platform for first-line care", "customerKPI": {"northStar": "Digital front door adoption rate", "supporting": ["E-consult share of patient contacts", "Triage self-help completion rate"]}, "businessKPI": {"northStar": "Primary care front door recurring revenue", "revenueStreams": ["Uw Zorg Online practice subscriptions", "Premium triage and video modules", "Prevention and remote monitoring programmes"], "supporting": ["Premium module attach rate", "Practice satisfaction score"]}, "milestones": ["Launch reimbursed prevention and monitoring programmes that practices enrol patients in from the app", "Offer practices benchmark data on reachability and digital care use for insurer contract negotiations", "Bring the front door to selected Belgian and Swiss primary care markets on the same platform"]}}}, "domain": "Patients and Primary Care Network"}, {"id": "intp", "name": "Integration Partner", "description": "Product manager or integration engineer at a vendor whose product must work inside HCI's EPDs and patient environments: an exercise-programme app (Physitrack, PhysioTrack, Fysio AI), a questionnaire or e-health content provider, a quality register (Qualiview, MediQuest, LDF), an accounting package (Twinfield), a payment service (Mollie), a referral or messaging network (ZorgDomein, ZorgMail), a HIS or AIS vendor (Pharmapartners, CGM, Sanday, HealthConnected) or a MedMij exchange party. Wants one certified connection that reaches more than 40,000 professionals across FysioRoadmap, SpotOnMedics, Incura, Evry, ParaNICE, CRS, Uw Zorg Online and HCI One, and a connection that stays reliable through HCI's releases and label consolidation. Judged by their own management on practices reached and support load, and by HCI on certification, availability and joint customer satisfaction.", "icon": "intp.png", "careAbout": ["One integration that reaches every HCI label and HCI One, instead of a separate project per acquired label with its own data model and release rhythm", "Sandbox tenants, documentation and certification that let their engineers prototype and go live in weeks without waiting for an HCI engineer", "Release notes, versioned interfaces and deprecation windows announced far enough ahead to plan their own releases", "Visibility per label and per practice of availability, errors and transaction volumes, so that they hear about a problem before a practice does", "Tenant links, consent and historical partner data that survive a practice's migration from a legacy label into HCI One", "A processing agreement, security review and NEN 7510 evidence that are standard for partners, so that legal and security work is done once"], "winsThem": ["A partner API and open platform with versioned interfaces across the paramedical, GGZ and patient-environment labels, certified once and switchable by practices from their own EPD settings", "Self-service partner onboarding with credentials, sandbox tenants per label and discipline-specific examples, and a certification test set that issues production access on a green report", "A partner dashboard with availability, error rates and transactions per label, alerting on agreed thresholds, and a shared incident runbook with transaction tracing", "A published release calendar and deprecation policy, plus migration-wave information so that partners test on HCI One before their practices move", "Access to an installed base of more than 40,000 professionals and 4 million patients, with joint announcements and a partner catalogue that practices browse"], "theirFear": ["An HCI release or label migration that silently breaks home-task sync, questionnaire results or invoice exports, discovered by a practice complaint to the partner's support desk", "Being deprioritised in the consolidation into HCI One, so that a partner that reached four labels yesterday reaches one tomorrow", "A security or consent finding that surfaces after go-live and forces a shutdown of the connection for practices that depend on it"], "jobsToBeDone": [{"id": "jtbd-intp-1", "name": "Integrate once and reach every HCI label", "whatItIs": "Connect an exercise app, questionnaire set, quality register, accounting package, payment service, referral network or HIS/AIS system to HCI's open platform through one partner API instead of building and maintaining a separate connection per label (FysioRoadmap, SpotOnMedics, Incura, Evry, ParaNICE, HCI CRS, Uw Zorg Online). The partner product manager or integration engineer has to get through the partner agreement and processing terms, obtain sandbox and production credentials, map their data model onto HCI's interfaces, pass certification, and make the integration visible and switchable for the practices that use their product, so that reaching HCI's 40,000+ professionals is a matter of weeks rather than a year of label-by-label projects.", "outcome": "The partner's product is live for practices on every HCI label through a single certified connection, a practice can switch it on in minutes from its own EPD settings, the first partner-initiated transactions flow within weeks of signing, and the partner's roadmap no longer contains one integration project per acquired label.", "steps": [{"step": "Agree the partnership and the data terms", "description": "Sign the partner agreement and the processing agreement that define which data the partner sends and receives (exercise programmes, questionnaire results, quality extracts, invoices, payments, referrals), on which legal basis, and under which NEN 7510 and ISO 27001 expectations; agree the commercial model (subscription, revenue share or free connection) and who supports the practice when something fails.", "streamsNeeded": [{"id": "integrate-partners-through-the-open-platform", "name": "Integrate Partners through the Open Platform", "howItSupports": "Runs partner onboarding, the agreement steps and the tiering that decides which interfaces and data sets the partner may use."}, {"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Provides the processing agreement, security questionnaire and evidence the partner must meet before health data can flow."}]}, {"step": "Get credentials and explore the sandbox", "description": "Receive sandbox credentials and test tenants that behave like a real practice on each label, read the versioned API documentation and the discipline-specific examples, and prototype the core calls (create a home task, return a questionnaire score, receive a declaration export) against realistic test data before committing engineering capacity.", "streamsNeeded": [{"id": "integrate-partners-through-the-open-platform", "name": "Integrate Partners through the Open Platform", "howItSupports": "Issues credentials, sandbox tenants and self-service documentation so that the partner can prototype without waiting for HCI engineers."}]}, {"step": "Map the partner product onto HCI's interfaces", "description": "Translate the partner's own objects onto HCI's patient, episode, appointment, measurement, invoice and referral interfaces, decide how a practice links a partner account to an HCI tenant and how patient identity and consent travel, and handle the label differences that the platform abstracts but does not always hide, such as discipline-specific pathways or GGZ settings.", "streamsNeeded": [{"id": "integrate-partners-through-the-open-platform", "name": "Integrate Partners through the Open Platform", "howItSupports": "Offers one versioned interface set across labels and the tenant-linking and consent model that the partner integrates once."}, {"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Defines where partner results, home tasks and documents land in the dossier so that therapists see them in the treatment."}, {"id": "deliver-blended-and-e-health-care", "name": "Deliver Blended and E-health Care", "howItSupports": "Describes how exercise programmes, questionnaires and interventions from partners appear in the blended programme and monitoring views."}]}, {"step": "Pass certification and security review", "description": "Run the certification test set for the chosen interfaces, prove that patient data is only requested with a valid tenant link and consent, deliver the security evidence HCI requires of partners, and fix the findings; obtain production credentials once the certification report is green.", "streamsNeeded": [{"id": "integrate-partners-through-the-open-platform", "name": "Integrate Partners through the Open Platform", "howItSupports": "Executes the certification test set and issues production credentials on a passed report."}, {"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Verifies authentication, audit logging and consent handling of the partner connection against NEN 7510 requirements."}]}, {"step": "Launch to practices across the labels", "description": "Make the integration switchable in the practice settings of every label, publish the partner page and set-up guide, plan the joint announcement with HCI's account managers and newsletters, and support the first practices that switch it on; watch how many practices activate and how many transactions arrive in the first weeks.", "streamsNeeded": [{"id": "integrate-partners-through-the-open-platform", "name": "Integrate Partners through the Open Platform", "howItSupports": "Publishes the integration in the practice-facing settings and partner catalogue and reports activations per label."}, {"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Shows practices and the partner the usage of the integration next to their other practice figures."}]}]}, {"id": "jtbd-intp-2", "name": "Keep the connection reliable through release changes", "whatItIs": "Operate the live integration for years while HCI consolidates labels into HCI One, ships releases every few weeks, replaces declaration standards (GDS801, zorgprestatiemodel changes) and migrates practices between labels, and while the partner changes its own product. The partner's engineer wants to know in advance what changes, to see the health of the connection per label, to be told before a practice complains, and to retire old interface versions on a schedule they can plan for, so that their support desk is not the first to hear that home tasks stopped syncing.", "outcome": "The integration stays available and correct through every HCI release and label migration, breaking changes arrive with enough notice and a migration window, the partner sees errors and latency per label before practices do, and neither the partner's nor HCI's support desk spends its week on connection incidents.", "steps": [{"step": "Follow the release calendar and deprecation notices", "description": "Subscribe to HCI's partner release notes, interface change log and deprecation schedule, read the impact statements for the partner's interfaces, plan the partner's own release to align with HCI's windows, and confirm in the sandbox that the next version behaves as announced.", "streamsNeeded": [{"id": "integrate-partners-through-the-open-platform", "name": "Integrate Partners through the Open Platform", "howItSupports": "Publishes release notes, versioned interfaces and deprecation windows so that the partner can plan changes instead of reacting."}]}, {"step": "Monitor connection health per label", "description": "Watch the partner dashboard for availability, error rates, latency and transaction volumes per label and per practice, set alerts on the thresholds the partner cares about, and reconcile HCI's view with the partner's own logs so that both sides see the same picture when something goes wrong.", "streamsNeeded": [{"id": "integrate-partners-through-the-open-platform", "name": "Integrate Partners through the Open Platform", "howItSupports": "Exposes the partner's availability, error and volume metrics per label and sends alerts on agreed thresholds."}, {"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Keeps the audit trail of every partner call that both sides consult when reconciling an incident."}]}, {"step": "Resolve incidents with a shared runbook", "description": "Raise or receive an incident through the agreed channel with the transaction identifiers at hand, follow the shared runbook that says who checks credentials, tenant links, consent state and data mapping, keep the affected practices informed together with HCI support, and close the incident with a cause and a fix on the right side.", "streamsNeeded": [{"id": "integrate-partners-through-the-open-platform", "name": "Integrate Partners through the Open Platform", "howItSupports": "Provides the incident channel, transaction tracing and runbook that the partner and HCI work from together."}, {"id": "onboard-migrate-and-consolidate-labels", "name": "Onboard, Migrate and Consolidate Labels", "howItSupports": "Connects the partner to HCI support and hypercare when an incident touches a practice in onboarding or migration."}]}, {"step": "Ride along with label migrations into HCI One", "description": "Learn which practices move from a legacy label to HCI One and when, verify that tenant links, historical partner data and active programmes survive the migration, test the integration on HCI One before the first wave, and be ready during hypercare for the migrated practices.", "streamsNeeded": [{"id": "onboard-migrate-and-consolidate-labels", "name": "Onboard, Migrate and Consolidate Labels", "howItSupports": "Shares migration waves and validation windows so that the partner can test and support migrated practices."}, {"id": "integrate-partners-through-the-open-platform", "name": "Integrate Partners through the Open Platform", "howItSupports": "Keeps tenant links and partner data stable when a practice moves labels behind the same interface."}]}, {"step": "Retire old versions and review the partnership", "description": "Move all practices to the current interface version within the deprecation window, remove old credentials and endpoints, and review usage, incidents and joint commercial results with HCI's partner manager each year to decide on new interfaces, discipline coverage or a deeper product integration.", "streamsNeeded": [{"id": "integrate-partners-through-the-open-platform", "name": "Integrate Partners through the Open Platform", "howItSupports": "Tracks version adoption per practice, revokes retired credentials and holds the yearly partner review data."}, {"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Provides the practice-level usage of the integration that feeds the yearly partnership review."}]}]}], "customerJourneyStories": [{"id": "journey-intp-1", "name": "An exercise app vendor replaces four label integrations with one platform connection", "linkedJobIds": ["jtbd-intp-1", "jtbd-intp-2"], "summary": "The product lead of an exercise-programme app with separate, ageing integrations to Incura, SpotOnMedics, Abakus and FysioRoadmap, each built with a different team years ago, moves to HCI's partner platform, certifies once, reaches every label including HCI One, and stops losing sprints to connection incidents.", "stages": [{"stage": "Trigger", "narrative": "Every HCI release breaks one of the four label integrations somewhere, the vendor's support desk fields the first complaints, the sales team hears that HCI One is coming and asks whether a fifth integration is needed, and the engineering lead refuses to plan another label project without a better way in."}, {"stage": "Discovery", "narrative": "The product lead learns at an HCI partner event and from the partner pages on hci-software.com that Physitrack, PhysioTrack and Fysio AI already connect through one partner API, sees a competitor listed as switchable in the HCI One practice settings, and receives an invitation from HCI's partner manager to join the programme before the physiotherapy rollout of HCI One."}, {"stage": "Evaluation", "narrative": "The vendor weighs the partner platform against keeping the four connections: the decisive points are one certification instead of four, sandbox tenants per label, a documented deprecation policy, visibility per practice, the processing agreement and NEN 7510 evidence being standard, and the promise that a practice moving to HCI One keeps its partner link. The commercial terms are compared with the cost of the current maintenance and the deal is approved by the vendor's management."}, {"stage": "Trial", "narrative": "Engineering prototypes the core calls in the sandbox within two weeks, maps the exercise programme and home-task objects onto HCI's interfaces, passes certification at the second attempt after fixing a consent finding, and goes live with twenty pilot practices on two labels while the old connections keep running in parallel."}, {"stage": "Engagement", "narrative": "Within two quarters the integration is switchable on every label, the old connections are decommissioned one by one, the partner dashboard replaces guesswork about which practices are active, releases are planned from HCI's calendar, and the first migration wave to HCI One passes without a single lost tenant link; transactions per month grow with every practice that switches the integration on."}, {"stage": "Retention", "narrative": "The vendor stays because the connection has become the cheapest channel to its Dutch installed base: four label integrations have become one, the deprecation windows have been respected through two interface versions, and the incidents of the past year were resolved from the shared runbook before the vendor's support desk heard about them. The yearly partner review turns into a plan for a deeper integration in the blended-care programme views, and the product lead agrees to test the GGZ interfaces when they open so that the same connection reaches CRS."}]}, {"id": "journey-intp-2", "name": "A quality register and accounting vendor connect through the open platform", "linkedJobIds": ["jtbd-intp-1", "jtbd-intp-2"], "summary": "An integration engineer at a quality-measurement provider that collects patient-experience questionnaires for paramedical practices, and her counterpart at an accounting package used by many of the same practices, each connect once to HCI's partner platform, replace file exports and manual uploads with certified interfaces, and keep the connection healthy through the GDS801 and HCI One changes.", "stages": [{"stage": "Trigger", "narrative": "Practices complain that questionnaire invitations and invoice exports arrive late or double after an HCI release, the register's support desk sees a spike each time a label changes its export format, and the accounting vendor is asked by its physiotherapy customers why the export from SpotOnMedics differs from the one from FysioRoadmap."}, {"stage": "Discovery", "narrative": "Both engineers discover in HCI's partner documentation and in conversations with joint customers that the partner platform exposes measurement, episode and invoice interfaces across labels, and an HCI account manager introduces them to the partner programme when a large practice group asks for an automated feed."}, {"stage": "Evaluation", "narrative": "They evaluate the effort of one certified connection against maintaining per-label exports: they check the data sets available per interface, the consent model for pseudonymised quality data, the security questionnaire, the sandbox with realistic test practices, the deprecation policy and the support arrangement, and both companies conclude that the platform route is cheaper within a year."}, {"stage": "Trial", "narrative": "The register connects the questionnaire trigger and results interfaces and runs a parallel period with file uploads for ten practices; the accounting vendor connects the invoice and payment interfaces for a practice group and reconciles a month of bookings against the old export. Both certify and receive production credentials."}, {"stage": "Engagement", "narrative": "The connections become the standard way practices link the register and the accounting package, the manual upload options are retired, the engineers follow HCI's release calendar and monitor error rates per label, and the GDS801 change and the first HCI One migrations pass with an interface version bump announced months ahead."}, {"stage": "Retention", "narrative": "Both vendors stay because their connections now reach every HCI label without per-label work, the practices treat the integration as part of their EPD, and incidents are handled from a shared runbook with transaction identifiers instead of from e-mail threads. At the yearly review the register adds discipline-specific questionnaire sets for speech therapy and dietetics to its connection, the accounting vendor extends to the GGZ labels so that CRS practices get the same automated bookings, and both ask HCI to publish the HCI One migration waves early enough to test each one in the sandbox."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-intp-top", "name": "Integration time to live", "description": "Calendar weeks from a signed partner agreement to the first partner-initiated production transactions from a live practice on the partner platform, averaged over new integrations in the last four quarters. Modeled seed value for the partner programme, not an official HCI figure.", "unit": "weeks", "currentValue": "14", "targetValue": "6", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/intp/kpis/co-intp-top", "linkLabel": "Open KPI dashboard"
