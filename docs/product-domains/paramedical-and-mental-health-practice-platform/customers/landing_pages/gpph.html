s://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/bo-ggzp-b1-c2-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-bo-ggzp-b1-c2-l1.png", "children": []}, {"id": "bo-ggzp-b1-c2-l2", "name": "SmartAI voice-to-text attach rate", "description": "Share of independent CRS practices with SmartAI voice-to-text activated for at least one practitioner.", "unit": "%", "currentValue": "20", "targetValue": "50", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/bo-ggzp-b1-c2-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-bo-ggzp-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-ggzp-b2", "name": "Retention and cost to serve", "description": "How reliably independent practices stay through regulatory change years and how much support each practice needs.", "currentValue": "68", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/bo-ggzp-b2", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-bo-ggzp-b2.png", "children": [{"id": "bo-ggzp-b2-c1", "name": "Independent practice annual churn rate", "description": "Share of independent CRS practices that cancel in the year, excluding practices that close because the practitioner retires.", "unit": "%", "currentValue": "7", "targetValue": "4", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/bo-ggzp-b2-c1", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-bo-ggzp-b2-c1.png", "children": [{"id": "bo-ggzp-b2-c1-l1", "name": "Practices referred by LVVP peers or colleagues", "description": "Share of new independent practice subscriptions that originate from a referral by an existing CRS user, an intervision group or an LVVP regional meeting.", "unit": "%", "currentValue": "40", "targetValue": "55", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/bo-ggzp-b2-c1-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-bo-ggzp-b2-c1-l1.png", "children": []}, {"id": "bo-ggzp-b2-c1-l2", "name": "Practices retained through a regulatory change year", "description": "Share of independent practices that renew in a year with a major zorgprestatiemodel change, such as the 2026 mandatory referral date and the end of the transitional benefit.", "unit": "%", "currentValue": "91", "targetValue": "97", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/bo-ggzp-b2-c1-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-bo-ggzp-b2-c1-l2.png", "children": []}]}, {"id": "bo-ggzp-b2-c2", "name": "Support tickets per practice per year", "description": "Average number of support tickets an independent practice raises with HCI per year, across registration, declarations, portal and e-health.", "unit": "tickets", "currentValue": "6", "targetValue": "3.5", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/bo-ggzp-b2-c2", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-bo-ggzp-b2-c2.png", "children": [{"id": "bo-ggzp-b2-c2-l1", "name": "Declaration-related tickets share", "description": "Share of support tickets from independent practices that concern declarations, return messages or contract configuration.", "unit": "%", "currentValue": "45", "targetValue": "25", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/bo-ggzp-b2-c2-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-bo-ggzp-b2-c2-l1.png", "children": []}, {"id": "bo-ggzp-b2-c2-l2", "name": "Self-service resolution rate via help centre", "description": "Share of questions from independent practices resolved through the help centre, release notes or in-product guidance without a ticket.", "unit": "%", "currentValue": "30", "targetValue": "55", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/bo-ggzp-b2-c2-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-bo-ggzp-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make HCI CRS the EPD in which an independent GGZ practitioner registers once and is paid, in which ROM and Embloom e-health are part of the treatment rather than a second administration, and in which clients reach the practice through a secure portal instead of the phone, so that the majority of a small practice's week is treatment and every regulatory change is absorbed by the platform before it reaches the practitioner.", "timeHorizons": {"year1": {"focus": "Absorb the 2026 zorgprestatiemodel changes without a rejection spike and cut the administration around each consult: registration rules validated at the source, referral date captured from ZorgDomein, SmartAI voice-to-text for every note, and a declaration overview that shows rejections by cause per insurer.", "productTheme": "Registered once, declared first time right", "customerKPI": {"northStar": "Direct client time share", "supporting": ["Zorgprestatiemodel rejection rate", "Administration minutes per client contact"]}, "businessKPI": {"northStar": "Annual recurring revenue from independent GGZ practices", "revenueStreams": ["HCI CRS subscriptions for independent practices, custom-quoted per number of professionals and modules", "SmartAI voice-to-text and client portal add-ons", "Embloom questionnaire and intervention subscriptions integrated in the dossier"], "supporting": ["New independent practices onboarded per year", "Quote-to-signed conversion rate"]}, "milestones": ["Ship the 2026 zorgprestatiemodel rule set with a mandatory referral-date check at registration, the system-therapist professional type and the updated NZa tariffs before the first January batch", "Make SmartAI voice-to-text standard in the session note flow with a same-day note completion target and a correction step under 60 seconds", "Deliver the per-insurer declaration overview with rejections by cause and a one-click resubmission for corrected lines"]}, "year3": {"focus": "Make measurement and blended care the default in every trajectory: baseline and end ROM triggered by the treatment plan, Embloom modules suggested from the diagnosis and goals, outcomes visible to client and practitioner, and the waiting list and client contact handled in the portal so the practice needs no second inbox.", "productTheme": "Measurement and e-health inside the treatment", "customerKPI": {"northStar": "Direct client time share", "supporting": ["ROM completion rate", "Clients active in blended care"]}, "businessKPI": {"northStar": "Annual recurring revenue from independent GGZ practices", "revenueStreams": ["CRS subscriptions with Embloom bundled for independent practices", "Client portal, waiting-list and website packages for small GGZ practices", "Outcome reporting services for insurer contracts"], "supporting": ["Average annual revenue per practice", "Embloom attach rate among independent practices"]}, "milestones": ["Trigger ROM and questionnaire invitations automatically from treatment plan milestones with reminders in the client portal", "Recommend Embloom interventions from diagnosis, zorgvraagtypering and treatment goals inside the treatment plan editor", "Combine the practice website, waiting list with expected start dates and the client portal into one intake flow for small practices"]}, "year5": {"focus": "Run the independent practice with an AI assistant on the platform: draft notes, letters and treatment plan revisions from the session, outcome benchmarks against comparable practices, and prevention and remote monitoring programmes that insurers reimburse, positioning CRS as the answer to waiting lists and administrative burden for independent GGZ.", "productTheme": "The assisted independent practice", "customerKPI": {"northStar": "Direct client time share", "supporting": ["Home task completion rate", "Practices retained through a regulatory change year"]}, "businessKPI": {"northStar": "Annual recurring revenue from independent GGZ practices", "revenueStreams": ["CRS subscriptions with AI documentation assistant for independent practices", "Blended and remote care programmes reimbursed under insurer contracts", "Outcome benchmark and quality reporting subscriptions"], "supporting": ["Independent practice annual churn rate", "Practices referred by LVVP peers or colleagues"]}, "milestones": ["Generate draft session notes, GP letters and treatment plan updates from dictation and completed modules for the practitioner to approve", "Publish outcome benchmarks per diagnosis group against comparable independent practices, built from ROM data delivered under consent", "Offer waiting-list support programmes (psycho-education and monitoring through Embloom) that start before intake and count towards the trajectory"]}}}, "domain": "Mental Health Care (GGZ)"}, {"id": "ggzi", "name": "GGZ Institution Application Manager", "description": "The functioneel beheerder or head of zorgadministratie of a regional GGZ institution or youth care organisation with 50 to 500 professionals, several locations and outpatient, day-treatment and possibly clinical settings, who owns HCI CRS as the institution's EPD together with Quli as personal health environment and Embloom for e-health. He translates the zorgprestatiemodel, the Jeugdwet and WMO contracts with municipalities and the demands of the NZa, insurers and accountants into registration rules that hundreds of professionals must follow, runs the monthly closing, keeps the integrations with ZorgDomein, ZorgMail, Bergop, Therapieland, HR and finance alive through releases, and is responsible for rolling out the client portal and e-health to every team. He reports to the board on production, contract ceilings and waiting times in a market where the M&I/Partners 2025 inventory shows the fifty largest institutions split between SDB, Nedap, PinkRoccade, Adapcare and Nexus, and where Quli is used by two of the top fifty. What he wants from HCI is an EPD that keeps registration compliant at the source, integrates with what the institution already has, and does not stall the organisation on a release or a rule change.", "icon": "ggzi.png", "careAbout": ["Registration rules enforced at the source across every team and financier, so the monthly closing is a check and not a repair", "One EPD that declares to insurers under the zorgprestatiemodel and to municipalities under the Jeugdwet and WMO with iJw and iWmo messaging, without separate tools per financier", "Integrations with ZorgDomein, ZorgMail, Bergop, Therapieland, Minddistrict, HR and finance that survive each release with documented interface versions", "A client portal and e-health that every team actually uses, with activation and usage visible per team, not a pilot that stays in one department", "Reporting on production, contract ceilings, waiting times and quality indicators that the board, controllers and financiers accept without manual reconciliation", "Evidence for NEN 7510, the accountant and material controls that is generated by the system: audit logs, consent records and role management"], "winsThem": ["HCI CRS as an all-in-one EPD built for the zorgprestatiemodel and municipal youth care contracts, with a central client portal, SmartAI voice-to-text and reporting in one system", "Native integrations with Embloom, Bergop, Therapieland, Minddistrict, ZorgDomein and ZorgMail, so the institution keeps the e-health and referral tools its professionals know", "Quli as a MedMij-labelled personal health environment with the GGZ appwijzer, secure messaging and video, and family sharing, already used by two of the fifty largest GGZ organisations in 2025", "A vendor with NEN 7510 and ISO 27001 certification, a 250-person organisation behind the product and a roadmap that names the 2026 zorgprestatiemodel changes explicitly", "An implementation team that has migrated dossiers, open trajectories and contracts from other EPDs and runs hypercare through the first monthly closing", "A custom quote per institution within one business day based on professionals, modules and integrations, so the business case can go to the board without a lengthy sales cycle"], "theirFear": ["A material control or accountant's audit that finds registrations without a valid referral date, setting or professional type across teams, leading to a repayment claim and a qualified statement", "A release that breaks the ZorgDomein, Bergop or finance interface on the first working day of the month, with hundreds of professionals unable to register and the closing delayed", "A client portal rollout that stalls after two teams, leaving the institution below what financiers and the MedMij and Wegiz obligations expect while the licence is already paid", "A security incident with client dossiers or questionnaires, given the sensitivity of GGZ and youth care data, that ends in an Autoriteit Persoonsgegevens investigation and public trust damage"], "jobsToBeDone": [{"id": "jtbd-ggzi-1", "name": "Keep registration and declarations compliant across financiers", "whatItIs": "Run the institution's registration and declaration cycle for every financier, insurers under the zorgprestatiemodel, municipalities under the Jeugdwet and WMO, and occasionally justice or subsidised care, so that the care hundreds of professionals deliver is registered correctly at the source, closed monthly, declared through Vecozo and iJw/iWmo messaging, paid, and reported against contracts and ceilings. The job includes configuring the year's contracts and rules, enforcing registration rules in the teams, running the monthly closing, submitting and correcting claims, and producing the evidence that accountants, the NZa and material controls ask for.", "outcome": "The lead time from a registered care activity to a submitted declaration is under a week, first-time acceptance across insurers and municipalities is above 98 percent, the monthly closing takes days rather than weeks, contract ceilings are monitored automatically, and the accountant and material controls find no registration gaps.", "steps": [{"step": "Configure contracts, settings, professional types and tariffs per financier for the year", "description": "Before the new year, load each insurer contract with its tariffs, ceilings and conditions, each municipal Jeugdwet and WMO contract with product codes and assignment rules, the settings and professional types the institution may register (including the system therapist added to the professional standards in 2026), and the rules for referral dates, zorgvraagtypering and duration classes.", "streamsNeeded": [{"id": "coordinate-ggz-treatment-and-medication", "name": "Coordinate GGZ Treatment and Medication", "howItSupports": "Holds the institution's settings, professional types, group and clinical registrations and municipal assignments so every team registers within the configured model."}, {"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Stores insurer and municipal contracts, tariffs, ceilings and product codes per year and applies them to every claim and iJw/iWmo message."}]}, {"step": "Enforce registration rules at the source in every team", "description": "Configure validations that stop a registration without a valid referral date, with a setting or professional type the professional is not entitled to, or with a duration that does not match the agenda, and explain to team leads why a registration is blocked, so errors are corrected by the professional on the day rather than by the administration at closing.", "streamsNeeded": [{"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Ties the treatment plan, session notes and registrations together so a registration cannot exist without the dossier evidence behind it."}, {"id": "coordinate-ggz-treatment-and-medication", "name": "Coordinate GGZ Treatment and Medication", "howItSupports": "Validates each zorgprestatiemodel registration against the configured settings, professional types and the mandatory referral date at the moment of entry."}, {"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Provides role management so entitlements to settings and professional types follow the professional's registration and authorisation."}]}, {"step": "Run the monthly closing and control checks", "description": "At month-end, run the closing checklist: open registrations older than 30 days, trajectories without a treatment plan or referral, registrations outside contract scope, and municipal assignments without a valid start message; chase the responsible teams and close the month for declaration.", "streamsNeeded": [{"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Provides the closing dashboard with open and invalid registrations per team, so the administration chases by exception."}, {"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Freezes the closed period, generates the claim set per financier and shows what will be declared before submission."}]}, {"step": "Submit claims to insurers through Vecozo and messages to municipalities", "description": "Send the zorgprestatiemodel claims per insurer through Vecozo and the iJw and iWmo declaration and assignment messages to each municipality through the standard infrastructure, and confirm receipt of every batch.", "streamsNeeded": [{"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Submits Vecozo claims and iJw/iWmo messages per financier, tracks acknowledgements and matches payments to claims."}, {"id": "coordinate-ggz-treatment-and-medication", "name": "Coordinate GGZ Treatment and Medication", "howItSupports": "Supplies the municipal assignment and product data that every Jeugdwet and WMO message must reference."}]}, {"step": "Work rejections and return messages with the teams", "description": "Route each rejected line to the team or professional that can correct it, with the reason code translated into a plain instruction, monitor correction deadlines per financier, and resubmit corrected lines within the window so revenue is not lost to expiry.", "streamsNeeded": [{"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Queues rejections with reason codes, assigns them to the responsible team, tracks the resubmission deadline and re-declares corrected lines."}, {"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Shows rejection causes per team and financier over time so structural registration errors are fixed in configuration or training."}]}, {"step": "Report to the board, controllers and financiers and prepare for controls", "description": "Produce monthly production against contract ceilings per insurer and municipality, outstanding and rejected amounts, waiting-time indicators and the registration completeness that the accountant and material controls test, and keep the audit trail that shows who registered and changed what.", "streamsNeeded": [{"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Delivers institution-wide reporting on production, ceilings, rejections and waiting times per team, location and financier."}, {"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Keeps audit logs of registrations, corrections and access so controls can be answered from the system."}]}]}, {"id": "jtbd-ggzi-2", "name": "Roll out the client portal and e-health to all teams", "whatItIs": "Take the institution from a client portal used by a few enthusiastic teams to one in which every client in treatment is invited at intake, can read their treatment plan and correspondence, message their team, complete questionnaires and work in Embloom, Therapieland or Minddistrict modules, and, through Quli, retrieve their data from other providers under MedMij and share it with family. The job covers the proposition and consent model, e-health configuration per team, training and embedding in the intake process, activating clients and their networks, and monitoring activation and usage per team so laggards are helped rather than reported.", "outcome": "Three quarters of clients in active treatment have an activated portal account, most active trajectories have an e-health module in use, e-consults are answered within two working days, questionnaire results and module progress land in the dossier automatically, and no team is below half activation a year after rollout.", "steps": [{"step": "Choose the portal proposition and the consent model", "description": "Decide with the board, the client council and the privacy officer what clients get: the CRS client portal for treatment plan, correspondence and messaging, Quli as personal health environment with MedMij retrieval and family sharing, which data is disclosed when, and how consent and representation for minors and family members are recorded.", "streamsNeeded": [{"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Provides the CRS client portal with configurable disclosure of treatment plan, notes, correspondence and messaging per client group."}, {"id": "manage-personal-health-data-and-sharing", "name": "Manage Personal Health Data and Sharing", "howItSupports": "Adds Quli as MedMij-labelled personal health environment with retrieval from other providers, network care and family sharing under the client's control."}, {"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Records consent, representation and disclosure rules and logs every portal access so the privacy officer can sign off the model."}]}, {"step": "Configure e-health content per team and integrate it with the dossier", "description": "Select per team the Embloom questionnaires and interventions, the Therapieland or Minddistrict programmes already in use and the ROM instruments, and connect them so that assignment happens from the dossier and results and progress write back automatically.", "streamsNeeded": [{"id": "deliver-blended-and-e-health-care", "name": "Deliver Blended and E-health Care", "howItSupports": "Configures team-specific libraries of questionnaires and interventions and assigns them from the treatment plan with monitoring of home tasks."}, {"id": "integrate-partners-through-the-open-platform", "name": "Integrate Partners through the Open Platform", "howItSupports": "Connects Therapieland, Minddistrict and other e-health partners through versioned interfaces so results land in the CRS dossier."}]}, {"step": "Train the teams and embed invitation at intake", "description": "Run team-by-team training with super users, add the portal invitation and the consent conversation to the intake checklist, give every team a script for clients who hesitate, and agree a rollout calendar with the team leads.", "streamsNeeded": [{"id": "onboard-migrate-and-consolidate-labels", "name": "Onboard, Migrate and Consolidate Labels", "howItSupports": "Provides training material, super-user programmes and a rollout plan per team with hypercare in the first weeks."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Sends the portal invitation from the intake registration and shows the team whether the client activated it."}]}, {"step": "Activate clients and their networks", "description": "Support clients in activating the portal with DigiD, retrieving their GP or hospital data into Quli through MedMij, and granting family or informal carers access to what they choose, including the client's own e-health apps from the GGZ appwijzer under one login.", "streamsNeeded": [{"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Runs activation with DigiD, notifications and first-use guidance so a client's first login ends with a completed task."}, {"id": "manage-personal-health-data-and-sharing", "name": "Manage Personal Health Data and Sharing", "howItSupports": "Handles MedMij consent and retrieval, granular sharing with family and single sign-on to e-health apps in Quli."}]}, {"step": "Monitor activation and usage per team and intervene", "description": "Track activation rate, e-consult response time, questionnaires completed and modules in use per team every month, discuss the numbers with team leads, and repeat training or adjust the configuration where a team lags.", "streamsNeeded": [{"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Reports portal activation, e-consult response times and e-health usage per team and location against the rollout targets."}, {"id": "deliver-blended-and-e-health-care", "name": "Deliver Blended and E-health Care", "howItSupports": "Shows which modules and questionnaires are used per team so content configuration can be tuned to what professionals actually assign."}]}]}, {"id": "jtbd-ggzi-3", "name": "Integrate the EPD with the institution's application landscape", "whatItIs": "Make CRS the reliable centre of an application landscape that includes referral and messaging (ZorgDomein, ZorgMail), e-health (Embloom, Bergop, Therapieland, Minddistrict), identity and HR, finance and BI, quality registers and the personal health environment, so that data enters once, flows where it is needed and every exchange is secure, versioned and auditable under NEN 7510 and Wegiz. The job includes mapping the landscape, identity and access, connecting exchanges, feeding finance and BI, managing releases across systems and keeping the compliance evidence.", "outcome": "Referrals, letters and e-health results flow into the dossier without retyping, finance and BI are fed from the EPD without manual exports, no release of CRS or a connected system causes an unplanned outage, and the audit and incident evidence required for NEN 7510 and the accountant is produced by the systems themselves.", "steps": [{"step": "Map the landscape and the exchanges the institution needs", "description": "Inventory the systems around the EPD (HR and identity, finance, BI, ZorgDomein, ZorgMail, Bergop, Therapieland, Minddistrict, Quli, quality registers), what data flows between them today, which flows are manual or by file, and which the Wegiz and MedMij programmes will require, and agree the target integration map with IT.", "streamsNeeded": [{"id": "integrate-partners-through-the-open-platform", "name": "Integrate Partners through the Open Platform", "howItSupports": "Documents the available CRS interfaces, partner connections and their versions so the target map can be built on what exists."}, {"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "howItSupports": "Describes the referral, messaging and hospital or GP exchanges that CRS supports out of the box."}]}, {"step": "Set up identity, roles and strong authentication", "description": "Connect CRS to the institution's identity provider, define roles per function (treatment, administration, management, application management), enforce UZI or two-factor authentication for professionals and DigiD for clients, and align joiner, mover and leaver processes with HR.", "streamsNeeded": [{"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Provides single sign-on, role-based access, UZI and two-factor authentication for professionals and DigiD for clients, with access logging."}, {"id": "integrate-partners-through-the-open-platform", "name": "Integrate Partners through the Open Platform", "howItSupports": "Links the identity provider and HR source to CRS accounts so joiners, movers and leavers are provisioned automatically."}]}, {"step": "Connect referral, messaging and e-health write-back", "description": "Activate ZorgDomein for incoming referrals with referral dates, ZorgMail for secure correspondence, and the e-health connections for Embloom, Bergop, Therapieland and Minddistrict so questionnaires, outcomes and module progress land in the right dossier.", "streamsNeeded": [{"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "howItSupports": "Delivers ZorgDomein referrals and ZorgMail messages into the dossier and sends letters back to the referrer."}, {"id": "deliver-blended-and-e-health-care", "name": "Deliver Blended and E-health Care", "howItSupports": "Writes questionnaire results and module progress from the e-health partners back to the CRS dossier automatically."}]}, {"step": "Feed finance, BI and quality registers from the EPD", "description": "Export declared and paid production to the finance system, expose registrations and waiting-time data to the BI environment, and deliver ROM and quality indicators to benchmarks and registers under the applicable consent, replacing manual extracts.", "streamsNeeded": [{"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Exposes production, waiting-time and contract data to the institution's BI environment and finance system through scheduled exports and interfaces."}, {"id": "measure-outcomes-with-proms-and-rom", "name": "Measure Outcomes with PROMs and ROM", "howItSupports": "Delivers ROM and outcome data to benchmarks and quality registers with the consent status attached."}, {"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Exports claims, payments and open balances per financier to the finance system for reconciliation."}]}, {"step": "Manage releases and changes across the connected systems", "description": "Review CRS release notes for interface changes, test connected flows in the acceptance environment before the monthly release, coordinate with e-health and finance vendors on their release calendars, and keep a change log so a broken exchange is traced to a change within the hour.", "streamsNeeded": [{"id": "integrate-partners-through-the-open-platform", "name": "Integrate Partners through the Open Platform", "howItSupports": "Publishes versioned interfaces, release notes and an acceptance environment for connected systems, with monitoring of each connection."}, {"id": "onboard-migrate-and-consolidate-labels", "name": "Onboard, Migrate and Consolidate Labels", "howItSupports": "Supports the application manager with release readiness checklists, configuration change tracking and hypercare after major releases."}]}, {"step": "Keep the audit and incident evidence for NEN 7510 and the accountant", "description": "Collect access logs, consent records, interface monitoring and incident reports from CRS and the connected systems into the institution's information security management system, and answer the accountant's IT general controls and the NEN 7510 audit from that evidence.", "streamsNeeded": [{"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Generates audit logs, consent records and incident evidence and supports the institution's NEN 7510 and accountant controls with exports."}, {"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Reports on access patterns and exceptions per role and team so the application manager can review and sign off periodically."}]}]}], "customerJourneyStories": [{"id": "journey-ggzi-1", "name": "A regional GGZ and youth care institution replaces its EPD through a tender", "linkedJobIds": ["jtbd-ggzi-1", "jtbd-ggzi-3"], "summary": "The application manager of a regional institution with 320 professionals, adult GGZ under the zorgprestatiemodel and youth care contracted with eleven municipalities, led the replacement of an EPD whose vendor had announced end of life for the version the institution used. This is how the institution selected HCI CRS and why it stayed after the first monthly closing.", "stages": [{"stage": "Trigger", "narrative": "The EPD vendor announces that the version in use will be retired within eighteen months and that the successor requires a full re-implementation; at the same time the accountant qualifies the registration completeness for youth care because assignment messages and registrations do not match, and the 2026 requirement for a referral date on every declaration cannot be enforced in the old tool. The board asks the application manager to run a replacement project."}, {"stage": "Discovery", "narrative": "The application manager reads the M&I/Partners inventory of EPDs in the fifty largest GGZ organisations, visits an institution that runs CRS with Quli, and sees HCI at a zorg-en-ict conference presenting the integrated GGZ proposition of CRS, Embloom and Quli. A peer in the functioneel beheer network describes how the monthly closing works in CRS and that ZorgDomein, ZorgMail and Bergop are standard integrations."}, {"stage": "Evaluation", "narrative": "In the tender the institution scores CRS against two large ECD vendors on registration rules at the source for both insurers and municipalities, iJw and iWmo messaging, integrations with the e-health and referral tools already in use, the identity and role model, NEN 7510 and ISO 27001 evidence, migration approach and total cost. The custom quote arrives within a business day, reference calls confirm the migration track record, and the information security officer signs off the security assessment."}, {"stage": "Trial", "narrative": "A three-month pilot migrates two teams, one adult outpatient and one youth care team, with their open trajectories and municipal assignments into CRS, runs registration in parallel with the old EPD for one closing, and tests the ZorgDomein and Bergop connections. The first parallel closing shows that registrations blocked at the source in CRS were exactly the ones the accountant had flagged in the old system."}, {"stage": "Engagement", "narrative": "The full migration moves 320 professionals and all open trajectories in two waves around a weekend; the first institution-wide monthly closing takes six working days instead of three weeks, Vecozo and municipal messages go out from one system, and the finance export replaces the monthly spreadsheet. The application manager runs the release calendar with HCI and the connected vendors."}, {"stage": "Retention", "narrative": "At the next accountant's audit registration completeness is unqualified, the 2026 referral-date rule is enforced from the first January registration, and the monthly closing has settled at five working days. What makes the institution stay is that the release calendar has been kept: every monthly CRS release was tested in the acceptance environment with the ZorgDomein, Bergop and finance flows, and none has delayed a closing. The board approves adding Quli and Embloom for all teams under the existing contract, and the application manager agrees with HCI to take reference calls from institutions in the tender phase in exchange for early access to the yearly zorgprestatiemodel rule set."}]}, {"id": "journey-ggzi-2", "name": "Rolling out Quli and Embloom to every team of an institution", "linkedJobIds": ["jtbd-ggzi-2", "jtbd-ggzi-3"], "summary": "A GGZ institution with 180 professionals had used CRS for years but the client portal lived in two teams and e-health meant e-mailing links to a public platform. Pressure from insurers on blended care and from the PGO programme on MedMij disclosure led the application manager to roll out Quli and Embloom institution-wide.", "stages": [{"stage": "Trigger", "narrative": "An insurer contract for the coming year rewards blended care and ROM completion, MedMij reports that about half of GGZ institutions are connected to personal health environments and the institution is not among them, and the client council asks why clients cannot read their own treatment plan. Only two of twelve teams use the portal and nobody can say how many clients are active."}, {"stage": "Discovery", "narrative": "During the annual HCI customer day the application manager sees Quli's MedMij data retrieval, the GGZ appwijzer with single login to e-health apps and the family sharing model, and Embloom's library assigned from the CRS treatment plan with write-back of results. A colleague from one of the two top-fifty institutions that already use Quli walks him through their team-by-team rollout."}, {"stage": "Evaluation", "narrative": "The institution compares extending CRS with Quli and Embloom against keeping a separate e-health platform and buying a standalone PGO connection. The privacy officer reviews the consent and representation model for minors, the client council tests Quli with five clients, the business case counts the insurer's blended-care incentive against the licence, and the fact that results write back to the dossier without a second login for professionals decides it."}, {"stage": "Trial", "narrative": "Two teams pilot for a quarter: intake includes the portal invitation and consent conversation, Embloom questionnaires replace the old e-mail links, and Quli retrieval from the GP is tested with volunteers. Activation in the pilot teams reaches sixty percent in ten weeks, and the professionals report that clients arrive with completed questionnaires."}, {"stage": "Engagement", "narrative": "The rollout proceeds team by team over eight months with super users, an intake checklist and a monthly dashboard of activation, e-consult response time and modules in use per team. Teams below target get a second training, the configuration is tuned to what professionals actually assign, and family sharing is switched on for youth and elderly teams."}, {"stage": "Retention", "narrative": "A year later three quarters of clients in treatment are active, the insurer's blended-care condition is met from the dossier data, and the institution appears as a connected care provider in the MedMij register. The institution renews CRS, Quli and Embloom as one contract because results write back to the dossier without a second login and because the per-team adoption dashboard has become the tool the team leads use themselves; the application manager's next request to HCI is digital triage at intake, so that clients on the waiting list start psycho-education before their first session."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-ggzi-top", "name": "Registration-to-declaration lead time", "description": "Median calendar days between a registered care activity (consult, group session, day of stay, youth care activity) and its submission as a declaration to the insurer through Vecozo or to the municipality through iJw/iWmo messaging. Modeled seed value for a GGZ or youth care institution with 50 to 500 professionals, not an official HCI figure.", "unit": "days", "currentValue": "21", "targetValue": "7", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzi/kpis/co-ggzi-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzi-co-ggzi-top.png"}, "branches": [{"id": "co-ggzi-b1", "name": "Compliant registration across financiers", "description": "How quickly and correctly registrations turn into accepted declarations for insurers and municipalities, driven by first-time acceptance and b kLabel": "Open KPI dashboard", "icon": "kpi-ggzi-bo-ggzi-b2-c1.png", "children": [{"id": "bo-ggzi-b2-c1-l1", "name": "Institutions retained through EPD tenders", "description": "Share of institutions that re-select CRS when they run a periodic EPD tender or market consultation.", "unit": "%", "currentValue": "85", "targetValue": "95", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzi/kpis/bo-ggzi-b2-c1-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzi-bo-ggzi-b2-c1-l1.png", "children": []}, {"id": "bo-ggzi-b2-c1-l2", "name": "Institutions acting as reference customers", "description": "Share of CRS institutions willing to take reference calls, host site visits or present at customer days.", "unit": "%", "currentValue": "25", "targetValue": "50", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzi/kpis/bo-ggzi-b2-c1-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzi-bo-ggzi-b2-c1-l2.png", "children": []}]}, {"id": "bo-ggzi-b2-c2", "name": "Implementation and support cost per institution per year", "description": "Average annual cost of implementation, release support, hypercare and support desk effort per institution, spread over the contract term.", "unit": "EUR per year", "currentValue": "28000", "targetValue": "20000", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzi/kpis/bo-ggzi-b2-c2", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzi-bo-ggzi-b2-c2.png", "children": [{"id": "bo-ggzi-b2-c2-l1", "name": "Go-live projects delivered on schedule", "description": "Share of institutional implementation and migration projects that go live within the planned month.", "unit": "%", "currentValue": "74", "targetValue": "90", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzi/kpis/bo-ggzi-b2-c2-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzi-bo-ggzi-b2-c2-l1.png", "children": []}, {"id": "bo-ggzi-b2-c2-l2", "name": "Support tickets per 100 professionals per month", "description": "Average number of support tickets raised by institutions per 100 licensed professionals per month.", "unit": "tickets", "currentValue": "9", "targetValue": "5", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzi/kpis/bo-ggzi-b2-c2-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzi-bo-ggzi-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make HCI CRS, Quli and Embloom the integrated GGZ proposition for institutions: registration compliant at the source for every financier, a monthly closing measured in days, a client portal and e-health used by every team, and an open, versioned integration surface that lets the application manager run the institution's landscape without fearing the next release.", "timeHorizons": {"year1": {"focus": "Keep every institution compliant through the 2026 zorgprestatiemodel changes and shorten the closing: referral-date and entitlement rules at the source, iJw and iWmo messaging with first-time acceptance, a closing dashboard by exception, and contract ceiling monitoring for insurers and municipalities.", "productTheme": "Compliant at the source, closed in days", "customerKPI": {"northStar": "Registration-to-declaration lead time", "supporting": ["Declaration first-time acceptance rate across financiers", "Monthly closing cycle time"]}, "businessKPI": {"northStar": "Annual recurring revenue from GGZ institutions", "revenueStreams": ["CRS EPD subscriptions per institution, quoted on professionals, modules and integrations", "Hosting, integration and support contracts", "Implementation and migration services"], "supporting": ["New institutions signed per year", "Go-live projects delivered on schedule"]}, "milestones": ["Ship the 2026 rule set for institutions with referral-date enforcement, the system-therapist professional type and updated tariffs, tested with pilot institutions before the January closing", "Deliver the closing dashboard with open registrations, invalid combinations and contract ceiling alerts per team and financier", "Publish interface versioning, release notes and an acceptance environment for every institutional integration (ZorgDomein, ZorgMail, Bergop, Therapieland, Minddistrict, finance, identity)"]}, "year3": {"focus": "Make the integrated GGZ proposition the default: CRS, Embloom and Quli sold and implemented as one, portal invitation and e-health assignment built into intake and treatment plan workflows, per-team adoption dashboards, and MedMij disclosure so every institution counts as connected in the PGO programme.", "productTheme": "One GGZ proposition with the client in the middle", "customerKPI": {"northStar": "Registration-to-declaration lead time", "supporting": ["Client portal activation rate", "E-health module usage rate"]}, "businessKPI": {"northStar": "Annual recurring revenue from GGZ institutions", "revenueStreams": ["Integrated CRS, Quli and Embloom institution contracts", "E-health content and blended-care programme subscriptions", "Adoption and training services per team"], "supporting": ["Quli and Embloom attach rate among institutions", "Average annual revenue per institution"]}, "milestones": ["Build portal invitation, consent and representation capture into the intake workflow with activation visible to the treating team", "Suggest Embloom and partner modules from the treatment plan and write results back to the dossier for every connected platform", "Deliver per-team adoption dashboards for portal activation, e-consult response time and e-health usage as a standard report"]}, "year5": {"focus": "Position CRS as the data-driven care platform for GGZ institutions: AI assistance in documentation and registration, outcome benchmarks per care pathway across institutions, digital triage and waiting-list programmes that start care before intake, and an open platform through which institutions add e-health and devices without bespoke projects.", "productTheme": "The data-driven GGZ institution", "customerKPI": {"northStar": "Registration-to-declaration lead time", "supporting": ["Registrations with complete mandatory fields at closing", "Institutions retained through EPD tenders"]}, "businessKPI": {"northStar": "Annual recurring revenue from GGZ institutions", "revenueStreams": ["CRS platform contracts with AI documentation and registration assistance", "Outcome benchmark and care pathway analytics subscriptions", "Digital triage and waiting-list programmes reimbursed by insurers"], "supporting": ["Institution net revenue retention", "Support tickets per 100 professionals per month"]}, "milestones": ["Deliver AI-assisted registration that proposes setting, professional type and duration from the agenda and the note, with the professional confirming rather than entering", "Publish outcome benchmarks per care pathway across participating institutions, built from ROM data delivered under consent", "Offer digital triage and waiting-list programmes through Quli and Embloom that start psycho-education and monitoring before intake and report to the institution's dashboards"]}}}, "domain": "Mental Health Care (GGZ)"}, {"id": "ptnt", "name": "Patient and Client", "description": "A citizen who is registered with a GP practice and a pharmacy that offer the Uw Zorg Online app, and who may at the same time be a patient of a physiotherapist and a client of a GGZ institution that uses Quli as personal health environment: a working parent arranging care for two children and an ageing mother, a man with diabetes and a knee that needs physiotherapy, or a young woman in treatment for anxiety who works through Embloom modules between sessions. She is one of the more than 4 million people who use HCI's patient environments and she pays nothing for them; the practice, pharmacy or institution pays for the connection. What she wants is to reach her care providers without waiting on hold at 8 o'clock, to book, ask, order and read at a moment that suits her, to see and combine her own data from GP, hospital and GGZ under MedMij and decide who else may see it, and to do the home part of a treatment programme in one app that her therapist can also see. Her trust rests on DigiD login, the practice's name on the screen and the certainty that a request sent through the app lands in the practice's own system.", "icon": "ptnt.png", "careAbout": ["Reaching the GP, pharmacy or therapist at a moment that suits her, without the 8 o'clock telephone queue or a day off work for a ten-minute question", "A substantive answer to an e-consult within a working day, and an honest signal when a question needs a visit instead", "Booking, moving or cancelling an appointment in the practice's real agenda from her phone, with a reminder before it happens", "Repeat prescriptions ordered in a minute and a medication overview that matches what the pharmacy hands over", "Seeing her own record, treatment plan, lab results and letters, and combining data from GP, hospital and GGZ in one personal health environment", "Deciding herself who may see what, for a partner, a parent or an informal carer, and being able to withdraw that again", "Doing the home part of a treatment programme, questionnaires, exercises and modules, in one place that her therapist reads before the next session"], "winsThem": ["One app that is offered by her own GP practice and pharmacy and connects directly to their information systems, so a request sent tonight is on the assistant's work list in the morning", "DigiD login and the practice's name on every screen, with NEN 7510 and ISO 27001 certification and a MedMij label behind it", "E-consult, appointment booking in the agenda, repeat prescriptions, medication overview, record access and the 'Moet ik naar de dokter?' triage in one place instead of a website per practice", "Quli as personal health environment with the GGZ appwijzer, one login for her e-health apps, a diary, secure messaging and video, and sharing with family under her own control", "Embloom modules, questionnaires and exercise programmes assigned by her therapist and completed from the same app, so the home work is discussed in the room", "Free for her, already used by more than 4 million people, and increasingly the app her neighbours, colleagues and the regional GP organisation mention"], "theirFear": ["A request that disappears between the app and the practice, so that a prescription is not ready or an appointment is not in the agenda when she arrives", "Medical or psychological data that ends up with an insurer, an employer or a family member she did not choose, because a sharing setting was on by default", "Being pushed to the app and losing the human contact at the desk, while the app cannot handle the one thing she actually needed", "Having to remember a different login and a different app for every practice, hospital and therapist, until she gives up and calls again"], "jobsToBeDone": [{"id": "jtbd-ptnt-1", "name": "Reach my care providers and arrange things without calling", "whatItIs": "Handle the everyday contact with the GP practice, the pharmacy and the therapist from her phone: find out whether a complaint needs the doctor at all, ask a question that does not need a visit, book, move or cancel an appointment in the practice's real agenda, order repeat medication, and settle an invoice for care the insurer does not cover, all without joining the telephone queue at 8 o'clock or standing at the counter. The job starts with the practice offering the app and ends with every routine contact completed digitally and confirmed, with the telephone reserved for what really needs it.", "outcome": "Routine questions, appointments and repeat prescriptions are handled through the app in most cases, an e-consult is answered within a working day, a booked appointment is in the practice agenda the moment she confirms it, a repeat prescription is ready at the pharmacy when the app says so, and she calls the practice only when the app or the triage tells her to.", "steps": [{"step": "Find the practice's digital front door and activate the app", "description": "Learn from the practice website, a leaflet at the counter or the assistant that the practice works with Uw Zorg Online, download the app or open the web portal, log in with DigiD, and link her GP practice and pharmacy, with the practice's name confirming that she is in the right place.", "streamsNeeded": [{"id": "publish-and-run-a-practice-website", "name": "Publish and Run a Practice Website", "howItSupports": "Shows on the practice website which digital services are offered and leads her straight into the app or portal for that practice."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Runs the invitation, download and activation flow that links her account to the practice and pharmacy that offer the app."}, {"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Authenticates her with DigiD and records consent so that the practice may disclose data and receive requests through the app."}]}, {"step": "Check whether I need the doctor at all", "description": "For a new complaint, run the 'Moet ik naar de dokter?' triage in the app, answer the questions and receive an advice: self-care with instructions, an e-consult, a regular appointment, or call now, so that she does not sit in a queue for something she can handle herself or delay something urgent.", "streamsNeeded": [{"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Offers digital triage inside the app and turns the outcome into the right next step: advice, an e-consult or a bookable slot."}, {"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "howItSupports": "Passes the triage outcome and her answers to the practice's information system so the assistant sees what she already went through."}]}, {"step": "Ask a question by e-consult and get a usable answer", "description": "Write the question in the app, attach a photo of the rash or the medication box if useful, and receive an answer from the GP, the assistant or the pharmacist in the same thread, with a notification when it arrives and a follow-up question possible without starting over.", "streamsNeeded": [{"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Provides the e-consult thread with attachments, notifications and a clear status from sent to answered."}, {"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "howItSupports": "Delivers the e-consult into the HIS or AIS work list of the practice and returns the answer to the app, so nothing lives outside the practice's own system."}]}, {"step": "Book, move or cancel an appointment in the practice agenda", "description": "Pick a consultation type, see the slots the practice actually has free for the right doctor or therapist, book one, receive a confirmation and a reminder, and move or cancel within the practice's rules when work or a child's school gets in the way.", "streamsNeeded": [{"id": "schedule-appointments-and-online-booking", "name": "Schedule Appointments and Online Booking", "howItSupports": "Exposes the real free slots of the practice or therapist agenda for the chosen consultation type and books, moves or cancels within the practice's rules."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Shows her upcoming appointments in the app with confirmations, reminders and a one-tap reschedule."}]}, {"step": "Order repeat medication and keep the medication overview right", "description": "Select the medicines from her current medication overview that are running out, send the repeat request to the GP or pharmacy, follow the status until the pharmacy reports it ready for pick-up or delivery, and check that the overview matches what she actually takes.", "streamsNeeded": [{"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Lets her request repeat prescriptions from the medication overview and follow the status until the pharmacy has it ready."}, {"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "howItSupports": "Sends the request to the pharmacy or GP information system and returns the medication overview and readiness status to the app."}]}, {"step": "Pay an invoice for care the insurer does not cover", "description": "For physiotherapy sessions beyond her supplementary insurance or a treatment she pays herself, receive the invoice in the app rather than by post, pay it with iDEAL through Mollie, and keep the paid invoices for her insurer's restitution claim.", "streamsNeeded": [{"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Creates the patient invoice with the right tariff and restitution information and reconciles the online payment with the practice's administration."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Delivers invoices and a payment link in the app and keeps paid invoices available for download."}]}]}, {"id": "jtbd-ptnt-2", "name": "See and share my health data on my own terms", "whatItIs": "Have one personal health environment, Quli or Uw Zorg Online, in which she can retrieve her data from the GP, the pharmacy, the hospital and the GGZ institution under MedMij, read her record, treatment plan, results and letters in language she understands, keep her own measurements and a diary next to it, and decide precisely who else may see what: a partner during a pregnancy, a daughter who manages an elderly mother's care, a new therapist who needs the history. The job includes understanding what a PGO is, choosing one, connecting providers, keeping the data current, sharing and unsharing, and checking who has looked.", "outcome": "Her data from at least two providers is in one personal health environment and refreshes without effort, she can read her record and treatment plan before and after a consultation, family members or carers see only what she chose to share and lose access when she says so, and she can see every access to her data.", "steps": [{"step": "Understand what a personal health environment is and choose one", "description": "Hear from the GGZ institution, the GP practice or a government campaign that she can collect her own health data in a personal health environment, check that Quli or Uw Zorg Online carries the MedMij label, and decide to use it, reassured that it is free and that she keeps control.", "streamsNeeded": [{"id": "manage-personal-health-data-and-sharing", "name": "Manage Personal Health Data and Sharing", "howItSupports": "Explains in the app what a PGO does, which providers can be connected and what the MedMij label guarantees."}, {"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Provides the MedMij conformance, DigiD login and privacy statement that make the choice trustworthy."}]}, {"step": "Log in with DigiD and retrieve data from my care providers", "description": "Log in with DigiD, select her GP practice, pharmacy, hospital and GGZ institution from the list of connected providers, give consent per provider, and watch her medication, allergies, measurements, letters and treatment information arrive in one overview.", "streamsNeeded": [{"id": "manage-personal-health-data-and-sharing", "name": "Manage Personal Health Data and Sharing", "howItSupports": "Runs the MedMij consent and retrieval per provider and merges the data into one timeline in Quli or Uw Zorg Online."}, {"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Authenticates her with DigiD at the required assurance level and logs every retrieval as evidence of her consent."}]}, {"step": "Read my record, treatment plan and correspondence", "description": "Open the record and the letters after a consultation, read the treatment plan her GGZ team agreed with her, look up a lab result or a physiotherapy report before the next visit, and ask a question about what she reads instead of guessing.", "streamsNeeded": [{"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Discloses the notes, reports, results and correspondence the practice has released for patient access, in the order in which they happened."}, {"id": "coordinate-ggz-treatment-and-medication", "name": "Coordinate GGZ Treatment and Medication", "howItSupports": "Makes the agreed treatment plan, goals and medication from the GGZ dossier readable in the client portal."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Presents record, plan and letters in the app with the option to ask a question about a specific item."}]}, {"step": "Keep my own measurements and a diary next to the record", "description": "Log blood pressure, weight, glucose, mood or sleep and keep a diary in the app, on her own or because her GP, dietitian or therapist asked for it, and let the provider see the series when she agrees, so that a consultation starts from data instead of memory.", "streamsNeeded": [{"id": "manage-personal-health-data-and-sharing", "name": "Manage Personal Health Data and Sharing", "howItSupports": "Stores self-measurements and diary entries in her PGO and shares the series with a chosen provider under her consent."}, {"id": "measure-outcomes-with-proms-and-rom", "name": "Measure Outcomes with PROMs and ROM", "howItSupports": "Turns measurements and questionnaires requested by a provider into results that land in the treatment dossier and are shown back to her over time."}]}, {"step": "Share with family, carers and other providers on my terms", "description": "Give her partner access to the pregnancy correspondence, let her daughter manage the repeat prescriptions of her elderly mother, or share the GGZ treatment history with a new therapist, choosing per person which parts and for how long, and take access away when the situation changes.", "streamsNeeded": [{"id": "manage-personal-health-data-and-sharing", "name": "Manage Personal Health Data and Sharing", "howItSupports": "Provides granular sharing with family members, informal carers and network care, per data category and per period, with revocation at any time."}, {"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Verifies representation for minors and dependants and records every share and revocation for audit."}]}, {"step": "See who looked at my data and withdraw consent", "description": "Open the access log to see which provider or person retrieved or viewed what and when, withdraw the consent for a provider she no longer visits, and delete a share she no longer wants, without calling anyone.", "streamsNeeded": [{"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Shows her the access log and executes consent withdrawal and share deletion as auditable actions."}, {"id": "manage-personal-health-data-and-sharing", "name": "Manage Personal Health Data and Sharing", "howItSupports": "Removes the provider connection or share from her PGO and stops future retrieval or viewing immediately."}]}]}, {"id": "jtbd-ptnt-3", "name": "Follow my treatment programme at home", "whatItIs": "Do the part of a treatment that happens between sessions, physiotherapy exercises after a knee operation, an Embloom module and questionnaires during GGZ treatment, a food diary for the dietitian, or remote follow-up after a hospital discharge, in one app that tells her what to do and when, that her therapist can see, and that shows her whether she is getting better. The job runs from the moment the therapist assigns the programme to the closure of the trajectory with results she keeps.", "outcome": "She knows at any moment what is expected of her this week, questionnaires are completed before the session so they are discussed rather than chased, most exercises and module sessions are done on time, contact about progress goes through the app or a video consult instead of an extra visit, and at the end she can see and keep the outcome of the trajectory.", "steps": [{"step": "Receive the programme and understand what is expected", "description": "After the session, find the programme in the app: the exercises with video, the Embloom module with its lessons, the questionnaire due before the next session, and the schedule, with a reminder settings choice that fits her week rather than the therapist's.", "streamsNeeded": [{"id": "deliver-blended-and-e-health-care", "name": "Deliver Blended and E-health Care", "howItSupports": "Publishes the assigned exercises, modules and home tasks with schedule and instructions to her app the moment the therapist assigns them."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Presents the programme as a to-do list with reminders and notifications she controls."}]}, {"step": "Complete questionnaires before the session", "description": "Fill in the PROM, ROM or intake questionnaire from the notification in the evening on the couch, in one go or in parts, and see it marked as received so that the therapist opens the result before she walks in.", "streamsNeeded": [{"id": "measure-outcomes-with-proms-and-rom", "name": "Measure Outcomes with PROMs and ROM", "howItSupports": "Delivers the questionnaire to the app, scores it and writes the result into the dossier before the session."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Reminds her at the right moment and confirms that the questionnaire has reached the practice."}]}, {"step": "Do the exercises and modules at home", "description": "Work through the exercise programme from Physitrack or the practice's own library with video and repetitions, or the Embloom lessons and exercises with the Emogy app for behavioural support, tick off what she did, note pain or mood, and see the therapist's feedback on it.", "streamsNeeded": [{"id": "deliver-blended-and-e-health-care", "name": "Deliver Blended and E-health Care", "howItSupports": "Runs exercise programmes, Embloom modules and Emogy behavioural support in the app and records completion, pain and mood per task."}]}, {"step": "Discuss progress by message or video without an extra visit", "description": "Ask the therapist a question about an exercise that hurts or a module she does not understand, send a short video of the movement, or join the planned video consultation from the app, so that a problem is solved this week rather than at the next visit.", "streamsNeeded": [{"id": "deliver-blended-and-e-health-care", "name": "Deliver Blended and E-health Care", "howItSupports": "Provides video consultation and remote-care trajectories, such as NICE Connect follow-up after discharge, from the same programme view."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Carries secure messages with attachments between her and the treating professional inside the app."}]}, {"step": "See whether I am getting better", "description": "Look at the questionnaire scores, measurements and completed tasks over the weeks in a chart she understands, compare with the goals in the treatment plan, and bring the picture to the session so that the decision to continue, scale down or stop is taken together.", "streamsNeeded": [{"id": "measure-outcomes-with-proms-and-rom", "name": "Measure Outcomes with PROMs and ROM", "howItSupports": "Shows her scores and measurements over time against the baseline and the goals in the treatment plan."}, {"id": "manage-personal-health-data-and-sharing", "name": "Manage Personal Health Data and Sharing", "howItSupports": "Keeps the measurements and diary entries in her own environment, so the picture stays hers after the trajectory ends."}]}, {"step": "Close the programme and keep the results", "description": "At the end of the trajectory complete the final measurement, read the closing report that goes to the GP, keep the exercise programme and the results in her personal health environment for the next time, and rate how the programme worked for her.", "streamsNeeded": [{"id": "measure-outcomes-with-proms-and-rom", "name": "Measure Outcomes with PROMs and ROM", "howItSupports": "Administers the end measurement and prepares the outcome summary she and the referrer receive."}, {"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "howItSupports": "Sends the closing report to the referring GP and makes the same letter readable in her app."}, {"id": "manage-personal-health-data-and-sharing", "name": "Manage Personal Health Data and Sharing", "howItSupports": "Stores the programme, results and report in her PGO so they remain available after the practice closes the dossier."}]}]}], "customerJourneyStories": [{"id": "journey-ptnt-1", "name": "A working parent moves the family's GP and pharmacy contact into Uw Zorg Online", "linkedJobIds": ["jtbd-ptnt-1", "jtbd-ptnt-2"], "summary": "A mother of two in a commuter town with a full-time job and an ageing mother in the next village spent her mornings in the GP's telephone queue and her lunch breaks at the pharmacy counter. This is how the practice's new app became the place where she arranges care for three generations, and why she keeps using it.", "stages": [{"stage": "Trigger", "narrative": "Her son needs a repeat prescription for his asthma inhaler, the GP practice's line is engaged from 8:00 to 8:40 and she misses a meeting; the same week her mother's pharmacy could not confirm whether a medication change had reached them. She has three practice websites, one hospital portal and a pile of letters, and none of them talks to the others. When the GP's assistant says 'you can do this in the app, you know', she is ready to listen."}, {"stage": "Discovery", "narrative": "The practice's website and a card at the counter point to Uw Zorg Online, the pharmacy turns out to work with the same app, a colleague shows her the e-consult thread on her phone, and she reads that more than 4 million people already use it. She notices that the app carries her own practice's name rather than a generic health brand, which is what makes her open it."}, {"stage": "Evaluation", "narrative": "Before she trusts it she checks who is behind it: DigiD login, the practice named as the sender of every message, the MedMij label, the certification statement, and whether her mother can be added as a person she represents. She compares it with the hospital's portal and with simply calling, and what convinces her is that a request goes straight into the practice's own system and that the assistant told her it lands on their work list."}, {"stage": "Trial", "narrative": "She activates the app with DigiD, links the GP practice and the pharmacy, and sends her first e-consult about the inhaler on a Sunday evening; the answer and the repeat prescription are there on Monday at 10:30, and the pharmacy notifies her when it is ready. The following week she books a check-up for her daughter in a slot the practice really has free and gets a reminder the day before."}, {"stage": "Engagement", "narrative": "Within a few months the app is the default: repeat prescriptions for three people, an e-consult with a photo instead of a visit for a rash, the triage for a child's fever at night, appointments moved from the train, and her mother's medication overview shared with her so she can see what changed. She calls the practice twice in six months, both times because the triage told her to."}, {"stage": "Retention", "narrative": "When the GP practice merges with another and switches its information system, the app keeps working and her history stays; when her mother moves to a care home the sharing can be adjusted in a minute. She recommends the app to the parents at school and tells the practice's patient council that this is the one change that made the practice reachable, which is exactly what the practice reports back to HCI."}]}, {"id": "journey-ptnt-2", "name": "A client in GGZ treatment takes Quli into her recovery", "linkedJobIds": ["jtbd-ptnt-3", "jtbd-ptnt-2"], "summary": "A 29-year-old graphic designer starts treatment for anxiety and depression at a regional GGZ institution after four months on the waiting list. This is how the institution's invitation to Quli and the Embloom modules assigned by her psychologist turned the app from another login into the place where her treatment, her data and her support network came together, and why she kept it after treatment ended.", "stages": [{"stage": "Trigger", "narrative": "During the waiting months she had no idea what to expect, could not reach anyone with questions, and kept a mood diary in her notes app that nobody would ever read. At intake the psychologist explains that questionnaires, exercises and messages will run through an app, and she wonders whether this is treatment or administration."}, {"stage": "Discovery", "narrative": "The intake includes an invitation to Quli with a short explanation and a consent conversation, the institution's letter names the GGZ appwijzer with apps the team recommends, and a friend who was treated elsewhere describes filling in questionnaires the evening before a session so that the session was about the results. She also reads that Quli is a MedMij-labelled personal health environment that stays hers, not the institution's."}, {"stage": "Evaluation", "narrative": "Before activating she checks who can see what: whether her employer or insurer could ever look, whether her partner sees only what she chooses, how she can retrieve her GP's data and whether she can leave with her data if she changes therapist. The DigiD login, the sharing screen with categories and periods, the access log and the fact that a module assigned by the psychologist writes back only to her own dossier settle it, together with the psychologist's remark that home work is discussed, not checked."}, {"stage": "Trial", "narrative": "She activates Quli, completes the baseline questionnaire the evening before the first session and finds the psychologist has read it; the first Embloom module on the anxiety cycle is assigned with a deadline she can move, and she retrieves her GP's medication overview so the psychiatrist sees what she takes. After three weeks the session starts from her diary entries rather than from 'how was your week'."}, {"stage": "Engagement", "narrative": "Over the following months the app is where the treatment lives between sessions: modules and exercises with the Emogy app, a diary shared with the team, a question answered by message within a day when a panic attack follows a module, a video session when she cannot travel, and her partner given access to the crisis plan only. The scores over time show her the dip in week eight and the climb afterwards, which is what she brings to the evaluation."}, {"stage": "Retention", "narrative": "At closure the end measurement, the closing letter to the GP and the whole programme stay in her Quli environment; she revokes the institution's access to the diary, keeps the relapse-prevention module and the crisis plan, and later shares the treatment history with a new therapist in another city in one action. She tells the institution's client council that the app was the part of treatment she could hold on to, which is the story the institution uses to roll Quli out to the remaining teams."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-ptnt-top", "name": "Care tasks completed digitally", "description": "Share of a patient's routine care tasks (questions, appointment bookings and changes, repeat prescriptions, questionnaires, record retrieval, invoice payments, home programme tasks) completed through Uw Zorg Online, Quli or the client portal rather than by telephone, at the counter or on paper, across the connected GP, pharmacy, paramedical and GGZ providers. Modeled seed value for the active patient base, not an official HCI figure.", "unit": "%", "currentValue": "38", "targetValue": "65", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ptnt/kpis/co-ptnt-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-ptnt-co-ptnt-top.png"}, "branches": [{"id": "co-ptnt-b1", "name": "Reaching care without calling", "description": "Whether the everyday contact with GP, pharmacy and therapist can be handled from the app, driven by how fast digital questions are answered and by how much of the appointment traffic patients handle themselves.", "currentValue": "45", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ptnt/kpis/co-ptnt-b1", "linkLabel": "Open KPI dashboard", "icon": "kpi-ptnt-co-ptnt-b1.png", "children": [{"id": "co-ptnt-b1-c1", "name": "E-consult response time", "description": "Median working days between a patient sending an e-consult through the app and receiving a substantive answer from the practice, pharmacy or therapist.", "unit": "workin
