tments on ParaNICE and NICE Connect", "description": "Number of hospital paramedical departments and rehabilitation centres with an active ParaNICE or NICE Connect contract at the end of the period. Modeled seed value; the NICE Software acquisition in May 2023 lifted HCI from 18,000+ to 21,000+ supported professionals, which the model spreads over roughly 110 departments of 10 to 40 therapists.", "unit": "departments", "currentValue": "110", "targetValue": "170", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/bo-rhab-b1-c1", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-bo-rhab-b1-c1.png", "children": [{"id": "bo-rhab-b1-c1-l1", "name": "New departments won per year", "description": "Hospital paramedical departments and rehabilitation centres that signed a ParaNICE or NICE Connect contract during the year.", "unit": "departments per year", "currentValue": "12", "targetValue": "25", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/bo-rhab-b1-c1-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-bo-rhab-b1-c1-l1.png", "children": []}, {"id": "bo-rhab-b1-c1-l2", "name": "Remote trajectories started per month", "description": "NICE Connect remote trajectories started across all departments in the month, the volume base for remote-care pricing.", "unit": "trajectories per month", "currentValue": "900", "targetValue": "2000", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/bo-rhab-b1-c1-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-bo-rhab-b1-c1-l2.png", "children": []}]}, {"id": "bo-rhab-b1-c2", "name": "Hospital tender win rate", "description": "Share of hospital and rehabilitation-centre selections in which ParaNICE or NICE Connect took part and was chosen.", "unit": "%", "currentValue": "30", "targetValue": "45", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/bo-rhab-b1-c2", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-bo-rhab-b1-c2.png", "children": [{"id": "bo-rhab-b1-c2-l1", "name": "HIS connector implementations within the agreed window", "description": "Share of hospital information system connector implementations that went live within the window agreed in the implementation plan.", "unit": "%", "currentValue": "65", "targetValue": "90", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/bo-rhab-b1-c2-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-bo-rhab-b1-c2-l1.png", "children": []}, {"id": "bo-rhab-b1-c2-l2", "name": "Departments adding NICE Connect to ParaNICE per year", "description": "Existing ParaNICE departments that added NICE Connect remote trajectories during the year.", "unit": "departments per year", "currentValue": "8", "targetValue": "20", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/bo-rhab-b1-c2-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-bo-rhab-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-rhab-b2", "name": "Retention and revenue per department", "description": "Whether departments renew through hospital information system changes and budget rounds and whether each department extends its scope to more disciplines, wards and remote programmes.", "currentValue": "60", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/bo-rhab-b2", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-bo-rhab-b2.png", "children": [{"id": "bo-rhab-b2-c1", "name": "Annual department churn rate", "description": "Share of hospital paramedical departments and rehabilitation centres that ended their ParaNICE or NICE Connect contract in the year.", "unit": "%", "currentValue": "4", "targetValue": "2", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/bo-rhab-b2-c1", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-bo-rhab-b2-c1.png", "children": [{"id": "bo-rhab-b2-c1-l1", "name": "Support tickets per department per month", "description": "Average number of support tickets raised per department per month, including connector incidents, a driver of both churn and service cost.", "unit": "tickets per department per month", "currentValue": "3.5", "targetValue": "1.5", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/bo-rhab-b2-c1-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-bo-rhab-b2-c1-l1.png", "children": []}, {"id": "bo-rhab-b2-c1-l2", "name": "Departments renewed with expanded scope", "description": "Share of renewals in the year in which the department added disciplines, wards, programmes or remote trajectories to its contract.", "unit": "%", "currentValue": "25", "targetValue": "45", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/bo-rhab-b2-c1-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-bo-rhab-b2-c1-l2.png", "children": []}]}, {"id": "bo-rhab-b2-c2", "name": "Average revenue per department per month", "description": "Monthly recurring revenue from ParaNICE subscriptions, connectors, NICE Connect trajectories and services divided by the number of departments under contract.", "unit": "EUR per department per month", "currentValue": "1050", "targetValue": "1300", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/bo-rhab-b2-c2", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-bo-rhab-b2-c2.png", "children": [{"id": "bo-rhab-b2-c2-l1", "name": "NICE Connect attach rate", "description": "Share of ParaNICE departments that also run NICE Connect remote trajectories.", "unit": "%", "currentValue": "35", "targetValue": "60", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/bo-rhab-b2-c2-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-bo-rhab-b2-c2-l1.png", "children": []}, {"id": "bo-rhab-b2-c2-l2", "name": "German and Swiss rehabilitation centres live", "description": "Number of rehabilitation centres outside the Netherlands live on NICE Connect: German rehabilitation centres, where NICE Connect is in use according to HCI, plus Switzerland, where HCI has staff and the expansion is modeled rather than sourced. The international extension of the remote-care proposition.", "unit": "centres", "currentValue": "8", "targetValue": "25", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/rhab/kpis/bo-rhab-b2-c2-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-rhab-bo-rhab-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make ParaNICE and NICE Connect the coordination layer for paramedical and rehabilitation care in hospitals and rehabilitation centres: one multidisciplinary trajectory fed by the hospital information system, a remote follow-up that continues the same record at home, and department reporting and outcomes that come from the registrations rather than from the coordinator's spreadsheets, in the Netherlands first and in German and Swiss rehabilitation centres next.", "timeHorizons": {"year1": {"focus": "Keep ParaNICE and NICE Connect fully supported on the HCI platform, ship the hospital information system connectors and same-day registration views that make the department report a dashboard output, and extend NICE Connect remote trajectories from the Amsterdam UMC network and the first rehabilitation centres to more programmes with alerts in the treating team's routine.", "productTheme": "One trajectory next to the HIS, follow-up at home", "customerKPI": {"northStar": "Trajectory coordination time per patient", "supporting": ["Remote follow-up completion rate", "Department report preparation time"]}, "businessKPI": {"northStar": "Annual recurring revenue from hospital and rehabilitation departments", "revenueStreams": ["ParaNICE department subscriptions quoted per number of therapists, disciplines and wards", "NICE Connect remote trajectories priced per trajectory or programme", "Hospital information system connectors and implementation services"], "supporting": ["Departments on ParaNICE and NICE Connect", "HIS connector implementations within the agreed window"]}, "milestones": ["Deliver connectors for the main hospital information systems that open trajectories from orders and send reports back, with go-lives inside the agreed window", "Ship registration completeness views and the department report from the dashboard so coordinators stop rebuilding it in spreadsheets", "Extend NICE Connect to post-operative, cardiac and paediatric programmes with alert handling and remote contact registration in the same record"]}, "year3": {"focus": "Make the multidisciplinary trajectory plan and the remote follow-up the standard for rehabilitation care on the HCI platform: consultation preparation and discharge reports drafted by AI from the record, remote trajectories designed per programme with Embloom questionnaires and Emogy environments, outcome benchmarks per programme, and Uw Zorg Online as the patient's single entry to hospital, paramedical and GP care.", "productTheme": "AI-prepared consultations and remote programmes as the norm", "customerKPI": {"northStar": "Trajectory coordination time per patient", "supporting": ["Trajectory plan shared across all disciplines", "Unplanned contacts per trajectory"]}, "businessKPI": {"northStar": "Annual recurring revenue from hospital and rehabilitation departments", "revenueStreams": ["ParaNICE and NICE Connect subscriptions with programme and remote-care tiers", "Remote monitoring programmes financed under hospital and rehabilitation contracts", "E-health content and outcome analytics through the partner platform"], "supporting": ["Annual department churn rate", "NICE Connect attach rate"]}, "milestones": ["Deliver AI-drafted consultation overviews and discharge reports from the trajectory plan for every discipline", "Bring Embloom questionnaires, Emogy environments and exercise partners into NICE Connect programmes with per-programme outcome benchmarks", "Connect ParaNICE trajectories to Uw Zorg Online so the patient sees hospital, paramedical and GP care in one app"]}, "year5": {"focus": "Position NICE Connect as the remote rehabilitation platform for the Benelux and DACH: reimbursed remote monitoring and rehabilitation programmes across hospitals and rehabilitation centres, outcome benchmarks that hospitals and insurers use in contracting, and a coordinator whose time goes to clinical decisions in a sector short of therapists.", "productTheme": "Reimbursed remote rehabilitation across Benelux and DACH", "customerKPI": {"northStar": "Trajectory coordination time per patient", "supporting": ["Remote follow-up completion rate", "Outcome measurements recorded per trajectory"]}, "businessKPI": {"northStar": "Annual recurring revenue from hospital and rehabilitation departments", "revenueStreams": ["Platform subscriptions across Dutch hospital paramedical departments and rehabilitation centres", "Reimbursed remote rehabilitation and monitoring programmes delivered through NICE Connect", "Outcome and benchmark analytics for hospitals, rehabilitation networks and insurers"], "supporting": ["Average revenue per department per month", "German and Swiss rehabilitation centres live"]}, "milestones": ["Offer outcome benchmarks per rehabilitation programme to departments and to hospital and insurer contract conversations", "Launch reimbursed remote rehabilitation programmes with insurers and hospital networks across the Netherlands and Belgium", "Scale NICE Connect in German and Swiss rehabilitation centres with local financing rules and hospital system connectors"]}}}, "domain": "Paramedical Practices"}, {"id": "ggzp", "name": "Independent GGZ Practitioner", "description": "A vrijgevestigde GZ-psychologist, psychotherapist or clinical psychologist, typically an LVVP member, who runs a practice of one to five professionals from a rented consulting room or a small group practice and treats adults in basic and specialised GGZ under contracts with several insurers, or partly without contracts. She registers every consult with its setting, professional type and duration under the zorgprestatiemodel, declares through Vecozo, administers ROM questionnaires at the start and end of every trajectory and offers e-health modules between sessions, all on HCI CRS with Embloom integrated in the dossier. With waiting times above the 14-week Treeknorm in every region in the first half of 2025, she spends evenings answering waiting-list enquiries and correcting rejected declarations, while insurers, the NZa and the LVVP quality visitation each want proof of what happened in the room. What she wants from her EPD is that registration is right the first time, that ROM and e-health live in the same dossier as her notes, and that clients can reach her without a phone call, so that more of her week is treatment.", "icon": "ggzp.png", "careAbout": ["Registering a consult once, with setting, professional and duration derived from her own agenda, and seeing it declared and paid without a correction round", "A dossier that meets the LVVP visitation and insurer material-control requirements without maintaining a second file or a spreadsheet of referral dates", "ROM questionnaires and Embloom modules that are sent, completed and read back into the dossier before the next session, so measurement is part of treatment rather than an obligation", "A waiting list she can manage honestly: referrals in one place, realistic expected start dates and a client portal that answers 'where am I on the list' without a call", "A predictable, custom-quoted price for a small practice, with no surprise charges when she adds a colleague or a module", "A vendor that absorbs regulatory change, such as the mandatory referral date on every declaration from 2026 and the end of the transitional benefit, before it hits her cash flow"], "winsThem": ["HCI CRS as one all-in-one EPD for dossier, treatment plan, agenda, zorgprestatiemodel registration, declarations and client portal, quoted per practice within one business day", "Embloom's 500+ questionnaires and 450 e-health interventions fully integrated in the dossier, so ROM and blended care do not mean a second login", "SmartAI voice-to-text that turns a spoken session summary into a note, giving back the ten minutes of typing after every consult", "ZorgDomein and ZorgMail built in, so referrals arrive with the referral date and the GP letter goes out from the dossier", "Colleagues in the LVVP network who already declare through CRS and can show her what the declaration overview looks like at the end of the month", "NEN 7510 and ISO 27001 certification and DigiD login for clients, so a one-person practice meets the same security bar as an institution"], "theirFear": ["A batch of declarations rejected by an insurer for a missing referral date or a wrong setting, discovered weeks later, with cash flow that a small practice cannot bridge", "An LVVP visitation or insurer material control that finds treatment plans, ROM results and consent scattered across tools and e-mail, with a repayment claim as the outcome", "Losing clients on the waiting list to no-shows and unanswered enquiries because intake administration takes evenings she does not have", "A client's psychological questionnaires or notes exposed through an insecure e-mail exchange or an unpatched tool, ending her registration and her practice"], "jobsToBeDone": [{"id": "jtbd-ggzp-1", "name": "Register and declare under the zorgprestatiemodel first time right", "whatItIs": "Turn every contact with a client into a correctly registered care activity under the zorgprestatiemodel and into a declaration that the insurer accepts on first submission: the right setting (outpatient quality statute section II or III), the right professional type and duration class, the diagnosis and zorgvraagtypering, the mandatory referral date that every declaration must carry from 2026, and the insurer-specific contract conditions. The job covers configuring contracts and tariffs at the start of the year, checking insurance and referral before the first consult, registering on the day of contact, submitting through Vecozo, handling return messages, invoicing clients for non-contracted care or own-risk, and monitoring the contract ceiling per insurer.", "outcome": "Every consult is registered on the day it happens with all mandatory fields, declarations go to Vecozo in the monthly batch and are accepted first time in at least 98 percent of cases, rejections are corrected within a week rather than a quarter, the practitioner knows her production against each insurer contract at any moment, and administration takes less than ten minutes per client contact.", "steps": [{"step": "Set up contracts, settings, professionals and tariffs for the year", "description": "Before January, load the contracts she signed with each insurer, the NZa maximum tariffs and any agreed percentages, the settings and professional types under which she and her colleagues may register, and the rules for non-contracted care and own-risk invoicing. Decide which insurers she declares directly to and where she uses the restitution route with client invoices.", "streamsNeeded": [{"id": "coordinate-ggz-treatment-and-medication", "name": "Coordinate GGZ Treatment and Medication", "howItSupports": "Holds the practice's settings, professional types and zorgprestatiemodel configuration so every registration starts from a valid combination for the practitioner who delivered the care."}, {"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Stores contracts, tariffs and insurer-specific conditions per year and applies them to every claim, including the 2026 tariff indexation for independent practitioners."}]}, {"step": "Capture the referral and check insurance before the first consult", "description": "Receive the GP's referral through ZorgDomein or as a letter, record the referral date and referrer, run an insurance eligibility check (COV) through Vecozo, and tell the client what their insurer covers and what own-risk applies before the intake, so that nobody is surprised by an invoice.", "streamsNeeded": [{"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "howItSupports": "Brings ZorgDomein referrals into the dossier with the referral date and referrer already filled, the field that every declaration must carry from 2026."}, {"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Runs the COV check against Vecozo and records the insurer, policy and contract status on the client's file before care starts."}]}, {"step": "Register each consult with setting, professional and duration on the day", "description": "After every session, confirm the consult from the agenda with the setting, professional type, actual duration, diagnosis and any group or multidisciplinary details, and write the note. Registration rules flag a missing referral date, a duration class that does not match the agenda or a setting the practitioner is not entitled to before the day is closed.", "streamsNeeded": [{"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Links the session note and the treatment plan to the registered consult so the dossier and the declaration tell the same story at a material control."}, {"id": "coordinate-ggz-treatment-and-medication", "name": "Coordinate GGZ Treatment and Medication", "howItSupports": "Derives the zorgprestatiemodel registration from the agenda entry and validates mandatory fields at the source instead of at month-end."}]}, {"step": "Submit the monthly batch through Vecozo and handle return messages", "description": "At month-end, review the declaration overview, send the batch to each insurer through Vecozo, and work the return messages: correct the rejected lines, resubmit within the insurer's window and keep a trace of what was corrected and why.", "streamsNeeded": [{"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Generates zorgprestatiemodel claims per insurer, submits them through Vecozo, matches return messages to claims and queues rejections with the reason code for correction."}, {"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Keeps an audit trail of every submission and correction so the practitioner can show an insurer or the NZa what was declared when."}]}, {"step": "Invoice non-contracted care and own-risk to clients and reconcile payments", "description": "For insurers without a contract, or for clients who pay themselves, generate the client invoice with the NZa tariff and the restitution information, offer online payment and match incoming payments, sending a reminder before the balance becomes a collection problem.", "streamsNeeded": [{"id": "declare-and-get-paid", "name": "Declare and Get Paid", "howItSupports": "Creates patient invoices with the right tariff and restitution text, accepts Mollie payments and reconciles them with the bank and the accounting export."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Delivers invoices and payment links to the client in the portal instead of by post or unsecured e-mail."}]}, {"step": "Watch production against each insurer contract", "description": "Once a month, look at declared and paid production per insurer against the contract ceiling and the omzetplafond, the share of rejected lines, and the amount still open, so that a ceiling is not exceeded unnoticed and a rejection pattern is fixed before the next batch.", "streamsNeeded": [{"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Shows production, rejections and outstanding amounts per insurer against the contract, with the referral-date and setting errors that drive rejections broken down by cause."}]}]}, {"id": "jtbd-ggzp-2", "name": "Treat with ROM and e-health integrated in the dossier", "whatItIs": "Run a treatment trajectory in which measurement and e-health are part of the therapy rather than a parallel administration: a baseline ROM at intake, a treatment plan agreed with the client, Embloom questionnaires and interventions assigned between sessions, session notes captured with as little typing as possible, and an end measurement with a letter back to the GP. The job spans intake, treatment planning, blended care, documentation and closure, and must satisfy the GGZ quality statute (kwaliteitsstatuut), the LVVP visitation, insurer conditions and the client's expectation that what they fill in at home is discussed in the room.", "outcome": "Every trajectory has a start and end ROM measurement in the dossier, questionnaires are completed by clients within a week of invitation in most cases, at least one e-health module is active in the majority of trajectories, session notes are finished the same day, and the practitioner spends her time interpreting results with the client rather than chasing questionnaires.", "steps": [{"step": "Run the intake with a baseline measurement", "description": "Send the intake questionnaire and the first ROM instrument (for example an OQ-45, SQ-48 or BSI) through Embloom before the first appointment, review the completed results and the referral in the dossier, and use the intake to reach a diagnosis and a zorgvraagtypering with the client.", "streamsNeeded": [{"id": "measure-outcomes-with-proms-and-rom", "name": "Measure Outcomes with PROMs and ROM", "howItSupports": "Sends the baseline ROM questionnaire from the dossier, scores it and stores the result as the reference point for the whole trajectory."}, {"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Presents referral, intake answers and baseline scores in one client record so the diagnosis is written from evidence rather than from memory."}]}, {"step": "Build the treatment plan together with the client", "description": "Draft the treatment plan with goals, chosen interventions, frequency and the planned end measurement, share it with the client in the portal, record the client's agreement and consent for e-health and data sharing, and set the evaluation moments.", "streamsNeeded": [{"id": "coordinate-ggz-treatment-and-medication", "name": "Coordinate GGZ Treatment and Medication", "howItSupports": "Provides the treatment plan template with goals, interventions, settings and evaluation moments, and records medication where a psychiatrist is involved."}, {"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Stores the agreed plan, the client's consent and every later revision as part of the dossier that the LVVP visitation reviews."}]}, {"step": "Assign Embloom modules and questionnaires as blended care", "description": "Choose from Embloom's library of 500+ questionnaires and 450 interventions the modules that fit the plan (psycho-education, a diary, exposure or cognitive exercises), assign them with a deadline, and let the client work on them from the portal or app between sessions.", "streamsNeeded": [{"id": "deliver-blended-and-e-health-care", "name": "Deliver Blended and E-health Care", "howItSupports": "Assigns Embloom interventions and questionnaires from within the dossier, tracks progress on home tasks and writes completed results back to the record."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Gives the client one secure place to open assigned modules, receive reminders and message the practitioner about a task."}]}, {"step": "Document each session with voice-to-text and review what the client did at home", "description": "Open the client's completed modules and questionnaire scores at the start of the session, discuss them, and afterwards dictate the session summary with SmartAI voice-to-text, correct it and link it to the registered consult, so the note is finished before the next client arrives.", "streamsNeeded": [{"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Turns dictation into a structured session note and links it to the treatment plan goals and the registered consult."}, {"id": "measure-outcomes-with-proms-and-rom", "name": "Measure Outcomes with PROMs and ROM", "howItSupports": "Shows questionnaire scores over time in the dossier so progress can be discussed with the client in the session."}]}, {"step": "Evaluate at the planned moments and close with an end measurement", "description": "At the evaluation moment and at closure, send the follow-up ROM, compare it with the baseline, decide with the client whether to continue, scale down or close, and send the closing letter with the outcome to the GP through ZorgMail while the trajectory is closed in the registration.", "streamsNeeded": [{"id": "measure-outcomes-with-proms-and-rom", "name": "Measure Outcomes with PROMs and ROM", "howItSupports": "Administers the end measurement, compares it with the baseline and prepares the outcome summary for the client, the GP and any benchmark delivery."}, {"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "howItSupports": "Sends the closing letter to the referring GP through ZorgMail from the dossier and records that the loop with the referrer is closed."}]}]}, {"id": "jtbd-ggzp-3", "name": "Manage intake, waiting list and client contact from one place", "whatItIs": "Handle the front of the practice, from a client finding the practice to the last message after closure, without a second inbox: publish where the practice stands on waiting time, receive referrals and enquiries in one place, triage and place people on a waiting list with an honest expected start, schedule intake and recurring sessions that clients can manage themselves, keep client contact in the portal rather than in private e-mail or WhatsApp, and keep the GP informed. With waiting times above the 14-week Treeknorm in every region, the job is as much about managing expectations as about scheduling.", "outcome": "New referrals and enquiries are answered within two working days from one overview, every client on the waiting list has a recorded expected start date and knows it, clients book, move and confirm appointments themselves in most cases, all client contact between sessions runs through the secure portal, and the practitioner spends no evenings on intake administration.", "steps": [{"step": "Keep the practice findable and honest about waiting time", "description": "Maintain a practice website with the disciplines, contracted insurers, current waiting time per treatment type and an intake request form, so that clients and GPs see before they call whether the practice is an option.", "streamsNeeded": [{"id": "publish-and-run-a-practice-website", "name": "Publish and Run a Practice Website", "howItSupports": "Provides the practice website with waiting-time and contract information, an intake request entry point and links into the client portal."}]}, {"step": "Receive referrals and enquiries in one overview", "description": "Collect ZorgDomein referrals, website intake requests and phone enquiries in one intake list with the referral date, insurer, care question and urgency, so nothing lives in a notebook or a mailbox.", "streamsNeeded": [{"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "howItSupports": "Delivers ZorgDomein referrals with referrer and referral date directly into the intake list of the practice."}, {"id": "schedule-appointments-and-online-booking", "name": "Schedule Appointments and Online Booking", "howItSupports": "Adds website and phone enquiries to the same waiting list with the information needed to triage and plan."}]}, {"step": "Triage the waiting list and give a realistic expected start", "description": "Screen each request for fit with the practice and urgency, place it on the waiting list with an expected start date computed from the practitioners' free capacity, inform the client and the GP, and refer elsewhere when the wait would be irresponsible.", "streamsNeeded": [{"id": "schedule-appointments-and-online-booking", "name": "Schedule Appointments and Online Booking", "howItSupports": "Maintains the waiting list with priorities and an expected start date derived from planned capacity, and sends the client a confirmation."}, {"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "howItSupports": "Shows waiting time per treatment type against the 14-week Treeknorm and the capacity of each practitioner, so the practice can decide on intake stops or extra hours."}]}, {"step": "Plan the intake and recurring sessions and let clients self-serve", "description": "Offer the client an intake slot from the agenda, set up a recurring series of sessions, and let the client confirm, move or cancel within the practice's rules from the portal, with reminders that reduce no-shows.", "streamsNeeded": [{"id": "schedule-appointments-and-online-booking", "name": "Schedule Appointments and Online Booking", "howItSupports": "Runs the multi-practitioner agenda with recurring series, reminders and no-show rules, and exposes bookable slots to the client portal."}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Lets the client see, confirm and reschedule appointments in the portal instead of calling the practice."}]}, {"step": "Keep client contact between sessions in the secure portal", "description": "Answer client questions, share documents and receive completed forms through the client portal with DigiD login, so nothing about a treatment passes through private e-mail or messaging apps.", "streamsNeeded": [{"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "howItSupports": "Provides secure messaging, document sharing and notifications between client and practitioner within the CRS client portal."}, {"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "howItSupports": "Enforces strong authentication, consent and logging on every client interaction, meeting NEN 7510 expectations for a small practice."}]}, {"step": "Keep the GP and the network informed", "description": "Send the intake confirmation, interim updates and the closing letter to the GP through ZorgMail from the dossier, and answer the GP's questions about a shared client without a phone chase.", "streamsNeeded": [{"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "howItSupports": "Sends secure messages and letters to the GP and other providers from the dossier and files their replies with the client."}, {"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "howItSupports": "Keeps all correspondence about the client in the record, so the treatment history is complete at visitation or transfer."}]}]}], "customerJourneyStories": [{"id": "journey-ggzp-1", "name": "A group practice moves to CRS before the 2026 declaration changes", "linkedJobIds": ["jtbd-ggzp-1", "jtbd-ggzp-3"], "summary": "Three GZ-psychologists share a practice in a provincial town, each declaring from their own copy of a basic EPD and a shared spreadsheet of referral dates. The announcement that from 2026 every zorgprestatiemodel declaration must carry a referral date, and the end of the transitional benefit, turned a nuisance into a cash-flow risk. This is how they became HCI CRS customers and why they stayed.", "stages": [{"stage": "Trigger", "narrative": "The practice's autumn declaration batch comes back with 14 percent rejections at one insurer; two of the three colleagues had entered referral dates differently and one had used a setting she was not entitled to. Reworking the batch takes two evenings, the LVVP newsletter reminds them that from 2026 the referral date is mandatory on every claim and the transitional benefit is gone, and the founding partner decides that three separate systems and a spreadsheet will not survive another year."}, {"stage": "Discovery", "narrative": "At an LVVP regional meeting a colleague shows the CRS declaration overview on her laptop: one screen with production per insurer, rejections by cause and the outstanding amount. The partner reads the CRS page on hci-software.com, notes that dossier, treatment plan, agenda, declarations and the client portal are one system with Embloom integrated, and requests a quote, which arrives the next business day priced for three professionals."}, {"stage": "Evaluation", "narrative": "The practice compares CRS with staying on the current tool plus a bookkeeper, and with a web EPD they saw at a conference. Their questions are about registration rules at the source, ZorgDomein referrals with the date pre-filled, how a colleague's entitlement to settings is enforced, whether DigiD login and NEN 7510 certification satisfy their insurer contracts, and what migration of open trajectories costs. A reference call with the LVVP colleague and the fact that HCI absorbs the 2026 rule changes in the release settle it."}, {"stage": "Trial", "narrative": "In December an HCI consultant configures the three practitioners, their settings and the insurer contracts, migrates active clients and open trajectories, and runs a parallel month: January consults are registered in CRS and checked against the old tool. The first batch through Vecozo comes back with two rejections instead of forty, both caused by an insurer that changed a contract code, and the consultant fixes the mapping the same week."}, {"stage": "Engagement", "narrative": "By spring registration happens after each session from the agenda, referrals arrive from ZorgDomein with the date filled, the month-end batch takes one evening for the whole practice instead of one evening per person, and clients confirm and move appointments from the portal. The partners open the production dashboard at their monthly meeting rather than a spreadsheet."}, {"stage": "Retention", "narrative": "At the year's LVVP visitation the visitor reviews treatment plans, ROM results and consent in one dossier and has no findings on registration. When a fourth colleague joins, the practice extends the licence with one call. The founding partner now shows the declaration overview at the regional meeting, which is how the next practice hears about CRS."}]}, {"id": "journey-ggzp-2", "name": "A psychotherapist brings ROM and blended care into one dossier", "linkedJobIds": ["jtbd-ggzp-2", "jtbd-ggzp-3"], "summary": "A psychotherapist with a solo practice in Utrecht already used CRS for registration and declarations but ran ROM in a separate questionnaire tool and sent clients links to public e-health sites. Insurer conditions on ROM delivery and her own wish to make between-session work part of therapy led her to switch on the integrated Embloom library and the client portal.", "stages": [{"stage": "Trigger", "narrative": "An insurer's contract for the coming year requires ROM completion at start and end of every trajectory and a report on outcomes; her separate questionnaire tool has scores for barely half of her clients because invitations went out by e-mail and were forgotten. At the same time clients ask for exercises between sessions and she does not want to point them to websites she cannot see into."}, {"stage": "Discovery", "narrative": "During a CRS release webinar HCI shows Embloom's questionnaires and interventions assigned from within the dossier since the July 2024 acquisition, with results written back to the client's record. A peer in her intervision group who works at an institution that uses Embloom describes how clients complete questionnaires in the portal the evening before a session."}, {"stage": "Evaluation", "narrative": "She weighs the integrated library against keeping her old questionnaire tool plus a public e-health site, and against a competitor's e-health platform that also integrates with CRS. What decides it is that assignment, reminders, scoring and the dossier are one flow, that the library covers the OQ-45, SQ-48 and the diaries she uses, that the client logs in once with DigiD, and that the add-on is quoted as a fixed amount for a solo practice."}, {"stage": "Trial", "narrative": "HCI activates Embloom and the client portal for her practice and she starts with new intakes only: the baseline questionnaire goes out from the dossier when the intake is planned, and she assigns a psycho-education module after the first session. Within a month the first clients arrive with completed questionnaires and she finds she is discussing scores in the session instead of asking whether the e-mail arrived."}, {"stage": "Engagement", "narrative": "After a quarter every trajectory starts with a baseline, most have a module running, and she dictates session notes with SmartAI voice-to-text and links them to the plan. The client portal replaces her practice e-mail address for anything about treatment, and end measurements are sent automatically when a trajectory is closed."}, {"stage": "Retention", "narrative": "The insurer's outcome report at year-end is generated from the dossier, her ROM completion rate is above the contract condition, and clients mention the modules in their evaluations. She renews CRS with the Embloom add-on without a comparison, because the alternative would mean sending questionnaires by e-mail again, adds a second questionnaire set when she starts seeing clients with trauma-related complaints, and asks HCI whether the end measurement can trigger the closing letter to the GP automatically so that closing a trajectory becomes one action."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-ggzp-top", "name": "Direct client time share", "description": "Share of the practitioner's working hours spent in direct contact with clients (intake, treatment sessions, e-consults, video consults) as opposed to registration, declarations, correspondence and waiting-list administration. Modeled seed value for an independent GGZ practice of one to five professionals, not an official HCI or LVVP figure.", "unit": "%", "currentValue": "58", "targetValue": "72", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/co-ggzp-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-co-ggzp-top.png"}, "branches": [{"id": "co-ggzp-b1", "name": "Registration and declaration without rework", "description": "How much of the practitioner's time the zorgprestatiemodel takes, driven by how many claims come back and by how long each registration and declaration step takes.", "currentValue": "64", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/co-ggzp-b1", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-co-ggzp-b1.png", "children": [{"id": "co-ggzp-b1-c1", "name": "Zorgprestatiemodel rejection rate", "description": "Share of declaration lines submitted through Vecozo that an insurer rejects on first submission, for any reason (missing referral date, invalid setting or professional type, contract or policy mismatch).", "unit": "%", "currentValue": "6.5", "targetValue": "2.0", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/co-ggzp-b1-c1", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-co-ggzp-b1-c1.png", "children": [{"id": "co-ggzp-b1-c1-l1", "name": "Declarations with a valid referral date at submission", "description": "Share of declaration lines that carry a valid referral date and referrer at the moment of submission, the field that is mandatory on every zorgprestatiemodel declaration from 2026.", "unit": "%", "currentValue": "88", "targetValue": "99", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/co-ggzp-b1-c1-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-co-ggzp-b1-c1-l1.png", "children": []}, {"id": "co-ggzp-b1-c1-l2", "name": "Consults registered on the day of contact", "description": "Share of consults whose setting, professional type, duration and diagnosis are confirmed in the registration on the same day as the session, rather than reconstructed at month-end.", "unit": "%", "currentValue": "76", "targetValue": "95", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/co-ggzp-b1-c1-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-co-ggzp-b1-c1-l2.png", "children": []}]}, {"id": "co-ggzp-b1-c2", "name": "Administration minutes per client contact", "description": "Average minutes of registration, note-taking, declaration handling and correspondence per client contact for an independent practitioner.", "unit": "minutes", "currentValue": "14", "targetValue": "8", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/co-ggzp-b1-c2", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-co-ggzp-b1-c2.png", "children": [{"id": "co-ggzp-b1-c2-l1", "name": "Notes completed with voice-to-text", "description": "Share of session notes created with SmartAI voice-to-text and accepted after a short correction, instead of typed from scratch.", "unit": "%", "currentValue": "22", "targetValue": "60", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/co-ggzp-b1-c2-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-co-ggzp-b1-c2-l1.png", "children": []}, {"id": "co-ggzp-b1-c2-l2", "name": "Declaration batches submitted without manual correction", "description": "Share of monthly declaration batches that pass the pre-submission validation and go to Vecozo without the practitioner editing a single line.", "unit": "%", "currentValue": "71", "targetValue": "92", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/co-ggzp-b1-c2-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-co-ggzp-b1-c2-l2.png", "children": []}]}]}, {"id": "co-ggzp-b2", "name": "Treatment supported by measurement and e-health", "description": "Whether ROM and e-health are part of every trajectory, driven by how many measurements are completed and how many clients actively work in blended care.", "currentValue": "55", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/co-ggzp-b2", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-co-ggzp-b2.png", "children": [{"id": "co-ggzp-b2-c1", "name": "ROM completion rate", "description": "Share of closed treatment trajectories with both a baseline and an end ROM measurement completed and stored in the dossier, the condition most insurer contracts set and the LVVP visitation checks.", "unit": "%", "currentValue": "61", "targetValue": "85", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/co-ggzp-b2-c1", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-co-ggzp-b2-c1.png", "children": [{"id": "co-ggzp-b2-c1-l1", "name": "Questionnaires completed within 7 days of invitation", "description": "Share of ROM and intake questionnaires sent from the dossier that the client completes in the portal within seven days of the invitation.", "unit": "%", "currentValue": "58", "targetValue": "80", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/co-ggzp-b2-c1-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-co-ggzp-b2-c1-l1.png", "children": []}, {"id": "co-ggzp-b2-c1-l2", "name": "ROM results opened before the next session", "description": "Share of completed ROM measurements that the practitioner opens in the dossier before or during the following session, a proxy for results being discussed with the client.", "unit": "%", "currentValue": "49", "targetValue": "80", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/co-ggzp-b2-c1-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-co-ggzp-b2-c1-l2.png", "children": []}]}, {"id": "co-ggzp-b2-c2", "name": "Clients active in blended care", "description": "Share of clients in active treatment with at least one Embloom module or diary assigned and opened in the last 30 days.", "unit": "%", "currentValue": "34", "targetValue": "60", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/co-ggzp-b2-c2", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-co-ggzp-b2-c2.png", "children": [{"id": "co-ggzp-b2-c2-l1", "name": "E-health modules assigned per trajectory", "description": "Average number of Embloom interventions, diaries or programmes assigned per treatment trajectory.", "unit": "modules", "currentValue": "0.9", "targetValue": "2.0", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/co-ggzp-b2-c2-l1", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-co-ggzp-b2-c2-l1.png", "children": []}, {"id": "co-ggzp-b2-c2-l2", "name": "Home task completion rate", "description": "Share of assigned home tasks, module sessions and diary entries that clients complete before the deadline set by the practitioner.", "unit": "%", "currentValue": "52", "targetValue": "75", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/co-ggzp-b2-c2-l2", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-co-ggzp-b2-c2-l2.png", "children": []}]}]}]}, "businessOutcomes": {"top": {"id": "bo-ggzp-top", "name": "Annual recurring revenue from independent GGZ practices", "description": "Annual recurring revenue from HCI CRS subscriptions of independent GGZ practices (one to five professionals) and their add-ons: Embloom content, SmartAI voice-to-text and the client portal. Modeled seed value consistent with 1,900 practices at about \u20ac1,700 per year, not a reported HCI figure.", "unit": "EUR million per year", "currentValue": "3.2", "targetValue": "6.0", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/bo-ggzp-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-bo-ggzp-top.png"}, "branches": [{"id": "bo-ggzp-b1", "name": "Practice base and revenue per practice", "description": "How many independent practices subscribe, how fast the base grows through quotes and referrals, and how much each practice adds beyond the base EPD subscription.", "currentValue": "60", "link": "https://dashboard.example.com/paramedical-and-mental-health-practice-platform/customers/ggzp/kpis/bo-ggzp-b1", "linkLabel": "Open KPI dashboard", "icon": "kpi-ggzp-bo-ggzp-b1.png", "children": [{"id": "bo-ggzp-b1-c1", "name": "Active CRS independent practices", "description": "Number of independent GGZ practices with an active CRS subscription at year-end. Modeled seed value; the growth target reflects the LVVP-sized market of independent practitioners in the Netherlands.", "unit": "practices", "currentValue": "1900", "targetValue": "3000",
