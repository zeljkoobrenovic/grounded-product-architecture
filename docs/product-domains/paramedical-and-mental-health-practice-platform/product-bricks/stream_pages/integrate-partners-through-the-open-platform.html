    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

}]}, {"id": "pass-certification-tests", "title": "Pass the certification tests for security, consent and data handling", "actor": "Integration Partner", "keyFacts": ["Certification checks authentication, scope use, consent enforcement, error handling, data minimisation and logging; questionnaire partners are also checked on scoring correctness against the library.", "The result is recorded with the interface version, and the partner appears in the catalogue that practices can enable."], "painPoints": ["Partners that pass functional tests but log patient data in their own systems fail the security review late."], "dependencies": [{"type": "brick", "id": "papi", "name": "Partner API and Open Platform", "description": "Certification.", "how": "Runs and records the certification tests per interface version."}, {"type": "brick", "id": "qlib", "name": "Questionnaire and Intervention Library (Embloom)", "description": "Questionnaire conformance.", "how": "Verifies questionnaire and scoring conformance for content partners."}, {"type": "brick", "id": "audt", "name": "Audit Log, Consent and Information Security", "description": "Security review evidence.", "how": "Records the security and data-handling review outcome."}]}, {"id": "enable-the-partner-per-practice-with-consent", "title": "Enable the partner per practice with practice and patient consent", "actor": "Physiotherapy Practice Owner", "keyFacts": ["A practice enables the partner from the catalogue, accepts the data exchange description, and the platform issues the practice-scoped credentials; patient-level consent is asked in the app before data flows to the partner.", "The practice sees the partner's data exchange description in plain language and can disable the partner at any time, which stops the exchange immediately."], "painPoints": ["Practices that enable a partner without understanding what data leaves the EPD cannot answer patient questions."], "dependencies": [{"type": "brick", "id": "papi", "name": "Partner API and Open Platform", "description": "Practice enablement.", "how": "Enables the partner for the practice and issues practice-scoped access."}, {"type": "brick", "id": "audt", "name": "Audit Log, Consent and Information Security", "description": "Consent records.", "how": "Stores the practice and patient consents for the partner exchange."}]}, {"id": "go-live-and-monitor-the-first-exchanges", "title": "Go live and monitor the first exchanges", "actor": "Integration Partner", "keyFacts": ["Production credentials are issued, the first exchanges are monitored for errors and latency by both parties, and the partner's support contact is linked to the HCI support tooling for joint incident handling.", "Partners with connections to acquired labels are migrated to the platform interface as those labels consolidate into HCI One, on the same schedule as the practices."], "painPoints": ["Errors seen by the practice are reported to HCI, while the cause is on the partner side, and nobody owns the ticket."], "dependencies": [{"type": "brick", "id": "papi", "name": "Partner API and Open Platform", "description": "Production monitoring.", "how": "Issues production credentials and monitors exchanges."}, {"type": "brick", "id": "supp", "name": "Customer Support and Onboarding Tooling", "description": "Joint incident handling.", "how": "Links partner incidents to support cases."}]}]}, {"id": "from-interface-change-to-coordinated-release-across-labels", "title": "From Interface Change to a Coordinated Release across Labels", "description": "A national standard changes (for example a new declaration specification through Vecozo or a HIS vendor's interface update), the platform team versions the interface, informs partners, runs the change through sandbox and pilot practices on each label, and retires the old version on a published schedule while connection health is monitored.", "primaryActor": "Integration Partner", "trigger": "A standards body, a national infrastructure party or a partner announces an interface change, or the platform deprecates an interface version.", "successSignal": "All partners are on the supported version before the retirement date, no practice lost a connection during the change, and the monitoring shows normal volumes and error rates on every label.", "steps": [{"id": "assess-the-change-and-version-the-interface", "title": "Assess the change and version the interface", "actor": "Integration Partner", "keyFacts": ["The platform team maps the external change (for example a Vecozo specification update or a HIS connector change) to the affected interfaces and labels, publishes a new interface version with a migration note, and sets the retirement date of the old version.", "The GDS801 introduction on 1 January 2025 is the reference case: a national standard change that touched the declaration engine, the Vecozo gateway and partner exports on every label at once."], "painPoints": ["Changes that reach partners through a newsletter instead of the developer portal are missed."], "dependencies": [{"type": "brick", "id": "papi", "name": "Partner API and Open Platform", "description": "Interface versioning.", "how": "Publishes the new version, migration note and retirement schedule."}, {"type": "brick", "id": "vcgw", "name": "Vecozo Gateway and Insurance Eligibility", "description": "National interface change.", "how": "Supplies the changed Vecozo or national interface behaviour."}]}, {"id": "inform-partners-and-open-the-sandbox", "title": "Inform partners and open the new version in the sandbox", "actor": "Integration Partner", "keyFacts": ["Affected partners receive the change notice with test data and a deadline; their progress against the new version is tracked on the portal.", "Partners can test against the new version while the old version stays available in the sandbox, so both can be compared with the same test data."], "painPoints": ["Small partners without a dedicated developer need more lead time than large ones."], "dependencies": [{"type": "brick", "id": "papi", "name": "Partner API and Open Platform", "description": "Partner communication and tracking.", "how": "Notifies partners and tracks migration status."}, {"type": "brick", "id": "hisc", "name": "HIS/AIS and Hospital System Connectors", "description": "Connector test environment.", "how": "Provides the HIS and hospital connector sandbox for the new version."}]}, {"id": "pilot-on-each-label", "title": "Pilot the change with practices on each label", "actor": "Implementation and Support Consultant", "keyFacts": ["Pilot practices on FysioRoadmap, SpotOnMedics, Incura, CRS and HCI One run the new version in production with close monitoring; the multi-tenant runtime allows enabling the version per tenant.", "Pilot practices are chosen per label and discipline so that the change is seen with each label's data conventions before broad rollout."], "painPoints": ["A change tested on one label only breaks on another label with different data conventions."], "dependencies": [{"type": "brick", "id": "tnnt", "name": "Multi-tenant Cloud Runtime and Label Migration Tooling", "description": "Per-tenant enablement.", "how": "Enables the new version per tenant and label."}, {"type": "brick", "id": "supp", "name": "Customer Support and Onboarding Tooling", "description": "Pilot follow-up.", "how": "Tracks pilot feedback and issues per practice."}]}, {"id": "roll-out-and-retire-the-old-version", "title": "Roll out to all practices and retire the old version", "actor": "Integration Partner", "keyFacts": ["After the pilot the version is enabled for all tenants, partners still on the old version are contacted, and the old version is retired on the published date with a grace mechanism for critical connections.", "Retirement dates are published well in advance and repeated in the portal, so no partner can claim to have been surprised."], "painPoints": ["Retiring a version while one insurer connection still depends on it stops declarations for oupName": "GGZ Business Unit", "role": "related", "roleLabel": "Related team"}, {"teamId": "implementation-and-support-team", "teamName": "Implementation and Support", "teamType": "stream-aligned", "groupId": "cops", "groupName": "Customer Operations", "role": "related", "roleLabel": "Related team"}, {"teamId": "quli-and-medmij-team", "teamName": "Quli and MedMij", "teamType": "stream-aligned", "groupId": "ptpl", "groupName": "Patient Platforms", "role": "related", "roleLabel": "Related team"}, {"teamId": "uw-zorg-online-team", "teamName": "Uw Zorg Online", "teamType": "stream-aligned", "groupId": "ptpl", "groupName": "Patient Platforms", "role": "related", "roleLabel": "Related team"}, {"teamId": "ggz-registration-and-financing-team", "teamName": "GGZ Registration and Financing", "teamType": "complicated-subsystem", "groupId": "ggzb", "groupName": "GGZ Business Unit", "role": "related", "roleLabel": "Related team"}, {"teamId": "insight-and-quality-team", "teamName": "Insight and Quality", "teamType": "stream-aligned", "groupId": "para", "groupName": "Paramedical Business Unit", "role": "related", "roleLabel": "Related team"}];
    const supported_jobs = [];

    mermaid.initialize({
        startOnLoad: false,

        }
    });

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

    function getFlows() {
        return currentStream.flows || [];
    }

    function getFlowDependencies(flow) {
        const dependencyIndex = new Map();
        (flow.steps || []).forEach(step => {
            (step.dependencies || []).forEach(dependency => {
                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());
    }

    function getStepDependency(step, dependency) {
        return (step.dependencies || []).find(item => (item.type || '') === (dependency.type || '') && (item.id || '') === (dependency.id || '')) || null;
    }

    function getPrimaryActors() {
        const streamJobs = currentStream.supportedCustomerJobs || [];
        const allJobs = streamJobs.length ? streamJobs : supported_jobs;
        return dedupe(allJobs.map(item => item.customerName || item.customerGroup || '').filter(Boolean), item => item);
    }

    function summarizeFlow(flow) {
        const steps = flow.steps || [];
        const firstStep = steps[0] || {};
        const lastStep = steps[steps.length - 1] || {};
        return {
            actor: flow.primaryActor || firstStep.actor || '',
            trigger: flow.trigger || firstStep.trigger || '',
            result: flow.successSignal || flow.outcome || lastStep.successSignal || lastStep.output || ''
        };
    }

    function renderStepMeta(label, value) {
        if (!value) {
            return '';
        }
        return '<div class="flow-step-meta-item"><div class="flow-step-meta-label">' + escapeHtml(label) + '</div><div class="flow-step-copy">' + escapeHtml(value) + '</div></div>';
    }

    function flowDependencyIconFile(dependency) {
        const dependencyId = dependency.id || '';
        const linkedBrick = related_bricks.find(brick => brick.id === dependencyId) || all_bricks.find(brick => brick.id === dependencyId) || {};
        return dependency.icon || linkedBrick.icon || (dependencyId ? dependencyId + '.png' : 'brick.png');
    }

    function renderFlowDependencyIcon(dependency, className) {
        return '<img class="' + escapeHtml(className) + '" src="../icons/' + escapeHtml(flowDependencyIconFile(dependency)) + '" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
    }

    function renderStepDependencyPills(step) {
        const dependencies = step.dependencies || [];
        if (!dependencies.length) {
            return '<div class="muted">No step-specific dependencies listed.</div>';
        }

        return '<div class="flow-step-dependencies">' + dependencies.map(dep => {
            const label = dep.name || dep.id || 'Dependency';
            const kind = 'Brick';
            return '<span class="flow-cell-brick">' + renderFlowDependencyIcon(dep, 'flow-cell-brick-icon') + '<span>' + escapeHtml(kind + ': ' + label) + '</span></span>';
        }).join('') + '</div>';
    }

    function simplifySupportCopy(value) {
        const text = String(value || '').trim();
        if (!text) {
            return '';
        }
        const simplified = text.replace(/^Supports .*? by helping users help /i, 'Facilitate ');
        return simplified;
    }
</script>

        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {

                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

</script>
