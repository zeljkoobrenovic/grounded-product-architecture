    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

ntent into the programme."}]}, {"id": "assign-the-emogy-app-for-behavioural-support", "title": "Assign the Emogy app for behavioural support between sessions", "actor": "Independent GGZ Practitioner", "keyFacts": ["For clients who benefit from cognitive and behavioural support on the phone, the practitioner activates Emogy with exercises and reminders tied to the programme; the client's use is visible in the dossier.", "Emogy also serves an autism environment used with NICE Connect trajectories."], "painPoints": ["Apps that are recommended but not connected to the dossier give the practitioner no signal whether they are used."], "dependencies": [{"type": "brick", "id": "emgy", "name": "Emogy Behavioural Support App", "description": "App activation and use.", "how": "Activates the app for the client and reports use back to the programme."}, {"type": "brick", "id": "bldc", "name": "Blended Care Programme Builder and Monitoring", "description": "Programme link.", "how": "Places the app tasks in the client's programme."}]}, {"id": "work-through-modules-in-the-client-portal", "title": "Work through the modules in the client portal", "actor": "Patient and Client", "keyFacts": ["The client logs in once to the CRS client portal or Quli and finds modules, questionnaires, diary and messages in one place; progress is saved per exercise and the practitioner can leave feedback inside the module.", "Reminders follow the due dates of the programme."], "painPoints": ["Separate logins for the e-health platform and the portal are the reason clients give for not starting."], "dependencies": [{"type": "brick", "id": "cpor", "name": "GGZ Client Portal", "description": "Client access.", "how": "Gives the client access to the programme in the portal with one login."}, {"type": "brick", "id": "bldc", "name": "Blended Care Programme Builder and Monitoring", "description": "Progress capture.", "how": "Stores progress and feedback per module and task."}]}, {"id": "monitor-progress-and-adjust-in-the-session", "title": "Monitor progress and adjust the programme in the session", "actor": "Independent GGZ Practitioner", "keyFacts": ["Before each session the practitioner sees what the client did, the questionnaire scores and diary entries, and adjusts the next steps; the session note references the home work.", "Clients who stop working on the programme are flagged so that the practitioner can address it early."], "painPoints": ["Practitioners who check progress only when the client mentions it lose the blended effect."], "dependencies": [{"type": "brick", "id": "bldc", "name": "Blended Care Programme Builder and Monitoring", "description": "Progress monitoring.", "how": "Presents progress, inactivity flags and scores per client."}, {"type": "brick", "id": "romq", "name": "ROM and Questionnaire Orchestration for GGZ", "description": "Questionnaire scores.", "how": "Supplies the scores from questionnaires in the programme."}, {"type": "brick", "id": "trpl", "name": "Treatment Plans and Multidisciplinary Coordination", "description": "Session report.", "how": "Records the CRS session report with reference to the home work done."}]}, {"id": "hold-a-video-session-when-needed", "title": "Hold a video session when the client cannot come in", "actor": "Independent GGZ Practitioner", "keyFacts": ["A video consult is planned in the agenda like any other consult, started from the dossier, and registered as a consult under the zorgprestatiemodel exactly like a face-to-face consult, because the model does not distinguish digital from physical delivery; the client joins from the portal or app without installing software.", "The session is documented in the same dossier as face-to-face sessions."], "painPoints": ["Consumer video tools outside the platform breach the institution's security policy and leave no registration."], "dependencies": [{"type": "brick", "id": "vidc", "name": "Video Consultation and NICE Connect Trajectories", "description": "Video consult.", "how": chedule of questionnaires, measurements and contact moments."}, {"type": "brick", "id": "trpl", "name": "Treatment Plans and Multidisciplinary Coordination", "description": "Trajectory plan.", "how": "Records the trajectory as part of the multidisciplinary plan."}]}, {"id": "collect-questionnaires-and-measurements-at-home", "title": "Collect questionnaires and measurements at home", "actor": "Patient and Client", "keyFacts": ["Parents or patients fill questionnaires and enter measurements (weight, development milestones, function scores) in the app on the schedule; reminders and a clear 'what is next' keep participation high.", "Answers outside the expected range raise a signal to the coordinator."], "painPoints": ["Long questionnaires on a phone are abandoned halfway."], "dependencies": [{"type": "brick", "id": "pgoa", "name": "Patient App and Web Portal", "description": "Home data entry.", "how": "Presents questionnaires and measurement entry to the patient or parent in the app."}, {"type": "brick", "id": "vidc", "name": "Video Consultation and NICE Connect Trajectories", "description": "Trajectory schedule.", "how": "Delivers the scheduled items and evaluates the signals."}]}, {"id": "review-signals-and-hold-video-contact", "title": "Review signals and hold video contact with the family", "actor": "Rehabilitation and Hospital Paramedical Coordinator", "keyFacts": ["The coordinator reviews the signals per trajectory, contacts the family by secure message or a video consult, and involves the treating specialist when needed; contacts are recorded in the trajectory.", "Video contact replaces a hospital visit for families who live far from the centre."], "painPoints": ["Signals that go to a shared mailbox are picked up late."], "dependencies": [{"type": "brick", "id": "vidc", "name": "Video Consultation and NICE Connect Trajectories", "description": "Signal review and video contact.", "how": "Shows the signals per trajectory and runs the video contact."}, {"type": "br     function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

    function getFlows() {
        return currentStream.flows || [];
    }

    function getFlowDependencies(flow) {
        const dependencyIndex = new Map();
        (flow.steps || []).forEach(step => {
            (step.dependencies || []).forEach(dependency => {
                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());
    }

    function getStepDependency(step, dependency) {
        return (step.dependencies || []).find(item => (item.type || '') === (dependency.type || '') && (item.id || '') === (dependency.id || '')) || null;
    }

    function getPrimaryActors() {
        const streamJobs = currentStream.supportedCustomerJobs || [];
        const allJobs = streamJobs.length ? streamJobs : supported_jobs;
        return dedupe(allJobs.map(item => item.customerName || item.customerGroup || '').filter(Boolean), item => item);
    }

    function summarizeFlow(flow) {
        const steps = flow.steps || [];
        const firstStep = steps[0] || {};
        const lastStep = steps[steps.length - 1] || {};
        return {
            actor: flow.primaryActor || firstStep.actor || '',
            trigger: flow.trigger || firstStep.trigger || '',
            result: flow.successSignal || flow.outcome || lastStep.successSignal || lastStep.output || ''
        };
    }

    function renderStepMeta(label, value) {
        if (!value) {
            return '';
        }
        return '<div class="flow-step-meta-item"><div class="flow-step-meta-label">' + escapeHtml(label) + '</div><div class="flow-step-copy">' + escapeHtml(value) + '</div></div>';
    }

    function flowDependencyIconFile(dependency) {
        const dependencyId = dependency.id || '';
        const linkedBrick = related_bricks.find(brick => brick.id === dependencyId) || all_bricks.find(brick => brick.id === dependencyId) || {};
        return dependency.icon || linkedBrick.icon || (dependencyId ? dependencyId + '.png' : 'brick.png');
    }

    function renderFlowDependencyIcon(dependency, className) {
        return '<img class="' + escapeHtml(className) + '" src="../icons/' + escapeHtml(flowDependencyIconFile(dependency)) + '" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
    }

    function renderStepDependencyPills(step) {
        const dependencies = step.dependencies || [];
        if (!dependencies.length) {
            return '<div class="muted">No step-specific dependencies listed.</div>';
        }

        return '<div class="flow-step-dependencies">' + dependencies.map(dep => {
            const label = dep.name || dep.id || 'Dependency';
            const kind = 'Brick';
            return '<span class="flow-cell-brick">' + renderFlowDependencyIcon(dep, 'flow-cell-brick-icon') + '<span>' + escapeHtml(kind + ': ' + label) + '</span></span>';
        }).join('') + '</div>';
    }

    function simplifySupportCopy(value) {
        const text = String(value || '').trim();
        if (!text) {
            return '';
        }
        const simplified = text.replace(/^Supports .*? by helping users help /i, 'Facilitate ');
        return simplified;
    }

            html += '</div>';
            html += '</div>';
        });

        document.getElementById('tab_content_flows').innerHTML = html;
    }

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';
        }
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-title">' + escapeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                count++;
                html += '<div class="link-entry">';
                html += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(link.link || '#') + '">'
                    + escapeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>


<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Paramedical and Mental Health Practice Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Streams Index"
    },
    {
      "label": "Deliver Blended and E-health Care"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
