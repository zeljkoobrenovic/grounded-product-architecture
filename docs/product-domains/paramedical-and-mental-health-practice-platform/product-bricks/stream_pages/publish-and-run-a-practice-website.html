    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

es of the app, and the digital triage; the practice decides which entry points are shown and in which order.", "Entry points are the same components the app uses, so rules such as bookable reasons and response times apply on the website too."], "painPoints": ["A 'contact us' form without routing lands in a mailbox nobody reads."], "dependencies": [{"type": "brick", "id": "pweb", "name": "Practice Websites", "description": "Entry-point placement.", "how": "Places and orders the entry points on the site."}, {"type": "brick", "id": "obok", "name": "Online Booking, Waiting List and Reminders", "description": "Booking widget.", "how": "Provides the online-booking component for paramedical practices."}, {"type": "brick", "id": "appb", "name": "Patient Appointment Self-service", "description": "Appointment route.", "how": "Provides the appointment self-service route into the app for GP practices."}, {"type": "brick", "id": "trig", "name": "Digital Triage", "description": "Triage entry.", "how": "Provides the digital triage entry point."}]}, {"id": "review-accessibility-privacy-and-security", "title": "Review accessibility, privacy and security before go-live", "actor": "Implementation and Support Consultant", "keyFacts": ["The site is checked against WCAG accessibility criteria, carries the privacy and cookie statements the AVG requires, uses TLS and the platform's security baseline, and the practice's domain is pointed to the hosting.", "The consultant also checks that the entry points work from a phone, because most patients open the practice website on a mobile device."], "painPoints": ["Embedded third-party widgets that set tracking cookies breach the practice's privacy statement."], "dependencies": [{"type": "brick", "id": "pweb", "name": "Practice Websites", "description": "Go-live checks.", "how": "Runs the accessibility and content checks and configures the domain."}, {"type": "brick", "id": "tnnt", "name": "Multi-tenant Cloud Runtime and Label Migration Tooling", "description": "Hosting security.", "how": "Applies TLS and the security baseline on the hosting platform."}]}, {"id": "publish-and-register-with-search-engines", "title": "Publish the site and register it with search engines and listings", "actor": "GP Practice and Pharmacy Manager", "keyFacts": ["The site goes live with a sitemap and structured data for opening hours and services; the manager updates the practice's business listings so that search results point to the new site and its digital entry points.", "Sitemap and structured data are generated from the content model, so opening hours in search results follow the same edit as the website."], "painPoints": ["Old listings that keep pointing to the previous site split the traffic for months."], "dependencies": [{"type": "brick", "id": "pweb", "name": "Practice Websites", "description": "Publishing.", "how": "Publishes the site with sitemap and structured data."}]}]}, {"id": "from-daily-updates-to-a-front-door-that-reduces-calls", "title": "From Daily Updates to a Front Door that Reduces Calls", "description": "Practice staff keep the website current, publish holiday hours and news, promote the app and its services, watch which entry points patients use, and get support when something breaks, so that the site keeps working as the practice's front door.", "primaryActor": "GP Practice and Pharmacy Manager", "trigger": "A holiday period, a change in the team or services, a new digital service, or a problem reported by a patient.", "successSignal": "The site is current, the entry points are used, the practice sees the share of patients arriving through the site, and support cases are resolved.", "steps": [{"id": "publish-holiday-hours-and-news", "title": "Publish holiday hours, news and team changes", "actor": "GP Practice and Pharmacy Manager", "keyFacts": ["Practice staff update holiday hours, add a news item about a new therapist or a vaccination round, and the change is live immediately without a developer; opening hours also feed the app.", "Holiday hours are entered once with a date range and revert automatically, so the site never shows a holiday message in the following week."], "painPoints": ["Staff who need the web agency for every change stop updating the site."], "dependencies": [{"type": "brick", "id": "pweb", "name": "Practice Websites", "description": "Content updates.", "how": "Lets practice staff edit content and hours."}, {"type": "brick", "id": "pgoa", "name": "Patient App and Web Portal", "description": "Hours in the app.", "how": "Shows the same opening hours and news in the patient app."}]}, {"id": "promote-the-app-and-digital-services", "title": "Promote the app and the digital services on the site", "actor": "GP Practice and Pharmacy Manager", "keyFacts": ["The site explains the app, the e-consult rules and the repeat-prescription route, with the activation steps; campaigns such as 'ask your question digitally' are placed on the homepage during busy periods.", "The site shows the same service list that the practice enabled in the app, so a patient never sees a service on the site that does not exist in the app."], "painPoints": ["Patients who cannot find how to activate the app call to ask."], "dependencies": [{"type": "brick", "id": "pweb", "name": "Practice Websites", "description": "Service pages.", "how": "Publishes the explanation and activation steps."}, {"type": "brick", "id": "econ", "name": "E-consult and Secure Messaging", "description": "E-consult route.", "how": "Provides the e-consult entry and rules shown on the site."}]}, {"id": "watch-entry-point-usage", "title": "Watch which entry points patients use", "actor": "GP Practice and Pharmacy Manager", "keyFacts": ["The site reports visits and clicks per entry point without tracking cookies, so the manager sees whether triage, booking and e-consult are found and can reorder them.", "Usage is compared with the practice's phone volume where the practice records it, which shows whether the front door shifts contact from phone to app."], "painPoints": ["Without usage figures the practice cannot tell whether the triage entry helps or is ignored."], "dependencies": [{"type": "brick", "id": "pweb", "name": "Practice Websites", "description": "Usage statistics.", "how": "Reports visits and entry-point use in a privacy-friendly way."}, {"type": "brick", "id": "trig", "name": "Digital Triage", "description": "Triage completions.", "how": "Reports how many triage sessions started from the site were completed."}]}, {"id": "handle-a-website-problem-with-support", "title": "Handle a website problem with support", "actor": "Implementation and Support Consultant", "keyFacts": ["A patient reports that booking does not work; the practice raises a support case, the consultant sees the site, its tenant and the entry-point configuration, and resolves or escalates the issue.", "Cases about entry points are routed to the team that owns the booking or triage component, not to the website team, so the fix lands where the problem is."], "painPoints": ["Problems reported to the practice's own IT supplier bounce between parties."], "dependencies": [{"type": "brick", "id": "supp", "name": "Customer Support and Onboarding Tooling", "description": "Support case.", "how": "Records and tracks the case with the site context."}, {"type": "brick", "id": "obok", "name": "Online Booking, Waiting List and Reminders", "description": "Booking diagnostics.", "how": "Shows the booking widget configuration and errors for the site."}]}, {"id": "keep-hosting-and-platform-updates-invisible", "title": "Keep hosting, security and platform updates invisible to the practice", "actor": "Implementation and Support Consultant", "keyFacts": ["Hosting, certificates, template updates and security patches are applied for all sites on the platform without practice involvement, and the practice is informed only when a change affects its content or entry points.", "All practice sites run on the same multi-tenant hosting, so a security patch is applied once for every site instead of per practice."], "painPoints": ["Expired certificates on self-hosted practice sites show browser warnings to patients."], "dependencies": [{"type": "brick", "id": "tnnt", "name": "Multi-tenant Cloud Runtime and Label Migration Tooling", "description": "Platform maintenance.", "how": "Applies hosting, certificate and security updates across site tenants."}, {"type": "brick", "id": "pweb", "name": "Practice Websites", "description": "Template updates.", "how": "Rolls out template improvements to existing sites."}]}]}], "outcomes": ["A practice publishes a website from a template in days with its team, locations, opening hours and services", "Booking, e-consult, repeat prescription and triage entry points on the website lead directly into the app and the practice agenda", "Practice staff maintain content themselves and the site stays accessible, secure and up to date", "Patients find the practice through search and know the digital route before they call"], "brickDependencies": [{"targetBrickId": "pweb", "type": "composition"}, {"targetBrickId": "obok", "type": "composition"}, {"targetBrickId": "econ", "type": "composition"}, {"targetBrickId": "trig", "type": "composition"}, {"targetBrickId": "pgoa", "type": "composition"}, {"targetBrickId": "supp", "type": "composition"}, {"targetBrickId": "tnnt", "type": "composition"}, {"targetBrickId": "appb", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "Domain registrars and DNS providers", "type": "infrastructure-provider", "interface": "Domain registration and DNS management", "description": "Hold the practice's domain name that points to the hosted website."}, {"system": "Search engines and business listings", "type": "discovery-channel", "interface": "Sitemaps, structured data and business profiles", "description": "Index the practice website and show opening hours and services in search results and maps."}, {"system": "Accessibility and web-security standards bodies", "type": "standards-body", "interface": "WCAG guidelines and TLS/security baselines", "description": "Set the accessibility and security requirements that public healthcare websites in the Netherlands are expected to meet."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []};

ar-one levers for administrative relief, because every self-booked appointment is a phone call the front desk does not take.", "links": [{"group": "Evidence", "description": "Real-world evidence related to this product brick.", "links": [{"label": "Evidence Explorer", "link": "../../../../evidence-explorer/index.html", "description": "Search evidence \u2014 source repositories, cloud resources, and contacts. Refine with ?q=<query> to pre-filter for this product brick.", "embedLink": "../../../../evidence-explorer/index.html?embed=1"}]}], "layers": [{"layer": "ui", "description": "User-facing web, mobile, backoffice, and operator experience modules.", "modules": [{"id": "module-obok-web", "name": "Online Booking Widget", "type": "web-component", "description": "Embeddable booking flow for practice websites and the patient app: choose complaint or treatment type, therapist and location, pick a free slot, identify or register as a new patient and confirm; also the patient-facing cancel and reschedule screens.", "dependencies": {"modules": [{"moduleId": "module-obok-api", "type": "uses", "description": "Widget reads availability and books through the Booking API."}]}}]}, {"layer": "interfaces", "description": "APIs, BFFs, and explicit service boundary interfaces exposed to clients or other systems.", "modules": [{"id": "module-obok-api", "name": "Booking API", "type": "api", "description": "Public and portal-facing API for availability, booking, rescheduling and cancellation, waiting-list enrolment and reminder preferences; consumed by practice websites, the patient app, the Zorgverlener App and partner booking channels.", "dependencies": {"modules": [{"moduleId": "module-obok-orchestrator", "type": "delegates", "description": "Interface delegates booking rules and confirmation to the Booking Rules Orchestrator."}, {"moduleId": "module-obok-store", "type": "delegates", "description": "Interface delegates waiting-list and reminder persistence to the Booking Store."}]}}]}, {"layer": "worker", "description": "Background workers, event consumers, daemons, and asynchronous processing modules.", "modules": [{"id": "module-obok-reminder-worker", "name": "Reminder Dispatch Worker", "type": "message-consumer", "description": "Consumes agenda change events and reminder schedules and sends SMS, e-mail or push reminders at the practice's configured intervals, records delivery status and processes replies such as cancellations.", "dependencies": {"modules": [{"moduleId": "module-obok-store", "type": "processes", "description": "Worker reads reminder schedules and writes delivery status to the Booking Store."}]}}, {"id": "module-obok-waitlist-daemon", "name": "Waiting List Matcher", "type": "daemon", "description": "Watches for freed slots and offers them to matching waiting-list patients by preference and urgency, first come first served, with a time-boxed acceptance window before the slot is offered to the next patient.", "dependencies": {"modules": [{"moduleId": "module-obok-orchestrator", "type": "uses", "description": "Matcher books accepted offers through the orchestrator."}, {"moduleId": "module-obok-store", "type": "processes", "description": "Matcher reads and updates the waiting list."}]}}]}, {"layer": "stateless-service", "description": "Stateless orchestration services that aggregate other services without owning durable state.", "modules": [{"id": "module-obok-orchestrator", "name": "Booking Rules Orchestrator", "type": "stateless-service", "description": "Applies the practice's online booking rules (which therapists and treatment types are bookable, lead time, new-patient intake slots, maximum bookings per patient) and coordinates the agenda write, patient registration and confirmation messages in one transaction.", "dependencies": {"modules": [{"moduleId": "module-obok-store", "type": "uses", "description": "Orchestrator reads booking rules per tenant and channel."}]}}]}, {"layer": "service", "description": "Stateful services and             .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;

                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');

                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());

            trigger: flow.trigger || firstStep.trigger || '',

                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../../product-deployments/landing_pages/' + escapeHtml(product.id) + '.html">';
                html += '<div class="card-meta">' + escapeHtml(product.type || 'Product') + '</div>';
                html += '<div class="card-header">';
                html += '<img class="card-icon" src="../../product-deployments/icons/' + escapeHtml(product.icon) + '" alt="" onerror="this.onerror=null;this.src=\'../../product-deployments/icons/product.png\'">';
                html += '<div class="card-title">' + escapeHtml(product.name || product.id) + '</div>';
                html += '</div>';
                html += '<div class="card-copy">' + escapeHtml(product.whyUsed || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Related Teams</div>';
        if (!related_teams.length) {
            html += '<div class="muted">No teams were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            related_teams.forEach(team => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../../teams/landing_pages/' + escapeHtml(team.teamId) + '.html">';
                html += '<div class="card-meta">' + escapeHtml(team.roleLabel || team.teamType || 'Team') + '</div>';
                html += '<div class="card-title">' + escapeHtml(team.teamName || team.teamId) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(team.groupName || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Supported Customer Jobs</div>';
        if (!supported_jobs.length) {
            html += '<div class="muted">No customer jobs were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            supported_jobs.forEach(job => {
                html += '<div class="card">';
                html += '<div class="card-meta">' + escapeHtml(job.customerGroup || '') + (job.productName ? ' | ' + escapeHtml(job.productName) : '') + '</div>';
                html += '<div class="card-title">' + escapeHtml(job.jobName || job.jobId) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(job.jobOutcome || job.jobWhatItIs || '') + '</div>';
                if (job.supportRationale) {
                    html += '<div class="card-copy"><strong>Why this stream matters here:</strong> ' + escapeHtml(job.supportRationale) + '</div>';
                }
                if ((job.usedInSteps || []).length) {
                    html += '<ul class="list">' + job.usedInSteps.map(step => '<li>' + escapeHtml(step.step || step.description || '') + '</li>').join('') + '</ul>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        html += '</div>';

        document.getElementById('tab_content_home').innerHTML = html;
    }

    function renderFlows() {
        const flows = getFlows();
        const totalSteps = flows.reduce((count, flow) => count + ((flow.steps || []).length), 0);
        let html = '';

        document.getElementById('tab_flows').innerHTML = 'Flow Narratives (' + flows.length + ')';

        flows.forEach(flow => {
            const dependenciesInFlow = getFlowDependencies(flow);
            const summary = summarizeFlow(flow);
            html += '<div class="group">';
            html += '<div class="section-title">Flow</div>';
            html += '<div class="flow-title">' + escapeHtml(flow.title || flow.id) + '</div>';
            html += '<div class="flow-description">' + escapeHtml(flow.description || '') + '</div>';
            if (summary.actor || summary.trigger || summary.result) {
                html += '<div class="card" style="margin-bottom:16px;">';
                if (summary.actor) {
                    html += '<div class="card-copy"><strong>Primary actor:</strong> ' + escapeHtml(summary.actor) + '</div>';
                }
                if (summary.trigger) {
                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';
                }
                html += '</div>';
            }

            html += '<div class="section-title">Dependency Traceability</div>';
            html += '<div class="flow-matrix-wrap">';
            html += '<table class="flow-matrix">';
            html += '<thead>';
            html += '<tr><th class="flow-dependency-col"></th>';
            (flow.steps || []).forEach((step, index) => {
                html += '<th class="flow-step-col"><div class="flow-step-label">Step ' + (index + 1) + '</div><div class="card-title">' + escapeHtml(step.title || step.id) + '</div></th>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right">Key Facts</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkblue">';
                if ((step.keyFacts || []).length) {
                    html += '<ul class="flow-insight-list">' + step.keyFacts.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No key facts listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right; color: darkred">Pain Points</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkred">';
                if ((step.painPoints || []).length) {
                    html += '<ul class="flow-insight-list">' + step.painPoints.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No pain points listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';
            html += '</thead><tbody>';

            dependenciesInFlow.forEach(dependency => {
                const dependencyTypeLabel = 'Product Brick';
                html += '<tr>';
                html += '<td>';
                html += '<div class="flow-dependency-header">';
                html += renderFlowDependencyIcon(dependency, 'flow-dependency-icon');
                html += '<div>';
                html += '<a class="flow-dependency-name" href="../landing_pages/' + escapeHtml(dependency.id) + '.html">' + escapeHtml(dependency.name || dependency.id) + '</a>';
                if (dependency.interface) {
                    html += '<div class="muted">' + escapeHtml(dependency.interface) + '</div>';
                }
                html += '</div>';
                html += '</div>';
                html += '</td>';
                (flow.steps || []).forEach(step => {
                    const stepDependency = getStepDependency(step, dependency);
                    if (!stepDependency) {
                        html += '<td class="flow-cell-empty">-</td>';
                        return;
                    }
                    html += '<td class="flow-cell-active">';
                    html += '<div class="flow-cell-copy">' + escapeHtml(simplifySupportCopy(stepDependency.how || stepDependency.description || 'Supports this step.')) + '</div>';
                    html += '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            html += '</div>';
            html += '</div>';
        });

        document.getElementById('tab_content_flows').innerHTML = html;
    }

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';
        }
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-title">' + escapeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                count++;
                html += '<div class="link-entry">';
                html += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(link.link || '#') + '">'
                    + escapeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>


<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Paramedical and Mental Health Practice Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Streams Index"
    },
    {
      "label": "Publish and Run a Practice Website"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
