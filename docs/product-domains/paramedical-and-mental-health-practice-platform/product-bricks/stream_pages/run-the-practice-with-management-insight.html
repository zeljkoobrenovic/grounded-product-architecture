    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

erapist."}, {"type": "brick", "id": "dosr", "name": "Patient Dossier and Care Pathways", "description": "Episode data.", "how": "Supplies diagnosis, start and end dates and session counts per episode."}]}, {"id": "review-referrers-waiting-times-and-no-shows", "title": "Review referrers, waiting times and no-shows", "actor": "Physiotherapy Practice Owner", "keyFacts": ["Referrer volume per GP and specialist, direct-access share, waiting time from request to intake and no-show rate per therapist and slot are shown per month, supporting decisions on referrer visits, online-booking fences and reminder settings.", "Nivel registered 7,848 physiotherapists in 543 practices with 1,162,545 patients in 2024, which gives owners a sense of the sector they benchmark against; the practice's own figures stay the basis for decisions."], "painPoints": ["Practices do not notice a referring GP who stopped referring until months later."], "dependencies": [{"type": "brick", "id": "bidb", "name": "Practice BI Dashboards and Reporting", "description": "Referrer and access view.", "how": "Reports referrers, waiting times and no-shows."}, {"type": "brick", "id": "agnd", "name": "Agenda and Multi-location Scheduling", "description": "Booking and attendance data.", "how": "Supplies request, booking and attendance data."}]}, {"id": "check-outcome-and-quality-indicators", "title": "Check outcome and quality indicators for the insurer conversation", "actor": "Physiotherapy Practice Owner", "keyFacts": ["PROM response rates, outcome change per diagnosis group, patient-experience scores and LDF delivery completeness are shown next to the contract's quality conditions so that the owner enters the insurer conversation prepared.", "The Keurmerk visitation and insurer 'plus' contracts ask for the same indicators, so one view serves both conversations."], "painPoints": ["Quality data assembled from register portals and survey providers by hand is inconsistent with the practice's own figures."], "dependencies": [{"type": "brick", "id": "qdat", "name": "Quality Data Delivery (LDF, Keurmerk, Benchmarks)", "description": "Quality indicators.", "how": "Supplies delivery completeness, benchmark and patient-experience results."}, {"type": "brick", "id": "bidb", "name": "Practice BI Dashboards and Reporting", "description": "Quality view.", "how": "Presents the indicators against contract conditions."}]}, {"id": "monitor-contract-conditions-and-return-message-rates", "title": "Monitor contract conditions and return-message rates", "actor": "Physiotherapy Practice Owner", "keyFacts": ["Declared volume against contract ceilings, session limits per patient and the rejection rate per insurer are monitored monthly; after the GDS801 change the rejection rate per rejection code shows whether the practice or the insurer has a problem.", "Rejection trends per code are compared before and after 1 January 2025 to separate GDS801 transition issues from structural registration problems."], "painPoints": ["Care delivered above a ceiling is discovered when the insurer refuses payment."], "dependencies": [{"type": "brick", "id": "bidb", "name": "Practice BI Dashboards and Reporting", "description": "Contract monitor.", "how": "Tracks volume against ceilings and rejection rates per insurer."}, {"type": "brick", "id": "bils", "name": "Billing Services and Return-message Handling", "description": "Rejection statistics.", "how": "Supplies rejection codes and resolution status."}]}, {"id": "share-views-with-the-team-and-decide", "title": "Share per-therapist views with the team and decide", "actor": "Physiotherapy Practice Owner", "keyFacts": ["Each therapist sees their own production, treatment index, outcomes and no-shows; the owner uses the team meeting to agree on capacity changes, coaching and which groups to open.", "Decisions from the meeting (opening a group, changing online-booking fences, a coaching agreement) are recorded so that the next month's review can check their effect."], "painPoints": ["Figures shown only to the owner leave therapists without feedback on their own practice."], "dependencies": [{"type": "brick", "id": "bidb", "name": "Practice BI Dashboards and Reporting", "description": "Per-therapist view.", "how": "Provides therapist-level views with the right access scope."}]}]}, {"id": "from-institution-registrations-to-compliance-and-throughput-reporting", "title": "From Institution Registrations to Compliance and Throughput Reporting", "description": "A GGZ institution's application manager builds the monthly management report from CRS: registration compliance under the zorgprestatiemodel, waiting list against the Treeknorm, throughput per team, delivered volume against insurer and municipal contracts, ROM completion and portal adoption, and delivers it to management and the financiers that ask for it.", "primaryActor": "GGZ Institution Application Manager", "trigger": "The monthly reporting cycle or a financier's information request.", "successSignal": "Management has a report with compliant registrations, waiting and throughput figures, contract positions and quality indicators, and the figures reconcile with the declarations.", "steps": [{"id": "check-registration-compliance-across-teams", "title": "Check registration compliance across teams", "actor": "GGZ Institution Application Manager", "keyFacts": ["The report shows consults without a valid setting, trajectories without a referral date, care-demand typing missing, and coordinating practitioners not assigned, per team; the manager sends the worklists to the team leads before the declaration run.", "Institutions with 50 to 500 professionals need the exception lists per team lead, not per institution, or nobody acts on them."], "painPoints": ["Compliance issues found after the declaration run cost a correction cycle with the insurer."], "dependencies": [{"type": "brick", "id": "zpmc", "name": "Zorgprestatiemodel Registration and Compliance", "description": "Compliance exceptions.", "how": "Lists registration exceptions per team."}, {"type": "brick", "id": "bidb", "name": "Practice BI Dashboards and Reporting", "description": "Compliance report.", "how": "Aggregates exceptions and trends per team."}]}, {"id": "report-waiting-list-and-throughput", "title": "Report the waiting list against the Treeknorm and throughput per team", "actor": "GGZ Institution Application Manager", "keyFacts": ["Waiting time from referral to intake and from intake to treatment start is reported per team against the 14-week Treeknorm, together with active trajectories, closures and average trajectory duration; GGZ waiting times exceeded the norm in every region in the first half of 2025, so the figures feed regional reporting too.", "Clients offered interim contact or e-health during the wait are shown separately so that the institution can demonstrate what it does for those above the norm."], "painPoints": ["Waiting-list figures reported to the regional table by hand differ from what the EPD shows."], "dependencies": [{"type": "brick", "id": "bidb", "name": "Practice BI Dashboards and Reporting", "description": "Waiting and throughput report.", "how": "Computes waiting times and throughput per team."}, {"type": "brick", "id": "trpl", "name": "Treatment Plans and Multidisciplinary Coordination", "description": "Trajectory dates.", "how": "Supplies referral, intake, start and closure dates per trajectory."}]}, {"id": "monitor-insurer-and-municipal-contracts", "title": "Monitor insurer and municipal contract positions", "actor": "GGZ Institution Application Manager", "keyFacts": ["Delivered and declared volume is tracked per insurer and per municipality against ceilings and budget agreements, with forecasts to year end so that management can steer intake per financier.", "Municipal contracts differ per region in products, tariffs and ceilings, so the dashboard reads the contract register that the iJw/iWmo messaging also uses."], "painPoints": ["Institutions serving dozens of municipalities cannot see which contracts are running out."], "dependencies": [{"type": "brick", "id": "jzrg", "name": "Youth Care and Municipal Contracting (Jeugdwet/WMO)", "description": "Municipal contract positions.", "how": "Supplies delivered volume per municipal contract."}, {"type": "brick", "id": "decl", "name": "Declaration Engine (GDS801 and Zorgprestatiemodel)", "description": "Insurer positions.", "how": "Supplies declared and paid volume per insurer."}, {"type": "brick", "id": "bidb", "name": "Practice BI Dashboards and Reporting", "description": "Contract dashboard.", "how": "Presents positions and forecasts per financier."}]}, {"id": "report-quality-and-portal-adoption", "title": "Report ROM completion, e-health use and portal adoption", "actor": "GGZ Institution Application Manager", "keyFacts": ["ROM completion per programme, e-health module use and client-portal activation per team are reported with the quality delivery status, giving management the picture of the blended-care roll-out.", "Portal activation is reported per team because roll-out happens team by team, and the figures show where training is still needed."], "painPoints": ["Adoption figures from the e-health platform and the EPD are counted differently and cannot be combined."], "dependencies": [{"type": "brick", "id": "qdat", "name": "Quality Data Delivery (LDF, Keurmerk, Benchmarks)", "description": "Quality delivery status.", "how": "Supplies delivery completeness and outcome figures."}, {"type": "brick", "id": "bidb", "name": "Practice BI Dashboards and Reporting", "description": "Adoption report.", "how": "Reports ROM, e-health and portal adoption per team."}]}, {"id": "reconcile-with-declarations-and-publish", "title": "Reconcile the report with the declarations and publish it", "actor": "GGZ Institution Application Manager", "keyFacts": ["The reported volumes are reconciled with the declared and paid amounts; the report is published to management with the underlying exports for finance and for the financiers that request them.", "Exports are provided in the formats finance and financiers expect so that the same figures are not re-keyed elsewhere."], "painPoints": ["Management reports that do not reconcile with finance lose credibility in one meeting."], "dependencies": [{"type": "brick", "id": "bidb", "name": "Practice BI Dashboards and Reporting", "description": "Report publishing.", "how": "Publishes the report and exports with reconciliation."}, {"type": "brick", "id": "dosr", "name": "Patient Dossier and Care Pathways", "description": "Registration source.", "how": "Provides the registration data the report is reconciled against."}]}]}], "outcomes": ["The owner sees production, revenue, waiting times and no-shows per therapist and location without exporting to a spreadsheet", "Insurer and municipal contract ceilings and conditions are monitored during the year, not discovered at year end", "Referrer and outcome views support the practice's quality conversation with insurers and the Keurmerk", "Institution management gets registration compliance and throughput reporting across teams"], "brickDependencies": [{"targetBrickId": "bidb", "type": "composition"}, {"targetBrickId": "qdat", "type": "composition"}, {"targetBrickId": "decl", "type": "composition"}, {"targetBrickId": "agnd", "type": "composition"}, {"targetBrickId": "dosr", "type": "composition"}, {"targetBrickId": "zpmc", "type": "composition"}, {"targetBrickId": "jzrg", "type": "composition"}, {"targetBrickId": "trpl", "type": "composition"}, {"targetBrickId": "bils", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "Health insurers and municipalities", "type": "payer", "interface": "Contract documents, tariffs, ceilings and quality conditions", "description": "Define the contract parameters that the practice monitors against its registrations and declarations."}, {"system": "Nivel, NZa and professional associations", "type": "regulatory-source", "interface": "Published sector statistics and benchmarks", "description": "Provide sector reference figures (for example Nivel practice registrations) that owners compare their practice with."}, {"system": "Business intelligence and spreadsheet tools", "type": "analytics-tool", "interface": "Export and data connections", "description": "Receive exports for owners and institutions that build their own analyses on top of the platform's data."}], "externalSystemsDependingOnThisStream": [], "owningTeams": []};
    const related_bricks = [{"id": "bidb", "name": "Practice BI Dashboards and Reporting", "type": "full-stack", "status": "sustaining", "description": "The BI tooling that SpotOnMedics markets and that HCI One brings to every label, used by practice owners to run the business: production per therapist and location, revenue by insurer and product, average treatment duration and treatments per episode, referrer analysis, waiting times, no-show rates, declaration acceptance and outstanding patient invoices, refreshed as registrations happen. Practice owners compare locations and therapists, GGZ institutions monitor contract ceilings and waiting lists, and HCI's own account managers use the same figures to spot practices that need help. Dashboards read from every operational brick but never own the underlying facts.", "links": [{"group": "Evidence", "description": "Real-world evidence related to this product brick.", "links": [{"label": "Evidence Explorer", "link": "../../../../evidence-explorer/index.html", "description": "Search evidence \u2014 source repositories, cloud resources, and contacts. Refine with ?q=<query> to pre-filter for this product brick.", "embedLink": "../../../../evidence-explorer/index.html?embed=1"}]}], "layers": [{"layer": "ui", "description": "User-facing web, mobile, backoffice, and operator experience modules.", "modules": [{"id": "module-bidb-web", "name": "Practice Dashboard", "type": "web-component", "description": "Dashboard with period, location and therapist filters, KPI tiles, trend charts, referrer and insurer breakdowns, drill-down to episode and claim lists and scheduled PDF or Excel exports.", "dependencies": {"modules": [{"moduleId": "module-bidb-api", "type": "uses", "description": "Dashboard reads snapshots and drill-downs through the Reporting API."}]}}]}, {"layer": "interfaces", "description": "APIs, BFFs, and explicit service boundary interfaces exposed to clients or other systems.", "modules": [{"id": "module-bidb-api", "na odule-iden-api", "sourceModuleId": "module-bidb-api", "type": "identity", "description": "Resolves whether the viewer is a practice owner or institution manager with tenant-wide scope, a therapist limited to their own figures or an HCI account manager, and scopes every dashboard query accordingly."}, {"targetBrickId": "audt", "moduleId": "module-audt-ingest-queue", "sourceModuleId": "module-bidb-store", "type": "audit", "description": "Publishes dashboard access and export events to the audit log queue so that exports of patient-level drill-downs are traceable to the person who ran them."}], "externalSystemsThisBrickDependsOn": [], "externalSystemsDependingOnThisBrick": [], "domain": "Paramedical Practice Management and EPD", "group": "Insight and Quality"}, {"id": "qdat", "name": "Quality Data Delivery (LDF, Keurmerk, Benchmarks)", "type": "integration", "status": "sustaining", "description": "The monthly pseudonymised delivery of treatment and outcome data from the EPD to the Landelijke Database Fysiotherapie and, through it, the Keurmerk Fysiotherapie practice register and insurer quality conditions, under the opt-in consent that each patient gives in the practice; plus the patient experience surveys (PREM) run through Qualiview and MediQuest and the practice benchmarks that come back from these registers. The brick selects episodes with consent, pseudonymises identifiers, validates the extract against the register's specification, delivers it, records the receipt and shows the practice what was delivered and what was refused. Delivering without consent or with identifiable data is the failure mode it is designed to make impossible.", "links": [{"group": "Evidence", "description": "Real-world evidence related to this product brick.", "links": [{"label": "Evidence Explorer", "link": "../../../../evidence-explorer/index.html", "description": "Search evidence \u2014 source repositories, cloud resources, and contacts. Refine with ?q=<query> to pre-filter for this product brick.", "embedLink": "../../../../evidence-explorer/index.html?embed=1"}]}], "layers": [{"layer": "ui", "description": "User-facing web, mobile, backoffice, and operator experience modules.", "modules": [{"id": "module-qdat-web", "name": "Quality Delivery Status", "type": "web-component", "description": "Per-practice overview of monthly deliveries, episodes included and excluded with reasons (no consent, incomplete dossier), register receipts and validation errors, PREM invitation status and benchmark reports received.", "dependencies": {"modules": [{"moduleId": "module-qdat-api", "type": "uses", "description": "Status screens read deliveries and receipts through the Quality Data API."}]}}]}, {"layer": "interfaces", "description": "APIs, BFFs, and explicit service boundary interfaces exposed to clients or other systems.", "modules": [{"id": "module-qdat-api", "name": "Quality Data API", "type": "api", "description": "API to configure register participation per practice, preview and trigger extracts, query delivery status and retrieve benchmark results; used by the status screen, dashboards and HCI support.", "dependencies": {"modules": [{"moduleId": "module-qdat-pseudonymiser", "type": "delegates", "description": "Interface delegates extract preview to the Extract Pseudonymiser."}, {"moduleId": "module-qdat-store", "type": "delegates", "description": "Interface delegates persistence to the Quality Extract Store."}]}}]}, {"layer": "worker", "description": "Background workers, event consumers, daemons, and asynchronous processing modules.", "modules": [{"id": "module-qdat-extract-daemon", "name": "Monthly Extract Scheduler", "type": "daemon", "description": "Runs the monthly delivery per participating practice: selects closed and running episodes with valid consent, builds the extract, validates it against the register specification, delivers it and stores the receipt.", "dependencies": {"modules": [{"moduleId": "module-qdat-pseudonymiser", "type": "uses", "description": "Scheduler builds extracts through the pseudonymiser."}, {"moduleId": "module-qdat-ldf-adapter", "type": "uses", "description": "Scheduler delivers extracts through the register adapter."}, {"moduleId": "module-qdat-store", "type": "processes", "description": "Scheduler records extracts, receipts and exclusions."}]}}]}, {"layer": "stateless-service", "description": "Stateless orchestration services that aggregate other services without owning durable state.", "modules": [{"id": "module-qdat-pseudonymiser", "name": "Extract Pseudonymiser", "type": "stateless-service", "description": "Maps episode, measurement and practice data to the register's data model, replaces patient identifiers with register pseudonyms, drops free text and validates completeness and code sets before anything leaves the platform.", "dependencies": {"modules": [{"moduleId": "module-qdat-store", "type": "uses", "description": "Pseudonymiser reads register specifications and pseudonym keys."}]}}]}, {"layer": "service", "description": "Stateful services and domain service modules that own behavior, policy, workflow, data, or operations.", "modules": [{"id": "module-qdat-store", "name": "Quality Extract Store", "type": "stateful-service", "description": "Owns register participation settings, extracts with inclusion and exclusion lists, delivery receipts, validation errors, PREM invitations and benchmark reports per practice."}]}, {"layer": "integration", "description": "Connectors, adapters, and integration modules for external systems, devices, or partner platforms.", "modules": [{"id": "module-qdat-ldf-adapter", "name": "Quality Register Adapter", "type": "integration", "description": "Adapter to the LDF delivery service and the Keurmerk Fysiotherapie register, and to the delivery formats of other discipline registers, with specification versioning and receipt handling.", "dependencies": {"modules": [{"moduleId": "module-qdat-store", "type": "uses", "description": "Adapter reads delivery             .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

    function getFlows() {
        return currentStream.flows || [];
    }

    function getFlowDependencies(flow) {
        const dependencyIndex = new Map();
        (flow.steps || []).forEach(step => {
            (step.dependencies || []).forEach(dependency => {
                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());
    }

    function getStepDependency(step, dependency) {
        return (step.dependencies || []).find(item => (item.type || '') === (dependency.type || '') && (item.id || '') === (dependency.id || '')) || null;
    }

    function getPrimaryActors() {
        const streamJobs = currentStream.supportedCustomerJobs || [];
        const allJobs = streamJobs.length ? streamJobs : supported_jobs;
        return dedupe(allJobs.map(item => item.customerName || item.customerGroup || '').filter(Boolean), item => item);
    }

    function summarizeFlow(flow) {
        const steps = flow.steps || [];
        const firstStep = steps[0] || {};
        const lastStep = steps[steps.length - 1] || {};
        return {
            actor: flow.primaryActor || firstStep.actor || '',
            trigger: flow.trigger || firstStep.trigger || '',
            result: flow.successSignal || flow.outcome || lastStep.successSignal || lastStep.output || ''
        };
    }

    function renderStepMeta(label, value) {
        if (!value) {
            return '';
        }
        return '<div class="flow-step-meta-item"><div class="flow-step-meta-label">' + escapeHtml(label) + '</div><div class="flow-step-copy">' + escapeHtml(value) + '</div></div>';
    }

    function flowDependencyIconFile(dependency) {
        const dependencyId = dependency.id || '';
        const linkedBrick = related_bricks.find(brick => brick.id === dependencyId) || all_bricks.find(brick => brick.id === dependencyId) || {};
        return dependency.icon || linkedBrick.icon || (dependencyId ? dependencyId + '.png' : 'brick.png');
    }

    function renderFlowDependencyIcon(dependency, className) {
        return '<img class="' + escapeHtml(className) + '" src="../icons/' + escapeHtml(flowDependencyIconFile(dependency)) + '" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
    }

    function renderStepDependencyPills(step) {
        const dependencies = step.dependencies || [];
        if (!dependencies.length) {
            return '<div class="muted">No step-specific dependencies listed.</div>';
        }

        return '<div class="flow-step-dependencies">' + dependencies.map(dep => {
            const label = dep.name || dep.id || 'Dependency';
            const kind = 'Brick';
            return '<span class="flow-cell-brick">' + renderFlowDependencyIcon(dep, 'flow-cell-brick-icon') + '<span>' + escapeHtml(kind + ': ' + label) + '</span></span>';
        }).join('') + '</div>';
    }

    function simplifySupportCopy(value) {
        const text = String(value || '').trim();
        if (!text) {
            return '';
        }
        const simplified = text.replace(/^Supports .*? by helping users help /i, 'Facilitate ');
        return simplified;
    }
</script>

<script>
    function streamMetaPath(stream) {
        const parts = [];
        if (stream.group) {
            parts.push(stream.group);
        }
        if (stream.rootGroup && stream.rootGroup !== stream.group) {
            parts.push(stream.rootGroup);
        }
        if (!parts.length) {
            parts.push('Stream');
        }
        return parts.join(' / ');
    }

    let headerHtml = '<div class="nav-strip">';
    allStreams.forEach(item => {
        headerHtml += '<a class="nav-link" href="' + escapeHtml(item.id) + '.html">';
        headerHtml += '<img src="../icons/' + escapeHtml(item.icon || 'stream.png') + '" class="' + (item.id === currentStream.id ? 'tab-image-selected' : 'tab-image') + '" alt="" onerror="this.onerror=null;this.src=\'../icons/stream.png\'">';
        headerHtml += '</a>';
    });
    headerHtml += '</div>';

    headerHtml += '<div class="page">';
    headerHtml += '<div class="header">';
    headerHtml += '<img class="header-icon" src="../icons/' + escapeHtml(currentStream.icon || 'stream.png') + '" alt="" onerror="this.onerror=null;this.src=\'../icons/stream.png\'">';
    headerHtml += '<div>';
    headerHtml += '<div class="header-meta">';
    headerHtml += '<div class="page-type-badge">Stream</div>';
    headerHtml += escapeHtml(streamMetaPath(currentStream)) + ' / <span style="color:blue;font-weight:bold;">' + escapeHtml((currentStream.id || '').toUpperCase()) + '</span></div>';
    headerHtml += '<div class="header-title">' + escapeHtml(currentStream.name || currentStream.id) + '</div>';
    headerHtml += '<div class="header-copy">' + escapeHtml(currentStream.description || '') + '</div>';
    headerHtml += '</div></div></div>';
    document.getElementById('Header').innerHTML = headerHtml;

    function renderHome() {
        const flows = getFlows();
        const totalSteps = flows.reduce((count, flow) => count + ((flow.steps || []).length), 0);
        const primaryActors = getPrimaryActors();
        let html = '';

        html += '<div class="group"><div class="section-title">Flow Narratives (' + flows.length + ')</div>';
        if (!flows.length) {
            html += '<div class="muted">No flows listed for this stream.</div>';
        } else {
            html += '<div class="card-grid">';
            flows.forEach(flow => {
                const summary = summarizeFlow(flow);
                html += '<div class="card">';
                html += '<div class="card-meta">' + escapeHtml(streamMetaPath(currentStream)) + '</div>';
                html += '<div class="card-title">' + escapeHtml(flow.title || flow.id) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(flow.description || '') + '</div>';
                html += '<div class="muted">' + ((flow.steps || []).length) + ' steps</div>';
                if (summary.actor) {
                    html += '<div class="card-copy"><strong>Actor:</strong> ' + escapeHtml(summary.actor) + '</div>';
                }
                if (summary.trigger) {
                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Outcomes</div>';
        if (!(currentStream.outcomes || []).length) {
            html += '<div class="muted">No outcomes listed for this stream.</div>';
        } else {
            html += '<div class="card"><ul class="list">' + currentStream.outcomes.map(outcome => '<li>' + escapeHtml(outcome) + '</li>').join('') + '</ul></div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Supporting Product Bricks</div>';
        if (!related_bricks.length) {
            html += '<div class="muted">No linked product bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            related_bricks.forEach(brick => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../landing_pages/' + escapeHtml(brick.id) + '.html">';
                html += '<div class="card-meta">' + escapeHtml((brick.group || brick.domain || 'Product Brick')) + '</div>';
                html += '<div class="card-header">';
                html += '<img class="card-icon" src="../icons/' + escapeHtml(brick.id) + '.png" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
                html += '<div class="card-title">' + escapeHtml(brick.name || brick.id) + '</div>';
                html += '</div>';
                html += '<div class="card-copy">' + escapeHtml(brick.description || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Linked Products</div>';
        if (!linked_products.length) {
            html += '<div class="muted">No linked products were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            linked_products.forEach(product => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../../product-deployments/landing_pages/' + escapeHtml(product.id) + '.html">';
                html += '<div class="card-meta">' + escapeHtml(product.type || 'Product') + '</div>';
                html += '<div class="card-header">';
                html += '<img class="card-icon" src="../../product-deployments/icons/' + escapeHtml(product.icon) + '" alt="" onerror="this.onerror=null;this.src=\'../../product-deployments/icons/product.png\'">';
                html += '<div class="card-title">' + escapeHtml(product.name || product.id) + '</div>';
                html += '</div>';
                html += '<div class="card-copy">' + escapeHtml(product.whyUsed || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Related Teams</div>';
        if (!related_teams.length) {
            html += '<div class="muted">No teams were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            related_teams.forEach(team => {
                html += '<a class="card" target="_blank" rel="noopener noreferrer" href="../../teams/landing_pages/' + escapeHtml(team.teamId) + '.html">';
                html += '<div class="card-meta">' + escapeHtml(team.roleLabel || team.teamType || 'Team') + '</div>';
                html += '<div class="card-title">' + escapeHtml(team.teamName || team.teamId) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(team.groupName || '') + '</div>';
                html += '</a>';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div class="group"><div class="section-title">Supported Customer Jobs</div>';
        if (!supported_jobs.length) {
            html += '<div class="muted">No customer jobs were inferred from the supporting bricks.</div>';
        } else {
            html += '<div class="card-grid">';
            supported_jobs.forEach(job => {
                html += '<div class="card">';
                html += '<div class="card-meta">' + escapeHtml(job.customerGroup || '') + (job.productName ? ' | ' + escapeHtml(job.productName) : '') + '</div>';
                html += '<div class="card-title">' + escapeHtml(job.jobName || job.jobId) + '</div>';
                html += '<div class="card-copy">' + escapeHtml(job.jobOutcome || job.jobWhatItIs || '') + '</div>';
                if (job.supportRationale) {
                    html += '<div class="card-copy"><strong>Why this stream matters here:</strong> ' + escapeHtml(job.supportRationale) + '</div>';
                }
                if ((job.usedInSteps || []).length) {
                    html += '<ul class="list">' + job.usedInSteps.map(step => '<li>' + escapeHtml(step.step || step.description || '') + '</li>').join('') + '</ul>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        html += '</div>';

        document.getElementById('tab_content_home').innerHTML = html;
    }

    function renderFlows() {
        const flows = getFlows();
        const totalSteps = flows.reduce((count, flow) => count + ((flow.steps || []).length), 0);
        let html = '';

        document.getElementById('tab_flows').innerHTML = 'Flow Narratives (' + flows.length + ')';

        flows.forEach(flow => {
            const dependenciesInFlow = getFlowDependencies(flow);
            const summary = summarizeFlow(flow);
            html += '<div class="group">';
            html += '<div class="section-title">Flow</div>';
            html += '<div class="flow-title">' + escapeHtml(flow.title || flow.id) + '</div>';
            html += '<div class="flow-description">' + escapeHtml(flow.description || '') + '</div>';
            if (summary.actor || summary.trigger || summary.result) {
                html += '<div class="card" style="margin-bottom:16px;">';
                if (summary.actor) {
                    html += '<div class="card-copy"><strong>Primary actor:</strong> ' + escapeHtml(summary.actor) + '</div>';
                }
                if (summary.trigger) {
                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';
                }
                html += '</div>';
            }

            html += '<div class="section-title">Dependency Traceability</div>';
            html += '<div class="flow-matrix-wrap">';
            html += '<table class="flow-matrix">';
            html += '<thead>';
            html += '<tr><th class="flow-dependency-col"></th>';
            (flow.steps || []).forEach((step, index) => {
                html += '<th class="flow-step-col"><div class="flow-step-label">Step ' + (index + 1) + '</div><div class="card-title">' + escapeHtml(step.title || step.id) + '</div></th>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right">Key Facts</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkblue">';
                if ((step.keyFacts || []).length) {
                    html += '<ul class="flow-insight-list">' + step.keyFacts.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No key facts listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right; color: darkred">Pain Points</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkred">';
                if ((step.painPoints || []).length) {
                    html += '<ul class="flow-insight-list">' + step.painPoints.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No pain points listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';
            html += '</thead><tbody>';

            dependenciesInFlow.forEach(dependency => {
                const dependencyTypeLabel = 'Product Brick';
                html += '<tr>';
                html += '<td>';
                html += '<div class="flow-dependency-header">';
                html += renderFlowDependencyIcon(dependency, 'flow-dependency-icon');
                html += '<div>';
                html += '<a class="flow-dependency-name" href="../landing_pages/' + escapeHtml(dependency.id) + '.html">' + escapeHtml(dependency.name || dependency.id) + '</a>';
                if (dependency.interface) {
                    html += '<div class="muted">' + escapeHtml(dependency.interface) + '</div>';
                }
                html += '</div>';
                html += '</div>';
                html += '</td>';
                (flow.steps || []).forEach(step => {
                    const stepDependency = getStepDependency(step, dependency);
                    if (!stepDependency) {
                        html += '<td class="flow-cell-empty">-</td>';
                        return;
                    }
                    html += '<td class="flow-cell-active">';
                    html += '<div class="flow-cell-copy">' + escapeHtml(simplifySupportCopy(stepDependency.how || stepDependency.description || 'Supports this step.')) + '</div>';
                    html += '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            html += '</div>';
            html += '</div>';
        });

        document.getElementById('tab_content_flows').innerHTML = html;
    }

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';
        }
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-title">' + escapeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                count++;
                html += '<div class="link-entry">';
                html += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(link.link || '#') + '">'
                    + escapeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>

      "link": "../index.html",

    }

}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
