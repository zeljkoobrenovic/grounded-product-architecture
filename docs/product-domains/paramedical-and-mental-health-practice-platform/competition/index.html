    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>

ative (HCI) is the modeled subject of this domain: a Dutch healthcare software group that, under the mission 'Better care, made easy', delivers practice management and EPD software to paramedical practices (HCI One, FysioRoadmap, SpotOnMedics, Incura, Evry, ParaNICE), the HCI CRS EPD to GGZ and youth care providers, the Uw Zorg Online and Quli patient environments and personal health environment, and the Embloom, Emogy and NICE Connect e-health propositions, all on a NEN 7510 and ISO 27001 certified open cloud platform. It has been built since a 2021 Vortex Capital Partners buyout with founder Eric de Boer through more than 14 add-on acquisitions (Incura, CRS, FysioRoadmap, Winbase, Ensemble/Evry, Footfit/PodoFile, NICE Software, Uw Zorg Online, Quli, Praktijkinfo, Embloom, SpotOnMedics, Trompbx, LogicData, Abakus, Edevop), reported a turnover of about EUR 20 million in late 2023 and has been led by CEO Robin Dunki Jacobs since 1 May 2025. Its current programme, HCI One, consolidates the acquired paramedical labels on the web-based FysioRoadmap foundation discipline by discipline without a forced migration deadline. It is listed here so that the other players' figures can be read against its own 40,000+ professionals and 4 million+ patients.", "businessStats": [{"metric": "professionals_served", "value": "40,000+ healthcare professionals supported every day", "period": "accessed 2026-09-05", "scope": "company (all labels)", "sourceTitle": "Health Cloud Initiative - home", "sourceUrl": "https://hci-software.com/"}, {"metric": "patients_reached", "value": "4 million+ patients reached through the patient environments and practice software", "period": "accessed 2026-09-05", "scope": "company (all labels)", "sourceTitle": "Health Cloud Initiative - home", "sourceUrl": "https://hci-software.com/"}, {"metric": "employees", "value": "250+ employees in the Netherlands and Switzerland", "period": "published 2025-05-28", "scope": "company", "sourceTitle": "Robin Dunki Jacobs appointed as new CEO of HCI - Vortex", "sourceUrl": "https://vortexcp.com/news/robin-dunki-jacobs-appointed-as-new-ceo-of-hci/"}, {"metric": "certification", "value": "NEN 7510 and ISO 27001 certified", "period": "accessed 2026-09-05", "scope": "company", "sourceTitle": "Health Cloud Initiative - home", "sourceUrl": "https://hci-software.com/"}, {"metric": "ownership", "value": "Vortex Capital Partners buyout in 2021 together with founder Eric de Boer, executing a buy-and-build strategy with more than 14 add-on acquisitions since", "period": "accessed 2026-09-05", "scope": "company", "sourceTitle": "Health Cloud Initiative - Vortex", "sourceUrl": "https://vortexcp.com/investment/hci/"}, {"metric": "scale_at_investment_announcement", "value": "7,500+ healthcare professionals, EUR 500 million+ in annual declarations, a team of 45+ and 2 million+ patients, with the ambition to relieve the administrative burden of 20,000 professionals", "period": "published 2022-06-13", "scope": "company at the June 2022 investment announcement (trade-press report of the company announcement)", "sourceTitle": "Vortex Capital Partners investeert in Health Cloud Initiative - Dutch IT Channel", "sourceUrl": "https://www.dutchitchannel.nl/news/182179/vortex-capital-partners-investeert-in-health-cloud-initiative"}, {"metric": "market_position", "value": "described as market leader in physiotherapy software supporting '1 in 4 paramedics' in the Netherlands after the SpotOnMedics acquisition", "period": "published 2024-08-26", "scope": "company (self-reported in the August 2024 press release)", "sourceTitle": "Persbericht: SpotOnMedics en Health Cloud Initiative bundelen krachten", "sourceUrl": "https://www.hci-software.com/en/persbericht-spotonmedics-en-health-cloud-initiative-bundelen-krachten/"}, {"metric": "e_health_content", "value": "Embloom library of 500+ questionnaires and 450 e-health interventions fully integrated in the EPD", "period": "accessed 2026-09-05", "scope": "product (Embloom)", "sourceTitle": "Embloom - Health Cloud Initiative", "sourceUrl": "https://hci-software.com/embloom/"}, {"metric": "patient_app_users", "value": "3 million+ Uw Zorg Online app users, active for 20+ years", "period": "accessed 2026-09-05", "scope": "product (Uw Zorg Online)", "sourceTitle": "Uw Zorg Online - Health Cloud Initiative", "sourceUrl": "https://hci-software.com/uw-zorg-online/"}], "links": {"website": "https://hci-software.com/", "investor_page": "https://vortexcp.com/investment/hci/", "ceo_announcement": "https://vortexcp.com/news/robin-dunki-jacobs-appointed-as-new-ceo-of-hci/", "spotonmedics_press_release": "https://www.hci-software.com/en/persbericht-spotonmedics-en-health-cloud-initiative-bundelen-krachten/", "vortex_investor": "https://vortexcp.com/"}, "logo_path": "logos/hci.png"}, {"id": "intramed", "logo": "logos/intramed.png", "name": "Intramed (Convenient B.V.)", "hq": "Moordrecht, Netherlands", "category": "paramedical-practice-epd", "primaryRegions": ["europe"], "description": "Intramed is the practice software of Convenient B.V. in Moordrecht and the largest incumbent in Dutch physiotherapy practice software by the only published, and dated, measure: one EPD family (Intramed Compleet, Web, OnLine, Plus and Basis) for physiotherapy, podiatry, speech therapy, occupational therapy, GGZ, dietetics, exercise therapy, skin therapy, haptotherapy and osteopathy, extended with HealthTrain e-health, the MijnZorgApp patient app, Fysio.AI documentation, Intramed Insight and ParaBench benchmarking, the AfsprakenApp, a GGZ practice dashboard, Intramed Financieel and D-Pay payments. Convenient presents itself as the first practice software supplier certified for NEN 7510 and holds ISO 9001 and ISO/IEC 27001, and offers a three-month free trial. A 2017 Marktdata survey calculated a 53 percent share among physiotherapy practices, a dated third-party figure that still frames the market HCI One must win: Intramed competes head-to-head with FysioRoadmap, SpotOnMedics and Incura on multidisciplinary breadth, AI documentation and the patient app, while HCI counters with the consolidated HCI One platform, the Uw Zorg Online front door and billing services.", "businessStats": [{"metric": "product_scope", "value": "practice software for physiotherapy, podiatry, speech therapy, occupational therapy, GGZ, dietetics, exercise therapy, skin therapy, haptotherapy and osteopathy (Intramed Compleet, Web, OnLine, Plus, Basis)", "period": "accessed 2026-09-05", "scope": "product family", "sourceTitle": "Intramed - home", "sourceUrl": "https://www.intramed.nl/"}, {"metric": "certification", "value": "ISO 9001, ISO/IEC 27001 and NEN 7510 certified; presented as the first practice software supplier certified for NEN 7510", "period": "accessed 2026-09-05", "scope": "company (Convenient B.V.)", "sourceTitle": "Intramed - home", "sourceUrl": "https://www.intramed.nl/"}, {"metric": "free_trial", "value": "3 months free trial", "period": "accessed 2026-09-05", "scope": "product (published offer)", "sourceTitle": "Intramed - home", "sourceUrl": "https://www.intramed.nl/"}, {"metric": "market_share", "value": "53 percent calculated market share among physiotherapy practices", "period": "2017", "scope": "2017 Marktdata survey of physiotherapy practices; third-party, dated", "sourceTitle": "Marktdata - marktonderzoek fysiotherapie 2017", "sourceUrl": "https://www.marktdata.nl/"}], "links": {"website": "https://www.intramed.nl/", "market_survey": "https://www.marktdata.nl/"}, "logo_path": "logos/intramed.png"}, {"id": "fysiomanager", "logo": "logos/fysiomanager.png", "name": "Fysiomanager", "hq": "Heerenveen, Netherlands", "category": "paramedical-practice-epd", "primaryRegions": ["europe"], "description": "Fysiomanager is a Heerenveen-based, fully browser-based EPD and practice management system for paramedics that bundles the agenda, dossier and declarations with FM-VideoConsult, online scheduling, the MijnZorgtoegang patient portal, FM Analytics, a Twinfield accounting link and iDEAL/Wero payments, with multi-location use included in the subscription. It is NEN 7510 and ISO/IEC 27001 certified and publishes a customer satisfaction of about 90 percent. Because it also integrates with SpotOnMedics and Intramed, it appears both as a direct alternative for the physiotherapy practice owner choosing between FysioRoadmap, SpotOnMedics and HCI One, and as a neighbour in the same integration ecosystem (Physitrack, Twinfield, Vecozo); HCI's answer is the breadth of HCI One and its patient front door rather than price.", "businessStats": [{"metric": "certification", "value": "NEN 7510 and ISO/IEC 27001 certified", "period": "accessed 2026-09-05", "scope": "company", "sourceTitle": "Fysiomanager - home", "sourceUrl": "https://www.fysiomanager.nl/"}, {"metric": "customer_satisfaction", "value": "about 90 percent customer satisfaction", "period": "accessed 2026-09-05", "scope": "company (self-reported on the website)", "sourceTitle": "Fysiomanager - home", "sourceUrl": "https://www.fysiomanager.nl/"}, {"metric": "plans", "value": "browser-based EPD with multi-location use included; FM-VideoConsult, online scheduling, MijnZorgtoegang portal, FM Analytics, Twinfield and iDEAL/Wero add-ons", "period": "accessed 2026-09-05", "scope": "product (published plan scope)", "sourceTitle": "Fysiomanager - home", "sourceUrl": "https://www.fysiomanager.nl/"}], "links": {"website": "https://www.fysiomanager.nl/"}, "logo_path": "logos/fysiomanager.png"}, {"id": "crossuite", "logo": "logos/crossuite.png", "name": "Crossuite", "hq": "Belgium and Netherlands", "category": "paramedical-practice-epd", "primaryRegions": ["europe"], "description": "Crossuite is a Belgian-Dutch cloud practice platform for nine disciplines including physiotherapy, speech therapy, psychology, podiatry and dietetics, sold across the Benelux and beyond with agenda, dossier, invoicing and patient communication in one subscription. It reports 10,000 practitioners in 13 countries, 98 percent customer satisfaction and 18 years of operation. Its multidisciplinary, cross-border positioning is the closest analogue to HCI One's ambition of one platform for every paramedical discipline, but it does not lead with the Dutch-specific depth on which HCI's labels compete (GDS801 declarations through Vecozo, LDF and Keurmerk delivery, the Uw Zorg Online front door), so in the Netherlands it competes mainly for small multidisciplinary practices and solo allied health therapists who value simplicity and cross-border reach over Dutch-specific compliance depth.", "businessStats": [{"metric": "practitioners", "value": "10,000 practitioners", "period": "accessed 2026-09-05", "scope": "platform (self-reported)", "sourceTitle": "Crossuite - home", "sourceUrl": "https://www.crossuite.com/"}, {"metric": "countries_served", "value": "13 countries", "period": "accessed 2026-09-05", "scope": "company (self-reported)", "sourceTitle": "Crossuite - home", "sourceUrl": "https://www.crossuite.com/"}, {"metric": "customer_satisfaction", "value": "98 percent customer satisfaction", "period": "accessed 2026-09-05", "scope": "company (self-reported)", "sourceTitle": "Crossuite - home", "sourceUrl": "https://www.crossuite.com/"}, {"metric": "years_of_operation", "value": "18 years", "period": "accessed 2026-09-05", "scope": "company (self-reported)", "sourceTitle": "Crossuite - home", "sourceUrl": "https://www.crossuite.com/"}], "links": {"website": "https://www.crossuite.com/"}, "logo_path": "logos/crossuite.png"}, {"id": "james-software", "logo": "logos/james-software.png", "name": "James Software", "hq": "Netherlands", "category": "paramedical-practice-epd", "primaryRegions": ["europe"], "description": "James Software is a Dutch paramedical EPD and practice management package that is listed among the physiotherapy software options in Physitrack's 2026 comparison of Dutch EPD systems alongside Intramed, Incura, Abakus, Fysiomanager and SpotOnMedics. It competes for the same physiotherapy practice owners and allied health therapists that HCI One, FysioRoadmap and SpotOnMedics target, typically on ease of use and price for smaller practices. No business statistic could be verified on an official James Software page within this domain's research scope, so its entry carries a description only.", "businessStats": [], "links": {"website": "https://www.jamessoftware.nl/", "third_party_comparison": "https://www.physitrack.com/insights/fysiotherapie-software-vergelijken"}, "logo_path": "logos/james-software.png"}, {"id": "nedap-ons", "logo": "logos/nedap-ons.png", "name": "Nedap Ons (Nedap N.V.)", "hq": "Groenlo, Netherlands", "category": "ggz-institution-epd-ecd", "primaryRegions": ["europe"], "description": "Nedap Ons is the electronic client record suite of the listed Nedap N.V. in Groenlo, used across long-term care (VVT), disability care (GHZ), GGZ and home help (HBH), and it operates the Caren client and family portal. Nedap reports more than 1,900 care organisations and approximately 400,000 care professionals on Ons, and the M&I/Partners 2025 inventory counts 14 of the 50 largest GGZ organisations (27 percent) on Nedap, closing in on the market leader after GGZ Friesland switched to Nedap, with the Caren portal at 22.5 percent of those organisations. For HCI this is the dominant alternative when a mid-sized or large GGZ institution selects an ECD, competing with HCI CRS on institutional scale, integrated portal and ecosystem (Therapieland integrates with Ons), whereas HCI CRS, Embloom and Quli target GGZ practices, youth care and institutions that want an EPD with e-health and a PGO front door.", "businessStats": [{"metric": "customers", "value": "over 1,900 care organisations", "period": "accessed 2026-09-05", "scope": "company (Nedap healthcare, all sectors)", "sourceTitle": "Nedap Ons - home", "sourceUrl": "https://www.nedap-ons.nl/"}, {"metric": "professionals_served", "value": "approximately 400,000 care professionals", "period": "accessed 2026-09-05", "scope": "platform (Nedap healthcare, all sectors)", "sourceTitle": "Nedap Ons - home", "sourceUrl": "https://www.nedap-ons.nl/"}, {"metric": "market_share", "value": "14 of the 50 largest GGZ organisations (27 percent), up after GGZ Friesland switched to Nedap", "period": "data as of 2025-07-01", "scope": "top-50 GGZ organisations by revenue, M&I/Partners 2025 inventory (data as of 1 July 2025); third-party inventory", "sourceTitle": "EPD-inventarisatie GGZ 2025: Nedap nadert marktleider (M&I/Partners)", "sourceUrl": "https://mxi.nl/kennis/733/epd-inventarisatie-ggz-2025-nedap-nadert-marktleider"}, {"metric": "portal_share", "value": "Caren client portal in use at 22.5 percent of the 50 largest GGZ organisations", "period": "data as of 2025-07-01", "scope": "client portals in use at the top-50 GGZ organisations by revenue, M&I/Partners 2025 inventory; third-party inventory", "sourceTitle": "EPD-inventarisatie GGZ 2025: Nedap nadert marktleider (M&I/Partners)", "sourceUrl": "https://mxi.nl/kennis/733/epd-inventarisatie-ggz-2025-nedap-nadert-marktleider"}], "links": {"website": "https://www.nedap-ons.nl/", "market_inventory": "https://mxi.nl/kennis/733/epd-inventarisatie-ggz-2025-nedap-nadert-marktleider"}, "logo_path": "logos/nedap-ons.png"}, {"id": "sdb-groep", "logo": "logos/sdb-groep.png", "name": "SDB Groep (USER EPD and Karify)", "hq": "Netherlands", "category": "ggz-institution-epd-ecd", "primaryRegions": ["europe"], "description": "SDB Groep is a Dutch care software group with more than 45 years in care that owns the USER GGZ EPD (developed by Avinty and part of SDB Groep since 1 April 2023) and the Karify client portal and e-health environment. The M&I/Partners 2025 inventory places SDB Groep as market leader with 15 of the 50 largest GGZ organisations (30 percent) and the Karify portal at 22.5 percent, although it lost GGZ Friesland to Nedap in 2025. It is the incumbent institutional EPD that HCI CRS meets in large G 000 users, ISO 27001:2022 and NEN 7510-1:2017 certification and CE marking as a Class I medical device, with customers such as GGZ Delfland, GGZ NHN, Lentis and Tactus. It is both a partner (it integrates with HCI CRS) and a competitor of Embloom and Emogy for the blended-care content and client-environment budget of GGZ institutions, and of Quli for the client-facing app. HCI's counter is that Embloom's 500+ questionnaires and 450 interventions are fully integrated in its own EPD rather than delivered as a separate platform.", "businessStats": [{"metric": "users", "value": "250,000+ users", "period": "accessed 2026-09-05", "scope": "platform (self-reported)", "sourceTitle": "Minddistrict - home", "sourceUrl": "https://www.minddistrict.com/"}, {"metric": "certification", "value": "ISO 27001:2022 and NEN 7510-1:2017 certified; CE Class I medical device", "period": "accessed 2026-09-05", "scope": "company and product", "sourceTitle": "Minddistrict - home", "sourceUrl": "https://www.minddistrict.com/"}], "links": {"website": "https://www.minddistrict.com/"}, "logo_path": "logos/minddistrict.png"}, {"id": "therapieland", "logo": "logos/therapieland.png", "name": "Therapieland", "hq": "Amsterdam, Netherlands", "category": "e-health-platform", "primaryRegions": ["europe"], "description": "Therapieland in Amsterdam calls itself the largest e-health platform of the Netherlands, with more than 300 online programmes and more than 200 questionnaires, integrated with HCI's GGZ EPD, Nedap Ons, Medicore, Careweb, Medicom and Ksyos and partnered with QuestManager. Like Minddistrict it is simultaneously an integration partner of HCI CRS and a competitor of Embloom for the e-health content and ROM questionnaire budget of GGZ institutions, POH-GGZ practices and independent practitioners. HCI's positioning is the EPD-native Embloom library and Emogy client app, while Therapieland sells vendor-neutral content across every major GGZ EPD.", "businessStats": [{"metric": "market_position", "value": "largest e-health platform of the Netherlands", "period": "accessed 2026-09-05", "scope": "company (self-claimed on the website)", "sourceTitle": "Therapieland - home", "sourceUrl": "https://www.therapieland.nl/"}, {"metric": "programmes", "value": "300+ online programmes", "period": "accessed 2026-09-05", "scope": "platform (self-reported)", "sourceTitle": "Therapieland - home", "sourceUrl": "https://www.therapieland.nl/"}, {"metric": "questionnaires", "value": "200+ questionnaires", "period": "accessed 2026-09-05", "scope": "platform (self-reported)", "sourceTitle": "Therapieland - home", "sourceUrl": "https://www.therapieland.nl/"}], "links": {"website": "https://www.therapieland.nl/"}, "logo_path": "logos/therapieland.png"}]};
    let showDetails = false;

    function escapeHtml(value) {
        return String(value || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function titleCase(value) {
        return String(value || '')
            .split('_')
            .filter(Boolean)
            .map(part => part.charAt(0).toUpperCase() + part.slice(1))
            .join(' ');
    }

    function firstLetterLogo(player) {
        return '<div class="player-logo-fallback">' + escapeHtml((player.name || '?').charAt(0).toUpperCase()) + '</div>';
    }

    function renderPlayerLogo(player) {
        const fallback = firstLetterLogo(player);
        if (!player.logo_path) {
            return fallback;
        }

        return ''
            + '<div class="player-logo-wrap">'
            + '<img class="player-logo" src="' + escapeHtml(player.logo_path) + '" alt="' + escapeHtml(player.name) + ' logo"'
            + ' onerror="this.style.display=\'none\'; if (this.nextElementSibling) { this.nextElementSibling.style.display=\'flex\'; }">'
            + '<div class="player-logo-fallback" style="display:none;">' + escapeHtml((player.name || '?').charAt(0).toUpperCase()) + '</div>'
            + '</div>';
    }

    function renderHero() {
        const players = competitionData.players || [];
        document.getElementById('heroSubtitle').innerHTML = escapeHtml(competitionData.scope && competitionData.scope.description || '');
        document.getElementById('heroMeta').innerHTML = ''
            + '<div class="meta-chip">Updated ' + escapeHtml(competitionData.generatedOn || '') + '</div>';
    }

    function renderScope() {
        const scope = competitionData.scope || {};
        document.getElementById('scopeCopy').textContent = scope.description || '';
        const notes = Array.isArray(scope.notes) ? scope.notes : (scope.notes ? [scope.notes] : []);
        document.getElementById('scopeNotes').innerHTML = notes.map(item => '<div class="pill">' + escapeHtml(item) + '</div>').join('');
    }

    function renderPlayer(player) {
        const logoHtml = renderPlayerLogo(player);
        const detailUrl = 'landing_pages/' + encodeURIComponent(player.id) + '.html';

        const stats = (player.businessStats || []).slice(0, 3).map(stat => ''
            + '<div class="stat-item">'
            + '<div class="stat-metric">' + escapeHtml(titleCase(stat.metric)) + '</div>'
            + '<div class="stat-value">' + escapeHtml(stat.value || '') + '</div>'
            + '<div class="stat-meta">' + escapeHtml((stat.period || '') + (stat.scope ? ' • ' + titleCase(stat.scope) : '')) + '</div>'
            + '</div>'
        ).join('');

        const links = Object.entries(player.links || {}).slice(0, 4).map(([key, value]) => ''
            + '<a class="link-item" href="' + escapeHtml(value) + '" target="_blank" rel="noopener noreferrer">'
            + '<div><strong>' + escapeHtml(titleCase(key)) + '</strong></div>'
            + '<div class="link-meta">' + escapeHtml(value) + '</div>'
            + '</a>'
        ).join('');

        const regions = (player.primaryRegions || []).map(region => '<div class="pill">' + escapeHtml(titleCase(region)) + '</div>').join('');

        return ''
            + '<div class="player-card" data-detail-url="' + escapeHtml(detailUrl) + '">'
            + '<div class="player-header">'
            + logoHtml
            + '<div>'
            + '<div class="category-chip">' + escapeHtml(titleCase(player.category || 'competitor')) + '</div>'
            + (player.role ? '<div class="category-chip" style="' + ({ direct: 'background:#fdecea;color:#b71c1c', substitute: 'background:#fff4e5;color:#8a4b00', benchmark: 'background:#eef2f7;color:#37474f' }[player.role] || '') + '">' + escapeHtml(({ direct: 'Direct', substitute: 'Substitute', benchmark: 'Benchmark' }[player.role] || player.role)) + '</div>' : '')
            + '<div class="player-name">' + escapeHtml(player.name || '') + '</div>'
            + '<div class="player-meta">' + escapeHtml(player.hq || '') + (player.regionRelevance ? ' · ' + escapeHtml(player.regionRelevance) : '') + '</div>'
            + '</div>'
            + '</div>'
            + '<div class="player-description">' + escapeHtml(player.description || '') + '</div>'
            + '<div class="section-title">Primary Regions</div>'
            + '<div class="regions-row">' + regions + '</div>'
            + '<div class="player-details-block' + (showDetails ? '' : ' details-hidden') + '">'
            + '<div class="section-title">Selected Stats</div>'
            + '<div class="stats-list">' + stats + '</div>'
            + '<div class="section-title">Official Links</div>'
            + '<div class="links-list">' + links + '</div>'
            + '</div>'
            + '</div>';
    }

    function renderPlayers() {
        document.getElementById('playersGrid').innerHTML = (competitionData.players || []).map(renderPlayer).join('');
        bindPlayerCardNavigation();
        syncDetailsToggle();
        syncPlayerTabLabel();
    }

    function bindPlayerCardNavigation() {
        document.querySelectorAll('.player-card').forEach(card => {
            card.addEventListener('click', function (event) {
                const interactive = event.target.closest('a, button');
                if (interactive) {
                    return;
                }
                const detailUrl = card.getAttribute('data-detail-url');
                if (detailUrl) {
                    window.open(detailUrl, '_blank');
                }
            });
        });
    }

    function syncDetailsToggle() {
        const button = document.getElementById('detailsToggleButton');
        if (!button) {
            return;
        }
        button.textContent = showDetails ? 'Hide details' : 'Show details';
        button.className = 'toggle-button' + (showDetails ? ' toggle-button-active' : '');
    }

    function toggleDetails() {
        showDetails = !showDetails;
        renderPlayers();
    }

    function syncPlayerTabLabel() {
        const button = document.getElementById('tab_PlayersTab');
        if (!button) {
            return;
        }
        button.textContent = 'Players (' + String((competitionData.players || []).length) + ')';
    }

    renderHero();
    renderScope();
    renderPlayers();
</script>
