<script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        document.getElementById('tab_' + resolvedTabName).className += ' active';
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

    function escapeHtml(value) {
        return (value || '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function linkOf(href, label, className) {
        if (!href) return '<span class="' + className + '">' + escapeHtml(label) + '</span>';
        return '<a class="entity-link ' + className + '" href="' + escapeHtml(href) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(label) + '</a>';
    }

    mermaid.initialize({startOnLoad: false, securityLevel: 'loose'});

    function renderActivity(items, sectionType) {
        if (!items || !items.length) {
            return '<div class="empty-state">No ' + escapeHtml(sectionType.toLowerCase()) + ' linked to this team.</div>';
        }
        let html = '';
        items.forEach(item => {
            html += '<div class="activity-block">';
            html += '<div class="activity-link">' + linkOf('../../' + item.sectionFolder + '/landing_pages/' + item.landingPageKey + '.html', item.description || sectionType, 'activity-link') + '</div>';
            html += '<div class="activity-meta">' + escapeHtml(item.date || '') + ' | ' + escapeHtml(item.teamRoleLabel || '') + '</div>';
            if (item.how) {
                html += '<div class="activity-meta" style="margin-top:4px">' + escapeHtml(item.how) + '</div>';
            }
            html += '</div>';
        });
        return html;
    }

    function renderCharterText(title, value, wide) {
        if (!value) return '';
        return '<div class="charter-block ' + (wide ? 'charter-block-wide' : '') + '">' +
            '<div class="charter-label">' + escapeHtml(title) + '</div>' +
            '<div class="charter-copy">' + escapeHtml(value) + '</div>' +
            '</div>';
    }

    function renderCharterList(title, items) {
        if (!items || !items.length) return '';
        let html = '<div class="charter-block"><div class="charter-label">' + escapeHtml(title) + '</div><ul class="charter-list">';
        items.forEach(item => {
            html += '<li>' + escapeHtml(item) + '</li>';
        });
        html += '</ul></div>';
        return html;
    }

    function renderCharterMetrics(metrics) {
        if (!metrics || !metrics.length) return '';
        let html = '<div class="charter-block charter-block-wide"><div class="charter-label">Metrics</div>';
        metrics.forEach(metric => {
            html += '<div class="metric-block">';
            html += '<div class="metric-name">' + escapeHtml(metric.name || '') + '</div>';
            if (metric.measuring) {
                html += '<div class="metric-meta">Measuring: ' + escapeHtml(metric.measuring) + '</div>';
            }
            if (metric.targetValue) {
                html += '<div class="metric-meta">Target value: ' + escapeHtml(metric.targetValue) + '</div>';
            }
            html += '</div>';
        });
        html += '</div>';
        return html;
    }

    function renderTeamCharter(charter) {
        if (!charter) return '';
        let html = '<div class="section"><div class="section-title">Team Charter</div><div class="charter-grid">';
        html += renderCharterText('Mission', charter.mission, true);
        html += renderCharterText('Vision', charter.vision, true);
        html += renderCharterText('Customers', charter.customers, true);
        html += renderCharterMetrics(charter.metrics || []);
        html += renderCharterText('Strategic Importance', charter.strategicImportance, true);
        html += renderCharterList('Major Risks', charter.majorRisks || []);
        html += renderCharterList('Provided Interfaces', charter.providedInterfaces || []);
        html += renderCharterList('Dependent Interfaces', charter.dependentInterfaces || []);
        html += '</div></div>';
        return html;
    }

    function renderAgentList(label, values) {
        if (!values || !values.length) return '';
        return '<div class="metric-meta"><strong>' + escapeHtml(label) + ':</strong> ' + values.map(value => escapeHtml(value)).join(', ') + '</div>';
    }

    function activityHref(item, fallbackFolder) {
        if (item.href) return item.href;
        if (item.landingPageKey === undefined || item.landingPageKey === null || item.landingPageKey === '') return '';
        return '../../' + fallbackFolder + '/landing_pages/' + item.landingPageKey + '.html';
    }

    function normalizeActivityArea(value) {
        if (value === 'ktlo' || value === 'current' || value === 'next') return value;
        return '';
    }

    function buildTeamActivityItems() {
        const items = [];
        (team.relatedInitiatives || []).forEach(item => {
            const area = normalizeActivityArea(item.planningArea || '');
            if (!area) return;
            items.push({
                type: 'initiative',
                typeLabel: 'Initiative',
                area: area,
                date: item.date || '',
                title: item.title || item.description || 'Initiative',
                description: item.description || '',
                href: activityHref(item, 'initiatives'),
                priority: item.priority || '',
                teamRoleLabel: item.teamRoleLabel || ''
            });
        });
        (team.relatedDiscoveries || []).forEach(item => {
            const area = normalizeActivityArea(item.planningArea || '');
            if (!area) return;
            items.push({
                type: 'discovery',
                typeLabel: 'Discovery',
                area: area,
                date: item.date || '',
                title: item.title || item.description || 'Discovery',
                description: item.description || '',
                href: activityHref(item, 'discoveries'),
                priority: '',
                teamRoleLabel: item.teamRoleLabel || '',
                how: item.how || ''
            });
        });
        (team.relatedKtlo || []).forEach(item => {
            items.push({
                type: 'initiative',
                typeLabel: 'Initiative',
                area: 'ktlo',
                date: item.date || '',
                title: item.title || item.description || 'KTLO',
                description: item.description || '',
                href: item.href || '../../objectives/ktlo/index.html',
                priority: item.priority || '',
                teamRoleLabel: item.teamRoleLabel || '',
                keyResultId: item.keyResultId || ''
            });
        });
        (team.relatedKtloDiscoveries || []).forEach(item => {
            items.push({
                type: 'discovery',
                typeLabel: 'Discovery',
                area: 'ktlo',
                date: item.date || '',
                title: item.title || item.description || 'KTLO discovery',
                description: item.description || '',
                href: item.href || '../../objectives/ktlo/index.html',
                priority: '',
                teamRoleLabel: item.teamRoleLabel || ''
            });
        });
        return items.sort((left, right) => String(right.date || '').localeCompare(String(left.date || '')));
    }

    function renderActivityCard(item) {
        let html = '<div class="activity-card" data-activity-type="' + escapeHtml(item.type) + '" data-activity-area="' + escapeHtml(item.area) + '">';
        html += '<div class="activity-type">' + escapeHtml(item.typeLabel) + '</div>';
        html += '<div class="activity-title-row">' + linkOf(item.href, item.title, 'activity-link') + '</div>';
        if (item.description && item.description !== item.title) {
            html += '<div class="activity-card-copy">' + escapeHtml(item.description) + '</div>';
        }
        const meta = [];
        if (item.date) meta.push(item.date);
        if (item.teamRoleLabel) meta.push(item.teamRoleLabel);
        if (item.priority) meta.push(item.priority.toUpperCase());
        if (item.keyResultId) meta.push(item.keyResultId);
        if (meta.length) {
            html += '<div class="activity-card-meta">' + meta.map(value => escapeHtml(value)).join(' | ') + '</div>';
        }
        if (item.how) {
            html += '<div class="activity-card-meta" style="margin-top:4px">' + escapeHtml(item.how) + '</div>';
        }
        html += '</div>';
        return html;
    }

    function renderActivityColumn(area, items) {
        const areaItems = items.filter(item => item.area === area);
        let html = '<td class="activity-column" data-activity-area="' + escapeHtml(area) + '">';
        if (!areaItems.length) {
            html += '<div class="empty-state">No linked work in this area.</div>';
        } else {
            html += '<div class="activity-column-list">';
            areaItems.forEach(item => {
                html += renderActivityCard(item);
            });
            html += '</div>';
            html += '<div class="activity-column-filter-empty empty-state" style="display:none">No items match this filter.</div>';
        }
        html += '</td>';
        return html;
    }

        html += "<button type=\"button\" class=\"activity-filter active\" data-activity-filter=\"all\" onclick=\"filterTeamActivity('all')\">" + activityFilterLabel('All', counts.all) + '</button>';
        html += "<button type=\"button\" class=\"activity-filter\" data-activity-filter=\"initiative\" onclick=\"filterTeamActivity('initiative')\">" + activityFilterLabel('Initiative', counts.initiative) + '</button>';
        html += "<button type=\"button\" class=\"activity-filter\" data-activity-filter=\"discovery\" onclick=\"filterTeamActivity('discovery')\">" + activityFilterLabel('Discovery', counts.discovery) + '</button>';
        html += '</div>';

        if (!items.length) {
            html += '<div class="empty-state">No current, next, or KTLO initiatives or discoveries linked to this team.</div>';
        } else {
            html += '<div class="activity-board-wrap"><table class="activity-board">';
            html += '<thead><tr><th>KTLO</th><th>Current</th><th>Next</th></tr></thead>';
            html += '<tbody><tr>';
            html += renderActivityColumn('ktlo', items);
            html += renderActivityColumn('current', items);
            html += renderActivityColumn('next', items);
            html += '</tr></tbody></table></div>';
            html += '<div id="ActivityEmptyState" class="empty-state" style="display:none">No items match this filter.</div>';
        }
        html += '</div>';
        return html;
    }

    function filterTeamActivity(type) {
        const cards = Array.from(document.querySelectorAll('#tab_content_initiatives-tab .activity-card'));
        const filters = Array.from(document.querySelectorAll('#tab_content_initiatives-tab .activity-filter'));
        let visibleCount = 0;

        filters.forEach(filter => {
            filter.classList.toggle('active', filter.getAttribute('data-activity-filter') === type);
        });

        cards.forEach(card => {
            const shouldShow = type === 'all' || card.getAttribute('data-activity-type') === type;
            card.hidden = !shouldShow;
            if (shouldShow) visibleCount += 1;
        });

        Array.from(document.querySelectorAll('#tab_content_initiatives-tab .activity-column')).forEach(column => {
            const columnCards = Array.from(column.querySelectorAll('.activity-card'));
            const visibleColumnCards = columnCards.filter(card => !card.hidden);
            const columnEmptyState = column.querySelector('.activity-column-filter-empty');
            if (columnEmptyState) {
                columnEmptyState.style.display = columnCards.length && !visibleColumnCards.length ? 'block' : 'none';
            }
        });

        const emptyState = document.getElementById('ActivityEmptyState');
        if (emptyState) {
            emptyState.style.display = visibleCount ? 'none' : 'block';
        }
    }

    window.afterOpenTab = function(tabName) {
        if (tabName === 'dependencies-tab') {
            renderMermaidDiagrams();
        }
    };

    function sanitizeMermaidId(value) {
        return String(value || '')
            .replace(/[^a-zA-Z0-9_]/g, '_')
            .replace(/^([^a-zA-Z_])/, '_$1');
    }

    function sanitizeMermaidLabel(value) {
        return String(value || '')
            .replace(/&/g, ' and ')
            .replace(/"/g, '')
            .replace(/'/g, '')
            .replace(/[|[\]{}()<>`]/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function renderDependencyTable(items, columns, rowBuilder) {
        if (!items || !items.length) {
            return '<div class="empty-state">No dependency details found.</div>';
        }

        let html = '<table class="role-table"><thead><tr>';
        columns.forEach(column => {
            html += '<th>' + escapeHtml(column) + '</th>';
        });
        html += '</tr></thead><tbody>';

        items.forEach(item => {
            html += '<tr>';
            rowBuilder(item).forEach(cell => {
                html += '<td>' + cell + '</td>';
            });
            html += '</tr>';
        });

        html += '</tbody></table>';
        return html;
    }

    function renderLinkedBricks(names, ids) {
        if (!ids || !ids.length) {
            return '<span class="empty-state">None</span>';
        }

        return ids.map((brickId, index) =>
            linkOf(
                '../../product-bricks/landing_pages/' + brickId + '.html',
                (names || [])[index] || brickId,
                ''
            )
        ).join('<br>');
    }

    function buildDependencyMermaid(title, items, keyName, labelBuilder, relationLabel) {
        if (!items || !items.length) {
            return '<div class="section"><div class="section-title">' + escapeHtml(title) + '</div><div class="empty-state">No dependencies found.</div></div>';
        }

        let chart = '';
        chart += '---\n' +
            'config:\n' +
            '  htmlLabels: false\n' +
            '---\n\n';

        chart += 'flowchart LR\n\n';

        const currentId = sanitizeMermaidId(team.id || 'current_team');
        chart += currentId + '[\"' + sanitizeMermaidLabel('THIS TEAM') + '\"]\n';
        chart += 'style ' + currentId + ' fill:#bbf\n';

        items.forEach(item => {
            const otherId = sanitizeMermaidId(item.teamId || item.teamName || 'team');
            const edgeLabel = sanitizeMermaidLabel(labelBuilder(item));
            chart += otherId + '[\"' + sanitizeMermaidLabel(item.teamName + ' Team' || item.teamId || 'Team') + '\"]\n';
            chart += currentId + ' -->|' + edgeLabel + '| ' + otherId + '\n';
        });

        return '<div class="section"><div class="section-title">' + escapeHtml(title) + '</div><div class="mermaid">' + chart + '</div></div>';
    }

    function renderMermaidDiagrams() {
        const container = document.getElementById('tab_content_dependencies-tab');
        if (!container || container.getAttribute('data-rendered') === 'true') {
            return;
        }

        const dependencyData = team.dependencyData || {};
        let html = '';
        html += buildDependencyMermaid(
            'Explicit Team Relationships',
            dependencyData.explicitRelationships || [],
            'relationshipType',
            item => item.relationshipLabel || item.relationshipType || 'relationship',
            'relationship'
        );
        html += '<div class="section">' + renderDependencyTable(
            dependencyData.explicitRelationships || [],
            ['Team', 'Relationship'],
            item => [
                linkOf(item.teamId + '.html', item.teamName || item.teamId, ''),
                escapeHtml(item.relationshipLabel || item.relationshipType || '')
            ]
        ) + '</div>';
        html += buildDependencyMermaid(
            'Shared Product Bricks',
            dependencyData.sharedProductBricks || [],
            'sharedBrickIds',
            item => ((item.sharedBrickNames || []).slice(0, 3).join(', ') + (((item.sharedBrickNames || []).length > 3) ? ' +' + ((item.sharedBrickNames || []).length - 3) : '')) || 'shared bricks',
            'shared bricks'
        );
        html += '<div class="section">' + renderDependencyTable(
            dependencyData.sharedProductBricks || [],
            ['Team', 'Shared Bricks'],
            item => [
                linkOf(item.teamId + '.html', item.teamName || item.teamId, ''),
                renderLinkedBricks(item.sharedBrickNames || [], item.sharedBrickIds || []),
            ]
        ) + '</div>';

        container.innerHTML = html;
        mermaid.run({querySelector: '#tab_content_dependencies-tab .mermaid'});
        container.setAttribute('data-rendered', 'true');
    }

    document.getElementById('Title').innerHTML = escapeHtml(team.name || 'Team');
    document.getElementById('Meta').innerHTML = escapeHtml(domainName) + ' | ' + escapeHtml(team.groupName || '') + ' | ' + escapeHtml(team.teamType || '');

    const staffing = team.staffing || {};
    const groupLeadership = team.groupLeadership || {};
    const aiAgents = team.aiAgents || [];
    const dependencyData = team.dependencyData || {};
    const dependencyCount = (dependencyData.explicitRelationships || []).length + (dependencyData.sharedProductBricks || []).length;
    document.getElementById('tab_staffing-tab').innerHTML = 'Staffing (' + escapeHtml(String(staffing.suggestedHeadcount || 0)) + ')';
    document.getElementById('tab_dependencies-tab').innerHTML = 'Dependencies (' + escapeHtml(String(dependencyCount)) + ')';

    let homeHtml = '';

    homeHtml += renderTeamCharter(team.teamCharter);

    let staffingHtml = '';
    staffingHtml += '<div class="section"><div class="section-title">Staffing Summary</div><div class="stats">';
    staffingHtml += '<div class="stat"><div class="stat-value">' + escapeHtml(String(staffing.suggestedHeadcount || 0)) + '</div><div class="stat-label">Suggested Headcount</div></div>';
    staffingHtml += '<div class="stat"><div class="stat-value">' + escapeHtml(String((staffing.roles || []).length)) + '</div><div class="stat-label">Role Blocks</div></div>';
    staffingHtml += '<div class="stat"><div class="stat-value">' + escapeHtml(String(aiAgents.length)) + '</div><div class="stat-label">AI Agents</div></div>';
    staffingHtml += '<div class="stat"><div class="stat-value">' + escapeHtml(String(groupLeadership.suggestedHeadcount || 0)) + '</div><div class="stat-label">Group Leadership Headcount</div></div>';
    staffingHtml += '<div class="stat"><div class="stat-value">' + escapeHtml(String((groupLeadership.roles || []).length)) + '</div><div class="stat-label">Group Role Blocks</div></div>';
    staffingHtml += '</div></div>';

    if (staffing.staffingGuidance || (staffing.roles || []).length) {
        staffingHtml += '<div class="section"><div class="section-title">Staffing Model</div>';
        if (staffing.staffingGuidance) {
            staffingHtml += '<div style="margin-bottom:12px; line-height:1.5">' + escapeHtml(staffing.staffingGuidance) + '</div>';
        }
        staffingHtml += '<table class="role-table"><thead><tr><th>Role</th><th>Count</th><th>Responsibility</th></tr></thead><tbody>';
        (staffing.roles || []).forEach(role => {
            staffingHtml += '<tr><td>' + escapeHtml(role.role) + '</td><td>' + escapeHtml(String(role.count || 0)) + '</td><td>' + escapeHtml(role.responsibility || '') + '</td></tr>';
        });
        staffingHtml += '</tbody></table></div>';
    }

    if (aiAgents.length) {
        staffingHtml += '<div class="section"><div class="section-title">AI Agents</div><div class="grid">';
        aiAgents.forEach(agent => {
            staffingHtml += '<div class="card">';
            staffingHtml += '<div class="metric-name">' + escapeHtml(agent.name || agent.id || 'AI agent') + '</div>';
            if (agent.purpose) {
                staffingHtml += '<div class="metric-meta">' + escapeHtml(agent.purpose) + '</div>';
            }
            staffingHtml += renderAgentList('Primary users', agent.primaryUsers || []);
            staffingHtml += renderAgentList('Product bricks', agent.productBricks || []);
            staffingHtml += renderAgentList('Guardrails', agent.guardrails || []);
            staffingHtml += renderAgentList('Success signals', agent.successSignals || []);
            staffingHtml += '</div>';
        });
        staffingHtml += '</div></div>';
    }

    if (team.groupLeadership && ((team.groupLeadership.roles || []).length || team.groupLeadership.leadershipModel)) {
        staffingHtml += '<div class="section"><div class="section-title">Group Leadership</div>';
        if (team.groupLeadership.purpose) {
            staffingHtml += '<div style="margin-bottom:12px; line-height:1.5">' + escapeHtml(team.groupLeadership.purpose) + '</div>';
        }
        if (team.groupLeadership.leadershipModel) {
            staffingHtml += '<div style="margin-bottom:12px; line-height:1.5; color:#6b7280">' + escapeHtml(team.groupLeadership.leadershipModel) + '</div>';
        }
        staffingHtml += '<table class="role-table"><thead><tr><th>Role</th><th>Count</th><th>Responsibility</th><th>Reports To</th></tr></thead><tbody>';
        (team.groupLeadership.roles || []).forEach(role => {
            staffingHtml += '<tr><td>' + escapeHtml(role.role) + '</td><td>' + escapeHtml(String(role.count || 0)) + '</td><td>' + escapeHtml(role.responsibility || '') + '</td><td>' + escapeHtml(role.reportsTo || '') + '</td></tr>';
        });
        staffingHtml += '</tbody></table></div>';
    }

    if ((team.primaryCustomers || []).length) {
        homeHtml += '<div class="section"><div class="section-title">Primary Customers and KPIs</div><div class="grid">';
        (team.primaryCustomers || []).forEach(customer => {
            homeHtml += '<div class="card">';
            homeHtml += '<div class="pill"><img class="linked-icon" src="../../customers/icons/' + escapeHtml(customer.icon || 'customer.png') + '" onerror="this.onerror=null;this.src=\'../../customers/icons/customer.png\'">' + linkOf('../../customers/landing_pages/' + customer.customerId + '.html', customer.customerName || customer.customerId, '') + '</div>';
            if ((customer.relatedKPIs || []).length) {
                homeHtml += '<div class="kpi-list">' + (customer.relatedKPIs || []).map(kpi => escapeHtml(kpi)).join('<br>') + '</div>';
            }
            homeHtml += '</div>';
        });
        homeHtml += '</div></div>';
    }

    if ((team.ownedProductBricks || []).length || (team.supportingProductBricks || []).length) {
        homeHtml += '<div class="section"><div class="section-title">Product Brick Scope</div>';
        if ((team.ownedProductBricks || []).length) {
            homeHtml += '<div style="margin-bottom:8px; color:#6b7280">Owned product bricks</div>';
            (team.ownedProductBricks || []).forEach(brick => {
                homeHtml += '<div class="pill"><img class="pill-icon" src="../../product-bricks/icons/' + escapeHtml((brick.brick || {}).icon || 'logo.png') + '" onerror="this.onerror=null;this.src=\'../../product-bricks/icons/logo.png\'">' + linkOf('../../product-bricks/landing_pages/' + brick.brickId + '.html', brick.brickName || brick.brickId, '') + '</div>';
            });
        }
        if ((team.supportingProductBricks || []).length) {
            homeHtml += '<div style="margin:14px 0 8px 0; color:#6b7280">Supporting product bricks</div>';
            (team.supportingProductBricks || []).forEach(brick => {
                homeHtml += '<div class="pill"><img class="pill-icon" src="../../product-bricks/icons/' + escapeHtml((brick.brick || {}).icon || 'logo.png') + '" onerror="this.onerror=null;this.src=\'../../product-bricks/icons/logo.png\'">' + linkOf('../../product-bricks/landing_pages/' + brick.brickId + '.html', brick.brickName || brick.brickId, '') + '</div>';
            });
        }
        homeHtml += '</div>';
    }

    if ((team.dependsOnTeams || []).length || (team.defaultSupportingTeams || []).length) {
        homeHtml += '<div class="section"><div class="section-title">Team Relationships</div>';
        if ((team.dependsOnTeams || []).length) {
            homeHtml += '<div style="margin-bottom:8px; color:#6b7280">Depends on</div>';
            (team.dependsOnTeams || []).forEach(otherTeam => {
                homeHtml += '<div class="pill">' + linkOf(otherTeam.id + '.html', otherTeam.name, '') + '</div>';
            });
        }
        if ((team.defaultSupportingTeams || []).length) {
            homeHtml += '<div style="margin:14px 0 8px 0; color:#6b7280">Default supporting teams</div>';
            (team.defaultSupportingTeams || []).forEach(otherTeam => {
                homeHtml += '<div class="pill">' + linkOf(otherTeam.id + '.html', otherTeam.name, '') + '</div>';
            });
        }
        homeHtml += '</div>';
    }
    document.getElementById('tab_content_home-tab').innerHTML = homeHtml;
    document.getElementById('tab_content_staffing-tab').innerHTML = staffingHtml;
    document.getElementById('tab_content_initiatives-tab').innerHTML = renderInitiativesTab();
    document.getElementById('tab_content_dependencies-tab').innerHTML = '<div class="section"><div class="section-title">Dependency Views</div><div class="empty-state">Open this tab to render Mermaid dependency diagrams.</div></div>';
</script>
<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Big Enterprise Home"
    },
    {
      "link": "../index.html",
      "label": "Teams"
    },
    {
      "label": "Engineering Product Platform - Cell 1"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>

</body>
</html>
