<script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

"Tune detail-page templates differently for goods, vehicles, and service listings"]}, "year3": {"focus": "Standardize safer transactions and richer decision support across more categories, with different operating models for pickup-first, shipping-first, and appointment-based transactions.", "categoryGate": "Protected, on-platform transactions are introduced only in shippable goods/recommerce, where they raise buyer confidence and take-rate. Motors and real estate stay lead-generation; jobs and local services stay lightweight lead capture. 'Safer transactions' here means trust and protection, not forcing escrow onto high-value or appointment-based categories.", "productTheme": "Trusted transaction infrastructure", "customerKPI": {"northStar": "Trust-safe transaction rate", "supporting": ["Buyer-to-transaction conversion", "Fraud report rate", "Median first reply time", "Repeat buyer retention", "Protected-transaction completion rate"]}, "businessKPI": {"northStar": "Buyer-to-transaction conversion", "revenueStreams": ["Protected transaction fees", "Shipping and logistics attach revenue", "Premium buyer tools for selected categories", "Risk-adjusted advertising and recommendation monetization", "Verified-seller and safer-transactions attach products"], "supporting": ["Demand-side liquidity contribution", "High-value category conversion", "Gross margin per protected transaction", "Buyer repeat rate", "Conversion in risky categories"]}, "milestones": ["Expand buyer protection to high-risk categories", "Add shipping and handoff orchestration in selected markets", "Use trust scoring to personalize risk controls and checkout options", "Link messaging, reservation, and payment state into one buyer journey", "Build category-specific fraud playbooks with automated enforcement", "Launch reusable transaction rails for shipped goods, local pickup, and appointment-based services"]}, "year5": {"focus": "Operate a cross-category marketplace graph that understands intent, geography, seller quality, and logistics constraints well enough to personalize the end-to-end local commerce journey.", "categoryGate": "The cross-category intelligence fabric personalizes discovery and decision support everywhere, but the transaction rail still only carries categories where protected commerce economics hold (goods first, then proven adjacencies). It does not assume on-platform checkout for motors, real estate, jobs, or services.", "productTheme": "Marketplace intelligence fabric", "customerKPI": {"northStar": "Time to relevant shortlist", "supporting": ["Successful buyer transaction rate", "Buyer weekly active rate", "Repeat buyer retention", "Cross-category discovery reuse", "Recommendation-led conversion"]}, "businessKPI": {"northStar": "Buyer weekly active rate", "revenueStreams": ["Cross-category marketplace advertising", "Managed trust and logistics services", "Subscription-grade buyer convenience products", "Data and intent products for selected ecosystem partners", "Premium decision-support and verification products"], "supporting": ["Demand-side liquidity contribution", "Buyer lifetime value", "Cross-category session share", "Recommendation-led conversion", "Platform share of recurring local commerce journeys"]}, "milestones": ["Deliver cross-category intent graph and reusable ranking services", "Unify on-platform and off-platform demand signals into recommendations", "Create trusted local commerce journeys spanning search, negotiation, and settlement", "Optimize local demand routing by geography, category, and risk profile", "Use marketplace intelligence to continuously personalize buyer workflows", "Establish one reusable buyer identity and trust profile across categories and markets"]}}}, "customerJourneyStories": [{"id": "journey-jtbd-cg1-1", "name": "Find the right local listing quickly", "linkedJobIds": ["jtbd-cg1-1", "jtbd-cg1-2"], "summary": "A local buyer arrives after a near-miss with a scam or a wasted trip to a stale listing. They learn to trust a fast, location-aware shortlist where ranking and trust signals do the filtering, then keep coming back through saved searches and alerts instead of re-scrolling noisy results.", "stages": [{"stage": "Trigger", "narrative": "A buyer almost drives across town for a listing that turns out to be sold, fake, or mispriced \u2014 or a plausible-looking seller asks them to pay off-platform. The frustration of stale local supply and scam exposure is what pushes them to look for a marketplace that filters this out before they waste a trip.", "media": [{"type": "image", "src": "media/journey-cg1-p1-jtbd-cg1-1-1.jpg", "title": "Local Buyer / Seeker journey stage 1: Trigger", "alt": "Journey panel for stage 1 of \"Find the right local listing quickly\": Trigger."}]}, {"stage": "Discovery", "narrative": "They first meet the product through a category landing page, an app-store result, or a friend forwarding a listing link. Discovery is just the awareness moment: they register that this marketplace claims fast, location-aware search and visible trust signals, not yet whether it actually works for their search.", "media": [{"type": "image", "src": "media/journey-cg1-p1-jtbd-cg1-1-2.jpg", "title": "Local Buyer / Seeker journey stage 2: Discovery", "alt": "Journey panel for stage 2 of \"Find the right local listing quickly\": Discovery."}]}, {"stage": "Evaluation", "narrative": "Before committing attention, the buyer scans the first page of results for a category they know well. They judge whether the ranking surfaces fresh, nearby, fairly-priced listings, whether seller ratings and protection badges look real, and whether contacting a seller feels safe. They proceed only if the results beat scrolling a social-marketplace feed.", "media": [{"type": "image", "src": "media/journey-cg1-p1-jtbd-cg1-1-3.jpg", "title": "Local Buyer / Seeker journey stage 3: Evaluation", "alt": "Journey panel for stage 3 of \"Find the right local listing quickly\": Evaluation."}]}, {"stage": "Trial", "narrative": "The first real search is the test: they set a category, location radius, and price band and see whether the shortlist is genuinely relevant and free of obvious scams. Early proof is a handful of credible local listings with clear next actions \u2014 message the seller, save the search \u2014 rather than a wall of duplicates and bait.", "media": [{"type": "image", "src": "media/journey-cg1-p1-jtbd-cg1-1-4.jpg", "title": "Local Buyer / Seeker journey stage 4: Trial", "alt": "Journey panel for stage 4 of \"Find the right local listing quickly\": Trial."}]}, {"stage": "Engagement", "narrative": "It becomes a habit when saved searches and alerts bring back new matches without re-querying, and when the buyer can compare a few trusted listings and act on the right one. The marketplace earns daily use by removing the re-scrolling and the second-guessing about who is legitimate.", "media": [{"type": "image", "src": "media/journey-cg1-p1-jtbd-cg1-1-5.jpg", "title": "Local Buyer / Seeker journey stage 5: Engagement", "alt": "Journey panel for stage 5 of \"Find the right local listing quickly\": Engagement."}]}, {"stage": "Retention", "narrative": "They stay because the alerts keep surfacing relevant supply and because, when they do transact, the protected-payment and safe-contact paths make a local handoff feel low-risk. Switching back to a noisy feed now feels like giving up filtering they have come to rely on.", "media": [{"type": "image", "src": "media/journey-cg1-p1-jtbd-cg1-1-6.jpg", "title": "Local Buyer / Seeker journey stage 6: Retention", "alt": "Journey panel for stage 6 of \"Find the right local listing quickly\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-cg1-p1-jtbd-cg1-1.jpg", "title": "Local Buyer / Seeker customer journey: Find the right local listing quickly", "alt": "Journey storyboard for \"Find the right local listing quickly\" for customer \"Local Buyer / Seeker\"."}]}], "domain": "Demand-Side Consumers"}, {"id": al", "alt": "Journey panel for stage 4 of \"Create a trustworthy listing with minimal effort\": Trial."}]}, {"stage": "Engagement", "narrative": "It sticks when publishing becomes routine \u2014 category templates and saved details make the next listing quick \u2014 and when the seller can monitor views and messages and adjust price or details in a few taps. The product turns an occasional chore into a low-friction habit.", "media": [{"type": "image", "src": "media/journey-cg2-p1-jtbd-cg2-1-5.jpg", "title": "Casual Seller / Household Lister journey stage 5: Engagement", "alt": "Journey panel for stage 5 of \"Create a trustworthy listing with minimal effort\": Engagement."}]}, {"stage": "Retention", "narrative": "They come back for the next item because the flow is fast, the buyers are real, and protected payment plus safe handoff make completing a sale feel safe. The earlier pain of wasted time on fake buyers is exactly what they no longer have to absorb.", "media": [{"type": "image", "src": "media/journey-cg2-p1-jtbd-cg2-1-6.jpg", "title": "Casual Seller / Household Lister journey stage 6: Retention", "alt": "Journey panel for stage 6 of \"Create a trustworthy listing with minimal effort\": Retention."}]}], "media": [{"type": "image", "src": "media/journey-cg2-p1-jtbd-cg2-1.jpg", "title": "Casual Seller / Household Lister customer journey: Create a trustworthy listing with minimal effort", "alt": "Journey storyboard for \"Create a trustworthy listing with minimal effort\" for customer \"Casual Seller / Household Lister\"."}]}], "domain": "Supply-Side Individuals"}, {"id": "cg3-p1", "name": "Professional Merchant / Dealer / Storefront Manager", "description": "A business seller managing many listings, teams, and marketing budgets across one or more categories. They care about inventory ingestion, visibility control, lead quality, storefront reputation, ROI, and operational efficiency.", "icon": "storefront.png", "careAbout": ["Bulk inventory operations", "Lead quali     function jobNamesForCustomer(jobIds) {
        const jobs = (customer.jobsToBeDone || []);
        const jobLookup = {};
        jobs.forEach(job => {
            if (job.id) {
                jobLookup[job.id] = job.name || job.id;
            }
        });
        return (jobIds || []).map(jobId => jobLookup[jobId] || jobId);
    }

    function kpiNamesForLink(link) {
        // Prefer stable KPI IDs resolved against this customer's KPI pyramid; fall back to legacy display-name kpis.
        if (link && link.kpiIds && link.kpiIds.length) {
            const lookup = {};
            function walk(node) {
                if (!node) return;
                if (node.id) {
                    lookup[node.id] = node.name || node.id;
                }
                (node.branches || []).forEach(walk);
                (node.children || []).forEach(walk);
            }
            const pyramids = (customer || {}).kpiPyramids || {};
            ['customerOutcomes', 'businessOutcomes'].forEach(key => {
                const pyramid = pyramids[key];
                if (!pyramid) return;
                walk(pyramid.top);
                (pyramid.branches || []).forEach(walk);
            });
            return link.kpiIds.map(kpiId => lookup[kpiId] || kpiId);
        }
        return (link && link.kpis) || [];
    }

                if (insight.implication) {
                    html += '<div style="margin-bottom: 10px"><b>Product implication:</b> ' + escapeHtml(insight.implication) + '</div>';

                    const kpiNames = kpiNamesForLink(insight.link);

                        html += '<div style="font-size: 13px; color: #4b5563; margin-bottom: 4px"><b>KPIs:</b> ' + escapeHtml(kpiNames.join(', ')) + '</div>';

                if (insight.tags && insight.tags.length) {
                    html += '<div style="margin-top: 8px; margin-bottom: 10px">';

                    });
                    html += '</div>';
                }
                html += '</div>';
            });
        }
        html += '</div>';

        document.getElementById('Insights').innerHTML = html;

    function kpiIconFile(node) {
        return (node && node.icon) ? node.icon : 'kpi.png';
    }

    function kpiCurrentValue(node) {
        if (!node || !node.currentValue) {
            return '';
        }
        return String(node.currentValue) + (node.unit ? ' (' + String(node.unit) + ')' : '');
    }

    function kpiValueStatusLabel(node) {
        if (!node || !node.valueStatus) {
            return '';
        }
        const labels = {
            example: 'illustrative example',
            baseline: 'measured baseline',
            target: 'target',
            placeholder: 'placeholder'
        };
        return labels[node.valueStatus] || String(node.valueStatus);
    }

    function renderKpiMeta(node) {
        let html = '';
        if (node && node.currentValue) {
            const statusLabel = kpiValueStatusLabel(node);
            const valueLabel = (node.valueStatus === 'target') ? 'Target:' : 'Current:';
            html += '<div style="font-size: 80%; color: #1d4ed8; margin-top: 4px"><b>' + valueLabel + '</b> ' + escapeHtml(kpiCurrentValue(node));
            if (statusLabel) {
                html += ' <span style="color:#888; font-style: italic;">(' + escapeHtml(statusLabel) + ')</span>';
            }
            html += '</div>';
        }
        if (node && node.target) {
            html += '<div style="font-size: 80%; color: #047857; margin-top: 2px"><b>Target:</b> ' + escapeHtml(String(node.target)) + '</div>';
        }
        if (node && node.guardrailRole) {
            html += '<div style="font-size: 78%; color: #b91c1c; margin-top: 2px"><b>Guardrail:</b> ' + escapeHtml(String(node.guardrailRole)) + '</div>';
        }
        if (node && (node.period || node.calculationMethod || node.valueSource)) {
            html += '<div style="font-size: 76%; color: #6b7280; margin-top: 3px">';
            if (node.period) { html += '<div><b>Period:</b> ' + escapeHtml(String(node.period)) + '</div>'; }
            if (node.calculationMethod) { html += '<div><b>How measured:</b> ' + escapeHtml(String(node.calculationMethod)) + '</div>'; }
            if (node.valueSource) { html += '<div><b>Value source:</b> ' + escapeHtml(String(node.valueSource)) + '</div>'; }
            html += '</div>';
        }
        if (node && node.guardrail) {
            html += '<div style="font-size: 76%; color: #7c3aed; margin-top: 3px"><b>Composite guardrail:</b> ' + escapeHtml(String(node.guardrail)) + '</div>';
        }
        if (node && node.link) {
            html += '<div style="font-size: 80%; margin-top: 4px"><a target="_blank" rel="noopener noreferrer" href="' + escapeHtml(node.link) + '">' + escapeHtml(node.linkLabel || 'Open link') + '</a></div>';

        return html;
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function formatDate(dateValue) {
        if (!dateValue) return 'No date';
        const date = new Date(dateValue + 'T00:00:00');
        if (isNaN(date.getTime())) return dateValue;
        return date.toLocaleDateString('en-GB', {year: 'numeric', month: 'short', day: 'numeric'});
    }

    function renderKpis(items) {
        let html = '';
        items.forEach(item => {
            html += '<div><b>' + escapeHtml(item.kpi) + '</b>';
            if (item.unit) {
                html += ' <span class="activity-muted">(' + escapeHtml(item.unit) + ')</span>';
            }
            if (item.expectedImpact) {
                html += ': ' + escapeHtml(item.expectedImpact);
            }
            if (item.currentValue) {
                html += '<div class="activity-muted"><b>Current:</b> ' + escapeHtml(String(item.currentValue)) + '</div>';
            }
            if (item.description) {
                html += '<div class="activity-muted">' + escapeHtml(item.description) + '</div>';
            }
            if (item.link) {
                html += '<div class="activity-muted"><a target="_blank" rel="noopener noreferrer" href="' + escapeHtml(item.link) + '">' + escapeHtml(item.linkLabel || 'Open link') + '</a></div>';
            }
            html += '</div>';
        });
        return html;
    }

    function renderImpactCell(item, currentCustomerId) {
        let html = '';
        (item.customerImpact || []).forEach(impact => {
            const isCurrent = impact.customerId === currentCustomerId;
            html += '<div class="activity-block' + (isCurrent ? ' activity-pill-highlight' : '') + '">';
            html += '<div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">';
            html += '<img class="activity-icon activity-icon-round" src="../icons/' + escapeHtml(impact.customer.icon) + '" onerror="this.onerror=null;this.src=\'../icons/customer.png\'">';
            html += '<div><div style="font-weight:bold; color:' + (isCurrent ? '#1d4ed8' : '#111827') + '">' + escapeHtml(impact.customer.name) + ' <span class="activity-muted">(' + escapeHtml(impact.customerId) + ')</span></div></div>';
            html += '</div>';
            html += renderKpis(impact.customerKPIs || []);
            html += renderKpis(impact.businessKPIs || []);
            html += '</div>';
        });
        return html || '<span class="activity-muted">No customer impact listed</span>';
    }

    function renderBrickCell(item) {
        let html = '';
        (item.productBricks || []).forEach(brick => {
            html += '<div class="activity-pill">';
            html += '<img class="activity-icon" src="../../product-bricks/icons/' + escapeHtml(brick.brick.icon) + '" onerror="this.onerror=null;this.src=\'../../product-bricks/icons/logo.png\'">';
            html += '<div><div><b>' + escapeHtml(brick.brick.name) + '</b> <span class="activity-muted">(#' + escapeHtml(brick.brickId) + ')</span></div><div class="activity-muted">' + escapeHtml(brick.change) + '</div></div>';
            html += '</div>';
        });
        return html || '<span class="activity-muted">No product bricks listed</span>';
    }

    function renderChannelCell(item) {
        let html = '';
        (item.deliveryChannels || []).forEach(channel => {
            html += '<div class="activity-pill">';
            html += '<img class="activity-icon" src="../../product-deployments/icons/' + escapeHtml(channel.channel.icon) + '" onerror="this.onerror=null;this.src=\'../../product-deployments/icons/product.png\'">';
            html += '<div><div><b>' + escapeHtml(channel.channel.name) + '</b> <span class="activity-muted">(' + escapeHtml(channel.channelId) + ')</span></div><div class="activity-muted">' + escapeHtml(channel.change) + '</div></div>';
            html += '</div>';
        });
        return html || '<span class="activity-muted">No delivery channels listed</span>';
    }

    function renderActivityTable(data, kind, currentCustomerId) {
        const items = (data && data.items) ? data.items : [];
        let html = '';
        html += '<div class="activity-summary">';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.length + '</div><div class="activity-stat-label">' + kind + '</div></div>';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.filter(item => (item.customerImpact || []).length > 0).length + '</div><div class="activity-stat-label">With customer impact</div></div>';
        html += '<div class="activity-stat"><div class="activity-stat-value">' + items.filter(item => (item.productBricks || []).length > 0).length + '</div><div class="activity-stat-label">With bricks</div></div>';
        html += '</div>';

        if (!items.length) {
            html += '<div class="group" style="margin-top:0">No related ' + kind.toLowerCase() + ' found for this customer.</div>';
            return html;
        }

        html += '<table class="activity-table">';
        html += '<tr><th>Date</th><th>Description</th><th>Customer Impact</th><th>Product Bricks</th><th>Delivery Channels</th></tr>';
        items.forEach(item => {
            html += '<tr>';
            html += '<td style="white-space:nowrap">' + escapeHtml(formatDate(item.date)) + '</td>';
            html += '<td><a class="activity-link" target="_blank" rel="noopener noreferrer" href="../../' + kind.toLowerCase() + '/landing_pages/' + item.landingPageIndex + '.html">' + escapeHtml(item.description || item.name || kind) + '</a></td>';
            html += '<td>' + renderImpactCell(item, currentCustomerId) + '</td>';
            html += '<td>' + renderBrickCell(item) + '</td>';
            html += '<td>' + renderChannelCell(item) + '</td>';
            html += '</tr>';
        });
        html += '</table>';
        return html;
    }

    addHeader();
    addHome();
    addJBTD();
    addJourneys();
    addKPIs();
    addProductVision();
    addInsights();


</script>

<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "General Listings Marketplace Home"
    },
    {
      "link": "../index.html",
      "label": "Customers"
    },
    {
      "label": "Professional Merchant / Dealer / Storefront Manager"
    }
  ]
};
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>

</body>
</html>
