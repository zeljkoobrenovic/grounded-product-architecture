    <style>
    .tab {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 4px;
    }

    .tab button {
        position: relative;
        background-color: transparent;
        border: none;
        outline: none;
        cursor: pointer;
        padding: 11px 16px;
        margin-bottom: -1px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        color: #6b7280;
        border-bottom: 2px solid transparent;
        border-radius: 8px 8px 0 0;
        transition: color 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
    }

    .tab button:hover {
        color: #1f2937;
        background-color: #f3f4f6;
    }

    .tab button:focus-visible {
        outline: 2px solid #1d4ed8;
        outline-offset: -2px;
    }

    .tab button.active {
        color: #1d4ed8;
        border-bottom-color: #1d4ed8;
    }

    .tabcontent {
        display: none;
        padding: 2px 2px;
        animation: tabContentFade 0.2s ease;
    }

    @keyframes tabContentFade {
        from {
            opacity: 0;
            transform: translateY(3px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 720px) {
        .tab {
            flex-direction: column;
            gap: 0;
        }

        .tab button {
            width: 100%;
            text-align: left;
            margin-bottom: 0;
            border-bottom: 1px solid #e5e7eb;
            border-radius: 0;
        }

        .tab button.active {
            border-bottom-color: #1d4ed8;
        }
    }
</style>

        const streamsPayload = {"metadata": {"title": "Product Streams", "description": "Outcome-based product streams for the General Listings Marketplace domain, covering buyer discovery, seller tooling, monetization, and trust.", "definitions": {"productBrick": "A reusable implementation-facing building block used to realize one or more product streams.", "productStream": "A high-level, outcome-based experience that delivers customer or business value."}, "sources": ["https://www.olxgroup.com/brands/olx/", "https://www.zillow.com/agent-resources/agent-toolkit/zillow-offers-toolkit/"], "flowModelVersion": "3.2", "flowModelNote": "Each experience now carries only experience-specific flows. Each flow step lists the bricks and external systems used inside that experience."}, "rootGroups": [{"name": "Buyer Journey", "description": "How local buyers discover relevant listings, save and return to intent, and contact sellers with confidence.", "subGroups": [], "streams": [{"id": "buyer-browse-interesting-listings", "name": "Browse Interesting Listings", "icon": "buyer-browse-interesting-listings.png", "type": "outcome-based-stream", "description": "Help buyers enter the marketplace and quickly find listings worth exploring. Serves Local Buyer (cg1) job jtbd-cg1-1; primary KPI: Successful buyer transaction rate (top-of-funnel via Discovery efficiency). Lead team: Buyer Engagement & Web Shell; supporting teams: Buyer Discovery Intelligence, Experience Platform - Frontend Core.", "group": "Buyer Journey", "rootGroup": "Buyer Journey", "flows": [{"id": "buyer-browse-interesting-listings-flow", "title": "Browse Interesting Listings", "description": "Help buyers enter the marketplace and quickly find listings worth exploring.", "steps": [{"id": "open-marketplace-home", "title": "Open marketplace home", "keyFacts": ["The home surface must lead with fresh local supply for the buyer's city and last-viewed categories, not generic national inventory.", "First impression of liquidity is set in seconds: a sparse or stale local feed signals the marketplace has nothing for this buyer."], "painPoints": ["Buyers in thinner metros or categories land on stale or out-of-area listings and assume the marketplace is dead.", "Anonymous first sessions have no location or intent signal, so the home feed defaults to low-relevance national filler."], "dependencies": [{"type": "brick", "id": "home", "name": "Homepage", "description": "Marketplace homepage and landing experience: serves marketing content and personalized entry points into search, categories, and listing detail pages.", "how": "Uses Homepage to lead buyers from the landing experience into search, categories, and listings in open marketplace home."}, {"type": "brick", "id": "clre", "name": "Classifieds Recommendations", "description": "Ability to match published classifieds with seekers' saved search criteria and provide recommendations (match classified & seeker)", "how": "Uses Classifieds Recommendations for match published classifieds with seekers' saved search criteria and provide recommendations in open marketplace home."}]}, {"id": "browse-category-feed", "title": "Browse category feed", "keyFacts": ["Category feeds mix recommerce goods, dealer motors, and agency real estate that each need different sort logic and trust cues.", "Recency and distance matter more than absolute relevance in classifieds: a perfect match 300 km away is useless to a pickup buyer."], "painPoints": ["Duplicate and re-posted listings from sellers gaming freshness clutter the feed and bury genuine new supply.", "Expired or already-sold items left live make the category look fuller than it is and waste buyer clicks."], "dependencies": [{"type": "brick", "id": "clre", "name": "Classifieds Recommendations", "description": "Ability to match published classifieds with seekers' saved search criteria and provide recommendations (match classified & seeker)", "how": "Uses Classifieds Recommendations for match published classifieds with seekers' saved search criteria and provide recommendations in browse category feed."}]}, {"id": "see-personalized-recommendations", "title": "See personalized recommendations", "keyFacts": ["Recommendations have to respect that most classifieds intent is single-item and short-lived: a sofa bought last week should not keep being recommended.", "Cross-category recommerce signals (someone browsing phones may want accessories) only work when local supply for the adjacent category exists."], "painPoints": ["Recommending listings that get moderated or pulled minutes later breaks buyer trust in the suggestions.", "Cold-start buyers with no history get generic bestsellers that ignore their location and price band."], "dependencies": [{"type": "brick", "id": "clre", "name": "Classifieds Recommendations", "description": "Ability to match published classifieds with seekers' saved search criteria and provide recommendations (match classified & seeker)", "how": "Uses Classifieds Recommendations for match published classifieds with seekers' saved search criteria and provide recommendations in see personalized recommendations."}]}, {"id": "open-promising-listing", "title": "Open promising listing", "keyFacts": ["The first detail-page open is the relevant-detail-view signal that feeds the buyer's discovery-efficiency KPI branch.", "Buyers scan photos, price, distance, and seller credibility together before deciding the listing is worth a message."], "painPoints": ["Thin listings (one blurry photo, no description) force buyers back to the feed and waste the click.", "A promising thumbnail that opens onto a price-bait or wrong-category listing erodes trust in the whole feed."], "dependencies": [{"type": "brick", "id": "home", "name": "Homepage", "description": "Marketplace homepage and landing experience: serves marketing content and personalized entry points into search, categories, and listing detail pages.", "how": "Uses Homepage to carry the buyer from a promising entr ent", "description": "Provides a single, safe contact experience for buyers to reach private and professional sellers, keeping the conversation on-platform.", "how": "Uses Consumer Contacting Management to give the buyer a single, safe on-platform way to reach the seller in start seller conversation."}]}, {"id": "take-next-trusted-action", "title": "Take next trusted action", "keyFacts": ["The trusted next action branches by category: arrange cash-on-pickup for local goods, enter protected payment for shippable goods, or hand a qualified lead to a dealer/agency.", "Most classifieds value still settles off-platform, so the marketplace optimizes for a safe handoff rather than forcing checkout everywhere."], "painPoints": ["Pushing protected payment into categories where pickup is the norm (motors, real estate) adds friction and suppresses contact.", "When the handoff goes off-platform the marketplace loses visibility into whether the transaction succeeded, weakening trust signals."], "dependencies": [{"type": "brick", "id": "cdpc", "name": "Classified Details Page (CDP)", "description": "Ability to show a detailed page of a selected classified (description, images, merchant contact information...)", "how": "Uses Classified Details Page (CDP) for show a detailed page of a selected classified in take next trusted action."}, {"type": "brick", "id": "ccnm", "name": "Consumer Contacting Management", "description": "Provides a single, safe contact experience for buyers to reach private and professional sellers, keeping the conversation on-platform.", "how": "Uses Consumer Contacting Management to give the buyer a single, safe on-platform way to reach the seller in take next trusted action."}]}]}], "outcomes": ["Higher contact conversion", "More buyer confidence before acting"], "brickDependencies": [{"targetBrickId": "cdpc", "type": "composition"}, {"targetBrickId": "ccnm", "type": "composition"}, {"targetBrickId": "pdto", "type": "composition"}, {"targetBrickId": "cmse", "  Journey", "rootGroup": "Private Seller Journey", "flows": [{"id": "seller-publish-a-good-listing-fast-flow", "title": "Publish a Good Listing Fast", "description": "Help a private seller create and enrich a listing quickly without sacrificing quality.", "steps": [{"id": "start-listing-flow", "title": "Start listing flow", "keyFacts": ["Choosing the right category up front drives which attributes, fees, and operating model (goods vs motors vs real estate) the rest of the funnel applies.", "Casual household sellers list rarely, so the funnel cannot assume any prior knowledge of marketplace conventions."], "painPoints": ["Sellers pick the wrong category and end up in the wrong taxonomy, hurting discoverability and triggering moderation reclassification.", "An onboarding wall (forced account creation, identity steps) before the seller sees value kills the listing start."], "dependencies": [{"type": "brick", "id": "esfu", "name": "Seller Listing Funnel", "description": "Guided self-serve flow that turns a casual seller's item, photos, and category inputs into a high-quality marketplace listing.", "how": "Uses Seller Listing Funnel for guided self-serve flow that turns a casual seller's item, photos, and category inputs into a high-quality marketplace listing in start listing flow."}, {"type": "brick", "id": "eccr", "name": "Category Content Creation", "description": "Producing useful category, trust, and marketplace content that helps buyers and sellers make better local commerce decisions.", "how": "Uses Category Content Creation for producing useful category, trust, and marketplace content that helps buyers and sellers make better local commerce decisions in start listing flow."}]}, {"id": "add-listing-details", "title": "Add listing details", "keyFacts": ["Title, description, and structured attributes are what make the listing findable in search and filters later, so detail quality is liquidity.", "Smart defaults and attribute suggestions cut effort while still captu ch classified & seeker)", "how": "Uses Classifieds Recommendations for match published classifieds with seekers' saved search criteria and provide recommendations in see personalized recommendations."}]}, {"id": "open-promising-listing", "title": "Open promising listing", "keyFacts": ["The first detail-page open is the relevant-detail-view signal that feeds the buyer's discovery-efficiency KPI branch.", "Buyers scan photos, price, distance, and seller credibility together before deciding the listing is worth a message."], "painPoints": ["Thin listings (one blurry photo, no description) force buyers back to the feed and waste the click.", "A promising thumbnail that opens onto a price-bait or wrong-category listing erodes trust in the whole feed."], "dependencies": [{"type": "brick", "id": "home", "name": "Homepage", "description": "Marketplace homepage and landing experience: serves marketing content and personalized entry points into search, categories, and listing detail pages.", "how": "Uses Homepage to carry the buyer from a promising entry point into the listing detail page in open promising listing."}, {"type": "brick", "id": "clre", "name": "Classifieds Recommendations", "description": "Ability to match published classifieds with seekers' saved search criteria and provide recommendations (match classified & seeker)", "how": "Uses Classifieds Recommendations for match published classifieds with seekers' saved search criteria and provide recommendations in open promising listing."}]}]}], "outcomes": ["Higher browsing engagement", "Better top-of-funnel relevance"], "brickDependencies": [{"targetBrickId": "home", "type": "composition"}, {"targetBrickId": "ubws", "type": "composition"}, {"targetBrickId": "clre", "type": "composition"}, {"targetBrickId": "cama", "type": "composition"}, {"targetBrickId": "sema", "type": "composition"}], "externalSystemsThisStreamDependsOn": [], "externalSystemsDependingOnThisStream": [], "owningTeams": [{"teamId": "buyer-engagement-  and choose a more effective listing price.", "steps": [{"id": "review-price-suggestions", "title": "Review price suggestions", "keyFacts": ["Price guidance is derived from comparable local sold and active listings in the same category and condition band, not a national average.", "Price-fit confidence is a measured seller KPI: a credible suggested range is what makes the seller list at a sellable price."], "painPoints": ["Thin comparable data in a small metro or niche category produces a wide, low-confidence range the seller can't act on.", "Sellers anchored to what they originally paid distrust a market suggestion that comes in lower."], "dependencies": [{"type": "brick", "id": "prpa", "name": "Pricing Guidance Page", "description": "A page with a visualization of average listing prices per geographic location (from the region down to the exact address)", "how": "Uses Pricing Guidance Page for a page with a visualization of average listing prices per geographic location in review price suggestions."}, {"type": "brick", "id": "pvto", "name": "Pricing Guidance Engine", "description": "Pricing and demand-signal engine that helps professional sellers price inventory, understand category dynamics, and improve conversion.", "how": "Uses Pricing Guidance Engine for pricing and demand-signal engine that helps professional sellers price inventory, understand category dynamics, and improve conversion in review price suggestions."}]}, {"id": "compare-market-examples", "title": "Compare market examples", "keyFacts": ["Showing real comparable listings (and where demand is concentrated via the heatmap) is more persuasive than an abstract number.", "Demand context tells the seller whether to price for a fast sale or hold for a higher offer in their area."], "painPoints": ["Comparables polluted by stale, mispriced, or already-sold listings give a distorted reference point.", "Without local demand signal the seller can't tell if a slow sale is a price problem or just thin local in gged-in sellers can review their active listings, drafts, sold items, and performance signals in edit live listing."}]}, {"id": "refresh-availability", "title": "Refresh availability", "keyFacts": ["Bumping or refreshing a listing restores its position in the recency-weighted feed and is a core paid-promotion lever.", "Keeping availability accurate (still for sale, reserved, sold) is what protects buyer trust in the supply they see."], "painPoints": ["Sellers who never mark items sold leave zombie listings live, inflating apparent supply and frustrating buyers.", "Abusing free refresh to game freshness floods the feed and forces ranking penalties that catch honest sellers too."], "dependencies": [{"type": "brick", "id": "ocma", "name": "Seller Listings Management", "description": "Management space for casual seller listings created through self-serve posting inside the consumer portal.", "how": "Uses Seller Listings Management for management space for casual seller listings created through self-serve posting inside the consumer portal in refresh availability."}]}, {"id": "respond-to-activity", "title": "Respond to activity", "keyFacts": ["Fast replies to buyer messages are the strongest predictor of a casual seller actually completing a sale.", "The workspace has to triage genuine buyers from lowballers, time-wasters, and scam messages targeting sellers."], "painPoints": ["Casual sellers check the app infrequently, so without push nudges buyer messages go cold and the sale is lost.", "Scam messages to sellers (fake-payment, courier-fee schemes) erode trust if not flagged in the inbox."], "dependencies": [{"type": "brick", "id": "ocma", "name": "Seller Listings Management", "description": "Management space for casual seller listings created through self-serve posting inside the consumer portal.", "how": "Uses Seller Listings Management for management space for casual seller listings created through self-serve posting inside the consumer portal in respond to activity."}]}, {"id": "pause-or-end-listing", "title": "Pause or end listing", "keyFacts": ["Marking sold is the explicit listing-to-sale outcome that closes the loop and feeds the seller's realization KPI.", "Capturing whether it sold on-platform, off-platform, or was withdrawn improves future supply and pricing signals."], "painPoints": ["If ending a listing is buried, sellers abandon stale items instead of closing them, polluting live supply.", "No sold-price capture on off-platform deals leaves a blind spot in pricing intelligence for the next seller."], "dependencies": [{"type": "brick", "id": "ocma", "name": "Seller Listings Management", "description": "Management space for casual seller listings created through self-serve posting inside the consumer portal.", "how": "Uses Seller Listings Management for management space for casual seller listings created through self-serve posting inside the consumer portal in pause or end listing."}, {"type": "brick", "id": "opma", "name": "Seller Inventory Workspace", "description": "Workspace where logged-in sellers can review their active listings, drafts, sold items, and performance signals.", "how": "Uses Seller Inventory Workspace for workspace where logged-in sellers can review their active listings, drafts, sold items, and performance signals in pause or end listing."}]}]}], "outcomes": ["Higher seller productivity", "Better listing freshness"], "brickDependencies": [{"targetBrickId": "ocma", "type": "composition"}, {"targetBrickId": "opma", "type": "composition"}, {"targetBrickId": "slma", "type": "composition"}, {"targetBrickId": "orma", "type": "composition"}, {"targetBrickId": "cpor", "type": "composition"}, {"targetBrickId": "clex", "type": "composition"}, {"targetBrickId": "spma", "type": "composition"}], "externalSystemsThisStreamDependsOn": [], "externalSystemsDependingOnThisStream": [], "owningTeams": [{"teamId": "seller-success-experience", "teamName": "Seller Success Experience", "teamType": "stream-aligned", "group y.", "Slow business verification or document KYC delays go-live and stalls the dealer's first paid inventory."], "dependencies": [{"type": "brick", "id": "iess", "name": "Professional Seller / Dealer / Storefront Entity SSoT", "description": "Single source of truth for professional seller accounts, legal entities, storefront structures, and permissions.", "how": "Uses Professional Seller / Dealer / Storefront Entity SSoT for single source of truth for professional seller accounts, legal entities, storefront structures, and permissions in set up storefront."}, {"type": "brick", "id": "imma", "name": "Professional Seller / Dealer / Storefront Members Management", "description": "Manages members, roles, and permissions within professional seller organizations.", "how": "Uses Professional Seller / Dealer / Storefront Members Management to manage members, roles, and permissions across the storefront in set up storefront."}]}, {"id": "manage-business-profile", "title": "Manage business profile", "keyFacts": ["The public storefront page (profile, reputation, opening hours, full live inventory) is a dealer's branded shopfront and a buyer trust signal.", "Profile completeness and review volume directly influence how buyers weigh a professional listing against a private one."], "painPoints": ["A thin or out-of-date storefront undercuts the credibility advantage a dealer pays a subscription for.", "Reputation damage from a few unresolved disputes is highly visible on the public profile and suppresses leads."], "dependencies": [{"type": "brick", "id": "ipdi", "name": "Professional Seller / Dealer / Storefront Profile & Directory", "description": "A stream with two sides: a management page for professional sellers and a public storefront page showing merchant profile, reputation, contact information, and live inventory.", "how": "Uses Professional Seller / Dealer / Storefront Profile & Directory for a stream with two sides: a management page for professional sellers and a public storefront page showing merchant profile, reputation, contact information, and live inventory in manage business profile."}]}, {"id": "sync-inventory", "title": "Sync inventory", "keyFacts": ["Dealers and agencies push catalog from their own DMS/CRM via feed or partner API rather than listing items one by one.", "Feed success rate (updates processed without critical errors) is the dealer's measured operational-reliability KPI."], "painPoints": ["A malformed or schema-drifted feed fails validation and silently leaves stale or missing inventory live.", "Mapping the partner's free-form attributes to the marketplace taxonomy is error-prone and a top source of moderation rejects."], "dependencies": [{"type": "brick", "id": "ipdi", "name": "Professional Seller / Dealer / Storefront Profile & Directory", "description": "A stream with two sides: a management page for professional sellers and a public storefront page showing merchant profile, reputation, contact information, and live inventory.", "how": "Uses Professional Seller / Dealer / Storefront Profile & Directory for a stream with two sides: a management page for professional sellers and a public storefront page showing merchant profile, reputation, contact information, and live inventory in sync inventory."}]}, {"id": "maintain-storefront-team-access", "title": "Maintain storefront team access", "keyFacts": ["Dealerships and agencies need role-based access so multiple agents share one storefront without overwriting each other.", "Lead routing and performance attribution depend on knowing which agent owns which listing and conversation."], "painPoints": ["Staff turnover leaves orphaned listings and active leads tied to departed agents if access isn't reassigned.", "Over-broad permissions let any agent edit or delete shared inventory, creating accidental supply loss."], "dependencies": [{"type": "brick", "id": "iess", "name": "Professional Seller / Dealer / Storefront Entity SSoT", "description": "Single source of tru .", "how": "Uses Payment Platform for have a generic payment that can be used across the actor domains in use protected payment flow."}]}, {"id": "detect-risky-interaction", "title": "Detect risky interaction", "keyFacts": ["Fraud signals span the whole funnel: scam listings, off-platform-contact nudges, fake-payment and courier-fee schemes, and account takeover.", "Detection must run in near real time on messaging and payment events to intervene before money or goods change hands."], "painPoints": ["Over-aggressive blocking freezes legitimate buyers and sellers mid-deal and generates costly support and appeals.", "Sophisticated scams that look like normal local deals slip through rules until a victim reports a loss."], "dependencies": [{"type": "brick", "id": "frde", "name": "Fraud Detection", "description": "Ability to automatically censor a classified", "how": "Uses Fraud Detection for automatically censor a classified in detect risky interaction."}]}, {"id": "complete-trusted-transaction", "title": "Complete trusted transaction", "keyFacts": ["Completion releases escrowed funds to the seller on confirmed delivery and closes buyer protection on the order.", "A clean, disputeless completion is what converts a one-off protected purchase into repeat trusted use."], "painPoints": ["Disputes (item not as described, not delivered) need a fair, evidence-based resolution or one party feels cheated and churns.", "Slow refunds or unclear protection terms after a failed delivery do lasting damage to marketplace trust."], "dependencies": [{"type": "brick", "id": "hpfi", "name": "Buyer Protection & Payments", "description": "Ability to evaluate the feasibility of a payment project and show a corresponding payment rate (multiple degrees of maturity theoretically possible with different impact, from simple budget calculator with illustrative rate estimate (minimum), to real-time actual rates comparison covering entire market and detailed calculation parameters (advanced))", "ho ifieds purchases are considered over days, so capturing intent for later is where conversion is won."], "painPoints": ["Buyers won't save a search if the current result set is empty, so thin supply suppresses the very signal that would fix it.", "Saved searches that were too broad later flood the buyer with irrelevant alerts and get muted."], "dependencies": [{"type": "brick", "id": "ssal", "name": "Saved Search / Alerts", "description": "Alert consumers about new classifieds - email / mobile push", "how": "Uses Saved Search / Alerts for alert consumers about new classifieds - email / mobile push in save search intent."}]}, {"id": "return-through-alert-or-notification", "title": "Return through alert or notification", "keyFacts": ["Alert speed is the differentiator: for in-demand local goods the first buyer to message usually wins, so minutes matter.", "Alert precision (share of alerts that trigger a real action) is the buyer's measured discovery-efficiency KPI."], "painPoints": ["Alerts that fire after the item is already sold or moderated out send buyers to dead listings and train them to ignore notifications.", "Batching or delayed indexing means the alert arrives hours late, by which point local supply has already been claimed."], "dependencies": [{"type": "brick", "id": "ssal", "name": "Saved Search / Alerts", "description": "Alert consumers about new classifieds - email / mobile push", "how": "Uses Saved Search / Alerts for alert consumers about new classifieds - email / mobile push in return through alert or notification."}, {"type": "brick", "id": "nose", "name": "Notification Service", "description": "Ability to send notifications with user preferences (via Email, Push, ...)", "how": "Uses Notification Service for send notifications with user preferences in return through alert or notification."}]}]}], "outcomes": ["Higher repeat visits", "Faster path back to relevant listings"], "brickDependencies": [{"targetBrickId": "serp", "type": "composition"}, {"targ ndoff rather than forcing checkout everywhere."], "painPoints": ["Pushing protected payment into categories where pickup is the norm (motors, real estate) adds friction and suppresses contact.", "When the handoff goes off-platform the marketplace loses visibility into whether the transaction succeeded, weakening trust signals."], "dependencies": [{"type": "brick", "id": "cdpc", "name": "Classified Details Page (CDP)", "description": "Ability to show a detailed page of a selected classified (description, images, merchant contact information...)", "how": "Uses Classified Details Page (CDP) for show a detailed page of a selected classified in take next trusted action."}, {"type": "brick", "id": "ccnm", "name": "Consumer Contacting Management", "description": "Provides a single, safe contact experience for buyers to reach private and professional sellers, keeping the conversation on-platform.", "how": "Uses Consumer Contacting Management to give the buyer a single, safe on-platform way to reach the seller in take next trusted action."}]}]}], "outcomes": ["Higher contact conversion", "More buyer confidence before acting"], "brickDependencies": [{"targetBrickId": "cdpc", "type": "composition"}, {"targetBrickId": "ccnm", "type": "composition"}, {"targetBrickId": "pdto", "type": "composition"}, {"targetBrickId": "cmse", "type": "composition"}, {"targetBrickId": "ause", "type": "composition"}, {"targetBrickId": "prse", "type": "composition"}, {"targetBrickId": "sklm", "type": "composition"}, {"targetBrickId": "lesc", "type": "composition"}], "externalSystemsThisStreamDependsOn": [], "externalSystemsDependingOnThisStream": [], "owningTeams": [{"teamId": "buyer-growth-discovery", "teamName": "Buyer Growth - Discovery", "teamType": "stream-aligned", "groupId": "marketplace-growth", "groupName": "Marketplace Growth", "role": "lead", "roleLabel": "Lead team"}, {"teamId": "experience-services-platform", "teamName": "Experience Services Platform", "teamType": "platform", "groupId": ends paid-promotion budget to lift qualified demand yield."], "painPoints": ["Demand data lagging by days leads dealers to promote inventory whose buyer interest has already moved on.", "Aggregate signals without category or geo granularity are too coarse for a multi-location dealer to act on."], "dependencies": [{"type": "brick", "id": "cvma", "name": "Classifieds Visibility Management", "description": "Controlling how and where listings appear", "how": "Uses Classifieds Visibility Management for controlling how and where listings appear in review demand signals."}, {"type": "brick", "id": "cpma", "name": "Classifieds Performance Management", "description": "Being able to provide analytics on how the classified is performing", "how": "Uses Classifieds Performance Management for being able to provide analytics on how the classified is performing in review demand signals."}]}, {"id": "prioritize-incoming-leads", "title": "Prioritize incoming leads", "keyFacts": ["In motors and real estate the product is the lead, not an on-platform sale, so lead quality and speed-to-contact define value.", "The leads inbox aggregates messages, callbacks, and form fills from many listings into one queue to triage."], "painPoints": ["High-intent leads sit behind tyre-kickers and duplicate inquiries when there's no scoring or de-duplication.", "Leads that slip past SLA windows go cold, directly lowering the dealer's qualified demand yield."], "dependencies": [{"type": "brick", "id": "isli", "name": "Professional Seller / Dealer / Storefront Seeker Leads Inbox", "description": "Inbox for incoming buyer leads", "how": "Uses Professional Seller / Dealer / Storefront Seeker Leads Inbox for inbox for incoming buyer leads in prioritize incoming leads."}]}, {"id": "assign-lead-to-agent", "title": "Assign lead to agent", "keyFacts": ["Lead-to-agent matching routes each inquiry to the agent best placed by location, specialism, or current load to close it.", "Clear ownership lets the dealer attri
