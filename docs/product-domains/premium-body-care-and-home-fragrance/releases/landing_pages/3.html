isor tools.", "type": "full-stack"}], "interfaces": [{"title": "Education content API", "description": "Delivers content snippets and long-form guidance to customer and advisor surfaces.", "type": "api"}], "dataDependencies": [{"assetId": "education-content", "role": "own", "description": "Owns customer and advisor education content.", "storeIds": ["education-content-cms"]}], "brickDependencies": [{"targetBrickId": "cata", "type": "content", "interface": "Product claim linkage", "description": "Links content to product claims, ingredients, and routine steps."}, {"targetBrickId": "comp", "type": "governance", "interface": "Approved claims service", "description": "Uses approved claim state before publishing product or sustainability claims."}], "externalSystemsThisBrickDependsOn": [{"system": "content-management-system", "description": "Maintains customer and advisor education articles, videos, how-to guidance, and localized copy."}, {"system": "digital-asset-management", "description": "Stores images, videos, ingredient visuals, launch assets, and reusable education media."}], "externalSystemsDependingOnThisBrick": [], "icon": "cont.png"}}], "deliveryChannels": [{"channelId": "web-cdn-edge", "change": "Release updated discovery and gift builder screens.", "channel": {"productId": "web", "productName": "", "name": "web-cdn-edge", "type": "product", "icon": "product.png"}}, {"channelId": "commerce-cloud-runtime", "change": "Release gift configuration and promise orchestration services.", "channel": {"productId": "commerce", "productName": "", "name": "commerce-cloud-runtime", "type": "product", "icon": "product.png"}}], "teams": {"primaryTeamIds": ["scent-discovery-and-gifting"], "supportingTeamIds": ["commerce-checkout-and-payments", "inventory-fulfillment-and-care", "customer-data-and-platform"]}, "initiativeId": "initiative-premium-body-care-and-home-fragrance-2026-04-18-01", "landingPageIndex": 3, "objectiveLandingPageUrl": ""};
    const domainName = 'Premium Body Care and Home Fragrance';

    function formatDate(dateValue) {
        if (!dateValue) return 'No date';
        const date = new Date(dateValue + 'T00:00:00');
        if (isNaN(date.getTime())) return dateValue;
        return date.toLocaleDateString('en-GB', {year: 'numeric', month: 'short', day: 'numeric'});
    }

    function escapeHtml(value) {
        return (value || '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function linkOf(href, label, className) {
        if (!href) return '<span class="' + className + '">' + escapeHtml(label) + '</span>';
        return '<a class="entity-link ' + className + '" href="' + escapeHtml(href) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(label) + '</a>';
    }

    function renderImpactLines(items) {
        let html = '';
        items.forEach(item => {
            html += '<div class="impact-line"><b>' + escapeHtml(item.kpi) + '</b>';
            if (item.unit) {
                html += ' <span style="color:#6b7280">(' + escapeHtml(item.unit) + ')</span>';
            }
            html += ': ' + escapeHtml(item.expectedImpact);
            if (item.description) {
                html += '<div style="color:#6b7280; font-size:12px; margin-top:2px">' + escapeHtml(item.description) + '</div>';
            }
            html += '</div>';
        });
        return html;
    }

    document.getElementById('Title').innerHTML = escapeHtml(release.title || release.description || 'Release');
    document.getElementById('Meta').innerHTML = escapeHtml(domainName) + ' | ' + escapeHtml(formatDate(release.date));

    let html = '';
    if (release.description) {
        html += '<div class="section"><div class="section-title">Description</div><div class="description">' + escapeHtml(release.description) + '</div></div>';
    }

    if (release.customerImpact && release.customerImpact.length) {
        html += '<div class="section"><div class="section-title">Customer Impact</div>';
        release.customerImpact.forEach(impact => {
            html += '<div class="impact-block">';

<script>
    const breadcrumbs_context = {
  "breadcrumbs": [

;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
