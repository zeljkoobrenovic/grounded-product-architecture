orkbook"]}, "year3": {"focus": "Give viewers the same grid, drill-downs and exports on Tableau, Power BI and Looker Studio under one licence, and let them ask the table a question in plain language that becomes a pivot, filter or formula.", "productTheme": "One grid on Tableau, Power BI and Looker Studio", "customerKPI": {"northStar": "Self-service answer rate", "supporting": ["New dashboard requests per user", "Export reconciliation match rate"]}, "businessKPI": {"northStar": "Active viewers per licensed organisation", "revenueStreams": ["Multi-platform subscriptions covering Tableau, Power BI and Looker Studio", "Active-user tier expansion as viewer adoption grows"], "supporting": ["Cross-platform viewer share", "Discovery extension attach rate"]}, "milestones": ["Reach SuperTables feature parity on Power BI and Looker Studio on the shared runtime", "Launch natural-language questions that produce a pivot, filter or calculated column in the grid", "Bundle DrillDownTree, HierarchyFilter and ProcessMining as a discovery pack on every platform"]}, "year5": {"focus": "Turn the grid into a decision layer that explains variances, proposes the next cut and carries the viewer's answer into Excel, slides and deliveries with provenance, regardless of which BI vendor renders the dashboard.", "productTheme": "Ask the dashboard, keep the provenance", "customerKPI": {"northStar": "Self-service answer rate", "supporting": ["Viewer satisfaction score", "Return visit rate"]}, "businessKPI": {"northStar": "Active viewers per licensed organisation", "revenueStreams": ["Organisation-wide decision-layer licences independent of BI vendor", "AI assistant add-ons for viewers"], "supporting": ["Subscription renewal rate", "Usage-based expansion revenue share"]}, "milestones": ["Release an AI assistant that explains variances and proposes drill paths inside the grid with human confirmation", "Carry provenance (dashboard, filters, date) into every Excel, PDF and slide export", "License the viewer decision layer per organisation across any BI platform"]}}}, "domain": "Business Users and Decision Makers"}, {"id": "plnr", "name": "Planning and Finance Contributor", "description": "The FP&A analyst, demand planner, budget owner or controller at an organisation such as Pfizer, Post Holdings, Amgen or a European bank who has to put numbers into the system, not only read them: monthly forecasts, annual budgets, targets per region, price and volume assumptions, comments explaining a variance, corrections to mis-posted values and approvals of a submitted plan. Until now that meant downloading a dashboard into Excel, editing, emailing versions around and letting someone consolidate; with WriteBackExtreme, InputTables and FinanceTables the entry happens in the Tableau or Power BI dashboard against the organisation's own database, with roles, audit trail and rollback. Uses the extensions free under the Enterprise licence; the cost of the spreadsheet round-trips is what makes the CFO's team the sponsor.", "icon": "plnr.png", "careAbout": ["Entering a forecast or budget where I see the actuals, in a grid that behaves like Excel with formulas, paste and dynamic columns", "Knowing that every number I submitted is stored in our own database with who, when and why, and that I can roll back a mistake", "Explaining a variance with a comment on the number instead of in a separate email thread", "Submitting for approval and seeing the status without chasing, with the approver looking at the same data", "Closing the planning cycle in days rather than weeks of reconciling spreadsheet versions", "Producing the P&L, budget report and management statement from the same data without rebuilding them in Excel"], "winsThem": ["WriteBackExtreme's governed write-back to their own SQL database with audit trail, rollback, role management and SSO, deployable on-premises without internet access", "InputTables cell-level editing with comments, validation and dynamic columns inside a SuperTable, so the input screen is the dashboard they already use", "FinanceTables that render P&Ls, budget reports and management statements from account hierarchies with subtotals, sign conventions and comparison columns", "Approval workflows, task lists and status that mirror the way the finance team actually signs off a plan", "AI-assisted validation that flags implausible entries and drafts the variance comment for the planner to confirm"], "theirFear": ["A write-back tool that stores our forecasts in a vendor's cloud, or that IT and security will never approve", "Silent overwrites when two planners edit the same cells, with no version and no way to know which number won", "An input screen that cannot handle our account structure, dynamic periods or currency rules, so we end up back in Excel anyway"], "jobsToBeDone": [{"id": "jtbd-plnr-1", "name": "Enter and revise forecasts, budgets and targets inside the dashboard", "whatItIs": "During the monthly forecast or the annual budget cycle, enter and revise driver values, volumes, prices and amounts per cost centre, product or region directly in the dashboard next to the actuals and the prior forecast, with Excel-like editing, validation rules and scenario versions, and have every value stored in the organisation's own planning database the moment it is submitted.", "outcome": "A submitted forecast version sits in the governed database within the cycle window, without spreadsheet consolidation, and is immediately visible in the same dashboard to the whole planning team and its approvers.", "steps": [{"step": "Open the planning dashboard for my scope", "description": "Open the forecast dashboard through SSO, see actuals and the prior forecast filtered to the cost centres or regions the planner's role allows, and check the cycle status and submission deadline.", "streamsNeeded": [{"id": "write-back-plan-and-collaborate-in-dashboards", "name": "Write Back, Plan and Collaborate in Dashboards", "howItSupports": "Presents the write-back enabled dashboard with the planner's editable scope and cycle status."}, {"id": "govern-security-and-compliance", "name": "Govern Security and Compliance", "howItSupports": "Applies SSO and role management so each planner edits only their own cost centres."}]}, {"step": "Enter and adjust numbers in the grid", "description": "Type or paste values into InputTables cells, add dynamic columns for new periods, apply growth or spread formulas, copy last year as a baseline and see validation flag entries outside plausible ranges.", "streamsNeeded": [{"id": "write-back-plan-and-collaborate-in-dashboards", "name": "Write Back, Plan and Collaborate in Dashboards", "howItSupports": "Captures cell-level entries with validation and writes them to the customer's planning database."}, {"id": "explore-and-self-serve-data-in-dashboards", "name": "Explore and Self-Serve Data in Dashboards", "howItSupports": "Provides the Excel-like grid behaviour, formulas and grouping the planner works in."}]}, {"step": "Run what-if scenarios", "description": "Save base, upside and downside versions of the same forecast, compare them side by side in the dashboard and pick the one to submit.", "streamsNeeded": [{"id": "write-back-plan-and-collaborate-in-dashboards", "name": "Write Back, Plan and Collaborate in Dashboards", "howItSupports": "Stores scenario versions as separate write-back records and exposes them for comparison."}]}, {"step": "Submit the version", "description": "Submit the forecast version, which locks the cells, records the audit entry and notifies the approver; confirm the submission in the status view.", "streamsNeeded": [{"id": "write-back-plan-and-collaborate-in-dashboards", "name": "Write Back, Plan and Collaborate in Dashboards", "howItSupports": "Runs the submission and locking workflow and writes the audit trail entry."}, {"id": "distribute-reports-and-alerts", "name": "Distribute Reports and Alerts", "howItSupports": "Sends the submission notification to the approver in email or Teams."}]}, {"step": "Revise after review", "description": "Reopen the version when the reviewer sends it back with comments, revise the specific cells and resubmit while the audit trail keeps every previous version.", "streamsNeeded": [{"id": "write-back-plan-and-collaborate-in-dashboards", "name": "Write Back, Plan and Collaborate in Dashboards", "howItSupports": "Reopens locked versions for revision and keeps the version history and audit trail intact."}]}], "media": [{"type": "image", "src": "media/jbtd-plnr-jtbd-plnr-1.png", "title": "Planning and Finance Contributor JTBD infographic: Enter and revise forecasts, budgets and targets inside the dashboard", "alt": "Enterprise infographic for the job \"Enter and revise forecasts, budgets and targets inside the dashboard\" for customer \"Planning and Finance Contributor\"."}]}, {"id": "jtbd-plnr-2", "name": "Comment, correct and approve numbers with a full audit trail", "whatItIs": "Outside the planning cycle, explain variances with comments attached to the numbers, correct wrong values at the source such as a mis-posted cost or a wrong customer segment, track tasks and approvals in the dashboard, and have every change recorded with user, timestamp and previous value so the controller and the auditor can reconstruct what happened.", "outcome": "Numbers are corrected at the source with a traceable reason, variance explanations live next to the figures they explain, and approvals are recorded in one place instead of an email thread or a shadow spreadsheet.", "steps": [{"step": "Annotate a variance", "description": "Add a comment on the cell or row in InputTables that explains why actuals deviate from plan, tag the responsible manager and see the comment appear for every reviewer of that dashboard.", "streamsNeeded": [{"id": "write-back-plan-and-collaborate-in-dashboards", "name": "Write Back, Plan and Collaborate in Dashboards", "howItSupports": "Stores comments and annotations against the number in the customer's database and shows them in the dashboard."}]}, {"step": "Correct a value with justification", "description": "Edit the wrong value, for example reclassify a cost or fix a customer segment, enter the reason, and let role management decide who may edit which columns; the corrected value writes back to the source database.", "streamsNeeded": [{"id": "write-back-plan-and-collaborate-in-dashboards", "name": "Write Back, Plan and Collaborate in Dashboards", "howItSupports": "Applies role-based editing rules and writes the correction with its justification."}, {"id": "govern-security-and-compliance", "name": "Govern Security and Compliance", "howItSupports": "Enforces roles, SSO and audit requirements agreed with security."}]}, {"step": "Route for approval", "description": "Submit corrections or a plan for approval; the approver sees the difference against the previous value and approves or rejects in the same dashboard while task lists track outstanding items.", "streamsNeeded": [{"id": "write-back-plan-and-collaborate-in-dashboards", "name": "Write Back, Plan and Collaborate in Dashboards", "howItSupports": "Runs approval workflows and task lists on the written-back records."}, {"id": "distribute-reports-and-alerts", "name": "Distribute Reports and Alerts", "howItSupports": "Notifies approvers and requesters of pending and completed approvals."}]}, {"step": "Review the audit trail and roll back if needed", "description": "Open the audit trail to see who changed what and when, roll back a wrong change to the previous value, and export the log for the auditor's question.", "streamsNeeded": [{"id": "write-back-plan-and-collaborate-in-dashboards", "name": "Write Back, Plan and Collaborate in Dashboards", "howItSupports": "Provides the audit trail, rollback and log export for every write-back record."}, {"id": "govern-security-and-compliance", "name": "Govern Security and Compliance", "howItSupports": "Supplies the audit evidence format that auditors and compliance reviewers accept."}]}], "media": [{"type": "image", "src": "media/jbtd-plnr-jtbd-plnr-2.png", "title": "Planning and Finance Contributor JTBD infographic: Comment, correct and approve numbers with a full audit trail", "alt": "Enterprise infographic for the job \"Comment, correct and approve numbers with a full audit trail\" for customer \"Planning and Finance Contributor\"."}]}, {"id": "jtbd-plnr-3", "name": "Produce P&Ls and management statements from the dashboard data", "whatItIs": "At month-end, turn the actuals and the submitted forecast into the P&L, budget-versus-actual report and management statement the leadership team expects, with the account hierarchy, subtotals, sign conventions and comparison columns, and get it into the board deck and the mailbox without rebuilding it in Excel.", "outcome": "A finance statement produced from the same governed data in minutes, consistent across dashboard, deck and email, and reused every month without manual rework.", "steps": [{"step": "Configure the statement layout", "description": "Map the chart of accounts to a FinanceTables layout with subtotals, sign flips, currency and comparison columns for actual, budget, forecast and variance, and save it as the monthly template.", "streamsNeeded": [{"id": "report-finance-from-dashboard-data", "name": "Report Finance From Dashboard Data", "howItSupports": "Renders the account hierarchy as a P&L or management statement with the configured layout."}, {"id": "build-interactive-dashboards-with-extensions", "name": "Build Interactive Dashboards With Extensions", "howItSupports": "Lets the creator or controller configure the FinanceTables extension on the dashboard."}]}, {"step": "Review and annotate the statement", "description": "Check totals against the ledger, add variance comments through write-back that appear in the statement, and mark the statement as reviewed.", "streamsNeeded": [{"id": "report-finance-from-dashboard-data", "name": "Report Finance From Dashboard Data", "howItSupports": "Shows the statement with linked comments for review."}, {"id": "write-back-plan-and-collaborate-in-dashboards", "name": "Write Back, Plan and Collaborate in Dashboards", "howItSupports": "Stores the variance comments and review status against the statement lines."}]}, {"step": "Export to the board deck", "description": "Export the statement and supporting charts to PowerPoint with VizSlides and to PDF and Excel for the finance meeting, with the period and filters stated.", "streamsNeeded": [{"id": "report-finance-from-dashboard-data", "name": "Report Finance From Dashboard Data", "howItSupports": "Produces VizSlides, PDF and Excel exports of the finance statement."}]}, {"step": "Schedule the monthly distribution", "description": "Set up a MailScheduler delivery that sends the statement filtered per business unit to its owners in email or Teams once the close is complete.", "streamsNeeded": [{"id": "distribute-reports-and-alerts", "name": "Distribute Reports and Alerts", "howItSupports": "Schedules and delivers per-recipient statement exports after close."}]}], "media": [{"type": "image", "src": "media/jbtd-plnr-jtbd-plnr-3.png", "title": "Planning and Finance Contributor JTBD infographic: Produce P&Ls and management statements from the dashboard data", "alt": "Enterprise infographic for the job \"Produce P&Ls and management statements from the dashboard data\" for customer \"Planning and Finance Contributor\"."}]}], "customerJourneyStories": [{"id": "journey-plnr-1", "name": "Moving the monthly forecast from Excel templates into WriteBackExtreme", "linkedJobIds": ["jtbd-plnr-1", "jtbd-plnr-2"], "summary": "An FP&A team at a pharmaceutical company adopts WriteBackExtreme and InputTables for the monthly forecast: triggered by four-day consolidations and an auditor's unanswered question, discovering write-back through a demo workbook and a partner webinar, evaluating on-premises deployment, roles, audit trail and ISO 27001 with IT and security, trialling one cycle in parallel with the spreadsheets, and staying because the whole cycle now runs in the dashboard.", "stages": [{"stage": "Trigger", "narrative": "The monthly forecast runs through forty Excel templates emailed to cost-centre owners; consolidation takes four days, two versions of the same file collide every cycle, and the auditor has asked who changed a number in the third-quarter forecast, a question nobody can answer."}, {"stage": "Discovery", "narrative": "The Tableau dashboard creator shows the FP&A lead a WriteBackExtreme demo workbook from the gallery in which planners type into the dashboard; the Tableau Exchange listing and a partner webinar confirm that the tool is used by other pharmaceutical and financial customers."}, {"stage": "Evaluation", "narrative": "The FP&A lead, IT and security check that the data stays in the company's own SQL Server database, that the Enterprise installation runs on-premises without internet access and gives the vendor no data access, that SSO and role management restrict who edits which cost centre, that audit trail and rollback exist, and that the vendor is ISO 27001 certified with annual penetration tests. They run the 30-day WriteBackExtreme trial in a personal cloud environment with a copy of last cycle's data."}, {"stage": "Trial", "narrative": "For one forecast cycle ten cost-centre owners enter their numbers in InputTables inside the dashboard in parallel with the Excel templates. The numbers reconcile, consolidation is instantaneous, and the audit trail answers the auditor's question within a minute."}, {"stage": "Engagement", "narrative": "The whole cycle moves into the dashboard: scenarios, comments on variances, submissions and approvals. The team retires the Excel templates, and the FP&A lead reports that everybody is using the dashboard because it is straightforward and intuitive."}, {"stage": "Retention", "narrative": "Cycle time drops from weeks to days; the Enterprise licence renews with a dedicated customer success manager, the planning model expands to headcount and capital expenditure, and the team asks for the same write-back on Power BI for a division that runs on it."}], "media": [{"type": "image", "src": "media/journey-plnr-plnr-1.png", "title": "Planning and Finance Contributor customer journey: Moving the monthly forecast from Excel templates into WriteBackExtreme", "alt": "Enterprise journey storyboard for \"Moving the monthly forecast from Excel templates into WriteBackExtreme\" for customer \"Planning and Finance Contributor\"."}]}, {"id": "journey-plnr-2", "name": "Month-end statements with FinanceTables and written-back comments", "linkedJobIds": ["jtbd-plnr-3", "jtbd-plnr-2"], "summary": "A group controller at a food manufacturer adopts FinanceTables, InputTables comments and MailScheduler for the monthly management P&L: triggered by rebuilding the statement in Excel every month, discovering FinanceTables through the BI lead and the demo workbook, evaluating it against the chart of accounts on the free plan, trialling it for one close in parallel, and staying because the statement, its comments and its distribution now come from one governed source.", "stages": [{"stage": "Trigger", "narrative": "Every month the group controller rebuilds the management P&L in Excel from a Tableau extract because the dashboard cannot render the account hierarchy with subtotals and sign flips; variance explanations live in an email thread that nobody can find at the next close."}, {"stage": "Discovery", "narrative": "The BI lead returns from a Tableau user group with FinanceTables and PowerKPIs on the list; the docs.infotopics.com pages and a gallery demo workbook show a P&L built from an account hierarchy with comparison columns, and the controller recognises her own statement in it."}, {"stage": "Evaluation", "narrative": "The controller tests the free plan with the group's chart of accounts: sign conventions, subtotals, currency, actual-versus-budget-versus-forecast columns, and whether comments can be written back and audited. Rebuilding the statement in a full planning suite is considered and rejected as too large a project for the problem."}, {"stage": "Trial", "narrative": "One month-end close runs FinanceTables in parallel with the Excel P&L; totals match, and variance comments entered through InputTables appear in the statement lines instead of in email."}, {"stage": "Engagement", "narrative": "The statement is exported with VizSlides into the leadership deck and scheduled through MailScheduler to each business-unit owner after close; the controller stops the Excel rebuild and adds the budget report to the same template."}, {"stage": "Retention", "narrative": "The statement becomes the group standard across business units; the finance community adopts the same layout, and the growing number of finance users is what the BI lead cites at renewal."}], "media": [{"type": "image", "src": "media/journey-plnr-plnr-2.png", "title": "Planning and Finance Contributor customer journey: Month-end statements with FinanceTables and written-back comments", "alt": "Enterprise journey storyboard for \"Month-end statements with FinanceTables and written-back comments\" for customer \"Planning and Finance Contributor\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-plnr-top", "name": "Planning cycle time", "description": "Working days from opening a forecast or budget cycle to an approved, consolidated version in the planning database; the planner's headline measure that entering, discussing and approving numbers in the dashboard beats spreadsheet round-trips.", "unit": "working days", "currentValue": "18", "targetValue": "6", "link": "https://dashboard.example.com/bi-dashboard-extensions-platform/customers/plnr/kpis/co-plnr-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-plnr-co-plnr-top.png"}, "branches": [{"id": "co-plnr-b1", "name": "Entry speed and quality", "description": "How much of the plan is entered d c", "name": "Executive Report Recipient", "description": "The director, vice-president, regional head or board member at an organisation such as Bank of America, McDonald's, Toyota or Post Holdings who is often not a Tableau user at all and frequently has no licence. Wants Monday's KPI pack in the inbox or the Teams channel, filtered to their region or business unit, as a PDF to read on a phone or as Excel for the finance meeting; wants one KPI entry point where red means red and the definition is the same across every dashboard; wants to drill only when something is off; and wants the number in the email to equal the number the analyst shows on screen. Reached through MailScheduler deliveries and PowerKPIs hubs that the dashboard creator configures; never configures anything, and never logs into the BI platform unless a red KPI makes it worthwhile.", "icon": "exec.png", "careAbout": ["The right report arriving on time, every time, where I already work: email, Microsoft Teams or Slack, without logging into a BI tool", "Seeing only my region, my business unit and my customers, not a generic pack for everyone", "A single KPI page where status is obvious and the definition is consistent across dashboards", "Trusting that the number in the PDF is the number in the dashboard, with the date and filters stated", "Being able to forward it, print it or open it in Excel for the board meeting", "Being alerted when a KPI crosses a threshold instead of reading everything every week"], "winsThem": ["MailScheduler deliveries personalised per recipient, with filters applied per user, as PDF, PNG, CSV or Excel to email, Teams, Slack or a network drive, with placeholders and a delivery audit trail", "PowerKPIs as the central KPI hub with consistent definitions, thresholds, trends and drill-through to the detailed dashboard", "Reports that reach non-Tableau users without buying seats for people who never explore a dashboard", "Threshold-based alerts and narrative insights that say what changed and why before the meeting", "Presentation-ready exports through VizSlides that go straight into the board pack"], "theirFear": ["A report arriving late or empty before a board meeting, or the wrong region's numbers going to the wrong director", "Numbers in the email disagreeing with what the analyst shows on screen, and nobody able to say which is right", "Having to learn a BI tool or chase the analytics team every week to get what I need"], "jobsToBeDone": [{"id": "jtbd-exec-1", "name": "Receive the right report at the right time where I work", "whatItIs": "Get the weekly and monthly KPI reports and month-end statements automatically, filtered to the executive's own scope, in the format they use, PDF for reading and Excel for the finance meeting, in their mailbox or Teams channel before the meeting, with certainty that a failed delivery is noticed and retried rather than silently missing.", "outcome": "The executive opens the report on time in the channel they already use, with the right scope and numbers that match the dashboard, and never chases the analytics team for it.", "steps": [{"step": "Agree the report, scope and rhythm", "description": "Tell the dashboard creator or BI lead which dashboards, which filters such as region or business unit, which format and which schedule are needed, and keep the recipient list current as the team changes.", "streamsNeeded": [{"id": "distribute-reports-and-alerts", "name": "Distribute Reports and Alerts", "howItSupports": "Captures the schedule, recipient list, per-recipient filters and output formats."}, {"id": "build-interactive-dashboards-with-extensions", "name": "Build Interactive Dashboards With Extensions", "howItSupports": "Provides the dashboards and KPI pages that the deliveries render."}]}, {"step": "Receive the personalised delivery", "description": "MailScheduler renders the dashboard with the recipient's filters at the scheduled time and delivers it to email, Teams, Slack or a network drive with placeholders for date, scope and headline KPI values in the message.", "streamsNeeded": [{"id": "distribute-reports-and-alerts", "name": "Distribute Reports and Alerts", "howItSupports": "Renders and delivers personalised PDF, PNG, CSV and Excel outputs to the chosen channel."}]}, {"step": "Read, forward and act", "description": "Open the PDF on a phone, forward it to the team, open the Excel attachment in the finance meeting, and click through to the live dashboard when licensed to explore further.", "streamsNeeded": [{"id": "distribute-reports-and-alerts", "name": "Distribute Reports and Alerts", "howItSupports": "Includes links, attachments and placeholders that make the delivery usable without the BI tool."}, {"id": "explore-and-self-serve-data-in-dashboards", "name": "Explore and Self-Serve Data in Dashboards", "howItSupports": "Lets a licensed executive continue from the report into the interactive dashboard."}]}, {"step": "Adjust and trust the delivery", "description": "Ask for a change of scope, format or schedule, see in the delivery audit trail what was sent to whom and when, and rely on failed deliveries being retried and reported to the BI team.", "streamsNeeded": [{"id": "distribute-reports-and-alerts", "name": "Distribute Reports and Alerts", "howItSupports": "Keeps the delivery audit trail, retries failures and reports delivery status."}, {"id": "support-and-enable-customers", "name": "Support and Enable Customers", "howItSupports": "Handles change requests and delivery issues through support and customer success."}]}], "media": [{"type": "image", "src": "media/jbtd-exec-jtbd-exec-1.png", "title": "Executive Report Recipient JTBD infographic: Receive the right report at the right time where I work", "alt": "Enterprise infographic for the job \"Receive the right report at the right time where I work\" for customer \"Executive Report Recipient\"."}]}, {"id": "jtbd-exec-2", "name": "See the KPIs that matter and drill only when something is off", "whatItIs": "Open one KPI page, in the delivered report or in the dashboard, that shows the handful of measures the executive owns with status against target and trend, defined the same way across the organisation, and go from a red KPI to the explaining detail in one or two clicks or to a precise question for the analyst, rather than reading fourteen dashboards to find the problem.", "outcome": "The executive spends minutes rather than hours on the KPI review, catches deviations early, and the follow-up questions to the analytics team are specific and answerable.", "steps": [{"step": "Open the KPI entry point", "description": "Open the PowerKPIs page in the dashboard or the delivered report and see KPI tiles with status, trend and target, with the same definition wherever the KPI appears.", "streamsNeeded": [{"id": "build-interactive-dashboards-with-extensions", "name": "Build Interactive Dashboards With Extensions", "howItSupports": "Provides the PowerKPIs hub configured with consistent definitions and thresholds."}, {"id": "explore-and-self-serve-data-in-dashboards", "name": "Explore and Self-Serve Data in Dashboards", "howItSupports": "Renders the KPI tiles and their trends from the dashboard data."}]}, {"step": "Get alerted on thresholds", "description": "Receive a conditional MailScheduler delivery or a Teams or Slack alert when a KPI crosses its threshold, with a narrative insight that states what changed and where.", "streamsNeeded": [{"id": "distribute-reports-and-alerts", "name": "Distribute Reports and Alerts", "howItSupports": "Sends threshold-based alerts and narrative deliveries when KPI conditions are met."}]}, {"step": "Drill from a red KPI to the cause", "description": "Click through from the KPI tile to the detailed dashboard, use HierarchyFilter or DrillDownTree to go from region to branch or store, and read the comments planners have written back against the variance.", "streamsNeeded": [{"id": "explore-and-self-serve-data-in-dashboards", "name": "Explore and Self-Serve Data in Dashboards", "howItSupports": "Provides drill-through and hierarchy navigation from the KPI to the detail."}, {"id": "write-back-plan-and-collaborate-in-dashboards", "name": "Write Back, Plan and Collaborate in Dashboards", "howItSupports": "Shows the variance comments and corrections written back by planners and managers."}]}, {"step": "Decide and record the follow-up", "description": "Add a comment or approve the proposed action in the dashboard, or forward the finding with the export to the responsible manager, so the decision is traceable.", "streamsNeeded": [{"id": "write-back-plan-and-collaborate-in-dashboards", "name": "Write Back, Plan and Collaborate in Dashboards", "howItSupports": "Records the executive's comment or approval with the audit trail."}, {"id": "distribute-reports-and-alerts", "name": "Distribute Reports and Alerts", "howItSupports": "Delivers the finding and export to the responsible manager."}]}], "media": [{"type": "image", "src": "media/jbtd-exec-jtbd-exec-2.png", "title": "Executive Report Recipient JTBD infographic: See the KPIs that matter and drill only when something is off", "alt": "Enterprise infographic for the job \"See the KPIs that matter and drill only when something is off\" for customer \"Executive Report Recipient\"."}]}], "customerJourneyStories": [{"id": "journey-exec-1", "name": "From a chased PDF to MailScheduler reports in Teams", "linkedJobIds": ["jtbd-exec-1"], "summary": "A regional director at a bank's consumer division adopts MailScheduler deliveries in place of a manually exported weekly pack: triggered by late and mis-filtered PDFs, discovering the tool through the BI platform lead's search for a way to reach non-Tableau managers, evaluating timing, scope, consistency and failure handling with IT, trialling four weeks of Monday deliveries, and staying because the pack now arrives before she does.", "stages": [{"stage": "Trigger", "narrative": "The regional director receives the weekly branch performance pack as a PDF that an analyst exports by hand. It arrives on Tuesday afternoon if the analyst is not on leave, sometimes with another region's filter, and the director has no Tableau licence to check it herself."}, {"stage": "Discovery", "narrative": "The BI platform lead, looking for a way to reach three hundred non-Tableau managers without buying seats, finds MailScheduler on the Tableau Exchange and sees it at a partner's session. The director gets a sample delivery in a Teams channel with her region already filtered and the headline KPIs in the message text."}, {"stage": "Evaluation", "narrative": "The director asks the questions that matter to her: will it arrive by Monday at seven, is it my region only, does the number match the dashboard, and what happens if it fails? The BI lead and IT verify per-recipient filters, the delivery audit trail, the on-premises Enterprise deployment that keeps data inside the bank, the ISO 27001 certification and the penetration-test report."}, {"stage": "Trial", "narrative": "For four weeks the pack arrives in her Teams channel and inbox every Monday at half past six, as PDF and Excel, filtered to her region. In the third week the source dashboard fails to refresh and the delivery audit trail shows the retry and the corrected delivery an hour later."}, {"stage": "Engagement", "narrative": "She stops asking the analyst. Deliveries expand to a daily KPI image in Teams and the month-end statement in Excel; she forwards the PDF to branch managers until they receive their own filtered deliveries."}, {"stage": "Retention", "narrative": "At renewal the director's team is the loudest advocate; the recipient list grows to three hundred managers, and the BI lead uses the delivery audit trail to prove reach to people who never had a BI licence."}], "media": [{"type": "image", "src": "media/journey-exec-exec-1.png", "title": "Executive Report Recipient customer journey: From a chased PDF to MailScheduler reports in Teams", "alt": "Enterprise journey storyboard for \"From a chased PDF to MailScheduler reports in Teams\" for customer \"Executive Report Recipient\"."}]}, {"id": "journey-exec-2", "name": "PowerKPIs as the executive entry point to fourteen dashboards", "linkedJobIds": ["jtbd-exec-2", "jtbd-exec-1"], "summary": "A vice-president of operations at a restaurant chain adopts a PowerKPIs hub with drill-through and alerts: triggered by fourteen dashboards he never reads and a board question that took two days, discovering the hub at a quarterly analytics review, evaluating definition consistency, drill-through and mobile use, trialling it for a month alongside a daily PDF, and staying because the KPI page now opens the weekly operations meeting.", "stages": [{"stage": "Trigger", "narrative": "The vice-president has fourteen dashboards and reads none of them; each defines same-store sales slightly differently, and a board question about a red KPI took two days and three analysts to answer."}, {"stage": "Discovery", "narrative": "At the quarterly analytics review the centre of excellence demonstrates a PowerKPIs hub built by the dashboard creator, with ShowMeMore chart types on the detail pages; the vice-president sees a single page with his eight KPIs, status, trend and target."}, {"stage": "Evaluation", "narrative": "He asks whether the definitions are consistent, whether he can drill to a single store, whether it works on his phone and whether the same page can arrive as a PDF. The creator builds it on the free plan first, and the BI lead checks that the extension is safelisted and governed like every other one."}, {"stage": "Trial", "narrative": "For one month the KPI page lives in the dashboard and arrives daily as a MailScheduler PDF. When a KPI turns red he drills through HierarchyFilter to the store level and reads the operations manager's comment written back against the number, without calling anyone."}, {"stage": "Engagement", "narrative": "The KPI page becomes the opening slide of the weekly operations meeting; threshold alerts arrive in Slack, and VizSlides exports feed the board pack. Analysts get specific questions instead of requests to find the problem."}, {"stage": "Retention", "narrative": "The vice-president asks for the same hub for the supply chain; the centre of excellence records decision latency falling, and the Enterprise licence expands to Power BI for a franchise division that runs on it."}], "media": [{"type": "image", "src": "media/journey-exec-exec-2.png", "title": "Executive Report Recipient customer journey: PowerKPIs as the executive entry point to fourteen dashboards", "alt": "Enterprise journey storyboard for \"PowerKPIs as the executive entry point to fourteen dashboards\" for customer \"Executive Report Recipient\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-exec-top", "name": "On-time report delivery rate", "description": "Share of scheduled deliveries that reach the intended recipient before the agreed time with the correct scope and format; the executive's headline measure that the report shows up where and when it should without anyone chasing it.", "unit": "%", "currentValue": "82", "targetValue": "99.5", "link": "https://dashboard.example.com/bi-dashboard-extensions-platform/customers/exec/kpis/co-exec-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-exec-co-exec-top.png"}, "branches": [{"id": "co-exec-b1", "name": "Reliable, personal delivery", "description": "Whether reports arrive in the channel and scope each recipient expects, and how rarely a delivery fails or has to be requested by hand.", "currentValue": "80", "icon": "kpi-exec-co-exec-b1.png", "children": [{"id": "co-exec-b1-c1", "name": "Report open rate", "description": "Share of delivered reports opened by the recipient within 24 hours of delivery.", "unit": "%", "currentValue": "55", "targetValue": "85", "icon": "kpi-exec-co-exec-b1-c1.png", "children": [{"id": "co-exec-b1-c1-l1", "name": "Deliveries to preferred chan -bo-exec-top.png"}, "branches": [{"id": "bo-exec-b1", "name": "MailScheduler and KPI hub reach", "description": "How many Enterprise customers run distribution and KPI hubs, and how far each deployment reaches beyond licensed BI users.", "currentValue": "40", "icon": "kpi-exec-bo-exec-b1.png", "children": [{"id": "bo-exec-b1-c1", "name": "MailScheduler attach rate", "description": "Share of Enterprise customers with MailScheduler live in production.", "unit": "%", "currentValue": "25", "targetValue": "55", "icon": "kpi-exec-bo-exec-b1-c1.png", "children": [{"id": "bo-exec-b1-c1-l1", "name": "Deliveries per customer per month", "description": "Scheduled deliveries executed per MailScheduler customer per month.", "unit": "deliveries / customer / month", "currentValue": "800", "targetValue": "3000", "icon": "kpi-exec-bo-exec-b1-c1-l1.png", "children": []}, {"id": "bo-exec-b1-c1-l2", "name": "Non-BI recipients share", "description": "Share of report recipients who hold no BI platform licence.", "unit": "%", "currentValue": "45", "targetValue": "70", "icon": "kpi-exec-bo-exec-b1-c1-l2.png", "children": []}]}, {"id": "bo-exec-b1-c2", "name": "PowerKPIs attach rate", "description": "Share of customers running a PowerKPIs hub on at least one dashboard.", "unit": "%", "currentValue": "30", "targetValue": "60", "icon": "kpi-exec-bo-exec-b1-c2.png", "children": [{"id": "bo-exec-b1-c2-l1", "name": "KPI hub dashboards per customer", "description": "Dashboards per customer carrying a PowerKPIs hub.", "unit": "dashboards / customer", "currentValue": "2", "targetValue": "6", "icon": "kpi-exec-bo-exec-b1-c2-l1.png", "children": []}, {"id": "bo-exec-b1-c2-l2", "name": "VizSlides export usage rate", "description": "Share of customers producing VizSlides presentation exports each month.", "unit": "%", "currentValue": "15", "targetValue": "40", "icon": "kpi-exec-bo-exec-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-exec-b2", "name": "Enterprise expansion and delivery economics", "description": "How much Enterprise expansion the distribution products drive and what each delivered report costs to render and support.", "currentValue": "55", "icon": "kpi-exec-bo-exec-b2.png", "children": [{"id": "bo-exec-b2-c1", "name": "Distribution-driven expansion revenue share", "description": "Share of Enterprise expansion revenue attributed to MailScheduler and PowerKPIs use.", "unit": "%", "currentValue": "15", "targetValue": "35", "icon": "kpi-exec-bo-exec-b2-c1.png", "children": [{"id": "bo-exec-b2-c1-l1", "name": "Enterprise upgrades citing MailScheduler", "description": "Share of Professional-to-Enterprise upgrades in which MailScheduler is the stated reason.", "unit": "%", "currentValue": "30", "targetValue": "55", "icon": "kpi-exec-bo-exec-b2-c1-l1.png", "children": []}, {"id": "bo-exec-b2-c1-l2", "name": "Recipient growth after first year", "description": "Growth in recipients per customer between the first and second year of MailScheduler use.", "unit": "%", "currentValue": "20", "targetValue": "60", "icon": "kpi-exec-bo-exec-b2-c1-l2.png", "children": []}]}, {"id": "bo-exec-b2-c2", "name": "Delivery cost per report", "description": "Rendering, infrastructure and support cost per thousand delivered reports.", "unit": "EUR / 1,000 deliveries", "currentValue": "90", "targetValue": "35", "icon": "kpi-exec-bo-exec-b2-c2.png", "children": [{"id": "bo-exec-b2-c2-l1", "name": "Rendering time per report", "description": "Seconds to render a dashboard to PDF, PNG or Excel for one recipient.", "unit": "seconds", "currentValue": "45", "targetValue": "12", "icon": "kpi-exec-bo-exec-b2-c2-l1.png", "children": []}, {"id": "bo-exec-b2-c2-l2", "name": "Delivery support tickets per 10,000 deliveries", "description": "Support tickets about failed or wrong deliveries per ten thousand deliveries.", "unit": "tickets / 10,000 deliveries", "currentValue": "4", "targetValue": "1", "icon": "kpi-exec-bo-exec-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Bring the dashboard to the executive instead of the executive to the dashboard: the right KPI, filtered to their world, on time, in the channel they use, with the explanation one click away.", "timeHorizons": {"year1": {"focus": "Make MailScheduler the reliable executive channel: per-recipient filters, placeholders with headline values, Teams and Slack delivery, threshold alerts and a delivery audit trail with automatic retries, so no board pack is ever late or mis-scoped.", "productTheme": "Reliable personal delivery", "customerKPI": {"northStar": "On-time report delivery rate", "supporting": ["Report open rate", "Delivery failure rate"]}, "businessKPI": {"northStar": "Report recipients reached per enterprise customer", "revenueStreams": ["Enterprise subscriptions including MailScheduler", "Active-user tier expansion driven by report recipients"], "supporting": ["MailScheduler attach rate", "Deliveries per customer per month"]}, "milestones": ["Ship threshold-based conditional deliveries and headline KPI placeholders in Teams and Slack messages", "Add automatic retry and delivery-status reporting to the MailScheduler audit trail", "Publish executive pack templates that pair PowerKPIs pages with scheduled PDF and Excel deliveries"]}, "year3": {"focus": "Give executives one KPI entry point with consistent definitions and drill-through on Tableau, Power BI and Looker Studio, with narrative insights that explain what changed inside every delivery.", "productTheme": "One KPI entry point on every platform", "customerKPI": {"northStar": "On-time report delivery rate", "supporting": ["Decision latency", "KPI definition consistency"]}, "businessKPI": {"northStar": "Report recipients reached per enterprise customer", "revenueStreams": ["Multi-platform distribution and KPI hub subscriptions", "Narrative insight add-ons for deliveries"], "supporting": ["PowerKPIs attach rate", "Non-BI recipients share"]}, "milestones": ["Run PowerKPIs and MailScheduler on Power BI and Looker Studio from the shared runtime", "Generate narrative insights that explain KPI changes in every delivery and alert", "Introduce a governed KPI definition catalogue shared by hubs, dashboards and deliveries"]}, "year5": {"focus": "Turn deliveries into decisions: AI agents explain variances, propose actions and route approvals to the executive in Teams or Slack, with the decision written back to the customer's own database and every step auditable.", "productTheme": "Explained KPIs and routed decisions", "customerKPI": {"northStar": "On-time report delivery rate", "supporting": ["Threshold alerts acted on within 24 hours", "Executive trust score"]}, "businessKPI": {"northStar": "Report recipients reached per enterprise customer", "revenueStreams": ["Organisation-wide decision-layer licences regardless of BI vendor", "AI decision agent add-ons"], "supporting": ["Distribution-driven expansion revenue share", "Delivery cost per report"]}, "milestones": ["Launch decision agents that explain a red KPI and propose an action for executive approval in the delivery channel", "Write executive approvals and comments back to the customer's database with full audit trail", "License the executive decision layer per organisation across any BI platform"]}}}, "domain": "Business Users and Decision Makers"}, {"id": "itad", "name": "IT Administrator", "description": "Tableau Server or BI infrastructure administrator at an enterprise customer, typically in a platform-engineering or IT-operations team of two to six people that also runs the database servers, the identity provider and the change process. Installs and upgrades the Enterprise (self-hosted) extensions with ExtensionsManager on Windows or Linux, configures SSO against Entra ID or Okta, sets up the write-back database connections and service accounts, opens the network paths and certificates, safelists the extension URLs on Tableau Server, pulls licence keys and installers from the Enterprise Customer Portal and re-points hundreds of workbooks with TrexReplacer when a server moves. Works in change windows on servers without internet access and is measured on availability, so every install and upgrade must be scripted, reversible and explainable to the change board.", "icon": "itad.png", "careAbout": ["An installer that behaves the same on every server: one-click on Windows, a package on Linux, no surprises about ports, certificates or service accounts", "Upgrades that fit a two-hour change window with a tested rollback, so a new extension version never becomes a Tableau Server incident", "SSO, role management and database connections that follow the organisation's existing identity provider and database standards instead of a parallel user store", "Servers that never need internet access: licence keys, installers and release notes come from the Enterprise Customer Portal and are moved across the air gap by hand", "Knowing which workbooks use which extension version and URL, and changing all of them at once with TrexReplacer during migrations", "Logs, health checks and monitoring hooks so the extension is visible in the same tooling as Tableau Server itself"], "winsThem": ["A reference install on the same operating system and Tableau Server version, walked through by an Infotopics engineer on a screen-share", "ExtensionsManager showing installed extensions, versions, licence status and update availability in one admin console", "A documented port, certificate and safelisting checklist at docs.infotopics.com that the change board accepts as the implementation plan", "TrexReplacer proving on a test site that every workbook can be re-pointed to a new extension URL in minutes rather than by hand", "Priority support and a dedicated customer success manager who know the environment before the first incident"], "theirFear": ["An extension upgrade that breaks the write-back dashboards the planning team uses at month-end, with no clean way back", "A service account or database connection configured with more rights than intended and discovered by the security reviewer after go-live", "A Tableau Server migration that leaves dozens of workbooks pointing at an old extension URL nobody can find"], "jobsToBeDone": [{"id": "jtbd-itad-1", "name": "Install and upgrade the extensions on our own infrastructure without downtime", "whatItIs": "Take an Enterprise licence and turn it into WriteBackExtreme, MailScheduler and the other self-hosted extensions running on the organisation's own Windows or Linux servers, on-premises or in a private cloud, then keep them current with new releases inside normal change windows and without internet access from the servers.", "outcome": "Every extension is installed from a scripted, repeatable procedure, upgrades run in a short change window with a tested rollback, and the extensions are as available as Tableau Server itself.", "steps": [{"step": "Plan the deployment and obtain licence keys", "description": "Size the extension servers, decide on-premises versus private cloud, agree the target Tableau Server version, and download installers, licence keys and release notes from the Enterprise Customer Portal for transfer into the restricted network.", "streamsNeeded": [{"id": "deploy-and-operate-extensions-on-premises", "name": "Deploy and Operate Extensions On-Premises", "howItSupports": "Provides the sizing guidance, prerequisites checklist and installer packages for the chosen deployment model."}, {"id": "manage-licences-users-and-renewals", "name": "Manage Licences, Users and Renewals", "howItSupports": "Issues the licence keys and account entitlements through the Enterprise Customer Portal."}]}, {"step": "Install with the one-click Windows or Linux installer", "description": "Run the Windows one-click installer or the Linux package on the extension server, register the licence key in ExtensionsManager, set the service account, bind certificates and confirm the admin console shows the extension healthy.", "streamsNeeded": [{"id": "d  "Deploy and Operate Extensions On-Premises", "howItSupports": "Exposes health endpoints, logs and update notifications for the installed extensions."}, {"id": "support-and-enable-customers", "name": "Support and Enable Customers", "howItSupports": "Handles incidents under the Enterprise SLA and priority support."}]}], "media": [{"type": "image", "src": "media/jbtd-itad-jtbd-itad-1.png", "title": "IT Administrator JTBD infographic: Install and upgrade the extensions on our own infrastructure without downtime", "alt": "Enterprise infographic for the job \"Install and upgrade the extensions on our own infrastructure without downtime\" for customer \"IT Administrator\"."}]}, {"id": "jtbd-itad-2", "name": "Connect the extensions to our identity provider, databases and network safely", "whatItIs": "Wire the self-hosted extensions into the organisation's SSO, map roles to Tableau groups, create the write-back database connections and service accounts with least privilege, and open exactly the network paths and certificates the extensions need between the browser, Tableau Server, the extension server and the databases.", "outcome": "Users sign in with their corporate identity, write-back reaches only the schemas it should, all traffic is encrypted over approved ports, and the security reviewer signs off the configuration without exceptions.", "steps": [{"step": "Configure SSO and role mapping", "description": "Register the extension as an application in Entra ID, Okta or another SAML or OpenID Connect provider, map identity-provider groups to extension roles such as administrator, editor and viewer, and test login from Tableau Server and Tableau Desktop.", "streamsNeeded": [{"id": "govern-security-and-compliance", "name": "Govern Security and Compliance", "howItSupports": "Defines SSO, role management and the access model the security reviewer expects."}, {"id": "deploy-and-operate-extensions-on-premises", "name": "Deploy and Operate Extensions On-Premises", "howItSupports": "Stores the identity-provider configuration in ExtensionsManager for each installed extension."}]}, {"step": "Set up write-back database connections and service accounts", "description": "Create the target schemas and tables in SQL Server, PostgreSQL, Snowflake or another supported database, provision a service account with rights limited to those schemas, and register the connection in WriteBackExtreme with encrypted credentials.", "streamsNeeded": [{"id": "write-back-plan-and-collaborate-in-dashboards", "name": "Write Back, Plan and Collaborate in Dashboards", "howItSupports": "Defines the write-back schemas, connection settings and audit tables the extension will use."}, {"id": "deploy-and-operate-extensions-on-premises", "name": "Deploy and Operate Extensions On-Premises", "howItSupports": "Holds the database connector configuration and credential store on the extension server."}]}, {"step": "Open the network paths and certificates", "description": "Agree the ports between browser, Tableau Server, extension server and databases with the network team, install trusted TLS certificates, and confirm the servers work without any outbound internet connection.", "streamsNeeded": [{"id": "deploy-and-operate-extensions-on-premises", "name": "Deploy and Operate Extensions On-Premises", "howItSupports": "Documents the required ports, certificates and offline operation of the extension servers."}, {"id": "govern-security-and-compliance", "name": "Govern Security and Compliance", "howItSupports": "Provides the data-flow documentation that justifies each network path to the security reviewer."}]}, {"step": "Validate with the dashboard creator and security", "description": "Run an end-to-end test with a dashboard creator: sign in through SSO, write a value back to the test schema, check the audit record, and walk the security reviewer through the resulting configuration.", "streamsNeeded": [{"id": "build-interactive-dashboards-with-extensions", "name": "Build Interactive Dashboards With Extensions", "howItSupports": "Supplies the test workbook in which the creator exercises the connected extension."}, {"id": "govern-security-and-compliance", "name": "Govern Security and Compliance", "howItSupports": "Captures the validated configuration and audit evidence for sign-off."}]}], "media": [{"type": "image", "src": "media/jbtd-itad-jtbd-itad-2.png", "title": "IT Administrator JTBD infographic: Connect the extensions to our identity provider, databases and network safely", "alt": "Enterprise infographic for the job \"Connect the extensions to our identity provider, databases and network safely\" for customer \"IT Administrator\"."}]}, {"id": "jtbd-itad-3", "name": "Keep every workbook pointing at the right extension version and URL", "whatItIs": "Know which of the organisation's workbooks use which extension, keep them on supported versions, and change the extension URL in all of them at once when Tableau Server is migrated, a hostname changes or an extension moves from SaaS-hosted to self-hosted.", "outcome": "No workbook silently breaks after a migration or upgrade, unsupported versions disappear from the estate, and licence usage and renewals are tracked from the same inventory.", "steps": [{"step": "Inventory extension usage across workbooks", "description": "Scan the Tableau Server sites for workbooks that embed extensions, record extension type, version and URL per workbook and owner, and compare the list with what ExtensionsManager reports as installed.", "streamsNeeded": [{"id": "deploy-and-operate-extensions-on-premises", "name": "Deploy and Operate Extensions On-Premises", "howItSupports": "Scans workbooks with TrexReplacer and lists extension versions and URLs in use."}, {"id": "manage-licences-users-and-renewals", "name": "Manage Licences, Users and Renewals", "howItSupports": "Relates the inventory to licensed extensions and active users per plan."}]}, {"step": "Replace extension URLs with TrexReplacer during migrations", "description": "When a server, hostname or hosting model changes, run TrexReplacer against the affected workbooks to rewrite the extension URLs in bulk, re-publish them and confirm the extensions load with settings intact.", "streamsNeeded": [{"id": "deploy-and-operate-extensions-on-premises", "name": "Deploy and Operate Extensions On-Premises", "howItSupports": "Performs the bulk URL replacement and re-publishing with TrexReplacer."}, {"id": "build-interactive-dashboards-with-extensions", "name": "Build Interactive Dashboards With Extensions", "howItSupports": "Keeps the extension settings persisted in the workbook valid after the URL change."}]}, {"step": "Coordinate version rollouts with creators", "description": "Announce upgrade windows and deprecations to dashboard creators, keep a test site on the new version for them to verify, and retire old versions once every workbook has moved.", "streamsNeeded": [{"id": "deploy-and-operate-extensions-on-premises", "name": "Deploy and Operate Extensions On-Premises", "howItSupports": "Tracks installed versions and which workbooks still depend on a version scheduled for retirement."}, {"id": "support-and-enable-customers", "name": "Support and Enable Customers", "howItSupports": "Provides release notes, deprecation notices and creator-facing upgrade guides."}]}, {"step": "Track licence usage and renewals in the portal", "description": "Review active-user metering, licence key expiry and renewal dates in the Enterprise Customer Portal together with the BI platform lead so no extension stops working because a key lapsed.", "streamsNeeded": [{"id": "manage-licences-users-and-renewals", "name": "Manage Licences, Users and Renewals", "howItSupports": "Shows active users, licence keys, expiry dates and renewal status per extension."}]}], "media": [{"type": "image", "src": "media/jbtd-itad-jtbd-itad-3.png", "title": "IT Administrator JTBD infographic: Keep every workbook pointing at the right extension version and URL", "alt": "Enterprise infographic for the job \"Keep every workbook pointing at the right extension version and URL\" for customer \"IT Administrator\"."}]}], "customerJourneyStories": [{"id": "journey-itad-1", "name": "First Enterprise self-hosted install with ExtensionsManager", "linkedJobIds": ["jtbd-itad-1", "jtbd-itad-2"], "summary": "The Tableau Server administrator of a pharmaceutical company adopts the Enterprise self-hosted deployment of WriteBackExtreme and MailScheduler: triggered by a planning team that needs write-back on servers without internet, discovered through the BI platform lead and a partner, evaluated on the prerequisites checklist, a reference install and the security data-flow documentation, trialled on a test server, and retained on clean upgrades and the ExtensionsManager console.", "stages": [{"stage": "Trigger", "narrative": "The FP&A team wants to enter forecasts directly in Tableau and the BI platform lead has chosen WriteBackExtreme, but the extension must run on the company's own servers in a network segment with no internet access, and the change board wants a named administrator to own it. The administrator has never installed a third-party extension server next to Tableau Server."}, {"stage": "Discovery", "narrative": "The BI platform lead forwards the Enterprise deployment pages and the docs.infotopics.com installation guide; the implementing partner shows a screenshot of ExtensionsManager listing installed extensions, licence status and available updates on a Windows server. The administrator learns that Infotopics hosts nothing in the Enterprise model and needs no data access."}, {"stage": "Evaluation", "narrative": "The administrator works through the prerequisites: supported Windows and Linux versions, ports between browser, Tableau Server, extension server and the SQL Server write-back database, TLS certificates, SSO against Entra ID and a service account with least privilege. An Infotopics engineer walks through a reference install on a screen-share, and the security reviewer receives the data-flow documentation and ISO 27001 certificate in parallel."}, {"stage": "Trial", "narrative": "On a test server the administrator runs the one-click Windows installer, registers the licence key downloaded from the Enterprise Customer Portal in ExtensionsManager, connects SSO and the test schema, safelists the extension URL on the test Tableau Server site and lets a dashboard creator write the first value back. Two port changes and one certificate chain fix later the whole path works without internet."}, {"stage": "Engagement", "narrative": "Production install follows the same script in a scheduled change window; MailScheduler is added a month later with the same procedure. The administrator connects the extension health checks to the monitoring stack, keeps the test server on the next release, and the first upgrade runs in forty minutes with the previous version staged for rollback."}, {"stage": "Retention", "narrative": "Two years in, upgrades are routine change tickets, the change board treats the checklist as the standard, and the administrator adds SuperTables self-hosted on the same server. When the company migrates to new hosts, TrexReplacer is already on the list, and the administrator recommends the Enterprise model to a peer at the next Tableau user group."}], "media": [{"type": "image", "src": "media/journey-itad-itad-1.png", "title": "IT Administrator customer journey: First Enterprise self-hosted install with ExtensionsManager", "alt": "Enterprise journey storyboard for \"First Enterprise self-hosted install with ExtensionsManager\" for customer \"IT Administrator\"."}]}, {"id": "journey-itad-2", "name": "Migrating Tableau Server and re-pointing every workbook with TrexReplacer", "linkedJobIds": ["jtbd-itad-3", "jtbd-itad-1"], "summary": "A bank's platform administrator adopts TrexReplacer and the upgrade automation during a Tableau Server migration to new Linux hosts: triggered by hundreds of workbooks embedding extension URLs that will change, discovered through the support portal and release notes, evaluated on a scan of the estate and a bulk replacement on a test site, trialled on one department's workbooks, and retained on a migration weekend without a single broken extension.", "stages": [{"stage": "Trigger", "narrative": "The bank is moving Tableau Server from Windows to new Linux hosts with a new hostname, and a first inventory shows more than four hundred workbooks embedding SuperTables, PowerKPIs and WriteBackExtreme with the old extension URL. Editing them by hand would take weeks and the migration weekend is fixed."}, {"stage": "Discovery", "narrative": "A support ticket about the migration comes back with a link to TrexReplacer and the Linux installer guide; the release notes describe bulk replacement of extension URLs across published workbooks and the customer success manager offers a migration call. The administrator also learns that the Linux package of ExtensionsManager carries the same admin console."}, {"stage": "Evaluation", "narrative": "The administrator scans all sites with TrexReplacer to list extension versions and URLs per workbook and owner, tests a bulk replacement on a copy of one site, and checks that settings persisted in the workbooks survive the change. The change board reviews the plan, the security reviewer confirms the new hosts inherit the existing SSO and database configuration, and the migration runbook is written around the tool."}, {"stage": "Trial", "narrative": "One department's sixty workbooks are migrated first: extensions are installed on the new Linux hosts from the Enterprise Customer Portal packages, URLs are replaced in bulk, the workbooks are re-published and their owners verify every dashboard. One extension version is found to be unsupported and upgraded in the same pass."}, {"stage": "Engagement", "narrative": "On the migration weekend the remaining workbooks are re-pointed in under an hour, the old hosts are decommissioned, and the administrator keeps the inventory as a standing report used for every later upgrade and deprecation. Licence keys, active-user metering and renewal dates are now reviewed quarterly in the portal with the BI platform lead."}, {"stage": "Retention", "narrative": "The migration closes with zero broken extension references, upgrade lead time drops from weeks to days, and the administrator's runbook becomes the bank's standard for extension changes. When a second hostname change comes with a data-centre move, nobody considers doing it any other way."}], "media": [{"type": "image", "src": "media/journey-itad-itad-2.png", "title": "IT Administrator customer journey: Migrating Tableau Server and re-pointing every workbook with TrexReplacer", "alt": "Enterprise journey storyboard for \"Migrating Tableau Server and re-pointing every workbook with TrexReplacer\" for customer \"IT Administrator\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-itad-top", "name": "Extension upgrade lead time", "description": "Calendar days from a new extension release becoming available in the Enterprise Customer Portal until it is running in production, the administrator's headline measure of a deployment path that is scripted, safe and fast.", "unit": "days", "currentValue": "21", "targetValue": "5", "link": "https://dashboard.example.com/bi-dashboard-extensions-platform/customers/itad/kpis/co-itad-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-itad-co-itad-top.png"}, "branches": [{"id": "co-itad-b1", "name": "Deployment speed and effort", "description": "How little administrator time and change-window time an install or upgrade consumes.", "currentValue": "52", "icon": "kpi-itad-co-itad-b1.png", "children": [{"id": "co-itad-b1-c1", "name": "Installation effort hours", "description": "Administrator hours per extension install or upgrade, from download in the portal to validated production service.", "unit": "hours", "currentValue": "16", "targetVa
