nts running a release within 90 days of its availability.", "unit": "%", "currentValue": "40", "targetValue": "80", "icon": "kpi-itad-bo-itad-b1-c2-l2.png", "children": []}]}]}, {"id": "bo-itad-b2", "name": "Cost to serve self-hosted deployments", "description": "How cheaply the vendor supports installs, upgrades and the variety of environments in the field.", "currentValue": "50", "icon": "kpi-itad-bo-itad-b2.png", "children": [{"id": "bo-itad-b2-c1", "name": "Deployment support tickets per customer", "description": "Support tickets per self-hosted customer per quarter about installation, upgrade, SSO or connectivity.", "unit": "tickets / quarter", "currentValue": "6", "targetValue": "2", "icon": "kpi-itad-bo-itad-b2-c1.png", "children": [{"id": "bo-itad-b2-c1-l1", "name": "Installer-related ticket share", "description": "Share of deployment tickets caused by installer or ExtensionsManager behaviour rather than customer environment.", "unit": "%", "currentValue": "30", "targetValue": "10", "icon": "kpi-itad-bo-itad-b2-c1-l1.png", "children": []}, {"id": "bo-itad-b2-c1-l2", "name": "Deployment ticket resolution time", "description": "Hours from a deployment ticket being opened under the Enterprise SLA to resolution.", "unit": "hours", "currentValue": "36", "targetValue": "8", "icon": "kpi-itad-bo-itad-b2-c1-l2.png", "children": []}]}, {"id": "bo-itad-b2-c2", "name": "Onboarding hours per enterprise deployment", "description": "Vendor engineer and customer success hours spent bringing a self-hosted customer to production.", "unit": "hours", "currentValue": "20", "targetValue": "6", "icon": "kpi-itad-bo-itad-b2-c2.png", "children": [{"id": "bo-itad-b2-c2-l1", "name": "Supported extension versions in the field", "description": "Distinct extension versions still running at customers and requiring support.", "unit": "versions", "currentValue": "9", "targetValue": "4", "icon": "kpi-itad-bo-itad-b2-c2-l1.png", "children": []}, {"id": "bo-itad-b2-c2-l2", "name": "Remote install sessions per customer", "description": "Screen-share sessions with a vendor engineer needed before a customer's first production install.", "unit": "sessions", "currentValue": "3", "targetValue": "1", "icon": "kpi-itad-bo-itad-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make the self-hosted extensions the easiest third-party software a Tableau or Power BI administrator runs: installed in a click, upgraded in minutes, wired into the organisation's own identity, databases and monitoring, and never dependent on the internet or on the vendor seeing customer data.", "timeHorizons": {"year1": {"focus": "Harden the Enterprise deployment path: one-click Windows and Linux installers, ExtensionsManager as the single admin console, upgrade automation with rollback, TrexReplacer for migrations, and a prerequisites checklist that change boards accept as the plan.", "productTheme": "Scripted, reversible enterprise deployment", "customerKPI": {"northStar": "Extension upgrade lead time", "supporting": ["Installation effort hours", "First-attempt installer success rate"]}, "businessKPI": {"northStar": "Enterprise deployment revenue per customer", "revenueStreams": ["Enterprise self-hosted subscriptions", "Priority support and SLA add-ons", "Deployment onboarding services"], "supporting": ["Self-hosted share of enterprise customers", "Deployment support tickets per customer"]}, "milestones": ["Ship upgrade automation with staged rollback in ExtensionsManager for Windows and Linux", "Publish the ports, certificates and safelisting checklist as the standard implementation plan at docs.infotopics.com", "Bring every Enterprise customer onto TrexReplacer-based inventory before their next Tableau Server upgrade"]}, "year3": {"focus": "Run one self-hosted runtime for every extension across Tableau, Power BI and Looker Studio: a single installer, licence and admin console, health and log integration with common monitoring stacks, and container images for private cloud, so an administrator maintains one thing rather than one per product.", "productTheme": "One runtime, one console, every platform", "customerKPI": {"northStar": "Extension upgrade lead time", "supporting": ["Extension availability", "Change window duration"]}, "businessKPI": {"northStar": "Enterprise deployment revenue per customer", "revenueStreams": ["Multi-platform enterprise subscriptions", "Private cloud runtime licences", "Managed upgrade services"], "supporting": ["Extensions per self-hosted deployment", "Upgrade adoption within 90 days"]}, "milestones": ["Deliver the unified runtime and container images hosting Tableau, Power BI and Looker Studio extensions from one ExtensionsManager", "Expose health endpoints, logs and metrics for common monitoring stacks and Tableau Server health tooling", "Retire legacy per-product installers and reduce supported versions in the field to a single maintained line"]}, "year5": {"focus": "Operate the decision layer inside the customer's own environment: AI services, write-back workflows and distribution run on the self-hosted runtime with customer data never leaving it, and upgrades, capacity and configuration drift are handled by supervised automation the administrator approves rather than performs.", "productTheme": "Self-operating decision layer on customer infrastructure", "customerKPI": {"northStar": "Extension upgrade lead time", "supporting": ["Manual configuration steps per deployment", "Mean time to restore extension service"]}, "businessKPI": {"northStar": "Enterprise deployment revenue per customer", "revenueStreams": ["Platform-independent decision layer licences", "On-premises AI service add-ons", "Automated operations subscriptions"], "supporting": ["Enterprise renewal rate", "Onboarding hours per enterprise deployment"]}, "milestones": ["Run AI insight and write-back validation services fully inside the customer's self-hosted runtime", "Ship supervised automation for upgrades, configuration drift and capacity that administrators approve from ExtensionsManager", "Reach production within ten days of licence issue for the majority of new enterprise deployments"]}}}, "domain": "IT, Security and Procurement"}, {"id": "secr", "name": "Security and Compliance Reviewer", "description": "Information security officer, third-party risk analyst or compliance manager at a regulated enterprise customer in banking, pharma, healthcare or the public sector, sitting in a small vendor-risk team that must approve every piece of software before the BI platform lead may safelist it on Tableau Server or Tableau Cloud. Assesses the vendor and the deployment: the ISO/IEC 27001:2022 certificate and statement of applicability, annual penetration-test reports, standard questionnaire answers, data-flow diagrams per hosting model, sub-processors, encryption, SSO and role management, on-premises isolation, the data processing agreement and the audit trail behind write-back and report distribution. Answers to internal audit and regulators, so what matters is evidence that can be filed, controls that can be tested and a residual risk that can be defended.", "icon": "secr.png", "careAbout": ["A complete evidence pack up front: ISO 27001 certificate, statement of applicability, latest penetration-test summary, data-flow diagrams and standard questionnaire answers, without weeks of back-and-forth", "Exactly what data the extension touches in each deployment model, where it is processed and whether the vendor can ever see it", "Identity, access and role management that reuse the organisation's identity provider and least-privilege standards", "A data processing agreement, sub-processor list and breach-notification terms that legal can sign without long redlines", "An audit trail that records who changed which number when, including approvals and rollbacks, in a form internal audit and regulators accept", "A re-assessment rhythm with new pen-test reports and change notifications delivered proactively rather than chased"], "winsThem": ["An ISO/IEC 27001:2022 certificate and an annual penetration-test report that arrive with the first request, not after escalation", "Data-flow documentation showing that in the Enterprise self-hosted model no data leaves the organisation and Infotopics has no access", "Write-back audit trails with user, timestamp, old and new value and approval status that map onto internal control frameworks", "SSO, role management and safelisting controls that fit the existing Tableau Server governance", "A trust centre and a security contact who answer questionnaire items in days and notify changes without being asked"], "theirFear": ["Approving a browser extension that quietly sends dashboard data to a vendor server outside the approved region", "An audit finding that forecasts or corrections were changed in a dashboard with no record of who did it", "A vendor whose certification lapses or whose pen-test findings stay open, leaving the reviewer to defend the approval"], "jobsToBeDone": [{"id": "jtbd-secr-1", "name": "Assess the vendor and deployment against our security and privacy standards quickly", "whatItIs": "Run the third-party risk assessment of the extension vendor and the chosen deployment model from evidence request to approval: collect certificates and reports, map the data flows, verify identity and access controls, agree the data processing agreement, record residual risk and set the conditions and cadence for re-assessment.", "outcome": "The assessment closes in days rather than months with a filed evidence pack, a documented data flow per deployment model, a signed DPA and a residual risk the reviewer can defend to internal audit and regulators.", "steps": [{"step": "Collect the evidence pack", "description": "Request the ISO/IEC 27001:2022 certificate and statement of applicability, the latest penetration-test summary, standard questionnaire answers, SLAs and the sub-processor list from the trust centre or the security contact.", "streamsNeeded": [{"id": "govern-security-and-compliance", "name": "Govern Security and Compliance", "howItSupports": "Provides the certification, penetration-test and questionnaire evidence in a downloadable pack."}, {"id": "support-and-enable-customers", "name": "Support and Enable Customers", "howItSupports": "Routes evidence requests and follow-up questions to the security contact within SLA."}]}, {"step": "Map the data flows per deployment model", "description": "Compare the SaaS-hosted model, where Infotopics serves the extension web application and licence service, with the Enterprise self-hosted model, where everything runs inside the organisation, and confirm what data is processed where and by whom.", "streamsNeeded": [{"id": "govern-security-and-compliance", "name": "Govern Security and Compliance", "howItSupports": "Supplies data-flow diagrams and processing descriptions for each hosting model."}, {"id": "deploy-and-operate-extensions-on-premises", "name": "Deploy and Operate Extensions On-Premises", "howItSupports": "Documents the isolated, no-internet operation of the self-hosted extension servers."}]}, {"step": "Review identity, access and role controls", "description": "Check that SSO uses the organisation's identity provider, that roles and permissions follow least privilege, that service accounts are scoped to write-back schemas, and that safelisting on Tableau Server restricts which extensions may run.", "streamsNeeded": [{"id": "govern-security-and-compliance", "name": "Govern Security and Compliance", "howItSupports": "Describes SSO, role management, safelisting and credential handling controls with test evidence."}]}, {"step": "Sign the DPA and record residual risk", "description": "Agree the data processing agreement, sub-processor and breach-notification terms with legal and procurement, log the assessment and remaining findings in the vendor-risk register, and attach the evidence pack.", "streamsNeeded": [{"id": "govern-security-and-compliance", "name": "Govern Security and Compliance", "howItSupports": "Provides the standard DPA, sub-processor list and findings status for the risk register."}, {"id": "manage-licences-users-and-renewals", "name": "Manage Licences, Users and Renewals", "howItSupports": "Links the signed agreements to the subscription, purchase order and renewal record."}]}, {"step": "Approve safelisting and set re-assessment cadence", "description": "Give the BI platform lead and IT administrator the go-ahead to safelist and deploy under stated conditions, subscribe to change and pen-test notifications, and schedule the annual re-assessment.", "streamsNeeded": [{"id": "govern-security-and-compliance", "name": "Govern Security and Compliance", "howItSupports": "Records the approval conditions and pushes new certificates, pen-test reports and change notices."}, {"id": "deploy-and-operate-extensions-on-premises", "name": "Deploy and Operate Extensions On-Premises", "howItSupports": "Applies the approved safelisting and deployment configuration."}]}], "media": [{"type": "image", "src": "media/jbtd-secr-jtbd-secr-1.png", "title": "Security and Compliance Reviewer JTBD infographic: Assess the vendor and deployment against our security and privacy standards quickly", "alt": "Enterprise infographic for the job \"Assess the vendor and deployment against our security and privacy standards quickly\" for customer \"Security and Compliance Reviewer\"."}]}, {"id": "jtbd-secr-2", "name": "Prove to auditors who changed which number when", "whatItIs": "Make the numbers entered, corrected, approved and distributed through the extensions auditable: define the audit and approval policy for write-back, verify that every change carries user, timestamp, old and new value and approval status, keep the delivery log of distributed reports, and produce evidence on request from internal audit, external auditors or regulators.", "outcome": "Every write-back change and every distributed report is traceable end to end, audit evidence is produced from system records within the agreed service level, and no finding is raised for untraceable changes to planning or financial figures.", "steps": [{"step": "Define the audit and approval policy for write-back", "description": "Agree with finance and the dashboard creators which write-back tables need approval workflows, which changes require a comment, who may roll back, and how long audit records are retained in the organisation's database.", "streamsNeeded": [{"id": "write-back-plan-and-collaborate-in-dashboards", "name": "Write Back, Plan and Collaborate in Dashboards", "howItSupports": "Configures approval workflows, mandatory comments and rollback rights per write-back table."}, {"id": "govern-security-and-compliance", "name": "Govern Security and Compliance", "howItSupports": "Records the policy and retention decisions as part of the control framework."}]}, {"step": "Verify the audit trail captures every change", "description": "Test that each write-back entry records the SSO identity, timestamp, old and new value, comment and approval status, that rollbacks are themselves logged, and that the audit tables live in the organisation's governed database.", "streamsNeeded": [{"id": "write-back-plan-and-collaborate-in-dashboards", "name": "Write Back, Plan and Collaborate in Dashboards", "howItSupports": "Writes the audit records for every entry, correction, approval and rollback."}, {"id": "govern-security-and-compliance", "name": "Govern Security and Compliance", "howItSupports": "Provides audit-trail specifications and test evidence for the control test."}]}, {"step": "Review delivery logs for distributed reports", "description": "Check that scheduled report deliveries to email, Microsoft Teams, Slack and network drives are logged with recipient, filter, format and time, and that recipient lists are reviewed against access rights.", "streamsNeeded": [{"id": "distribute-reports-and-alerts", "name": "Distribute Reports and Alerts", "howItSupports": "Keeps the delivery log and recipient configuration for every scheduled report."}, {"id": "govern-security-and-compliance", "name": "Govern Security and Compliance", "howItSupports": "Frames the recipient-access review as a periodic control."}]}, {"step": "Produce audit evidence on request", "description": "Answer internal audit, external auditor and regulator requests with extracts of the write-back audit trail and delivery logs for a given period, table or user, straight from system records.", "streamsNeeded": [{"id": "govern-security-and-compliance", "name": "Govern Security and Compliance", "howItSupports": "Produces audit-trail extracts and evidence reports for auditors."}, {"id": "support-and-enable-customers", "name": "Support and Enable Customers", "howItSupports": "Assists with evidence queries and documentation under the Enterprise SLA."}]}], "media": [{"type": "image", "src": "media/jbtd-secr-jtbd-secr-2.png", "title": "Security and Compliance Reviewer JTBD infographic: Prove to auditors who changed which number when", "alt": "Enterprise infographic for the job \"Prove to auditors who changed which number when\" for customer \"Security and Compliance Reviewer\"."}]}], "customerJourneyStories": [{"id": "journey-secr-1", "name": "Running the vendor assessment for the first WriteBackExtreme deployment", "linkedJobIds": ["jtbd-secr-1"], "summary": "A bank's third-party risk analyst assesses Infotopics and the Enterprise self-hosted deployment before WriteBackExtreme may be safelisted: triggered by a safelisting request from the BI platform lead, discovered through the trust centre and a peer bank's assessment, evaluated on ISO 27001 evidence, pen-test reports and data-flow diagrams, trialled through a conditional approval of a test environment, and retained on proactive evidence updates.", "stages": [{"stage": "Trigger", "narrative": "The BI platform lead files a request to safelist WriteBackExtreme on Tableau Server so finance can enter forecasts in dashboards. The vendor-risk policy classifies any software that writes to production databases as high impact, and the analyst has no prior file on the vendor, only a name and a website."}, {"stage": "Discovery", "narrative": "The analyst finds the security pages and trust-centre downloads on the vendor website, sees the ISO/IEC 27001:2022 certification and the statement that Enterprise deployments need no internet and give the vendor no data access, and hears from a peer at another bank that their assessment closed on a standard evidence pack."}, {"stage": "Evaluation", "narrative": "The evidence request returns the certificate, statement of applicability, the latest penetration-test summary, the standard questionnaire answers, SLAs and the sub-processor list within days. The analyst maps the data flows of the self-hosted model with the IT administrator, checks SSO, role management, service-account scoping and the audit tables, and legal reviews the DPA with only two redlines."}, {"stage": "Trial", "narrative": "A conditional approval allows a test environment: the extension runs on a segregated server, writes only to a sandbox schema, and the analyst reviews the resulting audit records and network traces. Two findings on certificate handling and log retention are raised, answered by the vendor's security contact and closed before production."}, {"stage": "Engagement", "narrative": "Production approval is filed with the evidence pack, the residual-risk statement and the re-assessment date; MailScheduler and SuperTables are added under the same file with a delta review. The analyst subscribes to change and pen-test notifications and treats the vendor as a known quantity in the risk register."}, {"stage": "Retention", "narrative": "The annual re-assessment takes hours instead of weeks because the new certificate and pen-test report arrive proactively and nothing in the data flow has changed. When another business unit asks about Power BI visuals from the same vendor, the analyst reuses the file, and the bank's assessment template now cites this vendor pack as the expected standard."}], "media": [{"type": "image", "src": "media/journey-secr-secr-1.png", "title": "Security and Compliance Reviewer customer journey: Running the vendor assessment for the first WriteBackExtreme deployment", "alt": "Enterprise journey storyboard for \"Running the vendor assessment for the first WriteBackExtreme deployment\" for customer \"Security and Compliance Reviewer\"."}]}, {"id": "journey-secr-2", "name": "Bringing write-back and report distribution under internal audit", "linkedJobIds": ["jtbd-secr-2", "jtbd-secr-1"], "summary": "A pharmaceutical company's compliance manager adopts the audit trail of WriteBackExtreme and the delivery log of MailScheduler as audited controls: triggered by an internal-audit question about untraceable forecast changes, discovered through the finance team's dashboard and the vendor documentation, evaluated on a control test of the audit tables, trialled on one planning cycle, and retained on clean audit findings and evidence produced in minutes.", "stages": [{"stage": "Trigger", "narrative": "Internal audit asks who changed the quarterly demand forecast that fed a management report, and the answer is a spreadsheet with tracked changes turned off. The compliance manager must show a control over planning figures before the next audit cycle, and finance has just started entering forecasts through a Tableau dashboard."}, {"stage": "Discovery", "narrative": "The planning lead shows the WriteBackExtreme audit view with user, timestamp, old and new value and comment for every entry, and the documentation at docs.infotopics.com describes approval workflows, rollback and audit tables stored in the company's own database. The BI platform lead adds that MailScheduler logs every scheduled delivery with recipient and filter."}, {"stage": "Evaluation", "narrative": "The compliance manager designs a control test with internal audit: sample entries, corrections, approvals and rollbacks, trace each to an SSO identity and timestamp, confirm the audit tables cannot be edited by dashboard users, and check retention against policy. The delivery log is reviewed against report recipient access rights and the earlier vendor assessment file is reused for the security part."}, {"stage": "Trial", "narrative": "One planning cycle runs with approval workflows and mandatory comments switched on for the forecast tables, and the compliance manager pulls the audit extract at cycle end. The test finds one table without an approval step and one recipient list with a leaver on it; both are fixed in configuration rather than in process."}, {"stage": "Engagement", "narrative": "The audit trail and delivery log become documented controls in the compliance framework, with quarterly extracts and an annual recipient review. Finance moves budget corrections and management-statement comments onto the same write-back tables so the same control covers them."}, {"stage": "Retention", "narrative": "The next internal audit closes with no findings on planning figures, evidence requests are answered from the audit tables in minutes, and the compliance manager cites the setup when the regulator asks about controls over management reporting. Any proposal to move planning back to spreadsheets is now a compliance question, not a convenience one."}], "media": [{"type": "image", "src": "media/journey-secr-secr-2.png", "title": "Security and Compliance Reviewer customer journey: Bringing write-back and report distribution under internal audit", "alt": "Enterprise journey storyboard for \"Bringing write-back and report distribution under internal audit\" for customer \"Security and Compliance Reviewer\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-secr-top", "name": "Vendor assessment cycle time", "description": "Calendar days from the first evidence request to the filed approval of the vendor and deployme ": "days", "currentValue": "14", "targetValue": "2", "icon": "kpi-secr-co-secr-b1-c2-l1.png", "children": []}, {"id": "co-secr-b1-c2-l2", "name": "Change notifications reviewed on time", "description": "Share of sub-processor, certification and architecture change notices reviewed within the policy window.", "unit": "%", "currentValue": "80", "targetValue": "100", "icon": "kpi-secr-co-secr-b1-c2-l2.png", "children": []}]}]}, {"id": "co-secr-b2", "name": "Control coverage and residual risk", "description": "How few findings remain open and how completely changes and deliveries are traceable for auditors.", "currentValue": "60", "icon": "kpi-secr-co-secr-b2.png", "children": [{"id": "co-secr-b2-c1", "name": "Open security findings", "description": "Findings from assessments, penetration tests or control tests that are still open against the vendor or the deployment.", "unit": "findings", "currentValue": "5", "targetValue": "0", "icon": "kpi-secr-co-secr-b2-c1.png", "children": [{"id": "co-secr-b2-c1-l1", "name": "High-severity findings open beyond 30 days", "description": "High-severity findings that have not been remediated or formally accepted within 30 days.", "unit": "findings", "currentValue": "1", "targetValue": "0", "icon": "kpi-secr-co-secr-b2-c1-l1.png", "children": []}, {"id": "co-secr-b2-c1-l2", "name": "Mean days to close a finding", "description": "Average days from a finding being raised to closure with evidence.", "unit": "days", "currentValue": "45", "targetValue": "14", "icon": "kpi-secr-co-secr-b2-c1-l2.png", "children": []}]}, {"id": "co-secr-b2-c2", "name": "Audit trail coverage", "description": "Share of write-back tables and scheduled report deliveries covered by a complete, tested audit trail.", "unit": "%", "currentValue": "60", "targetValue": "100", "icon": "kpi-secr-co-secr-b2-c2.png", "children": [{"id": "co-secr-b2-c2-l1", "name": "Write-back changes with complete audit record", "description": "Share of write-back entries carrying identity, ne": [{"id": "jtbd-cpar-1", "name": "Win and deliver extension projects for my clients in my region", "whatItIs": "Recognise in a client's dashboard, planning or reporting project where an extension replaces custom development, demonstrate it with demo licences and gallery workbooks, register and quote the deal, implement and configure the extensions with the client's dashboard creators and IT, and hand the client over to vendor support and customer success.", "outcome": "Registered deals close at a high rate, implementations finish within the estimated hours, clients go live on supported configurations, and each project produces a reference the partner can reuse in the region.", "steps": [{"step": "Spot the opportunity in a client project", "description": "During a dashboard or planning engagement, recognise the requirement an extension fits: Excel-like tables for finance, forecast entry in Tableau, scheduled report delivery to non-Tableau users, or guided adoption of a new dashboard.", "streamsNeeded": [{"id": "sell-and-deliver-through-partners", "name": "Sell and Deliver Through Partners", "howItSupports": "Provides use-case playbooks and qualification guidance for partner consultants."}, {"id": "discover-trial-and-subscribe-to-extensions", "name": "Discover, Trial and Subscribe to Extensions", "howItSupports": "Supplies the product pages, plan structure and pricing the consultant positions with the client."}]}, {"step": "Demo with partner demo licences and gallery workbooks", "description": "Show the extension on the client's own data or on gallery workbooks using the partner demo licence, and set up a free plan or 30-day WriteBackExtreme trial in the client's environment so the client's creators can try it.", "streamsNeeded": [{"id": "sell-and-deliver-through-partners", "name": "Sell and Deliver Through Partners", "howItSupports": "Issues and manages partner demo licences and demo environments."}, {"id": "discover-trial-and-subscribe-to-extensions", "name": "Di  Enable Customers", "howItSupports": "Takes over tickets, documentation and customer-success reviews for the client."}, {"id": "sell-and-deliver-through-partners", "name": "Sell and Deliver Through Partners", "howItSupports": "Records the delivered project and reference for partner recognition and renewals."}]}], "media": [{"type": "image", "src": "media/jbtd-cpar-jtbd-cpar-1.png", "title": "Consulting and Reseller Partner JTBD infographic: Win and deliver extension projects for my clients in my region", "alt": "Enterprise infographic for the job \"Win and deliver extension projects for my clients in my region\" for customer \"Consulting and Reseller Partner\"."}]}, {"id": "jtbd-cpar-2", "name": "Earn recurring margin and enablement from the partner programme", "whatItIs": "Run the partnership as a business line: complete onboarding and certification, co-market in the region and language, track renewals and expansions of the client base for recurring margin, and feed client requirements into the vendor roadmap so the partner's practice stays ahead of the market.", "outcome": "The partner earns a growing, predictable margin on new and renewed subscriptions plus services, keeps a certified team, receives referrals from the vendor, and sees client requests reflected in the product.", "steps": [{"step": "Complete partner onboarding and certification", "description": "Sign the partner agreement, set up the partner portal account and demo licences, and have consultants complete product and Enterprise deployment training and certification.", "streamsNeeded": [{"id": "sell-and-deliver-through-partners", "name": "Sell and Deliver Through Partners", "howItSupports": "Runs partner onboarding, agreements, portal access and demo licence issue."}, {"id": "support-and-enable-customers", "name": "Support and Enable Customers", "howItSupports": "Delivers training, webinars and certification for partner consultants."}]}, {"step": "Co-market in the region and language", "description": "Run joint webinars, local-language case studies and Tableau or Power BI user-group sessions, be listed on the vendor's partner page, and receive referrals from website, Tableau Exchange and AppSource leads in the region.", "streamsNeeded": [{"id": "sell-and-deliver-through-partners", "name": "Sell and Deliver Through Partners", "howItSupports": "Coordinates co-marketing, partner listing and regional lead referral."}, {"id": "discover-trial-and-subscribe-to-extensions", "name": "Discover, Trial and Subscribe to Extensions", "howItSupports": "Generates the inbound trials and signups that can be referred to partners."}]}, {"step": "Track renewals and expansions of my clients", "description": "See the renewal dates, active-user metering and plan status of every client the partner sourced, propose upgrades from Professional to Enterprise or additional extensions, and receive renewal margin.", "streamsNeeded": [{"id": "manage-licences-users-and-renewals", "name": "Manage Licences, Users and Renewals", "howItSupports": "Shows renewal dates, active users and plan status of partner-sourced clients."}, {"id": "sell-and-deliver-through-partners", "name": "Sell and Deliver Through Partners", "howItSupports": "Attributes renewals and expansions to the partner and pays margin."}]}, {"step": "Feed client requirements into the roadmap", "description": "Collect feature requests and platform needs from client projects, raise them through the partner manager and prioritised feature-request channel, and get early access to releases and roadmap briefings.", "streamsNeeded": [{"id": "support-and-enable-customers", "name": "Support and Enable Customers", "howItSupports": "Captures feature requests and provides roadmap briefings and early-access releases."}, {"id": "sell-and-deliver-through-partners", "name": "Sell and Deliver Through Partners", "howItSupports": "Gives partners a formal voice in prioritisation and partner advisory sessions."}]}], "media": [{"type": "image", "src": "media/jbtd-cpar-jtbd-cpar-2.png", "title": "Consulting and Reseller Partner JTBD infographic: Earn recurring margin and enablement from the partner programme", "alt": "Enterprise infographic for the job \"Earn recurring margin and enablement from the partner programme\" for customer \"Consulting and Reseller Partner\"."}]}], "customerJourneyStories": [{"id": "journey-cpar-1", "name": "Joining the partner network and registering the first deal", "linkedJobIds": ["jtbd-cpar-1", "jtbd-cpar-2"], "summary": "A regional Tableau consultancy joins the 32-firm partner network: triggered by clients asking for Excel-like tables and scheduled reports the consultancy keeps building by hand, discovered at a Tableau user group and on the partner page, evaluated on margin, deal protection and support terms, trialled on a first registered deal with a demo licence, and retained on recurring renewal margin and referrals.", "stages": [{"stage": "Trigger", "narrative": "Three clients in one quarter ask the consultancy for Excel-like tables in Tableau and scheduled PDF reports to people without Tableau accounts. The consultants build workarounds with sheets and Tableau subscriptions each time, bill the hours, and lose margin on every change request. The practice lead wants a product answer that also earns recurring revenue."}, {"stage": "Discovery", "narrative": "At a Tableau user group a peer consultancy demonstrates SuperTables and MailScheduler and mentions it resells them as a partner. The practice lead reads the partner page listing 32 firms including Slalom, Biztory, USEReady and Big X Data, sees the 600+ organisations and 150+ countries, and requests a partner conversation."}, {"stage": "Evaluation", "narrative": "The partner manager walks through the agreement: resale margin on new and renewal subscriptions, deal registration and protection, demo licences, enablement and certification, co-marketing, and the support model in which the vendor handles client tickets after go-live. The practice lead compares this with continuing to build custom solutions and checks references with two existing partners in neighbouring countries."}, {"stage": "Trial", "narrative": "The consultancy signs, two consultants complete certification, and the first deal is registered for a retail client: a demo on the client's data with the partner demo licence, a free-plan pilot for the client's creators, a quote combining a Professional subscription with configuration services, and the deal closed within six weeks with margin paid on the first invoice."}, {"stage": "Engagement", "narrative": "Within a year the consultancy registers a deal in most of its dashboard projects, runs a joint webinar in the local language, receives website leads referred for the region, and moves two clients to Enterprise with WriteBackExtreme. The partner portal shows every client's renewal date and active users, and the partner manager joins the larger client calls."}, {"stage": "Retention", "narrative": "Renewal margin now covers a consultant's salary, the consultancy is cited on the partner page and in a regional case study, and its clients receive support in their own language from the vendor. When a competing extension vendor approaches, the practice lead declines: the pipeline, enablement and references are already built on this programme."}], "media": [{"type": "image", "src": "media/journey-cpar-cpar-1.png", "title": "Consulting and Reseller Partner customer journey: Joining the partner network and registering the first deal", "alt": "Enterprise journey storyboard for \"Joining the partner network and registering the first deal\" for customer \"Consulting and Reseller Partner\"."}]}, {"id": "journey-cpar-2", "name": "Building a write-back and planning practice on WriteBackExtreme", "linkedJobIds": ["jtbd-cpar-1"], "summary": "An established partner extends its practice from visualisation to planning and write-back: triggered by clients wanting forecasts entered in Tableau, discovered through a Tableau Conference session and the vendor's partner enablement, evaluated on Enterprise-only positioning, security requirements and implementation effort, trialled on a 30-day WriteBackExtreme trial with a pharmaceutical client, and retained on repeatable Enterprise projects and higher deal values.", "stages": [{"stage": "Trigger", "narrative": "A pharmaceutical client asks the partner to let planners enter demand forecasts and comments directly in the Tableau dashboards the partner built, with approvals and an audit trail. The partner's alternatives are a custom web form with a database and months of development, or telling the client to keep using spreadsheets."}, {"stage": "Discovery", "narrative": "At a Tableau Conference partner session the alliance manager sees WriteBackExtreme writing governed data back to a customer database with role management, rollback and audit trail, and hears the Pfizer quote about everybody using the write-back dashboard. The vendor's partner manager follows up with an enablement session on Enterprise deployment and planning use cases."}, {"stage": "Evaluation", "narrative": "The partner examines the Enterprise-only positioning and price, the self-hosted deployment its clients' security teams will require, the implementation playbook for write-back schemas, approval workflows and SSO, and the ISO 27001 evidence pack it can hand to client security reviewers. It estimates implementation hours against the custom-build alternative and finds the extension wins on both margin and risk."}, {"stage": "Trial", "narrative": "The client runs a 30-day WriteBackExtreme trial in a personal cloud environment on real forecast tables while the partner configures approval flows and comments, and the client's security reviewer receives the evidence pack in parallel. Planners submit a full forecast round in the trial and the client signs an Enterprise subscription with the partner delivering the self-hosted deployment."}, {"stage": "Engagement", "narrative": "The partner turns the project into a repeatable planning offer: write-back schemas, approval workflows, InputTables for cell-level entry and FinanceTables for management statements, with a fixed implementation estimate. Three more Enterprise clients follow in a year and the consultants hold certifications for both the extensions and ExtensionsManager deployment."}, {"stage": "Retention", "narrative": "Planning and write-back projects now carry the highest deal values in the partner's pipeline, Enterprise renewals bring steady margin, and the partner is invited to partner advisory sessions on the AI roadmap for planning. Its case study on the pharmaceutical client is used by the vendor in the region and brings new inbound requests."}], "media": [{"type": "image", "src": "media/journey-cpar-cpar-2.png", "title": "Consulting and Reseller Partner customer journey: Building a write-back and planning practice on WriteBackExtreme", "alt": "Enterprise journey storyboard for \"Building a write-back and planning practice on WriteBackExtreme\" for customer \"Consulting and Reseller Partner\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-cpar-top", "name": "Partner-sourced subscription revenue", "description": "Yearly subscription revenue from new and renewed subscriptions sourced by the partner, the practice lead's headline measure of what the partnership earns beyond services hours.", "unit": "EUR k / year", "currentValue": "45", "targetValue": "150", "link": "https://dashboard.example.com/bi-dashboard-extensions-platform/customers/cpar/kpis/co-cpar-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-cpar-co-cpar-top.png"}, "branches": [{"id": "co-cpar-b1", "name": "Winning extension deals", "description": "How many registered deals the partner wins and how quickly they close.", "currentValue": "42", "icon": "kpi-cpar-co-cpar-b1.png", "children": [{"id": "co-cpar-b1-c1", "name": "Partner deal win rate", "description": "Share of registered partne     const customer = {"id": "itad", "name": "IT Administrator", "description": "Tableau Server or BI infrastructure administrator at an enterprise customer, typically in a platform-engineering or IT-operations team of two to six people that also runs the database servers, the identity provider and the change process. Installs and upgrades the Enterprise (self-hosted) extensions with ExtensionsManager on Windows or Linux, configures SSO against Entra ID or Okta, sets up the write-back database connections and service accounts, opens the network paths and certificates, safelists the extension URLs on Tableau Server, pulls licence keys and installers from the Enterprise Customer Portal and re-points hundreds of workbooks with TrexReplacer when a server moves. Works in change windows on servers without internet access and is measured on availability, so every install and upgrade must be scripted, reversible and explainable to the change board.", "icon": "itad.png", "careAbout": ["An installer that behaves the same on every server: one-click on Windows, a package on Linux, no surprises about ports, certificates or service accounts", "Upgrades that fit a two-hour change window with a tested rollback, so a new extension version never becomes a Tableau Server incident", "SSO, role management and database connections that follow the organisation's existing identity provider and database standards instead of a parallel user store", "Servers that never need internet access: licence keys, installers and release notes come from the Enterprise Customer Portal and are moved across the air gap by hand", "Knowing which workbooks use which extension version and URL, and changing all of them at once with TrexReplacer during migrations", "Logs, health checks and monitoring hooks so the extension is visible in the same tooling as Tableau Server itself"], "winsThem": ["A reference install on the same operating system and Tableau Server version, walked through by an Infotopics engineer on a screen-share", "ExtensionsManager showing installed extensions, versions, licence status and update availability in one admin console", "A documented port, certificate and safelisting checklist at docs.infotopics.com that the change board accepts as the implementation plan", "TrexReplacer proving on a test site that every workbook can be re-pointed to a new extension URL in minutes rather than by hand", "Priority support and a dedicated customer success manager who know the environment before the first incident"], "theirFear": ["An extension upgrade that breaks the write-back dashboards the planning team uses at month-end, with no clean way back", "A service account or database connection configured with more rights than intended and discovered by the security reviewer after go-live", "A Tableau Server migration that leaves dozens of workbooks pointing at an old extension URL nobody can find"], "jobsToBeDone": [{"id": "jtbd-itad-1", "name": "Install and upgrade the extensions on our own infrastructure without downtime", "whatItIs": "Take an Enterprise licence and turn it into WriteBackExtreme, MailScheduler and the other self-hosted extensions running on the organisation's own Windows or Linux servers, on-premises or in a private cloud, then keep them current with new releases inside normal change windows and without internet access from the servers.", "outcome": "Every extension is installed from a scripted, repeatable procedure, upgrades run in a short change window with a tested rollback, and the extensions are as available as Tableau Server itself.", "steps": [{"step": "Plan the deployment and obtain licence keys", "description": "Size the extension servers, decide on-premises versus private cloud, agree the target Tableau Server version, and download installers, licence keys and release notes from the Enterprise Customer Portal for transfer into the restricted network.", "streamsNeeded": [{"id": "deploy-and-operate-extensions-on-premises", "name": "Deploy and Operate Extensions On-Premises", "howItSupports": "Provides the sizing guidance, prerequisites checklist and installer packages for the chosen deployment model."}, {"id": "manage-licences-users-and-renewals", "name": "Manage Licences, Users and Renewals", "howItSupports": "Issues the licence keys and account entitlements through the Enterprise Customer Portal."}]}, {"step": "Install with the one-click Windows or Linux installer", "description": "Run the Windows one-click installer or the Linux package on the extension server, register the licence key in ExtensionsManager, set the service account, bind certificates and confirm the admin console shows the extension healthy.", "streamsNeeded": [{"id": "deploy-and-operate-extensions-on-premises", "name": "Deploy and Operate Extensions On-Premises", "howItSupports": "Runs the installers and ExtensionsManager registration and reports the health of each installed extension."}]}, {"step": "Safelist and publish the extensions on Tableau Server", "description": "Add the extension URLs to the Tableau Server safelist with the agreed permissions, publish the manifest to the dashboard creators and verify that the extension loads inside a test workbook on the production site.", "streamsNeeded": [{"id": "deploy-and-operate-extensions-on-premises", "name": "Deploy and Operate Extensions On-Premises", "howItSupports": "Supplies the manifest, URL and safelisting metadata for each installed extension version."}, {"id": "govern-security-and-compliance", "name": "Govern Security and Compliance", "howItSupports": "Records the safelisting decision and the permissions granted for the security reviewer."}]}, {"step": "Upgrade in a change window with rollback", "description": "Stage the new release on a test server, run the upgrade automation from ExtensionsManager in the approved window, validate the write-back and scheduling dashboards, and keep the previous version ready to restore.", "streamsNeeded": [{"id": "deploy-and-operate-extensions-on-premises", "name": "Deploy and Operate Extensions On-Premises", "howItSupports": "Performs the version upgrade, migration of settings and rollback to the previous release."}, {"id": "support-and-enable-customers", "name": "Support and Enable Customers", "howItSupports": "Provides release notes, upgrade guides and priority support during the change window."}]}, {"step": "Monitor availability and logs", "description": "Connect the extension health checks and logs to the organisation's monitoring, watch licence expiry and update availability in ExtensionsManager, and raise incidents through the support portal when needed.", "streamsNeeded": [{"id": "deploy-and-operate-extensions-on-premises", "name": "Deploy and Operate Extensions On-Premises", "howItSupports": "Exposes health endpoints, logs and update notifications for the installed extensions."}, {"id": "support-and-enable-customers", "name": "Support and Enable Customers", "howItSupports": "Handles incidents under the Enterprise SLA and priority support."}]}], "media": [{"type": "image", "src": "media/jbtd-itad-jtbd-itad-1.png", "title": "IT Administrator JTBD infographic: Install and upgrade the extensions on our own infrastructure without downtime", "alt": "Enterprise infographic for the job \"Install and upgrade the extensions on our own infrastructure without downtime\" for customer \"IT Administrator\"."}]}, {"id": "jtbd-itad-2", "name": "Connect the extensions to our identity provider, databases and network safely", "whatItIs": "Wire the self-hosted extensions into the organisation's SSO, map roles to Tableau groups, create the write-back database connections and service accounts with least privilege, and open exactly the network paths and certificates the extensions need between the browser, Tableau Server, the extension server and the databases.", "outcome": "Users sign in with their corporate identity, write-back reaches only the schemas it should, all traffic is encrypted over approved ports, and the security reviewer signs off the configuration without exceptions.", "steps": [{"step": "Configure SSO and role mapping", "description": "Register the extension as an application in Entra ID, Okta or another SAML or OpenID Connect provider, map identity-provider groups to extension roles such as administrator, editor and viewer, and test login from Tableau Server and Tableau Desktop.", "streamsNeeded": [{"id": "govern-security-and-compliance", "name": "Govern Security and Compliance", "howItSupports": "Defines SSO, role management and the access model the security reviewer expects."}, {"id": "deploy-and-operate-extensions-on-premises", "name": "Deploy and Operate Extensions On-Premises", "howItSupports": "Stores the identity-provider configuration in ExtensionsManager for each installed extension."}]}, {"step": "Set up write-back database connections and service accounts", "description": "Create the target schemas and tables in SQL Server, PostgreSQL, Snowflake or another supported database, provision a service account with rights limited to those schemas, and register the connection in WriteBackExtreme with encrypted credentials.", "streamsNeeded": [{"id": "write-back-plan-and-collaborate-in-dashboards", "name": "Write Back, Plan and Collaborate in Dashboards", "howItSupports": "Defines the write-back schemas, connection settings and audit tables the extension will use."}, {"id": "deploy-and-operate-extensions-on-premises", "name": "Deploy and Operate Extensions On-Premises", "howItSupports": "Holds the database connector configuration and credential store on the extension server."}]}, {"step": "Open the network paths and certificates", "description": "Agree the ports between browser, Tableau Server, extension server and databases with the network team, install trusted TLS certificates, and confirm the servers work without any outbound internet connection.", "streamsNeeded": [{"id": "deploy-and-operate-extensions-on-premises", "name": "Deploy and Operate Extensions On-Premises", "howItSupports": "Documents the required ports, certificates and offline operation of the extension servers."}, {"id": "govern-security-and-compliance", "name": "Govern Security and Compliance", "howItSupports": "Provides the data-flow documentation that justifies each network path to the security reviewer."}]}, {"step": "Validate with the dashboard creator and security", "description": "Run an end-to-end test with a dashboard creator: sign in through SSO, write a value back to the test schema, check the audit record, and walk the security reviewer through the resulting configuration.", "streamsNeeded": [{"id": "build-interactive-dashboards-with-extensions", "name": "Build Interactive Dashboards With Extensions", "howItSupports": "Supplies the test workbook in which the creator exercises the connected extension."}, {"id": "govern-security-and-compliance", "name": "Govern Security and Compliance", "howItSupports": "Captures the validated configuration and audit evidence for sign-off."}]}], "media": [{"type": "image", "src": "media/jbtd-itad-jtbd-itad-2.png", "title": "IT Administrator JTBD infographic: Connect the extensions to our identity provider, databases and network safely", "alt": "Enterprise infographic for the job \"Connect the extensions to our identity provider, databases and network safely\" for customer \"IT Administrator\"."}]}, {"id": "jtbd-itad-3", "name": "Keep every workbook pointing at the right extension version and URL", "whatItIs": "Know which of the organisation's workbooks use which extension, keep them on supported versions, and change the extension URL in all of them at once when Tableau Server is migrated, a hostname changes or an extension moves from SaaS-hosted to self-hosted.", "outcome": "No workbook silently breaks after a migration or upgrade, unsupported versions disappear from the estate, and licence usage and renewals are tracked from the same inventory.", "steps": [{"step": "Inventory extension usage across workbooks", "description": "Scan the Tableau Server sites for workbooks that embed extensions, record extension type, version and URL per workbook and owner, and compare the list with what ExtensionsManager reports as installed.", "streamsNeeded": [{"id": "deploy-and-operate-extensions-on-premises", "name": "Deploy and Operate Extensions On-Premises", "howItSupports": "Scans workbooks with TrexReplacer and lists extension versions and URLs in use."}, {"id": "manage-licences-users-and-renewals", "name": "Manage Licences, Users and Renewals", "howItSupports": "Relates the inventory to licensed extensions and active users per plan."}]}, {"step": "Replace extension URLs with TrexReplacer during migrations", "description": "When a server, hostname or hosting model changes, run TrexReplacer against the affected workbooks to rewrite the extension URLs in bulk, re-publish them and confirm the extensions load with settings intact.", "streamsNeeded": [{"id": "deploy-and-operate-extensions-on-premises", "name": "Deploy and Operate Extensions On-Premises", "howItSupports": "Performs the bulk URL replacement and re-publishing with TrexReplacer."}, {"id": "build-interactive-dashboards-with-extensions", "name": "Build Interactive Dashboards With Extensions", "howItSupports": "Keeps the extension settings persisted in the workbook valid after the URL change."}]}, {"step": "Coordinate version rollouts with creators", "description": "Announce upgrade windows and deprecations to dashboard creators, keep a test site on the new version for them to verify, and retire old versions once every workbook has moved.", "streamsNeeded": [{"id": "deploy-and-operate-extensions-on-premises", "name": "Deploy and Operate Extensions On-Premises", "howItSupports": "Tracks installed versions and which workbooks still depend on a version scheduled for retirement."}, {"id": "support-and-enable-customers", "name": "Support and Enable Customers", "howItSupports": "Provides release notes, deprecation notices and creator-facing upgrade guides."}]}, {"step": "Track licence usage and renewals in the portal", "description": "Review active-user metering, licence key expiry and renewal dates in the Enterprise Customer Portal together with the BI platform lead so no extension stops working because a key lapsed.", "streamsNeeded": [{"id": "manage-licences-users-and-renewals", "name": "Manage Licences, Users and Renewals", "howItSupports": "Shows active users, licence keys, expiry dates and renewal status per extension."}]}], "media": [{"type": "image", "src": "media/jbtd-itad-jtbd-itad-3.png", "title": "IT Administrator JTBD infographic: Keep every workbook pointing at the right extension version and URL", "alt": "Enterprise infographic for the job \"Keep every workbook pointing at the right extension version and URL\" for customer \"IT Administrator\"."}]}], "customerJourneyStories": [{"id": "journey-itad-1", "name": "First Enterprise self-hosted install with ExtensionsManager", "linkedJobIds": ["jtbd-itad-1", "jtbd-itad-2"], "summary": "The Tableau Server administrator of a pharmaceutical company adopts the Enterprise self-hosted deployment of WriteBackExtreme and MailScheduler: triggered by a planning team that needs write-back on servers without internet, discovered through the BI platform lead and a partner, evaluated on the prerequisites checklist, a reference install and the security data-flow documentation, trialled on a test server, and retained on clean upgrades and the ExtensionsManager console.", "stages": [{"stage": "Trigger", "narrative": "The FP&A team wants to enter forecasts directly in Tableau and the BI platform lead has chosen WriteBackExtreme, but the extension must run on the company's own servers in a network segment with no internet access, and the change board wants a named administrator to own it. The administrator has never installed a third-party extension server next to Tableau Server."}, {"stage": "Discovery", "narrative": "The BI platform lead forwards the Enterprise deployment pages and the docs.infotopics.com installation guide; the implementing partner shows a screenshot of ExtensionsManager listing installed extensions, licence status and available updates on a Windows server. The administrator learns that Infotopics hosts nothing in the Enterprise model and needs no data access."}, {"stage": "Evaluation", "narrative": "The administrator works through the prerequisites: supported Windows and Linux versions, ports between browser, Tableau Server, extension server and the SQL Server write-back database, TLS certificates, SSO against Entra ID and a service account with least privilege. An Infotopics engineer walks through a reference install on a screen-share, and the security reviewer receives the data-flow documentation and ISO 27001 certificate in parallel."}, {"stage": "Trial", "narrative": "On a test server the administrator runs the one-click Windows installer, registers the licence key downloaded from the Enterprise Customer Portal in ExtensionsManager, connects SSO and the test schema, safelists the extension URL on the test Tableau Server site and lets a dashboard creator write the first value back. Two port changes and one certificate chain fix later the whole path works without internet."}, {"stage": "Engagement", "narrative": "Production install follows the same script in a scheduled change window; MailScheduler is added a month later with the same procedure. The administrator connects the extension health checks to the monitoring stack, keeps the test server on the next release, and the first upgrade runs in forty minutes with the previous version staged for rollback."}, {"stage": "Retention", "narrative": "Two years in, upgrades are routine change tickets, the change board treats the checklist as the standard, and the administrator adds SuperTables self-hosted on the same server. When the company migrates to new hosts, TrexReplacer is already on the list, and the administrator recommends the Enterprise model to a peer at the next Tableau user group."}], "media": [{"type": "image", "src": "media/journey-itad-itad-1.png", "title": "IT Administrator customer journey: First Enterprise self-hosted install with ExtensionsManager", "alt": "Enterprise journey storyboard for \"First Enterprise self-hosted install with ExtensionsManager\" for customer \"IT Administrator\"."}]}, {"id": "journey-itad-2", "name": "Migrating Tableau Server and re-pointing every workbook with TrexReplacer", "linkedJobIds": ["jtbd-itad-3", "jtbd-itad-1"], "summary": "A bank's platform administrator adopts TrexReplacer and the upgrade automation during a Tableau Server migration to new Linux hosts: triggered by hundreds of workbooks embedding extension URLs that will change, discovered through the support portal and release notes, evaluated on a scan of the estate and a bulk replacement on a test site, trialled on one department's workbooks, and retained on a migration weekend without a single broken extension.", "stages": [{"stage": "Trigger", "narrative": "The bank is moving Tableau Server from Windows to new Linux hosts with a new hostname, and a first inventory shows more than four hundred workbooks embedding SuperTables, PowerKPIs and WriteBackExtreme with the old extension URL. Editing them by hand would take weeks and the migration weekend is fixed."}, {"stage": "Discovery", "narrative": "A support ticket about the migration comes back with a link to TrexReplacer and the Linux installer guide; the release notes describe bulk replacement of extension URLs across published workbooks and the customer success manager offers a migration call. The administrator also learns that the Linux package of ExtensionsManager carries the same admin console."}, {"stage": "Evaluation", "narrative": "The administrator scans all sites with TrexReplacer to list extension versions and URLs per workbook and owner, tests a bulk replacement on a copy of one site, and checks that settings persisted in the workbooks survive the change. The change board reviews the plan, the security reviewer confirms the new hosts inherit the existing SSO and database configuration, and the migration runbook is written around the tool."}, {"stage": "Trial", "narrative": "One department's sixty workbooks are migrated first: extensions are installed on the new Linux hosts from the Enterprise Customer Portal packages, URLs are replaced in bulk, the workbooks are re-published and their owners verify every dashboard. One extension version is found to be unsupported and upgraded in the same pass."}, {"stage": "Engagement", "narrative": "On the migration weekend the remaining workbooks are re-pointed in under an hour, the old hosts are decommissioned, and the administrator keeps the inventory as a standing report used for every later upgrade and deprecation. Licence keys, active-user metering and renewal dates are now reviewed quarterly in the portal with the BI platform lead."}, {"stage": "Retention", "narrative": "The migration closes with zero broken extension references, upgrade lead time drops from weeks to days, and the administrator's runbook becomes the bank's standard for extension changes. When a second hostname change comes with a data-centre move, nobody considers doing it any other way."}], "media": [{"type": "image", "src": "media/journey-itad-itad-2.png", "title": "IT Administrator customer journey: Migrating Tableau Server and re-pointing every workbook with TrexReplacer", "alt": "Enterprise journey storyboard for \"Migrating Tableau Server and re-pointing every workbook with TrexReplacer\" for customer \"IT Administrator\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-itad-top", "name": "Extension upgrade lead time", "description": "Calendar days from a new extension release becoming available in the Enterprise Customer Portal until it is running in production, the administrator's headline measure of a deployment path that is scripted, safe and fast.", "unit": "day     const customerInsights = [{"id": "bde-03", "title": "Usage is metered by anonymous tokens over a rolling twelve months, so adoption and the invoice are the same number", "summary": "The pricing FAQ explains that users are tracked via anonymous unique tokens assigned by Tableau, that the count covers anyone who interacts with a published dashboard, and that licensing is determined by total hits over the last 12 months, so a user who has not opened a dashboard for 12 months no longer counts as a seat. For on-premises deployments the counts are stored locally with no data transmission. Inference: because the metric that drives the bill is the same metric the platform lead uses to prove adoption, the licence conversation and the value conversation cannot be separated, and a customer who cannot see the count cannot forecast the renewal.", "implication": "Expose the active-user count, its trend and the plan threshold to the platform lead in the customer portal and to the customer success manager; treat usage transparency as a retention feature rather than a billing detail.", "priority": "high", "tags": ["licensing", "metering", "adoption"], "sources": [{"id": "aft-pricing", "title": "Pricing \u2014 Apps for Tableau", "url": "https://appsfortableau.infotopics.com/pricing/", "publisher": "Infotopics | Apps for Tableau", "date": "2026-09-04"}], "link": {"customerId": "itad", "jobIds": ["jtbd-itad-2"], "kpiIds": ["co-itad-b2"]}}, {"id": "bde-05", "title": "Millions of rows inside a dashboard extension require a server-side row model, which pushes the vendor from a browser widget to a data service", "summary": "The vendor's SuperTables big-data announcement describes a server-side row model that streams rows on demand as the user scrolls, executes filters and aggregations on the server, auto-aggregates by dragged dimensions and shows demos with 4.2 million and 7.2 million rows; it targeted Q4 2025 (moved from Q3 2025) and, at the time of the article, labelled the capabilities as in development and subject to change. The same article floats embedding SuperTables outside Tableau in Microsoft Teams, portals and web applications with undetermined timing. Inference: scaling the flagship table means the extension runtime must fetch and compute outside the Tableau browser session, which changes hosting, security review and the SaaS-versus-Enterprise trade-off for large customers.", "implication": "Plan the dashboard data connector and rendering services as shared platform bricks with explicit capacity, residency and audit behaviour, and brief IT and security reviewers on the new data path before the feature reaches enterprise tenants.", "priority": "medium", "tags": ["performance", "big-data", "runtime"], "sources": [{"id": "aft-supertables-bigdata", "title": "SuperTables for Tableau reimagined: built for big data", "url": "https://appsfortableau.infotopics.com/product/news-supertables/big-data/", "publisher": "Infotopics | Apps for Tableau", "date": "2025-12-31"}, {"id": "aft-supertables", "title": "SuperTables \u2014 interactive Excel-like tables for Tableau", "url": "https://appsfortableau.infotopics.com/extensions-for-tableau/supertables/", "publisher": "Infotopics | Apps for Tableau", "date": "2026-09-04"}], "link": {"customerId": "itad", "jobIds": ["jtbd-itad-2"], "kpiIds": ["co-itad-b1"]}}, {"id": "bde-08", "title": "Enterprise means the customer hosts, upgrades and backs up the extensions themselves, and ExtensionsManager is the installer that makes that bearable", "summary": "The vendor documentation defines Enterprise as a self-hosted deployment on on-premises servers or private cloud in which the customer decides when upgrades are applied, can test new versions in non-production first, and owns backups, monitoring, network access and security configuration, with licence files or keys, version downloads and release notes provided through a dedicated customer portal; SaaS by contrast is hosted and maintained by Infotopics with auto s ISO/IEC 27001:2022 certification on every product page, annual penetration testing by independent third parties on the MailScheduler and DashboardGuide pages, that 'Apps for Tableau NEVER gets access to your data', and that DashboardUsage stores logged events locally instead of sending them to Google Analytics. On the platform side, Tableau's administrator documentation explains that network-enabled extensions (those hosted on third-party servers) are blocked by default unless added to the safelist, that only HTTPS-hosted extensions are permitted, that administrators choose per extension whether to allow or deny Full Data Access (underlying rows and data-source details versus aggregated summary data only), and that a global blocklist overrides site settings. Inference: every SaaS-hosted extension of this vendor is by definition a network-enabled extension, so the security reviewer's decision and the platform lead's safelist entry are the true activation step of a subscription.", "implication": "Package the security evidence (certificate, pen-test summary, data-flow diagrams, DPA, safelist URLs and required data-access level per extension) as a self-service trust bundle so assessment cycle time drops, and track safelisting as an onboarding milestone rather than a support ticket.", "priority": "high", "tags": ["security", "compliance", "safelist"], "sources": [{"id": "aft-extensions", "title": "Extensions for Tableau \u2014 overview", "url": "https://appsfortableau.infotopics.com/extensions-for-tableau/", "publisher": "Infotopics | Apps for Tableau", "date": "2026-09-04"}, {"id": "aft-mailscheduler", "title": "MailScheduler \u2014 automated dashboard distribution", "url": "https://appsfortableau.infotopics.com/extensions-for-tableau/mailscheduler/", "publisher": "Infotopics | Apps for Tableau", "date": "2026-09-04"}, {"id": "aft-dashboardguide", "title": "DashboardGuide \u2014 interactive help inside dashboards", "url": "https://appsfortableau.infotopics.com/extensions-for-tableau/dashboardguide/", "publisher": "Infotopics | Apps for Tableau", "date": "2026-09-04"}, {"id": "aft-dashboardusage", "title": "DashboardUsage \u2014 usage analytics for Tableau dashboards", "url": "https://appsfortableau.infotopics.com/extensions-for-tableau/dashboardusage/", "publisher": "Infotopics | Apps for Tableau", "date": "2026-09-04"}, {"id": "tableau-cloud-extensions", "title": "Manage dashboard and viz extensions in Tableau Cloud", "url": "https://help.tableau.com/current/online/en-us/dashboard_extensions_server.htm", "publisher": "Salesforce / Tableau", "date": "2026-09-04"}], "link": {"customerId": "itad", "jobIds": ["jtbd-itad-2"], "kpiIds": ["co-itad-b1"]}}, {"id": "bde-10", "title": "Distribution depends on the platform vendors' marketplaces and rules, and the platforms keep moving toward what the extensions do", "summary": "A Tableau Exchange search returns roughly 20 Infotopics viz extensions (FinanceTables, Sankey and chord diagrams, waterfall, radar, SuperTables, PowerKPIs, DrillDownTree, HierarchyFilter and others), about a dozen dashboard extensions (WriteBackExtreme and a free edition, ShowMeMore 2.0, DashboardUsage 2.0, DashboardGuide, ProcessMining, PerformanceInsight, ScrollyTelling, EasyDesigns) and one accelerator. Tableau's help explains that viz extensions live inside the worksheet rather than as separate dashboard objects, are obtained from the Exchange or as .trex files, and that Tableau 2026.2 added the ability to view, delete or replace every extension used across a workbook from one place, which overlaps with the vendor's own TrexReplacer. Microsoft documents that Power BI custom visuals are distributed through AppSource, that certified visuals must not access external services, that licensed visuals are unsupported in Report Server, sovereign clouds and publish-to-web, and that some publishers handle licensing outside Microsoft's platform; Apps for Power BI, established in 2022, offers SuperTables, InputTables, Pictu     function jobNamesForCustomer(jobIds) {
        const jobs = (customer.jobsToBeDone || []);
        const jobLookup = {};
        jobs.forEach(job => {
            if (job.id) {
                jobLookup[job.id] = job.name || job.id;
            }
        });
        return (jobIds || []).map(jobId => jobLookup[jobId] || jobId);
    }

    function kpiNamesForLink(link) {
        // Prefer stable KPI IDs resolved against this customer's KPI pyramid; fall back to legacy display-name kpis.
        if (link && link.kpiIds && link.kpiIds.length) {
            const lookup = {};
            function walk(node) {
                if (!node) return;
                if (node.id) {
                    lookup[node.id] = node.name || node.id;
                }
                (node.branches || []).forEach(walk);
                (node.children || []).forEach(walk);
            }
            const pyramids = (customer || {}).kpiPyramids || {};
            ['customerOutcomes', 'businessOutcomes'].forEach(key => {
                const pyramid = pyramids[key];
                if (!pyramid) return;
                walk(pyramid.top);
                (pyramid.branches || []).forEach(walk);
            });
            return link.kpiIds.map(kpiId => lookup[kpiId] || kpiId);
        }
        return (link && link.kpis) || [];
    }

    function addInsights() {
        let html = '';

        html += '<div style="margin: 24px">';

        if (!customerInsights || customerInsights.length === 0) {
            html += '<div class="group">No customer-linked insights defined for this domain yet.</div>';

            customerInsights.forEach(insight => {
                html += '<div class="group" style="width: 250px; display: inline-block; margin: 8px; padding: 16px; background: white">';
                html += '<div style="font-size: 150%; color: #1d4ed8; margin-bottom: 8px">' + escapeHtml(insight.title) + '</div>';
                html += '<div style="margin-bottom: 10px">' + escapeHtml(insight.summary) + '</div>';
                if (insight.implication) {
                    html += '<div style="margin-bottom: 10px"><b>Product implication:</b> ' + escapeHtml(insight.implication) + '</div>';
                }
                if (insight.link) {
                    if (insight.link.jobIds && insight.link.jobIds.length) {
                        html += '<div style="font-size: 13px; color: #4b5563; margin-bottom: 4px"><b>Jobs:</b> ' + escapeHtml(jobNamesForCustomer(insight.link.jobIds).join(', ')) + '</div>';
                    }
                    const kpiNames = kpiNamesForLink(insight.link);
                    if (kpiNames.length) {
                        html += '<div style="font-size: 13px; color: #4b5563; margin-bottom: 4px"><b>KPIs:</b> ' + escapeHtml(kpiNames.join(', ')) + '</div>';
                    }
                }
                if (insight.tags && insight.tags.length) {
                    html += '<div style="margin-top: 8px; margin-bottom: 10px">';
                    insight.tags.forEach(tag => {
                        html += '<span style="display:inline-block; margin:0 8px 6px 0; padding:4px 10px; border-radius:999px; background:#eef2f6; font-size:12px">' + escapeHtml(tag) + '</span>';
                    });
                    html += '</div>';
                }
                if (insight.sources && insight.sources.length) {
                    html += '<div style="margin-top: 8px">';
                    html += '<div style="font-size: 13px; color: #6b7280; margin-bottom: 4px">Sources</div>';
                    insight.sources.forEach(source => {
                        html += '<div style="font-size: 13px; margin-bottom: 4px">';

                        html += '</div>';
                    });
                    html += '</div>';
                }
                html += '</div>';
            });
        }
        html += '</div>';

        document.getElementById('Insights').innerHTML = html;
    }

    function kpiIconFile(node) {
        return (node && node.icon) ? node.icon : 'kpi.png';
    }

    function kpiCurrentValue(node) {
        if (!node || !node.currentValue) {
            return '';
        }
        return String(node.currentValue) + (node.unit ? ' (' + String(node.unit) + ')' : '');
    }

    function kpiValueStatusLabel(node) {
        if (!node || !node.valueStatus) {
            return '';
        }
        const labels = {
            example: 'illustrative example',
            baseline: 'measured baseline',
            target: 'target',
            placeholder: 'placeholder'
        };
        return labels[node.valueStatus] || String(node.valueStatus);
    }

    function renderKpiMeta(node) {
        let html = '';
        if (node && node.currentValue) {
            const statusLabel = kpiValueStatusLabel(node);
            const valueLabel = (node.valueStatus === 'target') ? 'Target:' : 'Current:';
            html += '<div style="font-size: 80%; color: #1d4ed8; margin-top: 4px"><b>' + valueLabel + '</b> ' + escapeHtml(kpiCurrentValue(node));
            if (statusLabel) {
                html += ' <span style="color:#888; font-style: italic;">(' + escapeHtml(statusLabel) + ')</span>';
            }
            html += '</div>';
        }
        if (node && node.target) {
            html += '<div style="font-size: 80%; color: #047857; margin-top: 2px"><b>Target:</b> ' + escapeHtml(String(node.target)) + '</div>';
        }
        if (node && node.guardrailRole) {
            html += '<div style="font-size: 78%; color: #b91c1c; margin-top: 2px"><b>Guardrail:</b> ' + escapeHtml(String(node.guardrailRole)) + '</div>';
        }
        if (node && (node.period || node.calculationMethod || node.valueSource)) {
            html += '<div style="font-size: 76%; color: #6b7280; margin-top: 3px">';
            if (node.period) { html += '<div><b>Period:</b> ' + escapeHtml(String(node.period)) + '</div>'; }
            if (node.calculationMethod) { html += '<div><b>How measured:</b> ' + escapeHtml(String(node.calculationMethod)) + '</div>'; }
            if (node.valueSource) { html += '<div><b>Value source:</b> ' + escapeHtml(String(node.valueSource)) + '</div>'; }
            html += '</div>';
        }
        if (node && node.guardrail) {
            html += '<div style="font-size: 76%; color: #7c3aed; margin-top: 3px"><b>Composite guardrail:</b> ' + escapeHtml(String(node.guardrail)) + '</div>';

        if (node && node.link) {
            html += '<div style="font-size: 80%; margin-top: 4px"><a target="_blank" rel="noopener noreferrer" href="' + escapeHtml(node.link) + '">' + escapeHtml(node.linkLabel || 'Open link') + '</a></div>';
