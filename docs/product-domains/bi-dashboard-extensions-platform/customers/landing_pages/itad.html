<script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

tals, conditional formatting and sparklines, calculated columns and formulas, number formats per column, row limits and server-side row model for large data, and allow viewers to save personalised views and export to Excel with formatting preserved.", "streamsNeeded": [{"id": "build-interactive-dashboards-with-extensions", "name": "Build Interactive Dashboards With Extensions", "howItSupports": "Stores the SuperTables configuration in the workbook so it publishes with the dashboard and survives version upgrades."}, {"id": "explore-and-self-serve-data-in-dashboards", "name": "Explore and Self-Serve Data in Dashboards", "howItSupports": "Delivers the pivot, group, filter, saved-view and Excel-export experience that viewers use once the dashboard is published."}]}, {"step": "Add charts, KPI tiles and guidance the platform lacks", "description": "Complement the grid with ShowMeMore chart types such as Sankey, bullet or radar, a PowerKPIs tile row as the entry point with sparklines and drill-through, PictureThis for product images, and a short DashboardGuide tour that explains how to pivot and export, so the first session does not end with a request for a new variant.", "streamsNeeded": [{"id": "build-interactive-dashboards-with-extensions", "name": "Build Interactive Dashboards With Extensions", "howItSupports": "Provides ShowMeMore, PowerKPIs, PictureThis and DashboardGuide as configurable extensions on the same runtime and data connector."}, {"id": "guide-and-measure-dashboard-adoption", "name": "Guide and Measure Dashboard Adoption", "howItSupports": "Adds onboarding overlays that teach the interactive features so users self-serve instead of asking for changes."}]}, {"step": "Publish, verify with users and retire the variants", "description": "Publish to the production project on Tableau Server or Cloud, walk the requesting team through the dashboard, check that saved views and Excel export behave as expected for explorers and viewers, and then archive the older worksheet variants and the Excel workbook the team used to maintain.", "streamsNeeded": [{"id": "build-interactive-dashboards-with-extensions", "name": "Build Interactive Dashboards With Extensions", "howItSupports": "Publishes the dashboard with its extension configuration and verifies rendering on the target platform version."}, {"id": "guide-and-measure-dashboard-adoption", "name": "Guide and Measure Dashboard Adoption", "howItSupports": "Shows with DashboardUsage whether the new dashboard replaces the old variants before they are retired."}]}], "media": [{"type": "image", "src": "media/jbtd-dcre-jtbd-dcre-1.png", "title": "Dashboard Creator JTBD infographic: Deliver an Excel-friendly interactive dashboard without building ten variants", "alt": "Enterprise infographic for the job \"Deliver an Excel-friendly interactive dashboard without building ten variants\" for customer \"Dashboard Creator\"."}]}, {"id": "jtbd-dcre-2", "name": "Add write-back, planning and commenting to a dashboard the governed way", "whatItIs": "Turn a read-only forecast, budget or data-quality dashboard into one where planners enter forecasts, budget owners set targets, analysts correct records and reviewers approve numbers, with the data stored in the company's own database, validation and role management enforced, and every change logged, using WriteBackExtreme, InputTables and FinanceTables instead of a spreadsheet round-trip or a custom web application.", "outcome": "Business users enter and revise numbers inside the dashboard they already use, the data lands in a governed table that finance and IT trust, every change is attributable and reversible, and the creator delivers this without writing application code or running a separate server.", "steps": [{"step": "Agree the write-back use case, data model and ownership", "description": "Define with the business owner and IT what will be written back (forecast values, comments, status flags, corrections), the target schema in the company database, who may write, review and approve, and the validation rules. Decide whether this runs on the Infotopics-hosted service or on the Enterprise self-hosted WriteBackExtreme server without internet access.", "streamsNeeded": [{"id": "write-back-plan-and-collaborate-in-dashboards", "name": "Write Back, Plan and Collaborate in Dashboards", "howItSupports": "Provides the schema builder, field types, validation and role model that turn the agreed data model into a write-back configuration."}, {"id": "deploy-and-operate-extensions-on-premises", "name": "Deploy and Operate Extensions On-Premises", "howItSupports": "Clarifies what the self-hosted WriteBackExtreme server needs from IT: database connection, SSO, network access and license key."}]}, {"step": "Obtain the WriteBackExtreme trial and installation", "description": "Start the 30-day WriteBackExtreme trial in a personal cloud environment to prove the form to the business, then work with the BI platform lead and IT administrator to license it as an Enterprise-only product and install it with the one-click Windows or Linux installer, connected to the target database.", "streamsNeeded": [{"id": "discover-trial-and-subscribe-to-extensions", "name": "Discover, Trial and Subscribe to Extensions", "howItSupports": "Provisions the 30-day trial environment and the Enterprise subscription that WriteBackExtreme requires."}, {"id": "deploy-and-operate-extensions-on-premises", "name": "Deploy and Operate Extensions On-Premises", "howItSupports": "Installs and licenses the self-hosted server with ExtensionsManager and registers the extension URL for the workbook."}]}, {"step": "Build the input form or InputTable with validation and roles", "description": "Configure the write-back form fields bound to dashboard marks, or an InputTables grid inside a SuperTable with cell-level input, dropdowns, comments and dynamic columns; set required fields, ranges, lookups and per-role permissions so a planner can edit their region but only a controller can edit totals.", "streamsNeeded": [{"id": "write-back-plan-and-collaborate-in-dashboards", "name": "Write Back, Plan and Collaborate in Dashboards", "howItSupports": "Provides the form and grid configuration, validation rules and role assignment inside the extension without code."}, {"id": "govern-security-and-compliance", "name": "Govern Security and Compliance", "howItSupports": "Maps write-back roles to SSO groups so permissions follow the company identity provider."}]}, {"step": "Enable audit trail, rollback and approvals", "description": "Switch on the audit log so every change records who, when, old and new value, configure rollback of a batch of entries, and add an approval step where the reviewer sees pending changes in the dashboard and accepts or rejects them before they become the official number.", "streamsNeeded": [{"id": "write-back-plan-and-collaborate-in-dashboards", "name": "Write Back, Plan and Collaborate in Dashboards", "howItSupports": "Runs the audit trail, rollback and approval workflow on top of the write-back records."}, {"id": "govern-security-and-compliance", "name": "Govern Security and Compliance", "howItSupports": "Provides the audit evidence that security and finance reviewers expect from a governed write-back process."}]}, {"step": "Roll out to planners and connect finance reporting", "description": "Train the planning team in the dashboard, watch the first cycle for validation errors and confusing fields, then feed the written-back forecasts and budgets into FinanceTables P&L and budget-versus-actual views so the planning loop closes inside the same dashboards.", "streamsNeeded": [{"id": "write-back-plan-and-collaborate-in-dashboards", "name": "Write Back, Plan and Collaborate in Dashboards", "howItSupports": "Surfaces error rates and pending entries per cycle so the creator can tune the form after the first round."}, {"id": "report-finance-from-dashboard-data", "name": "Report Finance From Dashboard Data", "howItSupports": "Builds P&Ls, budget reports and management statements from the written-back data with FinanceTables."}]}], "media": [{"type": "image", "src": "media/jbtd-dcre-jtbd-dcre-2.png", "title": "Dashboard Creator JTBD infographic: Add write-back, planning and commenting to a dashboard the governed way", "alt": "Enterprise infographic for the job \"Add write-back, planning and commenting to a dashboard the governed way\" for customer \"Dashboard Creator\"."}]}, {"id": "jtbd-dcre-3", "name": "Guide users through a dashboard and prove it is used", "whatItIs": "After publishing, make sure the intended audience finds, understands and returns to the dashboard: add DashboardGuide onboarding overlays, measure views, interactions and drop-off with DashboardUsage, deliver the same content to people who never open Tableau through MailScheduler, and report adoption back to the BI platform lead so the dashboard earns its place in the portfolio.", "outcome": "New users complete their first session without asking the creator for help, usage data shows which dashboards and views are alive and which can be retired, and the creator can show the BI platform lead evidence of adoption instead of anecdotes.", "steps": [{"step": "Add onboarding overlays to the published dashboard", "description": "Configure a DashboardGuide tour with step markers on the filters, the SuperTable pivot controls and the export button, add contextual help for KPI definitions, and set the tour to run on first visit and on demand thereafter.", "streamsNeeded": [{"id": "guide-and-measure-dashboard-adoption", "name": "Guide and Measure Dashboard Adoption", "howItSupports": "Provides DashboardGuide steps, tooltips and first-visit rules stored with the workbook."}, {"id": "build-interactive-dashboards-with-extensions", "name": "Build Interactive Dashboards With Extensions", "howItSupports": "Places the guide extension on the dashboard and links it to the objects it explains."}]}, {"step": "Measure views, interactions and drop-off", "description": "Enable DashboardUsage on the dashboard to record opens, filters applied, tables pivoted, exports and time on view per anonymous user token, and review weekly which views are opened and which are ignored.", "streamsNeeded": [{"id": "guide-and-measure-dashboard-adoption", "name": "Guide and Measure Dashboard Adoption", "howItSupports": "Collects and reports dashboard usage events per dashboard, view and user token."}]}, {"step": "Reach users who never open Tableau", "description": "Set up a MailScheduler schedule that delivers the dashboard as a per-recipient filtered PDF, Excel or PNG to email, Microsoft Teams or Slack, so directors and field staff receive the numbers where they work and the dashboard's audience is larger than its Tableau viewers.", "streamsNeeded": [{"id": "distribute-reports-and-alerts", "name": "Distribute Reports and Alerts", "howItSupports": "Schedules, renders and delivers personalised exports of the dashboard with a delivery log."}]}, {"step": "Report adoption and prune the portfolio", "description": "Combine DashboardUsage, MailScheduler delivery logs and active-user counts into a short adoption report for the BI platform lead, retire dashboards nobody opens, and use the evidence when the extensions subscription comes up for renewal.", "streamsNeeded": [{"id": "guide-and-measure-dashboard-adoption", "name": "Guide and Measure Dashboard Adoption", "howItSupports": "Produces the per-dashboard adoption evidence that decides which dashboards stay and which are archived."}, {"id": "manage-licences-users-and-renewals", "name": "Manage Licences, Users and Renewals", "howItSupports": "Shows active users counted against the plan so adoption per dashboard can be related to the subscription."}]}], "media": [{"type": "image", "src": "media/jbtd-dcre-jtbd-dcre-3.png", "title": "Dashboard Creator JTBD infographic: Guide users through a dashboard and prove it is used", "alt": "Enterprise infographic for the job \"Guide users through a dashboard and prove it is used\" for customer \"Dashboard Creator\"."}]}], "customerJourneyStories": [{"id": "journey-dcre-1", "name": "From Monday Excel exports to one SuperTables dashboard", "linkedJobIds": ["jtbd-dcre-1", "jtbd-dcre-3"], "summary": "A Tableau developer in the finance BI team of a consumer-goods group with more than a thousand Tableau users lives through the switch from building worksheet variants for every director to one SuperTables dashboard, from the free plan on a personal project to the company-wide Professional subscription.", "stages": [{"stage": "Trigger", "narrative": "The quarter closes with eleven versions of the same margin dashboard in the finance project, each built for one director who wanted different columns, and a controller admits that the team exports the dashboard to Excel every Monday, pivots it there and circulates that file instead. The BI lead asks the creator to find a way to build it once."}, {"stage": "Discovery", "narrative": "Searching the Tableau Community for 'pivot table in Tableau' the creator finds SuperTables on the Tableau Exchange, watches a webinar recording from Apps for Tableau and sees a Post Holdings quote about Tableau becoming accessible to Excel users. A peer at a Tableau user group confirms the extension runs in their regulated environment."}, {"stage": "Evaluation", "narrative": "The creator compares SuperTables with a native crosstab, a scripted table in a web-data-connector and a competing table extension: pivoting and grouping by the viewer, conditional formatting, Excel export with formatting, saved views and performance over two million rows are the decisive checks. The free plan for up to five users, no credit card and no time limit removes the procurement barrier for a first test."}, {"stage": "Trial", "narrative": "One dashboard, one director, one month: the margin dashboard is rebuilt on a personal project with a single SuperTable, a PowerKPIs tile row and a DashboardGuide tour. The director's team stops exporting to Excel within two weeks, and the safelisting request for Tableau Server goes to the platform team with the trial as evidence."}, {"stage": "Engagement", "narrative": "After safelisting and the Professional subscription, the creator retires nine of the eleven variants, adopts the gallery demo workbooks as templates, and adds ShowMeMore charts and HierarchyFilter to sales and supply-chain dashboards. DashboardUsage shows which views are opened and the backlog of 'can you add a column' requests falls sharply."}, {"stage": "Retention", "narrative": "At renewal the creator shows the BI lead the number of dashboards built with extensions, the variant count before and after and the drop in Excel exports. The team moves to the Enterprise plan to add WriteBackExtreme, and the creator presents the case at the internal Tableau community as the reference for other business units."}], "media": [{"type": "image", "src": "media/journey-dcre-dcre-1.png", "title": "Dashboard Creator customer journey: From Monday Excel exports to one SuperTables dashboard", "alt": "Enterprise journey storyboard for \"From Monday Excel exports to one SuperTables dashboard\" for customer \"Dashboard Creator\"."}]}, {"id": "journey-dcre-2", "name": "First governed write-back with WriteBackExtreme", "linkedJobIds": ["jtbd-dcre-2", "jtbd-dcre-3"], "summary": "A Tableau developer supporting the FP&A team of a pharmaceutical company adopts WriteBackExtreme to replace a forecast spreadsheet round-trip, from a personal-environment trial through the security review to the self-hosted Enterprise deployment that the whole planning community uses.", "stages": [{"stage": "Trigger", "narrative": "The monthly forecast cycle still runs on a spreadsheet emailed to forty planners, merged by hand, and re-uploaded to the warehouse two days later; a version mix-up sends the wrong forecast into a leadership review. FP&A asks whether planners could type the forecast straight into the Tableau dashboard they already use."}, {"stage": "Discovery", "narrative": "The creator hears about WriteBackExtreme from the company's Tableau consulting partner and reads the Pfizer story on the Apps for Tableau site about everybody using a dashboard built with it because it is straightforward and intuitive. A docs.infotopics.com walkthrough shows the schema builder, roles and audit trail."}, {"stage": "Evaluation", "narrative": "Together with the BI platform lead the creator checks that the Enterprise deployment runs on-premises without internet and without giving the vendor data access, reviews the ISO 27001 certificate and penetration-test summary with security, confirms SSO and role management against the identity provider, and compares the annual Enterprise subscription with the cost of a custom planning application."}, {"stage": "Trial", "narrative": "A 30-day WriteBackExtreme trial in a personal cloud environment proves the forecast form with five planners on last quarter's numbers: validation catches out-of-range entries, comments explain variances and the audit trail shows every change. The trial output becomes the demo in the security and procurement meeting."}, {"stage": "Engagement", "narrative": "The IT administrator installs the self-hosted server with the one-click installer and connects it to the planning database; the creator builds the production form and an InputTables grid for line-level adjustments. All forty planners enter the next forecast in the dashboard, a controller approves pending changes in the same view, and FinanceTables shows budget versus forecast the same day."}, {"stage": "Retention", "narrative": "Forecast cycle time drops from ten days to four and the spreadsheet is retired. At renewal the creator adds MailScheduler to deliver the approved forecast pack to regional directors, and the write-back pattern is reused for a clinical-trial site status board and a data-correction workflow in supply chain."}], "media": [{"type": "image", "src  "currentValue": "5", "targetValue": "40", "icon": "kpi-dcre-bo-dcre-b2-c1-l2.png", "children": []}]}, {"id": "bo-dcre-b2-c2", "name": "Creator-driven expansion revenue", "description": "Annual recurring revenue added when creator adoption pushes an organisation over its plan's user limit or into Enterprise-only products such as WriteBackExtreme and MailScheduler.", "unit": "EUR k per year", "currentValue": "1200", "targetValue": "3200", "icon": "kpi-dcre-bo-dcre-b2-c2.png", "children": [{"id": "bo-dcre-b2-c2-l1", "name": "Professional to Enterprise upgrade rate", "description": "Share of Professional subscriptions (up to 100 users) per year that upgrade to Enterprise because active users or Enterprise-only product needs outgrow the plan.", "unit": "%", "currentValue": "9", "targetValue": "18", "icon": "kpi-dcre-bo-dcre-b2-c2-l1.png", "children": []}, {"id": "bo-dcre-b2-c2-l2", "name": "Creator net promoter score", "description": "Net promoter score collected from active creators in the annual survey and after support interactions.", "unit": "score", "currentValue": "42", "targetValue": "60", "icon": "kpi-dcre-bo-dcre-b2-c2-l2.png", "children": []}]}]}]}}, "productStrategy": {"vision": "Make the extension catalogue the first thing a dashboard creator reaches for, so one configured dashboard answers a business team's questions, planning and distribution needs, and every request is delivered as configuration rather than another variant.", "timeHorizons": {"year1": {"focus": "Cut configuration time and rework for the core extensions with AI-assisted configuration, better templates and gallery workbooks, and make the write-back path from trial to self-hosted production a repeatable playbook for creators and their IT administrators.", "productTheme": "Configure once, with AI, for Excel-minded users", "customerKPI": {"northStar": "Dashboard requests delivered per month", "supporting": ["Extension configuration time", "Dashboard rework rate"]}, "businessKPI": {"northStar": "Active dashboard creators using extensions", "revenueStreams": ["Professional subscriptions by active users", "Enterprise subscriptions with WriteBackExtreme and MailScheduler", "Student and partner demo licences feeding creator adoption"], "supporting": ["Free plan to paid conversion rate", "Trial-to-first-published-dashboard rate"]}, "milestones": ["Ship AI-assisted configuration and generative fill in SuperTables and PowerKPIs so a creator gets a sensible first configuration from the worksheet fields", "Publish a template library and gallery workbooks per industry pattern (finance tables, sales hierarchies, KPI entry points) reusable across Tableau and Power BI", "Make the WriteBackExtreme trial-to-production path a documented playbook with the one-click installer and TrexReplacer URL switch"]}, "year3": {"focus": "Give creators one configuration that works on Tableau, Power BI and Looker Studio, with feature parity of SuperTables, WriteBackExtreme, InputTables, MailScheduler and PowerKPIs on one runtime and licence, so a creator's skills and templates transfer across platforms.", "productTheme": "One configuration, three BI platforms", "customerKPI": {"northStar": "Dashboard requests delivered per month", "supporting": ["Template and saved-configuration reuse rate", "Dashboard build lead time"]}, "businessKPI": {"northStar": "Active dashboard creators using extensions", "revenueStreams": ["Multi-platform organisation subscriptions", "Enterprise self-hosted subscriptions", "Acquired extension products cross-sold to creators"], "supporting": ["Extensions used per creator", "Multi-platform creator share"]}, "milestones": ["Reach feature parity of the five core products across Tableau, Power BI and Looker Studio with a portable configuration format", "Launch a creator community and certification programme with partners in North America, the UK and DACH", "Integrate one acquired extension product into the shared runtime, gallery and licence"]}, "year5": {"focus": "Let an AI assistant draft the dashboard's interactive layer, write-back forms and guidance from the business question and the worksheet schema, with the creator reviewing and publishing, so creators spend their time on modelling and adoption rather than configuration.", "productTheme": "AI-drafted decision dashboards under creator review", "customerKPI": {"northStar": "Dashboard requests delivered per month", "supporting": ["Requirement-to-prototype time", "Dashboard user satisfaction"]}, "businessKPI": {"northStar": "Creator depth and expansion", "revenueStreams": ["Platform-independent decision layer subscriptions", "AI assistant add-ons per organisation", "Creator-driven expansion revenue"], "supporting": ["AI-assisted configuration usage rate", "Creator-driven expansion revenue"]}, "milestones": ["Release an AI assistant that proposes SuperTables, PowerKPIs, DashboardGuide and write-back configurations from a natural-language request and the worksheet schema", "Offer the decision layer as one organisation licence regardless of BI vendor, with the customer's data staying in its own environment", "Publish creator productivity benchmarks from anonymised usage so BI teams can compare build lead time and rework with peers"]}}}, "domain": "Dashboard Builders and BI Platform Teams"}, {"id": "bilr", "name": "BI Platform Lead", "description": "Owns the Tableau Server or Tableau Cloud tenant, or the Power BI tenant, and leads the analytics centre of excellence at an enterprise such as Bank of America, Pfizer, Siemens or Post Holdings with hundreds to thousands of Tableau users. Decides which extensions are safelisted and under which deployment model, runs adoption programmes for creators, explorers and viewers, manages licences and seats against the plan, selects vendors with security and procurement, and owns the renewal conversation with the vendor's customer success manager. Measured on platform adoption, governance incidents and the cost per active user.", "icon": "bilr.png", "careAbout": ["Adoption of the platform by creators, explorers and viewers, measured monthly, and fewer users falling back to Excel and email", "A short list of safelisted, vetted extensions with a known deployment model, version and owner, instead of creators adding whatever they find", "Licences and seats that match how users are counted, with anonymous unique tokens over a rolling twelve months and no surprise overage at renewal", "Vendor evidence that satisfies security and procurement once: ISO 27001 certification, penetration-test reports, data-flow diagrams and a data processing agreement", "Usage evidence per dashboard and per extension that justifies the subscription to the CFO and the steering committee", "One vendor relationship for extensions across Tableau and Power BI as the organisation's BI estate changes"], "winsThem": ["A tenant-level view of active users counted the way the plan counts them, with alerts before the Professional limit of 100 users is crossed", "An extension catalogue and safelist workflow where the vendor supplies version, URL, security evidence and release notes, and TrexReplacer keeps every workbook on the approved URL", "Adoption dashboards from DashboardUsage across the estate that show which dashboards, extensions and business units drive active users", "An Enterprise plan with a dedicated customer success manager, priority support, purchase orders and prioritised feature requests", "An Enterprise self-hosted option with ExtensionsManager that keeps data inside the network and satisfies the security review"], "theirFear": ["A business unit installing an unvetted extension from the Exchange that sends dashboard data to an unknown host, discovered in an audit", "A renewal invoice for three times the expected active users because viewers were counted and nobody tracked the rolling twelve-month token count", "A Tableau Server upgrade that breaks fifty workbooks pointing at an old extension URL on the morning of a board reporting cycle"], "jobsToBeDone": [{"id": "jtbd-bilr-1", "name": "Grow dashboard adoption across creators, explorers and viewers", "whatItIs": "Run the analytics centre of excellence's adoption programme: understand why licensed users do not open dashboards or export everything to Excel, equip creators with a standard interactive toolkit (SuperTables, PowerKPIs, DashboardGuide, ShowMeMore), reach non-Tableau stakeholders through scheduled delivery, and manage adoption as a monthly metric per business unit rather than as anecdotes.", "outcome": "Monthly active dashboard users grow across all three roles, Excel exports and shadow spreadsheets decline, and the platform lead can show the steering committee that the BI investment, including the extensions, is used by the people it was bought for.", "steps": [{"step": "Baseline adoption and find where users drop to Excel", "description": "Combine Tableau Server or Cloud usage statistics with DashboardUsage events and creator interviews to see which dashboards are opened, where sessions end in an export, and which business units run their own spreadsheets next to the platform.", "streamsNeeded": [{"id": "guide-and-measure-dashboard-adoption", "name": "Guide and Measure Dashboard Adoption", "howItSupports": "Aggregates DashboardUsage events per dashboard, extension and business unit into an adoption baseline."}, {"id": "explore-and-self-serve-data-in-dashboards", "name": "Explore and Self-Serve Data in Dashboards", "howItSupports": "Shows which interactive features viewers use and where exports replace in-dashboard exploration."}]}, {"step": "Standardise an interactive toolkit for creators", "description": "Define the approved extension set per use case (SuperTables for grids, PowerKPIs for entry points, DashboardGuide for onboarding, ShowMeMore for missing chart types, HierarchyFilter for organisations), publish templates and design standards, and make the toolkit part of the dashboard review checklist.", "streamsNeeded": [{"id": "build-interactive-dashboards-with-extensions", "name": "Build Interactive Dashboards With Extensions", "howItSupports": "Provides the extension set, templates and configuration patterns the toolkit standardises."}, {"id": "support-and-enable-customers", "name": "Support and Enable Customers", "howItSupports": "Supplies documentation, training material and webinars that the centre of excellence turns into internal standards."}]}, {"step": "Enable the creator community", "description": "Run internal training and office hours on the toolkit with the vendor or a partner, seed the gallery demo workbooks in a shared project, and track how many creators are trained and how many dashboards use the toolkit.", "streamsNeeded": [{"id": "support-and-enable-customers", "name": "Support and Enable Customers", "howItSupports": "Delivers vendor training, webinars and customer-success enablement sessions for the creator community."}, {"id": "discover-trial-and-subscribe-to-extensions", "name": "Discover, Trial and Subscribe to Extensions", "howItSupports": "Provides gallery and demo workbooks and trial access so creators can experiment inside the approved plan."}]}, {"step": "Reach users who never open the platform", "description": "Roll out MailScheduler for scheduled, per-recipient filtered PDF and Excel delivery to email, Microsoft Teams and Slack, and PowerKPIs entry points for executives, so directors and field staff consume governed numbers without becoming Tableau explorers.", "streamsNeeded": [{"id": "distribute-reports-and-alerts", "name": "Distribute Reports and Alerts", "howItSupports": "Schedules and delivers personalised dashboard exports with a delivery log that counts reach beyond Tableau viewers."}]}, {"step": "Review adoption monthly and act per business unit", "description": "Publish an adoption scorecard per business unit with active users, toolkit dashboards, export share and guided sessions, celebrate the units that grow, retire dead dashboards, and re-plan training and licences where adoption stalls.", "streamsNeeded": [{"id": "guide-and-measure-dashboard-adoption", "name": "Guide and Measure Dashboard Adoption", "howItSupports": "Produces the monthly adoption scorecard from DashboardUsage across the estate."}, {"id": "manage-licences-users-and-renewals", "name": "Manage Licences, Users and Renewals", "howItSupports": "Relates active users per business unit to the licensed plan so adoption growth and licence planning stay in step."}]}], "media": [{"type": "image", "src": "media/jbtd-bilr-jtbd-bilr-1.png", "title": "BI Platform Lead JTBD infographic: Grow dashboard adoption across creators, explorers and viewers", "alt": "Enterprise infographic for the job \"Grow dashboard adoption across creators, explorers and viewers\" for customer \"BI Platform Lead\"."}]}, {"id": "jtbd-bilr-2", "name": "Govern which extensions run on the platform and under which licence", "whatItIs": "Set and operate the extension policy for the Tableau or Power BI tenant: which extensions are permitted, whether they run SaaS-hosted by the vendor or self-hosted in the company network, how they are assessed by security, safelisted on Tableau Server or Cloud, versioned across workbooks and licensed under the right plan, so creators can use extensions without each one becoming a security exception.", "outcome": "Every extension in production is on an approved list with a known version, URL, deployment model and licence, the security review is done once per vendor rather than per dashboard, and governance incidents such as unapproved extensions or broken URLs after upgrades approach zero.", "steps": [{"step": "Define the extension policy", "description": "Decide which categories of extension are allowed, whether sandboxed and network-enabled extensions are treated differently, when the SaaS-hosted model is acceptable and when data must stay on-premises, who approves a new extension, and how the policy applies to Tableau Cloud, Tableau Server and Power BI custom visuals.", "streamsNeeded": [{"id": "govern-security-and-compliance", "name": "Govern Security and Compliance", "howItSupports": "Provides data-flow documentation and deployment-model descriptions that let the policy distinguish SaaS-hosted from self-hosted extensions."}]}, {"step": "Run the vendor assessment with security and procurement", "description": "Collect the vendor's ISO/IEC 27001:2022 certificate, latest penetration-test report, data processing agreement, data-flow diagrams and SLA, answer the internal vendor-risk questionnaire once, and record the assessment so future extensions from the same vendor inherit it.", "streamsNeeded": [{"id": "govern-security-and-compliance", "name": "Govern Security and Compliance", "howItSupports": "Supplies certifications, penetration-test evidence, DPAs and trust-centre material for the vendor-risk assessment."}, {"id": "support-and-enable-customers", "name": "Support and Enable Customers", "howItSupports": "Customer success and support answer questionnaire follow-ups and reference requests during the assessment."}]}, {"step": "Safelist and approve extensions on each platform", "description": "Add the approved extension URLs to the Tableau Server or Cloud safelist with the right permissions, approve the custom visuals in the Power BI admin portal, and communicate the approved catalogue to creators with the version and URL they must use.", "streamsNeeded": [{"id": "govern-security-and-compliance", "name": "Govern Security and Compliance", "howItSupports": "Provides the safelisting metadata, URLs and permissions the platform administrator needs per extension and version."}, {"id": "deploy-and-operate-extensions-on-premises", "name": "Deploy and Operate Extensions On-Premises", "howItSupports": "For self-hosted extensions, registers the internal URLs served by ExtensionsManager so the safelist points inside the network."}]}, {"step": "Choose the deployment model and plan", "description": "Select SaaS-hosted Professional for cloud-only business units or the Enterprise plan with the self-hosted option for regulated data, agree purchase orders and bank transfer with procurement, and assign the licence keys to the tenants and servers that will run the extensions.", "streamsNeeded": [{"id": "manage-licences-users-and-renewals", "name": "Manage Licences, Users and Renewals", "howItSupports": "Handles plan selection, purchase orders, invoices and licence keys through the Enterprise Customer Portal."}, {"id": "deploy-and-operate-extensions-on-premises", "name": "Deploy and Operate Extensions On-Premises", "howItSupports": "Activates the self-hosted deployment with the licence keys and keeps it updated from the customer portal."}]}, {"step": "Keep every workbook on the approved version and URL", "description": "Track which workbooks use which extension version, use TrexReplacer to switch extension URLs in bulk when a server moves or a version is retired, and plan extension upgrades together with Tableau Server upgrades so nothing breaks on reporting days.", "streamsNeeded": [{"id": "deploy-and-operate-extensions-on-premises", "name": "Deploy and Operate Extensions On-Premises", "howItSupports": "TrexReplacer and ExtensionsManager report versions in use and rewrite extension URLs across workbooks in one action."}, {"id": "guide-and-measure-dashboard-adoption", "name": "Guide and Measure Dashboard Adoption", "howItSupports": "Shows which workbooks and extensions are actually used so upgrade planning focuses on live dashboards."}]}], "media": [{"type": "image", "src": "media/jbtd-bilr-jtbd-bilr-2.png", "title": "BI Platform Lead JTBD infographic: Govern which extensions run on the platform and under which licence", "alt": "Enterprise infographic for the job \"Govern which extensions run on the platform and under which licence\" for customer \"BI Platform Lead\"."}]}, {"id": "jtbd-bilr-3", "name": "Justify and renew the extensions investment with usage evidence", "whatItIs": "Each year, prove to the CFO, the steering committee and procurement that the extensions subscription pays for itself: track active users against the plan the way the vendor counts them, gather usage and outcome evidence from DashboardUsage, write-back cycles and report deliveries, negotiate the renewal with the customer success manager and, where useful, the consulting partner, and decide whether to renew, expand to Enterprise-only products or consolidate.", "outcome": "Renewal is a planned decision backed by evidence rather than a surprise invoice, the plan matches real active users, and expansion into WriteBackExtreme, MailScheduler or a second BI platform happens because the numbers support it.", "steps": [{"step": "Track active users against the plan", "description": "Monitor the rolling twelve-month count of anonymous unique user tokens interacting with published dashboards across creators, explorers and viewers, compare it with the plan limit, and forecast when the organisation will cross into a larger plan or need Enterprise.", "streamsNeeded": [{"id": "manage-licences-users-and-renewals", "name": "Manage Licences, Users and Renewals", "howItSupports": "Meters active users by anonymous token over a rolling twelve months and shows consumption against the licensed plan."}]}, {"step": "Gather usage and outcome evidence", "description": "Pull DashboardUsage adoption per dashboard, the number of forecast cycles and records handled through write-back, and the reports delivered by MailScheduler, and pair them with business-unit statements about time saved and spreadsheets retired.", "streamsNeeded": [{"id": "guide-and-measure-dashboard-adoption", "name": "Guide and Measure Dashboard Adoption", "howItSupports": "Provides adoption evidence per dashboard and extension for the business case."}, {"id": "write-back-plan-and-collaborate-in-dashboards", "name": "Write Back, Plan and Collaborate in Dashboards", "howItSupports": "Reports write-back cycles, records and users that show planning workflows depend on the extensions."}]}, {"step": "Build the business case and negotiate the renewal", "description": "Review the evidence with the vendor's customer success manager, benchmark the cost per active user, agree the plan, term and purchase order with procurement, and secure prioritised feature requests and SLA terms as part of the Enterprise renewal.", "streamsNeeded": [{"id": "manage-licences-users-and-renewals", "name": "Manage Licences, Users and Renewals", "howItSupports": "Runs the renewal quote, purchase order and invoice through the Enterprise Customer Portal."}, {"id": "support-and-enable-customers", "name": "Support and Enable Customers", "howItSupports": "The customer success review supplies usage summaries, roadmap visibility and feature-request status for the negotiation."}]}, {"step": "Renew, expand or consolidate with the partner", "description": "Decide whether to add Enterprise-only products, extend the licence to Power BI business units under the same organisation, or consolidate overlapping tools, and involve the consulting partner for implementation of the expansion.", "streamsNeeded": [{"id": "manage-licences-users-and-renewals", "name": "Manage Licences, Users and Renewals", "howItSupports": "Applies the renewed or expanded entitlement to tenants and self-hosted servers through licence keys."}, {"id": "sell-and-deliver-through-partners", "name": "Sell and Deliver Through Partners", "howItSupports": "Lets the consulting or reseller partner register the expansion deal and deliver implementation in the customer's language and region."}]}], "media": [{"type": "image", "src": "media/jbtd-bilr-jtbd-bilr-3.png", "title": "BI Platform Lead JTBD infographic: Justify and renew the extensions investment with usage evidence", "alt": "Enterprise infographic for the job \"Justify and renew the extensions investment with usage evidence\" for customer \"BI Platform Lead\"."}]}], "customerJourneyStories": [{"id": "journey-bilr-1", "name": "Safelisting the first extension on Tableau Server", "linkedJobIds": ["jtbd-bilr-2", "jtbd-bilr-1"], "summary": "The BI platform lead of a bank's analytics centre of excellence moves from blocking all dashboard extensions on Tableau Server to a governed catalogue with Apps for Tableau as the first vetted vendor, choosing the Enterprise self-hosted model so data never leaves the network.", "stages": [{"stage": "Trigger", "narrative": "An internal audit finds a business unit using an unvetted community extension that calls an external host, and the platform team responds by disabling all extensions on Tableau Server. Within a month creators escalate that the finance team's SuperTables prototype, built on the free plan, no longer renders and that they are back to exporting to Excel."}, {"stage": "Discovery", "narrative": "The platform lead asks the bank's Tableau consulting partner which extension vendors survive a bank's vendor review and hears that Apps for Tableau, a Tableau Gold Partner heritage company with an Enterprise self-hosted option, is used by other financial institutions. The Tableau Exchange listing and the vendor's trust material confirm ISO 27001 certification and annual penetration testing."}, {"stage": "Evaluation", "narrative": "Security assesses the vendor once: certificate, penetration-test summary, data-flow diagrams showing that the self-hosted deployment needs no internet and gives the vendor no data access, SSO and role management, and a data processing agreement. The platform lead compares SaaS-hosted Professional with self-hosted Enterprise and chooses Enterprise for the bank, with purchase orders through procurement."}, {"stage": "Trial", "narrative": "The IT administrator installs ExtensionsManager on an internal Windows server, the platform lead safelists the internal extension URLs on the Tableau Server test site, and the finance SuperTables dashboard is republished for a pilot group of thirty users. The first version review with the vendor's customer success manager sets the upgrade calendar."}, {"stage": "Engagement", "narrative": "The approved catalogue with SuperTables, PowerKPIs, DashboardGuide and ShowMeMore is published to creators with the internal URLs, TrexReplacer switches the pilot workbooks from the trial URLs to the internal server, and the extension policy becomes part of the dashboard certification checklist. Governance incidents drop to occasional version drift caught before upgrades."}, {"stage": "Retention", "narrative": "At the first renewal the platform lead has a year without an extension-related audit finding, adoption growth in three business units, and a queue of creators asking for WriteBackExtreme. The bank renews on Enterprise, adds write-back for planning, and the platform lead becomes a reference for the vendor's other financial-services prospects."}], "media": [{"type": "image", "src": "media/journey-bilr-bilr-1.png", "title": "BI Platform Lead customer journey: Safelisting the first extension on Tableau Server", "alt": "Enterprise journey storyboard for \"Safelisting the first extension on Tableau Server\" for customer \"BI Platform Lead\"."}]}, {"id": "journey-bilr-2", "name": "From Professional plan to Enterprise renewal with usage evidence", "linkedJobIds": ["jtbd-bilr-3", "jtbd-bilr-1"], "summary": "The BI platform lead of a consumer-goods group with more than a thousand Tableau users inherits a Professional subscription bought by one department, discovers the rolling twelve-month user count is about to exceed the plan, and turns the renewal into a company-wide Enterprise agreement backed by adoption evidence.", "stages": [{"stage": "Trigger", "narrative": "A renewal notice arrives for a Professional plan nobody in the centre of excellence remembers buying, and the vendor's usage report shows active users approaching the 100-user limit because viewers across three business units interact with SuperTables dashboards. The CFO asks what the subscription is for and whether it should be renewed at all."}, {"stage": "Discovery", "narrative": "The platform lead reads the vendor's pricing page on how users are counted with anonymous unique tokens over a rolling twelve months, asks the customer success manager for a usage breakdown per dashboard, and hears from the Tableau partner that other groups of this size run Enterprise with a dedicated customer success manager and priority support."}, {"stage": "Evaluation", "narrative": "The lead compares renewing Professional and policing user counts, moving to Enterprise with unlimited users, or replacing the extensions with native features and custom code. DashboardUsage evidence, the number of Excel exports avoided, creator interviews and the cost per active user under each option go into a one-page business case; procurement confirms purchase orders and bank transfer are supported."}, {"stage": "Trial", "narrative": "Before committing, the platform lead runs a 60-day evidence pilot: DashboardGuide and DashboardUsage go onto the twenty most-used dashboards, MailScheduler trial deliveries reach forty directors who never opened Tableau, and the vendor provides a draft Enterprise proposal with the renewal aligned to the fiscal year."}, {"stage": "Engagement", "narrative": "The group signs the Enterprise plan, the centre of excellence publishes a monthly adoption scorecard per business unit from DashboardUsage and the licence portal, MailScheduler and WriteBackExtreme roll out to finance, and quarterly customer success reviews replace the surprise renewal notice."}, {"stage": "Retention", "narrative": "The next renewal is prepared ninety days ahead with the scorecard, active-user trend and the planning cycles now running through write-back. The group extends the organisation licence to its Power BI business units under the same agreement and prioritises two feature requests through the Enterprise programme."}], "media": [{"type": "image", "src": "media/journey-bilr-bilr-2.png", "title": "BI tion renews.", "icon": "bviw.png", "careAbout": ["Getting the number I need today, in a grid I already understand, instead of waiting weeks for a new dashboard", "Pivoting, grouping, subtotalling, sorting and conditional formatting the way Excel does it, on the full data set rather than a sample", "Drilling from a total to the underlying rows and back up again without losing my filters", "Saving my own view so the dashboard opens the way I left it, and sharing that view with my team", "Exporting exactly what I see to Excel, with formatting and totals, for the reconciliation or the meeting deck", "Trusting the numbers because they come from the governed dashboard and not from a copied spreadsheet"], "winsThem": ["A SuperTable that looks and behaves like the Excel grid they know: pivots, grouping, formulas, conditional formatting and totals on millions of rows through the server-side row model", "Personalised saved views and one-click Excel export that respect the current filters, grouping and formatting", "DrillDownTree and HierarchyFilter that let them walk account, product and organisation hierarchies without asking a creator to add a level", "A DashboardGuide overlay that shows what the dashboard can do the first time they open it, so nobody needs a training session", "Generative fill and AI-assisted column suggestions that write the formula or classification they would otherwise have typed in Excel"], "theirFear": ["Being forced into a locked-down dashboard that answers the creator's question but not mine, so I go back to exporting raw data into Excel", "Exported numbers that do not match the dashboard because filters, grouping or totals were lost on the way out", "Learning yet another tool that changes every release while the spreadsheet I know still works"], "jobsToBeDone": [{"id": "jtbd-bviw-1", "name": "Answer my own question from the dashboard without asking for a new one", "whatItIs": "When the published dashboard does not show the cut the viewer needs, by customer group, by plant, by month with subtotals, reshape the data inside the dashboard: pivot, group, filter, drill down, add a calculated column and format the result, then save that view for next time, instead of filing a request with the BI team or exporting raw rows into Excel and rebuilding the pivot there.", "outcome": "The viewer has the answer within the same session, in a table whose totals match the dashboard, and the dashboard creator's request queue shrinks because one dashboard now serves many questions.", "steps": [{"step": "Open the dashboard and orient", "description": "Open the Tableau or Power BI dashboard from the portal or a shared link, follow the DashboardGuide overlay that explains what the SuperTable, filters and drill-downs can do, and find the table that holds the question.", "streamsNeeded": [{"id": "guide-and-measure-dashboard-adoption", "name": "Guide and Measure Dashboard Adoption", "howItSupports": "Shows first-time viewers what the extensions on this dashboard can do and records that the tour was completed."}, {"id": "explore-and-self-serve-data-in-dashboards", "name": "Explore and Self-Serve Data in Dashboards", "howItSupports": "Presents the SuperTable with the columns, filters and features the creator exposed."}]}, {"step": "Pivot, group and filter to the cut I need", "description": "Drag a dimension to rows or columns, group by region or product family, add subtotals and grand totals, sort, narrow the scope with HierarchyFilter and apply conditional formatting so variances stand out.", "streamsNeeded": [{"id": "explore-and-self-serve-data-in-dashboards", "name": "Explore and Self-Serve Data in Dashboards", "howItSupports": "Runs pivot, grouping, sorting, filtering and formatting in the grid on the full row set through the server-side row model."}, {"id": "build-interactive-dashboards-with-extensions", "name": "Build Interactive Dashboards With Extensions", "howItSupports": "Determines which columns, features and hierarchies the creator configured for viewers to use."}]}, {"step": "Drill down to the underlying rows", "description": "Expand a group or use DrillDownTree to walk from a total to the transactions behind it, inspect an outlier, and step back up without losing filters; switch to the ProcessMining view when the question is about where a flow stalls.", "streamsNeeded": [{"id": "explore-and-self-serve-data-in-dashboards", "name": "Explore and Self-Serve Data in Dashboards", "howItSupports": "Provides drill-down, hierarchy navigation and process views that keep filter context across levels."}]}, {"step": "Add a calculated column or a generated fill", "description": "Add a formula column such as margin or variance percentage, or use generative fill to derive a classification from existing columns, and sanity-check the result against a row whose value is known.", "streamsNeeded": [{"id": "explore-and-self-serve-data-in-dashboards", "name": "Explore and Self-Serve Data in Dashboards", "howItSupports": "Evaluates formulas and generative fill inside the grid and keeps them in the viewer's session."}]}, {"step": "Save the view and come back to it", "description": "Save the layout as a personal view with a name, reopen it next week and share the view name with colleagues so the team looks at the same cut.", "streamsNeeded": [{"id": "explore-and-self-serve-data-in-dashboards", "name": "Explore and Self-Serve Data in Dashboards", "howItSupports": "Persists personalised saved views per user and restores them on the next visit."}, {"id": "guide-and-measure-dashboard-adoption", "name": "Guide and Measure Dashboard Adoption", "howItSupports": "Counts saved views and return visits as adoption evidence for the BI lead."}]}], "media": [{"type": "image", "src": "media/jbtd-bviw-jtbd-bviw-1.png", "title": "Business Dashboard Viewer JTBD infographic: Answer my own question from the dashboard without asking for a new one", "alt": "Enterprise infographic for the job \"Answer my own question from the dashboard without asking for a new one\" for customer \"Business Dashboard Viewer\"."}]}, {"id": "jtbd-bviw-2", "name": "Take the numbers with me to Excel, a meeting or a slide", "whatItIs": "Get the table exactly as shown, with filters, grouping, formatting and totals, out of the dashboard and into Excel for a reconciliation, into a PDF or image for a meeting, or into a slide deck for the monthly review, without retyping, re-pivoting or rebuilding it, and where the same cut is needed every week, have it delivered instead of re-exported.", "outcome": "What the viewer shows in the meeting is what the dashboard shows, produced in one click, with the date and filters stated and an obvious way back to the source.", "steps": [{"step": "Prepare the exact cut", "description": "Apply the filters, grouping and formatting the audience needs, check that subtotals and grand totals match the dashboard's headline figures, and save the view so the export can be repeated.", "streamsNeeded": [{"id": "explore-and-self-serve-data-in-dashboards", "name": "Explore and Self-Serve Data in Dashboards", "howItSupports": "Holds the current grid state, totals and saved view that the export will reproduce."}]}, {"step": "Export to Excel with formatting", "description": "Export the SuperTable to Excel with grouping, number formats and conditional formatting preserved, open it for the reconciliation or further modelling, and keep the source dashboard name and date in the file.", "streamsNeeded": [{"id": "explore-and-self-serve-data-in-dashboards", "name": "Explore and Self-Serve Data in Dashboards", "howItSupports": "Produces the formatted Excel export that mirrors the grid rather than a raw data dump."}]}, {"step": "Turn dashboards into slides or images", "description": "Export the dashboard or selected sheets to a PowerPoint deck with VizSlides, or to PDF and PNG, with the current filters applied, for the monthly review or a board pack.", "streamsNeeded": [{"id": "report-finance-from-dashboard-data", "name": "Report Finance From Dashboard Data", "howItSupports": "Generates presentation-ready VizSlides and PDF exports from the current dashboard state."}, {"id": "distribute-reports-and-alerts", "name": "Distribute Reports and Alerts", "howItSupports": "Renders PDF and PNG outputs with the viewer's filters applied."}]}, {"step": "Subscribe instead of re-exporting", "description": "Where the same cut is needed every Monday, ask the creator for a MailScheduler delivery filtered to the viewer's scope so it arrives in email or Teams before the meeting.", "streamsNeeded": [{"id": "distribute-reports-and-alerts", "name": "Distribute Reports and Alerts", "howItSupports": "Schedules personalised deliveries that replace the manual weekly export."}]}], "media": [{"type": "image", "src": "media/jbtd-bviw-jtbd-bviw-2.png", "title": "Business Dashboard Viewer JTBD infographic: Take the numbers with me to Excel, a meeting or a slide", "alt": "Enterprise infographic for the job \"Take the numbers with me to Excel, a meeting or a slide\" for customer \"Business Dashboard Viewer\"."}]}], "customerJourneyStories": [{"id": "journey-bviw-1", "name": "First meeting a SuperTables dashboard instead of the Monday export", "linkedJobIds": ["jtbd-bviw-1", "jtbd-bviw-2"], "summary": "A finance manager at a consumer-goods company with more than a thousand Tableau users adopts SuperTables after years of exporting raw data into Excel: triggered by a stalled dashboard request, discovering the grid through a rebuilt dashboard and its DashboardGuide tour, evaluating it against her Excel pivot, trialling it for one month-end, and staying because her saved views and formatted exports make the old spreadsheet unnecessary.", "stages": [{"stage": "Trigger", "narrative": "Every Monday the finance manager exports the raw data behind the Sales by Customer dashboard into Excel to build the pivot she actually needs. The export takes twenty minutes, the numbers drift from the dashboard by Wednesday, and her request for a customer-group subtotal has sat in the BI backlog for six weeks."}, {"stage": "Discovery", "narrative": "The BI team publishes the same dashboard rebuilt with a SuperTable and sends the link. On first open a DashboardGuide overlay walks her through pivoting, grouping, conditional formatting and Excel export, and a colleague in supply chain mentions that he stopped exporting altogether since his dashboard got the same grid."}, {"stage": "Evaluation", "narrative": "She tests whether the grid does what her Excel pivot does: drags customer group to rows, adds subtotals, sets a red-green variance format and checks that the totals match the dashboard headline to the cent. She asks the BI lead whether exporting is allowed under the data policy and hears that the extension runs inside the organisation's own Tableau environment and is on the safelist."}, {"stage": "Trial", "narrative": "For one month-end she builds her cut in the SuperTable, saves it as a personal view, exports to Excel with formatting and reconciles it against the old spreadsheet. The totals match, the export takes one click, and the customer-group subtotal she waited six weeks for is a drag-and-drop."}, {"stage": "Engagement", "narrative": "Her saved views become the way she opens the dashboard. She uses DrillDownTree to go from a customer group to the invoices when a variance appears, tries generative fill to classify SKUs, and stops sending dashboard requests for new cuts; the creator retires two of the variants built for her team."}, {"stage": "Retention", "narrative": "When the BI lead reviews DashboardUsage data before the renewal, her team's active use is the case for keeping the Enterprise plan. She tells peers that Tableau is now as accessible as Excel and asks for the same grid on the inventory dashboard."}], "media": [{"type": "image", "src": "media/journey-bviw-bviw-1.png", "title": "Business Dashboard Viewer customer journey: First meeting a SuperTables dashboard instead of the Monday export", "alt": "Enterprise journey storyboard for \"First meeting a SuperTables dashboard instead of the Monday export\" for customer \"Business Dashboard Viewer\"."}]}, {"id": "journey-bviw-2", "name": "Drilling through the cost-centre hierarchy without a new worksheet", "linkedJobIds": ["jtbd-bviw-1"], "summary": "A plant controller at a pharmaceutical manufacturer adopts DrillDownTree, HierarchyFilter and ProcessMining on the spend dashboard: triggered by a dashboard that stops at department level, discovering the extensions at an internal analytics community session, evaluating them against the Excel hierarchy pivot, trialling them for one quarter close, and staying because drill-downs replaced three ad-hoc worksheets.", "stages": [{"stage": "Trigger", "narrative": "The plant controller wants to see spend by cost centre all the way down a twelve-level organisation hierarchy, but the standard spend dashboard stops at department level and every further drill means a new worksheet from the BI team. A mis-posted maintenance cost went unnoticed for two months because nobody could see level nine."}, {"stage": "Discovery", "narrative": "At the internal analytics community session the dashboard creator demonstrates DrillDownTree and HierarchyFilter on the Tableau Server dashboard; the extensions are already safelisted by the platform team, and the docs.infotopics.com pages show how viewers navigate the tree and keep their filters."}, {"stage": "Evaluation", "narrative": "The controller compares the drill-down with the Excel hierarchy pivot: does it keep filters, show totals at every node, and cope with the full cost-centre tree? A test on last quarter's data in the free plan on the creator's site confirms it does, and the BI lead confirms that the extensions run inside the organisation's own environment."}, {"stage": "Trial", "narrative": "The creator adds the extensions to the spend dashboard. During one quarter close the controller navigates the tree, finds a mis-posted maintenance cost at level nine, exports the affected rows to Excel and sends them to accounting the same day."}, {"stage": "Engagement", "narrative": "Drill-downs replace three ad-hoc worksheets; the controller saves a view per cost centre and shares them with plant leads; the ProcessMining view on the purchase-to-pay flow shows where approvals stall and becomes part of the monthly review."}, {"stage": "Retention", "narrative": "The controller becomes the internal reference for the finance community; with fewer dashboard requests the BI team adds the discovery extensions to every finance dashboard, and the controller's team is counted among the active users that justify the renewal."}], "media": [{"type": "image", "src": "media/journey-bviw-bviw-2.png", "title": "Business Dashboard Viewer customer journey: Drilling through the cost-centre hierarchy without a new worksheet", "alt": "Enterprise journey storyboard for \"Drilling through the cost-centre hierarchy without a new worksheet\" for customer \"Business Dashboard Viewer\"."}]}], "kpiPyramids": {"customerOutcomes": {"top": {"id": "co-bviw-top", "name": "Self-service answer rate", "description": "Share of a viewer's questions answered inside the dashboard by pivoting, filtering, drilling or exporting, rather than through a new dashboard request, a ticket or an export-and-rebuild in Excel; the viewer's headline measure that the dashboard works the way they think.", "unit": "%", "currentValue": "45", "targetValue": "80", "link": "https://dashboard.example.com/bi-dashboard-extensions-platform/customers/bviw/kpis/co-bviw-top", "linkLabel": "Open KPI dashboard", "icon": "kpi-bviw-co-bviw-top.png"}, "branches": [{"id": "co-bviw-b1", "name": "Answer speed and depth", "description": "How quickly a viewer gets from opening the dashboard to the answer, and how rarely they need someone else to build the cut for them.", "currentValue": "48", "icon": "kpi-bviw-co-bviw-b1.png", "children": [{"id": "co-bviw-b1-c1",
