    <style>
    /* Shared design tokens for all generated pages.
       Canonical palette promoted from the evidence-explorer page, plus the
       de-facto grays/blues already used across templates. New CSS should use
       these instead of hex literals; existing literals migrate opportunistically. */
    :root {
        /* surfaces */
        --bg: #f6f8fb;
        --panel: #ffffff;
        --surface: #f8fafc;
        --surface-muted: #eef2f7;
        --surface-fallback: #f8fafc;

        /* text */
        --ink: #1f2430;
        --ink-soft: #5b6472;
        --muted: #6b7280;
        --muted-strong: #8a94a6;

        /* lines and borders */
        --line: #e5e7eb;
        --line-strong: #d1d5db;
        --group-border: #d8e0ea;

        /* accent */
        --accent: #2563eb;
        --accent-ink: #1d4ed8;
        --accent-soft: #eff4ff;
        --accent-line: #c9dbff;
        --highlight-color: #dbeafe;

        /* shape and depth */
        --radius: 14px;
        --radius-sm: 10px;
        --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 6px 18px rgba(16, 24, 40, 0.06);
        --shadow-hover: 0 2px 6px rgba(16, 24, 40, 0.08), 0 14px 30px rgba(16, 24, 40, 0.12);
        --card-shadow: rgba(0, 0, 0, 0.15) 0px 2px 8px;
    }
</style>

    <style>
    .tab {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 4px;
    }

    .tab button {
        position: relative;
        background-color: transparent;
        border: none;
        outline: none;
        cursor: pointer;
        padding: 11px 16px;
        margin-bottom: -1px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        color: #6b7280;
        border-bottom: 2px solid transparent;
        border-radius: 8px 8px 0 0;
        transition: color 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
    }

    .tab button:hover {
        color: #1f2937;
        background-color: #f3f4f6;
    }

    .tab button:focus-visible {
        outline: 2px solid #1d4ed8;
        outline-offset: -2px;
    }

    .tab button.active {
        color: #1d4ed8;
        border-bottom-color: #1d4ed8;
    }

    .tabcontent {
        display: none;
        padding: 2px 2px;
        animation: tabContentFade 0.2s ease;
    }

    @keyframes tabContentFade {
        from {
            opacity: 0;
            transform: translateY(3px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 720px) {
        .tab {
            flex-direction: column;
            gap: 0;
        }

        .tab button {
            width: 100%;
            text-align: left;
            margin-bottom: 0;
            border-bottom: 1px solid #e5e7eb;
            border-radius: 0;
        }

        .tab button.active {
            border-bottom-color: #1d4ed8;
        }
    }
</style>

            border-radius: 8px;
            background-color: #f8fafc;
            padding: 14px;
        }

        .matrix-shell {
            min-width: 0;
        }

        .matrix-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }

        .matrix-table-wrap {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background-color: white;
            overflow: auto;
            max-height: 75vh;
        }

        .matrix-table {
            border-collapse: collapse;
            width: max-content;
            min-width: 100%;
        }

        .matrix-table th,
        .matrix-table td {
            border-bottom: 1px solid #e5e7eb;
            border-right: 1px solid #f3f4f6;
            padding: 6px;
            text-align: center;
            vertical-align: middle;
        }

        .matrix-table th {
            position: sticky;
            top: 0;
            background-color: #f8fafc;
            z-index: 1;
        }

        .matrix-row-head {
            position: sticky;
            left: 0;
            background-color: white;
            min-width: 220px;
            text-align: left;
            z-index: 1;
        }

        .matrix-corner {
            position: sticky;
            left: 0;
            top: 0;
            z-index: 2;
            background-color: #f8fafc;
            min-width: 220px;
            text-align: left;
        }

        .matrix-col-icon {
            width: 14px;
            height: 14px;
            object-fit: contain;
        }

        .matrix-col-count {
            font-size: 10px;
            color: #6b7280;
            min-width: 24px;
        }

        .matrix-row-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 80%;
            text-align: left;
        }

        .matrix-row-count {
            margin-left: auto;
            font-size: 11px;
            color: #6b7280;
            padding-left: 8px;
            white-space: nowrap;
        }

        .matrix-row-icon {
            width: 18px;
            height: 18px;
            object-fit: contain;
            flex: 0 0 auto;
        }

        .matrix-hit {
            background-color: #dbeafe;
            color: #1e3a8a;
            font-size: 11px;
            line-height: 1.2;
            max-width: 6px;
        }

        .matrix-hit-external {
            background-color: #ecfccb;
            color: #365314;
            font-size: 10px;
            line-height: 1.2;
            max-width: 6px;
        }

        .matrix-empty-cell {
            color: #d1d5db;
        }

        @media (max-width: 1080px) {
            .dependencies-layout {
                grid-template-columns: 1fr;
            }

            .matrix-layout {
                grid-template-columns: 1fr;
            }
        }

        const streamsPayload = {"metadata": {"title": "Product Streams", "description": "Outcome-based product streams for the BI Dashboard Extensions Platform domain: the lifecycle Discover -> Trial -> Build -> Use -> Distribute -> Deploy -> Govern -> Renew as run by dashboard creators, BI platform leads, business users, planners, executives, IT administrators, security reviewers and partners on the Infotopics | Apps for Tableau extension portfolio across Tableau, Power BI and Looker Studio.", "sources": ["https://appsfortableau.infotopics.com/", "https://appsfortableau.infotopics.com/pricing/", "https://appsfortableau.infotopics.com/products/writebackextreme/", "https://appsfortableau.infotopics.com/products/supertables/", "https://appsfortableau.infotopics.com/products/mailscheduler/", "https://appsfortableau.infotopics.com/partners/", "https://appsforpowerbi.infotopics.com/about-us/", "https://docs.infotopics.com/", "https://www.vortexcp.com/investment/infotopics-apps-for-tableau/"], "flowModelVersion": "3.2", "flowModelNote": "Each stream carries only stream-specific flows, names the supporting bricks used in each step and the persona acting in it, and lists the external systems (Tableau Cloud/Server and Desktop, Tableau Exchange and Microsoft AppSource, the customer's databases and identity provider, Teams/Slack and email, vendor-risk and certification parties, payment and CRM) the flow depends on.", "definitions": {"productBrick": "A reusable implementation-facing building block used to realize one or more product streams.", "productStream": "A high-level, outcome-based experience that delivers customer or business value."}}, "rootGroups": [{"name": "Acquisition and Building Journeys", "description": "From discovery and trial to published, extension-powered dashboards: the journeys that bring an organisation onto the extensions and put them into creators' hands.", "subGroups": [], "streams": [{"id": "discover-trial-and-subscribe-to-extensions", "name": "Discover, Trial and Subscribe to Extensions", "icon": "discover-trial-and-subscribe-to-extensions.png", "type": "outcome-based-stream", "description": "Take a dashboard creator or BI platform lead from first contact \u2014 the website, the Tableau Exchange, Microsoft AppSource, a partner or a conference demo \u2014 to a working Free plan, a WriteBackExtreme trial and a paid Professional or Enterprise subscription, and keep that subscription renewing year after year without a sales-heavy motion the 30-person company cannot afford.", "group": "Acquisition and Building Journeys", "rootGroup": "Acquisition and Building Journeys", "flows": [{"id": "from-website-signup-to-enterprise-subscription", "title": "From Website Signup to an Enterprise Subscription", "description": "A creator finds SuperTables, signs up for the Free plan, rolls it out to colleagues, trials WriteBackExtreme and finally moves the organisation to an Enterprise subscription with an on-premises option.", "primaryActor": "Dashboard Creator", "trigger": "A creator searches for an Excel-like table for Tableau, lands on appsfortableau.infotopics.com or the Tableau Exchange listing and opens the SuperTables product page.", "successSignal": "The organisation holds an Enterprise subscription with license keys in the Enterprise Customer Portal and a dedicated customer success manager assigned.", "steps": [{"id": "discover-extension", "title": "Discover the extension on the website, Exchange or via a partner", "actor": "Dashboard Creator", "keyFacts": ["The website, the Tableau Exchange listing, Microsoft AppSource and 32 partners are the four discovery routes; the gallery shows each of the 30+ extensions in a live demo workbook.", "Named customers such as Bank of America, Pfizer, Siemens and Johnson & Johnson and the Post Holdings quote about Excel-minded users are the social proof a creator forwards to a sceptical lead."], "painPoints": ["Creators cannot tell which extensions are SaaS-only, Enterprise-only (WriteBackExtreme, MailScheduler) or available for Power BI without reading several pages.", "A creator who finds the extension in the Exchange may never see the pricing page and assumes it is free forever."], "dependencies": [{"type": "brick", "id": "webt", "name": "Website, Trials and Self-Service Signup", "description": "appsfortableau.infotopics.com product pages, pricing and self-service signup for the Free plan and trials.", "how": "Serves product pages, pricing and the signup call to action per extension."}, {"type": "brick", "id": "gall", "name": "Gallery, Demo Workbooks and Templates", "description": "Gallery of demo dashboards, sample workbooks and configuration templates per extension.", "how": "Lets the creator try the extension in a demo workbook before signing up."}]}, {"id": "sign-up-for-free-plan", "title": "Sign up for the Free plan without a credit card", "actor": "Dashboard Creator", "keyFacts": ["The Free plan covers all extensions for 1\u20135 users with no time limit and no credit card; signup creates the organisation account and a licence token.", "Users are counted as anyone interacting with a published dashboard \u2014 creators, explorers and viewers \u2014 via anonymous unique tokens over a rolling 12 months."], "painPoints": ["Corporate email domains are sometimes already registered by a colleague, creating duplicate organisation accounts that later complicate licensing.", "Creators expect an install step and do not realise the SaaS-hosted extension only needs safelisting on their Tableau site."], "dependencies": [{"type": "brick", "id": "webt", "name": "Website, Trials and Self-Service Signup", "description": "appsfortableau.infotopics.com product pages, pricing and self-service signup for the Free plan and trials.", "how": "Runs the self-service signup form and email verification."}, {"type": "brick", "id": "lics", "name": "License Service, Usage Metering and Billing", "description": "Plans, anonymous unique user tokens, rolling 12-month active-user metering, invoices and renewals.", "how": "Creates the organisation, assigns the Free plan and issues the licence token."}, {"type": "brick", "id": "saas", "name": "SaaS Hosting and Release Pipeline", "description": "Multi-tenant hosting of the extension web apps, versioning, safelisting metadata and marketplace listings.", "how": "Serves the hosted extension URL that the creator adds to a dashboard."}]}, {"id": "first-value-in-own-dashboard", "title": "Reach first value in the creator's own dashboard", "actor": "Dashboard Creator", "keyFacts": ["The creator drops the extension into a Tableau Desktop dashboard, points it at a worksheet and sees an Excel-like grid in the same session.", "Documentation on docs.infotopics.com and the getting-started webinar cover the safelisting step for Tableau Cloud and Server."], "painPoints": ["If the Tableau site administrator has not safelisted the extension URL, the extension is blocked after publishing and the creator blames the product.", "Creators evaluate on Desktop only and discover the governance step late, which stalls the rollout."], "dependencies": [{"type": "brick", "id": "saas", "name": "SaaS Hosting and Release Pipeline", "description": "Multi-tenant hosting of the extension web apps, versioning, safelisting metadata and marketplace listings.", "how": "Hosts the extension and exposes safelisting metadata for the Tableau site."}, {"type": "brick", "id": "docs", "name": "Documentation, Webinars and Training", "description": "docs.infotopics.com, release notes, webinars and training for creators, admins and partners.", "how": "Explains configuration and safelisting so the first dashboard works after publishing."}]}, {"id": "grow-beyond-five-users", "title": "Roll out to colleagues and cross the Free-plan limit", "actor": "BI Platform Lead", "keyFacts": ["Once more than five unique tokens interact with dashboards in the rolling window, the license service flags the organisation for the Professional plan (up to 100 is partner-sourced."}]}, {"id": "activate-portal-and-csm", "title": "Activate the Enterprise Customer Portal and assign customer success", "actor": "Infotopics Customer Success Manager", "keyFacts": ["The Enterprise Customer Portal exposes license keys, downloads and account management; the customer success manager schedules the onboarding session.", "Onboarding covers safelisting, ExtensionsManager installation and the first production dashboards."], "painPoints": ["Without a named technical contact on the customer side, keys and downloads sit unused for weeks.", "Customers assume the CSM replaces the support portal and route incidents through email."], "dependencies": [{"type": "brick", "id": "eprt", "name": "Enterprise Customer Portal", "description": "License keys, downloads, account management and my-appsfortableau for Enterprise customers.", "how": "Provisions the customer's portal account with keys and downloads."}, {"type": "brick", "id": "csuc", "name": "Customer Success and Account Health", "description": "Dedicated customer success managers, adoption reviews, feature-request prioritisation and renewal health.", "how": "Assigns the customer success manager and plans onboarding."}, {"type": "brick", "id": "supp", "name": "Support Portal, SLAs and Ticketing", "description": "Support tickets, live chat and email support with plan-based SLAs and priority support for Enterprise.", "how": "Registers the customer's support entitlement and SLA."}]}]}], "outcomes": ["Creators reach a working extension in their own dashboard within minutes of signup, without a credit card or a sales call", "Free-plan organisations convert to Professional and Enterprise when they cross five active users, because the plan ladder is visible in the product and the portal", "Every subscription carries the right plan, user count, deployment model and support level, so renewals are a confirmation instead of a negotiation", "Partner-sourced and marketplace-sourced signups are attributed cor ksheet data fetch, filter and parameter synchronisation and the server-side row model.", "how": "Streams the event-log rows from the worksheet."}]}, {"id": "filter-variants", "title": "Filter to the most frequent variants", "actor": "Business Dashboard Viewer", "keyFacts": ["Variants are ranked by frequency; selecting one filters the other dashboard objects to those cases.", "Durations between activities are shown on the edges."], "painPoints": ["Rare variants hide the exceptions the analyst is most interested in.", "Large logs make variant computation slow in the browser."], "dependencies": [{"type": "brick", "id": "prcm", "name": "ProcessMining Visualizer", "description": "Process-flow visualisation of event logs with variants, frequencies and durations.", "how": "Computes and ranks variants and durations."}, {"type": "brick", "id": "hrfl", "name": "HierarchyFilter", "description": "Hierarchical filter control that drives worksheets through multi-level selections.", "how": "Narrows the cases by region or product before variant analysis."}]}, {"id": "drill-into-waiting-cases", "title": "Drill into the cases waiting at the bottleneck", "actor": "Business Dashboard Viewer", "keyFacts": ["Selecting an edge lists the cases in a SuperTable with their attributes for further pivoting.", "The same cases can be exported for the operations meeting."], "painPoints": ["Case lists are large and need grouping to be meaningful.", "Operations wants the list in their ERP, which requires a second tool."], "dependencies": [{"type": "brick", "id": "sptb", "name": "SuperTables Interactive Grid", "description": "Excel-like grid with pivot, grouping, conditional formatting, formulas, saved views and Excel export.", "how": "Lists and pivots the selected cases."}, {"type": "brick", "id": "prcm", "name": "ProcessMining Visualizer", "description": "Process-flow visualisation of event logs with variants, frequencies and durations.", "how": "Passes the selected edge's cases to the table."}]}, : "Worksheet data fetch, filter and parameter synchronisation and the server-side row model.", "how": "Fetches worksheet data and synchronises filters and parameters."}]}, {"id": "configure-columns-and-formatting", "title": "Configure columns, formulas, conditional formatting and defaults", "actor": "Dashboard Creator", "keyFacts": ["Configuration covers column order, aggregation, number formats, conditional formatting, formulas and which viewer actions are allowed.", "EasyDesigns applies a consistent style across all extensions in the workbook so tables match the corporate dashboard theme."], "painPoints": ["Creators over-configure and lock down the very features viewers wanted.", "Theme changes in the workbook are not reflected until each extension is reopened."], "dependencies": [{"type": "brick", "id": "sptb", "name": "SuperTables Interactive Grid", "description": "Excel-like grid with pivot, grouping, conditional formatting, formulas, saved views and Excel export.", "how": "Stores the column, formula and formatting configuration."}, {"type": "brick", "id": "xdsg", "name": "MarginalHistogram and EasyDesigns Helpers", "description": "Design helpers that add marginal distributions and consistent styling to dashboards.", "how": "Applies consistent styling and design helpers across extensions."}]}, {"id": "add-charts-kpis-and-images", "title": "Add ShowMeMore charts, PowerKPIs and PictureThis where the table is not enough", "actor": "Dashboard Creator", "keyFacts": ["ShowMeMore \u2014 the first product, shown in the Tableau Conference 2018 keynote \u2014 adds chart types without calculated fields; PowerKPIs gives the dashboard a KPI entry point; PictureThis renders product or people images in tables.", "A HierarchyFilter drives the whole dashboard from a multi-level selection."], "painPoints": ["Each additional extension is another safelist entry and another thing to explain to the platform lead.", "Mixing native and extension visuals raises consistency questions ab egation type."], "dependencies": [{"type": "brick", "id": "sptb", "name": "SuperTables Interactive Grid", "description": "Excel-like grid with pivot, grouping, conditional formatting, formulas, saved views and Excel export.", "how": "Executes pivot, grouping, totals and formatting at runtime."}, {"type": "brick", "id": "dcon", "name": "Dashboard Data Connector", "description": "Worksheet data fetch, filter and parameter synchronisation and the server-side row model.", "how": "Pages and aggregates rows on the server for large datasets."}]}, {"id": "drill-into-hierarchy", "title": "Drill down the product hierarchy", "actor": "Business Dashboard Viewer", "keyFacts": ["DrillDownTree expands category, subcategory and SKU level by level; the selection acts on the rest of the dashboard.", "Drill paths follow the hierarchy defined in the data source, so governance is preserved."], "painPoints": ["Deep hierarchies with thousands of leaves need lazy loading or the tree becomes unusable.", "Viewers lose track of where they are after several drills."], "dependencies": [{"type": "brick", "id": "drdt", "name": "DrillDownTree Hierarchy Explorer", "description": "Tree view that lets viewers expand and collapse hierarchies level by level.", "how": "Renders the expandable hierarchy and drives dashboard actions."}, {"type": "brick", "id": "xfrm", "name": "Extension Framework and Shared UI Kit", "description": "Shared dashboard and viz extension shells on the Tableau Extensions API with settings persistence and theming.", "how": "Provides the shared UI shell and breadcrumb of the current selection."}]}, {"id": "ask-ai-for-the-narrative", "title": "Ask for a narrative explanation of the variance", "actor": "Business Dashboard Viewer", "keyFacts": ["Narrative insights summarise the top drivers of a selected variance from the data already loaded in the extension.", "Generative fill can propose values for a column from the pattern in other rows, subject to the creator's settings."], "painP ps, subtotals and formatting; CSV is available for raw data.", "Exports are produced from the same server-side row model, so totals match the screen."], "painPoints": ["Exports of millions of rows are blocked or slow, and viewers do not understand why.", "Once exported, numbers get edited in Excel and re-circulated as if they were the dashboard."], "dependencies": [{"type": "brick", "id": "sptb", "name": "SuperTables Interactive Grid", "description": "Excel-like grid with pivot, grouping, conditional formatting, formulas, saved views and Excel export.", "how": "Triggers the export with the current view state."}, {"type": "brick", "id": "rndr", "name": "Dashboard Rendering and Export Service", "description": "Server-side rendering of dashboards and tables to PDF, PNG, CSV and Excel.", "how": "Renders the Excel and CSV files server-side."}]}]}, {"id": "trace-a-process-in-the-dashboard", "title": "Trace a Process from an Event Log", "description": "An operations analyst uses ProcessMining inside a dashboard to see how orders actually flow through the fulfilment process and where they wait.", "primaryActor": "Business Dashboard Viewer", "trigger": "Late deliveries rise and the operations lead wants to see where orders stall without buying a process-mining suite.", "successSignal": "The analyst identifies the step with the longest waiting time and the variant that causes it, from the existing dashboard.", "steps": [{"id": "load-event-log-worksheet", "title": "Load the event-log worksheet into the process view", "actor": "Dashboard Creator", "keyFacts": ["The creator prepares a worksheet with case id, activity and timestamp; ProcessMining derives the process graph from it.", "Event logs stay in the customer's data source; the extension only reads through the data connector."], "painPoints": ["Event logs are often incomplete or have inconsistent activity names, producing spaghetti graphs.", "Analysts expect a dedicated process-mining suite's feature set."], "dependencies": ard."], "dependencies": [{"type": "brick", "id": "wbwf", "name": "Write-back Workflow, Approvals and Audit Trail", "description": "Submission, validation, approval and rollback workflow with a per-change audit trail.", "how": "Runs the approval and records the decision."}, {"type": "brick", "id": "idnt", "name": "Identity, SSO and Role Management", "description": "SSO with the customer's identity provider and role management for extensions and write-back.", "how": "Maps the data-owner role to the approver."}]}, {"id": "apply-and-refresh", "title": "Apply the correction and refresh the dashboard", "actor": "Planning and Finance Contributor", "keyFacts": ["Approved corrections are joined into the data source through the customer's view or ETL.", "The audit trail shows the full chain from comment to approval."], "painPoints": ["The source system owner may not accept corrections from a dashboard.", "Corrections applied only in the write-back layer diverge from the source over time."], "dependencies": [{"type": "brick", "id": "dcon", "name": "Dashboard Data Connector", "description": "Worksheet data fetch, filter and parameter synchronisation and the server-side row model.", "how": "Reloads corrected data into the dashboard."}]}, {"id": "prove-the-trail", "title": "Prove who changed what and when", "actor": "Security and Compliance Reviewer", "keyFacts": ["Auditors query the audit table in the customer database; no third party holds the data.", "Rollback restores the previous value while keeping the history."], "painPoints": ["Audit tables must be readable by auditors who have no Tableau access.", "Retention policies for audit logs are often undefined."], "dependencies": [{"type": "brick", "id": "wbwf", "name": "Write-back Workflow, Approvals and Audit Trail", "description": "Submission, validation, approval and rollback workflow with a per-change audit trail.", "how": "Provides the audit trail and rollback."}, {"type": "brick", "id": "sect", "name": "Security, Audit and cted edge's cases to the table."}]}, {"id": "save-and-share-the-finding", "title": "Save the view and export the finding", "actor": "Business Dashboard Viewer", "keyFacts": ["A saved view keeps the variant filter and case table for the next review.", "A PNG or PDF export of the process view goes into the operations deck."], "painPoints": ["Findings are shared as screenshots that cannot be re-created next month.", "Without an owner the bottleneck finding does not lead to action."], "dependencies": [{"type": "brick", "id": "sptb", "name": "SuperTables Interactive Grid", "description": "Excel-like grid with pivot, grouping, conditional formatting, formulas, saved views and Excel export.", "how": "Saves the personal view of the case table."}, {"type": "brick", "id": "rndr", "name": "Dashboard Rendering and Export Service", "description": "Server-side rendering of dashboards and tables to PDF, PNG, CSV and Excel.", "how": "Exports the process view and table as PNG and PDF."}]}, {"id": "hand-over-to-writeback", "title": "Record the action in a write-back task list", "actor": "Business Dashboard Viewer", "keyFacts": ["Where WriteBackExtreme is installed, the analyst records the improvement action and owner as a task next to the process view.", "Task lists and annotations are a documented WriteBackExtreme use case."], "painPoints": ["Without write-back, actions live in a separate tracker and drift from the dashboard.", "Analysts without write-back roles cannot record actions."], "dependencies": [{"type": "brick", "id": "inpt", "name": "InputTables Data Entry Grid", "description": "Excel-like cell-level data entry, comments and dynamic columns inside a SuperTable.", "how": "Captures the action, owner and due date in a data-entry grid."}, {"type": "brick", "id": "wbwf", "name": "Write-back Workflow, Approvals and Audit Trail", "description": "Submission, validation, approval and rollback workflow with a per-change audit trail.", "how": "Stores the entry with an audit trail in
