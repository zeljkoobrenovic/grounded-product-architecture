I platform for the next refresh; the vendor has no access", "systemOfRecordBrickId": "wbdb", "ownerTeamId": "write-back-and-planning", "stewardTeamIds": ["security-and-compliance"], "derivedFromAssetIds": ["write-back-schema", "dashboard-data-snapshot"], "stores": [{"storeId": "customer-target-database", "role": "system-of-record"}, {"storeId": "wbx-metadata-database", "role": "projection"}, {"storeId": "customer-data-warehouse", "role": "analytics-warehouse"}], "interfaces": [{"type": "api", "name": "write-back rest api", "description": "Authenticated REST API of the self-hosted WriteBackExtreme server for creating, updating, bulk-importing and reading write-back records per schema, used by the extension UI, by customer integrations and by the workflow engine."}, {"type": "event", "name": "write-back committed events", "description": "Record created, updated, submitted, approved and rolled-back events emitted by the write-back server to the audit trail, to notification hooks and to optional customer webhooks that trigger extract refreshes."}, {"type": "file", "name": "bulk import and export", "description": "CSV and Excel bulk import of planning data into a schema and export of a scenario for offline review, both governed by the same role model."}], "governance": {"retention": "the customer decides: typically kept for the full planning history so prior forecasts remain comparable, with rollback versions kept per the customer's audit policy; the product ships default retention settings but never deletes on its own", "residency": "customer-controlled", "sharingPolicy": "strictly internal to the customer organisation; visible only through the customer's dashboards and database grants; never transmitted to the vendor; WriteBackExtreme runs without internet access so no telemetry carries record content"}}, {"id": "write-back-schema", "name": "Write-back Schema", "kind": "master-data", "description": "The governed definition of what may be written back: for each write-back configuration the target database connection, table and column mapping, field types and validation rules, allowed values and lookup lists, required fields, default values, dynamic columns for InputTables, key dimensions that link a record to a dashboard row, the scenario and version model, locking rules per period, and the role assignments that decide who may enter, submit, approve or administer. Created by the dashboard creator or IT administrator in the WriteBackExtreme admin console and stored in the WriteBackExtreme metadata database on the customer's server; the schema is what makes write-back governed rather than a free-form spreadsheet.", "businessMeaning": "The rules of the planning process encoded once, so every entered number is validated, attributable and lands in the right place.", "status": "active", "tags": ["write-back", "governance"], "classification": "confidential", "personalDataLevel": "none", "dataSubjects": [], "legalTags": [], "securityCriticality": "high", "accessScope": "write-back administrators and dashboard creators of the customer organisation; database connection secrets stored encrypted on the customer server and visible to IT administrators only", "systemOfRecordBrickId": "wbdb", "ownerTeamId": "write-back-and-planning", "stewardTeamIds": ["deployment-and-licensing"], "derivedFromAssetIds": [], "stores": [{"storeId": "wbx-metadata-database", "role": "system-of-record"}, {"storeId": "customer-target-database", "role": "projection"}], "interfaces": [{"type": "api", "name": "write-back schema admin api", "description": "Admin API and console for defining schemas, connections, validation rules, dynamic columns, roles and period locks, and for generating or migrating the target tables in the customer database."}, {"type": "file", "name": "schema export and import", "description": "JSON export of a schema for promotion from test to production servers and for version control by the customer's IT team."}], "governance": {"retention": "kept t", "description": "Excel, PDF and VizSlides export of the rendered statement with formatting preserved, produced by the rendering service."}], "governance": {"retention": "kept with the workbook and versioned with the extension configuration; the customer keeps historical models to reproduce past statements; the vendor keeps no copy", "residency": "customer-controlled", "sharingPolicy": "internal to the customer organisation; rendered statements distributed under the customer's report distribution rules; never shared with the vendor"}}, {"id": "report-schedule", "name": "Report Schedule", "kind": "master-data", "description": "A MailScheduler (mlsc) distribution definition: the workbook and views to render, output formats (PDF, PNG, CSV, Excel), page and layout options, the recipient list with per-recipient filter values and parameters so each person receives only their region, cost centre or customer set, subject and body templates with placeholders, the delivery channel (email, Microsoft Teams, Slack, network drive, REST callback), the cron-style timing or data-driven trigger (send when a threshold is crossed or an extract refreshes), owner, approval state and enabled flag. Recipient lists contain names, email addresses and Teams or Slack identities of executives and external stakeholders who may not have a Tableau licence. Stored in the MailScheduler server database on the customer's infrastructure.", "businessMeaning": "The promise that the right report reaches the right person at the right time without anyone logging in to the BI platform.", "status": "active", "tags": ["distribution", "reporting"], "classification": "confidential", "personalDataLevel": "personal", "dataSubjects": ["customer-user", "customer"], "legalTags": ["gdpr"], "securityCriticality": "high", "accessScope": "report owners and BI platform administrators of the customer organisation; recipients see only their own deliveries; the vendor has no access", "systemOfRecordBrickId": "mlsc", "ownerTeamId": "distribution-and-adoption", "stewardTeamIds": ["deployment-and-licensing"], "derivedFromAssetIds": [], "stores": [{"storeId": "mailscheduler-server-database", "role": "system-of-record"}], "interfaces": [{"type": "api", "name": "mailscheduler rest api", "description": "Authenticated REST API of the self-hosted MailScheduler server to create, update, enable, run and list schedules and recipient lists, used by the admin UI and by customer automation that maintains recipient lists from HR or CRM systems."}, {"type": "file", "name": "recipient list import", "description": "CSV import of recipients with per-recipient filter values, and a data-driven mode that reads the recipient list from a worksheet at run time."}], "governance": {"retention": "kept while the schedule is active; disabled schedules and their recipient lists removed by the customer per its own policy; recipients removed on request of the customer's privacy officer", "residency": "customer-controlled", "sharingPolicy": "internal to the customer organisation; recipient identities passed only to the customer's own mail server, Teams or Slack tenant; never transmitted to the vendor"}}, {"id": "report-delivery-log", "name": "Report Delivery Log", "kind": "event", "description": "One entry per attempted delivery of a scheduled report by the Messaging Delivery Gateway (msgd): schedule id, run id, recipient, channel, applied filter values, rendered artifact reference, render duration, delivery timestamp, provider response (accepted, bounced, rejected by Teams or Slack, file-share write failed), retry count and final status, plus schedule-level run summaries and administrator actions on schedules. It is the audit trail MailScheduler advertises: it proves which numbers went to whom and when, drives the on-time delivery and report open metrics, and feeds alerting when a delivery fails. Stored in the MailScheduler server database on the customer's infrastructure.", "businessMeaning": "Evidence of delivery for executives and auditors, and the operational signal that keeps report distribution reliable.", "status": "active", "tags": ["distribution", "audit"], "classification": "confidential", "personalDataLevel": "personal", "dataSubjects": ["customer-user", "customer"], "legalTags": ["gdpr"], "securityCriticality": "high", "accessScope": "report owners and BI platform administrators of the customer organisation; read-only; the vendor has no access", "systemOfRecordBrickId": "msgd", "ownerTeamId": "distribution-and-adoption", "stewardTeamIds": ["security-and-compliance"], "derivedFromAssetIds": ["report-schedule", "rendered-report-artifact"], "stores": [{"storeId": "mailscheduler-server-database", "role": "system-of-record"}, {"storeId": "customer-data-warehouse", "role": "archive"}], "interfaces": [{"type": "api", "name": "delivery log api", "description": "Query interface for run history, per-recipient delivery status and failure reasons, used by the MailScheduler admin console and by customer monitoring."}, {"type": "event", "name": "delivery status events", "description": "Delivered, bounced and failed events raised per recipient, used for retries, administrator alerts and optional forwarding to the customer's monitoring stack."}], "governance": {"retention": "kept for the audit window the customer configures (default 12 months of delivery history), then purged by the MailScheduler server; artifact references outlive the artifacts they point to", "residency": "customer-controlled", "sharingPolicy": "internal to the customer organisation; never transmitted to the vendor; anonymised counts may be shared by the customer in success reviews"}}, {"id": "rendered-report-artifact", "name": "Rendered Report Artifact", "kind": "document", "description": "A file produced by the Dashboard Rendering and Export Service (rndr) from a dashboard or extension: the PDF, PNG, CSV or Excel output of a MailScheduler run filtered for one recipient, the Excel export a viewer triggers from SuperTables, the PowerPoint deck VizSlides (vzsl) generates, or a FinanceTables statement export, with metadata about source workbook, filters, format, size, generating user or schedule and creation time. The content is a frozen copy of whatever the dashboard showed, so it inherits the sensitivity of the dashboard data. Rendered on the customer's extension or MailScheduler server, placed on the customer's network drive or attached to a message, and cached briefly for retries; the vendor stores none of it.", "businessMeaning": "The numbers taken out of the dashboard into an inbox, a meeting or a slide: the format executives and Excel-minded users actually consume.", "status": "active", "tags": ["distribution", "export"], "classification": "restricted", "personalDataLevel": "personal", "dataSubjects": ["customer-user", "customer"], "legalTags": ["gdpr"], "securityCriticality": "high", "accessScope": "the addressed recipient or the exporting user; administrators of the customer's file share; the vendor has no access", "systemOfRecordBrickId": "rndr", "ownerTeamId": "distribution-and-adoption", "stewardTeamIds": ["visual-storytelling"], "derivedFromAssetIds": ["dashboard-data-snapshot", "report-schedule"], "stores": [{"storeId": "customer-network-file-share", "role": "system-of-record"}, {"storeId": "enterprise-extension-server-storage", "role": "serving"}], "interfaces": [{"type": "api", "name": "render and export api", "description": "Internal rendering interface that takes a workbook, view, filter set and format and returns a PDF, PNG, CSV, Excel or PowerPoint file, used by MailScheduler, SuperTables export, VizSlides and FinanceTables."}, {"type": "file", "name": "delivered report files", "description": "The files written to network drives, attached to emails or posted to Teams and Slack, named and foldered by placeholder rules in the schedule."}], "governance": {"retention": "temporary render cache purged within 24 hours on the customer's server; delivered files live under the customer's file-share and mailbox retention; the vendor keeps nothing", "residency": "customer-controlled", "sharingPolicy": "shared with the addressed recipients only; onward sharing governed by the customer's information classification; never transmitted to the vendor"}}, {"id": "dashboard-usage-event", "name": "Dashboard Usage Event", "kind": "event", "description": "A telemetry event recorded by DashboardUsage Analytics (dbus) and the shared framework when someone interacts with a dashboard extension: dashboard and extension instance, event type (view opened, filter applied, pivot changed, drill-down, export, saved view applied, guide step completed, write-back submitted), timestamp, session id and the same anonymous unique user token the license service uses, plus coarse client context (browser, BI platform and version). It contains no names, no email addresses and no dashboard data values. In Enterprise deployments the events are written to the customer's extension server database or data warehouse for the BI platform lead's adoption dashboards; in SaaS they are written to the vendor's EU extension-state database, aggregated into adoption analytics per customer in the product analytics warehouse, and shown back to the customer as adoption evidence.", "businessMeaning": "The evidence BI platform leads use to justify the renewal and dashboard creators use to prove a dashboard is used: monthly active users, adoption rate and self-service answer rate come from here.", "status": "active", "tags": ["adoption", "analytics"], "classification": "internal", "personalDataLevel": "none", "dataSubjects": ["customer-user"], "legalTags": ["dpa"], "securityCriticality": "medium", "accessScope": "BI platform leads and dashboard creators of the customer organisation for their own tenant's events; the vendor's product and customer-success teams for SaaS tenants in aggregated form", "systemOfRecordBrickId": "dbus", "ownerTeamId": "distribution-and-adoption", "stewardTeamIds": ["extension-runtime", "support-and-enablement"], "derivedFromAssetIds": ["extension-configuration", "usage-token-record"], "stores": [{"storeId": "saas-extension-state-database", "role": "system-of-record"}, {"storeId": "customer-data-warehouse", "role": "system-of-record"}, {"storeId": "product-analytics-warehouse", "role": "analytics-warehouse"}], "interfaces": [{"type": "event", "name": "usage event stream", "description": "Batched, anonymised interaction events emitted by the framework from the browser to the customer's extension server (Enterprise) or the vendor's SaaS collector; opt-out per tenant."}, {"type": "api", "name": "adoption analytics api", "description": "Aggregated adoption metrics per dashboard, extension and period (active users, sessions, feature usage, guide completion) served to the DashboardUsage dashboard and to the customer-success account-health view."}], "governance": {"retention": "raw events kept 13 months so rolling 12-month active-user views are complete, then reduced to monthly aggregates; customer-hosted copies follow the customer's own policy; SaaS raw events deleted on tenant off-boarding", "residency": "customer-controlled-or-eu", "sharingPolicy": "each customer sees only its own tenant's events and aggregates; the vendor uses SaaS aggregates for product analytics and account health under the data processing agreement; never shared between customers; never contains dashboard data values"}}, {"id": "dashboard-guide-content", "name": "Dashboard Guide Content", "kind": "document", "description": "The authored onboarding content DashboardGuide (dbgd) overlays on a dashboard: ordered steps with anchored highlights, titles and explanatory text, images, video links, callouts and tooltips, triggers (first visit, on demand, after a filter change), audience targeting per Tableau group, language variants and completion tracking settings. Authored by the dashboard creator, stored with the extension configuration in the workbook and, for shared step libraries and media, in the SaaS extension-state database or the customer's extension server. The content itself is business documentation rather than data, but completion events feed dashboard usage analytics.", "businessMeaning": "The guidance that turns a published dashboard into one people actually understand and use, without a training session for every release.", "status": "active", "tags": ["adoption", "onboarding"], "classification": "internal", "personalDataLevel": "none", "dataSubjects": [], "legalTags": [], "securityCriticality": "medium", "accessScope": "dashboard creators of the customer organisation for authoring; every viewer of the dashboard for display; the vendor's SaaS hosting sees the content only as an opaque stored blob", "systemOfRecordBrickId": "dbgd", "ownerTeamId": "distribution-and-adoption", "stewardTeamIds": ["extension-runtime"], "derivedFromAssetIds": ["extension-configuration"], "stores": [{"storeId": "tableau-workbook-store", "role": "system-of-record"}, {"storeId": "saas-extension-state-database", "role": "projection"}, {"storeId": "enterprise-extension-server-storage", "role": "projection"}], "interfaces": [{"type": "api", "name": "guide content api", "description": "Authoring and playback interface for guide steps, media references, audience targeting and completion state, backed by the framework settings API and the extension-state service."}, {"type": "file", "name": "guide template export", "description": "JSON export and import of guides for reuse across workbooks and for the vendor's gallery of guide templates."}], "governance": {"retention": "lives with the workbook; shared libraries kept while the tenant is active and deleted on off-boarding; the customer keeps its own copies in Enterprise deployments", "residency": "customer-controlled-or-eu", "sharingPolicy": "internal to the customer organisation; customers may voluntarily contribute anonymised guide templates to the vendor gallery; never shared between customers otherwise"}}, {"id": "ai-request-log", "name": "AI Request Log", "kind": "event", "description": "The record of each call to the AI Insight and Generative Fill Services (aiin): which extension and feature asked (generative fill in SuperTables, narrative insight in PowerKPIs, AI-assisted configuration, write-back validation suggestion), the anonymous user token, timestamp, model and provider used, token counts, latency, the prompt template version, whether the user accepted or rejected the suggestion, and safety and error outcomes. Prompt and response bodies contain excerpts of the dashboard data snapshot, so by default only metadata is logged; content is retained for a short debugging window only with explicit tenant opt-in. In Enterprise deployments the log stays on the customer's server and the customer chooses the model endpoint (their own Azure OpenAI or a private model); in SaaS the vendor's AI gateway logs metadata in the EU and forwards content to the model provider under a no-retention, no-training contract.", "businessMeaning": "The audit and quality signal for AI features: what the AI was asked, whether users trusted it, and what it cost, without turning customer data into a training set.", "status": "active", "tags": ["ai", "audit"], "classification": "restricted", "personalDataLevel": "sensitive", "dataSubjects": ["customer-user", "customer"], "legalTags": ["gdpr", "dpa"], "securityCriticality": "high", "accessScope": "the customer's AI and security administrators for their tenant; the vendor's AI enablement team sees metadata only for SaaS tenants; content logs visible only during an opted-in debugging window", "systemOfRecordBrickId": "aiin", "ownerTeamId": "ai-enablement", "stewardTeamIds": ["security-and-compliance", "extension-runtime"], "derivedFromAssetIds": ["dashboard-data-snapshot"], "stores": [{"storeId": "ai-gateway-log-store", "role": "system-of-record"}, {"storeId": "enterprise-extension-server-storage", "role": "system-of-record"}, {"storeId": "product-analytics-warehouse", "role": "analytics-warehouse"}], "interfaces": [{"type": "api", "name": "ai gateway api", "description": "Internal gateway through which extensions request completions, insights and fills; enforces tenant model settings, prompt templates, data-minimisation rules and logging policy, and records the request metadata."}, {"type": "event", "name": "ai suggestion feedback events", "description": "Accepted, edited and rejected events for AI suggestions, used to measure feature quality and to tune prompt templates without storing content."}], "governance": {"retention": "metadata kept 12 months for cost, quality and audit purposes; prompt and response content, when opted in, kept a maximum of 30 days; model providers contractually retain nothing; customer-hosted logs follow the customer's policy", "residency": "customer-controlled-or-eu", "sharingPolicy": "request content shared only with the model provider chosen by the tenant under a no-retention, no-training agreement; metadata aggregated per tenant for the vendor's product analytics; never shared between customers"}}, {"id": "license-entitlement", "name": "License Entitlement", "kind": "master-data", "description": "What a customer organisation is allowed to run: the plan (Free 1 to 5 users, Professional up to 100 users, Enterprise unlimited; student licences), the products and extensions covered (WriteBackExtreme and MailScheduler are Enterprise-only), the deployment model (SaaS or on-premises), the number of licensed active users, the contract term and renewal date, the licence keys issued for self-hosted servers with their bound host fingerprints, trial status and expiry (30-day WriteBackExtreme trial), the supported Tableau licence type (OEM, Core, Enterprise), feature flags, SLA tier and the current active-user count computed from usage token records against the plan limit. Maintained by the License Service, Usage Metering and Billing (lics) and surfaced to customers in the Enterprise Customer Portal (eprt); the extensions check it at load time (online for SaaS, via the local licence key for Enterprise).", "businessMeaning": "The commercial contract in machine-readable form: it decides what runs, what is over the seat limit, and what is up for renewal.", "status": "active", "tags": ["licensing", "commercial"], "classification": "confidential", "personalDataLevel": "none", "dataSubjects": ["customer"], "legalTags": [], "securityCriticality": "critical", "accessScope": "the vendor's licensing, sales and customer-success staff; the customer's BI platform lead and IT administrator for their own organisation through the portal; partners for the accounts they registered", "systemOfRecordBrickId": "lics", "ownerTeamId": "deployment-and-licensing", "stewardTeamIds": ["growth-and-partners", "support-and-enablement"], "derivedFromAssetIds": ["usage-token-record", "subscription-and-invoice"], "stores": [{"storeId": "license-service-database", "role": "system-of-record"}, {"storeId": "customer-portal-database", "role": "projection"}, {"storeId": "extensionsmanager-local-config", "role": "projection"}, {"storeId": "product-analytics-warehouse", "role": "analytics-warehouse"}], "interfaces": [{"type": "api", "name": "license validation api", "description": "Called by SaaS-hosted extensions at load time and by ExtensionsManager during activation to validate the entitlement, return feature flags and report the active-user count; Enterprise servers validate a signed licence key offline."}, {"type": "api", "name": "entitlement management api", "description": "Back-office and portal interface for creating plans, issuing and revoking licence keys, extending trials and adjusting seat limits."}, {"type": "event", "name": "entitlement change events", "description": "Plan upgraded, seat limit approached or exceeded, trial expiring, renewal due and key revoked events consumed by billing, customer success and the customer portal."}], "governance": {"retention": "kept for the contract lifetime plus 7 years as part of the vendor's commercial and fiscal records; expired trial entitlements without conversion deleted after 24 months", "residency": "eu", "sharingPolicy": "visible to the customer organisation for its own entitlement and to the registering partner; never shared with other customers; seat counts derived from anonymous tokens only, never per-person lists"}}, {"id": "usage-token-record", "name": "Usage Token Record", "kind": "operational-state", "description": "The anonymous unique token that represents one person interacting with a published dashboard that contains an extension, whether creator, explorer or viewer: a random identifier generated by the extension framework in the user's browser, the customer tenant it belongs to, the first-seen and last-seen timestamps, the extensions and BI platforms it was seen on, and monthly activity flags. No name, email, IP address or Tableau username is stored, which is what lets the vendor meter active users for pricing without processing personal data. A token inactive for 12 months drops out of the rolling 12-month active-user count and is purged. Enterprise servers compute the count locally and report only the aggregate through ExtensionsManager (or by the customer's own declaration when the deployment has no internet access).", "businessMeaning": "The pricing meter: seats are counted as anonymous active people over a rolling year, which is both the revenue basis and a privacy design choice.", "status": "active", "tags": ["licensing", "metering"], "classification": "internal", "personalDataLevel": "none", "dataSubjects": ["customer-user"], "legalTags": ["dpa"], "securityCriticality": "high", "accessScope": "the license service itself; aggregated counts to the vendor's licensing and customer-success staff and to the customer's BI platform lead; individual tokens are never exposed in any UI", "systemOfRecordBrickId": "lics", "ownerTeamId": "deployment-and-licensing", "stewardTeamIds": ["extension-runtime", "security-and-compliance"], "derivedFromAssetIds": [], "stores": [{"storeId": "license-service-database", "role": "system-of-record"}, {"storeId": "usage-metering-event-stream", "role": "event-source"}, {"storeId": "extensionsmanager-local-config", "role": "projection"}, {"storeId": "product-analytics-warehouse", "role": "analytics-warehouse"}], "interfaces": [{"type": "event", "name": "usage heartbeat", "description": "Lightweight, batched heartbeat sent by the framework containing the token, tenant and extension id; Enterprise servers collect it locally and forward only the aggregate active-user count."}, {"type": "api", "name": "active-user count api", "description": "Returns the rolling 12-month active-user count per tenant, per extension and per month for the license entitlement, the customer portal and adoption analytics."}], "governance": {"retention": "a token is deleted after 12 months without activity; monthly aggregate counts kept 7 years as the basis for invoiced seats", "residency": "customer-controlled-or-eu", "sharingPolicy": "aggregates shared with the customer organisation and, for partner-managed accounts, with the partner; raw tokens never shared or exported; never joined with named accounts or support tickets"}}, {"id": "subscription-and-invoice", "name": "Subscription and Invoice", "kind": "financial-record", "description": "The commercial record behind an entitlement: the subscription with plan, term, price, currency, billing frequency (annual for Professional; annual or multi-year for Enterprise), payment method (card for Professional; bank transfer and purchase orders for Enterprise), partner attribution and margin split, discount and student-licence flags, the purchase order reference and vendor onboarding data supplied by the customer's procurement, the issued invoices and credit notes with VAT treatment, payment status and dunning state, and the renewal quote. Created through the website checkout (webt) or the sales team, maintained by the License Service, Usage Metering and Billing (lics) and mirrored to the vendor's CRM and invoicing system.", "businessMeaning": "Recurring subscription revenue per organisation and the paper trail procurement and finance on both sides need.", "status": "active", "tags": ["commercial", "finance"], "classification": "confidential", "personalDataLevel": "personal", "dataSubjects": ["customer", "partner"], "legalTags": ["gdpr", "fiscal-retention-nl"], "securityCriticality": "high", "accessScope": "the vendor's finance, sales and customer-success staff; the customer's procurement and BI platform lead through the portal for their own invoices; partners for deals they registered; card data held only by the payment provider", "systemOfRecordBrickId": "lics", "ownerTeamId": "deployment-and-licensing", "stewardTeamIds": ["growth-and-partners"], "derivedFromAssetIds": ["license-entitlement", "customer-account"], "stores": [{"storeId": "license-service-database", "role": "system-of-record"}, {"storeId": "crm-and-invoicing-saas", "role": "projection"}, {"storeId": "customer-portal-database", "role": "projection"}], "interfaces": [{"type": "api", "name": "subscription and billing api", "description": "Checkout, plan change, renewal-quote and invoice retrieval interface used by the website, the customer portal and the sales back office; payment tokens handled by the payment provider."}, {"type": "file", "name": "invoice and purchase-order documents", "description": "PDF invoices, credit notes and received purchase orders exchanged with customer procurement and stored with the invoicing system."}, {"type": "event", "name": "billing events", "description": "Subscription created, renewed, upgraded, cancelled, invoice issued and payment received events consumed by the license service, CRM and customer success."}], "governance": {"retention": "7 years after the fiscal year of the invoice under Dutch fiscal retention; invoices immutable once issued, corrections only by credit note; contact persons removed from closed accounts after the retention period", "residency": "eu", "sharingPolicy": "shared with the invoiced customer, the registering partner for its own deals, the vendor's accountant and payment provider; never shared between customers"}}, {"id": "customer-account", "name": "Customer Account", "kind": "master-data", "description": "A customer organisation and its named contacts in the Enterprise Customer Portal (eprt) and the vendor's CRM: company name, industry, country and region, BI platforms in use, plan and deployment model, the named users of the portal (BI platform leads, IT administrators, procurement and security contacts) with email addresses, portal roles and login credentials, the assigned customer success manager and partner, notification preferences, the licence keys and downloads the account may access, and the account-health indicators customer success derives from active-user trends, ticket volume and renewal proximity. Free-plan and trial signups from the website (webt) start here; Enterprise accounts are enriched by sales and the partner network.", "businessMeaning": "Who the customer is and who at the customer the vendor talks to: the anchor for licences, invoices, support and renewals.", "status": "active", "tags": ["accounts", "customer-success"], "classification": "confidential", "personalDataLevel": "personal", "dataSubjects": ["customer", "partner"], "legalTags": ["gdpr"], "securityCriticality": "high", "accessScope": "the vendor's sales, customer-success, support and licensing staff; each customer's own portal users for their organisation; partners for the accounts they manage; credentials stored hashed and never visible", "systemOfRecordBrickId": "eprt", "ownerTeamId": "deployment-and-licensing", "stewardTeamIds": ["support-and-enablement", "growth-and-partners"], "derivedFromAssetIds": [], "stores": [{"storeId": "customer-portal-database", "role": "system-of-record"}, {"storeId": "crm-and-invoicing-saas", "role": "projection"}, {"storeId": "helpdesk-saas", "role": "projection"}, {"storeId": "product-analytics-warehouse", "role": "analytics-warehouse"}], "interfaces": [{"type": "api", "name": "customer account api", "description": "Portal and back-office interface for organisation and user management, self-service signup, invitation of colleagues, role assignment and access to licence keys and downloads."}, {"type": "event", "name": "account lifecycle events", "description": "Signed up, trial started, converted, user added or removed, churned and health-score changed events consumed by CRM, customer success and the license service."}], "governance": {"retention": "kept while the organisation holds a licence and 7 years after the last invoice as part of commercial records; free-plan accounts inactive for 24 months deleted after notice; portal users removed 90 days after deactivation; erasure requests honoured except for data locked by fiscal retention", "residency": "eu", "sharingPolicy": "internal to the vendor; the managing partner sees its own accounts; synchronised to the CRM, invoicing and helpdesk systems under processor agreements; never sold or shared with other customers"}}, {"id": "identity-and-role", "name": "Identity and Role", "kind": "master-data", "description": "The identities and authorisations the extensions and self-hosted servers rely on: for Enterprise deployments the SSO configuration (SAML or OpenID Connect against the customer's Microsoft Entra ID, Okta, ADFS or Tableau Server identity), the mapping from identity-provider groups to write-back and MailScheduler roles (viewer, contributor, approver, administrator) managed by Identity, SSO and Role Management (idnt), service accounts and API keys for integrations, and session records; for SaaS deployments the trust in the Tableau session established through the Extensions API and the extension's own role settings. Roles decide who may enter, approve, administer or sc ve in the customer's identity provider and are never copied by the vendor", "residency": "customer-controlled", "sharingPolicy": "internal to the customer organisation; never transmitted to the vendor in Enterprise deployments; in SaaS the extension relies on the Tableau session and stores no identities"}}, {"id": "release-artifact", "name": "Release Artifact", "kind": "document", "description": "A versioned, signed deliverable the vendor publishes: the hosted extension bundle and its .trex manifest for SaaS, the Windows one-click installer and Linux packages for WriteBackExtreme, MailScheduler and ExtensionsManager, Docker images, the Power BI custom-visual package listed on Microsoft AppSource and the Looker Studio community-visual manifest, release notes and changelogs, compatibility matrix per Tableau, Power BI and Looker Studio version, Tableau safelisting metadata and Exchange listing content, checksums and code-signing certificates, demo workbooks and gallery templates (gall) and the documentation set (docs) that accompanies each release. Produced by the SaaS Hosting and Release Pipeline (saas), downloaded by IT administrators through the Enterprise Customer Portal and pulled by ExtensionsManager during upgrades.", "businessMeaning": "The product as shipped: what customers install, what Tableau safelists, and the version every workbook must eventually point at.", "status": "active", "tags": ["deployment", "release"], "classification": "internal", "personalDataLevel": "none", "dataSubjects": [], "legalTags": [], "securityCriticality": "high", "accessScope": "the vendor's engineering and release staff for publishing; licensed customers and partners for download through the portal; SaaS bundles served publicly to safelisted Tableau sites; installers signed so integrity can be verified offline", "systemOfRecordBrickId": "saas", "ownerTeamId": "deployment-and-licensing", "stewardTeamIds": ["extension-runtime", "support-and-enablement", "growth-and-partners"], "der                 ...Object.keys(layers).filter(layerId => !moduleLayerOrder.includes(layerId)).map(layerId => ({ layer: layerId, ...layers[layerId] }))
            ];
        }

        function layeredModulesOf(brick) {
            return layerItemsOf(brick).flatMap(layer => normalizeLayerModules(layer.layer, layer));
        }

        function moduleByIdForBrick(brick, moduleId) {
            if (!moduleId) {
                return null;
            }
            return layeredModulesOf(brick || {}).find(module => module.id === moduleId) || null;
        }

        function moduleNameForBrick(brick, moduleId) {
            const moduleInfo = moduleByIdForBrick(brick, moduleId);
            if (!moduleInfo) {
                return moduleId || '';
            }
            return moduleInfo.displayName || moduleInfo.name || moduleInfo.id || moduleId;
        }

        function brickDependencyEdgeLabel(sourceBrick, targetBrick, dependency) {
            const dependencyType = dependency.type || 'unspecified';
            const sourceModule = moduleNameForBrick(sourceBrick, dependency.sourceModuleId);
            const targetModule = moduleNameForBrick(targetBrick, dependency.moduleId);
            const modulePath = [sourceModule, targetModule].filter(Boolean).join(' -> ');
            return [dependencyType, modulePath].filter(Boolean).join(' / ');
        }

        function dataDependencyModuleNames(brick, dependency) {
            const moduleIds = Array.isArray(dependency.moduleIds) ? dependency.moduleIds : (dependency.moduleIds ? [dependency.moduleIds] : []);
            return moduleIds.map(moduleId => moduleNameForBrick(brick, moduleId)).filter(Boolean).join(', ');
        }

        function shouldShowBrickStructure() {
            const toggle = document.getElementById('brickStructureToggle');
            return !toggle || toggle.checked;
        }

        function shouldShowBrickStatus() {
            const toggle = document.getElementById('brickStatusToggle');
            return Boolean(toggle && toggle.checked);
        }

        function getBrickStatusOptions() {
            const counts = {};
            getBrickCatalog().forEach(brick => {
                const statusId = normalizeStatus(brick.status) || 'unspecified';
                counts[statusId] = (counts[statusId] || 0) + 1;
            });
            const options = brickStatuses.map(status => {
                const statusId = normalizeStatus(status.id || status.name);
                return {
                    id: statusId,
                    name: status.name || status.id || statusId,
                    color: status.color || '#6b7280',
                    count: counts[statusId] || 0
                };
            });
            Object.keys(counts).forEach(statusId => {
                if (!options.some(option => option.id === statusId)) {
                    const status = statusDefinitionOf(statusId);
                    options.push({
                        id: statusId,
                        name: status.name || statusId,
                        color: status.color || '#6b7280',
                        count: counts[statusId] || 0
                    });
                }
            });
            return options;
        }

        function ensureBrickStatusControls() {
            const container = document.getElementById('BrickStatusFilters');
            if (!container || brickStatusControlsInitialized) {
                return;
            }
            const options = getBrickStatusOptions();
            if (!options.length) {
                container.style.display = 'none';
                brickStatusControlsInitialized = true;
                return;
            }
            container.innerHTML = options.map(status => {
                const id = 'brickStatusFilter_' + status.id;
                return `
                    <label class="bricks-toggle bricks-status-filter" for="${escapeHtml(id)}">
                        <input type="checkbox" class="brick-status-filter-input" id="${escapeHtml(id)}" value="${escapeHtml(status.id)}" checked onchange="updateBricksView()">
                        <span class="status-swatch" style="background-color: ${escapeHtml(status.color)}"></span>
                        <span>${escapeHtml(status.name)} (${status.count})</span>
                    </label>
                `;
            }).join('');
            brickStatusControlsInitialized = true;
        }

        function selectedBrickStatuses() {
            const checkboxes = Array.from(document.querySelectorAll('.brick-status-filter-input'));
            if (!checkboxes.length) {
                return new Set(getBrickStatusOptions().map(status => status.id));
            }
            return new Set(checkboxes.filter(input => input.checked).map(input => normalizeStatus(input.value)));
        }

        function brickSearchQuery() {
            const input = document.getElementById('BrickSearch');
            return input ? input.value.trim().toLowerCase() : '';
        }

        function brickMatchesSearch(item, query) {
            if (!query) return true;
            const haystack = [item.id, item.name, item.description, item.type, item.status]
                .filter(Boolean).join(' ').toLowerCase();
            return haystack.includes(query);
        }

        function shouldRenderBrick(item) {
            return selectedBrickStatuses().has(normalizeStatus(item.status) || 'unspecified')
                && brickMatchesSearch(item, brickSearchQuery());
        }

        function statusBorderStyle(item) {
            if (!shouldShowBrickStatus()) {
                return '';
            }
            return `border-color: ${statusColorOf(item.status)}; border-width: 3px;`;
        }

        function renderBrick(item) {
            const structureCards = layeredModulesOf(item);
            const structureMarkup = shouldShowBrickStructure() && structureCards.length
                ? `<div class="brick-structure-list">${structureCards.map(structure => `
                    <div class="brick-structure-card ${escapeHtml(moduleLayerClass(structure.layerId))}" style="" title="${escapeHtml(structure.layerLabel + ': ' + structure.displayName)}">
                        <div class="structure-card-type">${escapeHtml(structure.type || structure.layerLabel)}</div>
                        <div>${escapeHtml(structure.displayName)}</div>
                    </div>
                `).join('')}</div>`
                : '';
            const brickCard = `
                <div class="brick-card${item.isHighlighted ? ' highlighted' : ''}" style="background-color: ${item.color}; ${statusBorderStyle(item)}">
                    <div class="brick-card-main">
                        <img class="brick-icon" src="icons/${item.id}.png" alt="" onerror="this.onerror=null;this.src='icons/brick.png'">
                        <div class="brick-name">
                            <div class="brick-name-title">${item.name || ''}</div>
                        </div>
                    </div>
                    ${structureMarkup}
                </div>
            `;

            if (!item.id) {
                return brickCard;
            }

            return `<a target="_blank" href="landing_pages/${item.id}.html">${brickCard}</a>`;
        }

        function renderGroup(group) {
            const renderedSubGroups = (group.subGroups || []).map(renderGroup).join('');
            const renderedBricks = (group.bricks || []).map(renderBrick).join('');
            return `
                <div class="group">
                    <div class="group-title">${group.name}</div>
                    <div class="group-items">${renderedSubGroups}${renderedBricks}</div>
                </div>
            `;
        }

        function renderDomain(domain) {
            return `
                <section class="domain-column">
                    <div class="domain-title">${domain.name}</div>
                    <div class="domain-groups">${(domain.subGroups || []).map(renderGroup).join('')}${(domain.bricks || []).map(renderBrick).join('')}</div>
                </section>
            `;
        }

        function buildGroupRowLookup() {
            const lookup = {};
            ((brickRendering.rows) || []).forEach(rowInfo => {
                const row = Number(rowInfo.row) || 1;
                (rowInfo.rootGroupNames || rowInfo.groupNames || rowInfo.brickIds || []).forEach(groupName => {
                    lookup[slugify(groupName)] = row;
                });
            });
            return lookup;
        }

        function applyRowsToHierarchy(items, groupRows) {
            return items.map(group => ({
                ...normalizeGroup(group),
                row: groupRows[slugify(group.name)] || Number(group.row) || 1
            }));
        }

        function filterGroupByStatus(group) {
            const subGroups = (group.subGroups || [])
                .map(filterGroupByStatus)
                .filter(Boolean);
            const bricks = (group.bricks || []).filter(shouldRenderBrick);
            if (!subGroups.length && !bricks.length) {
                return null;
            }
            return {
                ...group,
                subGroups,
                bricks
            };
        }

        function filterHierarchyForRow(items, targetRow) {
            return items.filter(group => group.row === targetRow);
        }

        function renderMap(items) {
            const groupRows = buildGroupRowLookup();
            const normalizedItems = applyRowsToHierarchy(items, groupRows)
                .map(filterGroupByStatus)
                .filter(Boolean);
            const rows = Array.from(new Set(
                Object.values(groupRows)
                    .map(value => Number(value) || 1)
                    .concat([1])
            )).sort((left, right) => left - right);

            if (!normalizedItems.length) {
                return '<div class="empty-state">No bricks match the current search and status filters.</div>';
            }

            return `
                <div class="map">
                    ${rows.map(row => {
                const rowItems = filterHierarchyForRow(normalizedItems, row);
                if (!rowItems.length) {
                    return '';
                }
                return `
                            <div class="map-row" data-row="${row}">
                                ${rowItems.map(renderDomain).join('')}
                            </div>
                        `;
            }).join('')}
                </div>
            `;
        }

        function renderLegend() {
            return `
                <div class="legend-title">Legend:</div>
                ${brickTypes.map(type => `
                    <div class="legend-item" style="background-color: ${type.color}">${type.name}</div>
                `).join('')}
            `;
        }

        function escapeMermaidLabel(value) {
            return String(value || '')
                .replaceAll('&', 'and')
                .replaceAll('"', '')
                .replaceAll("'", '')
                .replaceAll('<', '')
                .replaceAll('>', '')
                .replaceAll('[', '(')
                .replaceAll(']', ')')
                .replaceAll('{', '(')
                .replaceAll('}', ')')
                .replaceAll('|', '/');
        }

        function flattenBricks(groups, ancestors = []) {
            let leaves = [];
            (groups || []).forEach(group => {
                const nextAncestors = ancestors.concat(group);
                leaves = leaves.concat(flattenBricks(group.subGroups || [], nextAncestors));
                const domain = nextAncestors[0] ? nextAncestors[0].name : '';
                const groupName = nextAncestors.length ? nextAncestors[nextAncestors.length - 1].name : '';
                (group.bricks || []).forEach(item => {
                    leaves.push({
                        ...item,
                        domain: domain,
                        group: groupName
                    });
                });
            });
            return leaves;
        }

        function getBrickCatalog() {
            return flattenBricks(rootGroups);
        }

        function getStreamCatalogItems() {
            const fallbackStreams = getBrickCatalog().map(item => ({
                ...item,
                sourceType: 'brick-fallback'
            }));

            return explicitStreams.length ? explicitStreams : fallbackStreams;
        }

        function normalizeStreamGroups(groups) {
            return (groups || []).map(group => ({
                ...group,
                subGroups: normalizeStreamGroups(group.subGroups || []),
                streams: (group.streams || []).map(item => ({
                    ...item,
                    group: item.group || group.name,
                    rootGroup: item.rootGroup || ''
                }))
            }));
        }

        function buildBrickLookup() {
            const lookup = {};
            getBrickCatalog().forEach(item => {
                lookup[item.id] = item;
            });
            return lookup;
        }

        function streamAreaOf(stream, brickLookup) {
            if (stream.group) {
                return stream.group;
            }
            const groups = {};
            (stream.brickDependencies || []).forEach(dep => {
                const brick = brickLookup[dep.targetBrickId] || {};
                const area = brick.group || brick.domain || 'General';
                groups[area] = (groups[area] || 0) + 1;
            });
            const ranked = Object.entries(groups).sort((left, right) => {
                if (right[1] !== left[1]) {
                    return right[1] - left[1];
                }
                return left[0].localeCompare(right[0]);
            });
            return ranked.length ? ranked[0][0] : 'General';
        }

        function renderStreamPills(stream, brickLookup) {
            const brickPills = (stream.brickDependencies || []).map(dep => {
                if (!dep.targetBrickId) {
                    return '';
                }
                const brick = brickLookup[dep.targetBrickId] || {};
                const pillColor = colorOf(brick.type);
                return `
                    <a class="stream-pill" style="background-color: ${pillColor}; border-color: rgba(17,17,17,0.12);" target="_blank" href="landing_pages/${dep.targetBrickId}.html" title="${dep.description || ''}">
                        <img src="icons/${dep.targetBrickId}.png" alt="" onerror="this.onerror=null;this.src='icons/brick.png'">
                        <span>${brick.name || dep.targetBrickId}</span>
                    </a>
                `;
            }).filter(Boolean).join('');

            return `
                <div class="stream-pills">${brickPills || ''}</div>
            `;
        }

        function renderStreamsView() {
            const container = document.getElementById('StreamsContent');
            if (!container) {
                return;
            }
            const descriptionToggle = document.getElementById('streamDescriptionToggle');
            const showDescriptions = Boolean(descriptionToggle && descriptionToggle.checked);

            const streams = getStreamCatalogItems();
            const brickLookup = buildBrickLookup();
            const grouped = {};
            streams.forEach(stream => {
                const area = streamAreaOf(stream, brickLookup);
                if (!grouped[area]) {
                    grouped[area] = [];
                }
                grouped[area].push(stream);
            });

            function summarizeStreamStory(stream) {
                const firstFlow = (stream.flows || [])[0] || {};
                const firstStep = (firstFlow.steps || [])[0] || {};
                const actor = firstFlow.primaryActor || firstStep.actor || '';
                const trigger = firstFlow.trigger || firstStep.trigger || '';
                return {actor, trigger};
            }

            function renderStreamCard(stream) {
                const story = summarizeStreamStory(stream);
                return `
                    <div class="stream-card" id="stream-${stream.id}">
                        <div class="stream-card-header">
                            <img class="stream-card-icon" src="icons/${stream.icon || 'stream.png'}" alt="" onerror="this.onerror=null;this.src='icons/stream.png'">
                            <div class="stream-card-title"><a target="_blank" href="stream_pages/${stream.id}.html">${stream.name || stream.id}</a></div>
                        </div>
                        ${showDescriptions && stream.description ? `<div class="stream-card-copy">${stream.description}</div>` : ''}
                        ${story.actor ? `<div class="stream-card-copy"><strong>Actor:</strong> ${story.actor}</div>` : ''}
                        ${story.trigger ? `<div class="stream-card-copy"><strong>Trigger:</strong> ${story.trigger}</div>` : ''}
                        ${renderStreamPills(stream, brickLookup)}
                    </div>
                `;
            }

            function renderStreamGroup(group, depth = 0) {
                const childGroups = (group.subGroups || []).map(item => renderStreamGroup(item, depth + 1)).join('');
                const cards = (group.streams || []).map(renderStreamCard).join('');
                const titleClass = depth === 0 ? 'stream-area-title' : 'stream-group-title';
                return `
                    <div class="stream-area stream-depth-${depth}">
                        <div class="${titleClass}">${group.name}</div>
                        ${showDescriptions && group.description ? `<div class="stream-group-copy">${group.description}</div>` : ''}
                        ${childGroups}
                        ${cards ? `<div class="stream-grid">${cards}</div>` : ''}
                    </div>
                `;
            }

            function buildBrickUsage() {
                const usage = {};
                streams.forEach(stream => {
                    (stream.brickDependencies || []).forEach(dep => {
                        if (!dep.targetBrickId) {
                            return;
                        }
                        if (!usage[dep.targetBrickId]) {
                            usage[dep.targetBrickId] = [];
                        }
                        usage[dep.targetBrickId].push(stream);
                    });
                });
                return usage;
            }

            function renderBrickAuditItem(brick, linkedStreams) {
                const pillColor = colorOf(brick.type);
                const meta = linkedStreams.length
                    ? linkedStreams.map(item => item.name || item.id).join(', ')
                    : 'Not linked to any stream.';
                return `
                    <a class="stream-pill" style="background-color: ${pillColor}; border-color: rgba(17,17,17,0.12);" target="_blank" href="landing_pages/${brick.id}.html" title="${meta}">
                        <img src="icons/${brick.id}.png" alt="" onerror="this.onerror=null;this.src='icons/brick.png'">
                        <span>${brick.name || brick.id}</span>
                    </a>
                `;
            }

            const hierarchicalGroups = normalizeStreamGroups(streamRootGroups);
            const brickUsage = buildBrickUsage();
            const unusedBricks = getBrickCatalog().filter(brick => !brickUsage[brick.id]);
            const reusedBricks = getBrickCatalog().filter(brick => (brickUsage[brick.id] || []).length >= 2);
            container.innerHTML = `
                ${hierarchicalGroups.length
                ? hierarchicalGroups.map(group => renderStreamGroup(group)).join('')
                : Object.keys(grouped).sort((left, right) => left.localeCompare(right)).map(area => `
                        <div class="stream-area">
                            <div class="stream-area-title">${area}</div>
                            <div class="stream-grid">
                                ${grouped[area].map(renderStreamCard).join('')}
                            </div>
                        </div>
                    `).join('')}
                <div class="stream-area">
                    <div class="stream-area-title">Bricks Not Part Of Any Stream</div>
                    ${showDescriptions ? '<div class="stream-group-copy">Implementation bricks currently not linked from any stream.</div>' : ''}
                    <div class="stream-pills">${unusedBricks.length ? unusedBricks.map(brick => renderBrickAuditItem(brick, [])).join('') : '<span class="activity-muted">Every brick is linked to at least one stream.</span>'}</div>
                </div>
                <div class="stream-area">
                    <div class="stream-area-title">Bricks In Two Or More Streams</div>
                    ${showDescriptions ? '<div class="stream-group-copy">Implementation bricks reused across multiple streams.</div>' : ''}
                    <div class="stream-pills">${reusedBricks.length ? reusedBricks.map(brick => renderBrickAuditItem(brick, brickUsage[brick.id] || [])).join('') : '<span class="activity-muted">No bricks are shared across two or more streams.</span>'}</div>
                </div>
            `;
        }

        function buildDataAssetUsage(assetId) {
            const producingBricks = [];
            const consumingBricks = [];

            getBrickCatalog().forEach(brick => {
                (brick.dataDependencies || []).forEach(dep => {
                    if (dep.assetId !== assetId) {
                        return;
                    }
                    const role = String(dep.role || '').toLowerCase();
                    if (['own', 'write', 'publish', 'replicate', 'delete'].includes(role)) {
                        producingBricks.push({
                            id: brick.id,
                            name: brick.name,
                            role: dep.role || '',
                            description: dep.description || ''
                        });
                    } else {
                        consumingBricks.push({
                            id: brick.id,
                            name: brick.name,
                            role: dep.role || '',
                            description: dep.description || ''
                        });
                    }
                });
            });

            return {producingBricks, consumingBricks};
        }

        function renderDataBrickPills(items, borderColor, actionIcon) {
            if (!items.length) {
                return '<span class="activity-muted">None linked.</span>';
            }

            return `
                <div class="stream-pills">
                    ${items.map(item => {
                        const linkedBrick = getBrickCatalog().find(candidate => candidate.id === item.id) || {};
                        const pillColor = colorOf(linkedBrick.type);
                        return `
                        <a class="stream-pill" style="background-color: ${pillColor}; border: 3px solid ${borderColor};" target="_blank" href="landing_pages/${item.id}.html" title="${escapeHtml(item.description || item.role || '')}">
                            <img src="icons/${actionIcon}.png" alt="" onerror="this.onerror=null;this.src='icons/brick.png'">
                            <img src="icons/${item.id}.png" alt="" onerror="this.onerror=null;this.src='icons/brick.png'">
                            <span>${item.name}</span>
                        </a>
                    `;
                    }).join('')}
                </div>
            `;
        }

        function flattenDataAssetGroups(groups) {
            let assets = [];
            (groups || []).forEach(group => {
                assets = assets.concat(group.assets || []);
                assets = assets.concat(flattenDataAssetGroups(group.subGroups || []));
            });
            return assets;
        }

        function renderDataView() {
            const container = document.getElementById('DataContent');
            if (!container) {
                return;
            }

            const assetGroups = dataAssetsPayload.rootGroups || [];
            const assets = dataAssetsPayload.assets || flattenDataAssetGroups(assetGroups);
            const stores = dataAssetsPayload.stores || [];
            const totalStoreRefs = assets.reduce((sum, asset) => sum + ((asset.stores || []).length), 0);
            const governedAssets = assets.filter(asset => String(asset.personalDataLevel || 'none').toLowerCase() !== 'none' || String(asset.classification || '').toLowerCase() === 'restricted').length;

            function storeById(storeId) {
                return stores.find(item => item.id === storeId) || {};
            }

            function renderStoreList(asset) {
                if (!(asset.stores || []).length) {
                    return '<div class="activity-muted">No stores linked.</div>';
                }
                return `
                    <ul class="data-store-list">
                        ${(asset.stores || []).map(link => {
                            const store = storeById(link.storeId);
                            const parts = [store.name || link.storeId, link.role].filter(Boolean);
                            return `<li>${escapeHtml(parts.join(' | '))}</li>`;
                        }).join('')}
                    </ul>
                `;
            }

            function renderMetaList(asset) {
                const items = [
                    asset.kind ? 'Kind: ' + asset.kind : '',
                    asset.classification ? 'Classification: ' + asset.classification : '',
                    asset.personalDataLevel ? 'Personal data: ' + asset.personalDataLevel : '',
                    asset.ownerTeamId ? 'Owner team: ' + asset.ownerTeamId : '',
                    asset.systemOfRecordBrickId ? 'System of record: ' + asset.systemOfRecordBrickId : ''
                ].filter(Boolean);
                if (!items.length) {
                    return '<div class="activity-muted">No governance metadata listed.</div>';
                }
                return `<ul class="data-meta-list">${items.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>`;
            }

            function renderAssetCard(asset) {
                let detailMarkup = '';
                if (dataShowDetail) {
                    detailMarkup = `
                        <div class="data-card-subtitle">Metadata</div>
                        ${renderMetaList(asset)}
                        <div class="data-card-subtitle">Stores</div>
                        ${renderStoreList(asset)}
                    `;
                }
                let brickMarkup = '';
                if (dataShowBricks) {
                    const usage = buildDataAssetUsage(asset.id);
                    brickMarkup = `
                        <div class="data-card-subtitle">Producing Bricks</div>
                        ${renderDataBrickPills(usage.producingBricks, 'crimson', 'write-data')}
                        <div class="data-card-subtitle">Consuming Bricks</div>
                        ${renderDataBrickPills(usage.consumingBricks, 'blue', 'read-data')}
                    `;
                }
                return `
                    <div class="data-card">
                        <a class="data-card-head" target="_blank" rel="noopener noreferrer" href="data_pages/${escapeHtml(asset.id)}.html" style="text-decoration:none;color:inherit;">
                            <img class="data-card-icon" src="icons/data.png" alt="" onerror="this.onerror=null;this.src='icons/brick.png'">
                            <div class="data-card-title">${escapeHtml(asset.name || asset.id)}</div>
                        </a>
                        ${asset.description ? `<div class="data-card-copy">${escapeHtml(asset.description)}</div>` : ''}
                        ${detailMarkup}
                        ${brickMarkup}
                    </div>
                `;
            }

            function renderAssetGroup(group, depth = 0) {
                const directAssets = group.assets || [];
                const childGroups = group.subGroups || [];
                const totalAssets = flattenDataAssetGroups([group]).length;
                const directAssetMarkup = directAssets.length
                    ? `<div class="data-grid">${directAssets.map(renderAssetCard).join('')}</div>`
                    : '';
                const childMarkup = childGroups.map(child => renderAssetGroup(child, depth + 1)).join('');
                return `
                    <section class="data-group data-group-depth-${depth}">
                        <div class="data-group-header">
                            <div class="data-group-title">${escapeHtml(group.name || 'Data Assets')}</div>
                            <div class="data-group-count">${totalAssets} ${totalAssets === 1 ? 'asset' : 'assets'}</div>
                        </div>
                        ${group.description ? `<div class="data-group-description">${escapeHtml(group.description)}</div>` : ''}
                        ${directAssetMarkup}
                        ${childMarkup}
                    </section>
                `;
            }

            const assetMarkup = assetGroups.length
                ? assetGroups.map(group => renderAssetGroup(group)).join('')
                : `<div class="data-grid">${assets.map(renderAssetCard).join('')}</div>`;

            container.innerHTML = `
                <div class="data-options">
                    <label class="data-option"><input type="checkbox" id="dataShowDetailToggle" ${dataShowDetail ? 'checked' : ''} onchange="setDataShowDetail(this.checked)"> Show detail</label>
                    <label class="data-option"><input type="checkbox" id="dataShowBricksToggle" ${dataShowBricks ? 'checked' : ''} onchange="setDataShowBricks(this.checked)"> Show bricks</label>
                </div>
                <div class="data-summary">
                    <div class="dependency-graph-stat">
                        <div class="dependency-graph-stat-value">${assets.length}</div>
                        <div class="dependency-graph-stat-label">Assets</div>
                    </div>
                    <div class="dependency-graph-stat">
                        <div class="dependency-graph-stat-value">${stores.length}</div>
                        <div class="dependency-graph-stat-label">Stores</div>
                    </div>
                    <div class="dependency-graph-stat">
                        <div class="dependency-graph-stat-value">${totalStoreRefs}</div>
                        <div class="dependency-graph-stat-label">Store Links</div>
                    </div>
                    <div class="dependency-graph-stat">

                        <div class="dependency-graph-stat-label">Governed Assets</div>
                    </div>

                ${assets.length ? assetMarkup : '<div class="activity-muted">No data assets are defined for this domain yet.</div>'}

        function setDataShowBricks(show) {
            dataShowBricks = show;
            renderDataView();
        }

        function setDataShowDetail(show) {
            dataShowDetail = show;

        }

        function sortByDisplayName(left, right) {
            return (left.name || left.id || '').localeCompare(right.name || right.id || '');
        }

        function getAllDataAssets() {
            const assetGroups = dataAssetsPayload.rootGroups || [];
            return dataAssetsPayload.assets || flattenDataAssetGroups(assetGroups);
        }

        function getDeclaredDependencyCatalog() {
            const streams = getStreamCatalogItems().slice().sort(sortByDisplayName);
            const bricks = getBrickCatalog().slice().sort(sortByDisplayName);
            const dependencyTypes = new Set();
            bricks.forEach(brick => {
                (brick.brickDependencies || []).forEach(dep => {
                    if (dep.targetBrickId) {
                        dependencyTypes.add(dep.type || 'unspecified');
                    }
                });
            });
            return {
                streams,
                bricks,
                dependencyTypes: Array.from(dependencyTypes).sort((left, right) => left.localeCompare(right))
            };
        }

        function getDataDependencyCatalog() {
            const assetLookup = {};
            getAllDataAssets().forEach(asset => {
                if (asset.id) {
                    assetLookup[asset.id] = asset;
                }
            });

            const referencedAssetIds = new Set();
            const bricks = getBrickCatalog().filter(brick => {
                const dependencies = brick.dataDependencies || [];
                dependencies.forEach(dep => {
                    if (dep.assetId) {
                        referencedAssetIds.add(dep.assetId);
                    }
                });
                return dependencies.some(dep => dep.assetId);
            }).sort(sortByDisplayName);

            const assets = Array.from(referencedAssetIds).map(assetId => {
                return assetLookup[assetId] || {
                    id: assetId,
                    name: assetId,
                    kind: 'unlisted'
                };
            }).sort(sortByDisplayName);

            return {bricks, assets};
        }

        function getStreamDependencyCatalog() {
            const streams = getStreamCatalogItems().slice().sort(sortByDisplayName);
            const referencedBrickIds = new Set();
            streams.forEach(stream => {
                (stream.brickDependencies || []).forEach(dep => {
                    if (dep.targetBrickId) {
                        referencedBrickIds.add(dep.targetBrickId);
                    }
                });
            });
            const bricks = getBrickCatalog()
                .filter(brick => referencedBrickIds.has(brick.id))
                .sort(sortByDisplayName);
            return {streams, bricks};
        }

        function readDependencyControlState() {
