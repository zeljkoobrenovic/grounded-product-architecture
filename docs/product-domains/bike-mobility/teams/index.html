<script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        document.getElementById('tab_' + resolvedTabName).className += ' active';
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

        if (groups.length) {
            html += '<div class="link-row">' +
                groups.join('<span class="link-sep">&middot;</span>') + '</div>';
        }
        html += '</a>';
        return html;
    }

    function renderLinkIconGroup(label, items, iconBase, defaultIcon, shape) {
        if (!items || !items.length) {
            return '';
        }
        const fallback = iconBase + defaultIcon;
        let icons = '';
        items.forEach(item => {
            const src = item.icon ? iconBase + item.icon : fallback;
            const cls = 'link-icon' + (shape === 'round' ? ' round' : '');
            const title = label + ': ' + (item.name || '');
            icons += '<img class="' + cls + '" src="' + escapeHtml(src) + '" alt="" title="' + escapeHtml(title) + '" ' +
                'onerror="this.onerror=null;this.src=\'' + fallback + '\'">';
        });
        return '<span class="link-group">' + icons + '</span>';
    }

    let searchQuery = '';

    function teamMatchesQuery(team, query) {
        if (!query) return true;
        const haystack = [
            team.name,
            team.description,
            typeNameMap[team.type] || team.type,
            team.groupName
        ].filter(Boolean).join(' ').toLowerCase();
        return query.split(/\s+/).filter(Boolean).every(word => haystack.indexOf(word) !== -1);
    }

    // Returns { html, teams, headcount } for a group, keeping only teams that match
    // the query (and groups that still contain a match anywhere in their subtree).
    function renderGroup(group, nested, query) {
        const matchedTeams = (group.teams || []).filter(team => teamMatchesQuery(team, query));
        const childResults = (group.groups || []).map(child => renderGroup(child, true, query)).filter(Boolean);

        if (query && !matchedTeams.length && !childResults.length) {
            return null;
        }

        const teamCount = matchedTeams.length + childResults.reduce((sum, child) => sum + child.teams, 0);
        const headcount = matchedTeams.reduce((sum, team) => sum + ((team.teamHeadcount || {}).headcount || 0), 0)
            + childResults.reduce((sum, child) => sum + child.headcount, 0);

        let html = '<div class="group' + (nested ? ' nested' : '') + '">';
        html += '<div class="group-head">';
        html += '<span class="group-name">' + escapeHtml(group.name || group.id) + '</span>';
        html += '<span class="group-hc">' + formatNumber(group.rollupHeadcount || 0) + ' FTE total</span>';
        html += '</div>';
        if (group.mission) {
            html += '<div class="group-mission">' + escapeHtml(group.mission) + '</div>';
        }
        const direct = group.groupDirectHeadcount || {};
        if (direct.headcount && !query) {
            html += '<div class="group-direct">' +
                '<div class="group-direct-text">Group leadership &amp; support: <strong>' + escapeHtml(String(direct.headcount)) + ' FTE</strong>' +
                (direct.description ? ' &mdash; ' + escapeHtml(direct.description) : '') + '</div>' +
                renderHeadcountDots(direct.headcount, '#94a3b8', false) +
                '</div>';
        }
        if (matchedTeams.length) {
            html += '<div class="team-grid">';
            matchedTeams.forEach(team => { html += renderTeamCard(team); });
            html += '</div>';
        }
        childResults.forEach(child => { html += child.html; });
        html += '</div>';
        return {html: html, teams: teamCount, headcount: headcount};
    }

    function renderHierarchy() {
        const query = searchQuery;
        const results = (teamsData.groups || []).map(group => renderGroup(group, false, query)).filter(Boolean);
        let html = '<div class="hierarchy">';
        if (!results.length) {
            html += '<div class="dependency-empty">No teams match &ldquo;' + escapeHtml(query) + '&rdquo;.</div>';
        } else {
            results.forEach(result => { html += result.html; });
        }
        html += '</div>';
        document.getElementById('Hierarchy').innerHTML = html;

        const visibleTeams = results.reduce((sum, result) => sum + result.teams, 0);
        const visibleHeadcount = results.reduce((sum, result) => sum + result.headcount, 0);
        renderSearchSummary(visibleTeams, visibleHeadcount);
    }

    function renderSearchSummary(visibleTeams, visibleHeadcount) {
        const el = document.getElementById('SearchSummary');
        if (searchQuery) {
            el.innerHTML = 'showing ' +
                '<strong>' + formatNumber(visibleTeams) + '</strong> of ' + formatNumber(flatTeams.length) + ' teams' +
                ' &middot; <strong>' + formatNumber(visibleHeadcount) + '</strong> FTE';
        } else {
            el.innerHTML = 'showing all <strong>' + formatNumber(flatTeams.length) + '</strong> teams &middot; <strong>' + formatNumber(totalHeadcount) + '</strong> FTE total';
        }
    }

    function onTeamSearch(value) {
        searchQuery = String(value || '').trim().toLowerCase();
        document.getElementById('TeamSearchClear').hidden = !searchQuery;
        renderHierarchy();
    }

    function clearTeamSearch() {
        const input = document.getElementById('TeamSearch');
        input.value = '';
        onTeamSearch('');
        input.focus();
    }

    document.getElementById('TeamSearch').addEventListener('input', event => onTeamSearch(event.target.value));

    renderTypeLegend();
    renderHierarchy();

    /* ---------- Dependencies tab ---------- */
    let dependenciesInitialized = false;

    mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        flowchart: {htmlLabels: false}
    });

    window.afterOpenTab = function (tabName) {
        if (tabName === 'dependencies') {
            renderDependenciesView();
        }
    };

    function sanitizeMermaidId(value) {
        return String(value || 'team').replace(/[^a-zA-Z0-9_]/g, '_').replace(/_+/g, '_');
    }

    function escapeMermaidLabel(value) {
        return String(value || '')
            .replaceAll('&', 'and').replaceAll('"', '').replaceAll("'", '')
            .replaceAll('<', '').replaceAll('>', '')
            .replaceAll('[', '(').replaceAll(']', ')')
            .replaceAll('{', '(').replaceAll('}', ')').replaceAll('|', '/');
    }

    const teamNameMap = {};
    flatTeams.forEach(team => { teamNameMap[team.id] = team.name || team.id; });

    function buildEdges() {
        const edges = [];
        flatTeams.forEach(team => {
            (team.otherTeamDependencies || []).forEach(dependency => {
                if (!teamNameMap[dependency.teamId]) return;
                edges.push({
                    source: team.id,
                    target: dependency.teamId,
                    type: dependency.dependencyType || 'other',
                    typeLabel: dependency.dependencyTypeName || dependency.dependencyType || 'depends on'
                });
            });
        });
        return edges;
    }

    function teamCatalog() {
        return flatTeams.slice().sort((left, right) => (left.name || '').localeCompare(right.name || ''));
    }

    function renderChecklistItems(items, kind) {
        if (!items.length) {
            return '<div class="dependency-empty">No items available.</div>';
        }
        return items.map(item => {
            const meta = kind === 'team' ? [item.groupName || '', typeNameMap[item.type] || item.type || ''].filter(Boolean).join(' | ') : (item.description || '');
            const swatchColor = kind === 'team' ? typeColor(item.type) : (dependencyTypeColorMap[item.id] || '#9ca3af');
            return '<label class="dependency-check-item">' +
                '<input type="checkbox" class="dependency-' + kind + '-checkbox" value="' + escapeHtml(item.id) + '" checked onchange="renderDependenciesView()">' +
                '<span class="dependency-swatch" style="background-color:' + swatchColor + '"></span>' +
                '<span><span>' + escapeHtml(item.name) + '</span>' +
                (meta ? '<span class="dependency-check-meta">' + escapeHtml(meta) + '</span>' : '') +
                '</span></label>';
        }).join('');
    }

    function setAllCheckboxes(selector, checked) {
        document.querySelectorAll(selector).forEach(input => { input.checked = checked; });
        renderDependenciesView();
    }

    function selectedValues(selector) {
        return new Set(Array.from(document.querySelectorAll(selector)).filter(input => input.checked).map(input => input.value));
    }

    function renderDependenciesControls() {
        const teams = teamCatalog();
        const types = dependencyTypes.map(type => ({id: type.id, name: type.name || type.id, description: type.description || ''}));
        return '<div class="dependency-controls">' +
            '<div class="dependency-control-group">' +
            '<div class="dependency-control-title">Teams</div>' +
            '<div class="dependency-actions">' +
            '<button class="dependency-action" type="button" onclick="setAllCheckboxes(\'.dependency-team-checkbox\', true)">Show all</button>' +
            '<button class="dependency-action" type="button" onclick="setAllCheckboxes(\'.dependency-team-checkbox\', false)">Hide all</button>' +
            '</div><div class="dependency-checklist">' +
            renderChecklistItems(teams, 'team') +
            '</div></div>' +
            '<div class="dependency-control-group">' +
            '<div class="dependency-control-title">Dependency Types</div>' +
            '<div class="dependency-checklist">' +
            renderChecklistItems(types, 'type') +
            '</div></div>' +
            '<div id="DependenciesSummary" class="dependency-summary"></div>' +
            '</div>';
    }

    let dependencyView = 'force';
    let forceGraphInstance = null;
    let forceShowLabels = false;

    function setDependencyView(view) {
        dependencyView = view;
        document.querySelectorAll('.view-toggle-btn').forEach(button => {
            button.classList.toggle('active', button.getAttribute('data-view') === view);
        });
        const labelToggle = document.getElementById('ForceLabelToggle');
        if (labelToggle) {
            labelToggle.hidden = view !== 'force';
        }
        renderDependenciesView();
    }

    function setForceLabels(show) {
        forceShowLabels = show;
        if (forceGraphInstance && dependencyView === 'force') {
            // trigger a redraw so nodeCanvasObject re-evaluates the flag
            forceGraphInstance.nodeCanvasObjectMode(() => 'after');
        }
    }

    function renderDependenciesView() {
        const container = document.getElementById('DependenciesContent');
        if (!container) return;

        if (!dependenciesInitialized) {
            container.innerHTML = '<div class="dependencies-layout">' +
                renderDependenciesControls() +
                '<div class="dependency-view">' +
                '<div class="view-toggle">' +
                '<button type="button" class="view-toggle-btn active" data-view="force" onclick="setDependencyView(\'force\')">2D force graph</button>' +
                '<button type="button" class="view-toggle-btn" data-view="mermaid" onclick="setDependencyView(\'mermaid\')">Flow diagram</button>' +
                '<label id="ForceLabelToggle" class="force-label-toggle"><input type="checkbox" onchange="setForceLabels(this.checked)"> Show labels</label>' +
                '</div>' +
                '<div id="DependenciesGraph" class="dependency-graph"></div>' +
                '</div></div>';
            dependenciesInitialized = true;
        }

        const selectedTeamIds = selectedValues('.dependency-team-checkbox');
        const selectedTypeIds = selectedValues('.dependency-type-checkbox');
        const edges = buildEdges().filter(edge =>
            selectedTeamIds.has(edge.source) && selectedTeamIds.has(edge.target) && selectedTypeIds.has(edge.type));
        const visibleTeamIds = new Set();
        edges.forEach(edge => { visibleTeamIds.add(edge.source); visibleTeamIds.add(edge.target); });

        document.getElementById('DependenciesSummary').innerHTML =
            'Showing <strong>' + formatNumber(visibleTeamIds.size) + '</strong> connected teams &middot; ' +
            '<strong>' + formatNumber(edges.length) + '</strong> dependencies &middot; ' +
            '<strong>' + formatNumber(selectedTypeIds.size) + '</strong> of ' + formatNumber(dependencyTypes.length) + ' types active.';

        const graphContainer = document.getElementById('DependenciesGraph');
        forceGraphInstance = null;
        graphContainer.classList.toggle('force', dependencyView === 'force');

        if (!edges.length) {
            graphContainer.innerHTML = '<div class="dependency-empty">Select at least two connected teams and one dependency type.</div>';
            return;
        }

        if (dependencyView === 'force') {
            renderForceGraph(graphContainer, edges, visibleTeamIds);
        } else {
            renderMermaidGraph(graphContainer, edges, visibleTeamIds);
        }
    }

    function renderMermaidGraph(graphContainer, edges, visibleTeamIds) {
        let diagram = 'flowchart LR\n';
        visibleTeamIds.forEach(teamId => {
            const team = flatTeams.find(candidate => candidate.id === teamId) || {};
            const color = typeColor(team.type);
            const id = sanitizeMermaidId(teamId);
            diagram += id + '["' + escapeMermaidLabel(teamNameMap[teamId] || teamId) + '"]\n';
            diagram += 'style ' + id + ' fill:#ffffff,stroke:' + color + ',stroke-width:2px\n';
        });
        edges.forEach((edge, index) => {
            const sourceId = sanitizeMermaidId(edge.source);
            const targetId = sanitizeMermaidId(edge.target);
            diagram += sourceId + ' -->|' + escapeMermaidLabel(edge.typeLabel) + '| ' + targetId + '\n';
            const linkColor = dependencyTypeColorMap[edge.type] || '#6b7280';
            diagram += 'linkStyle ' + index + ' stroke:' + linkColor + ',stroke-width:1.5px\n';
        });

        const graphId = 'teams-dependency-graph';
        graphContainer.innerHTML = '<div class="mermaid" id="' + graphId + '">' + diagram + '</div>';
        mermaid.run({querySelector: '#' + graphId});
    }

    function renderForceGraph(graphContainer, edges, visibleTeamIds) {
        if (typeof ForceGraph === 'undefined') {
            graphContainer.innerHTML = '<div class="dependency-empty">Force graph library failed to load.</div>';
            return;
        }
        graphContainer.innerHTML = '';

        // Node size scales with the number of dependency links touching the team.
        const degree = {};
        edges.forEach(edge => {
            degree[edge.source] = (degree[edge.source] || 0) + 1;
            degree[edge.target] = (degree[edge.target] || 0) + 1;
        });
        const nodes = Array.from(visibleTeamIds).map(teamId => {
            const team = flatTeams.find(candidate => candidate.id === teamId) || {};
            return {id: teamId, name: teamNameMap[teamId] || teamId, type: team.type || '', val: (degree[teamId] || 1)};
        });
        const links = edges.map(edge => ({source: edge.source, target: edge.target, type: edge.type, typeLabel: edge.typeLabel}));

        const Graph = ForceGraph()(graphContainer)
            .nodeRelSize(5)
            .nodeVal(() => 1)
            .nodeLabel(node => escapeHtml(node.name))
            .nodeColor(node => withAlpha(typeColor(node.type), 0.65))
            .nodeCanvasObjectMode(() => 'after')
            .nodeCanvasObject((node, ctx, globalScale) => {
                if (!forceShowLabels) return;
                const label = node.name;
                const fontSize = 12 / globalScale;
                ctx.font = fontSize + 'px Ubuntu, Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillStyle = '#374151';
                ctx.fillText(label, node.x, node.y + 7);
            })
            .linkColor(link => dependencyTypeColorMap[link.type] || '#9ca3af')
            .linkWidth(1.5)
            .linkDirectionalArrowLength(4)
            .linkDirectionalArrowRelPos(1)
            .linkDirectionalParticles(1)
            .linkDirectionalParticleSpeed(0.006)
            .linkLabel(link => escapeHtml(link.typeLabel || link.type))
            .onNodeClick(node => { window.open('landing_pages/' + node.id + '.html', '_blank'); })
            .graphData({nodes: nodes, links: links});

        forceGraphInstance = Graph;
        sizeForceGraph();
    }

    function sizeForceGraph() {
        if (!forceGraphInstance) return;
        const container = document.getElementById('DependenciesGraph');
        if (!container) return;
        const w = container.clientWidth || container.offsetWidth;
        const h = container.clientHeight || container.offsetHeight;
        if (w > 0 && h > 0) {
            forceGraphInstance.width(w).height(h);
            if (typeof forceGraphInstance.d3ReheatSimulation === 'function') {
                forceGraphInstance.d3ReheatSimulation();
            }
        }
    }

    window.addEventListener('resize', sizeForceGraph);
</script>
<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../start/index.html",
      "label": "Bike Mobility Home"
    },
    {
      "label": "Teams"
    }
  ]
};
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
