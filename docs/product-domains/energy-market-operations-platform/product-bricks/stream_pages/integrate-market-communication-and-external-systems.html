    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

"Data migrations for existing periods are scripted and rehearsed."], "painPoints": ["Processing updated in one module but not another produces inconsistent volumes.", "Historical data not migrated breaks comparisons across the change date."], "dependencies": [{"type": "brick", "id": "allo", "name": "Allocation and Reconciliation", "description": "Allocation and reconciliation volumes per connection and interval under Allocation 2.0.", "how": "Adapts allocation and reconciliation processing."}, {"type": "brick", "id": "fcst", "name": "Portfolio Forecasting", "description": "Day-ahead, intraday and ex-post forecasting for all EAN types including BSP and flex assets.", "how": "Adapts forecasting resolution and inputs."}, {"type": "brick", "id": "nomi", "name": "Nominations and Position Management", "description": "Nominations, re-nominations and position management for electricity and gas.", "how": "Adapts nomination granularity and interfaces."}]}, {"id": "test-against-market-test-environments", "title": "Test against the market's test environments", "actor": "BRP and Balancing Operator", "keyFacts": ["Updated connectors and processing are tested against EDSN, TenneT and exchange test environments with representative tenants.", "Test evidence is stored for the release decision and for regulators."], "painPoints": ["Testing only in production discovers the format error on the effective date.", "Test windows offered by market parties missed because the change was not ready."], "dependencies": [{"type": "brick", "id": "mcom", "name": "Dutch Market Messaging Hub", "description": "EDSN message flows, central connection register and TenneT MMC-Hub exchange.", "how": "Runs the test exchanges."}, {"type": "brick", "id": "wflw", "name": "Workflow, Exceptions and Notifications", "description": "Exception queues, approvals, tasks and notifications.", "how": "Tracks test cases, defects and evidence."}]}, {"id": "release-to-all-tenants-and-monitor", "title": "Release to all tenants and monitor", "actor": "Energy Company Director", "keyFacts": ["The change is released to every tenant on schedule and message and processing health is monitored per tenant after the effective date.", "Regulatory compliance incident rate is reported per change."], "painPoints": ["Staggered tenant releases leave some tenants non-compliant on the effective date.", "Monitoring without per-tenant views hides a single broken connection."], "dependencies": [{"type": "brick", "id": "iden", "name": "Identity, Tenants and Brand Isolation", "description": "Multi-tenant identity, roles and brand isolation.", "how": "Applies the release across tenants."}, {"type": "brick", "id": "dash", "name": "Operational Dashboards and Analytics", "description": "Operational and 15-minute financial insight per segment.", "how": "Monitors message and processing health per tenant."}, {"type": "brick", "id": "wflw", "name": "Workflow, Exceptions and Notifications", "description": "Exception queues, approvals, tasks and notifications.", "how": "Routes post-release exceptions."}]}]}, {"id": "connect-an-erp-and-payment-provider-via-the-open-api", "title": "Connect an ERP and Payment Provider via the Open API", "description": "The Billing and Operations Manager (bilo) connects a supplier's ERP and payment provider through the open API, maps postings and payment status, tests end to end and monitors exceptions.", "primaryActor": "Billing and Operations Manager", "trigger": "A supplier wants invoices posted to its ERP and SEPA direct debits executed through its bank or payment provider.", "successSignal": "Postings, direct debits and payment status flow both ways with reconciled totals and exceptions handled in the workflow.", "steps": [{"id": "register-integration-and-credentials", "title": "Register the integration and credentials", "actor": "Billing and Operations Manager", "keyFacts": ["The integration is registered per tenant with credentials, scopes, endpoints and the owner responsible for it.", "Credentials are isolated per tenant and rotated per policy."], "painPoints": ["Shared credentials across tenants are a data-isolation breach waiting to happen.", "Integrations without an owner are nobody's problem when they fail."], "dependencies": [{"type": "brick", "id": "apip", "name": "Open API and Integration Connectors", "description": "Open API and connectors to ERP, payment, meter-data and market systems.", "how": "Registers the integration and manages credentials."}, {"type": "brick", "id": "iden", "name": "Identity, Tenants and Brand Isolation", "description": "Multi-tenant identity, roles and brand isolation.", "how": "Scopes the integration to the tenant and roles."}]}, {"id": "map-invoices-and-ledger-postings", "title": "Map invoices and ledger postings", "actor": "Billing and Operations Manager", "keyFacts": ["Invoice lines are mapped to ledger accounts, cost centres and VAT codes per tenant; the mapping is versioned and testable.", "Split invoices and corrections map to their own posting patterns."], "painPoints": ["Mappings kept in the ERP consultant's notes are lost at hand-over.", "Corrections posted as new invoices distort revenue."], "dependencies": [{"type": "brick", "id": "apip", "name": "Open API and Integration Connectors", "description": "Open API and connectors to ERP, payment, meter-data and market systems.", "how": "Holds and applies the posting mapping."}, {"type": "brick", "id": "bill", "name": "Billing Runs and Invoicing", "description": "Periodic, annual and final billing runs with VAT, guarantees of origin and split invoicing.", "how": "Supplies invoice lines and correction types."}]}, {"id": "connect-sepa-direct-debit-and-payment-status", "title": "Connect SEPA direct debit and payment status", "actor": "Billing and Operations Manager", "keyFacts": ["pain.008 direct-debit batches, pain.002 rejections and camt.053 statements are exchanged with the bank or payment provider through the connector.", "Payment status updates the customer's balance and the portal automatically."], "painPoints": ["Bank files handled by hand are late and error-prone.", "Payment status not fed back leaves the portal showing paid invoices as open."], "dependencies": [{"type": "brick", "id": "apip", "name": "Open API and Integration Connectors", "description": "Open API and connectors to ERP, payment, meter-data and market systems.", "how": "Runs the bank and payment-provider connector."}, {"type": "brick", "id": "paym", "name": "Payments, Direct Debit and Debtor Management", "description": "SEPA direct debit, payment matching, payment plans and dunning.", "how": "Generates batches and consumes status and statements."}]}, {"id": "run-end-to-end-reconciliation-test", "title": "Run an end-to-end reconciliation test", "actor": "Billing and Operations Manager", "keyFacts": ["A test period is run from invoice to posting to direct debit to matched cash, and the totals are reconciled between platform and ERP.", "Deviations are explained before the integration goes live."], "painPoints": ["Integrations tested message by message fail on the end-to-end totals.", "Go-live without reconciliation finds the mapping error at month-end."], "dependencies": [{"type": "brick", "id": "paym", "name": "Payments, Direct Debit and Debtor Management", "description": "SEPA direct debit, payment matching, payment plans and dunning.", "how": "Provides the payment and cash side of the test."}, {"type": "brick", "id": "recn", "name": "Billing Reconciliation and Corrections", "description": "Billed-versus-allocated reconciliation, corrections and exception handling.", "how": "Reconciles totals between platform and ERP."}, {"type": "brick", "id": "wflw", "name": "Workflow, Exceptions and Notifications", "description": "Exception queues, approvals, tasks and notifications.", "how": "Tracks test deviations to closure."}]}, {"id": "monitor-and-handle-exceptions", "title": "Monitor and handle integration exceptions", "actor": "Billing and Operations Manager", "keyFacts": ["Delivery, format and business exceptions from every integration land in the workflow with retry and escalation rules; delivery health is shown per integration.", "Silent failures are treated as incidents because a missed posting or file is a financial error."], "painPoints": ["Exceptions logged only in technical monitoring never reach the people who can fix the data.", "Retries without idempotency post the same invoice twice."], "dependencies": [{"type": "brick", "id": "wflw", "name": "Workflow, Exceptions and Notifications", "description": "Exception queues, approvals, tasks and notifications.", "how": "Queues and escalates integration exceptions."}, {"type": "brick", "id": "dash", "name": "Operational Dashboards and Analytics", "description": "Operational and 15-minute financial insight per segment.", "how": "Shows delivery health per integration."}]}]}], "outcomes": ["Every market message (EDSN, C-AR, MMC-Hub, TenneT, ETPA, OMIE, REE/SIPS) is processed by a maintained connector, so a market change ships to all tenants once", "ERP, accounting, payment and meter-data providers are integrated through the open API with monitored delivery", "Regulatory changes such as Allocation 2.0 and the 15-minute day-ahead market land on schedule across every tenant", "Integration failures surface as workflow exceptions with retry, not as silent data loss"], "brickDependencies": [{"targetBrickId": "apip", "type": "composition"}, {"targetBrickId": "mcom", "type": "composition"}, {"targetBrickId": "imcm", "type": "composition"}, {"targetBrickId": "wflw", "type": "composition"}, {"targetBrickId": "iden", "type": "composition"}, {"targetBrickId": "regs", "type": "composition"}, {"targetBrickId": "dash", "type": "composition"}, {"targetBrickId": "migr", "type": "composition"}], "externalSystemsThisStreamDependsOn": [{"system": "EDSN Central Market Communication and Connection Register", "type": "market-operator", "interface": "EDSN message flows and the central co     function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function dedupe(items, keyFn) {
        const seen = new Set();
        const ordered = [];
        items.forEach(item => {
            const key = keyFn(item);
            if (seen.has(key)) {
                return;
            }
            seen.add(key);
            ordered.push(item);
        });
        return ordered;
    }

    function getFlows() {
        return currentStream.flows || [];

    function getFlowDependencies(flow) {
        const dependencyIndex = new Map();
        (flow.steps || []).forEach(step => {
            (step.dependencies || []).forEach(dependency => {
                if ((dependency.type || 'brick') !== 'brick') {
                    return;
                }
                const key = [dependency.type || 'dependency', dependency.id || dependency.name || 'unknown'].join('::');
                if (!dependencyIndex.has(key)) {
                    dependencyIndex.set(key, dependency);
                }
            });
        });
        return Array.from(dependencyIndex.values());
    }

    function getStepDependency(step, dependency) {
        return (step.dependencies || []).find(item => (item.type || '') === (dependency.type || '') && (item.id || '') === (dependency.id || '')) || null;
    }

    function getPrimaryActors() {
        const streamJobs = currentStream.supportedCustomerJobs || [];
        const allJobs = streamJobs.length ? streamJobs : supported_jobs;
        return dedupe(allJobs.map(item => item.customerName || item.customerGroup || '').filter(Boolean), item => item);
    }

    function summarizeFlow(flow) {
        const steps = flow.steps || [];
        const firstStep = steps[0] || {};
        const lastStep = steps[steps.length - 1] || {};
        return {
            actor: flow.primaryActor || firstStep.actor || '',
            trigger: flow.trigger || firstStep.trigger || '',
            result: flow.successSignal || flow.outcome || lastStep.successSignal || lastStep.output || ''
        };
    }

    function renderStepMeta(label, value) {
        if (!value) {
            return '';
        }
        return '<div class="flow-step-meta-item"><div class="flow-step-meta-label">' + escapeHtml(label) + '</div><div class="flow-step-copy">' + escapeHtml(value) + '</div></div>';
    }

    function flowDependencyIconFile(dependency) {
        const dependencyId = dependency.id || '';
        const linkedBrick = related_bricks.find(brick => brick.id === dependencyId) || all_bricks.find(brick => brick.id === dependencyId) || {};
        return dependency.icon || linkedBrick.icon || (dependencyId ? dependencyId + '.png' : 'brick.png');

    function renderFlowDependencyIcon(dependency, className) {
        return '<img class="' + escapeHtml(className) + '" src="../icons/' + escapeHtml(flowDependencyIconFile(dependency)) + '" alt="" onerror="this.onerror=null;this.src=\'../icons/brick.png\'">';
    }

    function renderStepDependencyPills(step) {
        const dependencies = step.dependencies || [];
        if (!dependencies.length) {
            return '<div class="muted">No step-specific dependencies listed.</div>';
        }

        return '<div class="flow-step-dependencies">' + dependencies.map(dep => {

        }).join('') + '</div>';
    }

    function simplifySupportCopy(value) {
        const text = String(value || '').trim();
        if (!text) {
            return '';
        }
        const simplified = text.replace(/^Supports .*? by helping users help /i, 'Facilitate ');
        return simplified;
    }

    }

    function renderFlows() {
        const flows = getFlows();
        const totalSteps = flows.reduce((count, flow) => count + ((flow.steps || []).length), 0);
        let html = '';

        document.getElementById('tab_flows').innerHTML = 'Flow Narratives (' + flows.length + ')';

        flows.forEach(flow => {
            const dependenciesInFlow = getFlowDependencies(flow);
            const summary = summarizeFlow(flow);
            html += '<div class="group">';
            html += '<div class="section-title">Flow</div>';
            html += '<div class="flow-title">' + escapeHtml(flow.title || flow.id) + '</div>';
            html += '<div class="flow-description">' + escapeHtml(flow.description || '') + '</div>';
            if (summary.actor || summary.trigger || summary.result) {
                html += '<div class="card" style="margin-bottom:16px;">';
                if (summary.actor) {
                    html += '<div class="card-copy"><strong>Primary actor:</strong> ' + escapeHtml(summary.actor) + '</div>';
                }
                if (summary.trigger) {
                    html += '<div class="card-copy"><strong>Trigger:</strong> ' + escapeHtml(summary.trigger) + '</div>';
                }
                if (summary.result) {
                    html += '<div class="card-copy"><strong>Success looks like:</strong> ' + escapeHtml(summary.result) + '</div>';
                }
                html += '</div>';
            }

            html += '<div class="section-title">Dependency Traceability</div>';
            html += '<div class="flow-matrix-wrap">';
            html += '<table class="flow-matrix">';
            html += '<thead>';
            html += '<tr><th class="flow-dependency-col"></th>';
            (flow.steps || []).forEach((step, index) => {
                html += '<th class="flow-step-col"><div class="flow-step-label">Step ' + (index + 1) + '</div><div class="card-title">' + escapeHtml(step.title || step.id) + '</div></th>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right">Key Facts</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkblue">';
                if ((step.keyFacts || []).length) {
                    html += '<ul class="flow-insight-list">' + step.keyFacts.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No key facts listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';

            html += '<tr class="flow-insight-row"><th style="text-align: right; color: darkred">Pain Points</th>';
            (flow.steps || []).forEach(step => {
                html += '<td style="color: darkred">';
                if ((step.painPoints || []).length) {
                    html += '<ul class="flow-insight-list">' + step.painPoints.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
                } else {
                    html += '<span class="muted">No pain points listed.</span>';
                }
                html += '</td>';
            });
            html += '</tr>';
            html += '</thead><tbody>';

            dependenciesInFlow.forEach(dependency => {
                const dependencyTypeLabel = 'Product Brick';
                html += '<tr>';
                html += '<td>';
                html += '<div class="flow-dependency-header">';
                html += renderFlowDependencyIcon(dependency, 'flow-dependency-icon');
                html += '<div>';
                html += '<a class="flow-dependency-name" href="../landing_pages/' + escapeHtml(dependency.id) + '.html">' + escapeHtml(dependency.name || dependency.id) + '</a>';
                if (dependency.interface) {
                    html += '<div class="muted">' + escapeHtml(dependency.interface) + '</div>';
                }
                html += '</div>';
                html += '</div>';
                html += '</td>';
                (flow.steps || []).forEach(step => {
                    const stepDependency = getStepDependency(step, dependency);
                    if (!stepDependency) {
                        html += '<td class="flow-cell-empty">-</td>';
                        return;
                    }
                    html += '<td class="flow-cell-active">';
                    html += '<div class="flow-cell-copy">' + escapeHtml(simplifySupportCopy(stepDependency.how || stepDependency.description || 'Supports this step.')) + '</div>';
                    html += '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            html += '</div>';
            html += '</div>';
        });

        document.getElementById('tab_content_flows').innerHTML = html;
    }

    function renderLinks() {
        // Grouped links from config: [{group, description, links: [{label, link,
        // description, embedLink?, embedHeight?}]}]. embedLink renders an iframe
        // (default height 400px) while the label still opens `link` directly.
        const groups = currentStream.links || [];
        let html = '<div class="page">';
        let count = 0;
        if (!groups.length) {
            html += '<div class="muted">No links are configured for this stream.</div>';
        }
        groups.forEach(group => {
            html += '<div class="links-group">';
            html += '<div class="links-group-title">' + escapeHtml(group.group || 'Links') + '</div>';
            if (group.description) {
                html += '<div class="links-group-description">' + escapeHtml(group.description) + '</div>';
            }
            (group.links || []).forEach(link => {
                count++;
                html += '<div class="link-entry">';
                html += '<a class="link-entry-title" target="_blank" rel="noopener noreferrer" href="' + escapeHtml(link.link || '#') + '">'
                    + escapeHtml(link.label || link.link || 'Reference') + ' &#8599;</a>';
                if (link.description) {
                    html += '<div class="link-entry-copy">' + escapeHtml(link.description) + '</div>';
                }
                if (link.embedLink) {
                    const embedHeight = Number(link.embedHeight) || 400;
                    html += '<iframe class="link-embed" loading="lazy" src="' + escapeHtml(link.embedLink)
                        + '" style="height: ' + embedHeight + 'px" title="' + escapeHtml(link.label || 'Embedded link') + '"></iframe>';
                }
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
        document.getElementById('tab_content_links').innerHTML = html;
        const linksTab = document.getElementById('tab_links');
        if (linksTab) {
            linksTab.textContent = 'Links (' + count + ')';
        }
    }

    renderHome();
    renderFlows();
    renderLinks();
</script>


<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Energy Market Operations Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Streams Index"
    },
    {
      "label": "Integrate Market Communication and External Systems"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
